<!doctype html>
<!-- Throwaway desktop concept. Three New thread arrangements, ?variant=A|B|C.
     Standalone preview because this checkout has no installed app dependencies.
     Acceptance: retain Figtree and quiet modal; explicit local/origin sources;
     no duplicate worktree choice; visible creation action; keyboard and Escape;
     compare dark/light at 1600x1000,1280x800,820x560. Mock data, no Git operations.
     A: direct choices (recommended). B: guided choice then options. C: summary editor.
-->
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New thread — prototype</title>
<style>
@font-face{font-family:Figtree;src:url('../assets/fonts/figtree-latin.woff2')}*{box-sizing:border-box} :root{--tt-bg:#17171d;--tt-surface:#32333f;--tt-field:#23232d;--tt-text:#f3f3f7;--tt-muted:#c3c4cd;--tt-border:#686a7b;--tt-accent:#86d6f1;--tt-selected:#384656;--tt-action:#f6f6fa;--tt-ink:#191923;color-scheme:dark}body.light{--tt-bg:#e8e9ee;--tt-surface:#fafaff;--tt-field:#f0f0f6;--tt-text:#24242e;--tt-muted:#555560;--tt-border:#777986;--tt-accent:#125a78;--tt-selected:#dceef5;--tt-action:#252530;--tt-ink:#fff;color-scheme:light}body{margin:0;background:var(--tt-bg);color:var(--tt-text);font:16px Figtree,system-ui;min-height:100vh;display:grid;place-items:center;padding:24px 24px 84px}button,input,select,summary{font:inherit}button,select,summary{cursor:pointer}button,input,select{color:var(--tt-text);background:var(--tt-field);border:1px solid var(--tt-border);border-radius:10px;padding:11px 14px}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--tt-accent);outline-offset:3px}button:hover{border-color:var(--tt-accent)}.dialog{width:min(680px,100%);max-height:calc(100vh - 112px);border:1px solid var(--tt-border);border-radius:22px;background:var(--tt-surface);overflow:hidden;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--tt-border)}h1{font-size:20px;margin:0;font-weight:600}header .close{margin-left:auto}.ghost{background:transparent;border-color:transparent}main{padding:20px 26px;overflow:auto}.project{display:flex;gap:15px;align-items:center;margin-bottom:22px}.project div{flex:1}small{display:block;color:var(--tt-muted);font-size:14px;margin-top:5px;overflow-wrap:anywhere}.label,label{display:block;color:var(--tt-muted);font-size:14px;margin:17px 0 8px}input,select{width:100%;margin-top:7px}fieldset{padding:0;border:0;margin:0}legend{color:var(--tt-muted);font-size:14px;margin-bottom:10px}.choices{display:flex;gap:9px}.choices button{flex:1;padding:13px 7px;font-size:15px}.selected{background:var(--tt-selected);border-color:var(--tt-accent)}p{color:var(--tt-muted);font-size:14px;line-height:1.5;margin:12px 0}.row{display:flex;gap:14px}.row label{flex:1}.row button{margin-top:16px}details{margin-top:18px}summary{color:var(--tt-muted);font-size:14px;padding:5px 0}footer{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 26px;border-top:1px solid var(--tt-border)}footer small{margin:0}.primary{background:var(--tt-action);color:var(--tt-ink);border:0;font-weight:600;white-space:nowrap}.switcher{position:fixed;bottom:17px;display:flex;gap:9px;align-items:center;background:var(--tt-field);border:1px solid var(--tt-border);padding:7px;border-radius:15px}.switcher span{min-width:220px;text-align:center;font-size:14px}.stack{display:grid;gap:12px}.stack button{text-align:left;padding:17px}.stack strong{display:block;font-weight:500}.summary-row{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--tt-border)}.summary-row strong{font-weight:500}.summary-row:last-child{border:0}.status{color:var(--tt-accent)}[hidden]{display:none!important}@media(max-height:650px){body{padding-top:12px;padding-bottom:70px}.dialog{max-height:calc(100vh - 88px)}main{padding:12px 24px}.project{margin-bottom:14px}footer{padding:12px 24px}}@media(prefers-reduced-motion:no-preference){main{animation:arrive .15s ease-out}@keyframes arrive{from{opacity:.6;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>
<section class="dialog" role="dialog" aria-labelledby="heading"><header><button class="ghost" id="back" aria-label="Back to working copy choices">←</button><h1 id="heading">New thread</h1><button class="ghost close" id="close" aria-label="Close preview">×</button></header><main id="content"></main><footer><small id="state"></small><button class="primary" id="create">Create thread →</button></footer></section>
<nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="Previous variant">←</button><span id="variant"></span><button id="next" aria-label="Next variant">→</button><button id="theme">Light</button></nav>
<script>
const names={A:'Direct choices',B:'Guided setup',C:'Summary first'};let variant=new URLSearchParams(location.search).get('variant')||'A';if(!names[variant])variant='A';let mode='shared',step=0,expanded=false,base='origin/feat/devin-local-provider',created=false;
const project='<div class="project"><span aria-hidden="true">▱</span><div><strong>Talk to Text Application</strong><small>D:\\Talk to Text Application</small></div></div>';
const source=()=>mode==='new'?`<label>Start from<select id="source"><optgroup label="Fetch from origin"><option>origin/feat/devin-local-provider</option><option>origin/main</option></optgroup><optgroup label="Local branches"><option>Local · feat/devin-local-provider</option><option>Local · main</option></optgroup></select></label><p>${base.startsWith('origin/')?'Fetches this branch on first send.':'Uses the local branch’s committed files.'} Uncommitted edits stay in the project folder.</p>`:mode==='existing'?'<label>Existing worktree<select><option>fix/audio-input — .worktrees/audio-input</option><option>feat/voice — .worktrees/voice</option></select></label><p>Shares files and branch with threads already using this worktree.</p>':'<p>Uses the project’s current files, including uncommitted edits. Threads in this folder share their changes.</p>';
const options=()=>'<details><summary>Thread options · Grok 4.6 · Xhigh · Provider default</summary><label>Thread name (optional)<input placeholder="New thread"></label><div class="row"><label>Model<select><option>Grok 4.6</option></select></label><label>Reasoning<select><option>Xhigh</option><option>High</option></select></label></div><label>Permissions<select><option>Provider default</option></select></label></details>';
const choices=()=>`<fieldset><legend>Working copy</legend><div class="choices">${[['shared','Project folder'],['new','New worktree'],['existing','Existing worktree']].map(([v,t])=>`<button data-mode="${v}" aria-pressed="${v===mode}" class="${v===mode?'selected':''}">${t}</button>`).join('')}</div></fieldset>`;
function render(){document.querySelector('#variant').textContent='Prototype '+variant+' · '+names[variant];let body=project;if(variant==='A')body+=choices()+source()+options();if(variant==='B')body+=step===0?'<div class="stack"><button data-mode="shared"><strong>Use the project folder</strong><small>Continue with the files you’re working on.</small></button><button data-mode="new"><strong>Create a new worktree</strong><small>Give this task its own branch and folder.</small></button><button data-mode="existing"><strong>Use an existing worktree</strong><small>Continue work in a separate folder you already have.</small></button></div>':`<strong>${{shared:'Project folder',new:'New worktree',existing:'Existing worktree'}[mode]}</strong>`+source()+options();if(variant==='C')body+=`<div class="summary-row"><div><small>Working copy</small><strong>${{shared:'Project folder',new:'New worktree',existing:'Existing worktree'}[mode]}</strong></div><button id="edit">${expanded?'Done':'Change'}</button></div>${expanded?choices()+source():`<p>${mode==='new'?'New branch and folder from '+base:mode==='shared'?'Current project files, including uncommitted edits.':'Uses an existing folder and its checked-out branch.'}</p>`}`+options();document.querySelector('#content').innerHTML=body;document.querySelector('#state').textContent=created?'Preview only — no thread created':mode==='new'?'Worktree created on first send.':'Sample project · No Git operations';document.querySelector('#create').textContent=variant==='B'&&step===0?'Continue →':'Create thread →';document.querySelector('#create').disabled=variant==='B'&&step===0;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;step=1;created=false;render()});const s=document.querySelector('#source');if(s){s.value=base;s.onchange=()=>{base=s.value;render()}}const edit=document.querySelector('#edit');if(edit)edit.onclick=()=>{expanded=!expanded;render()};console.info('Prototype state',{variant,mode,base,step,expanded})}
function cycle(n){variant=Object.keys(names)[(Object.keys(names).indexOf(variant)+n+3)%3];step=0;created=false;const u=new URL(location);u.searchParams.set('variant',variant);history.replaceState(null,'',u);render()}
document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.querySelector('#back').onclick=()=>{step=0;expanded=false;render()};document.querySelector('#create').onclick=()=>{created=true;render()};document.querySelector('#close').onclick=()=>{document.querySelector('.dialog').hidden=true;document.querySelector('#variant').textContent='Preview closed · arrows reopen'};document.querySelector('#theme').onclick=()=>{document.body.classList.toggle('light');document.querySelector('#theme').textContent=document.body.classList.contains('light')?'Dark':'Light'};document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('#close').click();if(['INPUT','TEXTAREA','SELECT','BUTTON','SUMMARY'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});for(const id of ['prev','next'])document.querySelector('#'+id).addEventListener('click',()=>document.querySelector('.dialog').hidden=false);render();
</script></html>
