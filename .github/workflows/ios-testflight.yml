# Builds the iPhone app, signs it and uploads it to TestFlight (ADR-0032). Runs only when a tag named
# ios-testflight-* is pushed, or by hand; never on a pull request. The App Store Connect key lives in the
# `testflight` environment, which only this job can read.
name: iPhone app to TestFlight

on:
  push:
    tags: ['ios-testflight-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build and upload to TestFlight
    # The iOS 27.1 SDK, the one the app is designed and captured against. Builds linked against iOS 26 showed no
    # tab rail in the Duo cover screen's strip; we infer iOS gave them a window beside it (ADR-0151, amended).
    runs-on: xcode-27
    timeout-minutes: 45
    environment: testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Record native toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test the native protocol
        run: swift test --package-path apps/ios
      - name: Write the App Store Connect key
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive, sign and upload
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          # Share to Sotto (ADR-0157) is off until Apple knows its IDs: the export fails with "No profiles for
          # 'com.millzach.sotto.ios.share' were found" while they are missing. Only the Apple account owner can add them, at
          # developer.apple.com > Certificates, Identifiers & Profiles > Identifiers:
          #   1. Register the App Group group.com.millzach.sotto.ios.
          #   2. Register the App ID com.millzach.sotto.ios.share with the App Groups capability.
          #   3. Turn on App Groups for com.millzach.sotto.ios and com.millzach.sotto.ios.share, each with that group.
          # Then set this to on. Off, the upload carries the app without the extension or its App Group.
          SHARE_EXTENSION: 'off'
        run: sh apps/ios/Scripts/testflight.sh
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
