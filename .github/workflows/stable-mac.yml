# Builds the Apple silicon Mac half of a stable Sotto release (ADR-0096) from the checked main commit and stable version
# the Windows release uses. Runs only when started by hand; never on a push or a pull request. It publishes nothing: it
# attests the disk image and its blockmap and keeps them, with the packaging receipt and release-check evidence, as a
# workflow artifact the release lead downloads and attaches. The build is ad-hoc signed, not notarized and has no
# updater (ADR-0001), and it reads no secrets.
name: Sotto stable for Mac

on:
  workflow_dispatch:
    inputs:
      version:
        description: The stable version, such as 0.1.38
        required: true
        type: string
      source:
        description: The full main commit the stable release ships
        required: true
        type: string

permissions:
  contents: read

# One build per stable version at a time. A second start for the same version waits rather than cancelling the first.
concurrency:
  group: stable-mac-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  package:
    name: Package Sotto stable (Apple silicon)
    runs-on: macos-26
    timeout-minutes: 60
    # checks: read lets release:check read the source commit's check runs with the job token. This job's token can
    # write nothing; attesting, which needs write scopes, is the next job's alone.
    permissions:
      contents: read
      checks: read
    env:
      CI: 'true'
      # Inputs reach scripts only through the environment, and are checked before anything reads them.
      VERSION: ${{ inputs.version }}
      SOURCE: ${{ inputs.source }}
    steps:
      - name: Check the version and source commit
        shell: bash
        run: |
          if ! [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The source must be the full 40-character lower-case main commit the stable release ships."; exit 1
          fi
          # The same shape as scripts/stable-promotion.mjs: a plain X.Y.Z.
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "The version must be a plain stable version, such as 0.1.38."; exit 1
          fi
          echo "Packaging Sotto $VERSION from $SOURCE."

      # Full history, so release:check can tell whether the source commit is on origin/main.
      - name: Check out the source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the checkout is the source commit
        shell: bash
        run: |
          if [ "$(git rev-parse HEAD)" != "$SOURCE" ]; then echo "The checkout is not the requested source commit."; exit 1; fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Electron 43 has no install script, so npm ci leaves node_modules/electron/dist empty.
      # The Mac build copies Electron's licence files from there; without them the package check fails.
      - name: Download Electron
        run: node node_modules/electron/install.js

      # The same command as the hand path. It runs release:check first, which refuses a dirty checkout, a commit outside
      # origin/main, missing or failed Gates (Windows) and Package result checks, and a version no newer than the newest
      # published stable. The job token only lifts the public rate limit on those reads; the data is public.
      - name: Package and verify the Mac stable build
        env:
          SOTTO_RELEASE_CHECK_TOKEN: ${{ github.token }}
        run: npm run package:mac -- --version "$VERSION"

      # The receipt names the files; this checks it describes this build and lists them for the upload and the attestation.
      - name: Name the files the receipt lists
        id: files
        shell: bash
        run: |
          node --input-type=module - <<'SCRIPT'
          import { appendFileSync, existsSync, readFileSync, writeFileSync } from 'node:fs'
          import process from 'node:process'
          const receipt = JSON.parse(readFileSync('release/mac-desktop-package.json', 'utf8'))
          if (receipt.version !== process.env.VERSION || receipt.sourceCommit !== process.env.SOURCE || receipt.track !== 'stable') {
            throw new Error('The packaging receipt does not describe this stable build.')
          }
          const promotion = JSON.parse(readFileSync('release/stable-promotion.json', 'utf8'))
          if (promotion.stableVersion !== process.env.VERSION || promotion.sourceCommit !== process.env.SOURCE) {
            throw new Error('The release check does not describe this stable build.')
          }
          const files = Object.values(receipt.files ?? {})
          for (const file of files) {
            if (!/^[A-Za-z0-9._-]+$/u.test(file?.filename ?? '') || !existsSync(`release/${file.filename}`)) throw new Error('The receipt lists a file that is not in release/.')
          }
          if (receipt.files?.dmg?.filename !== `Sotto-${process.env.VERSION}-arm64.dmg`) throw new Error('The receipt must list the disk image.')
          // The lines the release lead appends to SHA256SUMS.txt, in its two-space format.
          writeFileSync('release/SHA256SUMS-mac.txt', files.map(file => `${file.sha256}  ${file.filename}\n`).join(''))
          const attest = files.map(file => `release/${file.filename}`)
          const evidence = ['mac-desktop-package.json', 'stable-promotion.json', 'SHA256SUMS-mac.txt',
            'owl-features-stable-package-status.json', 'owl-features-stable-package.png'].map(name => `release/${name}`)
          for (const path of evidence) if (!existsSync(path)) throw new Error(`${path} is missing.`)
          appendFileSync(process.env.GITHUB_OUTPUT, `attest<<FILES\n${attest.join('\n')}\nFILES\nupload<<FILES\n${[...attest, ...evidence].join('\n')}\nFILES\n`)
          SCRIPT

      # The release lead reads this artifact after `gh run download <run-id> --repo millZach/Sotto --name
      # sotto-stable-mac-<version> --dir release/stable-mac`. Every file sits in release/, so the folder holds them side by side.
      - name: Retain the Mac stable files
        uses: actions/upload-artifact@v4
        with:
          name: sotto-stable-mac-${{ inputs.version }}
          path: ${{ steps.files.outputs.upload }}
          if-no-files-found: error
          retention-days: 14

  # Attesting needs write scopes, so it runs apart from packaging and from the release check's token. It signs the files
  # the package job kept, with this run's identity, and records the attestation on the public source repository.
  attest:
    name: Attest the disk image and blockmap
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the Mac stable files
        uses: actions/download-artifact@v4
        with:
          name: sotto-stable-mac-${{ inputs.version }}
          path: stable-mac

      - name: Name the files to attest
        id: files
        shell: bash
        run: |
          node --input-type=module - <<'SCRIPT'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs'
          import process from 'node:process'
          const receipt = JSON.parse(readFileSync('stable-mac/mac-desktop-package.json', 'utf8'))
          const attest = Object.values(receipt.files ?? {}).map(file => {
            if (!/^[A-Za-z0-9._-]+$/u.test(file?.filename ?? '') || !existsSync(`stable-mac/${file.filename}`)) throw new Error('The receipt lists a file that was not kept.')
            return `stable-mac/${file.filename}`
          })
          appendFileSync(process.env.GITHUB_OUTPUT, `attest<<FILES\n${attest.join('\n')}\nFILES\n`)
          SCRIPT

      - name: Attest the disk image and blockmap
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.files.outputs.attest }}
