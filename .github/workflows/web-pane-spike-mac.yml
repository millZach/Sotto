# The macOS half of the web pane spike (issue #2690). Lives only on prototype/web-pane-chromium and runs only for
# pushes there that touch the spike or this file. Throwaway: the branch's last commit removes it again.
name: Web pane spike (macOS)

on:
  push:
    branches: [prototype/web-pane-chromium]
    paths:
      - 'web-pane-spike/**'
      - '.github/workflows/web-pane-spike-mac.yml'

permissions:
  contents: read

concurrency:
  group: web-pane-spike-mac
  cancel-in-progress: true

jobs:
  spike:
    runs-on: macos-26
    timeout-minutes: 100
    steps:
      - name: Paths
        run: |
          echo "CEF_PATH=$HOME/wp-cache/cef" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$HOME/wp-cache/target" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          sparse-checkout: web-pane-spike
          fetch-depth: 1

      - name: Restore the CEF download and the build folder
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/wp-cache/cef
            ~/wp-cache/target
          key: web-pane-spike-mac-${{ hashFiles('web-pane-spike/Cargo.lock') }}

      - name: Toolchain
        run: |
          rustup update stable --no-self-update || true
          rustup default stable
          rustc --version; cargo --version; cmake --version | head -1; xcodebuild -version; python3 --version

      - name: Build
        timeout-minutes: 40
        working-directory: web-pane-spike
        run: |
          rm -f "$CARGO_TARGET_DIR/release/webpane"   # a cached binary must never stand in for a failed build
          cargo build --release 2>&1 | tee ../build.log | grep -E "^error|Compiling web-pane|Finished|warning: unused" || true
          test -x "$CARGO_TARGET_DIR/release/webpane"

      - name: Save the CEF download and the build folder
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/wp-cache/cef
            ~/wp-cache/target
          key: web-pane-spike-mac-${{ hashFiles('web-pane-spike/Cargo.lock') }}

      - name: Bundle
        run: |
          CEF_DIR="$(ls -d "$CEF_PATH"/*/cef_macos_aarch64 | head -1)"
          echo "CEF_DIR=$CEF_DIR" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/wp"
          bash web-pane-spike/scripts/mac/bundle.sh "$CARGO_TARGET_DIR/release/webpane" "$CEF_DIR" "$RUNNER_TEMP/wp"

      - name: Run the spike
        timeout-minutes: 55
        run: bash web-pane-spike/scripts/mac/ci.sh "$RUNNER_TEMP/wp/webpane.app" "$CEF_DIR" "$RUNNER_TEMP/out" $(cat web-pane-spike/scripts/mac/phases.txt 2>/dev/null)

      - name: Upload the records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-pane-spike-mac
          retention-days: 7
          path: |
            ${{ runner.temp }}/out
            build.log
          if-no-files-found: warn
