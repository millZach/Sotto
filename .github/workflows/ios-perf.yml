name: iPhone benchmarks

# Measuring branch only, never merged: what opening a long thread costs and what part of it comes only once a launch,
# for #2120 and #1702.
on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Unused here'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  bench:
    name: Why the iPhone's long thread opens slowly (macOS)
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out the change
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record native toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Open a long thread and scroll the list both ways
        timeout-minutes: 60
        run: sh apps/ios/Scripts/open-why.sh "$RUNNER_TEMP/why" 1 20
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-open-why
          path: |
            ${{ runner.temp }}/why/*.json
            ${{ runner.temp }}/why/*.md
            ${{ runner.temp }}/why/*.log
            ${{ runner.temp }}/why/*.txt
            ${{ runner.temp }}/why/*.png
          if-no-files-found: warn
          retention-days: 30
