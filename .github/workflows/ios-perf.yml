name: iPhone benchmarks

# Measuring branch only, never merged: the iPhone journeys with the Threads list's hold and without it on one runner
# (apps/ios/Scripts/hold-ab.sh), for pull request #2023.
on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Unused here'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  bench:
    name: iPhone hold with and without (macOS)
    runs-on: macos-26
    timeout-minutes: 260
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out the change
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record native toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run both sides in turn
        # No round starts after 190 minutes; a round takes about twenty.
        timeout-minutes: 240
        run: sh apps/ios/Scripts/hold-ab.sh "$RUNNER_TEMP/ab" 6 190
      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/ab/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-hold-ab
          path: |
            ${{ runner.temp }}/ab/*.log
            ${{ runner.temp }}/ab/*.md
            ${{ runner.temp }}/ab/*.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Keep what the failed journeys saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-hold-ab-failures
          path: ${{ runner.temp }}/ab/*.xcresult
          if-no-files-found: ignore
          retention-days: 14
