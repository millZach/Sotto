name: iPhone benchmarks

# Measuring branch only, never merged: the reply box on November 5 (3e2ee9b79) and November 10 (65669cac1), taking turns on
# one runner (apps/ios/Scripts/reply-box-ab.sh), for issue #2401.
on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Unused here'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  bench:
    name: iPhone reply box on November 5 and November 10 in turns (macOS)
    runs-on: macos-26
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out the merge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record native toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run both builds in turn
        # Eight rounds of two blocks, about nine minutes a round; no round starts after 110 minutes.
        timeout-minutes: 135
        run: sh apps/ios/Scripts/reply-box-ab.sh "$RUNNER_TEMP/ab" 8 110
      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/ab/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-reply-box-ab
          path: |
            ${{ runner.temp }}/ab/*.json
            ${{ runner.temp }}/ab/*.md
            ${{ runner.temp }}/ab/*.log
            ${{ runner.temp }}/ab/*.txt
          if-no-files-found: warn
          retention-days: 30
