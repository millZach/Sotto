name: iPhone benchmarks

# The iPhone benchmarks (docs/perf/2026-10-31-iphone-benchmarks.md), apart from CI because they take most of an hour on
# a macOS runner. They run when asked for: on a pull request carrying the `ios-perf` label, at every push while it
# carries it, or by hand from the Actions tab. Each run measures the pull request's base and its head on the same runner, so the two columns differ only by the change.
on:
  pull_request:
    types: [labeled, synchronize, reopened]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios-perf.yml'
  workflow_dispatch:
    inputs:
      base:
        description: 'Ref to measure as the before column; empty measures only the chosen ref'
        required: false
        default: 'main'

permissions:
  contents: read

concurrency:
  group: ios-perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: iPhone benchmarks (macOS)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ios-perf')
    runs-on: macos-26
    # Two optimized builds, each with five launches and five journeys: about an hour. Each side has its own limit
    # too, so a hung simulator or profiler ends the run long before this one.
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base }}
    steps:
      - name: Check out the change
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - name: Measure the list variants (scratch)
        timeout-minutes: 60
        run: sh apps/ios/Scripts/bench-variants.sh "$RUNNER_TEMP/bench/variants" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-list-variants
          path: |
            ${{ runner.temp }}/bench/variants/app/*.json
            ${{ runner.temp }}/bench/variants/build.log
          if-no-files-found: warn
