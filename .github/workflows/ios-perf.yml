name: iPhone benchmarks

# Measuring branch only, never merged: why the Threads list draws again during its scroll at the merge of #2023, with the
# benchmark's environment probe under the list ("before") and without it ("merge"), for issue #2100.
on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Unused here'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  bench:
    name: Why the iPhone list draws again in its scroll (macOS)
    runs-on: macos-26
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out the merge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record native toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run both builds in turn
        # Six rounds of two blocks, about nine minutes a round; no round starts after 70 minutes.
        timeout-minutes: 100
        run: sh apps/ios/Scripts/scroll-ab.sh "$RUNNER_TEMP/ab" 6 70
      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/ab/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-scroll-why
          path: |
            ${{ runner.temp }}/ab/*.json
            ${{ runner.temp }}/ab/*.md
            ${{ runner.temp }}/ab/*.log
            ${{ runner.temp }}/ab/*.txt
          if-no-files-found: warn
          retention-days: 30
