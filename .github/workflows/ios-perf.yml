name: iPhone benchmarks

# Measuring branch only, never merged: the Threads list's scroll before #2023 and at its merge, taking turns on one
# runner (apps/ios/Scripts/scroll-ab.sh), for issue #2100.
on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Unused here'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  bench:
    name: iPhone list scroll before and at the merge (macOS)
    runs-on: macos-26
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out the merge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record native toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run both builds in turn
        # Eight rounds of two blocks, about nine minutes a round; no round starts after 110 minutes.
        timeout-minutes: 135
        run: sh apps/ios/Scripts/scroll-ab.sh "$RUNNER_TEMP/ab" 8 110
      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/ab/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-scroll-ab
          path: |
            ${{ runner.temp }}/ab/*.json
            ${{ runner.temp }}/ab/*.md
            ${{ runner.temp }}/ab/*.log
            ${{ runner.temp }}/ab/*.txt
          if-no-files-found: warn
          retention-days: 30
