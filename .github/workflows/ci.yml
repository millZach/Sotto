name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides which of the slower jobs a pull request needs. Gates (Windows) never waits on it and always
  # runs. A push to main runs every job. The host job runs unless every changed file is in an area it
  # cannot reach; the iOS job runs only when the native client, the protocol it mirrors or this file changed.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      host: ${{ steps.areas.outputs.host }}
      ios: ${{ steps.areas.outputs.ios }}
      package: ${{ steps.areas.outputs.package }}
      desktop: ${{ steps.areas.outputs.desktop }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Name the changed areas
        id: areas
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "host=true" >> "$GITHUB_OUTPUT"; echo "ios=true" >> "$GITHUB_OUTPUT"; echo "package=true" >> "$GITHUB_OUTPUT"; echo "desktop=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A pull request checks out its merge commit; its first parent is the base branch.
          # --no-renames lists a moved file at both paths, so moving one into a skipped area still counts its old area.
          files=$(git diff --no-renames --name-only HEAD^1 HEAD)
          if [ -z "$files" ]; then
            echo "host=true" >> "$GITHUB_OUTPUT"; echo "ios=true" >> "$GITHUB_OUTPUT"; echo "package=true" >> "$GITHUB_OUTPUT"; echo "desktop=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          host=false; ios=false; package=false
          # Each test reads the list from a here-string, not a pipe: the step runs under pipefail, and grep -q stops
          # at its first match, so on a long list printf dies writing to the closed pipe and the test reads as false.
          if grep -qvE '^(src/renderer/|src/preload/|apps/ios/|docs/|artifacts/|design/|handoff/|tests/e2e/|tests/unit/renderer/|tests/perf/|[^/]+\.md$)' <<< "$files" \
            || grep -qxE 'THIRD_PARTY_NOTICES\.md' <<< "$files"; then host=true; fi
          if grep -qE '^(apps/ios/|src/shared/hostProtocol\.ts$|\.github/workflows/ci\.yml$)' <<< "$files"; then ios=true; fi
          # Packaging reads everything but the documents, the tests and the native phone clients, except the documents the
          # package ships (the root README, licence and notices) and the notice the renderer bundles from docs/notices/.
          if grep -qvE '^(docs/|artifacts/|design/|handoff/|tests/|apps/ios/|apps/android/|[^/]+\.md$)' <<< "$files" \
            || grep -qE '^(README\.md|LICENSE\.md|THIRD_PARTY_NOTICES\.md|docs/notices/)' <<< "$files"; then package=true; fi
          # The desktop check follows packaging's app filter and also checks changes to its Electron journeys and fixtures.
          desktop=$package
          if grep -qE '^(tests/e2e/|tests/fixtures/)' <<< "$files"; then desktop=true; fi
          echo "host=$host" >> "$GITHUB_OUTPUT"; echo "ios=$ios" >> "$GITHUB_OUTPUT"; echo "package=$package" >> "$GITHUB_OUTPUT"; echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "Host job: $host. iOS job: $ios. Package job: $package. Desktop job: $desktop."

  gates:
    name: Gates (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Live provider suites stay opt-in; CI never holds provider credentials.
      CI: 'true'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The hosted runner's user temp folder is an 8.3 short path (RUNNER~1),
      # so a path a test builds from os.tmpdir() never equals the real path the
      # code resolves. The runner's work temp folder is a long path.
      - name: Use a long temp path
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare runtime assets
        run: npm run runtime:prepare

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Two workers keeps the jsdom and child-process heavy suites inside a
      # two-core runner's memory; the whole suite still finishes in minutes.
      - name: Unit and integration tests
        run: npm test -- --maxWorkers=2

      - name: Third-party notices
        run: npm run notices:verify

  # Builds the unpacked Windows app and verifies its packaged resources, the step a release runs before the
  # installer, so a change to electron-builder.yml, the packaging scripts or what the app carries fails here
  # rather than on the Windows PC at release time (#844). It builds no installer and publishes nothing.
  package:
    name: Package (Windows)
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Use a long temp path
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare runtime assets
        run: npm run runtime:prepare

      # runtime:prepare rewrites resources/runtime/manifest.lock.json from what npm ci installed, and package:dir
      # verifies the runtime against that rewrite. A clean install reproduces the committed lock exactly, so a
      # difference means the lockfile moved the runtime without the committed lock following it.
      - name: Check the prepared runtime matches the committed lock
        shell: bash
        run: git diff --exit-code -- resources/runtime/manifest.lock.json

      - name: Build and verify the unpacked Windows app
        run: npm run package:dir

  # Trial only (#899): exercise the built app on the hosted desktop without publishing or becoming a required check.
  desktop:
    name: Desktop check (Windows)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Use a long temp path
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare runtime assets
        run: npm run runtime:prepare

      - name: Exercise the Windows desktop
        run: npm run test:desktop-smoke

      # Keep passing captures during the trial too, so its actual hosted desktop can be inspected.
      - name: Retain desktop journeys and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-journeys-${{ github.run_attempt }}
          path: |
            artifacts/review-393/desktop-run/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  # A skipped job counts as passing for a required check, and Package (Windows) is skipped whenever Changed areas
  # does not ask for it, including when Changed areas itself failed. A ruleset requires this job instead: it fails
  # unless Changed areas finished and Package (Windows) passed whenever it was asked for.
  package-result:
    name: Package result
    needs: [changes, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Changed areas and Package (Windows)
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          WANTED: ${{ needs.changes.outputs.package }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then echo "Changed areas ended $CHANGES, so nobody decided whether to package."; exit 1; fi
          if [ "$WANTED" = "true" ] && [ "$PACKAGE" != "success" ]; then echo "Package (Windows) was needed and ended $PACKAGE."; exit 1; fi
          echo "Package (Windows) needed: $WANTED. Result: $PACKAGE."

  host:
    name: Host archive and socket contract (Linux)
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Shared socket contract and native host lifecycle
        run: npm run test:socket
      - name: Package and verify the extracted host archive
        run: npm run package:host
      # The runner image may not carry sshd. The test runs its own on a loopback port as the runner
      # account, so the system service this installs is never used.
      - name: OpenSSH server for the real SSH journey
        run: |
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openssh-server
          fi
          ssh -V
      - name: Real OpenSSH server journey
        env:
          SOTTO_REAL_SSHD: '1'
        run: |
          install="$RUNNER_TEMP/sotto-host"
          mkdir -p "$install"
          tar -xzf release/Sotto-host-*-linux-x64.tar.gz -C "$install"
          SOTTO_REAL_SSHD_INSTALL="$install" npx vitest run tests/integration/realSshd.test.ts --maxWorkers=1
      - name: Third-party notices
        run: npm run notices:verify
      - name: Retain the verified host archive
        uses: actions/upload-artifact@v4
        with:
          name: sotto-host-linux-x64
          path: |
            release/Sotto-host-*-linux-x64.tar.gz
            release/Sotto-host-*-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  ios:
    name: Native iOS client (macOS)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    # Fifteen simulator journeys on two phones, with the package tests and two builds before them.
    timeout-minutes: 75
    env:
      # The same Xcode as the TestFlight workflow: App Store Connect accepts only iOS 26 SDK builds.
      # Its Swift 6 compiler builds in Swift 5 mode, above Package.swift's 5.9 tools and the iOS 17 minimum.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Record native toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test native protocol and build the unsigned simulator app
        run: sh apps/ios/Scripts/verify.sh
      - name: Exercise Focus on small and large iPhones
        run: sh apps/ios/Scripts/verify-ui.sh
      - name: Retain native journeys and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-focus-journeys
          path: apps/ios/.build-ui/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
