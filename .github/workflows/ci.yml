name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Every Monday, every job runs on main whatever changed, so a runner image or Xcode update that breaks a job
  # nobody touched is found within the week, and the iOS job that pushes to main now skip still runs.
  schedule:
    - cron: '0 10 * * 1'

# A newer push to the same pull request cancels the run it supersedes. A push to main does not cancel the run under
# way, so main's runs finish and Gates on main catches two pull requests that break each other: when merges cancelled
# it, 43 of the last 50 runs on main were cancelled (October 28, 2026). One run on main goes at a time; GitHub keeps
# only the newest waiting run, which covers the merges before it. The weekly run has a group of its own, so it
# neither waits for a push to main nor holds one up.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decides which of the slower jobs a pull request needs. A push to main runs every job but the iOS one, which
  # runs only when what it reads changed since the last push run on main that ran; the weekly run runs every job.
  # The test shards run unless every changed file is a document; then the checks job runs only the tests that
  # read the repository's own documents. The host job runs unless every changed file is in an area it cannot
  # reach; the iOS job runs only when the native client, the protocol it mirrors or this file changed.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reading this workflow's earlier runs on main is how a push finds what its iOS job must cover.
    permissions:
      contents: read
      actions: read
    outputs:
      host: ${{ steps.areas.outputs.host }}
      ios: ${{ steps.areas.outputs.ios }}
      coreml: ${{ steps.areas.outputs.coreml }}
      package: ${{ steps.areas.outputs.package }}
      desktop: ${{ steps.areas.outputs.desktop }}
      tests: ${{ steps.areas.outputs.tests }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Name the changed areas
        id: areas
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The iOS job reads only the native client, the host protocol its wire types mirror and this file.
          ios_paths='^(apps/ios/|src/shared/hostProtocol\.ts$|\.github/workflows/ci\.yml$)'
          # The Core ML speech helper job reads only the Swift helper, its build script and this file.
          coreml_paths='^(native/coreml-asr/|scripts/build-coreml-asr\.mjs$|\.github/workflows/ci\.yml$)'
          if [ "$EVENT" = "push" ]; then
            # A push to main runs every job, the backstop for two pull requests that break each other, except the
            # iOS job when nothing it reads changed since the last push run on main that ran: that run's iOS job
            # covered the commits before it. Runs on main go one at a time and are not cancelled once they start,
            # so the newest finished run that was not cancelled is the one just before this; a run cancelled while
            # waiting never ran, so its commits stay in the range. A failed iOS run is not carried forward (the
            # weekly run is the backstop for that). The commit is fetched without file contents, since only the
            # names of the changed files are read. When it cannot be found or read, the job runs.
            ios=true
            previous=$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&per_page=30" \
              --jq '[.workflow_runs[] | select(.conclusion != "cancelled")][0].head_sha // empty' || true)
            if [ -n "$previous" ] \
              && { git cat-file -e "$previous^{commit}" 2>/dev/null || git fetch --quiet --depth=1 --filter=blob:none origin "$previous"; }; then
              unproven=$(git diff --no-renames --name-only "$previous" HEAD)
              if ! grep -qE "$ios_paths" <<< "$unproven"; then ios=false; fi
            fi
            echo "host=true" >> "$GITHUB_OUTPUT"; echo "ios=$ios" >> "$GITHUB_OUTPUT"; echo "coreml=true" >> "$GITHUB_OUTPUT"; echo "package=true" >> "$GITHUB_OUTPUT"; echo "desktop=true" >> "$GITHUB_OUTPUT"; echo "tests=full" >> "$GITHUB_OUTPUT"
            echo "Push to main: every job runs. iOS job: $ios (changes since ${previous:-no earlier run})."
            exit 0
          fi
          if [ "$EVENT" != "pull_request" ]; then
            echo "host=true" >> "$GITHUB_OUTPUT"; echo "ios=true" >> "$GITHUB_OUTPUT"; echo "coreml=true" >> "$GITHUB_OUTPUT"; echo "package=true" >> "$GITHUB_OUTPUT"; echo "desktop=true" >> "$GITHUB_OUTPUT"; echo "tests=full" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A pull request checks out its merge commit; its first parent is the base branch.
          # --no-renames lists a moved file at both paths, so moving one into a skipped area still counts its old area.
          files=$(git diff --no-renames --name-only HEAD^1 HEAD)
          if [ -z "$files" ]; then
            echo "host=true" >> "$GITHUB_OUTPUT"; echo "ios=true" >> "$GITHUB_OUTPUT"; echo "coreml=true" >> "$GITHUB_OUTPUT"; echo "package=true" >> "$GITHUB_OUTPUT"; echo "desktop=true" >> "$GITHUB_OUTPUT"; echo "tests=full" >> "$GITHUB_OUTPUT"; exit 0
          fi
          host=false; ios=false; coreml=false; package=false
          # Each test reads the list from a here-string, not a pipe: the step runs under pipefail, and grep -q stops
          # at its first match, so on a long list printf dies writing to the closed pipe and the test reads as false.
          if grep -qvE '^(src/renderer/|src/preload/|apps/ios/|docs/|artifacts/|design/|handoff/|tests/e2e/|tests/unit/renderer/|tests/perf/|[^/]+\.md$)' <<< "$files" \
            || grep -qxE 'THIRD_PARTY_NOTICES\.md' <<< "$files"; then host=true; fi
          if grep -qE "$ios_paths" <<< "$files"; then ios=true; fi
          if grep -qE "$coreml_paths" <<< "$files"; then coreml=true; fi
          # Packaging reads everything but the documents, the tests and the native phone clients, except the root
          # README, licence and notices that the package ships.
          if grep -qvE '^(docs/|artifacts/|design/|handoff/|tests/|apps/ios/|apps/android/|[^/]+\.md$)' <<< "$files" \
            || grep -qE '^(README\.md|LICENSE\.md|THIRD_PARTY_NOTICES\.md)' <<< "$files"; then package=true; fi
          # The desktop check follows packaging's app filter and also checks changes to its Electron journeys and fixtures.
          desktop=$package
          if grep -qE '^(tests/e2e/|tests/fixtures/)' <<< "$files"; then desktop=true; fi
          # A change made only of documents, evidence and .gitignore runs the document tests instead of the
          # whole suite: those are the tests that read these files (ADR links and numbers, artifact ignores,
          # evidence notes, notices, file encoding). Anything else, including a new top-level file, runs it all.
          tests=docs
          if grep -qvE '^(docs/|artifacts/|design/|handoff/|[^/]+\.md$|\.gitignore$)' <<< "$files"; then tests=full; fi
          echo "host=$host" >> "$GITHUB_OUTPUT"; echo "ios=$ios" >> "$GITHUB_OUTPUT"; echo "coreml=$coreml" >> "$GITHUB_OUTPUT"; echo "package=$package" >> "$GITHUB_OUTPUT"; echo "desktop=$desktop" >> "$GITHUB_OUTPUT"; echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "Host job: $host. iOS job: $ios. Core ML helper job: $coreml. Package job: $package. Desktop job: $desktop. Tests: $tests."

  # The gates that are not the test suite. Every pull request and every push to main runs them.
  checks:
    name: Typecheck and lint (Windows)
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The hosted runner's user temp folder is an 8.3 short path (RUNNER~1),
      # so a path a test builds from os.tmpdir() never equals the real path the
      # code resolves. The runner's work temp folder is a long path.
      - name: Use a long temp path
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release assets
        run: npm run assets:verify

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Third-party notices
        run: npm run notices:verify

      # CI runs only a few Playwright journeys, so a spec that cannot load would go unseen (#1579). Listing loads every one.
      - name: Load every Playwright spec
        run: npm run e2e:list

      # A change made only of documents skips the shards; these are the tests that read the documents.
      - name: Document tests
        if: needs.changes.outputs.tests == 'docs'
        run: npx vitest run tests/unit/release tests/unit/scripts --maxWorkers=2

  # The suite took 24 to 27 minutes as one step (#895). Six runners each take a sixth of the test files,
  # with the same two-worker cap, so a run finishes in minutes and every file still runs on Windows.
  tests:
    name: Tests (Windows, ${{ matrix.shard }}/6)
    needs: changes
    if: needs.changes.outputs.tests == 'full'
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      # Live provider suites stay opt-in; CI never holds provider credentials.
      CI: 'true'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The hosted runner's user temp folder is an 8.3 short path (RUNNER~1),
      # so a path a test builds from os.tmpdir() never equals the real path the
      # code resolves. The runner's work temp folder is a long path.
      - name: Use a long temp path
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Two workers keeps the jsdom and child-process heavy suites inside the
      # runner's memory and matches the timing the suite's deadlines assume.
      # Keep per-test completions when an otherwise quiet file stalls on a hosted runner.
      - name: Unit and integration tests
        run: npm test -- --maxWorkers=2 --shard=${{ matrix.shard }}/6 --reporter=verbose

  # Six shards keep the Linux suite near the Windows shards' duration without changing those jobs.
  # This uses the full-suite decision, not the host filter that skips renderer and preload changes.
  # Pull requests skip them: twelve test shards per run made jobs wait for runners, and a Tests shard on Windows
  # queued over two minutes in 54 of the last 98 runs (November 1, 2026). Pushes to main and the weekly run keep them.
  linux-tests:
    name: Tests (Linux, ${{ matrix.shard }}/6)
    needs: changes
    if: needs.changes.outputs.tests == 'full' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      # Live provider suites stay opt-in; CI never holds provider credentials.
      CI: 'true'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Check Linux's platform declarations once; its failure also fails the matrix result.
      - name: Typecheck on Linux
        if: matrix.shard == 1
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test -- --maxWorkers=2 --shard=${{ matrix.shard }}/6

  # Not a required check, by Drake's decision on October 28, 2026: Linux shards flaked often (coordinatorThreadChanges
  # failed 22 times in two days before its fix, and a workspaceThreadChanges 15 s timeout is still open), so requiring
  # it would put every Linux flake in every merge's path. The cost is that a pull request can merge before Linux ends:
  # #1709 merged two minutes before Tests (Linux, 6/6) went red.
  # Pull requests skip the shards, so Linux breakage shows on the push to main. A skipped or failed Changed areas job
  # must not make skipped Linux shards look green.
  linux-result:
    name: Linux result
    needs: [changes, linux-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Changed areas and every Linux shard
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          MODE: ${{ needs.changes.outputs.tests }}
          TESTS: ${{ needs.linux-tests.result }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$CHANGES" != "success" ]; then echo "Changed areas ended $CHANGES, so nobody decided which Linux tests to run."; exit 1; fi
          if [ "$EVENT" = "pull_request" ] && [ "$TESTS" = "skipped" ]; then echo "Pull request: the Linux shards run on the push to main."; exit 0; fi
          if [ "$MODE" = "docs" ] && [ "$TESTS" = "skipped" ]; then echo "Documents only: the Linux shards were skipped."; exit 0; fi
          if [ "$MODE" != "full" ] || [ "$TESTS" != "success" ]; then echo "Linux tests mode: $MODE. Shards ended $TESTS."; exit 1; fi
          echo "Linux typecheck and all six test shards passed."

  # Main's ruleset requires this job by name. It passes only when Changed areas finished, the checks passed
  # and every test shard passed, or when Changed areas found a documents-only change and skipped the shards.
  gates:
    name: Gates (Windows)
    needs: [changes, checks, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the checks and every test shard
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          MODE: ${{ needs.changes.outputs.tests }}
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then echo "Changed areas ended $CHANGES, so nobody decided which tests to run."; exit 1; fi
          if [ "$CHECKS" != "success" ]; then echo "Typecheck and lint (Windows) ended $CHECKS."; exit 1; fi
          if [ "$MODE" = "docs" ]; then echo "Documents only: the document tests passed and the shards were skipped ($TESTS)."; exit 0; fi
          if [ "$TESTS" != "success" ]; then echo "A test shard ended $TESTS."; exit 1; fi
          echo "Checks and all six test shards passed."

  # Builds the unpacked Windows app and verifies its packaged resources, the step a release runs before the
  # installer, so a change to electron-builder.yml, the packaging scripts or what the app carries fails here
  # rather than on the Windows PC at release time (#844). It builds no installer and publishes nothing.
  package:
    name: Package (Windows)
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Use a long temp path
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release assets
        run: npm run assets:verify

      - name: Build and verify the unpacked Windows app
        run: npm run package:dir

  # Exercise the built app on the hosted desktop without publishing (#899). The ruleset requires Desktop result, not this job.
  desktop:
    name: Desktop check (Windows)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Use a long temp path
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release assets
        run: npm run assets:verify

      - name: Exercise the Windows desktop
        run: npm run test:desktop-smoke

      # Keep passing captures too, so the hosted desktop each run used can be inspected.
      - name: Retain desktop journeys and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-journeys-${{ github.run_attempt }}
          path: |
            artifacts/review-393/desktop-run/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  # A skipped job counts as passing for a required check, and Package (Windows) is skipped whenever Changed areas
  # does not ask for it, including when Changed areas itself failed. A ruleset requires this job instead: it fails
  # unless Changed areas finished and Package (Windows) passed whenever it was asked for.
  package-result:
    name: Package result
    needs: [changes, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Changed areas and Package (Windows)
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          WANTED: ${{ needs.changes.outputs.package }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then echo "Changed areas ended $CHANGES, so nobody decided whether to package."; exit 1; fi
          if [ "$WANTED" = "true" ] && [ "$PACKAGE" != "success" ]; then echo "Package (Windows) was needed and ended $PACKAGE."; exit 1; fi
          echo "Package (Windows) needed: $WANTED. Result: $PACKAGE."

  # The ruleset requires this guard because a skipped Desktop check (Windows) alone would count as passing even
  # if Changed areas failed. Keep the packaging guard's independent contract.
  desktop-result:
    name: Desktop result
    needs: [changes, desktop]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Changed areas and Desktop check (Windows)
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          WANTED: ${{ needs.changes.outputs.desktop }}
          DESKTOP: ${{ needs.desktop.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then echo "Changed areas ended $CHANGES, so nobody decided whether to check the desktop."; exit 1; fi
          if [ "$WANTED" = "true" ] && [ "$DESKTOP" != "success" ]; then echo "Desktop check (Windows) was needed and ended $DESKTOP."; exit 1; fi
          echo "Desktop check (Windows) needed: $WANTED. Result: $DESKTOP."

  host:
    name: Host archive and socket contract (Linux)
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Shared socket contract and native host lifecycle
        run: npm run test:socket
      - name: Package and verify the extracted host archive
        run: npm run package:host
      # The runner image may not carry sshd. The test runs its own on a loopback port as the runner
      # account, so the system service this installs is never used.
      - name: OpenSSH server for the real SSH journey
        run: |
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openssh-server
          fi
          ssh -V
      - name: Real OpenSSH server journey
        env:
          SOTTO_REAL_SSHD: '1'
          SOTTO_REAL_SSHD_REQUIRED: '1'
        run: |
          install="$RUNNER_TEMP/sotto-host"
          mkdir -p "$install"
          tar -xzf release/Sotto-host-*-linux-x64.tar.gz -C "$install"
          SOTTO_REAL_SSHD_INSTALL="$install" npx vitest run tests/integration/realSshd.test.ts --maxWorkers=1
      - name: Third-party notices
        run: npm run notices:verify
      - name: Retain the verified host archive
        uses: actions/upload-artifact@v4
        with:
          name: sotto-host-linux-x64
          path: |
            release/Sotto-host-*-linux-x64.tar.gz
            release/Sotto-host-*-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  ios:
    name: Native iOS client (macOS)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    # Simulator journeys on two phones, with the package tests and two builds before them. Nineteen journeys took 67
    # minutes on a push to main and one run reached 75; the Watcher tab added six, and twenty-five took 106 minutes on a
    # push to main. Watcher's permissions, own changes and watching added three.
    timeout-minutes: 140
    env:
      # Older than the TestFlight workflow's Xcode 27.1: the journeys run on iPhone SE (3rd generation) and iPhone 16
      # Pro Max, which the iOS 27.1 simulator no longer offers. Its Swift 6 compiler builds in Swift 5 mode, above
      # Package.swift's 5.9 tools and the iOS 17 minimum.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Record native toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test native protocol and build the unsigned simulator app
        run: sh apps/ios/Scripts/verify.sh
      - name: Exercise Focus on small and large iPhones
        run: sh apps/ios/Scripts/verify-ui.sh
      - name: Retain native journeys and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-focus-journeys
          path: apps/ios/.build-ui/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # The Mac app's Core ML speech helper (built on FluidAudio) builds on Apple silicon and answers protocol 2.
  coreml-asr:
    name: Core ML speech helper (macOS)
    needs: changes
    if: needs.changes.outputs.coreml == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Record native toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build the helper and check its protocol version
        shell: bash
        run: |
          helper=$(node scripts/build-coreml-asr.mjs | tail -n 1)
          test -x "$helper"
          version=$("$helper" --version)
          echo "$version"
          test "$version" = '{"protocol":2}'
