directories:
  output: release

files:
  - out/**/*
  - package.json

asar: true

extraResources:
  - from: resources/models
    to: models
  - from: resources/runtime
    to: runtime

win:
  executableName: TalkType
  target:
    - nsis

artifactName: '${productName}-${version}-${arch}.${ext}'
