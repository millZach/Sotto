<!doctype html>
<!--
  PROTOTYPE, throwaway. Question: what should interface translation look like in Sotto?
  Screens: Settings language picker (variants A/B/C via ?variant=), Arabic and Urdu right to left,
  Simplified Chinese and Japanese, Hindi at the 820x560 minimum. Nothing here is wired to the app.
  URL keys: screen=settings|rtl|cjk|hindi  variant=A|B|C  mode=dark|light  ui=<locale>  open=1
            disclose=1  rtl=ar|ur  digits=native|latin  marks=0|1  cjk=zh-Hans|ja  hl=hi|en  actual=1
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype: interface language in Sotto</title>
<style>
@font-face { font-family: 'Figtree'; font-style: normal; font-weight: 300 900; font-display: swap; src: url('figtree-latin.woff2') format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'Figtree'; font-style: normal; font-weight: 300 900; font-display: swap; src: url('figtree-latin-ext.woff2') format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Spline Sans Mono'; font-style: normal; font-weight: 300 700; font-display: swap; src: url('spline-sans-mono-latin.woff2') format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
/* Windows ships no Nastaliq face by default, so the prototype bundles Noto Nastaliq Urdu's Arabic-script subset (OFL, 239 KB). */
@font-face { font-family: 'Proto Nastaliq'; font-style: normal; font-weight: 400 700; font-display: swap; src: url('noto-nastaliq-urdu-arabic.woff2') format('woff2');
  unicode-range: U+0600-06FF, U+0750-077F, U+0870-08FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC; }

/* ---------- Sotto's default theme roles (src/styles/tokens.css, Sotto theme at 100% contrast) ---------- */
:root {
  color-scheme: dark;
  --tt-canvas: oklch(0.115 0.008 265);
  --tt-surface: oklch(0.145 0.008 265);
  --tt-raised: oklch(0.185 0.008 265);
  --tt-overlay: oklch(0.215 0.008 265);
  --tt-text: oklch(0.985 0.005 280);
  --tt-muted-fg: oklch(0.72 0.014 265);
  --tt-text-2: color-mix(in oklab, var(--tt-text) 55%, var(--tt-muted-fg));
  --tt-text-muted: color-mix(in oklab, var(--tt-muted-fg) 85%, var(--tt-text));
  --tt-hairline: oklch(0.305 0.02 265);
  --tt-input: oklch(0.375 0.024 265);
  --tt-accent: oklch(0.714403 0.104089 183.092);
  --tt-accent-fg: oklch(0.16 0.012 190);
  --tt-accent-surface: oklch(0.32 0.05 185);
  --tt-update-fg: oklch(0.83 0.08 183);
  --tt-warning: oklch(0.829017 0.171221 81.038);
  --tt-error-fg: oklch(0.702184 0.189226 22.228);
  --tt-success: oklch(0.79 0.13 165);
  --tt-message: oklch(0.205 0.014 265);
  --tt-code-bg: oklch(0.155 0.008 265);
  --tt-sidebar: oklch(0.235 0.003 265);
  --tt-sidebar-control: oklch(0.295 0.003 265);
  --tt-row-hover: oklch(0.28 0.003 265);
  --tt-row-active: oklch(0.32 0.025 190);
  --tt-row-selected: oklch(0.355 0.035 188);
  --tt-sidebar-border: oklch(0.355 0.012 265);
  --tt-solid: oklch(0.985 0.005 280);
  --tt-solid-fg: oklch(0.16 0.012 190);
  --tt-shadow: 0 24px 72px -20px rgb(0 0 0 / 90%);

  --f-mono: 'Spline Sans Mono', ui-monospace, 'Cascadia Mono', Consolas, 'SF Mono', Menlo, monospace;
  --f-latin: 'Figtree', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-ar: 'Figtree', 'Segoe UI', 'Geeza Pro', 'Noto Sans Arabic', 'Arabic UI Text', sans-serif;
  --f-ur: 'Figtree', 'Noto Nastaliq Urdu', 'Urdu Typesetting', 'Proto Nastaliq', 'Segoe UI', sans-serif;
  --f-zhs: 'Figtree', 'Microsoft YaHei UI', 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
  --f-zht: 'Figtree', 'Microsoft JhengHei UI', 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif;
  --f-ja: 'Figtree', 'Yu Gothic UI', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo UI', 'Noto Sans JP', sans-serif;
  --f-indic: 'Figtree', 'Nirmala UI', 'Kohinoor Devanagari', 'Kohinoor Bangla', 'Kohinoor Telugu', 'Tamil Sangam MN', 'Noto Sans Devanagari', sans-serif;

  /* prototype chrome, deliberately not Sotto's look */
  --p-bg: #17181b; --p-fg: #e9e9ec; --p-muted: #a3a4ab; --p-line: #34353b; --p-chip: #24252a; --p-on: #f3d34a; --p-on-fg: #16130a;
}
:root[data-theme='light'] {
  color-scheme: light;
  --tt-canvas: oklch(0.978 0.004 85);
  --tt-surface: oklch(0.99 0.003 85);
  --tt-raised: oklch(0.955 0.006 85);
  --tt-overlay: oklch(0.99 0.003 85);
  --tt-text: oklch(0.235 0.014 75);
  --tt-muted-fg: oklch(0.5 0.014 75);
  --tt-hairline: oklch(0.86 0.012 80);
  --tt-input: oklch(0.8 0.016 80);
  --tt-accent: oklch(0.53 0.095 186);
  --tt-accent-fg: oklch(0.99 0.003 85);
  --tt-accent-surface: oklch(0.92 0.03 186);
  --tt-update-fg: oklch(0.43 0.08 186);
  --tt-warning: oklch(0.530927 0.155556 45.359);
  --tt-error-fg: oklch(0.509494 0.208583 28.513);
  --tt-success: oklch(0.5 0.11 165);
  --tt-message: oklch(0.93 0.012 85);
  --tt-code-bg: oklch(0.96 0.005 85);
  --tt-sidebar: oklch(0.955 0.008 85);
  --tt-sidebar-control: oklch(0.995 0.002 85);
  --tt-row-hover: oklch(0.93 0.01 85);
  --tt-row-active: oklch(0.915 0.02 190);
  --tt-row-selected: oklch(0.895 0.028 188);
  --tt-sidebar-border: oklch(0.87 0.012 82);
  --tt-solid: oklch(0.235 0.014 75);
  --tt-solid-fg: oklch(0.99 0.003 85);
  --tt-shadow: 0 24px 60px -24px rgb(60 50 30 / 35%);
  --p-bg: #ecebe7; --p-fg: #1d1c19; --p-muted: #5f5d57; --p-line: #cfcdc6; --p-chip: #dfddd7; --p-on: #1d1c19; --p-on-fg: #f4f2ec;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--p-bg); color: var(--p-fg); font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-text-size-adjust: 100%; padding-bottom: 90px; }
button { font: inherit; color: inherit; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- prototype chrome ---------- */
.p-head { position: sticky; top: 0; z-index: 50; background: var(--p-bg); border-bottom: 1px dashed var(--p-line); padding: 10px 18px 0; }
.p-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.p-tag { background: var(--p-on); color: var(--p-on-fg); font: 700 11px/1 system-ui, sans-serif; letter-spacing: .06em; padding: 4px 7px; border-radius: 4px; }
.p-title { font-weight: 600; }
.p-note { color: var(--p-muted); font-size: 13px; }
.p-spacer { flex: 1; }
.p-mode { border: 1px solid var(--p-line); background: var(--p-chip); border-radius: 999px; padding: 5px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.p-tabs { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
.p-tabs button { border: 0; background: none; padding: 8px 12px 9px; color: var(--p-muted); border-bottom: 2px solid transparent; white-space: nowrap; cursor: pointer; }
.p-tabs button[aria-selected='true'] { color: var(--p-fg); border-bottom-color: var(--p-on); font-weight: 600; }
.p-controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 14px 18px 10px; }
.p-seg { display: inline-flex; border: 1px solid var(--p-line); border-radius: 999px; padding: 2px; background: var(--p-chip); }
.p-seg button { border: 0; background: none; padding: 4px 11px; border-radius: 999px; cursor: pointer; color: var(--p-muted); }
.p-seg button[aria-pressed='true'] { background: var(--p-on); color: var(--p-on-fg); }
.p-label { color: var(--p-muted); font-size: 12px; }
.p-state { font: 12px/1.4 ui-monospace, Consolas, monospace; color: var(--p-muted); }
.p-warn { border: 1px dashed var(--p-on); border-radius: 6px; padding: 4px 9px; font-size: 12.5px; }
.p-legend { display: inline-flex; gap: 10px; font-size: 12px; color: var(--p-muted); flex-wrap: wrap; }
.p-legend i { display: inline-block; width: 12px; height: 12px; border: 2px dashed; border-radius: 2px; vertical-align: -2px; margin-inline-end: 4px; }
.stage { padding: 0 18px; }
.fit { position: relative; }
.fit > .win { transform-origin: top left; }
.notes { max-width: 980px; padding: 16px 18px 0; color: var(--p-fg); }
.notes h3 { margin: 14px 0 6px; font-size: 14px; }
.notes ul { margin: 0; padding-inline-start: 18px; }
.notes li { margin: 4px 0; color: var(--p-fg); }
.notes code { font: 12.5px ui-monospace, Consolas, monospace; background: var(--p-chip); padding: 0 4px; border-radius: 3px; }
.notes .m { color: var(--p-muted); }
.pill { position: fixed; z-index: 60; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 4px; background: #0b0b0c; color: #fff; border-radius: 999px; padding: 5px; box-shadow: 0 10px 30px rgb(0 0 0 / 45%), 0 0 0 1px rgb(255 255 255 / 14%); font: 13px/1.2 system-ui, sans-serif; max-width: calc(100vw - 20px); }
.pill[hidden] { display: none; }
.pill button { width: 34px; height: 34px; border-radius: 999px; border: 0; background: #2a2b30; color: #fff; cursor: pointer; font-size: 16px; }
.pill span { padding: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-theme='light'] .pill { background: #fff; color: #111; box-shadow: 0 10px 30px rgb(0 0 0 / 22%), 0 0 0 1px rgb(0 0 0 / 12%); }
:root[data-theme='light'] .pill[hidden] { display: none; }
.pill button { background: #ecebe7; color: #111; }

/* ---------- Sotto window ---------- */
.win { position: relative; width: 1280px; height: 800px; background: var(--tt-canvas); color: var(--tt-text); border-radius: 10px; overflow: hidden;
  box-shadow: 0 30px 80px -40px rgb(0 0 0 / 70%), 0 0 0 1px var(--tt-hairline); container: win / inline-size; text-align: start;
  font-family: var(--f-latin); font-size: 14px; --lh-tight: 1.35; --lh-body: 1.6; line-height: var(--lh-tight); font-synthesis: none; }
.win [lang|='ar'], .win[lang|='ar'] { font-family: var(--f-ar); }
.win [lang|='ur'], .win[lang|='ur'] { font-family: var(--f-ur); }
.win [lang='zh-Hans'], .win[lang='zh-Hans'] { font-family: var(--f-zhs); }
.win [lang='zh-Hant'], .win[lang='zh-Hant'] { font-family: var(--f-zht); }
.win [lang|='ja'], .win[lang|='ja'] { font-family: var(--f-ja); }
.win :is([lang|='hi'],[lang|='bn'],[lang|='mr'],[lang|='te'],[lang|='ta']), .win:is([lang|='hi']) { font-family: var(--f-indic); }
.win:lang(ar) { --lh-tight: 1.5; --lh-body: 1.75; }
.win:lang(ur) { --lh-tight: 2.05; --lh-body: 2.3; }
.win:is(:lang(zh), :lang(ja)) { --lh-tight: 1.45; --lh-body: 1.75; line-break: strict; }
.win:lang(hi) { --lh-tight: 1.5; --lh-body: 1.7; }
/* Figtree's tight headline tracking breaks Arabic joins and the Devanagari headline; CJK wants none either. */
.win:is(:lang(ar), :lang(ur), :lang(hi), :lang(zh), :lang(ja)) :is(h1, h2, h3) { letter-spacing: 0 !important; }
.win code, .win pre, .win kbd, .win .mono { font-family: var(--f-mono); }
.win code { unicode-bidi: isolate; direction: ltr; font-size: .87em; background: var(--tt-code-bg); border: 1px solid var(--tt-hairline); border-radius: 5px; padding: 0 5px; white-space: nowrap; }
.win pre { direction: ltr; text-align: left; unicode-bidi: isolate; margin: 0; }
.win bdi { unicode-bidi: isolate; }
.win button { cursor: pointer; }
.win .flip { }
.win[dir='rtl'] .flip { transform: scaleX(-1); }
.ib { display: inline-grid; place-items: center; width: 30px; height: 30px; border: 0; border-radius: 7px; background: none; color: var(--tt-text-muted); }
.ib:hover { background: var(--tt-row-hover); color: var(--tt-text); }
.ib.on { background: var(--tt-sidebar-control); color: var(--tt-text); }
.wc { display: flex; gap: 2px; }
.wc button { width: 34px; height: 30px; border: 0; background: none; color: var(--tt-text-muted); display: grid; place-items: center; border-radius: 6px; }
.wc button:hover { background: var(--tt-row-hover); }
.wc svg.i { width: 15px; height: 15px; stroke-width: 1.5; }
.mark { width: 20px; height: 20px; flex: none; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.seg2 { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0,1fr); background: var(--tt-canvas); border-radius: 9px; padding: 3px; }
:root[data-theme='light'] .seg2 { background: var(--tt-row-hover); }
.seg2 button { border: 0; background: none; color: var(--tt-text-muted); padding: 7px 4px; border-radius: 7px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg2 button.on { background: var(--tt-sidebar); color: var(--tt-text); }
:root[data-theme='light'] .seg2 button.on { background: var(--tt-surface); box-shadow: 0 1px 2px rgb(0 0 0 / 10%); }
.foot-icons { display: flex; align-items: center; gap: 2px; margin-top: 8px; }
.foot-icons .sp { flex: 1; }
:focus-visible { outline: 2px solid var(--tt-accent); outline-offset: 2px; }

/* ---------- Settings ---------- */
.set { display: grid; grid-template-columns: 264px minmax(0, 1fr); height: 100%; }
.set-side { background: var(--tt-sidebar); display: flex; flex-direction: column; min-height: 0; padding: 22px 15px 12px; }
.set-side .brand { padding: 0 8px; height: 30px; }
.set-side h1 { margin: 18px 0 16px; padding: 0 8px; font-size: 24px; font-weight: 600; line-height: 1.25; letter-spacing: -.7px; }
.subnav { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; scrollbar-width: thin; }
.subnav button { display: flex; align-items: center; gap: 11px; min-height: 40px; padding: 8px 12px; border: 0; border-radius: 8px; color: var(--tt-text-muted); background: transparent; text-align: start; font-size: 14px; line-height: var(--lh-tight); }
.subnav button > span { flex: 1; min-width: 0; }
.subnav button:hover { background: var(--tt-row-hover); color: var(--tt-text); }
.subnav button[aria-current='page'] { color: var(--tt-text); background: var(--tt-row-active); }
.subnav button[aria-current='page'] > svg:first-child { color: var(--tt-accent); }
.subnav button .chev { display: none; }
.subnav button[aria-current='page'] .chev { display: block; }
.subnav .sep { height: 1px; background: var(--tt-hairline); margin: 12px 12px; flex: none; }
.set-side .foot { padding-top: 10px; border-top: 1px solid var(--tt-hairline); margin-top: 8px; }
.set-main { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.set-main > .wc { position: absolute; top: 8px; inset-inline-end: 8px; z-index: 3; }
.set-scroll { flex: 1; min-height: 0; overflow: auto; padding: 42px 64px 56px; scrollbar-width: thin; }
.form { max-width: 790px; margin: 0 auto; animation: arrive 180ms ease; }
@keyframes arrive { from { opacity: .55; transform: translateY(3px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .form { animation: none; } }
.heading { padding-bottom: 20px; border-bottom: 1px solid var(--tt-hairline); margin-bottom: 4px; }
.heading h2 { margin: 0 0 8px; font-size: 28px; font-weight: 600; line-height: 1.2; letter-spacing: -1px; }
.heading p { margin: 0; color: var(--tt-text-muted); font-size: 16px; line-height: 1.5; }
.feedback { flex: none; padding: 6px 22px 10px; text-align: end; font-size: 12px; color: var(--tt-text-muted); }
.toast { position: absolute; top: 14px; inset-inline-start: 50%; transform: translateX(-50%); z-index: 6; min-width: 300px; max-width: 70%; background: var(--tt-raised); border: 1px solid var(--tt-hairline); border-inline-start: 2px solid var(--tt-accent); border-radius: 9px; padding: 10px 16px; font-size: 14px; box-shadow: var(--tt-shadow); }
.win[dir='rtl'] .toast { transform: translateX(50%); }
.rows > .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 250px); grid-template-areas: 'label control' 'desc control'; column-gap: 22px; row-gap: 5px; align-items: center; min-height: 66px; padding: 17px 0; border-bottom: 1px solid var(--tt-hairline); position: relative; }
.rows > .row:last-child { border-bottom: 0; }
.row > .lbl { grid-area: label; font-size: 15px; font-weight: 500; line-height: var(--lh-tight); display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; }
.row > .desc { grid-area: desc; margin: 0; max-width: 360px; color: var(--tt-text-muted); font-size: 13px; line-height: var(--lh-tight); }
.row > .ctl { grid-area: control; min-width: 0; position: relative; }
.row.stack { grid-template-columns: minmax(0,1fr); grid-template-areas: 'label' 'desc' 'control'; }
.anchor { color: var(--tt-text-muted); font-weight: 400; font-size: 13px; }
.badge { font-size: 11px; font-weight: 500; color: var(--tt-text-muted); border: 1px solid var(--tt-hairline); border-radius: 999px; padding: 0 7px; line-height: 18px; }
.lbl svg.i { color: var(--tt-text-muted); }
.selectbtn { width: 100%; min-height: 38px; display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 12px; padding-inline: 12px 10px; border: 1px solid var(--tt-hairline); border-radius: 8px; background: var(--tt-surface); color: var(--tt-text); font-size: 14px; text-align: start; line-height: var(--lh-tight); }
.selectbtn > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.selectbtn svg.i { color: var(--tt-text-muted); width: 14px; height: 14px; }
.pop { position: absolute; z-index: 20; top: calc(100% + 6px); inset-inline-end: 0; width: 330px; max-height: 380px; overflow: auto; background: var(--tt-overlay); border: 1px solid var(--tt-hairline); border-radius: 10px; box-shadow: var(--tt-shadow); padding: 6px; scrollbar-width: thin; }
.pop .pnote { padding: 6px 10px 8px; font-size: 12px; color: var(--tt-text-muted); line-height: var(--lh-tight); border-bottom: 1px solid var(--tt-hairline); margin-bottom: 4px; }
.opt { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; cursor: pointer; font-size: 14px; min-height: 36px; }
.opt .chk { width: 16px; color: var(--tt-accent); visibility: hidden; }
.opt[aria-selected='true'] .chk { visibility: visible; }
.opt .endo { flex: none; }
.opt .other { margin-inline-start: auto; color: var(--tt-text-muted); font-size: 12.5px; text-align: end; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.opt.active, .opt:hover { background: var(--tt-row-hover); }
.opt.sys { border-bottom: 1px solid var(--tt-hairline); border-radius: 7px 7px 0 0; margin-bottom: 4px; }
.endo[lang|='ur'] { line-height: 1.9; }

.appearance { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 28px; }
.blk { padding: 18px 0; border-bottom: 1px solid var(--tt-hairline); }
.blk-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.blk-h strong { font-size: 15px; font-weight: 600; flex: 1; }
.ghost { border: 0; background: none; color: var(--tt-text-muted); display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px; font-size: 13.5px; white-space: nowrap; }
.ghost:hover { color: var(--tt-text); background: var(--tt-row-hover); }
.stepper { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 14px; text-align: center; }
.stepper::before { content: ''; position: absolute; top: 9px; inset-inline: 16.6%; height: 1.5px; background: var(--tt-text-muted); opacity: .7; }
.stepper div { position: relative; display: grid; justify-items: center; gap: 8px; font-size: 13px; color: var(--tt-text-muted); line-height: var(--lh-tight); }
.stepper i { width: 19px; height: 19px; border-radius: 50%; border: 1.5px solid var(--tt-text-muted); background: var(--tt-canvas); }
.stepper .on { color: var(--tt-text); font-weight: 600; }

/* annotation overlay: what mirrors, what stays */
.annot [data-ann] { outline: 1.5px dashed; outline-offset: 2px; position: relative; }
.annot [data-ann='m'] { outline-color: #2bb5a4; }

.annot [data-ann]::after { position: absolute; top: -8px; inset-inline-end: 2px; font: 700 9px/13px system-ui, sans-serif; padding: 0 4px; border-radius: 3px; color: #000; direction: ltr; z-index: 7; white-space: nowrap; pointer-events: none; letter-spacing: 0; }
.annot [data-ann='m']::after { content: 'mirrors'; background: #2bb5a4; }

.annot [data-ann='n']::after { content: 'Latin name'; background: #b388ff; }

.annot [data-ann='r'] { outline-color: #ff7eb6; }

@container win (max-width: 1100px) {

@container win (max-width: 699px) {

  .set-side .foot { display: none; }

  .live { display: none; }

  .pop { inset-inline: 0; width: auto; }
  .tcols { grid-template-columns: 1fr; }
  .group > .grid { grid-template-columns: minmax(0,1fr); }
  .toast { min-width: 0; width: calc(100% - 28px); max-width: none; }

  .thr { grid-template-columns: 126px minmax(0,1fr); height: auto; min-height: 720px; }
  .side-top { padding-inline: 10px 4px; }
  .side-top .ib { display: none; }
  .tsearch { margin: 2px 6px 8px; font-size: 12px; padding-inline: 7px; gap: 5px; }
  .proj { padding: 8px 8px 4px; font-size: 13px; gap: 5px; }
  .proj > svg:first-child { display: none; }
  .trow { margin: 1px 3px; padding: 7px 6px; padding-inline-start: 20px; grid-template-columns: minmax(0,1fr); }
  .trow .tt { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 13px; }
  .trow .tm, .trow .pv { display: none; }
  .trow .st { text-align: start; font-size: 11.5px; white-space: normal; }
  .trow .dot { top: 12px; inset-inline-start: 6px; width: 9px; height: 9px; }

  .wc button { width: 26px; }
  .msgs { padding: 10px 10px; gap: 16px; overflow: visible; }
  .msgs p { font-size: 14px; }
  .mu { padding: 10px 12px 12px; }
  .blkc pre { font-size: 11.5px; padding: 8px 10px; }
  .perm { padding: 12px; }
  .perm .cmd { font-size: 11.5px; overflow-x: auto; white-space: nowrap; }
  .composer { margin: 4px 10px 12px; }

}
@media (max-width: 699px) {
  .p-head { padding: 8px 12px 0; }
  .p-note { flex-basis: 100%; }

  .glyphs span:nth-of-type(n+6):nth-of-type(-n+9), .glyphs span:nth-of-type(n+15) { display: none; }
}

function renderRtl() {
  return `<div class="p-controls">

      <span class="p-label">Marks</span><span class="p-seg"><button type="button" data-marks="1" aria-pressed="${st.marks}">On</button><button type="button" data-marks="0" aria-pressed="${!st.marks}">Off</button></span>

      <span class="p-state">lang=${st.rtl} · window dir=${st.layout === 'kept' ? 'ltr · text dir=rtl' : 'rtl'} · body line height <span id="lhOut">…</span></span>
    </div>
    <div class="stage"><div class="fit" data-w="1280" data-h="800" data-reflow="1">${renderThreadsWindow(st.rtl)}</div></div>
    <div class="notes">
      <h3>Kept as in English</h3>
      <ul><li>The window keeps its English layout: the sidebar on the left, the window controls at the top right, and icons, chevrons, buttons and the composer where they are in English.</li>
        <li>Only the words run right to left. Paragraphs, the composer's text and descriptions line up on the right edge of their own box. Short labels such as thread titles, statuses and buttons sit where the English label sits. Each piece of Arabic is isolated from the text around it, so its full stops and the Latin words inside it stay in order.</li></ul>
      <h3>Mirrored</h3>
      <ul><li>The whole window flips: the sidebar moves to the right, your own messages sit on the left, and the agent's text lines up on the right.</li>
        <li>Pointing icons flip: the Settled chevron, the panel toggles, the threads icon and the Output arrow in Settings. Plain shapes like search, the clock, refresh and the paperclip do not. In the permission card, Deny comes first from the right. The window controls move to the top left, with close at the far left, as Arabic Windows draws them.</li></ul>
      <h3>Stays left to right</h3>
      <ul><li>Code, the diff, the terminal, file paths, branch names and project folder names. Each is isolated from the text around it (<code>dir="ltr"</code>, <code>unicode-bidi: isolate</code>), so a path at the end of an Arabic sentence keeps its full stop where it belongs.</li>
        <li>Claude, Codex, Grok, Sotto, Owl and model names like Sonnet 4.5 stay in Latin letters.</li>
        <li>Times and counts go through <code>Intl</code> with a digits choice: ١٢٣ or 123 for Arabic, ۱۲۳ or 123 for Urdu. Code never changes its digits.</li></ul>
      <h3>Type</h3>
      <ul><li>Arabic falls from Figtree to Segoe UI on Windows and Geeza Pro on Apple. Figtree's negative headline tracking is switched off, because it breaks the joins between Arabic letters.</li>
        <li>Urdu in Nastaliq needs a body line height of about 2.3, against 1.75 for Arabic, which makes each line about a third taller. Sidebar rows, the composer and the window controls' row all grow. Windows ships no Nastaliq font by default, so Sotto would have to bundle one. This prototype carries the Arabic-script part of Noto Nastaliq Urdu (239 KB). iPhones and Macs have it built in.</li>
        <li class="m">Before right to left can ship, the real stylesheets need logical properties. For example, <code>crossing-settings.css</code> uses <code>text-align: left</code>, <code>left: 12px; right: 12px</code> and <code>padding-right: 116px</code>.</li></ul>
    </div>`;
}

              <div class="row"><span class="lbl">${esc(h.sc)}</span><p class="desc">${esc(h.scDesc)}</p><div class="ctl"><button class="selectbtn"><span class="mono" dir="ltr" style="font-family:var(--f-latin)">Ctrl+Shift+Space</span></button></div></div>
              <div class="row segrow"><span class="lbl">${esc(h.lim)}</span><div class="ctl">${seg}</div></div>
              <div class="row"><span class="lbl">${esc(h.cue)}</span><p class="desc">${esc(h.cueDesc)}</p><div class="ctl" style="justify-self:end"><span style="display:inline-block;width:36px;height:20px;border-radius:999px;background:var(--tt-accent);position:relative"><i style="position:absolute;top:3px;inset-inline-end:3px;width:14px;height:14px;border-radius:50%;background:var(--tt-accent-fg)"></i></span></div></div>
            </div></div></div>
            <div class="feedback">${esc(s.changesSave)}</div></div></div>
      </div></div></div>
    <div class="notes">
      <h3>What to look at</h3>
      <ul><li>This is the 820×560 minimum window. At this width the real app narrows the Settings sidebar to 178px and gives the controls column at most 210px. Its rule for rows with segmented choices drops the choices under the label, as Recording limit shows.</li>
        <li>Devanagari needs a taller line (1.7 for body text, 1.5 for labels) because vowel signs sit above and below the headline. Descriptions run longer than the English and wrap sooner, so rows grow and the page scrolls sooner. Nothing clips.</li>
        <li>Hindi falls from Figtree to Nirmala UI on Windows and Kohinoor Devanagari on Apple. The heading's negative tracking is off, because it breaks the headline that joins the letters. The <i>Ctrl+Shift+Space</i> chord and Windows stay in Latin.</li>
        <li class="m">On a phone the window is scaled to fit. Switch to Actual 820×560 and scroll sideways to read it at true size.</li></ul>
    </div>`;
}

function layoutSeg() {
  return `<span class="p-label">Layout</span><span class="p-seg"><button type="button" data-layout="kept" aria-pressed="${st.layout === 'kept'}">Kept as in English</button><button type="button" data-layout="mirrored" aria-pressed="${st.layout === 'mirrored'}">Mirrored</button></span>`;
}
// Kept as in English: give Arabic-script text its own direction without moving anything.
const ARABIC = /[؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿]/;
const KEPT_PARA = '.msgs p, .composer .ph, .row > .desc, .pnote, .c-line, .tcol p, .pre-note > span:last-child, .radio .sub';
const KEPT_LEAF = '.tt, .ttl, .st, .tm, .heading h2, .heading p, .perm h4, .live .ready';
function applyKept(win) {
  win.querySelectorAll(KEPT_PARA).forEach(el => { if (ARABIC.test(el.textContent)) { el.dir = 'rtl'; el.dataset.ann = 'r'; } });
  win.querySelectorAll(KEPT_LEAF).forEach(el => { if (ARABIC.test(el.textContent)) { el.dir = 'rtl'; el.classList.add('kl'); el.dataset.ann = 'r'; } });
  win.querySelectorAll('input[type=search]').forEach(el => { el.dir = (ARABIC.test(el.placeholder) && !el.value) ? 'rtl' : 'auto'; });
  const walk = document.createTreeWalker(win, NodeFilter.SHOW_TEXT);
  const hits = [];
  while (walk.nextNode()) {
    const n = walk.currentNode, pe = n.parentElement;
    if (!ARABIC.test(n.nodeValue) || pe.closest('code, pre, .mono, .endo, [dir="rtl"], [dir="ltr"]:not(.win)')) continue;
    hits.push(n);
  }
  hits.forEach(n => { const sp = document.createElement('span'); sp.dir = 'rtl'; sp.dataset.ann = 'r'; n.replaceWith(sp); sp.appendChild(n); });
}

/* ================= render + fit ================= */
const TABS = [['settings', 'Settings: language picker'], ['rtl', 'Arabic, right to left'], ['cjk', 'Chinese and Japanese'], ['hindi', 'Hindi at 820×560']];
function render(focus) {
  document.documentElement.dataset.theme = st.mode;
  const mb = document.getElementById('modeBtn');
  mb.innerHTML = `${ic(st.mode === 'dark' ? 'moon' : 'sun')}<span>${st.mode === 'dark' ? 'Dark' : 'Light'}</span>`;
  mb.setAttribute('aria-label', `Switch to ${st.mode === 'dark' ? 'light' : 'dark'}`);
  document.getElementById('tabs').innerHTML = TABS.map(([k, l]) => `<button type="button" role="tab" aria-selected="${st.screen === k}" data-screen="${k}">${l}</button>`).join('');
  const prevScroll = document.getElementById('setScroll')?.scrollTop ?? 0;
  const html = st.screen === 'settings' ? renderSettings() : st.screen === 'rtl' ? renderRtl() : st.screen === 'cjk' ? renderCjk() : renderHindi();
  document.getElementById('screen').innerHTML = html;
  document.querySelectorAll('.win.kept').forEach(applyKept);
  const sc = document.getElementById('setScroll'); if (sc && focus !== 'top') sc.scrollTop = prevScroll;
  const pill = document.getElementById('pill');
  pill.hidden = st.screen !== 'settings';
  document.getElementById('pillLabel').textContent = `${st.variant} — ${VARIANTS[st.variant]}`;
  syncUrl(); fit();
  if (focus && focus !== 'top') { const el = document.getElementById(focus); if (el) { el.focus({ preventScroll: true }); if (el.tagName === 'INPUT') { try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} } } }
  if (st.open) document.getElementById(`opt-${st.active}`)?.scrollIntoView({ block: 'nearest' });
  const lh = document.getElementById('lhOut'); if (lh) { const p = document.querySelector('.msgs p'); if (p) lh.textContent = getComputedStyle(p).lineHeight + ' (' + getComputedStyle(p).fontSize + ' text)'; }
  const fo = document.getElementById('fontOut'); if (fo) fo.textContent = st.cjk === 'ja' ? 'Yu Gothic UI / Hiragino Sans' : 'Microsoft YaHei UI / PingFang SC';
}
function fit() {
  const phone = window.innerWidth < 700;
  document.querySelectorAll('.fit').forEach(f => {
    const w = +f.dataset.w, h = +f.dataset.h, win = f.firstElementChild;
    if (phone && f.dataset.reflow) { win.style.transform = ''; win.style.width = '100%'; win.style.height = 'auto'; f.style.height = ''; return; }
    win.style.width = w + 'px'; win.style.height = h + 'px';
    const cs = getComputedStyle(f.parentElement);
    const avail = f.parentElement.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const s = f.dataset.actual ? 1 : Math.min(1, avail / w);
    win.style.transform = s < 1 ? `scale(${s})` : '';
    f.style.height = (h * s) + 'px'; f.style.width = f.dataset.actual ? w + 'px' : '';
  });
}
window.addEventListener('resize', fit);

function choose(code) {
  const was = st.ui; st.ui = code; st.open = false;
  if (code !== was) {
    const loc = shownLocale(); st.toast = S[loc].saved;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { st.toast = ''; const t = document.querySelector('.toast'); if (t) t.remove(); }, 2600);
  }
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button, .opt, [data-screen]');
  if (e.target.closest('#modeBtn')) { st.mode = st.mode === 'dark' ? 'light' : 'dark'; return render(); }
  const tab = e.target.closest('[data-screen]'); if (tab) { st.screen = tab.dataset.screen; st.open = false; window.scrollTo(0, 0); return render('top'); }
  const v = e.target.closest('[data-variant]'); if (v) { st.variant = v.dataset.variant; st.open = false; st.search = ''; return render('top'); }
  const u = e.target.closest('[data-ui]'); if (u) { choose(u.dataset.ui); return render(); }
  const ly = e.target.closest('[data-layout]'); if (ly) { st.layout = ly.dataset.layout; return render(); }
  const r = e.target.closest('[data-rtl]'); if (r) { st.rtl = r.dataset.rtl; return render(); }
  const d = e.target.closest('[data-digits]'); if (d) { st.digits = d.dataset.digits; return render(); }
  const mk = e.target.closest('[data-marks]'); if (mk) { st.marks = mk.dataset.marks === '1'; return render(); }
  const c = e.target.closest('[data-cjk]'); if (c) { st.cjk = c.dataset.cjk; return render(); }
  const hl = e.target.closest('[data-hl]'); if (hl) { st.hl = hl.dataset.hl; return render(); }
  const ac = e.target.closest('[data-actual]'); if (ac) { st.actual = ac.dataset.actual === '1'; return render(); }
  if (e.target.closest('#prevV')) return cycle(-1);
  if (e.target.closest('#nextV')) return cycle(1);
  if (e.target.closest('#langBtn')) { st.open = !st.open; st.active = Math.max(0, optionList().findIndex(o => o.code === st.ui)); return render('langBtn'); }
  const opt = e.target.closest('.opt'); if (opt) { choose(opt.dataset.code); return render('langBtn'); }
  if (e.target.closest('#discBtn')) { st.disclose = !st.disclose; st.search = ''; return render('discBtn'); }
  if (e.target.closest('#useSys')) { choose('system'); return render('discBtn'); }
  if (st.open && !e.target.closest('.pop')) { st.open = false; render(); }
});
document.addEventListener('change', (e) => {
  if (e.target.matches('input[type=radio][name^=lang]')) { choose(e.target.value); render(); const el = document.querySelector(`input[name="${e.target.name}"][value="${e.target.value}"]`); el?.focus({ preventScroll: true }); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'langSearch') { st.search = e.target.value; render('langSearch'); }
});
function cycle(dir) { const k = ['A', 'B', 'C']; st.variant = k[(k.indexOf(st.variant) + dir + 3) % 3]; st.open = false; st.search = ''; render('top'); }
document.addEventListener('keydown', (e) => {
  if (st.open) {
    const n = optionList().length;
    if (e.key === 'Escape') { e.preventDefault(); st.open = false; return render('langBtn'); }
    if (e.key === 'ArrowDown') { e.preventDefault(); st.active = (st.active + 1) % n; return render('langBtn'); }
    if (e.key === 'ArrowUp') { e.preventDefault(); st.active = (st.active - 1 + n) % n; return render('langBtn'); }
    if (e.key === 'Home') { e.preventDefault(); st.active = 0; return render('langBtn'); }
    if (e.key === 'End') { e.preventDefault(); st.active = n - 1; return render('langBtn'); }
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(optionList()[st.active].code); return render('langBtn'); }
    if (e.key === 'Tab') { st.open = false; render(); return; }
    return;
  }
  if (e.key === 'Escape' && st.disclose && document.activeElement?.closest('#discBody')) { st.disclose = false; return render('discBtn'); }
  if (st.screen !== 'settings') return;
  const a = document.activeElement;
  if (a && (a.matches('input, textarea, select, [contenteditable], [role=combobox], [role=listbox]'))) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); cycle(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); cycle(1); }
});
render(st.open ? 'langBtn' : undefined);
document.fonts && document.fonts.ready.then(() => render(st.open ? 'langBtn' : undefined));
</script>
</body>
