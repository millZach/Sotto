<!doctype html><meta charset="utf-8"><title>Prototype: readable text without announcements</title><link rel="stylesheet" href="../src/renderer/src/styles/global.css"><style>body{padding:40px}section{margin-block:24px}.tt-visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}pre{white-space:pre-wrap}</style><h1>Prototype: readable text without announcements</h1><p>Check that the visual count and code remain unchanged, while ordinary hidden text supplies the spoken wording.</p><section><span id="visual" aria-hidden="true">1 / 9</span><span id="spoken" class="tt-visually-hidden">Question 1 of 9</span><button id="next">Continue</button><button id="back">Back</button></section><section><p>Pairing code</p><span aria-hidden="true">K7MX 3QPD</span><span class="tt-visually-hidden">Pairing code K 7 M X 3 Q P D</span></section><pre id="state"></pre><script>let step=1;function show(){visual.textContent=step+' / 9';spoken.textContent='Question '+step+' of 9';state.textContent=JSON.stringify({step,spoken:spoken.textContent,liveRegions:0,visualCode:'K7MX 3QPD',spokenCode:'Pairing code K 7 M X 3 Q P D'},null,2)}next.onclick=()=>{step=Math.min(9,step+1);show()};back.onclick=()=>{step=Math.max(1,step-1);show()};show()</script>
