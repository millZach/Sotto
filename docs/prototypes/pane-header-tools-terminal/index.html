<style>

*{box-sizing:border-box}body{margin:0;background:var(--tt-chrome);color:var(--tt-text);font:15px/1.45 Figtree,system-ui,sans-serif}button{font:inherit;color:inherit}

.thread-workspace__head{display:flex;align-items:center;gap:4px;flex:none;height:44px;padding:0 6px 0 18px}

.thread-workspace__crumb{display:flex;flex:0 1 auto;align-items:center;gap:7px;min-width:0;color:var(--tt-text-muted);font-size:13px}.thread-workspace__crumb::before{flex:none;content:'/'}.thread-workspace__crumb>span:first-of-type{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@container thread-pane (max-width:720px){.git-action__quick{padding:0 7px}.git-action__label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.thread-workspace__head{padding-left:14px}}

/* ---- Proposed: the name gives way first. Its floor comes from its own length, so it never holds a short name open. In a narrow pane today's sharing stands ---- */
[data-mode=new] .thread-workspace__head h2{flex:0 1000 auto;min-width:min(calc(var(--name-length)*.38em),14em,30cqi)}
@container thread-pane (max-width:720px){[data-mode=new] .thread-workspace__head h2{flex:0 1 auto;min-width:3em}}
:focus-visible{outline:2px solid var(--tt-accent-text);outline-offset:1px}
.menu{position:absolute;z-index:5;right:6px;top:42px;width:280px;padding:6px;background:var(--tt-surface);border:1px solid var(--tt-hairline);border-radius:12px;box-shadow:var(--tt-shadow)}.menu div{display:flex;justify-content:space-between;padding:7px 10px;border-radius:8px;color:var(--tt-text-2);font-size:14px}.menu i{font-style:normal;color:var(--tt-text-muted);font-size:12px}.menu hr{border:0;border-top:1px solid var(--tt-hairline);margin:5px 4px}

.close{margin-top:14px}.close h2{font-size:14px;font-weight:600;margin:0 0 6px}.closebar{display:flex;flex-wrap:wrap;gap:4px;padding:10px;border:1px solid var(--tt-hairline);border-radius:10px;background:var(--tt-canvas);width:max-content;max-width:100%;zoom:1.25}
.strip{overflow-x:auto;border:1px solid var(--tt-hairline);border-radius:10px;background:var(--tt-canvas)}.stripPane{container:thread-pane/inline-size}

</style></head><body><div class="page" id="app"></div>
<script>
const I=(p,s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ic={tools:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/>',term:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 15h18"/>',more:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',commit:'<circle cx="12" cy="12" r="3"/><line x1="3" x2="9" y1="12" y2="12"/><line x1="15" x2="21" y1="12" y2="12"/>',chev:'<path d="m6 9 6 6 6-6"/>',folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',branch:'<path d="M15 6a9 9 0 0 0-9 9V3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>',mark:'<circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/>'};
const OWL='<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M1.27 4.8C0.84 3.93 0.73 2.31 1.49 1.22C1.63 0.95 1.93 0.68 2.06 1.22C2.12 2.03 2.71 2.9 3.93 2.9C5.83 2.2 10.17 1.76 12.94 3.34C13.69 3.28 14.4 2.71 14.45 1.82C14.51 1.57 14.73 1.57 14.83 1.98C15.32 2.58 15.54 4.26 14.94 5.56C15.38 6.1 15.7 7.46 15.7 9.63C15.76 12.12 15.29 13.37 13.97 14.24C12.75 15.19 10.17 15.24 8 15.24C5.8 15.24 3.23 15.19 2.01 14.24C0.68 13.37 0.22 12.12 0.27 9.63C0.24 7.19 0.52 5.83 1.27 4.8Z"/></svg>';
const LONG='Fix the desktop thread top bar so the Tools and Terminal symbols come back beside Watch and a long thread name gives way first',SHORT='Top bar fix',OTHER='Footer links on the marketing site point at the old docs path and the help page is a 404';
const s={mode:'new',width:Math.max(820,Math.min(1920,1920)),split:false,host:'local',remote:'grey',theme:'dark',name:'long',fit:true,tools:false,toolsFor:'a',drawers:{},focused:'a',menu:null,working:false,tip:''};
const MEDIUM='Footer links point at the old docs path';const threads={a:()=>s.name==='long'?LONG:s.name==='medium'?MEDIUM:SHORT,b:()=>OTHER};
const hereHost=()=>s.host==='forge';
function header(id){
 const f=s.focused===id,neu=s.mode==='new',remote=hereHost(),open=!!s.drawers[id];
 const toolsBtn=neu?`<button class="pane-action" data-act="tools" data-id="${id}" aria-label="Tools" aria-pressed="${s.tools&&s.toolsFor===id}" title="Tools${s.working?' · Agents are working':''}">${I(ic.tools)}${s.working?'<span class="tools-dot"></span>':''}</button>`:'';
 const termBtn=!neu?'':remote?(s.remote==='grey'?`<button class="pane-action" data-act="termfar" data-id="${id}" aria-label="Terminal drawer" aria-disabled="true" title="This thread's terminal is on forge. Open it there.">${I(ic.term)}</button>`:''):`<button class="pane-action" data-act="term" data-id="${id}" aria-label="Terminal drawer" aria-pressed="${open}" aria-keyshortcuts="Control+J" title="${open?'Hide':'Show'} terminal drawer (Ctrl+J)">${I(ic.term)}</button>`;
 return `<header class="thread-workspace__head"><div class="thread-workspace__title">${I(ic.mark)}<h2 style="--name-length:${threads[id]().length}" title="${threads[id]()}" data-act="name" data-id="${id}">${threads[id]()}</h2>
 <span class="thread-workspace__crumb"><span title="Sotto">Sotto</span><span class="chipline" title="sotto/556ec175">${I(ic.folder,13)}<span>sotto/556ec175</span></span></span>
 <span class="thread-workspace__branches"><span class="chipline" title="fix/pane-header-tools-terminal">${I(ic.branch,13)}<span>fix/pane-header-tools-terminal</span>${I(ic.chev,13)}</span></span></div>
 <div class="thread-workspace__actions"><span class="git-action"><button class="git-action__quick" title="Commit">${I(ic.commit)}<span class="git-action__label">Commit</span></button><button class="git-action__more" aria-label="More Git actions">${I(ic.chev,13)}</button></span>
 <button class="watch-toggle" aria-pressed="false">${OWL}<span>Watch</span></button>${toolsBtn}${termBtn}
 <button class="pane-action" data-act="menu" data-id="${id}" aria-label="More actions" aria-expanded="${s.menu===id}" title="More actions">${I(ic.more)}${!neu&&s.working&&f?'<span class="tools-dot"></span>':''}</button>
 ${s.split?`<button class="pane-action" data-act="closepane" aria-label="Close pane" title="Close pane (Ctrl+Shift+W)">${I(ic.x)}</button>`:''}</div>
 ${s.menu===id?menu(id):''}</header>`}
function menu(id){const n=s.mode==='new',row=(a,b='')=>`<div>${a}<i>${b}</i></div>`;
 return `<div class="menu" role="menu" aria-label="More actions">${row('Open beside')}${n?'':row('Tools')}${!n&&!hereHost()?row('Terminal drawer','Ctrl+J'):''}${s.split?row('Zoom pane','Ctrl+Shift+M')+row('Move pane '+(id==='a'?'right':'left')):''}<hr>${row('Rename')}${row('Continue on another machine…')}<hr>${row('Settle','Ctrl+Shift+E')}</div>`}
function pane(id){return `<section class="pane" data-pane="${id}" data-focused="${s.focused===id}" data-split="${s.split}">${header(id)}
 <div class="body"><b>You</b>${id==='a'?'Fix the desktop thread top bar.':'Fix the footer links.'}<br><br><b>Claude</b>Working on it.</div><div class="compose">What would you like to do next?</div>
 ${s.drawers[id]?`<div class="drawer"><em>Terminal drawer · opens below the thread</em>$ git status<br>On branch fix/pane-header-tools-terminal</div>`:''}</section>`}
function render(){
 document.documentElement.dataset.theme=s.theme;
 const chips=(k,opts,label)=>`<div class="group"><b>${label}</b>${opts.map(([v,t])=>`<button class="chip" data-set="${k}" data-val="${v}" aria-pressed="${String(s[k])===String(v)}">${t}</button>`).join('')}</div>`;
 const overlay=s.width<1100;const canSplit=s.width>=1080+(s.tools&&!overlay?420:0);const twoShown=s.split&&canSplit;
 app.innerHTML=`<h1>Thread top bar: Tools and Terminal back beside Watch</h1><p class="lede">Press the symbols; they work. Drag the width to see the name give way. On a computer, point at the name for its full text. On a phone, tap it.</p>
 <div class="controls">${chips('mode',[['now','Today'],['new','Proposed']],'Compare')}
 <label class="slider"><b style="font-weight:500;color:var(--tt-text-muted);font-size:13px">Window</b><input type="range" min="820" max="1920" step="10" value="${s.width}" data-input="width" aria-label="Window width"><output>${s.width} px</output></label>
 ${chips('split',[[false,'One pane'],[true,'Two panes']],'Panes')}${chips('name',[['long','Long'],['medium','Medium'],['short','Short']],'Name')}
 ${chips('host',[['local','This computer'],['forge','forge (paired host)']],'Thread runs on')}
 ${s.host==='forge'&&s.mode==='new'?chips('remote',[['grey','A: greyed, says why'],['hide','B: hidden, as before']],'Terminal there'):''}
 ${chips('working',[[false,'Idle'],[true,'Agents working']],'Tools dot')}${chips('theme',[['dark','Dark'],['light','Light']],'Theme')}${chips('fit',[[true,'Fit screen'],[false,'Actual size']],'View')}</div>
 <div class="wrap" id="wrap"><div class="scaler" id="scaler" style="width:${s.width}px" data-mode="${s.mode}"><div class="win"><aside class="side"><p class="on">Top bar fix</p><p>Footer links</p><p>Weekly note</p></aside>
 <div class="panes">${pane(twoShown?'a':s.focused)}${twoShown?pane('b'):''}</div>${s.tools?`<aside class="tools" data-overlay="${overlay}"><b>Tools · ${threads[s.toolsFor]().slice(0,34)}…</b>Opens beside the thread, as it always has${overlay?' (over it in a narrow window)':''}.<ul><li>Browser</li><li>Terminal</li><li>Files</li><li>Changes</li><li>Pull request</li><li>Agents</li></ul></aside>`:''}</div></div></div>
 <p class="readout" id="readout" role="status"></p>
 <div class="close" data-mode="${s.mode}"><h2>The whole bar at actual size (swipe along it on a phone)</h2><div class="strip" id="strip"><div class="stripPane" style="width:${stripWidth(twoShown,overlay)}px">${header(s.focused).replace(/<div class="menu"[\s\S]*?<\/div><\/header>/,"</header>")}</div></div><h2 style="margin-top:14px">The symbols up close</h2><div class="closebar">${closeup()}</div><p class="keys">Keyboard: Tab reaches Watch, Tools, Terminal drawer, More actions in that order. Ctrl+J still shows and hides the drawer. Each symbol's name is read out and its pressed state with it.${s.split?(canSplit?'':' This window is too narrow for two panes side by side, so the app shows one at a time on tabs.')+' In two panes every pane has the same symbols, so nothing moves when focus changes. Tools in the other pane moves to that thread and opens, and never closes on that first press.':''}</p></div>`;
 fit();measure();}
function stripWidth(two,overlay){const a=s.width-280-(s.tools&&!overlay?420:0);return two?Math.floor(a/2):a}
function closeup(){const t=document.createElement('div');t.innerHTML=header(s.focused);const a=t.querySelector('.thread-workspace__actions');a.querySelectorAll('.menu').forEach(m=>m.remove());return a.innerHTML}
function fit(){const w=document.getElementById('wrap'),c=document.getElementById('scaler'),sc=s.fit?Math.min(1,w.clientWidth/s.width):1;c.style.transform=sc===1?'':`scale(${sc})`;w.style.height=(400*sc+2)+'px'}
function measure(){const out=[];document.querySelectorAll('.win .pane').forEach(p=>{const h=p.querySelector('h2'),a=p.querySelector('.thread-workspace__actions'),t=p.querySelector('.thread-workspace__title');const cut=h.scrollWidth>h.clientWidth,pr=p.getBoundingClientRect(),ar=a.getBoundingClientRect();const name=Math.round(h.clientWidth),full=h.scrollWidth,fits=ar.right<=pr.right+1&&ar.left>=pr.left;out.push(`<strong>${p.dataset.pane==='a'?'Pane':'Second pane'}:</strong> pane ${Math.round(p.offsetWidth)} px wide, name shows ${name} of ${full} px${cut?' (cut off with …)':' (whole)'}; symbols ${fits?'all fit':'DO NOT FIT'}.`)});document.getElementById('readout').innerHTML=out.join('<br>')+(s.tip?`<br><strong>Hover:</strong> ${s.tip}`:'')}
addEventListener('resize',()=>{fit()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&s.menu){s.menu=null;render()}if((e.ctrlKey||e.metaKey)&&e.key==='j'&&!hereHost()&&s.mode==='new'){e.preventDefault();s.drawers[s.focused]=!s.drawers[s.focused];render()}});
document.addEventListener('input',e=>{if(e.target.dataset.input==='width'){s.width=+e.target.value;const v=e.target.value;render();const n=document.querySelector('[data-input=width]');n.focus();n.value=v}});
document.addEventListener('click',e=>{const set=e.target.closest('[data-set]');if(set){const k=set.dataset.set,v=set.dataset.val;s[k]=v==='true'?true:v==='false'?false:v;if(k==='split'&&!s[k]){s.focused='a';if(s.toolsFor==='b')s.toolsFor='a'}s.tip='';render();return}
 const el=e.target.closest('[data-act]'),pn=e.target.closest('.pane');let wasIdle=false;if(pn){wasIdle=s.focused!==pn.dataset.pane;s.focused=pn.dataset.pane;if(s.tools)s.toolsFor=s.focused}
 if(!el){if(s.menu)s.menu=null;if(pn||s.menu===null)render();return}
 const id=el.dataset.id||s.focused,act=el.dataset.act;s.tip='';
 if(act==='tools'){if(wasIdle){s.tools=true;s.toolsFor=id}else{s.tools=!s.tools;s.toolsFor=id}}
 if(act==='term')s.drawers[id]=!s.drawers[id];if(act==='termfar')s.tip="This thread's terminal is on forge. Open it there.";if(act==='menu')s.menu=s.menu===id?null:id;else s.menu=null;
 if(act==='name')s.tip=threads[id]();if(act==='closepane'){s.split=false;s.focused='a'}render()});
render();
</script></body></html>
