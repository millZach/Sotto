<!doctype html>
<!--
  Throwaway prototype. Not product code.
  Question: Drake is unhappy with the Watcher room's bottom bar (WatcherDock): its look, its place and what it holds.
  Which of these ten directions should go further? Frame 0 is today; 1-10 each move the design, the position and the
  set of controls. Every frame is a real 1280x800 window in Citrine dark.
  Picked: (pending)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watcher room: ten directions for the bottom bar</title>
<style>
  :root {
    --canvas:#121211; --surface:#1a1a19; --elevated:#1d1d1b; --raised:#2a2a27; --line:#2e2e2b; --hair:#262624;
    --text:#ecebe6; --muted:#9a9890; --faint:#6d6b64; --scene:#34342f; --accent:#e8c547; --on-accent:#1a1600;
    --accent-soft:rgba(232,197,71,.14); --bad:#e5735f; --ok:#7fb77e; --shadow:rgba(0,0,0,.55);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:#0b0b0a; color:var(--text); font:14px/1.4 Figtree, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .intro { max-width:1280px; margin:0 auto; padding:28px 0 8px; }
  .intro h1 { font-size:18px; font-weight:600; margin:0 0 6px; }
  .intro p { margin:0; color:var(--muted); max-width:760px; }
  section.d { width:1280px; margin:0 auto; padding:28px 0 20px; }
  section.d h2 { font-size:15px; font-weight:600; margin:0 0 4px; display:flex; gap:10px; align-items:baseline; }
  section.d h2 b { color:var(--accent); font-weight:700; }
  section.d .why { margin:0; color:var(--muted); font-size:13px; max-width:1100px; }
  section.d .moved { margin:4px 0 12px; font-size:13px; }
  section.d .moved span { color:var(--faint); }

  /* ---------- the window ---------- */
  .win { position:relative; width:1280px; height:800px; overflow:hidden; background:var(--canvas); border:1px solid var(--line); border-radius:10px; --cb:24px; }
  .scene { position:absolute; top:44px; margin:0; font:12px/14px ui-monospace, Menlo, monospace; color:var(--scene); white-space:pre; pointer-events:none; overflow:hidden; }
  .scene .star { color:#57564f; }
  .owls { position:absolute; font:12px/14px ui-monospace, Menlo, monospace; white-space:pre; color:#7d7b72; }
  .owls i { font-style:normal; color:var(--accent); background:var(--accent-soft); border-radius:4px; }
  .head { position:absolute; top:0; left:0; right:0; height:44px; display:flex; align-items:center; gap:14px; padding:0 14px; }
  .lights { display:flex; gap:8px; margin-right:6px; }
  .lights i { width:12px; height:12px; border-radius:50%; background:#ff5f57; }
  .lights i:nth-child(2) { background:#febc2e; } .lights i:nth-child(3) { background:#28c840; }
  .brand { display:flex; align-items:center; gap:8px; font-weight:600; font-size:15px; }
  .owltile { width:24px; height:24px; border-radius:6px; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; }
  .all { display:flex; align-items:center; gap:6px; color:var(--text); font-size:13px; }
  .all em { font-style:normal; color:var(--muted); }
  .tabs { display:flex; padding:3px; border:1px solid var(--line); border-radius:8px; background:var(--surface); font-size:13px; }
  .tabs span { padding:4px 11px; border-radius:6px; color:var(--text); }
  .tabs span em { font-style:normal; color:var(--muted); margin-left:4px; }
  .tabs span.on { background:var(--raised); }
  .glance { position:absolute; top:50px; left:260px; display:flex; gap:18px; font-size:13px; align-items:center; }
  .glance b { color:var(--accent); font-weight:600; }
  .glance u { text-decoration:underline; text-underline-offset:3px; font-weight:600; }
  .glance span { color:var(--muted); margin-left:6px; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; border:1.6px solid var(--accent); margin-right:6px; }
  .dot.bad { border-color:var(--bad); }
  .rule { position:absolute; top:86px; left:260px; width:760px; height:1px; background:var(--line); }
  .col { position:absolute; left:260px; width:760px; top:96px; bottom:calc(var(--cb) + 148px); display:flex; flex-direction:column; justify-content:flex-end; gap:22px; overflow:hidden; font-size:15px; }
  .who { display:flex; gap:8px; align-items:center; font-size:13px; font-weight:600; margin-bottom:8px; }
  .who time { color:var(--muted); font-weight:400; }
  .you { margin-left:90px; padding:16px 18px 22px; border:1px solid var(--line); border-radius:10px; background:var(--elevated); }
  .composer { position:absolute; left:260px; width:760px; bottom:var(--cb); height:136px; border:1px solid var(--line); border-radius:12px; background:var(--elevated); padding:16px 16px 12px; display:flex; flex-direction:column; }
  .composer .ph { color:var(--muted); font-size:15px; flex:1; }
  .cfoot { display:flex; align-items:center; gap:8px; }
  .chip { display:flex; align-items:center; gap:6px; height:28px; padding:0 10px; border:1px solid var(--line); border-radius:14px; font-size:13px; color:var(--text); }
  .send { margin-left:auto; width:28px; height:28px; border-radius:50%; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; }
  svg.i { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  svg.owl { width:16px; height:16px; fill:currentColor; flex:none; }
  .ib { width:30px; height:30px; display:grid; place-items:center; border-radius:7px; color:var(--muted); flex:none; }
  .ib.on { background:var(--raised); color:var(--text); }
  .sep { width:1px; height:18px; background:var(--line); margin:0 4px; flex:none; }
  .lit { color:var(--text); }
  .lit svg.owl { color:var(--accent); }
  .note { position:absolute; font-size:11px; color:var(--faint); letter-spacing:.02em; }
  .card { position:absolute; background:var(--elevated); border:1px solid var(--line); border-radius:10px; box-shadow:0 14px 34px -12px var(--shadow); padding:6px; font-size:13px; }
  .row { display:flex; align-items:center; gap:10px; height:32px; padding:0 10px; border-radius:6px; color:var(--text); }
  .row svg { color:var(--muted); }
  .row.on { background:var(--raised); }
  .row kbd { margin-left:auto; font:11px Figtree, system-ui, sans-serif; color:var(--faint); }
  .row .new { margin-left:auto; width:7px; height:7px; border-radius:50%; background:var(--accent); }
  .row.cap { height:24px; font-size:11px; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; }
  .hr { height:1px; background:var(--line); margin:5px 4px; }

  /* 0 today */
  .today { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); height:42px; display:flex; align-items:center; gap:2px; padding:0 5px; border:1px solid var(--hair); border-radius:10px; background:var(--elevated); box-shadow:0 8px 22px -10px var(--shadow); }
  .today .t { height:32px; padding:0 14px; display:flex; align-items:center; font-size:13px; color:var(--muted); border-radius:7px; }
  .today .t.on { background:var(--raised); padding:0 10px; }
  .resttab { position:absolute; bottom:16px; left:calc(50% + 200px); width:56px; height:21px; border:1px solid var(--hair); border-radius:10px; display:grid; place-items:center; color:var(--muted); }

  /* 1 head strip */
  .hs { margin-left:auto; display:flex; align-items:center; gap:2px; }
  .seg { display:flex; padding:2px; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
  .seg .ib { width:28px; height:26px; border-radius:6px; }

  /* 3 left rail */
  .rail { position:absolute; left:0; top:44px; bottom:0; width:60px; border-right:1px solid var(--hair); background:color-mix(in srgb, var(--surface) 80%, transparent); display:flex; flex-direction:column; align-items:center; padding:10px 0 14px; gap:6px; }
  .rt { width:48px; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0 5px; border-radius:8px; color:var(--muted); font-size:10.5px; }
  .rt.on { background:var(--raised); color:var(--text); }
  .rt.on svg.owl { color:var(--accent); }
  .rail .grow { flex:1; }

  /* 4 corner owl */
  .cornerowl { position:absolute; left:20px; bottom:24px; width:44px; height:44px; border-radius:12px; background:var(--elevated); border:1px solid var(--line); display:grid; place-items:center; color:var(--accent); box-shadow:0 8px 22px -10px var(--shadow); }
  .cornerowl svg.owl { width:22px; height:22px; }
  .badge { position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--accent); color:var(--on-accent); font-size:11px; font-weight:700; display:grid; place-items:center; }

  /* 5 status bar */
  .status { position:absolute; left:0; right:0; bottom:0; height:30px; border-top:1px solid var(--line); background:var(--surface); display:flex; align-items:center; gap:14px; padding:0 10px; font-size:12px; color:var(--muted); }
  .status .rooms { display:flex; gap:2px; }
  .status .rooms span { padding:3px 8px; border-radius:5px; }
  .status .rooms span.on { color:var(--text); background:var(--raised); }
  .status .live { display:flex; gap:14px; align-items:center; margin:0 auto; }
  .status .live b { color:var(--accent); font-weight:600; }
  .meter { display:inline-block; width:34px; height:5px; border-radius:3px; background:var(--raised); margin-left:6px; vertical-align:middle; overflow:hidden; }
  .meter i { display:block; height:100%; background:var(--muted); }
  .status .ib { width:24px; height:24px; }
  .status .jump { color:var(--text); }

  /* 6 split corners */
  .lc { position:absolute; left:24px; bottom:24px; width:150px; display:flex; flex-direction:column; gap:2px; padding:4px; border:1px solid var(--hair); border-radius:10px; background:var(--elevated); }
  .lc .row { height:30px; }
  .lc .row.on svg.owl { color:var(--accent); }
  .rc { position:absolute; right:24px; bottom:24px; display:flex; gap:2px; padding:4px; border:1px solid var(--hair); border-radius:10px; background:var(--elevated); }

  /* 7 composer foot */
  .pair { display:flex; padding:2px; border:1px solid var(--line); border-radius:14px; }
  .pair .ib { width:30px; height:22px; border-radius:11px; }

  /* 8 edge reveal */
  .tray { position:absolute; left:0; right:0; bottom:0; height:64px; border-top:1px solid var(--line); background:var(--surface); box-shadow:0 -14px 30px -18px var(--shadow); display:flex; align-items:center; justify-content:center; gap:6px; }
  .tt { display:flex; align-items:center; gap:8px; height:40px; padding:0 14px; border-radius:9px; color:var(--muted); font-size:13px; }
  .tt.on { background:var(--raised); color:var(--text); }
  .tt.on svg.owl { color:var(--accent); }
  .tray .sep { height:26px; margin:0 8px; }
  .edge { position:absolute; left:50%; transform:translateX(-50%); bottom:4px; width:120px; height:3px; border-radius:2px; background:var(--raised); }

  /* 9 watch column */
  .wcol { position:absolute; right:0; top:44px; bottom:0; width:60px; border-left:1px solid var(--hair); background:color-mix(in srgb, var(--surface) 80%, transparent); display:flex; flex-direction:column; align-items:center; padding:10px 0 14px; gap:6px; }
  .wcol .cap { font-size:9.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.08em; margin-top:14px; }
  .td { width:30px; height:22px; display:grid; place-items:center; border-radius:6px; }
  .td i { width:9px; height:9px; border-radius:50%; background:var(--faint); }
  .td.need i { background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .td.bad i { background:var(--bad); }
  .td.run i { background:transparent; border:1.6px solid var(--ok); }
  .td.hover { background:var(--raised); }
  .tip { position:absolute; right:66px; padding:5px 9px; border-radius:6px; background:var(--raised); border:1px solid var(--line); font-size:12px; white-space:nowrap; }
  .newest { width:44px; display:flex; flex-direction:column; align-items:center; gap:1px; padding:6px 0; border-radius:8px; background:var(--accent-soft); color:var(--accent); font-size:11px; font-weight:600; }
  .wcol .grow { flex:1; }

  /* 10 news line */
  .switch2 { display:flex; padding:2px; border:1px solid var(--line); border-radius:9px; background:var(--surface); }
  .switch2 span { display:flex; align-items:center; gap:7px; height:28px; padding:0 11px; border-radius:7px; font-size:13px; color:var(--muted); }
  .switch2 span.on { background:var(--raised); color:var(--text); font-weight:600; }
  .switch2 span.on svg.owl { color:var(--accent); }
  .news { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(var(--cb) + 146px); display:flex; align-items:center; gap:10px; height:34px; padding:0 6px 0 12px; border:1px solid var(--line); border-radius:17px; background:var(--elevated); box-shadow:0 8px 22px -10px var(--shadow); font-size:13px; }
  .news em { font-style:normal; color:var(--muted); }
  .news .go { display:flex; align-items:center; gap:6px; height:24px; padding:0 10px; border-radius:12px; background:var(--accent); color:var(--on-accent); font-weight:600; font-size:12px; }
</style>
</head>
<body>
<div class="intro">
  <h1>Watcher room: ten directions for the bottom bar</h1>
  <p>Frame 0 is today's pill. Frames 1 to 10 each change where it sits, how it looks and what it holds. Every frame is a real 1280x800 window in Citrine dark.</p>
</div>
<div id="frames"></div>
<script>
const P = 'M1.27 4.8C0.84 3.93 0.73 2.31 1.49 1.22C1.63 0.95 1.93 0.68 2.06 1.22C2.12 2.03 2.71 2.9 3.93 2.9C5.83 2.2 10.17 1.76 12.94 3.34C13.69 3.28 14.4 2.71 14.45 1.82C14.51 1.57 14.73 1.57 14.83 1.98C15.32 2.58 15.54 4.26 14.94 5.56C15.38 6.1 15.7 7.46 15.7 9.63C15.76 12.12 15.29 13.37 13.97 14.24C12.75 15.19 10.17 15.24 8 15.24C5.8 15.24 3.23 15.19 2.01 14.24C0.68 13.37 0.22 12.12 0.27 9.63C0.24 7.19 0.52 5.83 1.27 4.8ZM1.84 8.95C1.82 7.05 2.25 6.07 3.66 6.07C5.34 6.02 6.75 6.21 6.73 8.54C6.73 10.44 6.1 11.31 4.34 11.31C2.58 11.34 1.82 10.58 1.84 8.95ZM9.33 9.22C9.33 8.14 9.63 7.67 10.44 7.46L13.1 6.92C13.8 6.78 14.13 7.46 14.13 8.81C14.16 10.71 13.69 11.34 11.66 11.34C10.17 11.34 9.33 10.71 9.33 9.22Z'
const s = d => `<svg class="i" viewBox="0 0 16 16">${d}</svg>`
const I = {
  owl: `<svg class="owl" viewBox="0 0 16 16"><path fill-rule="evenodd" d="${P}"/></svg>`,
  usage: s('<path d="M2.5 13.5h11M4.5 11V7.5M8 11V4M11.5 11V6"/>'),
  gear: s('<circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.7M8 12.5v1.7M1.8 8h1.7M12.5 8h1.7M3.6 3.6l1.2 1.2M11.2 11.2l1.2 1.2M3.6 12.4l1.2-1.2M11.2 4.8l1.2-1.2"/>'),
  help: s('<circle cx="8" cy="8" r="6"/><path d="M6.3 6.4a1.8 1.8 0 1 1 2.5 1.6c-.5.2-.8.6-.8 1.1v.3"/><path d="M8 11.4v.1"/>'),
  mic: s('<rect x="6" y="2" width="4" height="7.6" rx="2"/><path d="M3.8 8a4.2 4.2 0 0 0 8.4 0M8 12.2V14"/>'),
  threads: s('<path d="M2.5 3h8.5a1 1 0 0 1 1 1v5.5a1 1 0 0 1-1 1H6.5L4 12.6v-2.1H2.5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14.5 6.5v5.5h-1.5v1.8L11 12"/>'),
  refresh: s('<path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v2.8h-2.8"/>'),
  more: s('<path d="M4 8h.01M8 8h.01M12 8h.01" stroke-width="2.4"/>'),
  down: s('<path d="M8 3v10M4 9l4 4 4-4"/>'),
  chev: s('<path d="M5 6.5l3 3 3-3"/>'),
  list: s('<path d="M5.5 4h8M5.5 8h8M5.5 12h8M2.5 4h.01M2.5 8h.01M2.5 12h.01"/>'),
  clip: s('<path d="M13 7.5 8 12.5a3 3 0 0 1-4.2-4.2l5.3-5.3a2 2 0 0 1 2.8 2.8L6.6 11a1 1 0 0 1-1.4-1.4L9.8 5"/>'),
  pen: s('<path d="M10.5 2.5l3 3L6 13H3v-3z"/>'),
  up: s('<path d="M8 13V3M4 7l4-4 4 4"/>'),
  check: s('<path d="M3.5 8.5l3 3 6-7"/>'),
  scheme: s('<circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11"/>'),
}

// The night scene: a deterministic ASCII grove in the room's margins, as WatcherNightScene draws it.
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
function scene(width, seed, mirror) {
  const r = rng(seed), cols = Math.floor(width / 7.22), rows = 54, chars = '-=+*#%:=#*'
  const trees = [{ c: .18, top: 10, w: 6 }, { c: .55, top: 18, w: 5 }, { c: .85, top: 6, w: 7 }].map(t => ({ ...t, c: Math.round((mirror ? 1 - t.c : t.c) * cols) }))
  let out = ''
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      let d = y > rows * .74 ? .35 + (y - rows * .74) / (rows * .26) * .6 : 0
      for (const t of trees) if (y > t.top && Math.abs(x - t.c) < 1 + t.w * (y - t.top) / (rows - t.top)) d = Math.max(d, y > rows * .62 && Math.abs(x - t.c) < 2 ? .9 : .55)
      const v = r()
      if (v < d) out += chars[Math.floor(r() * chars.length)]
      else if (y < rows * .45 && v > .992) out += `<span class="star">${r() > .5 ? '*' : '+'}</span>`
      else if (v > .97) out += '.'
      else out += ' '
    }
    out += '\n'
  }
  return out
}

function frame(o = {}) {
  const left = o.leftInset ?? 0, right = o.rightInset ?? 0
  const head = o.head ?? `<div class="lights"><i></i><i></i><i></i></div>
    <div class="brand"><span class="owltile">${I.owl}</span>Watcher</div>
    <div class="all">${I.list} All threads <em>8</em> ${I.chev}</div>
    <div class="tabs"><span class="on">Conversation</span><span>Watched<em>3</em></span><span>Visualize</span></div>${o.headRight ?? ''}`
  const glance = o.glance === false ? '' : `<div class="glance"><b>2 need you</b><div><i class="dot"></i><u>Visual gate flake</u><span>permission</span></div><div><i class="dot bad"></i><u>Streaming WAV stall</u><span>last turn failed</span></div></div><div class="rule"></div>`
  const foot = `<div class="cfoot">${o.footLeft ?? ''}<span class="ib" style="width:24px">${I.clip}</span><span class="chip">${I.pen} New Watcher</span><span class="chip">GPT-5.4 ${I.chev}</span><span class="chip">Ask for approval ${I.chev}</span>${o.footRight ?? ''}<span class="send" ${o.footRight ? 'style="margin-left:6px"' : ''}>${I.up}</span></div>`
  return `<div class="win" style="--cb:${o.cb ?? 24}px">
    <pre class="scene" style="left:${left}px;width:${240 - left / 2}px">${scene(240, 7, false)}</pre>
    <pre class="scene" style="left:1036px;width:${244 - right}px">${scene(244, 11, true)}</pre>
    <div class="owls" style="left:1044px;top:430px">{o,o}  <i>{0,0}</i>\n/)__)  <i>/)__)</i>\n -"-"   <i>-"-"</i></div>
    <div class="head">${head}</div>
    ${glance}
    <div class="col" style="${o.glance === false ? 'top:56px' : ''}">
      <div><div class="who">${I.owl} Watcher <time>12:36 pm</time></div>Watching it. Package (Windows) is still running for message 18.</div>
      <div class="you"><div class="who">You <time>12:37 pm</time></div>Is the release thread green yet? (19)</div>
      <div><div class="who">${I.owl} Watcher <time>12:38 pm</time></div>Package (Windows) passed. Release thread finished; Streaming WAV stall failed its last turn and needs you.</div>
      <div class="you"><div class="who">You <time>12:39 pm</time></div>Show me what the WAV stall says.</div>
    </div>
    <div class="composer"><div class="ph">Ask about your threads, or say what to start or send</div>${foot}</div>
    ${o.overlay ?? ''}
  </div>`
}

const room = (cls = 'ib') => `<span class="${cls}">${I.mic}</span><span class="${cls} on lit">${I.owl}</span><span class="${cls}">${I.threads}</span>`
const pages = `<span class="ib">${I.usage}</span><span class="ib">${I.gear}</span><span class="ib">${I.help}</span>`

const D = [
  { n: 0, name: 'Today', moved: 'Usage, Settings, Help | Dictate, Watcher, Threads | update, in a pill under the composer that shrinks to a tab at rest.',
    why: 'Shown open. It costs its own band under the composer on every Watcher page, sits apart from the window strip where the room\'s other controls live, and hides at rest so you hover to find it.',
    o: { cb: 74, overlay: `<div class="today">${pages}<span class="sep"></span><span class="t">Dictate</span><span class="t on lit">${I.owl}</span><span class="t">Threads</span><span class="sep"></span><span class="ib">${I.refresh}</span></div>
