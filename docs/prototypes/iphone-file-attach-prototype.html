<!--
  PROTOTYPE, throwaway: attaching files from the iPhone reply box, three variants switched by ?variant=
  Question: how does the iPhone attach a file to a reply, and how does it show it before and after sending?
  Variants: A Pills (files are one-line pills under the photos, as on the desktop), B Rows (each file is a row across
  the top of the reply box), C Stack (files fold into one chip that opens a sheet listing them).
  Also ?state=ready|adding|large|many|host|textonly, ?open=quicklook|desktop, ?theme=light, ?width=320, ?zoom=0.75.
  Every phone is live: press +, then Files, pick some, Open, remove one, Send, then press a sent file. Changing the
  variant, the state or how a sent file opens starts the phones again.
  Settled already: a + button opens a menu, photos wait inside the reply box above the words and stand above them
  once sent (ADR-0031, October 3 amendment). Limits (ADR-0131): a file at most 25 MB, a reply at most 8 attachments
  and 50 MB in all, photos 10 MB each and 20 MB between them. Files reach the computer through its file-staging
  feature, in parts. Colours are the iPhone's default Sotto palette (apps/ios/Sotto/ThemePalettes.swift) as --tt-*
  tokens. Figtree (OFL-1.1) is inlined from src/shared/fonts/figtree-latin.woff2, so the file makes no network
  requests. No host calls, no persistence: open the file in a browser.
-->

/* The iPhone's Sotto palette, dark and light (ThemePalettes.swift, sottoDark and sottoLight). */
:root, [data-theme='dark'] {
  color-scheme: dark;
  --tt-canvas: #040507; --tt-surface: #090a0e; --tt-raised: #111316; --tt-overlay: #18191d;
  --tt-text: #f9fafd; --tt-muted: #a0a5ae; --tt-placeholder: #94979e; --tt-border: #2a2f39;
  --tt-accent: #47b8a9; --tt-on-accent: #070f0e; --tt-accent-text: #6bc3b6;
  --tt-bubble: #14171e; --tt-bubble-ink: #f9fafd; --tt-danger-text: #ff7673; --tt-code: #0b0c10;
  --tt-sheet: #18191d; --tt-island: #000000;
  --tt-scrim: rgb(0 0 0 / 0.5); --tt-shadow: rgb(0 0 0 / 0.45);
  /* The page around the phones. */
  --tt-page: #0d0e11; --tt-page-raised: #17181c; --tt-page-line: #2c2e35; --tt-page-text: #eceef2; --tt-page-muted: #a7abb4; --tt-bezel: #000000;
}
[data-theme='light'] {
  color-scheme: light;
  --tt-canvas: #f9f8f5; --tt-surface: #fdfcf9; --tt-raised: #f2f0ec; --tt-overlay: #efece8;
  --tt-text: #221d17; --tt-muted: #68625b; --tt-placeholder: #6f6961; --tt-border: #d5d0c8;
  --tt-accent: #007d74; --tt-on-accent: #fdfcf9; --tt-accent-text: #1e665e;
  --tt-bubble: #ebe7df; --tt-bubble-ink: #221d17; --tt-danger-text: #b5312e; --tt-code: #f3f2ee;
  --tt-sheet: #fdfcf9; --tt-island: #000000;
  --tt-scrim: rgb(24 18 10 / 0.3); --tt-shadow: rgb(60 48 30 / 0.2);
  --tt-page: #e6e3dd; --tt-page-raised: #f4f2ee; --tt-page-line: #cdc8bf; --tt-page-text: #1f1b16; --tt-page-muted: #57524b; --tt-bezel: #16171a;
}
:root {
  /* Derived the way Design.swift derives them: the ink at a low opacity. */
  --tt-hairline: color-mix(in srgb, var(--tt-text) 10%, transparent);
  --tt-fill-soft: color-mix(in srgb, var(--tt-text) 7%, transparent);
  --tt-fill-ring: color-mix(in srgb, var(--tt-text) 18%, transparent);
  --tt-glass: color-mix(in srgb, var(--tt-surface) 84%, transparent);
  --tt-menu-gap: color-mix(in srgb, var(--tt-text) 7%, var(--tt-sheet));
  /* A picture's own pixels and a PDF's page: the same in both themes. */
  --tt-photo-bg: #1b2431; --tt-photo-bar: #273244; --tt-photo-side: #151c27; --tt-photo-line: #56627a;
  --tt-photo-accent: #4cc3b2; --tt-photo-warn: #f0a43a; --tt-photo-board: #ece9e1; --tt-photo-ink: #2e2e33; --tt-photo-red: #d9484c;
  --tt-paper: #fbfaf7; --tt-paper-ink: #24211c; --tt-paper-muted: #5d5850; --tt-paper-line: #dcd8d0; --tt-paper-head: #eeebe5;
  /* The prototype's own bar, not part of the design. */
  --tt-proto-bg: #0b0b0d; --tt-proto-text: #f4f4f6; --tt-proto-muted: #b9bcc4; --tt-proto-hover: #24252b; --tt-proto-focus: #6ee7d8;
  --z: 1;
}
body[data-width='375'] { --pw: 375px; --ph: 812px; }
body[data-width='320'] { --pw: 320px; --ph: 693px; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; padding-bottom: calc(150px + env(safe-area-inset-bottom)); background: var(--tt-page); color: var(--tt-page-text); font: 15px/1.5 Figtree, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
button, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--tt-accent-text); outline-offset: 2px; }
svg { display: block; flex: none; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- the page ---------- */
.top { max-width: 1240px; padding: 28px 32px 20px; }
.kicker { margin: 0 0 6px; color: var(--tt-page-muted); font-size: 13px; letter-spacing: .02em; }
h1 { margin: 0 0 10px; font-size: 28px; font-weight: 650; letter-spacing: -.02em; line-height: 1.2; }
.lede { margin: 0 0 6px; max-width: 880px; }
.lede--muted { color: var(--tt-page-muted); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin: 18px 0 8px; }
.group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.glabel { color: var(--tt-page-muted); font-size: 13px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border: 1px solid var(--tt-page-line); border-radius: 11px; background: var(--tt-page-raised); }
.seg button { min-height: 40px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--tt-page-muted); font-size: 13.5px; font-weight: 500; cursor: pointer; }
.seg button:hover { color: var(--tt-page-text); }
.seg button[aria-pressed='true'] { background: var(--tt-page); color: var(--tt-page-text); box-shadow: 0 1px 2px var(--tt-shadow); }
.plain { min-height: 40px; padding: 0 14px; border: 1px solid var(--tt-page-line); border-radius: 10px; background: transparent; color: var(--tt-page-text); font-size: 13.5px; font-weight: 500; cursor: pointer; }
.plain:hover { background: var(--tt-page-raised); }
.scenario { margin: 6px 0 0; max-width: 880px; }
.notes { display: grid; gap: 10px; max-width: 980px; margin-top: 14px; }
.pnote { margin: 0; padding: 10px 14px; border: 1px dashed var(--tt-page-line); border-radius: 10px; color: var(--tt-page-muted); font-size: 13.5px; line-height: 1.5; }
.pnote b { color: var(--tt-page-text); font-weight: 600; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; margin-top: 8px; }
.opt { padding: 10px 12px; border: 1px solid var(--tt-page-line); border-radius: 9px; }
.opt[data-on='true'] { border-color: var(--tt-accent-text); }
.opt p { margin: 4px 0 0; }

.board { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 40px 32px; padding: 8px 32px 0; }
.cell { width: calc((var(--pw) + 20px) * var(--z)); margin: 0; }
.frame { zoom: var(--z); width: calc(var(--pw) + 20px); padding: 10px; border-radius: 56px; background: var(--tt-bezel); box-shadow: 0 30px 60px -30px var(--tt-shadow); }
.cap { margin-top: 12px; font-size: 14px; }
.cap b { display: block; font-weight: 600; }
.cap span { display: block; color: var(--tt-page-muted); font-size: 13.5px; line-height: 1.45; }

/* ---------- inside the phone ---------- */
.phone { position: relative; isolation: isolate; display: flex; flex-direction: column; width: var(--pw); height: var(--ph); overflow: hidden; border-radius: 46px; background: var(--tt-canvas); color: var(--tt-text); font: 15.5px/1.45 Figtree, ui-sans-serif, system-ui, -apple-system, sans-serif; }
.phone :focus-visible { outline: 2px solid var(--tt-accent); outline-offset: 2px; }
.sb { position: relative; z-index: 45; flex: none; display: flex; align-items: center; justify-content: space-between; height: 50px; padding: 4px 30px 0 40px; font-size: 16px; font-weight: 600; }
.sb__icons { display: flex; align-items: center; gap: 6px; }
.island { position: absolute; left: 50%; top: 11px; width: 118px; height: 34px; border-radius: 20px; background: var(--tt-island); transform: translateX(-50%); }
body[data-width='320'] .sb { padding: 4px 22px 0 30px; }
body[data-width='320'] .island { width: 100px; }
.nav { flex: none; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 4px; height: 44px; padding: 0 14px 0 6px; }
.nav__back { display: grid; place-items: center; width: 44px; height: 44px; color: var(--tt-accent-text); }
.nav__title { overflow: hidden; font-size: 16px; font-weight: 600; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
.nav__pill { padding: 3px 10px; border: 1px solid var(--tt-hairline); border-radius: 999px; background: var(--tt-fill-soft); color: var(--tt-muted); font-size: 12px; font-weight: 600; }
.home { position: absolute; left: 50%; bottom: 8px; z-index: 50; width: 128px; height: 5px; border-radius: 3px; background: var(--tt-text); opacity: .85; transform: translateX(-50%); pointer-events: none; }

/* The conversation */
.convo { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 8px 16px 14px; overflow-y: auto; scrollbar-width: none; }
.convo::-webkit-scrollbar { display: none; }
.spacer { flex: 1 0 0; }
.msg-user { align-self: flex-end; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; width: calc(100% - 48px); }
.bubble { max-width: 100%; padding: 10px 14px; border: 1px solid color-mix(in srgb, var(--tt-accent) 12%, transparent); border-radius: 20px 20px 6px 20px; background: var(--tt-bubble); color: var(--tt-bubble-ink); overflow-wrap: anywhere; }
.msg-agent p { margin: 0; }
.who { display: flex; align-items: center; gap: 8px; margin: 0 0 6px !important; color: var(--tt-muted); font-size: 12px; font-weight: 600; }
.mark { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 6px; background: color-mix(in srgb, var(--tt-accent) 22%, transparent); color: var(--tt-accent-text); font-size: 10px; font-weight: 700; }

/* A name cut in the middle, so the extension stays. */
.cut { display: flex; min-width: 0; white-space: nowrap; }
.cut__head { min-width: 1em; overflow: hidden; text-overflow: ellipsis; }
.cut__head:empty { display: none; }
.cut__tail { flex: none; }

/* Sent photos and files */
.sphoto { display: block; flex: none; max-width: 100%; padding: 0; overflow: hidden; border: 0; border-radius: 16px; background: var(--tt-raised); cursor: zoom-in; }
.sphoto > svg { width: 100%; height: 100%; }
.spills { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; max-width: 100%; margin: 0; padding: 0; list-style: none; }
.spills > li { display: flex; max-width: 100%; }
.spill { position: relative; display: flex; align-items: center; gap: 6px; max-width: 100%; min-width: 0; height: 36px; padding: 0 12px 0 10px; border: 1px solid var(--tt-hairline); border-radius: 10px; background: var(--tt-fill-soft); color: var(--tt-text); font-size: 13.5px; text-align: left; }
button.spill { cursor: pointer; }
button.spill::before { content: ''; position: absolute; inset: -4px 0; }
.spill > svg { color: var(--tt-muted); }
.spill__size { flex: none; color: var(--tt-muted); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.shint { margin: 0; color: var(--tt-muted); font-size: 13px; text-align: right; }
.scards { display: flex; flex-direction: column; gap: 6px; width: min(100%, 280px); margin: 0; padding: 0; list-style: none; }
.scards > li { display: flex; }

/* File rows: B in the reply box, B's sent cards, and C's sheets */
.frows { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
.frow { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 4px 0 4px 8px; overflow: hidden; border: 0; border-radius: 14px; background: var(--tt-fill-soft); color: var(--tt-text); text-align: left; }
.scards .frow { min-height: 56px; padding-right: 12px; border: 1px solid var(--tt-hairline); }
.sheet .frow { padding-right: 4px; }
.sheet .frow--plain, .sheet button.frow { padding-right: 12px; }
button.frow { cursor: pointer; }
.frow > svg { color: var(--tt-muted); }
.frow__icon { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 9px; background: var(--tt-raised); color: var(--tt-muted); }
.frow__text { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.frow__name { font-size: 14.5px; font-weight: 500; }
.frow__meta { overflow: hidden; color: var(--tt-muted); font-size: 12.5px; font-variant-numeric: tabular-nums; text-overflow: ellipsis; white-space: nowrap; }
.frow__bar { position: absolute; left: 0; bottom: 0; width: calc(var(--p, 0) * 1%); height: 3px; background: var(--tt-accent); }
.xbtn { flex: none; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 12px; background: transparent; color: var(--tt-muted); cursor: pointer; }
.xbtn:disabled { opacity: .5; cursor: default; }

/* The reply box */
.dockwrap { position: relative; z-index: 5; flex: none; margin: 2px 10px 26px; }
.dockwrap--menu { z-index: 22; }
.dock { padding: 6px; border: 1px solid var(--tt-hairline); border-radius: 26px; background: var(--tt-glass); -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4); box-shadow: 0 8px 18px -6px var(--tt-shadow); }
.dock--full { border-radius: 22px; }
.dock:has(.field:focus) { border-color: color-mix(in srgb, var(--tt-accent) 55%, transparent); box-shadow: 0 0 18px -2px color-mix(in srgb, var(--tt-accent) 35%, transparent); }
.dock__row { display: flex; align-items: flex-end; gap: 8px; }
.dock__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.dock__body > :first-child:not(.field) { margin-top: 4px; }
.dock__top { display: flex; flex-direction: column; gap: 6px; padding: 2px 0 6px; }
.dock__note { padding: 0 8px 6px; }
.field { display: block; width: 100%; min-height: 44px; max-height: 154px; margin: 0; padding: 11px 0; overflow-y: auto; border: 0; outline: 0; resize: none; background: transparent; color: var(--tt-text); font: 16px/22px Figtree, ui-sans-serif, system-ui, -apple-system, sans-serif; }
.field::placeholder { color: var(--tt-placeholder); opacity: 1; }
.field:focus-visible { outline: 0; }
.field:disabled { color: var(--tt-muted); }
.rb { flex: none; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: var(--tt-raised); color: var(--tt-text); cursor: pointer; }
.plus[aria-expanded='true'] { background: var(--tt-overlay); box-shadow: inset 0 0 0 2px var(--tt-accent); }
.plus:disabled { color: var(--tt-muted); cursor: default; }
.send { background: var(--tt-fill-soft); color: var(--tt-muted); }
.send--on { background: var(--tt-accent); color: var(--tt-on-accent); }
.send[aria-disabled='true'] { cursor: default; }
.spin { width: 18px; height: 18px; border: 2.5px solid color-mix(in srgb, var(--tt-on-accent) 30%, transparent); border-top-color: var(--tt-on-accent); border-radius: 50%; }
.notice { margin: 0; color: var(--tt-danger-text); font-size: 13.5px; line-height: 1.4; overflow-wrap: anywhere; }

/* Photos waiting in the box, at their own shape, 88 pt tall */
.strip { display: flex; gap: 6px; margin: 0; padding: 0; overflow-x: auto; list-style: none; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.thumb { position: relative; flex: none; height: 88px; overflow: hidden; border-radius: 12px; background: var(--tt-surface); }
.thumb > svg.shot { width: 100%; height: 100%; }
.veil { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--tt-canvas) 55%, transparent); }
.thumb__x { position: absolute; top: 0; right: 0; display: flex; align-items: flex-start; justify-content: flex-end; width: 44px; height: 44px; padding: 5px; border: 0; background: transparent; cursor: pointer; }
.xdot { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: color-mix(in srgb, var(--tt-text) 85%, transparent); color: var(--tt-canvas); }

/* Progress */
.ring { flex: none; display: block; width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(var(--tt-accent) calc(var(--p, 0) * 1%), var(--tt-fill-ring) 0); -webkit-mask: radial-gradient(circle, transparent 5px, var(--tt-text) 5.5px); mask: radial-gradient(circle, transparent 5px, var(--tt-text) 5.5px); }
.ring--lg { width: 28px; height: 28px; -webkit-mask: radial-gradient(circle, transparent 9px, var(--tt-text) 10px); mask: radial-gradient(circle, transparent 9px, var(--tt-text) 10px); }
.bar { display: block; height: 4px; margin: 12px 0 8px; overflow: hidden; border-radius: 2px; background: var(--tt-fill-ring); }
.bar > span { display: block; width: calc(var(--p, 0) * 1%); height: 100%; background: var(--tt-accent); }

/* A: pills */
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.pill { display: flex; align-items: center; gap: 5px; max-width: 100%; min-width: 0; height: 36px; padding-left: 8px; border: 1px solid var(--tt-hairline); border-radius: 10px; background: var(--tt-fill-soft); font-size: 13.5px; }
.pill__icon { display: grid; color: var(--tt-muted); }
.pill__size { flex: none; color: var(--tt-muted); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill__x { position: relative; flex: none; display: grid; place-items: center; width: 40px; height: 34px; padding: 0; border: 0; border-radius: 0 9px 9px 0; background: transparent; color: var(--tt-muted); cursor: pointer; }
.pill__x::before { content: ''; position: absolute; inset: -5px 0 -5px -4px; }
.pill__x:disabled { opacity: .5; cursor: default; }

/* C: the stack chip */
.stack { display: flex; align-self: flex-start; align-items: center; gap: 6px; max-width: 100%; min-height: 44px; padding: 0 8px; border: 1px solid var(--tt-hairline); border-radius: 12px; background: var(--tt-fill-soft); color: var(--tt-text); font-size: 14px; text-align: left; cursor: pointer; }
.msg-user .stack { align-self: flex-end; }
.stack__icon { display: grid; place-items: center; width: 20px; color: var(--tt-muted); }
.stack__text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stack__text b { font-weight: 600; }
.stack > svg:last-child { color: var(--tt-muted); }

/* The + menu */
.menu { position: absolute; left: 0; bottom: calc(100% + 8px); width: 250px; max-width: 100%; overflow: hidden; border: 1px solid var(--tt-hairline); border-radius: 14px; background: var(--tt-sheet); box-shadow: 0 20px 50px var(--tt-shadow); }
.menu__group + .menu__group { border-top: 8px solid var(--tt-menu-gap); }
.mi { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 48px; padding: 0 16px; border: 0; background: transparent; color: var(--tt-text); font-size: 17px; text-align: left; cursor: pointer; }
.mi + .mi { border-top: 1px solid var(--tt-hairline); }
.mi:hover { background: var(--tt-fill-soft); }
.mi:focus-visible { outline-offset: -2px; }
.mi[aria-disabled='true'] { color: var(--tt-muted); cursor: default; }
.mi[aria-disabled='true']:hover { background: transparent; }
.mi__why { margin: 0; padding: 2px 16px 12px; color: var(--tt-muted); font-size: 13px; line-height: 1.4; }

/* Sheets: the Files picker stand-in and C's lists */
.scrim { position: absolute; inset: 0; z-index: 20; background: var(--tt-scrim); }
.scrim--clear { background: transparent; }
.sheet { position: absolute; left: 0; right: 0; top: 56px; bottom: 0; z-index: 30; display: flex; flex-direction: column; border-radius: 14px 14px 0 0; background: var(--tt-sheet); box-shadow: 0 -12px 40px var(--tt-shadow); }
.sheet--short { top: auto; max-height: calc(100% - 120px); }
.grabber { flex: none; width: 36px; height: 5px; margin: 6px auto 0; border-radius: 3px; background: var(--tt-fill-ring); }
.sheet__bar { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 4px; padding: 2px 6px; border-bottom: 1px solid var(--tt-hairline); }
.sheet__bar > :first-child { justify-self: start; }
.sheet__bar > :last-child { justify-self: end; }
.sheet__title { margin: 0; font-size: 17px; font-weight: 600; text-align: center; white-space: nowrap; }
.tbtn { min-height: 44px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: var(--tt-accent-text); font-size: 17px; cursor: pointer; }
.tbtn--strong { font-weight: 600; }
.tbtn:disabled { color: var(--tt-muted); cursor: default; }
.sheet__scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 12px; }
.sheet__foot { flex: none; margin: 0; padding: 10px 16px 30px; border-top: 1px solid var(--tt-hairline); color: var(--tt-muted); font-size: 13px; text-align: center; }
.sheet__foot--tight { padding-bottom: 10px; }
.sheet__actions { flex: none; padding: 0 12px 30px; }
.wide { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; border: 0; border-radius: 14px; background: var(--tt-fill-soft); color: var(--tt-accent-text); font-size: 16px; font-weight: 600; cursor: pointer; }
.wide:disabled { color: var(--tt-muted); cursor: default; }
.pk__group { margin: 12px 4px 6px; color: var(--tt-muted); font-size: 13px; font-weight: 600; }
.pk__group:first-child { margin-top: 4px; }
.pk__list { margin: 0; padding: 0; overflow: hidden; border-radius: 12px; background: var(--tt-fill-soft); list-style: none; }
.pk { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 8px 12px; border: 0; background: transparent; color: var(--tt-text); text-align: left; cursor: pointer; }
.pk__list li + li .pk { border-top: 1px solid var(--tt-hairline); }
.pk:focus-visible { outline-offset: -2px; }
.pk__check { flex: none; display: grid; place-items: center; width: 22px; height: 22px; border: 1.5px solid var(--tt-muted); border-radius: 50%; color: var(--tt-on-accent); }
.pk[aria-pressed='true'] .pk__check { border-color: var(--tt-accent); background: var(--tt-accent); }
.pk__tile { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 34px; height: 42px; border: 1px solid var(--tt-hairline); border-radius: 6px; background: var(--tt-raised); color: var(--tt-muted); }
.pk__tile b { font-size: 8.5px; font-weight: 700; letter-spacing: .04em; }
.pk__text { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.pk__name { overflow: hidden; font-size: 16px; text-overflow: ellipsis; white-space: nowrap; }
.pk__meta { color: var(--tt-muted); font-size: 13px; }

/* Quick Look */
.look { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; background: var(--tt-surface); }
.look__bar { flex: none; display: grid; grid-template-columns: 72px minmax(0, 1fr) 72px; align-items: center; padding: 50px 6px 6px; border-bottom: 1px solid var(--tt-hairline); background: var(--tt-sheet); }
.look__bar > .tbtn { justify-self: start; }
.look__title { min-width: 0; display: flex; flex-direction: column; align-items: center; }
.look__title h2 { max-width: 100%; margin: 0; font-size: 15px; font-weight: 600; }
.look__title span { color: var(--tt-muted); font-size: 12px; }
.look__body { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 18px 16px 40px; overflow: auto; }
.look__wait { width: min(260px, 100%); margin: auto; text-align: center; }
.look__wait p { margin: 0; }
.look__wait .muted { color: var(--tt-muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.look__text { width: 100%; margin: 0; padding: 14px; border-radius: 12px; background: var(--tt-code); color: var(--tt-text); font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.look__none { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 260px; margin: auto; color: var(--tt-muted); text-align: center; }
.look__none p { margin: 0; }
.look__none b { color: var(--tt-text); font-weight: 600; overflow-wrap: anywhere; }
.look__photo { width: 100%; margin: auto 0; overflow: hidden; border-radius: 4px; }
.look__photo > svg { width: 100%; height: auto; }
.paper { display: flex; flex-direction: column; gap: 7px; width: min(320px, 100%); aspect-ratio: 8.5 / 11; padding: 22px 20px; border-radius: 3px; background: var(--tt-paper); color: var(--tt-paper-ink); font-size: 10px; line-height: 1.4; box-shadow: 0 8px 24px var(--tt-shadow); }
.paper__h { font-size: 15px; font-weight: 700; }
.paper__sub, .paper__pg { color: var(--tt-paper-muted); }
.paper__sec { margin-top: 6px; font-size: 11px; font-weight: 700; }
.paper__pg { margin-top: auto; text-align: center; }
.pl { display: block; height: 5px; border-radius: 3px; background: var(--tt-paper-line); }
.paper table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.paper th, .paper td { padding: 3px 4px; border-bottom: 1px solid var(--tt-paper-line); text-align: right; }
.paper th:first-child, .paper td:first-child { text-align: left; }
.paper th { background: var(--tt-paper-head); font-weight: 600; }

/* ---------- the prototype's variant bar (not part of the design) ---------- */
.vbar { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 100; display: flex; align-items: center; gap: 6px; width: min(660px, calc(100% - 20px)); padding: 6px; border-radius: 18px; background: var(--tt-proto-bg); color: var(--tt-proto-text); box-shadow: 0 12px 36px var(--tt-shadow); outline: 1px solid color-mix(in srgb, var(--tt-proto-text) 14%, transparent); transform: translateX(-50%); }
.vbar button { flex: none; width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: inherit; font-size: 18px; cursor: pointer; }
.vbar button:hover { background: var(--tt-proto-hover); }
.vbar button:focus-visible { outline: 2px solid var(--tt-proto-focus); outline-offset: 1px; }
.vbar__lab { flex: 1; min-width: 0; line-height: 1.3; text-align: center; }
.vbar__lab b { display: block; font-size: 14px; font-weight: 600; }
.vbar__lab span { display: block; color: var(--tt-proto-muted); font-size: 12.5px; }

@media (prefers-reduced-motion: no-preference) {
  .spin { animation: spin .8s linear infinite; }
  .menu.is-new { animation: pop .16s ease-out; }
  .sheet.is-new { animation: rise .26s cubic-bezier(.2, .8, .2, 1); }
  .look.is-new { animation: fade .2s ease-out; }
  .seg button, .mi, .plain, .vbar button { transition: background-color 120ms ease, color 120ms ease; }
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pop { from { opacity: 0; transform: scale(.94); transform-origin: bottom left; } }
@keyframes rise { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }

/* On a phone the page drops the bezel, so the prototype looks the way it would on the device. */
@media (max-width: 460px) {
  .top { padding: 18px 16px 12px; }
  .board { gap: 28px; padding: 0; }
  .cell { width: 100%; }
  .frame { zoom: 1; width: auto; padding: 0; border-radius: 0; background: transparent; box-shadow: none; }
  .phone { width: min(var(--pw), 100vw); margin: 0 auto; border-radius: 0; }
  .cap { padding: 0 16px; }
}
@media (pointer: coarse) { .seg button, .plain { min-height: 44px; } }

<script>
'use strict'
const KB = 1024, MB = 1024 * 1024
const RATE = 3 * MB // roughly what a phone sends its computer each second, for the stand-in progress
const LIMIT = { count: 8, file: 25 * MB, total: 50 * MB }
const COMPUTER = 'Studio PC'
const SAY = {
  large: 'Each file must be 25 MB or smaller. Nothing was attached. Choose a smaller file.',
  many: 'Attach up to 8 files at a time. Nothing was attached.',
  total: 'Attachments must total 50 MB or less. Nothing was attached. Remove a file or choose smaller ones.',
  host: 'This computer cannot keep files yet. Update Sotto there, then attach them again. Nothing was attached.',
  hostMenu: 'This computer cannot keep files yet. Update Sotto there to attach them.',
  images: 'This model does not read images.',
  full: 'A reply can carry 8 attachments.',
  sending: 'Your reply is being sent.',
}
const FILES = {
  f1: { name: 'quarterly-report.pdf', size: 2.4 * MB, when: 'Today, 08:12', group: 'Today' },
  f2: { name: 'server.log', size: 180 * KB, when: 'Today, 07:58', group: 'Today' },
  f3: { name: 'build-output.zip', size: 8.7 * MB, when: 'Today, 07:40', group: 'Today' },
  f4: { name: 'notes.txt', size: 3 * KB, when: 'Today, 07:31', group: 'Today' },
  f5: { name: 'screen-recording.mov', size: 64 * MB, when: 'Yesterday', group: 'Earlier' },
  f6: { name: 'schema.sql', size: 46 * KB, when: 'Yesterday', group: 'Earlier' },
  f7: { name: 'config.yml', size: 2 * KB, when: 'Oct 21', group: 'Earlier' },
  f8: { name: 'crash-trace.txt', size: 12 * KB, when: 'Oct 20', group: 'Earlier' },
}
const ORDER = Object.keys(FILES)
const DRAFT_TEXT = 'Here’s the report, last night’s log and the build. Section 3 doesn’t match the log.'
const FIRST_REPLY = 'Section 3 counts orders the log shows as refunded. I’m checking the query that builds it.'
const FILE_TEXT = {
  'server.log': '2026-10-23 23:58:02 INFO  orders.sync  started, 2026-07-01 to 2026-09-30\n2026-10-23 23:58:04 INFO  orders.sync  fetched 48,213 orders\n2026-10-23 23:58:05 WARN  refunds      412 refunds arrived after their order closed\n2026-10-23 23:58:05 INFO  dashboard    q3 totals rebuilt from orders only\n2026-10-23 23:58:06 INFO  orders.sync  done in 4.1 s',
  'notes.txt': 'Q3 check\n- Section 3 total: 1,284,330\n- The log says 412 refunds landed late\n- Does the dashboard take refunds off?',
  'schema.sql': 'create table refunds (\n  id integer primary key,\n  order_id integer not null,\n  amount_cents integer not null,\n  created_at text not null\n);',
  'config.yml': 'dashboard:\n  quarter: 2026-Q3\n  net_refunds: false\n  currency: USD',
  'crash-trace.txt': 'Thread 0 crashed:\n0  OrdersSync  reconcile(_:) + 212\n1  OrdersSync  run() + 88\n2  libdispatch  _dispatch_call_block_and_release + 32',
}

const STATES = {
  ready: { label: 'Ready', line: 'one photo and three files, and nothing going wrong.' },
  adding: { label: 'Adding', line: 'a file is still on its way to the computer.' },
  large: { label: 'One too large', line: 'the user chose a 64 MB recording with two other files.' },
  many: { label: 'Too many', line: 'the reply holds six attachments, and the user chose three more.' },
  host: { label: 'Can’t keep files', line: 'Studio PC runs a Sotto that keeps photos but not files.' },

}
const VARIANTS = {
  A: {
    name: 'Pills',
    line: 'Files are one-line pills under the photos, inside the words’ column, as on the desktop.',
    thesis: 'Photos wait as they do today. Under them, each file is a one-line pill: a type icon, the name cut in the middle so the extension stays, the size and a remove button. Sent files are the same pills, standing above your words.',
    good: 'Good at: a file looks the same on the iPhone as on the desktop. Three files take two or three short lines.',
    cost: 'Costs: at 320 pt the words’ column is about 180 pt wide, so most names are cut to a few letters and the extension. A file on its way has room only for a percentage.',
  },
  B: {
    name: 'Rows',
    line: 'Each file is a full-width row across the top of the reply box, with its type and size.',
    thesis: 'The reply box opens up: the photos, then one row per file, run the full width of the box above the + button, the words and Send. A row has an icon, the name, its type and size, and a remove button. Sent files are the same rows, as cards above your words.',
    good: 'Good at: room for the whole name, the type and progress in words (“Sending · 3.9 of 8.7 MB”). The easiest of the three to read and to press.',
    cost: 'Costs: three files add about 170 pt, so on a small phone the thread above shrinks to a few lines. Photos move out of the words’ column, a small change from the October 3 pick.',
  },
  C: {
    name: 'Stack',
    line: 'Files fold into one chip, “3 files · 11.3 MB”, that opens a sheet listing them.',
    thesis: 'Photos wait as they do today. However many files there are, they fold into one chip under the photos: “3 files · 11.3 MB”. A press opens a sheet that lists them with remove buttons and Add files. Sent files are one chip too, opening the same list.',
    good: 'Good at: the reply box stays almost as small as today whatever is attached, and the sheet has room for whole names and the limits.',
    cost: 'Costs: what is attached is one press away, before and after sending. Removing a file takes two presses, and a refusal points at a chip rather than at a file.',
  },
}
const SCENES = [
  { key: 'menu', title: 'The + menu' },
  { key: 'picker', title: 'Choosing files' },
  { key: 'draft', title: 'Waiting to send' },
  { key: 'sent', title: 'In the thread' },
  { key: 'look', title: 'Opened in Quick Look', only: 'quicklook' },
]
const OPEN_TEXT = {
  quicklook: `A press on a sent file brings it from ${COMPUTER}, up to 25 MB, with progress, then shows it in the iOS Quick Look preview, which reads PDFs, text and pictures. It needs a new host request, since attachment-content answers for images only (ADR-0131), and the file on the phone while it is open: Quick Look reads a file, and today nothing a reply carries is written to disk on the iPhone. It would sit in the app’s temporary folder and go when the preview closes.`,
  desktop: `Nothing new on the host or the phone. A sent file shows its name, type and size in the variant’s shape and says it opens on ${COMPUTER}, as the iPhone says today with “(open on the desktop)”. The photo above it still opens full screen.`,
}
const STATE_NOTES = {
  ready: 'Try it in any phone: press +, choose Files, pick a few, then Open. screen-recording.mov (64 MB) is over the limit, and all eight with a photo is too many.',
  adding: 'Held at 45% so you can look at it. Files you add yourself go up live, and Send waits for them, as it waits for photos today.',
  large: 'Press Open in phone 2 to get the same refusal live.',
  many: 'Press Open in phone 2 to get the same refusal live.',
  host: '<b>Wording to settle.</b> The refusal ends “then attach them again”, which reads well after a choice was refused but not in the menu, before any choice. The menu here says “Update Sotto there to attach them.” Today’s photo reason names the computer instead: “Update Sotto on Studio PC to send photos from this iPhone.”',
  textonly: '<b>Wording to settle.</b> Today the iPhone says “This thread’s model can’t take photos. Change the model on Studio PC to attach them.” This state uses the desktop’s shorter sentence, “This model does not read images.” One of them should win on both.',
}

/* ---------- icons ---------- */
const FILE_PATH = '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>'
const P = {
  plus: '<path d="M12 5v14M5 12h14"/>',
  up: '<path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  back: '<path d="M15 18l-6-6 6-6"/>',
  chev: '<path d="M9 6l6 6-6 6"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  photo: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/>',
  camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  file: FILE_PATH,
  text: FILE_PATH + '<path d="M9 13h6M9 17h6M9 9h1"/>',
  code: FILE_PATH + '<path d="M10 12.5L8 15l2 2.5M14 12.5l2 2.5-2 2.5"/>',
  archive: FILE_PATH + '<path d="M11 4v1.5M11 8v1.5M11 12v1.5"/><circle cx="11" cy="17" r="1.6"/>',
  video: '<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10.5l5-3v9l-5-3z"/>',
  stack: '<path d="M9 3h6l4 4v10a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M15 3v4h4"/><path d="M4 7v12a2 2 0 0 0 2 2h8"/>',
}
const ic = (n, s = 20, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${P[n]}</svg>`
const SIGNAL = '<svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true" focusable="false"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>'
const BATTERY = '<svg width="27" height="13" viewBox="0 0 27 13" aria-hidden="true" focusable="false"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="9" rx="2" fill="currentColor"/><rect x="25" y="4.5" width="1.5" height="4" rx=".75" fill="currentColor" opacity=".4"/></svg>'
/* Stand-in photos: a dashboard screenshot and a whiteboard, drawn from the photo tokens. */
function shot(look) {
  if (look === 'board') return '<svg class="shot" viewBox="0 0 90 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false"><rect width="90" height="120" style="fill:var(--tt-photo-board)"/><path d="M12 24h40M12 34h58M12 44h30" stroke-width="3" stroke-linecap="round" style="stroke:var(--tt-photo-ink)"/><circle cx="58" cy="80" r="16" fill="none" stroke-width="3" style="stroke:var(--tt-photo-red)"/><path d="M14 72l18 16M32 72L14 88" stroke-width="3" stroke-linecap="round" style="stroke:var(--tt-photo-ink)"/></svg>'
  return '<svg class="shot" viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false"><rect width="160" height="120" style="fill:var(--tt-photo-bg)"/><rect width="160" height="14" style="fill:var(--tt-photo-bar)"/><rect y="14" width="34" height="106" style="fill:var(--tt-photo-side)"/><rect x="42" y="22" width="50" height="6" rx="3" style="fill:var(--tt-photo-line)"/><rect x="42" y="32" width="32" height="4" rx="2" style="fill:var(--tt-photo-line)"/><path d="M44 102L66 84L86 90L108 62L128 72L152 40" fill="none" stroke-width="3" style="stroke:var(--tt-photo-accent)"/><rect x="112" y="22" width="40" height="13" rx="3" style="fill:var(--tt-photo-warn)"/><rect x="42" y="108" width="110" height="1.5" style="fill:var(--tt-photo-line)"/></svg>'
}

/* ---------- small helpers ---------- */
const $ = id => document.getElementById(id)
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
// The desktop's rule (formatAttachmentSize): bytes, whole KB, then MB with one decimal under 10.
function size(bytes) {
  if (bytes < KB) return `${Math.round(bytes)} B`
  if (bytes < MB) return `${Math.max(1, Math.round(bytes / KB))} KB`
  const mb = bytes / MB
  return `${mb < 10 ? mb.toFixed(1) : Math.round(mb)} MB`
}
function partSize(item) {
  const a = size(item.size * item.progress), b = size(item.size)
  return a.endsWith(' MB') && b.endsWith(' MB') ? `${a.slice(0, -3)} of ${b}` : `${a} of ${b}`
}
// A total is a new number the desktop never shows, so it keeps one decimal up to 100 MB: "3 files · 11.3 MB".
function totalSize(bytes) {
  if (bytes < 10 * MB || bytes >= 100 * MB) return size(bytes)
  return `${(bytes / MB).toFixed(1).replace(/\.0$/, '')} MB`
}
const pct = item => Math.round(item.progress * 100)
const ext = name => { const m = /\.([^./]+)$/.exec(name); return m ? m[1].toUpperCase() : 'FILE' }
function kindIcon(name) {
  const e = ext(name).toLowerCase()
  if (['zip', 'gz', 'tgz', 'tar', '7z', 'rar'].includes(e)) return 'archive'
  if (['sql', 'yml', 'yaml', 'json', 'js', 'ts', 'py', 'swift', 'sh'].includes(e)) return 'code'
  if (['mov', 'mp4', 'm4v'].includes(e)) return 'video'
  if (['pdf', 'txt', 'log', 'md', 'csv', 'rtf'].includes(e)) return 'text'
  return 'file'
}
/** A name as a head that may be cut and a tail that keeps the extension and two letters before it. */
function cut(name, cls = '') {
  const dot = name.lastIndexOf('.')
  const at = dot > 0 ? Math.max(0, dot - 2) : Math.max(0, name.length - 4)
  return `<span class="cut ${cls}" title="${esc(name)}"><span class="cut__head">${esc(name.slice(0, at))}</span><span class="cut__tail">${esc(name.slice(at))}</span></span>`
}
const countFiles = n => n === 1 ? '1 file' : `${n} files`
const isFile = i => i.kind === 'file'
const isPhoto = i => i.kind === 'photo'
const total = list => list.reduce((sum, i) => sum + i.size, 0)
const fileMeta = f => f.progress < 1 ? `Sending · ${partSize(f)}` : `${ext(f.name)} · ${size(f.size)}`

let seq = 0
const mkFile = (id, extra) => Object.assign({ uid: `u${++seq}`, kind: 'file', id, name: FILES[id].name, size: FILES[id].size, progress: 1 }, extra)
const mkPhoto = (n, extra) => Object.assign({ uid: `u${++seq}`, kind: 'photo', name: `Photo ${n + 1}`, size: (n % 2 ? 2.1 : 1.4) * MB, look: n % 2 ? 'board' : 'dash', progress: 1 }, extra)

/* ---------- what the prototype is showing ---------- */
const params = new URLSearchParams(location.search)
const pick = (value, allowed, fallback) => allowed.includes(value) ? value : fallback
const S = {
  variant: pick((params.get('variant') || '').toUpperCase(), Object.keys(VARIANTS), 'A'),
  state: pick(params.get('state'), Object.keys(STATES), 'ready'),
  open: pick(params.get('open'), ['quicklook', 'desktop'], 'quicklook'),
  theme: pick(params.get('theme'), ['dark', 'light'], 'dark'),
  width: pick(params.get('width'), ['375', '320'], '375'),
  zoom: pick(params.get('zoom'), ['1', '0.75'], '1'),
}
let phones = []

/* Why a menu choice is off, as the reply box's + button checks it today (ADR-0031), with files beside photos. */
function photosOff(p) {
  if (S.state === 'textonly') return SAY.images
  if (p.sending) return SAY.sending
  return p.draft.length >= LIMIT.count ? SAY.full : null
}
function filesOff(p) {
  if (S.state === 'host') return SAY.hostMenu
  if (p.sending) return SAY.sending
  return p.draft.length >= LIMIT.count ? SAY.full : null
}

/** Where each phone starts, for the state the State control names. */
function preset(key) {
  const st = S.state, textOnly = st === 'textonly'
  const p = { key, overlay: null, draft: [], text: '', notice: '', picked: new Set(), sent: [], look: null, sending: false, opener: null, lookOpener: null, lookFrom: null, sheetMsg: null, fresh: null, scrollEnd: true }
  const readySet = () => textOnly ? [mkFile('f1'), mkFile('f2'), mkFile('f3')] : [mkPhoto(0), mkFile('f1'), mkFile('f2'), mkFile('f3')]
  const sixSet = () => [mkPhoto(0), mkPhoto(1), mkFile('f1'), mkFile('f2'), mkFile('f3'), mkFile('f4')]
  if (key === 'menu') { p.overlay = 'menu'; p.draft = textOnly ? [] : [mkPhoto(0)] }
  if (key === 'picker') {
    p.overlay = 'picker'; p.opener = 'plus'
    p.draft = st === 'many' ? sixSet() : textOnly ? [] : [mkPhoto(0)]
    p.picked = new Set(st === 'large' ? ['f1', 'f2', 'f5'] : st === 'many' ? ['f6', 'f7', 'f8'] : ['f1', 'f2', 'f3'])
  }
  if (key === 'draft') {
    p.text = DRAFT_TEXT
    if (st === 'ready' || st === 'textonly') p.draft = readySet()
    if (st === 'adding') { p.draft = readySet(); Object.assign(p.draft[3], { progress: 0.45, frozen: true }) }
    if (st === 'large' || st === 'host') { p.draft = [mkPhoto(0)]; p.notice = SAY[st] }
    if (st === 'many') { p.draft = sixSet(); p.notice = SAY.many }
  }
  if (key === 'sent' || key === 'look') {
    p.sent = [{ text: DRAFT_TEXT, items: readySet(), reply: FIRST_REPLY }]
    if (key === 'look') {
      const f = p.sent[0].items.find(i => i.id === 'f1')
      p.overlay = 'look'; p.look = { msg: 0, uid: f.uid, progress: 1 }; p.lookOpener = `open-${f.uid}`
      // In C a sent file is opened from its message's list, so Done goes back to the list.
      if (S.variant === 'C') { p.lookFrom = 'sentfiles'; p.sheetMsg = 0 }
    }
  }
  return p
}

function caption(key) {
  const st = S.state, v = S.variant, ql = S.open === 'quicklook'
  if (key === 'menu') {
    if (st === 'host') return 'Files is off and says why. Photo library and Camera still work.'
    if (st === 'textonly') return 'Photo library and Camera are off and say why. Files still works.'
    return 'The + button now offers Files beside Photo library and Camera. Press Files to open the picker.'
  }
  if (key === 'picker') {
    if (st === 'large') return 'screen-recording.mov is 64 MB, over the 25 MB a file may be. Press Open to get the refusal.'
    if (st === 'many') return 'The reply already holds two photos and four files; three more make nine. Press Open to get the refusal.'
    if (st === 'host') return 'The same picker, as it was before the computer said it can’t keep files. Press Open to get the refusal.'
    return 'A stand-in for the iOS Files picker, which hands Sotto only what was chosen. Choose several, then Open.'
  }
  if (key === 'draft') {
    const ready = {
      A: 'One photo and three files wait above the words. Each file is a pill with its size and a remove button.',
      B: 'One photo and three files wait above the words. Each file is a row across the box, with its type and size.',
      C: 'One photo and three files wait above the words. The files are one chip; press it to see them.',
    }
    return {
      ready: ready[v],
      adding: `build-output.zip is on its way to ${COMPUTER}. Send now and the reply goes when it arrives.`,
      large: 'Nothing from that choice was attached. The photo that was already waiting stays.',
      many: 'Nothing from that choice was attached. Remove some, or send these first.',
      host: `${COMPUTER} restarted on an older Sotto while the files were on their way. The photo stays; the files were not attached.`,
      textonly: 'This thread’s model reads text only. Files still wait and go; there is no photo.',
    }[st]
  }
  if (key === 'sent') {
    if (v === 'C') return `Sent. The photo stands above the words and the files as one chip that opens their list${ql ? ', where a press opens a file in Quick Look.' : `, which says they open on ${COMPUTER}.`}`
    return ql ? 'Sent. The photo stands above the words with the files under it. Press a file to open it in Quick Look.' : `Sent. The photo stands above the words and opens full screen; the files say they open on ${COMPUTER}.`
  }
  return `Quick Look, once quarterly-report.pdf has come from ${COMPUTER}. Done goes back to ${v === 'C' ? 'the list of files' : 'the thread'}.`
}

/* ---------- drawing a phone ---------- */
function phoneHTML(p) {
  const sheetOpen = ['picker', 'files', 'sentfiles', 'look'].includes(p.overlay)
  const behind = p.overlay ? ' inert' : ''
  return `<div class="sb" aria-hidden="true"><span>9:41</span><span class="island"></span><span class="sb__icons">${SIGNAL}${BATTERY}</span></div>
  <div class="nav"${behind}><span class="nav__back" aria-hidden="true">${ic('back', 24, 2.4)}</span><span class="nav__title">Q3 numbers check</span><span class="nav__pill" aria-hidden="true">Done</span></div>
  <section class="convo" aria-label="Conversation" data-scroll="convo"${behind}>${thread(p)}</section>
  ${dock(p, sheetOpen)}
  ${overlay(p)}
  <div class="home" aria-hidden="true"></div>`
}

const agent = text => `<div class="msg-agent"><p class="who"><span class="mark" aria-hidden="true">C</span>Claude Code</p><p>${esc(text)}</p></div>`
function thread(p) {
  return `<div class="spacer"></div>
  <div class="msg-user"><div class="bubble">The Q3 numbers in the dashboard look off. Can you take a look?</div></div>
  ${agent('I can. Send me the quarterly report and last night’s server log, and I’ll compare them with what the dashboard shows.')}
  ${p.sent.map((m, mi) => sentHTML(p, m, mi) + agent(m.reply)).join('')}`
}

function sentHTML(p, m, mi) {
  const ql = S.open === 'quicklook'
  const photos = m.items.filter(isPhoto), files = m.items.filter(isFile)
  const photoHTML = photos.map(x => `<button type="button" class="sphoto" data-act="open" data-msg="${mi}" data-uid="${x.uid}" data-k="open-${x.uid}" aria-label="Open photo ${esc(x.name)}" style="${x.look === 'board' ? 'width:150px;aspect-ratio:3/4' : 'width:220px;aspect-ratio:4/3'}">${shot(x.look)}</button>`).join('')
  let fileHTML = ''
  if (files.length && S.variant === 'A') {
    fileHTML = `<ul class="spills" aria-label="${countFiles(files.length)}">${files.map(f => {
      const inner = `${ic(kindIcon(f.name), 16)}${cut(f.name)}<span class="spill__size">${size(f.size)}</span>`
      return ql ? `<li><button type="button" class="spill" data-act="open" data-msg="${mi}" data-uid="${f.uid}" data-k="open-${f.uid}" aria-label="Open ${esc(f.name)}">${inner}</button></li>` : `<li class="spill">${inner}</li>`
    }).join('')}</ul>${ql ? '' : `<p class="shint">Open these files on ${COMPUTER}.</p>`}`
  }
  if (files.length && S.variant === 'B') fileHTML = `<ul class="scards" aria-label="${countFiles(files.length)}">${files.map(f => sentRow(f, mi)).join('')}</ul>`
  if (files.length && S.variant === 'C') fileHTML = stackChip({ act: 'sentchip', files, key: `sentchip-${mi}`, msg: mi })
  return `<div class="msg-user">${photoHTML}${fileHTML}${m.text ? `<div class="bubble">${esc(m.text)}</div>` : ''}</div>`
}

/** A sent file as a row: a button that opens Quick Look, or a plain row that says where it opens. */
function sentRow(f, mi) {
  const icon = `<span class="frow__icon">${ic(kindIcon(f.name), 20)}</span>`
  if (S.open === 'quicklook') return `<li><button type="button" class="frow" data-act="open" data-msg="${mi}" data-uid="${f.uid}" data-k="open-${f.uid}" aria-label="Open ${esc(f.name)}">${icon}<span class="frow__text">${cut(f.name, 'frow__name')}<span class="frow__meta">${ext(f.name)} · ${size(f.size)}</span></span>${ic('chev', 16, 2.4)}</button></li>`
  return `<li class="frow frow--plain">${icon}<span class="frow__text">${cut(f.name, 'frow__name')}<span class="frow__meta">${ext(f.name)} · ${size(f.size)} · open on ${COMPUTER}</span></span></li>`
}

/** C's chip: every file in one press-to-see button. */
function stackChip({ act, files, key, msg, lock = '' }) {
  const going = files.filter(f => f.progress < 1)
  const label = `Show ${countFiles(files.length)}, ${totalSize(total(files))}${going.length ? `, ${going.length} still sending` : ''}`
  const lead = going.length ? `<span class="ring" data-prog="${going[0].uid}" style="--p:${pct(going[0])}"></span>` : ic('stack', 20)
  return `<button type="button" class="stack" data-act="${act}" data-k="${key}"${msg != null ? ` data-msg="${msg}"` : ''} aria-haspopup="dialog" aria-label="${esc(label)}"${lock}><span class="stack__icon">${lead}</span><span class="stack__text"><b>${countFiles(files.length)}</b> · ${totalSize(total(files))}</span>${ic('chev', 14, 2.4)}</button>`
}

function canSend(p) { return !p.sending && Boolean(p.text.trim() || p.draft.length) }

function dock(p, sheetOpen) {
  const menuOpen = p.overlay === 'menu'
  const lock = menuOpen ? ' inert' : ''
  const off = p.sending ? ' disabled' : ''
  const photos = p.draft.filter(isPhoto), files = p.draft.filter(isFile)
  const plus = `<button type="button" class="rb plus" data-act="plus" data-k="plus" aria-label="Attach photos or files" aria-expanded="${menuOpen}" aria-controls="${p.pid}-menu"${off}>${ic('plus', 22, 2.2)}</button>`
  const ready = canSend(p)
  const send = `<button type="button" class="rb send${ready || p.sending ? ' send--on' : ''}" data-act="send" data-k="send" aria-label="${p.sending ? 'Sending reply' : 'Send reply'}"${ready ? '' : ' aria-disabled="true"'}${lock}>${p.sending ? '<span class="spin" aria-hidden="true"></span>' : ic('up', 20, 2.4)}</button>`
  const strip = photos.length ? `<ul class="strip" aria-label="Photos in this reply" data-scroll="strip"${lock}>${photos.map(x => thumb(p, x)).join('')}</ul>` : ''
  const notice = p.notice ? `<p class="notice" role="alert"${lock}>${esc(p.notice)}</p>` : ''
  const field = `<textarea class="field" data-k="text" rows="1" aria-label="Reply to this thread" placeholder="Reply to this thread"${off}${lock}>${esc(p.text)}</textarea>`
  let inner
  if (S.variant === 'B') {
    const rows = files.length ? `<ul class="frows" aria-label="Files in this reply"${lock}>${files.map(f => draftRow(p, f)).join('')}</ul>` : ''
    inner = `${strip || rows ? `<div class="dock__top">${strip}${rows}</div>` : ''}${notice ? `<div class="dock__note">${notice}</div>` : ''}<div class="dock__row">${plus}<div class="dock__body">${field}</div>${send}</div>`
  } else {
    const fileBits = !files.length ? '' : S.variant === 'A' ? pills(p, files, lock) : stackChip({ act: 'chip', files, key: 'chip', lock })
    inner = `<div class="dock__row">${plus}<div class="dock__body">${strip}${fileBits}${notice}${field}</div>${send}</div>`
  }
  const full = p.draft.length || p.notice
  return `<div class="dockwrap${menuOpen ? ' dockwrap--menu' : ''}"${sheetOpen ? ' inert' : ''}><div class="dock${full ? ' dock--full' : ''}">${inner}</div>${menuOpen ? menu(p) : ''}</div>${menuOpen ? '<div class="scrim scrim--clear" data-act="scrim" aria-hidden="true"></div>' : ''}`
}

const thumb = (p, x) => `<li class="thumb" style="width:${x.look === 'board' ? 66 : 117}px">${shot(x.look)}${x.progress < 1 ? `<span class="veil"><span class="ring ring--lg" data-prog="${x.uid}" style="--p:${pct(x)}"></span></span>` : ''}<button type="button" class="thumb__x" data-act="rm" data-uid="${x.uid}" data-k="rm-${x.uid}" aria-label="Remove ${esc(x.name)}"${p.sending ? ' disabled' : ''}><span class="xdot">${ic('x', 11, 3)}</span></button></li>`

function pills(p, files, lock) {
  return `<ul class="pills" aria-label="Files in this reply"${lock}>${files.map(f => {
    const lead = f.progress < 1 ? `<span class="ring" data-prog="${f.uid}" style="--p:${pct(f)}"></span>` : `<span class="pill__icon">${ic(kindIcon(f.name), 16)}</span>`
    const sizeText = f.progress < 1 ? `${pct(f)}%` : size(f.size)
    return `<li class="pill">${lead}${cut(f.name)}<span class="pill__size" data-progtext="${f.uid}" data-fmt="pct">${sizeText}</span><button type="button" class="pill__x" data-act="rm" data-uid="${f.uid}" data-k="rm-${f.uid}" aria-label="Remove ${esc(f.name)}"${p.sending ? ' disabled' : ''}>${ic('x', 14, 2.4)}</button></li>`
  }).join('')}</ul>`
}

/** A waiting file as a row with its own remove button: B's reply box and C's sheet. */
function draftRow(p, f) {
  return `<li class="frow"><span class="frow__icon">${ic(kindIcon(f.name), 20)}</span><span class="frow__text">${cut(f.name, 'frow__name')}<span class="frow__meta" data-progtext="${f.uid}" data-fmt="long">${fileMeta(f)}</span></span><button type="button" class="xbtn" data-act="rm" data-uid="${f.uid}" data-k="rm-${f.uid}" aria-label="Remove ${esc(f.name)}"${p.sending ? ' disabled' : ''}>${ic('x', 16, 2.2)}</button>${f.progress < 1 ? `<span class="frow__bar" data-prog="${f.uid}" style="--p:${pct(f)}"></span>` : ''}</li>`
}

function menu(p) {
  const pr = photosOff(p), fr = filesOff(p), same = Boolean(pr && pr === fr)
  const whyP = `${p.pid}-why-photos`, whyF = same ? whyP : `${p.pid}-why-files`
  const item = (act, label, icon, why, whyId) => `<button type="button" class="mi" data-act="${why ? 'noop' : act}" data-k="${act}"${why ? ` aria-disabled="true" aria-describedby="${whyId}"` : ''}><span>${label}</span>${ic(icon, 22)}</button>`
  return `<div class="menu${p.fresh === 'menu' ? ' is-new' : ''}" id="${p.pid}-menu" role="group" aria-label="Attach">
    <div class="menu__group">${item('menu-photos', 'Photo library', 'photo', pr, whyP)}${item('menu-camera', 'Camera', 'camera', pr, whyP)}${pr && !same ? `<p class="mi__why" id="${whyP}">${esc(pr)}</p>` : ''}</div>
    <div class="menu__group">${item('menu-files', 'Files', 'folder', fr, whyF)}${fr ? `<p class="mi__why" id="${whyF}">${esc(fr)}</p>` : ''}</div>
  </div>`
}

function overlay(p) {
  if (p.overlay === 'picker') return pickerHTML(p)
  if (p.overlay === 'files') return filesSheet(p, p.draft.filter(isFile), true)
  if (p.overlay === 'sentfiles') return filesSheet(p, p.sent[p.sheetMsg].items.filter(isFile), false)
  if (p.overlay === 'look') return lookHTML(p)
  return ''
}

/* A stand-in for UIDocumentPickerViewController with several allowed: Cancel, Open, a check on each choice. */
function pickerHTML(p) {
  const n = p.picked.size
  const row = id => {
    const f = FILES[id], on = p.picked.has(id)
    return `<li><button type="button" class="pk" data-act="pick" data-id="${id}" data-k="pk-${id}" aria-pressed="${on}" aria-label="${esc(f.name)}, ${size(f.size)}"><span class="pk__check" aria-hidden="true">${on ? ic('check', 14, 3) : ''}</span><span class="pk__tile" aria-hidden="true">${ic(kindIcon(f.name), 16)}<b>${ext(f.name)}</b></span><span class="pk__text"><span class="pk__name">${esc(f.name)}</span><span class="pk__meta">${size(f.size)} · ${f.when}</span></span></button></li>`
  }
  const group = g => `<h3 class="pk__group">${g}</h3><ul class="pk__list">${ORDER.filter(id => FILES[id].group === g).map(row).join('')}</ul>`
  return `<div class="scrim" data-act="scrim" aria-hidden="true"></div>
  <section class="sheet${p.fresh === 'picker' ? ' is-new' : ''}" role="dialog" aria-modal="true" aria-labelledby="${p.pid}-pk">
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet__bar"><button type="button" class="tbtn" data-act="pk-cancel" data-k="pk-cancel">Cancel</button><h2 class="sheet__title" id="${p.pid}-pk">Recents</h2><button type="button" class="tbtn tbtn--strong" data-act="pk-open" data-k="pk-open"${n ? '' : ' disabled'}>Open</button></div>
    <div class="sheet__scroll" data-scroll="sheet">${group('Today')}${group('Earlier')}</div>
    <p class="sheet__foot" role="status">${n ? `${n} selected` : 'Nothing selected'}</p>
  </section>`
}

/* C's sheet: the waiting files with remove buttons and Add files, or a sent message's files. */
function filesSheet(p, files, waiting) {
  const ql = S.open === 'quicklook'
  const title = waiting ? `${countFiles(files.length)} in this reply` : countFiles(files.length)
  const rows = files.map(f => waiting ? draftRow(p, f) : sentRow(f, p.sheetMsg)).join('')
  const foot = waiting ? `${p.draft.length} of ${LIMIT.count} attachments · ${totalSize(total(p.draft))} of 50 MB` : ql ? `${totalSize(total(files))} in all` : `Open these files on ${COMPUTER}.`
  const addOff = filesOff(p)
  return `<div class="scrim" data-act="scrim" aria-hidden="true"></div>
  <section class="sheet sheet--short${p.fresh === p.overlay ? ' is-new' : ''}" role="dialog" aria-modal="true" aria-labelledby="${p.pid}-fs">
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet__bar"><span></span><h2 class="sheet__title" id="${p.pid}-fs">${title}</h2><button type="button" class="tbtn tbtn--strong" data-act="sheet-done" data-k="sheet-done">Done</button></div>
    <div class="sheet__scroll" data-scroll="sheet"><ul class="frows">${rows}</ul></div>
    <p class="sheet__foot${waiting ? ' sheet__foot--tight' : ''}">${esc(foot)}</p>
    ${waiting ? `<div class="sheet__actions"><button type="button" class="wide" data-act="sheet-add" data-k="sheet-add"${addOff ? ` disabled aria-describedby="${p.pid}-addwhy"` : ''}>${ic('folder', 18)}Add files</button>${addOff ? `<p class="mi__why" id="${p.pid}-addwhy" style="padding:8px 4px 0">${esc(addOff)}</p>` : ''}</div>` : ''}
  </section>`
}

function lookHTML(p) {
  const x = p.sent[p.look.msg].items.find(i => i.uid === p.look.uid)
  const loaded = p.look.progress >= 1
  const kind = x.kind === 'photo' ? 'Photo' : ext(x.name)
  const body = loaded ? lookContent(x) : `<div class="look__wait" role="status"><p>Getting ${esc(x.name)} from ${COMPUTER}</p><span class="bar"><span data-lookprog style="--p:${Math.round(p.look.progress * 100)}"></span></span><p class="muted" data-looktext>${partSize({ size: x.size, progress: p.look.progress })}</p></div>`
  return `<section class="look${p.fresh === 'look' ? ' is-new' : ''}" role="dialog" aria-modal="true" aria-labelledby="${p.pid}-lk">
    <div class="look__bar"><button type="button" class="tbtn tbtn--strong" data-act="look-done" data-k="look-done">Done</button><div class="look__title"><h2 id="${p.pid}-lk">${cut(x.name)}</h2><span>${kind} · ${size(x.size)}</span></div><span></span></div>
    <div class="look__body" data-scroll="look">${body}</div>
  </section>`
}

function lookContent(x) {
  if (x.kind === 'photo') return `<div class="look__photo" role="img" aria-label="${esc(x.name)}">${shot(x.look)}</div>`
  const e = ext(x.name)
  if (e === 'PDF') return `<div class="paper" role="img" aria-label="Page 1 of ${esc(x.name)}"><span class="paper__h">Q3 2026 report</span><span class="paper__sub">Orders, refunds and revenue, July to September</span><i class="pl" style="width:96%"></i><i class="pl" style="width:88%"></i><i class="pl" style="width:92%"></i><i class="pl" style="width:58%"></i><span class="paper__sec">3. Orders by month</span><table><tr><th>Month</th><th>Orders</th><th>Refunds</th></tr><tr><td>July</td><td>15,902</td><td>131</td></tr><tr><td>August</td><td>16,447</td><td>149</td></tr><tr><td>September</td><td>15,864</td><td>132</td></tr><tr><td>Total</td><td>48,213</td><td>412</td></tr></table><i class="pl" style="width:94%"></i><i class="pl" style="width:81%"></i><i class="pl" style="width:70%"></i><span class="paper__pg">Page 1 of 12</span></div>`
  if (FILE_TEXT[x.name]) return `<pre class="look__text">${esc(FILE_TEXT[x.name])}</pre>`
  return `<div class="look__none">${ic(kindIcon(x.name), 48, 1.5)}<p><b>${esc(x.name)}</b></p><p>The iPhone can’t show what’s inside this file. Open it on ${COMPUTER}.</p></div>`
}

/** Draws a phone again, keeping where it was scrolled and, when focus was inside it, what had focus. */
function renderPhone(p, focus) {
  const root = $(p.pid)
  if (!root) return
  const active = document.activeElement
  const inside = Boolean(active && active !== document.body && root.contains(active))
  let key = typeof focus === 'string' ? focus : null, selection = null
  if (!focus && inside && active.dataset && active.dataset.k) {
    key = active.dataset.k
    if (active.tagName === 'TEXTAREA') selection = [active.selectionStart, active.selectionEnd]
  }
  const scrolls = {}
  root.querySelectorAll('[data-scroll]').forEach(el => { scrolls[el.dataset.scroll] = [el.scrollTop, el.scrollLeft] })
  root.innerHTML = phoneHTML(p)
  p.fresh = null
  root.querySelectorAll('[data-scroll]').forEach(el => { const s = scrolls[el.dataset.scroll]; if (s) { el.scrollTop = s[0]; el.scrollLeft = s[1] } })
  const convo = root.querySelector('.convo')
  if (p.scrollEnd) { convo.scrollTop = convo.scrollHeight; p.scrollEnd = false }
  fit(root.querySelector('.field'))
  if (!focus && !inside) return
  let el = typeof focus === 'function' ? focus(root) : key ? root.querySelector(`[data-k="${key}"]`) : null
  if (!el || el.disabled) el = root.querySelector('[data-k="plus"]:not([disabled])') || root.querySelector('[data-k="send"]')
  if (el) {
    el.focus({ preventScroll: true })
    if (selection && el.setSelectionRange) el.setSelectionRange(selection[0], selection[1])
  }
}
function fit(field) {
  if (!field) return
  field.style.height = 'auto'
  if (field.scrollHeight) field.style.height = `${Math.min(field.scrollHeight, 154)}px`
}

/* ---------- what a press does ---------- */
function addPhoto(p, camera) {
  const n = p.draft.filter(isPhoto).length
  const photo = mkPhoto(n, { progress: 0 })
  if (camera) photo.name = 'Camera photo'
  p.draft.splice(n, 0, photo)
  p.notice = ''
}
/* The same checks, in the same order, as the desktop composer: how many, then each file, then all of them. */
function addFiles(p, ids) {
  const files = ids.map(id => FILES[id])
  if (!files.length) return
  if (S.state === 'host') { p.notice = SAY.host; return }
  if (p.draft.length + files.length > LIMIT.count) { p.notice = SAY.many; return }
  if (files.some(f => f.size > LIMIT.file)) { p.notice = SAY.large; return }
  if (total(p.draft) + total(files) > LIMIT.total) { p.notice = SAY.total; return }
  p.notice = ''
  ids.forEach(id => p.draft.push(mkFile(id, { progress: 0 })))
}
function removeItem(p, uid) {
  const root = $(p.pid)
  const scope = () => root.querySelector('.sheet') || root.querySelector('.dockwrap')
  const before = [...scope().querySelectorAll('[data-act="rm"]')]
  const at = before.findIndex(b => b.dataset.uid === uid)
  p.draft = p.draft.filter(i => i.uid !== uid)
  p.notice = ''
  if (p.overlay === 'files' && !p.draft.some(isFile)) p.overlay = null
  // Focus stays with the list: the next remove button, else the one before, else Done or the + button.
  renderPhone(p, () => {
    const after = [...scope().querySelectorAll('[data-act="rm"]')]
    return after[at] || after[at - 1] || root.querySelector('[data-k="sheet-done"]') || root.querySelector('[data-k="plus"]')
  })
}
function send(p) {
  if (!canSend(p)) return
  if (p.draft.some(i => i.progress < 1)) {
    // As with photos today: the reply waits for what is still on its way, then goes.
    p.sending = true
    p.draft.forEach(i => { i.frozen = false })
    renderPhone(p, 'send')
    return
  }
  commit(p)
}
function commit(p) {
  const items = p.draft
  const root = $(p.pid), inside = Boolean(root && root.contains(document.activeElement))
  p.sent.push({ text: p.text.trim(), items, reply: items.some(isFile) ? 'Got them. Reading the files now.' : 'Got it. Looking now.' })
  Object.assign(p, { draft: [], text: '', notice: '', sending: false, overlay: null, scrollEnd: true })
  // A reply that went after waiting for a file takes focus back only if focus is still in this phone.
  renderPhone(p, inside ? 'text' : null)
}
function openOverlay(p, name, focusKey) {
  p.overlay = name
  p.fresh = name
  renderPhone(p, focusKey)
}
function closeTop(p) {
  const was = p.overlay
  if (!was) return
  if (was === 'look' && p.lookFrom) { const back = p.lookFrom; p.lookFrom = null; p.overlay = back; renderPhone(p, p.lookOpener); return }
  p.overlay = null
  renderPhone(p, was === 'look' ? p.lookOpener : was === 'menu' ? 'plus' : p.opener || 'plus')
}
function openLook(p, msg, uid, key) {
  const item = p.sent[msg].items.find(i => i.uid === uid)
  p.lookFrom = p.overlay === 'sentfiles' ? 'sentfiles' : null
  p.lookOpener = key
  p.look = { msg, uid, progress: isPhoto(item) ? 1 : 0 }
  openOverlay(p, 'look', 'look-done')
}
function firstMenuKey(p) { return photosOff(p) && !filesOff(p) ? 'menu-files' : 'menu-photos' }

function act(p, name, el) {
  switch (name) {
    case 'plus':
      if (p.overlay === 'menu') closeTop(p)
      else openOverlay(p, 'menu', firstMenuKey(p))
      break
    case 'menu-photos': case 'menu-camera':
      addPhoto(p, name === 'menu-camera'); p.overlay = null; renderPhone(p, 'plus'); break
    case 'menu-files':
      p.picked = new Set(); p.opener = 'plus'; openOverlay(p, 'picker', 'pk-cancel'); break
    case 'pick': {
      const id = el.dataset.id
      if (p.picked.has(id)) p.picked.delete(id); else p.picked.add(id)
      renderPhone(p, `pk-${id}`)
      break
    }
    case 'pk-cancel': closeTop(p); break
    case 'pk-open': {
      const ids = ORDER.filter(id => p.picked.has(id))
      p.picked = new Set(); p.overlay = null
      addFiles(p, ids)
      renderPhone(p, S.variant === 'C' && !p.notice && p.draft.some(isFile) ? 'chip' : 'plus')
      break
    }
    case 'rm': removeItem(p, el.dataset.uid); break
    case 'chip': p.opener = 'chip'; openOverlay(p, 'files', 'sheet-done'); break
    case 'sentchip': p.sheetMsg = Number(el.dataset.msg); p.opener = el.dataset.k; openOverlay(p, 'sentfiles', 'sheet-done'); break
    case 'sheet-add': p.picked = new Set(); p.opener = 'chip'; openOverlay(p, 'picker', 'pk-cancel'); break
    case 'sheet-done': case 'look-done': case 'scrim': closeTop(p); break
    case 'open': openLook(p, Number(el.dataset.msg), el.dataset.uid, el.dataset.k); break
    case 'send': send(p); break
  }
}

/* Stand-in progress: files on their way to the computer, and a file on its way back for Quick Look. */
function tick() {
  for (const p of phones) {
    const root = $(p.pid)
    if (!root) continue
    let redraw = false
    for (const i of p.draft) {
      if (i.progress >= 1 || i.frozen) continue
      i.progress = Math.min(1, i.progress + Math.max(0.1 / 0.6, (RATE * 0.1) / i.size))
      if (i.progress >= 1) { redraw = true; continue }
      root.querySelectorAll(`[data-prog="${i.uid}"]`).forEach(el => el.style.setProperty('--p', pct(i)))
      root.querySelectorAll(`[data-progtext="${i.uid}"]`).forEach(el => { el.textContent = el.dataset.fmt === 'pct' ? `${pct(i)}%` : fileMeta(i) })
    }
    if (p.look && p.look.progress < 1) {
      const item = p.sent[p.look.msg].items.find(i => i.uid === p.look.uid)
      p.look.progress = Math.min(1, p.look.progress + Math.max(0.1 / 0.8, (2 * RATE * 0.1) / item.size))
      if (p.look.progress >= 1) redraw = true
      else {
        root.querySelectorAll('[data-lookprog]').forEach(el => el.style.setProperty('--p', Math.round(p.look.progress * 100)))
        root.querySelectorAll('[data-looktext]').forEach(el => { el.textContent = partSize({ size: item.size, progress: p.look.progress }) })
      }
    }
    if (p.sending && p.draft.every(i => i.progress >= 1)) { commit(p); continue }
    if (redraw) renderPhone(p)
  }
}

/* ---------- the page ---------- */
const GROUPS = [
  { key: 'state', label: 'State', opts: Object.entries(STATES).map(([k, s]) => [k, s.label]) },
  { key: 'open', label: 'Sent files', opts: [['quicklook', 'Open in Quick Look'], ['desktop', 'Open on the desktop']] },
  { key: 'theme', label: 'Theme', opts: [['dark', 'Dark'], ['light', 'Light']] },
  { key: 'width', label: 'Phone width', opts: [['375', '375 pt'], ['320', '320 pt']] },
  { key: 'zoom', label: 'Size', opts: [['1', 'Actual'], ['0.75', 'Smaller']] },
]
function controlsHTML() {
  return GROUPS.map(g => `<div class="group"><span class="glabel" id="g-${g.key}">${g.label}</span><div class="seg" role="group" aria-labelledby="g-${g.key}">${g.opts.map(([value, label]) => `<button type="button" data-set="${g.key}" data-val="${value}" aria-pressed="false">${esc(label)}</button>`).join('')}</div></div>`).join('')
    + '<button type="button" class="plain" id="reset">Start again</button>'
}
function notesHTML() {
  const ql = S.open === 'quicklook'
  const opt = (on, title, text) => `<div class="opt" data-on="${on}"><b>${title}${on ? ' (shown)' : ''}</b><p>${esc(text)}</p></div>`
  const extra = STATE_NOTES[S.state]
  return `<div class="pnote"><b>Choose one: what a sent file does when pressed.</b> Switch with Sent files above.<div class="opts">${opt(ql, 'Open in Quick Look', OPEN_TEXT.quicklook)}${opt(!ql, 'Open on the desktop', OPEN_TEXT.desktop)}</div></div>${extra ? `<p class="pnote">${extra}</p>` : ''}`
}
function apply() {
  document.documentElement.dataset.theme = S.theme
  document.body.dataset.width = S.width
  document.documentElement.style.setProperty('--z', S.zoom)
  const v = VARIANTS[S.variant], keys = Object.keys(VARIANTS)
  $('kicker').textContent = `PROTOTYPE · Files from the iPhone · ${keys.indexOf(S.variant) + 1} of ${keys.length}`
  $('vname').textContent = `${S.variant}: ${v.name}`
  $('thesis').textContent = v.thesis
  $('good').textContent = v.good
  $('cost').textContent = v.cost
  $('scenario').textContent = `${STATES[S.state].label}: ${STATES[S.state].line}`
  $('notes').innerHTML = notesHTML()
  $('vlab').textContent = `${S.variant} · ${v.name}`
  $('vline').textContent = v.line
  document.querySelectorAll('[data-set]').forEach(b => b.setAttribute('aria-pressed', String(S[b.dataset.set] === b.dataset.val)))
  const q = new URLSearchParams({ variant: S.variant, state: S.state })
  if (S.open !== 'quicklook') q.set('open', S.open)
  if (S.theme !== 'dark') q.set('theme', S.theme)
  if (S.width !== '375') q.set('width', S.width)
  if (S.zoom !== '1') q.set('zoom', S.zoom)
  try { history.replaceState(null, '', `${location.pathname}?${q}`) } catch (_) { /* a sandboxed frame may refuse; the page still works */ }
}
function build() {
  seq = 0
  const scenes = SCENES.filter(s => !s.only || s.only === S.open)
  phones = scenes.map((s, i) => Object.assign(preset(s.key), { pid: `ph${i + 1}`, scene: s, n: i + 1 }))
  $('board').innerHTML = phones.map(p => `<figure class="cell"><div class="frame"><div class="phone" id="${p.pid}" role="region" aria-label="Phone ${p.n}: ${esc(p.scene.title)}"></div></div><figcaption class="cap"><b>${p.n} · ${esc(p.scene.title)}</b><span>${esc(caption(p.scene.key))}</span></figcaption></figure>`).join('')
  phones.forEach(p => renderPhone(p))
  apply()
}
function stepVariant(d) {
  const keys = Object.keys(VARIANTS)
  S.variant = keys[(keys.indexOf(S.variant) + d + keys.length) % keys.length]
  build()
}

$('controls').innerHTML = controlsHTML()
$('controls').addEventListener('click', e => {
  const b = e.target.closest('button')
  if (!b) return
  if (b.id === 'reset') { build(); return }
  const key = b.dataset.set
  if (!key) return
  S[key] = b.dataset.val
  if (key === 'state' || key === 'open') build()
  else { apply(); if (key === 'width') phones.forEach(p => renderPhone(p)) }
})
$('prev').addEventListener('click', () => stepVariant(-1))
$('next').addEventListener('click', () => stepVariant(1))
$('board').addEventListener('click', e => {
  const el = e.target.closest('[data-act]')
  const root = el && el.closest('.phone')
  if (!root) return
  const p = phones.find(x => x.pid === root.id)
  if (p) act(p, el.dataset.act, el)
})
$('board').addEventListener('input', e => {
  if (!e.target.matches('.field')) return
  const root = e.target.closest('.phone'), p = phones.find(x => x.pid === root.id)
  p.text = e.target.value
  fit(e.target)
  const b = root.querySelector('.send'), ready = canSend(p)
  b.classList.toggle('send--on', ready || p.sending)
  if (ready) b.removeAttribute('aria-disabled'); else b.setAttribute('aria-disabled', 'true')
  const box = root.querySelector('.dock')
  box.classList.toggle('dock--full', Boolean(p.draft.length || p.notice))
})
document.addEventListener('keydown', e => {
  const t = e.target instanceof Element ? e.target : null
  const root = t && t.closest('.phone')
  const p = root && phones.find(x => x.pid === root.id)
  if (e.key === 'Escape' && p && p.overlay) { e.preventDefault(); closeTop(p); return }
  const menuEl = t && t.closest('.menu')
  if (menuEl && ['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(e.key)) {
    const items = [...menuEl.querySelectorAll('.mi')], at = items.indexOf(t)
    const next = e.key === 'Home' ? 0 : e.key === 'End' ? items.length - 1 : (at + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length
    items[next].focus()
    e.preventDefault()
    return
  }
  if (t && t.closest('textarea, input, select, [contenteditable], .menu, .sheet, .look')) return
  if (e.key === 'ArrowLeft') stepVariant(-1)
  if (e.key === 'ArrowRight') stepVariant(1)
})
window.addEventListener('resize', () => phones.forEach(p => fit($(p.pid) && $(p.pid).querySelector('.field'))))
build()
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => phones.forEach(p => fit($(p.pid).querySelector('.field'))))
setInterval(tick, 100)
</script>
</body>
</html>
