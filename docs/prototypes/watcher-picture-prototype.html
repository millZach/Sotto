<title>PROTOTYPE: Watcher's picture (Visualize)</title>
<!--
  PROTOTYPE, throwaway. Question: what should "Visualize" in Watcher's room look like?
  Three structurally different variants of the picture, switchable with ?variant=A|B|C and the bar at the bottom:
    A  Constellation: Watcher in the middle, projects as clusters, threads as nodes, blobs travel along the lines.
    B  Lanes: one lane per thread on a time axis, Watcher and You as lanes, messages drop between lanes.
    C  Board: Watcher's desk with the merge turns on top, projects as columns of compact thread tiles.
  Every variant runs on the same fake event log (four hours of history plus a live script), scrubs and replays it,
  and sits in the real room: header, All threads, Conversation | Watched, the Visualize button, the composer, the dock.
  Colours are theme roles through --tt-* tokens, mapped the way src/renderer/src/styles/tokens.css maps them.
-->

/* ---------- --tt-* tokens, as tokens.css derives them ---------- */
:root {
  --tt-canvas: var(--r-canvas); --tt-surface: var(--r-surface); --tt-surface-elevated: var(--r-raised); --tt-surface-overlay: var(--r-overlay);
  --tt-text: var(--r-text);
  --tt-text-2: color-mix(in oklab, var(--r-text) 55%, var(--r-muted-fg));
  --tt-text-muted: color-mix(in oklab, var(--r-muted-fg) 85%, var(--r-text));
  --tt-hairline: var(--r-border); --tt-border-faint: var(--r-border); --tt-field-border: var(--r-input);
  --tt-hover: color-mix(in srgb, var(--r-accent-surface) 70%, transparent);
  --tt-accent: var(--r-accent); --tt-accent-fg: var(--r-accent-fg); --tt-accent-text: var(--r-update-fg); --tt-activity: var(--tt-accent-text);
  --tt-warning: var(--r-warning-fg); --tt-attention: var(--tt-warning); --tt-error: var(--r-error-fg);
  --tt-message: var(--r-message);
  --tt-success: oklch(0.79 0.13 165);
  --tt-shadow-color: rgb(0 0 0 / 73%); --tt-shadow-overlay: 0 24px 72px -20px rgb(0 0 0 / 90%);
  --tt-owl-glow: color-mix(in srgb, var(--tt-accent) 11%, transparent);
  --tt-owl-room-night: color-mix(in oklab, var(--tt-canvas) 84%, oklch(0.42 0.07 265));
  --watcher-needs-ink: color-mix(in oklab, var(--tt-warning) 80%, var(--tt-text));
  --watcher-ready-ink: color-mix(in oklab, var(--tt-success) 80%, var(--tt-text));
}
:root:is([data-theme='sotto-light'], [data-theme='linen-light']) {
  --tt-success: oklch(0.445 0.11 158); --tt-shadow-color: rgb(20 24 22 / 18%); --tt-shadow-overlay: 0 24px 64px -24px rgb(0 0 0 / 45%);
  --tt-owl-glow: color-mix(in srgb, var(--tt-accent) 8%, transparent);
  --tt-owl-room-night: color-mix(in oklab, var(--tt-canvas) 90%, var(--tt-accent));
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #111; font-family: Figtree, ui-sans-serif, system-ui, sans-serif; color: var(--tt-text); overflow: hidden; }
:root:is([data-theme='sotto-light'], [data-theme='linen-light']) body { background: #8a8a86; }
button { font: inherit; color: inherit; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--tt-accent-text); outline-offset: 2px; }

/* ---------- The window ---------- */
#stage { position: fixed; inset: 0 0 64px 0; display: grid; place-items: center; }
#win { position: relative; display: grid; grid-template-rows: 44px auto minmax(0, 1fr) auto 54px; overflow: hidden; border-radius: 8px;
  background: var(--tt-canvas); box-shadow: 0 30px 80px rgb(0 0 0 / 55%); transform-origin: center; container-type: inline-size; container-name: pane; }
.sky { position: absolute; top: 0; left: 0; width: 520px; max-width: 100%; height: 104px; pointer-events: none;
  background: radial-gradient(130px 70px at 26px 22px, var(--tt-owl-glow), transparent 72%), var(--tt-owl-room-night);
  mask-image: linear-gradient(to right, black 34%, transparent), linear-gradient(to bottom, black 42%, transparent); mask-composite: intersect; }
.stars { position: absolute; top: 0; left: 0; width: 320px; height: 92px; pointer-events: none; }
.stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: var(--tt-text); opacity: .3; }

.head { position: relative; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 14px; -webkit-app-region: drag; }
.head > * { -webkit-app-region: no-drag; }
.tile { display: inline-grid; place-items: center; width: 24px; height: 24px; margin-right: 6px; border-radius: 6px; background: var(--tt-accent); color: var(--tt-accent-fg); flex: none; }
.head h1 { margin: 0 4px 0 0; font-size: 15px; font-weight: 500; letter-spacing: -.2px; white-space: nowrap; }
.hbtn { display: inline-flex; flex: none; align-items: center; gap: 6px; height: 30px; padding: 0 8px 0 9px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--tt-text-2); font-size: 13px; cursor: pointer; white-space: nowrap; }
.hbtn:hover { border-color: var(--tt-hairline); background: var(--tt-hover); color: var(--tt-text); }
.count { color: var(--tt-text-muted); font-variant-numeric: tabular-nums; }
.tabs { display: inline-flex; flex: none; gap: 2px; margin-left: 4px; padding: 2px; border: 1px solid var(--tt-hairline); border-radius: 9px; }
.tab { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--tt-text-2); font-size: 13px; white-space: nowrap; cursor: pointer; }
.tab:hover { color: var(--tt-text); }
.tab[aria-selected='true'] { background: var(--tt-surface-elevated); box-shadow: 0 1px 2px var(--tt-shadow-color); color: var(--tt-text); }
.tab .count { color: var(--tt-text-2); }
/* Visualize: a pressed toggle, lit the way Watch is lit on a thread's pane header. */
.viz { display: inline-flex; flex: none; align-items: center; gap: 6px; height: 30px; margin-left: 6px; padding: 0 11px 0 9px; border: 1px solid var(--tt-field-border); border-radius: 999px;
  background: transparent; color: var(--tt-text-2); font-size: 13px; white-space: nowrap; cursor: pointer; }
.viz:hover { background: var(--tt-hover); color: var(--tt-text); }
.viz[aria-pressed='true'] { border-color: color-mix(in srgb, var(--tt-accent-text) 50%, transparent); background: color-mix(in srgb, var(--tt-accent) 14%, var(--tt-canvas)); color: var(--tt-text); }
.viz[aria-pressed='true'] svg { color: var(--tt-accent-text); }
.viz.in-tabs { margin-left: 0; height: 26px; border: 0; border-radius: 7px; padding: 0 10px; }
.viz.in-tabs[aria-pressed='true'] { background: var(--tt-surface-elevated); box-shadow: 0 1px 2px var(--tt-shadow-color); }
.spacer { flex: 1; }
.wc { display: inline-grid; place-items: center; width: 40px; height: 30px; color: var(--tt-text-2); }
@container pane (width < 900px) { .viz-text { display: none; } .viz { padding: 0 8px; } }
@container pane (width < 860px) { .hbtn .list-text { display: none; } }

.glance { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; margin: 0 max(24px, calc((100% - 760px) / 2)); padding: 3px 0 9px;
  box-shadow: inset 0 -1px 0 var(--tt-hairline); color: var(--tt-text-muted); font-size: 13px; }
.glance b { color: var(--watcher-needs-ink); font-weight: 500; }
.glance a { color: var(--tt-text); text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); text-underline-offset: 3px; cursor: pointer; }
.glance .it { display: inline-flex; align-items: center; gap: 6px; }

#body { position: relative; min-height: 0; overflow: hidden; }
.transcript { height: 100%; overflow: auto; padding: 18px max(24px, calc((100% - 760px) / 2)); }
.msg { margin: 0 0 20px; font-size: 14.5px; line-height: 1.55; }
.msg .who { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--tt-text); font-weight: 500; }
.msg .who time { color: var(--tt-text-muted); font-weight: 400; margin-left: 8px; }
.msg.you { margin-left: auto; max-width: 78%; padding: 12px 16px; border: 1px solid var(--tt-hairline); border-radius: 12px; background: var(--tt-message); }
.msg p { margin: 6px 0 0; }
.watched-lead { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; color: var(--tt-text); font-size: 14px; line-height: 1.5; margin-bottom: 14px; }
.wgroup h3 { margin: 16px 0 8px; font-size: 13px; font-weight: 600; color: var(--tt-text-2); }
.wgroup[data-tone='needs'] h3 { color: var(--watcher-needs-ink); }
.wgroup h3 .count { margin-left: 6px; font-weight: 400; }
.wcard { list-style: none; display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 8px; padding: 12px 14px; margin-bottom: 8px; border: 1px solid var(--tt-hairline); border-radius: 12px; }
.wcard[data-tone='needs'] { border-left: 2px solid var(--tt-attention); }
.wcard .t { font-weight: 600; font-size: 14px; }
.wcard .m, .wcard .d { grid-column: 2 / 4; color: var(--tt-text-2); font-size: 12.5px; }
.pill-btn { height: 28px; padding: 0 12px; border: 1px solid var(--tt-field-border); border-radius: 999px; background: transparent; color: var(--tt-text); font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.pill-btn:hover { background: var(--tt-hover); }
.ul { margin: 0; padding: 0; }

.composer-wrap { padding: 0 max(24px, calc((100% - 760px) / 2)) 4px; }
.composer { border: 1px solid var(--tt-hairline); border-radius: 14px; background: var(--tt-canvas); padding: 12px 14px 10px; }
.composer .ph { color: var(--tt-text-muted); font-size: 14px; height: 44px; }
.composer .row { display: flex; align-items: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--tt-field-border); border-radius: 999px; font-size: 12.5px; color: var(--tt-text-2); white-space: nowrap; }
.send { margin-left: auto; width: 30px; height: 30px; border-radius: 50%; border: 0; background: color-mix(in srgb, var(--tt-accent) 70%, var(--tt-canvas)); color: var(--tt-accent-fg); display: grid; place-items: center; }
/* In the picture the composer keeps one line until it is focused, so the picture keeps the room's height. */
#win[data-viz] .composer { display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 14px; }
#win[data-viz] .composer .ph { height: auto; flex: 1; }
#win[data-viz] .composer .row .chip { display: none; }
#win[data-viz] .composer .row .chip.keep { display: inline-flex; }

.dock { display: grid; place-items: center; }
.dock .pill { display: flex; align-items: center; gap: 4px; height: 40px; padding: 4px 8px; border: 1px solid var(--tt-hairline); border-radius: 999px; background: var(--tt-surface-elevated); color: var(--tt-text-2); font-size: 13px; }
.dock .seg { display: grid; grid-template-columns: 70px 40px 70px; align-items: center; text-align: center; }
.dock .seg .on { display: inline-grid; place-items: center; height: 30px; border-radius: 999px; background: var(--tt-surface-overlay); color: var(--tt-accent-text); }
.dock .ico { width: 26px; height: 26px; display: grid; place-items: center; }

/* ---------- The picture: shared parts ---------- */
.pic { position: absolute; inset: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
.pic-canvas { position: relative; min-height: 0; overflow: hidden; }
.blobs { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 5; }
.blob { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 4px; will-change: transform; }
.blob .s, .mark .s, .key .s { display: block; flex: none; }
.s[data-kind='start'] { width: 12px; height: 12px; border: 2px solid var(--tt-accent-text); border-radius: 50%; background: var(--tt-canvas); }
.s[data-kind='steer'] { width: 9px; height: 9px; border-radius: 50%; background: var(--tt-accent-text); }
.s[data-kind='go'] { width: 11px; height: 11px; background: var(--tt-success); transform: rotate(45deg); border-radius: 2px; }
.s[data-kind='reply'] { width: 8px; height: 8px; border-radius: 50%; background: var(--tt-text-2); }
.s[data-kind='ready'] { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--tt-success); background: var(--tt-canvas); }
.s[data-kind='merged'] { width: 11px; height: 11px; border-radius: 50%; background: var(--tt-success); }
.s[data-kind='card'] { width: 12px; height: 12px; border-radius: 3px; background: var(--tt-attention); }
.s[data-kind='news'] { width: 9px; height: 9px; border-radius: 50%; border: 1.5px dashed var(--tt-text-muted); }
.btag { padding: 1px 6px; border: 1px solid var(--tt-hairline); border-radius: 999px; background: var(--tt-surface-elevated); font-size: 10.5px; font-weight: 600; letter-spacing: .2px; white-space: nowrap; color: var(--tt-text); }
.btag[data-kind='go'], .btag[data-kind='ready'], .btag[data-kind='merged'] { color: var(--watcher-ready-ink); }
.btag[data-kind='card'] { color: var(--watcher-needs-ink); }
.mark { position: absolute; display: flex; align-items: center; gap: 4px; pointer-events: none; z-index: 4; }

/* Thread state rings: the room's own vocabulary (watcher.css .watcher-row__ring). */
.ring { display: inline-block; flex: none; width: 10px; height: 10px; border: 1.5px solid var(--tt-text-muted); border-radius: 50%; }
.ring[data-tone='needs'] { border: 2px solid var(--tt-attention); }
.ring[data-tone='failed'] { border: 2px solid var(--tt-error); }
.ring:is([data-tone='ready'], [data-tone='landing']) { border: 0; background: var(--tt-success); }
.ring[data-tone='working'], .ring[data-tone='ci'] { border: 0; background: conic-gradient(var(--tt-activity) 0 32%, color-mix(in srgb, var(--tt-activity) 22%, transparent) 32% 100%); mask: radial-gradient(circle, transparent 38%, #000 42%); }
.ring[data-tone='ci'] { background: conic-gradient(var(--tt-text-2) 0 18%, transparent 18% 25%, var(--tt-text-2) 25% 43%, transparent 43% 50%, var(--tt-text-2) 50% 68%, transparent 68% 75%, var(--tt-text-2) 75% 93%, transparent 93%); }
.ring[data-tone='quiet'] { border: 1.5px dashed var(--tt-text-muted); }
.ring[data-tone='settled'] { border-color: var(--tt-hairline); }
@keyframes spin { to { transform: rotate(1turn); } }
:root:not([data-rm]) .ring:is([data-tone='working'], [data-tone='ci']) { animation: spin 1.5s linear infinite; }
:root:not([data-rm]) .ring[data-tone='ci'] { animation-duration: 6s; }
.word[data-tone='needs'] { color: var(--watcher-needs-ink); }
.word[data-tone='working'] { color: var(--tt-activity); }
.word:is([data-tone='ready'], [data-tone='landing']) { color: var(--watcher-ready-ink); }
.word:is([data-tone='quiet'], [data-tone='idle'], [data-tone='settled'], [data-tone='ci']) { color: var(--tt-text-2); }

.prc { display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; border: 1px solid var(--tt-hairline); border-radius: 999px; font-size: 11px; color: var(--tt-text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.prc i { width: 6px; height: 6px; border-radius: 50%; background: var(--tt-text-muted); }
.prc[data-checks='passed'] i { background: var(--tt-success); }
.prc[data-checks='failed'] i { background: var(--tt-error); }
.prc[data-checks='running'] i { background: transparent; border: 1.5px solid var(--tt-text-2); }
.prc[data-step='go'] { border-color: color-mix(in srgb, var(--tt-success) 60%, transparent); color: var(--watcher-ready-ink); }
.prc[data-state='merged'] { color: var(--tt-text-muted); }

/* Timeline under every variant */
.timebar { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px; border-top: 1px solid var(--tt-hairline); font-size: 12.5px; color: var(--tt-text-2); }
.tb-btn { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 1px solid var(--tt-field-border); border-radius: 999px; background: transparent; color: var(--tt-text); font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.tb-btn:hover { background: var(--tt-hover); }
.tb-btn[aria-pressed='true'] { border-color: color-mix(in srgb, var(--tt-accent-text) 50%, transparent); background: color-mix(in srgb, var(--tt-accent) 14%, var(--tt-canvas)); }
.track { position: relative; flex: 1; min-width: 120px; height: 26px; }
.track svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.track input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.track:focus-within { outline: 2px solid var(--tt-accent-text); outline-offset: 1px; border-radius: 4px; }
.when { min-width: 118px; text-align: right; font-variant-numeric: tabular-nums; color: var(--tt-text); white-space: nowrap; }
.when.past { color: var(--watcher-needs-ink); }
.livedot { width: 7px; height: 7px; border-radius: 50%; background: var(--tt-success); }
.speed { height: 26px; border: 1px solid var(--tt-field-border); border-radius: 999px; background: transparent; color: var(--tt-text); padding: 0 6px; font-size: 12px; }
@container pane (width < 900px) { .speed { display: none; } .when { min-width: 92px; } }

/* ======================= Folding the log into "where things stood at T" ======================= */
const TONE_WORD = { needs: 'Needs you', working: 'Working', ci: 'Waiting on checks', ready: 'Ready to merge', landing: 'Merging', quiet: 'Quiet', idle: 'Idle', settled: 'Settled' }
function stateAt(T) {
  const th = {}, queue = new Map()
  for (const e of EVENTS) {
    if (e.t > T) break
    let s = th[e.th] ??= { id: e.th, tone: 'idle', label: 'Idle', prs: new Map(), msgs: [], card: null, startedAt: e.t, lastAt: e.t }
    s.lastAt = e.t
    if (KIND[e.type]) s.msgs.push(e)
    const set = (tone, label) => { s.tone = tone; s.label = label ?? TONE_WORD[tone] }
    switch (e.type) {
      case 'start': set('working'); break
      case 'steer': if (s.tone === 'quiet' || s.tone === 'idle') set('working'); break
      case 'reply': case 'news': if (e.state) set(e.state, e.label); break
      case 'card': s.card = e; set('needs', e.kind === 'permission' ? 'Permission' : 'Question'); break
      case 'answer': s.card = null; set('working'); break
      case 'pr': { const p = s.prs.get(e.pr) ?? { pr: e.pr, state: 'open' }; p.checks = e.checks; s.prs.set(e.pr, p)
        if (e.checks === 'running' && s.tone !== 'needs') set('ci', 'Waiting on checks'); if (e.checks === 'failed') set('working', 'Checks failed, fixing'); break }
      case 'ready': queue.set(e.pr, { pr: e.pr, th: e.th, step: 'ready', at: e.t }); set('ready', `PR #${e.pr} ready to merge`); break
      case 'go': queue.set(e.pr, { pr: e.pr, th: e.th, step: 'go', at: e.t }); set('landing', `Merging #${e.pr}`); break
      case 'merged': queue.set(e.pr, { pr: e.pr, th: e.th, step: 'merged', at: e.t }); { const p = s.prs.get(e.pr); if (p) p.state = 'merged' } set('landing', `Merged #${e.pr}`); break
      case 'state': set(e.state, e.label); break
    }
  }
  for (const s of Object.values(th)) for (const p of s.prs.values()) { const q = queue.get(p.pr); if (q) p.step = q.step }
  return { th, queue: [...queue.values()].sort((a, b) => a.at - b.at) }
}
// Merge-turn order: merged (latest two), then GO, then READY in the order they said it.
function turnOrder(queue) {

}

}

// Rebuilding the picture must not take the keyboard's place away: remember what had focus and find it again.
function focusKey() { const a = document.activeElement; if (!a || !a.closest?.('.pic-canvas')) return null
  return { th: a.dataset?.th, inCard: !!a.closest('.card'), cls: a.className, text: a.textContent } }
function restoreFocus(k, canvas) { if (!k) return
  const pool = [...canvas.querySelectorAll(k.inCard ? '.card button' : 'button')]
  const el = k.th && !k.inCard ? canvas.querySelector(`[data-th="${k.th}"]`) : pool.find(b => b.className === k.cls && b.textContent === k.text)
  el?.focus({ preventScroll: true }) }
function renderPicture(withCard = true) {
  const fk = focusKey()
  const body = $('#body')
  let pic = body.querySelector('.pic')
  const S = stateAt(ui.P)
  if (!pic) { body.replaceChildren(); pic = h('div', { class: 'pic', role: 'tabpanel', 'aria-label': 'What Watcher is doing, as a picture' }, h('div', { class: 'pic-canvas' }), timebar()); body.append(pic) }
  const canvas = h('div', { class: 'pic-canvas', role: 'group', 'aria-label': ui.live ? 'Now' : `As it stood at ${fmt(ui.P)}` })
  const old = pic.querySelector('.pic-canvas'); const oldBlobs = old?.querySelector('.blobs')
  if (old) old.replaceWith(canvas); else pic.append(canvas)
  if (ui.variant === 'A') renderA(canvas, S); else if (ui.variant === 'B') renderB(canvas, S); else renderC(canvas, S)
  // keep blobs that are mid-flight across re-renders
  let layer = canvas.querySelector('.blobs')
  if (!layer) { layer = h('div', { class: 'blobs' }); canvas.append(layer) }
  if (oldBlobs) layer.append(...oldBlobs.children)
  if (ui.open && withCard) { const c = cardEl(S, { width: canvas.clientWidth, height: canvas.clientHeight }); if (c) canvas.append(c) }
  if (ui.keyOpen) canvas.append(keyPop())
  restoreFocus(fk, canvas)
}

function renderGlance(S) {
  const g = $('#glance'); g.replaceChildren()
  const ts = THREADS.filter(t => S.th[t.id]?.tone === 'needs')
  if (!ts.length) { g.style.display = 'none'; return }
  g.style.display = ''
  g.append(h('b', {}, `${ts.length} need${ts.length === 1 ? 's' : ''} you`))
  for (const t of ts) g.append(h('span', { class: 'it' }, ring('needs'), h('a', { tabindex: 0 }, t.title), h('span', {}, S.th[t.id].card?.kind ?? '')))
}

function render() {
  const live = stateAt(nowT())
  renderGlance(live)
  $('#wcount').textContent = visibleThreads(live, false).length
  const win = $('#win')
  win.toggleAttribute('data-viz', ui.viz)
  $('#viz').setAttribute('aria-pressed', ui.viz ? 'true' : 'false')
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === ui.tab && !(ui.inTabs && ui.viz))))
  if (ui.inTabs) $('#viz').setAttribute('aria-selected', String(ui.viz))
  const body = $('#body')
  if (ui.viz) { renderPicture(); updateTimebar() }
  else { body.replaceChildren(); ui.tab === 'watched' ? renderWatched(body, live) : renderConversation(body) }
  $('#vlabel').textContent = { A: 'A — Constellation', B: 'B — Lanes over time', C: 'C — Board' }[ui.variant]
}

/* ======================= Loop ======================= */
let lastFrame = performance.now(), lastP = ui.P, lastPaint = 0, held = false
addEventListener('pointerdown', () => { held = true }, true)
addEventListener('pointerup', () => setTimeout(() => { held = false }, 0), true)
function frame(now) {
  if (held) { lastFrame = now; requestAnimationFrame(frame); return }   // never rebuild under a press
  const dt = now - lastFrame; lastFrame = now
  runLiveScript()
  const before = ui.P
  if (ui.live) ui.P = nowT()
  else if (ui.playing) { ui.P = Math.min(nowT(), ui.P + dt * ui.speed); if (ui.P >= nowT() - 1000) { ui.live = true; ui.playing = false } }
  // Fire blobs for what the playhead just passed (live or replay), not while scrubbing.
  const passed = (ui.live || ui.playing) && ui.viz ? EVENTS.filter(e => e.t > lastP && e.t <= ui.P) : []
  const changed = EVENTS.some(e => e.t > lastP && e.t <= ui.P) || ui.P < lastP
  lastP = ui.P
  if (changed || now - lastPaint > (ui.variant === 'B' ? 1000 : 4000) || (ui.rm === false && Object.values(litUntil).some(u => u > now - 50 && u < now + 50))) {
    lastPaint = now
    if (ui.viz) { renderPicture(); updateTimebar() } else if (changed) render()
    renderGlance(stateAt(nowT()))
  }
  for (const e of passed.slice(-8)) playBlob(e)
  if (passed.length) lastPaint = now - 3900 * (ui.variant === 'B' ? 0 : 1) - 1000 * (ui.variant === 'B' ? 1 : 0) + 120
  requestAnimationFrame(frame)
}

/* ======================= Wiring ======================= */
function fit() {
  const [w, hh] = $('#size').value.split('x').map(Number)
  const win = $('#win'); win.style.width = w + 'px'; win.style.height = hh + 'px'
  const k = Math.min(1, (innerWidth - 24) / w, (innerHeight - 88) / hh)
  win.style.transform = `scale(${k})`
  render()
}
function setVariant(v) { ui.variant = v; ui.open = null; const u = new URL(location); u.searchParams.set('variant', v); history.replaceState(null, '', u); render() }
const VARS = ['A', 'B', 'C']
$('#pv').onclick = () => setVariant(VARS[(VARS.indexOf(ui.variant) + 2) % 3])
$('#nv').onclick = () => setVariant(VARS[(VARS.indexOf(ui.variant) + 1) % 3])
$('#theme').onchange = e => { document.documentElement.dataset.theme = e.target.value; const u = new URL(location); u.searchParams.set('theme', e.target.value); history.replaceState(null, '', u) }
$('#size').onchange = () => { const u = new URL(location); u.searchParams.set('size', $('#size').value); history.replaceState(null, '', u); fit() }
$('#rm').onchange = e => { ui.rm = e.target.checked; document.documentElement.toggleAttribute('data-rm', ui.rm); render() }
$('#intabs').onchange = e => { ui.inTabs = e.target.checked; const v = $('#viz'); if (ui.inTabs) { v.classList.add('in-tabs'); v.setAttribute('role', 'tab'); $('#tabs').append(v) } else { v.classList.remove('in-tabs'); v.removeAttribute('role'); $('#tabs').after(v) } render() }
$('#viz').onclick = () => { ui.viz = !ui.viz; ui.open = null; render() }
document.querySelectorAll('.tab').forEach(b => b.onclick = () => { ui.tab = b.dataset.tab; if (ui.inTabs) ui.viz = false; render() })
addEventListener('keydown', e => {
  const typing = e.target.closest?.('input:not([type=range]):not([type=checkbox]), textarea, [contenteditable]')
  if (e.ctrlKey && e.shiftKey && (e.key === 'V' || e.key === 'v')) { e.preventDefault(); ui.viz = !ui.viz; render(); return }
  if (e.key === 'Escape' && ui.keyOpen) { ui.keyOpen = false; render(); return }
  if (e.key === 'Escape' && ui.open) { closeCard(); return }
  if (typing || e.target.closest?.('.track, select')) return
  if (e.key === 'ArrowLeft' && e.altKey) $('#pv').click()
  if (e.key === 'ArrowRight' && e.altKey) $('#nv').click()
})
addEventListener('resize', fit)
// a few stars in the room's corner
{ const st = $('#stars'); for (let i = 0; i < 26; i++) { const s = document.createElement('i'); s.style.left = (Math.random() * 300) + 'px'; s.style.top = (Math.random() * 80) + 'px'; s.style.opacity = (.08 + Math.random() * .4).toFixed(2); st.append(s) } }

const q = new URLSearchParams(location.search)
if (VARS.includes(q.get('variant'))) ui.variant = q.get('variant')
if (q.get('theme')) { $('#theme').value = q.get('theme'); document.documentElement.dataset.theme = q.get('theme') }
if (q.get('size')) $('#size').value = q.get('size')
if (q.get('viz') !== '0') ui.viz = true
if (matchMedia('(prefers-reduced-motion: reduce)').matches) { $('#rm').checked = true; ui.rm = true; document.documentElement.setAttribute('data-rm', '') }
fit()
requestAnimationFrame(frame)
</script>
</body>
</html>
