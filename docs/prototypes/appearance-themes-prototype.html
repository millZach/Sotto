<!doctype html>
<!--
  PROTOTYPE, throwaway. Five proposed built-in themes to take the places of Linen, Nocturne and Tropic, each on real
  Sotto surfaces (thread list, transcript, composer, Watcher's night scene) in its light and dark halves.
  Switch themes with the bar at the bottom or the ← and → keys; ?variant=<theme> is shareable.
  Glass is see-through: the window shows a desktop behind it, blurred, and its contrast is measured over pure
  white and pure black, the two ends any wallpaper can reach.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sotto · proposed themes (prototype)</title>
<style>
  :root { color-scheme: dark; --bg: #0d0e10; --fg: #f1f1f0; --dim: #a9a9a6; --line: #26272a; --chip: #1b1c1f; --on: #f1f1f0; --onfg: #0d0e10; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 Figtree, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 20px 20px 90px; }
  header.top { max-width: 1320px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; }
  header.top > div { flex: 1 1 280px; min-width: 0; }
  .intro .note { flex: 1 1 240px; min-width: 0; }
  .proto-switcher span { max-width: 62vw; overflow: hidden; text-overflow: ellipsis; }
  header.top h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
  header.top p { margin: 2px 0 0; color: var(--dim); max-width: 70ch; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; max-width: 1320px; margin: 0 auto 16px; }
  .tabs button, .chips button { all: unset; cursor: pointer; padding: 7px 12px; border-radius: 999px; background: var(--chip); color: var(--fg); display: inline-flex; gap: 8px; align-items: center; }
  .tabs button[aria-pressed=true], .chips button[aria-pressed=true] { background: var(--on); color: var(--onfg); }
  .tabs button:focus-visible, .chips button:focus-visible { outline: 2px solid #8ab4ff; outline-offset: 2px; }
  .sw { display: inline-flex; width: 26px; height: 14px; border-radius: 4px; overflow: hidden; }
  .sw i { flex: 1; }
  .intro { max-width: 1320px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: baseline; }
  .intro h2 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: -.02em; }
  .intro .note { color: var(--dim); font-size: 15px; }
  .intro .tag { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--chip); color: var(--dim); }
  .glassbar { max-width: 1320px; margin: 0 auto 14px; display: none; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
  body[data-glass] .glassbar { display: flex; }
  .glassbar .k { color: var(--dim); font-size: 12px; margin-right: 6px; }
  .chips { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .halves { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
  @media (max-width: 920px) { .halves { grid-template-columns: minmax(0, 1fr); } body { padding: 14px 12px 90px; } }
  .half h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  .desk { border-radius: 14px; padding: 14px; display: grid; gap: 14px; background: #1a1b1e; }
  body[data-glass] .desk { background-size: cover; }
  .host { height: 330px; display: grid; }
  .host.watch { height: 300px; }
  @media (max-width: 560px) { .host { height: 300px; } .host.watch { height: 270px; } .desk { padding: 8px; } }
  .report { margin-top: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 4px 14px; font-size: 12.5px; }
  .report div { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--line); }
  .report b { font-variant-numeric: tabular-nums; font-weight: 600; }
  .report b[data-bad] { color: #ff8a80; }
  .report-note { color: var(--dim); font-size: 12px; margin: 6px 0 0; }
  .foot { max-width: 1320px; margin: 22px auto 0; color: var(--dim); font-size: 13px; display: grid; gap: 6px; }
  .foot strong { color: var(--fg); }
  label.rm { display: inline-flex; gap: 8px; align-items: center; color: var(--dim); font-size: 13px; cursor: pointer; }
</style>
<script src="appearance-prototype-kit.js"></script>
</head>
<body>
<header class="top">
  <div>
    <h1>Five proposed themes</h1>
    <p>In place of Linen, Nocturne and Tropic. Each one in its light and dark halves, on the thread list, a transcript, the composer and Watcher’s night scene. Pick any number to ship.</p>
  </div>
  <label class="rm"><input type="checkbox" id="rm"> Reduced motion</label>
</header>
<nav class="tabs" id="tabs" aria-label="Themes"></nav>
<section class="intro"><h2 id="name"></h2><span class="note" id="note"></span><span class="tag" id="tag"></span></section>
<section class="glassbar" aria-label="Glass desktop">
  <span><span class="k">Desktop behind the window</span><span class="chips" id="walls"></span></span>
  <span><span class="k">Platform</span><span class="chips" id="plats"></span></span>
</section>
<main class="halves" id="halves"></main>
<section class="foot" id="foot"></section>

<script>
  const { THEMES, PROPOSED, WALLPAPERS } = Kit
  const REPLACES = { glass: 'New: the see-through look.', graphite: 'Closest to Nocturne for anyone on it today.', plum: 'A second dark-first theme with colour.', clay: 'Closest to Linen for anyone on it today.', fern: 'Closest to Tropic for anyone on it today.' }
  const PLATFORMS = { windows: 'Windows · Acrylic', mica: 'Windows · Mica', mac: 'macOS · vibrancy', linux: 'Linux · in-app glass' }
  const state = { theme: 'glass', wall: 'bloom', platform: 'windows' }
  const body = document.body

  const swatch = (id) => { const t = THEMES[id]; return `<span class="sw" aria-hidden="true">${['canvas', 'sidebar', 'message', 'accent'].map(r => `<i style="background:${t.dark[r]}"></i>`).join('')}</span>` }
  document.getElementById('tabs').innerHTML = PROPOSED.map(id => `<button data-id="${id}">${swatch(id)}${THEMES[id].label}</button>`).join('')
  document.getElementById('tabs').onclick = e => { const b = e.target.closest('button'); if (b) go(b.dataset.id) }
  document.getElementById('walls').innerHTML = Object.entries(WALLPAPERS).map(([k, w]) => `<button data-k="${k}">${w.label}</button>`).join('')
  document.getElementById('walls').onclick = e => { const b = e.target.closest('button'); if (b) { state.wall = b.dataset.k; render() } }
  document.getElementById('plats').innerHTML = Object.entries(PLATFORMS).map(([k, l]) => `<button data-k="${k}">${l}</button>`).join('')
  document.getElementById('plats').onclick = e => { const b = e.target.closest('button'); if (b) { state.platform = b.dataset.k; render() } }
  document.getElementById('rm').onchange = e => Kit.Scene.setReduced(e.currentTarget.checked)

  const halves = document.getElementById('halves')
  halves.innerHTML = ['light', 'dark'].map(mode => `<section class="half" data-mode="${mode}"><h3>${mode === 'light' ? 'Light' : 'Dark'}</h3>
    <div class="desk"><div class="host" data-host="threads"></div><div class="host watch" data-host="watcher"></div></div>
    <div class="report" data-report></div><p class="report-note" data-rnote></p></section>`).join('')
  const wins = {}
  for (const sec of halves.querySelectorAll('.half')) {
    const mode = sec.dataset.mode
    wins[mode] = { threads: Kit.mountWindow(sec.querySelector('[data-host=threads]'), 'threads'), watcher: Kit.mountWindow(sec.querySelector('[data-host=watcher]'), 'watcher') }
  }

  let bar = null
  function go(id) { state.theme = id; render(); bar?.set(id) }

  function render() {
    const t = THEMES[state.theme]
    body.toggleAttribute('data-glass', !!t.glass)
    for (const b of document.querySelectorAll('#tabs button')) b.setAttribute('aria-pressed', b.dataset.id === state.theme)
    for (const b of document.querySelectorAll('#walls button')) b.setAttribute('aria-pressed', b.dataset.k === state.wall)
    for (const b of document.querySelectorAll('#plats button')) b.setAttribute('aria-pressed', b.dataset.k === state.platform)
    document.getElementById('name').textContent = t.label
    document.getElementById('note').textContent = t.note
    document.getElementById('tag').textContent = REPLACES[state.theme]
    for (const sec of halves.querySelectorAll('.half')) {
      const mode = sec.dataset.mode
      const desk = sec.querySelector('.desk')
      desk.style.background = t.glass ? (state.platform === 'linux' ? (mode === 'dark' ? '#111' : '#ddd') : WALLPAPERS[state.wall].css) : ''
      for (const view of ['threads', 'watcher']) Kit.paintWindow(wins[mode][view], state.theme, mode, { platform: state.platform, effort: 'ember' })
      const rows = Kit.contrastReport(t[mode], !!t.glass)
      sec.querySelector('[data-report]').innerHTML = rows.map(r => `<div><span>${r.label}</span><b ${r.value < r.bar ? 'data-bad' : ''}>${r.value.toFixed(2)}:1</b></div>`).join('')
      const low = Math.min(...rows.filter(r => r.bar === 4.5).map(r => r.value))
      sec.querySelector('[data-rnote]').textContent = t.glass
        ? `Lowest for words: ${low.toFixed(2)}:1, measured with the desktop pure white and pure black, the worst any wallpaper can do before blur. ${low >= 4.5 ? 'Meets 4.5:1 over any desktop.' : 'Below 4.5:1.'}`
        : `Lowest for words: ${low.toFixed(2)}:1. ${low >= 4.5 ? 'Meets 4.5:1.' : 'Below 4.5:1.'} The accent on the room is held to 3:1, the bar for focus rings and fills.`
    }
    document.getElementById('foot').innerHTML = t.glass
      ? `<div><strong>How Glass reaches the desktop.</strong> Windows 11 uses Acrylic (blurs whatever is behind, windows included) or Mica (samples only the wallpaper, quieter). macOS uses the window’s vibrancy. Linux has no blur behind windows that Sotto can count on, so Glass paints its own soft backdrop and keeps the same frosted panes in the window.</div>
         <div><strong>Readability.</strong> The tint is heavy enough that every line of words keeps 4.5:1 even if the desktop behind is pure white or pure black. Blur only softens the desktop further, so the real contrast is higher. Stripes is the hard case.</div>
         <div><strong>In this browser.</strong> The desktop is a picture under the window and the blur is CSS, so the real Acrylic and vibrancy will look a little different.</div>`
      : `<div><strong>Contrast.</strong> Every line of words on the room, the sidebar, the composer, your message and the selected row keeps 4.5:1. The night scene is capped under Watcher’s column so the words stay above 4.5:1 there too, and its stars only dim and brighten slowly.</div>`
  }

  const params = new URLSearchParams(location.search)
  if (params.get('variant') in THEMES) state.theme = params.get('variant')
  render()
  bar = Kit.switcher(Object.fromEntries(PROPOSED.map(id => [id, THEMES[id].label])), state.theme, id => { if (id !== state.theme) { state.theme = id; render() } })
</script>
</body>
</html>
