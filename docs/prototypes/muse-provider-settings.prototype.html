* { box-sizing:border-box; } html,body { height:100%; margin:0; } body { font:14px/1.55 Figtree,system-ui,sans-serif; color:var(--tt-text); background:var(--tt-background); }
button,input,select { font:inherit; } button,a { -webkit-tap-highlight-color:transparent; } button { color:inherit; cursor:pointer; } button:disabled { cursor:default; opacity:.55; }
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible { outline:2px solid var(--tt-focus-ring); outline-offset:3px; }
button { border:0; background:transparent; } a { color:var(--tt-activity); } p { color:var(--tt-text-muted); margin:0; } h1,h2,h3,h4 { margin:0; font-weight:600; line-height:1.25; } h1 { font-size:24px; } h2 { font-size:26px; } h3 { font-size:18px; } h4 { font-size:14px; }
.shell { height:100%; display:grid; grid-template-columns:248px minmax(0,1fr); } .sidebar { display:flex; flex-direction:column; border-right:1px solid var(--tt-hairline); background:var(--tt-sidebar); min-height:0; }
.sidebar-top { height:64px; display:flex; align-items:center; padding:20px 22px; gap:10px; }.sotto-mark { width:25px;height:25px;flex:none; }.sidebar-top strong { font-weight:600; }.sidebar-body { padding:8px 14px 16px; overflow:auto; }.sidebar-body h1 { padding:8px 8px 23px; }

function tabs() { return `<div class="detail-tabs" role="tablist" aria-label="Provider details"><button id="configuration-tab" role="tab" aria-selected="${state.tab === 'configuration'}" aria-controls="provider-panel" tabindex="${state.tab === 'configuration' ? 0 : -1}" data-action="configuration">Configuration</button><button id="models-tab" role="tab" aria-selected="${state.tab === 'models'}" aria-controls="provider-panel" tabindex="${state.tab === 'models' ? 0 : -1}" data-action="models">Models</button></div>`; }
function updateText() {
  if(!state.checks) return 'Client update checks are off. Turn them on to check published versions.';
  if(!state.connected) return 'Connect Muse to read its installed version.';
  if(state.update === 'checking') return 'Checking the version published by Muse…';
  if(state.update === 'updating') return `Installing ${state.published}. Your working threads carry on.`;
  if(state.update === 'failed') return `${state.installed} is still installed. The update did not finish. Your threads and drafts are kept.`;
  if(state.update === 'updated') return `${state.installed} is installed, and that is what Muse publishes.`;
  if(!state.managed) return `${state.installed} is installed; ${state.published} is published. Update it with the installer you used.`;
  return `${state.installed} is installed; ${state.published} is published. Your threads keep working while it installs.`;
}
function updateButtons() { const canUpdate=state.connected && state.checks && state.managed && !['updated','checking','updating'].includes(state.update);return `<div class="buttons">${canUpdate ? `<button class="button primary" data-action="update" ${busy() ? 'disabled' : ''}>${state.update === 'failed' ? 'Try again' : 'Update'}</button>` : state.connected && state.checks && !state.managed ? '<button class="button" data-action="install-steps">Installation steps</button>' : ''}<button class="button" data-action="check" ${!state.checks || !state.connected || busy() ? 'disabled' : ''}>${state.update === 'checking' ? 'Checking…' : 'Check again'}</button></div>`; }

function threadSupport() { return `<p class="support-note">New threads use the agent selected in Settings → Agents.</p><details class="thread-support" ${state.supportOpen ? 'open' : ''}><summary>Threads with Muse</summary><p>Streaming replies, images, steering, approvals, questions and reasoning effort. Models and permissions can change during a session.</p><p class="limitations">Sotto's browser tools, Watcher and the skill picker are unavailable. Titles, branch names and Git drafts keep Sotto's default text; Muse does not write them.</p></details>`; }
function configurationA() { return `${connectionRow()}<div class="detail-row"><div><h4>Installed client</h4><p ${state.update === 'updated' ? 'class="success"' : ''}>${updateText()}</p>${progress()}</div>${updateButtons()}</div>${threadSupport()}${alerts()}`; }
function configurationB() { return `<div class="version-overview"><div class="version-pair"><div><small>Installed</small><strong>${state.connected ? state.installed : 'Connect to read'}</strong></div><span class="arrow">→</span><div><small>Published by Muse</small><strong>${state.connected && state.checks ? state.published : 'Not checked'}</strong></div></div>${updateButtons()}</div><p class="${state.update === 'updated' ? 'success' : ''}" style="margin-bottom:25px">${updateText()}</p>${progress()}${connectionRow()}${threadSupport()}${alerts()}`; }
function alerts() { if(state.connection === 'error') return '<p class="alert" role="alert">Muse could not connect. Your threads and drafts are kept. Run <strong>muse login</strong> in a terminal, then try again.</p>'; if(state.update === 'failed') return '<p class="alert" role="alert">Muse could not download its update. Nothing was replaced. Try again, or open the installation steps.</p>'; return ''; }
function models() { return state.connected ? '<ul class="models" aria-label="Muse available models"><li><span><strong>Muse Spark 1.2</strong><small>none · minimal · low · medium · high · xhigh · max · ultra</small></span><span class="availability">Available</span></li></ul><p class="model-foot">Choose the starting model in Settings → Agents, or change it in a thread.</p><p class="model-foot">Muse supplies this catalog from the account signed in on this computer.</p>' : '<p>Connect Muse to load its models.</p><button class="button primary" data-action="connect" style="margin-top:18px">Connect Muse</button>'; }
function updatesSetting() { return `<div class="providers-updates"><div><h4>Check for client updates</h4><p>Checks each provider's published version, at most once an hour. Muse uses its own release feed. Off, Sotto does not check versions or offer updates.</p></div><button class="toggle" role="switch" aria-label="Check for client updates" aria-checked="${state.checks}" data-action="toggle-checks"></button></div>`; }
function VariantA() { return `<div class="providers-workspace">${providerList()}<section class="provider-detail" aria-label="Provider configuration">${header()}${tabs()}<div class="detail-body" id="provider-panel" role="tabpanel" aria-labelledby="${state.tab}-tab">${state.tab === 'models' ? models() : configurationA()}</div></section></div>${updatesSetting()}`; }
function VariantB() { return `<div class="providers-workspace">${providerStrip()}<section class="provider-detail" aria-label="Provider configuration">${header()}${tabs()}<div class="detail-body" id="provider-panel" role="tabpanel" aria-labelledby="${state.tab}-tab">${state.tab === 'models' ? models() : configurationB()}</div></section></div>${updatesSetting()}`; }
const stateOptions=[['available','Connected · update available'],['disconnected','Disconnected'],['connection-error','Connection refused'],['checking','Checking version'],['updating','Installing update'],['updated','Update complete'],['failed','Update failed'],['unknown-install','Install source unknown']];
function selectedState() { return !state.managed ? 'unknown-install' : state.connection === 'error' ? 'connection-error' : !state.connected ? 'disconnected' : state.update; }
function drawer() { return state.drawer ? `<aside class="state-drawer" aria-label="Prototype controls"><div class="drawer-heading"><h3>Try the states</h3><button data-action="drawer" aria-label="Close prototype controls">×</button></div><p>These controls change this prototype only. No sign-in, installation or network request runs.</p><label>Show state<select id="example-state">${stateOptions.map(([id,label])=>`<option value="${id}" ${selectedState() === id ? 'selected' : ''}>${label}</option>`).join('')}</select></label><label class="check"><input id="fail-next" type="checkbox" ${state.failNext ? 'checked' : ''}>Make the next update fail</label><button class="button" data-action="reset" style="margin-top:16px">Reset example</button><div class="source"><strong>What is verified</strong><p class="disclaimer">The logo is the Muse product squiggle from the favicon on muse.ai.</p><a href="https://muse.ai/images/favicon/app-squiggle.svg" target="_blank" rel="noreferrer">Official Muse product mark</a><a href="https://dev.meta.ai/docs/muse-code" target="_blank" rel="noreferrer">Muse install and sign-in</a><a href="https://api.meta.ai/muse-code/channels/muse-stable" target="_blank" rel="noreferrer">Muse's native release feed</a><p class="disclaimer">Example versions use the installed 1.4.6 probe and published 1.4.7-R6101.1 reading. Models illustrate the published Muse Spark 1.2 default.</p><p class="disclaimer">The Update button simulates a proposed official-launcher flow. It runs no live update or version check. At the time this prototype was made, Sotto's Muse adapter had no published-version or one-click update route.</p></div></aside>` : ''; }
function PrototypeSwitcher() { return `<nav class="prototype-switcher" aria-label="Prototype variants"><span class="eyebrow">PROTOTYPE</span><button data-action="previous" aria-label="Previous variant">←</button><strong>${variant} · ${names[variant]}</strong><button data-action="next" aria-label="Next variant">→</button><span class="bar-divider"></span><button class="appearance-toggle" data-action="appearance">${document.documentElement.dataset.appearance === 'dark' ? 'Light' : 'Dark'}</button><button data-action="drawer" aria-expanded="${state.drawer}">Try states</button></nav>`; }
function modal() { return state.modal ? `<div class="modal-shade"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="install-heading" tabindex="-1"><h3 id="install-heading">Install Muse with its own installer</h3><p>In a Windows terminal, run Meta's installation command. Then return here and check the installed version.</p><code>irm https://dev.meta.ai/install.ps1 | iex</code><p>This prototype copies or shows the command. It does not run it.</p><div class="buttons"><a href="https://dev.meta.ai/docs/muse-code" target="_blank" rel="noreferrer">Installation guide</a><button class="button" data-action="copy-install">${state.notice === 'install-copied' ? 'Copied' : 'Copy command'}</button><button class="button primary" data-action="close-modal">Done</button></div></section></div>` : ''; }
function render(focusAction) { document.getElementById('app').innerHTML=`<div class="shell">${sidebar()}<main class="room variant-${variant.toLowerCase()}"><div class="window-controls" aria-hidden="true">${icons.minus}${icons.window}${icons.close}</div><div class="settings-form"><div class="prototype-label"><span>UI prototype</span> Muse in Settings · Example data</div><header class="page-heading"><h2>Providers</h2><p>Accounts &amp; connections</p></header>${variant === 'A' ? VariantA() : VariantB()}<p class="save-note">Changes save as you make them.</p></div></main></div>${PrototypeSwitcher()}${drawer()}${modal()}`;if(focusAction)document.querySelector(`[data-action="${focusAction}"]`)?.focus(); }
function chooseVariant(next) { variant=next;url.searchParams.set('variant',variant);history.replaceState(null,'',url);render(next === 'A' ? 'previous' : 'next'); }
function showState(value) { task++;state={...state,connected:!['disconnected','connection-error'].includes(value),connection:value === 'connection-error' ? 'error' : 'idle',installed:value === 'updated' ? '1.4.7-R6101.1' : '1.4.6',published:'1.4.7-R6101.1',update:['checking','updating','updated','failed'].includes(value) ? value : 'available',progress:value === 'updating' ? 54 : 0,managed:value !== 'unknown-install',notice:''};render(); }
async function copyText(text) { try { await navigator.clipboard.writeText(text); } catch { const field=document.createElement('textarea');field.value=text;field.style.position='fixed';field.style.opacity='0';document.body.append(field);field.select();document.execCommand('copy');field.remove(); } }
function mockUpdate() { const token=++task;state.update='updating';state.progress=12;render('update');const next=()=>{if(token !== task)return;state.progress+=22;if(state.progress>=100){state.progress=100;state.update=state.failNext ? 'failed' : 'updated';if(!state.failNext)state.installed=state.published;state.failNext=false;render('check');return;}render();setTimeout(next,360);};setTimeout(next,360); }
document.addEventListener('click',async event=>{const button=event.target.closest('[data-action]');if(!button || button.disabled)return;const action=button.dataset.action;
  if(action === 'previous' || action === 'next'){chooseVariant(variant === 'A' ? 'B' : 'A');return;}
  if(action === 'appearance'){document.documentElement.dataset.appearance=document.documentElement.dataset.appearance === 'dark' ? 'light' : 'dark';url.searchParams.set('appearance',document.documentElement.dataset.appearance);history.replaceState(null,'',url);render(action);return;}
  if(action === 'drawer'){state.drawer=!state.drawer;render(action);return;}
  if(action === 'configuration' || action === 'models'){state.tab=action;render(action);return;}
  if(action === 'connect'){if(state.connected){state.connected=false;state.connection='idle';render('connect');}else{const token=++task;state.connection='connecting';render();setTimeout(()=>{if(token !== task)return;state.connected=true;state.connection='idle';render('connect');},550);}return;}
  if(action === 'check' || action === 'refresh'){const token=++task;state.update='checking';render();setTimeout(()=>{if(token !== task)return;state.update=state.installed === state.published ? 'updated' : 'available';render('check');},650);return;}
  if(action === 'update'){mockUpdate();return;}
  if(action === 'toggle-checks'){state.checks=!state.checks;render(action);return;}
  if(action === 'copy-login'){await copyText('muse login');state.notice='login-copied';render(action);return;}
  if(action === 'install-steps'){state.modal=true;render();document.querySelector('.modal').focus();return;}
  if(action === 'close-modal'){state.modal=false;render('install-steps');return;}
  if(action === 'copy-install'){await copyText('irm https://dev.meta.ai/install.ps1 | iex');state.notice='install-copied';render(action);return;}
  if(action === 'reset'){state.checks=true;state.tab='configuration';state.failNext=false;showState('available');return;}
});
document.addEventListener('change',event=>{if(event.target.id === 'example-state')showState(event.target.value);if(event.target.id === 'fail-next')state.failNext=event.target.checked;});
document.addEventListener('toggle',event=>{if(event.target.matches('.thread-support'))state.supportOpen=event.target.open;},true);
document.addEventListener('keydown',event=>{if(event.key === 'Escape'){if(state.modal){state.modal=false;render('install-steps');}else if(state.drawer){state.drawer=false;render('drawer');}return;}if(event.target.matches('[role="tab"]') && ['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();state.tab=state.tab === 'configuration' ? 'models' : 'configuration';render(state.tab);return;}if(state.modal && event.key === 'Tab'){const fields=[...document.querySelectorAll('.modal a,.modal button')];const first=fields[0],last=fields.at(-1);if(event.shiftKey && (document.activeElement === first || document.activeElement.matches('.modal'))){event.preventDefault();last.focus();}else if(!event.shiftKey && document.activeElement === last){event.preventDefault();first.focus();}return;}if(['ArrowLeft','ArrowRight'].includes(event.key) && !event.target.matches('input,textarea,select,[contenteditable]') && !event.target.closest('.state-drawer,.modal')){event.preventDefault();chooseVariant(variant === 'A' ? 'B' : 'A');}});
render();
</script>
</html>
