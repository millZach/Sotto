<!doctype html>
<!--
  PROTOTYPE - throwaway. Not the app. Meshy ticket 5 (#2497, ADR-0141): the 3D models page and Tools > 3D models.

  Question: what variant C, "one large view with the details beside it and a filmstrip below" (Zach's pick, October 22,
  2026, from docs/prototypes/meshy-models-prototype.html), and the Tools surface look like in today's Sotto, with what
  tickets 2 to 4 built behind them: GLB, USDZ and a still picture per 3D model, credits counted from the 1st, records
  whose files may be gone. The 3D drawing is the October mock-up's own small renderer; the built page draws the GLB.

  State lives in the URL: ?surface=page|tools, &state=models|making|gone|empty (page), &tools=view|list,
  &failed=thread|page, &theme=light, &motion=reduced. The bar at the bottom is the prototype's. H hides it.
  No network, no persistence.
-->

:root{

  --model-wood:#8a5a32;--model-wood-dark:#5e3b1f;--model-iron:#4a4c52;--model-gold:#c99a2e;

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--tt-canvas);color:var(--tt-text);font:14px/1.45 Figtree,system-ui,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;border-radius:8px;padding:0}
:focus-visible{outline:2px solid var(--tt-focus-ring);outline-offset:1px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:'Spline Sans Mono',ui-monospace,Consolas,monospace;font-size:12.5px}
.muted{color:var(--tt-text-muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.drag{-webkit-app-region:drag}
.drag button,.drag input,.drag select{-webkit-app-region:no-drag}

/* ---------- model viewer ---------- */
.mv{display:block;position:relative;background:var(--tt-surface-sunken);color:var(--tt-text);touch-action:none;overflow:hidden;min-height:0}
.mv[data-interactive="1"]{cursor:grab}
.mv[data-interactive="1"]:active{cursor:grabbing}
.mv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.mv-hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--tt-text-muted);pointer-events:none;background:color-mix(in srgb,var(--tt-surface-sunken) 80%,transparent);padding:1px 6px;border-radius:6px}
.mv-over{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12px;color:var(--tt-text-2);pointer-events:none}
.mv-over b{display:block;color:var(--tt-text);font-weight:600}
.mv-over span{font-size:13px;color:var(--tt-text-muted)}
.prog{height:4px;border-radius:99px;background:var(--tt-hairline);overflow:hidden;position:relative}
.prog i{display:block;height:100%;background:var(--tt-accent);border-radius:99px}
.prog::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--tt-canvas) 45%,transparent),transparent);transform:translateX(-100%);animation:sweep 1.8s ease-in-out infinite}
@keyframes sweep{to{transform:translateX(100%)}}
.ring{width:22px;height:22px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:var(--tt-hairline)}
.ring .fg{stroke:var(--tt-accent);stroke-linecap:round}

/* model card shared */
.mc{border:1px solid var(--tt-border-faint);border-radius:14px;background:var(--tt-code-bg);overflow:hidden;margin:12px 0 16px;container-type:inline-size}
.mc-bar{display:flex;align-items:center;gap:10px;min-height:42px;padding:4px 4px 4px 14px;border-bottom:1px solid var(--tt-hairline);background:var(--tt-surface-elevated)}
.mc-head{display:flex;flex:1;align-items:baseline;gap:10px;min-width:0;overflow:hidden}
.mc-head h3{margin:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* A: chip that opens */

[data-motion=reduced] *,[data-motion=reduced] *::before,[data-motion=reduced] *::after{animation:none!important;transition:none!important}

.proto-bar[hidden],.proto-show[hidden]{display:none}

/* ---------- today's window ---------- */
.win{display:grid;grid-template-columns:280px 1fr;height:100vh;height:100dvh}
.win.tools{grid-template-columns:280px 1fr minmax(340px,40%) 72px}

/* ---------- the page, C ---------- */
.page{flex:1;display:flex;flex-direction:column;min-height:0;padding:8px 20px 14px}

.facts{margin:0;color:var(--tt-text-muted);font-size:13px}
.facts b{color:var(--tt-text);font-weight:600}
.list-h{display:flex;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--tt-text-muted);margin-top:4px}
.list-h .n{margin-left:auto}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.mlist button{width:100%;display:flex;align-items:center;gap:10px;padding:6px;border-radius:10px;text-align:left}
.mlist button[aria-current=true]{background:var(--tt-sidebar-row-active)}
.mlist button:hover{background:var(--tt-hover)}
.mlist .pic{width:40px;height:40px;border-radius:8px;background:var(--tt-surface-elevated);overflow:hidden;flex:none;display:grid;place-items:center}
.mlist .pic .mv{width:40px;height:40px}
.mlist .txt{flex:1;min-width:0;display:grid}
.mlist .txt b{font-size:13.5px;font-weight:600}.mlist .txt span{font-size:12.5px;color:var(--tt-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlist .cr{font-size:12.5px;color:var(--tt-text-muted)}
.panel-f{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-top:1px solid var(--tt-hairline);font-size:13px;color:var(--tt-text-muted);flex:none}
.rail{border-left:1px solid var(--tt-hairline);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;background:var(--tt-canvas)}
.rail button{width:64px;display:grid;justify-items:center;gap:2px;padding:6px 0;border-radius:10px;font-size:12px;color:var(--tt-text-muted);position:relative}
.rail button.on{background:var(--tt-hover);color:var(--tt-text)}
.rail button .dot{position:absolute;top:6px;right:16px;width:7px;height:7px;border-radius:50%;background:var(--tt-accent)}

/* narrow: the page stacks, the window gives way */
@media (max-width:1000px){.stage{grid-template-columns:1fr;grid-template-rows:minmax(220px,1fr) auto}.win.tools{grid-template-columns:1fr minmax(300px,52%) 72px}.win.tools .side{display:none}}
@media (max-width:760px){
  .win,.win.tools{grid-template-columns:1fr}.side,.rail,.win.tools .main{display:none}
  .page{padding:8px 12px 120px}.page-h .search{display:none}.stage{grid-template-rows:260px auto}
}

/* Centre each mesh on the origin and scale it to a unit radius. */
const MESH = {};
for (const [k, build] of Object.entries(MESHES)) {
  const faces = build(); const all = faces.flatMap(f => f.p);
  const mn = [0, 1, 2].map(i => Math.min(...all.map(p => p[i]))), mx = [0, 1, 2].map(i => Math.max(...all.map(p => p[i])));
  const c = [0, 1, 2].map(i => (mn[i] + mx[i]) / 2); const r = Math.max(...all.map(p => Math.hypot(...sub(p, c))));
  MESH[k] = { faces: faces.map(f => ({ p: f.p.map(p => sub(p, c).map(v => v / r)), m: f.m })), floor: (mn[1] - c[1]) / r };

const LIGHT = norm([-0.45, 0.75, 0.6]);
function draw(v) {
  const cv = v.canvas, ctx = v.ctx, dpr = Math.min(2, devicePixelRatio || 1);
  const w = v.el.clientWidth, h = v.el.clientHeight; if (!w || !h) return;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  const D = 4, f = Math.min(w, h) * 1.5 * v.zoom, cx = w / 2, cy = h / 2 + Math.min(w, h) * 0.04;
  const cyaw = Math.cos(v.yaw), syaw = Math.sin(v.yaw), cp = Math.cos(v.pitch), sp = Math.sin(v.pitch);
  const T = p => { const x = p[0] * cyaw + p[2] * syaw, z0 = -p[0] * syaw + p[2] * cyaw; return [x, p[1] * cp - z0 * sp, p[1] * sp + z0 * cp]; };
  const S = p => { const d = D - p[2]; return [cx + p[0] * f / d, cy - p[1] * f / d]; };
  const mesh = MESH[v.mesh];
  // floor shadow
  const fc = S(T([0, mesh.floor, 0])), rx = 0.78 * f / D;
  ctx.fillStyle = `rgb(${INK.text.join(' ')} / ${v.mode === 'pending' ? 0.05 : 0.1})`;
  ctx.beginPath(); ctx.ellipse(fc[0], fc[1], rx, rx * (0.12 + 0.3 * Math.abs(sp)), 0, 0, Math.PI * 2); ctx.fill();
  if (v.mode === 'pending') {
    const s = 0.62, corners = []; for (const x of [-s, s]) for (const y of [-s, s]) for (const z of [-s, s]) corners.push(S(T([x, y, z])));
    const edges = [[0, 1], [2, 3], [4, 5], [6, 7], [0, 2], [1, 3], [4, 6], [5, 7], [0, 4], [1, 5], [2, 6], [3, 7]];
    ctx.strokeStyle = `rgb(${INK.faint.join(' ')})`; ctx.lineWidth = 1.2; ctx.setLineDash([4, 5]);
    ctx.beginPath(); for (const [a, b] of edges) { ctx.moveTo(...corners[a]); ctx.lineTo(...corners[b]); } ctx.stroke(); ctx.setLineDash([]);
    return;
  }
  const list = [];
  for (const face of mesh.faces) {
    const tp = face.p.map(T), n = norm(newell(tp)), c = centroid(tp);
    if (dot(n, sub([0, 0, D], c)) <= 0) continue;
    list.push({ tp, n, z: c[2], m: face.m });
  }
  list.sort((a, b) => a.z - b.z);
  const clay = v.mode === 'clay';
  for (const it of list) {
    const base = MAT[clay ? 'clay' : it.m];
    const s = Math.min(1.15, 0.36 + 0.7 * Math.max(0, dot(it.n, LIGHT)) + 0.1 * Math.max(0, it.n[2]));
    const col = `rgb(${Math.min(255, base[0] * s) | 0} ${Math.min(255, base[1] * s) | 0} ${Math.min(255, base[2] * s) | 0})`;
    ctx.beginPath(); it.tp.forEach((p, i) => { const q2 = S(p); i ? ctx.lineTo(q2[0], q2[1]) : ctx.moveTo(q2[0], q2[1]); }); ctx.closePath();

/* Every viewer on the page shares one animation loop; a viewer turns by itself only while nobody has turned it,

const viewers = new Set();

}

function render() {
  document.documentElement.dataset.theme = theme; document.documentElement.dataset.motion = motion
  readInk()
  const win = document.getElementById('win')
  win.className = surface === 'tools' ? 'win tools' : 'win'
  win.innerHTML = surface === 'tools' ? `${sidebar('threads')}${threadMain()}${toolsSurface()}` : `${sidebar('models')}<main class="main"><header class="tbar"><span class="sp"></span></header>${page()}</main>`
  mountViewers(win)
  win.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { ui.sel = b.dataset.pick; render(); document.querySelector(`[data-pick="${ui.sel}"]`)?.focus() })
  win.querySelectorAll('[data-act=spin]').forEach(b => b.onclick = () => { ui.spin = !ui.spin; render() })
  win.querySelectorAll('[data-act=reset]').forEach(b => b.onclick = () => resetViewer(b.closest('.v').querySelector('.mv[data-interactive="1"]')))
  const strip = document.getElementById('strip')
  if (strip) strip.addEventListener('keydown', e => {
    const list = shown(); const i = list.findIndex(m => m.id === (ui.sel || document.activeElement?.dataset.pick)); let n = i
    if (e.key === 'ArrowRight') n = Math.min(list.length - 1, i + 1); else if (e.key === 'ArrowLeft') n = Math.max(0, i - 1); else return
    e.preventDefault(); e.stopPropagation(); ui.sel = list[n].id; render(); document.querySelector(`[data-pick="${ui.sel}"]`)?.focus()
  })
  document.getElementById('surf').innerHTML = [['page', '3D models page'], ['tools', 'Tools › 3D models']].map(([k, l]) => `<button data-surf="${k}" class="${k === surface ? 'on' : ''}" aria-pressed="${k === surface}">${l}</button>`).join('')
  document.getElementById('states').innerHTML = surface === 'page' ? Object.entries(PAGE_STATES).map(([k, l]) => `<button data-s="${k}" class="${k === state ? 'on' : ''}" aria-pressed="${k === state}">${l}</button>`).join('') : ''
  document.getElementById('opts').innerHTML = `${surface === 'tools' ? `<button data-tools="${toolsWay === 'view' ? 'list' : 'view'}">${toolsWay === 'view' ? 'Tools: view and list' : 'Tools: list only'}</button>` : ''}<button data-failed="${failedWhere === 'thread' ? 'page' : 'thread'}">${failedWhere === 'thread' ? 'Failed: in their thread only' : 'Failed: here too'}</button>`
  document.getElementById('theme').textContent = theme === 'dark' ? 'Light' : 'Dark'
  document.getElementById('motion').textContent = reduced() ? 'Full motion' : 'Reduce motion'
  document.getElementById('notes').innerHTML = NOTES
  const u = new URL(location); u.search = ''
  u.searchParams.set('surface', surface); if (surface === 'page') u.searchParams.set('state', state); if (toolsWay === 'list') u.searchParams.set('tools', 'list'); if (failedWhere === 'page') u.searchParams.set('failed', 'page')
  if (theme === 'light') u.searchParams.set('theme', 'light'); if (reduced()) u.searchParams.set('motion', 'reduced')
  history.replaceState(null, '', u)
}
const NOTES = `<h2>C, one view and a filmstrip, in today's Sotto</h2>
<p style="margin:0">Zach picked C on October 22. This shows it in today's look with what tickets 2 to 4 built. The page opens from the cube at the foot of the sidebar, between Stats and Settings. Press a tile, or use the arrow keys along the filmstrip; drag the model, or focus it and use the arrow keys.</p>
<h2 style="margin-top:12px">Open choices (bottom bar)</h2><ul>
<li><b>Tools:</b> the chosen 3D model's view on top with the thread's list below, as in October; or the list only, each opening its line in the thread.</li>
<li><b>Failed:</b> 3D models Meshy could not finish shown in their thread only, or here too, marked.</li></ul>
<h2 style="margin-top:12px">Already decided</h2><ul><li>A record whose files are gone says so and offers to remove itself (ADR-0141): see "Files gone".</li><li>Tools › 3D models sits between iPhone and Terminal, with a dot while one is being made.</li></ul>`

document.getElementById('surf').onclick = e => { const b = e.target.closest('[data-surf]'); if (b) { surface = b.dataset.surf; ui.sel = null; render() } }
document.getElementById('states').onclick = e => { const b = e.target.closest('[data-s]'); if (b) { state = b.dataset.s; ui.sel = state === 'gone' ? 'helmet' : state === 'making' ? 'barrel-moss' : null; render() } }
document.getElementById('opts').onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.tools) toolsWay = b.dataset.tools; if (b.dataset.failed) failedWhere = b.dataset.failed; ui.sel = null; render() }
document.getElementById('theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; render(); viewers.forEach(v => v.dirty = true) }
document.getElementById('motion').onclick = () => { motion = reduced() ? 'full' : 'reduced'; render() }
const notesEl = document.getElementById('notes'), notesBtn = document.getElementById('notesBtn')
const setNotes = open => { notesEl.hidden = !open; notesBtn.setAttribute('aria-expanded', open); notesBtn.classList.toggle('on', open) }
notesBtn.onclick = () => setNotes(notesEl.hidden)
const setBar = show => { document.getElementById('bar').hidden = !show; document.getElementById('showBar').hidden = show; if (!show) setNotes(false) }
document.getElementById('hideBar').onclick = () => setBar(false)
document.getElementById('showBar').onclick = () => { setBar(true); document.getElementById('hideBar').focus() }
addEventListener('keydown', e => {
  if (e.key === 'Escape' && !notesEl.hidden) { setNotes(false); notesBtn.focus(); return }
  if (e.target.closest('input,textarea,select,[contenteditable],[data-own-keys]')) return
  if (e.key === 'h' || e.key === 'H') setBar(document.getElementById('bar').hidden)
})
if (state === 'gone') ui.sel = 'helmet'; if (state === 'making') ui.sel = 'barrel-moss'
readMaterials()
render()
requestAnimationFrame(loop)
</script>
</body>
</html>
