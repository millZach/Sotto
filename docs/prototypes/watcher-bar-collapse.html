<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watcher: collapsing bottom bar — 5 variants</title>
<style>
  :root { --canvas:#121211; --surface:#1b1b19; --raised:#232320; --line:#3a3a36; --text:#ecebe6; --muted:#9a998f; --accent:#e8c547; --ring:#5fa89c; }
  * { box-sizing:border-box; }
  body { margin:0; background:#0a0a09; color:var(--text); font:14px/1.4 Figtree, system-ui, sans-serif; padding:24px; }
  h1 { font-size:18px; margin:0 0 4px; } p.lead { color:var(--muted); margin:0 0 20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(520px,1fr)); gap:20px; }
  .card h2 { font-size:15px; margin:0 0 2px; } .card p { color:var(--muted); margin:0 0 8px; font-size:13px; }
  .win { position:relative; height:300px; background:var(--canvas); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .watch { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-size:12px; }
  .owl { font-size:40px; filter:grayscale(.2); }
  /* shared bar */
  .bar { display:flex; align-items:center; gap:6px; padding:6px 8px; background:var(--surface); border:1px solid var(--line); border-radius:12px; }
  .ic { width:30px; height:30px; display:grid; place-items:center; border-radius:8px; color:var(--text); font-size:15px; }
  .sep { width:1px; height:20px; background:var(--line); margin:0 4px; }
  .seg { display:flex; background:var(--raised); border-radius:9px; }
  .seg span { padding:6px 22px; border-radius:9px; font-size:13px; }
  .seg .on { outline:2px solid var(--ring); background:#2a2a27; }
  .dock { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); transition:transform .32s cubic-bezier(.2,.8,.2,1), opacity .2s, width .32s, height .32s, border-radius .32s; }
  .btn { margin-top:8px; background:var(--raised); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:5px 10px; font:inherit; font-size:12px; cursor:pointer; }
  .arrow { color:var(--accent); }
  @media (prefers-reduced-motion:reduce){ .dock,.dock *{ transition:none!important; animation:none!important; } }

  /* A: Slide-under tab — bar drops below edge, a small tab with ↑ stays */
  .A .dock { bottom:14px; }
  .A.collapsed .dock { transform:translate(-50%, calc(100% + 14px)); }
  .A .tab { position:absolute; left:50%; bottom:0; transform:translate(-50%,100%); width:44px; height:18px; background:var(--surface); border:1px solid var(--line); border-bottom:none; border-radius:8px 8px 0 0; display:grid; place-items:center; font-size:11px; transition:transform .32s; }
  .A.collapsed .tab { transform:translate(-50%,0); }
  .A.collapsed .hot:hover ~ .dock, .A.collapsed .dock:hover { transform:translate(-50%,0); }

  /* B: Shrink to pill — the bar morphs into a tiny pill with ↑ */
  .B .dock .bar { transition:opacity .15s; }
  .B .pill { position:absolute; inset:0; display:grid; place-items:center; opacity:0; transition:opacity .2s; font-size:12px; }
  .B.collapsed .dock { width:56px; height:22px; overflow:hidden; border-radius:11px; background:var(--surface); border:1px solid var(--line); bottom:8px; }
  .B.collapsed .dock .bar { opacity:0; }
  .B.collapsed .dock .pill { opacity:1; }
  .B.collapsed .dock:hover { width:var(--w); height:44px; border-radius:12px; bottom:14px; }
  .B.collapsed .dock:hover .bar { opacity:1; transition-delay:.15s; }
  .B.collapsed .dock:hover .pill { opacity:0; }

  /* C: Edge line — a hairline glow along the bottom with a floating ↑ chevron */
  .C.collapsed .dock { transform:translate(-50%, calc(100% + 14px)); opacity:0; }
  .C .edge { position:absolute; left:20%; right:20%; bottom:0; height:2px; background:linear-gradient(90deg,transparent,var(--accent),transparent); opacity:0; transition:opacity .3s; }
  .C .chev { position:absolute; left:50%; bottom:6px; transform:translateX(-50%); font-size:12px; opacity:0; transition:opacity .3s; animation:bob 1.8s ease-in-out infinite; }
  .C.collapsed .edge { opacity:.7; } .C.collapsed .chev { opacity:1; }
  .C.collapsed .hot:hover ~ .dock, .C.collapsed .dock:hover { transform:translate(-50%,0); opacity:1; }
  @keyframes bob { 50% { transform:translate(-50%,-3px); } }

  /* D: Peek — bar sinks so only its top 6px shows, with an ↑ notch on its top edge */
  .D.collapsed .dock { transform:translate(-50%, calc(100% + 8px)); }
  .D .notch { position:absolute; left:50%; top:-14px; transform:translateX(-50%); width:28px; height:14px; background:var(--surface); border:1px solid var(--line); border-bottom:none; border-radius:7px 7px 0 0; display:grid; place-items:center; font-size:10px; opacity:0; transition:opacity .2s; }
  .D.collapsed .notch { opacity:1; }
  .D.collapsed .hot:hover ~ .dock, .D.collapsed .dock:hover { transform:translate(-50%,0); }
  .D.collapsed .dock:hover .notch { opacity:0; }

  /* E: Corner button — bar folds into a round ↑ button bottom-centre, which unfolds sideways */
  .E .round { position:absolute; inset:0; display:grid; place-items:center; opacity:0; transition:opacity .2s; }
  .E.collapsed .dock { width:32px; height:32px; border-radius:16px; overflow:hidden; background:var(--surface); border:1px solid var(--line); bottom:10px; }
  .E.collapsed .dock .bar { opacity:0; transform:scaleX(.3); }
  .E .dock .bar { transition:opacity .15s, transform .3s; }
  .E.collapsed .dock .round { opacity:1; }
  .E.collapsed .dock:hover { width:var(--w); height:44px; border-radius:12px; bottom:14px; }
  .E.collapsed .dock:hover .bar { opacity:1; transform:none; }
  .E.collapsed .dock:hover .round { opacity:0; }

  .hot { position:absolute; left:0; right:0; bottom:0; height:28px; z-index:1; }
  .dock { z-index:2; }
</style>
</head>
<body>
<h1>Watcher: the bottom bar collapses</h1>
<p class="lead">Each window starts on Watcher with the bar collapsed. Hover the bottom edge to bring it back. Use the button to toggle Threads ↔ Watcher and see the collapse motion.</p>
<div class="grid" id="grid"></div>

<template id="barT">
  <div class="bar">
    <span class="ic">📊</span><span class="ic">⚙︎</span><span class="ic">?</span><span class="sep"></span>
    <div class="seg"><span class="w on">🦉</span><span class="t">Threads</span></div>
    <span class="sep"></span><span class="ic">⟳</span>
  </div>
</template>

<script>
const variants = [
  ['A','Slide-under tab','The bar slides off the bottom edge. A small tab with ↑ stays attached to the edge.', '<div class="tab"><span class="arrow">↑</span></div>'],
  ['B','Shrink to pill','The bar shrinks in place into a small pill showing ↑. Hover grows it back.', '<div class="pill"><span class="arrow">↑</span></div>'],
  ['C','Glow edge','The bar disappears. A faint accent line and a gently bobbing ↑ mark where it lives.', '<div class="edge"></div><div class="chev arrow">↑</div>'],
  ['D','Notch peek','The bar sinks below the edge; a notch with ↑ sits where its top edge was.', ''],
  ['E','Round button','The bar folds into a round ↑ button that unfolds sideways on hover.', '<div class="round"><span class="arrow">↑</span></div>'],
];
const grid = document.getElementById('grid'), barT = document.getElementById('barT');
for (const [k,name,desc,extra] of variants) {
  const card = document.createElement('div'); card.className='card';
  card.innerHTML = `<h2>${k}. ${name}</h2><p>${desc}</p>
    <div class="win ${k} collapsed"><div class="watch"><div style="text-align:center"><div class="owl">🦉</div>Watcher</div></div>
      <div class="hot"></div><div class="dock"></div>${k==='A'||k==='C'?extra:''}</div>
    <button class="btn">Switch to Threads</button>`;
  const win = card.querySelector('.win'), dock = card.querySelector('.dock');
  dock.appendChild(barT.content.cloneNode(true));
  if (k==='B'||k==='E') dock.insertAdjacentHTML('beforeend', extra);
  if (k==='D') dock.insertAdjacentHTML('beforeend','<div class="notch"><span class="arrow">↑</span></div>');
  grid.appendChild(card);
  requestAnimationFrame(()=>{ dock.style.setProperty('--w', dock.querySelector('.bar').offsetWidth+2+'px'); });
  const btn = card.querySelector('.btn');
  const setW = w => { win.classList.toggle('collapsed', w); win.querySelector('.watch').style.opacity = w?1:.15;
    dock.querySelector('.w').classList.toggle('on', w); dock.querySelector('.t').classList.toggle('on', !w);
    btn.textContent = w ? 'Switch to Threads' : 'Switch to Watcher'; };
  btn.onclick = () => setW(!win.classList.contains('collapsed'));
  dock.querySelector('.w').onclick = () => setW(true); dock.querySelector('.t').onclick = () => setW(false);
}
</script>
</body>
</html>
