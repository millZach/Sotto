<!doctype html>
<!--
  PROTOTYPE — throwaway. Not shipped, not tested, not wired to anything.

  Two asks for thread messages (stable, not an Owl feature):
    1. The per-message copy control moves from the top-right corner to the bottom-left, on every message
       (yours and replies), still shown only while the message is hovered or holds focus.
    2. An image you sent can be opened large or copied. Click (or Enter) on the thumbnail opens a viewer with
       zoom, pan, Copy image and Close; right-click (or Shift+F10) on the thumbnail offers Open image / Copy image.

  Variants (bar at the bottom, or ← → keys):
    a  Inside corner.  Copy sits inside the message's bottom-left corner. The viewer covers the whole window
                       with its tools along the top, the way the diagram viewer does today.
    b  Action row.     A quiet row under the message: the copy icon with the word "Copy". The viewer centres the
                       image on a dim backdrop with a floating tool pill at the bottom and the name under it.
    c  Hanging.        Copy hangs just below the message's bottom-left edge, outside the bubble. The viewer opens
                       inside the thread pane only (sidebar stays), with a strip of the message's other images and
                       ← → to step between them.

  Extras: Light flips the palette; Reduced motion turns off the fades. Copy image really tries the clipboard.

  Picked October 14, 2026: copy from variant a (inside the corner), viewer from variant c (over the pane, with a strip).
  See docs/verification/message-copy-and-image-viewer.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sotto — message copy and image viewer, prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face { font-family: 'Figtree'; font-weight: 300 900; font-display: swap; src: url('../../src/shared/fonts/figtree-latin.woff2') format('woff2'); }
:root {
  color-scheme: dark;
  --tt-canvas: oklch(0.115 0.008 265);
  --tt-field: oklch(0.145 0.008 265);
  --tt-surface-elevated: oklch(0.185 0.008 265);
  --tt-surface-sunken: oklch(0.1 0.008 265);
  --tt-bubble: oklch(0.205 0.014 265);
  --tt-text: oklch(0.985 0.005 280);
  --tt-text-2: color-mix(in oklab, oklch(0.985 0.005 280) 55%, oklch(0.72 0.014 265));
  --tt-text-muted: color-mix(in oklab, oklch(0.72 0.014 265) 85%, oklch(0.985 0.005 280));
  --tt-hairline: oklch(0.305 0.02 265);
  --tt-border-faint: oklch(0.26 0.016 265);
  --tt-accent: oklch(0.714 0.104 183);
  --tt-success: oklch(0.78 0.14 155);
  --tt-hover: color-mix(in srgb, oklch(0.32 0.05 185) 70%, transparent);
  --tt-scrim: rgb(0 0 0 / 78%);
  --tt-shadow-color: rgb(0 0 0 / 73%);
  --tt-font: 'Figtree', ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
  --fade: 140ms;
}
:root[data-theme='light'] {
  color-scheme: light;
  --tt-canvas: oklch(0.978 0.004 85);
  --tt-field: oklch(0.99 0.003 85);
  --tt-surface-elevated: oklch(0.99 0.003 85);
  --tt-surface-sunken: oklch(0.955 0.006 85);
  --tt-bubble: oklch(0.945 0.007 85);
  --tt-text: oklch(0.235 0.014 75);
  --tt-text-2: oklch(0.36 0.014 75);
  --tt-text-muted: oklch(0.5 0.014 75);
  --tt-hairline: oklch(0.86 0.012 80);
  --tt-border-faint: oklch(0.9 0.01 80);
  --tt-accent: oklch(0.52 0.13 235);
  --tt-success: oklch(0.5 0.13 155);
  --tt-hover: color-mix(in srgb, oklch(0.9 0.03 230) 70%, transparent);
  --tt-scrim: rgb(20 22 26 / 70%);
  --tt-shadow-color: rgb(20 24 22 / 18%);
}
:root[data-motion='reduced'] { --fade: 0ms; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--tt-canvas); color: var(--tt-text); font: 15px/1.5 var(--tt-font); overflow: hidden; }
button { font: inherit; }
.focusable:focus-visible { outline: 2px solid var(--tt-accent); outline-offset: 2px; }

/* App frame: thin strip over one room */
.strip { height: 38px; border-bottom: 1px solid var(--tt-hairline); display: flex; align-items: center; padding: 0 16px; gap: 18px; color: var(--tt-text-muted); font-size: 13px; }
.strip b { color: var(--tt-text); font-weight: 600; }
.app { display: grid; grid-template-columns: 240px 1fr; height: calc(100% - 38px); }
.sidebar { border-right: 1px solid var(--tt-hairline); padding: 14px 10px; font-size: 13px; color: var(--tt-text-2); }
.sidebar div { padding: 6px 10px; border-radius: 8px; }
.sidebar .on { background: var(--tt-hover); color: var(--tt-text); }
.pane { position: relative; overflow: auto; }
.transcript { max-width: 760px; margin: 0 auto; padding: 28px 28px 140px; }
@media (max-width: 900px) { .app { grid-template-columns: 1fr; } .sidebar { display: none; } }

/* Messages (as in threads.css) */
.msg { position: relative; margin: 0 0 28px; }
.msg header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; color: var(--tt-text-muted); font-size: 12.5px; }
.msg .who { color: var(--tt-text-2); font-weight: 500; }
.msg time { font-size: 12px; font-variant-numeric: tabular-nums; }
.msg p { margin: 0 0 8px; color: var(--tt-text-2); line-height: 1.6; }
.msg ol { margin: 0 0 8px; padding-left: 22px; color: var(--tt-text-2); line-height: 1.6; }
.msg[data-role='user'] { margin-left: max(24px, 12%); padding: 14px 18px; background: var(--tt-bubble); border: 1px solid var(--tt-hairline); border-radius: 14px 14px 4px 14px; }

/* Copy control: shared look, placement differs per variant */
.copy { display: inline-flex; align-items: center; gap: 5px; min-width: 28px; height: 28px; padding: 0 5px; border: 0; border-radius: 6px; background: transparent; color: var(--tt-text-muted); font-size: 12px; cursor: pointer; opacity: 0; transition: opacity var(--fade) ease; }
.copy:hover { background: var(--tt-hover); color: var(--tt-text); }
.copy[data-copied] { color: var(--tt-success); }
.msg:hover .copy, .msg:focus-within .copy, .copy[data-copied] { opacity: 1; }
.copy svg { width: 15px; height: 15px; }

/* a: inside the bottom-left corner */
[data-variant='a'] .copy { position: absolute; left: 12px; bottom: 8px; }
[data-variant='a'] .msg[data-role='user'] { padding-bottom: 40px; }
[data-variant='a'] .msg:not([data-role='user']) { padding-bottom: 30px; }
[data-variant='a'] .msg:not([data-role='user']) .copy { left: -5px; bottom: 0; }

/* b: a quiet action row under the content */
[data-variant='b'] .actions { display: flex; margin: 8px 0 -6px -5px; }
[data-variant='b'] .copy .word { display: inline; }

/* c: hanging just below the bubble's bottom-left edge */
[data-variant='c'] .msg { margin-bottom: 40px; }
[data-variant='c'] .copy { position: absolute; left: -5px; top: calc(100% + 4px); }
[data-variant='c'] .msg[data-role='user'] .copy { left: 4px; }
.copy .word { display: none; }
.copy .said { display: none; }
.copy[data-copied] .said { display: inline; }
.copy[data-copied] .word { display: none; }

/* Thumbnails (as in rich-messages.css), now a button */
.attachments { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.tile { display: flex; flex-direction: column; gap: 6px; width: 208px; margin: 0; }
.tile button.frame { position: relative; display: flex; align-items: center; justify-content: center; width: 208px; height: 140px; padding: 0; overflow: hidden; border: 1px solid var(--tt-border-faint); border-radius: 10px; background: var(--tt-surface-sunken); cursor: zoom-in; }
.tile button.frame img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; transition: transform var(--fade) ease; }
.tile button.frame:hover img { transform: scale(1.02); }
.tile button.frame:hover { border-color: var(--tt-hairline); }
.tile figcaption { display: flex; flex-direction: column; line-height: 1.35; }
.tile .name { color: var(--tt-text); font-size: 13px; }
.tile .meta { color: var(--tt-text-muted); font-size: 12px; }

/* Context menu */
.menu { position: fixed; z-index: 40; min-width: 170px; padding: 4px; background: var(--tt-surface-elevated); border: 1px solid var(--tt-hairline); border-radius: 10px; box-shadow: 0 12px 30px var(--tt-shadow-color); }
.menu button { display: block; width: 100%; text-align: left; padding: 7px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--tt-text); font-size: 13.5px; cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: var(--tt-hover); outline: none; }

/* Viewer: shared parts */
.viewer { position: fixed; inset: 0; z-index: 30; display: grid; background: var(--tt-scrim); animation: in var(--fade) ease; }
@keyframes in { from { opacity: 0; } }
.stage { position: relative; overflow: hidden; display: grid; place-items: center; cursor: grab; }
.stage.dragging { cursor: grabbing; }
.stage img { position: absolute; left: 50%; top: 50%; max-width: none; user-select: none; -webkit-user-drag: none; box-shadow: 0 20px 60px var(--tt-shadow-color); border-radius: 4px; transform-origin: center; }
.tool { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; min-width: 32px; padding: 0 9px; border: 0; border-radius: 8px; background: transparent; color: var(--tt-text-2); font-size: 13px; cursor: pointer; }
.tool:hover { background: var(--tt-hover); color: var(--tt-text); }
.tool svg { width: 16px; height: 16px; }
.tool[data-copied] { color: var(--tt-success); }
.zoom { min-width: 48px; text-align: center; color: var(--tt-text-muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.hint { color: var(--tt-text-muted); font-size: 12px; }

/* a: full window, toolbar along the top */
.viewer--a { grid-template-rows: auto 1fr; }
.viewer--a .top { display: flex; align-items: center; gap: 4px; padding: 8px 12px; background: var(--tt-surface-elevated); border-bottom: 1px solid var(--tt-hairline); }
.viewer--a .title { flex: 1; min-width: 0; padding-left: 4px; font-size: 13.5px; color: var(--tt-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.viewer--a .title span { color: var(--tt-text-muted); margin-left: 8px; font-size: 12.5px; }

/* b: centred image, floating pill at the bottom */
.viewer--b { grid-template-rows: 1fr auto; }
.viewer--b .foot { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 0 76px; } /* room for the prototype bar */
.viewer--b .pill { display: flex; align-items: center; gap: 2px; padding: 4px; background: var(--tt-surface-elevated); border: 1px solid var(--tt-hairline); border-radius: 12px; box-shadow: 0 10px 30px var(--tt-shadow-color); }
.viewer--b .sep { width: 1px; height: 18px; background: var(--tt-hairline); margin: 0 4px; }
.viewer--b .caption { color: #fff; font-size: 13px; text-shadow: 0 1px 2px rgb(0 0 0 / 60%); }
:root[data-theme='light'] .viewer--b .caption { color: #fff; }

/* c: inside the thread pane only, with a strip */
.viewer--c { position: absolute; grid-template-rows: auto 1fr auto; background: var(--tt-canvas); animation: none; }
.viewer--c .top { display: flex; align-items: center; gap: 4px; padding: 8px 12px; }
.viewer--c .title { flex: 1; font-size: 13.5px; color: var(--tt-text); }
.viewer--c .title span { color: var(--tt-text-muted); margin-left: 8px; font-size: 12.5px; }
.viewer--c .film { display: flex; justify-content: center; gap: 8px; padding: 10px 0 76px; } /* room for the prototype bar */
.viewer--c .film button { width: 64px; height: 44px; padding: 0; border: 2px solid transparent; border-radius: 6px; background: var(--tt-surface-sunken); overflow: hidden; cursor: pointer; opacity: 0.6; }
.viewer--c .film button[aria-current='true'] { border-color: var(--tt-accent); opacity: 1; }
.viewer--c .film img { width: 100%; height: 100%; object-fit: cover; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Prototype bar (not part of the design) */
.bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #fff; color: #111; border-radius: 999px; box-shadow: 0 8px 30px rgb(0 0 0 / 35%); font: 13px/1.2 system-ui, sans-serif; z-index: 50; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 24px); }
.bar button { font: inherit; border: 1px solid #ccc; background: #f4f4f4; color: #111; border-radius: 999px; padding: 5px 10px; cursor: pointer; }
.bar button.on { background: #111; color: #fff; border-color: #111; }
.bar .label { min-width: 210px; text-align: center; font-weight: 600; }
</style>
</head>
<body>
<div class="strip"><b>Sotto</b><span>Threads</span></div>
<div class="app">
  <nav class="sidebar" aria-label="Threads">
    <div class="on">Copy button and image viewer</div>
    <div>Wake-ups after restart</div>
    <div>Remove frosted window</div>
    <div>Update all on forge</div>
  </nav>
  <main class="pane" id="pane">
    <div class="transcript" id="transcript"></div>
  </main>
</div>
<div class="bar" role="toolbar" aria-label="Prototype controls">
  <button id="prev" aria-label="Previous variant">←</button>
  <span class="label" id="label"></span>
  <button id="next" aria-label="Next variant">→</button>
  <button id="light">Light</button>
  <button id="motion">Reduced motion</button>
</div>

<script>
const VARIANTS = { a: 'a — Inside corner', b: 'b — Action row', c: 'c — Hanging' }
const keys = Object.keys(VARIANTS)
let variant = new URLSearchParams(location.search).get('variant') || 'a'
if (!keys.includes(variant)) variant = 'a'

const ICON = {
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
  zin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/></svg>',
  zout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3M8 11h6"/></svg>',
  fit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>',
}

/* Fake screenshots drawn as SVG, so the prototype needs no files */
function shot(hue, title, w = 1600, h = 1000) {
  const rows = Array.from({ length: 9 }, (_, i) => `<rect x="300" y="${150 + i * 80}" width="${900 - (i % 3) * 180}" height="18" rx="9" fill="hsl(${hue} 10% ${30 + (i % 2) * 6}%)"/>`).join('')
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="hsl(${hue} 12% 9%)"/><rect width="1600" height="56" fill="hsl(${hue} 12% 13%)"/><rect x="0" y="56" width="250" height="944" fill="hsl(${hue} 12% 11%)"/>${Array.from({ length: 8 }, (_, i) => `<rect x="20" y="${90 + i * 46}" width="${170 - (i % 3) * 30}" height="14" rx="7" fill="hsl(${hue} 10% 24%)"/>`).join('')}${rows}<rect x="300" y="860" width="1000" height="90" rx="14" fill="hsl(${hue} 12% 15%)" stroke="hsl(${hue} 30% 40%)"/><text x="300" y="120" fill="hsl(${hue} 60% 75%)" font-family="sans-serif" font-size="34" font-weight="600">${title}</text></svg>`
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg)
}
const IMAGES = [
  { id: 'i1', name: 'image.png', meta: 'PNG · 449 KB', src: shot(220, 'Wake-up queued, never sent') },
  { id: 'i2', name: 'image.png', meta: 'PNG · 402 KB', src: shot(190, 'Update all on forge') },
  { id: 'i3', name: 'settings.png', meta: 'PNG · 44 KB', src: shot(160, 'Glass opacity · Frosted window', 1200, 420) },
]

const MESSAGES = [
  { id: 'm1', role: 'user', who: 'You', time: '7:48 pm', html: '<p>Three things I would like to resolve:</p><ol><li>Wake-ups after restart do not work for Codex threads; they get stuck in a queue and never actually send.</li><li>Remove the frosted and opacity feature.</li><li>Update all does not actually update everything. When I update Sotto on my laptop, it should also update forge.</li></ol>', images: IMAGES },
  { id: 'm2', role: 'assistant', who: 'Claude', time: '7:49 pm', html: '<p>I read through the three. The wake-up queue holds Codex wake-ups until the session reports ready, and after a restart that report never comes, so they wait forever.</p><p>I\'ll start there, then remove Glass opacity and Frosted window, then make Update all include forge.</p>' },
  { id: 'm3', role: 'user', who: 'You', time: '7:51 pm', html: '<p>Sounds good. Start with the wake-ups.</p>' },
]

const transcript = document.getElementById('transcript')
function render() {
  document.body.dataset.variant = variant
  document.getElementById('label').textContent = VARIANTS[variant]
  transcript.innerHTML = MESSAGES.map(m => {
    const name = m.role === 'user' ? 'Copy message as Markdown' : 'Copy reply as Markdown'
    const copy = `<button type="button" class="copy focusable" data-copy aria-label="${name}" title="${name}">${ICON.copy}<span class="word">Copy</span><span class="said">Copied</span></button>`
    const images = m.images ? `<div class="attachments" role="list" aria-label="${m.images.length} attachments">${m.images.map((img, i) => `<figure class="tile" role="listitem"><button type="button" class="frame focusable" data-open="${m.id}:${i}" aria-label="Open ${img.name} large" title="Open large · right-click to copy"><img src="${img.src}" alt="" draggable="false"></button><figcaption><span class="name">${img.name}</span><span class="meta">${img.meta}</span></figcaption></figure>`).join('')}</div>` : ''
    const tail = variant === 'b' ? `<div class="actions">${copy}</div>` : copy
    return `<article class="msg" data-role="${m.role}"><header><span class="who">${m.who}</span><time>${m.time}</time></header>${m.html}${images}${tail}</article>`
  }).join('')
}

/* Copy message feedback */
transcript.addEventListener('click', e => {
  const copy = e.target.closest('[data-copy]')
  if (copy) {
    const text = copy.closest('.msg').querySelector('header ~ p, header ~ ol')?.textContent ?? ''
    navigator.clipboard?.writeText(text).catch(() => {})
    copy.dataset.copied = ''
    copy.querySelector('svg').outerHTML = ICON.check
    setTimeout(() => { delete copy.dataset.copied; copy.querySelector('svg').outerHTML = ICON.copy }, 1400)
    return
  }
  const open = e.target.closest('[data-open]')
  if (open) openViewer(open.dataset.open, open)
})

/* Right-click / Shift+F10 on a thumbnail */
let menu = null
function closeMenu(restore) { if (!menu) return; menu.el.remove(); if (restore) menu.from.focus(); menu = null }
function openMenu(from, x, y) {
  closeMenu(false)
  const el = document.createElement('div')
  el.className = 'menu'; el.setAttribute('role', 'menu'); el.setAttribute('aria-label', 'Image options')
  el.innerHTML = '<button role="menuitem" data-act="open">Open image</button><button role="menuitem" data-act="copy">Copy image</button>'
  el.style.left = x + 'px'; el.style.top = y + 'px'
  document.body.append(el)
  menu = { el, from }
  el.querySelector('button').focus()
  el.addEventListener('click', ev => {
    const act = ev.target.dataset.act
    const ref = from.dataset.open
    closeMenu(true)
    if (act === 'open') openViewer(ref, from)
    if (act === 'copy') copyImage(imageFor(ref), from)
  })
  el.addEventListener('keydown', ev => {
    const items = [...el.querySelectorAll('button')]
    const i = items.indexOf(document.activeElement)
    if (ev.key === 'ArrowDown') { ev.preventDefault(); items[(i + 1) % items.length].focus() }
    if (ev.key === 'ArrowUp') { ev.preventDefault(); items[(i - 1 + items.length) % items.length].focus() }
    if (ev.key === 'Escape') { ev.stopPropagation(); closeMenu(true) }
  })
}
transcript.addEventListener('contextmenu', e => {
  const frame = e.target.closest('[data-open]')
  if (!frame) return
  e.preventDefault(); openMenu(frame, e.clientX, e.clientY)
})
transcript.addEventListener('keydown', e => {
  const frame = e.target.closest('[data-open]')
  if (!frame || !((e.key === 'F10' && e.shiftKey) || e.key === 'ContextMenu')) return
  e.preventDefault()
  const r = frame.getBoundingClientRect(); openMenu(frame, r.left, r.bottom + 4)
})
document.addEventListener('pointerdown', e => { if (menu && !menu.el.contains(e.target)) closeMenu(false) })

function imageFor(ref) { const [mid, i] = ref.split(':'); return MESSAGES.find(m => m.id === mid).images[+i] }

/* Copy image: rasterise to PNG and put it on the clipboard */
async function copyImage(img, button) {
  let ok = true
  try {
    const el = new Image(); el.src = img.src; await el.decode()
    const c = document.createElement('canvas'); c.width = el.naturalWidth; c.height = el.naturalHeight
    c.getContext('2d').drawImage(el, 0, 0)
    const blob = await new Promise(r => c.toBlob(r, 'image/png'))
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
  } catch { ok = false }
  announce(ok ? 'Copied image' : 'Could not copy the image')
  if (button && button.classList.contains('tool')) {
    const label = button.querySelector('.lbl')
    button.toggleAttribute('data-copied', ok)
    if (label) label.textContent = ok ? 'Copied' : 'Copy failed'
    setTimeout(() => { button.removeAttribute('data-copied'); if (label) label.textContent = 'Copy image' }, 1400)
  }
}
const live = document.createElement('div'); live.className = 'sr'; live.setAttribute('role', 'status'); document.body.append(live)
function announce(text) { live.textContent = text }

/* Viewer */
let viewer = null
function openViewer(ref, from) {
  closeViewer()
  const [mid, start] = ref.split(':')
  const images = MESSAGES.find(m => m.id === mid).images
  const state = { index: +start, scale: 1, x: 0, y: 0, fit: 1, from }
  const el = document.createElement('div')
  el.className = `viewer viewer--${variant}`
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true')
  const tools = `
    <button type="button" class="tool focusable" data-z="out" aria-label="Zoom out" title="Zoom out (−)">${ICON.zout}</button>
    <span class="zoom" aria-live="polite"></span>
    <button type="button" class="tool focusable" data-z="in" aria-label="Zoom in" title="Zoom in (+)">${ICON.zin}</button>
    <button type="button" class="tool focusable" data-z="fit" aria-label="Fit to window" title="Fit to window (0)">${ICON.fit}</button>`
  const copy = `<button type="button" class="tool focusable" data-act="copy" title="Copy image (Ctrl+C)">${ICON.copy}<span class="lbl">Copy image</span></button>`
  const close = `<button type="button" class="tool focusable" data-act="close" aria-label="Close image" title="Close (Esc)">${ICON.x}</button>`
  const stage = '<div class="stage"><img alt="" draggable="false"></div>'
  if (variant === 'a') el.innerHTML = `<div class="top"><span class="title"></span>${tools}${copy}${close}</div>${stage}`
  if (variant === 'b') el.innerHTML = `${stage}<div class="foot"><div class="pill">${tools}<span class="sep"></span>${copy}${close}</div><span class="caption"></span></div>`
  if (variant === 'c') el.innerHTML = `<div class="top"><span class="title"></span>${tools}${copy}${close}</div>${stage}<div class="film" role="tablist" aria-label="Images in this message">${images.map((img, i) => `<button type="button" class="focusable" role="tab" data-i="${i}" aria-label="${img.name}, ${i + 1} of ${images.length}"><img src="${img.src}" alt=""></button>`).join('')}</div>`
  ;(variant === 'c' ? document.getElementById('pane') : document.body).append(el)
  if (variant === 'c') el.style.top = document.getElementById('pane').scrollTop + 'px', el.style.height = document.getElementById('pane').clientHeight + 'px', document.getElementById('pane').style.overflow = 'hidden'
  viewer = { el, state, images }
  show()
  el.querySelector('[data-act="close"]').focus()
  el.addEventListener('click', e => {
    const b = e.target.closest('button')
    if (!b) { if (variant === 'b' && e.target === el.querySelector('.stage')) closeViewer(); return }
    if (b.dataset.act === 'close') closeViewer()
    if (b.dataset.act === 'copy') copyImage(images[state.index], b)
    if (b.dataset.z) zoom(b.dataset.z)
    if (b.dataset.i) { state.index = +b.dataset.i; show() }
  })
  const s = el.querySelector('.stage')
  let drag = null
  s.addEventListener('pointerdown', e => { if (e.target.tagName !== 'IMG') return; drag = { px: e.clientX, py: e.clientY, x: state.x, y: state.y }; s.setPointerCapture(e.pointerId); s.classList.add('dragging') })
  s.addEventListener('pointermove', e => { if (!drag) return; state.x = drag.x + e.clientX - drag.px; state.y = drag.y + e.clientY - drag.py; place() })
  s.addEventListener('pointerup', () => { drag = null; s.classList.remove('dragging') })
  s.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY < 0 ? 'in' : 'out') }, { passive: false })
  s.addEventListener('dblclick', () => zoom(state.scale > state.fit + 0.01 ? 'fit' : 'in'))
}
function show() {
  const { el, state, images } = viewer
  const img = images[state.index]
  el.setAttribute('aria-label', `${img.name}, ${state.index + 1} of ${images.length}`)
  const im = el.querySelector('.stage img'); im.src = img.src
  el.querySelectorAll('.title, .caption').forEach(t => t.innerHTML = `${img.name}<span>${img.meta}${images.length > 1 && variant !== 'b' ? ` · ${state.index + 1} of ${images.length}` : ''}</span>`)
  el.querySelectorAll('.film button').forEach((b, i) => b.setAttribute('aria-current', i === state.index))
  im.decode().then(() => {
    const st = el.querySelector('.stage').getBoundingClientRect()
    state.fit = Math.min((st.width - 64) / im.naturalWidth, (st.height - 64) / im.naturalHeight, 1)
    state.scale = state.fit; state.x = 0; state.y = 0; place()
  })
}
function place() {
  const { el, state } = viewer
  el.querySelector('.stage img').style.transform = `translate(-50%, -50%) translate(${state.x}px, ${state.y}px) scale(${state.scale})`
  el.querySelector('.zoom').textContent = Math.round(state.scale * 100) + '%'
}
function zoom(dir) {
  const { state } = viewer
  if (dir === 'fit') { state.scale = state.fit; state.x = 0; state.y = 0 }
  else state.scale = Math.min(4, Math.max(state.fit / 2, state.scale * (dir === 'in' ? 1.25 : 0.8)))
  place()
}
function closeViewer() {
  if (!viewer) return
  const from = viewer.state.from
  viewer.el.remove(); viewer = null
  document.getElementById('pane').style.overflow = ''
  from?.focus()
}
document.addEventListener('keydown', e => {
  if (menu) return
  if (viewer) {
    if (e.key === 'Escape') { e.preventDefault(); closeViewer() }
    else if (e.key === '+' || e.key === '=') zoom('in')
    else if (e.key === '-') zoom('out')
    else if (e.key === '0') zoom('fit')
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') { e.preventDefault(); copyImage(viewer.images[viewer.state.index], viewer.el.querySelector('[data-act="copy"]')) }
    else if (variant === 'c' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !e.target.closest('.film')) {
      e.preventDefault()
      const n = viewer.images.length
      viewer.state.index = (viewer.state.index + (e.key === 'ArrowRight' ? 1 : -1) + n) % n; show()
    }
    else if (e.key === 'Tab') {
      const items = [...viewer.el.querySelectorAll('button')]
      const i = items.indexOf(document.activeElement)
      if (e.shiftKey && i <= 0) { e.preventDefault(); items.at(-1).focus() }
      else if (!e.shiftKey && i === items.length - 1) { e.preventDefault(); items[0].focus() }
    }
    return
  }
  if (e.target.closest('input, textarea, [contenteditable]')) return
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') step(e.key === 'ArrowRight' ? 1 : -1)
})

function step(d) {
  variant = keys[(keys.indexOf(variant) + d + keys.length) % keys.length]
  const u = new URL(location.href); u.searchParams.set('variant', variant); history.replaceState(null, '', u)
  render()
}
document.getElementById('prev').onclick = () => step(-1)
document.getElementById('next').onclick = () => step(1)
document.getElementById('light').onclick = e => { const on = document.documentElement.dataset.theme !== 'light'; document.documentElement.dataset.theme = on ? 'light' : ''; e.target.classList.toggle('on', on) }
document.getElementById('motion').onclick = e => { const on = document.documentElement.dataset.motion !== 'reduced'; document.documentElement.dataset.motion = on ? 'reduced' : ''; e.target.classList.toggle('on', on) }
render()
</script>
</body>
</html>
