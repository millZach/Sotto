<!doctype html>
<!-- THROWAWAY PROTOTYPE - three ways to structure Settings' pages, so the Application page stops being a grab bag.
     Every setting on main (October 22, 2026) is in the catalogue below once; each structure places every one exactly once,
     and the page checks that. Synthetic values only, outside every entrypoint. Drawn in the Soft square look (ADR-0110, PR #1368).
     URL: ?v=A|B|C picks the structure, &w=1600|1280|820 the window, &tab=mock|map|links, &owl=0 hides Owl features. -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings structure (prototype)</title>
<style>
@font-face{font-family:Figtree;font-weight:300 900;font-display:swap;src:url(Figtree.ttf) format("truetype"),url(../../apps/ios/Sotto/Resources/Figtree.ttf) format("truetype")}

/* The review page around the mock-ups. Not part of the design. */
:root{color-scheme:dark;--rv-bg:#16171a;--rv-text:#e9eaee;--rv-muted:#9a9ea8;--rv-line:#30323a;--rv-on:#e9eaee;--rv-on-ink:#16171a;--rv-accent:#5fc6c9}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px/1.45 Figtree,system-ui,sans-serif;background:var(--rv-bg);color:var(--rv-text);padding-bottom:90px;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rv-accent);outline-offset:2px}
.rv-head{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;background:var(--rv-bg);border-bottom:1px solid var(--rv-line)}
.rv-head h1{margin:0 auto 0 0;font-size:16px;font-weight:600}
.rv-head h1 small{font-weight:400;color:var(--rv-muted);margin-left:6px}
.rv-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.rv-row>span{font-size:12px;color:var(--rv-muted);margin:0 2px 0 6px}
.rv-row button{border:1px solid var(--rv-line);background:transparent;border-radius:6px;padding:5px 10px;font-size:13px;color:var(--rv-muted)}
.rv-row button[aria-pressed=true]{background:var(--rv-on);color:var(--rv-on-ink);border-color:var(--rv-on)}
.rv-body{padding:14px 16px 0}
.rv-intro{max-width:1040px;margin:0 0 14px;color:#cfd2d8}
.rv-intro b{color:var(--rv-text)}
.rv-intro ul{margin:6px 0 0;padding-left:18px}
.rv-intro li{margin:2px 0}
.rv-check{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--rv-muted);margin:0 0 10px}
.rv-check::before{content:'';width:8px;height:8px;border-radius:50%;background:#56c47a}
.rv-check.bad::before{background:#e5674d}
.rv-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.rv-pair>div{min-width:0}
.rv-pair>div>p{margin:0 0 6px;font-size:12px;color:var(--rv-muted)}
.frame{position:relative;overflow:hidden;border-radius:8px;outline:1px solid var(--rv-line)}
.frame>.win{transform-origin:0 0;position:absolute;top:0;left:0}
.frame-zoom{position:absolute;right:8px;bottom:8px;z-index:3;border:0;border-radius:6px;background:#000c;color:#fff;padding:4px 9px;font-size:12px}
@media (max-width:980px){.rv-pair{grid-template-columns:1fr}}
.zoom{position:fixed;inset:0;z-index:50;background:#000b;overflow:auto;display:none;padding:12px}
.zoom.on{display:block}
.zoom-close{position:fixed;top:10px;right:12px;z-index:51;background:#fff;color:#000;border:0;border-radius:6px;padding:6px 12px;display:none}
.zoom.on+.zoom-close{display:block}
.switcher{position:fixed;left:50%;bottom:14px;z-index:40;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;border-radius:10px;background:#000;color:#fff;box-shadow:0 6px 24px #0008}
.switcher button{background:#2a2a2a;border:0;color:#fff;border-radius:6px;width:34px;height:32px}
.switcher div{padding:0 8px;line-height:1.25;text-align:center;min-width:180px}
.switcher small{display:block;color:#aaa;font-size:11px}
@media (max-width:640px){.switcher{display:none}}
table.rv{border-collapse:collapse;width:100%;font-size:13px}
table.rv th,table.rv td{text-align:left;vertical-align:top;padding:7px 9px;border-bottom:1px solid var(--rv-line)}
table.rv th{color:var(--rv-muted);font-weight:500;font-size:12px;position:sticky;top:0;background:var(--rv-bg)}
table.rv tr.grp td{padding-top:16px;font-weight:600;color:var(--rv-text);border-bottom:0}
table.rv td.mv{color:#8fe0e2}
table.rv td.mv::after{content:' · moved';color:var(--rv-muted);font-size:11.5px}
table.rv td.same{color:var(--rv-muted)}
table.rv code{font-size:12px;color:#cfd2d8}
.rv-wrap{overflow-x:auto;max-width:100%}
.rv-h2{margin:22px 0 6px;font-size:15px}
.rv-h2+p{margin:0 0 10px;color:#cfd2d8;max-width:1040px}
@media (max-width:640px){table.rv{font-size:12.5px}table.rv th,table.rv td{padding:6px 6px}}

/* ---------- The mock window: theme roles as the default Sotto theme paints them ---------- */
.win{--ah:183;
  --canvas:oklch(.115 .008 265);--raised:oklch(.185 .008 265);--overlay:oklch(.215 .008 265);--sunken:oklch(.155 .008 265);
  --sidebar:oklch(.165 .006 265);--text:oklch(.985 .005 280);--text2:oklch(.86 .01 270);--muted:oklch(.72 .014 265);--faint:oklch(.62 .012 270);
  --border:oklch(.305 .02 265);--input:oklch(.375 .024 265);--hair:color-mix(in oklab,var(--border) 62%,var(--canvas));
  --accent:oklch(.714 .104 var(--ah));--accent-text:oklch(.83 .08 var(--ah));--accent-surface:oklch(.32 .05 var(--ah));
  --card:var(--raised);--card-inset:var(--canvas);--card-selected:color-mix(in oklab,var(--accent-surface) 55%,var(--card));
  --segment-on:var(--overlay);--row-active:color-mix(in oklab,var(--accent-surface) 45%,var(--sidebar));--row-hover:color-mix(in oklab,var(--text) 6%,var(--sidebar));
  --pill:var(--text);--pill-ink:var(--canvas);--danger:oklch(.68 .16 28);
  --shadow-sm:0 1px 2px rgb(0 0 0/40%);
  color-scheme:dark;display:flex;overflow:hidden;background:var(--canvas);color:var(--text);font:14px/1.45 Figtree,system-ui,sans-serif;text-align:left}
.win[data-mode=light]{color-scheme:light;
  --canvas:oklch(.978 .004 85);--raised:oklch(.955 .006 85);--overlay:oklch(.995 .002 85);--sunken:oklch(.93 .008 85);
  --sidebar:oklch(.955 .008 85);--text:oklch(.235 .014 75);--text2:oklch(.36 .014 75);--muted:oklch(.48 .014 75);--faint:oklch(.55 .015 78);
  --border:oklch(.86 .012 80);--input:oklch(.8 .016 80);--hair:color-mix(in oklab,var(--border) 70%,var(--canvas));
  --accent:oklch(.53 .095 var(--ah));--accent-text:oklch(.43 .08 var(--ah));--accent-surface:oklch(.92 .03 var(--ah));
  --card:color-mix(in oklab,var(--text) 4%,var(--canvas));--card-inset:var(--canvas);--segment-on:var(--overlay);
  --row-active:color-mix(in oklab,var(--accent-surface) 70%,var(--sidebar));--row-hover:color-mix(in oklab,var(--text) 5%,var(--sidebar));
  --danger:oklch(.52 .17 28);--shadow-sm:0 1px 2px rgb(20 24 22/12%)}
.win *{box-sizing:border-box}
.win svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* Settings rail, wearing the Threads sidebar's frame (top row, body, foot). */
.s-side{flex:none;width:var(--sw);display:flex;flex-direction:column;min-height:0;background:var(--sidebar);border-right:1px solid var(--hair)}
.s-top{display:flex;align-items:center;gap:4px;height:44px;flex:none;padding:0 8px 0 14px;color:var(--muted)}
.logo{width:22px;height:22px;border-radius:6px;background:var(--accent);margin-right:auto;position:relative}
.logo::after{content:'';position:absolute;inset:6px 5px;border-radius:50%;border:2px solid var(--canvas);border-top-color:transparent}
.ico{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.ico svg{width:15px;height:15px}
.ico.on{background:var(--row-active);color:var(--accent-text)}
.s-body{flex:1;min-height:0;overflow:auto;padding:0 10px 10px;scrollbar-width:thin}
.s-body h1{margin:6px 0 14px;padding:0 8px;font-size:24px;font-weight:600;letter-spacing:-.7px;line-height:1.2}
.find{display:flex;align-items:center;gap:8px;height:36px;margin:0 0 12px;padding:0 10px;border-radius:6px;background:color-mix(in oklab,var(--canvas) 60%,var(--sidebar));color:var(--muted);font-size:13.5px}
.find input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--text);font-size:13.5px}
.find input::placeholder{color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{position:relative;display:flex;align-items:center;gap:11px;width:100%;min-height:var(--rowh,40px);padding:8px 12px;border:0;border-radius:6px;background:none;color:var(--text2);text-align:left;font-size:14.5px;line-height:1.3}
.nav button:hover{background:var(--row-hover);color:var(--text)}
.nav button[aria-selected=true]{background:var(--row-active);color:var(--text)}
.nav button[aria-selected=true]>svg{color:var(--accent-text)}
.nav button>span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .owl{font-size:11px;color:var(--muted);padding:1px 5px;border-radius:4px;background:color-mix(in oklab,var(--text) 7%,transparent);flex:none}
.nav .count{font-size:12px;color:var(--muted);flex:none}
.nav-h{margin:16px 12px 4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.nav-h:first-child{margin-top:2px}
.nav-gap{height:1px;margin:10px 12px;background:var(--hair)}
.results{display:flex;flex-direction:column;gap:2px}
.results button{display:block;width:100%;padding:8px 12px;border:0;border-radius:6px;background:none;text-align:left;color:var(--text)}
.results button:hover{background:var(--row-hover)}
.results small{display:block;color:var(--muted);font-size:12px}
.results p{margin:6px 12px;color:var(--muted);font-size:13px}
.s-foot{flex:none;padding:8px 8px 10px;border-top:1px solid var(--hair)}
.dseg{display:flex;padding:3px;border-radius:6px;background:var(--sunken);margin-bottom:8px}
.dseg b{flex:1;text-align:center;padding:6px 0;border-radius:4px;font-weight:400;font-size:13.5px;color:var(--text2)}
.pages{display:flex;gap:4px}

/* The room */
.s-room{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.s-chrome{height:40px;flex:none;display:flex;justify-content:flex-end;align-items:center;gap:20px;padding:0 16px;color:var(--muted);font-size:14px}
.s-scroll{flex:1;min-height:0;overflow:auto;padding:12px var(--pad,6vw) 40px;scrollbar-width:thin}
.s-form{max-width:790px;margin:0 auto}
.s-head h2{margin:0 0 6px;font-size:28px;font-weight:500;letter-spacing:-1px;line-height:1.2}
.s-head p{margin:0 0 18px;color:var(--text2);font-size:15px}
.tabs{display:flex;flex-wrap:wrap;gap:2px;padding:3px;margin:0 0 18px;border-radius:6px;background:var(--sunken);width:max-content;max-width:100%}
.tabs button{border:0;border-radius:4px;padding:5px 12px;background:none;color:var(--muted);font-size:14px;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--segment-on);color:var(--text);box-shadow:var(--shadow-sm)}
.g-title{display:flex;align-items:center;gap:8px;margin:22px 2px 9px;font-size:14.5px;font-weight:600;color:var(--text)}
.g-title svg{color:var(--muted)}
.g-title:first-child{margin-top:0}
.card{padding:2px 20px;border-radius:12px;background:var(--card)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 18px;min-height:62px;padding:14px 0;border-bottom:2px solid var(--card-inset)}
.row:last-child{border-bottom:0}
.row h4{margin:0;font-size:14.5px;font-weight:500}
.row p{margin:2px 0 0;color:var(--muted);font-size:13px;line-height:1.4}
.row.moved h4::after{content:'moved here';margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--card-selected);color:var(--accent-text);font-size:11px;font-weight:500;vertical-align:2px}
.win[data-tags=off] .row.moved h4::after{display:none}
.row.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--card-selected)}100%{background:transparent}}
.row.wide{grid-template-columns:minmax(0,1fr)}
.row .ctl{justify-self:end;min-width:0}
.row.wide .ctl{justify-self:stretch}
.tg{position:relative;display:inline-block;width:38px;height:22px;border-radius:5px;background:var(--input)}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:3px;background:var(--canvas);box-shadow:var(--shadow-sm)}
.tg.on{background:var(--accent)}
.tg.on::after{left:19px}
.tg.off{opacity:.55}
.sel,.fld{display:flex;align-items:center;justify-content:space-between;gap:10px;width:210px;max-width:100%;min-height:36px;padding:0 12px;border-radius:6px;background:var(--card-inset);color:var(--text);font-size:14px;white-space:nowrap;overflow:hidden}
.sel::after{content:'';flex:none;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg) translateY(-2px)}
.fld{color:var(--muted)}
.txt{display:block;min-height:84px;padding:9px 12px;border-radius:6px;background:var(--card-inset);color:var(--muted);font-size:13.5px;white-space:pre-line}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:6px;background:var(--card-inset)}
.seg b{padding:4px 11px;border-radius:4px;font-weight:400;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg b.on{background:var(--segment-on);color:var(--text);box-shadow:var(--shadow-sm)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:0 14px;border-radius:6px;border:1px solid var(--input);background:var(--canvas);color:var(--text);font-size:14px;white-space:nowrap}
.btn.primary{background:var(--pill);color:var(--pill-ink);border-color:var(--pill)}
.btn.danger{border-color:color-mix(in oklab,var(--danger) 60%,var(--input));color:var(--danger)}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.note{margin:12px 2px 0;color:var(--muted);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;border-radius:5px;background:var(--card-inset);color:var(--text2);font-size:13px;white-space:nowrap}
.kbd{display:inline-flex;align-items:center;min-height:28px;padding:0 9px;border-radius:4px;background:var(--card-inset);font-size:13px;color:var(--text)}
.dot{display:inline-flex;align-items:center;gap:6px;color:var(--text2);font-size:13px}
.dot::before{content:'';width:7px;height:7px;border-radius:50%;background:#4fbf74}
.dot.idle::before{background:var(--faint)}
.meter{display:block;width:180px;max-width:100%;height:6px;border-radius:2px;background:var(--card-inset);position:relative;overflow:hidden}
.meter::after{content:'';position:absolute;inset:0 62% 0 0;background:var(--accent);border-radius:2px}
.wave{display:flex;align-items:center;gap:3px;height:26px}
.wave i{width:3px;border-radius:2px;background:var(--accent)}
/* Complex panels, drawn small: they move whole and keep their own layout. */
.plist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.pcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px 8px;padding:12px;border-radius:12px;background:var(--card)}
.pcard.on{background:var(--card-selected);box-shadow:0 0 0 1px var(--accent)}
.pcard strong{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard small{grid-column:1/-1;color:var(--muted);font-size:12px}
.mark{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:12px;background:var(--card-inset)}
.hostrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.themes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%}
.themes span{height:42px;border-radius:6px;background:linear-gradient(135deg,var(--a),var(--b))}
.themes span.on{box-shadow:0 0 0 2px var(--accent)}
.code{font-size:22px;letter-spacing:4px;font-weight:600}
.empty{color:var(--muted);font-size:13px}
/* Window sizes */
.win[data-w="1280"]{--pad:48px}
.win[data-w="820"]{--pad:24px;--rowh:34px}
.win[data-w="820"] .s-body h1{font-size:21px;margin-bottom:10px}
.win[data-w="820"] .s-head h2{font-size:24px}
.win[data-w="820"] .s-head p{margin-bottom:12px;font-size:14px}
.win[data-w="820"] .nav button{font-size:14px;padding:6px 10px;gap:9px}
.win[data-w="820"] .nav-h{margin-top:12px}
.win[data-w="820"] .row{grid-template-columns:minmax(0,1fr);min-height:0;padding:12px 0}
.win[data-w="820"] .row .ctl{justify-self:start}
.win[data-w="820"] .row:has(.tg){grid-template-columns:minmax(0,1fr) auto}
.win[data-w="820"] .row:has(.tg) .ctl{justify-self:end}
.win[data-w="820"] .plist{grid-template-columns:repeat(2,minmax(0,1fr))}
.win[data-w="820"] .chips,.win[data-w="820"] .btns{justify-content:flex-start}
.win[data-w="820"] .card{padding:2px 16px}
.win[data-w="820"] .s-chrome{height:34px}
</style>
</head>
<body>
<header class="rv-head">
  <h1>Settings structure <small>prototype · three ways to sort the pages</small></h1>
  <div class="rv-row" id="tabs"></div>
  <div class="rv-row" id="opts"></div>
</header>
<main class="rv-body" id="body"></main>
<div class="zoom" id="zoom"></div><button class="zoom-close" id="zoomClose">Close</button>
<nav class="switcher" aria-label="Structure"><button id="prev" aria-label="Previous structure">←</button><div id="vlabel"></div><button id="next" aria-label="Next structure">→</button></nav>
<script>
// ---------- Every setting on main today, once. c is how its control is drawn. ----------
// Controls: tg1/tg0 toggle on/off, tgL locked on, sel:Value, seg:A|*B|C (star = chosen), fld:placeholder, txt:lines, btn:/btnp:/danger:Label, x:<html>
const S = {
  // Dictation (settings-capture)
  dictate:{l:'Dictate with Sotto',d:'Turn off if you use another dictation app. Sotto stops listening.',c:'tg1',from:'cap',owl:1},
  mic:{l:'Microphone',d:'',c:'sel:System default',from:'cap'},
  mictest:{l:'Microphone test',d:'Check that Sotto can hear you. Access is asked for only while the test runs.',c:'x:wave',from:'cap'},
  shortcuts:{l:'Dictation shortcuts',d:'Press to start and stop. Hold shortcuts and Fn are Owl features.',c:'x:keys',from:'cap'},
  reclimit:{l:'Recording limit',d:'',c:'seg:30 s|*1 min|2 min|5 min',from:'cap'},
  cues:{l:'Sound cues',d:'A short sound when recording starts and stops.',c:'tg1',from:'cap'},
  typing:{l:'Typing speed',d:'How fast you type, in words per minute. The Dictate room counts the time dictation saves you against it.',c:'fld:40',from:'cap'},
  // Transcription
  model:{l:'Speech model',d:'Speech recognition on this computer. Works out which language you speak.',c:'sel:Parakeet v3',from:'tra'},
  whitespace:{l:'Whitespace formatting',d:'Trims extra spaces without changing any words.',c:'tg1',from:'tra'},
  tranote:{l:'Privacy note',d:'Audio is transcribed on this computer and never written to disk.',c:'',from:'tra'},
  // Cleanup
  aifmt:{l:'AI formatting',d:'Sends the text, never audio, to OpenRouter to tidy it up. Offline, you get the raw transcript.',c:'tg1',from:'cle'},
  orkey:{l:'OpenRouter key',d:'Kept in the credential store. Only results come back.',c:'fld:Saved',from:'cle'},
  dict:{l:'Personal dictionary',d:'One word or name per line, so AI cleanup spells them your way.',c:'txt:Sotto\nOmarchy\nrun.cloud',from:'cle'},
  titles:{l:'Generated thread titles',d:"The thread's own model names new threads from their first exchange, and new worktree branches from their first prompt.",c:'tg1',from:'cle'},
  commits:{l:'Generated commit messages',d:"Leave a commit message empty and the thread's own model writes it from the staged diff.",c:'tg1',from:'cle'},
  prtext:{l:'Generated pull request text',d:"The thread's own model writes a new pull request's title and body.",c:'tg1',from:'cle'},
  // Providers
  provcards:{l:'Thread providers',d:'',c:'x:providers',from:'pro'},
  clientupd:{l:'Check for client updates',d:'Sotto asks each agent client whether a newer version is out.',c:'tg1',from:'pro'},
  // Hosts
  localhost:{l:'Run the local host',d:'Threads on this computer run in a host Sotto starts, so phones and Watcher can reach them.',c:'tg1',from:'hos'},
  remotehosts:{l:'Remote hosts',d:'',c:'x:hosts',from:'hos'},
  // Phones
  phoneson:{l:'Let phones connect',d:'Your paired iPhone can reach this computer over your tailnet.',c:'tg1',from:'pho'},
  phonename:{l:'Name on phones',d:'What your iPhone calls this computer.',c:'fld:Zach’s laptop',from:'pho'},
  pairing:{l:'Pairing code',d:'Enter it in the iPhone app to pair.',c:'x:code',from:'pho'},
  // Cloud iPhone

function control(c) {
  if (!c) return ''
  if (c === 'tg1') return '<span class="tg on"></span>'
  if (c === 'tg0') return '<span class="tg"></span>'
  if (c === 'tgL') return '<span class="tg on off"></span>'
  const [t, ...r] = c.split(':'); const v = r.join(':')
  if (t === 'sel') return `<span class="sel">${v}</span>`
  if (t === 'fld') return `<span class="fld">${v}</span>`
  if (t === 'txt') return `<span class="txt">${v}</span>`
  if (t === 'btn') return `<span class="btn">${v}</span>`
  if (t === 'btnp') return `<span class="btn primary">${v}</span>`
  if (t === 'danger') return `<span class="btn danger">${v}</span>`
  if (t === 'seg') return `<span class="seg">${v.split('|').map(o => o[0] === '*' ? `<b class="on">${o.slice(1)}</b>` : `<b>${o}</b>`).join('')}</span>`
  if (t === 'x') return X[v]()
  return ''
}

function cardsHtml(v, page) {
  return page.cards.map(([title, icon, keys]) => {
    const rows = keys.map(k => rowHtml(v, k, page)).join(''); if (!rows) return ''
    const head = title ? `<div class="g-title">${icon ? svg(icon) : ''}${title}</div>` : ''
    if (keys.length === 1 && keys[0] === 'provcards') return head + rows
    return head + `<div class="card">${rows}</div>`
  }).join('<div style="height:4px"></div>')
}
function navButton(p, on) {
  return `<button role="tab" aria-selected="${on}" data-page="${p.id}">${svg(p.icon)}<span>${p.label}</span>${p.owl ? '<span class="owl">Owl</span>' : ''}</button>`
}
function sidebar(v) {
  const active = st.page[v]
  let nav
  if (v === 'A') nav = V.A.groups.map(([h, ps]) => `<div class="nav-h">${h}</div>` + ps.filter(visible).map(p => navButton(p, p.id === active)).join('')).join('')
  else if (v === 'B') nav = B_GROUPS.map(([, ps]) => ps.filter(visible).map(p => navButton(p, p.id === active)).join('')).join('<div class="nav-gap"></div>')
  else nav = C_AREAS.map(a => navButton(a, a.id === active)).join('')
  const find = `<label class="find">${svg('search')}<input data-find placeholder="Find a setting" value="${st.find.replace(/"/g,'&quot;')}" aria-label="Find a setting"></label>`
  const body = st.find ? `<div class="results" data-results>${results(v)}</div>` : `<nav class="nav" role="tablist" aria-label="Settings sections">${nav}</nav>`
  return `<aside class="s-side"><div class="s-top"><span class="logo"></span><span class="ico">${svg('thread')}</span><span class="ico">${svg('server')}</span><span class="ico">${svg('tree')}</span></div>
    <div class="s-body"><h1>Settings</h1>${find}${body}</div>
    <div class="s-foot"><div class="dseg"><b>Dictate</b><b>Threads</b></div><div class="pages"><span class="ico">${svg('clock')}</span><span class="ico">${svg('gauge')}</span><span class="ico on">${svg('gear')}</span></div></div></aside>`
}
function results(v) {
  const t = st.find.trim().toLowerCase(); if (!t) return ''
  const hits = Object.entries(S).filter(([k, s]) => (st.owl || !s.owl) && k !== 'tranote' && (s.l + ' ' + s.d).toLowerCase().includes(t)).slice(0, 12)
  if (!hits.length) return `<p>No setting matches “${st.find}”.</p>`
  return hits.map(([k, s]) => `<button data-goto="${k}">${s.l}<small>${homeOf(v, k)}</small></button>`).join('')
}
function room(v) {
  let page, tabs = ''
  if (v === 'C') {
    const area = C_AREAS.find(a => a.id === st.page.C) || C_AREAS[0]
    const ts = area.tabs.filter(visible); const cur = ts.find(t => t.id === st.ctab[area.id]) || ts[0]
    tabs = `<div class="tabs" role="tablist" aria-label="${area.label} pages">${ts.map(t => `<button role="tab" aria-selected="${t.id === cur.id}" data-ctab="${t.id}" data-area="${area.id}">${t.label}</button>`).join('')}</div>`
    page = cur
    return `<div class="s-room"><div class="s-chrome">— ▢ ✕</div><div class="s-scroll"><div class="s-form"><div class="s-head"><h2>${area.label}</h2><p>${cur.lead}</p></div>${tabs}${cardsHtml(v, page)}</div></div></div>`
  }
  page = leaves(v).find(p => p.id === st.page[v]) || leaves(v)[0]
  return `<div class="s-room"><div class="s-chrome">— ▢ ✕</div><div class="s-scroll"><div class="s-form"><div class="s-head"><h2>${page.label}</h2><p>${page.lead}</p></div>${cardsHtml(v, page)}</div></div></div>`
}
const hFor = w => w === 1600 ? 1000 : w === 1280 ? 800 : 560
const swFor = w => Math.round(Math.max(260, Math.min(280, w * .3)))
function win(v, mode, w) { return `<div class="win" data-mode="${mode}" data-w="${w}" data-tags="${st.tags?'on':'off'}" style="width:${w}px;height:${hFor(w)}px;--sw:${swFor(w)}px">${sidebar(v)}${room(v)}</div>` }

// ---------- Review page ----------
const btn = (key, val, label) => `<button aria-pressed="${String(st[key]) === String(val)}" data-set="${key}" data-val="${val}">${label}</button>`
function header() {
  document.getElementById('tabs').innerHTML = btn('tab','mock','Mock-up') + btn('tab','map','Where every setting lands') + btn('tab','links','Links, search & words')
  document.getElementById('opts').innerHTML = `<span>Structure</span>${['A','B','C'].map(k => btn('v',k,k)).join('')}<span>Window</span>${btn('w',1600,'1600')}${btn('w',1280,'1280')}${btn('w',820,'820 min')}<span>Owl</span>${btn('owl',true,'On')}${btn('owl',false,'Off')}<span>Tags</span>${btn('tags',true,'Moved')}${btn('tags',false,'Hide')}`
  document.getElementById('vlabel').innerHTML = `${st.v} — ${V[st.v].name}<small>← → to switch</small>`
}
function mock() {
  const c = coverage(st.v)
  const ok = !c.missing.length && !c.dup.length
  const pages = st.v === 'C' ? `${C_AREAS.length} areas, ${leaves('C').filter(visible).length} tabs` : `${leaves(st.v).filter(visible).length} pages`
  return `<div class="rv-intro"><b>${st.v} · ${V[st.v].name}.</b> ${V[st.v].blurb}</div>
  <div class="rv-check${ok ? '' : ' bad'}">${ok ? `All ${c.n} settings placed, each once` : `Missing: ${c.missing.join(', ')} · twice: ${c.dup.join(', ')}`} · ${pages}${st.owl ? ' with Owl features' : ' on stable'}</div>
  <div class="rv-intro" style="font-size:13px;color:var(--rv-muted)">Press any page in the sidebar, or type in Find a setting. It opens on where Application’s old link lands. Rows marked “moved here” came from another page. The windows are drawn at full size and scaled to fit; press Full size to read one.</div>
  <div class="rv-pair"><div><p>Dark · ${st.w} × ${hFor(st.w)}</p><div class="frame" data-mode="dark">${win(st.v,'dark',st.w)}<button class="frame-zoom" data-zoom="dark">Full size</button></div></div>
  <div><p>Light · ${st.w} × ${hFor(st.w)}</p><div class="frame" data-mode="light">${win(st.v,'light',st.w)}<button class="frame-zoom" data-zoom="light">Full size</button></div></div></div>`
}
function map() {
  const order = Object.keys(OLD)
  let rows = ''
  for (const o of order) {
    const keys = Object.keys(S).filter(k => S[k].from === o && (st.owl || !S[k].owl))
    if (!keys.length) continue
    rows += `<tr class="grp"><td colspan="4">${OLD[o]} <code>${OLD_IDS[o]}</code></td></tr>`
    for (const k of keys) rows += `<tr><td>${S[k].l}${S[k].owl ? ' <span style="color:var(--rv-muted)">· Owl</span>' : ''}</td>${['A','B','C'].map(v => { const p = leafOf(v,k); const m = p && moved(v,k,p); return `<td class="${m ? 'mv' : 'same'}">${homeOf(v,k)}</td>` }).join('')}</tr>`
  }
  return `<div class="rv-intro"><b>Every setting on main today</b>, grouped by the page it is on now, and the page it lands on in each structure. Cyan cells move. The page counts each structure’s placement, and every structure places all ${Object.keys(S).length} once.</div>
  <h2 class="rv-h2">What the audit found out of place</h2><p></p>
  <ul class="rv-intro" style="margin-top:0">
    <li><b>Application</b> holds 24 rows on five topics: startup, how threads behave, worktrees, history, updates and reset. Reduced motion is a look, not startup.</li>
    <li><b>Cleanup</b> holds Generated thread titles, commit messages and pull request text. Those are side calls to the thread’s own provider (ADR-0026), not OpenRouter cleanup, so they belong with Agents and Git. With dictation off, Cleanup survives only for them today.</li>
    <li><b>Show floating widget when idle</b> is dictation’s sliver, on Application.</li>
    <li><b>Let agents babysit pull requests</b> is about pull requests, on Application, next to Git’s pull request card.</li>
    <li><b>Check for client updates</b> sits under the provider cards, apart from Sotto’s own update check.</li>
    <li><b>Project defaults</b> for the working copy sit on Application, but the error Sotto shows when it cannot read them says “Settings → Agents”.</li>
    <li>The sidebar’s two dividers are drawn by position (after the 3rd and 7th rows), so they fall in the wrong place once Watcher or Performance shows.</li>
  </ul>
  <div class="rv-wrap"><table class="rv"><thead><tr><th>Setting</th><th>A · Four groups</th><th>B · Fewer pages</th><th>C · Areas and tabs</th></tr></thead><tbody>${rows}</tbody></table></div>`
}
function links() {
  const L = [
    ['Old section ids <code>settings-capture</code>, <code>-transcription</code>, <code>-formatting</code>, <code>-providers</code>, <code>-hosts</code>, <code>-phones</code>, <code>-cloud-iphone</code>, <code>-agents</code>, <code>-watcher</code>, <code>-output</code>, <code>-appearance</code>, <code>-git</code>, <code>-performance</code>','20 Playwright specs and 4 unit tests select pages by these','Kept as page ids; new pages get <code>settings-worktrees</code>, <code>-browser</code>, <code>-history</code>','Kept; transcription and output open Dictation at their card, phones opens Hosts & phones at Phones','Kept as tab ids; each opens its area on that tab'],
    ['<code>settings-privacy</code> (Application)','Tests; README “In Settings → Application, Launch when you sign in”','Application (startup, updates, reset)','Application (startup, history, updates, reset)','Sotto › Application'],
    ['<code>settings-updates</code>','Linux settings test; the Updates block inside Application','Application, at the Updates card','Application, at the Updates card','Sotto › Application, at Updates'],
    ['History and Clear history','README; Help’s “Reset safely”','History (a new page, <code>settings-history</code>)','Application, at the History card','Sotto › History'],
    ['Web links in threads, and the rest of Application’s thread rows','README’s privacy section: “Turn that off in Settings → Application”','Browser','Threads, at Links and Sotto’s browser','Threads › Browser'],
    ['Working-copy default and Project defaults','README, CONTEXT.md (Project), newThread.ts error “Settings → Agents”','Worktrees','Threads, at New threads','Threads › Worktrees'],
    ['Phones’ <b>Go to Hosts</b> button','PhonesSettings','Hosts','The Remote hosts card above, on the same page','Connections › Hosts'],
    ['Worker roles’ links to Agents and Providers','WorkerRolesSettings (Owl)','Agents, Providers','Threads, Providers','Threads › Agents, Connections › Providers'],
    ['<b>Open Settings</b> on a cloud iPhone problem, and Tools › iPhone “Add a run.cloud key in Settings > Cloud iPhone”','CloudIphoneRequest, IPhoneSurface: today they land on Dictation','Cloud iPhone','Cloud iPhone','Connections › Cloud iPhone'],
    ['<b>Open Settings</b> when Watcher has no provider (“Connect … under Providers”), and on the Threads page error','WatcherView, ThreadsView: today Dictation','Providers','Providers','Connections › Providers'],
    ['<b>Open Settings</b> after a speech model problem','DictateRoom: today Dictation','Transcription','Dictation, at Speech model','Dictation › Transcription'],
    ['<b>Open Settings</b> in the Dictate journal with history off','Journal: today Dictation','History','Application, at History','Sotto › History'],
    ['“Settings > Hosts” and “Settings > Providers” in host and setup errors','src/main/hosts, src/host','Unchanged','Hosts → “Hosts & phones” in every message','Unchanged words; “Settings > Connections > Hosts” reads longer'],
    ['“Settings › Hosts / Phones” in the iPhone app','apps/ios (six strings)','Unchanged','Needs an iPhone release to say Hosts & phones','Unchanged'],
    ['“Turn on Run the local host in Settings”','Watcher room error','Adds “> Hosts”','Adds “> Hosts & phones”','Adds “> Connections > Hosts”'],
  ]
  return `<div class="rv-intro"><b>Links into Settings.</b> Settings has no address of its own today: every <b>Open Settings</b> button lands on Dictation, and the only jumps inside it are Phones’ Go to Hosts and Worker roles’ two links. The plan keeps every old section id answering, as a page or an alias, and lets those buttons say which page to open.</div>
  <div class="rv-wrap"><table class="rv"><thead><tr><th>Link</th><th>Where it lives</th><th>A</th><th>B</th><th>C</th></tr></thead><tbody>${L.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <h2 class="rv-h2">Search</h2>
  <p>Settings has no search today. The mock-ups draw a <b>Find a setting</b> field at the top of the sidebar, matching every setting’s name and description and saying which page it is on. It is the question at the end of the card: add it with the move, or leave it out.</p>
  <h2 class="rv-h2">Dictation off (ADR-0107)</h2>
  <p>Today, turning dictation off keeps Cleanup alive only for the three generated-text switches. Once they move to Agents and Git, every dictation page but the first (with its switch) hides. In A and C the Dictation group shrinks to one page; in B, Cleanup goes.</p>`
}
function render() {
  header()
  const body = document.getElementById('body')
  body.innerHTML = st.tab === 'map' ? map() : st.tab === 'links' ? links() : mock()
  fit(); showActive(); sync()
}
function showActive() { document.querySelectorAll('.win .nav button[aria-selected=true]').forEach(b => { const box = b.closest('.s-body'); box.scrollTop = Math.max(0, b.offsetTop - box.clientHeight / 2) }) }
function fit() {
  document.querySelectorAll('.frame').forEach(f => {
    const w = st.w, h = hFor(w), s = Math.min(1, f.clientWidth / w)
    f.style.height = `${h * s}px`; f.querySelector('.win').style.transform = `scale(${s})`
  })
}
addEventListener('resize', fit)
function refreshWins() {
  document.querySelectorAll('.frame .win').forEach(el => { el.outerHTML = win(st.v, el.dataset.mode, st.w) })
  const z = document.querySelector('#zoom .win'); if (z) z.outerHTML = win(st.v, z.dataset.mode, st.w)
  fit(); showActive()
}
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return
  if (t.dataset.set) { let v = t.dataset.val; if (v === 'true' || v === 'false') v = v === 'true'; else if (t.dataset.set === 'w') v = +v; st[t.dataset.set] = v; st.find = ''; render(); return }
  if (t.dataset.zoom) { const z = document.getElementById('zoom'); z.innerHTML = win(st.v, t.dataset.zoom, st.w); z.classList.add('on'); showActive(); return }
  if (t.dataset.page) { st.page[st.v] = t.dataset.page; st.flash = null; refreshWins(); return }
  if (t.dataset.ctab) { st.ctab[t.dataset.area] = t.dataset.ctab; st.flash = null; refreshWins(); return }
  if (t.dataset.goto) {
    const p = leafOf(st.v, t.dataset.goto)
    if (st.v === 'C') { st.page.C = p.area.id; st.ctab[p.area.id] = p.id } else st.page[st.v] = p.id
    st.flash = t.dataset.goto; st.find = ''; refreshWins()
    document.querySelectorAll(`.win .row[data-key="${t.dataset.goto}"]`).forEach(r => r.scrollIntoView({block:'center'}))
    window.scrollTo({top:0}); return
  }
})
document.addEventListener('input', e => {
  if (!e.target.matches('[data-find]')) return
  const self = e.target, pos = self.selectionStart
  st.find = self.value
  document.querySelectorAll('.win').forEach(w => {
    const input = w.querySelector('[data-find]'); if (input !== self) input.value = st.find
    const bodyEl = w.querySelector('.s-body')
    const old = bodyEl.querySelector('[data-results], nav.nav'); const fresh = document.createElement('div')
    fresh.innerHTML = st.find ? `<div class="results" data-results>${results(st.v)}</div>` : `<nav class="nav" role="tablist" aria-label="Settings sections">${(() => { const tmp = document.createElement('div'); tmp.innerHTML = sidebar(st.v); return tmp.querySelector('nav').innerHTML })()}</nav>`
    old.replaceWith(fresh.firstElementChild)
  })
  self.focus(); self.setSelectionRange(pos, pos)
})
document.getElementById('zoomClose').onclick = () => { const z = document.getElementById('zoom'); z.classList.remove('on'); z.innerHTML = '' }
const cycle = d => { const ks = ['A','B','C']; st.v = ks[(ks.indexOf(st.v) + d + 3) % 3]; st.find = ''; render() }
document.getElementById('prev').onclick = () => cycle(-1)
document.getElementById('next').onclick = () => cycle(1)
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]')) return
  if (e.key === 'ArrowLeft') cycle(-1); else if (e.key === 'ArrowRight') cycle(1)
  else if (e.key === 'Escape') document.getElementById('zoomClose').click()
})
render()
</script>
</body>
</html>
