<!doctype html>
<!--
  PROTOTYPE - throwaway. Not shipped, not tested, not wired to anything. No network, nothing saved.

  Question: What should adding your own model server look like, and how does the user choose which provider
  (harness) drives it?

  The user points Sotto at a model server they run (SGLang, vLLM, Ollama, LM Studio, llama.cpp, anything that
  speaks the OpenAI API), on this computer or across Tailscale, then a provider (the native client) drives it:
  OpenCode today, Codex only when the server speaks the Responses API, others (oh-my-pi) later. A thread or
  Watcher can then run on it. Watcher needs dependable tool calls, at least 64K of context and enough speed, so
  adding a server runs a short check: answers, OpenAI API, key, models with their context, a tool call, speed.

  Three variants on ?variant=A|B|C, and the bar at the bottom (Left and Right arrows too, unless the focus is in a
  field, a menu or a dialog):
   A  Inside OpenCode's dialog. Settings > Providers > OpenCode > Model sources. Add a model source gains
      "Your own server" as its first row: name, address, key, Check this server, models with context and
      Thinking, Add to OpenCode. The provider is implicit; one quiet line says other providers come later.
   B  Your own servers, then the provider. A group "Your own model servers" above the provider cards. Adding is
      two steps in one dialog: address and check, then "Run it with" provider cards (OpenCode, Codex if the
      Responses API was found, oh-my-pi not yet), each saying what the user gets. More than one may be picked.
   C  From the model menu. The composer's model menu (source first) ends OpenCode's source list with "Your own
      server...". The add flow runs inside the menu: address, check, then "Run with" above the models found;
      picking a model adds the server and sets the chip ("Sparks / DeepSeek V4.1 Flash 1017 · OpenCode").
      Settings keeps a short list to check and remove servers.

  Every variant: a Thread view (the model menu), a Watcher view (Watcher's model menu with readiness lines) and
  a Settings view, picked in the bar. Bar extras, all prototype chrome: Server state (what the next check, and
  the first server in every list, does: Reachable, Asleep or unreachable, Wrong key, No models, Not
  OpenAI-compatible, Too small for Watcher), "3 servers" (start with Sparks, Ollama and LM Studio added),
  Light/Dark, and State, a readout of the simulated state that marks what changed after each action.

  Data: everything is SAMPLE. Sparks (four DGX Sparks, SGLang, DeepSeek V4.1 Flash 1017, 1M context, about 78
  tokens a second, needs a key, Responses API found). Ollama on this computer (qwen3-coder 30B at 64K and
  gemma3 4B at 8K, no key, no Responses API). LM Studio on forge (gpt-oss 20B at 32K, Responses API found).
  Watcher's bar here: the test tool call works, at least 64,000 tokens of context, at least 15 tokens a second.

  URL switches for captures: variant=A|B|C, view=settings|thread|watcher, theme=light, servers=1,
  state=reachable|asleep|wrong-key|no-models|not-openai|too-small, panel=1, scene=add|checked|step2|menu.
-->

/* SOTTO_DARK/LIGHT_THEME_COLORS (src/shared/themes/palettes.ts) through the --tt-* names tokens.css gives them. */
:root {
  color-scheme: dark;
  --tt-canvas: oklch(0.115 0.008 265);

  --tt-surface-elevated: oklch(0.185 0.008 265);
  --tt-surface-overlay: oklch(0.215 0.008 265);
  --tt-surface-sunken: oklch(0.155 0.008 265);
  --tt-sidebar: oklch(0.235 0.003 265);
  --tt-sidebar-row-hover: oklch(0.28 0.003 265);
  --tt-sidebar-row-active: oklch(0.32 0.025 190);
  --tt-card: oklch(0.185 0.008 265);
  --tt-card-inset: oklch(0.115 0.008 265);
  --tt-accent-surface: oklch(0.32 0.05 185);

  --tt-hairline: oklch(0.305 0.02 265);
  --tt-field-border: oklch(0.375 0.024 265);
  --tt-border: color-mix(in oklab, oklch(0.375 0.024 265) 25%, oklch(0.72 0.014 265));
  --tt-accent: oklch(0.714403 0.104089 183.092);
  --tt-accent-text: oklch(0.83 0.08 183);
  --tt-activity: var(--tt-accent-text);
  --tt-focus-ring: oklch(0.714403 0.104089 183.092);
  --tt-hover: color-mix(in srgb, oklch(0.32 0.05 185) 70%, transparent);
  --tt-pill: var(--tt-text);
  --tt-pill-ink: var(--tt-canvas);
  --tt-error: oklch(0.702184 0.189226 22.228);
  --tt-warning: oklch(0.829017 0.171221 81.038);
  --tt-overlay: color-mix(in srgb, var(--tt-canvas) 64%, transparent);
  --tt-shadow-lg: 0 24px 60px rgb(0 0 0 / 55%);
  --tt-scrollbar: oklch(0.315 0.008 265);

  --tt-message: oklch(0.205 0.014 265);
  --tt-provider-claude: #e3b58e;
  --tt-provider-codex: #d7dbe1;
  --tt-provider-grok: #c9baff;
  --tt-provider-devin: #a5d8f5;
  --tt-provider-muse: #f2b8d8;
  --tt-provider-opencode: #ece3d0;
  --tt-font-ui: 'Figtree', ui-sans-serif, system-ui, 'Segoe UI', sans-serif;

  --strip-h: 26px;
  --chrome-h: 52px;
}
:root[data-theme='light'] {
  color-scheme: light;
  --tt-canvas: oklch(0.978 0.004 85);
  --tt-surface: oklch(0.99 0.003 85);
  --tt-surface-elevated: oklch(0.99 0.003 85);
  --tt-surface-overlay: oklch(0.945 0.007 85);
  --tt-surface-sunken: oklch(0.945 0.008 85);
  --tt-sidebar: oklch(0.955 0.008 85);
  --tt-sidebar-row-hover: oklch(0.93 0.01 85);
  --tt-sidebar-row-active: oklch(0.915 0.02 190);
  --tt-card: color-mix(in oklab, oklch(0.235 0.014 75) 4%, oklch(0.978 0.004 85));
  --tt-card-inset: oklch(0.978 0.004 85);
  --tt-accent-surface: oklch(0.92 0.03 186);
  --tt-text: oklch(0.235 0.014 75);
  --tt-text-2: color-mix(in oklab, oklch(0.235 0.014 75) 55%, oklch(0.5 0.014 75));
  --tt-text-muted: color-mix(in oklab, oklch(0.5 0.014 75) 85%, oklch(0.235 0.014 75));
  --tt-text-faint: oklch(0.505 0.015 78);
  --tt-hairline: oklch(0.86 0.012 80);
  --tt-field-border: oklch(0.8 0.016 80);
  --tt-border: color-mix(in oklab, oklch(0.8 0.016 80) 25%, oklch(0.5 0.014 75));
  --tt-accent: oklch(0.53 0.095 186);
  --tt-accent-text: oklch(0.43 0.08 186);
  --tt-focus-ring: oklch(0.53 0.095 186);
  --tt-hover: color-mix(in srgb, oklch(0.92 0.03 186) 70%, transparent);
  --tt-error: oklch(0.509494 0.208583 28.513);
  --tt-warning: oklch(0.530927 0.155556 45.359);
  --tt-overlay: color-mix(in srgb, var(--tt-canvas) 60%, transparent);
  --tt-shadow-lg: 0 24px 60px rgb(20 24 22 / 18%);
  --tt-scrollbar: oklch(0.84 0.01 85);
  --tt-code-bg: oklch(0.96 0.005 85);
  --tt-message: oklch(0.93 0.012 85);
  --tt-provider-claude: color-mix(in srgb, #e3b58e 55%, var(--tt-text));
  --tt-provider-codex: color-mix(in srgb, #d7dbe1 30%, var(--tt-text));
  --tt-provider-grok: color-mix(in srgb, #c9baff 55%, var(--tt-text));
  --tt-provider-devin: color-mix(in srgb, #a5d8f5 45%, var(--tt-text));
  --tt-provider-muse: color-mix(in srgb, #f2b8d8 45%, var(--tt-text));
  --tt-provider-opencode: #625843;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { overflow: hidden; background: var(--tt-canvas); color: var(--tt-text); font: 14px/1.5 var(--tt-font-ui); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--tt-focus-ring); outline-offset: 2px; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 14px; height: 14px; }
svg.mark { flex: none; fill: currentColor; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { border: 3px solid transparent; border-radius: 3px; background: var(--tt-scrollbar) padding-box; }
.mark[data-p='codex'] { color: var(--tt-provider-codex); }
.mark[data-p='claude'] { color: var(--tt-provider-claude); }
.mark[data-p='grok'] { color: var(--tt-provider-grok); }
.mark[data-p='devin'] { color: var(--tt-provider-devin); }
.mark[data-p='muse'] { color: var(--tt-provider-muse); }
.mark[data-p='opencode'] { color: var(--tt-provider-opencode); }
.mark[data-p='omp'] { color: var(--tt-text-muted); }
.mono { font-family: var(--tt-font-mono); font-size: .9em; }

/* ---- controls: soft squares, never pills (ADR-0110) ---- */
.tt-button { display: inline-flex; min-height: 34px; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--tt-field-border); border-radius: 6px; padding: 0 13px; background: transparent; color: var(--tt-text-2); font-size: 13.5px; font-weight: 500; line-height: 1.2; white-space: nowrap; }
.tt-button:hover:not(:disabled) { border-color: var(--tt-text-faint); color: var(--tt-text); background: var(--tt-hover); }
.tt-button:disabled { cursor: not-allowed; opacity: .45; }
.tt-button--primary { border-color: var(--tt-pill); background: var(--tt-pill); color: var(--tt-pill-ink); font-weight: 600; }
.tt-button--primary:hover:not(:disabled) { border-color: var(--tt-pill); background: var(--tt-pill); color: var(--tt-pill-ink); filter: brightness(1.12); }
.tt-button--ghost { border-color: transparent; color: var(--tt-text-muted); }
.tt-button--ghost:hover:not(:disabled) { border-color: transparent; }
.tt-button--sm { min-height: 30px; padding: 0 11px; font-size: 13px; }
.tt-button--icon { width: 34px; padding: 0; }
.tt-input { width: 100%; min-height: 38px; border: 1px solid transparent; border-radius: 6px; background: var(--tt-card-inset); padding: 6px 12px; color: var(--tt-text); font-size: 14px; font-weight: 500; }
.tt-input:hover { border-color: var(--tt-border); }
.tt-input::placeholder { color: var(--tt-text-faint); font-weight: 400; }
.tt-input:focus-visible { outline: 2px solid var(--tt-focus-ring); outline-offset: 1px; }
.tt-input[aria-invalid='true'] { border-color: var(--tt-error); }
.tt-dialog .tt-input, .pop .tt-input { background: var(--tt-canvas); border-color: var(--tt-field-border); }
.tt-toggle { display: inline-grid; grid-template-columns: 36px; align-items: center; border: 0; background: transparent; padding: 2px 0; }
.tt-toggle__track { position: relative; width: 36px; height: 20px; border: 1px solid var(--tt-border); border-radius: 5px; background: var(--tt-card-inset); }
.tt-toggle__thumb { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 3px; background: var(--tt-text-muted); transition: transform 120ms ease; }
.tt-toggle[aria-checked='true'] .tt-toggle__track { border-color: var(--tt-text); background: var(--tt-text); }
.tt-toggle[aria-checked='true'] .tt-toggle__thumb { background: var(--tt-canvas); transform: translateX(16px); }
.dot { display: inline-block; width: 6px; height: 6px; flex: none; border-radius: 50%; background: currentColor; }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--tt-text-muted); }
.st[data-tone='ok'] { color: var(--tt-activity); }
.st[data-tone='bad'] { color: var(--tt-error); }
.st[data-tone='warn'] { color: var(--tt-warning); }
.problem { display: flex; gap: 10px; margin: 12px 0 0; padding: 11px 13px; border-left: 2px solid var(--tt-error); border-radius: 0 6px 6px 0; background: var(--tt-card-inset); color: var(--tt-text); font-size: 13.5px; line-height: 1.55; overflow-wrap: anywhere; }
.problem svg { color: var(--tt-error); margin-top: 3px; }
.notice { margin: 12px 0 0; color: var(--tt-text-2); font-size: 13.5px; line-height: 1.55; }
.quiet { margin: 10px 0 0; color: var(--tt-text-muted); font-size: 13px; line-height: 1.5; }

/* ---- the app frame, under the prototype's strip ---- */
.app { position: fixed; top: var(--strip-h); left: 0; right: 0; bottom: 0; overflow: hidden; }
.app-pad { padding-bottom: calc(var(--chrome-h) + 12px); }

/* ---- Settings (crossing-settings.css, ADR-0115's nine pages in four runs) ---- */
.settings-layout { display: grid; grid-template-columns: 268px minmax(0, 1fr); height: 100%; }
.settings-sidebar { display: flex; flex-direction: column; min-height: 0; padding: 0 10px; border-right: 1px solid var(--tt-hairline); background: var(--tt-sidebar); }
.nav-top { display: flex; flex: none; align-items: center; gap: 8px; height: 44px; padding: 0 4px; font-size: 14px; font-weight: 600; }
.nav-top i { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, var(--tt-accent), color-mix(in srgb, var(--tt-accent) 45%, var(--tt-text))); }
.settings-sidebar__body { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 0 calc(var(--chrome-h) + 12px); scrollbar-width: thin; }
.find { display: flex; align-items: center; gap: 8px; height: 36px; margin: 0 2px 14px; padding: 0 10px; border-radius: 6px; background: var(--tt-card-inset); color: var(--tt-text-muted); font-size: 13.5px; }
.settings-sidebar h1 { margin: 4px 0 14px; padding: 0 8px; font-size: 24px; font-weight: 600; letter-spacing: -.7px; }
.subnav { display: flex; flex-direction: column; gap: 3px; }
.subnav button { position: relative; display: flex; align-items: center; gap: 11px; width: 100%; min-height: 40px; padding: 9px 12px; border: 0; border-radius: 6px; color: var(--tt-text-muted); background: transparent; text-align: left; font-size: 14.5px; }
.subnav button:hover { background: var(--tt-sidebar-row-hover); color: var(--tt-text); }
.subnav button[aria-current='page'] { color: var(--tt-text); background: var(--tt-sidebar-row-active); }
.subnav button[aria-current='page'] svg { color: var(--tt-accent); }
.subnav button[data-run] { margin-top: 26px; }
.subnav button[data-run]::before { content: ''; position: absolute; top: -15px; left: 12px; right: 12px; height: 1px; background: var(--tt-hairline); }
.settings-detail { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.settings-mhead { display: none; }
.settings-scroll { flex: 1; min-height: 0; overflow: auto; padding: 38px 6vw 0; scrollbar-width: thin; }
.settings-form { width: 100%; max-width: 790px; margin: 0 auto; }
.heading { margin: 0 0 6px; padding: 0 0 18px; border-bottom: 1px solid var(--tt-hairline); }
.heading h2 { margin: 0 0 8px; font-size: 28px; font-weight: 600; line-height: 1.2; letter-spacing: -1px; }
.heading p { margin: 0; color: var(--tt-text-muted); font-size: 16px; }
.group { margin-top: 24px; }
.group > h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; padding: 0 2px; color: var(--tt-text-2); font-size: 14px; font-weight: 600; }
.group > h3 svg { color: var(--tt-text-muted); }
.group__note { margin: 0 0 10px; padding: 0 2px; color: var(--tt-text-muted); font-size: 13px; line-height: 1.45; max-width: 46em; }
.card { padding: 4px 20px; border-radius: 14px; background: var(--tt-card); }
.rows { margin: 0; padding: 0; list-style: none; }
.rows > li { padding: 14px 0; border-bottom: 2px solid var(--tt-card-inset); }
.rows > li:last-child { border-bottom: 0; }
.srv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; }
.srv__name { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 10px; min-width: 0; }
.srv__name strong { font-size: 15px; font-weight: 600; }
.srv__addr { min-width: 0; overflow: hidden; color: var(--tt-text-muted); font: 12.5px/1.5 var(--tt-font-mono); text-overflow: ellipsis; white-space: nowrap; }
.srv__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; grid-column: 1 / -1; }
.srv__meta > span:not(.st) { color: var(--tt-text-muted); font-size: 12.5px; }
.srv__actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; grid-row: 1; grid-column: 2; }
.srv .problem { grid-column: 1 / -1; margin-top: 6px; }
.empty { margin: 0; padding: 16px 0; color: var(--tt-text-muted); font-size: 14px; line-height: 1.55; }
.below { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; margin-top: 12px; }

/* Providers: a card each, the toggle on the name's line (ADR-0110 P1), the selected one's detail under them. */
.providers { container: providers / inline-size; margin-top: 22px; }
.pcards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@container providers (width < 560px) { .pcards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.pcard { position: relative; border: 1px solid transparent; border-radius: 12px; background: var(--tt-card); }
.pcard[data-selected='true'] { border-color: var(--tt-accent); background: var(--tt-card-selected); box-shadow: 0 0 0 1px var(--tt-accent); }
.pcard__select { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: 'mark name' 'status status'; gap: 6px 8px; width: 100%; padding: 13px 56px 13px 12px; border: 0; border-radius: 11px; background: transparent; text-align: left; }
.pcard__select strong { grid-area: name; overflow: hidden; font-size: 14px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
.pcard__select .st { grid-area: status; }
.pcard .tt-toggle { position: absolute; top: 11px; right: 12px; }
.pdetail { margin-top: 14px; padding: 0 20px 8px; border-radius: 14px; background: var(--tt-card); }
.pdetail__head { display: flex; align-items: center; gap: 10px; padding: 18px 0 12px; }
.pdetail__head h3 { margin: 0; font-size: 18px; font-weight: 600; }
.ver { padding: 1px 7px; border-radius: 4px; background: var(--tt-card-inset); color: var(--tt-text-muted); font-size: 12px; }
.ptabs { display: flex; gap: 22px; border-bottom: 1px solid var(--tt-hairline); }
.ptabs button { min-height: 40px; padding: 0 0 10px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--tt-text-muted); font-size: 14px; }
.ptabs button[aria-selected='true'] { color: var(--tt-text); border-bottom-color: var(--tt-activity); }
.pbody { padding: 20px 0 14px; }
.pbody h4 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
.pbody > p { margin: 0; max-width: 36em; color: var(--tt-text-muted); font-size: 14px; line-height: 1.6; }
.sources { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--tt-hairline); }
.slist { margin: 4px 0 0; padding: 0; list-style: none; }
.slist > li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 4px 14px; min-height: 56px; padding: 10px 0; }
.slist > li + li { border-top: 2px solid var(--tt-card-inset); }
.ssrc { display: grid; gap: 3px; min-width: 0; }
.ssrc strong { overflow: hidden; font-size: 14.5px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.ssrc small { color: var(--tt-text-muted); font-size: 12.5px; line-height: 1.45; overflow-wrap: anywhere; }
.scount { color: var(--tt-text-muted); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sacts { display: flex; gap: 4px; }
.slist .problem { grid-column: 1 / -1; margin-top: 2px; }
.updates { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 18px; padding: 16px 20px; border-radius: 14px; background: var(--tt-card); }
.updates h4 { margin: 0 0 3px; font-size: 14px; font-weight: 600; }
.updates p { margin: 0; color: var(--tt-text-muted); font-size: 13px; line-height: 1.5; }

/* ---- dialogs ---- */
.backdrop { position: fixed; top: var(--strip-h); left: 0; right: 0; bottom: var(--chrome-h); z-index: 50; display: grid; place-items: center; padding: 16px; background: var(--tt-overlay); }
.tt-dialog { display: flex; flex-direction: column; width: min(540px, 100%); max-height: 100%; min-height: 0; border: 1px solid var(--tt-hairline); border-radius: 10px; background: var(--tt-surface-elevated); box-shadow: var(--tt-shadow-lg); padding: 22px 24px 20px; }
.tt-dialog--pick { height: min(600px, 100%); }
.tt-dialog h2 { margin: 0; font-size: 16px; font-weight: 600; }
.tt-dialog__desc { margin: 6px 0 14px; color: var(--tt-text-muted); font-size: 13px; line-height: 1.55; }
.tt-dialog__body { flex: 1 1 auto; min-height: 0; overflow-y: auto; margin: 0 -24px; padding: 2px 24px 4px; scrollbar-width: thin; }
.tt-dialog__actions { display: flex; flex: none; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px; padding-top: 14px; }
.tt-dialog__actions .tt-button { min-height: 38px; }
.tt-dialog__actions .spacer { margin-right: auto; }
@media (prefers-reduced-motion: no-preference) { .tt-dialog { animation: rise 160ms cubic-bezier(.2, .8, .2, 1); } .pop { animation: rise 140ms cubic-bezier(.2, .8, .2, 1); } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.back { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; height: 30px; margin: -4px 0 8px -8px; padding: 0 10px 0 6px; border: 0; border-radius: 6px; background: transparent; color: var(--tt-text-muted); font-size: 13px; }
.back:hover { background: var(--tt-hover); color: var(--tt-text); }
.steps { display: flex; gap: 6px; margin: 0 0 12px; padding: 0; list-style: none; color: var(--tt-text-muted); font-size: 12.5px; }
.steps li { display: flex; align-items: center; gap: 6px; }
.steps li + li::before { content: ''; width: 18px; height: 1px; background: var(--tt-hairline); }
.steps b { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; background: var(--tt-card-inset); font-size: 11px; font-weight: 600; }

.steps li[aria-current='step'] b { background: var(--tt-text); color: var(--tt-canvas); }
.search { display: flex; flex: none; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border: 1px solid var(--tt-field-border); border-radius: 6px; background: var(--tt-canvas); color: var(--tt-text-muted); }

.pick { flex: 1; min-height: 0; overflow-y: auto; margin: 10px -12px 0; padding: 0 12px 4px; scrollbar-width: thin; }
.ghead { position: sticky; top: 0; z-index: 1; margin: 0 -12px; padding: 10px 22px 4px; background: var(--tt-surface-elevated); color: var(--tt-text-muted); font-size: 12px; font-weight: 600; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 40px; padding: 7px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--tt-text-2); text-align: left; }
.opt:hover, .opt:focus-visible { background: var(--tt-hover); color: var(--tt-text); outline: 0; }
.opt:focus-visible { box-shadow: inset 0 0 0 2px var(--tt-focus-ring); }

/* ---- the server form and its check (shared by every variant) ---- */

.fill-wrap { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 6px; background: #f1f1f1; }

.check li b { font-weight: 600; }
.check li span { color: var(--tt-text-muted); }
.check li > div { min-width: 0; overflow-wrap: anywhere; }
.models { display: grid; gap: 8px; margin-top: 12px; }
.models > h4 { margin: 4px 0 0; font-size: 13.5px; font-weight: 600; }
.mcard { display: grid; gap: 8px; padding: 12px 14px; border-radius: 10px; background: var(--tt-card); }

.think { display: inline-flex; align-items: center; gap: 8px; color: var(--tt-text-2); font-size: 13px; }

.ctx { display: flex; align-items: center; gap: 6px; }
.ctx .tt-input { width: 84px; min-height: 30px; padding: 3px 8px; font: 500 13px/1.3 var(--tt-font-mono); }
.ready { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.45; }
.ready svg { margin-top: 2px; }

.ready[data-ok='false'] { color: var(--tt-text-2); }
.ready[data-ok='false'] svg { color: var(--tt-warning); }

/* B - "Run it with" provider cards. */
.runwith { display: grid; gap: 10px; margin: 0; padding: 0; border: 0; min-width: 0; }
.runwith legend { margin-bottom: 4px; padding: 0; font-size: 14px; font-weight: 600; }
.rcard { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 4px 12px; padding: 13px 14px; border: 1px solid transparent; border-radius: 10px; background: var(--tt-card); cursor: pointer; }
.rcard:has(input:checked) { border-color: var(--tt-accent); background: var(--tt-card-selected); }

.rcard[data-off='true'] { cursor: default; }

.rcard input:focus-visible { outline: 0; }
.rcard__head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; }

.rcard li svg { margin-top: 2px; color: var(--tt-activity); }
.rcard li[data-has='false'] { color: var(--tt-text-muted); }
.rcard li[data-has='false'] svg { color: var(--tt-text-muted); }

/* ---- the Threads page, around the composer ---- */
.threads { display: grid; grid-template-columns: 260px minmax(0, 1fr); height: 100%; }
.tside { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; border-right: 1px solid var(--tt-hairline); background: var(--tt-sidebar); color: var(--tt-text-muted); font-size: 14px; overflow: hidden; }
.tside__group { padding: 12px 8px 4px; font-size: 12.5px; color: var(--tt-text-faint); }
.trow { display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 8px; border-radius: 6px; color: var(--tt-text-2); white-space: nowrap; overflow: hidden; }
.trow > span { overflow: hidden; text-overflow: ellipsis; }
.trow[aria-current] { background: var(--tt-sidebar-row-active); color: var(--tt-text); }
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.pane__head { display: flex; align-items: center; gap: 10px; flex: none; height: 44px; padding: 0 14px 0 18px; border-bottom: 1px solid var(--tt-hairline); }
.pane__head h2 { margin: 0; overflow: hidden; font-size: 15px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.pane__crumb { color: var(--tt-text-muted); font-size: 12.5px; white-space: nowrap; }
.transcript { flex: 1; min-height: 0; overflow-y: auto; padding: 20px max(20px, calc((100% - 760px) / 2)) 8px; }

.who { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; color: var(--tt-text-muted); font-size: 12.5px; }
.compose { flex: none; padding: 6px max(20px, calc((100% - 760px) / 2)) calc(var(--chrome-h) + 14px); }
.composer { position: relative; padding: 12px 14px 8px; border-radius: 14px; background: var(--tt-card); }
.composer textarea { display: block; width: 100%; min-height: 52px; resize: none; padding: 0; border: 0; outline: 0; background: transparent; color: var(--tt-text); font: 15px/1.5 var(--tt-font-ui); }
.composer textarea::placeholder { color: var(--tt-text-muted); }
.composer__foot { display: flex; align-items: center; gap: 8px; margin-top: 4px; min-width: 0; }
.chips { display: flex; flex: 1; flex-wrap: wrap; align-items: center; gap: 2px 4px; min-width: 0; }
/* ADR-0113: in a composer the option chips are text buttons, no edge or fill at rest. */
.sel { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; height: 28px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--tt-text-2); font-size: 13px; white-space: nowrap; }
.sel:hover, .sel[aria-expanded='true'] { background: var(--tt-hover); color: var(--tt-text); }
.sel .mark { width: 13px; height: 13px; }
.sel__txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sel__svc { color: var(--tt-text-muted); }
.sel--muted { color: var(--tt-text-muted); }
.disc { display: inline-grid; place-items: center; flex: none; width: 30px; height: 30px; border: 0; border-radius: 50%; background: var(--tt-accent-text); color: var(--tt-canvas); }
.below-composer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 14px; margin: 6px 4px 0; color: var(--tt-text-muted); font-size: 12.5px; line-height: 1.45; }
.below-composer .ready { font-size: 12.5px; }

/* The model menu: the provider rail, then the list (source first, Zach's pick C of the menu prototype). */
.pop { position: absolute; bottom: calc(100% + 6px); left: 0; z-index: 30; display: flex; align-items: stretch; width: min(420px, calc(100vw - 24px)); max-height: min(470px, calc(100dvh - var(--strip-h) - var(--chrome-h) - 190px)); min-height: 220px; overflow: hidden; border: 1px solid var(--tt-field-border); border-radius: 12px; background: var(--tt-surface); box-shadow: var(--tt-shadow-lg); }
.rail { display: flex; flex: none; flex-direction: column; gap: 4px; width: 52px; padding: 8px 6px; border-right: 1px solid var(--tt-hairline); background: var(--tt-card); overflow-y: auto; scrollbar-width: none; }
.rail__tile { position: relative; display: grid; place-items: center; flex: none; width: 40px; height: 40px; border: 0; border-radius: 8px; background: transparent; }
.rail__tile .mark { width: 18px; height: 18px; opacity: .8; }
.rail__tile:hover { background: var(--tt-hover); }
.rail__tile[aria-selected='true'] { background: var(--tt-card-selected); }
.rail__tile[aria-selected='true'] .mark { opacity: 1; }
.rail__tile[aria-selected='true']::before { content: ''; position: absolute; left: -6px; top: 10px; bottom: 10px; width: 2px; border-radius: 0 2px 2px 0; background: var(--tt-accent); }
.mlist { display: flex; flex: 1; flex-direction: column; min-width: 0; min-height: 0; }
.mhead { display: flex; align-items: center; gap: 6px; flex: none; min-height: 40px; padding: 0 12px 0 6px; border-bottom: 1px solid var(--tt-hairline); }
.mhead b { min-width: 0; overflow: hidden; font-size: 13.5px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
.mhead .back { margin: 0; }
.mhead--title { padding-left: 12px; }
.mhead span { margin-left: auto; flex: none; color: var(--tt-text-muted); font-size: 12px; }
.mscroll { flex: 1; min-height: 0; overflow-y: auto; padding: 6px; scrollbar-width: thin; }
.mgroup { padding: 10px 8px 4px; color: var(--tt-text-muted); font-size: 12px; font-weight: 600; }
.svc { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 46px; padding: 7px 8px 7px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--tt-text-2); text-align: left; }
.svc:hover, .svc:focus-visible { background: var(--tt-hover); color: var(--tt-text); outline: 0; }
.svc:focus-visible { box-shadow: inset 0 0 0 2px var(--tt-focus-ring); }
.svc__t { display: grid; flex: 1; gap: 1px; min-width: 0; }
.svc__t b { overflow: hidden; font-size: 13.5px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.svc__t em { font-style: normal; color: var(--tt-text-muted); font-size: 12px; line-height: 1.4; }
.svc__t em[data-tone='ok'] { color: var(--tt-activity); }
.svc__t em[data-tone='bad'] { color: var(--tt-error); }
.svc[aria-current='true'] .svc__t b { color: var(--tt-accent-text); }
.svc > svg { color: var(--tt-text-muted); }
.svc--add { color: var(--tt-text); border-top: 0; }
.svc--add .svc__t b { font-weight: 600; }
.svc[aria-disabled='true'] { cursor: default; }
.svc[aria-disabled='true'] .svc__t b { color: var(--tt-text-muted); }
.mrow { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 34px; padding: 6px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--tt-text-2); font-size: 13.5px; text-align: left; }
.mrow:hover, .mrow:focus-visible { background: var(--tt-hover); color: var(--tt-text); outline: 0; }
.mrow:focus-visible { box-shadow: inset 0 0 0 2px var(--tt-focus-ring); }
.mrow[aria-selected='true'] { color: var(--tt-accent-text); }
.mrow__t { display: grid; flex: 1; min-width: 0; gap: 1px; }
.mrow__t b { overflow: hidden; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.mrow__t em { font-style: normal; color: var(--tt-text-muted); font-size: 12px; line-height: 1.4; }
.mrow__t em[data-tone='ok'] { color: var(--tt-activity); }
.mrow[aria-disabled='true'] { cursor: default; }
.mrow[aria-disabled='true'] .mrow__t b { color: var(--tt-text-muted); }
.mrow .tick { color: var(--tt-accent-text); }
.mrow:not([aria-selected='true']) .tick { visibility: hidden; }
.mform { padding: 8px 8px 10px; }
.mform .fields { gap: 10px; }
.mform .fill { margin-bottom: 10px; }
.mform .check { padding: 2px 12px; }
.mform .check li { padding: 6px 0; font-size: 13px; }
.mform .problem { font-size: 13px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 3px; border-radius: 6px; background: var(--tt-card-inset); }
.seg button { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: var(--tt-text-muted); font-size: 13px; }
.seg button:hover:not([aria-disabled='true']) { color: var(--tt-text); }
.seg button[aria-checked='true'] { background: var(--tt-surface-overlay); color: var(--tt-text); box-shadow: 0 1px 2px rgb(0 0 0 / 25%); }
.seg button[aria-disabled='true'] { cursor: default; text-decoration: underline dotted; text-underline-offset: 3px; }
.seg .mark { width: 12px; height: 12px; }
.runbar { display: grid; gap: 6px; padding: 8px 8px 10px; border-bottom: 1px solid var(--tt-hairline); }
.runbar > span { color: var(--tt-text-muted); font-size: 12px; font-weight: 600; }
.runbar p { margin: 0; color: var(--tt-text-muted); font-size: 12px; line-height: 1.45; }
.mnote { flex: none; margin: 0; padding: 8px 12px 10px; border-top: 1px solid var(--tt-hairline); color: var(--tt-text-muted); font-size: 12px; line-height: 1.45; }

/* ---- Watcher's room, enough of it for the model menu ---- */
.wroom { position: relative; display: flex; flex-direction: column; height: 100%; background: radial-gradient(120% 60% at 0% 0%, color-mix(in oklab, var(--tt-accent-surface) 45%, var(--tt-canvas)), var(--tt-canvas) 60%); }
.whead { display: flex; align-items: center; gap: 12px; flex: none; height: 52px; padding: 0 18px; }
.whead .owl { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--tt-card); color: var(--tt-accent-text); }
.whead h2 { margin: 0; font-size: 17px; font-weight: 600; }
.wtabs { display: flex; gap: 2px; margin-left: 10px; }
.wtabs span { padding: 5px 10px; border-radius: 6px; color: var(--tt-text-muted); font-size: 13.5px; }
.wtabs span:first-child { background: var(--tt-card); color: var(--tt-text); }
.wbody { flex: 1; min-height: 0; display: grid; place-items: center; padding: 20px; color: var(--tt-text-muted); font-size: 14px; text-align: center; }
.wbody p { max-width: 30em; margin: 0; line-height: 1.6; }

/* ---- the prototype's own chrome: not part of the design ---- */
.strip { position: fixed; top: 0; left: 0; right: 0; z-index: 90; display: flex; align-items: center; gap: 8px; min-height: var(--strip-h); padding: 3px 12px; background: #fff3c4; color: #2b2300; font: 12.5px/1.35 var(--tt-font-ui); }
.strip b { flex: none; font-weight: 700; letter-spacing: .04em; }
.strip span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chrome { position: fixed; left: 50%; bottom: max(8px, env(safe-area-inset-bottom)); z-index: 99; display: flex; width: max-content; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 6px; max-width: calc(100vw - 16px); padding: 5px 8px; border-radius: 12px; background: #f4f4f4; color: #111; font: 12.5px/1 var(--tt-font-ui); box-shadow: 0 8px 30px rgb(0 0 0 / 40%); transform: translateX(-50%); }
.chrome button, .chrome select { min-height: 30px; padding: 0 9px; border: 0; border-radius: 6px; background: none; color: #111; font: 12.5px/1 var(--tt-font-ui); }
.chrome select { border: 1px solid #bbb; background: #fff; padding: 0 6px; }
.chrome button:hover { background: #ddd; }
.chrome button[aria-pressed='true'] { background: #d2d2d2; font-weight: 600; }
.chrome .grp { display: inline-flex; align-items: center; gap: 2px; }
.chrome .lbl { padding: 0 4px; white-space: nowrap; }
.chrome .lbl b { font-weight: 700; }
.chrome .sep { width: 1px; height: 18px; background: #ccc; }
.chrome .short { display: none; }
@media (max-width: 900px) { .chrome .long, .chrome .hide-mid { display: none; } .chrome .short { display: inline; } }
.chrome label { display: inline-flex; align-items: center; gap: 5px; color: #333; }
.chrome :focus-visible { outline: 2px solid #0a6; outline-offset: 1px; }
.statep { position: fixed; right: 10px; top: calc(var(--strip-h) + 10px); bottom: calc(var(--chrome-h) + 14px); z-index: 95; display: flex; flex-direction: column; width: min(360px, calc(100vw - 20px)); border-radius: 10px; background: #fbfbfb; color: #111; box-shadow: 0 10px 40px rgb(0 0 0 / 45%); font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.statep header { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-bottom: 1px solid #ddd; font: 600 12.5px/1.2 var(--tt-font-ui); }
.statep header span { margin-right: auto; }
.statep header button { min-height: 28px; padding: 0 9px; border: 0; border-radius: 6px; background: #e6e6e6; color: #111; font: 12px/1 var(--tt-font-ui); }
.statep pre { flex: 1; min-height: 0; margin: 0; padding: 10px 12px 14px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
.statep pre .chg { background: #fff0a8; box-shadow: -12px 0 0 #fff0a8, 12px 0 0 #fff0a8; }
.statep pre .k { color: #555; }

/* ---- narrow windows: 820 wide down to a phone ---- */
@media (max-width: 1100px) { .settings-layout { grid-template-columns: 205px minmax(0, 1fr); } .settings-scroll { padding: 30px 30px 0; } .threads { grid-template-columns: 220px minmax(0, 1fr); } }
@media (max-width: 900px) {
  .settings-layout { grid-template-columns: 180px minmax(0, 1fr); }
  .subnav button { min-height: 36px; padding: 7px 10px; gap: 8px; font-size: 14px; }
  .subnav button[data-run] { margin-top: 20px; }
  .subnav button[data-run]::before { top: -11px; }
  .settings-scroll { padding: 24px 22px 0; }
  .threads { grid-template-columns: 190px minmax(0, 1fr); }
  .mcard__facts { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .mcard__facts .fact:first-child { grid-column: 1 / -1; }

  if (lc && lc.ok) for (const m of lc.models) out.push('    · ' + m.name + '  ' + fmtCtx(m.context) + '  ' + (watcherFit(m).ok ? 'suits Watcher' : 'not for Watcher'))
  const holder = state.dialog || state.menu
  if (holder?.form && (holder.form.address || holder.form.name)) out.push('form: ' + JSON.stringify({ name: holder.form.name, address: holder.form.address, key: holder.form.key ? 'typed' : '' }))
  if (state.dialog?.run) out.push('run with (picked): ' + Object.keys(state.dialog.run).filter(p => state.dialog.run[p]).map(p => PNAME[p]).join(', '))
  if (state.menu?.step === 'source' || state.menu?.step === 'add') out.push('run with (menu): ' + PNAME[state.menu.runWith])
  out.push('notice: ' + (state.notice || '—'))
  out.push('last action: ' + state.lastAction)
  return out
}
function updatePanel() {
  const host = $('#panel')
  const lines = snapshot()
  if (!state.panel) { host.replaceChildren(); lastLines = lines; return }
  const prev = new Set(lastLines || [])
  const pre = el('pre', { tabindex: '0', 'aria-label': 'Simulated state' }, lines.map(l => el('div', { class: lastLines && !prev.has(l) ? 'chg' : undefined, text: l })))
  host.replaceChildren(el('aside', { class: 'statep', 'aria-label': 'State readout (prototype)' }, [el('header', {}, [el('span', { text: 'State (prototype) · changes marked' }),
    el('button', { type: 'button', 'aria-label': 'Hide the state readout', text: 'Hide', on: { click: () => { state.panel = false; render('panel') } } })]), pre]))
  lastLines = lines
}
function setTheme(light) { document.documentElement.dataset.theme = light ? 'light' : 'dark' }
function resetFor() {
  state.servers = []; state.dialog = null; state.notice = ''; state.lastCheck = null; state.selectedProvider = 'opencode'; state.ptab = 'configuration'
  state.chosen = { thread: { provider: 'opencode', source: 'zen', model: 'Big Pickle' }, watcher: { provider: 'codex', source: null, model: 'GPT-6-Sol' } }
  if (state.seeded) {
    seed()
    const sp = state.servers[0]
    state.chosen.thread = { provider: 'opencode', source: sp.id, model: sp.models[0].name }
    state.chosen.watcher = { provider: 'opencode', source: sp.id, model: sp.models[0].name }
  }
  if (state.menu) { const mode = state.menu.mode; state.menu = null; openMenuSilently(mode) }
}
function openMenuSilently(mode) { const c = chosenOf(mode); state.menu = { mode, rail: c.provider, step: 'sources', source: null, form: { name: '', address: '', key: '' }, check: null, runWith: 'opencode' } }
const keys = Object.keys(VARIANTS)
function go(step) {
  state.variant = keys[(keys.indexOf(state.variant) + step + keys.length) % keys.length]
  state.view = VARIANTS[state.variant].views[0]
  state.menu = null; resetFor()
  if (state.view !== 'settings') openMenuSilently(state.view)
  state.lastAction = 'Switched to variant ' + state.variant
  const u = new URL(location.href); u.searchParams.set('variant', state.variant); u.searchParams.delete('scene'); u.searchParams.delete('view'); history.replaceState(null, '', u)
  render(step < 0 ? 'prev' : 'next')
}
addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (state.dialog) { e.preventDefault(); closeDialog('Closed the dialog with Escape'); return }
    if (state.menu) {
      e.preventDefault()
      if (state.menu.step !== 'sources') { state.menu.step = 'sources'; state.menu.source = null; state.menu.check = null; render('menu-first') } else closeMenu('Closed the menu with Escape')
      return
    }
    if (state.panel) { e.preventDefault(); state.panel = false; render('panel') }
    return
  }
  if (e.key === 'Tab' && state.dialog) {
    const f = [...document.querySelectorAll('.tt-dialog button:not(:disabled), .tt-dialog input:not(:disabled)')]
    if (!f.length) return
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus() }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus() }
    else if (!document.activeElement.closest('.tt-dialog')) { e.preventDefault(); f[0].focus() }
    return
  }
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return
  const n = document.activeElement
  if (state.dialog || state.menu) return
  if (n && (n.tagName === 'INPUT' || n.tagName === 'SELECT' || n.tagName === 'TEXTAREA' || n.closest('[role=tablist]'))) return
  if (n && n !== document.body && !n.closest('.chrome')) return
  go(e.key === 'ArrowLeft' ? -1 : 1)
})
addEventListener('mousedown', e => { if (state.menu && !e.target.closest('.pop') && !e.target.closest('.sel') && !e.target.closest('.chrome') && !e.target.closest('.statep')) closeMenu('Closed the menu') })
addEventListener('resize', () => { drawChrome(); fitPop() })

/* ---------- Start, with URL switches for captures ---------- */
const q = new URL(location.href).searchParams
state.variant = keys.includes((q.get('variant') || '').toUpperCase()) ? q.get('variant').toUpperCase() : 'A'
setTheme(q.get('theme') === 'light')
if (q.get('motion') === 'reduce') document.documentElement.dataset.motion = 'reduce'
state.view = VARIANTS[state.variant].views.includes(q.get('view')) ? q.get('view') : VARIANTS[state.variant].views[0]
if (SERVER_STATES.some(s => s[0] === q.get('state'))) state.serverState = q.get('state')
state.seeded = q.get('servers') === '1'
state.panel = q.get('panel') === '1'
resetFor()
const scene = q.get('scene')
const sp = PRESETS[0]
const instant = h => { const res = runCheck(h.form); h.check = { with: { address: h.form.address, key: h.form.key }, phase: 'done', shown: res.steps.findIndex(s => s.r === 'bad') >= 0 ? res.steps.findIndex(s => s.r === 'bad') + 1 : res.steps.length, res }; state.lastCheck = res }
if (state.view !== 'settings') openMenuSilently(state.view)
if (scene && state.view === 'settings' && state.variant === 'A') {
  state.dialog = scene === 'add' || scene === 'checked' ? { kind: 'a-server', form: { ...sp }, check: null } : { kind: 'pick', query: '' }
  if (scene === 'checked') instant(state.dialog)
}
if (scene && state.view === 'settings' && state.variant === 'B') {
  state.dialog = { kind: 'b', step: 1, form: { ...sp }, check: null, run: { opencode: true } }
  if (scene === 'checked' || scene === 'step2') instant(state.dialog)
  if (scene === 'step2' && state.dialog.check.res.ok) { state.dialog.step = 2; if (!state.dialog.check.res.responses) delete state.dialog.run.codex }
}
if (scene && state.menu && (scene === 'add' || scene === 'checked')) {
  state.menu.rail = 'opencode'; state.menu.step = 'add'; state.menu.form = { ...sp }
  if (scene === 'checked') instant(state.menu)
}
if (scene === 'source' && state.menu && state.servers.length) { state.menu.rail = 'opencode'; state.menu.step = 'source'; state.menu.source = state.servers[q.get('server') ? +q.get('server') : 0].id; state.menu.runWith = state.servers[0].providers[0] }
let sceneKey
if (state.dialog?.kind === 'a-server') sceneKey = state.dialog.check ? 'a-add' : 'a-address'
else if (state.dialog?.kind === 'b') sceneKey = state.dialog.step === 2 ? 'dlg-first' : state.dialog.check ? 'b-next' : 'b-address'
else if (state.menu?.step === 'add') sceneKey = state.menu.check ? (state.menu.check.res.ok ? 'menu-first' : 'm-check') : 'm-address'
render(sceneKey)
if (scene === 'checked') { const b = document.querySelector('[data-scroll="dlg"]'), c = document.querySelector('.tt-dialog .check'); if (b && c) b.scrollTop = c.offsetTop - b.offsetTop - 60; document.querySelector('.pop .problem')?.scrollIntoView({ block: 'nearest' }) }
</script>
