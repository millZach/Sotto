<!doctype html>
<!-- THROWAWAY PROTOTYPE - three places to clear old threads out of Sotto's history (issue: "a way to clear old threads").
     A: on the Settled shelf. B: select and delete in the sidebar. C: a Threads settings section with a clear-after rule.
     Synthetic threads only, in memory; nothing here talks to Sotto. Drawn in the Soft square look (ADR-0110).
     URL: ?v=A|B|C picks the variant, &mode=dark|light, &w=1280|820 the window. Arrow keys cycle variants. -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clear old threads (prototype)</title>
<style>
@font-face{font-family:Figtree;font-weight:300 900;font-display:swap;src:url(Figtree.ttf) format("truetype"),url(../../apps/ios/Sotto/Resources/Figtree.ttf) format("truetype")}

/* The review page around the mock. Not part of the design. */
:root{color-scheme:dark;--rv-bg:#16171a;--rv-text:#e9eaee;--rv-muted:#9a9ea8;--rv-line:#30323a;--rv-on:#e9eaee;--rv-on-ink:#16171a;--rv-accent:#5fc6c9}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px/1.45 Figtree,system-ui,sans-serif;background:var(--rv-bg);color:var(--rv-text);padding-bottom:90px;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rv-accent);outline-offset:2px}
.rv-head{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;background:var(--rv-bg);border-bottom:1px solid var(--rv-line)}
.rv-head h1{margin:0 auto 0 0;font-size:16px;font-weight:600}
.rv-head h1 small{font-weight:400;color:var(--rv-muted);margin-left:6px}
.rv-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.rv-row>span{font-size:12px;color:var(--rv-muted);margin:0 2px 0 6px}
.rv-row button{border:1px solid var(--rv-line);background:transparent;border-radius:6px;padding:5px 10px;font-size:13px;color:var(--rv-muted)}
.rv-row button[aria-pressed=true]{background:var(--rv-on);color:var(--rv-on-ink);border-color:var(--rv-on)}
.rv-body{padding:14px 16px 0}
.rv-intro{max-width:1040px;margin:0 0 12px;color:#cfd2d8}
.rv-intro b{color:var(--rv-text)}
.rv-intro ul{margin:6px 0 0;padding-left:18px}
.rv-intro li{margin:3px 0}
.rv-log{max-width:1040px;margin:12px 0 0;font-size:12.5px;color:var(--rv-muted)}
.rv-log b{color:var(--rv-text);font-weight:600}
.frame{position:relative;overflow:hidden;border-radius:8px;outline:1px solid var(--rv-line)}
.frame>.win{transform-origin:0 0;position:absolute;top:0;left:0}
.switcher{position:fixed;left:50%;bottom:14px;z-index:40;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;border-radius:10px;background:#000;color:#fff;box-shadow:0 6px 24px #0008}
.switcher button{background:#2a2a2a;border:0;color:#fff;border-radius:6px;width:34px;height:32px}
.switcher div{padding:0 8px;line-height:1.25;text-align:center;min-width:200px}
.switcher small{display:block;color:#aaa;font-size:11px}
@media (max-width:700px){.rv-head{position:static}.frame{overflow-x:auto}.frame>.win{position:relative}.rv-body{padding:10px 8px 0}}

/* ---------- The mock window: theme roles as the default Sotto theme paints them ---------- */
.win{--ah:183;
  --canvas:oklch(.115 .008 265);--raised:oklch(.185 .008 265);--overlay:oklch(.215 .008 265);--sunken:oklch(.155 .008 265);
  --sidebar:oklch(.165 .006 265);--text:oklch(.985 .005 280);--text2:oklch(.86 .01 270);--muted:oklch(.72 .014 265);--faint:oklch(.62 .012 270);
  --border:oklch(.305 .02 265);--input:oklch(.375 .024 265);--hair:color-mix(in oklab,var(--border) 62%,var(--canvas));
  --accent:oklch(.714 .104 var(--ah));--accent-text:oklch(.83 .08 var(--ah));--accent-surface:oklch(.32 .05 var(--ah));
  --card:var(--raised);--row-active:color-mix(in oklab,var(--accent-surface) 45%,var(--sidebar));--row-hover:color-mix(in oklab,var(--text) 6%,var(--sidebar));
  --pill:var(--text);--pill-ink:var(--canvas);--danger:oklch(.68 .16 28);--danger-ink:oklch(.16 .02 28);--warn:oklch(.8 .12 80);
  color-scheme:dark;display:flex;flex-direction:column;overflow:hidden;background:var(--canvas);color:var(--text);font:14px/1.45 Figtree,system-ui,sans-serif;text-align:left}
.win[data-mode=light]{color-scheme:light;
  --canvas:oklch(.978 .004 85);--raised:oklch(.955 .006 85);--overlay:oklch(.995 .002 85);--sunken:oklch(.93 .008 85);
  --sidebar:oklch(.955 .008 85);--text:oklch(.235 .014 75);--text2:oklch(.36 .014 75);--muted:oklch(.48 .014 75);--faint:oklch(.52 .015 78);
  --border:oklch(.86 .012 80);--input:oklch(.8 .016 80);--hair:color-mix(in oklab,var(--border) 70%,var(--canvas));
  --accent:oklch(.53 .095 var(--ah));--accent-text:oklch(.43 .08 var(--ah));--accent-surface:oklch(.92 .03 var(--ah));
  --card:color-mix(in oklab,var(--text) 4%,var(--canvas));
  --row-active:color-mix(in oklab,var(--accent-surface) 70%,var(--sidebar));--row-hover:color-mix(in oklab,var(--text) 5%,var(--sidebar));
  --danger:oklch(.52 .17 28);--danger-ink:oklch(.99 0 0);--warn:oklch(.55 .12 70)}
.win *{box-sizing:border-box}
.win svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.strip{height:34px;flex:none;display:flex;align-items:center;gap:14px;padding:0 12px;border-bottom:1px solid var(--hair);font-size:13px;color:var(--muted)}
.strip b{color:var(--text);font-weight:500}
.strip .sp{margin-left:auto;display:flex;gap:16px}
.room{flex:1;display:flex;min-height:0}

/* Threads sidebar */
.side{flex:none;width:var(--sw);display:flex;flex-direction:column;min-height:0;background:var(--sidebar);border-right:1px solid var(--hair)}
.side-top{display:flex;align-items:center;gap:6px;height:44px;flex:none;padding:0 8px 0 14px;color:var(--muted)}
.side-top .t{margin-right:auto;font-weight:600;color:var(--text)}
.tb{border:0;background:transparent;color:var(--muted);border-radius:6px;padding:4px 8px;font-size:13px}
.tb:hover{background:var(--row-hover);color:var(--text)}
.tb[aria-pressed=true]{background:var(--overlay);color:var(--text)}
.ib{border:0;background:transparent;color:var(--muted);border-radius:6px;width:28px;height:28px;display:inline-grid;place-items:center}
.ib:hover{background:var(--row-hover);color:var(--text)}
.side-body{flex:1;overflow:auto;padding:0 6px 10px}
.sec{display:flex;align-items:center;gap:6px;padding:12px 8px 4px;font-size:12px;color:var(--muted);text-transform:none;letter-spacing:.01em}
.sec .n{color:var(--faint)}
.sec .tb{margin-left:auto;font-size:12.5px;padding:2px 7px}
.fold{display:flex;align-items:center;gap:6px;padding:5px 8px;font-size:13px;color:var(--text2)}
.fold svg{width:14px;height:14px;color:var(--faint)}
.row{position:relative;display:flex;align-items:flex-start;gap:8px;padding:6px 8px 6px 22px;border-radius:7px;cursor:default}
.row:hover{background:var(--row-hover)}
.row[aria-current=true]{background:var(--row-active)}
.row .main{flex:1;min-width:0}
.row .title{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta .keep{color:var(--warn)}
.row .acts{display:none;gap:2px;position:absolute;right:6px;top:6px;background:var(--row-hover);border-radius:6px}
.row:hover .acts,.row:focus-within .acts{display:flex}
.row .acts .ib{width:26px;height:26px}
.row .acts .ib.del:hover{color:var(--danger)}
.chk{appearance:none;width:15px;height:15px;margin:2px 0 0 -16px;border:1.5px solid var(--input);border-radius:4px;background:var(--canvas);flex:none;display:grid;place-items:center}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:'';width:7px;height:4px;border:2px solid var(--pill-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.row.sel{background:color-mix(in oklab,var(--accent-surface) 40%,var(--sidebar))}
.selbar{flex:none;display:flex;align-items:center;gap:6px;padding:8px;border-top:1px solid var(--hair);background:var(--sidebar);font-size:13px}
.selbar .c{margin-right:auto;color:var(--text2)}

/* The pane */
.pane{flex:1;min-width:0;display:flex;flex-direction:column}
.pane-head{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--hair)}
.pane-head h2{margin:0 auto 0 0;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane-body{flex:1;overflow:auto;padding:22px 28px;display:flex;flex-direction:column;gap:14px;max-width:760px}
.msg{background:var(--card);border-radius:10px;padding:10px 14px;color:var(--text2);font-size:13.5px}
.msg.u{align-self:flex-end;background:var(--overlay);color:var(--text)}
.note{color:var(--muted);font-size:13px}
.menu{position:absolute;z-index:5;min-width:220px;background:var(--overlay);border:1px solid var(--border);border-radius:9px;padding:5px;box-shadow:0 10px 30px rgb(0 0 0/35%)}
.menu button{display:flex;width:100%;align-items:center;gap:9px;border:0;background:transparent;border-radius:6px;padding:7px 9px;font-size:13.5px;color:var(--text);text-align:left}
.menu button:hover{background:var(--row-hover)}
.menu hr{border:0;border-top:1px solid var(--hair);margin:4px 2px}
.menu .danger{color:var(--danger)}

/* Settings page (variant C) */
.set-nav{flex:none;width:var(--sw);background:var(--sidebar);border-right:1px solid var(--hair);padding:10px 6px;font-size:13.5px}
.set-nav div{padding:6px 10px;border-radius:7px;color:var(--text2)}
.set-nav div[aria-current=true]{background:var(--row-active);color:var(--text)}
.set-nav hr{border:0;border-top:1px solid var(--hair);margin:6px 8px}
.set-main{flex:1;overflow:auto;padding:24px 32px}
.set-main h2{margin:0 0 4px;font-size:20px;font-weight:600}
.set-main h3{margin:22px 0 8px;font-size:14px;font-weight:600}
.card{background:var(--card);border-radius:10px;padding:4px 16px;max-width:720px}
.srow{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--hair)}
.srow:last-child{border-bottom:0}
.srow .l{flex:1}
.srow .l b{display:block;font-weight:500}
.srow .l span{font-size:12.5px;color:var(--muted)}
.sel-in{background:var(--canvas);border:1px solid var(--input);border-radius:7px;padding:5px 8px;font-size:13px}
.btn{border:1px solid var(--input);background:var(--overlay);color:var(--text);border-radius:7px;padding:6px 12px;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--pill);color:var(--pill-ink);border-color:var(--pill)}
.btn.danger{background:var(--danger);color:var(--danger-ink);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}

/* Dialog */
.scrim{position:absolute;inset:0;z-index:20;background:rgb(0 0 0/45%);display:grid;place-items:center;padding:20px}
.dlg{width:min(480px,100%);max-height:100%;overflow:auto;background:var(--overlay);border:1px solid var(--border);border-radius:12px;padding:18px 20px 16px;box-shadow:0 18px 50px rgb(0 0 0/45%)}
.dlg h3{margin:0 0 6px;font-size:16px;font-weight:600}
.dlg p{margin:0 0 10px;color:var(--text2);font-size:13.5px}
.dlg .age{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 12px}
.dlg .age button{border:1px solid var(--input);background:transparent;border-radius:6px;padding:4px 10px;font-size:13px;color:var(--text2)}
.dlg .age button[aria-pressed=true]{background:var(--pill);color:var(--pill-ink);border-color:var(--pill)}
.dlg .lst{background:var(--sunken);border-radius:8px;padding:6px 10px;margin:0 0 10px;font-size:13px;max-height:140px;overflow:auto}
.dlg .lst div{display:flex;gap:8px;padding:3px 0}
.dlg .lst div span:first-child{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlg .lst div span:last-child{color:var(--muted);white-space:nowrap}
.dlg .lbl{font-size:12px;color:var(--muted);margin:0 0 4px}
.dlg ul{margin:0 0 12px;padding-left:18px;font-size:13px;color:var(--text2)}
.dlg ul li{margin:2px 0}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.toast{position:absolute;z-index:15;left:50%;bottom:18px;transform:translateX(-50%);background:var(--overlay);border:1px solid var(--border);border-radius:9px;padding:8px 10px 8px 14px;font-size:13.5px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgb(0 0 0/35%)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .16s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,6px)}}}
</style>
</head>
<body>
<header class="rv-head">
  <h1>Clear old threads <small>prototype · synthetic threads</small></h1>
  <div class="rv-row" id="vbtns"><span>Variant</span></div>
  <div class="rv-row" id="mbtns"><span>Look</span></div>
  <div class="rv-row" id="wbtns"><span>Window</span></div>
  <div class="rv-row"><button id="reset">Put threads back</button></div>
</header>
<div class="rv-body">
  <div class="rv-intro" id="intro"></div>
  <div class="frame" id="frame"></div>
  <div class="rv-log" id="log"></div>
</div>
<div class="switcher" aria-label="Variant switcher">
  <button id="prev" aria-label="Previous variant">←</button>
  <div id="vlabel"></div>
  <button id="next" aria-label="Next variant">→</button>
</div>
<script>
const DAY = 864e5, NOW = Date.parse('2026-10-23T12:00:00Z')
const ICON = {
  trash: '<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  restore: '<svg viewBox="0 0 24 24"><path d="M3 7h18v4H3zM5 11v9h14v-9M10 15l2-2 2 2M12 13v5"/></svg>',
  settle: '<svg viewBox="0 0 24 24"><path d="M3 7h18v4H3zM5 11v9h14v-9M10 15h4"/></svg>',
  dots: '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>',
  folder: '<svg viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3z"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  pencil: '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
}
// Synthetic threads. settled: days since Settle (null = open). keep: why a clear would leave it alone.
const SEED = [
  { id: 't1', title: 'Let a thread name itself from its first exchange', project: 'Sotto', provider: 'Claude', settled: null, branch: 'feat/thread-names' },
  { id: 't2', title: 'Fix the dictation silent tail', project: 'Sotto', provider: 'Codex', settled: null, branch: 'fix/dictation-silent-tail' },
  { id: 't3', title: 'Ladder logic for boiler 2 purge', project: 'Plant controls', provider: 'Claude', settled: null, branch: 'main' },
  { id: 't4', title: 'Move the cleanup rules to Git & worktrees', project: 'Sotto', provider: 'Claude', settled: 41, branch: 'feat/settings-pages', worktree: 'clean' },
  { id: 't5', title: 'Ship a Mac host archive with every Owl', project: 'Sotto', provider: 'Codex', settled: 63, branch: 'chore/mac-host-archive', worktree: 'removed' },
  { id: 't6', title: 'Try the night scene under the column', project: 'Sotto', provider: 'Claude', settled: 35, branch: 'prototype/night-scene', worktree: 'dirty', keep: 'uncommitted changes in its worktree' },
  { id: 't7', title: 'Read the DeltaV export for tag names', project: 'Plant controls', provider: 'Codex', settled: 90, branch: 'main', worktree: 'shared' },
  { id: 't8', title: 'Speech model quota error copy', project: 'Sotto', provider: 'Grok', settled: 52, branch: 'fix/speech-model-quota-error', pr: 'open', keep: 'pull request #1402 is still open' },
  { id: 't9', title: 'Set up forge', project: 'Host setup', provider: 'Claude', settled: 120, branch: 'main', worktree: 'shared', host: 'forge' },
  { id: 't10', title: 'Review: Devin fixture deadline', project: 'Sotto', provider: 'Codex', settled: 4, branch: 'fix/devin-fixture-deadline', worktree: 'clean' },
  { id: 't11', title: 'Kotlin port of the protocol core', project: 'Sotto', provider: 'Claude', settled: 12, branch: 'feat/android-core', worktree: 'clean' },
  { id: 't12', title: 'Pull sheet for MCC-4', project: 'Plant controls', provider: 'Claude', settled: 200, branch: 'main', worktree: 'shared' },
]
const VARIANTS = {
  A: { name: 'On the Settled shelf', blurb: `<b>A · On the Settled shelf.</b> Clearing lives where finished work already goes. Hover a settled thread for <b>Delete</b> beside Restore. The Settled heading gets <b>Clear…</b>, which asks how old, shows what goes and what stays, and clears in one press.<ul><li>Open threads have no Delete: settle first, so Settle is the step you can take back and Clear is the one you can't.</li><li>A thread with uncommitted work or an open pull request is listed as kept and never cleared.</li></ul>` },
  B: { name: 'Select and delete', blurb: `<b>B · Select and delete.</b> T3 Code's way. <b>Select</b> at the top of the sidebar puts a box on every settled row. Shift-click picks a range, and <b>Older than 30 days</b> ticks those at once. A bar at the foot says how many and offers <b>Delete…</b>.<ul><li>More control over exactly which threads go; more presses for the common case.</li><li>The same keep rules: rows with uncommitted work or an open pull request can't be ticked.</li></ul>` },
  C: { name: 'Settings, with a clear-after rule', blurb: `<b>C · Settings → Threads, Clearing threads.</b> A section in Settings that can also clear on its own: <b>Clear settled threads after</b> Never / 30 / 90 / 180 days (Never by default), and <b>Clear now…</b> with the same dialog as A.<ul><li>Delete for one thread lives in the pane's <b>⋯</b> menu (open the Threads tab in this mock).</li><li>Set-and-forget, but a rule that deletes history quietly is a bigger promise; it only ever takes settled threads and never one the keep rules hold.</li></ul>` },
}
const params = new URLSearchParams(location.search)
let v = VARIANTS[params.get('v')] ? params.get('v') : 'A'
let mode = params.get('mode') === 'light' ? 'light' : 'dark'
let w = params.get('w') === '820' || (!params.get('w') && innerWidth < 700) ? 820 : 1280
let threads, current, ui
function reset() { threads = SEED.map(t => ({ ...t })); current = 't1'; ui = { dialog: null, menu: null, toast: null, selecting: false, picked: new Set(), tab: 'settings', rule: 'never', age: 30, log: [] } }
reset()

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const ago = d => d === 0 ? 'today' : d === 1 ? 'yesterday' : d < 60 ? `${d} days ago` : `${Math.round(d / 30)} months ago`
const settled = () => threads.filter(t => t.settled !== null)
const candidates = age => settled().filter(t => age === 'all' || t.settled >= age)
function worktreeNote(list) {
  const own = list.filter(t => t.worktree === 'clean').length
  if (!own) return 'No worktree folder to remove. Branches and their commits stay.'
  return list.length === 1 ? 'Removes the worktree folder it made. Its branch and commits stay.' : `Removes ${own === 1 ? 'the one worktree folder' : `the ${own} worktree folders`} these threads made. Branches and their commits stay.`
}
function removeThreads(ids, how) {
  const gone = threads.filter(t => ids.includes(t.id))
  threads = threads.filter(t => !ids.includes(t.id))
  if (ids.includes(current)) current = threads[0]?.id
  ui.log.unshift(`${how}: ${gone.map(t => '“' + t.title + '”').join(', ')}`)
  ui.toast = gone.length === 1 ? `Deleted “${gone[0].title}”.` : `Cleared ${gone.length} settled threads.`
  clearTimeout(ui.toastTimer); ui.toastTimer = setTimeout(() => { ui.toast = null; draw() }, 4000)
}

/* ---------- pieces ---------- */
function row(t, opts = {}) {
  const meta = t.settled === null ? `${t.provider} · ${t.branch}` : `Settled ${ago(t.settled)}${t.host ? ' · on ' + t.host : ''}`
  const keep = t.keep && t.settled !== null ? ` · <span class="keep">${t.pr === 'open' ? 'open PR' : 'uncommitted work'}</span>` : ''
  const box = opts.select && t.settled !== null
    ? `<input type="checkbox" class="chk" aria-label="Select ${esc(t.title)}" data-pick="${t.id}" ${ui.picked.has(t.id) ? 'checked' : ''} ${t.keep ? 'disabled title="' + esc('Kept: ' + t.keep) + '"' : ''}>` : ''
  let acts = ''
  if (!opts.select) {
    if (t.settled === null) acts = `<button class="ib" aria-label="Settle ${esc(t.title)}" title="Settle thread" data-settle="${t.id}">${ICON.settle}</button>`
    else {
      acts = `<button class="ib" aria-label="Restore ${esc(t.title)}" title="Restore thread" data-restore="${t.id}">${ICON.restore}</button>`
      if (opts.rowDelete) acts += `<button class="ib del" aria-label="Delete ${esc(t.title)}" title="Delete thread" data-del="${t.id}">${ICON.trash}</button>`
    }
  }
  return `<div class="row ${ui.picked.has(t.id) && opts.select ? 'sel' : ''}" aria-current="${t.id === current}" data-open="${t.id}" tabindex="0">${box}<div class="main"><div class="title">${esc(t.title)}</div><div class="meta">${meta}${keep}</div></div>${acts ? `<span class="acts">${acts}</span>` : ''}</div>`
}
function groups(list, opts) {
  const byProject = {}
  for (const t of list) (byProject[t.project] ||= []).push(t)
  return Object.entries(byProject).map(([p, ts]) => `<div class="fold">${ICON.folder}${esc(p)}</div>${ts.map(t => row(t, opts)).join('')}`).join('')
}
function sidebar(opts = {}) {
  const open = threads.filter(t => t.settled === null)
  const shelf = settled().sort((a, b) => a.settled - b.settled)
  const selTop = v === 'B' ? `<button class="tb" aria-pressed="${ui.selecting}" data-act="select">${ui.selecting ? 'Done' : 'Select'}</button>` : ''
  const clearBtn = v === 'A' && shelf.length ? `<button class="tb" data-act="clear">Clear…</button>` : ''
  const olderBtn = v === 'B' && ui.selecting ? `<button class="tb" data-act="older">Older than 30 days</button>` : ''
  let foot = ''
  if (v === 'B' && ui.selecting) foot = `<div class="selbar"><span class="c">${ui.picked.size} selected</span><button class="btn" data-act="select">Cancel</button><button class="btn danger" data-act="delpicked" ${ui.picked.size ? '' : 'disabled'}>Delete…</button></div>`
  return `<aside class="side"><div class="side-top"><span class="t">Threads</span>${selTop}<button class="ib" aria-label="New thread" title="New thread">${ICON.plus}</button></div>
    <div class="side-body">
      <div class="sec">Unsettled <span class="n">${open.length}</span></div>${groups(open, opts)}
      <div class="sec">Settled <span class="n">${shelf.length}</span>${clearBtn}${olderBtn}</div>${shelf.length ? groups(shelf, { ...opts, select: v === 'B' && ui.selecting }) : '<div class="note" style="padding:4px 10px">Nothing settled.</div>'}
    </div>${foot}</aside>`
}
function pane() {
  const t = threads.find(x => x.id === current)
  if (!t) return `<section class="pane"><div class="pane-body"><p class="note">No thread open.</p></div></section>`
  const menuBtn = `<button class="ib" aria-label="Thread options" data-act="menu">${ICON.dots}</button>`
  return `<section class="pane" style="position:relative"><div class="pane-head"><h2>${esc(t.title)}</h2><span class="note">${t.provider} · ${esc(t.branch)}</span>${menuBtn}</div>
    <div class="pane-body"><div class="msg u">Can you take a look at ${esc(t.title.toLowerCase())}?</div><div class="msg">Done. I changed what was needed and ran the tests; they pass. The branch is pushed.</div>
    ${t.settled !== null ? `<p class="note">Settled ${ago(t.settled)}. Its history is still here until you clear it.</p>` : ''}</div>
    ${ui.menu ? paneMenu(t) : ''}</section>`
}
function paneMenu(t) {
  const shelf = t.settled === null ? `<button data-settle="${t.id}">${ICON.settle}Settle</button>` : `<button data-restore="${t.id}">${ICON.restore}Restore</button>`
  const del = t.settled === null ? '' : `<hr><button class="danger" data-del="${t.id}">${ICON.trash}Delete thread…</button>`
  return `<div class="menu" style="right:12px;top:40px"><button>${ICON.pencil}Rename</button>${shelf}${del}</div>`
}
function settingsPage() {
  const sel = (id, val, opts) => `<select class="sel-in" data-set="${id}" aria-label="${id}">${opts.map(([k, l]) => `<option value="${k}" ${k === val ? 'selected' : ''}>${l}</option>`).join('')}</select>`
  const n = candidates(ui.age).filter(t => !t.keep).length
  return `<nav class="set-nav"><div>Dictation</div><div>Cleanup</div><hr><div aria-current="true">Threads</div><div>Git &amp; worktrees</div><div>Watcher</div><hr><div>Providers</div><div>Hosts &amp; phones</div><div>Cloud iPhone</div><hr><div>Appearance</div><div>Application</div></nav>
  <main class="set-main"><h2>Threads</h2><p class="note" style="margin:0">How threads start, and what happens to them when they're done.</p>
  <h3>Clearing threads</h3><div class="card">
   <div class="srow"><div class="l"><b>Clear settled threads after</b><span>Deletes a settled thread's history once it has sat this long. Never clears a thread with uncommitted work or an open pull request. Checked every hour.</span></div>${sel('rule', ui.rule, [['never', 'Never'], ['30', '30 days'], ['90', '90 days'], ['180', '180 days']])}</div>
   <div class="srow"><div class="l"><b>Clear now</b><span>Settled threads older than ${sel('age', String(ui.age), [['7', '7 days'], ['30', '30 days'], ['90', '90 days'], ['all', 'any age']])}: ${n} can go.</span></div><button class="btn" data-act="clear" ${n ? '' : 'disabled'}>Clear now…</button></div>
  </div>
  <h3>When a thread is settled</h3><div class="card"><div class="srow"><div class="l"><b>Auto-settle merged threads</b><span>Settle a thread at rest once its pull request merges.</span></div><span class="note">Off</span></div></div>
  </main>`
}
function clearDialog() {
  const age = ui.age
  const list = candidates(age)
  const go = list.filter(t => !t.keep), kept = list.filter(t => t.keep)
  const ageBtns = [[7, '7 days'], [30, '30 days'], [90, '90 days'], ['all', 'Any age']].map(([k, l]) => `<button aria-pressed="${age === k}" data-age="${k}">${l}</button>`).join('')
  return `<div class="scrim" data-act="close"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgt" onclick="event.stopPropagation()">
   <h3 id="dlgt">Clear settled threads</h3><p>Settled longer than</p><div class="age">${ageBtns}</div>
   ${go.length ? `<div class="lbl">${go.length} ${go.length === 1 ? 'thread goes' : 'threads go'}</div><div class="lst">${go.map(t => `<div><span>${esc(t.title)}</span><span>${ago(t.settled)}</span></div>`).join('')}</div>` : '<p>No settled thread is that old.</p>'}
   ${kept.length ? `<div class="lbl">Kept</div><div class="lst">${kept.map(t => `<div><span>${esc(t.title)}</span><span>${esc(t.keep)}</span></div>`).join('')}</div>` : ''}
   <ul><li>Their messages and activity leave Sotto and can't be brought back.</li><li>${worktreeNote(go)}</li><li>Usage numbers stay. Codex and Claude keep their own copies of the sessions.</li></ul>
   <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn danger" data-act="doclear" ${go.length ? '' : 'disabled'}>Clear ${go.length || ''} ${go.length === 1 ? 'thread' : 'threads'}</button></div></div></div>`
}
function deleteDialog(ids) {
  const list = threads.filter(t => ids.includes(t.id))
  const one = list.length === 1 ? list[0] : null
  const title = one ? `Delete “${esc(one.title)}”?` : `Delete ${list.length} threads?`
  const kept = one?.keep ? `<p style="color:var(--warn)">This thread has ${esc(one.keep)}. Restore it to finish that first; Delete waits until it's resolved.</p>` : ''
  return `<div class="scrim" data-act="close"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgt" onclick="event.stopPropagation()">
   <h3 id="dlgt">${title}</h3>${kept}
   ${!one ? `<div class="lst">${list.map(t => `<div><span>${esc(t.title)}</span><span>${ago(t.settled)}</span></div>`).join('')}</div>` : ''}
   <ul><li>${one ? 'Its messages and activity leave' : 'Their messages and activity leave'} Sotto and can't be brought back.</li><li>${worktreeNote(list)}</li><li>Usage numbers stay. ${one ? esc(one.provider) + ' keeps its own copy of the session.' : 'Providers keep their own copies of the sessions.'}</li></ul>
   <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn danger" data-act="dodel" data-ids="${ids.join(',')}" ${one?.keep ? 'disabled' : ''}>Delete</button></div></div></div>`
}

/* ---------- draw ---------- */
const H = 760
function draw() {
  document.getElementById('intro').innerHTML = VARIANTS[v].blurb
  document.getElementById('vlabel').innerHTML = `${v} — ${VARIANTS[v].name}<small>← → to switch</small>`
  for (const [id, list, cur, key] of [['vbtns', Object.keys(VARIANTS), v, 'v'], ['mbtns', ['dark', 'light'], mode, 'mode'], ['wbtns', ['1280', '820'], String(w), 'w']]) {
    const box = document.getElementById(id)
    box.innerHTML = box.firstElementChild.outerHTML + list.map(x => `<button aria-pressed="${x === cur}" data-${key}="${x}">${x === 'A' || x === 'B' || x === 'C' ? x + ' · ' + VARIANTS[x].name : x === '1280' ? '1280×800' : x === '820' ? '820×560 minimum' : x}</button>`).join('')
  }
  const sw = w === 820 ? 230 : 280
  const height = w === 820 ? 560 : 800
  let room
  if (v === 'C' && ui.tab === 'settings') room = settingsPage()
  else room = sidebar({ rowDelete: v === 'A' }) + pane()
  const dlg = ui.dialog?.kind === 'clear' ? clearDialog() : ui.dialog?.kind === 'delete' ? deleteDialog(ui.dialog.ids) : ''
  const strip = `<div class="strip"><b>Sotto</b><span ${v === 'C' && ui.tab === 'settings' ? '' : 'style="color:var(--text)"'} data-tab="threads">Threads</span><span>Dictate</span>${v === 'C' ? `<span data-tab="settings" ${ui.tab === 'settings' ? 'style="color:var(--text)"' : ''}>Settings</span>` : '<span>Settings</span>'}<span class="sp"><span>—</span><span>☐</span><span>✕</span></span></div>`
  const frame = document.getElementById('frame')
  frame.innerHTML = `<div class="win" data-mode="${mode}" style="--sw:${sw}px;width:${w}px;height:${height}px">${strip}<div class="room">${room}</div>${dlg}${ui.toast ? `<div class="toast" role="status">${esc(ui.toast)}</div>` : ''}</div>`
  // On a phone the window keeps a readable size and scrolls sideways rather than shrinking to a thumbnail.
  const scale = Math.max(innerWidth < 700 ? 0.62 : 0, Math.min(1, frame.clientWidth / w))
  const win = frame.firstElementChild
  win.style.transform = `scale(${scale})`
  win.style.marginRight = `${w * scale - w}px`; win.style.marginBottom = `${height * scale - height}px`
  frame.style.height = height * scale + 'px'
  document.getElementById('log').innerHTML = ui.log.length ? '<b>What happened</b><br>' + ui.log.map(esc).join('<br>') : ''
  history.replaceState(null, '', `?v=${v}&mode=${mode}&w=${w}`)
  if (dlg) frame.querySelector('.dlg .btn.danger:not([disabled]), .dlg .btn')?.focus()
}
addEventListener('resize', draw)

document.addEventListener('click', e => {
  const el = e.target.closest('button,[data-open],[data-tab],.scrim')
  if (!el) { if (ui.menu) { ui.menu = null; draw() } return }
  const d = el.dataset
  if (d.v) { v = d.v; ui.dialog = null; ui.menu = null; ui.selecting = false; ui.picked.clear() }
  else if (d.mode) mode = d.mode
  else if (d.w) w = Number(d.w)
  else if (el.id === 'reset') reset()
  else if (el.id === 'prev' || el.id === 'next') { const k = Object.keys(VARIANTS); v = k[(k.indexOf(v) + (el.id === 'next' ? 1 : k.length - 1)) % k.length]; ui.dialog = null; ui.selecting = false; ui.picked.clear() }
  else if (d.tab) ui.tab = d.tab
  else if (d.settle) { threads.find(t => t.id === d.settle).settled = 0; ui.menu = null }
  else if (d.restore) { threads.find(t => t.id === d.restore).settled = null; ui.menu = null }
  else if (d.del) { ui.dialog = { kind: 'delete', ids: [d.del] }; ui.menu = null }
  else if (d.age) ui.age = d.age === 'all' ? 'all' : Number(d.age)
  else if (d.act === 'menu') ui.menu = !ui.menu
  else if (d.act === 'clear') ui.dialog = { kind: 'clear' }
  else if (d.act === 'close') { if (e.target === el || el.tagName === 'BUTTON') ui.dialog = null }
  else if (d.act === 'doclear') { removeThreads(candidates(ui.age).filter(t => !t.keep).map(t => t.id), `Cleared settled older than ${ui.age === 'all' ? 'any age' : ui.age + ' days'}`); ui.dialog = null }
  else if (d.act === 'dodel') { removeThreads(d.ids.split(','), 'Deleted'); ui.dialog = null; ui.picked.clear(); ui.selecting = false }
  else if (d.act === 'select') { ui.selecting = !ui.selecting; ui.picked.clear() }
  else if (d.act === 'older') { for (const t of candidates(30)) if (!t.keep) ui.picked.add(t.id) }
  else if (d.act === 'delpicked') ui.dialog = { kind: 'delete', ids: [...ui.picked] }
  else if (d.open && !e.target.closest('button,input')) { current = d.open; ui.menu = null }
  else return
  draw()
})
let lastPick = null
document.addEventListener('change', e => {
  const t = e.target
  if (t.dataset.pick) {
    const shelf = [...document.querySelectorAll('[data-pick]:not([disabled])')].map(x => x.dataset.pick)
    if (e.shiftKey || window.event?.shiftKey) {}
    const want = t.checked
    if (lastPick && t._shift) { const [a, b] = [shelf.indexOf(lastPick), shelf.indexOf(t.dataset.pick)].sort((x, y) => x - y); for (const id of shelf.slice(a, b + 1)) want ? ui.picked.add(id) : ui.picked.delete(id) }
    else want ? ui.picked.add(t.dataset.pick) : ui.picked.delete(t.dataset.pick)
    lastPick = t.dataset.pick; draw()
  } else if (t.dataset.set === 'rule') { ui.rule = t.value; ui.log.unshift(`Clear settled threads after: ${t.value === 'never' ? 'Never' : t.value + ' days'}`); draw() }
  else if (t.dataset.set === 'age') { ui.age = t.value === 'all' ? 'all' : Number(t.value); draw() }
})
document.addEventListener('mousedown', e => { if (e.target.dataset?.pick) e.target._shift = e.shiftKey })
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (ui.dialog || ui.menu) { ui.dialog = null; ui.menu = null; draw() } return }
  if (e.target.closest('input,select,textarea,[contenteditable]')) return
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') document.getElementById(e.key === 'ArrowRight' ? 'next' : 'prev').click()
})
draw()
</script>
</body>
</html>
