<!doctype html>
<!--
  PROTOTYPE - throwaway. Not shipped, not tested, not wired to anything. Issue #822, ADR-0061.

  Question: a thread can babysit its pull request. While it does, Sotto reads GitHub on the thread's host and sends
  the thread a wake-up when a check fails, the required checks pass, someone else comments or reviews, the branch
  starts to conflict, or the pull request merges or closes (which ends it). Zach's decisions in #821 are settled.
  What this file asks him to pick is the look:
    1. where Start and Stop sit on the Pull request surface
    2. how a babysitting thread looks in its sidebar row
    3. how it looks in its pane
    4. how a wake-up reads in the thread
    5. what the Settings switch is called and where it sits

  Three variants on ?variant=a|b|c, switched from the bar at the bottom (left and right arrow keys too, unless the
  focus is in a field). Each shows one option for every question and nothing a question does not offer:
   a  A quiet line.       1C a switch row, "Babysit pull request", in the Pull request surface's foot.
                          2B the row keeps its state, with a small pull request mark beside it.
                          3A a quiet line above the composer, "Babysitting #74 · since 2:02 pm · Stop".
                          4A a wake-up is a compact row in Sotto's voice that opens to the full message.
                          5B "Let agents babysit their pull requests" in Settings → Git.
   b  On the badge.       1A an icon button in the surface's header, shown pressed while babysitting.
                          2C the row reads "Done · Babysitting #74".
                          3B a ring and a small clock on the branch toolbar's pull request badge; Stop is on the surface.
                          4C a wake-up is a card in the merge checklist's style, a press for each line that has one.
                          5A "Let agents babysit pull requests" in Settings → Application.
   c  A state of its own. 1B a line docked above Merge with Stop; when off, Babysit pull request is in the ··· menu.
                          2A the row's state word becomes "Babysitting #74" where it would say Done.
                          3C a fourth pose of the creature above the composer, at rest, below every other pose.
                          4B a wake-up is a message on the user's side, labelled Sotto, showing the whole text.
                          5A as b.

  Step (the bar, or [ and ]) walks the story: before, started by the agent, started by you, a check failed, checks
  passed, a wake-up waiting in the queue, a review comment, conflict, merged. Then seven states that branch off
  "checks passed": closed without merging, ended after ten comment-only wake-ups, ended because GitHub could not be
  read, the Settings switch turned off, two pull requests at once, the creature outranking it, and a thread on another
  computer (no tool, so only you start it). The sidebar's other two threads babysit too, one "Just finished" and one
  "Needs your approval", so each sidebar option shows beside both.
  Stop and Babysit pull request work in every state; the Settings switch works and ends what agents started.
  Query: ?variant=a&step=passed&theme=light&settings=1&open=last&menu=1&bar=0 (bar=0 hides the bar for captures).
  Open the file in a browser; nothing to run, no network.
-->

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }

.i { flex: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.pmark { flex: none; display: block; fill: currentColor; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

:root { --side-w: 300px; --tools-w: 520px; }

@media (max-width: 1000px) { :root { --side-w: 0px; --tools-w: 452px; } .side { display: none !important; } }
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr) var(--tools-w); height: 100vh; }

/* ---------- Sidebar (threadSidebar.css) ---------- */
.side { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--tt-sidebar); border-right: 1px solid var(--tt-hairline); }

.seg button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 24px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--tt-text-muted); font-size: 12.5px; cursor: pointer; }

.ibtn { display: grid; place-items: center; flex: none; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 7px; background: transparent; color: var(--tt-text-muted); cursor: pointer; }
.ibtn:hover { background: var(--tt-hover); color: var(--tt-text); }
.ibtn[aria-pressed='true'] { background: var(--tt-selected); color: var(--tt-text); }
.search { position: relative; display: flex; flex: none; align-items: center; height: 32px; margin: 0 8px 8px; color: var(--tt-text-muted); }

.search input { width: 100%; height: 100%; padding: 0 10px 0 32px; border: 1px solid var(--tt-hairline); border-radius: 8px; background: var(--tt-field); color: var(--tt-text); font-size: 13px; }
.search input::placeholder { color: var(--tt-text-muted); }
.side__scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 4px 12px; scrollbar-width: thin; scrollbar-color: var(--tt-scrollbar) transparent; }
.folder { margin: 0 0 14px; }
.folder__toggle { display: flex; align-items: center; gap: 5px; width: 100%; min-height: 26px; padding: 0 8px 0 6px; border: 0; border-radius: 7px; background: transparent; color: var(--tt-text-2); font-size: 14px; font-weight: 500; text-align: left; cursor: pointer; }
.folder__toggle:hover { background: var(--tt-hover); }

/* The status as the real row draws it: margin-left auto, at most 70% of the line, cut short with an ellipsis. */
.row__status { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; max-width: 70%; margin-left: auto; min-width: 0; white-space: nowrap; }
.row__status > span:last-child { overflow: hidden; text-overflow: ellipsis; }
.row__status > i { display: none; flex: none; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.row__status[data-state='working'] { color: var(--tt-activity); }
.row__status[data-state='needs'] { color: var(--tt-warning-text); }
.row__status[data-state='unseen'] { color: var(--tt-text-2); }
.row__status:is([data-state='working'], [data-state='needs'], [data-state='unseen']) > i { display: block; }
.row__status[data-state='unseen'] > i { background: var(--tt-activity); }
.row__status[data-state='babysitting'] { color: var(--tt-text-2); }

.ring { width: 10px; height: 10px; justify-self: center; border: 1.5px solid var(--tt-hairline); border-radius: 50%; }
.ring[data-state='working'] { border: 0; background: conic-gradient(var(--tt-activity) 0 32%, color-mix(in srgb, var(--tt-activity) 22%, transparent) 32% 100%); mask: radial-gradient(circle, transparent 38%, currentcolor 42%); }
.ring[data-state='needs'] { border: 2px solid var(--tt-warning-text); }

.settled { display: flex; align-items: center; gap: 6px; width: calc(100% - 8px); min-height: 30px; margin: 8px 4px 2px; padding: 0 8px 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--tt-text-2); font-size: 12.5px; text-align: left; cursor: pointer; }

.act code { overflow: hidden; font-family: var(--tt-font-mono); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
.act strong { font-weight: 500; color: var(--tt-text); }
.act__by { margin-left: auto; color: var(--tt-text-muted); font-size: 12.5px; white-space: nowrap; }
.working { display: flex; align-items: center; gap: 8px; margin: -8px 0 22px; color: var(--tt-activity); font-size: 14px; }
.working > i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
/* Links in a message, as MessageContent draws them. A break may fall after a slash, not inside a word. */
.mlink { color: var(--tt-link); text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
.mlink:hover { color: var(--tt-text); }

/* The Sotto mark, small, for what Sotto says in a thread. */
.smark { flex: none; display: block; }
.smark rect:first-child { fill: var(--tt-accent); }
.smark rect + rect { fill: var(--tt-on-accent); stroke: none; }
.smark path { fill: none; stroke: var(--tt-on-accent); }

/* ---------- 4A: the compact wake-up row ---------- */
.wake { margin: 0 0 22px; }
.wake__row { display: grid; grid-template-columns: 18px auto minmax(0, 1fr) auto 14px; align-items: start; column-gap: 8px; width: 100%; min-height: 34px; padding: 6px 8px 6px 6px; border: 0; border-radius: 8px; background: transparent; color: var(--tt-text-2); font-size: 14px; line-height: 1.45; text-align: left; cursor: pointer; }
.wake__row > svg { margin-top: 1px; }
.wake__row:hover { background: var(--tt-hover); }
.wake__who { color: var(--tt-text); font-weight: 500; }
.wake__sum { min-width: 0; }
.wake__time { color: var(--tt-text-muted); font-size: 12px; line-height: 20px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wake__row > .i:last-child { margin-top: 3px; color: var(--tt-text-muted); transition: rotate .16s; }
.wake__row[aria-expanded='true'] > .i:last-child { rotate: 90deg; }
.wake__body { margin: 4px 0 0 30px; padding: 10px 14px 12px; border: 1px solid var(--tt-hairline); border-radius: 10px; }
@container pane (max-width: 520px) { .wake__body { margin-left: 0; } }
.raw-caption { margin: 0 0 6px; color: var(--tt-text-muted); font-size: 12px; }
.raw { margin: 0; color: var(--tt-text-2); font: 13px/1.6 var(--tt-font-ui); white-space: pre-wrap; overflow-wrap: anywhere; }

/* ---------- 4C: the wake-up card, in the merge checklist's style ---------- */
.wcard { margin: 0 0 24px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-md); container: wcard / inline-size; }
.wcard__head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 9px 12px; color: var(--tt-text-muted); font-size: 12.5px; }
.wcard__head > svg { color: var(--tt-accent-text); }
.wcard__head strong { color: var(--tt-text); font-size: 13.5px; font-weight: 500; }
.wcard__head time { margin-left: auto; font-variant-numeric: tabular-nums; }
.wcard__lines { margin: 0; padding: 0; list-style: none; }
.wcard__line { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; column-gap: 10px; padding: 9px 12px; border-top: 1px solid var(--tt-hairline); }
.wcard__line > svg { color: var(--tt-text-muted); }
.wcard__line[data-tone='done'] > svg { color: var(--tt-success); }
.wcard__line[data-tone='failed'] > svg { color: var(--tt-error-text); }
.wcard__line[data-tone='open'] > svg { color: var(--tt-warning-text); }
.wcard__line[data-tone='merged'] > svg { color: var(--tt-activity); }
.wcard__line strong { display: block; color: var(--tt-text); font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
.wcard__line small { display: block; color: var(--tt-text-muted); font-size: 12.5px; }
.wcard__foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 4px 6px; border-top: 1px solid var(--tt-hairline); }
.wcard__raw-wrap { padding: 4px 12px 12px; }
.qbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 8px; border: 0; border-radius: 7px; background: transparent; color: var(--tt-text-muted); font-size: 13px; cursor: pointer; }
.qbtn:hover { background: var(--tt-hover); color: var(--tt-text); }
.qbtn > .i { transition: rotate .16s; }
.qbtn[aria-expanded='true'] > .i { rotate: 90deg; }
@container wcard (max-width: 420px) {
  .wcard__line { grid-template-columns: 18px minmax(0, 1fr); align-items: start; }
  .wcard__line > .tt-button { grid-column: 2; justify-self: start; margin-top: 6px; }
  .wcard__line > svg { margin-top: 2px; }
}

/* ---------- 4B: the wake-up as a message on the user's side, labelled Sotto ---------- */
.msg[data-role='sotto'] { margin-left: max(24px, 12%); padding: 12px 16px 14px; border: 1px solid var(--tt-accent-border); border-radius: 14px 14px 4px 14px; background: var(--tt-bubble); }
.msg[data-role='sotto'] .msg__who { color: var(--tt-text); }
.msg__tag { padding: 0 7px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-pill); color: var(--tt-text-2); font-size: 11.5px; line-height: 18px; }
.msg[data-role='sotto'] .raw { color: var(--tt-text); font-size: 13.5px; line-height: 1.55; }

/* ---------- Composer (threads.css, composer.css, branchToolbar.css) ---------- */
.compose { position: relative; display: flex; flex: none; flex-direction: column; padding: 8px max(24px, calc((100% - 760px) / 2)) 16px; }
@container pane (max-width: 520px) { .compose { padding-inline: 16px; } }
.prompt { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); padding: 14px 16px 10px; border: 1px solid var(--tt-field-border); border-radius: 16px; background: var(--tt-field); }
.prompt:focus-within { border-color: var(--tt-field-border-focus); }
.prompt textarea { grid-column: 1 / -1; display: block; width: 100%; min-height: 60px; padding: 0; border: 0; outline: 0; resize: none; background: transparent; color: var(--tt-text); font-size: 15px; line-height: 1.5; }
.prompt textarea::placeholder { color: var(--tt-text-muted); }
.prompt__clip { grid-column: 1; align-self: end; margin: 0 2px 1px -8px; }
.prompt__foot { grid-column: 2; display: flex; align-items: flex-end; gap: 8px; margin-top: 8px; }
.prompt__chips { display: flex; flex: 1; flex-wrap: wrap; gap: 6px; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--tt-field-border); border-radius: var(--tt-radius-pill); background: transparent; color: var(--tt-text-2); font-size: 13px; white-space: nowrap; cursor: pointer; }
.chip:hover { background: var(--tt-hover); color: var(--tt-text); }
.chip .pmark { color: var(--tt-provider-claude); }
:root[data-theme='light'] .chip .pmark { color: color-mix(in srgb, var(--tt-provider-claude) 50%, var(--tt-text)); }
.send { display: grid; flex: none; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%; background: var(--tt-accent); color: var(--tt-on-accent); cursor: pointer; }
.branch-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; margin: 8px 2px 0; color: var(--tt-text-muted); font-size: 12.5px; }
.branch-toolbar__end { display: inline-flex; align-items: center; gap: 6px; min-width: 0; margin-left: auto; }
.btb { position: relative; display: inline-flex; align-items: center; gap: 5px; min-width: 0; height: 30px; padding: 0 11px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-pill); background: transparent; color: var(--tt-text-2); white-space: nowrap; }
button.btb { cursor: pointer; }
button.btb:hover { border-color: var(--tt-text-faint); background: var(--tt-hover); color: var(--tt-text); }
.btb--static { padding-left: 9px; color: var(--tt-text-muted); }
.btb--static > svg { color: var(--tt-text-muted); }
.btb--branch { max-width: 220px; font-family: var(--tt-font-mono); font-size: 12px; }
.btb--branch > span { overflow: hidden; text-overflow: ellipsis; }
.btb--pr { gap: 4px; font-size: 12px; }
.btb--pr > svg:first-child { color: var(--tt-success); }
.btb--pr[data-state='merged'] > svg:first-child { color: var(--tt-accent-text); }
.btb--pr[data-state='closed'] > svg:first-child { color: var(--tt-text-muted); }
/* 3B: a ring on the badge while it is babysat, and a small clock in it, so it is not said by colour alone. */
.btb--pr[data-babysat] { border-color: var(--tt-accent); box-shadow: 0 0 0 1px var(--tt-accent); }
.btb--pr[data-babysat] > .btb__clock { color: var(--tt-accent-text); }

/* The follow-up queue (composer.css .thread-followups): it joins the prompt's top edge. */
.fq { --fq-surface: color-mix(in srgb, var(--tt-field) 70%, var(--tt-canvas)); margin: 0 12px -1px; padding: 0 6px 6px; border: 1px solid var(--tt-field-border); border-bottom: 0; border-radius: 14px 14px 0 0; background: var(--fq-surface); }
.fq__head { display: flex; align-items: center; min-height: 38px; padding-top: 2px; }
.fq__toggle { display: flex; flex: 1; align-items: center; gap: 6px; min-height: 32px; padding: 0 8px 0 6px; border: 0; border-radius: 8px; background: transparent; color: var(--tt-text-muted); font-size: 14px; text-align: left; cursor: pointer; }
.fq__toggle:hover { background: var(--tt-hover); color: var(--tt-text-2); }
.fq__count { margin-left: 4px; color: var(--tt-text-2); }
.fq__list { margin: 0; padding: 0; list-style: none; }
.fq__item { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 10px; min-height: 40px; padding: 4px 4px 4px 27px; border-radius: 10px; }
.fq__item + .fq__item { margin-top: 2px; }
.fq__item:hover, .fq__item:focus-within { background: var(--tt-hover); }
.fq__text { display: -webkit-box; margin: 0; overflow: hidden; color: var(--tt-text); font-size: 13px; line-height: 1.45; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; }
.fq__sotto { display: inline-flex; align-items: center; gap: 6px; margin-right: 6px; color: var(--tt-text); font-weight: 500; vertical-align: -3px; }
.fq__sotto > svg { color: var(--tt-accent-text); }
.fq__tools { display: inline-flex; }
.fq__tools .ibtn { width: 32px; height: 32px; }
@container pane (max-width: 520px) { .fq { margin-inline: 8px; } .fq__item { padding-left: 10px; } }

/* 3A: the quiet line above the composer, where the creature would stand. */
.babysit-line { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; min-height: 30px; margin: 0 6px 6px; color: var(--tt-text-muted); font-size: 13px; }
.babysit-line > svg { color: var(--tt-accent-text); }
.babysit-line strong { color: var(--tt-text-2); font-weight: 500; }
.linkbtn { min-height: 26px; padding: 0 4px; border: 0; border-radius: 6px; background: transparent; color: var(--tt-link); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.linkbtn:hover { background: var(--tt-hover); }

/* The creature above the composer (threadMonitor.css): what it stands for on top, the state word underneath.
   Monitoring is the real pose, in the activity colour. 3C's babysitting pose is the fourth: at rest, in the muted
   text colour, holding its pull request's sign, so it never reads as a watch the provider confirmed. */
.ornament { position: relative; height: 64px; margin-bottom: 4px; padding: 0 14px; display: grid; grid-template-columns: minmax(80px, 1fr) minmax(0, min(200px, 52%)); align-items: end; pointer-events: none; }
.ornament svg { display: block; width: 80px; height: 64px; }
.mon-color { fill: var(--tt-activity); }
.ornament[data-pose='babysitting'] .mon-color { fill: var(--tt-text-muted); }
.mon-ink { fill: var(--tt-canvas); }
.mon-shine { fill: var(--tt-text); }
.mon-handle { fill: var(--tt-border); }
.mon-sign { fill: var(--tt-accent-text); }
.mon-task { pointer-events: auto; min-width: 0; margin-bottom: -5px; padding: 8px 12px; border: 1px solid var(--tt-field-border); border-bottom: 0; border-radius: 8px 8px 0 0; background: var(--tt-surface); }
.mon-task b { display: block; overflow: hidden; color: var(--tt-text); font-size: 13px; font-weight: 400; line-height: 1.5; text-overflow: ellipsis; white-space: nowrap; }
.mon-task span { display: block; overflow: hidden; color: var(--tt-text-muted); font-size: 12px; line-height: 1.5; text-overflow: ellipsis; white-space: nowrap; }
.mon-task span .mon-since { display: inline; }
@container pane (max-width: 420px) { .mon-task span .mon-since { display: none; } }
@media (prefers-reduced-motion: no-preference) { .mon-eyes { animation: blink 5s steps(1) infinite; } }
@keyframes blink { 0%, 96% { opacity: 1; } 97%, 99% { opacity: 0; } }

/* ---------- Tools panel and the Pull request surface (toolsRail.css, pullRequestSurface.css) ---------- */
.tools { display: flex; min-width: 0; min-height: 0; border-left: 1px solid var(--tt-hairline); background: var(--tt-sidebar); color: var(--tt-text-2); }
.rail { display: flex; flex: none; flex-direction: column; align-items: center; gap: 8px; width: 58px; padding: 50px 0 8px; border-left: 1px solid var(--tt-hairline); }
.rail__tabs { display: flex; flex-direction: column; gap: 2px; }
.rail__tab { position: relative; display: grid; place-items: center; align-content: center; gap: 4px; width: 50px; height: 50px; padding: 0; border: 0; border-radius: 9px; background: transparent; color: var(--tt-text-muted); font-size: 12px; font-weight: 500; line-height: 1; cursor: pointer; }
.rail__tab:hover { background: var(--tt-hover); color: var(--tt-text); }
.rail__tab[aria-current='true'] { background: var(--tt-selected); color: var(--tt-text); }
.rail__tab[aria-current='true']::before { content: ''; position: absolute; top: 13px; right: 0; bottom: 13px; width: 0; border-radius: 2px; box-shadow: 3px 0 0 1px var(--tt-activity); }
.rail__foot { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 40px; margin-top: auto; padding-top: 8px; border-top: 1px solid var(--tt-hairline); }
.tools__main { display: flex; flex: 1; flex-direction: column; min-width: 0; min-height: 0; container: tools-body / inline-size; }
.chrome { position: relative; display: flex; flex: none; align-items: center; gap: 6px; min-width: 0; height: 44px; padding: 0 92px 0 16px; border-bottom: 1px solid var(--tt-hairline); font-size: 14px; }
.chrome__lead { display: flex; flex: 1; align-items: center; gap: 8px; min-width: 0; }
.chrome__lead > svg[data-state='open'] { color: var(--tt-success); }
.chrome__lead > svg[data-state='merged'] { color: var(--tt-activity); }
.chrome__lead > svg[data-state='closed'] { color: var(--tt-text-muted); }
.pr-name { flex: 0 1 auto; min-width: 0; margin: 0; overflow: hidden; color: var(--tt-text); font-size: 13.5px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.pr-name span { color: var(--tt-text-muted); font-variant-numeric: tabular-nums; }
.tag { flex: none; padding: 1px 8px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-pill); color: var(--tt-text-2); font-size: 12px; line-height: 18px; }
.chrome__actions { position: relative; display: flex; flex: none; align-items: center; gap: 2px; }
.cbtn { position: relative; display: grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 7px; background: transparent; color: var(--tt-text-muted); cursor: pointer; }
.cbtn:hover { background: var(--tt-hover); color: var(--tt-text); }
.cbtn[aria-expanded='true'] { background: var(--tt-selected); color: var(--tt-text); }
/* 1A: the header button, drawn pressed while babysitting. Its name says what a press does. */
.cbtn[data-on] { background: var(--tt-selected); color: var(--tt-accent-text); box-shadow: inset 0 0 0 1px var(--tt-selected-border); }
.menu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 40; display: grid; width: 250px; max-width: calc(100cqw - 24px); padding: 6px; border: 1px solid var(--tt-hairline); border-radius: 10px; background: var(--tt-surface-elevated); box-shadow: 0 16px 48px var(--tt-shadow-color); }
.menu button { display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 6px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--tt-text); font-size: 13px; text-align: left; cursor: pointer; }
.menu button > svg { color: var(--tt-text-muted); }
.menu button[data-tone='danger'] { color: var(--tt-error-text); }
.menu button:hover, .menu button:focus-visible { background: var(--tt-hover); outline: none; }
.menu button:focus-visible { box-shadow: inset 0 0 0 2px var(--tt-focus-ring); }
.menu hr { height: 1px; margin: 4px 2px; border: 0; background: var(--tt-hairline); }
.menu__pad { display: inline-block; width: 15px; flex: none; }

.pr-body { flex: 1; min-height: 0; overflow: auto; padding: 16px 16px 24px; scrollbar-width: thin; scrollbar-color: var(--tt-scrollbar) transparent; }
.pr-heading { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 10px; margin: 0 0 10px; color: var(--tt-text); font-size: 16px; font-weight: 550; }
.pr-heading small { color: var(--tt-text-muted); font-size: 13px; font-weight: 400; }
.pr-heading small[data-tone='done'] { color: var(--tt-success); }
.pr-lines { margin: 0; padding: 0; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-md); list-style: none; }
.pr-line { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; column-gap: 10px; padding: 10px 12px; border-top: 1px solid var(--tt-hairline); }
.pr-line:first-child { border-top: 0; }
.pr-line > svg { color: var(--tt-text-muted); }
.pr-line[data-tone='done'] > svg { color: var(--tt-success); }
.pr-line[data-tone='failed'] > svg { color: var(--tt-error-text); }
.pr-line:is([data-tone='running'], [data-tone='todo'], [data-tone='open']) > svg { color: var(--tt-warning-text); }
.pr-line strong { display: block; color: var(--tt-text); font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
.pr-line[data-tone='done'] strong { color: var(--tt-text-2); font-weight: 400; }
.pr-why { display: block; color: var(--tt-text-muted); font-size: 12.5px; line-height: 1.4; overflow-wrap: anywhere; }
.tt-button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 30px; padding: 0 12px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-pill); background: transparent; color: var(--tt-text-2); font-size: 13px; font-weight: 500; line-height: 1.2; white-space: nowrap; cursor: pointer; }
.tt-button:hover:not(:disabled) { border-color: var(--tt-text-faint); color: var(--tt-text); }
.tt-button--primary { border-color: var(--tt-pill); background: var(--tt-pill); color: var(--tt-pill-ink); font-weight: 600; }
.tt-button--primary:hover:not(:disabled) { border-color: var(--tt-pill); color: var(--tt-pill-ink); filter: brightness(1.12); }
.tt-button--primary[aria-disabled='true'] { border-color: var(--tt-field-border); background: var(--tt-secondary); color: var(--tt-text-muted); cursor: not-allowed; filter: none; }
.pr-dock { position: sticky; bottom: -24px; z-index: 2; margin: 0 -16px; padding: 14px 16px 12px; background: var(--tt-sidebar); }
.pr-merge { display: flex; gap: 8px; }
.pr-merge .tt-button { min-height: 44px; font-size: 15px; }
.pr-merge__go { flex: 1; min-width: 0; }
.pr-hint { margin: 8px 0 0; color: var(--tt-text-muted); font-size: 13px; line-height: 1.5; }
.pr-finished { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-md); }
.pr-finished > svg { color: var(--tt-activity); }
.pr-finished[data-state='closed'] > svg { color: var(--tt-text-muted); }
.pr-finished > div { flex: 1; min-width: 0; }
.pr-finished strong { display: block; color: var(--tt-text); font-weight: 500; }
.pr-finished span { color: var(--tt-text-muted); font-size: 13px; }
.pr-fold { border-top: 1px solid var(--tt-hairline); }
.pr-dock + .pr-fold { margin-top: 6px; }
.pr-fold__head { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px; padding: 0; border: 0; background: transparent; color: var(--tt-text); font-size: 13.5px; font-weight: 500; text-align: left; cursor: pointer; }
.pr-fold__head > svg { color: var(--tt-text-muted); transition: rotate .16s; }
.pr-fold__head[aria-expanded='true'] > svg { rotate: 90deg; }
.pr-fold__head span { color: var(--tt-text-muted); font-weight: 400; }
.pr-linked { margin: 0 0 10px; padding: 0; list-style: none; }
.pr-linked li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-height: 36px; padding: 4px 0 4px 24px; font-size: 13.5px; }
.pr-linked li > svg { color: var(--tt-success); }
.pr-linked b { min-width: 0; flex: 1 1 150px; color: var(--tt-text); font-weight: 500; }
.pr-linked b span { color: var(--tt-text-muted); font-weight: 400; }
.pr-linked em { color: var(--tt-text-2); font-size: 12.5px; font-style: normal; }
/* 1B: the line docked under the checklist, above Merge. */
.pr-babysat { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 0 12px; padding: 8px 8px 8px 12px; border: 1px solid var(--tt-accent-border); border-radius: var(--tt-radius-md); background: var(--tt-accent-wash); }
.pr-babysat > svg { color: var(--tt-accent-text); }
.pr-babysat__text { flex: 1 1 160px; min-width: 0; }
.pr-babysat__text strong { display: block; color: var(--tt-text); font-size: 13.5px; font-weight: 500; }
.pr-babysat__text small { display: block; color: var(--tt-text-muted); font-size: 12.5px; }
.pr-babysat[data-ended] { border-color: var(--tt-hairline); background: transparent; }
.pr-babysat[data-ended] > svg { color: var(--tt-text-muted); }
.pr-babysat--after { margin: 12px 0 0; }
/* 1C: a switch row in the surface's foot, with who started it and since when underneath. */
.pr-foot-switch { display: grid; grid-template-columns: minmax(0, 1fr) 36px; align-items: center; gap: 2px 16px; width: 100%; flex: none; padding: 10px 16px; border: 0; border-top: 1px solid var(--tt-hairline); background: transparent; color: var(--tt-text); text-align: left; cursor: pointer; }
.pr-foot-switch[aria-disabled='true'] { cursor: default; }
.pr-foot-switch strong { display: block; font-size: 13.5px; font-weight: 500; }
.pr-foot-switch small { display: block; color: var(--tt-text-muted); font-size: 12.5px; line-height: 1.4; }
.pr-foot-switch:hover:not([aria-disabled='true']) { background: var(--tt-hover); }
.tools__foot { display: flex; flex: none; align-items: center; gap: 8px; min-width: 0; min-height: 32px; padding: 0 6px 0 14px; border-top: 1px solid var(--tt-hairline); color: var(--tt-text-muted); font-size: 12px; white-space: nowrap; }
.tools__copy { display: flex; flex: 0 1 auto; align-items: center; gap: 6px; min-width: 0; color: var(--tt-text-2); }
.tools__copy b { flex: none; font-weight: 500; }
.tools__copy code { min-width: 0; overflow: hidden; font-family: var(--tt-font-mono); text-overflow: ellipsis; }
.tools__copy .muted { color: var(--tt-text-muted); overflow: hidden; text-overflow: ellipsis; }
.tools__foot-actions { display: flex; margin-left: auto; }
@container tools-body (max-width: 479px) {
  .pr-line { grid-template-columns: 18px minmax(0, 1fr); align-items: start; }
  .pr-line > svg { margin-top: 1px; }
  .pr-line .tt-button { grid-column: 2; justify-self: start; margin-top: 8px; }
}
@container tools-body (max-width: 439px) { .pr-body { padding-inline: 12px; } .pr-dock { margin-inline: -12px; padding-inline: 12px; } .tools__copy .muted { display: none; } }

/* The switch (global.css .tt-toggle): checked is the text colour with a canvas thumb. Settings draws it in the accent. */
.track { position: relative; display: block; width: 36px; height: 20px; border: 1px solid var(--tt-border); border-radius: var(--tt-radius-pill); background: var(--tt-surface-sunken); }
.track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--tt-text-muted); transition: transform .12s; }
[aria-checked='true'] > .track { border-color: var(--tt-text); background: var(--tt-text); }
[aria-checked='true'] > .track::after { background: var(--tt-canvas); transform: translateX(16px); }
[aria-disabled='true'] > .track { opacity: .5; }

/* The window's own controls (Windows): drawn by the system over the top right, not in the page's tab order. */
.winctl { position: fixed; top: 0; right: 0; z-index: 30; display: flex; height: 44px; color: var(--tt-text-2); pointer-events: none; }
.winctl span { display: grid; place-items: center; width: 46px; }

/* ---------- Settings (crossing-settings.css, gitSettings.css): open rows under a page heading ---------- */
.settings { display: none; grid-template-columns: 300px minmax(0, 1fr); height: 100vh; }
body[data-settings] .settings { display: grid; }
@media (max-width: 1000px) { .settings { grid-template-columns: 180px minmax(0, 1fr); } }
.settings__nav { display: flex; flex-direction: column; min-height: 0; padding: 0 12px; background: var(--tt-sidebar); border-right: 1px solid var(--tt-hairline); }
.settings__nav .side__top { padding-left: 6px; }
.settings__nav h1 { margin: 10px 8px 18px; color: var(--tt-text); font-size: 24px; font-weight: 600; line-height: 1.2; letter-spacing: -.7px; }
.snav { display: flex; flex: 1 1 auto; flex-direction: column; gap: 4px; min-height: 0; margin: 0; padding: 0 0 12px; list-style: none; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--tt-scrollbar) transparent; }
.snav li[data-gap] { position: relative; margin-top: 32px; }
.snav li[data-gap]::before { content: ''; position: absolute; top: -18px; left: 12px; right: 12px; height: 1px; background: var(--tt-hairline); }
.snav button { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 42px; padding: 10px 12px; border: 0; border-radius: 8px; background: transparent; color: var(--tt-text-muted); font-size: 14px; line-height: 1.35; text-align: left; cursor: pointer; }
.snav button:hover { background: var(--tt-hover); color: var(--tt-text); }
.snav button[aria-current='page'] { background: var(--tt-selected); color: var(--tt-text); }
.snav button[aria-current='page'] > svg { color: var(--tt-accent); }
.settings__nav .side__foot { margin: 0 -12px; }
.settings__main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.settings__scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 42px 6vw 40px; scrollbar-width: thin; scrollbar-color: var(--tt-scrollbar) transparent; }
@media (max-width: 1000px) { .settings__scroll { padding: 42px 24px 32px; } }
.settings__inner { max-width: 790px; margin: 0 auto; }
.s-head { margin: 0 0 10px; padding: 0 0 20px; border-bottom: 1px solid var(--tt-hairline); }
.s-head h2 { margin: 0 0 10px; color: var(--tt-text); font-size: 28px; font-weight: 600; line-height: 1.2; letter-spacing: -1px; }
.s-head p { margin: 0; color: var(--tt-text-muted); font-size: 16px; line-height: 1.5; }
.s-group { margin-top: 26px; }
.s-group:first-of-type { margin-top: 22px; }
.s-group > h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; color: var(--tt-text-2); font-size: 14px; font-weight: 600; line-height: 1.35; }
.s-group > h3 > svg { color: var(--tt-text-muted); }
.s-group > .s-rows { border-top: 1px solid var(--tt-hairline); }
.s-note { margin: 0 0 8px; color: var(--tt-text-muted); font-size: 13px; line-height: 1.45; }
.s-rows > * { min-height: 66px; padding: 17px 0; border-bottom: 1px solid var(--tt-hairline); }
.s-rows > :last-child { border-bottom: 0; }
.s-toggle { display: flex; align-items: center; justify-content: space-between; gap: 22px; width: 100%; border-top: 0; border-right: 0; border-left: 0; background: transparent; color: var(--tt-text); text-align: left; cursor: pointer; }
.s-rows > .s-toggle:last-child { border-bottom: 0; }
.s-toggle > span:first-child { flex: 1; min-width: 0; }
.s-label { display: block; color: var(--tt-text); font-size: 15px; font-weight: 500; line-height: 1.35; }
.s-desc { display: block; max-width: 340px; margin-top: 5px; color: var(--tt-text-muted); font-size: 13px; line-height: 1.45; }
.settings .track { flex: none; width: 46px; height: 26px; }
.settings .track::after { top: 4px; left: 4px; width: 16px; height: 16px; }
.settings [aria-checked='true'] > .track { border-color: var(--tt-accent); background: var(--tt-accent); }
.settings [aria-checked='true'] > .track::after { background: var(--tt-on-accent); transform: translateX(20px); }
.s-field { display: grid; grid-template-columns: minmax(0, 1fr) minmax(140px, 240px); align-items: center; gap: 5px 22px; }
.s-field select { width: 100%; min-height: 38px; padding: 0 12px; border: 1px solid var(--tt-hairline); border-radius: 8px; background: var(--tt-field); color: var(--tt-text); font-size: 14px; }
.s-segs { display: inline-flex; justify-self: end; padding: 3px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-pill); }
.s-segs button { min-height: 30px; padding: 0 10px; border: 0; border-radius: var(--tt-radius-pill); background: transparent; color: var(--tt-text-2); font-size: 14px; cursor: pointer; }
.s-segs button[aria-checked='true'] { background: var(--tt-accent); color: var(--tt-on-accent); }
.s-example { margin: 0 0 4px; padding: 16px 18px; border: 1px solid var(--tt-hairline); border-radius: 12px; }
.s-example small { display: block; color: var(--tt-text-muted); font-size: 12.5px; }
.s-example code { display: block; margin: 2px 0 8px; color: var(--tt-text); font: 500 14px/1.5 var(--tt-font-mono); overflow-wrap: anywhere; }
.s-save { flex: none; margin: 0; padding: 8px 18px 12px; color: var(--tt-text-muted); font-size: 12.5px; text-align: right; }
@media (max-width: 760px) { .s-field { grid-template-columns: minmax(0, 1fr); } .s-segs { justify-self: start; } }

/* ---------- The prototype's own bar: not part of the design ---------- */
.proto { position: fixed; left: 50%; bottom: 10px; z-index: 100; display: flex; flex-wrap: nowrap; justify-content: center; align-items: center; gap: 4px; max-width: calc(100vw - 16px); padding: 5px 6px; border: 2px dashed #fff; border-radius: 18px; background: #a3134f; color: #fff; font: 600 12.5px/1.2 system-ui, 'Segoe UI', sans-serif; box-shadow: 0 8px 30px rgb(0 0 0 / 50%); transform: translateX(-50%); }
.proto button { flex: none; min-height: 28px; padding: 0 9px; border: 0; border-radius: 999px; background: rgb(255 255 255 / 18%); color: #fff; font: inherit; cursor: pointer; white-space: nowrap; }
.proto button:hover { background: rgb(255 255 255 / 30%); }
.proto button:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
.proto output { min-width: 0; padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
#slabel { max-width: 250px; }
.proto__tag { flex: none; padding: 2px 7px; border-radius: 6px; background: #fff; color: #a3134f; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.proto__sep { flex: none; width: 1px; height: 18px; margin: 0 2px; background: rgb(255 255 255 / 45%); }
body[data-nobar] .proto { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

const STEPS = [

  ['user', 'Started by you', '2:04 pm'],

  ['conflict', 'Conflict', '3:43 pm'],
  ['merged', 'Merged', '4:06 pm'],

/* What babysitting is doing at this step, after any press of Stop, Babysit pull request or the Settings switch. */
function scene() {
  const [key, , now] = STEPS[state.step]
  const si = STORY.indexOf(key)
  const reached = k => (si >= 0 ? si : STORY.indexOf('passed')) >= STORY.indexOf(k)
  const remote = key === 'remote'
  const s = {
    key, now, remote, reached,
    by: key === 'user' || remote ? 'you' : 'Claude',
    at: key === 'user' || remote ? '2:04 pm' : '2:02 pm',
    on: key !== 'before', ended: null,
    working: ['failed', 'queued', 'review', 'conflict'].includes(key),
    merged: key === 'merged', closed: key === 'closed',
    two: key === 'two', monitor: key === 'monitor', queued: key === 'queued',
    toolStart: !['before', 'user', 'remote'].includes(key)
  }
  if (['merged', 'closed', 'chatty', 'unread'].includes(key)) { s.on = false; s.ended = key }
  if (!state.agentsSwitch && s.on && s.by === 'Claude') { s.on = false; s.ended = 'switch'; s.two = false }
  let prs = s.on ? (s.two ? ['#74', '#76'] : ['#74']) : []
  if (state.manual === 'offall' || (state.manual === 'off' && prs.includes('#74'))) {
    prs = state.manual === 'offall' ? [] : prs.filter(p => p !== '#74'); s.ended = 'stopped'
  }
  if (state.manual === 'on' && !prs.includes('#74') && !s.merged && !s.closed) { prs = ['#74', ...prs]; s.by = 'you'; s.at = now; s.ended = null; s.pressed = true }
  s.prs = prs
  s.on74 = prs.includes('#74')
  s.any = prs.length > 0

}

      ${tool ? `<div class="act">${ico('alarm')}<span><strong>Babysit pull request</strong> #74</span><span class="act__by">Sotto tool</span></div>` : ''}
    </div>
    <p class="msg__text">Added a greeting for reviewers in <code>src/greeting.ts</code> with a test, and opened #74 Greet the reviewer. CI is running.</p>
    ${tool ? '<p class="msg__text">I asked Sotto to babysit it, so a wake-up will come when the checks finish or someone reviews. Ending my turn here.</p>' : ''}</div>`)
  const wakeAndReply = key => {
    parts.push(wakeHtml(key, s))
    const r = REPLIES[key]
    const live = r.working && s.key === key
    parts.push(claudeMsg(r.at, live ? r.working : r.done))
    if (live) parts.push('<div class="working"><i></i>Working for 18s</div>')
  }
  if (s.reached('failed')) wakeAndReply('failed')
  if (s.reached('passed')) wakeAndReply('passed')
  if (s.key === 'two') parts.push(claudeMsg('2:36 pm', 'Opened #76 Mention the greeting in the README, stacked on #74, and asked Sotto to babysit it too.',
    `<div class="activity"><div class="act">${ico('term')}<code>gh pr create --base feat/greeting</code></div>${state.agentsSwitch ? `<div class="act">${ico('alarm')}<span><strong>Babysit pull request</strong> #76</span><span class="act__by">Sotto tool</span></div>` : ''}</div>`))
  if (s.key === 'monitor') parts.push(claudeMsg('2:36 pm', 'The preview deploy for #74 is building. I’m watching it and will say when it is live.',
    `<div class="activity"><div class="act">${ico('eye')}<span><strong>Monitor</strong> the preview deploy</span></div></div>`))
  if (['closed', 'chatty', 'unread'].includes(s.key)) wakeAndReply(s.key)
  if (s.reached('queued')) {
    parts.push(userMsg('3:05 pm', 'Also mention the greeting in the README.'))
    parts.push(claudeMsg('3:06 pm', s.key === 'queued' ? 'Adding a line to <code>README.md</code>.' : 'Added a line about the greeting to <code>README.md</code> and pushed.'))
    if (s.key === 'queued') parts.push('<div class="working"><i></i>Working for 41s</div>')
    else {
      parts.push(userMsg('3:08 pm', 'Then add a changelog entry.'))
      parts.push(claudeMsg('3:09 pm', 'Added an entry to <code>CHANGELOG.md</code>.'))
    }
  }
  if (s.reached('review')) wakeAndReply('review')
  if (s.reached('conflict')) wakeAndReply('conflict')
  if (s.reached('merged')) wakeAndReply('merged')
  return parts.join('')
}

/* The wake-ups this step's transcript holds, in order. */
function wakeKeys(s) {
  const k = []
  if (s.reached('failed')) k.push('failed')
  if (s.reached('passed')) k.push('passed')
  if (['closed', 'chatty', 'unread'].includes(s.key)) k.push(s.key)
  for (const n of ['review', 'conflict', 'merged']) if (s.reached(n)) k.push(n)
  return k
}

  const t = pane.querySelector('.transcript')
  if (keep !== null) { t.scrollTop = keep; return }
  // On arriving at a step: the newest wake-up's top in view when what follows it is taller than the transcript, else the end.
  const bottom = t.scrollHeight - t.clientHeight
  const wakes = t.querySelectorAll('[data-wake]')
  const last = wakes[wakes.length - 1]
  let after = 0
  for (let n = last?.nextElementSibling; n; n = n.nextElementSibling) after++
  t.scrollTop = last && after <= 2 ? Math.min(bottom, last.offsetTop - 14) : bottom

/* ---------------- Tools: the Pull request surface (pullRequestSurface.logic.ts's lines and words) ---------------- */
function prLines(s) {
  const k = s.key
  const L = []
  if (['before', 'agent', 'user'].includes(k)) L.push(['running', 'run', 'Checks passing', 'CI / Owned build and 1 more are still running'])
  else if (k === 'failed') L.push(['failed', 'fail', 'Checks passing', 'CI / Owned build failed', ['Open check', 'Open CI / Owned build on GitHub']])
  else L.push(['done', 'ok', 'Checks passing', 'All 3 passed'])
  if (k === 'queued' || k === 'review') L.push(['failed', 'fail', 'Review approved', 'mira asked for changes', ['Open review', 'Open mira’s review on GitHub']])
  else if (k === 'conflict') L.push(['todo', 'todo', 'Review approved', 'It still needs an approving review'])
  else if (k === 'merged') L.push(['done', 'ok', 'Review approved', 'Approved by mira'])
  else L.push(['todo', 'todo', 'Review approved', 'Nobody has reviewed it yet'])
  if (k === 'conflict') L.push(['todo', 'todo', 'Up to date with main', '2 commits behind main', ['Update branch']])
  else L.push(['done', 'ok', 'Up to date with main', k === 'merged' ? 'Merged into main' : 'Has every commit on main'])
  if (k === 'conflict') L.push(['failed', 'fail', 'No conflicts', 'Conflicts with main. Resolve them in the branch and push'])
  else if (k === 'closed') L.push(['unknown', 'unknown', 'No conflicts', 'GitHub checks again if it is reopened'])
  else L.push(['done', 'ok', 'No conflicts', k === 'merged' ? 'Merged without conflicts' : 'Merges cleanly into main'])
  L.push(['done', 'ok', 'Ready for review', 'Not a draft'])
  return L
}

    ? `<div class="s-head"><h2>Git</h2><p>Commits, pull requests, Changes &amp; fetching</p></div>
       ${group('commit', 'When a thread commits', `<div>${field('Commit and pull request style', 'The thread’s own model writes commit messages and pull request text the way each repository’s recent commits and AGENTS.md do.', select('Commit and pull request style', ['Repository conventions', 'Conventional Commits', 'Custom instructions']))}
           <div class="s-example" role="group" aria-label="Example" style="margin-top:18px"><small>Commit subject</small><code>Let a thread name itself from its first exchange</code><small>Pull request title</small><code>Let a thread name itself from its first exchange</code><small>An example. Each repository’s recent commits and AGENTS.md set the real style.</small></div></div>`)}
       ${group('pr', 'When a pull request is made or merged', `
           ${toggle('Follow pull request templates', true, 'When a Git action drafts a pull request, the thread’s own model follows the repository’s pull request template, if Sotto finds one.')}
           ${field('Default merge method', 'The merge in the pull request checklist starts on the method you used last, Merge the first time.', select('Default merge method', ['Last selected', 'Merge', 'Squash and merge', 'Rebase and merge']))}
           ${toggle('Auto-settle merged threads', false, 'A thread stays where it is after its pull request merges, until you settle it.')}
           ${row}`)}
       ${group('file', 'When you read Changes', `
           ${field('Diff layout', 'Changes starts with each diff stacked, removed lines above added ones.', segs('Diff layout', ['Stacked', 'Split'], 'Stacked'))}
           ${toggle('Hide whitespace changes', true, 'Changes starts with edits that only change spacing hidden.')}
           ${field('Default diff file state', 'Files in Changes start collapsed to their headers. Press one to read it.', segs('Default diff file state', ['Expanded', 'Collapsed'], 'Collapsed'))}
           ${toggle('Proactive panels', false, 'Changes opens only when you open it.')}`, 'These set where Changes starts. A choice made in Changes holds until one of these settings changes or Sotto restarts.')}
       ${group('refresh', 'In the background', `
           ${field('Git fetch interval', 'Sotto asks origin every 30 seconds whether a thread’s branch is ahead or behind, while this window is in front.', select('Git fetch interval', ['30 seconds', '1 minute', '5 minutes', 'Off']))}
           ${toggle('Automatically pull', false, 'Sotto shows when the default branch is behind and leaves the pull to you.')}`)}`
    : `<div class="s-head"><h2>Application</h2><p>Startup, privacy &amp; updates</p></div>
       <div class="s-rows">
         ${field('Reduced motion', 'Follow the system setting for animation.', select('Reduced motion', ['Follow system', 'Reduce motion']))}
         ${field('Web links in threads', 'Where a link in a thread opens when you click it. Right-click a link, or press Shift+F10, to choose for that link.', segs('Web links in threads', ['System browser', 'Sotto browser'], 'System browser'))}
         ${toggle('Show the browser when an agent opens a page', true, 'When an agent opens a page, its thread’s browser player opens over the thread, and the test iPhone does the same when an agent uses it. When off, both stay closed and Tools still shows the work.')}
         ${toggle('Let agents use the browser without asking', true, 'Agents can open pages, click and type in Sotto’s browser without asking first. They can see every page in their thread’s browser, including pages you open and sites you are signed in to there. Stop sharing one page, or stop it for one thread, in Tools &gt; Browser.')}
         ${toggle('Let agents draw visuals in threads', true, 'An agent can draw a diagram, or a small interactive page sealed from the network, in its thread to show how something works. Visuals are made on this computer and contact no one. When off, agents explain in text instead, and visuals already in threads stay.')}
         ${row}
         ${field('Replies in threads', 'Stream a reply word by word as the agent writes it, or show it once it is finished. Commands and tool calls always appear as they run.', segs('Replies in threads', ['As written', 'When finished'], 'As written'))}
         ${field('New threads work in', 'Project defaults can override this. Existing threads keep their working folder.', select('New threads work in', ['Project folder', 'New worktree']))}
         ${toggle('Remove a worktree when its thread is settled', true, 'Settle removes a clean worktree folder without asking. A folder with uncommitted changes still asks.')}
       </div>`
  const nav = (icon, label, current, gap) => `<li${gap ? ' data-gap' : ''}><button type="button"${current ? ' aria-current="page"' : ''}>${ico(icon)}${label}</button></li>`
  document.getElementById('settings').innerHTML = `
    <nav class="settings__nav" aria-label="Settings sections">
      <div class="side__top drag"><span class="brand" aria-label="Sotto application">${smark(18)}<span>Sotto</span></span></div>
      <h1>Settings</h1>
      <ul class="snav">
        ${nav('mic', 'Dictation')}${nav('wave', 'Transcription')}${nav('spark', 'Cleanup')}
        ${nav('cmd', 'Providers', false, true)}${nav('server', 'Hosts')}${nav('users', 'Agents')}${nav('arrow', 'Output')}
        ${nav('palette', 'Appearance', false, true)}${nav('sliders', 'Application', v !== 'a')}${nav('branch', 'Git', v === 'a')}
      </ul>
      ${sideFoot()}
    </nav>
    <main class="settings__main"><div class="settings__scroll" id="smain"><div class="settings__inner">${page}</div></div><p class="s-save">Changes save as you make them.</p></main>`
}

/* ---------------- Glue ---------------- */
function render() {
  const keyed = document.activeElement?.dataset?.k
  const s = scene()
  if (state.light) document.documentElement.setAttribute('data-theme', 'light')
  else document.documentElement.removeAttribute('data-theme')
  document.body.toggleAttribute('data-settings', state.settings)
  document.body.toggleAttribute('data-nobar', !state.bar)
  if (state.openLast) { const ks = wakeKeys(s); if (ks.length) state.open.add(ks[ks.length - 1]); state.openLast = false }
  if (state.settings) {
    const scrolled = document.getElementById('smain')?.scrollTop
    renderSettings()
    const main = document.getElementById('smain')
    // Arriving: the least scroll that shows the new row whole, so as much of the page above it as fits stays in view.
    if (state.toScroll) { const r = document.getElementById('newrow'); main.scrollTop = Math.max(0, r.getBoundingClientRect().bottom - main.getBoundingClientRect().top - main.clientHeight + 48) }
    else if (scrolled !== undefined) main.scrollTop = scrolled
  } else { renderSide(s); renderPane(s); renderTools(s) }
  state.toScroll = false
  const vi = VARIANTS.findIndex(([k]) => k === state.variant)
  document.getElementById('vlabel').textContent = `${state.variant.toUpperCase()} — ${VARIANTS[vi][1]}`
  document.getElementById('slabel').textContent = `${state.step + 1}/${STEPS.length} ${STEPS[state.step][1]}`
  document.getElementById('slabel').title = STEPS[state.step][1]
  document.getElementById('sb').textContent = state.settings ? 'Close Settings' : 'Open Settings'
  document.getElementById('tb').textContent = state.light ? 'Dark theme' : 'Light theme'
  const q = new URLSearchParams({ variant: state.variant, step: STEPS[state.step][0] })
  if (state.light) q.set('theme', 'light')
  if (state.settings) q.set('settings', '1')
  if (!state.bar) q.set('bar', '0')
  history.replaceState(null, '', '?' + q)
  if (keyed) (document.querySelector(`[data-k="${keyed}"]`) ?? document.querySelector('[data-k="footswitch"], [data-k="hbtn"], [data-k="dockstop"], [data-k="menu"]'))?.focus()
}
function goVariant(d) { const i = VARIANTS.findIndex(([k]) => k === state.variant); state.variant = VARIANTS[(i + d + 3) % 3][0]; state.manual = null; state.menu = false; state.open.clear(); state.toScroll = true; render() }
function goStep(d) { state.step = (state.step + d + STEPS.length) % STEPS.length; state.manual = null; state.menu = false; state.agentsSwitch = STEPS[state.step][0] !== 'switchoff'; state.toScroll = true; render() }
document.getElementById('pv').onclick = () => goVariant(-1)
document.getElementById('nv').onclick = () => goVariant(1)
document.getElementById('ps').onclick = () => goStep(-1)
document.getElementById('ns').onclick = () => goStep(1)
document.getElementById('sb').onclick = () => { state.settings = !state.settings; state.toScroll = true; render() }
document.getElementById('tb').onclick = () => { state.light = !state.light; render() }
document.addEventListener('click', e => {
  if (e.target.closest('a[data-ext]')) { e.preventDefault(); return }
  const t = e.target.closest('[data-act], [data-toggle]')
  if (!t) { if (state.menu && !e.target.closest('.menu')) { state.menu = false; render() } return }
  const act = t.dataset.act
  if (t.dataset.toggle) { const k = t.dataset.toggle; state.open.has(k) ? state.open.delete(k) : state.open.add(k); render(); return }
  if (act === 'stop') { state.manual = 'off'; state.menu = false; render() }
  else if (act === 'stopall') { state.manual = 'offall'; state.menu = false; render() }
  else if (act === 'start') { state.manual = 'on'; state.menu = false; render(); if (t.dataset.k === 'menustart') document.querySelector('[data-k="dockstop"]')?.focus() }
  else if (act === 'menu') { state.menu = !state.menu; render(); if (state.menu) document.querySelector('.menu [role="menuitem"]')?.focus() }
  else if (act === 'linked') { state.linkedOpen = !state.linkedOpen; render() }
  else if (act === 'settings') { state.settings = true; state.toScroll = true; render(); document.querySelector('[data-k="agentswitch"]')?.focus() }
  else if (act === 'threads') { state.settings = false; state.toScroll = true; render() }
  else if (act === 'agentswitch') { state.agentsSwitch = !state.agentsSwitch; render() }
})
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.menu) { state.menu = false; render(); document.querySelector('[data-k="menu"]')?.focus(); return }
  if (state.menu && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    const items = [...document.querySelectorAll('.menu [role="menuitem"]')]
    const at = items.indexOf(document.activeElement)
    items[(at + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length]?.focus(); e.preventDefault(); return
  }
  if (e.target.closest('input, textarea, select, [contenteditable]')) return
  if (e.key === 'ArrowLeft') goVariant(-1)
  else if (e.key === 'ArrowRight') goVariant(1)
  else if (e.key === '[') goStep(-1)
  else if (e.key === ']') goStep(1)
})
render()
</script>
</body>
</html>
