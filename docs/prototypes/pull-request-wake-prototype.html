<!doctype html>
<!--
  PROTOTYPE - throwaway. Not shipped, not tested, not wired to anything. Issue #822, ADR-0061.

  Question: a thread can babysit its pull request. While it does, Sotto reads GitHub on the thread's host and sends
  the thread a wake-up when a check fails, the required checks pass, someone else comments or reviews, the branch
  starts to conflict, or the pull request merges or closes (which ends it). Zach's decisions in #821 are settled.
  What this file asks him to pick is the look:
    1. where Start and Stop sit on the Pull request surface
    2. how a babysitting thread looks in its sidebar row
    3. how it looks in its pane
    4. how a wake-up reads in the thread
    5. what the Settings switch is called and where it sits

  Three variants on ?variant=a|b|c, switched from the bar at the bottom (left and right arrow keys too, unless the
  focus is in a field). Each answers every question differently where the options allow:
   a  On the surface.     A switch row in the Pull request surface's foot (1C). The sidebar row keeps Done with a
                          small pull request mark (2B). A quiet line above the composer, "Babysitting #74 · Stop"
                          (3A). A wake-up is a compact row in Sotto's voice that opens to the full message (4A).
                          Settings → Git (5B).
   b  In the transcript.  An icon button in the surface's header, shown pressed while babysitting (1A). The row
                          reads "Done · Babysitting #74" (2C). A ring on the branch toolbar's pull request badge
                          (3B). Starting puts a live card in the transcript, and each wake-up is a card in the
                          merge checklist's style with a press per link (4C). Settings → Application (5A).
   c  A state of its own. A line docked under the checklist above Merge, Babysit pull request in the ··· menu when
                          off (1B). The row's state word is Babysitting (2A). A fourth creature pose above the
                          composer, and the state in the pane header (3C). A wake-up is a message on the user's
                          side, labelled Sotto, showing the whole text (4B). Settings → Application (5A).

  Step (the bar, or [ and ]) walks: before, started by the agent, started by you, a check failed, checks passed,
  a review comment, conflict, merged. From "a check failed" on, the story continues from the agent's start.
  Stop and Babysit pull request work in every state. "Open Settings" opens the variant's Settings page.
  Query: ?variant=a&step=passed&theme=light&settings=1&open=last&bar=0 (bar=0 hides the bar for captures).
  Open the file in a browser; nothing to run, no network.
-->

* { box-sizing: border-box; }

/* ---------- Sidebar (threadSidebar.css) ---------- */

/* ---------- 4A: the compact wake-up row ---------- */
.wake { margin: 0 0 22px; }
.wake__row { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 34px; padding: 5px 8px 5px 6px; border: 0; border-radius: 8px; background: transparent; color: var(--tt-text-2); font-size: 14px; text-align: left; cursor: pointer; }
.wake__row:hover { background: var(--tt-hover); }
.wake__who { flex: none; color: var(--tt-text); font-weight: 500; }
.wake__sum { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wake__time { flex: none; color: var(--tt-text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.wake__row > .i:last-child { color: var(--tt-text-muted); transition: rotate .16s; }
.wake__row[aria-expanded='true'] > .i:last-child { rotate: 90deg; }
.wake__body { margin: 4px 0 0 30px; padding: 10px 14px 12px; border: 1px solid var(--tt-hairline); border-radius: 10px; }
.raw-caption { margin: 0 0 6px; color: var(--tt-text-muted); font-size: 12px; }
.raw { margin: 0; color: var(--tt-text-2); font: 13px/1.6 var(--tt-font-ui); white-space: pre-wrap; overflow-wrap: anywhere; }

/* ---------- 4C: the wake-up card, in the merge checklist's style; and the live card a start puts in the transcript ---------- */
.wcard { margin: 0 0 24px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-md); container: wcard / inline-size; }
.wcard__head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 9px 12px; color: var(--tt-text-muted); font-size: 12.5px; }
.wcard__head strong { color: var(--tt-text); font-size: 13.5px; font-weight: 500; }
.wcard__head time { margin-left: auto; font-variant-numeric: tabular-nums; }
.wcard__lines { margin: 0; padding: 0; list-style: none; }
.wcard__line { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; column-gap: 10px; padding: 9px 12px; border-top: 1px solid var(--tt-hairline); }
.wcard__line > svg { color: var(--tt-text-muted); }
.wcard__line[data-tone='done'] > svg { color: var(--tt-success); }
.wcard__line[data-tone='failed'] > svg { color: var(--tt-error-text); }
.wcard__line[data-tone='open'] > svg { color: var(--tt-warning-text); }
.wcard__line[data-tone='merged'] > svg { color: var(--tt-activity); }
.wcard__line strong { display: block; color: var(--tt-text); font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
.wcard__line small { display: block; color: var(--tt-text-muted); font-size: 12.5px; }
.wcard__foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 4px 6px; border-top: 1px solid var(--tt-hairline); }
.wcard__raw-wrap { padding: 4px 12px 12px; }
.qbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 8px; border: 0; border-radius: 7px; background: transparent; color: var(--tt-text-muted); font-size: 13px; cursor: pointer; }
.qbtn:hover { background: var(--tt-hover); color: var(--tt-text); }
.qbtn > .i { transition: rotate .16s; }
.qbtn[aria-expanded='true'] > .i { rotate: 90deg; }
.babysit-card { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; margin: 0 0 24px; padding: 11px 12px; border: 1px solid var(--tt-accent-border); border-radius: var(--tt-radius-md); container: wcard / inline-size; }
.babysit-card[data-ended] { border-color: var(--tt-hairline); }
.babysit-card > svg { color: var(--tt-accent-text); }
.babysit-card[data-ended] > svg { color: var(--tt-text-muted); }
.babysit-card strong { display: block; color: var(--tt-text); font-size: 14px; font-weight: 500; }
.babysit-card small { display: block; color: var(--tt-text-muted); font-size: 12.5px; line-height: 1.45; }
@container wcard (max-width: 420px) {
  .wcard__line, .babysit-card { grid-template-columns: 18px minmax(0, 1fr); align-items: start; }
  .wcard__line > .tt-button, .babysit-card > .tt-button { grid-column: 2; justify-self: start; margin-top: 6px; }
  .wcard__line > svg, .babysit-card > svg { margin-top: 2px; }
}

/* ---------- 4B: the wake-up as a message on the user's side, labelled Sotto ---------- */
.msg[data-role='sotto'] { margin-left: max(24px, 12%); padding: 12px 16px 14px; border: 1px solid var(--tt-accent-border); border-radius: 14px 14px 4px 14px; background: var(--tt-bubble); }
.msg[data-role='sotto'] .msg__who { color: var(--tt-text); }
.msg__tag { padding: 0 7px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-pill); color: var(--tt-text-muted); font-size: 11.5px; line-height: 18px; }
.msg[data-role='sotto'] .raw { color: var(--tt-text); font-size: 13.5px; line-height: 1.55; }

/* ---------- Composer (threads.css, composer.css, branchToolbar.css) ---------- */
.compose { position: relative; display: flex; flex: none; flex-direction: column; padding: 8px max(24px, calc((100% - 760px) / 2)) 16px; }
@container pane (max-width: 520px) { .compose { padding-inline: 16px; } }
.prompt { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); padding: 14px 16px 10px; border: 1px solid var(--tt-field-border); border-radius: 16px; background: var(--tt-field); }
.prompt:focus-within { border-color: var(--tt-field-border-focus); }
.prompt textarea { grid-column: 1 / -1; display: block; width: 100%; min-height: 60px; padding: 0; border: 0; outline: 0; resize: none; background: transparent; color: var(--tt-text); font-size: 15px; line-height: 1.5; }
.prompt textarea::placeholder { color: var(--tt-text-muted); }
.prompt__clip { grid-column: 1; align-self: end; margin: 0 2px 1px -8px; }
.prompt__foot { grid-column: 2; display: flex; align-items: flex-end; gap: 8px; margin-top: 8px; }
.prompt__chips { display: flex; flex: 1; flex-wrap: wrap; gap: 6px; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--tt-field-border); border-radius: var(--tt-radius-pill); background: transparent; color: var(--tt-text-2); font-size: 13px; white-space: nowrap; cursor: pointer; }
.chip:hover { background: var(--tt-hover); color: var(--tt-text); }
.chip .pmark { color: var(--tt-provider-claude); }
:root[data-theme='light'] .chip .pmark { color: color-mix(in srgb, var(--tt-provider-claude) 50%, var(--tt-text)); }
.send { display: grid; flex: none; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%; background: var(--tt-accent); color: var(--tt-on-accent); cursor: pointer; }
.branch-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; margin: 8px 2px 0; color: var(--tt-text-muted); font-size: 12.5px; }
.branch-toolbar__end { display: inline-flex; align-items: center; gap: 6px; min-width: 0; margin-left: auto; }
.btb { position: relative; display: inline-flex; align-items: center; gap: 5px; min-width: 0; height: 30px; padding: 0 11px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-pill); background: transparent; color: var(--tt-text-2); white-space: nowrap; }
button.btb { cursor: pointer; }
button.btb:hover { border-color: var(--tt-text-faint); background: var(--tt-hover); color: var(--tt-text); }
.btb--static { padding-left: 9px; color: var(--tt-text-muted); }
.btb--static > svg { color: var(--tt-text-faint); }
.btb--branch { max-width: 220px; font-family: var(--tt-font-mono); font-size: 12px; }
.btb--branch > span { overflow: hidden; text-overflow: ellipsis; }
.btb--pr { gap: 4px; font-size: 12px; }
.btb--pr > svg { color: var(--tt-success); }
.btb--pr[data-state='merged'] > svg { color: var(--tt-accent-text); }
/* 3B: a ring on the pull request badge while it is babysat, and a dot that says so without colour alone. */
.btb--pr[data-babysat] { border-color: var(--tt-accent); box-shadow: 0 0 0 1px var(--tt-accent); }
.btb--pr[data-babysat]::after { content: ''; position: absolute; top: -2px; right: -2px; width: 9px; height: 9px; border-radius: 50%; background: var(--tt-accent); box-shadow: 0 0 0 2px var(--tt-canvas); }

/* 3A: the quiet line above the composer, where the creature would stand. */
.babysit-line { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; min-height: 30px; margin: 0 6px 6px; color: var(--tt-text-muted); font-size: 13px; }
.babysit-line > svg { color: var(--tt-accent-text); }
.babysit-line strong { color: var(--tt-text-2); font-weight: 500; }
.linkbtn { min-height: 26px; padding: 0 4px; border: 0; border-radius: 6px; background: transparent; color: var(--tt-link); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.linkbtn:hover { background: var(--tt-hover); }

/* 3C: a fourth pose for the composer's creature (threadMonitor.css): it stands by its pull request's sign. */
.ornament { position: relative; height: 64px; margin-bottom: 4px; padding: 0 14px; display: grid; grid-template-columns: minmax(80px, 1fr) minmax(0, min(200px, 52%)); align-items: end; pointer-events: none; }
.ornament svg { display: block; width: 80px; height: 64px; }
.mon-color { fill: var(--tt-activity); }
.mon-ink { fill: var(--tt-canvas); }
.mon-shine { fill: var(--tt-text); }
.mon-handle { fill: var(--tt-border); }
.mon-task { pointer-events: auto; min-width: 0; margin-bottom: -5px; padding: 8px 12px; border: 1px solid var(--tt-field-border); border-bottom: 0; border-radius: 8px 8px 0 0; background: var(--tt-surface); }
.mon-task b { display: block; overflow: hidden; color: var(--tt-text); font-size: 13px; font-weight: 400; line-height: 1.5; text-overflow: ellipsis; white-space: nowrap; }
.mon-task span { display: block; overflow: hidden; color: var(--tt-text-muted); font-size: 12px; line-height: 1.5; text-overflow: ellipsis; white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) { .mon-eyes { animation: blink 5s steps(1) infinite; } }
@keyframes blink { 0%, 96% { opacity: 1; } 97%, 99% { opacity: 0; } }

/* ---------- Tools panel and the Pull request surface (toolsRail.css, pullRequestSurface.css) ---------- */
.tools { display: flex; min-width: 0; min-height: 0; border-left: 1px solid var(--tt-hairline); background: var(--tt-sidebar); color: var(--tt-text-2); }
.rail { display: flex; flex: none; flex-direction: column; align-items: center; gap: 8px; width: 58px; padding: 50px 0 8px; border-left: 1px solid var(--tt-hairline); }
.rail__tabs { display: flex; flex-direction: column; gap: 2px; }
.rail__tab { position: relative; display: grid; place-items: center; align-content: center; gap: 4px; width: 50px; height: 50px; padding: 0; border: 0; border-radius: 9px; background: transparent; color: var(--tt-text-muted); font-size: 12px; font-weight: 500; line-height: 1; cursor: pointer; }
.rail__tab:hover { background: var(--tt-hover); color: var(--tt-text); }
.rail__tab[aria-current='true'] { background: var(--tt-selected); color: var(--tt-text); }
.rail__tab[aria-current='true']::before { content: ''; position: absolute; top: 13px; right: 0; bottom: 13px; width: 0; border-radius: 2px; box-shadow: 3px 0 0 1px var(--tt-activity); }
.rail__foot { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 40px; margin-top: auto; padding-top: 8px; border-top: 1px solid var(--tt-hairline); }
.tools__main { display: flex; flex: 1; flex-direction: column; min-width: 0; min-height: 0; container: tools-body / inline-size; }
.chrome { position: relative; display: flex; flex: none; align-items: center; gap: 6px; min-width: 0; height: 44px; padding: 0 92px 0 16px; border-bottom: 1px solid var(--tt-hairline); font-size: 14px; }
.chrome__lead { display: flex; flex: 1; align-items: center; gap: 8px; min-width: 0; }
.chrome__lead > svg[data-state='open'] { color: var(--tt-success); }
.chrome__lead > svg[data-state='merged'] { color: var(--tt-activity); }
.pr-name { flex: 0 1 auto; min-width: 0; margin: 0; overflow: hidden; color: var(--tt-text); font-size: 13.5px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.pr-name span { color: var(--tt-text-muted); font-variant-numeric: tabular-nums; }
.tag { flex: none; padding: 1px 8px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-pill); color: var(--tt-text-2); font-size: 12px; line-height: 18px; }
.chrome__actions { position: relative; display: flex; flex: none; align-items: center; gap: 2px; }
.cbtn { position: relative; display: grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 7px; background: transparent; color: var(--tt-text-muted); cursor: pointer; }
.cbtn:hover { background: var(--tt-hover); color: var(--tt-text); }
.cbtn[aria-expanded='true'] { background: var(--tt-selected); color: var(--tt-text); }
/* 1A: the header button, shown pressed while babysitting. */
.cbtn[data-on] { background: var(--tt-selected); color: var(--tt-accent-text); box-shadow: inset 0 0 0 1px var(--tt-selected-border); }
.menu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 40; display: grid; width: 250px; max-width: calc(100cqw - 24px); padding: 6px; border: 1px solid var(--tt-hairline); border-radius: 10px; background: var(--tt-surface-elevated); box-shadow: 0 16px 48px var(--tt-shadow-color); }
.menu button { display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 6px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--tt-text); font-size: 13px; text-align: left; cursor: pointer; }
.menu button > svg { color: var(--tt-text-muted); }
.menu button:hover, .menu button:focus-visible { background: var(--tt-hover); outline: none; }
.menu button:focus-visible { box-shadow: inset 0 0 0 2px var(--tt-focus-ring); }
.menu hr { height: 1px; margin: 4px 2px; border: 0; background: var(--tt-hairline); }

.pr-notice { flex: none; margin: 0; padding: 8px 16px; border-bottom: 1px solid var(--tt-hairline); font-size: 13.5px; }
.pr-body { flex: 1; min-height: 0; overflow: auto; padding: 16px 16px 24px; scrollbar-width: thin; scrollbar-color: var(--tt-scrollbar) transparent; }
.pr-heading { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 10px; margin: 0 0 10px; color: var(--tt-text); font-size: 16px; font-weight: 550; }
.pr-heading small { color: var(--tt-text-muted); font-size: 13px; font-weight: 400; }
.pr-heading small[data-tone='done'] { color: var(--tt-success); }
.pr-lines { margin: 0; padding: 0; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-md); list-style: none; }
.pr-line { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; column-gap: 10px; padding: 10px 12px; border-top: 1px solid var(--tt-hairline); }
.pr-line:first-child { border-top: 0; }
.pr-line > svg { color: var(--tt-text-muted); }
.pr-line[data-tone='done'] > svg { color: var(--tt-success); }
.pr-line[data-tone='failed'] > svg { color: var(--tt-error-text); }
.pr-line:is([data-tone='running'], [data-tone='open']) > svg { color: var(--tt-warning-text); }
.pr-line strong { display: block; color: var(--tt-text); font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
.pr-line[data-tone='done'] strong { color: var(--tt-text-2); font-weight: 400; }
.pr-why { display: block; color: var(--tt-text-muted); font-size: 12.5px; line-height: 1.4; overflow-wrap: anywhere; }
.tt-button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 30px; padding: 0 12px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-pill); background: transparent; color: var(--tt-text-2); font-size: 13px; font-weight: 500; line-height: 1.2; white-space: nowrap; cursor: pointer; }
.tt-button:hover:not(:disabled) { border-color: var(--tt-text-faint); color: var(--tt-text); }
.tt-button--primary { border-color: var(--tt-pill); background: var(--tt-pill); color: var(--tt-pill-ink); font-weight: 600; }
.tt-button--primary:hover:not(:disabled) { border-color: var(--tt-pill); color: var(--tt-pill-ink); filter: brightness(1.12); }
.tt-button--primary[aria-disabled='true'] { border-color: var(--tt-field-border); background: var(--tt-secondary); color: var(--tt-text-muted); cursor: not-allowed; filter: none; }
.pr-dock { position: sticky; bottom: -24px; z-index: 2; margin: 0 -16px; padding: 14px 16px 12px; background: var(--tt-sidebar); }
.pr-merge { display: flex; gap: 8px; }
.pr-merge .tt-button { min-height: 44px; font-size: 15px; }
.pr-merge__go { flex: 1; min-width: 0; }
.pr-hint { margin: 8px 0 0; color: var(--tt-text-muted); font-size: 13px; line-height: 1.5; }
.pr-finished { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; padding: 12px 14px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-md); }
.pr-finished > svg { color: var(--tt-activity); }
.pr-finished strong { display: block; color: var(--tt-text); font-weight: 500; }
.pr-finished span { color: var(--tt-text-muted); font-size: 13px; }
.pr-fold { border-top: 1px solid var(--tt-hairline); }
.pr-dock + .pr-fold, .pr-finished + .pr-fold { margin-top: 6px; }
.pr-fold__head { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px; padding: 0; border: 0; background: transparent; color: var(--tt-text); font-size: 13.5px; font-weight: 500; text-align: left; cursor: pointer; }
.pr-fold__head > svg { color: var(--tt-text-muted); }
.pr-fold__head span { color: var(--tt-text-muted); font-weight: 400; }
/* 1B: the line docked under the checklist, above Merge. */
.pr-babysat { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 0 12px; padding: 8px 8px 8px 12px; border: 1px solid var(--tt-accent-border); border-radius: var(--tt-radius-md); background: var(--tt-accent-wash); }
.pr-babysat > svg { color: var(--tt-accent-text); }
.pr-babysat__text { flex: 1 1 160px; min-width: 0; }
.pr-babysat__text strong { display: block; color: var(--tt-text); font-size: 13.5px; font-weight: 500; }
.pr-babysat__text small { display: block; color: var(--tt-text-muted); font-size: 12.5px; }
.pr-babysat[data-ended] { border-color: var(--tt-hairline); background: transparent; }
.pr-babysat[data-ended] > svg { color: var(--tt-text-muted); }
.pr-babysat--after { margin: 14px 0 0; }
/* 1C: a switch row in the surface's foot, with who started it and since when underneath. */
.pr-foot-switch { display: grid; grid-template-columns: minmax(0, 1fr) 36px; align-items: center; gap: 2px 16px; width: 100%; flex: none; padding: 10px 16px; border: 0; border-top: 1px solid var(--tt-hairline); background: transparent; color: var(--tt-text); text-align: left; cursor: pointer; }
.pr-foot-switch:disabled { cursor: not-allowed; }
.pr-foot-switch strong { display: block; font-size: 13.5px; font-weight: 500; }
.pr-foot-switch small { display: block; color: var(--tt-text-muted); font-size: 12.5px; line-height: 1.4; }
.pr-foot-switch:hover:not(:disabled) { background: var(--tt-hover); }
.tools__foot { display: flex; flex: none; align-items: center; gap: 8px; min-width: 0; min-height: 32px; padding: 0 6px 0 14px; border-top: 1px solid var(--tt-hairline); color: var(--tt-text-muted); font-size: 12px; white-space: nowrap; }
.tools__copy { display: flex; flex: 0 1 auto; align-items: center; gap: 6px; min-width: 0; color: var(--tt-text-2); }
.tools__copy b { flex: none; font-weight: 500; }
.tools__copy code { min-width: 0; overflow: hidden; font-family: var(--tt-font-mono); text-overflow: ellipsis; }
.tools__copy .muted { color: var(--tt-text-muted); overflow: hidden; text-overflow: ellipsis; }
.tools__foot-actions { display: flex; margin-left: auto; }
@container tools-body (max-width: 479px) {
  .pr-line { grid-template-columns: 18px minmax(0, 1fr); align-items: start; }
  .pr-line > svg { margin-top: 1px; }
  .pr-line .tt-button { grid-column: 2; justify-self: start; margin-top: 8px; }
}
@container tools-body (max-width: 439px) { .pr-body { padding-inline: 12px; } .pr-dock { margin-inline: -12px; padding-inline: 12px; } .tools__copy .muted { display: none; } }

/* The switch (global.css .tt-toggle): checked is the text colour with a canvas thumb. */
.track { position: relative; display: block; width: 36px; height: 20px; border: 1px solid var(--tt-border); border-radius: var(--tt-radius-pill); background: var(--tt-surface-sunken); }
.track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--tt-text-muted); transition: transform .12s; }
[aria-checked='true'] > .track { border-color: var(--tt-text); background: var(--tt-text); }
[aria-checked='true'] > .track::after { background: var(--tt-canvas); transform: translateX(16px); }
:disabled > .track { opacity: .5; }

/* The window's own controls (Windows): drawn by the system over the top right, not in the page's tab order. */
.winctl { position: fixed; top: 0; right: 0; z-index: 30; display: flex; height: 44px; color: var(--tt-text-2); pointer-events: none; }
.winctl span { display: grid; place-items: center; width: 46px; }

/* ---------- Settings (global.css settings rows) ---------- */
.settings { display: none; grid-template-columns: var(--side-w-settings, 300px) minmax(0, 1fr); height: 100vh; }
body[data-settings] .settings { display: grid; }
@media (max-width: 1000px) { .settings { --side-w-settings: 230px; } }
.settings__nav { display: flex; flex-direction: column; min-height: 0; padding: 0 10px; background: var(--tt-sidebar); border-right: 1px solid var(--tt-hairline); }
.settings__nav .side__top { padding-left: 4px; }
.settings__nav h1 { margin: 10px 8px 14px; font-size: 22px; font-weight: 600; letter-spacing: -.4px; }
.snav { display: grid; align-content: start; flex: 1 1 auto; gap: 2px; min-height: 0; margin: 0; padding: 0; list-style: none; overflow-y: auto; }
.snav hr { height: 1px; margin: 6px 10px; border: 0; background: var(--tt-hairline); }
.snav button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--tt-text-2); font-size: 14px; text-align: left; cursor: pointer; }
.snav button:hover { background: var(--tt-hover); }

}
function babysitCard(b) {
  if (state.variant !== 'b' || !(b.on || b.ended)) return ''
  if (b.on) return `<article class="babysit-card" aria-label="Babysitting pull request 74">${ico('alarm', 18)}<div><strong>Babysitting #74 Greet the reviewer</strong><small>${started(b)}. Sotto wakes this thread when a check fails, the required checks pass, someone else comments or reviews, the branch conflicts, or it merges.</small></div><button type="button" class="tt-button" data-act="stop" data-k="cardstop">Stop babysitting</button></article>`

function renderTranscript(b) {
  const parts = []
  parts.push(`<div class="msg" data-role="user"><header><span class="msg__who">You</span><time>1:48 pm</time></header><p class="msg__text">Add a greeting for reviewers, open a pull request and see it through CI.</p></div>`)
  const tool = b.agentStarted && state.manual !== 'on'
  parts.push(`<div class="msg"><header><span class="msg__who">Claude</span><time>2:01 pm</time></header>
    <div class="activity">

      ${tool ? `<div class="act">${ico('alarm')}<span><strong>Babysit pull request</strong> #74</span><span class="act__by">Sotto tool</span></div>` : ''}
    </div>
    <p class="msg__text">Added a greeting for reviewers in <code>src/greeting.ts</code> with a test, and opened #74 Greet the reviewer. CI is running.</p>
    ${tool ? '<p class="msg__text">I asked Sotto to babysit it, so I’ll be woken when the checks finish or someone reviews. Ending my turn here.</p>' : ''}</div>`)
  parts.push(babysitCard(b))
  WAKES.forEach((w, idx) => {
    if (state.step < w.step) return
    parts.push(wakeHtml(w, idx))
    const r = REPLIES[idx]

    parts.push(`<div class="msg"><header><span class="msg__who">Claude</span><time>${r.at}</time></header><p class="msg__text">${inProgress ? r.working : r.done}</p></div>`)

  })
  return parts.join('')

function prLines() {
  const i = state.step
  const L = []
  if (i <= 2) L.push(['running', 'run', 'Checks running', '2 of 3 checks finished'])
  else if (i === 3) L.push(['failed', 'fail', 'Checks failing', 'CI / Owned build failed', 'View check'])
  else L.push(['done', 'ok', 'Checks passing', '3 checks passed'])
  if (i === 5) L.push(['failed', 'fail', 'Changes requested', 'mira asked for changes', 'View review'])
  else if (i === 7) L.push(['done', 'ok', 'Review approved', 'Approved by mira'])
  else if (i === 6) L.push(['open', 'open', 'Review required', 'Asked mira to look again'])
  else L.push(['open', 'open', 'Review required', 'No review yet'])
  if (i === 6) L.push(['open', 'open', 'Behind main', '2 commits behind main', 'Update branch'])
  else L.push(['done', 'ok', 'Up to date with main', i === 7 ? 'Merged into main' : 'Has every commit on main'])
  if (i === 6) L.push(['failed', 'fail', 'Conflicts with main', 'README.md conflicts'])
  else L.push(['done', 'ok', 'No conflicts', i === 7 ? 'Merged without conflicts' : 'Merges cleanly into main'])
  L.push(['done', 'ok', 'Ready for review', 'Not a draft'])
  return L
}

    <nav class="rail" aria-label="Tools surfaces">
      <div class="rail__tabs">
        <button type="button" class="rail__tab" aria-label="Open Browser">${ico('globe', 20)}<span aria-hidden="true">Browser</span></button>
        <button type="button" class="rail__tab" aria-label="Open Terminal">${ico('term', 20)}<span aria-hidden="true">Terminal</span></button>
        <button type="button" class="rail__tab" aria-label="Open Files">${ico('tree', 20)}<span aria-hidden="true">Files</span></button>
        <button type="button" class="rail__tab" aria-label="Open Changes">${ico('compare', 20)}<span aria-hidden="true">Changes</span></button>
        <button type="button" class="rail__tab" aria-current="true" aria-label="Pull request, open">${ico('pr', 20)}<span aria-hidden="true">PR</span></button>
        <button type="button" class="rail__tab" aria-label="Open Agents">${ico('users', 20)}<span aria-hidden="true">Agents</span></button>
      </div>
      <div class="rail__foot">
        <button type="button" class="ibtn" aria-label="Pin Tools to this thread">${ico('pin')}</button>
        <button type="button" class="ibtn" aria-label="Fill the window with Tools">${ico('expand')}</button>
        <button type="button" class="ibtn" aria-label="Close Tools">${ico('x')}</button>
      </div>
    </nav>`
}

/* ---------------- Settings ---------------- */
function renderSettings() {
  const v = state.variant
  const on = state.agentsMayBabysit
  const desc = `An agent can ask Sotto to babysit its pull request instead of checking GitHub itself. Sotto then wakes the thread when a check fails, the required checks pass, someone else comments or reviews, the branch starts to conflict, or the pull request merges or closes. It asks GitHub through gh, on your own sign-in, every two minutes. ${on ? 'When off, agents cannot start it and what they started stops.' : 'Off: agents cannot start it, and what they started has stopped.'} Babysitting you start on the Pull request surface stays.`
  const toggle = (label, checked, small, extra = '') => `<button type="button" class="s-toggle${extra}" role="switch" aria-checked="${checked}"${extra ? ' data-act="agentswitch" data-k="agentswitch"' : ''}><span><strong>${label}</strong><small>${small}</small></span><span class="track" aria-hidden="true"></span></button>`
  const row = v === 'a'
    ? toggle('Let agents babysit their pull requests', on, desc, ' s-row--new')
    : toggle('Let agents babysit pull requests', on, desc, ' s-row--new')
  const section = v === 'a'
    ? `<div class="s-heading">${ico('pr')}<div><h2>When a pull request is made or merged</h2></div></div>
       <div class="s-rows">
         ${toggle('Follow pull request templates', true, 'A pull request Sotto drafts follows the repository’s template when it has one.')}
         <div class="s-field"><div><strong>Default merge method</strong><small>Merge on the Pull request surface starts on Squash.</small></div><select aria-label="Default merge method"><option>Squash</option><option>Merge commit</option><option>Rebase</option></select></div>
         ${toggle('Auto-settle merged threads', false, 'A thread stays open after its pull request merges until you settle it.')}
         ${row}
       </div>
       <div class="s-heading">${ico('refresh')}<div><h2>In the background</h2></div></div>
       <div class="s-rows">
         <div class="s-field"><div><strong>Git fetch interval</strong><small>Sotto asks origin every 30 seconds whether a thread’s branch is ahead or behind, while this window is in front.</small></div><select aria-label="Git fetch interval"><option>30 seconds</option></select></div>
       </div>`
    : `<div class="s-heading">${ico('sliders')}<div><h2>Application</h2><p>Startup, privacy &amp; updates</p></div></div>
       <div class="s-rows">
         ${toggle('Show the browser when an agent opens a page', true, 'When an agent opens a page, its thread’s browser player opens over the thread. When off, it stays closed and Tools still shows the work.')}
         ${toggle('Let agents use the browser without asking', true, 'Agents can open pages, click and type in Sotto’s browser without asking first. Stop sharing one page, or stop it for one thread, in Tools &gt; Browser.')}
         ${toggle('Let agents draw visuals in threads', true, 'An agent can draw a diagram, or a small interactive page sealed from the network, in its thread. When off, agents explain in text instead.')}
         ${row}
         <div class="s-field"><div><strong>Replies in threads</strong><small>Stream a reply word by word as the agent writes it, or show it once it is finished.</small></div><select aria-label="Replies in threads"><option>As written</option><option>When finished</option></select></div>
       </div>`
  const nav = (icon, label, current) => `<li><button type="button"${current ? ' aria-current="page"' : ''}>${ico(icon)}${label}</button></li>`
  document.getElementById('settings').innerHTML = `
    <nav class="settings__nav" aria-label="Settings sections">
      <div class="side__top drag"><span class="brand" aria-label="Sotto application">${smark(18)}<span>Sotto</span></span></div>
      <h1>Settings</h1>
      <ul class="snav">
        ${nav('mic', 'Dictation')}${nav('wave', 'Transcription')}${nav('spark', 'Cleanup')}<hr>
        ${nav('cmd', 'Providers')}${nav('server', 'Hosts')}${nav('users', 'Agents')}${nav('arrow', 'Output')}<hr>
        ${nav('palette', 'Appearance')}${nav('sliders', 'Application', v !== 'a')}${nav('branch', 'Git', v === 'a')}
      </ul>
      ${sideFoot()}
    </nav>
    <main class="settings__main"><div class="settings__inner">${section}</div><p class="s-save">Changes save as you make them.</p></main>`
}

/* ---------------- Glue ---------------- */
function render() {
  const keyed = document.activeElement?.dataset?.k
  document.documentElement.toggleAttribute('data-theme', state.light)
  if (state.light) document.documentElement.setAttribute('data-theme', 'light')
  document.body.toggleAttribute('data-settings', state.settings)
  document.body.toggleAttribute('data-nobar', !state.bar)
  if (state.openLast) { const last = WAKES.filter(w => state.step >= w.step).length - 1; if (last >= 0) state.open.add('w' + last); state.openLast = false }
  if (state.settings) renderSettings()
  else { renderSide(); renderPane(); renderTools() }
  state.toScroll = false
  const vi = VARIANTS.findIndex(([k]) => k === state.variant)
  document.getElementById('vlabel').textContent = `${state.variant.toUpperCase()} — ${VARIANTS[vi][1]}`
  document.getElementById('slabel').textContent = `${state.step + 1}/8 ${STEPS[state.step][1]}`
  document.getElementById('sb').textContent = state.settings ? 'Close Settings' : 'Open Settings'
  document.getElementById('tb').textContent = state.light ? 'Dark theme' : 'Light theme'
  const q = new URLSearchParams({ variant: state.variant, step: STEPS[state.step][0] })
  if (state.light) q.set('theme', 'light')
  if (state.settings) q.set('settings', '1')
  if (!state.bar) q.set('bar', '0')
  history.replaceState(null, '', '?' + q)
  if (keyed) (document.querySelector(`[data-k="${keyed}"]`) ?? document.querySelector('[data-k="footswitch"], [data-k="hbtn"], [data-k="dockstop"], [data-k="menu"]'))?.focus()
}
function goVariant(d) { const i = VARIANTS.findIndex(([k]) => k === state.variant); state.variant = VARIANTS[(i + d + 3) % 3][0]; state.manual = null; state.menu = false; state.open.clear(); state.toScroll = true; render() }
function goStep(d) { state.step = (state.step + d + STEPS.length) % STEPS.length; state.manual = null; state.menu = false; state.toScroll = true; render() }
document.getElementById('pv').onclick = () => goVariant(-1)
document.getElementById('nv').onclick = () => goVariant(1)
document.getElementById('ps').onclick = () => goStep(-1)
document.getElementById('ns').onclick = () => goStep(1)
document.getElementById('sb').onclick = () => { state.settings = !state.settings; state.toScroll = true; render() }
document.getElementById('tb').onclick = () => { state.light = !state.light; render() }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act], [data-toggle]')
  if (!t) { if (state.menu && !e.target.closest('.menu')) { state.menu = false; render() } return }
  const act = t.dataset.act
  if (t.dataset.toggle) { const k = t.dataset.toggle; state.open.has(k) ? state.open.delete(k) : state.open.add(k); render(); return }
  if (act === 'stop') { state.manual = 'off'; state.menu = false; render() }
  else if (act === 'start') { state.manual = 'on'; state.menu = false; render() }
  else if (act === 'menu') { state.menu = !state.menu; render(); if (state.menu) document.querySelector('.menu [role="menuitem"]')?.focus() }
  else if (act === 'settings') { state.settings = true; render(); document.querySelector('[data-k="agentswitch"]')?.focus() }
  else if (act === 'threads') { state.settings = false; state.toScroll = true; render() }
  else if (act === 'agentswitch') { state.agentsMayBabysit = !state.agentsMayBabysit; render() }
})
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.menu) { state.menu = false; render(); document.querySelector('[data-k="menu"]')?.focus(); return }
  if (state.menu && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    const items = [...document.querySelectorAll('.menu [role="menuitem"]')]
    const at = items.indexOf(document.activeElement)
    items[(at + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length]?.focus(); e.preventDefault(); return
  }
  if (e.target.closest('input, textarea, select, [contenteditable]')) return
  if (e.key === 'ArrowLeft') goVariant(-1)
  else if (e.key === 'ArrowRight') goVariant(1)
  else if (e.key === '[') goStep(-1)
  else if (e.key === ']') goStep(1)
})
render()
</script>
</body>
</html>
