<!doctype html>
<!--
  PROTOTYPE — throwaway. Not shipped, not tested, not wired to anything. Nothing here sends, forks, merges or reads.

  Question: where does Zach start "continue this somewhere else", and how does he see what moved, what was
  carried and what was left behind? Tickets E4 #1027, E5 #1028 and E7 #1030 in the map #1023.

  Surfaces (the switch at the top):
    1  Continue on another provider (E4), from the pane's menu and from a usage-limit error. The new thread's
       first message is the handover (E3); the two threads link to each other; the source stays readable.
    2  Continue a subagent as its own thread (E5): a Codex agent is forked natively, a Claude agent starts from a
       thin handover. Fork from here (E5b) on a turn of a whole thread; Devin gets the handover only.
    3  Bring changes back (E7): "Bring changes to main" on a child in a new worktree. Fast-forward when it can,
       asks before a merge commit, refuses uncommitted work and conflicts in Git's own words.

  Variants of where it lives (?variant=A|B|C, the bar at the bottom, or the arrow keys):
    A  Menu and sheet.  A menu row or a button opens one dialog holding every choice and the handover.
    B  In place.        No dialog: the error, the model chip, the roster row, the turn and the composer grow the
                        choices where you are.
    C  Lineage.         A Tools surface draws the thread's family (continued from, continued in, forks, agents)
                        with each handover on the line between two threads. Starts and Bring changes back happen there.

  The select at the top walks each surface through its states, refusals and empty states included.
  URL: ?surface=1|2|3&state=<id>&variant=A|B|C&theme=dark|light&size=1600x1000|1280x800|820x560
-->

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: #202020; font-family: var(--tt-font); }
button { font: inherit; }
svg { flex: none; }
:focus-visible { outline: 2px solid var(--tt-focus-ring); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.stage { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 112px 0 120px; }
.window { zoom: var(--fit, 1); position: relative; flex: none; width: var(--w); height: var(--h); display: grid; grid-template-columns: var(--side) minmax(0, 1fr) auto; overflow: hidden; background: var(--tt-canvas); color: var(--tt-text); border: 1px solid #000; font-size: 14px; }
.winctl { position: absolute; top: 0; right: 0; z-index: 5; display: flex; align-items: center; height: 46px; padding: 0 10px; gap: 2px; color: var(--tt-text-2); pointer-events: none; }
.winctl span { display: grid; place-items: center; width: 36px; height: 30px; }

/* Sidebar */
.side { display: flex; flex-direction: column; min-width: 0; overflow: hidden; background: var(--tt-sidebar); color: var(--tt-sidebar-text); border-right: 1px solid var(--tt-sidebar-border); }
.side-top { display: flex; align-items: center; gap: 4px; height: 46px; padding: 0 10px 0 14px; flex: none; }
.side-top .brand { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; font-weight: 600; font-size: 15px; }
.tile { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--tt-accent); color: var(--tt-on-accent); }
.side-top .ib { display: grid; place-items: center; width: 28px; height: 28px; color: var(--tt-sidebar-text-muted); }
.window[data-narrow] .side-top .ib.wide { display: none; }
.side-search { display: flex; align-items: center; gap: 8px; height: 34px; margin: 2px 10px 10px; padding: 0 10px; border: 1px solid var(--tt-sidebar-border); border-radius: 8px; background: var(--tt-sidebar-control); color: var(--tt-sidebar-text-muted); font-size: 13px; flex: none; }
.side-scroll { flex: 1; min-height: 0; overflow: auto; }
.side-group { display: flex; align-items: center; gap: 6px; padding: 8px 14px 6px; font-size: 14px; font-weight: 500; }
.side-group .count { margin-left: auto; color: var(--tt-sidebar-text-muted); font-size: 12px; font-weight: 400; }
.side-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 8px; margin: 0 6px 2px; padding: 8px 10px 8px 12px; border: 1px solid transparent; border-radius: 8px; font-size: 14px; }
.side-row[aria-current] { background: var(--tt-sidebar-row-selected); border-color: var(--tt-selected-border); }
.side-row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.side-row .time, .side-row .status { color: var(--tt-sidebar-text-muted); font-size: 12.5px; text-align: right; white-space: nowrap; }
.side-row .sub { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--tt-sidebar-text-muted); font-size: 12.5px; }
.side-row .status[data-tone='live'] { color: var(--tt-sidebar-text); }
/* On the selected row's tint, muted text steps toward the row's ink so it keeps 4.5:1. */
.side-row[aria-current] :is(.time, .status, .sub) { color: color-mix(in oklab, var(--tt-sidebar-text-muted) 75%, var(--tt-sidebar-text)); }
.side-settled { display: flex; align-items: center; gap: 6px; padding: 10px 16px; color: var(--tt-sidebar-text); font-size: 14px; }
.side-foot { flex: none; padding: 8px 10px 10px; border-top: 1px solid var(--tt-sidebar-border); }
.switch { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 10px; background: var(--tt-sidebar-control); font-size: 13.5px; }
.switch span { display: grid; place-items: center; height: 30px; border-radius: 8px; color: var(--tt-sidebar-text-muted); }

.side-links { display: flex; gap: 10px; padding: 9px 6px 0; color: var(--tt-sidebar-text-muted); }

/* Thread pane */
.pane { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; container: pane / inline-size; }

.ib-btn:hover, .ib-btn[aria-expanded='true'], .ib-btn[aria-pressed='true'] { background: var(--tt-hover); color: var(--tt-text); }
.git { display: inline-flex; align-items: stretch; height: 30px; border: 1px solid var(--tt-hairline); border-radius: 8px; }
.git .quick { display: inline-flex; align-items: center; gap: 6px; padding: 0 9px; border: 0; border-radius: 7px 0 0 7px; background: transparent; color: var(--tt-text-2); font-size: 12.5px; white-space: nowrap; cursor: pointer; }
.git .quick:hover { background: var(--tt-hover); color: var(--tt-text); }
.git .quick[data-lit] { color: var(--tt-text); }
.git .more { width: 22px; display: grid; place-items: center; padding: 0; border: 0; border-left: 1px solid var(--tt-hairline); border-radius: 0 7px 7px 0; background: transparent; color: var(--tt-text-2); cursor: pointer; }
.git .more[aria-expanded='true'] { background: var(--tt-hover); }
/* As in the app: a narrow pane keeps the Git action's icon and drops its label from view. */
@container pane (max-width: 720px) { .git .quick { padding: 0 7px; } .git .quick .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; } }

.scroll { flex: 1; min-height: 0; overflow: auto; padding: 14px 24px 8px; }
.col { max-width: 760px; margin: 0 auto; }
.msg { position: relative; margin: 0 0 24px; }
.msg header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; color: var(--tt-text-muted); font-size: 12.5px; }
.msg .who { display: inline-flex; align-items: center; gap: 6px; color: var(--tt-text-2); font-weight: 500; }
.msg p { margin: 0 0 8px; color: var(--tt-text-2); font-size: 15px; line-height: 1.6; }
.msg p:last-child { margin-bottom: 0; }
.msg.user { margin-left: max(24px, 12%); padding: 12px 16px; border: 1px solid var(--tt-hairline); border-radius: 14px 14px 4px 14px; background: var(--tt-bubble); }
.msg.user p { color: var(--tt-text); }
.msg.sotto { border-color: var(--tt-accent-border); }
.msg.sotto .who { color: var(--tt-text); }
.msg.sotto p.fine { color: var(--tt-text-2); }
.smark { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 5px; background: var(--tt-accent); color: var(--tt-on-accent); }
.tag { padding: 0 7px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-pill); color: var(--tt-text-2); font-size: 11.5px; line-height: 18px; }
.msg-acts { display: flex; gap: 2px; margin-left: auto; opacity: 0; }
.msg:hover .msg-acts, .msg:focus-within .msg-acts, .msg-acts[data-on] { opacity: 1; }
.msg-act { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 6px; border: 0; border-radius: var(--tt-radius-sm); background: transparent; color: var(--tt-text-muted); font-size: 12px; cursor: pointer; }
.msg-act:hover, .msg-act[aria-expanded='true'] { background: var(--tt-hover); color: var(--tt-text); }
.attach { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 4px 9px; border: 1px solid var(--tt-hairline); border-radius: 8px; color: var(--tt-text-2); font-size: 12.5px; }
pre.code { max-height: 92px; margin: 6px 0 0; padding: 8px 10px; overflow: hidden; border: 1px solid var(--tt-hairline); border-radius: 8px; background: var(--tt-code-bg); color: var(--tt-code-text); font: 12.5px/1.5 var(--tt-mono); white-space: pre; -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent); mask-image: linear-gradient(to bottom, #000 55%, transparent); }
.work { margin: 0 0 18px; padding-bottom: 10px; border-bottom: 1px solid var(--tt-hairline); color: var(--tt-text-2); font-size: 14px; }
.work .line { display: flex; align-items: center; gap: 6px; padding: 3px 0; color: var(--tt-text-2); }

.turn-error { margin: 4px 0 2px; color: var(--tt-error); font-size: 14px; line-height: 1.5; }

.turn-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0 2px; }
.turn-acts > span { color: var(--tt-text-2); font-size: 13.5px; }

/* Lines Sotto writes in a transcript that no provider received. */
.sys-note { display: flex; align-items: flex-start; gap: 9px; margin: 0 0 22px; padding: 10px 12px; border: 1px dashed var(--tt-border); border-radius: var(--tt-radius-md); color: var(--tt-text-2); font-size: 13.5px; line-height: 1.5; }

.sys-note .linkbtn { margin-left: 4px; }
.stays { margin: 0 0 0; padding: 4px 0 0 14px; border-left: 2px dashed var(--tt-hairline); }
.stays-label { margin: 0 0 12px; color: var(--tt-text-muted); font-size: 12.5px; }

/* Composer */
.compose { flex: none; padding: 4px 24px 10px; }
.card { padding: 12px 14px 10px; border: 1px solid var(--tt-field-border); border-radius: 16px; background: var(--tt-field); }
.ph { min-height: 30px; color: var(--tt-text-faint); font-size: 15px; line-height: 1.4; }

.send { display: grid; place-items: center; width: 34px; height: 34px; margin-left: auto; padding: 0; border: 0; border-radius: 50%; background: var(--tt-primary); color: var(--tt-primary-contrast); cursor: pointer; }

.send.stop { background: var(--tt-text); color: var(--tt-canvas); }
.btoolbar { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 7px 6px 0; color: var(--tt-text-muted); font-size: 12.5px; }
.btoolbar b { display: inline-flex; align-items: center; gap: 5px; color: var(--tt-text-2); font-weight: 500; }
.compose-note { margin: 7px 6px 0; color: var(--tt-text-muted); font-size: 12.5px; line-height: 1.45; }

/* Notices above the composer (the Git action's, and B's strips) */
.notice { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 8px; padding: 10px 12px 10px 14px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-md); background: var(--tt-surface-elevated); color: var(--tt-text-2); font-size: 14px; line-height: 1.45; }

/* B: continuing from the composer */
.cont { margin: 0 0 8px; padding: 10px 12px; border: 1px solid var(--tt-accent-border); border-radius: var(--tt-radius-md); background: var(--tt-accent-wash); font-size: 13.5px; }

.cont .r3 { margin: 8px 0 0; color: var(--tt-text-2); line-height: 1.45; }
.cont .x { display: grid; place-items: center; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--tt-text-2); cursor: pointer; }

/* Buttons and small controls */

.handover-text { max-height: 210px; margin-top: 8px; padding: 10px 12px; overflow: auto; border: 1px solid var(--tt-hairline); border-radius: 8px; background: var(--tt-surface-sunken); color: var(--tt-text-2); font-size: 13px; line-height: 1.55; white-space: pre-wrap; }

/* Menus */
.menu { position: absolute; z-index: 20; min-width: 250px; max-width: 320px; padding: 6px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-md); background: var(--tt-surface-overlay); box-shadow: var(--tt-shadow-lg); }

.menu .mi .end { margin-left: auto; color: var(--tt-text-muted); font-size: 12.5px; }
.menu hr { margin: 6px 4px; border: 0; border-top: 1px solid var(--tt-hairline); }
.menu .mh { padding: 7px 10px 3px; color: var(--tt-text-muted); font-size: 12px; font-weight: 600; }
.menu .mfoot { padding: 6px 10px 4px; color: var(--tt-text-muted); font-size: 12px; line-height: 1.45; }

/* Dialog */
.backdrop { position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--tt-overlay); }

.opt { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-pill); background: none; color: var(--tt-text); font-size: 13.5px; white-space: nowrap; cursor: pointer; }

.rows { display: grid; gap: 6px; }
.rrow { display: flex; align-items: flex-start; gap: 10px; width: 100%; padding: 9px 12px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-md); background: none; color: var(--tt-text); text-align: left; cursor: pointer; }
.rrow:hover { background: var(--tt-hover); }
.rrow[aria-checked='true'] { border-color: var(--tt-accent-border); background: var(--tt-accent-wash); }

.rrow[aria-checked='true'] .dot { border: 4px solid var(--tt-accent); }
.rrow strong { display: block; font-size: 14px; font-weight: 500; }

.ledger { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; margin-top: 8px; }
.ledger h4 { margin: 0 0 4px; color: var(--tt-text); font-size: 12.5px; font-weight: 600; }

@container tools (max-width: 470px) { .ledger { grid-template-columns: 1fr; } }
@container pane (max-width: 560px) { .ledger { grid-template-columns: 1fr; } }

/* Tools panel */
.tools { display: grid; grid-template-columns: var(--tools-w) 62px; min-height: 0; border-left: 1px solid var(--tt-hairline); }

.tools-chrome .sub { overflow: hidden; text-overflow: ellipsis; color: var(--tt-text-muted); font-weight: 400; }

.tools-foot { display: flex; align-items: center; gap: 6px; height: 36px; flex: none; padding: 0 16px; overflow: hidden; border-top: 1px solid var(--tt-hairline); color: var(--tt-text-muted); font-size: 12.5px; white-space: nowrap; }
.tools-foot code { color: var(--tt-text-2); font: 12px var(--tt-mono); }
.rail { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 52px 4px 8px; border-left: 1px solid var(--tt-hairline); }

.rail button[aria-current] { background: var(--tt-accent-surface); color: var(--tt-accent-surface-text); }
.rail button[data-dot]::after { content: ''; position: absolute; top: 5px; right: 11px; width: 6px; height: 6px; border-radius: 50%; background: var(--tt-accent); }
.rail .low { display: flex; flex-direction: column; gap: 2px; margin-top: auto; padding-top: 6px; border-top: 1px solid var(--tt-hairline); }
.rail .low span { display: grid; place-items: center; width: 36px; height: 30px; color: var(--tt-text-muted); }
@media (max-height: 99999px) { .window[data-short] .rail button { padding: 4px 0; font-size: 10.5px; } .window[data-short] .rail .low span { height: 26px; } }

/* Agents roster */
.agents { margin: 0; padding: 0; list-style: none; }
.agents > li { padding: 12px 4px; border-bottom: 1px solid var(--tt-hairline); }
.ahead { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 3px 10px; width: 100%; padding: 0; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; }
.adot { width: 7px; height: 7px; margin-top: 7px; border-radius: 50%; background: var(--tt-text-muted); }

.adesc { display: block; color: var(--tt-text-2); font-size: 13.5px; line-height: 1.45; }
.ameta { display: block; margin-top: 2px; color: var(--tt-text-muted); font-size: 12.5px; }

.ainline { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--tt-accent-border); border-radius: var(--tt-radius-md); background: var(--tt-accent-wash); }

.lineage { padding: 4px 0 6px; }

.proto-top { position: fixed; top: 10px; left: 50%; z-index: 50; transform: translateX(-50%); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; max-width: calc(100vw - 20px); padding: 7px 10px; border-radius: 14px; background: #fff; color: #111; box-shadow: 0 8px 30px rgb(0 0 0 / 50%); font: 13px/1.2 ui-sans-serif, system-ui, sans-serif; }

.proto-top select { max-width: 330px; }
.readout { max-width: min(1300px, calc(100vw - 20px)); color: #d6d6d6; font: 12px/1.5 ui-sans-serif, system-ui, sans-serif; text-align: center; }
.readout b { color: #fff; font-weight: 600; }
.proto-bar { position: fixed; bottom: 14px; left: 50%; z-index: 50; transform: translateX(-50%); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; max-width: calc(100vw - 20px); padding: 8px 12px; border-radius: 999px; background: #fff; color: #111; box-shadow: 0 8px 30px rgb(0 0 0 / 50%); font: 13px/1.2 ui-sans-serif, system-ui, sans-serif; }
.proto-bar .label { min-width: 200px; font-weight: 700; text-align: center; }
</style>
</head>

  const devMsgs = [userMsg('9:02 am', 'Draft release notes for 1.42 from the merged pull requests.'), work(['Worked for 6m 10s']), reply('devin', '9:10 am', '<p>Here is a first draft, grouped by area: Threads, Git and iPhone.</p>'), userMsg('10:12 am', 'Shorter, and lead with the Git changes.'), reply('devin', '10:20 am', '<p>Shorter draft, Git first. Six lines in all.</p>', { id: 'fork-point', forkOn: !S.closed })]
  const after = [userMsg('10:31 am', 'Add the iPhone beta link at the end.'), reply('devin', '10:34 am', '<p>Added.</p>')]
  o.body = devMsgs.join('') + inline + (v === 'B' && !S.closed ? `<div class="stays"><p class="stays-label">Not carried: this stays in Release notes</p>${after.join('')}</div>` : after.join(''))
  o.scrollTo = 'fork-point'
  if (!S.closed && v === 'A') o.dialog = dialog('Fork from here', LEDGER.devin.note + ' Release notes stays as it is.', field('The handover', ledgerHtml('devin', { to: 'Devin', noNote: true })) + runsOnField() + wcField({ source: 'Release notes', folder: 'Project folder', base: 'main' }), `${btn('Cancel', { act: 'close', focus: 'cancel' })}${btn('Start the Devin thread', { act: 'close', primary: true, focus: 'start' })}`)
  if (!S.closed && v === 'C') o.tools = { tile: 'lineage', title: 'Lineage', sub: 'Release notes', body: `<div class="lineage">${parentNode('devin', 'Release notes', true, 'Devin · Project folder · <code>main</code>')}<div class="edge dashed"><span class="k">Handover up to Devin’s reply, 10:20 am.</span> ${ledgerHtml('devin', { to: 'Devin' })}</div>
    <div class="node draft"><span class="pin">${ic.fork}</span><div class="nt"><span class="t">New Devin thread</span><span class="here">not started</span></div>${runsOnField()}${wcField({ source: 'Release notes', folder: 'Project folder', base: 'main' })}<div class="nacts">${btn('Start the Devin thread', { primary: true, act: 'close', focus: 'start' })}${btn('Cancel', { act: 'close' })}</div></div></div>`, foot: 'workshop · <code>main</code> · Project folder' }
  o.readout = [['Thread', 'Release notes · Devin'], ['Fork at', 'Devin’s reply, 10:20 am'], ['Route', 'handover only: Devin has no fork of its own']]
  return o
}

/* ---------- surface 3: bring changes back ---------- */
const CHILD_T = { p: 'codex', title: 'WAV mid-chunk test', wc: 'New worktree', branch: 'sotto/wav-mid-chunk', wcIcon: 'folder' }
const childBody = () => handoverMsg('thread', '2:05 pm', '<b>WAV preview stall</b> on Claude Code, stopped at its usage limit', 'Codex')
  + userMsg('2:05 pm', 'Add a test for a stream that ends mid-chunk, and fix what it finds.') + work(['Worked for 4m 02s', 'Changed 2 files'])
  + reply('codex', '2:09 pm', '<p>The new test failed: the last partial chunk was dropped when a stream ended inside it. Fixed, and committed as 3 commits on sotto/wav-mid-chunk.</p>')
const OUT = {
  ready: null,
  'ff-done': { tone: 'ok', title: 'Brought 3 commits to main.', body: 'Git fast-forwarded main to a41c2e9; nothing else changed. WAV preview stall works on main in the project folder and sees them now.', cta: 'Open WAV preview stall' },
  'merge-ask': { tone: 'ask', title: 'Make a merge commit on main?', body: 'main has 2 commits that sotto/wav-mid-chunk doesn’t, so Git can’t fast-forward. Sotto can make a merge commit on main that brings in this branch’s 3 commits. Nothing is rebased or forced, and this worktree stays as it is.' },
  merged: { tone: 'ok', title: 'Brought 3 commits to main with a merge commit.', body: 'Merge commit 7c0e1d4 on main: “Merge branch ’sotto/wav-mid-chunk’ into main”.', cta: 'Open WAV preview stall' },
  conflict: { tone: 'error', title: 'Nothing was brought to main, and main is unchanged.', body: 'Git found a conflict, and Sotto doesn’t resolve conflicts. Ask this thread to merge main into its branch and resolve it, then try again. Git said:', said: 'CONFLICT (content): Merge conflict in src/main/audio/wavStream.ts' },
  'parent-dirty': { tone: 'error', title: 'Nothing was brought to main.', body: 'main is checked out in the project folder, which has uncommitted changes in 1 file, so Sotto didn’t touch it. Commit or set them aside in WAV preview stall, then try again.', cta: 'Open WAV preview stall' },
  nothing: null,
}
function outcomeNotice(st, where) {
  const x = OUT[st]
  if (!x || S.closed) return ''
  const icon = x.tone === 'error' ? ic.alert : x.tone === 'ask' ? ic.merge : ic.check
  const acts = x.tone === 'ask'
    ? `${btn('Make merge commit', { primary: true, act: 'go:merged', focus: 'start' })}${btn(where === 'B' ? 'Not now' : 'Cancel', { act: 'close' })}`
    : x.cta ? btn(x.cta, { small: true, act: 'close' }) : ''
  if (where === 'C') return `<div class="say" ${x.tone === 'error' ? 'data-tone="error" role="alert"' : x.tone === 'ask' ? 'data-tone="ask"' : 'role="status"'}><p><strong>${x.title}</strong> ${x.body}</p>${x.said ? `<pre class="git-said">${x.said}</pre>` : ''}<div class="nacts">${acts}</div></div>`
  return `<div class="notice" ${x.tone === 'error' ? 'data-tone="error" role="alert"' : x.tone === 'ask' ? 'data-tone="ask"' : 'role="status"'}>${icon}<div class="txt"><p><strong>${x.title}</strong> ${x.body}</p>${x.said ? `<pre class="git-said">${x.said}</pre>` : ''}</div><div class="nacts">${acts}<button type="button" class="x" data-act="close" aria-label="Dismiss">${ic.x}</button></div></div>`
}
function scene3() {
  const v = S.variant, st = S.state
  const rows = [{ id: 'src', title: 'WAV preview stall', p: 'claude', time: '3:58 pm', status: 'Continued' }, { id: 'child', title: 'WAV mid-chunk test', p: 'codex', time: '2:09 pm', status: 'Done' }]
  const o = { rows, selected: 'child', thread: CHILD_T, body: childBody(), composer: { p: 'codex', model: 'GPT-5.5', toolbar: btoolbar('New worktree', 'sotto/wav-mid-chunk') } }
  const ahead = !['ff-done', 'merged', 'nothing'].includes(st)
  o.readout = [['Child', 'WAV mid-chunk test · Codex · new worktree on sotto/wav-mid-chunk, made from main'],
    ['Branch', st === 'nothing' || st === 'ff-done' || st === 'merged' ? 'main has every commit' : `3 commits main doesn’t have${st === 'merge-ask' || st === 'merged' ? '; main has 2 it doesn’t' : ''}`],
    ['Worktree', st === 'dirty' ? '2 uncommitted files' : 'clean'], ['Project folder (main)', st === 'parent-dirty' ? '1 uncommitted file' : 'clean']]
  if (v === 'A') {
    const canBring = !['ff-done', 'merged', 'nothing', 'dirty'].includes(st)
    const hint = st === 'dirty' ? 'This worktree has uncommitted changes in 2 files. Commit them first.' : st === 'nothing' || st === 'ff-done' || st === 'merged' ? 'main already has every commit on sotto/wav-mid-chunk.' : '3 commits from sotto/wav-mid-chunk.'
    const gitMenu = (st === 'ready' || st === 'dirty' || st === 'nothing') && !S.closed ? menu([[mi('Bring changes to main', 'merge', { act: canBring ? 'go:ff-done' : undefined, disabled: !canBring, hint, focus: 'mi-bring' })], [mi('Commit', 'check', { disabled: st !== 'dirty', hint: st !== 'dirty' ? 'No changes to commit.' : undefined }), mi('Push', 'up'), mi('Create PR', 'branch', { disabled: st === 'dirty', hint: st === 'dirty' ? 'Commit local changes before creating a PR.' : undefined })]], 'More Git actions') : null
    o.git = st === 'dirty' ? { label: 'Commit', icon: 'check' } : canBring ? { label: 'Bring changes to main', icon: 'merge', act: st === 'ready' ? 'go:ff-done' : 'close', lit: true } : { label: 'Commit', icon: 'check' }
    o.git.menu = gitMenu
    if (st === 'merge-ask' && !S.closed) o.dialog = dialog('Make a merge commit on main?', '', `<p class="lede">${OUT['merge-ask'].body}</p><p class="fine">Merge branch ’sotto/wav-mid-chunk’ into main</p>`, `${btn('Cancel', { act: 'close', focus: 'cancel' })}${btn('Make merge commit', { act: 'go:merged', primary: true, focus: 'start' })}`)
    else o.composer.above = `<div aria-live="polite">${outcomeNotice(st, 'A')}</div>`
    return o
  }
  o.git = { label: st === 'dirty' ? 'Commit' : ahead ? 'Push & create PR' : 'Commit', icon: st === 'dirty' || !ahead ? 'check' : 'up' }
  if (v === 'B') {
    let strip = ''
    if (st === 'dirty' && !S.closed) strip = `<div class="notice" role="region" aria-label="Bring changes back">${ic.merge}<div class="txt"><p><strong>sotto/wav-mid-chunk</strong> has 3 commits that <strong>main</strong> doesn’t, and 2 files changed since. Commit them first; Sotto won’t bring back uncommitted work.</p></div><div class="nacts">${btn('Commit…', { small: true, act: 'close' })}${btn('Bring changes to main', { disabled: true, title: 'Commit the 2 changed files first.' })}</div></div>`
    else if (st === 'ready' && !S.closed) strip = `<div class="notice" role="region" aria-label="Bring changes back">${ic.merge}<div class="txt"><p><strong>sotto/wav-mid-chunk</strong> has 3 commits that <strong>main</strong> doesn’t. main is checked out in the project folder, where WAV preview stall works.</p></div><div class="nacts">${btn('Bring changes to main', { primary: true, act: 'go:ff-done', focus: 'bring' })}<button type="button" class="x" data-act="close" aria-label="Hide until there are new commits">${ic.x}</button></div></div>`
    else strip = outcomeNotice(st, 'B')
    o.composer.above = `<div aria-live="polite">${strip}</div>`
    return o
  }
  // C
  const childStatus = st === 'dirty' ? '3 commits main doesn’t have · 2 uncommitted files' : ahead ? '3 commits main doesn’t have · nothing uncommitted' : st === 'nothing' ? 'main has every commit from this branch' : 'Its 3 commits are in main'
  const bringBtn = st === 'ready' || st === 'conflict' || st === 'parent-dirty' ? btn('Bring changes to main', { primary: true, icon: ics('merge', 15), act: st === 'ready' ? 'go:ff-done' : 'close', focus: 'bring' }) : st === 'dirty' ? btn('Bring changes to main', { icon: ics('merge', 15), disabled: true }) : ''
  const edgeBack = st === 'ff-done' ? '<div class="edge"><span class="k">Brought back, 4:31 pm.</span> 3 commits to main, by fast-forward.</div>' : st === 'merged' ? '<div class="edge"><span class="k">Brought back, 4:33 pm.</span> 3 commits to main, with merge commit 7c0e1d4.</div>' : ''
  o.tools = { tile: 'lineage', title: 'Lineage', sub: 'WAV mid-chunk test', body: `<div class="lineage">
    <div class="node"><span class="pin">${pm('claude', 16)}</span><div class="nt"><span class="t">WAV preview stall</span>${btn('Open', { small: true, act: 'close', aria: 'Open WAV preview stall' })}</div><div class="nm">Claude Code · Opus 5.5</div><div class="nm">${ics('folder', 13)} Project folder · <code>main</code>${st === 'parent-dirty' ? ' · 1 uncommitted file' : ''}</div></div>
    <div class="edge"><span class="k">Continued in, 2:05 pm,</span> in a new worktree from main. Handover: carried 4 messages; left out one long reply, 1 image and 9 tool calls.</div>
    <div class="node" data-here><span class="pin">${pm('codex', 16)}</span><div class="nt"><span class="t">WAV mid-chunk test</span><span class="here">This thread</span></div><div class="nm">Codex · GPT-5.5</div><div class="nm">${ics('folder', 13)} New worktree · <code>sotto/wav-mid-chunk</code></div>
      <div class="ns">${childStatus}</div>${bringBtn || st === 'dirty' ? `<div class="nacts">${bringBtn}${st === 'dirty' ? '<span class="fine" style="margin:0">Commit the 2 changed files first.</span>' : ''}</div>` : ''}${outcomeNotice(st, 'C')}</div>${edgeBack}
    ${edgeBack ? `<div class="node"><span class="pin">${ics('branch', 16)}</span><div class="nt"><span class="t">main</span></div><div class="nm">Now at ${st === 'merged' ? '7c0e1d4' : 'a41c2e9'}, in the project folder</div></div>` : ''}</div>`, foot: 'workshop · <code>sotto/wav-mid-chunk</code> · New worktree' }
  return o
}

/* ---------- render ---------- */
function render() {
  const [w, h] = S.size.split('x').map(Number)
  document.documentElement.dataset.theme = S.theme
  const o = S.surface === '1' ? scene1() : S.surface === '2' ? scene2() : scene3()
  if (S.toolsOverride === false) o.tools = null
  const narrow = w <= 820
  S._toolsOpen = !!o.tools
  S._sideHidden = narrow && !!o.tools
  const win = document.getElementById('window')
  win.style.setProperty('--w', w + 'px'); win.style.setProperty('--h', h + 'px')
  win.style.setProperty('--side', S._sideHidden ? '0px' : narrow ? '210px' : w >= 1600 ? '300px' : '280px')
  win.style.setProperty('--tools-w', narrow ? '330px' : w >= 1600 ? '520px' : '440px')
  win.style.setProperty('--fit', String(Math.min(1, (innerWidth - 16) / w)))
  win.dataset.tools = o.tools ? '1' : '0'
  if (h <= 600) win.dataset.short = ''; else delete win.dataset.short
  if (narrow) win.dataset.narrow = ''; else delete win.dataset.narrow
  const scrollBox = `<div class="scroll" id="scroll"><div class="col" ${o.fill ? 'style="height:100%"' : ''}>${o.body}</div></div>`
  win.innerHTML = `${sidebar(o.rows, o.selected)}
    <section class="pane" aria-label="${esc(o.thread.title)}">${paneHead(o.thread, { git: o.git ?? (S.surface === '3' ? null : { label: 'Commit', icon: 'check' }), menu: o.menu, link: o.link })}${scrollBox}${composer(o.composer)}</section>
    ${o.tools ? tools(o.tools) : '<span></span>'}
    <div class="winctl" aria-hidden="true"><span>–</span><span>□</span><span>×</span></div>${o.dialog ?? ''}`
  // keep transcript at the end, or at the fork point
  const sc = document.getElementById('scroll')
  const point = o.scrollTo && document.getElementById(o.scrollTo)
  if (point) sc.scrollTop = Math.max(0, point.offsetTop - sc.offsetTop - 60)
  else sc.scrollTop = sc.scrollHeight
  const tb = win.querySelector('.tools-body')
  const here = tb?.querySelector('[data-scroll-here]')
  if (here) {
    const t = here.getBoundingClientRect(), b = tb.getBoundingClientRect()
    const below = t.bottom - b.bottom + 12
    if (below > 0) tb.scrollTop += Math.min(below, t.top - b.top - 8)
  }
  // bars
  document.querySelectorAll('[data-surface]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.surface === S.surface)))
  const sel = document.getElementById('state')
  sel.innerHTML = STATES[S.surface].map(([id, l]) => `<option value="${id}" ${id === S.state ? 'selected' : ''}>${l}</option>`).join('')
  document.getElementById('label').textContent = `${S.variant} — ${VARIANTS[S.variant]}`
  document.getElementById('theme').textContent = S.theme === 'dark' ? 'Light' : 'Dark'
  document.getElementById('theme').setAttribute('aria-label', `Switch to ${S.theme === 'dark' ? 'light' : 'dark'}`)
  document.getElementById('size').value = S.size
  document.getElementById('readout').innerHTML = (o.readout ?? []).map(([k, v]) => `<b>${k}</b> ${v}`).join(' &nbsp;·&nbsp; ')
  const url = new URL(location.href)
  Object.entries({ surface: S.surface, state: S.state, variant: S.variant, theme: S.theme, size: S.size }).forEach(([k, v]) => url.searchParams.set(k, v))
  history.replaceState(null, '', url)
  // focus: what the last press asked for, else the first thing a dialog or menu holds
  const want = S.focus && win.querySelector(`[data-focus="${S.focus}"]`)
  if (want) want.focus()
  else {
    // What just opened takes focus: a menu's first row, else the first control of a dialog, a draft or an inline form.
    const opened = win.querySelector('.menu') ?? win.querySelector('.dialog, .node.draft, .ainline, .fork-inline, .cont')
    // Continuing from the composer (B) puts focus where the next words go: its send button.
    const target = opened?.matches('.cont') ? win.querySelector('.send.wide') : opened?.querySelector(opened.matches('.menu') ? '.mi:not([aria-disabled])' : 'button:not([aria-disabled]), [tabindex="0"]')
    target?.focus({ preventScroll: true })
  }
  S.focus = null
}

function go(state) {
  S.state = state; S.closed = false; S.read = false; S.toolsOverride = undefined
  // Each route starts on its own provider: a Codex agent forks on Codex, a Claude agent's handover defaults to Claude Code,
  // and continuing a Claude thread defaults to the first provider that isn't Claude Code.
  if (state === 'codex-choose') { S.target = 'codex'; S.model = 'GPT-5.5' }
  else if (state === 'claude-choose') { S.target = 'claude'; S.model = 'Sonnet 5.5' }
  else if (S.surface === '1' && (S.target === 'claude' || P[S.target].off)) { S.target = 'codex'; S.model = 'GPT-5.5' }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]')
  if (!t || !document.getElementById('window').contains(t)) return
  const [act, a1, a2] = t.dataset.act.split(':')
  if (act === 'go') { go(a1); S.focus = null }
  else if (act === 'close') { S.closed = true; S.focus = 'pane-more' }
  else if (act === 'read') { S.read = !S.read; S.focus = 'read' }
  else if (act === 'pick-p') { S.target = a1; S.model = P[a1].models[0]; S.focus = `p-${a1}` }
  else if (act === 'pick-m') { S.model = a1; S.focus = `m-${a1}` }
  else if (act === 'pick-wc') { S.wc = a1; S.focus = `wc-${a1}` }
  else if (act === 'cycle-wc') { S.wc = S.wc === 'same' ? 'new' : 'same'; S.focus = 'wc-chip' }
  else if (act === 'b-pick') { S.target = a1; S.model = a2; go('choose'); S.focus = 'send' }
  else if (act === 'pane-menu') {
    if (S.surface === '1' && S.variant !== 'B') { if (['menu', 'busy', 'empty'].includes(S.state) && !S.closed) S.closed = true; else if (['busy', 'empty'].includes(S.state)) S.closed = false; else go('menu') }
    S.focus = S.closed ? 'pane-more' : null
  }
  else if (act === 'model-menu') {
    if (S.surface === '1' && S.variant === 'B') { if (['menu', 'busy', 'empty'].includes(S.state) && !S.closed) S.closed = true; else if (['busy', 'empty'].includes(S.state)) S.closed = false; else go('menu') }
    S.focus = S.closed ? 'model-chip' : null
  }
  else if (act === 'git-menu') { if (S.surface === '3' && S.variant === 'A') { if (['ready', 'dirty', 'nothing'].includes(S.state)) S.closed = !S.closed }; S.focus = 'git-more' }
  else if (act === 'fork') { S.surface = '2'; go('fork-choose') }
  else if (act === 'tools') { S.toolsOverride = S._toolsOpen ? false : undefined; S.focus = 'tools-toggle' }
  else if (act === 'tile') { /* surfaces other than these are not part of the question */ }
  render()
})
document.addEventListener('keydown', e => {
  const inWindow = document.getElementById('window').contains(document.activeElement)
  if (e.key === 'Escape') {
    const open = document.querySelector('#window .menu, #window .dialog, #window .cont, #window .ainline, #window .fork-inline, #window .node.draft, #window .notice[data-tone="ask"], #window .say[data-tone="ask"]')
    if (open) { e.preventDefault(); S.closed = true; S.focus = document.querySelector('#window .dialog') ? 'pane-more' : (document.querySelector('#window .menu.above') ? 'model-chip' : 'pane-more'); render() }
    return
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    const list = document.activeElement?.closest('.menu')
    if (!list) return
    const items = [...list.querySelectorAll('.mi:not([aria-disabled])')]
    if (!items.length) return
    e.preventDefault()
    const i = items.indexOf(document.activeElement)
    items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus()
    return
  }
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return
  const el = document.activeElement
  if (el && (el.matches('input, textarea, select, [contenteditable]') || el.closest('[role="radiogroup"], [role="menu"]'))) return
  if (inWindow && el?.closest('.dialog')) return
  const keys = Object.keys(VARIANTS)
  S.variant = keys[(keys.indexOf(S.variant) + (e.key === 'ArrowRight' ? 1 : -1) + keys.length) % keys.length]
  S.closed = false; S.toolsOverride = undefined
  render()
})
document.querySelectorAll('[data-surface]').forEach(b => b.addEventListener('click', () => { S.surface = b.dataset.surface; go(STATES[S.surface][0][0]); render() }))
document.getElementById('state').addEventListener('change', e => { go(e.target.value); render() })
document.getElementById('prev').addEventListener('click', () => { const k = Object.keys(VARIANTS); S.variant = k[(k.indexOf(S.variant) + 2) % 3]; S.closed = false; S.toolsOverride = undefined; render() })
document.getElementById('next').addEventListener('click', () => { const k = Object.keys(VARIANTS); S.variant = k[(k.indexOf(S.variant) + 1) % 3]; S.closed = false; S.toolsOverride = undefined; render() })
document.getElementById('theme').addEventListener('click', () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; render() })
document.getElementById('size').addEventListener('change', e => { S.size = e.target.value; render() })
addEventListener('resize', () => render())
render()
</script>
