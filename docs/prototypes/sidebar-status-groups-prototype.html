<!doctype html>
<!-- PROTOTYPE — throwaway. Question: what should the Threads sidebar look like grouped by status, the iPhone's way?
     Zach's picks (November 10, 2026): a choice in Settings with status groups the new default; the iPhone's groups
     exactly (Needs you, Working now, Recent, then Snoozed and Settled folded); Needs you is the first group and a waiting
     row pops the same card the Needs you card pops today; projects show on the row only.
     Undecided, so drawn three ways: A = the iPhone's rows; B = today's desktop rows, grouped; C = live cards over a quiet
     list. The bar on top compares: today's project folders, the collapsed rail (status or project trays), a remote host
     connected, light and dark. Same twenty threads in every view. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sidebar by status — prototype</title>
<style>
@font-face{font-family:'Manrope';font-weight:200 800;src:url('manrope-latin.woff2') format('woff2')}
:root{
  --canvas:oklch(0.115 0.008 265);--pane:oklch(0.145 0.008 265);--sidebar:oklch(0.205 0.004 265);--card:oklch(0.245 0.006 265);
  --inset:oklch(0.29 0.008 265);--text:oklch(0.985 0.005 280);--text2:oklch(0.86 0.01 265);--muted:oklch(0.72 0.014 265);
  --hair:oklch(0.305 0.02 265);--accent:oklch(0.714 0.104 183);--accent-surface:oklch(0.32 0.05 185);--attn:oklch(0.829 0.171 81);
  --attn-ring:oklch(0.772 0.173 65);--danger:oklch(0.702 0.189 22);--success:oklch(0.76 0.15 155);--activity:oklch(0.714 0.104 183);
  --btn:oklch(0.27 0.006 265);--pop:oklch(0.235 0.006 265);--shadow:0 12px 32px rgba(0,0,0,.55);--tray:color-mix(in oklch,var(--accent) 8%,transparent);
  --tray-edge:color-mix(in oklch,var(--accent) 24%,transparent);
}
body.light{
  --canvas:oklch(0.978 0.004 85);--pane:oklch(0.99 0.003 85);--sidebar:oklch(0.945 0.007 85);--card:oklch(0.975 0.004 85);
  --inset:oklch(0.91 0.01 85);--text:oklch(0.235 0.014 75);--text2:oklch(0.36 0.014 75);--muted:oklch(0.47 0.014 75);
  --hair:oklch(0.86 0.012 80);--accent:oklch(0.53 0.095 186);--accent-surface:oklch(0.9 0.04 186);--attn:oklch(0.5 0.155 45);
  --attn-ring:oklch(0.6 0.16 50);--danger:oklch(0.51 0.209 28);--success:oklch(0.5 0.13 155);--activity:oklch(0.53 0.095 186);
  --btn:oklch(0.93 0.01 85);--pop:oklch(0.99 0.003 85);--shadow:0 12px 32px rgba(60,40,20,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--canvas);color:var(--text);font:14px/1.35 Manrope,Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.proto-bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 12px;background:#111;color:#eee;font-size:12.5px;border-bottom:1px solid #333}
.proto-bar b{font-weight:700;color:#ffcf5a;letter-spacing:.02em}
.proto-bar .seg{display:inline-flex;border:1px solid #444;border-radius:6px;overflow:hidden}
.proto-bar .seg button{background:#1d1d1d;border:0;padding:4px 9px;cursor:pointer;color:#ccc}
.proto-bar .seg button[aria-pressed=true]{background:#e9e9e9;color:#111;font-weight:600}
.proto-bar label{display:inline-flex;gap:6px;align-items:center;color:#bbb}
.stage{display:flex;justify-content:center;padding:18px 12px 110px}
.window{display:flex;width:1080px;height:720px;max-width:100%;border:1px solid var(--hair);border-radius:10px;overflow:hidden;background:var(--pane);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sidebar{position:relative;flex:none;width:280px;display:flex;flex-direction:column;background:var(--sidebar);border-right:1px solid var(--hair)}
.top{display:flex;align-items:center;gap:6px;padding:10px 10px 8px}
.top .logo{width:22px;height:22px;border-radius:6px;background:var(--accent);margin-right:auto}
.icon-btn{width:28px;height:28px;display:grid;place-items:center;border:0;background:transparent;border-radius:6px;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--btn);color:var(--text)}
.search-row{display:flex;gap:6px;padding:0 8px 8px}
.search{flex:1;display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--hair);border-radius:7px;color:var(--muted);font-size:13px;background:color-mix(in oklch,var(--canvas) 40%,transparent)}
.computers{display:flex;align-items:center;gap:6px;height:32px;padding:0 8px;border:1px solid var(--hair);border-radius:7px;background:transparent;font-size:12.5px;color:var(--text2);cursor:pointer;white-space:nowrap}
.computers i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.list{flex:1;overflow:auto;padding:2px 4px 8px}
.foot{display:flex;gap:4px;align-items:center;padding:8px 10px;border-top:1px solid transparent;color:var(--muted)}
.foot span{width:28px;height:28px;display:grid;place-items:center;border-radius:6px}
.foot span.on{background:var(--btn);color:var(--text)}
.pane{flex:1;display:flex;flex-direction:column;min-width:0}
.pane-head{display:flex;align-items:center;gap:10px;height:44px;padding:0 18px;border-bottom:1px solid var(--hair);font-weight:600}
.pane-head small{color:var(--muted);font-weight:500}
.pane-body{flex:1;padding:22px 26px;color:var(--text2);display:flex;flex-direction:column;gap:14px}
.bubble{align-self:flex-end;max-width:70%;background:var(--card);border-radius:12px;padding:12px 16px}
.ghost-line{height:10px;border-radius:5px;background:var(--inset);opacity:.6}
.composer{margin:0 18px 16px;height:74px;border-radius:14px;background:var(--card);color:var(--muted);padding:14px 16px}
.mark{display:inline-block;flex:none;fill:currentColor;color:var(--text2)}
.mark[data-p=claude]{color:oklch(0.7 0.13 45)}
body.light .mark[data-p=claude]{color:oklch(0.58 0.14 45)}
.ring{flex:none;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--hair)}
.ring[data-s=needs]{border:2px solid var(--attn-ring)}
.ring[data-s=failed]{border:2px solid var(--danger)}
.ring[data-s=working]{border:1.5px solid color-mix(in oklch,var(--activity) 26%,transparent);border-top-color:var(--activity);animation:spin 1.5s linear infinite}
.ring[data-s=unread]{border:1.5px solid var(--success);background:radial-gradient(circle,var(--success) 0 28%,transparent 30%)}
.ring[data-s=off]{border:1.5px solid var(--hair);opacity:.9}
@keyframes spin{to{rotate:360deg}}
@media (prefers-reduced-motion:reduce){.ring{animation:none!important}}
body.still .ring{animation:none!important}
/* group headings */
.group{margin-top:6px}
.group:first-child{margin-top:0}
.gh{display:flex;align-items:baseline;gap:6px;padding:10px 10px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.gh .n{font-weight:500;font-variant-numeric:tabular-nums}
.gh.toggle{width:100%;border:0;background:transparent;cursor:pointer;text-align:left;border-radius:6px}
.gh.toggle:hover{background:color-mix(in oklch,var(--btn) 60%,transparent);color:var(--text)}
.chev{display:inline-block;transition:rotate .15s;width:12px}
[aria-expanded=true] .chev{rotate:90deg}
/* rows */
.row{position:relative;display:grid;grid-template-columns:18px minmax(0,1fr) auto;column-gap:8px;row-gap:2px;align-items:center;width:100%;padding:7px 10px 7px 10px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:left;cursor:pointer}
.row:hover{background:color-mix(in oklch,var(--btn) 70%,transparent)}
.row.current{background:var(--accent-surface);border-color:color-mix(in oklch,var(--accent) 55%,transparent)}
.row .ring{justify-self:center}
.row .t{grid-column:2;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.row .when{grid-column:3;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .l2{grid-column:2/4;display:flex;align-items:center;gap:6px;min-width:0;font-size:12px;color:var(--muted)}
.row .l2 .txt{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .l2 .st{margin-left:auto;white-space:nowrap}
.row .l2 .st[data-s=needs]{color:var(--attn)}
.row .l2 .st[data-s=working]{color:var(--activity)}
.row .l2 .st[data-s=unread]{color:var(--success)}
.row .l2 .st[data-s=failed],.row .l2 .txt.failed{color:var(--danger)}
.row .l3{grid-column:2/4;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.rest .t{color:var(--text2);font-weight:450}
.row.oneline{padding-block:5px}
.row.muted .t{color:var(--text2);font-size:13px}
.row .l2 .dismiss{color:var(--text2);font-weight:600;cursor:pointer}
.row .dismiss:hover{color:var(--text)}
.unread .t{font-weight:700}
.owl{display:inline-block;width:12px;height:12px;flex:none}
/* variant C cards */
.cards{display:grid;gap:6px;padding:2px 4px}
.card{display:grid;grid-template-columns:18px minmax(0,1fr) auto;column-gap:8px;row-gap:3px;align-items:center;padding:9px 10px;border-radius:10px;background:var(--card);border:1px solid transparent;text-align:left;cursor:pointer;width:100%}
.card.current{border-color:color-mix(in oklch,var(--accent) 55%,transparent);background:var(--accent-surface)}
.card .t{grid-column:2;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .when{grid-column:3;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .say{grid-column:2/4;font-size:12.5px;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .l2{grid-column:2/4;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);min-width:0;white-space:nowrap}
.card .l2 .pl{min-width:0;overflow:hidden;text-overflow:ellipsis}
.card .l2 .st{margin-left:auto}
.card .l2 .st[data-s=needs]{color:var(--attn);font-weight:600}
.card .l2 .st[data-s=working]{color:var(--activity)}
.dense .row{padding-block:4px}
.dense .row .proj{grid-column:3;font-size:12px;color:var(--muted);margin-right:0}
/* shelves */
.shelf{display:flex;align-items:center;gap:6px;width:100%;padding:8px 10px;border:0;background:transparent;color:var(--text2);font-weight:500;cursor:pointer;border-radius:6px;margin-top:6px}
.shelf:hover{background:color-mix(in oklch,var(--btn) 60%,transparent)}
.shelf .n{color:var(--muted);font-weight:500;margin-left:2px}
.sub{padding:6px 10px 2px 28px;font-size:11.5px;color:var(--muted);font-weight:600}
/* today: folders */
.folder-head{display:flex;align-items:center;gap:7px;width:100%;padding:8px 10px;border:0;background:transparent;cursor:pointer;font-weight:600;color:var(--text);border-radius:6px}
.folder-head:hover{background:color-mix(in oklch,var(--btn) 60%,transparent)}
.folder-head .cnt{margin-left:auto;color:var(--muted);font-weight:500;font-size:12px}
.hostbadge{font-size:10.5px;font-weight:600;color:var(--text2);background:var(--inset);border-radius:4px;padding:0 5px}
.needs-card{margin:0 8px 8px;padding:6px 4px 4px;border-radius:10px;background:var(--card)}
.needs-card h4{margin:2px 8px 4px;font-size:12px;color:var(--muted);font-weight:600}
.needs-card .e{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:13px;border-radius:6px;cursor:pointer}
.needs-card .e:hover{background:var(--btn)}
.needs-card .e .w{margin-left:auto;font-size:12px;color:var(--muted)}
.needs-card .e .a{font-size:12px;font-weight:600;color:var(--text);background:var(--btn);border-radius:6px;padding:2px 8px}
.inq{color:var(--muted)!important}
/* rail */
.rail{width:64px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;background:var(--sidebar);border-right:1px solid var(--hair);overflow:auto}
.tile{position:relative;width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:9px;background:var(--card);border:1px solid var(--hair);cursor:pointer}
.tile.small{width:30px;height:30px;opacity:.85}
.tile.waiting{border-color:var(--attn-ring)}
.tile.current{border-color:color-mix(in oklch,var(--accent) 70%,transparent);background:var(--accent-surface)}
.tile .ring{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;background:var(--sidebar)}
.tray{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 5px;border-radius:12px;background:var(--tray);border:1px solid var(--tray-edge);width:52px}
.tray.rest{background:transparent;border-color:transparent}
.tray .lab{font-size:8.5px;font-weight:700;color:var(--muted);text-align:center;line-height:1.1;max-width:46px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.watcher{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--inset);border:1px solid var(--hair)}
/* popover */
.pop{position:absolute;z-index:20;width:330px;padding:14px 16px;border-radius:12px;background:var(--pop);border:1px solid var(--hair);box-shadow:var(--shadow)}
.pop h5{margin:0 0 4px;font-size:13px}
.pop p{margin:0 0 10px;color:var(--muted);font-size:12.5px}
.pop code{display:block;padding:8px 10px;border:1px solid var(--hair);border-radius:7px;font:12px ui-monospace,monospace;margin-bottom:10px;color:var(--text)}
.pop .btns{display:flex;gap:8px}
.pop .btns button{border:1px solid var(--hair);background:transparent;border-radius:7px;padding:5px 14px;font-weight:600;cursor:pointer}
.pop .btns button.pri{background:var(--text);color:var(--pane);border-color:var(--text)}
.pop .btns .open{margin-left:auto;border:0;color:var(--muted);font-weight:500}
/* settings sheet */
.sheet{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(0,0,0,.45)}
.sheet.on{display:grid}
.sheet .box{width:min(460px,92vw);background:var(--pane);border:1px solid var(--hair);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow)}
.sheet h3{margin:0 0 2px;font-size:15px}
.sheet .crumb{color:var(--muted);font-size:12px;margin-bottom:14px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:8px;border:1px solid var(--hair);margin-bottom:8px;cursor:pointer}
.opt input{margin-top:3px}
.opt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.state{max-width:1080px;margin:10px auto 0;color:#999;font:12px/1.5 ui-monospace,monospace;padding:0 12px}
/* switcher */
.switch{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:4px;padding:5px;border-radius:999px;background:#fafafa;color:#111;box-shadow:0 6px 24px rgba(0,0,0,.45);font-size:13px}
.switch button{width:34px;height:34px;border-radius:50%;border:0;background:#111;color:#fff;font-size:16px;cursor:pointer}
.switch span{padding:0 12px;font-weight:600;white-space:nowrap}
@media (max-width:760px){
  .window{width:100%;height:auto;min-height:640px}
  .pane{display:none}
  .sidebar{width:100%;border-right:0}
  .rail+.pane{display:flex}
  .stage{padding:10px 6px 110px}
  .pop{width:calc(100% - 24px);left:12px!important}
}
</style></head>
<body>
<div class="proto-bar">
  <b>PROTOTYPE</b>
  <span class="seg" id="mode"><button data-v="status">Status groups</button><button data-v="projects">Project folders (today)</button></span>
  <span class="seg" id="side"><button data-v="open">Sidebar open</button><button data-v="rail">Collapsed rail</button></span>
  <span class="seg" id="trays"><button data-v="status">Rail: status trays</button><button data-v="project">Rail: project trays</button></span>
  <span class="seg" id="waitrows"><button data-v="listed">D: waiting rows also in Recent</button><button data-v="card">D: card only</button></span>
  <label><input type="checkbox" id="remote" checked> forge connected</label>
  <span class="seg" id="theme"><button data-v="dark">Dark</button><button data-v="light">Light</button></span>
  <button id="settings" style="background:#1d1d1d;border:1px solid #444;border-radius:6px;padding:4px 9px;cursor:pointer;color:#ccc">Settings › Threads</button>
</div>
<div class="stage"><div class="window" id="win"></div></div>
<div class="state" id="state"></div>
<div class="sheet" id="sheet"><div class="box">
  <h3>Group threads</h3><div class="crumb">Settings › Threads</div>
  <label class="opt"><input type="radio" name="g" value="status"><span><b>By status</b> (default)<small>Needs you, Working now and Recent, as on the iPhone. Each row names its project.</small></span></label>
  <label class="opt"><input type="radio" name="g" value="projects"><span><b>By project</b><small>A folder for each project, as before.</small></span></label>
  <div style="text-align:right;margin-top:6px"><button id="close-sheet" style="border:1px solid var(--hair);background:var(--btn);border-radius:7px;padding:5px 14px;cursor:pointer">Done</button></div>
</div></div>
<div class="switch"><button id="prev" aria-label="Previous variant">‹</button><span id="vlabel"></span><button id="next" aria-label="Next variant">›</button></div>

  const rows = T.filter(visible);
  const needs = rows.filter(th => th.s.startsWith('needs') || th.s === 'failed');
  const card = needs.length ? `<div class="needs-card"><h4>Needs you ${needs.length}</h4>${needs.map(th => `<div class="e" ${pressRow(th)}><span class="ring" data-s="${ringOf(th)}"></span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(th.t)}</span>${th.s==='failed'?'<span class="w">Dismiss</span>':'<span class="a">Answer</span>'}</div>`).join('')}</div>` : '';
  const projects = [...new Set(rows.filter(th => !['snoozed','settled'].includes(th.s)).map(th => th.p + '|' + (th.h||'')))];
  const folders = projects.map(key => {
    const [p, h] = key.split('|');
    const fr = rows.filter(th => th.p === p && (th.h||'') === h && !['snoozed','settled'].includes(th.s));
    const id = key; const open = S.folders[id] ?? S.folders[p] ?? false;
    return `<button class="folder-head" data-folder="${esc(id)}"><span class="chev" style="rotate:${open?90:0}deg">›</span>🗀 ${esc(p)} ${h && S.remote ? `<span class="hostbadge">${esc(h)}</span>` : ''}<span class="cnt">${fr.length}</span></button>`
      + (open ? fr.map(th => {
        const inq = th.s.startsWith('needs') || th.s === 'failed';
        if (th.s === 'done') return `<button class="row rest oneline"><span></span><span class="t">${esc(th.t)}</span><span class="when">${th.at}</span></button>`;
        return `<button class="row ${th.current?'current':''}"><span class="ring" data-s="${inq?'off':ringOf(th)}"></span><span class="t">${esc(th.t)}</span><span class="when">${th.at}</span><span class="l2">${mark(th.v)}${inq?'<span class="txt inq">↑ In Needs you</span>':`<span class="txt st" data-s="${ringOf(th)}" style="margin:0">${stWords(th)}</span>`}</span></button>`;
      }).join('') : '');
  }).join('');
  return { card, list: folders + `<button class="shelf"><span class="chev">›</span>Snoozed</button><button class="shelf"><span class="chev">›</span>Settled</button>` };
}
// ---------- The collapsed rail ----------
function rail(){
  const rows = T.filter(visible).filter(th => th.s !== 'settled' && th.s !== 'snoozed' || th.current);
  const tile = (th, small) => `<button class="tile ${small?'small':''} ${th.s.startsWith('needs')?'waiting':''} ${th.current?'current':''}" title="${esc(th.t)} · ${esc(th.p)} · ${stWords(th)}" ${pressRow(th)}>${mark(th.v, small?13:16)}<span class="ring" data-s="${ringOf(th)}"></span></button>`;
  const watcher = `<div class="watcher" title="Open Watcher">${owl.replace('class="owl"','class="owl" style="width:20px;height:20px;color:var(--text2)"')}</div>`;
  const expand = `<button class="icon-btn" title="Expand sidebar">»</button>`;
  let body = '';
  const waiting = rows.filter(th => th.s.startsWith('needs') || th.s === 'failed');
  const moving = rows.filter(th => ['working','waiting','unread'].includes(th.s));
  const resting = rows.filter(th => th.s === 'done');
  if (S.trays === 'status') {
    const tray = (label, list, cls='') => list.length ? `<div class="tray ${cls}"><span class="lab">${label}</span>${list.map(th => tile(th, cls==='rest')).join('')}</div>` : '';
    body = tray('Needs you', waiting) + tray('Working', moving.filter(th=>th.s!=='unread')) + tray('Recent', [...moving.filter(th=>th.s==='unread'), ...resting], 'rest');
  } else {
    const awake = [...waiting, ...moving]; const byP = {};
    awake.forEach(th => (byP[th.p] ??= []).push(th));
    body = Object.entries(byP).map(([p, list]) => `<div class="tray"><span class="lab">${esc(p)}</span>${list.map(th => tile(th)).join('')}</div>`).join('')
      + (resting.length ? `<div class="tray rest">${resting.map(th => tile(th, true)).join('')}</div>` : '');
  }
  return `<nav class="rail">${expand}${watcher}${body}</nav>`;
}
// ---------- Pane and frame ----------
const pane = () => `<div class="pane"><div class="pane-head">Sidebar by status <small>/ Sotto</small></div><div class="pane-body">
  <div class="bubble">Make the sidebar more like the iPhone's Threads page.</div>
  <div class="ghost-line" style="width:78%"></div><div class="ghost-line" style="width:64%"></div><div class="ghost-line" style="width:70%"></div>
  <div style="flex:1"></div></div><div class="composer">Ask for follow-up changes</div></div>`;
function computers(){
  if (!S.remote || S.mode !== 'status' || S.v === 'B' || S.v === 'D') return '';
  const label = S.filter === 'all' ? 'All computers' : S.filter;
  return `<button class="computers" id="computers" title="Show threads on one computer"><i></i>${label} ▾</button>`;
}
function render(){
  document.body.classList.toggle('light', S.theme === 'light');
  const win = document.getElementById('win');
  if (S.side === 'rail') { win.innerHTML = rail() + pane(); }
  else {
    let list, card = '';
    if (S.mode === 'projects') ({ card, list } = today());
    else if (S.v === 'D') { card = today().card; list = variantD(); }
    else list = S.v === 'A' ? variantA() : S.v === 'B' ? variantB() : variantC();
    win.innerHTML = `<aside class="sidebar"><div class="top"><span class="logo"></span><button class="icon-btn" title="Add project">⊞</button><button class="icon-btn" title="New thread">✎</button><button class="icon-btn" title="Collapse sidebar">«</button></div>
      <div class="search-row"><div class="search">⌕ Search threads</div>${computers()}</div>${card}<div class="list" id="list">${list}</div>
      <div class="foot"><span>◎</span><span>◔</span><span class="on">☷</span><span style="margin-left:auto">⚙︎</span></div></aside>` + pane();
  }
  if (S.pop) drawPop();
  for (const [id, key] of [['mode','mode'],['side','side'],['trays','trays'],['theme','theme'],['waitrows','waitrows']])
    document.querySelectorAll(`#${id} button`).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S[key])));
  document.getElementById('trays').style.display = S.side === 'rail' ? '' : 'none';
  document.getElementById('waitrows').style.display = S.v === 'D' && S.mode === 'status' && S.side === 'open' ? '' : 'none';
  const v = VARIANTS.find(x => x.k === S.v);
  document.getElementById('vlabel').textContent = S.mode === 'projects' ? 'Today — project folders' : `${v.k} — ${v.name}`;
  const p = new URLSearchParams({ waitrows: S.waitrows, variant: S.v, mode: S.mode, side: S.side, trays: S.trays, theme: S.theme, remote: S.remote ? '1' : '0' });
  history.replaceState(null, '', '?' + p);
  const g = groups(S.v === 'B' ? 'recent' : 'needs');
  document.getElementById('state').textContent = `variant=${S.v} mode=${S.mode} side=${S.side} trays=${S.trays} remote=${S.remote} computers=${S.filter} pop=${S.pop ?? '-'} | Needs you ${g.needs.length} · Working now ${g.working.length} · Recent ${g.recent.length} · Snoozed ${g.snoozed.length} · Settled ${g.settled.length} | failed turn → ${S.v === 'B' ? 'Recent (iPhone rule)' : 'Needs you (desktop rule)'}`;
}
function drawPop(){
  const th = T.find(x => x.id === S.pop); const anchor = document.querySelector(`[data-pop="${S.pop}"]`);
  if (!th || !anchor) { S.pop = null; return; }
  const win = document.getElementById('win').getBoundingClientRect(), a = anchor.getBoundingClientRect();
  const pop = document.createElement('div'); pop.className = 'pop';
  pop.style.left = (S.side === 'rail' ? a.right - win.left + 8 : Math.min(a.right - win.left + 8, win.width - 342)) + 'px';
  pop.style.top = Math.max(8, a.top - win.top - 6) + 'px';
  pop.innerHTML = th.s === 'needs-approval'
    ? `<h5>Run a command in ${esc(th.p)}</h5><p>${esc(th.t)}</p><code>npm test -- tests/unit/agents</code><div class="btns"><button>Deny</button><button class="pri">Allow</button><button class="open">Open thread</button></div>`
    : `<h5>${esc(th.t)}</h5><p>Keep Privacy and Changelog in the footer, or only Privacy?</p><div class="btns"><button>Both</button><button>Only Privacy</button><button class="open">Open thread</button></div>`;
  document.getElementById('win').style.position = 'relative'; document.getElementById('win').appendChild(pop);
}
document.addEventListener('click', e => {
  const seg = e.target.closest('.proto-bar .seg button');
  if (seg) { const k = seg.parentElement.id; S[k] = seg.dataset.v; S.pop = null; return render(); }
  if (e.target.closest('.pop')) { if (e.target.tagName === 'BUTTON') { S.pop = null; render(); } return; }
  const popper = e.target.closest('[data-pop]');
  if (popper && !e.target.closest('.dismiss')) { const id = +popper.dataset.pop; S.pop = S.pop === id ? null : id; return render(); }
  const tg = e.target.closest('[data-toggle]'); if (tg) { S.open[tg.dataset.toggle] = S.open[tg.dataset.toggle] === false; return render(); }
  const sh = e.target.closest('[data-shelf]'); if (sh) { S.open[sh.dataset.shelf] = !S.open[sh.dataset.shelf]; return render(); }
  const fo = e.target.closest('[data-folder]'); if (fo) { const id = fo.dataset.folder; S.folders[id] = !(S.folders[id] ?? S.folders[id.split('|')[0]] ?? false); return render(); }
  if (e.target.closest('#computers')) { const order = ['all','laptop','forge']; S.filter = order[(order.indexOf(S.filter)+1)%3]; return render(); }
  if (e.target.id === 'settings') { document.querySelectorAll('#sheet input').forEach(i => i.checked = i.value === S.mode); document.getElementById('sheet').classList.add('on'); return; }
  if (e.target.id === 'close-sheet' || e.target.id === 'sheet') { document.getElementById('sheet').classList.remove('on'); return; }
  if (S.pop && !e.target.closest('.row,.card,.tile')) { S.pop = null; render(); }
});
document.getElementById('sheet').addEventListener('change', e => { S.mode = e.target.value; render(); });
document.getElementById('remote').addEventListener('change', e => { S.remote = e.target.checked; S.filter = 'all'; render(); });
document.getElementById('remote').checked = S.remote;
const step = d => { const i = VARIANTS.findIndex(x => x.k === S.v); S.v = VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].k; S.mode = 'status'; S.pop = null; render(); };
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1); else if (e.key === 'Escape') { S.pop = null; document.getElementById('sheet').classList.remove('on'); render(); }
});
if (q.get('still') === '1') document.body.classList.add('still');
render();
</script>
</body></html>
