* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--desk); color: var(--tt-text); font: 14px/1.4 Figtree, ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
button, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: default; }
:focus-visible { outline: 2px solid var(--tt-accent); outline-offset: 1px; }

/* What the prototype itself offers: not part of the card. */
.bench { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 10px 14px; font-size: var(--tt-type-small); color: var(--tt-text-muted); }
.bench__group { display: flex; align-items: center; gap: 2px; }
.bench__group > span { margin-right: 6px; }
.bench button { padding: 3px 9px; border-radius: var(--tt-radius-control); color: var(--tt-text-muted); }
.bench button:hover { background: var(--tt-hover); }
.bench button[aria-pressed='true'] { background: var(--tt-wash); color: var(--tt-text); font-weight: 600; }
.stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: flex-end; justify-content: center; padding: 8px 12px 16px; }
.reopen { align-self: center; padding: 8px 14px; border: 1px solid var(--tt-panel-border); border-radius: var(--tt-radius-row); color: var(--tt-text-muted); }

/* The card. */
.card { position: relative; display: flex; flex-direction: column; width: min(560px, 100%); max-height: 100%; overflow: hidden; border: 1px solid var(--tt-panel-border); border-radius: var(--tt-radius-overlay); background: var(--tt-surface-elevated); box-shadow: 0 18px 50px #00000059; }
.transcript { flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: none; mask-image: linear-gradient(to bottom, transparent 0, black 14px); }
.transcript__inner { display: flex; flex-direction: column; justify-content: flex-end; min-height: 100%; padding: 14px 16px 6px; transition: opacity 110ms ease-out; }
.transcript.is-swapping .transcript__inner { opacity: 0; }

/* A prompt: Sotto's bubble, as the main window draws one. */
.turn { margin: 0; font-size: var(--tt-type-body); line-height: 21px; color: var(--tt-text-2); }
.prompt { align-self: flex-end; max-width: 82%; margin: 14px 0 12px; }
.prompt:first-child { margin-top: 0; }
.prompt__words { padding: 7px 12px; border-radius: var(--tt-radius-card); background: var(--tt-wash); color: var(--tt-text); white-space: pre-wrap; overflow-wrap: anywhere; }
.prompt__words blockquote { margin: 0 0 6px; padding-left: 8px; border-left: 2px solid var(--tt-panel-border); color: var(--tt-text-muted); }
.prompt__photos { display: flex; justify-content: flex-end; gap: 6px; margin-bottom: 6px; }
.prompt__photos img { display: block; max-width: 180px; max-height: 120px; border-radius: var(--tt-radius-inset); }
/* The same prompt without the bubble: flush left, in the strong ink, with a rule above each exchange. */
[data-prompts='flush'] .prompt { align-self: stretch; max-width: none; margin: 16px 0 8px; padding-top: 14px; border-top: 1px solid var(--tt-panel-border); }
[data-prompts='flush'] .prompt:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
[data-prompts='flush'] .prompt__words { padding: 0; background: none; font-weight: 600; }
[data-prompts='flush'] .prompt__photos { justify-content: flex-start; }

.reply p { margin: 0 0 10px; }
.reply > :last-child { margin-bottom: 0; }
.reply strong { color: var(--tt-text); font-weight: 600; }
.reply code { padding: 1px 4px; border-radius: var(--tt-radius-tag); background: var(--tt-code); font: 12.5px/1 ui-monospace, 'SF Mono', Menlo, monospace; }
.reply ul { margin: 0 0 10px; padding-left: 18px; }
.reply li { margin: 2px 0; }
.reply li::marker { color: var(--tt-text-hint); }
.reply pre { margin: 0 0 10px; padding: 9px 11px; border: 1px solid var(--tt-panel-border); border-radius: var(--tt-radius-inset); background: var(--tt-code); font: 12.5px/18px ui-monospace, 'SF Mono', Menlo, monospace; overflow-x: auto; }
/* The "Label: words" lines that close a reply set up as one block, one line each. */
.run { margin-top: 12px; }
.run:first-child { margin-top: 0; }
.run p { margin: 0 0 3px; }
/* Watcher speaks unasked: its reports are parted by a rule and the time. */
.report-rule { display: flex; align-items: center; gap: 10px; margin: 14px 0 12px; color: var(--tt-text-hint); font-size: var(--tt-type-caption); }
.report-rule::before { content: ''; flex: 1; height: 1px; background: var(--tt-panel-border); }

.status { display: flex; align-items: center; gap: 8px; margin: 8px 0 0; color: var(--tt-text-muted); font-size: var(--tt-type-small); }

/* The prompt and its tools. */
.compose { flex: none; position: relative; padding: 0 8px 8px; }
.card.has-talk .compose { border-top: 1px solid var(--tt-panel-border); }
.photos { display: flex; gap: 6px; padding: 12px 8px 0; }
.photo { position: relative; width: 56px; height: 56px; }
.photo img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--tt-radius-row); }
.photo button { position: absolute; top: -5px; right: -5px; display: grid; place-items: center; width: 18px; height: 18px; border-radius: var(--tt-radius-full); background: var(--tt-pill); color: var(--tt-pill-ink); }
.field { display: block; width: 100%; max-height: calc(21px * 8); margin: 0; padding: 12px 8px 8px; border: 0; outline: 0; resize: none; field-sizing: content; background: transparent; caret-color: var(--tt-accent); font-size: var(--tt-type-reading); line-height: 21px; }
.field::placeholder { color: var(--tt-text-hint); opacity: 1; }
.tools { display: flex; align-items: center; gap: 2px; min-height: 28px; }
.tools__space { flex: 1; min-width: 8px; }
.icon { display: grid; flex: none; place-items: center; width: 28px; height: 28px; border-radius: var(--tt-radius-row); color: var(--tt-text-muted); }
.icon:hover { background: var(--tt-hover); color: var(--tt-text); }
.send { display: grid; flex: none; place-items: center; width: 28px; height: 28px; margin-left: 4px; border-radius: var(--tt-radius-full); background: var(--tt-accent); color: var(--tt-on-accent); transition: background-color 120ms ease-out; }
.send:disabled { background: var(--tt-wash); color: var(--tt-text-hint); }
.send.is-stop { background: var(--tt-pill); color: var(--tt-pill-ink); }

/* Who the prompt goes to. */
.target { display: inline-flex; flex: 0 1 auto; align-items: center; gap: 6px; min-width: 0; height: 28px; padding: 0 9px; border-radius: var(--tt-radius-row); color: var(--tt-text-muted); font-size: var(--tt-type-small); white-space: nowrap; }
.target:hover { background: var(--tt-hover); color: var(--tt-text); }
.target[aria-pressed='true'], .target[aria-expanded='true'] { background: var(--tt-wash); color: var(--tt-text); font-weight: 500; }
.target__name { overflow: hidden; text-overflow: ellipsis; }
.target-group { display: flex; flex: 0 1 auto; align-items: center; min-width: 0; }
.target--thread { flex: 0 1 auto; border-radius: var(--tt-radius-row) 0 0 var(--tt-radius-row); padding-right: 5px; }
.chev { display: grid; flex: none; place-items: center; width: 22px; height: 28px; border-radius: 0 var(--tt-radius-row) var(--tt-radius-row) 0; color: var(--tt-text-hint); }
.chev:hover, .chev[aria-expanded='true'] { background: var(--tt-hover); color: var(--tt-text); }
.target[aria-pressed='true'] + .chev { background: var(--tt-wash); color: var(--tt-text-muted); }
.busy-dot { flex: none; width: 6px; height: 6px; border-radius: var(--tt-radius-full); background: var(--tt-accent); animation: pulse 1.4s ease-in-out infinite; }

/* C: a strip over the talk, as Raycast's Quick AI has. */
.strip { flex: none; display: flex; align-items: center; gap: 2px; height: 40px; padding: 0 8px; border-bottom: 1px solid var(--tt-panel-border); }

/* The list of threads. */
.list { position: absolute; left: 8px; right: 8px; bottom: calc(100% + 6px); z-index: 2; padding: 4px; border: 1px solid var(--tt-panel-border); border-radius: var(--tt-radius-card); background: var(--tt-surface-elevated); box-shadow: 0 12px 32px #00000059; }
.strip + .list, .list.is-below { top: 44px; bottom: auto; }
.row { display: flex; align-items: center; gap: 9px; width: 100%; height: 32px; padding: 0 9px; border-radius: var(--tt-radius-row); text-align: left; font-size: var(--tt-type-small); color: var(--tt-text-2); }
.row:hover, .row.is-active { background: var(--tt-hover); color: var(--tt-text); }
.row[aria-current='true'] { font-weight: 600; color: var(--tt-text); }
.row__name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row__meta { flex: none; color: var(--tt-text-hint); font-size: var(--tt-type-caption); }
.row__meta.is-busy { color: var(--tt-accent-text); }
.rule { height: 1px; margin: 4px 5px; background: var(--tt-panel-border); }

.drop { position: absolute; inset: 6px; z-index: 3; display: grid; place-items: center; border: 1.5px dashed var(--tt-accent); border-radius: var(--tt-radius-card); background: color-mix(in oklch, var(--tt-surface-elevated) 88%, transparent); color: var(--tt-accent-text); font-size: var(--tt-type-small); pointer-events: none; }

/* The owl, in the theme's colours, crisp at its size. */
.owl { flex: none; width: 18px; height: 18px; }
.owl__moon, .owl__star { fill: var(--tt-text-hint); }
.owl__eyes { fill: var(--tt-accent); opacity: .7; }
.owl.is-working .owl__eyes { opacity: 1; animation: glance 4.8s steps(1) infinite; }
.owl.is-working .owl__star { fill: var(--tt-accent); animation: flicker 1.2s steps(1) infinite; }
@keyframes glance { 0%, 30% { transform: none; } 31%, 55% { transform: translateX(-1px); } 56%, 80% { transform: translateX(1px); } 81%, 100% { transform: none; } }
@keyframes flicker { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .4; } }
@keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .transcript__inner, .send { transition: none; } .owl.is-working .owl__eyes, .owl.is-working .owl__star, .busy-dot { animation: none; } }

<body>
<div class="bench" id="bench"></div>
<div class="stage" id="stage"></div>
<script>
const SIZE = 18
const inDisc = (x, y, cx, cy, r) => (x + .5 - cx) ** 2 + (y + .5 - cy) ** 2 <= r * r
let crescent = ''
for (let y = 0; y < SIZE; y++) { let s = -1; for (let x = 0; x <= SIZE; x++) { const on = x < SIZE && inDisc(x, y, 9, 9.5, 8) && !inDisc(x, y, 12.6, 7.4, 6.6); if (on && s < 0) s = x; if (!on && s >= 0) { crescent += `<rect x="${s}" y="${y}" width="${x - s}" height="1"/>`; s = -1 } } }
const owl = working => `<svg class="owl${working ? ' is-working' : ''}" viewBox="0 0 18 18" aria-hidden="true" shape-rendering="crispEdges"><g class="owl__moon">${crescent}</g><rect class="owl__star" x="16" y="2" width="1" height="1"/><g class="owl__eyes"><rect x="10" y="8" width="2" height="2"/><rect x="14" y="8" width="2" height="2"/></g></svg>`
const svg = (d, s = 14) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`
const I = {
  clip: svg('<path d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551"/>', 15),
  up: svg('<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>', 15),
  open: svg('<path d="M7 7h10v10"/><path d="M7 17 17 7"/>', 14),
  chev: svg('<path d="m6 9 6 6 6-6"/>', 12),
  x: svg('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', 10),
  stop: '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect width="10" height="10" rx="1.5" fill="currentColor"/></svg>',
}

const you = (words, quote) => ({ who: 'you', words, quote })
/** The trailing "**Label:** words" paragraphs of a reply, as their own block. The app does this on the message's words. */
const closeRun = html => { const parts = html.split(/(?=<p>)/); let i = parts.length; while (i > 0 && /^<p><strong>[^<]{1,24}:<\/strong>/.test(parts[i - 1])) i--; return i === parts.length ? html : `${parts.slice(0, i).join('')}<div class="run">${parts.slice(i).join('')}</div>` }
const says = (html, time) => ({ who: 'them', html: closeRun(html), time })
const conversations = {
  watcher: [
    says(`<p>Another check failed on <strong>#2198</strong> at <code>42a747f</code>, so it's still unmerged. I sent the worker back to classify the failure.</p><p><strong>Next:</strong> the worker returns the evidence and pushes any fix.</p><p><strong>Needs you:</strong> nothing.</p><p><strong>TLDR:</strong> #2198 hit another CI failure, and the worker is on it.</p>`, '12:31 pm'),
    says(`<p>The worker pushed another fix to <code>989ebd8a6</code>, and CI is running on it. Two tests failed on the last run:</p><ul><li><strong>Climb desktop test:</strong> this came from the PR. The fixture left out turn identities.</li><li><strong>Windows <code>threadWorktreeSubmodules</code>:</strong> a Git command timed out in code this PR doesn't change.</li></ul><p><strong>Next:</strong> the new push runs that test again.</p><p><strong>Needs you:</strong> nothing.</p><p><strong>TLDR:</strong> the fixture is fixed, and one Windows Git timeout could still block the merge.</p>`, '1:02 pm'),
    you('which thread is this?', '1c6a2831'),
    says(`<p><code>1c6a2831</code> is "Update agent-desktop to 1.2.0", the Building thread in your Developer project. Its work is finished and nothing is running in it.</p>`, '2:04 pm'),
    you(`I don't see it in my thread list`),
    says(`<p>You're not seeing it because it's already settled, so I was wrong to call it unsettled. Settled threads drop out of the main list, which also explains the "unwatched" refusal.</p><p>It's still there with its history under your settled threads. Nothing is left to do on it.</p>`, '2:07 pm'),
    says(`<p>All checks passed on <strong>#2198</strong>, so I sent the worker to merge it.</p><p><strong>Next:</strong> the worker merges and reports the commit. Then I'll settle the thread.</p><p><strong>Needs you:</strong> nothing.</p><p><strong>TLDR:</strong> #2198 is passing and being merged now.</p>`, '2:11 pm'),
  ],
  popup: [
    you('Wire the popup to its shortcut and show me where it stands.'),
    says(`<p>The popup now opens from <strong>Option-Shift-Space</strong> and keeps the bottom edge where you left it.</p><ul><li>It reads the thread through the same channels as the main window</li><li>Questions show here and wait for your press</li></ul><pre>window.sottoPopup.fit(height)</pre>`, '1:40 pm'),
  ],
  omi: [you('Check the log and confirm it worked.'), says(`<p>It worked. The pendant's ping reached the pipeline and only "Hey Omi" started a task.</p>`, '2:09 pm')],
  climb: [you('Where does the first slice stand?'), says(`<p>Merged as <code>1c072c56b</code>. It's Owl-only, and Claude and Codex can both judge.</p>`, '11:52 am')],
  agent: [you('Update agent-desktop.'), says(`<p>1.2.0 is installed with its checksum verified, and permissions survived.</p>`, '9:15 am')],
}
const threads = [
  { id: 'popup', title: 'Popup shortcut', meta: 'Done' },
  { id: 'omi', title: 'Require "Hey Omi" wake word in Omi pipeline', meta: 'Working', busy: true },
  { id: 'climb', title: 'Council Climb first slice', meta: 'Done' },
  { id: 'agent', title: 'Update agent-desktop to 1.2.0', meta: 'Done' },
]
const sample = (() => { const c = document.createElement('canvas'); c.width = 360; c.height = 240; const g = c.getContext('2d'); const l = g.createLinearGradient(0, 0, 360, 240); l.addColorStop(0, '#2c5364'); l.addColorStop(.6, '#c2785a'); l.addColorStop(1, '#f2c879'); g.fillStyle = l; g.fillRect(0, 0, 360, 240); g.fillStyle = '#10151d'; g.beginPath(); g.moveTo(0, 240); g.lineTo(120, 130); g.lineTo(200, 190); g.lineTo(280, 110); g.lineTo(360, 180); g.lineTo(360, 240); g.fill(); return c.toDataURL('image/jpeg', .8) })()

const S = { variant: 'A', prompts: 'bubble', theme: 'warm', target: 'watcher', thread: 'popup', draft: '', photos: [], list: false, listIndex: 0, running: null, dragging: false, shown: true, held: 0 }
const stage = document.getElementById('stage'), bench = document.getElementById('bench')
const current = () => S.target === 'watcher' ? 'watcher' : S.thread
const isNew = () => S.target === 'thread' && S.thread === null
const threadTitle = () => S.thread === null ? 'New thread in Sotto' : threads.find(t => t.id === S.thread).title
const placeholder = () => S.target === 'watcher' ? 'Ask Watcher…' : isNew() ? 'New thread in Sotto…' : 'Reply to this thread…'
const talk = () => S.thread === null && S.target === 'thread' ? [] : conversations[current()]
/** Where the newest exchange starts: the last prompt, or the third message from the end when more came after it. */
function newestAt(all) { const last = all.findLastIndex(m => m.who === 'you'); return Math.max(last < 0 ? all.length - 1 : last, all.length - 3, 0) }

function benchHtml() {
  const group = (label, key, options) => `<div class="bench__group"><span>${label}</span>${options.map(([value, words]) => `<button type="button" data-bench="${key}" data-value="${value}" aria-pressed="${S[key] === value}">${words}</button>`).join('')}</div>`
  return group('Switcher', 'variant', [['A', 'A Two targets'], ['B', 'B One picker'], ['C', 'C Strip on top']]) + group('Prompts', 'prompts', [['bubble', 'Bubble'], ['flush', 'Flush']]) + group('Look', 'theme', [['warm', 'Warm'], ['t3', 'T3'], ['light', 'Light']])
    + `<div class="bench__group"><button type="button" data-do="sample">Add a photo</button><button type="button" data-do="hide">Hide and show again</button></div>`
}
const running = id => S.running?.id === id
const targetDot = id => running(id) || threads.find(t => t.id === id)?.busy ? '<span class="busy-dot" title="Working"></span>' : ''
function switcher() {
  const watcherPress = `<button type="button" class="target" data-go="watcher" aria-pressed="${S.target === 'watcher'}" title="Ask Watcher (⌘1)">${owl(running('watcher'))}<span class="target__name">Watcher</span></button>`
  if (S.variant === 'B') return `<button type="button" class="target" data-do="list" aria-haspopup="listbox" aria-expanded="${S.list}" title="Choose who to ask (⌘K)">${S.target === 'watcher' ? owl(running('watcher')) : ''}<span class="target__name">${S.target === 'watcher' ? 'Watcher' : threadTitle()}</span>${I.chev}</button>`
  return `${watcherPress}<div class="target-group"><button type="button" class="target target--thread" data-go="thread" aria-pressed="${S.target === 'thread'}" title="Reply to this thread (⌘2)">${S.thread ? targetDot(S.thread) : ''}<span class="target__name">${threadTitle()}</span></button><button type="button" class="chev" data-do="list" aria-haspopup="listbox" aria-expanded="${S.list}" aria-label="Choose a thread" title="Choose a thread (⌘K)">${I.chev}</button></div>`
}
function listHtml() {
  const rows = [
    ...(S.variant === 'B' ? [`<button type="button" class="row" data-go="watcher" aria-current="${S.target === 'watcher'}">${owl(running('watcher'))}<span class="row__name">Watcher</span></button><div class="rule"></div>`] : []),
    ...threads.map(t => `<button type="button" class="row" data-thread="${t.id}" aria-current="${S.target === 'thread' && S.thread === t.id}"><span class="row__name">${t.title}</span><span class="row__meta${t.busy ? ' is-busy' : ''}">${t.meta}</span></button>`),
    `<div class="rule"></div><button type="button" class="row" data-do="new"><span class="row__name">New thread in Sotto</span><span class="row__meta">⌘N</span></button>`,
  ]
  return `<div class="list${S.variant === 'C' ? ' is-below' : ''}" role="listbox" aria-label="Threads">${rows.join('')}</div>`
}
function transcriptHtml() {
  const list = talk(), newest = newestAt(list)
  let out = ''
  list.forEach((m, i) => {
    const mark = i === newest ? ' data-newest' : ''
    if (m.who === 'you') out += `<div class="turn prompt"${mark}>${m.photos?.length ? `<div class="prompt__photos">${m.photos.map(p => `<img src="${p}" alt="Attached photo">`).join('')}</div>` : ''}${m.words || m.quote ? `<div class="prompt__words">${m.quote ? `<blockquote>${m.quote}</blockquote>` : ''}${m.words}</div>` : ''}</div>`
    else { if (list[i - 1]?.who === 'them') out += `<div class="report-rule"${mark}>${m.time ?? ''}</div>`; out += `<div class="turn reply"${list[i - 1]?.who === 'them' ? '' : mark}>${m.html}</div>` }
  })
  if (running(current())) out += `<p class="status" role="status">${owl(true)}<span>Working…</span></p>`
  return out
}
function render(keep) {
  bench.innerHTML = benchHtml()
  document.documentElement.dataset.theme = S.theme
  document.documentElement.dataset.prompts = S.prompts
  const field = stage.querySelector('.field')
  const caret = field ? [field.selectionStart, field.selectionEnd] : null
  const scroller = stage.querySelector('.transcript'), top = scroller?.scrollTop
  if (!S.shown) { stage.innerHTML = `<button type="button" class="reopen" data-do="show">Show popup (⌥⇧Space)</button>`; return }
  const hasTalk = talk().length > 0 || running(current())
  const canSend = S.draft.trim() !== '' || S.photos.length > 0
  const showStop = running(current()) && !canSend
  const strip = S.variant === 'C'
  stage.innerHTML = `<div class="card${hasTalk ? ' has-talk' : ''}" role="group" aria-label="Sotto popup">
    ${strip ? `<div class="strip">${switcher()}<span class="tools__space"></span><button type="button" class="icon" data-do="open" aria-label="Show in Sotto" title="Show in Sotto (⌘O)">${I.open}</button></div>` : ''}
    ${strip && S.list ? listHtml() : ''}
    ${hasTalk ? `<div class="transcript"><div class="transcript__inner" role="log" aria-live="polite">${transcriptHtml()}</div></div>` : ''}
    <div class="compose">
      ${!strip && S.list ? listHtml() : ''}
      ${S.photos.length ? `<div class="photos">${S.photos.map((p, i) => `<div class="photo"><img src="${p}" alt="Attached photo ${i + 1}"><button type="button" data-remove="${i}" aria-label="Remove photo ${i + 1}">${I.x}</button></div>`).join('')}</div>` : ''}
      <textarea class="field" rows="1" placeholder="${placeholder()}" aria-label="${S.target === 'watcher' ? 'Message Watcher' : 'Message ' + threadTitle()}" spellcheck="false"></textarea>
      <div class="tools">
        <button type="button" class="icon" data-do="attach" aria-label="Attach photos" title="Attach photos, or paste or drop them">${I.clip}</button>
        ${strip ? '' : switcher()}
        <span class="tools__space"></span>
        ${strip ? '' : `<button type="button" class="icon" data-do="open" aria-label="Show in Sotto" title="Show in Sotto (⌘O)">${I.open}</button>`}
        ${showStop ? `<button type="button" class="send is-stop" data-do="stop" aria-label="Stop the running turn" title="Stop (Esc)">${I.stop}</button>` : `<button type="button" class="send" data-do="send" aria-label="Send" title="Send (Return)" ${canSend ? '' : 'disabled'}>${I.up}</button>`}
      </div>
    </div>
    ${S.dragging ? `<div class="drop" role="status">Drop to attach</div>` : ''}

  </div>`
  const nextField = stage.querySelector('.field')
  nextField.value = S.draft
  if (caret) { nextField.selectionStart = caret[0]; nextField.selectionEnd = caret[1] }
  if (!S.list) nextField.focus({ preventScroll: true })

  if (list) list.scrollTop = keep && top !== undefined ? top : list.scrollHeight

}
/** The card takes the height its words want, up to its share, and only grows during one showing: a flip moves the words, not the window. */
function fit() {
  const card = stage.querySelector('.card'); if (!card) return
  card.style.height = 'auto'
  const max = stage.clientHeight - 24
  const inner = card.querySelector('.transcript__inner')
  const rest = [...card.children].filter(child => !child.matches('.transcript, .list, .drop, input')).reduce((sum, child) => sum + child.offsetHeight, 0)
  if (inner) inner.style.minHeight = '0'
  const mark = inner?.querySelector('[data-newest]')
  const words = !inner ? 0 : mark ? inner.getBoundingClientRect().bottom - mark.getBoundingClientRect().top + 14 : inner.offsetHeight
  const wanted = rest + Math.ceil(words) + 2
  if (inner) inner.style.minHeight = ''
  const list = card.querySelector('.list')
  const needed = list ? rest + list.offsetHeight + 16 : wanted
  S.held = Math.max(S.held, Math.min(Math.max(wanted, needed), max))
  card.style.height = `${S.held}px`
}
function swap(change) {
  const transcript = stage.querySelector('.transcript')
  if (!transcript || matchMedia('(prefers-reduced-motion: reduce)').matches) { change(); render(); return }
  transcript.classList.add('is-swapping')
  setTimeout(() => { change(); render(); const next = stage.querySelector('.transcript'); if (next) { next.classList.add('is-swapping'); requestAnimationFrame(() => next.classList.remove('is-swapping')) } }, 90)
}
const go = target => swap(() => { S.target = target; S.list = false })
const pickThread = id => swap(() => { S.target = 'thread'; S.thread = id; S.list = false })
const startNew = () => swap(() => { S.target = 'thread'; S.thread = null; S.list = false })
function addPhotos(files) { for (const file of files) { if (!file.type.startsWith('image/')) continue; const reader = new FileReader(); reader.onload = () => { S.photos = [...S.photos, reader.result].slice(0, 4); render(true) }; reader.readAsDataURL(file) } }
function send() {
  const words = S.draft.trim()
  if (!words && !S.photos.length) return
  if (isNew()) { const id = `new${threads.length}`; threads.unshift({ id, title: words.slice(0, 40) || 'New thread', meta: 'Working' }); conversations[id] = []; S.thread = id }
  const id = current()
  conversations[id] = [...conversations[id], { who: 'you', words, photos: S.photos }]
  S.draft = ''; S.photos = []
  S.running = { id }
  render()
  const answer = `<p>${id === 'watcher' ? 'Nothing is waiting on you right now. One thread is still working, and I\'ll say when it needs you.' : 'Done. The change is in the working copy and nothing else moved.'}</p>`.split(' ')
  setTimeout(() => {
    if (S.running?.id !== id) return
    const entry = says('', 'now'); conversations[id] = [...conversations[id], entry]
    let n = 0
    const tick = setInterval(() => { if (S.running?.id !== id) { clearInterval(tick); return } entry.html = answer.slice(0, ++n).join(' ') + (n < answer.length ? '</p>' : ''); render(); if (n >= answer.length) { clearInterval(tick); S.running = null; render() } }, 45)
  }, 1000)
}
const stop = () => { S.running = null; render() }

bench.addEventListener('click', event => { const b = event.target.closest('[data-bench]'); if (b) { S[b.dataset.bench] = b.dataset.value; S.list = false; S.held = 0; render() } })
document.addEventListener('click', event => {
  const b = event.target.closest('button'); if (!b) { if (S.list && !event.target.closest('.list')) { S.list = false; render(true) } return }
  if (b.dataset.go) { if ((b.dataset.go === 'watcher') !== (S.target === 'watcher') || S.list) go(b.dataset.go); return }
  if (b.dataset.thread) { pickThread(b.dataset.thread); return }
  if (b.dataset.remove !== undefined) { S.photos = S.photos.filter((_, i) => i !== Number(b.dataset.remove)); render(true); return }
  const act = b.dataset.do
  if (act === 'list') { S.list = !S.list; render(true) }
  else if (act === 'new') startNew()
  else if (act === 'send') send()
  else if (act === 'stop') stop()
  else if (act === 'attach') document.getElementById('picker').click()
  else if (act === 'sample') { S.photos = [...S.photos, sample].slice(0, 4); render(true) }
  else if (act === 'hide') { S.shown = false; S.list = false; render(); setTimeout(() => { S.shown = true; S.held = 0; render() }, 500) }
  else if (act === 'show') { S.shown = true; S.held = 0; render() }
})
document.addEventListener('input', event => { if (event.target.matches('.field')) { S.draft = event.target.value; const send = stage.querySelector('[data-do="send"]'); if (send) send.disabled = !S.draft.trim() && !S.photos.length; else if (S.running) render(true) } })
document.addEventListener('change', event => { if (event.target.id === 'picker') { addPhotos([...event.target.files]); event.target.value = '' } })
document.addEventListener('paste', event => { const files = [...event.clipboardData.files]; if (files.length) { event.preventDefault(); addPhotos(files) } })
let depth = 0
document.addEventListener('dragenter', event => { if (![...event.dataTransfer.types].includes('Files')) return; event.preventDefault(); depth++; if (!S.dragging) { S.dragging = true; render(true) } })
document.addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (depth === 0 && S.dragging) { S.dragging = false; render(true) } })
document.addEventListener('dragover', event => event.preventDefault())
document.addEventListener('drop', event => { event.preventDefault(); depth = 0; S.dragging = false; addPhotos([...event.dataTransfer.files]); render(true) })
document.addEventListener('keydown', event => {
  const meta = event.metaKey || event.ctrlKey
  if (meta && event.key === '1') { event.preventDefault(); if (S.target !== 'watcher') go('watcher') }
  else if (meta && event.key === '2') { event.preventDefault(); if (S.target !== 'thread') go('thread') }
  else if (meta && event.key.toLowerCase() === 'k') { event.preventDefault(); S.list = !S.list; render(true) }
  else if (meta && event.key.toLowerCase() === 'n') { event.preventDefault(); startNew() }
  else if (event.key === 'Escape') { event.preventDefault(); if (S.list) { S.list = false; render(true) } else if (running(current())) stop(); else { S.shown = false; render() } }
  else if (event.key === 'Enter' && !event.shiftKey && !event.altKey && event.target.matches('.field')) { event.preventDefault(); send() }
})
stage.addEventListener('load', event => { if (event.target.tagName !== 'IMG') return; fit(); const list = stage.querySelector('.transcript'); if (list) list.scrollTop = list.scrollHeight }, true)
addEventListener('resize', () => { S.held = 0; fit() })
render()
document.fonts?.ready.then(() => { S.held = 0; fit() })
</script>
</body>
</html>
