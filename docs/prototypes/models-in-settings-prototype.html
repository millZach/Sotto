<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — 3D models in Settings</title>
<!--
  PROTOTYPE, throwaway. Question: where in Settings does the 3D models viewer go once the cube leaves the sidebar's foot?
  Three variants on one page, switched with ?variant=A|B|C, the bar at the bottom, or the arrow keys.
  A: its own Settings page, "3D models", below Plugins, with the viewer as the page has it now.
  B: inside Settings › Plugins › Meshy, under the account, as a "3D models" group.
  C: its own Settings page as a list; a press opens the turnable view in a dialog.
  Every variant shows the sidebar foot without the cube. Nothing here is wired to Sotto.
-->
<style>
  :root {
    --bg: #0a0a0a; --side: #0d0d0d; --card: #121316; --card2: #17181c; --line: #26272b; --line2: #34353a;
    --text: #f2f2f2; --text2: #c9c9c9; --muted: #9a9a9e; --faint: #6c6c70; --accent: #4fb8a6; --accent-bg: #10302b;
    --field: #0f1012; --hover: #1b1c20;
    font-family: Figtree, "Segoe UI", system-ui, sans-serif; color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f7f7f5; --side: #efefec; --card: #ffffff; --card2: #f3f3f1; --line: #dcdcd8; --line2: #c9c9c4;
    --text: #18181a; --text2: #333336; --muted: #5d5d62; --faint: #85858a; --accent: #1f7f70; --accent-bg: #d9efeb;
    --field: #ffffff; --hover: #e9e9e6; color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-size: 14px; }
  button { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 270px 1fr; height: 100vh; }
  .side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .side h2 { font-size: 22px; font-weight: 500; margin: 56px 18px 14px; }
  .find { margin: 0 10px 12px; border: 1px solid var(--line2); border-radius: 8px; padding: 9px 12px; color: var(--faint); background: var(--field); }
  .rail { flex: 1; overflow-y: auto; padding: 0 10px; }
  .rail button { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; text-align: left; padding: 11px 12px; border-radius: 8px; color: var(--text2); cursor: pointer; }
  .rail button:hover { background: var(--hover); }
  .rail button[aria-current] { background: var(--accent-bg); color: var(--text); }
  .rail button .ic { width: 18px; text-align: center; color: var(--muted); }
  .rail hr { border: 0; border-top: 1px solid var(--line); margin: 8px 12px; }
  .new { margin-left: auto; font-size: 11px; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 0 6px; }
  .foot { display: flex; align-items: center; gap: 4px; padding: 10px 12px; border-top: 1px solid var(--line); }
  .foot span { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 6px; color: var(--muted); font-size: 15px; }
  .foot span.on { background: var(--hover); color: var(--text); box-shadow: inset 0 -2px 0 var(--text); }
  .foot .sep { width: 1px; height: 18px; background: var(--line2); margin: 0 4px; }
  .foot .gone { position: relative; color: #e06c5a; border: 1px dashed #e06c5a; }
  .foot-note { font-size: 11px; color: var(--faint); padding: 0 14px 10px; }
  main { overflow-y: auto; min-width: 0; }
  .inner { max-width: 960px; margin: 0 auto; padding: 56px 32px 120px; }
  h1 { font-size: 28px; font-weight: 500; letter-spacing: -0.5px; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 22px; }
  .group-title { display: flex; align-items: center; gap: 8px; color: var(--text2); font-weight: 600; margin: 26px 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .btn { border: 1px solid var(--line2); background: transparent; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn:hover { background: var(--hover); }
  .btn.primary:hover { opacity: .9; background: var(--text); }
  .search { border: 1px solid var(--line2); border-radius: 8px; padding: 8px 12px; color: var(--faint); background: var(--field); min-width: 220px; }
  /* the viewer */
  .stage { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; }
  .view { position: relative; min-height: 320px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; display: grid; place-items: center; overflow: hidden; touch-action: none; cursor: grab; }
  .view .hint { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--muted); }
  .scene { width: 150px; height: 150px; perspective: 700px; }
  .cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transform: rotateX(-22deg) rotateY(35deg); }
  .cube div { position: absolute; inset: 0; opacity: .95; }
  .f1 { background: #8b3a20; transform: translateZ(75px); } .f2 { background: #2f6ea6; transform: rotateY(90deg) translateZ(75px); }
  .f3 { background: #9a62c6; transform: rotateX(90deg) translateZ(75px); } .f4 { background: #6b2c18; transform: rotateY(180deg) translateZ(75px); }
  .f5 { background: #245a88; transform: rotateY(-90deg) translateZ(75px); } .f6 { background: #6e4590; transform: rotateX(-90deg) translateZ(75px); }
  .details { background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .details h3 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  .mono { font-family: ui-monospace, "Cascadia Mono", Menlo, monospace; font-size: 12px; color: var(--muted); }
  dl { display: grid; grid-template-columns: 84px 1fr; gap: 8px 10px; margin: 14px 0; font-size: 13px; }
  dt { color: var(--muted); } dd { margin: 0; }
  .files { border: 1px solid var(--line); border-radius: 8px; }
  .files div { display: flex; justify-content: space-between; padding: 8px 10px; border-top: 1px solid var(--line); font-size: 12px; }
  .files div:first-child { border-top: 0; }
  .strip { display: flex; gap: 10px; overflow-x: auto; padding: 14px 0 4px; }
  .tile { flex: 0 0 116px; background: var(--card2); border: 2px solid transparent; border-radius: 10px; padding: 6px; cursor: pointer; text-align: left; }
  .tile[aria-pressed="true"] { border-color: var(--accent); }
  .thumb { height: 64px; border-radius: 6px; background: linear-gradient(90deg, #d65f39 50%, #9a62c6 50%); }
  .tile b { display: block; font-size: 13px; margin-top: 6px; } .tile small { color: var(--muted); font-size: 12px; }
  /* variant C list */
  .list { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .item { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--card); width: 100%; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; cursor: pointer; }
  .item:first-child { border-top: 0; }
  .item:hover { background: var(--hover); }
  .item .thumb { height: 42px; }
  dialog { background: var(--card); color: var(--text); border: 1px solid var(--line2); border-radius: 14px; padding: 18px; width: min(860px, 94vw); }
  dialog::backdrop { background: rgb(0 0 0 / .55); }
  /* the question panel note */
  .ask { border: 1px dashed var(--line2); border-radius: 10px; padding: 12px 14px; color: var(--text2); margin-top: 28px; font-size: 13px; }
  .ask b { color: var(--text); }
  /* switcher, not part of the design */
  .switcher { position: fixed; bottom: 16px; left: 50%; translate: -50% 0; display: flex; align-items: center; gap: 6px; background: #ffd400; color: #111; border-radius: 999px; padding: 6px 8px; box-shadow: 0 6px 24px rgb(0 0 0 / .45); z-index: 10; max-width: calc(100vw - 16px); }
  .switcher button { border: 0; background: #111; color: #ffd400; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 16px; flex: none; }
  .switcher .label { font-weight: 700; padding: 0 8px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .switcher .theme { width: auto; border-radius: 999px; padding: 0 10px; font-size: 12px; }
  .mob-rail { display: none; }
  @media (max-width: 820px) {
    .app { grid-template-columns: minmax(0, 1fr); height: auto; }
    .side, main { min-width: 0; }
    .item { grid-template-columns: 44px 1fr; } .item > span:last-child { display: none; }
    .side { border-right: 0; border-bottom: 1px solid var(--line); }
    .side h2 { margin: 18px 16px 10px; }
    .find, .rail { display: none; }
    .mob-rail { display: flex; gap: 6px; overflow-x: auto; padding: 0 12px 12px; }
    .mob-rail button { flex: none; border: 1px solid var(--line2); background: none; border-radius: 999px; padding: 6px 12px; color: var(--text2); }
    .mob-rail button[aria-current] { background: var(--accent-bg); border-color: var(--accent); color: var(--text); }
    .foot { order: -1; }
    .inner { padding: 22px 14px 110px; }
    .stage { grid-template-columns: 1fr; }
    .view { min-height: 260px; }
    .search { min-width: 0; width: 100%; }
    .head-row { flex-direction: column; align-items: stretch !important; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="foot" aria-label="Sidebar foot">
      <span title="Dictate">🎙</span><span title="Watcher">🦉</span><span title="Threads">💬</span><span class="sep"></span>
      <span title="Usage">📊</span><span class="on" title="Settings">⚙</span><span title="Help">?</span>
      <span style="margin-left:auto" title="Check for updates">↻</span>
    </div>
    <div class="foot-note">The cube between Usage and Settings is gone.</div>
    <h2>Settings</h2>
    <div class="find">Find a setting</div>
    <nav class="rail" id="rail"></nav>
    <nav class="mob-rail" id="mobRail"></nav>
  </aside>
  <main><div class="inner" id="page"></div></main>
</div>

<dialog id="dlg"><div id="dlgBody"></div></dialog>

<div class="switcher" role="toolbar" aria-label="Prototype variants">
  <button id="prev" aria-label="Previous variant">←</button>
  <span class="label" id="label"></span>
  <button id="next" aria-label="Next variant">→</button>
  <button class="theme" id="theme">Light</button>
</div>

<script>
const VARIANTS = {
  A: 'Its own page, below Plugins',
  B: 'Inside Plugins › Meshy',
  C: 'Its own page, as a list',
}
const KEYS = Object.keys(VARIANTS)
const params = new URLSearchParams(location.search)
let variant = KEYS.includes(params.get('variant')) ? params.get('variant') : 'A'
const MODELS = [
  { name: 'Oak barrel', when: 'Nov 15', made: 'Nov 15, 8:20 AM', words: 'An oak barrel with iron hoops and moss on the lid', cost: 30, thread: 'Check the checkout page · Lumen shop' },
  { name: 'Brass lantern', when: 'Nov 15', made: 'Nov 15, 8:02 AM', words: 'A brass ship’s lantern, slightly dented', cost: 30, thread: 'Check the checkout page · Lumen shop' },
  { name: 'Stone well', when: 'Nov 14', made: 'Nov 14, 6:40 PM', words: 'A round stone well with a wooden roof', cost: 30, thread: 'Village props · Hollow game' },
]
let chosen = 0

function rail() {
  const pages = [
    ['🎙', 'Dictation'], ['✦', 'Cleanup'], '-', ['💬', 'Threads'], ['⌘', 'Keyboard'], ['⑂', 'Git & worktrees'], ['🦉', 'Watcher'], '-',
    ['⌗', 'Providers'], ['🔌', 'Plugins'], ...(variant === 'B' ? [] : [['▣', '3D models', true]]), ['🖥', 'Hosts & phones'], ['☁', 'Cloud iPhone'], '-',
    ['🎨', 'Appearance'], ['▤', 'Application'], ['⚡', 'Performance'],
  ]
  const current = variant === 'B' ? 'Plugins' : '3D models'
  document.getElementById('rail').innerHTML = pages.map(p => p === '-' ? '<hr>' :
    `<button ${p[1] === current ? 'aria-current="page"' : ''}><span class="ic">${p[0]}</span>${p[1]}${p[2] ? '<span class="new">here</span>' : ''}</button>`).join('')
  document.getElementById('mobRail').innerHTML = pages.filter(p => p !== '-').map(p =>
    `<button ${p[1] === current ? 'aria-current="page"' : ''}>${p[1]}</button>`).join('')
}

const cube = () => `<div class="scene"><div class="cube" data-cube><div class="f1"></div><div class="f2"></div><div class="f3"></div><div class="f4"></div><div class="f5"></div><div class="f6"></div></div></div>`
const files = m => `<div class="files">${['png', 'glb', 'usdz'].map(x => `<div><span class="mono">models/${m.name}.${x}</span><span class="muted">${x === 'glb' ? '2' : '1'} KB ⇱</span></div>`).join('')}</div>`
const details = m => `<div class="details"><h3>${m.name}</h3><div class="mono">3D model · Meshy · made from words</div>
  <div class="row" style="margin-top:12px; flex-wrap:wrap"><button class="btn primary">Go to thread</button><button class="btn">Show in File Explorer</button></div>
  <dl><dt>Thread</dt><dd>${m.thread}</dd><dt>Made</dt><dd>${m.made}</dd><dt>Words sent</dt><dd>${m.words}</dd><dt>Cost</dt><dd>${m.cost} credits</dd></dl>
  <div class="small muted" style="margin-bottom:6px">Files</div>${files(m)}</div>`
const strip = () => `<div class="strip">${MODELS.map((m, i) => `<button class="tile" data-pick="${i}" aria-pressed="${i === chosen}"><div class="thumb"></div><b>${m.name}</b><small>${m.when}</small></button>`).join('')}</div>`
const viewer = (wide = true) => `<div class="stage" ${wide ? '' : 'style="grid-template-columns:1fr"'}><div class="view">${cube()}<div class="hint">Drag or use the arrow keys to turn</div></div>${details(MODELS[chosen])}</div>${strip()}`
const summary = `3 3D models from 2 threads · 90 credits this month`

function page() {
  const el = document.getElementById('page')
  if (variant === 'A') {
    el.innerHTML = `<div class="row head-row" style="justify-content:space-between; align-items:flex-end"><div><h1>3D models</h1><p class="sub">${summary}</p></div><div class="search">⌕ Search 3D models</div></div>
      ${viewer()}
      <p class="small muted" style="margin-top:18px">Meshy accounts, Ask before each 3D model and the monthly credit limit stay in <u>Settings › Plugins › Meshy</u>.</p>`
  } else if (variant === 'B') {
    el.innerHTML = `<h1>Plugins</h1><p class="sub">Outside services threads can use.</p>
      <div class="card row"><b>GitHub</b><span class="dot"></span><span class="muted small">zach</span><span style="margin-left:auto" class="muted">›</span></div>
      <div class="group-title">▣ 3D, sound and video</div>
      <div class="card">
        <div class="row"><b>Meshy</b><span class="dot"></span><span class="muted small">Studio</span><span style="margin-left:auto" class="muted">⌄</span></div>
        <p class="muted small" style="margin:10px 0 12px">Make 3D models from words or a photo, with a key you paste. Sotto keeps the key in its encrypted store.</p>
        <div class="card" style="background:var(--card2)">
          <div class="row"><b>Studio</b><span class="muted small">API key saved November 14.</span><span style="margin-left:auto" class="row"><button class="btn">Replace</button><button class="btn" style="border:0">Remove</button></span></div>
          <div class="small muted" style="margin-top:10px">Ask before each 3D model · on &nbsp;·&nbsp; Monthly credit limit · 1,000 &nbsp;·&nbsp; Threads may use Studio · every project</div>
        </div>
        <div class="row head-row" style="justify-content:space-between; margin-top:20px"><div><b>3D models</b> <span class="muted small">${summary}</span></div><div class="search">⌕ Search 3D models</div></div>
        <div style="margin-top:12px">${viewer()}</div>
        <button class="btn" style="margin-top:14px">Add another Meshy account</button>
      </div>
      <div class="card row" style="margin-top:10px"><b>ElevenLabs</b><span class="muted small">Not added</span><span style="margin-left:auto" class="muted">›</span></div>`
  } else {
    el.innerHTML = `<div class="row head-row" style="justify-content:space-between; align-items:flex-end"><div><h1>3D models</h1><p class="sub">${summary}</p></div><div class="search">⌕ Search 3D models</div></div>
      <div class="list">${MODELS.map((m, i) => `<button class="item" data-open="${i}"><div class="thumb"></div><div><b>${m.name}</b><div class="small muted">${m.thread} · ${m.when} · ${m.cost} credits</div></div><span class="muted">Turn ›</span></button>`).join('')}</div>
      <p class="small muted" style="margin-top:18px">Press a 3D model to turn it. Meshy accounts and the credit limit stay in <u>Settings › Plugins › Meshy</u>.</p>`
  }
  el.insertAdjacentHTML('beforeend', `<div class="ask"><b>Prototype only.</b> Tools › 3D models and the line in a thread are not drawn here; the card asks whether they stay as they are. The iPhone has no 3D models page, only the line and its sheet.</div>`)
}

function wireCubes() {
  document.querySelectorAll('.view').forEach(view => {
    const c = view.querySelector('[data-cube]')
    let rx = -22, ry = 35, drag = null
    const set = () => c.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`
    view.tabIndex = 0
    view.onpointerdown = e => { drag = [e.clientX, e.clientY, rx, ry]; view.setPointerCapture(e.pointerId) }
    view.onpointermove = e => { if (!drag) return; ry = drag[3] + (e.clientX - drag[0]) / 2; rx = drag[2] - (e.clientY - drag[1]) / 2; set() }
    view.onpointerup = () => drag = null
    view.onkeydown = e => { const d = { ArrowLeft: [0, -10], ArrowRight: [0, 10], ArrowUp: [10, 0], ArrowDown: [-10, 0] }[e.key]; if (d) { e.preventDefault(); e.stopPropagation(); rx += d[0]; ry += d[1]; set() } }
  })
}

function render() {
  document.getElementById('label').textContent = `${variant} — ${VARIANTS[variant]}`
  rail(); page(); wireCubes()
  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { chosen = +b.dataset.pick; render() })
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => {
    chosen = +b.dataset.open
    document.getElementById('dlgBody').innerHTML = `<div class="row" style="justify-content:space-between; margin-bottom:12px"><b>${MODELS[chosen].name}</b><button class="btn" onclick="dlg.close()">Close</button></div>${viewer()}`
    dlg.showModal(); wireCubes()
    document.querySelectorAll('#dlg [data-pick]').forEach(t => t.onclick = () => { chosen = +t.dataset.pick; b.click() })
  })
}

function go(step) {
  variant = KEYS[(KEYS.indexOf(variant) + step + KEYS.length) % KEYS.length]
  const url = new URL(location.href); url.searchParams.set('variant', variant); history.replaceState(null, '', url)
  render()
}
document.getElementById('prev').onclick = () => go(-1)
document.getElementById('next').onclick = () => go(1)
document.getElementById('theme').onclick = e => {
  const light = document.documentElement.dataset.theme !== 'light'
  document.documentElement.dataset.theme = light ? 'light' : 'dark'
  e.target.textContent = light ? 'Dark' : 'Light'
}
addEventListener('keydown', e => {
  if (e.target.closest?.('input, textarea, [contenteditable], .view, dialog')) return
  if (e.key === 'ArrowLeft') go(-1)
  if (e.key === 'ArrowRight') go(1)
})
render()
</script>
</body>
</html>
