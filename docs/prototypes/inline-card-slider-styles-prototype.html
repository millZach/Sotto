.pm[data-provider='claude'] { color: var(--tt-provider-claude); }
.pm[data-provider='codex'] { color: var(--tt-provider-codex); }
.pm[data-provider='grok'] { color: var(--tt-provider-grok); }
.pm[data-provider='devin'] { color: var(--tt-provider-devin); }
.pm[data-provider='opencode'] { color: var(--tt-provider-opencode); }
.pm[data-provider='muse'] { color: var(--tt-provider-muse); }

/* ---------------- Picker Shell (Direction C) ---------------- */
.picker {
  position: absolute; bottom: calc(100% + 10px); right: -36px; z-index: 20;
  width: min(378px, calc(100vw - 28px)); max-height: min(530px, calc(100vh - 135px));
  display: flex; flex-direction: column;
  border: 1px solid var(--tt-field-border); border-radius: var(--tt-radius-card);
  background: var(--tt-surface-elevated); color: var(--tt-text); box-shadow: var(--tt-shadow);
  overflow: hidden; animation: picker-rise 130ms cubic-bezier(.2, .8, .2, 1);
}
@keyframes picker-rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
.picker[hidden] { display: none; }
.compare-col .picker { right: -28px; width: min(368px, calc(100vw - 36px)); }

.pk-search { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 8px 0 12px; border-bottom: 1px solid var(--tt-hairline); color: var(--tt-text-muted); flex: none; }
.pk-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--tt-text); font-size: var(--tt-type-small); }
.pk-search input::placeholder { color: var(--tt-text-faint); }
.pk-close { width: 26px; height: 26px; border: 0; border-radius: var(--tt-radius-control); background: transparent; color: var(--tt-text-muted); display: grid; place-items: center; flex: none; }
.pk-close:hover { background: var(--tt-hover); color: var(--tt-text); }

.pkC-providers { display: flex; align-items: center; gap: 3px; padding: 5px 8px; border-bottom: 1px solid var(--tt-hairline); background: var(--tt-surface); overflow-x: auto; scrollbar-width: none; flex: none; }
.pkC-providers button { position: relative; height: 28px; min-width: 34px; padding: 0 8px; border: 0; border-radius: var(--tt-radius-control); background: transparent; color: var(--tt-text-muted); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.pkC-providers button .pm { opacity: 0.72; }
.pkC-providers button:hover { background: var(--tt-hover); color: var(--tt-text); }
.pkC-providers button:hover .pm, .pkC-providers button[aria-selected='true'] .pm { opacity: 1; }
.pkC-providers button[aria-selected='true'] { background: var(--tt-selected); color: var(--tt-activity); }
.pkC-providers button[aria-selected='true']::after { content: ''; position: absolute; left: 8px; right: 8px; bottom: -5px; height: 2px; border-radius: var(--tt-radius-mark) var(--tt-radius-mark) 0 0; background: var(--tt-activity); }

.pkC-list { flex: 1; min-height: 0; max-height: 350px; overflow-y: auto; padding: 6px; scrollbar-width: thin; scrollbar-color: var(--tt-scrollbar) transparent; }
.pk-row { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 31px; padding: 5px 8px 5px 10px; border: 0; border-radius: var(--tt-radius-row); background: transparent; color: var(--tt-text-2); font-size: var(--tt-type-small); text-align: left; }
.pk-row:hover { background: var(--tt-hover); color: var(--tt-text); }
.pk-row__main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; }
.pk-row__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pk-row__source { color: var(--tt-text-muted); font-size: var(--tt-type-caption); flex: none; }
.pk-row__check { flex: none; color: var(--tt-activity); }
.pk-star { width: 22px; height: 22px; border: 0; border-radius: var(--tt-radius-control); background: transparent; color: var(--tt-text-muted); display: grid; place-items: center; flex: none; opacity: 0; }
.pk-row:hover .pk-star, .pk-star[data-starred='true'] { opacity: 1; }
.pk-star[data-starred='true'] { color: var(--tt-activity); }

/* =====================================================================
   INLINE MODEL CARD + PRISM IGNITION (LOCKED IN)
   ===================================================================== */
.inline-card {
  --effort-x: 1;
  --effort-heat: 1;
  position: relative;
  margin: 2px 0 6px;
  padding: 11px 12px 11px;
  border: 1px solid color-mix(in srgb, var(--tt-effort-border) calc(10% + 26% * var(--effort-heat)), var(--tt-hairline));
  border-radius: var(--tt-radius-inset);
  background: linear-gradient(180deg, color-mix(in oklab, var(--tt-surface-elevated) 45%, var(--tt-surface)), var(--tt-surface));
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow: hidden;
  transition: border-color 300ms ease, box-shadow 300ms ease;
}
.inline-card[data-highest='true'] {
  border-color: color-mix(in srgb, var(--tt-effort-border) 55%, var(--tt-field-border));
  box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.06), 0 8px 24px -14px color-mix(in srgb, var(--tt-effort-b) 55%, transparent);
}
.inline-card__content { position: relative; z-index: 3; display: flex; flex-direction: column; gap: 9px; }
.inline-card__head { display: flex; align-items: center; gap: 7px; font-size: var(--tt-type-small); font-weight: 600; color: var(--tt-text); }
.inline-card__head .pk-star { opacity: 1; }
.inline-card__name { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; }

/* Prism Ignition FX layers */
.fx-sheen { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; border-radius: inherit; }
.fx-sheen::before { content: ''; position: absolute; inset: -40%; background: linear-gradient(112deg, transparent 36%, color-mix(in srgb, var(--tt-effort-a) 22%, transparent) 46%, color-mix(in srgb, var(--tt-effort-c) 34%, white) 50%, color-mix(in srgb, var(--tt-effort-b) 20%, transparent) 54%, transparent 64%); transform: translateX(-110%); opacity: 0; }
.inline-card[data-arriving='true'] .fx-sheen::before { animation: fx-sheen-sweep 880ms cubic-bezier(.22, .8, .28, 1) 60ms both; }
@keyframes fx-sheen-sweep { 0% { transform: translateX(-95%); opacity: 0; } 20% { opacity: 0.9; } 100% { transform: translateX(95%); opacity: 0; } }

.fx-comet { display: none; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none; z-index: 2; -webkit-mask: linear-gradient(black 0 0) content-box, linear-gradient(black 0 0); -webkit-mask-composite: xor; mask: linear-gradient(black 0 0) content-box exclude, linear-gradient(black 0 0); container-type: size; }
.inline-card[data-highest='true'] .fx-comet { display: block; }
.fx-comet__spin { position: absolute; top: 50%; left: 50%; width: 155cqw; height: 155cqw; translate: -50% -50%; background: conic-gradient(from 0turn, transparent 0turn 0.58turn, color-mix(in srgb, var(--tt-effort-a) 45%, transparent) 0.76turn, var(--tt-effort-b) 0.91turn, var(--tt-effort-c) 0.97turn, transparent 1turn); animation: trace-turn 3.8s linear infinite; }

.fx-shockwave { position: absolute; top: 50%; left: calc(10px + var(--effort-x) * (100% - 20px)); width: 22px; height: 22px; border-radius: 50%; transform: translate(-50%, -50%) scale(0.5); border: 2px solid var(--tt-effort-c); box-shadow: 0 0 14px var(--tt-effort-b), inset 0 0 8px var(--tt-effort-a); opacity: 0; pointer-events: none; z-index: 2; }
.fx-shockwave--2 { border-color: var(--tt-effort-a); border-width: 1.5px; }
.inline-card[data-arriving='true'] .fx-shockwave { animation: fx-shock 780ms cubic-bezier(.16, .84, .32, 1) both; }
.inline-card[data-arriving='true'] .fx-shockwave--2 { animation: fx-shock 920ms cubic-bezier(.16, .84, .32, 1) 110ms both; }
@keyframes fx-shock { 0% { transform: translate(-50%, -50%) scale(0.7); opacity: 0.95; } 100% { transform: translate(-50%, -50%) scale(5.8); opacity: 0; } }

.ef-block { display: flex; flex-direction: column; gap: 6px; }
.ef-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; min-height: 20px; }
.ef-word { margin: 0; font-size: var(--tt-type-small); font-weight: 600; letter-spacing: -0.01em; color: var(--tt-text); display: inline-flex; align-items: center; line-height: 1.3; }
.ef-word > span { display: inline-block; }
.ef-word__mark { margin-right: 5px; flex: none; }
.ef-word[data-top='true'] { color: var(--tt-effort-text-fill); background: var(--tt-effort-text-image); -webkit-background-clip: text; background-clip: text; }
.ef-word[data-top='true'] .ef-word__mark { color: var(--tt-effort-text); }
.inline-card[data-arriving='true'] .ef-word[data-top='true'] { animation: ef-word-lift 480ms cubic-bezier(.2, .8, .2, 1) both; }
.inline-card[data-arriving='true'] .ef-word[data-top='true'] > span { animation: ef-letter-glow 500ms cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(80ms + var(--i) * 44ms); }
@keyframes ef-word-lift { from { transform: translateY(0); } 45% { transform: translateY(-1.5px); } to { transform: none; } }
@keyframes ef-letter-glow { from { color: var(--tt-text); } 40% { color: var(--tt-text); } to { color: var(--tt-effort-text-fill); } }
.ef-line { margin: 0; font-size: var(--tt-type-micro); color: var(--tt-text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.ef-range { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; appearance: none; background: transparent; border: 0; outline: 0; cursor: ew-resize; touch-action: none; z-index: 6; }
.ef-range::-webkit-slider-thumb { appearance: none; width: 24px; height: 24px; background: transparent; border: 0; }
.ef-range:disabled { cursor: default; }

.ef-stops { display: flex; justify-content: space-between; padding: 0 1px; }
.ef-stops button { border: 0; background: transparent; padding: 2px 3px; border-radius: var(--tt-radius-mark); color: var(--tt-text-faint); font-size: 10.5px; font-weight: 500; line-height: 1.2; transition: color 120ms ease; }
.ef-stops button:hover:not(:disabled) { color: var(--tt-text); }
.ef-stops button[data-active='true'] { color: var(--tt-text); font-weight: 600; }
.ef-stops button[data-active='true'][data-top='true'] { color: var(--tt-effort-text); }

/* =====================================================================
   SLIDER 1: SCRUB FILL BAR (Thumb-less glass-matte capsule, labels inside)
   ===================================================================== */
.s1-wrap {
  position: relative;
  height: 34px;
  border-radius: var(--tt-radius-row);
  background: var(--tt-well);
  border: 1px solid var(--tt-well-edge);
  box-shadow: inset 0 1px 3px rgb(0 0 0 / 0.34);
  overflow: hidden;
  display: flex;
  align-items: center;
}
.s1-fill {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: calc(var(--s1-pct) * 100%);
  background: var(--tt-effort-fill-image);
  opacity: calc(0.18 + 0.24 * var(--effort-heat));
  transition: width 110ms cubic-bezier(.2, .8, .2, 1), opacity 160ms ease;
  pointer-events: none;
}
.inline-card[data-dragging='true'] .s1-fill,
.inline-card[data-dragging='true'] .s1-edge { transition: none; }
/* Razor-bright glowing leading needle at the right edge of the fill */
.s1-edge {
  position: absolute;
  top: 3px;
  bottom: 3px;
  left: calc(var(--s1-pct) * 100% - 2px);
  width: 2.5px;
  border-radius: 2px;
  background: color-mix(in srgb, var(--tt-effort-c) 75%, white);
  box-shadow: 0 0 10px var(--tt-effort-b), 0 0 4px var(--tt-effort-c);
  transition: left 110ms cubic-bezier(.2, .8, .2, 1);
  pointer-events: none;
}
.s1-labels {
  position: relative;
  z-index: 2;
  width: 100%;
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  pointer-events: none;
}
.s1-labels span {
  text-align: center;
  font-size: 11px;
  font-weight: 500;
  color: var(--tt-text-muted);
  transition: color 120ms ease;
}
.s1-labels span[data-under='true'] { color: var(--tt-text-2); }
.s1-labels span[data-active='true'] { color: var(--tt-text); font-weight: 700; }
.s1-wrap:has(.ef-range:focus-visible) { outline: 2px solid var(--tt-focus-ring); outline-offset: 2px; }

/* =====================================================================
   SLIDER 2: POWER GAUGE (Draggable segmented energy cells)
   ===================================================================== */
.s2-wrap {
  position: relative;
  height: 30px;
  display: flex;
  align-items: center;
}
.s2-cells {
  width: 100%;
  height: 22px;
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 4px;
  padding: 3px;
  border-radius: var(--tt-radius-row);
  background: var(--tt-well);
  border: 1px solid var(--tt-well-edge);
  box-shadow: inset 0 1px 2px rgb(0 0 0 / 0.35);
  pointer-events: none;
}
.s2-cell {
  position: relative;
  border-radius: 4px;
  background: color-mix(in oklab, var(--tt-text) 5%, transparent);
  overflow: hidden;
  transition: transform 140ms cubic-bezier(.2, .8, .2, 1), opacity 140ms ease, box-shadow 180ms ease;
}
.s2-cell[data-lit='true'] {
  background: var(--cell-color);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.38), 0 0 calc(10px * var(--effort-heat)) color-mix(in srgb, var(--cell-color) calc(55% * var(--effort-heat)), transparent);
}
.s2-cell[data-head='true'] {
  box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.65), 0 0 14px var(--cell-color);
  transform: scaleY(1.08);
}
.s2-wrap:has(.ef-range:focus-visible) .s2-cells { outline: 2px solid var(--tt-focus-ring); outline-offset: 2px; }

/* =====================================================================
   SLIDER 3: MACHINED FADER (Graduated ruler ticks + vertical studio fader cap)
   ===================================================================== */
.s3-wrap {
  position: relative;
  height: 34px;
  display: flex;
  align-items: center;
}
.s3-groove {
  position: absolute;
  left: 6px;
  right: 6px;
  top: 50%;
  height: 3px;
  transform: translateY(-50%);
  border-radius: 2px;
  background: var(--tt-well);
  box-shadow: inset 0 1px 1px rgb(0 0 0 / 0.6), 0 1px 0 var(--tt-well-edge);
  overflow: hidden;
}
.s3-groove-fill {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: calc(var(--effort-x) * 100%);
  background: var(--tt-effort-fill-image);
  box-shadow: 0 0 8px var(--tt-effort-b);
}
.s3-ruler {
  position: absolute;
  left: 6px;
  right: 6px;
  top: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  pointer-events: none;
}
.s3-tick {
  width: 1.5px;
  height: 7px;
  border-radius: 1px;
  background: var(--tt-tick-off);
  transition: background-color 120ms ease, height 120ms ease;
}
.s3-tick[data-major='true'] { height: 15px; width: 2px; }
.s3-tick[data-lit='true'] { background: color-mix(in srgb, var(--tt-effort-b) 72%, var(--tt-text)); }
.s3-tick[data-major='true'][data-lit='true'] { background: var(--tt-effort-c); box-shadow: 0 0 6px var(--tt-effort-b); }

/* Vertical machined studio fader cap with glowing centre slit */
.s3-cap {
  position: absolute;
  top: 50%;
  left: calc(8px + var(--effort-x) * (100% - 16px));
  width: 14px;
  height: 26px;
  transform: translate(-50%, -50%);
  border-radius: 4px;
  background: var(--tt-fader-cap);
  border: 1px solid color-mix(in srgb, var(--tt-effort-b) calc(22% + 60% * var(--effort-heat)), var(--tt-fader-cap-edge));
  box-shadow: 0 3px 8px rgb(0 0 0 / 0.48), inset 0 1px 0 rgb(255 255 255 / 0.16),
    0 0 calc(14px * var(--effort-heat) * var(--effort-heat)) color-mix(in srgb, var(--tt-effort-b) 55%, transparent);
  display: grid;
  place-items: center;
  pointer-events: none;
  z-index: 3;
  transition: transform 120ms ease;
}
.s3-cap::after {
  content: '';
  width: 2px;
  height: 14px;
  border-radius: 1px;
  background: var(--tt-effort-c);
  box-shadow: 0 0 6px var(--tt-effort-b);
}
.inline-card[data-dragging='true'] .s3-cap { transform: translate(-50%, -50%) scale(1.08); }
.s3-wrap:has(.ef-range:focus-visible) .s3-cap { box-shadow: 0 0 0 2px var(--tt-surface), 0 0 0 4px var(--tt-focus-ring); }

/* =====================================================================
   SLIDER 4: SLIDING PILL THUMB (Minimal hairline + active word pill IS the thumb)
   ===================================================================== */
.s4-wrap {
  position: relative;
  height: 32px;
  display: flex;
  align-items: center;
  margin: 2px 0;
}
.s4-line {
  position: absolute;
  left: 16px;
  right: 16px;
  top: 50%;
  height: 2px;
  transform: translateY(-50%);
  border-radius: 2px;
  background: var(--tt-tick-off);
}
.s4-trail {
  position: absolute;
  left: 0;
  top: -0.5px;
  height: 3px;
  width: calc(var(--effort-x) * 100%);
  border-radius: 2px;
  background: var(--tt-effort-fill-image);
  box-shadow: 0 0 8px color-mix(in srgb, var(--tt-effort-b) 65%, transparent);
}
.s4-pearl {
  position: absolute;
  top: 50%;
  left: calc(16px + var(--stop) * (100% - 32px));
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--tt-surface-elevated);
  border: 1.5px solid var(--tt-tick-off);
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 2;
}
.s4-pearl[data-under='true'] {
  border-color: var(--tt-effort-b);
  background: var(--tt-effort-c);
}
/* The draggable word pill itself */
.s4-pill {
  position: absolute;
  top: 50%;
  left: calc(var(--effort-x) * 100%);
  transform: translate(calc(var(--effort-x) * -100%), -50%);
  height: 25px;
  padding: 0 10px;
  border-radius: var(--tt-radius-full);
  background: color-mix(in oklab, var(--tt-surface-elevated) 84%, var(--tt-effort-b));
  border: 1px solid color-mix(in srgb, var(--tt-effort-b) calc(35% + 65% * var(--effort-heat)), var(--tt-field-border));
  box-shadow: 0 2px 10px rgb(0 0 0 / 0.42), 0 0 calc(16px * var(--effort-heat) * var(--effort-heat)) color-mix(in srgb, var(--tt-effort-b) 55%, transparent);
  color: var(--tt-text);
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  pointer-events: none;
  z-index: 4;
  transition: box-shadow 180ms ease;
}
.s4-pill[data-top='true'] {
  color: var(--tt-effort-text);
  border-color: var(--tt-effort-border);
}
.s4-wrap:has(.ef-range:focus-visible) .s4-pill { box-shadow: 0 0 0 2px var(--tt-surface), 0 0 0 4px var(--tt-focus-ring); }

/* Speed & Toggles */
.pkC-speed-row { display: flex; align-items: center; gap: 8px; padding-top: 2px; }
.pkC-speed-row > span { font-size: var(--tt-type-micro); color: var(--tt-text-muted); flex: none; }
.speed-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 2px; border-radius: var(--tt-radius-row); background: color-mix(in oklab, var(--tt-text) 6%, transparent); flex: 1; }
.speed-seg button { height: 25px; padding: 0 8px; border: 0; border-radius: var(--tt-radius-control); background: transparent; color: var(--tt-text-muted); font-size: var(--tt-type-caption); white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.speed-seg button:hover { color: var(--tt-text); }
.speed-seg button[aria-checked='true'] { background: var(--tt-surface-elevated); color: var(--tt-text); font-weight: 600; box-shadow: 0 0 0 1px var(--tt-hairline); }
.speed-seg button[aria-checked='true'][data-fast='true'] { color: var(--tt-accent-text); }

.pk-toggles { padding: 6px 12px 7px; border-top: 1px solid var(--tt-hairline); display: flex; flex-direction: column; gap: 2px; flex: none; }
.pk-toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 27px; padding: 2px 0; border: 0; background: transparent; color: var(--tt-text); font-size: var(--tt-type-small); text-align: left; }
.pk-toggle:disabled { opacity: 0.45; cursor: default; }
.pk-switch { position: relative; width: 30px; height: 18px; border-radius: var(--tt-radius-full); border: 1px solid var(--tt-field-border); background: var(--tt-surface-sunken); flex: none; transition: background-color 140ms ease, border-color 140ms ease; }
.pk-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--tt-text-muted); transition: transform 140ms ease, background-color 140ms ease; }
.pk-toggle[aria-checked='true'] .pk-switch { background: var(--tt-accent-wash); border-color: var(--tt-accent-border); }
.pk-toggle[aria-checked='true'] .pk-switch::after { transform: translateX(12px); background: var(--tt-accent); }
</style>
</head>
<body>
  <header class="proto-bar" role="region" aria-label="Prototype controls">
    <div class="proto-title">
      <span class="proto-badge">ROUND 4</span>
      <span>Inline Card + Prism Ignition · 4 Slider Styles</span>
    </div>

    <div class="seg" role="group" aria-label="Slider style">
      <button type="button" data-style-pick="1" aria-pressed="false">1 · Scrub Fill Bar</button>
      <button type="button" data-style-pick="2" aria-pressed="false">2 · Power Gauge</button>
      <button type="button" data-style-pick="3" aria-pressed="false">3 · Machined Fader</button>
      <button type="button" data-style-pick="4" aria-pressed="false">4 · Sliding Pill</button>
      <button type="button" data-style-pick="compare" aria-pressed="true">Compare all 4</button>
    </div>

    <div class="seg" role="group" aria-label="Effort colourway">

function triggerArrival() {
  if (state.reducedMotion) { render(); return; }
  clearTimeout(state.arriveTimer);
  state.arriving = false;
  render();
  requestAnimationFrame(() => {
    state.arriving = true;
    render();
    state.arriveTimer = setTimeout(() => { state.arriving = false; render(); }, 1200);
  });
}

function setEffort(level, { forceArrive = false } = {}) {
  if (state.routing) return;
  const model = getModel();
  const wasTop = isHighestStop(model, state.effort);
  const nowTop = isHighestStop(model, level);
  state.effort = level;
  state.dragPos = null;
  if ((nowTop && !wasTop) || forceArrive) triggerArrival();
  else render();
}

function selectModel(id) {
  const m = getModel(id);
  if (state.routing) state.routing = false;
  state.modelId = m.id;
  if (m.efforts.length) { if (!m.efforts.includes(state.effort)) state.effort = m.defaultEffort || m.efforts[0]; }
  else state.effort = '';
  if (!m.speeds.includes(state.speed)) state.speed = 'standard';
  state.arriving = false;
  render();
}

  arrowUp: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>`,
  workflow: (size = 13) => `<svg class="ef-word__mark" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></svg>`,
};

function cellColor(i, count) {
  const pal = CELL_PALETTES[state.color] || CELL_PALETTES.cyberpunk;
  const idx = count <= 1 ? pal.length - 1 : Math.round((i / (count - 1)) * (pal.length - 1));
  return pal[idx];
}

function renderSliderControl(model, styleCode, slot, pos, count) {
  const x = count > 1 ? pos / (count - 1) : 0;
  const rounded = Math.round(pos);
  const shownId = model.efforts[rounded] || state.effort;
  const shownMeta = EFFORT_LABELS[shownId] || { full: 'Default', short: 'Default' };
  const top = !state.routing && isTopEffort(model, shownId);
  const shockwaves = `<span class="fx-shockwave" aria-hidden="true"></span><span class="fx-shockwave fx-shockwave--2" aria-hidden="true"></span>`;

  if (styleCode === '1') {
    const pct = (pos + 1) / count;
    return `<div class="s1-wrap" style="--s1-pct:${pct.toFixed(4)}" data-slider-track="${slot}">
      ${shockwaves}
      <div class="s1-fill" aria-hidden="true"></div>
      <div class="s1-edge" aria-hidden="true"></div>
      <div class="s1-labels" aria-hidden="true">
        ${model.efforts.map((lv, i) => {
          const m = EFFORT_LABELS[lv];
          return `<span data-under="${i <= rounded}" data-active="${!state.routing && i === rounded}">${count <= 4 ? m.full : m.short}</span>`;
        }).join('')}
      </div>
      <input class="ef-range" type="range" min="0" max="${Math.max(0, count - 1)}" step="0.001" value="${pos}" data-slider="${slot}" ${state.routing ? 'disabled' : ''} aria-label="Reasoning effort">
    </div>`;
  }

  if (styleCode === '2') {
    return `<div>
      <div class="s2-wrap" data-slider-track="${slot}">
        ${shockwaves}
        <div class="s2-cells" aria-hidden="true">
          ${model.efforts.map((lv, i) => `<span class="s2-cell" data-lit="${!state.routing && i <= rounded}" data-head="${!state.routing && i === rounded}" style="--cell-color:${cellColor(i, count)}"></span>`).join('')}
        </div>
        <input class="ef-range" type="range" min="0" max="${Math.max(0, count - 1)}" step="0.001" value="${pos}" data-slider="${slot}" ${state.routing ? 'disabled' : ''} aria-label="Reasoning effort">
      </div>
      <div class="ef-stops">
        ${model.efforts.map((lv, i) => {
          const m = EFFORT_LABELS[lv];
          return `<button type="button" data-action="effort-stop" data-effort="${lv}" data-active="${!state.routing && i === rounded}" data-top="${isTopEffort(model, lv)}" ${state.routing ? 'disabled' : ''}>${count <= 4 ? m.full : m.short}</button>`;
        }).join('')}
      </div>
    </div>`;
  }

  if (styleCode === '3') {
    const subPerStep = 4;
    const totalTicks = (count - 1) * subPerStep + 1;
    const litLimit = Math.round(x * (totalTicks - 1));
    const ticks = Array.from({ length: totalTicks }, (_, i) => {
      const major = i % subPerStep === 0;
      return `<span class="s3-tick" data-major="${major}" data-lit="${!state.routing && i <= litLimit}"></span>`;
    }).join('');
    return `<div>
      <div class="s3-wrap" data-slider-track="${slot}">
        ${shockwaves}
        <div class="s3-groove" aria-hidden="true"><div class="s3-groove-fill"></div></div>
        <div class="s3-ruler" aria-hidden="true">${ticks}</div>
        <span class="s3-cap" aria-hidden="true"></span>
        <input class="ef-range" type="range" min="0" max="${Math.max(0, count - 1)}" step="0.001" value="${pos}" data-slider="${slot}" ${state.routing ? 'disabled' : ''} aria-label="Reasoning effort">
      </div>
      <div class="ef-stops">
        ${model.efforts.map((lv, i) => {
          const m = EFFORT_LABELS[lv];
          return `<button type="button" data-action="effort-stop" data-effort="${lv}" data-active="${!state.routing && i === rounded}" data-top="${isTopEffort(model, lv)}" ${state.routing ? 'disabled' : ''}>${count <= 4 ? m.full : m.short}</button>`;
        }).join('')}
      </div>
    </div>`;
  }

  // Style 4: Sliding Pill Thumb
  return `<div>
    <div class="s4-wrap" data-slider-track="${slot}">
      ${shockwaves}
      <div class="s4-line" aria-hidden="true"><div class="s4-trail"></div></div>
      ${model.efforts.map((lv, i) => `<span class="s4-pearl" data-under="${!state.routing && i <= rounded}" style="--stop:${count > 1 ? i / (count - 1) : 0}"></span>`).join('')}
      <span class="s4-pill" data-top="${top}" aria-hidden="true">
        ${shownId === 'ultracode' && !state.routing ? ICONS.workflow(11).replace('class="ef-word__mark"', '') : ''}
        <span>${state.routing ? 'Auto' : shownMeta.full}</span>
      </span>
      <input class="ef-range" type="range" min="0" max="${Math.max(0, count - 1)}" step="0.001" value="${pos}" data-slider="${slot}" ${state.routing ? 'disabled' : ''} aria-label="Reasoning effort">
    </div>
    <div class="ef-stops">
      ${model.efforts.map((lv, i) => {
        const m = EFFORT_LABELS[lv];
        return `<button type="button" data-action="effort-stop" data-effort="${lv}" data-active="${!state.routing && i === rounded}" data-top="${isTopEffort(model, lv)}" ${state.routing ? 'disabled' : ''}>${count <= 4 ? m.full : m.short}</button>`;
      }).join('')}
    </div>
  </div>`;
}

function renderInlineCard(model, styleCode, slot) {
  const starred = state.favorites.has(model.id);
  const count = model.efforts.length;
  const idx = Math.max(0, model.efforts.indexOf(state.effort));
  const pos = (state.dragging && state.dragPos !== null) ? state.dragPos : idx;
  const rounded = Math.round(pos);
  const shownId = model.efforts[rounded] || state.effort;
  const info = EFFORT_LABELS[shownId] || { full: 'Default', line: '' };
  const x = count > 1 ? pos / (count - 1) : 0;
  const top = count > 1 && !state.routing && isTopEffort(model, shownId);
  const highest = count > 1 && !state.routing && isHighestStop(model, shownId);
  const letters = Array.from(info.full, (ch, i) => `<span style="--i:${i}">${ch === ' ' ? '&nbsp;' : ch}</span>`).join('');

  return `<div class="inline-card" data-style="${styleCode}" data-top="${top}" data-highest="${highest}" data-arriving="${state.arriving && highest}" data-dragging="${state.dragging}"
    style="--effort-x:${x.toFixed(4)};--effort-heat:${(state.routing ? 0 : x).toFixed(3)}" role="group" aria-label="${model.name}, active model">
    <div class="fx-sheen" aria-hidden="true"></div>
    <div class="fx-comet" aria-hidden="true"><div class="fx-comet__spin"></div></div>

    <div class="inline-card__content">
      <div class="inline-card__head">
        <span class="inline-card__name">
          ${svgMark(model.providerId, 14)}
          <span class="pk-row__name">${model.name}</span>
          ${model.source ? `<span class="pk-row__source">${model.source}</span>` : ''}
        </span>
        ${ICONS.check}
        <button type="button" class="pk-star" data-action="star" data-model="${model.id}" data-starred="${starred}">${ICONS.star(starred, 13)}</button>
      </div>

      ${count > 0 ? `<div class="ef-block">
        <div class="ef-head">
          <p class="ef-word" data-top="${top}">
            ${shownId === 'ultracode' && !state.routing ? ICONS.workflow(13) : ''}
            ${state.routing ? '<span>Auto</span>' : letters}
          </p>
          <p class="ef-line">${state.routing ? 'Chosen by model routing' : info.line}</p>
        </div>
        ${renderSliderControl(model, styleCode, slot, pos, count)}
      </div>` : `<p class="ef-line">No effort levels.</p>`}

      ${model.speeds.length > 1 ? `<div class="pkC-speed-row"><span>Speed</span>
        <div class="speed-seg" role="radiogroup" aria-label="Speed">
          ${model.speeds.map(sp => {
            const fast = sp !== 'standard';
            const bolts = sp === 'fast' ? ICONS.bolt(true, 11) : sp === 'ultrafast' ? ICONS.bolt(true, 11) + ICONS.bolt(true, 11) : '';
            return `<button type="button" role="radio" data-action="speed" data-speed="${sp}" data-fast="${fast}" aria-checked="${state.speed === sp}">${bolts}${SPEED_META[sp].name}</button>`;
          }).join('')}
        </div>
      </div>` : ''}
    </div>
  </div>`;
}

function renderPicker(styleCode, slot) {
  const model = getModel();
  const q = state.query[slot].trim().toLowerCase();
  const tab = state.providerTab[slot];
  const items = MODELS.filter(m => {
    if (q) return `${m.name} ${m.provider} ${m.source || ''}`.toLowerCase().includes(q);
    return tab === 'favorites' ? state.favorites.has(m.id) : m.providerId === tab;
  });

  return `<div class="picker" role="dialog" aria-label="Model, effort and speed" ${state.open[slot] ? '' : 'hidden'}>
    <div class="pk-search">
      ${ICONS.search}
      <input type="text" data-search="${slot}" value="${state.query[slot]}" placeholder="Search models" aria-label="Search models">
      <button type="button" class="pk-close" data-action="close" data-slot="${slot}" aria-label="Close picker">${ICONS.x}</button>
    </div>
    <div class="pkC-providers" role="tablist" aria-label="Providers">
      ${PROVIDERS.map(p => `<button type="button" role="tab" data-action="tab" data-slot="${slot}" data-tab="${p.id}" aria-selected="${tab === p.id}" title="${p.name}">${p.id === 'favorites' ? ICONS.star(false, 14) : svgMark(p.id, 14)}</button>`).join('')}
    </div>
    <div class="pkC-list" role="listbox">
      ${items.map(m => m.id === model.id
        ? renderInlineCard(m, styleCode, slot)
        : `<button type="button" class="pk-row" role="option" data-action="pick-model" data-model="${m.id}">
            <span class="pk-row__main">${tab === 'favorites' ? svgMark(m.providerId, 13) : ''}<span class="pk-row__name">${m.name}</span>${m.source ? `<span class="pk-row__source">${m.source}</span>` : ''}</span>
            <span class="pk-star" role="button" tabindex="-1" data-action="star" data-model="${m.id}" data-starred="${state.favorites.has(m.id)}">${ICONS.star(state.favorites.has(m.id), 13)}</span>
          </button>`
      ).join('')}
    </div>
    <div class="pk-toggles">
      <button type="button" class="pk-toggle" role="switch" data-action="toggle-dynamic" aria-checked="${state.dynamic}" ${state.routing ? 'disabled' : ''}>
        <span>Dynamic</span><span class="pk-switch" aria-hidden="true"></span>
      </button>
      <button type="button" class="pk-toggle" role="switch" data-action="toggle-routing" aria-checked="${state.routing}" ${state.dynamic ? 'disabled' : ''}>
        <span>Model routing</span><span class="pk-switch" aria-hidden="true"></span>
      </button>
    </div>
  </div>`;
}

function renderComposer(styleCode, slot) {
  const model = getModel();
  const hasEffort = model.efforts.length > 0;
  const effWord = hasEffort ? (EFFORT_LABELS[state.effort]?.full || 'Default') : '';
  const hasSpeed = model.speeds.length > 1;
  const isFast = hasSpeed && state.speed !== 'standard';
  const bolts = !hasSpeed ? '' : state.speed === 'standard' ? ICONS.bolt(false, 12, true) : state.speed === 'ultrafast' ? ICONS.bolt(true, 12) + ICONS.bolt(true, 12) : ICONS.bolt(true, 12);
  const top = hasEffort && !state.routing && isTopEffort(model, state.effort);

  return `<div class="composer-dock">
    <div class="composer" data-top-effort="${top}">
      <div class="composer-trace" aria-hidden="true">
        <div class="composer-trace__halo"><div class="composer-trace__glow"><div class="composer-trace__stretch"><div class="composer-trace__light"></div></div></div></div>
        <div class="composer-trace__line"><div class="composer-trace__stretch"><div class="composer-trace__light"></div></div></div>
      </div>
      <div class="composer__input">19. iOS journeys passed, mergeable.</div>
      <div class="composer__footer">
        <button type="button" class="composer__attach" aria-label="Attach">${ICONS.plus}</button>
        <div class="composer__right">
          <button type="button" class="perm-chip">${ICONS.shield}<span>Full access</span></button>
          <div class="combo-anchor">
            ${renderPicker(styleCode, slot)}
            <button type="button" class="combo-trigger" data-action="toggle-open" data-slot="${slot}" aria-expanded="${state.open[slot]}">
              <span class="combo-trigger__model">${svgMark(model.providerId, 14)}<span>${state.routing ? 'Auto · ' : ''}${model.name}</span></span>
              ${(hasEffort || hasSpeed) ? `<span class="combo-trigger__effort"><span class="combo-trigger__effort-word" data-top="${top}">${effWord}</span><span class="combo-trigger__bolts" data-fast="${isFast}">${bolts}</span></span>` : ''}
            </button>
          </div>
          <button type="button" class="send-disc" aria-label="Send">${ICONS.arrowUp}</button>
        </div>
      </div>
    </div>
  </div>`;
}

function renderRoom(styleCode, slot) {
  return `<div class="room">
    <div class="room-strip"><b>Sotto</b><span>·</span><span>${STYLES[styleCode].name}</span></div>
    <div class="transcript"><div class="transcript__inner">
      <div class="t-msg t-msg--user">Check the iOS journeys PR and confirm whether all required checks are green.</div>
      <div class="t-msg"><p>Drag any slider below across stops and into <b>Ultracode</b> to feel how it moves and fires Prism Ignition.</p></div>
    </div></div>
    ${renderComposer(styleCode, slot)}
  </div>`;
}

function render() {
  document.documentElement.dataset.theme = state.theme;
  document.documentElement.dataset.effortColor = state.color;
  document.documentElement.dataset.reducedMotion = state.reducedMotion ? 'on' : 'off';

  document.querySelectorAll('[data-style-pick]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.stylePick === state.style)));
  document.querySelectorAll('[data-color-pick]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.colorPick === state.color)));
  document.getElementById('btn-theme').textContent = state.theme === 'light' ? 'Dark' : 'Light';
  document.getElementById('btn-theme').setAttribute('aria-pressed', String(state.theme === 'light'));
  document.getElementById('btn-motion').setAttribute('aria-pressed', String(state.reducedMotion));

  const info = STYLES[state.style];
  document.getElementById('brief').innerHTML = `<div><strong>${info.name}</strong><span>${info.summary}</span></div><div class="brief-meta">${info.meta}</div>`;

  const stage = document.getElementById('stage');
  const activeSearch = document.activeElement?.dataset?.search;
  const selStart = activeSearch ? document.activeElement.selectionStart : null;

  if (state.style === 'compare') {
    stage.innerHTML = `<div class="stage-compare">
      ${['1', '2', '3', '4'].map(code => `<section class="compare-col">
        <div class="compare-col__head">
          <div><h2>${STYLES[code].name}</h2><p>${STYLES[code].meta}</p></div>
          <button type="button" class="compare-col__pick" data-action="solo" data-slot="${code}">Focus ${code}</button>
        </div>
        ${renderRoom(code, code)}
      </section>`).join('')}
    </div>`;
  } else {
    stage.innerHTML = `<section class="stage-single">${renderRoom(state.style, state.style)}</section>`;
  }

  if (activeSearch) {
    const input = stage.querySelector(`input[data-search="${activeSearch}"]`);
    if (input) { input.focus(); if (selStart !== null) input.setSelectionRange(selStart, selStart); }
  }
}

/* Smooth 60fps magnetic drag across all 4 slider styles */
const MAGNET = 0.22;
function magnet(raw) {
  const near = Math.round(raw), d = raw - near;
  return Math.abs(d) < MAGNET ? near + d * Math.pow(Math.abs(d) / MAGNET, 2) : raw;
}

function paintLiveDrag(card, model, pos) {
  const count = model.efforts.length;
  const x = count > 1 ? pos / (count - 1) : 0;
  const rounded = Math.round(pos);
  const lv = model.efforts[rounded];
  const info = EFFORT_LABELS[lv];
  const top = isTopEffort(model, lv);
  const highest = isHighestStop(model, lv);

  card.style.setProperty('--effort-x', x.toFixed(4));
  card.style.setProperty('--effort-heat', x.toFixed(3));
  card.dataset.top = String(top);
  card.dataset.highest = String(highest);
  card.dataset.dragging = 'true';

  const word = card.querySelector('.ef-word');
  const line = card.querySelector('.ef-line');
  if (word && info) {
    word.dataset.top = String(top);
    word.innerHTML = (lv === 'ultracode' ? ICONS.workflow(13) : '') + Array.from(info.full, (ch, i) => `<span style="--i:${i}">${ch}</span>`).join('');
  }
  if (line && info) line.textContent = info.line;

  // Style 1: Scrub fill bar
  const s1 = card.querySelector('.s1-wrap');
  if (s1) {
    s1.style.setProperty('--s1-pct', ((pos + 1) / count).toFixed(4));
    s1.querySelectorAll('.s1-labels span').forEach((sp, i) => {
      sp.dataset.under = String(i <= rounded);
      sp.dataset.active = String(i === rounded);
    });
  }
  // Style 2: Power gauge cells
  card.querySelectorAll('.s2-cell').forEach((cell, i) => {
    cell.dataset.lit = String(i <= rounded);
    cell.dataset.head = String(i === rounded);
  });
  // Style 3: Ruler ticks
  const ticks = card.querySelectorAll('.s3-tick');
  if (ticks.length) {
    const litLimit = Math.round(x * (ticks.length - 1));
    ticks.forEach((t, i) => { t.dataset.lit = String(i <= litLimit); });
  }
  // Style 4: Pearls & sliding pill text
  card.querySelectorAll('.s4-pearl').forEach((p, i) => { p.dataset.under = String(i <= rounded); });
  const pill = card.querySelector('.s4-pill');
  if (pill && info) {
    pill.dataset.top = String(top);
    pill.innerHTML = (lv === 'ultracode' ? ICONS.workflow(11).replace('class="ef-word__mark"', '') : '') + `<span>${info.full}</span>`;
  }
  card.querySelectorAll('.ef-stops button').forEach((b, i) => { b.dataset.active = String(i === rounded); });
}

document.addEventListener('pointerdown', e => {
  const input = e.target.closest('input.ef-range');
  if (!input || input.disabled) return;
  state.dragging = true;
  state.dragPos = Number(input.value);
});

document.addEventListener('input', e => {
  if (e.target?.dataset?.search) { state.query[e.target.dataset.search] = e.target.value; render(); return; }
  if (e.target.matches('input.ef-range')) {
    const model = getModel();
    const raw = Number(e.target.value);
    const snapped = state.dragging ? magnet(raw) : Math.round(raw);
    state.dragPos = snapped;
    const card = e.target.closest('.inline-card');
    if (card) paintLiveDrag(card, model, snapped);
  }
});

document.addEventListener('change', e => {
  if (e.target.matches('input.ef-range')) {
    const model = getModel();
    const idx = Math.max(0, Math.min(model.efforts.length - 1, Math.round(Number(e.target.value))));
    state.dragging = false;
    state.dragPos = null;
    if (model.efforts[idx]) setEffort(model.efforts[idx]);
  }
});

document.addEventListener('pointerup', () => {
  if (!state.dragging) return;
  const model = getModel();
  const idx = Math.max(0, Math.min(model.efforts.length - 1, Math.round(state.dragPos ?? 0)));
  state.dragging = false;
  state.dragPos = null;
  if (model.efforts[idx]) setEffort(model.efforts[idx]);
});

document.addEventListener('wheel', e => {
  const track = e.target.closest('[data-slider-track]');
  if (!track || state.routing || e.deltaY === 0) return;
  e.preventDefault();
  const model = getModel();
  const cur = model.efforts.indexOf(state.effort);
  const next = Math.max(0, Math.min(model.efforts.length - 1, cur + (e.deltaY < 0 ? 1 : -1)));
  if (next !== cur) setEffort(model.efforts[next]);
}, { passive: false });

document.addEventListener('click', e => {
  const stBtn = e.target.closest('[data-style-pick]');
  if (stBtn) {
    state.style = stBtn.dataset.stylePick;
    if (state.style === 'compare') state.open = { '1': true, '2': true, '3': true, '4': true };
    else state.open[state.style] = true;
    render();
    return;
  }
  const colBtn = e.target.closest('[data-color-pick]');
  if (colBtn) {
    state.color = colBtn.dataset.colorPick;
    if (isHighestStop(getModel(), state.effort)) triggerArrival();
    else render();
    return;
  }
  if (e.target.id === 'btn-replay') {
    const m = getModel();
    if (m.efforts.length) setEffort(m.efforts[m.efforts.length - 1], { forceArrive: true });
    return;
  }
  if (e.target.id === 'btn-theme') { state.theme = state.theme === 'dark' ? 'light' : 'dark'; render(); return; }
  if (e.target.id === 'btn-motion') { state.reducedMotion = !state.reducedMotion; render(); return; }

  const act = e.target.closest('[data-action]');
  if (!act) {
    if (state.style !== 'compare' && !e.target.closest('.picker') && !e.target.closest('.combo-trigger') && e.target.closest('.room')) {
      if (state.open[state.style]) { state.open[state.style] = false; render(); }
    }
    return;
  }
  const { action, slot } = act.dataset;
  if (action === 'solo') { state.style = slot; state.open[slot] = true; render(); return; }
  if (action === 'toggle-open') { state.open[slot] = !state.open[slot]; render(); return; }
  if (action === 'close') { state.open[slot] = false; render(); return; }
  if (action === 'tab') { state.providerTab[slot] = act.dataset.tab; render(); return; }
  if (action === 'star') {
    e.stopPropagation();
    const id = act.dataset.model;
    state.favorites.has(id) ? state.favorites.delete(id) : state.favorites.add(id);
    render();
    return;
  }
  if (action === 'pick-model') { selectModel(act.dataset.model); return; }
  if (action === 'effort-stop') { setEffort(act.dataset.effort, { forceArrive: isHighestStop(getModel(), act.dataset.effort) }); return; }
  if (action === 'speed') { state.speed = act.dataset.speed; render(); return; }
  if (action === 'toggle-dynamic') { if (!state.routing) { state.dynamic = !state.dynamic; render(); } return; }
  if (action === 'toggle-routing') { if (!state.dynamic) { state.routing = !state.routing; render(); } return; }
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') {
    if (e.key === 'Escape' && e.target.dataset.search) {
      const s = e.target.dataset.search;
      if (state.query[s]) { state.query[s] = ''; render(); }
      else { state.open[s] = false; render(); }
    }
    return;
  }
  if (e.key === '1') { state.style = '1'; state.open['1'] = true; render(); }
  else if (e.key === '2') { state.style = '2'; state.open['2'] = true; render(); }
  else if (e.key === '3') { state.style = '3'; state.open['3'] = true; render(); }
  else if (e.key === '4') { state.style = '4'; state.open['4'] = true; render(); }
  else if (e.key === '5') { state.style = 'compare'; state.open = { '1': true, '2': true, '3': true, '4': true }; render(); }
});

render();
</script>
</body>
</html>
