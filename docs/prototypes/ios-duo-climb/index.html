<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PROTOTYPE: the Duo design climb, round 1</title>
<!--
  THROWAWAY PROTOTYPE. Not product code.
  Question: for each surface the round 0 judges marked down on the iPhone Duo, which variant should the app build?
  Opens on the Duo and picks its posture from the window, folded, sideways or upright. Colours are the Sotto theme's,
  measurements come from the app's captures. Upright can't be captured from the simulator, so it is a sketch.
  Plan: docs/plans/2026-11-08-ios-duo-design-climb.md
-->
<style>
@font-face { font-family: 'Figtree'; font-weight: 300 900; font-display: swap; src: url('figtree-latin.woff2') format('woff2'); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { font: 15px/1.3 'Figtree', -apple-system, system-ui, sans-serif; color: #eee; display: flex; flex-direction: column; -webkit-text-size-adjust: 100%; }
button, select { font: inherit; color: inherit; }

/* The prototype's own controls, outside the Duo's screen. */
#bar { flex: none; background: #17181b; border-bottom: 1px solid #2c2e33; padding: 5px 8px; padding-top: max(5px, env(safe-area-inset-top)); }
#row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#surface { background: #26282c; border: 0; border-radius: 9px; padding: 6px 8px; font-weight: 600; font-size: 14px; max-width: 170px; }
.seg { display: inline-flex; background: #26282c; border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: none; padding: 5px 9px; border-radius: 7px; font-size: 13px; font-weight: 600; color: #b5b8be; min-width: 30px; }
.seg button.on { background: #47b8a9; color: #04201c; }
.seg button.rec::after { content: ' ★'; font-size: 11px; }
#caption { font-size: 13px; color: #c8cbd0; margin-top: 4px; line-height: 1.3; }
#caption b { color: #fff; font-weight: 600; }
#holder { flex: 1; min-height: 0; position: relative; overflow: hidden; background: #000; }
#holder.actual { overflow: auto; -webkit-overflow-scrolling: touch; }
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: var(--ground); color: var(--ink); font-size: 17px; line-height: 1.32; }

/* The Sotto theme. */
.dark { --ground:#040507; --card:#111316; --sheet:#15171a; --opt:#1f2124; --soft:#26282a; --ink:#f3f4f5; --muted:#a0a5ae; --dim:#6d7178; --hair:rgba(255,255,255,.1); --accent:#47b8a9; --acctext:#6bc3b6; --accsurf:#0c3b36; --onacc:#04201c; --warn:#fe9a00; --warntext:#ffb86b; --danger:#ff4a55; --dangertext:#ff8a8a; --bubble:#13161d; --glass:rgba(58,60,64,.82); --glassdim:#85888d; --scrim:rgba(0,0,0,.42); --washa:rgba(71,184,169,.24); --washw:rgba(254,154,0,.24); --tile:#0a0c10; --rgb:71,184,169; --dimbtn:#2a5b56; --dimtext:#0d2b28; }
.light { --ground:#f9f8f5; --card:#f2f0ec; --sheet:#fbfaf7; --opt:#f0efec; --soft:#e9e7e2; --ink:#1c1a17; --muted:#68625b; --dim:#8f8a82; --hair:rgba(0,0,0,.1); --accent:#007d74; --acctext:#1e665e; --accsurf:#cfece7; --onacc:#fdfcf9; --warn:#c96a00; --warntext:#9a5200; --danger:#d42c37; --dangertext:#b3202a; --bubble:#ebe9e3; --glass:rgba(233,231,226,.88); --glassdim:#8f8a82; --scrim:rgba(0,0,0,.22); --washa:rgba(0,125,116,.14); --washw:rgba(201,106,0,.14); --tile:#fff; --rgb:0,125,116; --dimbtn:#92c6c0; --dimtext:#2f6b65; }
#stage { --cg: 0 6px 24px rgba(var(--rgb),.5); --ng: 0 6px 24px rgba(var(--rgb),.5); }
#stage.glow-A { --cg: none; --ng: none; }
#stage.glow-B { --cg: 0 3px 11px rgba(var(--rgb),.24); --ng: 0 3px 11px rgba(var(--rgb),.24); }
#stage.glow-C { --cg: none; }

svg { display: block; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
svg.solid { fill: currentColor; stroke: none; }
.abs { position: absolute; }
.clip { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* Rail */
.circle { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; display: grid; place-items: center; color: var(--acctext); background: color-mix(in srgb, var(--accent) 10%, var(--ground)); border: 1px solid color-mix(in srgb, var(--accent) 34%, transparent); }
.chrome { box-shadow: var(--cg); }
.newt { box-shadow: var(--ng); }
.pill { position: absolute; width: 58px; border-radius: 29px; background: var(--ground); border: 1px solid var(--hair); display: flex; flex-direction: column; align-items: center; }
.tile { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); margin: 1px 0; position: relative; flex: none; }
.tile.on { background: var(--accsurf); color: var(--acctext); }
.badge { position: absolute; top: 1px; right: 0; min-width: 18px; height: 18px; border-radius: 9px; background: var(--warn); color: #201200; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.state { font-size: 13px; font-weight: 600; text-align: center; line-height: 1.15; padding: 11px 2px 2px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
.w { background: var(--warn); box-shadow: 0 0 12px 4px color-mix(in srgb, var(--warn) 42%, transparent); }
.g { background: var(--accent); box-shadow: 0 0 12px 4px rgba(var(--rgb),.4); }
.r { background: var(--danger); box-shadow: 0 0 12px 4px color-mix(in srgb, var(--danger) 40%, transparent); }
.i { background: none; border: 2px solid var(--muted); }
.clock { position: absolute; font-weight: 700; font-size: 15px; transform: translateX(-50%); }
.ring { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; color: #35c75a; }

/* Conversation */
.conv { position: absolute; top: 0; bottom: 0; overflow: hidden; }
.conv p { margin: 0 0 13px; }
.conv .tbl { border: 1px solid var(--hair); border-radius: 14px; margin-bottom: 15px; background: color-mix(in srgb, var(--card) 45%, var(--ground)); font-size: 15px; overflow: hidden; }
.tr { display: grid; padding: 9px 12px; border-top: 1px solid var(--hair); }
.tr:first-child { border-top: 0; color: var(--muted); font-size: 14px; font-weight: 600; }
.bub { margin: 0 0 16px auto; width: fit-content; max-width: 86%; background: var(--bubble); border: 1px solid var(--hair); border-radius: 16px; padding: 9px 15px; }
.codex { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); margin-bottom: 7px; font-weight: 500; }
.ctile { width: 18px; height: 18px; border-radius: 5px; background: var(--accsurf); color: var(--acctext); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.composer { position: absolute; height: 50px; border-radius: 25px; background: #18191b; display: flex; align-items: center; padding: 0 7px; gap: 6px; color: var(--muted); }
.light .composer { background: #e9e7e2; }
.disc { width: 34px; height: 34px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; color: var(--ink); flex: none; }

/* Sidebar */
.side { position: absolute; left: 0; top: 0; bottom: 0; width: 280px; border-right: 1px solid var(--hair); overflow-y: auto; padding: 70px 8px 16px; }
.sidehead { position: absolute; left: 16px; top: 16px; font-size: 20px; font-weight: 700; z-index: 1; }
.sec { font-size: 15px; color: var(--muted); font-weight: 500; padding: 10px 12px 5px; }
.sec span { margin-left: 5px; }
.rowt { display: flex; gap: 10px; padding: 7px 8px 7px 12px; border-radius: 14px; min-height: 54px; }
.rowt.ch { background: var(--accsurf); }
.rowt.ch .tt { color: var(--acctext); }
.rowt .dot { margin-top: 7px; }
.tt { font-weight: 600; line-height: 1.22; }
.mt { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 5px; margin-top: 2px; min-width: 0; }
.mt > .clip { min-width: 0; }
.tm { font-size: 13px; color: var(--muted); flex: none; }
.two { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* Sheets */
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheet { position: absolute; background: var(--sheet); border-radius: 26px 26px 26px 26px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 -8px 30px rgba(0,0,0,.28); }
.grab { flex: none; width: 36px; height: 4px; border-radius: 2px; background: var(--dim); margin: 6px auto 0; }
.wash { position: absolute; left: 0; right: 0; top: 0; height: 120px; background: radial-gradient(90% 100% at 8% 0, var(--washa), transparent 72%), radial-gradient(70% 90% at 100% 0, var(--washw), transparent 70%); pointer-events: none; }
.from { position: relative; font-size: 15px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.q { position: relative; font-size: 22px; font-weight: 600; letter-spacing: -.3px; line-height: 1.22; margin-top: 11px; color: var(--ink); }
.opt { display: flex; gap: 14px; border: 1px solid var(--hair); background: var(--opt); border-radius: 15px; padding: 11px 15px; margin-top: 8px; cursor: pointer; }
.opt .ra { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--dim); margin-top: 3px; }
.opt.on { border-color: var(--accent); }
.opt.on .ra { border: 6px solid var(--accent); }
.opt b { font-weight: 600; display: block; }
.opt small { font-size: 15px; color: var(--muted); display: block; line-height: 1.26; margin-top: 1px; }
.foot { flex: none; display: flex; gap: 8px; border-top: 1px solid var(--hair); padding: 12px 20px; }
.btn { flex: 1; height: 44px; border-radius: 22px; display: grid; place-items: center; font-weight: 600; border: 0; }
.btn.soft { background: var(--soft); color: var(--ink); }
.btn.pri { background: var(--accent); color: var(--onacc); box-shadow: 0 5px 20px rgba(var(--rgb),.35); display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn.dimp { background: var(--dimbtn); color: var(--dimtext); }
.tabs { display: flex; gap: 8px; padding: 0 20px 10px; flex: none; border-bottom: 1px solid var(--hair); overflow: hidden; }
.tab { flex: none; height: 44px; padding: 0 16px; border-radius: 22px; background: var(--soft); display: flex; align-items: center; gap: 7px; font-weight: 500; border: 1px solid var(--hair); }
.tab.on { background: var(--accsurf); border: 2px solid var(--accent); box-shadow: 0 2px 12px rgba(var(--rgb),.32); }
.tabs.tight { gap: 5px; }
.tabs.tight .tab { padding: 0 11px; height: 40px; font-size: 15px; gap: 5px; }
.rd { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); }
.prbody { flex: 1; min-height: 0; overflow-y: auto; }
.chipm { font: 14px ui-monospace, Menlo, monospace; background: var(--opt); padding: 3px 7px; border-radius: 7px; }
.strow { display: flex; gap: 14px; padding: 11px 16px; }
.strow + .strow > div:last-child { border-top: 0; }
.st { flex: none; width: 22px; height: 22px; }
.stt { font-weight: 600; }
.sts { font-size: 15px; color: var(--muted); }
.group { background: var(--card); border-radius: 18px; margin: 12px 0; }
.dark .group { background: #191b1e; }
.lbl { color: var(--muted); font-size: 15px; font-weight: 600; }
.dock { flex: none; border: 1px solid var(--hair); border-radius: 22px; margin: 8px 12px 14px; padding: 12px 14px; background: var(--sheet); }
.note { font-size: 15px; color: var(--muted); display: flex; gap: 10px; margin-bottom: 10px; }

/* ••• menu */
.menu { position: absolute; width: 250px; border-radius: 26px; background: var(--glass); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.4); }
.mi { padding: 11px 19px; display: flex; align-items: center; gap: 12px; }
.mi small { display: block; font-size: 13px; color: var(--muted); }
.mh { height: 1px; background: var(--hair); margin: 0 19px; }
.fact { display: flex; gap: 9px; font-size: 14px; color: var(--muted); padding: 3px 0; line-height: 1.24; align-items: flex-start; }
.fact svg { flex: none; margin-top: 2px; }
.cp { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; padding: 4px 9px; border-radius: 13px; background: color-mix(in srgb, var(--ink) 12%, transparent); color: var(--ink); max-width: 100%; }

/* Pages */
.page { position: absolute; top: 0; bottom: 0; overflow-y: auto; }
.pt { font-size: 28px; font-weight: 700; letter-spacing: -.5px; }
.ps { font-size: 15px; color: var(--muted); margin: 6px 0 18px; }
.pcard { background: var(--card); border-radius: 20px; padding: 16px; margin-bottom: 12px; }
.segs { display: flex; background: var(--soft); border-radius: 22px; padding: 3px; height: 44px; align-items: stretch; }
.segs div { flex: 1; display: grid; place-items: center; border-radius: 19px; color: var(--muted); font-size: 15px; font-weight: 500; }
.segs .on { background: var(--card); color: var(--ink); border: 1px solid var(--hair); }
.sizes { display: flex; background: var(--opt); border-radius: 13px; height: 50px; align-items: center; position: relative; }
.sizes div { flex: 1; text-align: center; font-weight: 700; color: var(--muted); }
.sizes .on { color: var(--acctext); background: var(--card); border-radius: 10px; height: 44px; display: grid; place-items: center; border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); box-shadow: 0 0 12px rgba(var(--rgb),.3); }
.slide { height: 7px; border-radius: 4px; background: var(--soft); position: relative; flex: 1; }
.slide::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 50%; border-radius: 4px; background: var(--accent); }
.slide::after { content: ''; position: absolute; left: calc(50% - 18px); top: -8px; width: 37px; height: 23px; border-radius: 12px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
.srow { padding: 13px 0; border-top: 1px solid var(--hair); }
.srow:first-child { border-top: 0; padding-top: 0; }
.srow:last-child { padding-bottom: 0; }
.rowhead { display: flex; justify-content: space-between; font-weight: 500; margin-bottom: 9px; }
.rowhead span { color: var(--muted); font-size: 15px; font-weight: 400; }
.side-label { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: center; }
.side-label .rowhead { margin: 0; flex-direction: column; }
.hint { font-size: 15px; color: var(--muted); margin-top: 8px; }
.side-label .hint { margin-top: 2px; }
.sample { margin-top: 10px; padding: 9px 12px; border-radius: 12px; background: var(--opt); }
.sample i { font-style: normal; font-size: 12px; color: var(--muted); font-weight: 600; display: block; margin-bottom: 2px; }

/* Agents */
.ag { padding: 12px 14px; display: flex; gap: 12px; border-top: 1px solid var(--hair); }
.ag:first-child { border-top: 0; }
.agt { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--opt); display: grid; place-items: center; color: var(--ink); }
.agb { flex: 1; min-width: 0; }
.tag { display: inline-block; font-size: 13px; color: var(--muted); border: 1px solid var(--hair); border-radius: 11px; padding: 1px 8px; font-weight: 500; }
.ags { display: flex; gap: 9px; align-items: center; font-size: 15px; margin-top: 4px; }
.smeta { font-size: 13px; color: var(--muted); margin-top: 2px; }
.sprev { font-size: 15px; color: var(--muted); }
.open { display: inline-block; margin-top: 7px; padding: 8px 14px; background: var(--soft); border-radius: 17px; font-weight: 500; font-size: 15px; }
.ask { color: var(--warntext); }
.wk { color: var(--acctext); }
.tell { position: absolute; left: 50%; top: 42%; transform: translateX(-50%); width: 78%; text-align: center; background: var(--card); border: 1px solid var(--hair); padding: 16px; border-radius: 18px; font-size: 16px; color: var(--muted); }
</style>
</head>
<body>
<div id="bar">
  <div id="row">
    <select id="surface" aria-label="Surface"></select>
    <div class="seg" id="variants"></div>
    <div class="seg" id="postures"></div>
    <div class="seg" id="tools"></div>
  </div>
  <div id="caption"></div>
</div>
<div id="holder"><div id="stage"></div></div>

<script>
const I = {
  plus: s => `<svg width="${s||22}" height="${s||22}" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>`,
  back: `<svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg>`,
  side: `<svg width="24" height="24" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="4"/><path d="M9 4v16M4.800 8h1.700M4.800 11h1.700M4.800 14h1.700"/></svg>`,
  owl: `<svg width="26" height="26" viewBox="0 0 24 24" class="solid"><path d="M4 3l3.500 2.500C9 5 10.500 4.800 12 4.800s3 .2 4.500.7L20 3v10c0 4.500-3.800 7-8 7s-8-2.500-8-7z"/><circle cx="8.400" cy="12" r="2.700" style="fill:var(--ground);stroke:none"/><circle cx="15.600" cy="12" r="2.700" style="fill:var(--ground);stroke:none"/><circle cx="8.800" cy="12" r="1.200"/><circle cx="16" cy="12" r="1.200"/></svg>`,
  owlS: `<svg width="16" height="16" viewBox="0 0 24 24" class="solid"><path d="M4 3l3.500 2.500C9 5 10.500 4.800 12 4.800s3 .2 4.500.7L20 3v10c0 4.500-3.800 7-8 7s-8-2.500-8-7z"/><circle cx="8.400" cy="12" r="2.700" style="fill:var(--ground);stroke:none"/><circle cx="15.600" cy="12" r="2.700" style="fill:var(--ground);stroke:none"/></svg>`,
  dots: `<svg width="24" height="24" viewBox="0 0 24 24" class="solid"><circle cx="5" cy="12" r="1.800"/><circle cx="12" cy="12" r="1.800"/><circle cx="19" cy="12" r="1.800"/></svg>`,
  chat: `<svg width="26" height="26" viewBox="0 0 24 24"><path d="M6 4h12a3 3 0 013 3v7a3 3 0 01-3 3h-5l-4 3.500V17H6a3 3 0 01-3-3V7a3 3 0 013-3z"/></svg>`,
  chatF: `<svg width="26" height="26" viewBox="0 0 24 24" class="solid"><path d="M6 4h12a3 3 0 013 3v7a3 3 0 01-3 3h-5l-4 3.500V17H6a3 3 0 01-3-3V7a3 3 0 013-3z"/></svg>`,
  mac: `<svg width="26" height="26" viewBox="0 0 24 24" class="solid"><path d="M4 3h16a2 2 0 012 2v10a2 2 0 01-2 2h-6l.5 2.500H16V21H8v-1.500h1.500L10 17H4a2 2 0 01-2-2V5a2 2 0 012-2zm0 2v10h16V5z" fill-rule="evenodd"/></svg>`,
  macPlus: `<svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 3H4.500A2.500 2.500 0 002 5.500v8A2.500 2.500 0 004.500 16h13a2.500 2.500 0 002.500-2.500V12M12 16v4M8 20.500h8"/><path d="M18 2.500v7M14.500 6h7"/></svg>`,
  sliders: `<svg width="26" height="26" viewBox="0 0 24 24"><path d="M3 6h9M18 6h3M3 12h3M12 12h9M3 18h10M19 18h2"/><rect x="12" y="4" width="6" height="4" rx="2"/><rect x="6" y="10" width="6" height="4" rx="2"/><rect x="13" y="16" width="6" height="4" rx="2"/></svg>`,
  mic: `<svg width="18" height="18" viewBox="0 0 24 24"><rect x="8.500" y="2.500" width="7" height="12" rx="3.500"/><path d="M5 11a7 7 0 0014 0M12 18v3M8 21h8"/></svg>`,
  ext: `<svg width="20" height="20" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 15l6-6M10 9h5v5"/></svg>`,
  alarm: s => `<svg width="${s||20}" height="${s||20}" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 8.500V13l3 2M3.500 6L7 3M20.500 6L17 3"/></svg>`,
  info: `<svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.800v.2"/></svg>`,
  xc: c => `<svg width="22" height="22" viewBox="0 0 24 24" style="color:${c}"><circle cx="12" cy="12" r="9.500"/><path d="M8.500 8.500l7 7M15.500 8.500l-7 7"/></svg>`,
  cl: c => `<svg width="22" height="22" viewBox="0 0 24 24" style="color:${c}"><circle cx="12" cy="12" r="9.500"/><path d="M12 7v5H8"/></svg>`,
  ok: c => `<svg width="22" height="22" viewBox="0 0 24 24" style="color:${c}"><circle cx="12" cy="12" r="9.500"/><path d="M8 12.500l3 3 5-6"/></svg>`,
  branch: `<svg width="15" height="15" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2.500"/><circle cx="18" cy="5" r="2.500"/><circle cx="12" cy="19" r="2.500"/><path d="M6 7.500c0 4 6 3.500 6 9M18 7.500c0 4-6 3.500-6 9"/></svg>`,
  pr: `<svg width="15" height="15" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.500"/><circle cx="18" cy="19" r="2.500"/><path d="M6 16.500V6M3 9l3-3.500L9 9M18 16.500V10c0-2-1-3-3-3h-3"/></svg>`,
  place: `<svg width="15" height="15" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></svg>`,
  diff: `<svg width="15" height="15" viewBox="0 0 24 24"><path d="M12 3v8M8 7h8M7 18h10"/></svg>`,
  chev: `<svg width="15" height="15" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>`,

/* ---------- Rail ---------- */
function rail(p, o) {
  const x = p === 'folded' ? 424 : p === 'sideways' ? 910 : 630;
  const cx = p === 'folded' ? 418 : p === 'sideways' ? 904 : 626;
  const H = SIZES[p].h, top = p === 'folded' ? 198 : p === 'sideways' ? 146 : 92;
  const clockY = p === 'folded' ? 84 : p === 'sideways' ? 30 : 8;
  let html = `<div class="clock" style="left:${cx}px;top:${clockY}px">9:41</div><div class="ring" style="left:${cx}px;top:${clockY + 44}px">${I.ring}</div>`;
  (o.top || []).forEach((b, n) => {
    const cls = b === 'new' ? 'newt' : 'chrome';
    html += `<div class="circle ${cls}" style="left:${x}px;top:${top + n * 56}px">${b === 'back' ? I.back : b === 'side' ? I.side : I.plus()}</div>`;
  });
  const pillX = x - 29;
  if (o.thread) {
    const bottom = p === 'folded' ? H - 55 : H - 275;
    const word = o.thread === 'needs' ? ['w', 'Needs<br>you', 'ask'] : o.thread === 'done' ? ['i', 'Done', ''] : ['g', 'Working', 'wk'];
    html += `<div class="pill" style="left:${pillX}px;top:${bottom - 163}px;height:163px;justify-content:space-between;padding-bottom:12px"><div class="state ${word[2]}"><span class="dot ${word[0]}" style="margin-bottom:3px"></span><br>${word[1]}</div><div style="color:var(--muted)">${I.owl}</div><div style="color:var(--muted)">${I.dots}</div></div>`;
  }
  if (o.tabs) {
    const a = o.tabs;
    html += `<div class="pill" style="left:${pillX}px;top:${H - 55 - 214}px;height:214px;padding:3px 0"><div class="tile ${a === 'threads' ? 'on' : ''}">${a === 'threads' ? I.chatF : I.chat}<span class="badge">2</span></div><div class="tile">${I.owl}</div><div class="tile ${a === 'computers' ? 'on' : ''}">${I.mac}</div><div class="tile ${a === 'settings' ? 'on' : ''}">${I.sliders}</div></div>`;
  }
  return html;
}

    <div class="group" style="margin-top:6px"><div style="margin-top:-1px;overflow:hidden">${checkRow(I.xc('var(--dangertext)'), 'Gates (Windows)', '14m 02s')}${checkRow(I.cl('var(--warntext)'), 'Package (macOS)', '6m 11s so far')}</div><div style="display:flex;gap:9px;color:var(--acctext);padding:11px 14px;border-top:1px solid var(--hair);font-weight:500;align-items:center">${I.down} Show 2 passed</div></div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:14px"><span class="lbl">Reviews</span><span style="font-size:14px;color:var(--muted)">Changes requested</span></div>
    <div class="group" style="margin-top:6px"><div class="strow"><span class="st">${I.xc('var(--dangertext)')}</span><div><div>chloe-r</div><div class="sts">Asked for changes</div></div></div><div class="strow" style="border-top:1px solid var(--hair)"><span class="st">${I.ok('var(--acctext)')}</span><div><div>ollie-dev</div><div class="sts">Approved</div></div></div></div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:14px"><span class="lbl">Files</span><span style="font-size:14px;color:var(--muted)">3 files, +162 −42</span></div>
    <div class="group" style="margin-top:6px;padding:12px 14px;font-size:15px"><div>TerminalDrawer.tsx</div><div style="color:var(--muted);margin-top:6px">window.css</div></div><div style="height:24px"></div>`;
  const body = state.tab === 'summary' ? summary : checks;
  let dock = '';
  if (isNow) dock = `<div class="dock" style="margin-right:${p === 'folded' ? padR - 8 : 12}px"><div class="note"><span style="flex:none">${I.alarm()}</span><span>${WAKES}</span></div><div class="btn pri" style="width:100%">${I.alarm()} Babysit pull request</div></div><div style="height:${p === 'folded' ? 24 : 12}px;flex:none"></div>`;
  if (v === 'A') dock = `<div style="flex:none;border-top:1px solid var(--hair);padding:9px 12px 14px;padding-right:${p === 'folded' ? padR - 8 : 12}px">${state.info ? `<div style="font-size:14px;color:var(--muted);margin:0 6px 9px">${WAKES}</div>` : ''}<div style="display:flex;gap:8px;align-items:center"><div class="btn pri" style="flex:1;height:42px">${I.alarm(18)} Babysit pull request</div><div class="disc" style="width:42px;height:42px;color:var(--muted)" onclick="toggleInfo()" aria-label="What babysitting does">${I.info}</div></div></div>`;
  return threadPage(p, { thread: 'working' }) + `<div class="scrim"></div><div class="sheet" style="${box};border-radius:26px 26px 0 0"><div class="grab"></div>${band}${tabRow}<div class="prbody" style="padding:${isNow ? 14 : 16}px ${padR}px 0 20px">${body}</div>${dock}</div>`;
}
window.setTab = t => { state.tab = t; render(); };
window.toggleInfo = () => { state.info = !state.info; render(); };

/* ---------- ••• menu ---------- */
function menu(p, v) {
  const pos = p === 'folded' ? 'right:25px;bottom:60px' : p === 'sideways' ? 'right:19px;bottom:279px' : 'right:40px;bottom:282px';
  const prRow = `<div class="mi">${I.pr}<div style="flex:1"><div>#721 draft</div><small>1 failing, 1 running, 2 passed</small></div></div>`;
  const settle = `<div class="mi">Settle</div>`;
  let card;
  if (v === 'now') card = `<div class="menu" style="${pos}"><div style="padding:14px 19px 8px;color:var(--glassdim);font-size:15px;line-height:1.26">Refine the iPhone thread view<br>Codex · Sotto · Laptop<br>feat/frosted-window-and-pane-terminal · +212 −48</div>${prRow}${settle}</div>`;
  if (v === 'A') card = `<div class="menu" style="${pos}"><div class="mi" style="display:block"><div style="font-weight:500">Refine the iPhone thread view</div><small style="margin-top:2px;line-height:1.25">Codex · Sotto · Laptop<br>feat/frosted-window-and-pane-terminal · +212 −48</small></div><div class="mh"></div>${prRow}${settle}</div>`;
  if (v === 'B') card = `<div class="menu" style="${pos};width:292px"><div style="padding:14px 18px 10px"><div style="font-weight:600;line-height:1.22;margin-bottom:7px">Refine the iPhone thread view</div><div class="fact">${I.place}<span>Codex · Sotto · Laptop</span></div><div class="fact">${I.branch}<span style="word-break:break-word">feat/frosted-window-and-pane-terminal</span></div><div class="fact">${I.diff}<span><span class="wk">+212</span> <span style="color:var(--dangertext)">−48</span></span></div></div><div class="mh"></div><div class="mi">${I.pr}<div style="flex:1"><div>#721 draft</div><small>1 failing, 1 running, 2 passed</small></div>${I.chev}</div><div class="mh"></div>${settle}</div>`;
  if (v === 'C') card = `<div class="menu" style="${pos};width:292px"><div style="padding:14px 18px 12px"><div style="font-weight:600;line-height:1.22">Refine the iPhone thread view</div><div style="font-size:14px;color:var(--muted);margin:3px 0 9px">Codex · Sotto · Laptop</div><div style="display:flex;flex-wrap:wrap;gap:5px"><span class="cp">${I.branch}<span class="clip">feat/frosted-window-and-pane-terminal</span></span><span class="cp"><span class="wk">+212</span> <span style="color:var(--dangertext)">−48</span></span><span class="cp">${I.pr} #721 draft ${I.chev}</span></div></div><div class="mh"></div>${settle}</div>`;
  return threadPage(p, {}) + card;
}

/* ---------- Settings ---------- */
function settings(p, v) {
  const seg = (list, on = 0) => `<div class="segs">${list.map((t, n) => `<div class="${n === on ? 'on' : ''}">${t}</div>`).join('')}</div>`;
  const sizes = `<div class="sizes">${[13, 15, 18, 21, 24].map((s, n) => `<div class="${n === 1 ? 'on' : ''}" style="font-size:${s}px">A</div>`).join('')}</div>`;
  const glow = `<div style="display:flex;align-items:center;gap:14px;height:32px"><span class="dot g" style="flex:none"></span><div class="slide"></div></div>`;
  const stale = `<div style="margin-top:10px"><div style="font-weight:600">Pick the drawer shortcut</div><div style="font-size:15px;color:var(--muted)">Asks: which shortcut should open the terminal drawer?</div></div>`;
  const labelled = `<div class="sample"><i>Sample</i><div style="font-weight:600">Pick the drawer shortcut</div><div style="font-size:15px;color:var(--muted)">Asks: which shortcut should open the terminal drawer?</div></div>`;
  const sample = v === 'now' ? stale : labelled;
  const sideways = p !== 'folded';
  const rows = [
    ['Appearance', '', seg(['Dark', 'Light', 'System']), ''],
    ['Text size', 'Default', sizes, sample],
    ['Glow', '50%', glow, ''],
    ['Message density', '', seg(['Comfortable', 'Compact']), '<div class="hint">Room between messages, lists and steps.</div>'],
    ['Tabs when unfolded sideways', '', seg(['Right', 'Left']), '<div class="hint">Upright, they stand down the right edge.</div>'],
  ];
  const stacked = list => list.map(([t, val, ctl, after]) => `<div class="srow"><div class="rowhead">${t}<span>${val}</span></div>${ctl}${after}</div>`).join('');
  const beside = list => list.map(([t, val, ctl, after]) => {
    const isHint = after.includes('hint');
    return `<div class="srow"><div class="side-label"><div class="rowhead"><div>${t}</div>${isHint ? after.replace('<div class="hint"', '<div class="hint" style="font-weight:400"') : val ? `<span>${val}</span>` : ''}</div><div>${ctl}</div></div>${!isHint ? after : ''}</div>`;
  }).join('');
  const others = `<div class="lbl" style="margin:16px 0 6px 4px">Notifications</div><div class="pcard"><div class="rowhead" style="margin:0">Tell me when a thread needs me<span>On</span></div></div>`;
  let body;
  if (!sideways || v === 'now') body = `<div class="lbl" style="margin:0 0 6px 4px">Look</div><div class="pcard">${stacked(rows)}</div>${others}`;
  else if (v === 'A') body = `<div style="max-width:680px;margin:0 auto"><div class="lbl" style="margin:0 0 6px 4px">Look</div><div class="pcard">${stacked(rows)}</div>${others}</div>`;
  else if (v === 'B') body = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start"><div><div class="lbl" style="margin:0 0 6px 4px">Look</div><div class="pcard">${stacked(rows.slice(0, 2))}</div></div><div><div class="lbl" style="margin:0 0 6px 4px">&nbsp;</div><div class="pcard">${stacked(rows.slice(2))}</div></div></div>${others}`;
  else body = `<div class="lbl" style="margin:0 0 6px 4px">Look</div><div class="pcard">${beside(rows)}</div>${others}`;
  const L = p === 'folded' ? 16 : 24, R = p === 'folded' ? 100 : 99;
  const title = v === 'A' && sideways ? 'max-width:680px;margin:0 auto' : '';
  return `<div class="page" style="left:0;right:0;padding:18px ${R}px 40px ${L}px"><div style="${title}"><div class="pt">Settings</div><div class="ps">These are kept on this iPhone. They don't change any computer's settings.</div></div>${body}</div>${rail(p, { top: p === 'folded' ? ['new'] : ['side', 'new'], tabs: 'settings' })}`;
}

/* ---------- Computers ---------- */
function computers(p, v) {
  const L = p === 'folded' ? 16 : 24, R = p === 'folded' ? 100 : 99;
  let add = '';
  if (v === 'now') add = `<div class="circle chrome" style="position:relative;margin:0;flex:none">${I.plus()}</div>`;
  if (v === 'A') add = `<div style="flex:none;display:flex;align-items:center;gap:6px;height:38px;padding:0 13px;border-radius:19px;background:var(--soft);color:var(--ink);font-weight:600;font-size:15px">${I.plus(16)} Add computer</div>`;
  if (v === 'B') add = `<div class="circle chrome" style="position:relative;margin:0;flex:none">${I.macPlus}</div>`;
  const row = (name, sub, dot, status, extra = '') => `<div class="pcard"><div style="display:flex;align-items:center;gap:10px"><div style="flex:1;min-width:0"><div style="font-weight:600">${name}</div><div style="font-size:15px;color:var(--muted)">${sub}</div></div><span class="dot ${dot}"></span><span style="font-size:15px;color:var(--muted)">${status}</span>${I.chev}</div>${extra}</div>`;
  const last = v === 'C' ? `<div class="pcard" style="display:flex;align-items:center;gap:12px;color:var(--acctext);font-weight:600;background:none;border:1px dashed var(--hair)">${I.plus(20)} Add a computer</div>` : '';
  return `<div class="page" style="left:0;right:0;padding:18px ${R}px 40px ${L}px"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div class="pt">Computers</div>${add}</div><div class="ps">Each computer runs Sotto and shares its threads with this iPhone.</div>${row('Laptop', '3 projects, 9 threads', 'g', 'Online')}${row('Studio Mac', '3 projects, 1 thread', 'r', 'Can\'t reach it', `<div style="display:inline-flex;gap:8px;align-items:center;margin-top:10px;background:var(--soft);padding:7px 13px;border-radius:17px;font-size:15px;font-weight:500"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-3-6.200M20 3v5h-5"/></svg>Try again</div>`)}${last}</div>${rail(p, { top: p === 'folded' ? ['new'] : ['side', 'new'], tabs: 'computers' })}`;
}

/* ---------- Agents ---------- */
const AGENTS = [
  { kind: 'Agent', glyph: 'bot', title: 'Run the drawer tests twenty times', meta: 'gpt-6.1-sol · 7:12 PM', time: '1m 01s', st: 'working', word: 'Working' },
  { kind: 'Thread', glyph: 'star', title: 'Review the drawer fix', prev: 'Review the change to TerminalDrawer.tsx on feat/frosted-window', meta: 'Claude Code · Sotto · Laptop · Code review · 7:09 PM', time: '4m 07s', st: 'needs', word: 'Needs your approval' },
  { kind: 'Thread', glyph: 'knot', title: 'Check the drawer docs', prev: 'Read docs/terminal.md and say what it promises about how long the drawer stays', meta: 'Codex · Sotto · Laptop · Research · 7:01 PM', time: '3m 00s', st: 'answered', word: 'Answered' },
  { kind: 'Agent', glyph: 'bot', title: 'Find fixed waits in the drawer tests', meta: 'gpt-6.1-sol · 6:59 PM', time: '48s', st: 'answered', word: 'Answered' },
];
const stDot = { working: 'g', needs: 'w', answered: 'i' };
const stCls = { working: 'wk', needs: 'ask', answered: '' };
function agents(p, v) {
  const box = p === 'folded' ? 'left:8px;right:8px;top:8px;bottom:0' : p === 'sideways' ? 'left:150px;width:653px;top:8px;bottom:0' : 'left:8px;right:8px;top:30px;bottom:0';
  const padR = p === 'folded' ? 96 : 20;
  const order = v === 'now' ? AGENTS : [AGENTS[1], AGENTS[0], AGENTS[2], AGENTS[3]];
  const statusLine = a => `<div class="ags ${stCls[a.st]}"><span class="dot ${stDot[a.st]}"></span>${a.word}</div>`;
  const openIt = a => a.st === 'needs' ? `<div class="open">Open to answer</div>` : '';
  const summary = v === 'now'
    ? `<div style="display:flex;justify-content:space-between;font-weight:500;gap:12px"><span>2 delegated threads · 2 agents</span><span class="ask" style="flex:none">1 needs you · 1 working</span></div>`
    : `<div style="font-weight:500">2 delegated threads · 2 agents</div><div style="font-weight:500;font-size:15px;margin-top:1px"><span class="ask">1 needs you</span> <span style="color:var(--muted)">·</span> <span class="wk">1 working</span></div>`;
  let list;
  if (v === 'now') list = `<div class="group" style="padding:2px 0">${order.map(a => `<div class="ag"><span class="agt">${I[a.glyph]}</span><div class="agb"><div style="display:flex;gap:8px;align-items:flex-start"><div class="tt two" style="flex:1;font-size:17px">${a.title}</div><span class="tag" style="margin-top:2px">${a.kind}</span><span class="tm" style="margin-top:3px">${a.time}</span></div>${a.prev ? `<div class="sprev two">${a.prev}</div>` : ''}<div class="smeta">${a.meta}</div>${statusLine(a)}${openIt(a)}</div></div>`).join('')}</div>`;
  if (v === 'A') list = `<div class="group" style="padding:2px 0">${order.map(a => `<div class="ag"><span class="agt">${I[a.glyph]}</span><div class="agb"><div class="tt">${a.title}</div>${a.prev ? `<div class="sprev two">${a.prev}</div>` : ''}<div class="smeta">${a.kind} · ${a.time} · ${a.meta}</div>${statusLine(a)}${openIt(a)}</div></div>`).join('')}</div>`;
  if (v === 'B') {
    const groups = [['Needs you', 'needs'], ['Working', 'working'], ['Answered', 'answered']];
    list = groups.map(([label, st]) => { const items = order.filter(a => a.st === st); return `<div class="sec" style="padding:8px 2px 2px" ><span class="dot ${stDot[st]}" style="margin:0 8px 1px 2px"></span>${label}<span>${items.length}</span></div><div class="group" style="padding:2px 0;margin-top:5px">${items.map(a => `<div class="ag"><span class="agt">${I[a.glyph]}</span><div class="agb"><div class="tt">${a.title}</div>${a.prev ? `<div class="sprev two">${a.prev}</div>` : ''}<div class="smeta">${a.kind} · ${a.time} · ${a.meta}</div>${openIt(a)}</div></div>`).join('')}</div>`; }).join('');
  }
  if (v === 'C') list = `<div class="group" style="padding:2px 0">${order.map(a => `<div class="ag" style="align-items:center"><span class="dot ${stDot[a.st]}" style="margin:0 4px 0 2px"></span><div class="agb"><div class="tt">${a.title}</div><div class="smeta">${a.kind} · ${a.st === 'needs' ? '<span class="ask">Needs your approval</span> · ' : ''}${a.time} · ${a.meta.split(' · ')[0]}</div></div>${a.st === 'needs' ? '<div class="open" style="margin:0;flex:none;font-size:14px;padding:7px 11px">Open to answer</div>' : I.chev}</div>`).join('')}</div>`;
  return threadPage(p, { thread: 'working' }) + `<div class="scrim"></div><div class="sheet" style="${box};border-radius:26px 26px 0 0"><div class="grab"></div><div class="prbody" style="padding:14px ${padR}px 20px 20px"><div style="display:flex;justify-content:space-between;align-items:center"><span class="pt" style="font-size:24px">Agents</span><span style="color:var(--acctext);font-weight:600">Done</span></div><div style="color:var(--muted);margin:6px 0 9px">Refine the iPhone thread view</div>${summary}<div style="height:6px"></div>${list}</div></div>`;
}

/* ---------- Render ---------- */
function render() {
  const s = SURFACES.find(x => x.id === state.surface), p = posture();
  const v = state.variant;
  const stage = document.getElementById('stage');
  const size = SIZES[p];
  stage.className = `${state.theme} ${s.id === 'glow' && v !== 'now' ? 'glow-' + v : ''}`;
  stage.style.width = size.w + 'px'; stage.style.height = size.h + 'px';
  let html;
  if (s.id === 'question') html = question(p, v);
  if (s.id === 'pullrequest') html = pullRequest(p, v);
  if (s.id === 'menu') html = menu(p, v);
  if (s.id === 'sidebar') html = p === 'sideways' ? threadPage(p, { rowStyle: v }) : threadPage(p, {}) + `<div class="tell">The sidebar stands beside a thread only when sideways. Turn the Duo sideways, or press Sideways above.</div>`;
  if (s.id === 'settings') html = settings(p, v);
  if (s.id === 'computers') html = computers(p, v);
  if (s.id === 'glow') html = threadPage(p, { thread: 'working' });
  if (s.id === 'agents') html = agents(p, v);
  stage.innerHTML = html;
  document.getElementById('surface').value = s.id;
  document.getElementById('variants').innerHTML = ['now', 'A', 'B', 'C'].map(k => `<button class="${k === v ? 'on' : ''} ${k === s.rec ? 'rec' : ''}" onclick="setV('${k}')">${k === 'now' ? 'Now' : k}</button>`).join('');
  document.getElementById('postures').innerHTML = [['folded', 'Folded'], ['sideways', 'Sideways'], ['upright', 'Upright']].map(([k, t]) => `<button class="${k === p ? 'on' : ''}" onclick="setP('${k}')">${t}</button>`).join('');
  document.getElementById('tools').innerHTML = `<button class="${state.theme === 'light' ? 'on' : ''}" onclick="setT()">Light</button><button class="${state.actual ? 'on' : ''}" onclick="setA()">Actual size</button>`;
  const c = document.getElementById('caption');
  if (v === 'now') c.innerHTML = `<b>Now.</b> ${s.now} <span style="color:#8f949b">${s.judges}</span>`;
  else c.innerHTML = `<b>${v}: ${s[v][0]}.</b> ${s[v][1]}${v === s.rec ? ' <b style="color:#6bc3b6">Suggested.</b>' : ''}`;
  fit();
  history.replaceState(null, '', `#${s.id}/${v}${state.posture ? '/' + state.posture : ''}`);
}
function fit() {
  const holder = document.getElementById('holder'), stage = document.getElementById('stage');
  const size = SIZES[posture()];
  holder.classList.toggle('actual', state.actual);
  if (state.actual) { stage.style.transform = 'none'; stage.style.left = '0'; stage.style.top = '0'; return; }
  const scale = Math.min(holder.clientWidth / size.w, holder.clientHeight / size.h, 1);
  stage.style.transform = `scale(${scale})`;
  stage.style.left = Math.max(0, (holder.clientWidth - size.w * scale) / 2) + 'px';
  stage.style.top = Math.max(0, (holder.clientHeight - size.h * scale) / 2) + 'px';
}
window.setV = k => { state.variant = k; state.tab = 'summary'; state.info = false; render(); };
window.setP = k => { state.posture = k; render(); };
window.setT = () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; render(); };
window.setA = () => { state.actual = !state.actual; render(); };
document.getElementById('surface').innerHTML = SURFACES.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
document.getElementById('surface').onchange = e => { state.surface = e.target.value; state.variant = 'now'; state.tab = 'summary'; render(); };
addEventListener('resize', () => render());
addEventListener('orientationchange', () => setTimeout(render, 200));
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
</script>
</body>
</html>
