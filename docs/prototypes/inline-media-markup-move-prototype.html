<!doctype html>
<!--
  PROTOTYPE, throwaway. Not shipped, not tested, not wired to anything.

  Zach's feedback on Mark up (ADR-0170, part 5), November 3, 2026: marks can't be moved, a note's words sit on a red
  label, the text can't be sized, and a text box should move anywhere or belong to a shape.

  The questions, each switchable under Options and in the URL:
    ?move=A|B|C              how a mark is picked up, and how that stays clear of drawing
    ?size=A|B|C              how text is sized
    ?text=both|free|shape    free text, text on a shape, or both
    ?follow=keep|center      what text on a shape does when the shape moves
    ?look=outline|bare       the words alone, or with a thin edge so they read on any picture
    ?resize=0|1 ?undo=0|1 ?del=0|1    the extras, each on or off
    ?device=desktop|iphone|pencil     the editor on each surface
  Add to reply draws the same marks on a canvas at the picture's full size, so the copy can be held against the screen.
  Not here: pinching to zoom with a Pencil, translated strings, the theme list (dark and light only).
-->
<html lang="en">

<style>

  --tt-hairline: oklch(0.305 0.02 265);

  --tt-surface: oklch(0.99 0.003 85);
  --tt-surface-elevated: oklch(0.99 0.003 85);
  --tt-surface-sunken: oklch(0.945 0.006 85);
  --tt-text: oklch(0.235 0.014 75);
  --tt-text-2: oklch(0.36 0.014 75);

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }

/* ---------- the prototype's own chrome: cream, so it is plainly not part of the design ---------- */

/* ---------- where the editor sits ---------- */

.bar { display: flex; flex: none; flex-wrap: wrap; align-items: center; gap: 4px; min-height: 44px; padding: 4px 8px 4px 18px; border-bottom: 1px solid var(--tt-hairline); }

.tool:hover, .action:hover { background: var(--tt-hover); color: var(--tt-text); }

.ink--red { --ink: var(--tt-ink-red); } .ink--amber { --ink: var(--tt-ink-amber); } .ink--plain { --ink: var(--tt-text); }

.swatch { flex: none; width: 10px; height: 10px; border-radius: 999px; background: var(--ink); }
.mark-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.remove { display: inline-grid; flex: none; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--tt-text-muted); }
.remove:hover { background: var(--tt-hover); color: var(--tt-text); }
.status { min-height: 0; margin: 0; padding: 0 18px; color: var(--tt-text); font-size: 13px; }

  .device--desktop .body { flex-direction: column; }
  .device--desktop .side { width: auto; max-height: 112px; padding: 10px 18px; border-top: 1px solid var(--tt-hairline); border-left: 0; }
  .device--desktop .copy-note, .device--desktop .hint { display: none; }
}

/* ---------- the iPhone editor, from MarkupViews.swift ---------- */
.ptop { display: flex; flex: none; align-items: center; justify-content: space-between; min-height: 44px; padding: env(safe-area-inset-top) 20px 0; }
.ptop button { min-height: 44px; padding: 0; border: 0; background: transparent; color: var(--tt-text); font-size: 15px; }

.pcontext .delete { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--tt-text); font-size: 13px; }

.ptool[aria-pressed='true'] { background: var(--tt-accent-surface); color: var(--tt-accent-surface-text); }
.ptool[aria-disabled='true'] { color: var(--tt-text-faint); }
.pink { position: relative; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; }
.pink::before { content: ''; position: absolute; inset: 11px; border-radius: 999px; background: var(--ink); }
.pink[aria-checked='true']::after { content: ''; position: absolute; inset: 7px; border-radius: 999px; border: 2px solid var(--tt-text); }
.palert { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 30px; background: var(--tt-scrim); }

/* ---------- the copy ---------- */
.copy { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; background: var(--tt-canvas); }

.copy__head div { min-width: 0; }
.copy__head b { display: block; }
.copy__head span { display: block; color: var(--tt-text-muted); font-size: 12px; }

.copy__pic img { display: block; max-width: 100%; max-height: 100%; }
</style>
</head>

<script>
'use strict'
const W = 1280, H = 800, LONGER = Math.max(W, H)
const params = new URLSearchParams(location.search)
const pick = (name, allowed, fallback) => allowed.includes(params.get(name)) ? params.get(name) : fallback
const onOff = (name, fallback) => params.has(name) ? params.get(name) === '1' : fallback

const MOVES = {
  A: ['A · Move tool', 'Pick Move, then drag a mark. Drawing tools only draw.'],

}
const SIZES = {
  A: ['A · Smaller and larger', 'Two buttons step through five sizes'],
  B: ['B · S, M, L', 'Three sizes to pick from'],
  C: ['C · Drag a corner', 'No buttons. Select the text and drag its corner'],
}
const SIZE_STEPS = [0.7, 1, 1.4, 1.9, 2.6]
const SML = { S: 0.7, M: 1, L: 1.6 }

const S = {
  device: pick('device', ['desktop', 'iphone', 'pencil'], innerWidth < 720 ? 'iphone' : 'desktop'),
  move: pick('move', ['A', 'B', 'C'], 'A'),
  size: pick('size', ['A', 'B', 'C'], 'A'),
  text: pick('text', ['both', 'free', 'shape'], 'both'),
  follow: pick('follow', ['keep', 'center'], 'keep'),
  look: pick('look', ['outline', 'bare'], 'outline'),
  resize: onOff('resize', true), undoMoves: onOff('undo', true), del: onOff('del', true),

let nextId = 1

/* ---------- the picture: a made-up checkout page with dark, light and busy ground, so text is tested on all three ---------- */
const PICTURE = 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Helvetica,Arial,sans-serif">

function openNote(p, tolerance) {

/* ---------- text size ---------- */
const sizeTarget = () => { const m = selected(); return m?.tool === 'note' ? m : null }

const currentScale = () => sizeTarget()?.scale ?? S.nextScale
function setScale(scale) {

}

/* ---------- the copy ---------- */
async function addToReply() {
  if (!S.marks.length) { S.status = 'Draw on the picture first. Nothing was added.'; paint(); return }
  const picture = new Image()
  picture.src = PICTURE
  await picture.decode()
  await document.fonts.load(fontOf(40), 'Aa')
  const canvas = document.createElement('canvas')
  canvas.width = W; canvas.height = H
  const context = canvas.getContext('2d')
  context.drawImage(picture, 0, 0, W, H)
  drawCopy(context, S.marks, inks())
  S.copy = canvas.toDataURL('image/png')
  S.sel = null
  paint()
}

/* ---------- the size control, whichever way it goes ---------- */

/* ---------- painting ---------- */
function marksInner() {
  const colours = inks()
  let out = S.marks.map(m => shapeSVG(m, colours)).join('')
  if (S.live) out += shapeSVG(S.live, colours)
  const mark = selected()
  if (mark && !S.copy) {
    const unit = surfaceEl ? pxPerScreen() : 1, pad = 6 * unit, r = bounds(mark)
    out += `<rect class="sel-box" x="${r.x - pad}" y="${r.y - pad}" width="${r.w + pad * 2}" height="${r.h + pad * 2}" fill="none" stroke="var(--tt-accent)" stroke-width="${1.5 * unit}" stroke-dasharray="${5 * unit} ${4 * unit}"/>`

    const tied = mark.tool === 'note' && mark.on ? S.marks.find(m => m.id === mark.on) : null

/* ---------- presses ---------- */
const setTool = tool => { if (!toolList().includes(tool)) return; S.tool = tool; if (tool !== 'move' && S.move === 'A') S.sel = null; paint() }

  if (mod || event.altKey) return
  const mark = selected(), step = (event.shiftKey ? 8 : 1) * LONGER / 100
  const arrow = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[event.key]
  if (arrow && mark) {
    event.preventDefault()
    const ids = mark.tool === 'note' ? [mark.id] : family(S.marks, mark.id).map(m => m.id)
    const { dx, dy } = clampDelta(ids, S.marks, arrow[0], arrow[1])
    push(S.marks.map(m => ids.includes(m.id) ? shift(m, dx, dy) : m), S.undoMoves)
    paint(); return
  }
  if (arrow && !event.target.closest?.('button')) { cycle(event.key === 'ArrowLeft' ? -1 : event.key === 'ArrowRight' ? 1 : 0); return }
  if (event.key === 'Enter' && toolIsMove() && document.activeElement?.id === 'surface' && S.marks.length) {
    event.preventDefault()
    const index = S.marks.findIndex(m => m.id === S.sel)
    S.sel = S.marks[(index + 1) % S.marks.length].id
    paint(); return
  }
  if ((event.key === 'Delete' || event.key === 'Backspace') && mark && S.del) { event.preventDefault(); removeMark(mark.id); return }
  if (event.key === 'Escape') { if (S.sel) { S.sel = null; paint() } return }
  if ((event.key === '-' || event.key === '=') && S.size === 'A' && sizeLive()) { stepScale(event.key === '-' ? -1 : 1); return }
  const tool = Object.keys(TOOL_KEYS).find(k => TOOL_KEYS[k].toLowerCase() === event.key.toLowerCase())
  if (tool) setTool(tool)
})
addEventListener('resize', () => { paint() })

/* ---------- start ---------- */
seed()
if (S.move === 'A') S.tool = 'move'
paint()
document.fonts?.load?.(fontOf(40), 'Aa').then(() => { paint() })
