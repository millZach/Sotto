<!doctype html>
<!--
  PROTOTYPE — throwaway. Three structures for reading what changed in a thread's working copy (#268), inside the
  Threads page. A is what merged: T3's diff panel in Tools, every file of one scope stacked as collapsible blocks.
  B reviews one file at a time from a queue with Viewed marks. C puts each turn's changes in the conversation and
  the working tree behind a chip above the composer. Open in a browser.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prototype — reading changes</title>
<link rel="stylesheet" href="./shell.css">
<style>
  /* The shell's header crumb would run under the header buttons once a wide panel narrows the pane; clip it here. */
  .pane-head__title, .pane-head__crumb { overflow: hidden; }

  /* Shared: icon buttons, counts, status letters and the diff lines every variant draws. */
  .ico { display: grid; place-items: center; flex: none; width: 28px; height: 28px; border-radius: 7px; color: var(--tt-text-muted); }
  .ico:hover { background: var(--tt-hover); color: var(--tt-text); }
  .ico[aria-pressed='true'], .ico[data-on] { background: var(--tt-selected); color: var(--tt-text); }
  .ico:disabled { opacity: .45; }
  .seg { display: inline-flex; gap: 1px; padding: 1px; border: 1px solid var(--tt-hairline); border-radius: 8px; }
  .seg .ico { width: 26px; height: 26px; border-radius: 6px; }
  .cnt { flex: none; color: var(--tt-text-muted); font: 12px var(--tt-font-mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cnt .a { color: color-mix(in srgb, var(--tt-success) 70%, var(--tt-text)); }
  .cnt .r { color: var(--tt-error-text); }
  .st { display: grid; place-items: center; flex: none; width: 20px; height: 20px; border-radius: 5px; color: var(--tt-text-2); font: 600 12px/1 var(--tt-font-mono); }
  .st[data-status='added'], .st[data-status='untracked'] { color: var(--tt-success); }
  .st[data-status='deleted'] { color: var(--tt-error-text); }
  .st[data-status='modified'] { color: var(--tt-warning-text); }
  .path { display: flex; align-items: baseline; min-width: 0; white-space: nowrap; }
  .path__folder { flex: 0 1 auto; min-width: 0; overflow: hidden; color: var(--tt-text-muted); direction: rtl; text-align: left; text-overflow: ellipsis; }
  .path__name { flex: none; max-width: 100%; overflow: hidden; font-weight: 500; text-overflow: ellipsis; }
  .problem { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 16px 18px; }
  .problem strong { color: var(--tt-text); font-size: 14px; font-weight: 500; line-height: 1.5; }
  .problem p { margin: 0; color: var(--tt-text-muted); font-size: 12.5px; }

  .d-body { overflow-x: auto; background: var(--tt-code-bg); }
  .d-split-head { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--tt-hairline); color: var(--tt-text-muted); font-size: 12px; }
  .d-split-head span { min-width: 0; overflow: hidden; padding: 4px 10px; text-overflow: ellipsis; white-space: nowrap; }
  .d-rows { padding: 4px 0 8px; font: 12.5px/1.65 var(--tt-font-mono); }
  .d-rows:not([data-wrap]) { width: max-content; min-width: 100%; }
  .d-line { display: grid; grid-template-columns: 4ch 4ch 1ch minmax(0, 1fr); column-gap: 5px; padding-right: 12px; color: var(--tt-code-text); }
  .d-rows:not([data-wrap]) .d-line { grid-template-columns: 4ch 4ch 1ch max-content; }
  .d-num { color: var(--tt-text-muted); font-size: 11.5px; text-align: right; user-select: none; }
  .d-line > .d-num:first-child { padding-left: 6px; box-sizing: content-box; }
  .d-sign { color: var(--tt-text-muted); user-select: none; }
  .d-text { min-width: 0; white-space: pre; }
  .d-rows[data-wrap] .d-text { white-space: pre-wrap; overflow-wrap: anywhere; }
  [data-kind='add'] { background: color-mix(in srgb, var(--tt-success) 12%, transparent); }
  [data-kind='add'] > .d-sign { color: var(--tt-success); }
  [data-kind='remove'] { background: color-mix(in srgb, var(--tt-error) 12%, transparent); }
  [data-kind='remove'] > .d-sign { color: var(--tt-error-text); }
  .d-line[data-kind='hunk'] { margin-top: 4px; background: var(--tt-accent-wash); color: var(--tt-text-2); }
  .d-line[data-kind='hunk']:first-child { margin-top: 0; }
  .d-rows[data-split] { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .d-rows[data-split]:not([data-wrap]) { grid-template-columns: minmax(max-content, 1fr) minmax(max-content, 1fr); }
  .d-rows[data-split] > .d-line { grid-column: 1 / -1; }
  .d-cell { display: grid; grid-template-columns: 3.5ch 1ch minmax(0, 1fr); column-gap: 4px; min-width: 0; padding-right: 8px; color: var(--tt-code-text); }
  .d-rows:not([data-wrap]) .d-cell { grid-template-columns: 3.5ch 1ch max-content; }
  .d-cell:nth-child(odd of .d-cell) { border-right: 1px solid var(--tt-hairline); }

  /* A file as a collapsible block: head stays in view while its lines scroll (A and C's sheet). */
  .fb { border-bottom: 1px solid var(--tt-hairline); }
  .fb__head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 6px; min-width: 0; min-height: 36px; padding: 0 6px; border-bottom: 1px solid var(--tt-hairline); background: var(--tt-surface); font-size: 13px; }
  .fb[data-collapsed] > .fb__head { border-bottom: 0; }
  .fb__name { display: flex; flex: 0 1 auto; min-width: 0; padding: 2px 4px; border-radius: 5px; text-align: left; }
  button.fb__name:hover .path__name { text-decoration: underline; text-underline-offset: 2px; }
  .fb__head .cnt { margin-left: auto; padding-left: 4px; }
  .fb__head .fb__name + .ico { margin-left: auto; }

  /* A — the Changes surface as merged. */
  .ch { position: relative; display: flex; flex: 1; flex-direction: column; min-width: 0; min-height: 0; container: ch / inline-size; }
  .ch > * { flex: none; }
  .ch-chrome { display: flex; align-items: center; gap: 6px; height: 42px; padding: 0 6px 0 6px; border-bottom: 1px solid var(--tt-hairline); }
  .ch-scope { position: relative; display: inline-flex; align-items: center; min-width: 0; }
  .ch-scope select { field-sizing: content; appearance: none; min-width: 0; height: 30px; padding: 0 26px 0 8px; border: 0; border-radius: 7px; background: transparent; color: var(--tt-text); font-size: 14px; font-weight: 500; cursor: pointer; }
  .ch-scope select:hover { background: var(--tt-hover); }
  .ch-scope select option, .ch-scope select optgroup { background: var(--tt-surface-elevated); color: var(--tt-text); }
  .ch-scope > svg { position: absolute; right: 8px; color: var(--tt-text-muted); pointer-events: none; }
  .ch-actions { display: flex; gap: 2px; margin-left: auto; }
  .ch-bar { position: relative; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 8px; min-height: 38px; padding: 3px 6px 3px 12px; border-bottom: 1px solid var(--tt-hairline); color: var(--tt-text-2); font-size: 13px; }
  .ch-fact { flex: 1 1 0; min-width: 0; overflow: hidden; color: var(--tt-text-muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
  .ch-view { display: flex; flex: none; align-items: center; gap: 2px; margin-left: auto; }
  .base { display: flex; flex: 1 1 auto; align-items: center; gap: 4px; min-width: 0; }
  .base__head { min-width: 3ch; max-width: 45%; overflow: hidden; color: var(--tt-text-muted); font: 12px var(--tt-font-mono); text-overflow: ellipsis; white-space: nowrap; }
  .base__arrow { color: var(--tt-text-muted); }
  .base__trigger { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 6px; border-radius: 6px; font: 12px var(--tt-font-mono); color: var(--tt-text); }
  .base__trigger:hover, .base__trigger[aria-expanded='true'] { background: var(--tt-hover); }
  .base-pop { position: absolute; top: calc(100% + 4px); left: 8px; z-index: 5; display: flex; flex-direction: column; gap: 4px; width: min(19rem, calc(100% - 16px)); padding: 6px; border: 1px solid var(--tt-border-faint); border-radius: 10px; background: var(--tt-surface-elevated); box-shadow: var(--tt-shadow-lg); color: var(--tt-text-2); }
  .base-pop__search { height: 30px; padding: 0 9px; display: flex; align-items: center; border: 1px solid var(--tt-field-border); border-radius: 6px; background: var(--tt-field); color: var(--tt-text-muted); font-size: 13px; }
  .base-pop__cols, .base-pop__row { display: grid; grid-template-columns: minmax(0, 1fr) 3rem; align-items: center; }
  .base-pop__cols { padding: 4px 8px 4px 27px; border-bottom: 1px solid var(--tt-hairline); color: var(--tt-text-muted); font-size: 12px; }
  .base-pop__cols span:last-child { text-align: right; }
  .base-pop__ref { display: flex; align-items: center; gap: 6px; min-width: 0; height: 30px; padding: 0 8px; border-radius: 6px; font-size: 13px; text-align: left; }
  .base-pop__ref:hover { background: var(--tt-hover); color: var(--tt-text); }
  .base-pop__ref .i { visibility: hidden; color: var(--tt-accent-text); }
  .base-pop__ref[aria-current] { color: var(--tt-text); }
  .base-pop__ref[aria-current] .i { visibility: visible; }
  .sw { position: relative; justify-self: end; width: 28px; height: 16px; margin-right: 8px; border: 1px solid var(--tt-field-border); border-radius: var(--tt-radius-pill); background: var(--tt-field); }
  .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--tt-text-muted); }
  .sw[aria-checked='true'] { border-color: var(--tt-accent-border); background: var(--tt-accent); }
  .sw[aria-checked='true']::after { left: 14px; background: var(--tt-on-accent); }
  .base-pop__remote { display: grid; justify-self: end; margin-right: 14px; color: var(--tt-text-muted); }
  .ch-review { display: flex; flex: 1; flex-direction: column; min-width: 0; min-height: 0; }
  .ch-files { flex: 1; min-width: 0; min-height: 0; overflow: auto; }
  .ch-tree { order: -1; flex: none; max-height: clamp(84px, 26%, 200px); overflow: auto; padding: 6px 8px; border-bottom: 1px solid var(--tt-hairline); }
  @container ch (min-width: 640px) {
    .ch-review[data-tree] { display: grid; grid-template-columns: minmax(0, 1fr) clamp(160px, 28%, 256px); }
    .ch-review[data-tree] > .ch-tree { order: 0; max-height: none; border-bottom: 0; border-left: 1px solid var(--tt-hairline); }
  }
  .ch-tree__folder { overflow: hidden; padding: 4px 8px 2px; color: var(--tt-text-muted); font-size: 12px; direction: rtl; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
  .ch-tree__item { display: flex; align-items: center; gap: 6px; width: 100%; min-height: 26px; padding: 0 8px 0 16px; border-radius: 6px; color: var(--tt-text-2); font-size: 13px; text-align: left; }
  .ch-tree__item:hover { background: var(--tt-hover); color: var(--tt-text); }
  .ch-tree__item span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast { position: absolute; left: 50%; bottom: 12px; z-index: 6; transform: translateX(-50%); padding: 6px 12px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-pill); background: var(--tt-surface-elevated); box-shadow: var(--tt-shadow-lg); color: var(--tt-text); font-size: 12.5px; white-space: nowrap; }

  /* B — one file at a time, from a queue. The panel is wider so the queue and the file both fit. */
  .tools:has(.rq) { width: min(56%, 600px); }
  .app[data-size='820'] .tools:has(.rq) { width: 56%; }
  .rq { position: relative; display: flex; flex: 1; flex-direction: column; min-width: 0; min-height: 0; container: rq / inline-size; }
  .rq-top { position: relative; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; min-height: 42px; padding: 5px 6px; border-bottom: 1px solid var(--tt-hairline); }
  .rq-scope { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 8px; border-radius: 7px; font-size: 14px; font-weight: 500; }
  .rq-scope:hover, .rq-scope[aria-expanded='true'] { background: var(--tt-hover); }
  .rq-scope .i { color: var(--tt-text-muted); }
  .rq-cmp { color: var(--tt-text-muted); font: 12px var(--tt-font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .rq-tail { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .rq-progress { display: inline-flex; align-items: center; gap: 8px; color: var(--tt-text-2); font-size: 12.5px; white-space: nowrap; }
  .rq-meter { width: 56px; height: 4px; overflow: hidden; border-radius: var(--tt-radius-pill); background: color-mix(in srgb, var(--tt-text-muted) 28%, transparent); }
  .rq-meter span { display: block; height: 100%; background: var(--tt-accent); }
  .rq-menu { top: calc(100% - 2px); left: 6px; width: 230px; }
  .rq-menu .menu-item .i:first-child { visibility: hidden; color: var(--tt-accent-text); }
  .rq-menu .menu-item[aria-current] .i:first-child { visibility: visible; }
  .rq-menu hr { margin: 4px 6px; border: 0; border-top: 1px solid var(--tt-hairline); }
  .rq-main { display: grid; flex: 1; grid-template-columns: 184px minmax(0, 1fr); min-height: 0; }
  .rq-queue { display: flex; flex-direction: column; gap: 1px; min-height: 0; overflow: auto; padding: 6px; border-right: 1px solid var(--tt-hairline); }
  .rq-item { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 2px 8px; width: 100%; padding: 6px 8px; border-radius: 7px; text-align: left; font-size: 13px; color: var(--tt-text); }
  .rq-item:hover { background: var(--tt-hover); }
  .rq-item[aria-current] { background: var(--tt-selected); box-shadow: inset 0 0 0 1px var(--tt-selected-border); }
  .rq-item[data-viewed] .rq-item__name { color: var(--tt-text-muted); }
  .rq-item__name { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .rq-item__name span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rq-item__sub { grid-column: 2; display: flex; gap: 6px; min-width: 0; color: var(--tt-text-muted); font-size: 11.5px; }
  .rq-item__sub span:first-child { min-width: 0; overflow: hidden; direction: rtl; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
  .rq-item__stale { grid-column: 2; color: var(--tt-warning-text); font-size: 11.5px; }
  .ck { display: grid; place-items: center; width: 15px; height: 15px; border: 1.5px solid var(--tt-text-muted); border-radius: 4px; color: var(--tt-on-accent); }
  .ck .i { width: 11px; height: 11px; stroke-width: 2.5; visibility: hidden; }
  [aria-checked='true'] > .ck, .ck[data-on] { border-color: var(--tt-accent); background: var(--tt-accent); }
  [aria-checked='true'] > .ck .i, .ck[data-on] .i { visibility: visible; }
  .rq-file { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .rq-file__head { display: flex; flex-wrap: nowrap; align-items: center; gap: 6px; min-height: 42px; padding: 5px 8px; border-bottom: 1px solid var(--tt-hairline); font-size: 13px; }
  .rq-file__head .path { flex: 0 1 auto; min-width: 0; }
  .rq-viewed { display: inline-flex; align-items: center; gap: 7px; height: 28px; margin-left: auto; padding: 0 10px; border: 1px solid var(--tt-field-border); border-radius: 7px; color: var(--tt-text-2); font-size: 12.5px; }
  .rq-viewed:hover { background: var(--tt-hover); color: var(--tt-text); }
  .rq-diff { flex: 1; min-height: 0; overflow: auto; background: var(--tt-code-bg); }
  .rq-diff .d-body { overflow: visible; }
  .rq-foot { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-top: 1px solid var(--tt-hairline); font-size: 12.5px; }
  .rq-foot .btn { height: 30px; padding: 0 10px; font-size: 12.5px; }
  .rq-foot__mid { flex: 1; text-align: center; color: var(--tt-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kbd { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; border: 1px solid var(--tt-hairline); border-radius: 4px; color: var(--tt-text-muted); font: 11px var(--tt-font-mono); }
  /* At the minimum the queue folds into a strip above the file. */
  @container rq (max-width: 460px) {
    .rq-main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .rq-queue { flex-direction: row; gap: 4px; overflow-x: auto; overflow-y: hidden; padding: 5px 6px; border-right: 0; border-bottom: 1px solid var(--tt-hairline); }
    .rq-item { flex: none; width: auto; grid-template-columns: auto auto; padding: 4px 8px; }
    .rq-item__sub, .rq-item__stale { display: none; }
    .rq-foot .btn__word { display: none; }
    .rq-file__head { flex-wrap: wrap; }
  }

  /* C — changes in the conversation, and the working tree as a sheet over the pane. */
  .turn-act { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 6px 10px; border: 1px solid var(--tt-hairline); border-radius: 8px; color: var(--tt-text-muted); font-size: 13px; }
  .turn-act:hover, .turn-act[aria-expanded='true'] { background: var(--tt-hover); color: var(--tt-text); }
  .turn-act > .i:last-child { transition: transform .15s; }
  .turn-act[aria-expanded='true'] > .i:last-child { transform: rotate(90deg); }
  @media (prefers-reduced-motion: reduce) { .turn-act > .i:last-child { transition: none; } }
  .tc { margin-top: 8px; overflow: hidden; border: 1px solid var(--tt-hairline); border-radius: 10px; background: var(--tt-surface); }
  .tc__row { display: flex; align-items: center; gap: 6px; width: 100%; min-height: 34px; padding: 0 10px 0 6px; border-top: 1px solid var(--tt-hairline); font-size: 13px; text-align: left; }
  .tc__row:first-child { border-top: 0; }
  .tc__row:hover { background: var(--tt-hover); }
  .tc__row > .i:first-child { color: var(--tt-text-muted); }
  .tc__row .cnt { margin-left: auto; padding-left: 8px; }
  .tc .d-body { max-height: 260px; overflow: auto; border-top: 1px solid var(--tt-hairline); }
  .tc .problem { padding: 12px 14px; }
  .tc .problem strong { font-size: 13px; }
  .wt-chip { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; height: 28px; margin: 0 0 8px 4px; padding: 0 11px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-pill); background: var(--tt-surface); color: var(--tt-text-2); font-size: 12.5px; white-space: nowrap; }
  .wt-chip:hover, .wt-chip[aria-expanded='true'] { background: var(--tt-hover); color: var(--tt-text); }
  .wt-chip strong { color: var(--tt-text); font-weight: 500; }
  .wt-chip[aria-disabled='true'], .wt-chip[aria-disabled='true']:hover { background: var(--tt-surface); color: var(--tt-text-muted); }
  .sheet { position: absolute; top: 48px; left: 8px; right: 8px; bottom: 0; z-index: 20; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--tt-panel-border); border-bottom: 0; border-radius: 12px 12px 0 0; background: var(--tt-surface); box-shadow: var(--tt-shadow-lg); }
  .sheet__head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-height: 46px; padding: 6px 8px 6px 10px; border-bottom: 1px solid var(--tt-hairline); }
  .tabs { display: inline-flex; padding: 2px; border: 1px solid var(--tt-hairline); border-radius: 9px; }
  .tabs button { height: 28px; padding: 0 10px; border-radius: 7px; color: var(--tt-text-2); font-size: 13px; white-space: nowrap; }
  .tabs button[aria-selected='true'] { background: var(--tt-selected); color: var(--tt-text); font-weight: 500; }
  .sheet__fact { min-width: 0; overflow: hidden; color: var(--tt-text-muted); font: 12px var(--tt-font-mono); text-overflow: ellipsis; white-space: nowrap; }
  .sheet__tail { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .sheet__files { flex: 1; min-height: 0; overflow: auto; }
</style>
</head>
<body>
<script src="./shell.js"></script>
<script>
const I = Proto.icon
const EXTRA = {
  expand: '<path d="m7 15 5 5 5-5M7 9l5-5 5 5"/>',
  collapse: '<path d="m7 20 5-5 5 5M7 4l5 5 5-5"/>',
  rows: '<rect x="4" y="4.5" width="16" height="15" rx="2"/><path d="M4 12h16"/>',
  wrap: '<path d="M4 6h16M4 12h13a3 3 0 0 1 0 6h-4M4 18h5"/><path d="m15 16-2 2 2 2"/>',
  pilcrow: '<path d="M13 4v16M17 4v16M19 4H9.5a4.5 4.5 0 0 0 0 9H13"/>',
  cloud: '<path d="M7 18.5h10a4 4 0 0 0 .6-8A6 6 0 0 0 6 9.5a4.5 4.5 0 0 0 1 9z"/>',
  arrowRight: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  left: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
}
const ic = (name, cls = 'sm') => EXTRA[name] ? `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${EXTRA[name]}</svg>` : I(name, cls)
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')

/* The files, as unified patches. */
const PATCH = {
  preview: { path: 'src/main/voice/preview.ts', lines: [
    '@@ -1,5 +1,6 @@',
    ' import { synthesize } from \'./xai\'',
    ' import { player } from \'./player\'',
    '+import { PREVIEW_SECONDS } from \'../../shared/voices\'',
    ' import type { VoiceId } from \'../../shared/voices\'',
    ' ',
    ' const SAMPLE_TEXT = \'This is how I sound.\'',
    '@@ -14,9 +15,14 @@ export async function previewVoice(voice: VoiceId): Promise<void> {',
    '   const key = await credentials.read(\'xai-voice\')',
    '   if (!key) throw new VoiceError(\'no-key\')',
    '-  const audio = await synthesize(voice, SAMPLE_TEXT, key)',
    '-  await player.play(audio)',
    '+  const audio = await synthesize(voice, SAMPLE_TEXT, key, {',

                  <button class="rq-viewed" data-act="viewed" role="checkbox" aria-checked="${L.viewed.includes(f.path)}"><span class="ck">${I('check', 'sm')}</span>Viewed</button>
                  <button class="ico" aria-label="Copy path: ${f.path}" title="Copy path">${I('copy', 'sm')}</button>
                  ${f.status !== 'deleted' ? `<button class="ico" aria-label="Open ${f.path} in Files" title="Open in Files">${I('external', 'sm')}</button>` : ''}</div>
                <div class="rq-diff">${diffHtml(f, { split: L.split, wrap: true, labels: L.scope === 'branch' ? ['main', HEAD] : sideLabels(L.scope) })}</div>
                <div class="rq-foot">
                  <button class="btn btn--secondary" data-act="prev" ${idx === 0 ? 'disabled' : ''} aria-label="Previous file">${ic('left')}<span class="btn__word">Previous</span><span class="kbd">k</span></button>
                  <span class="rq-foot__mid">${done === list.length ? 'All files viewed' : `File ${idx + 1} of ${list.length}`}</span>
                  <button class="btn btn--secondary" data-act="next" ${idx === list.length - 1 ? 'disabled' : ''} aria-label="Next file"><span class="kbd">j</span><span class="btn__word">Next</span>${ic('arrowRight')}</button>
                </div>
              </section>
            </div>`
        return {
          transcript: transcript(ctx.state, plainRow),
          tools: { active: 'changes', body: `<div class="rq">
            <div class="rq-top">
              <button class="rq-scope" data-act="menu" aria-haspopup="menu" aria-expanded="${L.menu}" aria-label="Diff scope: ${SCOPE_LABEL[L.scope]}">${SCOPE_LABEL[L.scope]}${I('chevron', 'sm')}</button>
              <span class="rq-cmp" title="${cmp}">${cmp}</span>
              <span class="rq-tail">
                ${list.length ? `<span class="rq-progress" role="status"><span>${done} of ${list.length} viewed</span><span class="rq-meter" aria-hidden="true"><span style="width:${Math.round(done / list.length * 100)}%"></span></span></span>` : ''}
                <span class="seg"><button class="ico" data-act="stacked" aria-pressed="${!L.split}" aria-label="Stacked diff view" title="Stacked diff view">${ic('rows', '')}</button><button class="ico" data-act="split" aria-pressed="${L.split}" aria-label="Split diff view" title="Split diff view">${I('split')}</button></span>
                <button class="ico" aria-label="Refresh diff" title="Refresh diff">${I('refresh')}</button>
              </span>
              ${menu}
            </div>
            ${main}
          </div>` },
        }
      },
      mount(root, ctx) {
        const L = ctx.local, app = root.querySelector('.app')
        const list = () => review(ctx.state, L.scope).files
        const go = d => { const n = Math.max(0, Math.min(list().length - 1, L.idx + d)); if (n !== L.idx) { L.idx = n; L.scroll = {}; ctx.rerender() } }
        keyHandler = e => {
          if (e.key === 'Escape' && L.menu) { L.menu = false; ctx.rerender() }
          else if (e.key === 'j') go(1)
          else if (e.key === 'k') go(-1)
        }
        keepScroll(app, L, ['.rq-diff', '.rq-queue'])
        app.addEventListener('click', e => {
          const el = e.target.closest('[data-act]'); if (!el) { if (L.menu && !e.target.closest('.rq-menu')) { L.menu = false; ctx.rerender() } return }
          const act = el.dataset.act
          if (act === 'menu') L.menu = !L.menu
          else if (act === 'scope') { L.scope = el.dataset.scope; L.menu = false; L.idx = Math.max(0, list().findIndex(f => !L.viewed.includes(f.path))); L.scroll = {} }
          else if (act === 'pick') { L.idx = +el.dataset.i; L.scroll = { '.rq-queue': L.scroll?.['.rq-queue'] ?? 0 } }
          else if (act === 'prev') return go(-1)
          else if (act === 'next') return go(1)
          else if (act === 'stacked') L.split = false
          else if (act === 'split') L.split = true
          else if (act === 'viewed') {
            const files = list(), path = files[L.idx].path
            if (L.viewed.includes(path)) L.viewed = L.viewed.filter(p => p !== path)
            else {
              L.viewed = [...L.viewed, path]
              const next = files.findIndex((f, i) => i > L.idx && !L.viewed.includes(f.path))
              const any = files.findIndex(f => !L.viewed.includes(f.path))
              if (next >= 0 || any >= 0) { L.idx = next >= 0 ? next : any; L.scroll = {} }
            }
          } else return
          ctx.rerender()
        })
      },
    },
    {
      key: 'C', name: 'Changes inside the conversation',
      note: 'No Changes panel. Each reply’s activity row opens into that turn’s files, and each file opens into its lines. A chip above the composer sums up the working tree and opens it as a sheet over the pane, with Branch changes beside it. Escape closes the sheet.',
      render(ctx) {
        const L = sync(ctx, state => ({
          sheet: state === 'working' || state === 'branch', sheetScope: state === 'branch' ? 'branch' : 'working',
          turns: state === 'latest' ? ['turn3'] : state === 'turn2' ? ['turn2'] : [], rowsOpen: state === 'latest' ? ['turn3:src/main/voice/preview.ts'] : [],
          collapsed: [], split: false, jump: state === 'latest' ? 'turn3' : state === 'turn2' ? 'turn2' : null,
        }))
        const row = t => {
          const open = L.turns.includes(t.key)
          const list = files(t.key)
          const inner = !open ? '' : t.commands ? `<div class="tc"><div class="problem" role="status"><strong>${TURN2_NOTICE}</strong></div></div>`
            : `<div class="tc">${list.map(f => { const k = `${t.key}:${f.path}`, fo = L.rowsOpen.includes(k); return `
                <button class="tc__row" data-act="row" data-k="${k}" aria-expanded="${fo}">${I(fo ? 'chevron' : 'chevronRight', 'sm')}${badge(f.status)}${pathHtml(f)}${counts(f.adds, f.dels)}</button>
                ${fo ? diffHtml(f, { wrap: true }) : ''}` }).join('')}</div>`
          return `<button class="turn-act" data-act="turn" data-turn="${t.key}" aria-expanded="${open}">${I(t.commands ? 'computer' : 'file', 'sm')}<span>${activityWords(t)}${t.commands ? ' · <span class="muted">changes unavailable</span>' : ''}</span>${I('chevronRight', 'sm')}</button>${inner}`
        }
        const wt = review(ctx.state, 'working'), wtSum = sum(wt.files)
        const chip = wt.files.length
          ? `<button class="wt-chip" data-act="sheet" aria-expanded="${L.sheet}" aria-label="Working tree: ${wt.files.length} files changed, ${wtSum.adds} lines added, ${wtSum.dels} removed. Open">${I('commit', 'sm')}<strong>Working tree</strong><span>${wt.files.length} files</span>${counts(wtSum.adds, wtSum.dels)}${I('up', 'sm')}</button>`
          : `<span class="wt-chip" aria-disabled="true">${I('commit', 'sm')}Working tree: no changes</span>`
        const r = review(ctx.state, L.sheetScope), list = r.files, s = sum(list)
        const allCollapsed = list.length > 0 && list.every(f => L.collapsed.includes(f.path))
        const sheet = !L.sheet ? '' : `<section class="sheet" role="dialog" aria-label="Working tree changes">
          <div class="sheet__head">
            <span class="tabs" role="tablist"><button role="tab" data-act="sscope" data-scope="working" aria-selected="${L.sheetScope === 'working'}">Working tree</button><button role="tab" data-act="sscope" data-scope="branch" aria-selected="${L.sheetScope === 'branch'}">Branch changes</button></span>
            <span class="sheet__fact">${L.sheetScope === 'working' ? 'against HEAD' : `${HEAD} → main`}</span>
            ${list.length ? counts(s.adds, s.dels) : ''}
            <span class="sheet__tail">
              <button class="ico" data-act="all" ${list.length ? '' : 'disabled'} aria-label="${allCollapsed ? 'Expand all files' : 'Collapse all files'}" title="${allCollapsed ? 'Expand all files' : 'Collapse all files'}">${ic(allCollapsed ? 'expand' : 'collapse', '')}</button>
              <span class="seg"><button class="ico" data-act="stacked" aria-pressed="${!L.split}" aria-label="Stacked diff view" title="Stacked diff view">${ic('rows', '')}</button><button class="ico" data-act="split" aria-pressed="${L.split}" aria-label="Split diff view" title="Split diff view">${I('split')}</button></span>
              <button class="ico" data-act="close" aria-label="Close changes" title="Close (Esc)">${I('x')}</button>
            </span>
          </div>
          <div class="sheet__files">${list.length ? list.map(f => fileBlock(f, { collapsed: L.collapsed.includes(f.path), split: L.split, wrap: true, labels: sideLabels(L.sheetScope) })).join('') : `<div class="problem" role="status"><strong>${r.empty}</strong></div>`}</div>
        </section>`
        return {
          transcript: transcript(ctx.state, row),
          aboveComposer: chip + sheet,
        }
      },
      mount(root, ctx) {
        const L = ctx.local, app = root.querySelector('.app')
        keyHandler = e => { if (e.key === 'Escape' && L.sheet) { L.sheet = false; ctx.rerender() } }
        keepScroll(app, L, ['.transcript', '.sheet__files'])
        if (L.jump) {
          const box = app.querySelector('.transcript'), turn = app.querySelector(`[data-turn="${L.jump}"]`)
          if (box && turn) { box.scrollTop = turn.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop - 90; L.scroll['.transcript'] = box.scrollTop }
          L.jump = null
        }
        app.addEventListener('click', e => {
          const el = e.target.closest('[data-act]'); if (!el) return
          const act = el.dataset.act, flip = (arr, v) => arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v]
          if (act === 'turn') L.turns = flip(L.turns, el.dataset.turn)
          else if (act === 'row') L.rowsOpen = flip(L.rowsOpen, el.dataset.k)
          else if (act === 'sheet') L.sheet = !L.sheet
          else if (act === 'close') L.sheet = false
          else if (act === 'sscope') { L.sheetScope = el.dataset.scope; L.scroll['.sheet__files'] = 0 }
          else if (act === 'toggle') L.collapsed = flip(L.collapsed, el.dataset.path)
          else if (act === 'all') { const list = review(ctx.state, L.sheetScope).files; L.collapsed = list.every(f => L.collapsed.includes(f.path)) ? [] : list.map(f => f.path) }
          else if (act === 'stacked') L.split = false
          else if (act === 'split') L.split = true
          else return
          ctx.rerender()
        })
      },
    },
  ],
})
</script>
</body>
</html>
