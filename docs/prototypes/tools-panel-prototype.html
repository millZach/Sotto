<!doctype html>
<!-- THROWAWAY PROTOTYPE - three directions for the Tools panel beside the thread panes. Synthetic data only.
     ?variant=A/B/C. A "Rail": the surfaces are a narrow strip on the panel's outer edge, everything else is
     content. B "Stack": no tabs; five live summary rows, one expanded. C "Bench": one header line, and one
     list-plus-detail layout for every surface with its controls in a slim bottom bar. Open the file directly. -->

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.5 Figtree,system-ui,sans-serif;color:var(--text);background:var(--bg);overflow:hidden}
button,input,select{font:inherit;color:inherit}button,select{cursor:pointer}button{border:0;background:none;padding:0}

svg{display:block}
.window{height:calc(100% - 96px);display:grid;grid-template-columns:232px minmax(360px,1fr) var(--panel,420px)}
.window[data-panel=wide]{--panel:560px}.window[data-panel=narrow]{--panel:340px}
/* Sidebar and pane, quiet, as they ship. */
.sidebar{padding:14px 8px;background:var(--sidebar);border-right:1px solid var(--hair)}
.brand{display:flex;align-items:center;gap:9px;height:28px;padding:0 10px;margin-bottom:18px;font-weight:600}.brand i{width:14px;height:14px;border-radius:4px;background:var(--accent)}
.group{color:var(--muted);font-size:12px;padding:12px 10px 5px}.row{padding:7px 10px;display:flex;gap:9px;align-items:center;border-radius:8px}.row.active{background:var(--selected)}.row small{margin-left:auto;color:var(--muted);font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;border:1px solid var(--muted);flex:none}.active .dot{background:var(--accent);border-color:var(--accent)}
.pane{min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--hair)}
.head{height:44px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--hair)}.head strong{font-weight:500}.head span{color:var(--muted);font-size:12px}

/* The panel: everything below is per variant. Shared atoms only. */
.panel{position:relative;min-width:0;background:var(--sidebar);display:flex;flex-direction:column;color:var(--text2);overflow:hidden}
/* The window controls the real app keeps at the top right, once. Every direction leaves them their room. */
.winctl{position:absolute;top:0;right:0;z-index:3;display:flex;height:40px;color:var(--muted);background:var(--sidebar)}.winctl span{width:46px;display:grid;place-items:center;font-size:12px}
.B .title,.C .bar{padding-right:144px}
.icon{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;color:var(--muted)}.icon:hover{background:color-mix(in srgb,var(--text) 7%,transparent);color:var(--text)}
.mono{font-family:var(--mono);font-size:13px}
.code{font-family:var(--mono);font-size:13px;line-height:1.6;white-space:pre;margin:0;color:var(--text)}
.tree{list-style:none;margin:0;padding:0}.tree li{display:flex;align-items:center;gap:7px;min-height:28px;padding:0 10px;border-radius:6px;color:var(--text2)}.tree li[data-sel]{background:var(--selected);color:var(--text)}.tree li i{width:14px;height:14px;border-radius:3px;background:currentColor;opacity:.35;flex:none}.tree li.dir i{border-radius:3px 3px 3px 3px;opacity:.55}.tree li.in{padding-left:28px}
.web{background:oklch(.975 .01 90);color:oklch(.3 .03 150);padding:22px 20px;flex:1;overflow:hidden}.web h1{font-size:26px;margin:14px 0 6px;letter-spacing:-.01em;color:oklch(.28 .04 150)}.web small{letter-spacing:.06em;font-size:10px;color:oklch(.5 .04 150)}.web p{margin:0 0 14px;max-width:34ch;color:oklch(.4 .03 150)}.web b{display:inline-block;background:oklch(.42 .07 150);color:#fff;font-weight:500;padding:9px 14px;border-radius:5px}.web .art{float:right;width:38%;aspect-ratio:1;background:linear-gradient(135deg,oklch(.85 .05 130) 0 30%,oklch(.72 .08 140) 30% 60%,oklch(.5 .09 150) 60% 100%);border-radius:3px;margin:0 0 10px 14px}
.term{font-family:var(--mono);font-size:13px;line-height:1.55;padding:12px 14px;flex:1;overflow:hidden;color:var(--text);background:var(--code)}.term .ps{color:var(--muted)}.term .cur{display:inline-block;width:7px;height:15px;background:var(--accent);vertical-align:-2px}
.diff{font-family:var(--mono);font-size:13px;line-height:1.6;margin:0;flex:1;overflow:auto}.diff div{display:grid;grid-template-columns:34px 34px 1fr;padding:0 10px}.diff .h{color:var(--muted);background:color-mix(in srgb,var(--text) 5%,transparent)}.diff .m{background:color-mix(in srgb,oklch(.6 .2 25) 16%,transparent)}.diff .a{background:color-mix(in srgb,var(--ok) 16%,transparent)}.diff span{color:var(--faint);text-align:right;padding-right:10px}

.empty{flex:1;display:grid;place-items:center;color:var(--muted)}
/* ---------- A · Rail ---------- */
.A .panel{flex-direction:row}
.A .rail{order:2;width:58px;flex:none;border-left:1px solid var(--hair);display:flex;flex-direction:column;align-items:center;padding:46px 0 8px;gap:2px}

.A .rail button.s:hover{color:var(--text);background:color-mix(in srgb,var(--text) 6%,transparent)}

.A .foot{height:30px;flex:none;display:flex;align-items:center;gap:7px;padding:0 14px;border-top:1px solid var(--hair);color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden}.A .foot b{font-weight:500;color:var(--text2)}.A .foot .mono{font-size:12px}

.B .sheet{flex:none;display:flex;flex-direction:column;border-bottom:1px solid var(--hair);min-height:0}
.B .sheet>button{display:grid;grid-template-columns:18px 1fr auto;gap:12px;align-items:center;min-height:46px;padding:0 16px;text-align:left;width:100%;color:var(--text2)}

.B .sheet[data-open]{flex:1}.B .sheet[data-open]>button{background:var(--raised);border-radius:0}
.B .sheet[data-open]>button .sum{color:var(--text2)}
.B .sheet .body{display:none;flex:1;min-height:0;flex-direction:column}.B .sheet[data-open] .body{display:flex}
.B .sub{display:flex;align-items:center;gap:6px;height:36px;padding:0 8px 0 16px;border-bottom:1px solid var(--hair);color:var(--muted);font-size:12.5px}.B .sub .r{margin-left:auto;display:flex;gap:2px}.B .sub input{flex:1;height:24px;border:1px solid var(--hair);border-radius:6px;background:var(--field);padding:0 8px;font-family:var(--mono);font-size:12px;color:var(--text2)}
.B .two{flex:1;min-height:0;display:grid;grid-template-rows:auto 1fr}.B .two>*:first-child{max-height:34%;overflow:auto;border-bottom:1px solid var(--hair);padding:4px 6px}
/* ---------- C · Bench ---------- */
.C .bar{height:42px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;border-bottom:1px solid var(--hair)}
.C .bar .sys{display:flex;gap:2px;margin-left:auto}

.C .words{display:flex;gap:0;min-width:0;overflow:hidden}.C .words button{padding:5px 7px;border-radius:6px;color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:5px;white-space:nowrap}.C .words button:hover{color:var(--text)}.C .words button[aria-selected=true]{color:var(--text);font-weight:500}.C .words button[aria-selected=true]::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.C .words button u{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.6}
.C .bench{flex:1;min-height:0;display:grid;grid-template-columns:196px 1fr}.C .bench>.list{border-right:1px solid var(--hair);overflow:auto;padding:6px;display:flex;flex-direction:column;gap:2px}.C .bench>.detail{display:flex;flex-direction:column;min-width:0}
.C .list .lh{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 4px;color:var(--muted);font-size:12px}.C .list .lh button{color:var(--faint)}
.C .toolbar{height:36px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px 0 12px;border-top:1px solid var(--hair);color:var(--muted);font-size:12.5px}.C .toolbar .r{margin-left:auto;display:flex;gap:2px;align-items:center}.C .toolbar input{flex:1;height:24px;border:1px solid var(--hair);border-radius:6px;background:var(--field);padding:0 8px;font-family:var(--mono);font-size:12px;color:var(--text2)}.C .toolbar .chip{border:1px solid var(--hair);border-radius:999px;padding:1px 8px;font-size:12px}
.C .dtitle{display:flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 14px;color:var(--text);font-weight:500;border-bottom:1px solid var(--hair);white-space:nowrap}.C .dtitle small{color:var(--muted);font-weight:400;min-width:0;overflow:hidden;text-overflow:ellipsis}

.C .sys .more{display:none;font-size:18px;line-height:1}
.C .window:not([data-panel=wide]) .sys .icon:not(.more){display:none}.C .window:not([data-panel=wide]) .sys .more{display:grid}
.C .window:not([data-panel=wide]) .words button{font-size:12.5px;padding:5px 5px;gap:4px}
.C .toolbar>span:first-child,.C .toolbar>:not(input):not(.r):not(button){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.C .dtitle .r{margin-left:auto;display:flex;gap:2px}
.C .pages .tree li{gap:9px}.C .pages img{width:36px;height:24px;border-radius:3px;background:oklch(.975 .01 90);border:1px solid var(--hair);flex:none}
.change{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 10px;border-radius:6px;color:var(--text2)}.change[data-sel]{background:var(--selected);color:var(--text)}.change small{display:block;color:var(--muted);font-size:11.5px}.change em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--warn)}.change em.u{color:var(--ok)}
/* Bottom bar and window chrome */
.bar-proto{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:8px 12px;background:var(--text);color:var(--bg);border-radius:18px;box-shadow:0 8px 30px var(--shadow);white-space:nowrap;z-index:9}
.bar-proto button{border-radius:8px;padding:7px 9px;min-height:36px}.bar-proto button:hover{background:color-mix(in srgb,var(--bg) 12%,transparent)}.bar-proto button[aria-pressed=true]{background:var(--bg);color:var(--text)}
.vlabel{min-width:150px;text-align:center;font-weight:600}.divider{height:22px;width:1px;background:color-mix(in srgb,var(--bg) 25%,transparent);margin:0 4px}
.bar-proto select{background:transparent;color:inherit;border:1px solid color-mix(in srgb,var(--bg) 30%,transparent);border-radius:8px;padding:7px;font-size:14px}.bar-proto option{background:var(--bg);color:var(--text)}
.fb{position:fixed;bottom:64px;left:16px;right:16px;text-align:center;color:var(--muted);font-size:12px;pointer-events:none}
</style>

 ['A','The rail','Surfaces live on a strip at the panel’s outer edge. One line of chrome above the work, the working copy as a footer. Content gets the height.'],
 ['B','The stack','No tabs. Five summary rows say what each tool is doing right now; one is open. The panel reads at a glance and never hides the others.'],
 ['C','The bench','One header line: working copy left, the surfaces as words right. Every tool is a list beside a detail, with its controls in a slim bottom bar.'],
]

let variant=variants.some(v=>v[0]===params.get('variant'))?params.get('variant'):'A', surface='browser'
const $=s=>document.querySelector(s)
const sys=`<button class="icon" title="Pin to this thread">${I.pin}</button><button class="icon" title="Fill the window">${I.grow}</button><button class="icon" title="Close Tools">${I.x}</button>`
function A(){
  const rail=`<nav class="rail" aria-label="Tools"><div class="sys">${sys}</div>${S.map(([id,l])=>`<button class="s" role="tab" aria-selected="${surface===id}" data-s="${id}">${I[id]}<span>${l}</span>${LIVE[id]&&surface!==id?'<u aria-label="live"></u>':''}</button>`).join('')}<div class="spacer"></div></nav>`
  const body={
    browser:`<div class="strip"><span class="t">Fieldnotes</span><div class="r"><button class="icon" title="New page">${I.plus}</button></div></div><div class="addr"><button class="icon">${I.back}</button><button class="icon">${I.fwd}</button><button class="icon">${I.reload}</button><input value="http://127.0.0.1:53751/"><button class="icon" title="Open outside">${I.ext}</button></div>${web}`,

}
function B(){
  const inner={
    browser:`<div class="sub"><button class="icon">${I.back}</button><button class="icon">${I.fwd}</button><input value="http://127.0.0.1:53751/"><div class="r"><button class="icon">${I.ext}</button><button class="icon">${I.plus}</button></div></div>${web}`,
    terminal:`<div class="sub">powershell.exe<div class="r"><button class="icon">${I.plus}</button></div></div>${term}`,
    files:`<div class="two"><div>${tree}</div><div style="display:flex;flex-direction:column;min-height:0"><div class="sub">app.ts · 101 B<div class="r"><button class="icon">${I.copy}</button><button class="icon">${I.ext}</button></div></div>${code}</div></div>`,
    changes:`<div class="two"><div>${changed}</div><div style="display:flex;flex-direction:column;min-height:0"><div class="sub">app.ts · working copy against HEAD<div class="r"><button class="icon">${I.reload}</button></div></div>${diff}</div></div>`,
    agents:agents,
  }
  return `<div class="title"><span class="t">Sotto test</span><span class="c mono">master</span><div class="r">${sys}</div></div>`+S.map(([id,l])=>`<section class="sheet" ${surface===id?'data-open':''}><button data-s="${id}" aria-expanded="${surface===id}">${LIVE[id]?'<span class="live"></span>':'<span></span>'}<span><b>${l}</b> <span class="sum">${SUM[id]}</span></span><span class="k">${surface===id?'':'›'}</span></button><div class="body">${inner[id]}</div></section>`).join('')

function C(){
  const words=`<div class="words" role="tablist">${S.map(([id,l])=>`<button role="tab" aria-selected="${surface===id}" data-s="${id}">${l}${LIVE[id]&&surface!==id?'<u aria-label="live"></u>':''}</button>`).join('')}</div>`
  const bench={
    browser:`<div class="list pages"><div class="lh">Pages<button title="New page">${I.plus}</button></div><ul class="tree"><li data-sel><img alt="">Fieldnotes</li><li><img alt="">Trail 14 · map</li></ul></div><div class="detail"><div class="dtitle">Fieldnotes <small>shared with this thread</small><div class="r"><button class="icon">${I.ext}</button></div></div>${web}<div class="toolbar"><button class="icon">${I.back}</button><button class="icon">${I.fwd}</button><button class="icon">${I.reload}</button><input value="http://127.0.0.1:53751/"><div class="r"><span class="chip">Working</span></div></div></div>`,
    terminal:`<div class="list"><div class="lh">Shells<button title="New shell">${I.plus}</button></div><ul class="tree"><li data-sel><i></i>powershell</li><li><i></i>npm run dev</li></ul></div><div class="detail">${term}<div class="toolbar">Ctrl+C copies or stops · Ctrl+Tab leaves<div class="r"><button class="icon">${I.copy}</button><button class="icon">${I.x}</button></div></div></div>`,
    files:`<div class="list"><div class="lh">Sotto test<button title="Open folder">${I.ext}</button></div>${tree}</div><div class="detail"><div class="dtitle">app.ts <small>101 B</small><div class="r"><button class="icon">${I.copy}</button></div></div>${code}<div class="toolbar">Read only<div class="r"><span class="chip">Wrap lines</span></div></div></div>`,
    changes:`<div class="list"><div class="lh">3 changed<button title="Refresh">${I.reload}</button></div>${changed}</div><div class="detail"><div class="dtitle">app.ts <small>M · src</small><div class="r"><button class="icon">${I.copy}</button></div></div>${diff}<div class="toolbar">Working copy against HEAD<div class="r"><span class="chip">Stage file</span><span class="chip">Pull request</span></div></div></div>`,
    agents:`<div class="list"><div class="lh">This turn</div><ul class="tree"><li data-sel><i></i>4 agents</li><li><i></i>Earlier · 12</li></ul></div><div class="detail">${agents}<div class="toolbar">2 working · claude-opus-5-5<div class="r"><span class="chip">Older</span></div></div></div>`,
  }[surface]
  // The working copy heads the list column: the list is this thread's things, so its folder belongs above them.
  const copy='<div class="copy"><b>Sotto test</b><span class="mono">master</span></div>'
  return `<div class="bar">${words}<div class="sys">${sys}<button class="icon more" title="Pin, fill the window, close" aria-haspopup="menu">⋯</button></div></div><div class="bench">${bench.replace(/<div class="list[^"]*">/,m=>m+copy)}</div>`

function render(){
  const v=variants.find(v=>v[0]===variant)
  document.body.className=variant
  $('#panel').innerHTML={A,B,C}[variant]()+'<div class="winctl" aria-hidden="true"><span>—</span><span>☐</span><span>✕</span></div>'
  $('#vlabel').textContent=`${v[0]} · ${v[1]}`; $('#fb').textContent=v[2]
  $('#surface').value=surface
  $('#theme').setAttribute('aria-pressed',document.documentElement.dataset.theme==='light')
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{surface=b.dataset.s;render()})
  window.prototypeState={variant,surface,width:$('#window').dataset.panel}
}
function cycle(d){variant=variants[(variants.findIndex(v=>v[0]===variant)+d+3)%3][0];const u=new URL(location);u.searchParams.set('variant',variant);history.replaceState(null,'',u);render()}
$('#prev').onclick=()=>cycle(-1);$('#next').onclick=()=>cycle(1)
$('#surface').onchange=e=>{surface=e.target.value;render()}
$('#width').onchange=e=>{$('#window').dataset.panel=e.target.value;render()}
$('#theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'':'light';render()}
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)})
render()
</script>
