  (provider rail, search, model list, Dynamic / Model routing) and one for reasoning effort and speed
  (effort list + Standard/Fast segmented control). Zach wants them combined into ONE picker while keeping
  their exact appearance in the composer (`[mark] Opus 5.5  High ⚡`).

  Three directions on ?variant=A|B|C (or the top bar, keys 1/2/3, ←/→, plus Compare all 3):
    A  Footer Dock.       Familiar 52px provider rail + search + model list, with a docked Effort & Speed
                          strip anchored cleanly across the bottom above Dynamic / Model routing.
                          Compact width (~356px); fits narrow 820px windows without reflowing.
    B  Split Deck.        Wide, low-height two-pane popover (~560px × 372px): provider rail + searchable
                          models on the left, dedicated Effort list + Speed + Dynamic/Routing inspector
                          on the right. Full un-abbreviated effort names; less vertical cover over chat.
    C  Inline Model Card. Horizontal provider icon strip across the top (reclaiming rail width) and an
                          expanded active model card right inside the list holding that model's own
                          effort chips and speed switch. Effort & speed live physically on the model.

  const m = getModel(id);
  if (state.startedThread && m.providerId !== state.threadProviderId) {

  if (state.routing) state.routing = false;
  state.modelId = m.id;
  if (m.efforts.length) {
    if (!m.efforts.includes(state.effort)) state.effort = m.defaultEffort || m.efforts[0];
  } else {
    state.effort = '';
  }
  if (!m.speeds.includes(state.speed)) state.speed = 'standard';
  render();
}

}

  plus: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>`,
  arrowUp: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>`,
  chevRight: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>`,
  chevDown: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>`,
};

function filteredList(dir) {
  const tab = state.providerTab[dir];
  const q = state.query[dir].trim().toLowerCase();
  const words = q ? q.split(/\s+/) : [];
  const matches = m => words.every(w => `${m.name} ${m.provider} ${m.source || ''}`.toLowerCase().includes(w));

  if (tab === 'favorites') {
    if (words.length) {
      return { mode: 'search-all', items: MODELS.filter(matches), legacy: [] };
    }
    return { mode: 'favorites', items: MODELS.filter(m => state.favorites.has(m.id)), legacy: [] };
  }
  const byProv = MODELS.filter(m => m.providerId === tab);
  const latest = byProv.filter(m => (!m.legacy || state.favorites.has(m.id)) && matches(m));
  const legacy = byProv.filter(m => m.legacy && !state.favorites.has(m.id) && matches(m));
  return { mode: 'provider', items: latest, legacy };
}

function showContinuationNote(dir) {
  if (!state.startedThread) return 'Any provider until your first message.';
  const tab = state.providerTab[dir];
  if (tab === 'favorites') {
    const hasOther = [...state.favorites].some(id => getModel(id).providerId !== state.threadProviderId);
    return hasOther ? 'Picking another provider starts a new thread there with a handover of this one. This thread stays as it is.' : '';
  }
  if (tab !== state.threadProviderId) {
    return 'Picking one starts a new thread there with a handover of this one. This thread stays as it is.';
  }
  return '';
}

function renderSpeedControl(model, dir) {
  if (model.speeds.length <= 1) return '';
  return `<div class="speed-seg" role="radiogroup" aria-label="Speed">
    ${model.speeds.map(sp => {
      const fast = sp !== 'standard';
      const bolts = sp === 'fast' ? ICONS.bolt(true, 11) : sp === 'ultrafast' ? ICONS.bolt(true, 11) + ICONS.bolt(true, 11) : '';
      return `<button type="button" role="radio" data-action="speed" data-dir="${dir}" data-speed="${sp}" data-fast="${fast}" aria-checked="${state.speed === sp}" title="${SPEED_META[sp].cost || 'Standard speed'}">${bolts}${SPEED_META[sp].name}</button>`;
    }).join('')}
  </div>`;
}

function renderToggles(dir, indent = false) {
  const dynDisabled = state.routing;
  const routeDisabled = state.dynamic;
  return `<div class="pk-toggles" style="${indent ? 'padding-left:60px;' : ''}">
    <button type="button" class="pk-toggle" role="switch" data-action="toggle-dynamic" data-dir="${dir}" aria-checked="${state.dynamic}" ${dynDisabled ? 'disabled' : ''}>
      <span class="pk-toggle__label"><span>Dynamic</span>${dynDisabled ? '<span class="pk-toggle__sub">Turn model routing off to use Dynamic.</span>' : ''}</span>
      <span class="pk-switch" aria-hidden="true"></span>
    </button>
    <button type="button" class="pk-toggle" role="switch" data-action="toggle-routing" data-dir="${dir}" aria-checked="${state.routing}" ${routeDisabled ? 'disabled' : ''}>
      <span class="pk-toggle__label"><span>Model routing</span>${routeDisabled ? '<span class="pk-toggle__sub">Turn Dynamic off to use model routing.</span>' : ''}</span>
      <span class="pk-switch" aria-hidden="true"></span>
    </button>
  </div>`;
}

function renderModelRow(m, dir, showMark) {
  const selected = m.id === state.modelId;
  const starred = state.favorites.has(m.id);
  return `<button type="button" class="pk-row" role="option" data-action="pick-model" data-dir="${dir}" data-model="${m.id}" aria-selected="${selected}">
    <span class="pk-row__main">
      ${showMark ? svgMark(m.providerId, 13) : ''}
      <span class="pk-row__name">${m.name}</span>
      ${m.source ? `<span class="pk-row__source">${m.source}</span>` : ''}
    </span>
    ${selected ? ICONS.check : ''}
    <span class="pk-star" role="button" tabindex="-1" data-action="star" data-dir="${dir}" data-model="${m.id}" data-starred="${starred}" title="${starred ? 'Remove from favorites' : 'Add to favorites'}">${ICONS.star(starred, 13)}</span>
  </button>`;
}

function renderModelList(dir, { inlineActiveCard = false } = {}) {
  const { mode, items, legacy } = filteredList(dir);
  const showMark = mode === 'favorites' || mode === 'search-all';
  const model = getModel();
  const q = state.query[dir].trim();

  if (!items.length && !legacy.length) {
    return `<p class="pk-empty">${mode === 'favorites' ? 'Star a model to keep it here.' : 'No matching models.'}</p>`;
  }

  let html = '';
  if (mode === 'search-all') {
    const groups = new Map();
    for (const m of items) {
      if (!groups.has(m.provider)) groups.set(m.provider, []);
      groups.get(m.provider).push(m);
    }
    for (const [prov, list] of groups) {
      html += `<div class="pk-group"><span>${prov}</span><span>${list.length}</span></div>`;
      for (const m of list) {
        html += (inlineActiveCard && m.id === model.id) ? renderInlineCardC(m, dir) : renderModelRow(m, dir, true);
      }
    }
    return html;
  }

  for (const m of items) {
    html += (inlineActiveCard && m.id === model.id) ? renderInlineCardC(m, dir) : renderModelRow(m, dir, showMark);
  }

  if (legacy.length) {
    if (!q) {
      const open = state.legacyOpen[dir];
      html += `<button type="button" class="pk-legacy" data-action="toggle-legacy" data-dir="${dir}" aria-expanded="${open}">
        ${open ? ICONS.chevDown : ICONS.chevRight} Legacy <span>${legacy.length} ${legacy.length === 1 ? 'model' : 'models'}</span>
      </button>`;
      if (open) {
        for (const m of legacy) html += (inlineActiveCard && m.id === model.id) ? renderInlineCardC(m, dir) : renderModelRow(m, dir, false);
      }
    } else {
      html += `<div class="pk-group"><span>Legacy</span><span>${legacy.length}</span></div>`;
      for (const m of legacy) html += (inlineActiveCard && m.id === model.id) ? renderInlineCardC(m, dir) : renderModelRow(m, dir, false);
    }
  }
  return html;
}

function renderRail(dir) {
  const active = state.providerTab[dir];
  return `<div class="pk-rail" role="tablist" aria-label="Providers" aria-orientation="vertical">
    ${PROVIDERS.map(p => `<button type="button" role="tab" data-action="tab" data-dir="${dir}" data-tab="${p.id}" aria-selected="${active === p.id}" title="${p.name}" aria-label="${p.name}">
      ${p.id === 'favorites' ? ICONS.star(false, 16) : svgMark(p.id, 17)}
    </button>`).join('')}
  </div>`;
}

/* ---------- Direction A: Footer Dock ---------- */
function renderPickerA(dir = 'A') {
  const model = getModel();
  const note = showContinuationNote(dir);
  const shownLevel = state.hoverEffortA && model.efforts.includes(state.hoverEffortA) ? state.hoverEffortA : state.effort;
  const meta = EFFORT_LABELS[shownLevel];
  const suggested = state.suggestDraft && model.efforts.includes('xhigh') && state.effort !== 'xhigh' && !state.routing ? 'xhigh' : null;
  const top = isTopEffort(model, shownLevel);

  return `<div class="picker picker--A" role="dialog" aria-label="Model, effort and speed" ${state.open[dir] ? '' : 'hidden'}>
    <div class="pkA-top">
      ${renderRail(dir)}
      <div class="pkA-panel">
        <div class="pk-search">
          ${ICONS.search}
          <input type="text" data-search="${dir}" value="${state.query[dir]}" placeholder="Search models" aria-label="Search models">
          <button type="button" class="pk-close" data-action="close" data-dir="${dir}" aria-label="Close picker">${ICONS.x}</button>
        </div>
        <div class="pk-list" role="listbox">${renderModelList(dir)}</div>
        ${note ? `<p class="pk-note">${note}</p>` : ''}
      </div>
    </div>

    <div class="pkA-dock">
      ${model.efforts.length ? `
        <div class="pkA-dock__head">
          <span class="pkA-dock__title">Effort · <b data-top="${top}">${state.routing ? 'Auto' : (meta?.full || 'Default')}</b></span>
          <span class="pkA-dock__hint">${state.routing ? 'Chosen per message by router' : (meta?.line || '')}</span>
        </div>
        <div class="pkA-effort-bar" role="radiogroup" aria-label="Reasoning effort" data-locked="${state.routing}">
          ${model.efforts.map(lv => {
            const info = EFFORT_LABELS[lv];
            return `<button type="button" role="radio" data-action="effort" data-hover-effort="${lv}" data-dir="${dir}" data-effort="${lv}" data-top="${isTopEffort(model, lv)}" data-suggested="${suggested === lv}" aria-checked="${!state.routing && state.effort === lv}" ${state.routing ? 'disabled' : ''} title="${info.full}: ${info.line}">${info.short}</button>`;
          }).join('')}
        </div>
      ` : `<p class="pkA-empty-effort">${model.name} has no adjustable effort levels.</p>`}
      ${model.speeds.length > 1 ? `<div class="pkA-speed-row"><span>Speed</span>${renderSpeedControl(model, dir)}</div>` : ''}
    </div>

    ${renderToggles(dir, false)}
  </div>`;
}

/* ---------- Direction B: Split Deck ---------- */
function renderPickerB(dir = 'B') {
  const model = getModel();
  const note = showContinuationNote(dir);
  const suggested = state.suggestDraft && model.efforts.includes('xhigh') && state.effort !== 'xhigh' && !state.routing ? 'xhigh' : null;
  const speedCost = SPEED_META[state.speed]?.cost || '';

  return `<div class="picker picker--B" role="dialog" aria-label="Model, effort and speed" data-btab="${state.compactBTab}" ${state.open[dir] ? '' : 'hidden'}>
    <div class="pkB-narrow-tabs" role="tablist">
      <button type="button" role="tab" data-action="btab" data-btab="models" aria-selected="${state.compactBTab === 'models'}">Models</button>
      <button type="button" role="tab" data-action="btab" data-btab="tuning" aria-selected="${state.compactBTab === 'tuning'}">Effort &amp; Speed</button>
    </div>

    ${renderRail(dir)}

    <div class="pkB-models">
      <div class="pk-search">
        ${ICONS.search}
        <input type="text" data-search="${dir}" value="${state.query[dir]}" placeholder="Search models" aria-label="Search models">
      </div>
      <div class="pk-list" role="listbox">${renderModelList(dir)}</div>
      ${note ? `<p class="pk-note">${note}</p>` : ''}
    </div>

    <div class="pkB-tuning">
      <div class="pkB-tuning__head">
        ${svgMark(model.providerId, 14)}
        <span class="pkB-tuning__model" title="${model.name}">${model.name}</span>
        <button type="button" class="pk-close" data-action="close" data-dir="${dir}" aria-label="Close picker">${ICONS.x}</button>
      </div>

      <div class="pkB-tuning__body" role="listbox" aria-label="Reasoning effort">
        <div class="pkB-sec-label"><span>Effort</span></div>
        ${state.routing ? `<p class="pkB-routed-note">Model routing chooses the model and effort for each message.</p>` : ''}
        ${model.efforts.length ? model.efforts.map(lv => {
          const info = EFFORT_LABELS[lv];
          const selected = !state.routing && state.effort === lv;
          return `<button type="button" role="option" class="pkB-effort-opt" data-action="effort" data-dir="${dir}" data-effort="${lv}" data-top="${isTopEffort(model, lv)}" aria-selected="${selected}" ${state.routing ? 'disabled' : ''} title="${info.line}">
            <span class="pkB-effort-opt__left">
              <span>${info.full}</span>
              ${suggested === lv ? '<span class="pkB-effort-opt__tag">Suggested</span>' : ''}
            </span>
            ${selected ? ICONS.check : ''}
          </button>`;
        }).join('') : `<p class="pk-empty" style="padding:8px;">No effort levels for ${model.name}.</p>`}
      </div>

      ${model.speeds.length > 1 ? `<div class="pkB-speed-wrap">
        ${renderSpeedControl(model, dir)}
        ${speedCost ? `<p class="pkB-speed-cost">${speedCost}</p>` : ''}
      </div>` : ''}

      ${renderToggles(dir, false)}
    </div>
  </div>`;
}

/* ---------- Direction C: Inline Model Card ---------- */
function renderInlineCardC(model, dir) {
  const starred = state.favorites.has(model.id);
  const suggested = state.suggestDraft && model.efforts.includes('xhigh') && state.effort !== 'xhigh' && !state.routing ? 'xhigh' : null;
  const cols = model.efforts.length === 4 ? '4' : model.efforts.length === 2 ? '2' : '3';
  const levelInfo = EFFORT_LABELS[state.effort];

  return `<div class="pkC-card" role="group" aria-label="${model.name}, active model">
    <div class="pkC-card__head">
      <span class="pkC-card__name">
        ${svgMark(model.providerId, 14)}
        <span class="pk-row__name">${model.name}</span>
        ${model.source ? `<span class="pk-row__source">${model.source}</span>` : ''}
      </span>
      ${ICONS.check}
      <button type="button" class="pk-star" data-action="star" data-dir="${dir}" data-model="${model.id}" data-starred="${starred}" title="${starred ? 'Remove from favorites' : 'Add to favorites'}">${ICONS.star(starred, 13)}</button>
    </div>

    ${model.efforts.length ? `<div class="pkC-card__section">
      <div class="pkC-card__label">
        <span>${state.routing ? 'Effort · Auto (routed)' : 'Effort'}</span>
        <span>${state.routing ? '' : (levelInfo?.line || '')}</span>
      </div>
      <div class="pkC-effort-grid" data-cols="${cols}" role="radiogroup" aria-label="Reasoning effort">
        ${model.efforts.map(lv => {
          const info = EFFORT_LABELS[lv];
          return `<button type="button" role="radio" data-action="effort" data-dir="${dir}" data-effort="${lv}" data-top="${isTopEffort(model, lv)}" data-suggested="${suggested === lv}" aria-checked="${!state.routing && state.effort === lv}" ${state.routing ? 'disabled' : ''} title="${info.line}">${info.full}</button>`;
        }).join('')}
      </div>
    </div>` : `<div class="pkC-card__label"><span>No effort levels for this model.</span></div>`}

    ${model.speeds.length > 1 ? `<div class="pkC-speed-row">
      <span>Speed</span>
      ${renderSpeedControl(model, dir)}
    </div>` : ''}
  </div>`;
}

function renderPickerC(dir = 'C') {
  const model = getModel();
  const note = showContinuationNote(dir);
  const { items, legacy } = filteredList(dir);
  const activeVisible = items.some(m => m.id === model.id) || (state.legacyOpen[dir] && legacy.some(m => m.id === model.id));
  const effWord = state.routing ? 'Auto' : (EFFORT_LABELS[state.effort]?.full || '');
  const fastBolt = model.speeds.length > 1 && state.speed !== 'standard' ? ' · ' + SPEED_META[state.speed].name : '';

  return `<div class="picker picker--C" role="dialog" aria-label="Model, effort and speed" ${state.open[dir] ? '' : 'hidden'}>
    <div class="pk-search">
      ${ICONS.search}
      <input type="text" data-search="${dir}" value="${state.query[dir]}" placeholder="Search models" aria-label="Search models">
      <button type="button" class="pk-close" data-action="close" data-dir="${dir}" aria-label="Close picker">${ICONS.x}</button>
    </div>

    <div class="pkC-providers" role="tablist" aria-label="Providers">
      ${PROVIDERS.map(p => `<button type="button" role="tab" data-action="tab" data-dir="${dir}" data-tab="${p.id}" aria-selected="${state.providerTab[dir] === p.id}" title="${p.name}" aria-label="${p.name}">
        ${p.id === 'favorites' ? ICONS.star(false, 14) : svgMark(p.id, 14)}
      </button>`).join('')}
    </div>

    ${!activeVisible ? `<div class="pkC-pinned">
      <span class="pkC-pinned__left">
        ${svgMark(model.providerId, 13)}
        <b>${model.name}</b>
        <span>${[effWord, fastBolt.replace(/^ · /, '')].filter(Boolean).join(' · ')}</span>
      </span>
      <button type="button" data-action="jump-active" data-dir="${dir}">Tune</button>
    </div>` : ''}

    <div class="pkC-list" role="listbox">${renderModelList(dir, { inlineActiveCard: true })}</div>
    ${note ? `<p class="pk-note">${note}</p>` : ''}
    ${renderToggles(dir, false)}
  </div>`;
}

/* ---------- Composer + Room Shell ---------- */
function renderComposer(dir) {
  const model = getModel();
  const hasEffort = model.efforts.length > 0;
  const effWord = hasEffort ? (EFFORT_LABELS[state.effort]?.full || 'Default') : '';
  const hasSpeed = model.speeds.length > 1;
  const isFast = hasSpeed && state.speed !== 'standard';
  const bolts = !hasSpeed ? '' : state.speed === 'standard'
    ? ICONS.bolt(false, 12, true)
    : state.speed === 'ultrafast'
      ? ICONS.bolt(true, 12) + ICONS.bolt(true, 12)
      : ICONS.bolt(true, 12);

  const showSuggest = state.suggestDraft && hasEffort && model.efforts.includes('xhigh') && state.effort !== 'xhigh' && !state.routing && !state.dynamic;
  const top = hasEffort && !state.routing && isTopEffort(model, state.effort);
  const pickerHtml = dir === 'A' ? renderPickerA(dir) : dir === 'B' ? renderPickerB(dir) : renderPickerC(dir);

  const draftText = state.suggestDraft
    ? 'Debug the regression across checkout hydration, refactor the lock path, and investigate why the retry stalled.'
    : '19. iOS journeys passed, mergeable.';

  return `<div class="composer-dock">
    <div class="composer" data-top-effort="${top}">
      <div class="composer__input ${state.suggestDraft ? 'composer__input--typed' : ''}">${draftText}</div>
      <div class="composer__footer">
        <button type="button" class="composer__attach" aria-label="Attach files or screenshots" title="Attach">${ICONS.plus}</button>

        <div class="composer__right">
          <button type="button" class="perm-chip" title="Permissions: Full access">
            ${ICONS.shield}<span>Full access</span>
          </button>

          <div class="combo-anchor">
            ${pickerHtml}
            <button type="button" class="combo-trigger" data-action="toggle-open" data-dir="${dir}" aria-haspopup="dialog" aria-expanded="${state.open[dir]}" title="Model, effort and speed">
              <span class="combo-trigger__model">
                ${svgMark(model.providerId, 14)}
                ${state.routing
                  ? `<span class="combo-trigger__name">Auto</span><span class="combo-trigger__suffix">· ${model.name}</span>`
                  : model.source
                    ? `<span class="combo-trigger__source">${model.source}</span><span class="combo-trigger__sep">/</span><span class="combo-trigger__name">${model.name}</span>`
                    : `<span class="combo-trigger__name">${model.name}</span>`}
                ${state.dynamic ? `<span class="combo-trigger__suffix">oversees</span>` : ''}
              </span>
              ${(hasEffort || hasSpeed) ? `<span class="combo-trigger__effort" data-top="${top}" data-routed="${state.routing}">
                ${hasEffort ? `<span>${effWord}</span>` : ''}
                ${hasSpeed ? `<span class="combo-trigger__bolts" data-fast="${isFast}">${bolts}</span>` : ''}
              </span>` : ''}
            </button>
          </div>

          ${showSuggest ? `<button type="button" class="suggest-chip" data-action="apply-suggest" title="XHigh effort may suit this draft">
            <span>→</span><span class="suggest-chip__pill">XHigh</span>
          </button>` : ''}

          <button type="button" class="send-disc ${state.suggestDraft ? 'send-disc--ready' : ''}" aria-label="Send">${ICONS.arrowUp}</button>
        </div>
      </div>
    </div>
  </div>`;
}

function renderRoom(dir, compactB = false) {
  return `<div class="room" data-compact-b="${compactB}">
    <div class="room-strip">
      <b>Sotto</b>
      <span>·</span>
      <span>${state.startedThread ? 'Started thread (Claude Code)' : 'New thread'}</span>
      ${state.handoverToast ? `<span style="color:var(--tt-accent-text);margin-left:8px;">${state.handoverToast}</span>` : ''}
      <span class="branch">feat/combined-model-effort-picker</span>
    </div>
    <div class="transcript">
      <div class="transcript__inner">
        <div class="t-msg t-msg--user">Check the iOS journeys PR and confirm whether all required checks are green.</div>
        <div class="t-msg">
          <div class="t-msg__who">${svgMark('claude', 12)} <span>Claude Code · Opus 5.5</span></div>
          <p>Checked <code>pull/2759</code>: iOS journeys and desktop gates are green. Ready to merge whenever you say the word.</p>
          <p style="color:var(--tt-text-muted);font-size:12.5px;">Click <b>${getModel().name}${getModel().efforts.length ? ' ' + EFFORT_LABELS[state.effort].full : ''}</b> in the composer below to open or close the combined picker.</p>
        </div>
      </div>
    </div>
    ${renderComposer(dir)}
  </div>`;
}

function render() {
  document.documentElement.dataset.theme = state.theme;
  document.documentElement.dataset.reducedMotion = state.reducedMotion ? 'on' : 'off';
  document.body.dataset.narrow = state.narrow ? 'on' : 'off';

  // Sync top controls
  document.querySelectorAll('[data-dir]').forEach(btn => {
    if (btn.closest('.proto-bar')) btn.setAttribute('aria-pressed', String(btn.dataset.dir === state.direction));
  });
  document.getElementById('btn-thread-state').textContent = state.startedThread ? 'Started thread' : 'New thread';
  document.getElementById('btn-thread-state').setAttribute('aria-pressed', String(state.startedThread));
  document.getElementById('btn-suggest').setAttribute('aria-pressed', String(state.suggestDraft));
  document.getElementById('btn-narrow').setAttribute('aria-pressed', String(state.narrow));
  document.getElementById('btn-narrow').disabled = state.direction === 'compare';
  document.getElementById('btn-theme').textContent = state.theme === 'light' ? 'Dark' : 'Light';
  document.getElementById('btn-theme').setAttribute('aria-pressed', String(state.theme === 'light'));
  document.getElementById('btn-motion').setAttribute('aria-pressed', String(state.reducedMotion));

  const d = DIRECTIONS[state.direction];
  document.getElementById('brief').innerHTML = `<div><strong>${d.name}</strong><span>${d.summary}</span></div><div class="brief-meta">${d.meta}</div>`;

  const stage = document.getElementById('stage');
  // Preserve focused search input cursor across renders
  const activeSearch = document.activeElement?.dataset?.search;
  const selStart = activeSearch ? document.activeElement.selectionStart : null;

  if (state.direction === 'compare') {
    stage.innerHTML = `<div class="stage-compare">
      ${['A', 'B', 'C'].map(code => `<section class="compare-col">
        <div class="compare-col__head">
          <div>
            <h2>${DIRECTIONS[code].name}</h2>
            <p>${code === 'A' ? 'Vertical stack · 358px wide' : code === 'B' ? 'Two-pane split · side-by-side' : 'Top provider strip · inline active card'}</p>
          </div>
          <button type="button" class="compare-col__pick" data-action="solo" data-dir="${code}">Focus ${code}</button>
        </div>
        ${renderRoom(code)}
      </section>`).join('')}
    </div>`;
  } else {
    stage.innerHTML = `<section class="stage-single">${renderRoom(state.direction)}</section>`;
  }

  if (activeSearch) {
    const input = stage.querySelector(`input[data-search="${activeSearch}"]`);
    if (input) {
      input.focus();
      if (selStart !== null) input.setSelectionRange(selStart, selStart);
    }
  }
}

/* ---------------- Event delegation ---------------- */
document.addEventListener('click', e => {
  const dirBtn = e.target.closest('.proto-bar [data-dir]');
  if (dirBtn) {
    state.direction = dirBtn.dataset.dir;
    if (state.direction !== 'compare') state.open[state.direction] = true;
    else state.open = { A: true, B: true, C: true };
    render();
    return;
  }

  if (e.target.id === 'btn-thread-state') { state.startedThread = !state.startedThread; state.handoverToast = null; render(); return; }
  if (e.target.id === 'btn-suggest') { state.suggestDraft = !state.suggestDraft; render(); return; }
  if (e.target.id === 'btn-narrow') { state.narrow = !state.narrow; render(); return; }
  if (e.target.id === 'btn-theme') { state.theme = state.theme === 'dark' ? 'light' : 'dark'; render(); return; }
  if (e.target.id === 'btn-motion') { state.reducedMotion = !state.reducedMotion; render(); return; }

  const act = e.target.closest('[data-action]');
  if (!act) {
    // Click outside open picker closes it in single mode
    if (state.direction !== 'compare' && !e.target.closest('.picker') && !e.target.closest('.combo-trigger') && e.target.closest('.room')) {
      if (state.open[state.direction]) { state.open[state.direction] = false; render(); }
    }
    return;
  }

  const { action, dir } = act.dataset;
  if (action === 'solo') { state.direction = dir; state.open[dir] = true; render(); return; }
  if (action === 'toggle-open') { state.open[dir] = !state.open[dir]; render(); return; }
  if (action === 'close') { state.open[dir] = false; render(); return; }
  if (action === 'tab') { state.providerTab[dir] = act.dataset.tab; render(); return; }
  if (action === 'btab') { state.compactBTab = act.dataset.btab; render(); return; }
  if (action === 'star') { toggleStar(act.dataset.model, e); return; }
  if (action === 'pick-model') { selectModel(act.dataset.model, dir); return; }
  if (action === 'effort') { selectEffort(act.dataset.effort); return; }
  if (action === 'speed') { selectSpeed(act.dataset.speed); return; }
  if (action === 'toggle-legacy') { state.legacyOpen[dir] = !state.legacyOpen[dir]; render(); return; }
  if (action === 'toggle-dynamic') { if (!state.routing) { state.dynamic = !state.dynamic; render(); } return; }
  if (action === 'toggle-routing') { if (!state.dynamic) { state.routing = !state.routing; render(); } return; }
  if (action === 'apply-suggest') { selectEffort('xhigh'); return; }
  if (action === 'jump-active') {
    const m = getModel();
    state.providerTab[dir] = state.favorites.has(m.id) ? 'favorites' : m.providerId;
    state.query[dir] = '';
    if (m.legacy) state.legacyOpen[dir] = true;
    render();
    return;
  }
});

document.addEventListener('input', e => {
  const dir = e.target?.dataset?.search;
  if (!dir) return;
  state.query[dir] = e.target.value;
  render();
});

document.addEventListener('pointerover', e => {
  const btn = e.target.closest('[data-hover-effort]');
  if (btn && state.hoverEffortA !== btn.dataset.hoverEffort) {
    state.hoverEffortA = btn.dataset.hoverEffort;
    const dock = btn.closest('.pkA-dock');
    const info = EFFORT_LABELS[state.hoverEffortA];
    if (dock && info && !state.routing) {
      const b = dock.querySelector('.pkA-dock__title b');
      const h = dock.querySelector('.pkA-dock__hint');
      if (b) { b.textContent = info.full; b.dataset.top = String(isTopEffort(getModel(), state.hoverEffortA)); }
      if (h) h.textContent = info.line;
    }
  }
});
document.addEventListener('pointerout', e => {
  const bar = e.target.closest('.pkA-effort-bar');
  if (bar && !bar.contains(e.relatedTarget) && state.hoverEffortA !== null) {
    state.hoverEffortA = null;
    const dock = bar.closest('.pkA-dock');
    const info = EFFORT_LABELS[state.effort];
    if (dock && info && !state.routing) {
      const b = dock.querySelector('.pkA-dock__title b');
      const h = dock.querySelector('.pkA-dock__hint');
      if (b) { b.textContent = info.full; b.dataset.top = String(isTopEffort(getModel(), state.effort)); }
      if (h) h.textContent = info.line;
    }
  }
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') {
    if (e.key === 'Escape') {
      const dir = e.target.dataset.search;
      if (state.query[dir]) { state.query[dir] = ''; render(); }
      else { state.open[dir] = false; render(); }
    }
    return;
  }
  if (e.key === 'Escape' && state.direction !== 'compare' && state.open[state.direction]) {
    state.open[state.direction] = false;
    render();
    return;
  }
  if (e.key === '1') { state.direction = 'A'; state.open.A = true; render(); }
  else if (e.key === '2') { state.direction = 'B'; state.open.B = true; render(); }
  else if (e.key === '3') { state.direction = 'C'; state.open.C = true; render(); }
  else if (e.key === '4') { state.direction = 'compare'; state.open = { A: true, B: true, C: true }; render(); }
});

render();
</script>
</body>
</html>
