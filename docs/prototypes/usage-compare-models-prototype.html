<title>Usage: bars or lines, and models on one chart (prototype)</title>
<!--
  Throwaway prototype. Two questions for Usage's per-day chart:
    1. Switch the chart between bars and lines.
    2. Compare models on the same chart, one line per model, choosing which are drawn.

  Variants (?variant=A|B|C, the pill at the bottom, or Left/Right when focus is not in a field, a tab list or the chart):
    A  Chart controls on the stage. Prompts and Tokens get Bars | Lines and a By model toggle. By model draws one
       series per model and puts toggle chips under the chart (top 5 by prompts on); the chips are the legend.
    B  Compare lives in Models. Overview only gains Bars | Lines. The Models tab gets a lines chart above the table,
       a checkbox on each row (top 3 checked) and a Prompts | Tokens switch.
    C  Split the chart. One Show control (Total / By provider / By model) plus Bars | Lines. By model is the top 5
       and Other. Pointing at a day reads every series in the line above the chart.

  Bars with several models are stacked, not grouped: 5 models x 30 days grouped is 150 bars of 2px each at the
  820x560 minimum, which nobody can read; a stack keeps each day's height honest and still shows who filled it.
  Lines are never stacked: a stacked line reads as a total, which hides the model you are trying to follow.

  Series colours are an 8-slot categorical palette validated for both modes (lightness band, chroma, adjacent
  colour-blind separation, 3:1 on the canvas). Sotto has no categorical role yet, so shipping this needs tokens.
  A model keeps its colour while it is drawn; a filter never repaints the survivors.

  Only Overview's Prompts and Tokens stages and the Models tab are built. Date range works (30 or 7 days) so the
  "a model with no activity in the range is not offered" rule can be seen: gpt-6-astra stops 10 days ago and
  gpt-6-mini has none in 30 days.
-->

  .usage-table__total .usage-row__bar { display: none; }
  .usage-detail { padding-left: 14px; }
}

/* Provider marks: the real page draws each provider's logo; here a lettered tile in the provider's colour. */
.pmark { display: inline-grid; flex: none; place-items: center; width: 15px; height: 15px; border-radius: 4px; background: var(--pc); color: var(--tt-provider-ink); font-size: 9.5px; font-weight: 700; line-height: 1; }
.pmark--18 { width: 18px; height: 18px; border-radius: 5px; font-size: 11px; }
.pmark[data-p='codex'] { --pc: var(--tt-provider-codex); }
.pmark[data-p='claude'] { --pc: var(--tt-provider-claude); }
.pmark[data-p='grok'] { --pc: var(--tt-provider-grok); }
.pmark[data-p='opencode'] { --pc: var(--tt-provider-opencode); }
.window[data-theme='light'] .pmark[data-p='opencode'] { color: var(--tt-canvas); }
.pmark[data-p='muse'] { --pc: var(--tt-provider-muse); }

/* ---------- New in this prototype ---------- */
.usage-per { margin-top: 30px; }
.usage-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.usage-tools__label { color: var(--tt-text-muted); font-size: 12.5px; }
/* A: the By model toggle. */
.usage-toggle { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px 0 9px; border: 1px solid var(--tt-field-border); border-radius: 8px; background: transparent; color: var(--tt-text-2); font-size: 12.5px; white-space: nowrap; cursor: pointer; }
.usage-toggle:hover { background: var(--usage-hover-soft); color: var(--tt-text); }
.usage-toggle[aria-pressed='true'] { border-color: var(--tt-accent-border); background: var(--tt-hover); color: var(--tt-text); }
.usage-toggle__box { display: grid; place-items: center; width: 13px; height: 13px; border: 1.5px solid var(--tt-text-faint); border-radius: 3px; }
.usage-toggle[aria-pressed='true'] .usage-toggle__box { border-color: var(--tt-accent); background: var(--tt-accent); }
.usage-toggle[aria-pressed='true'] .usage-toggle__box::after { content: ''; width: 6px; height: 3px; margin-top: -2px; border-left: 1.5px solid var(--tt-canvas); border-bottom: 1.5px solid var(--tt-canvas); transform: rotate(-45deg); }
/* A: model chips under the chart. A grid, so values changing as you point never move a chip. */
.usage-chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 6px; margin: 16px 0 0; padding: 0; list-style: none; }
.usage-chip { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 10px 0 9px; border: 1px solid var(--tt-hairline); border-radius: 8px; background: transparent; color: var(--tt-text-muted); font-size: 12.5px; text-align: left; cursor: pointer; }
.usage-chip:hover { background: var(--usage-hover-soft); color: var(--tt-text); }
.usage-chip > i { flex: none; width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--tt-text-faint); }
.usage-chip > span { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.usage-chip > b { font-weight: 550; font-variant-numeric: tabular-nums; }
.usage-chip[aria-pressed='true'] { border-color: var(--tt-border); background: var(--usage-seg); color: var(--tt-text); }
.usage-chip[aria-pressed='true'] > i { background: var(--c); box-shadow: none; }
.usage-chips-foot { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-top: 10px; color: var(--tt-text-muted); font-size: 12.5px; }
/* B and C: the read-out above the chart. A grid too, for the same reason. */
.usage-readout { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 6px 18px; margin: 12px 0 0; padding: 0; list-style: none; color: var(--tt-text-muted); font-size: 12.5px; }
.usage-readout li { display: flex; align-items: center; gap: 7px; min-width: 0; }
.usage-readout i { flex: none; width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.usage-readout[data-kind='lines'] i { width: 12px; height: 3px; border-radius: 2px; }
.usage-readout span { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.usage-readout b { color: var(--tt-text); font-weight: 550; font-variant-numeric: tabular-nums; }
.usage-readout + .usage-chart .usage-chart__plot { margin-top: 18px; }
.usage-chart__fill { position: absolute; inset: 0; }
.usage-chart__fill svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
/* B: the compare block on Models, and a checkbox before each row. */
.usage-compare { margin-top: 30px; }
.usage-table--check .usage-row, .usage-table--check .usage-table__head, .usage-table--check .usage-table__foot { display: grid; grid-template-columns: 34px minmax(0, 1fr); align-items: start; }
.usage-table__head > span:first-child { padding-left: 14px; color: var(--tt-text-faint); font-size: 12px; }
.usage-table--check .usage-detail { grid-column: 2; }
.usage-check { display: grid; place-items: center; height: 62px; padding-left: 14px; }
.usage-check input { appearance: none; display: grid; place-items: center; width: 16px; height: 16px; margin: 0; border: 1.5px solid var(--tt-field-border); border-radius: 4px; background: transparent; cursor: pointer; }
.usage-check input:checked { border-color: var(--c); background: var(--c); }
.usage-check input:checked::after { content: ''; width: 8px; height: 4px; margin-top: -2px; border-left: 2px solid var(--tt-canvas); border-bottom: 2px solid var(--tt-canvas); transform: rotate(-45deg); }
.usage-check input:focus-visible { outline: 2px solid var(--tt-focus-ring); outline-offset: 2px; }
@container usage (max-width: 640px) { .usage-check { height: auto; padding-top: 14px; } }

/* ---------- Prototype chrome: deliberately loud so nobody mistakes it for the design ---------- */
.proto { font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; color: #111; }
.proto-pill { position: fixed; z-index: 100; bottom: 16px; left: 50%; display: flex; align-items: center; gap: 4px; padding: 4px; border: 2px dashed #111; border-radius: 999px; background: #ffd84d; transform: translateX(-50%); box-shadow: 0 6px 18px rgb(0 0 0 / 35%); }
.proto-pill button { width: 30px; height: 30px; border: 0; border-radius: 50%; background: #111; color: #ffd84d; font: 700 15px/1 ui-monospace, monospace; cursor: pointer; }
.proto-pill span { min-width: 280px; padding: 0 10px; font-weight: 700; text-align: center; white-space: nowrap; }
.proto-debug { position: fixed; z-index: 100; top: 44px; right: 12px; width: 280px; max-height: calc(100vh - 120px); overflow: auto; border: 2px dashed #111; border-radius: 10px; background: #ffd84d; box-shadow: 0 6px 18px rgb(0 0 0 / 35%); }
.proto-debug summary { padding: 7px 10px; font-weight: 700; cursor: pointer; }
.proto-debug > div { padding: 0 10px 10px; }
.proto-debug dl { display: grid; grid-template-columns: 92px 1fr; gap: 3px 8px; margin: 0 0 8px; }
.proto-debug dt { opacity: .7; }
.proto-debug dd { margin: 0; overflow-wrap: anywhere; }
.proto-debug .row { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 8px; }
.proto-debug .row button { padding: 3px 7px; border: 1.5px solid #111; border-radius: 6px; background: transparent; font: inherit; cursor: pointer; }
.proto-debug .row button[aria-pressed='true'] { background: #111; color: #ffd84d; }
.proto-debug label { display: flex; align-items: center; gap: 6px; }
.proto :focus-visible { outline: 2px solid #111; outline-offset: 2px; }
</style>
</head>
<body>
<div class="window" id="win"></div>
<p class="tt-visually-hidden" aria-live="polite" id="live"></p>
<details class="proto proto-debug" id="debug"><summary>Prototype state</summary><div id="debug-body"></div></details>
<div class="proto proto-pill" role="group" aria-label="Prototype variant">
  <button type="button" id="prev" aria-label="Previous variant">&lsaquo;</button>
  <span id="pill-name"></span>
  <button type="button" id="next" aria-label="Next variant">&rsaquo;</button>
</div>
<script>
'use strict'
// ---------- Sample data: 30 days to Wednesday, October 21, 2026 ----------
const VARIANTS = ['A', 'B', 'C']
const VARIANT_NAMES = { A: 'Chart controls on the stage', B: 'Compare lives in Models', C: 'Split the chart' }
const TODAY = '2026-10-21'
const addDays = (iso, n) => new Date(Date.parse(`${iso}T00:00:00Z`) + n * 864e5).toISOString().slice(0, 10)
const ALL_DAYS = Array.from({ length: 30 }, (_, i) => addDays(TODAY, i - 29))
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
const weekday = iso => new Date(`${iso}T00:00:00Z`).getUTCDay()
const shortDay = iso => `${MONTHS[Number(iso.slice(5, 7)) - 1]} ${Number(iso.slice(8, 10))}`
const longDay = iso => iso === TODAY ? 'Today' : `${WEEKDAYS[weekday(iso)]}, ${shortDay(iso)}`
const PROVIDERS = { claude: ['Claude Code', 'C'], codex: ['Codex', 'X'], opencode: ['OpenCode', 'O'], grok: ['Grok Build', 'G'], muse: ['Muse', 'M'] }
// Provider series take colours near their own: Claude orange, Codex blue, OpenCode amber, Muse magenta, Grok violet.
const PROVIDER_SLOT = { claude: 1, codex: 2, opencode: 3, muse: 4, grok: 6 }

function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
const rand = mulberry(20261021)
const ZERO_DAYS = new Set([5, 19]) // two Sundays with nothing at all
// id, provider, prompts on a weekday, tokens per prompt, first day, day it stops, chance of a quiet day
const SPEC = [
  ['claude-opus-5-5', 'claude', 44, 210e3, 0, 30, 0],
  ['gpt-6.1-sol', 'codex', 28, 150e3, 0, 30, 0.04],
  ['claude-sonnet-5-5', 'claude', 19, 110e3, 0, 30, 0.06],
  ['opencode/kimi-k3', 'opencode', 18, 70e3, 11, 30, 0.05],
  ['gpt-6-astra', 'codex', 15, 120e3, 0, 20, 0.1],
  ['grok-code-2', 'grok', 8, 90e3, 0, 30, 0.35],
  ['muse-1', 'muse', 6, 60e3, 0, 30, 0.5],
  ['anthropic/claude-sonnet-5-5', 'opencode', 5, 100e3, 15, 30, 0.3],
  ['claude-haiku-5-5', 'claude', 3, 40e3, 0, 30, 0.45],
  ['gpt-6-mini', 'codex', 0, 0, 0, 0, 1],
]
const MODELS = SPEC.map(([id, provider, base, perPrompt, start, end, quiet]) => {
  const prompts = [], input = [], output = []
  ALL_DAYS.forEach((day, i) => {
    let p = 0
    if (base > 0 && i >= start && i < end && !ZERO_DAYS.has(i)) {
      const week = weekday(day) === 0 || weekday(day) === 6 ? 0.3 : 1
      const ramp = start > 0 ? Math.min(1, (i - start + 1) / 6) : 1
      p = Math.round(base * week * ramp * (i === 29 ? 0.45 : 1) * (0.55 + rand() * 0.9))
      if (rand() < quiet) p = 0
    }
    const inp = p > 0 ? Math.round(p * perPrompt * (0.7 + rand() * 0.6)) : 0
    prompts.push(p); input.push(inp); output.push(Math.round(inp * (0.025 + rand() * 0.02)))
  })
  return { id, provider, prompts, input, output }
})
const MODEL = Object.fromEntries(MODELS.map(m => [m.id, m]))
const sum = list => list.reduce((a, b) => a + b, 0)
// A model's preferred colour: its rank by prompts over the whole 30 days. The top 8 have one.
const PREF = Object.fromEntries([...MODELS].sort((a, b) => sum(b.prompts) - sum(a.prompts)).slice(0, 8).map((m, i) => [m.id, i]))

// ---------- Formatting ----------
const fmtInt = n => Math.round(n).toLocaleString('en-US')
const fmtTok = n => {
  const one = (v, s) => `${(v >= 100 ? Math.round(v) : Math.round(v * 10) / 10).toString()}${s}`
  return n >= 1e9 ? one(n / 1e9, 'B') : n >= 1e6 ? one(n / 1e6, 'M') : n >= 1e3 ? one(n / 1e3, 'K') : fmtInt(n)
}
const fmt = (metric, n) => metric === 'prompts' ? fmtInt(n) : fmtTok(n)
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
function niceMax(value) { const power = 10 ** Math.floor(Math.log10(value)); for (const step of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (step * power >= value) return step * power; return 10 * power }

// ---------- State ----------
const params = new URLSearchParams(location.search)
const S = {
  variant: VARIANTS.includes(params.get('variant')) ? params.get('variant') : 'A',
  theme: params.get('theme') === 'light' ? 'light' : 'dark', size: 'fit', reduced: false,
  tab: 'overview', focus: 'prompts', range: 30, kind: 'bars',
  aOn: false, a: null, b: null, bMetric: 'prompts', cShow: 'total', sort: 'prompts', opened: null,
  hover: null, pin: null, menu: false, note: null,
}
const start = () => 30 - S.range
const days = () => ALL_DAYS.slice(start())
const vals = (m, metric) => (metric === 'prompts' ? m.prompts : m.input.map((v, i) => v + m.output[i])).slice(start())
const offered = () => MODELS.filter(m => sum(vals(m, 'prompts')) + sum(vals(m, 'tokens')) > 0)
const notOffered = () => MODELS.filter(m => sum(vals(m, 'prompts')) + sum(vals(m, 'tokens')) === 0)
const ranked = metric => offered().sort((a, b) => sum(vals(b, metric)) - sum(vals(a, metric)) || a.id.localeCompare(b.id))
const totalsBy = metric => days().map((_, i) => sum(MODELS.map(m => vals(m, metric)[i])))
const rangeLabel = () => `Last ${S.range} days`
const MAX_LINES = 8

// A pool of drawn models. A model keeps its colour while it is drawn: it takes its preferred slot if free, else the lowest free one.
function poolOn(pool, id) {
  if (pool.sel.includes(id)) return true
  if (pool.sel.length >= MAX_LINES) return false
  const used = new Set(pool.sel.map(x => pool.col[x]))
  let slot = PREF[id]
  if (slot === undefined || used.has(slot)) slot = [0, 1, 2, 3, 4, 5, 6, 7].find(s => !used.has(s))
  pool.sel.push(id); pool.col[id] = slot; return true
}
function poolOff(pool, id) { pool.sel = pool.sel.filter(x => x !== id); delete pool.col[id] }
function makePool(n) { const pool = { sel: [], col: {} }; ranked('prompts').slice(0, n).forEach(m => poolOn(pool, m.id)); return pool }
function prune(pool) { const ok = new Set(offered().map(m => m.id)); [...pool.sel].filter(id => !ok.has(id)).forEach(id => poolOff(pool, id)) }
const isDefault = (pool, n) => { const top = ranked('prompts').slice(0, n).map(m => m.id); return pool.sel.length === top.length && top.every(id => pool.sel.includes(id)) }
S.a = makePool(5); S.b = makePool(3)
const slotVar = s => `var(--usage-s${s + 1})`

// ---------- What a chart draws ----------
function chartCfg(ctx) {
  const metric = ctx === 'models' ? S.bMetric : ctx
  const kind = ctx === 'models' ? 'lines' : S.kind
  const byTotal = (a, b) => sum(b.values) - sum(a.values)
  const fromPool = pool => pool.sel.map(id => ({ key: id, name: id, color: slotVar(pool.col[id]), values: vals(MODEL[id], metric) })).sort(byTotal)
  let series, stacked = false, empty = null, split = 'total'
  if (ctx === 'models') { series = fromPool(S.b); split = 'model'; if (series.length === 0) empty = 'Check a model in the table to draw it.' }
  else if (S.variant === 'A' && S.aOn) { series = fromPool(S.a); split = 'model'; stacked = kind === 'bars'; if (series.length === 0) empty = 'Turn on a model below to draw it.' }
  else if (S.variant === 'C' && S.cShow === 'model') {
    const list = ranked(metric).filter(m => sum(vals(m, metric)) > 0)
    const top = list.slice(0, 5), rest = list.slice(5), used = new Set()
    series = top.map(m => {
      let slot = PREF[m.id]; if (slot === undefined || used.has(slot)) slot = [0, 1, 2, 3, 4, 5, 6, 7].find(s => !used.has(s) && !top.some(t => PREF[t.id] === s))
      used.add(slot); return { key: m.id, name: m.id, color: slotVar(slot), values: vals(m, metric) }
    })
    if (rest.length > 0) series.push({ key: 'other', name: `Other (${rest.length})`, title: rest.map(m => m.id).join(', '), color: 'var(--usage-other)', values: days().map((_, i) => sum(rest.map(m => vals(m, metric)[i]))) })
    split = 'model'; stacked = kind === 'bars'
  } else if (S.variant === 'C' && S.cShow === 'provider') {
    series = Object.keys(PROVIDERS).map(p => ({ key: p, name: PROVIDERS[p][0], color: slotVar(PROVIDER_SLOT[p]),
      values: days().map((_, i) => sum(MODELS.filter(m => m.provider === p).map(m => vals(m, metric)[i]))) })).filter(s => sum(s.values) > 0).sort(byTotal)
    split = 'provider'; stacked = kind === 'bars'
  } else if (metric === 'prompts') series = [{ key: 'total', name: 'Prompts', color: 'var(--usage-strong)', values: totalsBy('prompts') }]
  else if (kind === 'bars') {
    const sl = arr => arr.slice(start())
    const input = ALL_DAYS.map((_, i) => sum(MODELS.map(m => m.input[i]))), output = ALL_DAYS.map((_, i) => sum(MODELS.map(m => m.output[i])))
    series = [{ key: 'input', name: 'Input', color: 'var(--usage-mid)', values: sl(input) }, { key: 'output', name: 'Output', color: 'var(--usage-ink)', values: sl(output) }]
    stacked = true
  } else series = [{ key: 'total', name: 'Input and output', color: 'var(--usage-strong)', values: totalsBy('tokens') }]
  return { ctx, metric, kind, series, stacked, empty, split, days: days() }
}
const selected = () => S.hover ?? S.pin

// ---------- Region painters: re-run on every hover without rebuilding the page ----------
const REGION = {
  plot(el, ctx) {
    const cfg = chartCfg(ctx)
    const W = el.clientWidth, H = el.clientHeight
    if (W === 0) return ''
    if (cfg.empty) return `<div class="usage-chart__none">${cfg.empty}</div>`
    const n = cfg.days.length, col = W / n
    const perDay = cfg.days.map((_, i) => cfg.stacked ? sum(cfg.series.map(s => s.values[i])) : Math.max(0, ...cfg.series.map(s => s.values[i])))
    const peak = Math.max(0, ...perDay)
    if (peak === 0) return `<div class="usage-chart__none">No ${cfg.metric === 'prompts' ? 'prompts' : 'token counts'} in this range</div>`
    const top = niceMax(Math.max(cfg.metric === 'prompts' ? 10 : 1e5, peak))
    const y = v => H - v / top * H
    const sel = selected()
    let svg = ''
    if (cfg.kind === 'bars') {
      const gap = n <= 7 ? 18 : n <= 45 ? 4 : 2, bw = Math.min(52, col - gap), r = n > 20 ? 3 : 5
      cfg.days.forEach((_, i) => {
        const x = i * col + (col - bw) / 2
        const parts = cfg.series.map(s => ({ s, v: s.values[i] })).filter(p => p.v > 0)
        let base = H
        const dim = sel !== null && sel !== i ? ' opacity=".28"' : ''
        parts.forEach((p, j) => {
          let h = Math.max(1, p.v / top * H)
          const gapPx = j > 0 ? 1 : 0 // a 1px canvas gap between stacked pieces
          const yTop = base - h, hh = h - gapPx
          if (hh > 0) {
            if (j === parts.length - 1) { const rr = Math.min(r, hh, bw / 2); svg += `<path d="M${x},${base - gapPx} V${yTop + rr} Q${x},${yTop} ${x + rr},${yTop} H${x + bw - rr} Q${x + bw},${yTop} ${x + bw},${yTop + rr} V${base - gapPx} Z" style="fill:${p.s.color}"${dim}/>` }
            else svg += `<rect x="${x}" y="${yTop}" width="${bw}" height="${hh}" style="fill:${p.s.color}"${dim}/>`
          }
          base = yTop
        })
      })
    } else {
      const single = cfg.series.length === 1
      // Smaller series last, so they sit on top of the big ones.
      cfg.series.forEach(s => {
        const pts = s.values.map((v, i) => [(i + 0.5) * col, Math.min(H - 1, y(v))])
        const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')
        if (single) svg += `<path d="${d} L${pts.at(-1)[0]},${H} L${pts[0][0]},${H} Z" style="fill:${s.color}" opacity=".12"/>`
        svg += `<path d="${d}" fill="none" style="stroke:${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`
        if (n <= 7 && sel === null) pts.forEach(p => { svg += `<circle cx="${p[0]}" cy="${p[1]}" r="3" style="fill:${s.color};stroke:var(--tt-canvas)" stroke-width="1.5"/>` })
      })
      if (sel !== null) {
        const x = (sel + 0.5) * col
        svg = `<line x1="${x}" x2="${x}" y1="0" y2="${H}" style="stroke:var(--tt-text-faint)" stroke-width="1" stroke-dasharray="2 3"/>` + svg
        cfg.series.forEach(s => { svg += `<circle cx="${x}" cy="${Math.min(H - 1, y(s.values[sel]))}" r="4" style="fill:${s.color};stroke:var(--tt-canvas)" stroke-width="2"/>` })
      }
    }
    return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false">${svg}</svg>
      <div class="usage-chart__grid" style="top:0"><span>${fmt(cfg.metric, top)}</span></div>
      <div class="usage-chart__grid" style="top:50%"><span>${fmt(cfg.metric, top / 2)}</span></div>`
  },
  when(_, ctx) {
    const cfg = chartCfg(ctx), sel = selected(), d = cfg.days
    const prompts = totalsBy('prompts'), tokens = totalsBy('tokens')
    if (ctx === 'models') {
      const total = sel === null ? 0 : sum(cfg.series.map(s => s.values[sel]))
      if (cfg.series.length === 0) return ''
      return sel === null ? `${cfg.metric === 'prompts' ? 'Prompts' : 'Tokens'} per day for the checked models, ${rangeLabel().toLowerCase()}.`
        : `<b>${longDay(d[sel])}</b> · ${fmt(cfg.metric, total)} ${cfg.metric === 'prompts' ? (total === 1 ? 'prompt' : 'prompts') : 'tokens'} across the checked models`
    }
    if (ctx === 'prompts') {
      if (sel !== null) return `<b>${longDay(d[sel])}</b> · ${fmtInt(prompts[sel])} prompt${prompts[sel] === 1 ? '' : 's'}${cfg.split !== 'total' ? ' in all' : ''}`
      const all = sum(prompts), peakAt = prompts.indexOf(Math.max(...prompts))
      return `About <b>${fmtInt(all / d.length)}</b> a day · most on ${shortDay(d[peakAt])}, <b>${fmtInt(prompts[peakAt])}</b>`
    }
    if (sel !== null) {
      if (tokens[sel] === 0) return `<b>${longDay(d[sel])}</b> · no tokens`

  readout(_, ctx) {

        title="${esc(m.id)} · ${esc(PROVIDERS[m.provider][0])}" style="--c:${on ? slotVar(S.a.col[m.id]) : 'transparent'}"><i></i><span>${esc(m.id)}</span><b>${fmt(metric, sel === null ? sum(v) : v[sel])}</b></button></li>`
    }).join('')

const FOCUS = ['room', 'prompts', 'tokens', 'where', 'cache', 'models', 'rhythm']

function act(name, el) {
  const v = el.dataset.v, id = el.dataset.id
  S.note = null

    case 'focus': S.focus = v; resetDay(); break
    case 'kind': S.kind = v; break
    case 'cShow': S.cShow = v; break
    case 'bMetric': S.bMetric = v; break
    case 'sort': S.sort = v; break
    case 'aOn': S.aOn = !S.aOn; break
    case 'aReset': S.a = makePool(5); focusNext = 'aOn'; break
    case 'chip': if (S.a.sel.includes(id)) poolOff(S.a, id); else if (!poolOn(S.a, id)) S.note = `Up to ${MAX_LINES} models at once. Turn one off first.`; break
    case 'row': S.opened = S.opened === id ? null : id; break
    case 'menu': S.menu = !S.menu; if (S.menu) { renderAll(); document.querySelector('#pop [aria-checked="true"]')?.focus(); return } break
    case 'range': S.range = Number(v); S.menu = false; prune(S.a); prune(S.b); resetDay(); focusNext = 'menu'; break
    default: return
  }
  renderAll()
}
win.addEventListener('click', e => {
  const el = e.target.closest('[data-act]')
  if (el && el.dataset.act !== 'check') { act(el.dataset.act, el); return }
  const plot = e.target.closest('[data-plot]')
  if (plot) { S.pin = S.hover === null || S.pin === S.hover ? null : S.hover; S.hover = null; paint(); return }
  if (S.menu && !e.target.closest('#pop')) { S.menu = false; renderAll() }
})
win.addEventListener('change', e => {
  const el = e.target
  if (el.dataset.act !== 'check') return
  S.note = null
  if (el.checked) { if (!poolOn(S.b, el.dataset.id)) S.note = `Up to ${MAX_LINES} models at once. Uncheck one first.` } else poolOff(S.b, el.dataset.id)
  renderAll()
})
win.addEventListener('pointermove', e => {
  const plot = e.target.closest?.('[data-plot]')
  if (!plot) return
  const r = plot.getBoundingClientRect(), n = days().length
  const index = Math.max(0, Math.min(n - 1, Math.floor((e.clientX - r.left) / r.width * n)))
  if (index !== S.hover) { S.hover = index; paint() }
})
win.addEventListener('pointerout', e => {
  const plot = e.target.closest?.('[data-plot]')
  if (plot && !plot.contains(e.relatedTarget) && S.hover !== null) { S.hover = null; paint() }
})

function chartKey(e, ctx) {
  const n = days().length, last = n - 1
  let current = S.pin ?? S.hover
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') current = current === null ? last : Math.max(0, Math.min(last, current + (e.key === 'ArrowRight' ? 1 : -1)))
  else if (e.key === 'Home') current = 0
  else if (e.key === 'End') current = last
  else if (e.key === 'Escape' && S.pin !== null) current = null
  else return false
  e.preventDefault(); e.stopPropagation(); S.hover = null; S.pin = current; paint()
  const cfg = chartCfg(ctx)
  if (current === null) { announce('Whole range'); return true }
  const unit = cfg.metric === 'prompts' ? 'prompts' : 'tokens'
  const all = (cfg.metric === 'prompts' ? totalsBy('prompts') : totalsBy('tokens'))[current]
  const parts = cfg.split === 'total' ? '' : `. ${cfg.series.map(s => `${s.name} ${fmt(cfg.metric, s.values[current])}`).join(', ')}`
  announce(`${longDay(days()[current])}: ${fmt(cfg.metric, ctx === 'models' ? sum(cfg.series.map(s => s.values[current])) : all)} ${unit}${parts}`)
  return true
}
function roving(e, list) {
  const items = [...list.querySelectorAll('[role="tab"],[role="radio"]')], i = items.indexOf(e.target)
  if (i < 0) return false
  const t = e.key === 'Home' ? 0 : e.key === 'End' ? items.length - 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? Math.max(0, i - 1) : e.key === 'ArrowRight' || e.key === 'ArrowDown' ? Math.min(items.length - 1, i + 1) : null
  if (t === null) return false
  e.preventDefault(); focusNext = items[t].dataset.k; act(items[t].dataset.act, items[t]); return true
}
document.addEventListener('keydown', e => {
  const t = e.target
  if (S.menu && t.closest?.('#pop, [data-act="menu"]')) {
    const items = [...document.querySelectorAll('#pop [role="menuitemradio"]')], i = items.indexOf(t)
    if (e.key === 'Escape' || e.key === 'Tab') { if (e.key === 'Escape') e.preventDefault(); S.menu = false; focusNext = 'menu'; renderAll(); return }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : items.length - 1) + (i < 0 ? 1 : 0)) % items.length]?.focus(); return }
    if (i >= 0 && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); act('range', t); return }
  }
  const plot = t.closest?.('[data-plot]')
  if (plot && chartKey(e, plot.dataset.plot)) return
  const list = t.closest?.('[role="tablist"], [role="radiogroup"]')
  if (list && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(e.key) && roving(e, list)) return
  if (e.key === 'Escape' && t.closest?.('#debug')) { const d = document.getElementById('debug'); d.open = false; d.querySelector('summary').focus(); return }
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !e.defaultPrevented && !/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName) && !t.isContentEditable && !e.altKey && !e.ctrlKey && !e.metaKey) {
    e.preventDefault(); cycle(e.key === 'ArrowRight' ? 1 : -1)
  }
})
function cycle(step) {
  S.variant = VARIANTS[(VARIANTS.indexOf(S.variant) + step + VARIANTS.length) % VARIANTS.length]
  S.note = null; resetDay(); renderAll()
}
document.getElementById('prev').addEventListener('click', () => cycle(-1))
document.getElementById('next').addEventListener('click', () => cycle(1))
document.getElementById('debug-body').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return
  if (b.dataset.theme) S.theme = b.dataset.theme
  if (b.dataset.size) S.size = b.dataset.size
  renderAll()
})
document.getElementById('debug-body').addEventListener('change', e => { if (e.target.id === 'reduced') { S.reduced = e.target.checked; renderAll() } })
let frame = 0
new ResizeObserver(() => { cancelAnimationFrame(frame); frame = requestAnimationFrame(() => paint()) }).observe(win)
// Open where there is room beside the chart; collapsed on a narrow window, where it would cover the plot.
document.getElementById('debug').open = false
renderAll()
</script>
</body>
</html>
