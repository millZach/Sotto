<!doctype html>
<!--
  PROTOTYPE - throwaway. Not the app. Owl feature (ADR-0072): off in stable.

  Question: how should a 3D model that a thread asks Meshy to make look in Sotto? Decided already (October 22, 2026):
  Sotto holds a Meshy key; threads get a tool to make models from words or a photo; models show inline in the thread,
  on a Models page of their own, in a Models surface in the Tools panel, and in the iPhone app; Settings gets a Meshy
  key field with cost wording.

  Surfaces and variants (state lives in the URL):
    ?surface=inline&variant=chip|card|split   the model card under the agent's message
         &state=ask|shape|texture|done|failed  (ask: the thread asks before spending; shape and texture: Meshy's two steps)
    ?surface=gallery&variant=grid|threads|viewer   the Models page, every model across threads
    ?surface=tools                                  Tools > Models for one thread
    ?surface=iphone                                 the iPhone app showing a model in a thread, and opened
    ?surface=settings&state=empty|saved             Settings > Meshy
  Also ?theme=light and ?motion=reduced.
  Left and right arrow keys cycle surface and variant (ignored while an input, a model viewer or the filmstrip has
  focus). H hides the switcher.

  The models are drawn by a small canvas-2D renderer below: no network, no CDN, no font download (Figtree if it is
  installed, the system face if not). Colours come only from the custom properties defined once at the top: --tt-*
  for the theme roles (Sotto's own palette, src/shared/themes/palettes.ts), --model-* for the models' own surface
  colours (content, like a photo, and the same in light and dark) and --proto-* for the switcher, which is not part of
  the design. No persistence, no host calls.
-->

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sotto Meshy models - prototype</title>

[data-theme=light]{

:root{
  /* The models' own surface colours: what Meshy's texture would paint, the same in light and dark. */
  --model-wood:#8a5a32;--model-wood-dark:#5e3b1f;--model-iron:#4a4c52;--model-gold:#c99a2e;
  --model-fox:#d9772b;--model-fox-light:#f1e4d0;--model-fox-dark:#3b2a22;
  --model-steel:#a9afb8;--model-steel-dark:#6f7680;--model-plume:#a8322d;
  --model-glass:#6a4fb3;--model-cork:#a7825a;--model-clay:#b9b4ab;
  /* The prototype switcher, not part of the design. */
  --proto-bg:#111114;--proto-text:#ffffff;--proto-btn:#2a2a2e;--proto-on:#ff3d7f;--proto-line:#44444a;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--tt-canvas);color:var(--tt-text);font:14px/1.45 Figtree,system-ui,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;border-radius:8px;padding:0}
:focus-visible{outline:2px solid var(--tt-focus-ring);outline-offset:1px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:'Spline Sans Mono',ui-monospace,Consolas,monospace;font-size:12.5px}
.muted{color:var(--tt-text-muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.drag{-webkit-app-region:drag}
.drag button,.drag input,.drag select{-webkit-app-region:no-drag}

/* ---------- window ---------- */
.win{position:fixed;inset:0;display:flex;min-width:0;background:var(--tt-canvas)}
.ib{width:30px;height:30px;display:inline-grid;place-items:center;color:var(--tt-text-muted)}
.ib:hover{background:var(--tt-hover);color:var(--tt-text)}
.ib[aria-pressed=true],.ib.on{background:var(--tt-accent-surface);color:var(--tt-text)}
.btn{height:30px;padding:0 12px;border:1px solid var(--tt-border);border-radius:999px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--tt-text)}
.btn:hover{background:var(--tt-hover)}
.btn.primary{background:var(--tt-text);color:var(--tt-canvas);border-color:transparent;font-weight:600}
.btn.primary:hover{background:var(--tt-text-2)}
.btn.quiet{border-color:transparent}
.wc{display:flex;margin-left:6px}
.wc button{width:38px;height:32px;display:grid;place-items:center;color:var(--tt-text-muted);border-radius:6px}
.wc button:hover{background:var(--tt-hover);color:var(--tt-text)}

/* sidebar */
.side{width:clamp(210px,21vw,270px);flex:none;display:flex;flex-direction:column;background:var(--tt-sidebar);border-right:1px solid var(--tt-hairline);min-height:0}
.brand{height:44px;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;font-weight:650;font-size:15px}
.mark{width:20px;height:20px;border-radius:5px;background:var(--tt-accent);color:var(--tt-on-accent);display:grid;place-items:center}
.mark svg{width:13px;height:13px;stroke-width:2.4}
.brand .sp{flex:1}
.brand .ib{width:28px;height:28px}
.seg-mode{display:flex;background:var(--tt-canvas);border-radius:9px;padding:2px}
.seg-mode .ib{width:26px;height:26px}
.search{margin:2px 10px 10px;height:32px;border:1px solid var(--tt-hairline);border-radius:9px;background:var(--tt-field);color:var(--tt-text-faint);display:flex;align-items:center;gap:8px;padding:0 10px;font-size:13px}
.tree{flex:1;overflow:auto;min-height:0}
.proj{display:flex;align-items:center;gap:6px;padding:6px 12px;font-weight:600;font-size:13.5px}
.proj .n{margin-left:auto;color:var(--tt-text-muted);font-weight:400}
.trow{display:block;width:calc(100% - 12px);text-align:left;margin:2px 6px;padding:7px 10px 7px 12px;border-radius:9px;border:1px solid transparent}
.trow:hover{background:var(--tt-sidebar-row-hover)}
.trow.on{background:var(--tt-sidebar-row-active);border-color:color-mix(in oklab,var(--tt-accent) 35%,transparent)}
.trow b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow small{display:flex;justify-content:space-between;align-items:center;color:var(--tt-text-muted);font-size:12px;margin-top:2px}
.trow .work{color:var(--tt-accent-text)}
.settled{display:flex;align-items:center;gap:6px;padding:8px 14px;color:var(--tt-text-2);font-size:13px}
.foot{padding:8px;border-top:1px solid var(--tt-hairline)}
.rooms{display:flex;background:var(--tt-canvas);border-radius:10px;padding:3px;margin-bottom:6px}
.rooms button{flex:1;height:28px;font-size:13px;color:var(--tt-text-muted)}
.rooms button.on{background:var(--tt-surface-elevated);color:var(--tt-text)}
.foot-icons{display:flex;align-items:center;gap:2px}
.foot-icons .sp{flex:1}
.foot-icons .ib[aria-current=page]{background:var(--tt-accent-surface);color:var(--tt-text)}
.pmark{width:14px;height:14px;color:var(--tt-text-2);flex:none}
.pmark.codex{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:4px;border:1.3px solid currentColor;font-size:9.5px;font-weight:700;line-height:1}

/* thread */
.thread{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.tbar{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 16px;white-space:nowrap;min-width:0}
.tbar .title{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tbar .proj-name{color:var(--tt-text-muted);overflow:hidden;text-overflow:ellipsis}
.tbar .folder{display:inline-flex;align-items:center;gap:5px;color:var(--tt-text-muted);font-size:13px}
.tbar .sp{flex:1}
.msgs{flex:1;overflow:auto;min-height:0}
.col{max-width:780px;margin:0 auto;padding:14px 28px 24px}
.m-user{margin:6px 0 4px auto;max-width:80%;width:fit-content;background:var(--tt-message-surface);padding:9px 13px;border-radius:14px}
.m-meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--tt-text-muted);margin:18px 0 4px}
.m-meta b{color:var(--tt-text-2);font-weight:600}
.m-text{margin:0 0 8px}
.m-text code,.code{font-family:'Spline Sans Mono',ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--tt-surface-elevated);padding:1px 5px;border-radius:5px}
.act{border-left:2px solid var(--tt-hairline);padding:2px 0 2px 12px;margin:8px 0;display:grid;gap:5px;font-size:13px;color:var(--tt-text-muted)}
.act div{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap}
.act b{color:var(--tt-text-2);font-weight:500}
.act .mono{overflow:hidden;text-overflow:ellipsis}
.act time{margin-left:auto;color:var(--tt-text-faint);font-size:12px}
.composer{flex:none;margin:0 auto 14px;width:min(780px,calc(100% - 32px));border:1px solid var(--tt-border-faint);border-radius:16px;background:var(--tt-surface);padding:12px 12px 10px 16px;color:var(--tt-text-faint)}
.composer .ph{height:30px}
.composer .row{display:flex;align-items:center;gap:6px;min-width:0}
.composer .pill{height:28px;border:1px solid var(--tt-hairline);border-radius:999px;padding:0 10px;font-size:12.5px;color:var(--tt-text-2);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.composer .sp{flex:1}
.send{width:30px;height:30px;border-radius:50%;background:var(--tt-accent);color:var(--tt-on-accent);display:grid;place-items:center}

/* request card (ask state) */
.req{border:1px solid var(--tt-warning);border-radius:14px;background:var(--tt-surface);padding:12px 14px;margin:12px 0 16px}
.req p{margin:0 0 6px}
.req .facts{color:var(--tt-text-muted);font-size:13px;margin-bottom:10px}
.req .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- model viewer ---------- */
.mv{display:block;position:relative;background:var(--tt-surface-sunken);color:var(--tt-text);touch-action:none;overflow:hidden;min-height:0}
.mv[data-interactive="1"]{cursor:grab}
.mv[data-interactive="1"]:active{cursor:grabbing}
.mv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.mv-hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--tt-text-muted);pointer-events:none;background:color-mix(in srgb,var(--tt-surface-sunken) 80%,transparent);padding:1px 6px;border-radius:6px}
.mv-over{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12px;color:var(--tt-text-2);pointer-events:none}
.mv-over b{display:block;color:var(--tt-text);font-weight:600}
.mv-over span{font-size:13px;color:var(--tt-text-muted)}
.prog{height:4px;border-radius:99px;background:var(--tt-hairline);overflow:hidden;position:relative}
.prog i{display:block;height:100%;background:var(--tt-accent);border-radius:99px}
.prog::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--tt-canvas) 45%,transparent),transparent);transform:translateX(-100%);animation:sweep 1.8s ease-in-out infinite}
@keyframes sweep{to{transform:translateX(100%)}}
.ring{width:22px;height:22px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:var(--tt-hairline)}
.ring .fg{stroke:var(--tt-accent);stroke-linecap:round}

/* model card shared */
.mc{border:1px solid var(--tt-border-faint);border-radius:14px;background:var(--tt-code-bg);overflow:hidden;margin:12px 0 16px;container-type:inline-size}
.mc-bar{display:flex;align-items:center;gap:10px;min-height:42px;padding:4px 4px 4px 14px;border-bottom:1px solid var(--tt-hairline);background:var(--tt-surface-elevated)}
.mc-head{display:flex;flex:1;align-items:baseline;gap:10px;min-width:0;overflow:hidden}
.mc-head h3{margin:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kind{flex:none;color:var(--tt-text-muted);font-family:'Spline Sans Mono',ui-monospace,Consolas,monospace;font-size:12px;white-space:nowrap}
.mc-acts{display:flex;flex:none;gap:2px}
@container (max-width:380px){.kind{display:none}}
.mc .mv.big{height:clamp(200px,40vh,380px)}
.mc-foot{padding:10px 14px 12px;border-top:1px solid var(--tt-hairline);display:grid;gap:8px}
.facts-line{margin:0;color:var(--tt-text-muted);font-size:13px}
.facts-line b{color:var(--tt-text);font-weight:600}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--tt-hairline);border-radius:999px;font-size:12.5px;color:var(--tt-text-2)}
.fchip:hover{background:var(--tt-hover);color:var(--tt-text)}
.fchip .mono{color:var(--tt-text);font-size:12px}
.status-line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tt-text-2)}
.status-line b{color:var(--tt-text);font-weight:600}
.status-line .pct{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--tt-text-muted)}
.problem{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:12px 14px;border-top:1px solid var(--tt-hairline);background:var(--tt-error-surface)}
.problem>svg{color:var(--tt-error);margin-top:2px}
.problem p{margin:0;color:var(--tt-text)}
.problem p+p{grid-column:2;color:var(--tt-text-2);font-size:13.5px}
.problem .acts{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

/* A: chip that opens */
.chip{border:1px solid var(--tt-border-faint);border-radius:14px;background:var(--tt-code-bg);margin:12px 0 16px;overflow:hidden;max-width:560px}
.chip[data-open="1"]{max-width:none}
.chip-row{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 8px;min-width:0}
.chip-thumb{width:48px;height:48px;border-radius:10px;flex:none;overflow:hidden;display:grid;place-items:center;background:var(--tt-surface-sunken)}
.chip-thumb .mv{width:48px;height:48px}
.chip-txt{flex:1;min-width:0;display:grid}
.chip-txt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-txt span{font-size:12.5px;color:var(--tt-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-txt .err{color:var(--tt-error)}
.chip-toggle svg{transition:transform .15s}
.chip-toggle[aria-expanded=true] svg{transform:rotate(180deg)}
.chip-body{border-top:1px solid var(--tt-hairline)}
.chip-body .mv{height:clamp(190px,36vh,340px)}
.chip-body .mc-foot{border-top:1px solid var(--tt-hairline)}
.chip .prog{margin-top:6px}

/* C: side by side */
.sp-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(220px,1fr)}
.sp-grid .mv{min-height:300px;border-right:1px solid var(--tt-hairline)}
.sp-side{padding:12px 14px;display:grid;gap:10px;align-content:start;min-width:0}
.sp-side h3{margin:0;font-size:15px;font-weight:600}
.sp-side .kind{display:block;margin-top:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:0}
.kv dt{color:var(--tt-text-muted)}
.kv dd{margin:0;color:var(--tt-text-2);min-width:0;overflow-wrap:anywhere}
.flist{list-style:none;margin:0;padding:0;border:1px solid var(--tt-hairline);border-radius:10px;overflow:hidden}
.flist li{display:flex;align-items:center;gap:8px;padding:5px 4px 5px 10px;font-size:13px;min-width:0}
.flist li+li{border-top:1px solid var(--tt-hairline)}
.flist .mono{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tt-text)}
.flist .size{color:var(--tt-text-muted);font-size:12px;white-space:nowrap}
.flist .ib{width:28px;height:28px}
.flist-h{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--tt-text-muted);margin:2px 0 -4px}
@container (max-width:560px){.sp-grid{grid-template-columns:1fr}.sp-grid .mv{min-height:220px;border-right:0;border-bottom:1px solid var(--tt-hairline)}}

/* ---------- Tools panel ---------- */
.tools{display:flex;flex:none;border-left:1px solid var(--tt-hairline);min-height:0}
.tpane{width:clamp(330px,33vw,460px);display:flex;flex-direction:column;min-width:0;min-height:0}
.thead{height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 4px 0 14px;font-weight:600}
.thead .sp{flex:1}
.tline{flex:none;padding:6px 14px 8px;border-bottom:1px solid var(--tt-hairline);color:var(--tt-text-2);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.link{color:var(--tt-accent-text);font-weight:600;font-size:13px;padding:0 2px}
.tbody{flex:1;overflow:auto;min-height:0;padding:12px;display:flex;flex-direction:column;gap:12px}
.tbody>*{flex:none}
.tsel{border:1px solid var(--tt-border-faint);border-radius:12px;overflow:hidden;background:var(--tt-surface)}
.tsel .mv{height:clamp(170px,30vh,260px)}
.tsel .info{padding:10px 12px;display:grid;gap:8px}
.tsel .info h3{margin:0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.tlist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.tlist-h{display:flex;justify-content:space-between;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--tt-text-muted);margin:4px 2px 2px}

.proto-bar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:100;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;padding:6px 8px;border-radius:20px;background:var(--proto-bg);color:var(--proto-text);font:12.5px/1 system-ui,'Segoe UI',sans-serif;box-shadow:0 10px 30px rgb(0 0 0 / 50%);border:2px solid var(--proto-on);max-width:calc(100vw - 16px)}

<body>
<div class="win" id="win"></div>
<div id="layer"></div>
<div class="proto-notes" id="notes" hidden></div>
<div class="proto-bar" id="bar" role="toolbar" aria-label="Prototype switcher">
  <button id="prev" aria-label="Previous surface or variant">&larr;</button>
  <span class="lbl" id="vlabel" aria-live="polite"></span>
  <button id="next" aria-label="Next surface or variant">&rarr;</button>
  <span class="grp" id="states"></span>
  <span class="grp"><button id="theme"></button><button id="motion"></button><button id="notesBtn" aria-expanded="false" aria-controls="notes">Notes</button><button id="hideBar" aria-label="Hide the prototype switcher (H)">Hide</button></span>
</div>
<button class="proto-show" id="showBar" hidden>Show switcher (H)</button>
<script>
'use strict';
/* =====================================================================================================
   Icons

const MESH = {};

/* Every viewer on the page shares one animation loop; a viewer turns by itself only while nobody has turned it,

const viewers = new Set();

const go = d => { idx = (idx + d + SURFACES.length) % SURFACES.length; state = ''; closeDialog(); render(); };

addEventListener('keydown', e => {
