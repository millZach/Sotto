<!doctype html>
<!--
  PROTOTYPE — throwaway. Not shipped, not tested, not wired to anything.

  Question: where does Update all live on the Threads page, and how does it read from the offer to the restart?
  And how does a thread that Sotto resumed after a restart look?

  Settled before this prototype (12 October 2026, with Zach):
    1. Both are Owl features (ADR-0072), each its own entry so each can go to stable on its own.
    2. Update all shows whenever anything has an update: Sotto itself, a provider client on this computer or on a
       connected host, or a host running an older Sotto. On Owl it takes over from the client update card and the
       host update pill. With no new Sotto it updates the rest and skips the restart.
    3. Order: the Sotto download runs alongside; clients on this computer; then each host (its Sotto host, then its
       clients). Last, one ask: Restart now. No "when they finish": working threads stop and resume after.
    4. "Resume threads after a restart" in Settings → Application, on by default, covers any stop: an update
       restart, Quit, a crash, a restart of the computer.
    5. Open: what a resumed thread receives. Proposed here: a visible note from Sotto, shown the way a wake-up is
       (ADR-0061), saying what happened and that any running command was stopped. T3 Code sends "Continue where
       you left off." the same way.

  Variants differ in where Update all lives:
    a  Top-strip pill.  Where the host update pill sits now. A pill beside the window controls opens a panel.
    b  Sidebar foot.    The round update control grows into an "Update all" button; the list opens inside the
                        sidebar, above the foot, pushing the thread list up.
    c  Corner card.     Pops up bottom-right, where the client update card is today, and runs in place.

  The bar: scenario, threads working on this PC, the resume setting, page, Play/Reset, theme, size. ← → cycle variants.
-->

<body>
<div class="stage"><div class="window" id="window"></div></div>

<div class="proto-state" id="state" aria-hidden="true"></div>
<div class="proto-bar" role="toolbar" aria-label="Prototype controls">
  <button id="prev" aria-label="Previous variant">←</button>
  <span class="vlabel" id="vlabel"></span>
  <button id="next" aria-label="Next variant">→</button>
  <label>Updates <select id="scenario">
    <option value="all">Sotto + clients + forge</option>
    <option value="fail">Same, forge's Codex fails</option>
    <option value="noapp">No new Sotto</option>
  </select></label>
  <label>Working here <select id="working"><option>2</option><option>1</option><option>0</option></select></label>
  <label><input type="checkbox" id="resume" checked> Resume setting</label>
  <label>Page <select id="page"><option value="threads">Threads</option><option value="settings">Settings → Application</option></select></label>
  <button id="play">Fast-forward</button>
  <button id="reset">Reset</button>
  <button id="theme">Light</button>
  <select id="size"><option value="1280x800">1280×800</option><option value="1600x1000">1600×1000</option><option value="820x560">820×560</option></select>
</div>

<script>
const VARIANTS = { a: 'Top-strip pill', b: 'Sidebar foot', c: 'Corner card' }
const keys = Object.keys(VARIANTS)
const NOW = '0.1.37-owl.20261012.1', NEXT = '0.1.37-owl.20261013.1'
const RESUME_NOTE = 'Sotto restarted while you were working on this, and your last turn stopped partway. Any command or tool that was running was stopped too, so its result may be missing. Check where things stand, then carry on.'

const state = {
  variant: new URLSearchParams(location.search).get('variant') ?? 'a',
  scenario: 'all', working: 2, resume: true, page: 'threads',
  stage: 'offer', // offer | running | restart | done | restarting | after | hidden
  open: false, items: [], timer: null, notNow: false,
}
if (!keys.includes(state.variant)) state.variant = 'a'
const el = id => document.getElementById(id)

const icon = {
  check: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  loader: (s = 12) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg>`,
  alert: (s = 12) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>`,
  restart: (s = 14) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>`,
  download: (s = 15) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>`,
  pc: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
  server: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="8" rx="2"/><rect x="3" y="13" width="18" height="8" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg>',
  x: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  chevron: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>',
}

function buildItems() {
  const items = [
    { id: 'sotto', machine: 'sotto', name: 'Sotto Owl', from: NOW, to: NEXT, kind: 'app', progress: 0 },
    { id: 'pc-claude', machine: 'pc', name: 'Claude Code', from: '2.1.40', to: '2.1.42', kind: 'client' },
    { id: 'pc-codex', machine: 'pc', name: 'Codex', from: '0.51.0', to: '0.52.1', kind: 'client' },
    { id: 'pc-grok', machine: 'pc', name: 'Grok Build', from: '1.0.7', to: '1.0.9', kind: 'client', manual: 'bun update -g @xai-official/grok' },
    { id: 'forge-host', machine: 'forge', name: 'Sotto host', from: '0.1.35', to: '0.1.37', kind: 'host', step: 0 },
    { id: 'forge-codex', machine: 'forge', name: 'Codex', from: '0.51.0', to: '0.52.1', kind: 'client', fails: state.scenario === 'fail' },
  ]
  return (state.scenario === 'noapp' ? items.filter(item => item.kind !== 'app') : items)
    .map(item => ({ ...item, s: item.manual ? 'manual' : 'waiting', ticks: 0 }))
}
const runnable = () => state.items.filter(item => item.s !== 'manual')
const app = () => state.items.find(item => item.kind === 'app')
const failed = () => state.items.filter(item => item.s === 'failed')
const doneCount = () => runnable().filter(item => item.s === 'done' || item.s === 'failed').length
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`
const HOST_STEPS = ['Download 0.1.37', 'Check the download', 'Install beside 0.1.35', 'Restart forge’s host']

function tick() {
  const sotto = app()
  if (sotto && sotto.s !== 'done') { sotto.s = 'updating'; sotto.progress = Math.min(100, sotto.progress + 9); if (sotto.progress >= 100) sotto.s = 'done' }
  const next = runnable().find(item => item.kind !== 'app' && (item.s === 'waiting' || item.s === 'updating'))
  if (next) {
    next.s = 'updating'; next.ticks++
    if (next.kind === 'host') { next.step = Math.min(3, next.ticks - 1); if (next.ticks > 4) next.s = 'done' }
    else if (next.ticks > 2) next.s = next.fails ? 'failed' : 'done'
  }
  if (runnable().every(item => item.s === 'done' || item.s === 'failed')) finishRun()
  render()
}
function finishRun() {
  clearInterval(state.timer); state.timer = null
  state.stage = app() ? 'restart' : 'done'
}
function startRun() {
  state.stage = 'running'; state.notNow = false
  clearInterval(state.timer); state.timer = setInterval(tick, 650)
  render()
}
function fastForward() {
  if (state.stage === 'offer' || state.stage === 'hidden') startRun()
  for (let i = 0; i < 60 && state.stage === 'running'; i++) tick()
}
function restartNow() {
  state.stage = 'restarting'; state.open = false; render()
  setTimeout(() => { state.stage = 'after'; render() }, 1500)
}
function reset() {
  clearInterval(state.timer); state.timer = null
  state.items = buildItems(); state.stage = 'offer'; state.open = state.variant !== 'a' && state.variant !== 'b' ? false : false; state.notNow = false
  render()
}

/* ---------- The shared list ---------- */
function itemRow(item) {
  const mark = item.s === 'done' ? icon.check : item.s === 'updating' ? icon.loader() : item.s === 'failed' ? icon.alert() : item.s === 'manual' ? '–' : ({ app: 'S', client: item.name[0], host: 'H' })[item.kind]
  let detail = ''
  if (item.s === 'manual') detail = `Update it yourself with <code>${item.manual}</code>. Sotto does not drive bun.`
  else if (item.kind === 'app') detail = item.s === 'updating' ? `Downloading · ${item.progress}%` : item.s === 'done' ? 'Downloaded. Installs when Sotto restarts.' : 'Downloads now, installs when Sotto restarts.'
  else if (item.kind === 'host') detail = item.s === 'updating' ? `Step ${item.step + 1} of 4 · ${HOST_STEPS[item.step]}` : item.s === 'done' ? 'forge runs Sotto host 0.1.37.' : 'Restarts forge’s host, so its threads are unavailable for a few seconds.'
  else detail = item.s === 'updating' ? 'Updating…' : item.s === 'done' ? `Now ${item.to}.` : item.s === 'failed' ? 'Did not update. The installer said: EBUSY, the file is in use. Nothing was changed.' : ''
  const ver = item.s === 'done' ? item.to : item.s === 'failed' ? `Still ${item.from}` : `${item.from} → ${item.to}`
  const bar = item.kind === 'app' && item.s === 'updating' ? `<div class="bar"><i style="width:${item.progress}%"></i></div>` : ''
  const retry = item.s === 'failed' && (state.stage === 'restart' || state.stage === 'done') ? `<button class="btn" style="margin-top:6px;min-height:26px;font-size:12px">Try again</button>` : ''
  return `<div class="item" data-s="${item.s}"><span class="imark" aria-hidden="true">${mark}</span>
    <div><div class="name">${item.name}</div>${detail ? `<div class="detail">${detail}</div>` : ''}${bar}${retry}</div>
    <span class="ver">${item.kind === 'app' ? '' : ver}</span></div>`
}
function machines() {
  const groups = [['sotto', 'Sotto', icon.download(13)], ['pc', 'This PC', icon.pc], ['forge', 'forge', icon.server]]
  return groups.map(([id, name, glyph]) => {
    const items = state.items.filter(item => item.machine === id)
    if (!items.length) return ''
    const heading = id === 'sotto' ? `${glyph} Sotto · ${NOW} → ${NEXT}` : `${glyph} ${name}`
    return `<section class="machine" aria-label="${name}"><h4>${heading}</h4>${items.map(itemRow).join('')}</section>`
  }).join('')
}
function headWords() {
  const total = runnable().length
  const f = failed().length
  if (state.stage === 'offer' || state.stage === 'hidden') {
    const parts = [app() ? 'Sotto' : null, '3 clients', 'forge'].filter(Boolean)
    return { title: 'Updates', sub: `${parts.slice(0, -1).join(', ')} and ${parts.at(-1)}` }
  }
  if (state.stage === 'running') return { title: 'Updating', sub: `${doneCount()} of ${total} · threads keep working` }
  if (state.stage === 'restart') return { title: 'Restart to finish', sub: f ? 'forge’s Codex did not update. The rest did.' : 'Clients and forge are updated.' }
  return { title: f ? '1 update did not finish' : 'Updated', sub: f ? 'forge’s Codex did not update. The rest did. Sotto did not need a restart.' : 'Clients and forge are updated. Sotto did not need a restart.' }
}
function notes() {
  const w = state.working
  if (state.stage === 'offer' || state.stage === 'hidden') {
    return `<div class="ua-note"><p>Threads keep working while clients update. forge’s host restarts, so its threads pause for a few seconds${state.resume ? ' and carry on after' : ''}.</p>
      ${app() ? '<p>Sotto restarts last, when you say.</p>' : ''}</div>`
  }
  if (state.stage === 'restart') {
    const threads = w === 0 ? '' : state.resume
      ? `<p><strong>${plural(w, 'thread', 'threads')} on this PC ${w === 1 ? 'is' : 'are'} working.</strong> ${w === 1 ? 'It stops' : 'They stop'} for the restart and ${w === 1 ? 'carries' : 'carry'} on after it.</p>`
      : `<p><strong>${plural(w, 'thread', 'threads')} on this PC ${w === 1 ? 'is' : 'are'} working.</strong> The restart stops ${w === 1 ? 'it' : 'them'}; drafts and history stay. Turn on Resume threads after a restart in Settings → Application to have them carry on.</p>`
    return `<div class="ua-note"><p>Sotto ${NEXT} is downloaded. Restarting installs it.</p>${threads}</div>`
  }
  return ''
}
function actions() {
  if (state.stage === 'offer' || state.stage === 'hidden') return `<div class="ua-actions"><button class="btn primary" data-act="run" aria-label="Update all: ${app() ? 'Sotto, ' : ''}2 clients on this PC and forge">Update all</button><button class="btn ghost" data-act="notnow" aria-label="Not now: hide this until something new is published">Not now</button></div>`
  if (state.stage === 'running') return `<div class="ua-actions"><button class="btn ghost" data-act="cancel" aria-label="Stop after the update in progress">Stop after this one</button></div>`
  if (state.stage === 'restart') return `<div class="ua-actions"><button class="btn primary" data-act="restart" aria-label="Restart Sotto now and install ${NEXT}">Restart now</button><button class="btn ghost" data-act="later" aria-label="Later: the update control keeps the download">Later</button></div>`
  return `<div class="ua-actions"><button class="btn ghost" data-act="dismiss">Dismiss</button></div>`
}
function list(extraHead = '') {
  const { title, sub } = headWords()
  return `<div class="ua" role="group" aria-label="${title}"><div class="ua-head" aria-live="polite"><strong>${title}</strong><span>${sub}</span>${extraHead}</div>${machines()}${notes()}${actions()}</div>`
}
function compactWords() {
  if (state.stage === 'running') return { text: `Updating · ${doneCount()} of ${runnable().length}`, phase: 'running', glyph: `<span class="spin">${icon.loader(13)}</span>` }
  if (state.stage === 'restart') return failed().length ? { text: 'Restart to finish', phase: 'failed', glyph: `<span style="color:var(--tt-error-text);display:grid">${icon.alert(13)}</span>` } : { text: 'Restart to finish', phase: 'restart', glyph: `<span style="color:var(--tt-success);display:grid">${icon.restart(13)}</span>` }
  if (state.stage === 'done') return failed().length ? { text: '1 update failed', phase: 'failed', glyph: `<span style="color:var(--tt-error-text);display:grid">${icon.alert(13)}</span>` } : { text: 'All up to date', phase: 'done', glyph: `<span style="color:var(--tt-success);display:grid">${icon.check}</span>` }
  return { text: 'Update all', phase: 'needs', glyph: '<span class="pdot"></span>' }
}
const surfaceShown = () => ['offer', 'running', 'restart', 'done'].includes(state.stage) && !(state.notNow && state.stage === 'offer')

/* ---------- The Threads page ---------- */
function threadRows() {
  const after = state.stage === 'after'
  const word = (i) => {
    if (i >= state.working) return '<span class="state-word">Done</span>'
    if (after && !state.resume) return '<span class="state-word" data-s="stopped"><i></i>Stopped</span>'
    return '<span class="state-word" data-s="working"><i></i>Working</span>'
  }
  return `<div class="group">sotto</div>
    <div class="row-t" aria-current="true"><span>Fix host pill overflow at 820</span>${word(0)}</div>
    <div class="row-t"><span>Resume threads ADR</span>${word(1)}</div>
    <div class="row-t"><span>Tray menu copy pass</span><span class="state-word">Done</span></div>
    <div class="group">${icon.server} forge</div>
    <div class="row-t"><span>Grok client floor</span><span class="state-word" data-s="working"><i></i>Working</span></div>
    <div class="row-t"><span>Linux journey notes</span><span class="state-word">Done</span></div>`
}
function transcript() {
  const after = state.stage === 'after'
  const selectedWorking = state.working > 0
  let html = `<article class="msg" data-role="user"><header><span class="who">You</span><time>2:41 pm</time></header><p>The host update pill overlaps the pane title at 820 wide. Fix it and run the hostUpdates tests.</p></article>
    <article class="msg"><header><span class="who">Claude Code</span><time>2:41 pm</time></header><p>The pill takes 186px from the pane header, but below 1100px only the mark shows. I’ll shrink the reserved room to 38px at that width, then run the tests.</p></article>`
  if (!selectedWorking) return html + `<div class="activity">${icon.check} Ran <code>npm test -- hostUpdates</code> · 14 passed</div><article class="msg"><header><span class="who">Claude Code</span><time>2:44 pm</time></header><p>Fixed. The header keeps its title at 820×560.</p></article>`
  if (!after) return html + `<div class="activity" data-s="running">${icon.loader(13)} Running <code>npm test -- hostUpdates</code></div>`
  html += `<div class="activity" data-s="stopped">${icon.alert(13)} Stopped when Sotto restarted · <code>npm test -- hostUpdates</code> did not finish</div>`
  if (!state.resume) return html + `<p class="stopped-note">This thread was working when Sotto restarted. Send a message to carry on.</p>`
  return html + `<article class="msg" data-role="user" data-from="sotto"><header><span class="who"><span class="mark" style="width:14px;height:14px;border-radius:4px"></span>Sotto</span><span class="tag">Resumed</span><time>2:47 pm</time></header><p>${RESUME_NOTE}</p></article>
    <article class="msg"><header><span class="who">Claude Code</span><time>2:47 pm</time></header><p>The test run was cut off, so I’ll check the CSS change is still there and run it again.</p></article>
    <div class="activity" data-s="running">${icon.loader(13)} Running <code>npm test -- hostUpdates</code></div>`
}
function threadsPage() {
  const v = state.variant
  const shown = surfaceShown()
  const c = compactWords()
  const updateGlyph = state.stage === 'after' || state.stage === 'restarting' ? '' : `<span class="dot"></span>`
  // b: the foot's control becomes a labelled button; a and c keep the round control, which opens the same surface.
  const footControl = v === 'b' && shown
    ? `<button class="foot-btn" data-act="toggle" data-phase="${c.phase}" aria-expanded="${state.open}" aria-label="${c.text}. ${state.open ? 'Hide' : 'Show'} updates">${c.glyph}<span class="label">${c.text}</span></button>`
    : `<button class="update-control" ${shown ? 'data-on' : ''} data-act="${v === 'c' ? 'reopen' : 'toggle'}" aria-label="${shown ? 'Show updates' : 'Check for updates'}">${icon.download(15)}${shown ? updateGlyph : ''}</button>`
  const drawer = v === 'b' && shown && state.open ? `<div class="drawer">${list()}</div>` : ''
  const pill = v === 'a' && shown ? `<button class="pill" data-act="toggle" data-phase="${c.phase}" aria-expanded="${state.open}" aria-label="${c.text}. ${state.open ? 'Hide' : 'Show'} updates" title="${c.text}">${c.glyph}<span class="label">${c.text}</span></button>` : ''
  const panel = v === 'a' && shown && state.open ? `<div class="panel" role="dialog" aria-label="Updates">${list()}</div>` : ''
  const card = v === 'c' && shown
    ? (state.open ? `<div class="card" role="region" aria-label="Updates"><button class="icon-btn collapse" data-act="toggle" aria-label="Hide updates">${icon.chevron}</button>${list()}</div>`
      : `<div class="card-mini"><button class="pill" style="position:static" data-act="toggle" data-phase="${c.phase}" aria-label="${c.text}. Show updates">${c.glyph}<span class="label">${c.text}</span></button></div>`)
    : ''
  return `<aside class="side">
      <div class="side-top"><span class="mark"></span><strong>Sotto</strong><button class="icon-btn" aria-label="New thread">+</button></div>
      <div class="list">${threadRows()}</div>
      ${drawer}
      <div class="foot"><span class="seg"><span>Dictate</span><span class="on">Threads</span></span><span class="grow"></span>${footControl}</div>
    </aside>
    <section class="pane">
      <div class="head"><span class="pmark">C</span><strong>Fix host pill overflow at 820</strong><small>sotto · fix/host-pill-820</small></div>
      <div class="transcript">${transcript()}</div>
      <div class="composer"><span>Ask for follow-up changes</span><span class="chips"><span>Opus 5.5</span><span>High</span><span>Auto</span></span></div>
      ${pill}${panel}${card}
      <div class="winctl" aria-hidden="true"><span>—</span><span>▢</span><span>✕</span></div>
    </section>
    ${state.stage === 'restarting' ? `<div class="restarting"><div><span class="mark"></span><span>Sotto is restarting…</span></div></div>` : ''}`
}

/* ---------- Settings → Application ---------- */
function toggleRow(label, desc, on, extra = '') {
  return `<div class="srow" ${extra}><span><strong>${label}</strong><span class="desc">${desc}</span></span><button class="toggle" role="switch" aria-checked="${on}" aria-label="${label}" ${extra.includes('data-new') ? 'data-act="resume"' : ''}></button></div>`
}
function settingsPage() {
  const sottoReady = app() && (state.stage === 'offer' || state.stage === 'running' || state.stage === 'restart')
  const updateBtn = sottoReady
    ? (state.stage === 'restart' ? '<button class="btn primary" data-act="restart">Restart and install</button>' : `<button class="btn primary" data-act="run-settings">Update all</button>`)
    : '<button class="btn">Check now</button>'
  const status = state.stage === 'restart' ? `${NEXT} is downloaded. Restart to install it.` : state.stage === 'running' ? 'Updating…' : sottoReady ? `${NEXT} is available, with updates for 3 clients and forge.` : 'Sotto is up to date.'
  return `<aside class="side"><div class="side-top"><span class="mark"></span><strong>Sotto</strong></div>
      <nav class="set-nav"><h1>Settings</h1>${['Dictation', 'Transcription', 'Cleanup', 'Providers', 'Hosts', 'Phones', 'Cloud iPhone', 'Agents', 'Output', 'Appearance', 'Application', 'Git'].map(n => `<a href="#" class="${n === 'Application' ? 'on' : ''}">${n}</a>`).join('')}</nav>
      <span class="grow" style="flex:1"></span></aside>
    <section class="settings"><div class="page">
      <div class="sec"><h2>Application</h2><p>Startup, privacy &amp; updates</p></div>
      ${toggleRow('Let agents draw visuals in threads', 'An agent can draw a diagram, or a small interactive page sealed from the network, in its thread to show how something works. When off, agents explain in text instead.', true)}
      ${toggleRow('Let agents babysit pull requests', 'A thread can watch its pull request and wake when a check fails, a review arrives or it merges.', true)}
      ${toggleRow('Resume threads after a restart', state.resume
        ? 'When Sotto closes while a thread is working, for an update, a quit, a crash or a restart of this computer, the thread carries on when Sotto opens again. Sotto sends it a short note, shown in the thread, saying it was stopped.'
        : 'Off: a thread that was working when Sotto closed waits for you to send a message.', state.resume, 'data-new')}
      ${toggleRow('Start minimized', 'Open in the tray without showing the window.', false)}
      <p class="callout">Prototype note: the yellow tag is only here. The toggle sits with the other agent toggles in Application; only Owl builds show it.</p>
      <div class="sub-h"><h3>Updates</h3><p>Sotto checks GitHub for new versions and installs them when you say.</p></div>
      <div class="srow"><span><p class="ver-line">Sotto Owl ${NOW}</p><p class="ver-status" aria-live="polite">${status}</p></span>${updateBtn}</div>
      ${toggleRow('Check for updates automatically', 'Asks GitHub for the newest release fifteen seconds after launch and every four minutes. Only the version is sent.', true)}
      <p class="callout">Prototype note: on Owl, Download becomes Update all here too, and runs the same pass the Threads page shows.</p>
    </div></section>`
}

/* ---------- Render and wiring ---------- */
function render() {
  const [w, h] = el('size').value.split('x').map(Number)
  const win = el('window')
  win.style.setProperty('--w', w + 'px'); win.style.setProperty('--h', h + 'px')
  win.style.setProperty('--fit', String(Math.min(1, (innerWidth - 16) / w)))
  document.body.classList.toggle('narrow', w <= 1099)
  win.innerHTML = state.page === 'settings' ? settingsPage() : threadsPage()
  el('vlabel').textContent = `${state.variant} — ${VARIANTS[state.variant]}`
  win.querySelectorAll('[data-act]').forEach(button => button.addEventListener('click', () => act(button.dataset.act)))
  el('state').textContent = JSON.stringify({ variant: state.variant, page: state.page, stage: state.stage, open: state.open, working: state.working, resume: state.resume,
    items: Object.fromEntries(state.items.map(item => [item.id, item.s])) }, null, 1)
}
function act(name) {
  if (name === 'toggle') state.open = !state.open
  else if (name === 'reopen') state.open = true
  else if (name === 'run') startRun()
  else if (name === 'run-settings') { state.page = 'threads'; el('page').value = 'threads'; state.open = true; startRun() }
  else if (name === 'notnow') { state.notNow = true; state.open = false }
  else if (name === 'cancel') { clearInterval(state.timer); state.timer = null; state.items.forEach(item => { if (item.s === 'waiting') item.s = 'manual' }); state.stage = app()?.s === 'done' ? 'restart' : 'done' }
  else if (name === 'restart') return restartNow()
  else if (name === 'later') { state.open = false }
  else if (name === 'dismiss') { state.stage = 'hidden'; state.notNow = true; state.open = false }
  else if (name === 'resume') { state.resume = !state.resume; el('resume').checked = state.resume }
  render()
}
function go(step) {
  state.variant = keys[(keys.indexOf(state.variant) + step + keys.length) % keys.length]
  const url = new URL(location.href); url.searchParams.set('variant', state.variant); history.replaceState(null, '', url)
  // The corner card pops up by itself; the pill and the foot wait to be opened.
  if (state.stage === 'offer') state.open = state.variant === 'c'
  render()
}
el('prev').onclick = () => go(-1); el('next').onclick = () => go(1)
el('scenario').onchange = e => { state.scenario = e.target.value; reset(); state.open = state.variant === 'c'; render() }
el('working').onchange = e => { state.working = Number(e.target.value); render() }
el('resume').onchange = e => { state.resume = e.target.checked; render() }
el('page').onchange = e => { state.page = e.target.value; render() }
el('play').onclick = () => { fastForward(); render() }
el('reset').onclick = () => { reset(); state.open = state.variant === 'c'; render() }
el('size').onchange = render
addEventListener('resize', render)
el('theme').onclick = () => { const light = document.documentElement.dataset.theme !== 'light'; document.documentElement.dataset.theme = light ? 'light' : ''; el('theme').textContent = light ? 'Dark' : 'Light' }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.open && state.variant !== 'c') { state.open = false; render(); return }
  if (e.target.closest('input, textarea, select, [contenteditable]')) return
  if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1)
})
state.items = buildItems()
state.open = state.variant === 'c'
if (new URLSearchParams(location.search).get('page') === 'settings') { state.page = 'settings'; el('page').value = 'settings' }
render()
</script>
</body>
</html>
