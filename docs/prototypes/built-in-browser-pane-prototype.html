<!doctype html>
<!--
  PROTOTYPE — throwaway. Three directions for Sotto's built-in browser pane; ?variant=A|B|C&state=idle|agent|pointing.

  Not shipped, not tested, not wired to anything. Extra parameters: &theme=light, &point=hover|comment|added (which
  moment of Pointing to show), &motion=reduced. Left and right arrow keys cycle the variants when no field has focus.

  Question: Zach wants the built-in browser to look like the in-app browsers in Codex and T3 Code. Today every agent
  browser call is its own row in the thread, and the pane stacks a grant line, a task line with Pause, a "N recorded
  steps" fold and a viewport-size picker above the page. Here the agent's work is one quiet line in the thread that
  updates in place, the pane shows the live page, and Zach's own controls are the address bar, Back, Forward, Reload,
  Point at something and Screenshot to message.

    A  Tools pane.    The browser stays the Browser surface of Tools, rail at the outer edge. One chrome row; a thin
                      tab strip only with 2+ pages; a slim strip at the page's foot while the agent browses.
    B  Browser pane.  A pane of its own, Chrome-like: tabs on top, then the toolbar. While the agent works: its
                      cursor, a soft accent ring round the page and a "Take over" pill at the top centre.
    C  Split thread.  The browser lives inside the thread pane under one header with a browser toggle. One compact
                      row; pages in a "2 pages" menu; the agent shows only as the thread's line and its cursor.

  Colours are the default theme's first-paint values (src/shared/themes/palettes.ts, src/renderer/src/styles/tokens.css).
  The Fieldnotes page is a website, so it keeps its own colours in both themes.
-->

/* ---- Derived --tt-* tokens ---- */
:root {
  --tt-canvas: var(--theme-canvas);
  --tt-surface: var(--theme-surface);
  --tt-surface-elevated: var(--theme-surface-raised);

  --tt-text-faint: var(--theme-placeholder);
  --tt-hairline: var(--theme-border);
  --tt-field-border: var(--theme-input);

  --tt-bubble: var(--theme-message-surface);

  --tt-accent: var(--theme-accent);
  --tt-accent-contrast: var(--theme-accent-foreground);
  --tt-accent-text: var(--theme-update-foreground);

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { min-height: 100vh; padding: 10px 8px 150px; background: #222327; font-family: var(--tt-font-ui); }
:root[data-theme='light'] body { background: #c9c5bc; }
svg.i { flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font-family: inherit; }

/* ---- Prototype chrome: deliberately not Sotto's look ---- */
.cap { max-width: 1280px; margin: 0 auto 8px; color: #f3f1ea; font: 13px/1.4 system-ui, 'Segoe UI', sans-serif; }
:root[data-theme='light'] .cap { color: #1d1d1d; }
.cap b.tag { display: inline-block; margin-right: 8px; padding: 1px 6px; border-radius: 4px; background: #ffd34d; color: #111; font-size: 11px; letter-spacing: .06em; }
.cap strong { font-weight: 700; }
.holder { margin: 0 auto; }
.sw { position: fixed; bottom: max(10px, env(safe-area-inset-bottom)); left: 50%; z-index: 100; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 10px; width: max-content; max-width: calc(100vw - 16px); padding: 6px 8px; border: 2px solid #ffd34d; border-radius: 26px; background: #0c0c0e; color: #fff; box-shadow: 0 10px 40px rgb(0 0 0 / 55%); font: 14px/1 system-ui, 'Segoe UI', sans-serif; transform: translateX(-50%); }
.sw button { min-width: 40px; min-height: 40px; padding: 0 12px; border: 0; border-radius: 20px; background: transparent; color: #fff; font: inherit; cursor: pointer; }
.sw button:hover { background: #2a2a2e; }
.sw button:focus-visible { outline: 2px solid #ffd34d; outline-offset: 1px; }
.sw__v { display: flex; align-items: center; }
.sw__v button { font-size: 22px; padding: 0 10px; }
.sw__label { min-width: 132px; padding: 0 4px; font-weight: 700; text-align: center; white-space: nowrap; }
.sw__seg { display: flex; padding: 2px; border-radius: 22px; background: #26262b; }
.sw__seg button[aria-pressed='true'] { background: #ffd34d; color: #111; font-weight: 700; }
.sw__sub[hidden] { display: none; }

/* ---- The window ---- */
.win { position: relative; display: flex; width: 1280px; height: 800px; overflow: hidden; border: 1px solid var(--tt-hairline); border-radius: 8px; background: var(--tt-canvas); color: var(--tt-text); font-family: var(--tt-font-ui); font-size: 14px; transform-origin: 0 0; box-shadow: 0 30px 80px rgb(0 0 0 / 45%); }
.f:focus-visible { outline: 2px solid var(--tt-focus-ring); outline-offset: 1px; }
.winctl { display: flex; flex: none; align-self: flex-start; color: var(--tt-text-muted); }
.winctl span { display: grid; place-items: center; width: 40px; height: 36px; }

/* Sidebar */
.nav { display: flex; flex: none; flex-direction: column; width: 248px; min-height: 0; border-right: 1px solid var(--tt-hairline); background: var(--tt-sidebar); color: var(--tt-sidebar-text); }
.nav__top { display: flex; flex: none; align-items: center; gap: 2px; height: 44px; padding: 0 6px 0 14px; }
.nav__brand { display: inline-flex; align-items: center; gap: 8px; margin-right: auto; font-size: 14px; font-weight: 600; }
.seg { display: inline-flex; flex: none; padding: 2px; border-radius: 8px; background: var(--tt-surface-sunken); }
.seg span { display: grid; place-items: center; width: 28px; height: 24px; border-radius: 6px; color: var(--tt-text-muted); }
.seg span[data-on] { background: var(--tt-surface-elevated); color: var(--tt-text); box-shadow: 0 1px 2px var(--tt-shadow-color); }
.act { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 7px; background: transparent; color: var(--tt-text-muted); cursor: pointer; }
.act:hover { background: var(--tt-hover); color: var(--tt-text); }
.act[aria-pressed='true'] { background: var(--tt-selected); color: var(--tt-text); }
.act:disabled, .act[aria-disabled='true'] { opacity: .45; cursor: default; }
.act:disabled:hover { background: transparent; color: var(--tt-text-muted); }
.search { position: relative; display: flex; flex: none; align-items: center; height: 32px; margin: 0 8px 10px; color: var(--tt-text-muted); }
.search svg { position: absolute; left: 9px; }
.search span { display: flex; align-items: center; width: 100%; height: 100%; padding: 0 10px 0 32px; border: 1px solid var(--tt-hairline); border-radius: 8px; background: var(--tt-field); color: var(--tt-text-faint); font-size: 13px; }
.nav__scroll { flex: 1; min-height: 0; overflow: hidden; padding: 0 8px; }
.folder { margin: 0 0 14px; }
.folder__head { display: flex; align-items: center; gap: 5px; min-height: 26px; padding: 0 8px 0 6px; color: var(--tt-text-2); font-size: 12.5px; font-weight: 600; }
.folder__head svg { color: var(--tt-text-muted); }
.folder__count { margin-left: auto; color: var(--tt-text-muted); font-weight: 400; }
.rows { margin: 0; padding: 0; list-style: none; }
.row { display: grid; grid-template-columns: 18px minmax(0, 1fr); column-gap: 8px; row-gap: 2px; align-items: center; margin: 1px 0; padding: 7px 10px 7px 8px; border: 1px solid transparent; border-radius: 8px; color: var(--tt-text-2); }
.row[data-current] { border-color: var(--tt-selected-border); background: var(--tt-selected); }
.row__title { overflow: hidden; font-size: 14px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.row[data-current] .row__title { color: var(--tt-text); }
.row__meta { grid-column: 2; display: flex; align-items: center; gap: 7px; color: var(--tt-text-muted); font-size: 12px; }
.row__status { margin-left: auto; }
.row__status[data-state='working'] { color: var(--tt-activity); }
.ring { width: 10px; height: 10px; justify-self: center; border: 1.5px solid var(--tt-hairline); border-radius: 50%; }
.ring[data-state='working'] { border: 0; background: conic-gradient(var(--tt-activity) 0 32%, color-mix(in srgb, var(--tt-activity) 22%, transparent) 32% 100%); mask: radial-gradient(circle, transparent 38%, #000 42%); }
.ring[data-state='done'] { border-color: var(--tt-success); background: radial-gradient(circle, var(--tt-success) 0 28%, transparent 30%); }
.mark { display: inline-grid; place-items: center; flex: none; width: 15px; height: 15px; border-radius: 4px; background: var(--tt-provider-claude); color: var(--tt-provider-ink); font-size: 9.5px; font-weight: 800; }
.nav__foot { display: flex; flex: none; flex-direction: column; gap: 8px; padding: 8px 10px 10px; border-top: 1px solid var(--tt-sidebar-border); }
.nav__pages { display: grid; grid-template-columns: 1fr 1fr; padding: 2px; border-radius: 9px; background: var(--tt-surface-sunken); }
.nav__pages span { padding: 6px 0; border-radius: 7px; color: var(--tt-text-muted); font-size: 13px; text-align: center; }
.nav__pages span[data-on] { background: var(--tt-surface-elevated); color: var(--tt-text); }
.nav__icons { display: flex; gap: 16px; padding: 0 4px; color: var(--tt-text-muted); }

/* Thread workspace */
.ws { position: relative; display: flex; flex: 1; flex-direction: column; min-width: 0; min-height: 0; }
.ws__head { display: flex; flex: none; align-items: center; gap: 4px; height: 44px; padding: 0 0 0 18px; }
.ws__title { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
.ws__title h1 { margin: 0; overflow: hidden; font-size: 15px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.ws__project { flex: none; color: var(--tt-text-muted); font-size: 13px; }
.ws__head > .act:last-of-type { margin-right: 8px; }
.ws__split { display: flex; flex: 1; min-height: 0; }
.thread { display: flex; flex: 1; flex-direction: column; min-width: 0; min-height: 0; }
.thread__body { flex: 1; min-height: 0; overflow: hidden auto; padding: 14px 22px 8px; scrollbar-width: thin; }
.bubble { width: fit-content; max-width: 86%; margin: 0 0 20px auto; padding: 10px 14px; border-radius: 16px; background: var(--tt-bubble); color: var(--tt-bubble-text); font-size: 15px; line-height: 1.5; }
.reply { margin: 0 0 12px; color: var(--tt-text); font-size: 15px; line-height: 1.6; }
.reply p { margin: 0 0 10px; }
.reply code { padding: 1px 5px; border-radius: 5px; background: var(--tt-code-bg); font: 13px var(--tt-font-mono); }
.sign { margin: -2px 0 14px; color: var(--tt-text-muted); font-size: 12.5px; }

/* The quiet line: one row for the agent's whole browser run, updated in place. */
.bline-wrap { margin: 0 0 14px; }
.bline { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; min-height: 30px; margin-left: -8px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: var(--tt-text-2); font: inherit; font-size: 13.5px; text-align: left; cursor: pointer; }
.bline:hover { background: var(--tt-hover); }
.bline__globe { color: var(--tt-text-muted); }
.bline__dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--tt-activity); }
.bline__dot[data-paused] { border: 1.5px solid var(--tt-activity); background: transparent; }
.bline__text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bline__last { color: var(--tt-text-muted); }
.bline__chev { color: var(--tt-text-muted); }
.bline[aria-expanded='true'] .bline__chev { rotate: 90deg; }
.steps { margin: 2px 0 4px 7px; padding: 2px 0 2px 16px; border-left: 1px solid var(--tt-hairline); list-style: none; }
.steps[hidden] { display: none; }
.steps li { display: flex; align-items: center; gap: 8px; min-height: 24px; color: var(--tt-text-2); font-size: 13px; }
.steps li svg { color: var(--tt-text-muted); }
.steps li[data-warn], .steps li[data-warn] svg { color: color-mix(in oklab, var(--tt-warning) 70%, var(--tt-text-muted)); }

/* Composer: the card surface, no border. */
.compose { flex: none; padding: 8px 18px 16px; }
.prompt { padding: 12px 14px 8px; border-radius: 16px; background: var(--tt-card); }
.prompt__chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.prompt__chips:empty { display: none; }
.prompt textarea { display: block; width: 100%; min-height: 44px; padding: 0; border: 0; outline: 0; background: transparent; color: var(--tt-text); font: inherit; font-size: 15px; line-height: 1.5; resize: none; }
.prompt textarea::placeholder { color: color-mix(in srgb, var(--tt-text-muted) 55%, transparent); }
.prompt__foot { display: flex; align-items: center; gap: 2px; margin-top: 4px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 7px; border: 0; border-radius: 6px; background: transparent; color: var(--tt-text-muted); font: inherit; font-size: 13px; white-space: nowrap; cursor: pointer; }
.chip:first-of-type { color: var(--tt-text-2); }
.chip:hover { background: var(--tt-hover); }
.send { display: grid; place-items: center; width: 32px; height: 32px; margin-left: auto; border: 0; border-radius: 50%; background: var(--tt-primary); color: var(--tt-primary-contrast); cursor: pointer; }
.att { display: flex; align-items: center; gap: 10px; max-width: 100%; padding: 5px 4px 5px 5px; border-radius: 10px; background: color-mix(in oklab, var(--tt-text) 7%, var(--tt-card)); }
.att__thumb { position: relative; flex: none; width: 54px; height: 38px; overflow: hidden; border-radius: 6px; background: #f6f3ea; }
.att__thumb i { position: absolute; display: block; }
.att__body { display: grid; min-width: 0; gap: 1px; }
.att__label { overflow: hidden; color: var(--tt-text); font-size: 13px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.att__label code { font: 12.5px var(--tt-font-mono); }
.att__note { overflow: hidden; color: var(--tt-text-muted); font-size: 12.5px; text-overflow: ellipsis; white-space: nowrap; }
.att .act { width: 24px; height: 24px; }

/* The draggable edge between the thread and the browser. */
.divider { position: relative; z-index: 6; flex: none; width: 1px; background: var(--tt-hairline); }
.divider__hit { position: absolute; top: 0; bottom: 0; left: -4px; width: 9px; cursor: col-resize; }
.divider__grip { position: absolute; top: 50%; left: -2px; width: 5px; height: 36px; border-radius: 3px; background: color-mix(in srgb, var(--tt-text-muted) 55%, var(--tt-canvas)); translate: 0 -50%; }
.divider__hit:is(:hover, :focus-visible) .divider__grip { background: var(--tt-activity); }

/* Shared browser controls */
.crow { display: flex; align-items: center; gap: 2px; min-width: 0; }
.addr { position: relative; display: flex; flex: 1; align-items: center; gap: 7px; min-width: 0; height: 30px; margin: 0 6px; padding: 0 10px; border: 1px solid transparent; border-radius: 8px; background: var(--tt-field); color: var(--tt-text-muted); }
.addr[data-focus], .addr:focus-within { border-color: var(--tt-focus-ring); box-shadow: 0 0 0 1px var(--tt-focus-ring); }
.addr input { position: absolute; inset: 0; width: 100%; padding: 0 10px 0 32px; border: 0; outline: 0; border-radius: 8px; background: transparent; color: transparent; font: inherit; font-size: 13.5px; caret-color: var(--tt-text); }
.addr input::placeholder { color: var(--tt-text-muted); }
.addr:focus-within input, .addr[data-empty] input { color: var(--tt-text); }
.addr__show { display: flex; align-items: baseline; gap: 8px; min-width: 0; overflow: hidden; font-size: 13.5px; white-space: nowrap; pointer-events: none; }
.addr__url { overflow: hidden; color: var(--tt-text); text-overflow: ellipsis; }
.addr__title { flex: 1; min-width: 0; overflow: hidden; color: var(--tt-text-muted); text-overflow: ellipsis; }
.addr:focus-within .addr__show, .addr[data-empty] .addr__show { visibility: hidden; }
.addr__caret { position: absolute; top: 7px; left: 32px; width: 1.5px; height: 16px; background: var(--tt-text); }
.addr:focus-within .addr__caret, .addr:not([data-focus]) .addr__caret, .addr[data-center] .addr__caret { display: none; }
.addr[data-center] .addr__show { justify-content: center; flex: 1; }
.addr[data-center] .addr__title { flex: 0 1 auto; }
.addr[data-center] input { text-align: center; padding: 0 10px; }
.menu-anchor { position: relative; flex: none; }
.menu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 30; display: grid; min-width: 240px; padding: 5px; border: 1px solid var(--tt-hairline); border-radius: 10px; background: var(--tt-glass); box-shadow: var(--tt-shadow-overlay); }

}

  v: ORDER.includes(q.get('variant')) ? q.get('variant') : 'A',

  point: ['hover', 'comment', 'added'].includes(q.get('point')) ? q.get('point') : 'comment',
}
if (q.get('motion') === 'reduced') document.documentElement.dataset.motion = 'reduced'
let timer = null

function resetState() {
  clearInterval(timer); timer = null
  Object.assign(S, { open: true, expanded: false, stepsOpen: false, tab: 0, menu: null, chips: [], loaded: false,
    pointMode: false, popover: false, hover: 'button · Sign in', comment: '', paused: false, cursor: null })
  if (S.st === 'idle') { Object.assign(S, { playIdx: 0, settled: true }) }
  if (S.st === 'agent') { Object.assign(S, { playIdx: 0, settled: false }); startPlay() }
  if (S.st === 'pointing') {
    Object.assign(S, { playIdx: PLAY.length - 1, settled: true })
    if (S.point === 'added') S.chips = [{ kind: 'point', label: 'button · Sign in', note: SAMPLE_COMMENT }]
    else { S.pointMode = true; S.popover = S.point === 'comment' }
  }
}
function startPlay() {
  clearInterval(timer)
  timer = setInterval(() => {
    if (S.paused) return
    if (S.playIdx < PLAY.length - 1) S.playIdx++
    else { S.settled = true; clearInterval(timer); timer = null }
    sync()
  }, 1500)
}
const step = () => PLAY[S.playIdx]
const pages = () => {
  if (S.st === 'idle') return [S.loaded ? { title: 'Fieldnotes', host: 'localhost:5173' } : { title: 'New page', host: '' }]
  return [{ title: 'Fieldnotes', host: 'localhost:5173' }, { title: 'Shared · Fieldnotes', host: 'localhost:5173' }]

    <button class="act f" type="button" data-act="toggle" aria-pressed="${S.open}" aria-label="${label}" title="${S.v === 'A' ? 'Tools' : 'Browser'}">${icon(S.v === 'A' ? I.panel : S.v === 'C' ? I.split : I.globe, 16)}</button>
    <button class="act f" type="button" aria-label="Thread options">${icon(I.more, 16)}</button>
    ${withWinctl ? winctl() : ''}</header>`
}

function render() {
  const win = document.getElementById('win')
  let html = sidebar()
  if (S.v === 'C') {
    html += `<main class="ws" data-v="C">${header(true)}<div class="ws__split">${S.expanded && S.open ? '' : threadCol()}${S.open ? paneC() : ''}</div></main>`
  } else {
    html += `<main class="ws">${header(!S.open)}${threadCol()}</main>`
    if (S.open) html += S.v === 'A' ? paneA() : paneB()
  }
  win.innerHTML = html
  sync()
  // The real focus would sit in the address field; the prototype only draws it there so ← → keep working.
}

// ---- Sync: everything that changes while the agent runs or Zach points ----
function $(slot) { return document.querySelector(`#win [data-slot="${slot}"]`) }
function scale() { return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s')) || 1 }
function relRect(el, wrap) {
  const s = scale(), a = el.getBoundingClientRect(), b = wrap.getBoundingClientRect()
  return { x: (a.left - b.left) / s, y: (a.top - b.top) / s, w: a.width / s, h: a.height / s, W: b.width / s, H: b.height / s }
}

function sync() {
  const cur = STEPS[step()]
  const live = agentLive()
  // The quiet line
  const bl = $('bline')
  if (bl) {
    const done = S.settled
    const text = done ? `Browsed localhost:5173` : S.paused ? `Paused on localhost:5173` : `Browsing localhost:5173`
    const last = done ? `${STEPS.length} steps` : cur.short
    bl.innerHTML = `${icon(I.globe, 14).replace('class="i"', 'class="i bline__globe"')}${done ? '' : `<span class="bline__dot"${S.paused ? ' data-paused' : ''} aria-hidden="true"></span>`}
      <span class="bline__text">${text} <span class="bline__last">· ${esc(last)}</span></span>${icon(I.chevR, 14).replace('class="i"', 'class="i bline__chev"')}
      <span class="vh">${S.stepsOpen ? 'Hide the steps' : 'Show the steps'}</span>`
    bl.setAttribute('aria-expanded', String(S.stepsOpen))
    const list = $('steps'); list.hidden = !S.stepsOpen
    const upto = done ? STEPS.length : step() + 1
    list.innerHTML = STEPS.slice(0, upto).map(s => `<li${s.warn ? ' data-warn' : ''}>${icon(I[s.ic], 14)}${esc(s.verb)}</li>`).join('')
    $('after').hidden = !S.settled
  }
  const ns = $('nav-status'); if (ns) { ns.dataset.state = live ? 'working' : 'done'; ns.textContent = live ? 'Working' : 'Done'; ns.closest('.row').querySelector('.ring').dataset.state = live ? 'working' : 'done' }

  if (!S.open) { syncChips(); return }
  // Page content
  const page = pages()[S.tab] || pages()[0]
  const site = $('site'), blank = $('blank')
  site.hidden = !hasPage(); blank.hidden = hasPage()
  let view = 'landing', path = '/', title = 'Fieldnotes'
  if (S.st === 'agent') ({ view, path, title } = cur)
  if (S.st === 'pointing' || S.loaded) { view = 'landing'; path = '/'; title = 'Fieldnotes' }
  if (S.tab === 1) { view = 'shared'; path = '/shared'; title = 'Shared · Fieldnotes' }
  site.dataset.view = view
  $('site-signin').textContent = view === 'notes' ? 'Sign out' : 'Sign in'
  const sIdx = S.st === 'agent' ? step() : 0
  $('site-email').value = S.st === 'agent' && sIdx >= 4 && view !== 'notes' ? 'zach@example.com' : ''
  $('site-pass').value = S.st === 'agent' && sIdx >= 5 && view !== 'notes' ? 'longwayround' : ''

  // Address
  const a = $('addr'), inp = $('addr-input'), show = $('addr-show')
  if (hasPage()) {
    delete a.dataset.empty; delete a.dataset.focus
    if (document.activeElement !== inp) inp.value = `http://localhost:5173${path}`
    show.innerHTML = `<span class="addr__url">localhost:5173${path === '/' ? '' : esc(path)}</span><span class="addr__title">${esc(title)}</span>`
  } else {
    a.dataset.empty = ''; if (document.activeElement !== inp) a.dataset.focus = ''
    show.innerHTML = ''
  }
  for (const b of document.querySelectorAll('#win [data-slot="point-btn"], #win [data-slot="shot-btn"]')) b.disabled = !hasPage()
  const pb = $('point-btn'); pb.setAttribute('aria-pressed', String(S.pointMode)); pb.toggleAttribute('data-point-on', S.pointMode)

  // Agent presence on the page
  const onAgentPage = live && S.tab === 0
  const pw = $('pw')
  pw.toggleAttribute('data-ring', S.v === 'B' && onAgentPage && !S.paused)
  const acur = $('acur')
  if (S.st === 'agent' && cur.target) {
    const el = pw.querySelector(`[data-el="${cur.target}"]`)
    if (el && el.offsetParent) { const r = relRect(el, pw); S.cursor = { x: r.x + Math.min(r.w * .62, 70), y: r.y + r.h * .6 } }
  }
  acur.hidden = !(onAgentPage && S.cursor && S.v !== 'A') // A shows the agent only in its foot strip
  if (S.cursor) { acur.style.left = S.cursor.x + 'px'; acur.style.top = S.cursor.y + 'px' }
  const strip = $('astrip')
  if (strip) {
    strip.hidden = !live
    strip.innerHTML = S.paused
      ? `<span class="bline__dot" data-paused aria-hidden="true"></span><span class="astrip__text">The agent is paused <span>· ${esc(cur.short)}</span></span><button class="tbtn tbtn--accent f" type="button" data-act="pause" aria-label="Let the agent continue">${icon(I.play, 13)}Continue</button>`
      : `<span class="bline__dot" aria-hidden="true"></span><span class="astrip__text">Agent is browsing <span>· ${esc(cur.short)}</span></span><button class="tbtn f" type="button" data-act="pause" aria-label="Pause the agent">${icon(I.pause, 13)}Pause</button>`
  }
  const pill = $('bpill')
  if (pill) {
    pill.hidden = !onAgentPage
    pill.innerHTML = S.paused
      ? `<span class="bline__dot" data-paused aria-hidden="true"></span>The agent is paused<button class="tbtn tbtn--accent f" type="button" data-act="pause" aria-label="Let the agent continue">Continue</button>`
      : `<span class="bline__dot" aria-hidden="true"></span>Agent is using this page<button class="tbtn tbtn--accent f" type="button" data-act="pause" aria-label="Take over the page and pause the agent">Take over</button>`
  }
  syncPoint()
  syncChips()
}

function syncPoint() {
  const pw = $('pw'); if (!pw) return
  const site = $('site'), banner = $('banner'), box = $('pt-box'), chip = $('pt-chip'), pop = $('pt-pop')
  site.toggleAttribute('data-pointing', S.pointMode)
  banner.hidden = !S.pointMode
  const target = S.pointMode && site.querySelector(`[data-pick="${S.hover}"]`)
  box.hidden = chip.hidden = !target
  pop.hidden = !(target && S.popover)
  if (!target) return
  const r = relRect(target, pw), pad = 3
  Object.assign(box.style, { left: r.x - pad + 'px', top: r.y - pad + 'px', width: r.w + pad * 2 + 'px', height: r.h + pad * 2 + 'px' })
  const [kind, ...rest] = S.hover.split(' · ')
  chip.innerHTML = `<code>${esc(kind)}</code> · ${esc(rest.join(' · '))}`
  const cw = chip.offsetWidth
  let cx = Math.min(Math.max(8, r.x + r.w + pad - cw), r.W - cw - 8)
  const below = r.y + r.h + pad + 6
  chip.style.left = cx + 'px'; chip.style.top = below + 'px'
  pop.setAttribute('aria-label', `Point at ${S.hover}`)
  const pwid = 300
  pop.style.left = Math.min(Math.max(8, r.x + r.w + pad - pwid), r.W - pwid - 8) + 'px'
  pop.style.top = below + 28 + 'px'
}

function thumb(c) {
  if (c.kind === 'shot') return `<span class="att__thumb" aria-hidden="true"><i style="left:0;right:0;top:0;height:8px;border-bottom:1px solid #d9d3c2"></i><i style="left:5px;top:13px;width:30px;height:4px;border-radius:2px;background:#1f2a24"></i><i style="left:5px;top:20px;width:38px;height:3px;border-radius:2px;background:#9aa39c"></i><i style="left:5px;top:27px;width:13px;height:5px;border-radius:2px;border:1px solid #2f5d4a"></i></span>`
  return `<span class="att__thumb" aria-hidden="true"><i style="left:0;right:0;top:0;height:13px;border-bottom:1px solid #d9d3c2"></i><i style="right:6px;top:15px;width:30px;height:13px;border-radius:7px;background:#2f5d4a"></i><i style="right:4px;top:13px;width:34px;height:17px;border-radius:5px;border:2px solid var(--tt-accent)"></i><i style="left:5px;top:4px;width:5px;height:5px;border-radius:1px;background:#2f5d4a"></i></span>`
}
function syncChips() {
  const box = $('chips'); if (!box) return
  box.innerHTML = S.chips.map((c, i) => {
    const [kind, ...rest] = c.label.split(' · ')
    const label = c.kind === 'point' ? `<code>${esc(kind)}</code> · ${esc(rest.join(' · '))}` : esc(c.label)
    return `<span class="att">${thumb(c)}<span class="att__body"><span class="att__label">${label}</span>${c.note ? `<span class="att__note">${esc(c.note)}</span>` : c.kind === 'shot' ? '<span class="att__note">localhost:5173 · as it looks now</span>' : ''}</span>
      <button class="act f" type="button" data-act="unchip" data-i="${i}" aria-label="Remove ${esc(c.label)} from the message">${icon(I.x, 13)}</button></span>`
  }).join('')
}

// ---- Interaction ----
function closeMenus(returnFocus) {
  for (const m of document.querySelectorAll('#win .menu')) m.hidden = true
  for (const b of document.querySelectorAll('#win [data-act="menu"]')) { if (b.getAttribute('aria-expanded') === 'true' && returnFocus) b.focus(); b.setAttribute('aria-expanded', 'false') }
  S.menu = null
}
document.getElementById('win').addEventListener('click', e => {
  const t = e.target.closest('[data-act]')
  if (S.pointMode && e.target.closest('.site')) {
    const pick = e.target.closest('[data-pick]')
    if (pick) { S.hover = pick.dataset.pick; S.popover = true; syncPoint(); $('pt-text').focus() }
    e.preventDefault(); return
  }
  if (!t) { if (!e.target.closest('.menu')) closeMenus(false); return }
  const act = t.dataset.act
  if (act !== 'menu' && !t.closest('.menu')) closeMenus(false)
  if (act === 'steps') { S.stepsOpen = !S.stepsOpen; sync() }
  else if (act === 'menu') {
    const id = t.dataset.menu, m = document.querySelector(`#win [data-menu-for="${id}"]`), open = m.hidden
    closeMenus(false)
    if (open) { m.hidden = false; t.setAttribute('aria-expanded', 'true'); S.menu = id; m.querySelector('button').focus() }
  }
  else if (act === 'close-menu') closeMenus(true)
  else if (act === 'tab') { S.tab = +t.dataset.tab; render() }
  else if (act === 'point') { S.pointMode = !S.pointMode; S.popover = false; S.hover = 'button · Sign in'; sync() }
  else if (act === 'pt-cancel') { S.popover = false; syncPoint() }
  else if (act === 'pt-add') {
    S.chips.push({ kind: 'point', label: S.hover, note: $('pt-text').value.trim() })
    S.pointMode = false; S.popover = false; sync()
    document.querySelector('#win .prompt textarea').focus()
  }
  else if (act === 'shot') { if (hasPage()) { S.chips.push({ kind: 'shot', label: 'Picture of the page' }); syncChips() } }
  else if (act === 'unchip') { S.chips.splice(+t.dataset.i, 1); syncChips() }
  else if (act === 'pause') { S.paused = !S.paused; sync() }
  else if (act === 'close') { S.open = false; S.pointMode = false; render(); document.querySelector('#win [data-act="toggle"]').focus() }
  else if (act === 'toggle') { S.open = !S.open; S.expanded = false; render() }
  else if (act === 'expand') { S.expanded = !S.expanded; render() }
  else if (act === 'load') { S.loaded = true; render() }
})
// Hover in Point mode moves the outline until a click opens the comment.
document.getElementById('win').addEventListener('mouseover', e => {
  if (!S.pointMode || S.popover) return
  const pick = e.target.closest('.site [data-pick]')
  if (pick && pick.dataset.pick !== S.hover) { S.hover = pick.dataset.pick; syncPoint() }
})
document.getElementById('win').addEventListener('focusin', e => { if (e.target.dataset.slot === 'addr-input') { delete $('addr').dataset.focus } })
document.getElementById('win').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset.slot === 'addr-input' && e.target.value.trim()) { S.loaded = true; e.target.blur(); render() }
})

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.menu) { closeMenus(true); e.preventDefault(); return }
    if (S.popover) { S.popover = false; syncPoint(); $('point-btn')?.focus(); e.preventDefault(); return }
    if (S.pointMode) { S.pointMode = false; sync(); $('point-btn')?.focus(); e.preventDefault(); return }
  }
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return
  const a = document.activeElement
  if (a && (a.matches('input, textarea, select, [contenteditable]') || a.closest('[role="menu"], [role="tablist"]'))) return
  if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return
  const i = ORDER.indexOf(S.v)
  setVariant(ORDER[(i + (e.key === 'ArrowRight' ? 1 : ORDER.length - 1)) % ORDER.length])
})

// ---- Switcher ----
function writeUrl() {
  const p = new URLSearchParams({ variant: S.v, state: S.st })
  if (S.theme === 'light') p.set('theme', 'light')
  if (S.st === 'pointing' && S.point !== 'comment') p.set('point', S.point)
  if (document.documentElement.dataset.motion === 'reduced') p.set('motion', 'reduced')
  history.replaceState(null, '', `${location.pathname}?${p}`)
}
function paintSwitcher() {
  document.getElementById('vLabel').textContent = VARIANTS[S.v].name
  for (const b of document.querySelectorAll('[data-st]')) b.setAttribute('aria-pressed', String(b.dataset.st === S.st))
  for (const b of document.querySelectorAll('[data-pt]')) b.setAttribute('aria-pressed', String(b.dataset.pt === S.point))
  document.getElementById('subAgent').hidden = S.st !== 'agent'
  document.getElementById('subPoint').hidden = S.st !== 'pointing'
  const tb = document.getElementById('themeBtn')
  tb.textContent = S.theme === 'dark' ? 'Light' : 'Dark'
  tb.setAttribute('aria-label', S.theme === 'dark' ? 'Switch to the light theme' : 'Switch to the dark theme')
  document.documentElement.dataset.theme = S.theme
  const stName = { idle: 'Idle', agent: 'Agent browsing', pointing: 'Pointing' }[S.st]
  document.getElementById('cap').innerHTML = `<b class="tag">PROTOTYPE</b><strong>${VARIANTS[S.v].name}</strong> — ${stName}. ${VARIANTS[S.v].text}`
}
function setVariant(v) { S.v = v; S.open = true; S.expanded = false; S.menu = null; render(); paintSwitcher(); writeUrl() }
function setState(st) { S.st = st; resetState(); render(); paintSwitcher(); writeUrl() }
document.getElementById('prevV').onclick = () => setVariant(ORDER[(ORDER.indexOf(S.v) + 2) % 3])
document.getElementById('nextV').onclick = () => setVariant(ORDER[(ORDER.indexOf(S.v) + 1) % 3])
for (const b of document.querySelectorAll('[data-st]')) b.onclick = () => setState(b.dataset.st)
for (const b of document.querySelectorAll('[data-pt]')) b.onclick = () => { S.point = b.dataset.pt; setState('pointing') }
document.getElementById('replay').onclick = () => setState('agent')
document.getElementById('themeBtn').onclick = () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; paintSwitcher(); writeUrl() }

// ---- Fit the 1280x800 window to the viewport's width ----
function fit() {
  const s = Math.min(1, (document.documentElement.clientWidth - 16) / 1280)
  document.documentElement.style.setProperty('--s', s)
  const h = document.getElementById('holder'), w = document.getElementById('win')
  h.style.width = 1280 * s + 'px'; h.style.height = 800 * s + 'px'
  w.style.transform = `scale(${s})`
  document.getElementById('cap').style.maxWidth = Math.max(1280 * s, 300) + 'px'
}
addEventListener('resize', () => { fit(); if (S.open) syncPoint() })
fit()
resetState()
render()
paintSwitcher()
writeUrl()
</script>
</body>
</html>
