<!doctype html>
<!-- THROWAWAY PROTOTYPE · Opus 5.5 design pass for the Owl Usage page.
     Question: what should the Owl Usage page look and feel like?
     Switch layouts with ?variant=A|B|C, the floating selector, or the Left and Right arrow keys.
     A · Readout: one chart drives every number on the page.
     B · Lanes: a row per provider, the days behind it and the room left up to each reset.
     C · Focus: an index of headline numbers beside one large view.
     Sample data lives in memory. Nothing contacts a provider, reads an account or stores anything. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sotto Owl · Usage (Opus prototype)</title>
<style>
@font-face { font-family: Figtree; font-style: normal; font-weight: 300 900; font-display: swap; src: url('../../src/shared/fonts/figtree-latin.woff2') format('woff2'); }

/* Theme roles: Sotto's own palette (src/shared/themes/palettes.ts), dark half Ink and light half paper. */
:root, :root[data-theme='dark'] {
  color-scheme: dark;
  --tt-canvas: oklch(0.115 0.008 265);
  --tt-surface: oklch(0.145 0.008 265);
  --tt-surface-elevated: oklch(0.185 0.008 265);
  --tt-surface-overlay: oklch(0.215 0.008 265);
  --tt-surface-sunken: oklch(0.155 0.008 265);
  --tt-text: oklch(0.985 0.005 280);
  --tt-text-muted: oklch(0.72 0.014 265);
  --tt-text-faint: oklch(0.675 0.012 270);
  --tt-border: oklch(0.305 0.02 265);
  --tt-field-border: oklch(0.375 0.024 265);
  --tt-focus: oklch(0.714403 0.104089 183.092);
  --tt-accent: oklch(0.714403 0.104089 183.092);
  --tt-accent-text: oklch(0.83 0.08 183);
  --tt-accent-surface: oklch(0.32 0.05 185);
  --tt-warning: oklch(0.829017 0.171221 81.038);
  --tt-warning-surface: oklch(0.315 0.032 80);
  --tt-danger: oklch(0.702184 0.189226 22.228);
  --tt-danger-surface: oklch(0.29 0.04 20);
  --tt-sidebar: oklch(0.235 0.003 265);
  --tt-sidebar-text: oklch(0.985 0.005 280);
  --tt-sidebar-muted: oklch(0.72 0.014 265);
  --tt-sidebar-border: oklch(0.355 0.012 265);
  --tt-provider-codex: #d7dbe1;
  --tt-provider-claude: #e3b58e;
  --tt-provider-grok: #c9baff;
  --tt-provider-devin: #a5d8f5;
  --tt-pm-codex: var(--tt-provider-codex);
  --tt-pm-claude: var(--tt-provider-claude);
  --tt-pm-grok: var(--tt-provider-grok);
  --tt-pm-devin: var(--tt-provider-devin);
  --tt-owl-night: oklch(0.224 0.028 265);
  --tt-owl-night-field: oklch(0.185 0.026 265);
  --tt-owl-night-control: oklch(0.155 0.028 265);
  --tt-owl-night-control-on: oklch(0.185 0.028 265);
  --tt-owl-glow: color-mix(in srgb, var(--tt-accent) 11%, transparent);
  --tt-owl-star: var(--tt-sidebar-text);
  --tt-owl-o1: .62; --tt-owl-o2: .38; --tt-owl-o3: .22; --tt-owl-o4: .13;
  --tt-owl-faintest: block;
  --tt-owl-scale: 1;
  --tt-seg-bg: var(--tt-surface-sunken);
  --tt-seg-on: var(--tt-surface-overlay);
  --tt-pop-bg: var(--tt-surface-overlay);
  --tt-shadow-soft: rgb(0 0 0 / 32%);
  --tt-shadow-pop: rgb(0 0 0 / 55%);
  --tt-scrim: rgb(0 0 0 / 52%);
  --tt-chart-mid-mix: 56%;
  --tt-chart-soft-mix: 30%;
}
:root[data-theme='light'] {
  color-scheme: light;
  --tt-canvas: oklch(0.978 0.004 85);
  --tt-surface: oklch(0.99 0.003 85);
  --tt-surface-elevated: oklch(0.955 0.006 85);
  --tt-surface-overlay: oklch(0.945 0.007 85);
  --tt-surface-sunken: oklch(0.945 0.008 85);
  --tt-text: oklch(0.235 0.014 75);
  --tt-text-muted: oklch(0.5 0.014 75);
  --tt-text-faint: oklch(0.525 0.015 78);
  --tt-border: oklch(0.86 0.012 80);
  --tt-field-border: oklch(0.8 0.016 80);
  --tt-focus: oklch(0.53 0.095 186);
  --tt-accent: oklch(0.53 0.095 186);
  --tt-accent-text: oklch(0.43 0.08 186);
  --tt-accent-surface: oklch(0.92 0.03 186);
  --tt-warning: oklch(0.530927 0.155556 45.359);
  --tt-warning-surface: oklch(0.955 0.018 80);
  --tt-danger: oklch(0.509494 0.208583 28.513);
  --tt-danger-surface: oklch(0.94 0.02 25);
  --tt-sidebar: oklch(0.955 0.008 85);
  --tt-sidebar-text: oklch(0.235 0.014 75);
  --tt-sidebar-muted: oklch(0.5 0.014 75);
  --tt-sidebar-border: oklch(0.87 0.012 82);
  --tt-provider-codex: #c9ced6;
  --tt-provider-claude: #e2ad80;
  --tt-provider-grok: #bfaefc;
  --tt-provider-devin: #8fcaef;
  --tt-pm-codex: color-mix(in srgb, var(--tt-provider-codex) 50%, var(--tt-text));
  --tt-pm-claude: color-mix(in srgb, var(--tt-provider-claude) 50%, var(--tt-text));
  --tt-pm-grok: color-mix(in srgb, var(--tt-provider-grok) 50%, var(--tt-text));
  --tt-pm-devin: color-mix(in srgb, var(--tt-provider-devin) 50%, var(--tt-text));
  --tt-owl-night: color-mix(in oklab, var(--tt-sidebar) 90%, oklch(1 0.095 186));
  --tt-owl-night-field: var(--tt-surface);
  --tt-owl-night-control: var(--tt-surface-sunken);
  --tt-owl-night-control-on: var(--tt-surface-elevated);
  --tt-owl-glow: color-mix(in srgb, var(--tt-accent) 8%, transparent);
  --tt-owl-star: var(--tt-accent);
  --tt-owl-o1: .58; --tt-owl-o2: .44; --tt-owl-o3: .32; --tt-owl-o4: 0;
  --tt-owl-faintest: none;
  --tt-owl-scale: 1.2;
  --tt-seg-bg: oklch(0.93 0.01 85);
  --tt-seg-on: var(--tt-surface);
  --tt-pop-bg: var(--tt-surface);
  --tt-shadow-soft: rgb(20 24 22 / 12%);
  --tt-shadow-pop: rgb(20 24 22 / 18%);
  --tt-scrim: rgb(20 24 22 / 28%);
  --tt-chart-mid-mix: 62%;
  --tt-chart-soft-mix: 36%;
}
/* Tokens derived from the roles above. Charts take their colour from the theme's accent and text, never a fixed palette. */
:root {
  --tt-text-2: color-mix(in oklab, var(--tt-text) 55%, var(--tt-text-muted));
  --tt-hairline: var(--tt-border);
  --tt-hover: color-mix(in srgb, var(--tt-accent-surface) 70%, transparent);
  --tt-hover-soft: color-mix(in srgb, var(--tt-accent-surface) 38%, transparent);
  --tt-activity: var(--tt-accent-text);
  --tt-attention: var(--tt-warning);
  --tt-low: var(--tt-warning);
  --tt-chart-strong: var(--tt-accent);
  --tt-chart-mid: color-mix(in oklab, var(--tt-accent) var(--tt-chart-mid-mix), var(--tt-canvas));
  --tt-chart-soft: color-mix(in oklab, var(--tt-accent) var(--tt-chart-soft-mix), var(--tt-canvas));
  --tt-chart-ink: var(--tt-text-2);
  --tt-chart-track: color-mix(in oklab, var(--tt-text) 11%, var(--tt-canvas));
  --tt-chart-grid: color-mix(in oklab, var(--tt-text) 9%, var(--tt-canvas));
  --tt-chart-hatch: color-mix(in oklab, var(--tt-text) 10%, transparent);
  --tt-chart-band: color-mix(in srgb, var(--tt-accent) 20%, transparent);
  --tt-chart-band-low: color-mix(in srgb, var(--tt-warning) 20%, transparent);
  --tt-chart-refill: color-mix(in srgb, var(--tt-accent) 45%, transparent);
  --tt-ramp-1: var(--tt-accent);
  --tt-ramp-2: color-mix(in oklab, var(--tt-accent) 70%, var(--tt-canvas));
  --tt-ramp-3: color-mix(in oklab, var(--tt-accent) 48%, var(--tt-canvas));
  --tt-ramp-4: color-mix(in oklab, var(--tt-accent) 30%, var(--tt-canvas));
  --tt-ramp-5: color-mix(in oklab, var(--tt-text) 34%, var(--tt-canvas));
  --tt-ramp-6: color-mix(in oklab, var(--tt-text) 20%, var(--tt-canvas));
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { overflow: hidden; background: var(--tt-canvas); color: var(--tt-text); font: 14px/1.45 Figtree, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--tt-focus); outline-offset: 2px; }
svg { display: block; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.app { display: grid; grid-template-columns: 320px minmax(0, 1fr); grid-template-rows: 44px minmax(0, 1fr) 28px; height: 100vh; }

/* ---------- The real Threads sidebar, as an Owl build draws it beside a page ---------- */
.thread-nav { grid-row: 1 / -1; grid-column: 1; position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--tt-sidebar-border); background: var(--tt-sidebar); color: var(--tt-sidebar-text); }
.thread-nav[data-sky] { background: linear-gradient(var(--tt-owl-night) 76px, var(--tt-sidebar) 92px); }
.thread-nav__sky { position: absolute; top: 0; right: 0; left: 0; height: 92px; overflow: hidden; pointer-events: none; background: radial-gradient(130px 70px at 26px 22px, var(--tt-owl-glow), transparent 72%); }
.star { position: absolute; display: block; width: calc(var(--s) * var(--tt-owl-scale)); height: calc(var(--s) * var(--tt-owl-scale)); border-radius: 50%; background: var(--tt-owl-star); opacity: var(--o); }
.star[data-ink='accent'] { background: var(--tt-accent); }
.star[data-tier='1'] { --o: var(--tt-owl-o1); }
.star[data-tier='2'] { --o: var(--tt-owl-o2); }
.star[data-tier='3'] { --o: var(--tt-owl-o3); }
.star[data-tier='4'] { --o: var(--tt-owl-o4); display: var(--tt-owl-faintest); }
.star[data-twinkle='1'] { --tw: 11s; --tw-at: -2s; }
.star[data-twinkle='2'] { --tw: 15s; --tw-at: -9.5s; }
.star[data-twinkle='3'] { --tw: 9s; --tw-at: -4.4s; }
.star[data-twinkle='4'] { --tw: 13s; --tw-at: -6.5s; }
.star[data-twinkle] { animation: twinkle var(--tw) ease-in-out var(--tw-at) infinite; }
@keyframes twinkle { 0%, 36% { opacity: var(--o); } 54% { opacity: calc(var(--o) * .2); } 72%, 100% { opacity: var(--o); } }
.thread-nav__top { position: relative; display: flex; flex: none; align-items: center; gap: 2px; height: 44px; padding: 0 6px 0 14px; -webkit-app-region: drag; user-select: none; }
.thread-nav__brand { display: inline-flex; align-items: center; min-width: 24px; margin-right: auto; }
.thread-nav__tile { width: 24px; height: 24px; }
.nav-seg { display: inline-flex; flex: none; padding: 2px; border-radius: 8px; background: var(--tt-surface-sunken); -webkit-app-region: no-drag; }
.thread-nav__top .nav-seg { background: var(--tt-owl-night-control); }
.nav-seg button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 24px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--tt-sidebar-muted); font-size: 12.5px; }
.nav-seg--icons button { padding: 0 7px; }
.nav-seg button:hover { color: var(--tt-sidebar-text); }
.nav-seg button[aria-checked='true'], .nav-seg button[aria-selected='true'] { background: var(--tt-surface-elevated); color: var(--tt-sidebar-text); box-shadow: 0 1px 2px var(--tt-shadow-soft); }
.thread-nav__top .nav-seg button[aria-checked='true'] { background: var(--tt-owl-night-control-on); }
.nav-btn { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 7px; background: transparent; color: var(--tt-sidebar-muted); -webkit-app-region: no-drag; }
.nav-btn:hover { background: var(--tt-hover); color: var(--tt-sidebar-text); }
.threads-search { position: relative; display: flex; flex: none; align-items: center; height: 32px; margin: 0 8px 8px; color: var(--tt-sidebar-muted); }
.threads-search svg { position: absolute; top: 50%; left: 9px; translate: 0 -50%; pointer-events: none; }
.threads-search input { width: 100%; height: 100%; padding: 0 12px 0 32px; border: 1px solid var(--tt-hairline); border-radius: 8px; background: var(--tt-owl-night-field); font-size: 13px; outline: none; }
.threads-search input::placeholder { color: var(--tt-sidebar-muted); }
.threads-search input:focus-visible { outline: 2px solid var(--tt-focus); outline-offset: -1px; }
.thread-nav__scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 4px 12px; scrollbar-width: thin; scrollbar-color: var(--tt-chart-track) transparent; }
.thread-folder { margin: 0 0 14px; }
.thread-folder__toggle { display: flex; width: 100%; align-items: center; gap: 5px; min-height: 26px; padding: 0 8px 0 6px; border: 0; border-radius: 7px; background: transparent; color: var(--tt-text-2); font-size: 14px; font-weight: 500; text-align: left; }
.thread-folder__toggle:hover { background: var(--tt-hover); }
.thread-folder__toggle svg { flex: none; color: var(--tt-sidebar-muted); transition: transform .16s ease; }
.thread-folder__toggle[aria-expanded='true'] svg { transform: rotate(90deg); }
.thread-folder__count { margin-left: auto; color: var(--tt-sidebar-muted); font-size: 12px; font-weight: 400; }
.thread-folder__rows { margin: 0; padding: 0; list-style: none; }
.thread-nav__row { margin: 1px 0; border-radius: 7px; }
.thread-nav__row:hover { background: var(--tt-hover); }
.thread-nav__item { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; column-gap: 9px; row-gap: 5px; align-items: center; width: 100%; padding: 9px 10px; border: 0; border-radius: 7px; background: transparent; color: var(--tt-text-2); text-align: left; }
.thread-nav__title { overflow: hidden; font-size: 14px; font-weight: 500; line-height: 1.4; white-space: nowrap; text-overflow: ellipsis; }
.thread-nav__time { color: var(--tt-sidebar-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.thread-nav__ring { width: 10px; height: 10px; justify-self: center; border: 1.5px solid var(--tt-hairline); border-radius: 50%; }
.thread-nav__ring[data-state='working'] { border: 0; background: conic-gradient(var(--tt-activity) 0 32%, color-mix(in srgb, var(--tt-activity) 22%, transparent) 32% 100%); mask: radial-gradient(circle, transparent 38%, currentcolor 42%); animation: ring-turn 1.5s linear infinite; }
.thread-nav__ring[data-state='needs'] { border: 2px solid var(--tt-attention); }
@keyframes ring-turn { to { rotate: 360deg; } }
.thread-nav__metadata { grid-column: 2 / -1; display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--tt-sidebar-muted); font-size: 12px; }
.thread-nav__status { display: flex; align-items: center; gap: 6px; margin-left: auto; white-space: nowrap; }
.thread-nav__status i { display: none; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.thread-nav__status[data-state='working'] { color: var(--tt-activity); }
.thread-nav__status[data-state='needs'] { color: var(--tt-warning); }
.thread-nav__status:is([data-state='working'], [data-state='needs']) i { display: block; }
.thread-nav__settled { display: flex; align-items: center; gap: 6px; width: calc(100% - 8px); min-height: 30px; margin: 4px 4px 2px; padding: 0 8px 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--tt-text-muted); font-size: 12.5px; text-align: left; }
.thread-nav__settled:hover { background: var(--tt-hover); color: var(--tt-text); }
.thread-nav__foot { display: flex; flex: none; flex-wrap: wrap; align-items: center; gap: 6px 2px; padding: 8px 6px 10px; border-top: 1px solid var(--tt-hairline); }
.thread-nav__foot .nav-seg { display: grid; flex: 1 0 100%; grid-template-columns: minmax(0, 1fr) 46px minmax(0, 1fr); }
.thread-nav__foot .nav-seg button { min-width: 0; padding: 0 9px; }
.thread-nav__pages { display: flex; align-items: center; }
.thread-nav__page { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 7px; color: var(--tt-sidebar-muted); text-decoration: none; }
.thread-nav__page:hover, .thread-nav__page[aria-current='page'] { background: var(--tt-hover); color: var(--tt-sidebar-text); }
.update-control { display: grid; place-items: center; width: 30px; height: 30px; margin-left: auto; border: 0; border-radius: 50%; background: transparent; color: var(--tt-text-faint); }
.update-control:hover { background: var(--tt-hover); color: var(--tt-text); }
.pm { display: block; flex: none; fill: currentColor; }
.pm[data-provider='codex'] { color: var(--tt-pm-codex); }
.pm[data-provider='claude'] { color: var(--tt-pm-claude); }
.pm[data-provider='grok'] { color: var(--tt-pm-grok); }
.pm[data-provider='devin'] { color: var(--tt-pm-devin); }

/* ---------- The room beside it: a thin drag strip with the window controls, the page, one line of status ---------- */
.room-top { grid-row: 1; grid-column: 2; display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; -webkit-app-region: drag; user-select: none; }
.win-ctl { display: flex; gap: 2px; -webkit-app-region: no-drag; }
.win-ctl button { display: grid; place-items: center; width: 34px; height: 30px; border: 0; border-radius: 6px; background: transparent; color: var(--tt-text-muted); }
.win-ctl button:hover { background: var(--tt-hover); color: var(--tt-text); }
.room { grid-row: 2; grid-column: 2; min-height: 0; overflow: auto; container: room / inline-size; scrollbar-width: thin; scrollbar-color: var(--tt-chart-track) transparent; }
.room-foot { grid-row: 3; grid-column: 2; display: flex; align-items: center; justify-content: flex-end; min-width: 0; padding: 0 16px; color: var(--tt-text-faint); font-size: 12px; user-select: none; }
.usage { container: usage / inline-size; max-width: 1180px; margin: 0 auto; padding: 0 clamp(20px, 5cqi, 64px) 136px; }

/* ---------- Page header ---------- */
.usage-title { display: flex; align-items: center; gap: 12px; min-height: 40px; padding-top: 4px; }
.usage-title h1 { margin: 0; font-size: 28px; font-weight: 500; line-height: 1.2; letter-spacing: -1px; }
.sample { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; background: var(--tt-warning-surface); color: var(--tt-warning); font-size: 12px; font-weight: 500; }
.icon-btn { display: grid; place-items: center; width: 34px; height: 34px; margin-left: auto; border: 0; border-radius: 9px; background: transparent; color: var(--tt-text-muted); }
.icon-btn:hover, .icon-btn[aria-expanded='true'] { background: var(--tt-hover); color: var(--tt-text); }
.usage-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; margin-top: 18px; }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--tt-seg-bg); }
.seg button { height: 30px; padding: 0 14px; border: 0; border-radius: 7px; background: transparent; color: var(--tt-text-muted); font-size: 13.5px; white-space: nowrap; transition: background-color .15s, color .15s; }
.seg button:hover { color: var(--tt-text); }
.seg button[aria-selected='true'], .seg button[aria-checked='true'] { background: var(--tt-seg-on); color: var(--tt-text); box-shadow: 0 1px 2px var(--tt-shadow-soft); }
.seg--sm { padding: 2px; border-radius: 8px; }
.seg--sm button { height: 26px; padding: 0 10px; border-radius: 6px; font-size: 12.5px; }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.mbtn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px 0 13px; border: 1px solid var(--tt-hairline); border-radius: 9px; background: transparent; color: var(--tt-text-2); font-size: 13px; white-space: nowrap; }
.mbtn:hover, .mbtn[aria-expanded='true'] { background: var(--tt-hover-soft); color: var(--tt-text); }
.mbtn svg { color: var(--tt-text-muted); }
.mbtn[hidden] { display: none; }
.pop { position: fixed; z-index: 50; min-width: 190px; padding: 5px; border: 1px solid var(--tt-hairline); border-radius: 11px; background: var(--tt-pop-bg); box-shadow: 0 12px 32px var(--tt-shadow-pop); animation: pop-in .14s ease-out; }
.pop-item { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 12px 0 8px; border: 0; border-radius: 7px; background: transparent; color: var(--tt-text-2); font-size: 13px; text-align: left; white-space: nowrap; }
.pop-item:hover, .pop-item:focus-visible { background: var(--tt-hover); color: var(--tt-text); outline: none; }
.pop-item .check { visibility: hidden; color: var(--tt-accent-text); }
.pop-item[aria-selected='true'] .check { visibility: visible; }
.pop-item[data-tone='danger'] { color: var(--tt-danger); padding-left: 12px; }
@keyframes pop-in { from { opacity: 0; transform: translateY(-4px); } }

/* ---------- Shared pieces ---------- */
.panel { padding-top: 40px; outline: none; }
.h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.1px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
.link { padding: 0; border: 0; background: none; color: var(--tt-accent-text); font-size: 13px; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.dash { color: var(--tt-text-faint); }
.none { margin: 18px 0 0; color: var(--tt-text-muted); font-size: 13.5px; }
.undated { margin: 18px 0 0; color: var(--tt-text-muted); font-size: 13px; }
.undated b, .tb-note b { color: var(--tt-text); font-weight: 550; font-variant-numeric: tabular-nums; }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px; border: 1px solid var(--tt-field-border); border-radius: 8px; background: transparent; color: var(--tt-text-2); font-size: 13px; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--tt-hover-soft); color: var(--tt-text); }
.btn:disabled { opacity: .6; cursor: default; }
.btn--danger { border-color: transparent; background: var(--tt-danger-surface); color: var(--tt-danger); }
.btn--danger:hover:not(:disabled) { background: var(--tt-danger-surface); color: var(--tt-danger); filter: brightness(1.08); }

.ring-track { stroke: var(--tt-chart-track); }
.ring-arc { stroke: var(--tt-accent); }
.ring-arc--inner { stroke: var(--tt-chart-ink); }
.ring-arc.is-low { stroke: var(--tt-low); }
.ring.is-stale .ring-arc { opacity: .5; }
.ring-unknown { stroke: var(--tt-text-faint); opacity: .7; }

.chart-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.chart { --chart-h: 220px; }
.chart-plot { position: relative; height: var(--chart-h); margin-top: 22px; border-bottom: 1px solid var(--tt-border); border-radius: 2px; cursor: crosshair; outline-offset: 6px; }
.chart-cols { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: space-around; gap: var(--gap); }
.col { display: flex; flex: 1 1 0; flex-direction: column-reverse; min-width: 0; max-width: 52px; height: 100%; }
.col--off { visibility: hidden; }
.col-bar { display: block; flex: none; height: calc(var(--h) * 100%); min-height: 1px; border-radius: var(--r) var(--r) 0 0; background: var(--tt-chart-strong); transform-origin: bottom; transition: opacity .15s; }
.col-bar--in { border-radius: 0; background: var(--tt-chart-mid); }
.col-bar--out { background: var(--tt-chart-ink); }
[data-active] .col:not(.on) .col-bar { opacity: .28; }
.chart-off { position: absolute; top: 0; bottom: 0; left: 0; display: grid; place-items: center; padding: 0 8px; border-right: 1px dashed var(--tt-border); background: repeating-linear-gradient(135deg, var(--tt-chart-hatch) 0 1px, transparent 1px 8px); color: var(--tt-text-faint); font-size: 12px; text-align: center; }
.grid-l { position: absolute; right: 0; left: 0; border-top: 1px dashed var(--tt-chart-grid); pointer-events: none; }
.grid-l span { position: absolute; right: 0; bottom: 3px; padding-left: 6px; background: var(--tt-canvas); color: var(--tt-text-faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.chart-none { position: absolute; inset: 0; display: grid; place-items: center; color: var(--tt-text-muted); font-size: 13px; }
.chart-axis { position: relative; height: 20px; margin-top: 8px; color: var(--tt-text-faint); font-size: 12px; }
.chart-axis span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.chart-axis .a-start { transform: none; }
.chart-axis .a-end { transform: translateX(-100%); }
.legend-inline { display: inline-flex; align-items: center; gap: 8px 14px; color: var(--tt-text-muted); font-size: 12.5px; }
.legend-inline i { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 2px; }

.ml { display: grid; gap: 18px; margin: 20px 0 0; padding: 0; list-style: none; }
.ml-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px 16px; }
.ml-name { display: flex; align-items: center; gap: 9px; min-width: 0; font-size: 14px; font-weight: 500; }
.ml-name > span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ml-v { font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ml-v small { margin-left: 8px; color: var(--tt-text-muted); font-size: 12.5px; }
.ml-bar { grid-column: 1 / -1; height: 6px; overflow: hidden; border-radius: 6px; background: var(--tt-chart-track); }
.ml-bar i { display: block; width: calc(var(--w) * 100%); height: 100%; border-radius: inherit; background: var(--tt-chart-strong); }
.ml-sub { grid-column: 1 / -1; margin-top: -4px; color: var(--tt-text-muted); font-size: 12.5px; }
.ml-more { margin: 16px 0 0; color: var(--tt-text-muted); font-size: 13px; }

.tb { container: tb / inline-size; margin-top: 22px; }
.tb-brackets { display: flex; gap: 4px; height: 30px; }
.tb-br { position: relative; flex-basis: 0; min-width: 8px; color: var(--tt-text-muted); font-size: 13px; white-space: nowrap; }
.tb-br::after { content: ''; position: absolute; right: 0; bottom: 3px; left: 0; height: 6px; border: 1px solid var(--tt-text-faint); border-bottom: 0; border-radius: 3px 3px 0 0; opacity: .65; }
.tb-br > span { position: absolute; top: 0; left: 0; }
.tb-br--out > span { right: 0; left: auto; }
.tb-br b { margin-right: 5px; color: var(--tt-text); font-weight: 550; font-variant-numeric: tabular-nums; }
.tb-bar { display: flex; gap: 4px; height: 16px; }
.tb--lg .tb-bar { height: 22px; }
.tb-grp { display: flex; flex-basis: 0; gap: 2px; min-width: 8px; overflow: hidden; border-radius: 5px; }
.tb-seg { flex-basis: 0; min-width: 2px; }
.tb-read { background: var(--tt-chart-strong); }
.tb-write { background: var(--tt-chart-mid); }
.tb-new { background: var(--tt-chart-soft); }
.tb-out { background: var(--tt-chart-ink); }
.tb-legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 20px; margin: 22px 0 0; }
.tb-legend dt { display: flex; align-items: center; gap: 7px; color: var(--tt-text-muted); font-size: 12.5px; white-space: nowrap; }
.tb-legend dt i { flex: none; width: 8px; height: 8px; border-radius: 2px; }
.tb-legend dd { margin: 4px 0 0; font-size: 19px; font-weight: 450; letter-spacing: -.3px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tb-legend dd small { color: var(--tt-text-muted); font-size: 12.5px; font-weight: 400; letter-spacing: 0; }
.tb-note { margin: 16px 0 0; color: var(--tt-text-muted); font-size: 13px; }
@container tb (max-width: 470px) { .tb-legend { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.about { max-width: 760px; margin-top: 76px; }
.about summary { display: inline-flex; align-items: center; gap: 6px; margin-left: -4px; padding: 2px 4px; border-radius: 6px; color: var(--tt-text-muted); font-size: 13px; list-style: none; cursor: pointer; }
.about summary::-webkit-details-marker { display: none; }
.about summary:hover { color: var(--tt-text); }
.about summary svg { transition: transform .15s; }
.about[open] summary svg { transform: rotate(90deg); }
.about ul { display: grid; gap: 8px; margin: 12px 0 0; padding: 0 0 0 20px; color: var(--tt-text-muted); font-size: 13px; line-height: 1.55; }

.empty { display: grid; justify-items: start; gap: 6px; margin-top: 64px; }
.empty-art { display: flex; align-items: flex-end; gap: 6px; height: 48px; margin-bottom: 16px; }
.empty-art i { width: 10px; border-radius: 3px 3px 0 0; background: var(--tt-chart-track); }
.empty h2 { margin: 0; font-size: 20px; font-weight: 500; letter-spacing: -.4px; }
.empty p { margin: 0; color: var(--tt-text-muted); }

/* ---------- A · Readout ---------- */
.glance { display: flex; flex-wrap: wrap; gap: 6px 26px; margin: 0 -8px; }
.gauge { display: flex; align-items: center; gap: 11px; padding: 6px 12px 6px 8px; border: 0; border-radius: 10px; background: transparent; text-align: left; }
.gauge:hover { background: var(--tt-hover-soft); }
.gauge-name { display: block; font-size: 13.5px; font-weight: 500; }
.gauge-sub { display: block; color: var(--tt-text-muted); font-size: 12.5px; white-space: nowrap; }
.gauge-sub b { color: var(--tt-text); font-weight: 600; font-variant-numeric: tabular-nums; }
.gauge-sub b[data-low] { color: var(--tt-low); }
.readout { margin-top: 46px; }
.readout-when { display: flex; align-items: center; gap: 14px; min-height: 24px; color: var(--tt-text-muted); font-size: 13.5px; }
.readout-figs { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 56px; margin-top: 6px; }
.fig-v { display: block; font-size: 36px; font-weight: 450; line-height: 1.1; letter-spacing: -1.2px; font-variant-numeric: tabular-nums; }
.fig--lead .fig-v { font-size: 66px; font-weight: 400; line-height: 1; letter-spacing: -2.6px; }
.fig-l { display: block; margin-top: 8px; color: var(--tt-text-muted); font-size: 13px; }
.fig-l em { color: var(--tt-text-faint); font-style: normal; }
.a-chart { margin-top: 40px; }
.a-chart .chart { --chart-h: 236px; }
.deck { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 64px; margin-top: 66px; }

/* ---------- B · Lanes ---------- */
.bsum { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 48px; }
.bsum-lead b { display: block; font-size: 58px; font-weight: 400; line-height: 1; letter-spacing: -2.2px; font-variant-numeric: tabular-nums; }
.bsum-lead span { display: block; margin-top: 8px; color: var(--tt-text-muted); font-size: 13px; }
.bsum-rest { display: flex; flex-wrap: wrap; gap: 8px 28px; padding-bottom: 2px; color: var(--tt-text-muted); font-size: 13.5px; }
.bsum-rest b { margin-right: 6px; color: var(--tt-text); font-size: 22px; font-weight: 450; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.lanes { --id-w: 196px; margin-top: 52px; border-radius: 4px; outline-offset: 10px; }
.lanes-top, .lane, .lanes-axis { display: grid; grid-template-columns: var(--id-w) minmax(0, 1fr); gap: 0 28px; }
.lanes-heads, .la { display: flex; }
.lh-past, .la-past { position: relative; flex: var(--past) 1 0; min-width: 0; }
.lh-run, .la-run { position: relative; flex: 7 1 0; min-width: 84px; }
.lh-past { color: var(--tt-text-muted); font-size: 13px; }
.lh-run { padding-left: 8px; color: var(--tt-text-muted); font-size: 13px; white-space: nowrap; }
.lane { margin-top: 30px; }
.lanes-top + .lane { margin-top: 18px; }
.lane-id { display: flex; flex-direction: column; justify-content: flex-end; min-width: 0; }
.lane-name { display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; margin-left: -6px; padding: 2px 6px; border: 0; border-radius: 6px; background: none; font-size: 14px; font-weight: 500; }
.lane-name:hover { background: var(--tt-hover-soft); }
.lane-num { margin-top: 5px; font-size: 24px; font-weight: 450; line-height: 1.1; letter-spacing: -.6px; font-variant-numeric: tabular-nums; }
.lane-num small { margin-left: 6px; color: var(--tt-text-muted); font-size: 13px; font-weight: 400; letter-spacing: 0; }
.lane-note { margin-top: 3px; overflow: hidden; color: var(--tt-text-muted); font-size: 12.5px; white-space: nowrap; text-overflow: ellipsis; }
.lane-note[data-low] { color: var(--tt-low); }
.lane-plot { display: flex; height: 76px; }
.lane-past { position: relative; flex: var(--past) 1 0; min-width: 0; border-bottom: 1px solid var(--tt-border); cursor: crosshair; }
.lane-past .chart-off { border-right: 0; }
.lane-now { position: relative; z-index: 1; width: 0; margin-top: -8px; border-left: 1.5px solid var(--tt-text-2); }
.lane-run { position: relative; flex: 7 1 0; min-width: 84px; border-bottom: 1px dashed var(--tt-border); }
.band { position: absolute; bottom: 0; left: 0; width: var(--until); height: var(--level); border-top: 2px solid var(--tt-accent); background: var(--tt-chart-band); }
.band[data-low] { border-top-color: var(--tt-low); background: var(--tt-chart-band-low); }
.refill { position: absolute; top: 0; right: 0; bottom: 0; left: var(--until); border: 1px dashed var(--tt-chart-refill); border-bottom: 0; border-radius: 4px 4px 0 0; }
.band-label { position: absolute; bottom: calc(min(var(--level), 64%) + 5px); left: 7px; font-size: 12.5px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.band-label[data-low] { color: var(--tt-low); }
.reset-at { position: absolute; top: calc(100% + 5px); left: var(--until); transform: translateX(-50%); color: var(--tt-text-muted); font-size: 12px; white-space: nowrap; }
.reset-at.is-end { transform: translateX(-100%); }
.run-unknown { position: absolute; inset: 10px 0 0 0; display: grid; place-items: center; border: 1px dashed var(--tt-text-faint); border-bottom: 0; border-radius: 4px 4px 0 0; color: var(--tt-text-faint); font-size: 12px; opacity: .85; }
.lanes-axis { margin-top: 34px; }
.la-past, .la-run { height: 20px; color: var(--tt-text-faint); font-size: 12px; }
.la-past span, .la-run span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.la-past .a-start { transform: none; }
.la-past .a-end { display: none; }
.la-run span:first-child { left: 0; }
.la-run span:last-child { right: 0; transform: none; }
.ribbons { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 64px; margin-top: 76px; }
.rib { display: flex; gap: 3px; height: 16px; margin-top: 22px; }
.rib i { flex-basis: 0; min-width: 4px; border-radius: 4px; }
[data-rank='1'] { background: var(--tt-ramp-1); }
[data-rank='2'] { background: var(--tt-ramp-2); }
[data-rank='3'] { background: var(--tt-ramp-3); }
[data-rank='4'] { background: var(--tt-ramp-4); }
[data-rank='5'] { background: var(--tt-ramp-5); }
[data-rank='6'] { background: var(--tt-ramp-6); }
.rib-legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 24px; margin: 20px 0 0; padding: 0; list-style: none; }
.rib-legend li { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; align-items: center; gap: 9px; font-size: 13.5px; }
.rib-legend li i { width: 8px; height: 8px; border-radius: 2px; }
.rib-legend li span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rib-legend li b { font-weight: 500; font-variant-numeric: tabular-nums; }

/* ---------- C · Focus ---------- */
.focus { display: grid; grid-template-columns: 252px minmax(0, 1fr); align-items: start; gap: 52px; }
.fi-list { display: flex; flex-direction: column; gap: 2px; margin-left: -16px; }
.fi { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 3px 14px; width: 100%; padding: 14px 16px; border: 0; border-radius: 12px; background: transparent; text-align: left; }
.fi:hover { background: var(--tt-hover-soft); }
.fi[aria-selected='true'] { background: var(--tt-hover); }
.fi[aria-selected='true']::before { content: ''; position: absolute; top: 14px; bottom: 14px; left: 0; width: 3px; border-radius: 3px; background: var(--tt-accent); }
.fi-l { grid-column: 1 / -1; color: var(--tt-text-muted); font-size: 12.5px; }
.fi-v { min-width: 0; overflow: hidden; font-size: 27px; font-weight: 450; line-height: 1.15; letter-spacing: -.9px; font-variant-numeric: tabular-nums; white-space: nowrap; text-overflow: ellipsis; }
.fi-v--text { padding-top: 4px; font-size: 18px; font-weight: 500; letter-spacing: -.3px; }
.fi-v[data-low] { color: var(--tt-low); }
.fi-viz { align-self: center; color: var(--tt-accent); }
.fi-s { grid-column: 1 / -1; overflow: hidden; color: var(--tt-text-muted); font-size: 12.5px; white-space: nowrap; text-overflow: ellipsis; }
.mini-rings { display: flex; gap: 4px; }
.stage { min-width: 0; padding-top: 12px; }
.stage-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.stage-head h2 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -.5px; }
.stage-head > span { color: var(--tt-text-muted); font-size: 13px; }
.stage-when { min-height: 20px; margin: 8px 0 0; color: var(--tt-text-muted); font-size: 13.5px; }
.stage-when b { color: var(--tt-text); font-weight: 550; font-variant-numeric: tabular-nums; }
.stage .chart { --chart-h: 230px; }
.stage-sub { margin-top: 44px; }
.stage-sub .chart { --chart-h: 160px; }
.split { display: flex; flex-wrap: wrap; gap: 14px 36px; margin-top: 30px; }
.split-i { display: grid; gap: 4px; }
.split-i span { display: flex; align-items: center; gap: 7px; color: var(--tt-text-muted); font-size: 12.5px; }
.split-i b { font-size: 22px; font-weight: 450; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
.origin { margin: 30px 0 0; color: var(--tt-text-muted); font-size: 13px; }
.rings { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 36px 24px; margin-top: 32px; }
.rc-ring { position: relative; width: 116px; height: 116px; }
.rc-ring--xl { width: 156px; height: 156px; }
.rc-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.rc-center b { font-size: 26px; font-weight: 450; letter-spacing: -.8px; font-variant-numeric: tabular-nums; }
.rc-ring--xl .rc-center b { font-size: 34px; letter-spacing: -1.2px; }
.rc-center b[data-low] { color: var(--tt-low); }
.rc-center span { color: var(--tt-text-muted); font-size: 12px; }
.rc-name { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 14px; font-weight: 500; }
.rc-rows { display: grid; gap: 4px; margin: 8px 0 0; padding: 0; color: var(--tt-text-muted); font-size: 12.5px; list-style: none; }
.rc-rows li { display: flex; align-items: center; gap: 7px; }
.rc-rows b { color: var(--tt-text); font-weight: 550; font-variant-numeric: tabular-nums; }
.rc-rows b[data-low] { color: var(--tt-low); }
.dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--tt-accent); }
.dot--inner { background: var(--tt-chart-ink); }
.rc-fresh { color: var(--tt-text-faint); }
.cache-wrap { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 48px; margin-top: 30px; }
.cache-lead { margin: 0; color: var(--tt-text-2); font-size: 14px; }
.pc { display: grid; grid-template-columns: 34px repeat(24, minmax(0, 1fr)); gap: 3px; margin-top: 26px; border-radius: 4px; outline-offset: 6px; }
.pc-d { align-self: center; color: var(--tt-text-muted); font-size: 12px; }
.pc-c { position: relative; aspect-ratio: 1; border-radius: 3px; background: var(--tt-chart-track); }
.pc-c::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: var(--tt-accent); opacity: var(--a); }
.pc-c.on { outline: 1.5px solid var(--tt-text); outline-offset: 1px; }
.pc-h { position: relative; grid-column: 2 / -1; height: 18px; margin-top: 4px; color: var(--tt-text-faint); font-size: 12px; }
.pc-h span { position: absolute; top: 0; white-space: nowrap; }

/* ---------- Subscriptions ---------- */
.subs-intro { max-width: 64ch; margin: 0; color: var(--tt-text-muted); font-size: 13.5px; }
.sub { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 22px 56px; margin-top: 58px; scroll-margin-top: 20px; }
.sub-id { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
.sub-name { display: flex; align-items: center; gap: 12px; }
.sub-name h2 { margin: 0; font-size: 19px; font-weight: 500; letter-spacing: -.3px; outline-offset: 4px; }
.sub-acct { margin: 2px 0 0; color: var(--tt-text-muted); font-size: 13px; }
.sub-fresh { display: flex; align-items: center; gap: 7px; color: var(--tt-text-muted); font-size: 12.5px; }
.sub-fresh[data-stale] { color: var(--tt-warning); }
.sub-how, .sub-other { margin: 0; color: var(--tt-text-muted); font-size: 12.5px; }
.sub-other b { color: var(--tt-text-2); font-weight: 550; }
.win + .win { margin-top: 30px; }
.win-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.win-label { color: var(--tt-text-2); font-size: 14px; }
.win-left { color: var(--tt-text-muted); font-size: 13.5px; white-space: nowrap; }
.win-left b { margin-right: 5px; color: var(--tt-text); font-size: 28px; font-weight: 450; letter-spacing: -.8px; font-variant-numeric: tabular-nums; }
.win-left b[data-low] { color: var(--tt-low); }
.win-track { position: relative; height: 10px; margin-top: 10px; border-radius: 6px; background: var(--tt-chart-track); }
.win-fill { position: absolute; top: 0; bottom: 0; left: 0; width: var(--w); border-radius: 6px; background: var(--tt-accent); }
.win-fill[data-low] { background: var(--tt-low); }
.win-now { position: absolute; top: -6px; bottom: -6px; left: var(--x); width: 2px; margin-left: -1px; border-radius: 2px; background: var(--tt-text); }
.win-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; margin-top: 12px; color: var(--tt-text-muted); font-size: 12.5px; }
.sub-none { display: flex; align-items: center; gap: 22px; }
.sub-none p { max-width: 46ch; margin: 0 0 12px; color: var(--tt-text-2); font-size: 14px; }
.sub-act { margin: 26px 0 0; color: var(--tt-text-muted); font-size: 13px; }
.sub-act b { color: var(--tt-text); font-weight: 550; font-variant-numeric: tabular-nums; }

/* ---------- Models ---------- */
.mt-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.mt-summary { margin: 0; color: var(--tt-text-muted); font-size: 14px; }
.mt-summary b { color: var(--tt-text); font-weight: 550; font-variant-numeric: tabular-nums; }
.mt-sort { display: flex; align-items: center; gap: 10px; color: var(--tt-text-muted); font-size: 13px; }
.mt { margin: 26px -14px 0; }

<script>

  { id: 'codex', name: 'Codex', account: 'ChatGPT through Codex' },
  { id: 'claude', name: 'Claude Code', account: 'Claude Code subscription' },
  { id: 'grok', name: 'Grok Build', account: 'Grok subscription' },
  { id: 'devin', name: 'Devin', account: 'Devin account' },

const MODELS = [
  { id: 'astra', name: 'GPT-6 Astra', provider: 'codex', weight: 44, perPrompt: 54000, out: .082, read: .79, write: null, forge: .3 },
  { id: 'opus', name: 'Claude Opus 5.5', provider: 'claude', weight: 17, perPrompt: 63000, out: .068, read: .74, write: .07, forge: .24 },
  { id: 'sonnet', name: 'Claude Sonnet 5.5', provider: 'claude', weight: 15, perPrompt: 39000, out: .088, read: .7, write: .08, forge: .2 },
  { id: 'fable', name: 'Claude Fable 5.1', provider: 'claude', weight: 6, perPrompt: 31000, out: .1, read: .62, write: .09, forge: 0 },
  { id: 'grok47', name: 'Grok 4.7', provider: 'grok', weight: 12, perPrompt: 42000, out: .079, read: .57, write: null, forge: 0, from: 18 },
  { id: 'devin', name: 'Devin default', provider: 'devin', weight: 6, perPrompt: null, forge: 0 },
];

    input = Math.round(prompts * m.perPrompt * (.8 + rand() * .4));
    read = Math.round(input * m.read * (.94 + rand() * .08));
    write = m.write === null ? null : Math.round(input * m.write * (.8 + rand() * .4));

  }
  const watcher = m.provider === 'codex' || m.provider === 'claude' ? Math.round(prompts * rand() * .12) : 0;
  const wake = m.provider === 'codex' ? Math.round(prompts * rand() * .06) : 0;
  const side = m.provider === 'devin' ? 0 : Math.round(prompts * (.1 + rand() * .08));
  const pool = POOLS[m.provider]; const k = Math.min(pool, 1 + Math.floor(prompts / 8));
  const base = Math.floor((day - TRACK) / 4) * 2 + (host === 'forge' ? 11 : 0);
  const threads = Array.from({ length: k }, (_, j) => `${m.provider}-${(base + j * 3) % pool}`);

const RECORDS = [];
for (let day = TRACK; day < DAY_COUNT; day++) {
  const t = (day - TRACK) / (DAY_COUNT - 1 - TRACK);
  let total = WEEKDAY_BASE[DAYS[day].getDay()] * (.86 + .3 * t) * (.78 + rand() * .44);

  const weights = live.reduce((n, m) => n + m.weight, 0);
  for (const m of live) {
    const prompts = Math.round(total * m.weight / weights * (.7 + rand() * .6));
    if (!prompts) continue;
    const forge = m.forge ? Math.min(prompts, Math.round(prompts * m.forge * (.6 + rand() * .8))) : 0;

/* Token totals the ledger held before dated tracking began: real numbers, no dates. */
const UNDATED = [
  { provider: 'codex', host: 'local', input: 24.8e6, output: 2.0e6 },

const LIMITS = {
  codex: {
    local: { kind: 'read', age: 0, windows: [W('5 hours', '5-hour window', 300, 38, inMinutes(136)), W('Week', 'weekly window', 10080, 81, at(9, 16, 9, 0))] },
    forge: { kind: 'read', age: 4, windows: [W('5 hours', '5-hour window', 300, 37, inMinutes(136)), W('Week', 'weekly window', 10080, 81, at(9, 16, 9, 0))] },
  },
  claude: {
    local: { kind: 'seen', age: 12, windows: [W('5 hours', '5-hour window', 300, 54, at(9, 12, 16, 10)), W('Week', 'weekly window', 10080, 38, at(9, 15, 11, 30)), W('Opus, week', 'weekly Opus window', 10080, 29, at(9, 15, 11, 30))] },
    forge: { kind: 'seen', age: 125, windows: [W('5 hours', '5-hour window', 300, 49, at(9, 12, 16, 10)), W('Week', 'weekly window', 10080, 37, at(9, 15, 11, 30))] },
  },
  grok: { local: { kind: 'read', age: 6, windows: [W('Week', 'weekly window', 10080, 28, at(9, 15, 17, 0))] } },
  devin: { local: { kind: 'none' } },

/* ============ State ============ */
const state = { variant: 'A', tab: 'overview', range: '30', provider: 'all', host: 'all', theme: 'dark', motion: false, metric: 'prompts', hover: null, pin: null, focus: 'prompts', sort: 'prompts', openModel: null, cell: null, cleared: false };
{
  const q = new URLSearchParams(location.search);

  const t = q.get('tab'); if (['overview', 'subscriptions', 'models'].includes(t)) state.tab = t;

/* ============ Helpers ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const fmtInt = n => Math.round(n).toLocaleString('en-US');
function fmtTok(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e8) return Math.round(n / 1e6) + 'M';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return Math.round(n / 1e3) + 'K';

}
const pct = x => Math.round(x * 100) + '%';
const DASH = '<span class="dash"><span aria-hidden="true">—</span><span class="vh">Not reported</span></span>';
const short = d => `${MONTHS[d.getMonth()]} ${d.getDate()}`;
function clock(d) { const h = d.getHours(), m = d.getMinutes(); return `${h % 12 || 12}:${String(m).padStart(2, '0')} ${h >= 12 ? 'PM' : 'AM'}`; }

/* ============ Shared views ============ */
function ringSVG(size, rings, { stale = false, lowAware = true } = {}) {

    if (g.pct === null) return `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke-width="${g.w}" class="ring-unknown" stroke-dasharray="1.5 ${Math.max(3, g.w + 1.5)}" stroke-linecap="round"/>`;
    const low = lowAware && g.pct <= LOW;
    return `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke-width="${g.w}" class="ring-track"/><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke-width="${g.w}" class="ring-arc${g.inner ? ' ring-arc--inner' : ''}${low ? ' is-low' : ''}" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - g.pct / 100)).toFixed(2)}" style="--c:${C.toFixed(2)}" transform="rotate(-90 ${c} ${c})"/>`;
  }).join('');

}

  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" focusable="false"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function axisLabels(series, { lanes = false } = {}) {
  const n = series.length; let idx;

  else { const t = series.findIndex(d => d.day === TRACK); idx = t > 0 ? [0, t, n - 1] : [0, Math.round((n - 1) / 2), n - 1]; }
  return idx.map((i, k) => {
    const d = DAYS[series[i].day]; const today = series[i].day === DAY_COUNT - 1;
    const text = today ? 'Today' : n <= 7 ? `${WD_SHORT[d.getDay()]} ${d.getDate()}` : short(d);
    const edge = n > 7 && (k === 0 || k === idx.length - 1);
    const left = edge ? (k === 0 ? 0 : 100) : (i + .5) / n * 100;
    const cls = n > 7 && k === 0 ? 'a-start' : n > 7 && k === idx.length - 1 ? 'a-end' : '';

}

  const val = d => metric === 'prompts' ? d.prompts : d.input + d.output;
  const peak = Math.max(0, ...series.filter(d => d.tracked).map(val));
  const max = niceMax(Math.max(metric === 'prompts' ? 10 : 1e5, peak));
  const gap = n <= 7 ? 18 : n <= 45 ? 4 : 2; const radius = n > 60 ? 1 : n > 20 ? 3 : 5;
  const cols = series.map((d, i) => !d.tracked ? '<span class="col col--off"></span>' : metric === 'prompts'
    ? `<span class="col" data-i="${i}"><i class="col-bar" style="--h:${(d.prompts / max).toFixed(4)};--d:${i}"></i></span>`
    : `<span class="col" data-i="${i}"><i class="col-bar col-bar--in" style="--h:${(d.input / max).toFixed(4)};--d:${i}"></i><i class="col-bar col-bar--out" style="--h:${(d.output / max).toFixed(4)};--d:${i}"></i></span>`).join('');

function about() {

  document.body.appendChild(scrim);
  const done = clear => { scrim.remove(); if (clear) { state.cleared = true; state.hover = state.pin = null; state.openModel = null; render(); } back.focus(); };
  scrim.addEventListener('click', e => { if (e.target === scrim) done(false); const a = e.target.closest('[data-act]'); if (a) done(a.dataset.act === 'clear'); });
  scrim.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(false); }
    if (e.key === 'Tab') { const b = $$('button', scrim); const i = b.indexOf(document.activeElement); e.preventDefault(); b[(i + (e.shiftKey ? -1 : 1) + b.length) % b.length].focus(); }
  });
  $('[data-act="cancel"]', scrim).focus();
}

/* ============ Events ============ */
document.addEventListener('pointerdown', e => { if (menu && !menu.pop.contains(e.target) && !menu.btn.contains(e.target)) closeMenu(false); });
$('#room').addEventListener('scroll', () => closeMenu(false), { passive: true });
addEventListener('resize', () => closeMenu(false));

document.addEventListener('click', e => {
  const plotHit = e.target.closest('.chart-plot, .lane-past');
  if (plotHit && state.tab === 'overview') { const day = state.hover; state.pin = day === null || state.pin === day ? null : day; state.hover = null; updateLinked(); return; }
  const t = e.target.closest('button, a'); if (!t) return;
  if (t.closest('#sidebar, .room-top')) {
    if (t.tagName === 'A') e.preventDefault();
    if (t.matches('.thread-folder__toggle')) { const open = t.getAttribute('aria-expanded') !== 'true'; t.setAttribute('aria-expanded', String(open)); t.nextElementSibling.hidden = !open; }
    return;
  }
  const d = t.dataset;
  if (d.tab) { if (d.tab !== state.tab) setTab(d.tab, false); return; }
  if (d.menu) { if (menu && menu.btn === t) closeMenu(true); else openMenu(t); return; }
  if (d.metric) { state.metric = d.metric; state.hover = state.pin = null; const c = $('#a-chart'); c.innerHTML = chartA(); enter(c); updateLinked(); refocus(`[data-metric="${d.metric}"]`); return; }
  if ('unpin' in d) { state.pin = null; updateLinked(); refocus('#a-chart .chart-plot'); return; }
  if (d.gotoTab) { setTab(d.gotoTab, true); return; }
  if (d.gotoSub) { setTab('subscriptions', false); const sec = $(`#sub-${d.gotoSub}`); if (sec) { sec.scrollIntoView({ block: 'start', behavior: state.motion || matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); $(`#sub-h-${d.gotoSub}`).focus({ preventScroll: true }); } return; }
  if (d.focus) { if (d.focus !== state.focus) setFocusItem(d.focus); return; }
  if (d.laneFilter) { state.provider = state.provider === d.laneFilter ? 'all' : d.laneFilter; state.hover = state.pin = null; render(); refocus(`[data-lane-filter="${d.laneFilter}"]`); return; }
  if (d.sort) { state.sort = d.sort; $('#panel').innerHTML = view(); refocus(`[data-sort="${d.sort}"]`); return; }
  if (d.model) { state.openModel = state.openModel === d.model ? null : d.model; $('#panel').innerHTML = view(); refocus(`[data-model="${d.model}"]`); return; }
  if (d.reread) {
    const id = d.reread; t.disabled = true; t.textContent = 'Reading…';
    setTimeout(() => { const L = limitFor(id); if (LIMITS[id][L.host]) LIMITS[id][L.host].age = 0; const sec = $(`#sub-${id}`); if (sec) sec.outerHTML = subBlock(PROVIDERS.find(p => p.id === id)); refocus(`[data-reread="${id}"]`); announce(`${providerName(id)} limits read just now`); }, 650);
    return;
  }
  if (t.id === 'prev' || t.id === 'next') { cycle(t.id === 'next' ? 1 : -1); return; }
  if (t.id === 'theme') { state.theme = state.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = state.theme; t.textContent = state.theme === 'dark' ? 'Use light' : 'Use dark'; const u = new URL(location.href); u.searchParams.set('theme', state.theme); history.replaceState(null, '', u); return; }
  if (t.id === 'motion') { state.motion = !state.motion; document.documentElement.dataset.reducedMotion = state.motion ? 'on' : 'off'; t.setAttribute('aria-pressed', String(state.motion)); return; }
  if (t.id === 'restore') { state.cleared = false; render(); refocus('[data-menu="more"]'); }
});

const panelEl = $('#panel');
panelEl.addEventListener('pointermove', e => {
  if (state.tab !== 'overview' || state.cleared) return;
  const cell = e.target.closest('.pc-c');
  if (cell) { const wd = +cell.dataset.wd, h = +cell.dataset.h; if (!state.cell || state.cell.wd !== wd || state.cell.h !== h) { state.cell = { wd, h }; $$('.pc-c.on').forEach(c => c.classList.remove('on')); cell.classList.add('on'); $('#c-when').innerHTML = cWhen(); } return; }
  const host = e.target.closest('.chart-plot, .lane-past');
  if (!host) { if (state.hover !== null) { state.hover = null; updateLinked(); } return; }
  const ctx = host.matches('.chart-plot') ? host : host.closest('.lanes');
  const r = host.getBoundingClientRect(); const n = +ctx.dataset.n;
  const i = Math.max(0, Math.min(n - 1, Math.floor((e.clientX - r.left) / r.width * n)));
  const day = +ctx.dataset.from + i; const next = day >= TRACK ? day : null;
  if (next !== state.hover) { state.hover = next; updateLinked(); }
});
panelEl.addEventListener('pointerleave', () => {
  if (state.hover !== null) { state.hover = null; updateLinked(); }
  if (state.cell && state.focus === 'rhythm' && document.activeElement !== $('.pc')) { state.cell = null; $$('.pc-c.on').forEach(c => c.classList.remove('on')); const w = $('#c-when'); if (w) w.innerHTML = cWhen(); }
});
panelEl.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches('.chart-plot, .lanes')) {
    const sp = span(); const lo = Math.max(sp.from, TRACK), hi = sp.to; let cur = state.pin ?? state.hover;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') cur = cur === null ? hi : Math.max(lo, Math.min(hi, cur + (e.key === 'ArrowRight' ? 1 : -1)));
    else if (e.key === 'Home') cur = lo; else if (e.key === 'End') cur = hi;
    else if (e.key === 'Escape' && state.pin !== null) cur = null;
    else return;
    e.preventDefault(); e.stopPropagation(); state.hover = null; state.pin = cur; updateLinked();
    announce(cur === null ? `Whole range, ${fmtInt(sum(pick(sp)).prompts)} prompts` : `${dayLabel(cur)}: ${fmtInt(sum(pick({ from: cur, to: cur })).prompts)} prompts`);
    return;
  }
  if (t.matches('.pc')) {
    let { wd, h } = state.cell || { wd: 0, h: 9 };
    if (e.key === 'ArrowLeft') h = Math.max(0, h - 1); else if (e.key === 'ArrowRight') h = Math.min(23, h + 1);
    else if (e.key === 'ArrowUp') wd = Math.max(0, wd - 1); else if (e.key === 'ArrowDown') wd = Math.min(6, wd + 1);
    else if (e.key === 'Escape' && state.cell) { e.preventDefault(); state.cell = null; $$('.pc-c.on').forEach(c => c.classList.remove('on')); $('#c-when').innerHTML = cWhen(); return; }
    else return;
    e.preventDefault(); state.cell = { wd, h };
    $$('.pc-c.on').forEach(c => c.classList.remove('on')); $(`.pc-c[data-wd="${wd}"][data-h="${h}"]`).classList.add('on');
    const w = $('#c-when'); w.innerHTML = cWhen(); announce(w.textContent);
    return;
  }
  if (e.key === 'Escape' && state.openModel && t.closest('.mt-row')) { const id = state.openModel; state.openModel = null; $('#panel').innerHTML = view(); refocus(`[data-model="${id}"]`); }
});

/* Tabs and radio groups in the page: one Tab stop, arrow keys move and choose. */
document.addEventListener('keydown', e => {
  const group = e.target.closest('[role="tablist"], [role="radiogroup"]');
  if (!group || group.closest('#sidebar')) return;
  if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(e.key)) return;
  const items = $$('[role="tab"], [role="radio"]', group); const i = items.indexOf(e.target.closest('[role="tab"], [role="radio"]'));
  if (i < 0) return;
  e.preventDefault();
  const next = items[e.key === 'Home' ? 0 : e.key === 'End' ? items.length - 1 : (i + (e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length];
  const key = ['tab', 'metric', 'sort', 'focus'].find(k => next.dataset[k] !== undefined);
  const selector = `[data-${key}="${next.dataset[key]}"]`;
  next.click(); refocus(selector);
});
/* A filter button opens its list from the keyboard as well as by press. */
document.addEventListener('keydown', e => {
  const b = e.target.closest('[data-menu]');
  if (b && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && !menu) { e.preventDefault(); openMenu(b); }
});
/* Left and Right switch layouts anywhere that doesn't use the arrows itself. */
document.addEventListener('keydown', e => {
  if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey || menu || $('.scrim')) return;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  if (e.target.closest('input, textarea, select, [role="tablist"], [role="radiogroup"], [data-own-arrows], #sidebar')) return;
  e.preventDefault(); cycle(e.key === 'ArrowRight' ? 1 : -1);
});
document.addEventListener('input', e => {
  if (e.target.id !== 'thread-search') return;
  const q = e.target.value.trim().toLowerCase();
  $$('.thread-nav__row').forEach(row => { row.hidden = q !== '' && !row.textContent.toLowerCase().includes(q); });
});

drawSidebar();
render();
</script>
</body>
</html>
