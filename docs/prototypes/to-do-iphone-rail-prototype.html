<!doctype html>
<!--
  PROTOTYPE - throwaway. Not shipped, not tested, not wired to anything. Nothing here is saved.

  Question: Zach's picks (ADR-0188, tag prototype/to-do-scroll) leave two things open on the phone, once #2126's real rail is measured.
    1. Duo sideways with a thread and Agents: the rail has 8 points left and the tile needs 44. Variants A, B, C.
    2. Other iPhones: most pages have no bar for "top right of the bar" to mean. Variants A, B.
  Zach's picks (November 4, 2026): question 1 A, the to-do tile takes the sidebar button's place while both pills are full; question 2 A, in each page's heading, and in the top corner on Watcher.
  Settled by his earlier picks and only shown for reference: the Duo folded and upright, and sideways without Agents.

  Frames come from the app: Duo sideways 951x669 with an 84-point strip and the clock's first 124; tiles 50 in a pill with 5 of inset,
  so four are 216; circles 44. Other iPhones are 393x852 and 375x667.
  URL params: q=1|2|bar, variant=A|B|C, theme=dark|light, phone=393|375, page=threads|settings|watcher, agents=0|1.
-->

const q=new URLSearchParams(location.search)
const S={q:q.get('q')||'1',variant:q.get('variant')||'A',theme:q.get('theme')||'dark',phone:+(q.get('phone')||393),page:q.get('page')||'threads',agents:q.get('agents')!=='0',open:false,items:3,fresh:1,scrolled:false}
const $=s=>document.querySelector(s)
const VARIANTS={'1':{A:'A: it takes the sidebar button\'s place',B:'B: beside + in the sidebar\'s heading',C:'C: floats at the page\'s corner'},'2':{A:'A: in each page\'s heading',B:'B: pinned at the top right'},bar:{A:'A thread\'s bar, all controls'}}
const SAY={
 '1':'<b>Question 1, the Duo held sideways, a thread open, Agents showing.</b> The rail is 635 tall and the clock takes 124. Two full pills leave 8 points, and the tile needs 44. <b>Without Agents it fits as you picked</b>, so switch Agents off to compare: this is only about when both pills are full. In A, a delegated thread that also has Agents keeps Back in that spot, and To-do moves into its ••• menu, since nothing else fits.',
 '2':'<b>Question 2, other iPhones.</b> You picked the top right of the bar, and a thread has one. Threads, Computers, Settings and Watcher have no bar. Their heading scrolls away with the list. Press the page buttons, and Scroll to see each answer once you have read down.',
 'bar':'<b>For reference, a thread\'s bar on the smallest iPhone, with everything showing.</b> It fits because the title gives way, as it already does. Nothing to pick unless this looks wrong to you.'}
const badge=()=>S.items?`<span class="bdg ${S.fresh&&!S.open?'':'quiet'}">${S.fresh&&!S.open?S.fresh:S.items}</span>`:''
const toggle=`data-act="todo"`
const tdc=(cls='circ')=>`<button class="${cls} ${S.open?'open-t':''}" ${toggle} aria-label="To-do">${I.todo(cls==='cb'?18:21)}${badge()}</button>`
const statePill=(a)=>`<div class="pill">${`<div class="tile" style="height:${a?50:50}px;display:flex;flex-direction:column;align-items:center;justify-content:center"><span class="dot"></span><small>Working<br>12m</small></div>`}${a?`<div class="tile">${I.host?'':''}<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/></svg><span class="bdg">4</span></div>`:''}<div class="tile">${I.owl(24)}</div><div class="tile">${I.dots(20)}</div></div>`
const tabsPill=()=>`<div class="pill"><div class="tile lit">${I.chat?I.chat(24):''}<span class="bdg">5</span></div><div class="tile">${I.owl(24)}</div><div class="tile">${I.host?I.host(24):''}</div><div class="tile">${I.sliders?I.sliders(22):''}</div></div>`
const thread=`<div class="bubble">Put the hand test on my to-do, I'll run it tonight.</div><div style="color:var(--tt-text-2);font-size:13px">Codex</div><div>It's on your to-do, seven steps. I'll wait for what you find.</div><div class="compo">Reply while it works</div>`
function scene1(){
  const W=951,H=669,v=S.variant,a=S.agents
  const full=a
  // Without Agents the tile stands under the sidebar button, as he picked. With Agents the variant decides.
  const belowSide=!full
  const swap=full&&v==='A', heading=full&&v==='B', float=full&&v==='C'
  const top=swap?tdc():`<div class="circ">${I.side?I.side(21):''}</div>`
  const rail=`<div class="rail" style="padding-top:124px;padding-bottom:20px"><div class="clock">9:41</div><div style="display:flex;flex-direction:column;gap:4px;align-items:center;height:100%">${top}${belowSide?tdc():''}${statePill(a)}${tabsPill()}</div></div>`
  const plus=`<span class="circ">${I.plus?I.plus(20):'+'}</span>`
  const list=`<div class="list"><h1>Threads<span style="display:flex;gap:6px">${heading?tdc():''}${plus}</span></h1><h4>Needs you 1</h4><div class="lrow">Visual gate flake<small>Asked you a question</small></div><h4>Working now 2</h4><div class="lrow sel">Paired host links<small>Codex on forge</small></div><div class="lrow">Soundtrack<small>Claude Code on forge</small></div><h4>Recent 2</h4><div class="lrow">Teams decisions<small>1d ago</small></div></div>`
  const main=`<div class="main" style="left:280px;right:84px">${float?`<div style="position:absolute;top:12px;right:12px;z-index:7">${tdc()}</div>`:''}${thread}</div>`
  const note=swap?`<div class="note" style="top:134px;right:88px">Drag from the edge for the sidebar</div>`:heading?`<div class="note" style="top:64px;left:292px">With the sidebar hidden, the Threads tab reaches it</div>`:float?`<div class="note" style="top:64px;right:96px">Over the thread's words as they scroll</div>`:''
  const pane=S.open?`<div class="scroll" style="top:10px;right:84px;width:400px"><h2>To-do<span>${S.items} to do</span></h2>${todos()}</div>`:''
  return {W,H,html:list+main+note+rail+pane,facts:`rail: 635 tall. clock 124 + button 44 + gaps 8 + thread pill ${a?216:164} + tabs 216 + foot 19 = ${124+44+8+(a?216:164)+216+19}; left over ${635-(124+44+8+(a?216:164)+216+19)} points, tile needs 44 + 4.`}
}
function page2(){
  const pg=S.page,v=S.variant,pinned=v==='B'
  const titles={threads:'Threads',settings:'Settings',watcher:''}
  const plus=pg==='threads'?`<span class="circ">${I.plus?I.plus(20):'+'}</span>`:''
  const head=pg==='watcher'?'':`<div class="head" style="${S.scrolled?'margin-top:-300px':''}"><h1>${titles[pg]}</h1>${pinned?'':tdc()}${plus}</div>`
  const body=pg==='threads'?`<h4 style="margin:12px 0 6px;font-size:13px;color:var(--tt-muted);font-weight:500">Needs you 1</h4><div class="lrow">Visual gate flake<small>Asked you a question</small></div><h4 style="margin:12px 0 6px;font-size:13px;color:var(--tt-muted);font-weight:500">Working now 2</h4><div class="lrow">Paired host links<small>Codex on forge</small></div><div class="lrow">Soundtrack<small>Claude Code on forge</small></div><h4 style="margin:12px 0 6px;font-size:13px;color:var(--tt-muted);font-weight:500">Recent 5</h4>${['Teams decisions','Duo thread rail','Mark up','Dictation','Council','Release'].map(t=>`<div class="lrow">${t}<small>1d ago</small></div>`).join('')}`
    :pg==='settings'?`<div style="color:var(--tt-muted);font-size:14px;margin:6px 0 14px">These are kept on this iPhone.</div>${['Appearance','Notifications','Text size','Duo tabs','About'].map(t=>`<div class="lrow" style="padding:14px 8px;border-top:1px solid var(--tt-hairline)">${t}</div>`).join('')}`
    :`<div class="bubble">What needs me?</div><div style="color:var(--tt-text-2);font-size:13px">Watcher</div><div>Nothing is waiting on a card. There are three things on your to-do.</div>`
  const watcherIcon=pg==='watcher'&&!pinned?`<div style="position:absolute;top:58px;right:14px;z-index:7">${tdc()}</div>`:''
  const pin=pinned?`<div style="position:absolute;top:58px;right:${pg==='threads'&&!S.scrolled?70:14}px;z-index:7">${tdc()}</div>`:''
  const sh=S.phone===375?667:852
  const pane=S.open?`<div class="scroll" style="top:104px;left:8px;right:8px"><h2>To-do<span>${S.items} to do</span></h2>${todos()}</div>`:''
  const hidden=!pinned&&S.scrolled&&pg!=='watcher'
  return {W:S.phone,H:sh,html:`<div class="ph-status"><span>9:41</span><span>●●●</span></div><div style="padding:0 16px;overflow:hidden;height:calc(100% - 128px)">${head}${body}</div>${watcherIcon}${pin}${pane}<div class="tabs">${[['Threads','threads'],['Watcher','watcher'],['Computers',''],['Settings','settings']].map(([t,p])=>`<div class="${p===pg?'lit':''}" data-page="${p}" style="cursor:pointer">${p==='threads'?(I.chat?I.chat(22):''):p==='watcher'?I.owl(22):p==='settings'?(I.sliders?I.sliders(20):''):(I.host?I.host(22):'')}${t}</div>`).join('')}</div>`,facts:`page ${pg}, ${S.phone} wide, ${S.scrolled?'scrolled':'at the top'}. Icon on screen: ${hidden?'no, it went with the heading; the thread bar and scrolling up reach it':'yes'}.`}
}
function bar(){
  return {W:375,H:667,html:`<div class="ph-status"><span>9:41</span><span>●●●</span></div><div class="nav"><span class="cb">${I.left(18)}</span><b>Paired host links</b><span class="cb"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/></svg><span class="bdg">4</span></span><span class="spill"><span class="dot"></span>12m</span><span class="cb">${I.owl(18)}</span>${tdc('cb')}<span class="cb">${I.dots(17)}</span></div><div class="main" style="top:98px;left:0;right:0">${thread}</div>${S.open?`<div class="scroll" style="top:104px;left:8px;right:8px"><h2>To-do<span>${S.items} to do</span></h2>${todos()}</div>`:''}`,facts:'Drawn at these sizes, not measured from the app: back 36, Agents 36, state 58, Watch 36, To-do 36, ••• 36, gaps 20, edges 20 = 278, so the title has 97 of 375.'}
}
function todos(){return ['Hand test links on a paired host','Listen to the new soundtrack','Walk through part 3 on the laptop'].slice(0,S.items).map(t=>`<div class="todo"><i></i><div>${t}</div></div>`).join('')+`<div style="margin-top:8px;text-align:right;font-size:13px;color:var(--tt-text-2)"><button data-act="todo">Roll up</button></div>`}
function render(){
  document.documentElement.dataset.theme=S.theme
  const vs=VARIANTS[S.q]; if(!vs[S.variant]) S.variant='A'
  const r=S.q==='1'?scene1():S.q==='2'?page2():bar()
  const w=$('#win'); w.style.width=r.W+'px'; w.style.height=r.H+'px'; w.innerHTML=r.html
  const room=Math.min(1,(document.documentElement.clientWidth-32)/r.W)
  $('#fit').style.transform=`scale(${room})`; $('#fit').style.height=r.H*room+'px'; $('#fit').style.width=r.W*room+'px'; $('#fit').style.display='flex'; $('#fit').style.justifyContent='center'; $('#fit').style.transformOrigin='top left'
  $('#say').innerHTML=SAY[S.q]
  $('#state').textContent=`q=${S.q} variant=${S.variant} theme=${S.theme}${S.q==='1'?' agents='+S.agents:''}${S.q==='2'?' page='+S.page+' phone='+S.phone:''} list=${S.open?'unrolled':'rolled'}\n${r.facts}`
  const bt=(act,val,label,on)=>`<button data-${act}="${val}" class="${on?'on':''}">${label}</button>`
  $('#bar').innerHTML=[bt('q','1','Duo sideways',S.q==='1'),bt('q','2','Other iPhones',S.q==='2'),bt('q','bar','Small iPhone bar',S.q==='bar'),'<span style="width:10px"></span>',...Object.entries(vs).map(([k,l])=>bt('variant',k,l,S.variant===k)),'<span style="width:10px"></span>',
    ...(S.q==='1'?[bt('flag','agents',S.agents?'Agents on':'Agents off',S.agents)]:[]),
    ...(S.q==='2'?[bt('page','threads','Threads',S.page==='threads'),bt('page','settings','Settings',S.page==='settings'),bt('page','watcher','Watcher',S.page==='watcher'),bt('flag','scrolled','Scroll',S.scrolled),bt('flag','phone',S.phone+' wide',false)]:[]),
    bt('flag','theme',S.theme==='dark'?'Dark':'Light',false)].join('')
  const u=new URLSearchParams({q:S.q,variant:S.variant,theme:S.theme,agents:S.agents?'1':'0',page:S.page,phone:S.phone}); history.replaceState(null,'','?'+u)
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-q],[data-variant],[data-page],[data-flag],[data-act]'); if(!t)return
  const d=t.dataset
  if(d.q){S.q=d.q;S.variant='A';S.open=false}
  if(d.variant)S.variant=d.variant
  if(d.page)S.page=d.page,S.scrolled=false
  if(d.flag==='agents')S.agents=!S.agents
  if(d.flag==='scrolled')S.scrolled=!S.scrolled
  if(d.flag==='phone')S.phone=S.phone===393?375:393
  if(d.flag==='theme')S.theme=S.theme==='dark'?'light':'dark'
  if(d.act==='todo'){S.open=!S.open;if(S.open)S.fresh=0}
  render()
})
addEventListener('resize',render); render()
</script></body></html>
