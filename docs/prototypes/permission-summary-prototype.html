<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype: command summary on the permission card</title>
<style>
@font-face { font-family: Figtree; src: url(../../apps/ios/Sotto/Resources/Figtree.ttf); font-weight: 400 500; }
@font-face { font-family: Figtree; src: url(../../apps/ios/Sotto/Resources/Figtree-SemiBold.ttf); font-weight: 600 700; }
:root { color-scheme: dark; --canvas:#0b0c0d; --surface:#141617; --raised:#1c1f21; --ink:#ececec; --muted:#a2a7ac; --hair:rgba(255,255,255,.1); --warn:#e8a33d; --warn-text:#f0b65e; --code:#0d0f10; --code-ink:#e4e6e8; --fill:rgba(255,255,255,.08); --accent:#ececec; --on-accent:#111; --wash:rgba(232,163,61,.14); --wash2:rgba(64,160,150,.14); }
[data-theme=light] { color-scheme: light; --canvas:#f4f4f2; --surface:#fff; --raised:#fff; --ink:#1b1c1d; --muted:#5e6367; --hair:rgba(0,0,0,.12); --warn:#b56f0b; --warn-text:#8a5306; --code:#1d2023; --code-ink:#eceef0; --fill:rgba(0,0,0,.06); --accent:#1b1c1d; --on-accent:#fff; --wash:rgba(232,163,61,.16); --wash2:rgba(64,160,150,.12); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 400 15px/1.45 Figtree, system-ui, sans-serif; padding: 16px 14px 230px; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
header { max-width: 760px; margin: 0 auto 16px; }
header h1 { font-size: 19px; font-weight: 600; margin: 0 0 4px; letter-spacing: -.2px; }
header p { margin: 0; color: var(--muted); font-size: 14px; }
.stage { max-width: 760px; margin: 0 auto; display: grid; justify-items: center; }
.label { font-size: 12.5px; color: var(--muted); margin: 0 0 8px; justify-self: start; }

/* iPhone sheet */
.phone { width: 100%; max-width: 390px; border-radius: 26px; overflow: hidden; border: 1px solid var(--hair); background: var(--raised); position: relative; }
.phone.duo { max-width: 680px; }
.sheet { position: relative; padding: 22px 20px 20px; }
.sheet::before { content: ""; position: absolute; inset: 0 0 auto; height: 190px; background: radial-gradient(120% 100% at 85% 0, var(--wash), transparent 65%), radial-gradient(90% 90% at 8% 0, var(--wash2), transparent 65%); pointer-events: none; }
.sheet > * { position: relative; }
.grab { width: 36px; height: 4px; border-radius: 3px; background: var(--hair); margin: -12px auto 12px; }
.from { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); font-size: 14px; }
.light { flex: none; width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 8px var(--warn); }
.headline { font-size: 25px; line-height: 1.2; font-weight: 600; letter-spacing: -.4px; margin: 12px 0 0; }
.cmd { display: flex; gap: 10px; margin-top: 16px; padding: 14px; border-radius: 12px; background: var(--code); color: var(--code-ink); border: 1px solid rgba(232,163,61,.3); box-shadow: 0 8px 16px rgba(232,163,61,.1); font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; white-space: pre-wrap; }
.cmd .prompt { color: #8d9297; }
.runs { margin-top: 14px; font-size: 13.5px; color: var(--muted); }
.runs b { display: block; font-weight: 400; font-size: 13px; color: var(--ink); margin: 2px 0; overflow-wrap: anywhere; }
.raw { margin-top: 16px; font-size: 15.5px; line-height: 1.45; overflow-wrap: anywhere; }
.choices { display: grid; gap: 10px; margin-top: 20px; }
.pill { min-height: 50px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 25px; font: 600 16px Figtree, sans-serif; background: var(--fill); color: var(--ink); }
.pill.primary { background: var(--accent); color: var(--on-accent); }
.action { margin-top: 14px; font-size: 16px; line-height: 1.4; }
.action code { display: block; font-size: 13px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
.phone .dcmd.plain { margin-top: 12px; padding: 12px; font-size: 13px; border-radius: 12px; }
.dtarget { margin: -2px 0 0; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.also { margin-top: 12px; font-size: 14.5px; color: var(--ink); overflow-wrap: anywhere; }
.also code { font-size: 13px; }
.also-row { display: flex; gap: 8px; align-items: flex-start; }
.also-row .light { margin-top: 7px; }

/* the summary, three ways */
.sum { margin-top: 12px; font-size: 16px; line-height: 1.42; }
.sum .who { display: block; font-size: 13px; color: var(--muted); margin-bottom: 2px; }
.sum .after { display: block; font-size: 13px; color: var(--muted); margin-top: 3px; }
.sum.none { color: var(--muted); font-size: 15px; }
.sum.quote { border-left: 2px solid var(--warn); padding-left: 11px; }

/* desktop card */
.window { width: 100%; max-width: 760px; border-radius: 12px; border: 1px solid var(--hair); background: var(--surface); overflow: hidden; }
.strip { height: 32px; display: flex; align-items: center; padding: 0 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--hair); }
.pane { padding: 18px 16px; }
.bubble { max-width: 76%; margin-left: auto; padding: 9px 13px; border-radius: 14px; background: var(--fill); font-size: 14px; }
.card { display: grid; gap: 10px; margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--fill); }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.head strong { font-size: 15px; font-weight: 600; letter-spacing: -.1px; }
.tag { padding: 1px 7px; border-radius: 6px; background: var(--fill); color: var(--muted); font-size: 11.5px; line-height: 18px; font-weight: 500; }
.card .sum { margin: 0; font-size: 14.5px; }
.card .sum .who, .card .sum .after { font-size: 12.5px; }
.card .sum.none { font-size: 14px; }
.dcmd { margin: 0; padding: 8px 10px; max-height: 220px; overflow: auto; border-radius: 8px; border: 1px solid var(--hair); background: var(--code); color: var(--code-ink); font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.dcmd.raw-box { color: var(--muted); }
.cwd { margin: -4px 0 0; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { min-height: 34px; padding: 0 15px; border: 0; border-radius: 9px; font: 500 13.5px Figtree, sans-serif; background: var(--fill); color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.card .also { margin: -2px 0 0; font-size: 13.5px; }

/* control bar */
.bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--hair); display: grid; gap: 8px; z-index: 5; }
.row { max-width: 760px; width: 100%; margin: 0 auto; display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.row > span { flex: none; width: 58px; font-size: 12px; color: var(--muted); }
.row button { flex: none; min-height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--hair); background: transparent; color: var(--ink); font: 500 13px Figtree, sans-serif; white-space: nowrap; }
.row button[aria-pressed=true] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
button:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>Prototype: the permission card without raw JSON</h1>
  <p id="note"></p>
</header>
<main class="stage" id="stage"></main>
<nav class="bar" aria-label="Prototype controls">
  <div class="row" data-group="label"><span>Style</span></div>
  <div class="row" data-group="req"><span>Request</span></div>
  <div class="row" data-group="surface"><span>Surface</span></div>
  <div class="row" data-group="theme"><span>Theme</span></div>
</nav>
<script>
const groups = {
  label: [['A','New'],['today','Today']],
  req: [['claude','Command'],['codex','No summary'],['setting','Outside the sandbox'],['edit','Edit a file'],['write','Write a file'],['read','Read a file'],['fetch','Web page'],['mcp','Another tool'],['agent','Subagent'],['codexfile','Codex file change'],['grok','Grok Build'],['long','Long command']],
  surface: [['iphone','iPhone'],['duo','Duo unfolded'],['desktop','Desktop']],
  theme: [['dark','Dark'],['light','Light']],
};
const params = new URLSearchParams(location.search);
const state = { label: params.get('label')||'A', req: params.get('req')||'claude', surface: params.get('surface')||'iphone', theme: params.get('theme')||'dark' };
const CLAUDE_CMD = `cd /home/zach/Projects/Vellum; gh run download 26118734 -n bench-results -D /tmp/bench; jq -r '.scenarios[] | [.name, .p50, .p95] | @tsv' /tmp/bench/results.json | column -t`;
const LONG_CMD = `cd /home/zach/Projects/Vellum && for run in $(gh run list --workflow bench.yml --limit 12 --json databaseId --jq '.[].databaseId'); do mkdir -p /tmp/bench/$run && gh run download "$run" -n bench-results -D /tmp/bench/$run || echo "skip $run"; done\npython3 - <<'PY'\nimport json, glob\nrows = []\nfor path in sorted(glob.glob('/tmp/bench/*/results.json')):\n    data = json.load(open(path))\n    for s in data['scenarios']:\n        if s['name'] in ('cold-open', 'scroll-1000', 'search-typing'):\n            rows.append((path.split('/')[3], s['name'], s['p50'], s['p95']))\nfor row in rows: print(*row, sep='\\t')\nPY`.replace(/\\n/g,'\n');
const requests = {
  claude: { provider:'Claude Code', tag:'Bash', summary:'Download recent benchmark artifacts and tabulate key scenarios', command:CLAUDE_CMD, allow:'Allow once',
    raw:JSON.stringify({command:CLAUDE_CMD,timeout:300000,description:'Download recent benchmark artifacts and tabulate key scenarios'}) },
  codex: { provider:'Codex', tag:'', summary:null, command:'npm test -- --run tests/unit/agents', cwd:'/home/zach/Projects/Sotto', computer:'forge', allow:'Allow', raw:'{}' },
  grok: { provider:'Grok Build', tag:'', summary:'Run the unit tests for the agents folder', command:'npm test -- --run tests/unit/agents', allow:'Allow once', noBlockToday:true,
    raw:JSON.stringify({command:'npm test -- --run tests/unit/agents',description:'Run the unit tests for the agents folder',timeout:120000}) },
  setting: { provider:'Claude Code', tag:'Bash', summary:'Install the project’s packages', command:'npm ci', allow:'Allow once', also:'It also asks to run outside the sandbox.',
    raw:JSON.stringify({command:'npm ci',description:'Install the project’s packages',dangerouslyDisableSandbox:true}) },
  long: { provider:'Claude Code', tag:'Bash', summary:'Download the last 12 benchmark runs and print the p50 and p95 of three scenarios for each', command:LONG_CMD, allow:'Allow once',
    raw:JSON.stringify({command:LONG_CMD,timeout:600000,description:'Download the last 12 benchmark runs and print the p50 and p95 of three scenarios for each'}) },
  edit: { provider:'Claude Code', tag:'Edit', other:true, action:'Edit a file', target:'/home/zach/Projects/Vellum/src/bench.ts', allow:'Allow once',
    block:'- const limit = 10\n- const rows = runs.slice(0, limit)\n+ const limit = 12\n+ const rows = runs.slice(0, limit).reverse()',
    rawTitle:'Edit', raw:JSON.stringify({file_path:'/home/zach/Projects/Vellum/src/bench.ts',old_string:'const limit = 10\nconst rows = runs.slice(0, limit)',new_string:'const limit = 12\nconst rows = runs.slice(0, limit).reverse()'}) },
  write: { provider:'Claude Code', tag:'Write', other:true, action:'Write a file', target:'/home/zach/Projects/Vellum/notes/bench.md', allow:'Allow once',
    block:'# Benchmarks\n\nCold open moved from 1.9 s to 1.4 s.\nSearch typing did not move.',
    rawTitle:'Write', raw:JSON.stringify({file_path:'/home/zach/Projects/Vellum/notes/bench.md',content:'# Benchmarks\n\nCold open moved from 1.9 s to 1.4 s.\nSearch typing did not move.'}) },
  read: { provider:'Claude Code', tag:'Read', other:true, action:'Read a file', target:'/home/zach/.ssh/config', allow:'Allow once', block:'offset: 10\nlimit: 50',
    rawTitle:'Read', raw:JSON.stringify({file_path:'/home/zach/.ssh/config',offset:10,limit:50}) },
  fetch: { provider:'Claude Code', tag:'WebFetch', other:true, action:'Fetch a web page', target:'https://docs.github.com/en/rest/actions/artifacts', allow:'Allow once', block:'prompt: How long are artifacts kept?',
    rawTitle:'WebFetch', raw:JSON.stringify({url:'https://docs.github.com/en/rest/actions/artifacts',prompt:'How long are artifacts kept?'}) },
  mcp: { provider:'Claude Code', tag:'mcp__github__create_issue', other:true, action:'Use create_issue from github', allow:'Allow once',
    block:'repo: millZach/Sotto\ntitle: Cold open got slower\nbody:\n  Cold open moved after the last merge.\n  Numbers are in the run.\nlabels: bug, perf\nassignee.login: millZach',
    rawTitle:'mcp__github__create_issue', raw:JSON.stringify({repo:'millZach/Sotto',title:'Cold open got slower',body:'Cold open moved after the last merge.\nNumbers are in the run.',labels:['bug','perf'],assignee:{login:'millZach'}}) },
  agent: { provider:'Claude Code', tag:'Agent', other:true, action:'Start a subagent', summary:'Compare the benchmark runs', allow:'Allow once',
    block:'subagent_type: Explore\nprompt:\n  Read the last twelve benchmark runs and say which scenario moved most.',
    rawTitle:'Agent: Compare the benchmark runs', raw:JSON.stringify({description:'Compare the benchmark runs',subagent_type:'Explore',prompt:'Read the last twelve benchmark runs and say which scenario moved most.'}) },
  codexfile: { provider:'Codex', tag:'', other:true, action:'Change 2 files', summary:'Needs to write outside the project folder', target:null, cwd:'/home/zach/Projects/Vellum', computer:'forge', allow:'Allow', block:'src/bench.ts\nnotes/bench.md',
    rawTitle:'src/bench.ts, notes/bench.md', raw:JSON.stringify({reason:'Needs to write outside the project folder',files:'src/bench.ts, notes/bench.md'}) },
};
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function summary(r) {
  if (!r.summary) return `<p class="sum none">${r.provider} gave no summary of this command.</p>`;
  if (state.label === 'A') return `<p class="sum"><span class="who">${r.provider} says</span>${esc(r.summary)}</p>`;
  if (state.label === 'B') return `<p class="sum">${esc(r.summary)}<span class="after">${r.provider}’s words. Sotto didn’t check them.</span></p>`;
  return `<p class="sum quote">${esc(r.summary)}<span class="after">${r.provider}</span></p>`;
}
function phone(r, duo) {
  const today = state.label === 'today';
  const head = r.other ? `${r.provider} is asking permission` : (today && r.noBlockToday) ? `${r.provider} is asking permission` : `${r.provider} wants to run a command`;
  let body = '';
  if (r.other && today) body = `<div class="raw">${esc(r.raw)}</div>`;
  else if (r.other) body = otherBody(r) + (r.cwd ? runs(r) : '');
  else if (today) body = (r.noBlockToday ? '' : `<div class="cmd mono"><span class="prompt">$</span><span>${esc(r.command)}</span></div>`) + (r.cwd ? runs(r) : '') + `<div class="raw">${esc(r.raw)}</div>`;
  else body = summary(r) + `<div class="cmd mono"><span class="prompt">$</span><span>${esc(r.command)}</span></div>` + (r.also ? `<div class="also also-row"><span class="light"></span><span>${r.also}</span></div>` : '') + (r.cwd ? runs(r) : '');
  return `<div class="phone${duo?' duo':''}"><div class="sheet"><div class="grab"></div>
    <div class="from"><span class="light"></span><span>Permission for ${r.provider} in Compare benchmark runs</span></div>
    <h2 class="headline">${head}</h2>${body}
    <div class="choices"><div class="pill primary">${r.allow}</div><div class="pill">Deny</div></div>
  </div></div>`;
}
const otherBody = r => (r.summary ? summary(r) : '') + `<div class="action">${esc(r.action)}${r.target ? `<code class="mono">${esc(r.target)}</code>` : ''}</div>` + (r.block ? `<pre class="dcmd plain mono">${esc(r.block)}</pre>` : '');
const runs = r => `<div class="runs">It runs in<b class="mono">${r.cwd}</b>on ${r.computer}.</div>`;
function desktop(r) {
  const today = state.label === 'today';
  const title = r.other ? (today ? esc(r.rawTitle) : esc(r.action)) : today ? (r.provider === 'Codex' ? esc(r.command) : r.noBlockToday ? 'Run' : `${r.tag}: ${esc(r.summary)}`) : 'Run a command';
  let body = '';
  if (r.other && today) body = `<pre class="dcmd raw-box mono">${esc(r.raw)}</pre>`;
  else if (r.other) body = (r.summary ? summary(r) : '') + (r.target ? `<p class="dtarget mono">${esc(r.target)}</p>` : '') + (r.block ? `<pre class="dcmd plain mono">${esc(r.block)}</pre>` : '') + (r.cwd ? `<p class="cwd">in <code class="mono">${r.cwd}</code></p>` : '');
  else if (today) body = (r.noBlockToday ? '' : `<pre class="dcmd mono"><code>${esc(r.command)}</code></pre>`) + (r.cwd ? `<p class="cwd">in <code class="mono">${r.cwd}</code></p>` : '') + `<pre class="dcmd raw-box mono">${esc(r.raw)}</pre>`;
  else body = summary(r) + `<pre class="dcmd mono"><code>${esc(r.command)}</code></pre>` + (r.also ? `<div class="also also-row"><span class="light"></span><span>${r.also}</span></div>` : '') + (r.cwd ? `<p class="cwd">in <code class="mono">${r.cwd}</code></p>` : '');
  return `<div class="window"><div class="strip">Sotto · Compare benchmark runs</div><div class="pane">
    <div class="bubble">Pull the last benchmark runs and show me how the key scenarios moved.</div>
    <section class="card"><div class="head"><strong>${title}</strong>${r.tag ? `<span class="tag">${r.tag}</span>` : ''}</div>${body}
      <div class="acts"><button class="btn primary">${r.allow}</button><button class="btn">Deny</button></div></section>
  </div></div>`;
}
const notes = {
  claude: 'Claude usually writes a description of its command. That text is the summary.',
  codex: 'Codex sends a reason only sometimes. Without one, its card looks like this. So does Cursor’s, which has no summary to send.',
  grok: 'Grok Build sends a command and a description, and Sotto uses neither today: it shows only the raw text.',
  setting: 'An added line, not in your brief. The raw box is where “outside the sandbox” shows today, so hiding it with nothing in its place would hide what you are approving.',
  long: 'The command block stays whole. The summary is what you read first.',
  edit: 'What goes and what comes in, one line each. Nothing is left out, and the file’s path is on its own line.',
  write: 'The path, then what the file would hold.',
  read: 'The path, then anything else it set.',
  fetch: 'The address, then what it asks of the page.',
  mcp: 'Any other tool: every field it sent, by name, in plain lines. No JSON, and nothing dropped. This is the fallback for tools Sotto has no words for.',
  agent: 'A model’s description shows as a summary here too. Requests that give none say nothing about it: only commands get the “no summary” line.',
  codexfile: 'Codex’s reason shows as a summary. Its files stay in a list.',
};
function render() {
  document.documentElement.dataset.theme = state.theme;
  const r = requests[state.req];
  const name = {iphone:'iPhone sheet',duo:'iPhone Duo, unfolded',desktop:'Desktop, in the thread'}[state.surface];
  document.getElementById('note').textContent = notes[state.req];
  document.getElementById('stage').innerHTML = `<p class="label">${name}${state.label==='today'?' · how it looks now':''}</p>` + (state.surface==='desktop' ? desktop(r) : phone(r, state.surface==='duo'));
  for (const row of document.querySelectorAll('.row')) for (const b of row.querySelectorAll('button')) b.setAttribute('aria-pressed', b.dataset.value === state[row.dataset.group]);
  history.replaceState(null, '', '?' + new URLSearchParams(state));
}
for (const row of document.querySelectorAll('.row')) for (const [value, words] of groups[row.dataset.group]) {
  const b = document.createElement('button'); b.type='button'; b.dataset.value=value; b.textContent=words;
  b.onclick = () => { state[row.dataset.group]=value; render(); }; row.append(b);
}
render();
</script>
</body>
</html>
