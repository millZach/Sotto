<!--
  PROTOTYPE, throwaway. Not shipped, not tested, not wired to anything.

  Question (E13 #1041 with E14 #1042): how does Zach see and change which provider, model, effort and permissions each
  kind of work gets, and understand where those choices apply?

  Surfaces (switch at the top):
    Settings -> Watcher   The machine tiles Zach picked (variant B of the tag prototype/watcher-delegation-placement),
                          kept as they are, and the worker roles under them: Orchestrating (Watcher itself), Building,
                          UI, Code review, Research and Computer use. Each picks a model, an effort and permissions.
                          Reset for one role and for all. Where the roles apply, worked out for a thread on each provider.
    Watcher's room        Watcher's composer chips are the Orchestrating role; receipts name the role each worker
                          started as; a provider change or a disconnect says what happens to Watcher.

  Variants for the roles (?variant=A|B|C, the bottom switcher, or the arrow keys):
    A  Sentences.  One sentence per role with the composer's own chips inline, the way Agents says "New threads start
                   with": "Building. Workers start on [Opus 5.5] at [Extra high] with [Allow edits]."
    B  Table.      A row per role with columns for model, effort, permissions and the next default.
    C  Cards.      A card per role with its defaults in order, so what happens when a provider disconnects is on the card,
                   and Orchestrating drawn beside Watcher's composer.

  Settled before this prototype (plan.md, Zach, October 14, 2026): the six roles; Zach's defaults with Claude Code, Codex,
  Muse and Grok Build connected; every row's picker lists every model from every connected provider; a choice you made is
  never overwritten; Reset to defaults; delegation goes two levels deep; roles are an Owl feature.

  Stand-ins and proposals: the model lists and effort levels stand in for what each provider reports. Muse Wonder (the
  smaller Muse model), each role's later defaults (after Zach's first) and the proposed permissions are for Zach to react
  to. Every number and line is computed from one model: change a role and the room, the notes and the readout follow.
  ?shot=1 hides the prototype's own bars for screenshots. Other params: surface, theme, size, prov (all | claude-off |
  codex-only | none), choices (none | building | two | orch), ceiling (edits | ask | full), from (claude | codex | grok |
  muse), open (model:<role> | effort:<role> | perm:<role> | cmodel | ceffort | cperm), pp (the picker's provider),
  at (roles | apply).
-->

.rc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; gap: 12px; margin-top: 10px; }
.win[data-size='s'] .rc { grid-template-columns: minmax(0, 1fr); }
.rcard { display: grid; gap: 10px; min-width: 0; padding: 14px 16px; border: 1px solid var(--tt-hairline); border-radius: 12px; background: var(--tt-surface); }

.rcard--wide { grid-column: 1 / -1; grid-template-columns: minmax(0, 1fr) minmax(0, .9fr); column-gap: 22px; }

.rcard__main { display: grid; gap: 10px; min-width: 0; }

.rfields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }

.chain li > span:nth-of-type(1) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.rcard__foot { display: flex; justify-content: flex-end; }
.mirror { display: grid; align-content: start; gap: 8px; min-width: 0; }
.mirror__box { display: grid; gap: 10px; padding: 12px 12px 10px; border: 1px solid var(--tt-field-border); border-radius: 12px; background: var(--tt-canvas); }
.mirror__text { color: var(--tt-text-muted); font-size: 13px; }
.mirror__chips { display: flex; flex-wrap: wrap; gap: 6px; }

.mirror__cap { display: flex; gap: 8px; margin: 0; color: var(--tt-text-2); font-size: 12.5px; line-height: 1.5; }
.mirror__cap .ic { margin-top: 2px; color: var(--tt-text-muted); }

/* Where roles apply: the same in every variant */

.apply__list { display: grid; gap: 10px; margin: 8px 0 0; padding: 0; list-style: none; }
.apply__list li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; color: var(--tt-text-2); font-size: 13.5px; line-height: 1.55; }
.apply__list li > .ic { margin-top: 3px; color: var(--tt-text-muted); }
.apply__list b { color: var(--tt-text); font-weight: 600; }
.from { margin-top: 16px; padding: 12px 14px 8px; border: 1px solid var(--tt-hairline); border-radius: 12px; }
.from__head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; color: var(--tt-text-2); font-size: 13.5px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; border: 1px solid var(--tt-hairline); border-radius: 9px; }
.seg button { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--tt-text-2); font-size: 13px; white-space: nowrap; }
.seg button[aria-pressed='true'] { background: var(--tt-surface-overlay); color: var(--tt-text); }
.from__list { display: grid; margin: 8px 0 0; padding: 0; list-style: none; }
.from__list li { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-top: 1px solid var(--tt-hairline); color: var(--tt-text-2); font-size: 13px; line-height: 1.5; }
.from__list li > b { color: var(--tt-text); font-weight: 500; }
.from__list li > span { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; }
.win[data-size='s'] .from__list li { grid-template-columns: 96px minmax(0, 1fr); }

/* ===== Watcher's room ===== */
.room { position: relative; display: grid; grid-template-rows: 44px auto minmax(0, 1fr) auto 62px; height: 100%; }
.sky { position: absolute; top: 0; left: 0; width: 520px; max-width: 100%; height: 110px; pointer-events: none; background: radial-gradient(90% 100% at 0 0, color-mix(in srgb, var(--tt-accent-surface) 75%, transparent), transparent 72%); }

.rhead__name { margin: 0 6px 0 4px; font-size: 15px; font-weight: 600; }
.hbtn { display: inline-flex; flex: none; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--tt-text-2); font-size: 13px; }
.hbtn:hover { background: var(--tt-hover); }
.tabs { display: inline-flex; flex: none; gap: 2px; margin-left: 4px; padding: 2px; border: 1px solid var(--tt-hairline); border-radius: 9px; }
.tabs button { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--tt-text-2); font-size: 13px; white-space: nowrap; }
.tabs button[aria-selected='true'] { background: var(--tt-surface-overlay); color: var(--tt-text); }
.col { width: min(760px, calc(100% - 48px)); margin: 0 auto; }
.rscroll { min-height: 0; overflow-y: auto; scrollbar-width: thin; }
.rscroll .col { padding: 6px 0 14px; }
.msg { margin: 18px 0; }
.msg__meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; color: var(--tt-text-muted); font-size: 12.5px; }
.msg__meta b { color: var(--tt-text); font-weight: 600; }
.msg p { margin: 0; font-size: 14.5px; line-height: 1.6; }
.msg--you { width: fit-content; max-width: 80%; margin-left: auto; padding: 12px 18px; border: 1px solid var(--tt-hairline); border-radius: 12px; background: var(--tt-bubble); }
.cards { display: grid; gap: 8px; margin-top: 12px; }
.tcard { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; column-gap: 10px; row-gap: 3px; padding: 10px 8px 10px 14px; border: 1px solid var(--tt-hairline); border-radius: 10px; background: var(--tt-surface); }
.tcard__title { min-width: 0; overflow: hidden; font-size: 14px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.tcard__meta { grid-column: 2 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 7px; color: var(--tt-text-muted); font-size: 12.5px; }
.tcard__role { color: var(--tt-text-2); font-weight: 500; }
.tcard__note { grid-column: 2 / -1; margin-top: 2px; color: var(--tt-text-2); font-size: 12.5px; line-height: 1.5; }
.tcard--refused { border-color: color-mix(in oklab, var(--tt-error) 45%, var(--tt-hairline)); }
.tcard--refused .tcard__icon { color: var(--tt-error); }
.tcard--refused .tcard__title { white-space: normal; }
.rcomp { padding-bottom: 6px; }
.wbanner { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin: 0 0 8px; padding: 8px 8px 8px 12px; border: 1px solid var(--tt-hairline); border-left: 2px solid var(--tt-warning); border-radius: 10px; background: var(--tt-surface); color: var(--tt-text-2); font-size: 13px; line-height: 1.5; }
.wbanner > span { flex: 1 1 280px; min-width: 0; }
.wbanner .pill { height: 26px; padding: 0 10px; font-size: 12.5px; }
.composer { display: flex; flex-direction: column; border: 1px solid var(--tt-field-border); border-radius: 14px; background: var(--tt-surface); }
.composer textarea { min-height: 62px; padding: 14px 16px 4px; border: 0; border-radius: 14px; background: transparent; color: var(--tt-text); font-size: 14.5px; resize: none; outline: none; }
.composer:focus-within { border-color: var(--tt-accent-border); }
.composer textarea::placeholder { color: var(--tt-text-muted); }
.win[data-size='s'] .composer textarea { min-height: 44px; padding-top: 10px; }
.composer__row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 0 10px 10px; }
.send { display: grid; place-items: center; flex: none; width: 30px; height: 30px; margin-left: auto; padding: 0; border: 0; border-radius: 50%; background: color-mix(in srgb, var(--tt-accent) 55%, var(--tt-surface)); color: var(--tt-on-accent); }

.empty { margin: 40px auto; max-width: 52ch; color: var(--tt-text-muted); font-size: 14px; line-height: 1.6; text-align: center; }

.dock { display: flex; align-items: flex-start; justify-content: center; padding: 6px 8px 0; }
.dock__pill { display: flex; align-items: center; gap: 2px; height: 42px; padding: 0 5px; border: 1px solid var(--tt-hairline); border-radius: 999px; background: var(--tt-surface-elevated); box-shadow: 0 8px 22px -10px var(--tt-shadow-color); }
.dock__sep { width: 1px; height: 18px; margin: 0 5px; background: var(--tt-hairline); }
.dock__switch { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 236px; height: 34px; padding: 2px; border-radius: 999px; background: var(--tt-surface); }

.dock__switch button[aria-current='page'] { display: grid; place-items: center; width: 44px; background: var(--tt-surface-overlay); color: var(--tt-text); }

/* The prototype's own bars: deliberately not Sotto's look. */
.proto-top { position: fixed; top: 8px; left: 50%; z-index: 100; display: grid; gap: 6px; width: min(1180px, calc(100vw - 16px)); padding: 8px 12px; border-radius: 14px; background: #fff; color: #111; box-shadow: 0 8px 30px rgb(0 0 0 / 45%); transform: translateX(-50%); font: 12.5px/1.3 ui-sans-serif, system-ui, sans-serif; }
.pt-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.proto-top button, .proto-top select { padding: 3px 9px; border: 1px solid #bbb; border-radius: 999px; background: #f4f4f4; color: #111; color-scheme: light; font: inherit; }
.proto-top button[aria-pressed='true'] { background: #111; border-color: #111; color: #fff; }

.proto-switch .label { min-width: 250px; font-weight: 700; text-align: center; }
body.shot .proto-top, body.shot .proto-switch { display: none; }
</style>

<body>
<div class="proto-top" role="region" aria-label="Prototype controls, not part of the design">
  <div class="pt-row">
    <strong>Prototype</strong>
    <span role="group" aria-label="Surface" id="pt-surface">
      <button type="button" data-surface="settings">Settings → Watcher</button>
      <button type="button" data-surface="room">Watcher's room</button>
    </span>
    <label>Providers
      <select id="pt-prov">
        <option value="all">Claude Code, Codex, Muse and Grok Build</option>
        <option value="claude-off">Claude Code not connected</option>
        <option value="codex-only">Only Codex set up</option>
        <option value="none">None connected</option>
      </select>
    </label>
    <label>Your choices
      <select id="pt-choices">
        <option value="none">None</option>
        <option value="building">Building on Sonnet 5.5</option>
        <option value="two">Building on Sonnet 5.5, Code review on Opus 5.5</option>
        <option value="orch">Orchestrating on GPT-6.1 Sol</option>
        <option value="custom" disabled>Your own changes</option>
      </select>
    </label>
    <label>New-thread default
      <select id="pt-ceiling"><option value="edits">Allow edits</option><option value="ask">Ask for approval</option><option value="full">Full access</option></select>
    </label>
    <button type="button" id="pt-roles">Jump to the roles</button>
    <label>Size
      <select id="pt-size"><option value="1280">1280×800</option><option value="820">820×560</option><option value="1600">1600×1000</option></select>
    </label>
    <button type="button" id="pt-theme"></button>
  </div>
  <div class="pt-state" id="pt-state" aria-live="polite"></div>
</div>
<div class="stage"><div class="win" id="win"></div></div>
<div class="proto-switch" role="group" aria-label="Variant, prototype only">
  <button type="button" id="pv-prev" aria-label="Previous variant">←</button>
  <span class="label" id="pv-label" aria-live="polite"></span>
  <button type="button" id="pv-next" aria-label="Next variant">→</button>
</div>
<script>
(() => {
'use strict';
const P = new URLSearchParams(location.search);
const pick = (v, allowed, d) => allowed.includes(v) ? v : d;

/* ---------- the catalog: stand-ins for what each provider reports ---------- */
const ALL_MODES = ['approval-required', 'auto-accept-edits', 'auto', 'full-access'];
const PROV = {
  codex: { name: 'Codex', modes: ALL_MODES },
  claude: { name: 'Claude Code', modes: ALL_MODES },

      <span class="tile">${owl(15)}</span>
      <h1 class="rhead__name">Watcher</h1>
      <button type="button" class="hbtn" data-act="nodraw" data-k="all" aria-label="All threads, 9">${ic('list', 15)}All threads <span class="muted">9</span>${ic('down', 14)}</button>
      <div class="tabs" role="tablist" aria-label="Watcher's views"><button type="button" role="tab" aria-selected="true" data-k="tab-conv">Conversation</button><button type="button" role="tab" aria-selected="false" tabindex="-1" data-act="nodraw" data-k="tab-watched">Watched <span class="muted">1</span></button></div>
      <span class="grow"></span>
      <button type="button" class="iconbtn" data-act="nodraw" data-k="more" aria-label="More Watcher actions">${ic('more')}</button>
    </header>
    <div></div>
    <div class="rscroll" data-scroll="room" data-bottom><div class="col">${roomConversation(now)}</div></div>
    <div class="col rcomp">
      ${banner(now, o)}
      <div class="composer">
        <label class="sr-only" for="wmsg">Watcher message</label>
        <textarea id="wmsg" data-k="wmsg" placeholder="Ask about your threads, or say what to start or send" ${now ? '' : 'disabled'}></textarea>
        <div class="composer__row">
          <button type="button" class="iconbtn" data-act="nodraw" data-k="wattach" aria-label="Attach a file">${ic('clip', 15)}</button>
          ${chips}
          <button type="button" class="send" data-act="nodraw" data-k="wsend" aria-label="Send to Watcher" ${now ? '' : 'disabled'}>${ic('up', 15)}</button>
        </div>
      </div>
    </div>
    <nav class="dock" aria-label="Pages"><div class="dock__pill">
      <button type="button" class="iconbtn" data-act="nodraw" data-k="d-history" aria-label="History">${ic('clock')}</button>
      <button type="button" class="iconbtn" data-act="nodraw" data-k="d-usage" aria-label="Usage">${ic('chart')}</button>
      <button type="button" class="iconbtn" data-k="d-settings" data-go="roles" aria-label="Settings">${ic('gear')}</button>
      <button type="button" class="iconbtn" data-act="nodraw" data-k="d-help" aria-label="Help">${ic('help')}</button>
      <span class="dock__sep"></span>
      ${switch3('room', 'dock__switch')}
      <span class="dock__sep"></span>
      <button type="button" class="iconbtn" data-act="nodraw" data-k="d-update" aria-label="Check for updates">${ic('refresh')}</button>
    </div></nav>
  </div>`;
}

/* ---------- render ---------- */
const win = document.getElementById('win');
let lastKey = '';
function render() {
  const active = document.activeElement && document.activeElement.closest ? document.activeElement.closest('[data-k]') : null;
  const k = active && win.contains(active) ? active.dataset.k : null;
  const caret = active && active.tagName === 'INPUT' ? active.selectionStart : null;
  const keep = {};
  win.querySelectorAll('[data-scroll]').forEach(el => { keep[el.dataset.scroll] = el.scrollTop; });
  const [w, h, sz] = SIZES[S.size];
  document.documentElement.dataset.theme = S.theme;
  document.body.classList.toggle('shot', S.shot);
  win.dataset.size = sz;
  S.fit = S.shot ? 1 : Math.min(1, (innerWidth - 24) / w);
  win.style.setProperty('--w', S.shot ? '100vw' : w + 'px');
  win.style.setProperty('--h', S.shot ? '100vh' : h + 'px');
  win.style.setProperty('--fit', S.fit);
  win.innerHTML = (S.surface === 'settings' ? renderSettings() : renderRoom()) + wctl();
  const key = [S.surface, S.variant].join('|');
  win.querySelectorAll('[data-scroll]').forEach(el => {
    if (key === lastKey && keep[el.dataset.scroll] !== undefined) el.scrollTop = keep[el.dataset.scroll];
    else if (el.hasAttribute('data-bottom')) el.scrollTop = el.scrollHeight;
  });
  lastKey = key;
  if (S.at && S.surface === 'settings') {
    const sm = win.querySelector('.smain'), at = win.querySelector(S.at === 'apply' ? '#apply-h' : '#roles');
    if (sm && at) sm.scrollTop = at.offsetTop - 18;
    S.at = '';
  }
  const pop = win.querySelector('[data-pop]');
  if (pop && S.justOpened) {
    const sm = pop.closest('[data-scroll]');
    const chip = pop.parentElement.querySelector('.tchip');
    if (sm && chip && sm.classList.contains('smain')) {
      // Opening scrolls the page only when it must: the chip out of view, or no room for the menu on either side.
      const cr = chip.getBoundingClientRect(), br = sm.getBoundingClientRect(), z = S.fit;
      const below = (br.bottom - cr.bottom) / z, above = (cr.top - br.top) / z, need = pop.offsetHeight + 20;
      if (above < 0 || below < 0 || (below < need && above < need)) sm.scrollTop += above - 16;
    }
  }
  placePops();
  if (S.justOpened && pop) {
    const first = pop.querySelector('input') || pop.querySelector('[aria-selected="true"]:not(:disabled)') || pop.querySelector('button:not(:disabled)');
    if (first) first.focus({ preventScroll: true });
    S.justOpened = false;
  } else if (k) {
    const el = win.querySelector(`[data-k="${CSS.escape(k)}"]`);
    if (el) { el.focus({ preventScroll: true }); if (caret !== null && el.setSelectionRange) el.setSelectionRange(caret, caret); }
  }
  syncBars();
  syncURL();
  if (!S.shot) document.querySelector('.stage').style.paddingTop = (document.querySelector('.proto-top').offsetHeight + 20) + 'px';
}
/* Anchored over its chip: below when there is room, above when there is more there, and kept inside the page. */
function placePops() {
  win.querySelectorAll('[data-pop]').forEach(pop => {
    const box = (pop.closest('[data-scroll]') || win).getBoundingClientRect();
    const anchor = pop.parentElement.getBoundingClientRect();
    const z = S.fit;
    const below = (box.bottom - anchor.bottom) / z - 14, above = (anchor.top - box.top) / z - 14;
    const h = pop.offsetHeight;
    const up = pop.dataset.prefer === 'up' ? above > 160 || above > below : h > below && above > below;
    if (up) pop.dataset.up = 'true';
    const room = up ? above : below;
    if (h > room) pop.style.setProperty('--pop-max', Math.max(180, Math.floor(room)) + 'px');
    let r = pop.getBoundingClientRect();
    if (r.right > box.right - 8 * z) { pop.dataset.right = 'true'; r = pop.getBoundingClientRect(); }
    if (r.left < box.left + 8 * z) { pop.dataset.right = ''; pop.style.left = ((box.left - anchor.left) / z + 8) + 'px'; }
  });
}
function syncBars() {
  document.querySelectorAll('#pt-surface button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.surface === S.surface)));
  document.getElementById('pt-prov').value = S.prov;
  const preset = Object.keys(PRESETS).find(key => JSON.stringify(PRESETS[key]) === JSON.stringify(S.choice));
  document.getElementById('pt-choices').value = preset || 'custom';
  document.getElementById('pt-ceiling').value = S.ceiling;
  document.getElementById('pt-size').value = S.size;
  document.getElementById('pt-roles').style.display = S.surface === 'settings' ? '' : 'none';
  document.getElementById('pt-theme').textContent = S.theme === 'dark' ? 'Light' : 'Dark';
  document.getElementById('pv-label').textContent = `${S.variant}: ${VARIANTS[S.variant]}`;
  const line = ROLES.map(role => {
    const r = row(role);
    if (!r.start) return `${role.name}: nothing connected`;
    const m = MOD[r.start.model];
    return `${role.name}: ${m.name}${r.start.effort ? ' ' + effLabel(r.start.effort) : ''}, ${MODE[r.startPerm]}${role.id === 'orchestrating' ? ' (Watcher’s own)' : ''} [${r.status}]`;
  }).join(' · ');
  document.getElementById('pt-state').textContent = `New workers start as: ${line}  |  New-thread default: ${MODE[CEIL[S.ceiling]]}`;
}
function syncURL() {
  const q = new URLSearchParams({ variant: S.variant, surface: S.surface, theme: S.theme, size: S.size, prov: S.prov, ceiling: S.ceiling, from: S.from });
  const c = Object.entries(S.choice).map(([id, v]) => [id, v.model, v.effort || '-', v.perm || '-'].join(':')).join(',');
  if (c) q.set('c', c);
  if (S.watcherMode !== 'approval-required') q.set('wmode', S.watcherMode);
  if (S.open) q.set('open', S.open);
  if (S.shot) q.set('shot', '1');
  history.replaceState(null, '', '?' + q.toString());
}

/* ---------- actions ---------- */
function roleOf(t) { return ROLE[t.dataset.role] || ROLE.orchestrating; }
function closePop(focusOpener = true) {
  const opener = S.opener;
  S.open = null; S.query = ''; S.pickProv = null;
  render();
  if (focusOpener && opener) { const el = win.querySelector(`[data-k="${CSS.escape(opener)}"]`); if (el) el.focus(); }
}
function changed() { S.toast = null; S.undo = null; }
function navigate(go) {
  S.open = null; S.query = ''; S.pickProv = null;
  if (go === 'room') { S.surface = 'room'; render(); const t = win.querySelector('#wmsg'); if (t && !t.disabled) t.focus(); else { const s = win.querySelector('[data-k="sw-room"]'); if (s) s.focus(); } return; }
  if (go === 'settings' || go === 'roles') {
    S.surface = 'settings'; if (go === 'roles') S.at = 'roles'; render();
    const t = win.querySelector(go === 'roles' ? '#roles-h' : '.snav__item[aria-current]');
    if (t) { if (go === 'roles') { t.setAttribute('tabindex', '-1'); } t.focus(); }
  }
}
win.addEventListener('click', e => {
  const t = e.target.closest('[data-act], [data-go]');
  if (!t || !win.contains(t)) { if (S.open && !e.target.closest('[data-pop]')) closePop(false); return; }
  if (t.dataset.go) { navigate(t.dataset.go); return; }
  const act = t.dataset.act;
  if (act === 'open') {
    if (S.open === t.dataset.open) { closePop(); return; }
    S.open = t.dataset.open; S.opener = t.dataset.k; S.query = ''; S.pickProv = null; S.justOpened = true; render(); return;
  }
  if (act === 'close') { closePop(); return; }
  if (act === 'rail') { S.pickProv = t.dataset.v; S.query = ''; render(); const s = win.querySelector('[data-k="mp-search"]'); if (s) s.focus(); return; }
  if (act === 'model') { changed(); setChoice(roleOf(t), { model: t.dataset.v }); closePop(); return; }
  if (act === 'effort') { changed(); setChoice(roleOf(t), { effort: t.dataset.v }); closePop(); return; }
  if (act === 'perm') {
    changed();
    const role = roleOf(t);
    if (role.id === 'orchestrating') S.watcherMode = t.dataset.v; else setChoice(role, { perm: t.dataset.v });
    closePop(); return;
  }
  if (act === 'reset') {
    const role = roleOf(t); changed();
    S.undo = { [role.id]: S.choice[role.id] }; delete S.choice[role.id];
    S.toast = `${role.name} is back on its default.`;
    render();
    const h = win.querySelector('#roles-h'); if (h) { h.setAttribute('tabindex', '-1'); h.focus(); }
    return;
  }
  if (act === 'reset-all') {
    const n = chosenCount(); changed();
    S.undo = { ...S.choice }; S.choice = {};
    S.toast = `Reset ${n} ${n === 1 ? 'role' : 'roles'} to ${n === 1 ? 'its default' : 'their defaults'}.`;
    render(); const u = win.querySelector('[data-k="undo"]'); if (u) u.focus(); return;
  }
  if (act === 'undo') { Object.assign(S.choice, S.undo); S.toast = null; S.undo = null; render(); return; }
  if (act === 'keep') { changed(); delete S.choice.orchestrating; render(); const t2 = win.querySelector('#wmsg'); if (t2) t2.focus(); return; }
  if (act === 'from') { S.from = t.dataset.v; render(); return; }
  if (act === 'step') { S.limits[t.dataset.m] = Math.min(8, Math.max(1, S.limits[t.dataset.m] + Number(t.dataset.d))); render(); return; }
  if (act === 'nodraw') { S.toast = 'That page is not drawn in this prototype.'; S.undo = null; render(); return; }
});
win.addEventListener('change', e => { const t = e.target; if (t.dataset.act === 'place') { S.placement = t.value; render(); } });
win.addEventListener('input', e => { const t = e.target; if (t.dataset.act === 'search') { S.query = t.value; render(); } });
function cycle(d) {
  const keys = Object.keys(VARIANTS);
  S.variant = keys[(keys.indexOf(S.variant) + d + keys.length) % keys.length];
  S.open = null; render();
}
function moveIn(container, selector, key) {
  const items = [...container.querySelectorAll(selector)].filter(b => !b.disabled);
  if (!items.length) return false;
  const i = items.indexOf(document.activeElement);
  let n;
  if (key === 'Home') n = 0; else if (key === 'End') n = items.length - 1;
  else n = (i + (key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
  items[n].focus();
  return items[n];
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.open) { e.preventDefault(); closePop(); return; }
  const t = e.target;
  if (['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(e.key) && t.closest) {
    const rail = t.closest('.mp__rail');
    if (rail) { e.preventDefault(); const b = moveIn(rail, '[role="tab"]', e.key); if (b) { S.pickProv = b.dataset.v; S.query = ''; render(); const now = win.querySelector(`[data-k="rail-${b.dataset.v}"]`); if (now) now.focus(); } return; }
    const lb = t.closest('[role="listbox"]');
    if (lb) { e.preventDefault(); moveIn(lb, '[role="option"]', e.key); return; }
    if (t.dataset && t.dataset.act === 'search' && e.key === 'ArrowDown') { e.preventDefault(); const f = win.querySelector('.mp__models [role="option"]:not(:disabled)'); if (f) f.focus(); return; }
  }
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  if (t.closest && t.closest('input, select, textarea, [contenteditable], [data-pop], [role="tablist"], [role="table"], .seg, .step, fieldset')) return;
  e.preventDefault(); cycle(e.key === 'ArrowRight' ? 1 : -1);
});
document.getElementById('pv-prev').addEventListener('click', () => cycle(-1));
document.getElementById('pv-next').addEventListener('click', () => cycle(1));
document.querySelectorAll('#pt-surface button').forEach(b => b.addEventListener('click', () => { S.surface = b.dataset.surface; S.open = null; render(); }));
document.getElementById('pt-prov').addEventListener('change', e => { S.prov = e.target.value; S.open = null; changed(); render(); });
document.getElementById('pt-choices').addEventListener('change', e => { S.choice = structuredClone(PRESETS[e.target.value] || {}); S.open = null; changed(); render(); });
document.getElementById('pt-ceiling').addEventListener('change', e => { S.ceiling = e.target.value; render(); });
document.getElementById('pt-roles').addEventListener('click', () => { S.at = 'roles'; render(); });
document.getElementById('pt-size').addEventListener('change', e => { S.size = e.target.value; render(); });
document.getElementById('pt-theme').addEventListener('click', () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; render(); });
addEventListener('resize', () => render());
if (S.open) S.opener = S.open;
render();
})();
</script>
</body>
</html>
