/* Tokens every feature reads. Declared once for both modes: the theme roles
   already differ per mode, and the few constants that do not come from a theme
   (status green, provider marks, shadows, glass blur) are set per mode below.
   A custom property substitutes its var()s where it is declared, so an element
   that carries `data-theme-scope` with its own --theme-* roles (the preview on
   Settings → Appearance, showing the other half) re-derives every token from
   them here without repainting the window. */
:root, [data-theme-scope] {
  --theme-contrast-target: white;
  --tt-glass-blur: 16px;
  --tt-glass-saturation: 1.08;

  --tt-canvas: var(--theme-canvas);
  --tt-chrome: var(--theme-chrome);
  --tt-surface: var(--theme-surface);
  --tt-surface-elevated: var(--theme-surface-raised);
  --tt-surface-overlay: var(--theme-surface-overlay);
  --tt-surface-sunken: var(--theme-muted);
  --tt-panel: var(--theme-surface);
  --tt-sidebar: var(--theme-sidebar);
  --tt-field: var(--theme-surface);
  /* A card is a filled container with no outline, one step off the room: the raised surface by night, a step
     darker than the canvas by day (set in the light block below). Rows inside it divide with a line of the inset,
     and fields, samples and tracks inside it take the inset too. The selected card or item wears the accent
     surface mixed into the card. */
  --tt-card: var(--theme-surface-raised);
  /* The card's own solid colour, which Glass's translucent card leaves in place for what must stay solid. */

  --tt-card-inset: var(--theme-canvas);
  --tt-card-selected: color-mix(in oklab, var(--theme-accent-surface) 65%, var(--tt-card));
  /* The composer's card and its faint ink: the card's and the faint ink's, unless a theme's block parts them (the Sotto
     theme by day does, so the composer keeps the card it was drawn on). */
  --tt-composer-card: var(--tt-card);
  --tt-composer-text-faint: var(--tt-text-faint);
  /* A segmented control is a sunken track with the chosen segment raised out of it: the overlay by night, the
     surface by day (set in the light block below). */

  --tt-text: color-mix(in oklab, color-mix(in oklab, var(--theme-text) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-text-2: color-mix(in oklab, color-mix(in oklab, color-mix(in oklab, var(--theme-text) 55%, var(--theme-muted-foreground)) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-boost));
  /* Secondary text, the times, statuses, labels and metadata read at the caption sizes: the theme's muted role, a quarter
     of the way to its text, so a 12px time reads clearly and still sits a step under the words it describes. It lifts in
     proportion, so a theme whose muted text is already near its body text (Glass) moves little. The composer keeps the
     quieter tier it was drawn in, `--tt-text-quiet`, the muted role 15% of the way, and so does the effort control. */

  --tt-text-muted: color-mix(in oklab, color-mix(in oklab, color-mix(in oklab, var(--theme-muted-foreground) 76%, var(--theme-text)) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-boost));
  /* The prompt's hint (its placeholder): the theme's own Placeholder role, the ink every other field's placeholder takes.
     It was the Muted text role, but a theme can draw its muted text close to its body text (Vellum Night's sits at
     7.7:1 on the composer card, against the body's 12:1), and a hint that bright reads as typed words (Drake, November
     2, 2026). High Contrast lifts it at half strength, so at the top step it stays dimmer than typed words, which go to
     pure white (or black) there. */
  --tt-text-hint: color-mix(in oklab, color-mix(in oklab, var(--theme-placeholder) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-hint-boost));
  --tt-text-faint: color-mix(in oklab, color-mix(in oklab, var(--theme-placeholder) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-boost));
  /* What the transcript writes in the muted tier, names, times and folded work, a step nearer the body, because it is read
     for a long time at small sizes. threads.css sets it as the transcript's muted tier; the composer stays on its quiet tier. */
  --tt-transcript-muted: color-mix(in oklab, var(--tt-text-quiet) 80%, var(--tt-text));
  /* The weight of the small secondary words, the times, counts, statuses and Worked for lines read at the caption and small
     steps: regular by night, and a step heavier by day (set in the light block below), where strokes that thin render
     lighter than their ink (Zach's pick B, ADR-0024 November 7 amendment). */

  --tt-reading-text-2: var(--tt-text-2);
  --tt-reading-bubble-text: var(--tt-bubble-text);
  --tt-reading-code-text: var(--tt-code-text);
  --tt-reading-hairline: var(--tt-border-faint);

  --tt-hairline: var(--tt-border-faint);
  --tt-panel-border: var(--tt-border-faint);

  --tt-hover: color-mix(in srgb, var(--theme-accent-surface) 70%, transparent);
  --tt-hover-strong: var(--theme-accent-surface);
  --tt-track: color-mix(in srgb, var(--theme-text) 4%, transparent);
  --tt-bubble: var(--theme-message-surface);
  --tt-bubble-text: color-mix(in oklab, color-mix(in oklab, var(--theme-message-foreground) var(--theme-contrast-base), var(--theme-message-surface)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-kbd: var(--theme-secondary);
  --tt-skeleton-a: var(--theme-surface);
  --tt-skeleton-b: var(--theme-surface-raised);
  --tt-scrollbar: var(--theme-terminal-scrollbar);
  --tt-scrollbar-hover: var(--theme-terminal-scrollbar-hover);
  /* The neutral pill carries a page's one action in the theme's own ink. */
  --tt-pill: var(--tt-text);
  --tt-pill-ink: var(--theme-canvas);

  --tt-warning: color-mix(in oklab, color-mix(in oklab, var(--theme-warning-foreground) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-warning-text: var(--tt-warning);
  --tt-warning-surface: var(--theme-warning-surface);
  --tt-attention: var(--tt-warning);
  --tt-error: color-mix(in oklab, color-mix(in oklab, var(--theme-error-foreground) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-error-text: var(--tt-error);
  --tt-danger: var(--tt-error);
  --tt-error-contrast: var(--theme-canvas);
  --tt-error-surface: var(--theme-error-surface);
  --tt-error-border: color-mix(in oklab, var(--theme-error) 38%, var(--theme-error-surface));
  /* Mark up's red and amber inks (ADR-0170, part 5): the theme's error and warning colours at full strength, which stand

  --tt-ink-red: var(--theme-error);
  --tt-ink-amber: var(--theme-warning);
  /* Status text on a tinted surface, the selection or the bubble, steps toward the body ink so it keeps 4.5:1. */
  --tt-warning-on-tint: color-mix(in oklab, var(--tt-warning-text) 90%, var(--tt-text));
  --tt-error-on-tint: color-mix(in oklab, var(--tt-error-text) 80%, var(--tt-text));
  --tt-update: var(--theme-update);
  --tt-update-text: color-mix(in oklab, color-mix(in oklab, var(--theme-update-foreground) var(--theme-contrast-base), var(--theme-update-surface)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-update-surface: var(--theme-update-surface);

  --tt-code-bg: var(--theme-code-background);
  --tt-code-border: var(--tt-border-faint);
  --tt-code-text: color-mix(in oklab, color-mix(in oklab, var(--theme-code-foreground) var(--theme-contrast-base), var(--theme-code-background)), var(--theme-contrast-target) var(--theme-contrast-boost));

  /* The accent: the live wave, focus, selection and accent-coloured text.
     Accent text uses the theme's readable accent tone, not the raw fill. */
  --tt-accent: var(--theme-accent);
  --tt-accent-hover: color-mix(in oklab, var(--theme-accent) 84%, var(--theme-contrast-target));
  --tt-accent-text: color-mix(in oklab, color-mix(in oklab, var(--theme-update-foreground) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-on-accent: var(--theme-accent-foreground);
  --tt-focus-ring: var(--theme-focus);

  /* Primary actions are the theme's message action, as in T3 Code. */
  --tt-primary: var(--theme-message-action);
  --tt-primary-hover: var(--theme-message-action-hover);
  --tt-primary-contrast: var(--theme-message-action-foreground);
  --tt-activity: var(--tt-accent-text);
  --tt-link: var(--tt-accent-text);
  --tt-accent-wash: color-mix(in srgb, var(--tt-accent) 14%, transparent);
  --tt-activity-wash: var(--tt-accent-wash);
  --tt-accent-border: color-mix(in srgb, var(--tt-accent) 45%, var(--tt-field-border));
  --tt-field-border-focus: color-mix(in srgb, var(--tt-accent) 55%, var(--tt-field-border));
  --tt-selected: var(--theme-sidebar-row-selected);
  --tt-selected-border: color-mix(in srgb, var(--tt-accent) 30%, var(--tt-field-border));
  /* Outline for colour swatches whose fill is not a theme colour. */
  --tt-swatch-edge: color-mix(in srgb, var(--theme-text) 22%, transparent);
  --tt-table-stripe: color-mix(in srgb, var(--tt-text) 3%, transparent);

     secondary surfaces, and terminals. */

  /* The sidebar's times and statuses lift a quarter of the way to its text, as the window's secondary text does. */
  --tt-sidebar-text-muted: color-mix(in oklab, color-mix(in oklab, color-mix(in oklab, var(--theme-sidebar-muted-foreground) 76%, var(--theme-sidebar-foreground)) var(--theme-contrast-base), var(--theme-sidebar)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-sidebar-control: var(--theme-sidebar-control-surface);
  --tt-sidebar-row-hover: var(--theme-sidebar-row-hover);
  --tt-sidebar-row-active: var(--theme-sidebar-row-active);
  --tt-sidebar-row-selected: var(--theme-sidebar-row-selected);
  --tt-sidebar-border: color-mix(in srgb, color-mix(in srgb, var(--theme-sidebar-border) var(--theme-contrast-base), transparent), var(--theme-sidebar-foreground) var(--theme-contrast-border-boost));
  --tt-toolbar: var(--theme-toolbar);
  --tt-toolbar-text: color-mix(in oklab, color-mix(in oklab, var(--theme-toolbar-foreground) var(--theme-contrast-base), var(--theme-toolbar)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-toolbar-border: color-mix(in srgb, color-mix(in srgb, var(--theme-toolbar-border) var(--theme-contrast-base), transparent), var(--theme-toolbar-foreground) var(--theme-contrast-border-boost));
  --tt-toolbar-control: var(--theme-toolbar-control);
  --tt-toolbar-control-text: color-mix(in oklab, color-mix(in oklab, var(--theme-toolbar-control-foreground) var(--theme-contrast-base), var(--theme-toolbar-control)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-toolbar-control-hover: var(--theme-toolbar-control-hover);
  --tt-secondary: var(--theme-secondary);
  --tt-secondary-text: color-mix(in oklab, color-mix(in oklab, var(--theme-secondary-foreground) var(--theme-contrast-base), var(--theme-secondary)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-accent-surface: var(--theme-accent-surface);
  --tt-accent-surface-text: color-mix(in oklab, color-mix(in oklab, var(--theme-accent-surface-foreground) var(--theme-contrast-base), var(--theme-accent-surface)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-terminal-background: var(--theme-terminal-background);
  --tt-terminal-foreground: color-mix(in oklab, color-mix(in oklab, var(--theme-terminal-foreground) var(--theme-contrast-base), var(--theme-terminal-background)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-terminal-cursor: var(--theme-terminal-cursor);
  --tt-terminal-selection: var(--theme-terminal-selection);
  --tt-terminal-scrollbar: var(--theme-terminal-scrollbar);
  --tt-terminal-scrollbar-hover: var(--theme-terminal-scrollbar-hover);

  /* Glass: floating surfaces are the solid overlay colour, and the composer the solid field (ADR-0084). */
  --tt-glass: var(--theme-surface-overlay);
  --tt-glass-filter: blur(var(--tt-glass-blur)) saturate(var(--tt-glass-saturation));
  --tt-glass-field: var(--tt-field);

  /* Sotto Owl's night sky behind the sidebar header (agents/owlSky.css). The stars are the sidebar's own text at
     four low strengths, three of them in the accent, and the accent glows faintly behind the tile. The night is the
     sidebar a hair darker with its chroma lifted, on the sidebar's own hue; a sidebar with no hue (Citrine) borrows
     Sotto's night blue, 265. The search field is a deeper pool of that night, so its placeholder reads within a
     twentieth of how it reads on the theme's own field.
     --owl-night-hue is a channel expression, so it is only valid inside a relative oklch(). */

  --tt-owl-star-accent: var(--tt-accent);
  --tt-owl-star-o1: .62;
  --tt-owl-star-o2: .38;
  --tt-owl-star-o3: .22;
  --tt-owl-star-o4: .13;
  --tt-owl-faintest-stars: block;
  --tt-owl-star-scale: 1;
  --tt-owl-glow: color-mix(in srgb, var(--tt-accent) 11%, transparent);
  /* The light crossing a running turn's working words (agents/activity.css): the accent at its most vivid, lifted well
     above the words' muted ink so it reads on any theme, however dull its accent. */
  --tt-working-light: oklch(from var(--tt-accent) max(l, .9) min(calc(c * 1.6), .2) h);
  --tt-owl-night: oklch(from var(--tt-sidebar) calc(l - .011) min(calc(c + .025), .05) var(--owl-night-hue));
  --tt-owl-night-field: oklch(from var(--tt-sidebar) calc(l - .05) min(calc(c + .023), .045) var(--owl-night-hue));
  /* Watcher's room has no sidebar, so its night sits in the room's top-left corner (watcher/watcher.css), derived

     than it, chroma lifted, on the same hue. */
  --tt-owl-room-night: oklch(from var(--tt-canvas) calc(l + .04) min(calc(c + .028), .055) var(--owl-night-hue));

     the hue wheel at its own lightness and chroma, so a quiet accent gives quiet trays. A grey accent borrows the
     Sotto Owl night's blue and a little chroma, so its trays still differ. A turned hue that lands on red, orange or
     amber (under 75), the error and attention colours, turns a further 120 degrees. On Citrine they are its yellow,
     a blue, a green and a pink. Like --owl-night-hue, the --rail-* parts are channel expressions, valid only inside

  --rail-turn-2: calc(var(--owl-night-hue) + 155);
  --rail-turn-3: calc(var(--owl-night-hue) + 60);
  --rail-turn-4: calc(var(--owl-night-hue) + 245);
  --rail-hue-2: calc(var(--rail-turn-2) - 360 * clamp(0, (var(--rail-turn-2) - 360) * 100000, 1));
  --rail-hue-3: calc(var(--rail-turn-3) - 360 * clamp(0, (var(--rail-turn-3) - 360) * 100000, 1));

  --tt-rail-group-1: oklch(from var(--tt-accent) l var(--rail-chroma) var(--owl-night-hue));

  --tt-success-wash-hover: color-mix(in oklab, var(--tt-success) 25%, var(--tt-surface));
  --tt-success-wash-press: color-mix(in oklab, var(--tt-success) 31%, var(--tt-surface));
  --tt-success-edge: color-mix(in oklab, var(--tt-success) 55%, var(--tt-field-border));
  --tt-provider-codex: #d7dbe1;
  --tt-provider-claude: #e3b58e;
  --tt-provider-grok: #c9baff;
  --tt-provider-devin: #a5d8f5;
  --tt-provider-opencode: #ece3d0;
  --tt-provider-cursor: #f2b9c9;
  --tt-provider-antigravity: #a8c7fa;
  /* A provider's mark drawn as a glyph rather than on its badge. By night the badge colours read at 10:1 or more as

  --tt-provider-claude-mark: var(--tt-provider-claude);
  --tt-provider-grok-mark: var(--tt-provider-grok);
  --tt-provider-devin-mark: var(--tt-provider-devin);
  /* Settings → Providers draws each mark in the ink on a badge of its provider's colour. Muse has no other colour

     under the ink. */
  --tt-provider-muse: #e6e1d6;
  --tt-provider-opencode-badge: #ece3d0;
  --tt-provider-cursor-badge: #f2b9c9;
  /* DeepSeek's whale has no colour elsewhere, so its badge is a pale shade of DeepSeek's own blue (#4d6bfe). */
  --tt-provider-deepseek-badge: #a3b3ff;
  /* Antigravity's arch is Google's logo (ADR-0212), in Google's blue: a pale shade of it by night and on its badge, a deep one
     as a glyph by day. */
  --tt-provider-antigravity-badge: #a8c7fa;
  --tt-provider-ink: #080b0a;
  /* Chart series (Usage's split chart). Constants per mode like the provider marks: a theme carries T3 Code's
     roles, which name no categorical hues. Six hues and an Other grey, each at least 3:1 on every built-in theme's
     canvas and surface, and every pair, Other included, apart for protanopia and deuteranopia (Machado 2009, OKLab
     distance at least 8 in both modes; themeTokens.test.ts holds both). Slot 1 to 6: blue, orange, cyan, magenta,
     violet, amber. */
  --tt-chart-1: #3792fd;
  --tt-chart-2: #b85207;
  --tt-chart-3: #1dcaf7;
  --tt-chart-4: #c33786;
  --tt-chart-5: #8056d6;
  --tt-chart-6: #c99414;
  --tt-chart-other: #9e9e9e;
  --tt-overlay: color-mix(in srgb, var(--theme-canvas) 64%, transparent);
  --tt-backdrop: rgb(0 0 0 / 38%);
  /* The effort control (ADR-0019): a pill track in the card, and the colourway chosen in Settings → Appearance
     for the fill, the wash and the tinted word at a model's highest level. The colourway's three hues
     (`--tt-effort-a/b/c`), its ink and its border hue are set per colourway after the mode blocks; the tokens
     here shape them for the mode. `--tt-effort-text-fill` is the colour the word is painted in and
     `--tt-effort-text-image` the gradient clipped to it, so a colourway that paints its word as a gradient
     needs no branch in feature CSS. */
  --tt-effort-track: color-mix(in srgb, var(--tt-text) 7%, var(--tt-surface-elevated));
  --tt-effort-dot: color-mix(in srgb, var(--tt-text-quiet) 55%, var(--tt-effort-track));
  --tt-effort-fill-cool: var(--tt-text-quiet);
  --tt-effort-fill-veil: transparent;
  --tt-effort-thumb: var(--tt-text);
  --tt-effort-thumb-edge: color-mix(in srgb, var(--tt-text) 10%, transparent);
  --tt-effort-text: var(--effort-ink);
  --tt-effort-text-fill: var(--tt-effort-text);
  --tt-effort-text-image: none;
  --tt-effort-fill-image: linear-gradient(90deg, var(--tt-effort-a), var(--tt-effort-b), var(--tt-effort-c));
  --tt-effort-wash-image: linear-gradient(to top, var(--tt-effort-a), var(--tt-effort-b), var(--tt-effort-c));

  --tt-shadow-sm: 0 1px 2px rgb(0 0 0 / 40%);
  --tt-shadow-lg: 0 24px 60px rgb(0 0 0 / 55%);
  --tt-shadow-overlay: 0 24px 72px -20px rgb(0 0 0 / 90%);
  --tt-shadow-color: rgb(0 0 0 / 73%);
  /* How strongly the effort trace's halo falls on the room (effortTrace.css); a light room takes a little more. */
  --tt-effort-trace-halo: .55;

  /* Type sizes (ADR-0169). Every font-size in a renderer stylesheet names one of these steps, and
     scaleTokens.test.ts holds it there. `--tt-text-*` already names text colours, so sizes are `--tt-type-*`. */
  --tt-type-micro: 11px; /* Keys, badges and tiny marks */
  --tt-type-caption: 12px; /* Times, counts, statuses, metadata, code in Changes (a sidebar row's take small) */
  --tt-type-small: 13px; /* Descriptions, controls, most interface text, a sidebar row's status and time */
  --tt-type-body: 14px; /* Sidebar rows, fields, menu items */
  --tt-type-reading: 15px; /* Composer, Watcher's conversation, journal entries, settings labels */
  --tt-type-lead: 16px; /* A thread's messages, dialog titles, section intros, request prompts */
  --tt-type-heading: 18px; /* Sidebar brand, empty-room headings */
  --tt-type-figure: 22px; /* Figures in a narrow room, sub-titles */
  --tt-type-title: 28px; /* Room titles and large figures */

  /* Corners (ADR-0169), by what they round. Every border-radius names one of these steps. */
  --tt-radius-mark: 2px; /* Meters, legend squares, focus marks */
  --tt-radius-tag: 4px; /* Tags, keys, chips, small close buttons */
  --tt-radius-control: 6px; /* Buttons, fields, composer chips */
  --tt-radius-row: 8px; /* Sidebar and menu rows, icon buttons */
  --tt-radius-inset: 10px; /* Code blocks, menus, notes inside a card */
  --tt-radius-card: 14px; /* Cards, the full composer, the Dictate bar */
  --tt-radius-overlay: 20px; /* Dialogs, Zach's two-row composer and the widget */
  --tt-radius-full: 50%; /* Dots and rings: a circle on a square box, never a pill (ADR-0110) */
  /* The names before the scale, kept so whatever names them still rounds the same. */
  --tt-radius-sm: var(--tt-radius-control);
  --tt-radius-md: var(--tt-radius-inset);
  --tt-radius-lg: var(--tt-radius-card);
  --tt-font-ui:
    'Figtree', ui-sans-serif, system-ui, -apple-system,
    BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --tt-font-mono:
    'Spline Sans Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo,
    Consolas, 'Liberation Mono', monospace;
}

:root[data-theme='light'], [data-theme-scope='light'] {
  --theme-contrast-target: black;
  /* By day the raised surface is barely off the canvas, so a card is the canvas with a little of the text in it. */
  --tt-card: color-mix(in oklab, var(--theme-text) 4%, var(--theme-canvas));
  --tt-card-solid: color-mix(in oklab, var(--theme-text) 4%, var(--theme-canvas));
  /* Small secondary words a step heavier by day (see the token above). */
  --tt-weight-quiet: 500;
  --tt-segment-on: var(--theme-surface);
  --tt-glass-blur: 12px;
  --tt-glass-saturation: 1.14;
  --tt-success: oklch(0.445 0.11 158);
  /* By day the green is dark, and a little of it over a near-white surface reads grey, as a control at rest. So the
     wash is the same green raised to a light, clear tint, and its edge is the green itself. */
  --tt-success-wash: oklch(from var(--tt-success) .9 calc(c * .62) h);
  --tt-success-wash-hover: oklch(from var(--tt-success) .86 calc(c * .7) h);
  --tt-success-wash-press: oklch(from var(--tt-success) .82 calc(c * .78) h);
  --tt-success-edge: var(--tt-success);
  --tt-provider-codex: #c9ced6;
  --tt-provider-claude: #e2ad80;
  --tt-provider-grok: #bfaefc;
  --tt-provider-devin: #8fcaef;
  --tt-provider-codex-mark: color-mix(in srgb, var(--tt-provider-codex) 50%, var(--tt-text));
  --tt-provider-claude-mark: color-mix(in srgb, var(--tt-provider-claude) 50%, var(--tt-text));
  --tt-provider-grok-mark: color-mix(in srgb, var(--tt-provider-grok) 50%, var(--tt-text));
  --tt-provider-devin-mark: color-mix(in srgb, var(--tt-provider-devin) 50%, var(--tt-text));
  /* OpenCode's mark is drawn straight from its token in both modes, so the light one is already dark enough to read. */
  --tt-provider-opencode: #625843;
  /* Cursor's, like OpenCode's, is drawn straight from its token in both modes: a pale rose by night, a deep one by day. */
  --tt-provider-cursor: #94405a;
  --tt-provider-antigravity: #0b57d0;
  --tt-provider-muse: #d9d3c4;
  --tt-provider-opencode-badge: #e4dac4;
  --tt-provider-cursor-badge: #eaaabd;
  --tt-provider-deepseek-badge: #93a6ff;
  --tt-provider-antigravity-badge: #a8c7fa;
  --tt-provider-ink: #0b0d0c;
  --tt-chart-1: #0554a3;
  --tt-chart-2: #883c04;
  --tt-chart-3: #038db6;
  --tt-chart-4: #980563;
  --tt-chart-5: #885ee0;
  --tt-chart-6: #a07506;
  --tt-chart-other: #747474;
  --tt-overlay: color-mix(in srgb, var(--theme-canvas) 60%, transparent);
  --tt-backdrop: rgb(20 24 22 / 22%);
  --tt-shadow-sm: 0 1px 2px rgb(20 24 22 / 10%);
  --tt-shadow-lg: 0 24px 60px rgb(20 24 22 / 18%);
  --tt-shadow-overlay: 0 24px 64px -24px rgb(0 0 0 / 45%);
  --tt-shadow-color: rgb(20 24 22 / 18%);
  /* Light: the effort fill tints toward white so it stays a light surface, the thumb is paper with an edge,
     and the tinted word mixes toward the ink so it reads at 4.5:1. */
  --tt-effort-fill-cool: color-mix(in srgb, var(--tt-text-quiet) 40%, var(--tt-surface-elevated));
  --tt-effort-fill-veil: color-mix(in srgb, white 38%, transparent);
  --tt-effort-thumb: var(--tt-surface);
  --tt-effort-thumb-edge: var(--tt-border);
  --tt-effort-text: var(--effort-ink-light);
  /* Sotto Owl's sky by day: grey dots on a light surface read as dust, so the stars take the accent, a little
     larger, and the faintest drop out. There is no night by day. The band is a faint wash of the accent's hue: the
     accent is mixed in at full lightness, so the wash is never darker than the sidebar whatever the theme. The field
     and the switch keep their own colours. */
  --tt-owl-star: var(--tt-accent);
  --tt-owl-star-o1: .58;
  --tt-owl-star-o2: .44;
  --tt-owl-star-o3: .32;
  --tt-owl-star-o4: 0;
  --tt-owl-faintest-stars: none;
  --tt-owl-star-scale: 1.2;
  --tt-owl-glow: color-mix(in srgb, var(--tt-accent) 8%, transparent);
  /* By day the light is the accent deepened instead, below the muted ink. */
  --tt-working-light: oklch(from var(--tt-accent) min(l, .38) min(calc(c * 1.6), .2) h);
  --tt-owl-night: color-mix(in oklab, var(--tt-sidebar) 90%, oklch(from var(--tt-accent) 1 c h));
  --tt-owl-room-night: color-mix(in oklab, var(--tt-canvas) 90%, oklch(from var(--tt-accent) 1 c h));
  --tt-owl-night-field: var(--tt-field);
  --tt-effort-trace-halo: .7;
}

/* The desktop's Sotto halves read softer than the palette says (ADR-0024, November 4, 2026 amendment). This lives here rather
   than in palettes.ts because the iPhone's palette is generated from that file and keeps its own values. The room rises only
   as far as leaves the composer's card its step above it. --tt-canvas stays the palette's at the root and across Watcher's
   room: its night scene, its Stars and its words' glow read the root and the shell, and they keep their colours exactly.
   The inks are read only by the reading surface below; the composer and the chrome keep theirs.
   By night the room is a soft warm ink with the sidebar and Tools a step below it, as Zach picked (C, November 5, 2026).
   The palette writes its roles inline on the root, so the surfaces it moves are set here as the tokens they paint through.
   The composer's card, the raised surface, keeps its value, and so does every token the composer reads. */
:root { --tt-font-ui: 'Figtree', system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100dvh; background: var(--tt-canvas); color: var(--tt-text); font: 400 var(--tt-type-body)/1.45 var(--tt-font-ui); -webkit-font-smoothing: antialiased; padding-bottom: 120px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--tt-focus-ring); outline-offset: 2px; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* The window: a thin drag strip, the settings list and the room. */
.strip { height: 34px; display: flex; align-items: center; padding: 0 14px; border-bottom: 1px solid var(--tt-hairline); color: var(--tt-text-muted); font-size: var(--tt-type-caption); background: var(--tt-canvas); }
.strip b { color: var(--tt-text); font-weight: 600; margin-right: 8px; }
.shell { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: calc(100dvh - 34px); }
.nav { border-right: 1px solid var(--tt-hairline); padding: 18px 10px; display: grid; align-content: start; gap: 2px; }
.nav a { display: block; padding: 7px 10px; border-radius: var(--tt-radius-row); color: var(--tt-text-muted); text-decoration: none; font-size: var(--tt-type-body); }
.nav a[aria-current] { background: var(--tt-card); color: var(--tt-text); font-weight: 600; }
.room { min-width: 0; padding: 28px 32px; }
.room > h2 { margin: 0 0 18px; font-size: var(--tt-type-figure); font-weight: 600; letter-spacing: -0.01em; }
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .nav { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--tt-hairline); padding: 8px 10px; gap: 4px; }
  .nav a { white-space: nowrap; }
  .room { padding: 18px 14px; }
}

/* Copied from global.css, crossing-settings.css, hosts.css and hostProviders.css on the branch. */
.tt-button { display: inline-flex; min-height: 34px; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--tt-field-border); border-radius: var(--tt-radius-control); padding: 0 14px; background: var(--tt-surface); color: var(--tt-text-2); font-size: var(--tt-type-small); font-weight: 500; line-height: 1.2; white-space: nowrap; transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, filter 120ms ease, opacity 120ms ease; }
.tt-button:hover:not(:disabled) { border-color: var(--tt-text-faint); color: var(--tt-text); }
.tt-button:active:not(:disabled) { background: var(--tt-hover); }
.tt-button:disabled { cursor: not-allowed; opacity: .45; }
.tt-button--primary { border-color: var(--tt-pill); background: var(--tt-pill); color: var(--tt-pill-ink); font-weight: 600; }
.tt-button--primary:hover:not(:disabled) { border-color: var(--tt-pill); color: var(--tt-pill-ink); filter: brightness(1.12); }
.tt-button--ghost { border-color: transparent; background: transparent; color: var(--tt-text-faint); }
.tt-button--ghost:hover:not(:disabled) { border-color: transparent; color: var(--tt-text); }
.tt-button--danger { border-color: transparent; background: transparent; color: var(--tt-error); }
.tt-button--icon { width: 28px; min-height: 28px; height: 28px; padding: 0; border-color: transparent; background: transparent; color: var(--tt-text-muted); }
.tt-input { width: 100%; min-height: 32px; border: 1px solid var(--tt-border-faint); border-radius: var(--tt-radius-control); background: var(--tt-surface-sunken); padding: 4px 12px; color: var(--tt-text); font-size: var(--tt-type-small); font-weight: 500; }
.tt-input:hover:not(:disabled) { border-color: var(--tt-border); }
.tt-input:disabled { cursor: not-allowed; opacity: .62; }
.tt-input::placeholder { color: var(--tt-text-faint); }
.segmented-control { display: inline-flex; justify-self: start; align-items: center; padding: 3px; gap: 2px; border-radius: var(--tt-radius-control); background: var(--tt-surface-sunken); max-width: 100%; }
.segmented-control button { min-height: 30px; padding: 2px 12px; border: 0; border-radius: var(--tt-radius-tag); font-size: var(--tt-type-small); color: var(--tt-text-muted); background: none; white-space: normal; line-height: 1.25; }
.segmented-control button:hover:not(:disabled) { color: var(--tt-text); }
.segmented-control button[aria-checked='true'] { background: var(--tt-surface-elevated); color: var(--tt-text); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / 18%); }
.segmented-control button:disabled { opacity: .5; cursor: default; }
.segmented-control button:focus-visible { outline: 2px solid var(--tt-focus-ring); outline-offset: -2px; }

.hosts-settings { display: grid; gap: 20px; max-width: 1040px; }
.hosts-settings h3, .hosts-settings h4 { margin: 0; font-weight: 600; }
.hosts-settings h3 { font-size: var(--tt-type-heading); }
.hosts-settings h4 { font-size: var(--tt-type-reading); }
.hosts-settings p { margin: 6px 0 0; color: var(--tt-text-muted); font-size: var(--tt-type-body); }
.hosts-heading { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.hosts-card { display: grid; padding: 2px 20px; border-radius: var(--tt-radius-lg); background: var(--tt-card); }
.hosts-settings .hosts-card > * { padding: 16px 0; border: 0; border-bottom: 2px solid var(--tt-card-inset); }
.hosts-settings .hosts-card > :last-child { border-bottom: 0; }
.hosts-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; min-width: 0; }
.hosts-row__icon { display: grid; flex: 0 0 auto; place-items: center; width: 34px; height: 34px; border-radius: var(--tt-radius-sm); background: var(--tt-card-inset); color: var(--tt-accent-text); }
.hosts-row__icon--local { color: var(--tt-text-muted); }
.hosts-row__info { flex: 1 1 220px; min-width: 0; overflow-wrap: anywhere; }
.hosts-settings .hosts-row__meta { margin-top: 2px; font-size: var(--tt-type-small); }
.hosts-row__meta b { color: var(--tt-text); font-weight: 400; }
.hosts-row__actions { display: flex; flex: 0 0 auto; align-items: center; gap: 6px; margin-left: auto; }
.hosts-switch { display: inline-flex; align-items: center; gap: 8px; color: var(--tt-text-muted); font-size: var(--tt-type-small); }
.switch { width: 36px; height: 20px; border-radius: 10px; background: var(--tt-accent); position: relative; border: 0; padding: 0; }
.switch::after { content: ''; position: absolute; top: 3px; right: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--tt-accent-foreground, #fff); }

.host-providers { display: grid; flex: 1 0 100%; gap: 10px; min-width: 0; padding-left: 48px; }
.host-providers__toggle.tt-button { justify-self: start; margin-left: -12px; }
.host-providers__panel { display: grid; gap: 10px; min-width: 0; container-type: inline-size; }
.host-providers__grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 0; padding: 0; list-style: none; }
@container (min-width: 700px) { .host-providers__grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@container (max-width: 340px) { .host-providers__grid { grid-template-columns: minmax(0, 1fr); } }
.hosts-settings .host-providers__foot { margin: 0 0 4px; color: var(--tt-text-muted); font-size: var(--tt-type-caption); }
.host-provider { position: relative; display: grid; grid-template-rows: auto auto auto 1fr auto; gap: 6px; min-width: 0; min-height: 132px; border: 1px solid transparent; border-radius: var(--tt-radius-md); background: var(--tt-card-inset); padding: 12px; }
.host-provider[data-kind='not-installed'] { background: transparent; border-color: var(--tt-card-inset); }
.host-provider__top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.host-provider__top h5 { margin: 0; overflow-wrap: anywhere; color: var(--tt-text); font-size: var(--tt-type-body); font-weight: 600; flex: 1; }
.host-provider__mark { display: grid; flex: 0 0 auto; place-items: center; width: 28px; height: 28px; border-radius: var(--tt-radius-sm); background: var(--tt-card); }
.host-provider__mark svg { width: 16px; height: 16px; fill: currentColor; }
.hosts-settings .host-provider__state { display: flex; align-items: center; gap: 7px; margin: 0; color: var(--tt-text); font-size: var(--tt-type-small); }
.hosts-settings .host-provider__detail { margin: 0; color: var(--tt-text-muted); font-size: var(--tt-type-caption); overflow-wrap: anywhere; }
.host-provider__act { align-self: end; min-width: 0; }
.host-provider__actions { display: flex; flex-wrap: wrap; gap: 6px; }
.host-provider__actions .tt-button { max-width: 100%; white-space: normal; text-align: left; }
.hosts-settings .host-provider__note { margin: 0; color: var(--tt-text-muted); font-size: var(--tt-type-caption); }
.hosts-settings .host-provider__note:empty { display: none; }
.host-provider__dot { flex: 0 0 auto; width: 8px; height: 8px; border: 1.5px solid var(--tt-text-faint); border-radius: 50%; }
.host-provider[data-kind='connected'] .host-provider__dot { border-color: var(--tt-success); background: var(--tt-success); }
.host-provider[data-kind='signed-out'] .host-provider__dot { border-color: var(--tt-attention); background: var(--tt-attention); }
.host-provider[data-kind='working'] .host-provider__dot { border-color: var(--tt-accent); background: var(--tt-accent); }
.host-provider[data-kind='not-installed'] .host-provider__dot { background: var(--tt-text-faint); }
.mark-claude { color: var(--tt-provider-claude-mark); } .mark-codex { color: var(--tt-provider-codex-mark); } .mark-grok { color: var(--tt-provider-grok-mark); } .mark-antigravity { color: var(--tt-provider-antigravity); }

/* The spinner an update shows while it runs; reduced motion keeps it still. */
.spin { display: inline-block; flex: none; width: 11px; height: 11px; border: 2px solid var(--tt-border); border-top-color: var(--tt-update); border-radius: 50%; animation: spin 900ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; border-right-color: var(--tt-update); } }
.hosts-settings .progress, .tt-dialog .progress { display: flex; align-items: center; gap: 7px; margin: 0; color: var(--tt-accent-text); font-size: var(--tt-type-caption); font-weight: 500; }

/* The dialog. */
.tt-dialog-backdrop { position: fixed; z-index: 50; display: grid; inset: 0; place-items: center; background: var(--tt-overlay); padding: 20px 20px 96px; }
.tt-dialog { width: min(480px, 100%); max-height: calc(100dvh - 40px); overflow-y: auto; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-md); background: var(--tt-surface-elevated); box-shadow: var(--tt-shadow-lg); padding: 24px; }
@media (prefers-reduced-motion: no-preference) { .tt-dialog { animation: rise 160ms cubic-bezier(.2,.8,.2,1); } @keyframes rise { from { opacity: 0; transform: translateY(8px) scale(.98); } } }
.tt-dialog h2 { margin: 0; font-size: var(--tt-type-lead); font-weight: 600; line-height: 1.3; }
.tt-dialog__actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.tt-dialog__actions .tt-button { min-height: 44px; padding-inline: 16px; }
.hosts-notice { display: flex; align-items: flex-start; gap: 10px; border-left: 2px solid var(--tt-accent); border-radius: var(--tt-radius-sm); background: var(--tt-surface-sunken); padding: 10px 12px; font-size: var(--tt-type-small); }
.hosts-settings .hosts-notice p, .tt-dialog .hosts-notice p { margin: 0; color: var(--tt-text); font-size: var(--tt-type-small); }
.hosts-notice--done { border-left-color: var(--tt-success); }
.hosts-notice--done svg { color: var(--tt-success); }
.hosts-notice--forge { border-left-color: var(--tt-attention); }
.sign-in { display: grid; gap: 12px; margin-top: 12px; }
.sign-in p, .ag p { margin: 0; color: var(--tt-text); font-size: var(--tt-type-small); }
.quiet, .hosts-settings p.quiet, .tt-dialog p.quiet { color: var(--tt-text-muted); font-size: var(--tt-type-caption); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }

}

<body>
<!--
  PROTOTYPE, throwaway. Not app code.
  Question: how should Settings > Providers > Antigravity warn that the user's own Google account carries the risk under
  Google's Antigravity terms? Three variants, switchable with ?variant=A|B|C, the bar, or the Left and Right keys:
    A  A notice in the opened row       always there, above the sign-in method
    B  One line, opens for the detail   a short caution under the row's status; the specifics open in place
    C  Before you sign in               the notice in the sign-in step, with a box to tick before Sign in
  The bar also shows the row signed in, light and dark, and the limits answer: removed, or an opt-in switch.
  Nothing here talks to Google or agy; every press is simulated in memory.
-->
<main class="page">
  <h1>Providers</h1>
  <p class="sub">This computer’s clients. Choose one to see its connection and models.</p>
  <div class="prov" id="prov"></div>
  <p class="proto-note" id="note"></p>
</main>
<div class="proto-bar" role="region" aria-label="Prototype controls">
  <span class="group"><span class="tag">PROTOTYPE</span>
    <button id="prev" aria-label="Previous variant">←</button>
    <span class="label" id="vlabel" aria-live="polite"></span>
    <button id="next" aria-label="Next variant">→</button></span>
  <span class="group">
    <select id="state" aria-label="Row state"><option value="out">Not signed in</option><option value="in">Signed in</option></select>
    <select id="limits" aria-label="Account limits"><option value="removed">Limits: removed</option><option value="optin">Limits: opt-in switch</option></select>
    <button id="theme" aria-label="Switch light and dark">Light</button></span>
</div>
<script>
const MARK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.751 22.607c1.34 1.005 3.35.335 1.508-1.508C17.73 15.74 18.904 1 12.037 1 5.17 1 6.342 15.74.815 21.1c-2.01 2.009.167 2.511 1.507 1.506 5.192-3.517 4.857-9.714 9.715-9.714 4.857 0 4.522 6.197 9.714 9.715z"/></svg>'
const ALERT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg>'
const VARIANTS = {
  A: { name: 'A notice in the opened row', note: 'Always there when the row is open, above the sign-in method, signed in or not. The row itself stays as it is when closed.' },
  B: { name: 'One line, opens for the detail', note: 'A short caution sits under the row’s status even when the row is closed; “What Google allows” opens the specifics in place.' },
  C: { name: 'Before you sign in', note: 'The notice sits in the sign-in step, and Sign in waits for the box to be ticked. Once signed in, a single line stays.' },
}
const ORDER = ['A', 'B', 'C']
const params = new URLSearchParams(location.search)
let variant = ORDER.includes(params.get('variant')) ? params.get('variant') : 'A'
let signedIn = params.get('state') === 'in', limits = params.get('limits') === 'optin' ? 'optin' : 'removed'
let open = false, ticked = false, limitsOn = false
const TITLE = 'Your Google account carries the risk'
const LEAD = 'Google’s Antigravity terms let it suspend an account it sees used outside its own apps. Sotto drives Google’s own agy, which keeps its own sign-in, and stays inside what the terms name:'
const POINTS = [
  'Sotto never reads agy’s sign-in or calls Google’s servers with it.',
  'Only Gemini models. Google allows Claude and other models only in its own app, CLI and IDEs, so Sotto does not list them.',
  'Running agy from another app is still a gray area. Google may count it against the account you sign in with here.',
]
const TERMS = '<a href="#" onclick="return false">Google’s Antigravity terms</a>'
const full = () => `<div class="risk" role="note" aria-label="${TITLE}"><div class="risk__head">${ALERT}<span>${TITLE}</span></div>
  <p>${LEAD}</p><ul>${POINTS.map(p => `<li>${p}</li>`).join('')}</ul><p class="muted">Read ${TERMS} before you sign in an account you depend on.</p></div>`
const method = () => `<div><span class="field-label">Sign-in method</span><div class="seg"><span class="on">Google account</span><span>Gemini Enterprise</span><span>Gemini API key</span><span>Agent Platform</span></div></div>`
const limitSwitch = () => limits !== 'optin' ? '' : `<div class="limit"><div><p><strong>Show account limits in Usage</strong></p>
  <p class="muted">Off by default. On, Sotto reads agy’s sign-in and asks Google’s Antigravity servers for your limits, which Google’s terms name as a reason to suspend an account.</p></div>
  <button class="toggle" role="switch" aria-checked="${limitsOn}" aria-label="Show Antigravity account limits in Usage" onclick="limitsOn=!limitsOn;draw()"></button></div>`
function signInSteps(gate) {
  const disabled = gate && !ticked
  return `<ol class="steps"><li><span class="n">1</span><div><p>Sign in with your Google account in your browser.</p>
    ${gate ? `<label class="check" style="margin-top:8px"><input type="checkbox" ${ticked ? 'checked' : ''} onchange="ticked=this.checked;draw()"><span>I understand my Google account carries this risk.</span></label>` : ''}
    <button class="tt-button tt-button--primary" ${disabled ? 'disabled aria-disabled="true"' : ''} onclick="signedIn=true;document.getElementById('state').value='in';draw()">Sign in with Google</button></div></li>
    <li><span class="n">2</span><div><p>Google then shows a code on an antigravity.google page. Paste it here to finish.</p></div></li></ol>`
}
function detail() {
  const lead = `<p class="muted">${signedIn ? 'Sotto runs agy with a folder of its own, so the agy you run yourself, and its sign-in, stay as they are.' : 'Sotto runs agy with a folder of its own. Choose how it signs in: a Google account, Gemini Enterprise, a Gemini API key or Agent Platform.'}</p>`
  const out = signedIn ? `<div class="actions"><button class="tt-button tt-button--ghost">Connect again</button><button class="tt-button tt-button--ghost" onclick="signedIn=false;ticked=false;document.getElementById('state').value='out';draw()">Sign out of Antigravity</button></div>` : ''
  if (variant === 'A') return `${full()}${lead}${method()}${signedIn ? out : signInSteps(false)}${limitSwitch()}`
  if (variant === 'B') return `${lead}${method()}${signedIn ? out : signInSteps(false)}${limitSwitch()}`
  return `${lead}${method()}${signedIn ? `<div class="risk risk--quiet"><p class="caution" style="color:var(--tt-warning-text)">${ALERT.replace('<svg', '<svg style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;vertical-align:-2px"')} Your Google account carries the risk under ${TERMS}.</p></div>${out}` : `${full()}${signInSteps(true)}`}${limitSwitch()}`
}
let bOpen = false
function draw() {
  document.documentElement.dataset.theme = document.getElementById('theme').dataset.mode || 'dark'
  const status = signedIn ? '<span class="dot" aria-hidden="true"></span><span class="word">Connected · 1.5.13</span>' : '<span class="word">Not signed in</span>'
  const caution = variant === 'B' ? `<div style="padding:0 14px 12px 46px"><button class="disclose" aria-expanded="${bOpen}" onclick="bOpen=!bOpen;draw()">${ALERT.replace('<svg', '<svg style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2"')}<span>Google may suspend an account used outside its own apps. <u>${bOpen ? 'Hide what Google allows' : 'What Google allows'}</u></span></button>${bOpen ? `<div style="margin-top:10px">${full()}</div>` : ''}</div>` : ''
  document.getElementById('prov').innerHTML = `
    <div class="prow prow--dim"><span class="name">Claude Code</span><span class="status"><span class="dot"></span><span class="word">Connected</span></span></div>
    <div class="prow prow--dim"><span class="name">Codex</span><span class="status"><span class="dot"></span><span class="word">Connected</span></span></div>
    <div class="prow" role="button" tabindex="0" aria-expanded="${open}" onclick="open=!open;draw()" onkeydown="if(event.key==='Enter'){open=!open;draw()}">${MARK}<span class="name">Antigravity</span><span class="status">${status}</span></div>
    ${caution}${open ? `<div class="detail">${detail()}</div>` : ''}
    <div class="prow prow--dim"><span class="name">Cursor</span><span class="status"><span class="word">Not installed</span></span></div>`
  document.getElementById('vlabel').innerHTML = `${variant}: ${VARIANTS[variant].name}<small>${ORDER.indexOf(variant) + 1} of ${ORDER.length}</small>`
  document.getElementById('note').textContent = `${VARIANTS[variant].note} Press the Antigravity row to open it.`
  const url = new URL(location.href); url.searchParams.set('variant', variant); url.searchParams.set('state', signedIn ? 'in' : 'out'); url.searchParams.set('limits', limits); history.replaceState(null, '', url)
}
const step = by => { variant = ORDER[(ORDER.indexOf(variant) + by + ORDER.length) % ORDER.length]; ticked = false; bOpen = false; draw() }
document.getElementById('prev').onclick = () => step(-1)
document.getElementById('next').onclick = () => step(1)
document.getElementById('state').value = signedIn ? 'in' : 'out'
document.getElementById('state').onchange = event => { signedIn = event.target.value === 'in'; ticked = false; draw() }
document.getElementById('limits').value = limits
document.getElementById('limits').onchange = event => { limits = event.target.value; draw() }
document.getElementById('theme').onclick = event => { const button = event.target; button.dataset.mode = button.dataset.mode === 'light' ? 'dark' : 'light'; button.textContent = button.dataset.mode === 'light' ? 'Dark' : 'Light'; draw() }
addEventListener('keydown', event => { if (event.target.closest('input, select')) return; if (event.key === 'ArrowLeft') step(-1); if (event.key === 'ArrowRight') step(1) })
open = true
draw()
</script>
</body>
</html>
