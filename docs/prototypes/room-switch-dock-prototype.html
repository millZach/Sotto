<!doctype html>
<!--
  Throwaway prototype. Not product code.
  Question: the icon dock was picked from docs/prototypes/room-switch-prototype.html. Which refinement of it?
  Nine dock variants (fill, width, shape, icons, labels), each clickable and arrow-key driven.
  Picked: G everywhere, sized to each place (October 24, 2026).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Room switch: icon dock refinements</title>
<style>
  :root {
    --canvas:#121211; --surface:#1a1a19; --raised:#2a2a27; --sunk:#0c0c0b; --line:#2e2e2b;
    --text:#ecebe6; --muted:#9a9890; --accent:#e8c547; --on-accent:#1a1600; --accent-soft:rgba(232,197,71,.14);
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  body.light {
    --canvas:#f6f5f0; --surface:#ffffff; --raised:#e6e5de; --sunk:#ecebe5; --line:#d6d4cc;
    --text:#1c1b17; --muted:#5f5d55; --accent:#8a6d00; --on-accent:#fffbe6; --accent-soft:rgba(138,109,0,.12);
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--canvas); color:var(--text); font:14px/1.4 Figtree, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position:sticky; top:0; z-index:5; display:flex; gap:16px; align-items:center; flex-wrap:wrap; padding:14px 24px; background:var(--canvas); border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; font-weight:600; margin:0 12px 0 0; }
  header label { color:var(--muted); display:flex; gap:6px; align-items:center; }
  header button, header select { font:inherit; color:var(--text); background:var(--raised); border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; }
  main { display:grid; grid-template-columns:repeat(auto-fill, minmax(calc(var(--w) + 48px), 1fr)); gap:20px; padding:24px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 24px 20px; }
  .card h2 { font-size:13px; font-weight:600; margin:0 0 2px; }
  .card p { font-size:12px; color:var(--muted); margin:0 0 16px; min-height:34px; }
  .foot { width:var(--w); max-width:100%; padding-top:12px; border-top:1px solid var(--line); }
  [role=tab] { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  [role=tab]:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  body:not(.watcher) [data-room=watcher] { display:none !important; }
  svg.i { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  svg.owl { width:18px; height:18px; fill:currentColor; stroke:none; flex:none; }
  svg.px { width:18px; height:18px; fill:currentColor; shape-rendering:crispEdges; flex:none; }

  /* Shared dock */
  .dock { display:flex; gap:6px; justify-content:center; background:var(--sunk); border-radius:12px; padding:5px; }
  .dock [role=tab] { height:36px; min-width:36px; padding:0 9px; border-radius:8px; display:flex; align-items:center; justify-content:center; gap:0; color:var(--muted); transition:background .25s, color .25s, gap .25s, flex-grow .3s var(--ease); }
  .dock [role=tab]:hover { color:var(--text); }
  .dock [role=tab] span { max-width:0; overflow:hidden; white-space:nowrap; opacity:0; transition:max-width .3s var(--ease), opacity .2s; }
  .dock [aria-selected=true] { background:var(--accent); color:var(--on-accent); gap:8px; }
  .dock [aria-selected=true]:hover { color:var(--on-accent); }
  .dock [aria-selected=true] span { max-width:90px; opacity:1; }

  /* B tinted */
  .b [aria-selected=true], .b [aria-selected=true]:hover { background:var(--accent-soft); color:var(--accent); }
  /* C neutral */
  .c [aria-selected=true], .c [aria-selected=true]:hover { background:var(--raised); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.3); }
  .c [aria-selected=true] svg { color:var(--accent); }
  /* D full width */
  .d { justify-content:stretch; }
  .d [role=tab] { flex:1 1 0; }
  .d [aria-selected=true] { flex-grow:2.4; }
  /* E pill */
  .e { border-radius:999px; padding:4px; }
  .e [role=tab] { border-radius:999px; height:38px; min-width:38px; padding:0 11px; }
  /* F hover peek: unlit rooms show their name on hover and focus */
  .f [role=tab]:hover span, .f [role=tab]:focus-visible span { max-width:90px; opacity:1; }
  .f [role=tab]:hover, .f [role=tab]:focus-visible { gap:8px; background:var(--raised); }
  .f [aria-selected=true]:hover { background:var(--accent); }
  /* G no tray */
  .g { background:none; padding:0; gap:8px; }
  .g [role=tab]:not([aria-selected=true]) { background:var(--sunk); }
  /* H pixel */
  .h [role=tab] span { font-family:ui-monospace, "SF Mono", Menlo, monospace; font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
  .h [role=tab] { border-radius:0; clip-path:polygon(0 3px,3px 3px,3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,3px calc(100% - 3px),0 calc(100% - 3px)); }
  .h { border-radius:0; }
</style>
</head>
<body class="watcher">
<header>
  <h1>Icon dock refinements</h1>
  <button id="theme" type="button">Light</button>
  <label><input id="watch" type="checkbox" checked> Watcher's owl</label>
  <label>Sidebar width <select id="width"><option>260</option><option selected>320</option><option>470</option></select></label>
  <span style="color:var(--muted)">Click or use arrow keys.</span>
</header>
<main id="grid"></main>

<script>
const OWL = '<svg class="owl" viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M1.27 4.8C0.84 3.93 0.73 2.31 1.49 1.22C1.63 0.95 1.93 0.68 2.06 1.22C2.12 2.03 2.71 2.9 3.93 2.9C5.83 2.2 10.17 1.76 12.94 3.34C13.69 3.28 14.4 2.71 14.45 1.82C14.51 1.57 14.73 1.57 14.83 1.98C15.32 2.58 15.54 4.26 14.94 5.56C15.38 6.1 15.7 7.46 15.7 9.630C15.76 12.12 15.29 13.37 13.97 14.24C12.75 15.19 10.17 15.24 8 15.24C5.8 15.24 3.23 15.19 2.01 14.24C0.68 13.37 0.22 12.12 0.27 9.63C0.24 7.19 0.52 5.83 1.27 4.8ZM1.84 8.95C1.82 7.05 2.25 6.07 3.66 6.07C5.34 6.02 6.75 6.21 6.73 8.54C6.73 10.44 6.1 11.31 4.34 11.31C2.58 11.34 1.82 10.58 1.840 8.95ZM9.33 9.22C9.33 8.14 9.63 7.67 10.44 7.46L13.1 6.92C13.8 6.78 14.13 7.46 14.13 8.81C14.16 10.71 13.69 11.34 11.66 11.34C10.17 11.34 9.33 10.71 9.33 9.22Z"/><circle cx="5.29" cy="8.22" r="1.19"/><circle cx="10.79" cy="8.87" r="1.19"/></svg>'
const ICONS = {
  lines: {
    dictate:'<svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
    threads:'<svg class="i" viewBox="0 0 24 24"><path d="M4 6h11M4 11h16M4 16h8"/><circle cx="18" cy="17" r="2.2"/></svg>',
  },
  alt: {
    dictate:'<svg class="i" viewBox="0 0 24 24"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>',
    threads:'<svg class="i" viewBox="0 0 24 24"><path d="M4 5h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9l-4 3v-3H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/><path d="M20 9a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2v3l-3-3h-4"/></svg>',
  },
}
function pixel(rows) {
  const rects = []
  rows.forEach((r, y) => [...r].forEach((c, x) => { if (c === '#') rects.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`) }))
  return `<svg class="px" viewBox="0 0 ${rows[0].length} ${rows.length}" aria-hidden="true">${rects.join('')}</svg>`
}
ICONS.pixel = {
  dictate:pixel(['...####...','...#..#...','...#..#...','...#..#...','.#.#..#.#.','.#.####.#.','..#....#..','...####...','.....#....','...#####..']),
  threads:pixel(['..........','########..','..........','##########','..........','#####.....','.......###','.......###','..........','..........']),
  owl:pixel(['#........#','##......##','##########','#..####..#','#..####..#','#.#####.##','##########','.########.','..######..','..#....#..']),
}

const VARIANTS = [
  ['A. As picked', 'Accent fill, the open room grows to show its name.', '', 'lines'],
  ['B. Tinted', 'A soft accent wash and accent text instead of a solid block. Quieter.', 'b', 'lines'],
  ['C. Neutral tile', 'A raised grey tile with only the icon in accent. Closest to the rest of the sidebar.', 'c', 'lines'],
  ['D. Full width', 'The dock spans the sidebar; the open room takes the extra room.', 'd', 'lines'],
  ['E. Round pill', 'Fully rounded tray and tiles.', 'e', 'lines'],
  ['F. Hover peek', 'Other rooms show their name while hovered or focused, so the icons never have to be guessed.', 'f', 'lines'],
  ['G. No tray', 'Separate tiles with no dark tray behind them.', 'g', 'lines'],
  ['H. Pixel', 'Pixel-doubled icons and owl, notched corners, monospace label.', 'h', 'pixel'],
  ['I. Other icons', 'A waveform for Dictate and two speech bubbles for Threads.', '', 'alt'],
]

const grid = document.getElementById('grid')
VARIANTS.forEach(([title, note, cls, set]) => {
  const icons = ICONS[set]
  const labels = { dictate:'Dictate', watcher:'Watcher', threads:'Threads' }
  const tabs = ['dictate', 'watcher', 'threads'].map(id => `<button role="tab" data-room="${id}" aria-label="${labels[id]}" title="${labels[id]}" aria-selected="${id === 'threads'}" tabindex="${id === 'threads' ? 0 : -1}">${id === 'watcher' ? (icons.owl ?? OWL) : icons[id]}<span>${labels[id]}</span></button>`).join('')
  const card = document.createElement('section')
  card.className = 'card'
  card.innerHTML = `<h2>${title}</h2><p>${note}</p><div class="foot"><div class="dock ${cls}" role="tablist" aria-label="Page">${tabs}</div></div>`
  grid.append(card)
})

const visible = list => [...list.querySelectorAll('[role=tab]')].filter(t => t.offsetParent !== null)
function select(list, tab) {
  list.querySelectorAll('[role=tab]').forEach(t => { t.setAttribute('aria-selected', t === tab); t.tabIndex = t === tab ? 0 : -1 })
}
document.querySelectorAll('[role=tablist]').forEach(list => {
  list.addEventListener('click', e => { const t = e.target.closest('[role=tab]'); if (t) select(list, t) })
  list.addEventListener('keydown', e => {
    const tabs = visible(list), i = tabs.indexOf(document.activeElement)
    const next = { ArrowRight:i + 1, ArrowDown:i + 1, ArrowLeft:i - 1, ArrowUp:i - 1, Home:0, End:tabs.length - 1 }[e.key]
    if (next === undefined || i < 0) return
    e.preventDefault()
    const t = tabs[(next + tabs.length) % tabs.length]; t.focus(); select(list, t)
  })
})
document.getElementById('theme').onclick = e => { const light = document.body.classList.toggle('light'); e.target.textContent = light ? 'Dark' : 'Light' }
document.getElementById('watch').onchange = e => {
  document.body.classList.toggle('watcher', e.target.checked)
  document.querySelectorAll('[role=tablist]').forEach(list => { if (list.querySelector('[aria-selected=true]').offsetParent === null) select(list, list.querySelector('[data-room=threads]')) })
}
const width = document.getElementById('width')
const setWidth = () => document.documentElement.style.setProperty('--w', width.value + 'px')
width.onchange = setWidth
setWidth()
</script>
</body>
</html>
