<!doctype html>
<!--
  PROTOTYPE, throwaway. Not shipped, not tested, not wired to anything.

  Drake's ask (November 1, 2026): a new view, The Council, where a thread and a message go to a panel of models that
  deliberate. It should look alive: ASCII art in Watcher's style, the panelists as a Roman or Greek council around a
  table with the chair at its head, and their motion tied to what each one's thread is doing.

  Settled before this page: an Owl feature; panelists are ordinary Sotto threads on their own providers; each gets the
  origin thread's whole conversation; the chair sits outside the panel; the protocol is blind answers, one anonymous
  review round, then the chair's verdict with disagreement kept (docs/research/2026-11-01-council-deliberation-methods.md).

  What drives each figure (in the product, the panelist's thread; here, a scripted replay):
    thinking or reading files  -> hand to chin, a thought bubble naming what it reads
    writing its answer         -> stylus on a wax tablet, its words streaming in a speech bubble
    reading the others         -> holding the anonymous scrolls (A, B, C) passed across the table
    giving its review          -> standing to speak, arm raised, mouth moving, its words streaming
    waiting on you             -> hand raised, glowing, until you answer in its thread
    finished                   -> listening, head turned to whoever speaks
  The chair listens, gathers the scrolls, writes the verdict on a scroll that unrolls, then holds it up.

  Layouts (the Council's Layout menu, the bar at the bottom, or the left and right arrow keys):
    ?variant=A Long table · B Half circle · C Round table
  Top bar: Ask (the empty chamber; seats you add sit down), Live, or Settings → Council (how many panelists, each one's
  model and effort, the chair's, and the layout), then playback, theme, window size, motion.
  Click a figure to open its thread. ?t=30 starts the replay at 30 seconds; ?play=0 holds it.

  Picked: all three, as a setting (Drake, November 2, 2026), Long table first. Polished three times: each senator's own
  look, the tablet's strokes, a Greek key; then firelight from the lamps and braziers, column and floor art behind the
  figures, shafts of light with motes, each speaker's name on its bubble, a shimmer as the verdict is shown, an altar at
  the half circle's centre, and the chair raised at the round table; then the senator's stripe along each toga, hands
  folded on the table at rest, listeners who nod, cleaner shading and a stone wall.
-->

// ======================================================================= the ASCII scene

      if (S.open.has(k)) body += `<div class="body"><p>${m.text.body}</p><p class="mind">Would change its mind if: ${m.text.mind}</p></div>`
      body += `<button class="more" data-more="${k}">${S.open.has(k) ? 'Less' : 'Read the answer'}</button>`
    } else if (e && st.kind === 'write') body = `<div class="body typing">${typed(e, t)}</div>`
    else if (e && st.kind === 'think') body = `<div class="activity"><div>${e.text}</div></div>`
    const badges = (st.changed ? '<span class="badge">Changed its answer</span>' : '') + (st.revised ? '<span class="badge rev">Revised</span>' : '')
    return `<div class="ent"><div class="av ${live ? 'live' : ''}">${m.label}</div><div><div class="top"><button class="more name" data-open="${m.id}" style="padding:0;color:var(--tt-text);font-weight:600;font-size:14px">${m.provider} · ${m.model}</button><span class="st ${live ? 'live' : ''}">${statusWords(m, st, t)}</span>${badges}</div>${body}</div></div>`
  }).join('')
  h += `<div class="sec"><h2>Answers · written alone</h2>${answers}</div>`
  if (t >= T.review) {
    const reviews = ms.map(m => {
      const st = stateOf(m, t), e = st.e, done = st.reviewed
      let body = ''
      if (done) body = `<div class="body">${m.text.review}${m.text.changed ? ` <b style="color:var(--tt-text)">${m.text.changed}</b>` : ''}</div><div class="st">Ranked ${m.text.rank.join(', then ')}</div>`
      else if (e && st.kind === 'speak') body = `<div class="body typing">${e.phase === 'change' ? m.text.review + ' ' : ''}${typed(e, t)}</div>`
      else if (e && st.kind === 'read') body = `<div class="activity"><div>${e.text}</div></div>`
      return `<div class="ent"><div class="av ${!done && !S.stopped ? 'live' : ''}">${m.label}</div><div><div class="top"><span class="name">${m.model}</span><span class="st">${done ? 'reviewed ' + others(m).join(' and ') : statusWords(m, st, t)}</span></div>${body}</div></div>`
    }).join('')
    h += `<div class="sec"><h2>Reviews · names hidden from each other</h2>${reviews}</div>`
  }
  return h
}
function verdictHTML(ms) {
  const firsts = {}
  ms.forEach(m => { const top = m.text.rank[0]; firsts[top] = (firsts[top] || 0) + 1 })
  const bars = ms.map(m => { const n = firsts[m.label] || 0; return `<span class="tag"><i>${m.label}</i>${m.model}</span><div class="bar"><span style="width:${n / ms.length * 100}%"></span></div><span>${n} of ${ms.length}</span>` }).join('')
  const sides = sp => sp.sides.map(sd => `<div class="side"><span class="who">${sd.who.map(tag).join('')}</span><span><span class="pos">${sd.pos}.</span> ${sd.why}</span></div>`).join('')
  return `<div class="wide verdict">
    <div class="by"><span class="tag"><i>W</i>Chair · ${CHAIR.provider} · ${CHAIR.model}</span><span>Verdict</span></div>
    <div class="rec">${VERDICT.rec}</div>
    <h3>Where they split</h3>${VERDICT.splits.map(sp => `<div class="split"><b>${sp.title}</b>${sides(sp)}<div class="lean">Chair leans: ${sp.lean}</div>${sp.unanswered ? `<div class="unans">${sp.unanswered}</div>` : ''}</div>`).join('')}
    <h3>Where they agree</h3><ul>${VERDICT.agree.map(x => `<li>${x.text} <span class="who">${x.who.map(tag).join('')}</span>${x.note ? ` <span style="color:var(--tt-text-muted);font-size:12.5px">${x.note}</span>` : ''}</li>`).join('')}</ul>
    <h3>Only one noticed</h3><ul>${VERDICT.unique.map(x => `<li>${tag(x.who)} ${x.text}</li>`).join('')}</ul>
    <h3>Ranked first in the reviews</h3><div class="bars">${bars}</div>
    <div class="acts"><button class="pbtn" data-act="send">Send to Thread store migration</button><button class="tbtn" data-act="follow">Ask a follow-up</button><button class="tbtn" data-act="again">Ask again</button></div>
  </div>`
}
function act(k) {
  if (k === 'send') flash('The verdict is in Thread store migration\'s message box, ready to send.')
  if (k === 'follow' || k === 'again') { S.mode = 'ask'; S.t = 0; S.stopped = false; lastSig = ''; geom = null; saveParams(); renderAll() }
  if (k === 'stop') { S.stopped = true; S.playing = false; lastSig = ''; renderAll() }
}
function flash(msg) {
  const el = document.createElement('div')
  Object.assign(el.style, { position: 'absolute', left: '50%', bottom: '18px', transform: 'translateX(-50%)', background: 'var(--tt-surface)', color: 'var(--tt-text)', padding: '9px 14px', borderRadius: '10px', boxShadow: '0 10px 30px rgb(0 0 0 / 40%)', zIndex: 6, fontSize: '13px' })
  el.textContent = msg; document.getElementById('room').append(el); setTimeout(() => el.remove(), 2600)
}

// ---- Ask: the empty chamber; each seat you add sits down at the table
function askHTML() {
  const free = Object.keys(ROSTER).filter(k => !S.seats.includes(k))
  return `<div class="ask">
    <label class="l">From</label>
    <button class="chip">${THREAD.title}<span class="sub">whole conversation · ${THREAD.turns} turns</span> ▾</button>
    <label class="l" for="msg">Question</label>
    <textarea class="msg" id="msg">${QUESTION}</textarea>
    <label class="l">Panelists <button class="more" id="toSettings" style="margin-left:8px">Change the defaults in Settings</button></label>
    <div class="seats">${S.seats.map((id, i) => `<div class="seat"><span class="av">${'ABCDE'[i]}</span><span class="nm">${members()[i].provider} <span>· ${members()[i].model}</span></span><button class="x" data-rm="${id}" aria-label="Remove ${members()[i].model} from the panelists" ${S.seats.length <= 2 ? 'disabled' : ''}>✕</button></div>`).join('')}</div>
    ${S.seats.length < 5 ? `<div class="addrow">${free.map(id => `<button class="tbtn" data-add="${id}">+ ${ROSTER[id].model}</button>`).join('')}</div>` : ''}
    <label class="l">Chair</label>
    <div class="seats"><div class="seat"><span class="av">W</span><span class="nm">${CHAIR.provider} <span>· ${CHAIR.model}</span></span><span style="color:var(--tt-text-muted);font-size:12.5px">not a panelist</span></div></div>
    <div class="foot"><button class="pbtn" id="convene">Ask the Council</button><span>Starts ${S.seats.length + 1} read-only threads</span></div>
  </div>`
}
function bindAsk() {
  const el = document.getElementById('panel')
  el.querySelectorAll('[data-rm]').forEach(x => x.addEventListener('click', () => { S.seats = S.seats.filter(s => s !== x.dataset.rm); geom = null; dirtyHits = true; lastSig = ''; renderPanel(S.t) }))
  el.querySelectorAll('[data-add]').forEach(x => x.addEventListener('click', () => { S.seats.push(x.dataset.add); geom = null; dirtyHits = true; lastSig = ''; renderPanel(S.t) }))
  el.querySelector('#toSettings').addEventListener('click', () => { S.mode = 'settings'; saveParams(); renderAll() })
  el.querySelector('#convene').addEventListener('click', () => { S.mode = 'live'; S.t = 0; S.playing = true; S.stopped = false; lastSig = ''; saveParams(); renderAll() })
}

// ---- Settings → Council: who sits, on what model and effort, and the layout
function seatsFromCfg() { S.seats = CFG.seats.map(x => x.p); geom = null; dirtyHits = true; lastSig = ''; poses.clear() }
function renderSettings() {
  const el = document.getElementById('settingsView')
  if (S.mode !== 'settings') { el.hidden = true; return }
  const modelSel = (cur, id, label) => `<select class="model" data-model="${id}" aria-label="${label} model">${Object.entries(MODELS).map(([p, ms]) => `<optgroup label="${PROVIDERS[p]}">${ms.map(m => `<option value="${p}|${m}" ${cur.p === p && cur.m === m ? 'selected' : ''}>${m}</option>`).join('')}</optgroup>`).join('')}</select>`
  const effSel = (cur, id, label) => `<select data-effort="${id}" aria-label="${label} effort">${EFFORTS.map(e => `<option ${cur.e === e ? 'selected' : ''}>${e}</option>`).join('')}</select>`
  const same = (x, y) => x.p === y.p && x.m === y.m
  const rows = CFG.seats.map((c, i) => {
    const dup = CFG.seats.some((o, j) => j < i && same(o, c))
    return `<div class="st-row"><span class="av">${'ABCDE'[i]}</span><span class="lbl">${PROVIDERS[c.p]}</span>${modelSel(c, i, 'Panelist ' + 'ABCDE'[i])}${effSel(c, i, 'Panelist ' + 'ABCDE'[i])}</div>${dup ? `<div class="st-note warn">Same model as another panelist. A second copy adds less than a different model.</div>` : ''}`
  }).join('')
  const chairDup = CFG.seats.some(c => same(c, CFG.chair))
  el.innerHTML = `<nav class="st-rail" aria-label="Settings pages"><button class="back" id="stBack">‹ Back to Council</button>
      ${['Appearance', 'Dictation', 'Threads', 'Providers', 'Git & worktrees', 'Watcher', 'Council', 'Hosts & phones', 'Cloud iPhone', 'Usage'].map(n => `<div class="pg ${n === 'Council' ? 'on' : ''}" ${n === 'Council' ? 'aria-current="page"' : ''}>${n}</div>`).join('')}</nav>
    <main class="st-main"><h1>Council</h1>
      <section class="st-card" aria-labelledby="stP"><h2 id="stP">Panelists</h2>
        <div class="st-row"><span class="lbl">How many</span><div class="seg" role="group" aria-label="How many panelists">${[2, 3, 4, 5].map(n => `<button aria-pressed="${CFG.seats.length === n}" data-count="${n}">${n}</button>`).join('')}</div></div>
        ${rows}
      </section>
      <section class="st-card" aria-labelledby="stC"><h2 id="stC">Chair</h2>
        <div class="st-row"><span class="av">W</span><span class="lbl">${PROVIDERS[CFG.chair.p]}</span>${modelSel(CFG.chair, 'chair', 'Chair')}${effSel(CFG.chair, 'chair', 'Chair')}</div>
        ${chairDup ? `<div class="st-note warn">The chair is on a panelist's model, so it may favour that panelist's answer.</div>` : ''}
      </section>
      <section class="st-card" aria-labelledby="stL"><h2 id="stL">Layout</h2>
        <div class="st-row"><span class="lbl">The chamber</span><div class="seg" role="group" aria-label="Layout">${Object.entries(VARIANTS).map(([k, v]) => `<button aria-pressed="${S.variant === k}" data-layout="${k}">${v}</button>`).join('')}</div></div>
      </section>
    </main>`
  el.hidden = false
  const fresh = [{ p: 'deepseek', m: 'DeepSeek V4.1 Flash', e: 'High' }, { p: 'devin', m: 'Devin', e: 'High' }, { p: 'claude', m: 'Fable 5.1', e: 'High' }]
  el.querySelectorAll('[data-count]').forEach(b => b.addEventListener('click', () => {
    const n = Number(b.dataset.count)
    while (CFG.seats.length > n) CFG.seats.pop()
    for (const f of fresh) if (CFG.seats.length < n && !CFG.seats.some(c => c.p === f.p)) CFG.seats.push({ ...f })
    seatsFromCfg(); renderSettings()
  }))
  el.querySelectorAll('[data-model]').forEach(x => x.addEventListener('change', () => {
    const [p, m] = x.value.split('|'), id = x.dataset.model, target = id === 'chair' ? CFG.chair : CFG.seats[Number(id)]
    target.p = p; target.m = m
    if (id === 'chair') { CHAIR.provider = PROVIDERS[p]; CHAIR.model = m }
    seatsFromCfg(); renderSettings()
  }))
  el.querySelectorAll('[data-effort]').forEach(x => x.addEventListener('change', () => { const id = x.dataset.effort; (id === 'chair' ? CFG.chair : CFG.seats[Number(id)]).e = x.value }))
  el.querySelectorAll('[data-layout]').forEach(b => b.addEventListener('click', () => { setVariant(b.dataset.layout); renderSettings() }))
  el.querySelector('#stBack').addEventListener('click', () => { S.mode = 'ask'; lastSig = ''; saveParams(); renderAll() })
}

// ---- a panelist's thread, opened from its figure
function openSheet(id) { S.sheet = id; renderSheet(S.t) }
function renderSheet(t) {
  const el = document.getElementById('sheet')
  if (!S.sheet) { el.hidden = true; return }
  const isChair = S.sheet === 'chair', m = isChair ? CHAIR : members().find(x => x.id === S.sheet)
  if (!m) { S.sheet = null; el.hidden = true; return }
  const st = isChair ? chairState(t) : stateOf(m, t)
  let body = `<div class="msgb sotto"><div class="w">Sotto</div><div class="tx">The whole conversation of ${THREAD.title} (${THREAD.turns} turns), then: ${QUESTION} ${isChair ? 'You are the chair. Read every answer and review, then write the verdict: a recommendation, where they agree, where they split and why, and what only one noticed.' : 'Answer alone. Say what would change your mind.'}</div></div>`
  if (S.mode === 'live' && !isChair) {
    const p = st.plan
    const acts = p.ev.filter(e => e.kind === 'think' && t >= e.t0).map(e => `<div>${e.text}</div>`).join('')
    if (acts) body += `<div class="msgb"><div class="activity">${acts}</div></div>`
    const ae = p.ev.find(e => e.phase === 'answer')
    if (t >= ae.t0) body += `<div class="msgb"><div class="w">${m.model}</div><div class="tx ${t < ae.t1 ? 'typing' : ''}">${t < ae.t1 ? typed(ae, t) : m.text.head + ' ' + m.text.body}</div></div>`
    if (t >= T.review) {
      body += `<div class="msgb sotto"><div class="w">Sotto</div><div class="tx">The other answers, with their names taken out: ${others(m).map(l => 'answer ' + l).join(' and ')}. Critique each and rank them. You may change your own answer once.</div></div>`
      const re = p.ev.find(e => e.phase === 'review'), ce = p.ev.find(e => e.phase === 'change')
      if (t >= re.t0) body += `<div class="msgb"><div class="w">${m.model}</div><div class="tx ${t < re.t1 ? 'typing' : ''}">${t < re.t1 ? typed(re, t) : m.text.review}${ce && t >= ce.t0 ? ' ' + (t < ce.t1 ? typed(ce, t) : m.text.changed) : ''}</div></div>`
    }
  }
  if (S.mode === 'live' && isChair && t >= T.chairRead) body += `<div class="msgb"><div class="w">${m.model}</div><div class="tx ${t < T.verdict ? 'typing' : ''}">${t < T.chairWrite ? '' : t < T.verdict ? typed(chairPlan()[2], t) : VERDICT.rec}</div></div>`
  if (st.kind === 'ask') body += `<div class="msgb"><div class="w">${m.model} asks</div><div class="tx">Should the import keep threads whose folders no longer exist?</div><div class="acts"><button class="pbtn" data-answer>Keep them</button><button class="tbtn" data-answer>Skip them</button></div></div>`
  el.innerHTML = `<div class="sh-head"><span class="tag"><i>${m.label || 'W'}</i></span><div class="t"><b>${isChair ? 'Chair · ' : ''}${m.provider} · ${m.model}</b><span>${statusWords(m, st, t)} · read-only</span></div><button class="tbtn">Open in Threads</button><button class="tbtn" id="shx" aria-label="Close">✕</button></div><div class="sh-body">${body}</div>`
  el.hidden = false
  el.querySelector('#shx').addEventListener('click', () => { S.sheet = null; renderSheet(t) })
  el.querySelectorAll('[data-answer]').forEach(x => x.addEventListener('click', () => { S.asking = false; lastSig = ''; renderSheet(S.t); renderChrome() }))
}

// ======================================================================= head, chrome, sizing, loop
function layoutMenu() {
  return `<div class="lay"><button class="tbtn" id="layBtn" aria-haspopup="menu" aria-expanded="${S.menu ? 'true' : 'false'}">${VARIANTS[S.variant]} ▾</button>${S.menu ? `<div class="lay-menu" role="menu" aria-label="Layout">${Object.entries(VARIANTS).map(([k, v]) => `<button role="menuitemradio" aria-checked="${k === S.variant}" data-lay="${k}">${v}</button>`).join('')}</div>` : ''}</div>`
}
function bindLayout(h) {
  h.querySelector('#layBtn').addEventListener('click', () => { S.menu = !S.menu; h.dataset.sig = ''; renderHead(S.t); if (S.menu) h.querySelector('[data-lay]')?.focus() })
  h.querySelectorAll('[data-lay]').forEach(x => x.addEventListener('click', () => { S.menu = false; h.dataset.sig = ''; setVariant(x.dataset.lay); renderHead(S.t); h.querySelector('#layBtn').focus() }))
}
function renderHead(t) {
  const h = document.getElementById('head')
  if (S.mode === 'ask') { const sig = 'ask' + S.variant + S.menu; if (h.dataset.sig === sig) return; h.dataset.sig = sig; h.innerHTML = `<h1>Council</h1><div class="q"></div>${layoutMenu()}`; bindLayout(h); return }
  const stage = t < T.review ? 0 : t < T.chairRead ? 1 : t < T.verdict ? 2 : 3
  const cls = i => stage > i ? 'past' : stage === i ? 'now' : ''
  const sig = stage + ':' + S.stopped + S.variant + S.menu
  if (h.dataset.sig === sig) return
  h.dataset.sig = sig
  h.innerHTML = `<h1>Council</h1><div class="q">${QUESTION} <span>· from ${THREAD.title}</span></div>
    <div class="stage-dots"><span class="${cls(0)}">Answers</span><span class="${cls(1)}">Reviews</span><span class="${cls(2) || (stage === 3 ? 'past' : '')}">Verdict</span></div>
    ${layoutMenu()}${stage < 3 && !S.stopped ? '<button class="tbtn" data-act="stop">Stop</button>' : '<button class="tbtn" data-act="again">New question</button>'}`
  h.querySelectorAll('[data-act]').forEach(btn => btn.addEventListener('click', () => act(btn.dataset.act)))
  bindLayout(h)
}
const SIZES = { fit: null, 1600: [1600, 1000], 1280: [1280, 800], 820: [820, 560] }
function currentScale() { return Number(document.getElementById('scaler').dataset.scale || 1) }
function layout() {
  const nav = document.getElementById('pnav').getBoundingClientRect().height
  const stage = document.getElementById('stage'); stage.style.top = nav + 'px'
  const sw = innerWidth - 24, sh = innerHeight - nav - 70
  const win = document.getElementById('win'), sc = document.getElementById('scaler')
  let w, h, k = 1
  if (!SIZES[S.size]) { w = sw; h = sh } else { [w, h] = SIZES[S.size]; k = Math.min(1, sw / w, sh / h) }
  win.style.width = w + 'px'; win.style.height = h + 'px'; sc.style.transform = `scale(${k})`; sc.dataset.scale = k
  resize()
}
function renderChrome() {
  const nav = document.getElementById('pnav')
  const btn = (label, on, fn) => { const x = document.createElement('button'); x.textContent = label; x.setAttribute('aria-pressed', on ? 'true' : 'false'); x.addEventListener('click', fn); return x }
  const lbl = s => { const x = document.createElement('b'); x.textContent = s; return x }
  nav.replaceChildren(
    lbl('View'), btn('Ask', S.mode === 'ask', () => { S.mode = 'ask'; S.sheet = null; lastSig = ''; saveParams(); renderAll() }), btn('Live', S.mode === 'live', () => { S.mode = 'live'; lastSig = ''; saveParams(); renderAll() }), btn('Settings → Council', S.mode === 'settings', () => { S.mode = 'settings'; S.sheet = null; saveParams(); renderAll() }),
    lbl('Replay'), btn(S.playing ? 'Pause' : 'Play', false, () => { S.playing = !S.playing; renderChrome() }), btn('Restart', false, () => { S.t = 0; S.stopped = false; S.playing = true; lastSig = ''; poses.clear(); renderAll() }),
    btn('1x', S.speed === 1, () => { S.speed = 1; renderChrome() }), btn('3x', S.speed === 3, () => { S.speed = 3; renderChrome() }),
    btn('Answers', false, () => jump(0.5)), btn('Reviews', false, () => jump(T.review)), btn('Verdict', false, () => jump(T.chairWrite)),
    btn('A panelist asks you', S.asking, () => { S.asking = !S.asking; if (S.mode !== 'live') S.mode = 'live'; if (S.t < 7) S.t = 7; lastSig = ''; renderAll() }),
    Object.assign(document.createElement('span'), { className: 'clock', id: 'clock' }),
    lbl('Theme'), ...[['citrine', 'Citrine dark'], ['sotto', 'Sotto dark'], ['light', 'Light']].map(([k, l]) => btn(l, S.theme === k, () => { S.theme = k; applyTheme(); saveParams(); renderChrome() })),
    lbl('Window'), ...[['fit', 'Fit'], ['1600', '1600×1000'], ['1280', '1280×800'], ['820', '820×560']].map(([k, l]) => btn(l, S.size === k, () => { S.size = k; saveParams(); renderChrome(); layout() })),
    lbl('Motion'), btn('Full', S.motion === 'full', () => { S.motion = 'full'; applyTheme(); saveParams(); renderChrome() }), btn('Reduced', S.motion === 'reduced', () => { S.motion = 'reduced'; applyTheme(); saveParams(); renderChrome() }),
  )
  document.getElementById('vlabel').textContent = `${S.variant} · ${VARIANTS[S.variant]}`
}
function jump(t) { S.mode = 'live'; S.t = t; S.stopped = false; S.playing = true; lastSig = ''; poses.clear(); renderAll() }
function applyTheme() { document.documentElement.dataset.theme = S.theme; document.documentElement.dataset.motion = S.motion; readInk() }
function setVariant(v) { S.variant = v; document.getElementById('council').dataset.variant = v; geom = null; dirtyHits = true; lastSig = ''; poses.clear(); saveParams(); renderChrome(); requestAnimationFrame(layout) }
function cycle(d) { const k = Object.keys(VARIANTS); setVariant(k[(k.indexOf(S.variant) + d + k.length) % k.length]) }
function renderAll() { document.getElementById('council').dataset.variant = S.variant; renderSettings(); renderChrome(); renderHead(S.t); renderPanel(S.t); renderSheet(S.t); geom = null; dirtyHits = true; layout() }

let last = performance.now(), acc = 0, sheetTick = 0
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now
  if (S.mode === 'settings') { requestAnimationFrame(frame); return }
  if (S.mode === 'live' && S.playing && !S.stopped) S.t = Math.min(T.end + 600, S.t + dt * S.speed)
  acc += dt
  const step = S.motion === 'reduced' ? 0.25 : 1 / 30
  if (acc >= step && W > 0) {
    drawScene(S.t, acc); acc = 0
    placeHits(S.t); renderPanel(S.t); renderHead(S.t)
    if (S.sheet && (sheetTick = (sheetTick + 1) % 6) === 0) renderSheet(S.t)
    const c = document.getElementById('clock'); if (c) c.textContent = S.mode === 'live' ? S.t.toFixed(1) + ' s' : ''
  }
  requestAnimationFrame(frame)
}
document.getElementById('prev').addEventListener('click', () => cycle(-1))
document.getElementById('next').addEventListener('click', () => cycle(1))
addEventListener('keydown', e => {
  const tg = e.target
  if (e.key === 'Escape' && S.menu) { S.menu = false; document.getElementById('head').dataset.sig = ''; renderHead(S.t); document.getElementById('layBtn')?.focus(); return }
  if (e.key === 'Escape' && S.sheet) { S.sheet = null; renderSheet(S.t); return }
  if (tg.closest && tg.closest('input, textarea, [contenteditable]')) return
  if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1)
})
addEventListener('resize', layout)
new ResizeObserver(() => resize()).observe(document.getElementById('wrap'))
applyTheme(); renderAll(); requestAnimationFrame(frame)
</script>
</body>
</html>
