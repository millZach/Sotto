<!doctype html>
<!--
  PROTOTYPE, throwaway. Eight fixes from Zach's test of TestFlight build 45 on the iPhone Duo and an iPhone (October 31, 2026).
    1. Watcher's composer gets the thread composer's row (model, effort, speed, permissions; #1927) and New Watcher, which
       starts a new Watcher at once with a handover of the last one, as the desktop's does (WatcherNew.tsx).
    2. Folded Duo, thread open: no top bar. The thread's state, Agents count, Watch and ··· stand in the side rail; the
       title is only the big one in the page. A swipe right goes back to the thread list.
    3. The composer floats: the conversation scrolls behind it, and the last message still scrolls clear of it.
    4. New thread's + sits lower in the rail, clear of the battery and signal.
    5. Unfolding from the thread list opens its top row (Needs you, then Working now, then Recent) beside the sidebar, chosen.
    6. Transitions: iOS's push and pop into and out of a thread, interactive swipe back, a morph when the Duo folds or
       unfolds, a quick crossfade between tabs and between threads in the sidebar; Reduce Motion crossfades everything.
    7. No "Watched by Watcher. ..." note over a watched thread's composer; the lit owl says it.
    8. The shield sits right after the bolt, and Stop is a solid circle as large as Send.
  ?rail=A|B chooses how the folded rail carries the thread (point 2). ?before=1 shows build 45 for comparison.
  Zach's picks on October 31, 2026: rail A (Back at the top, the thread's controls centred, tabs hidden while a thread is
  open); Watcher's model chip lists every provider, another provider's model starting a new Watcher, as on the desktop;
  unfolding onto a Needs you row raises its question sheet as a tap does (the prototype keeps it in the reply box); and
  point 7 is the iPhone's alone, since the desktop's line went in #1516.
  Synthetic data only. No network, no persistence. Colours are the Sotto dark and light palettes, sizes in points.
-->

<body>
<header class="bar">
  <h1>iPhone Duo rail and composer · prototype for Zach (8 points)</h1>
  <div class="seg" id="dev"></div>
  <div class="seg" id="ba"></div>
  <div class="seg" id="railv"></div>
  <div class="seg" id="theme"></div>
  <div class="seg" id="motion"></div>
  <button class="btn" id="fold"></button>
</header>
<main>
  <p class="lede">Tap a row to open a thread, swipe right on it to go back, and press <b>Unfold</b> or <b>Fold</b> to change screens. <b>Build 45</b> shows today's app to compare.</p>
  <div class="points" id="points"></div>
  <div class="stagewrap"><div class="fit" id="fit"><div class="screen" id="screen"></div></div></div>
  <p class="caption" id="cap"></p>
</main>
<script>
const Q = new URLSearchParams(location.search)
const S = { device: 'folded', tab: 'threads', open: null, before: Q.get('before') === '1', rail: Q.get('rail') === 'B' ? 'B' : 'A',
  theme: Q.get('theme') === 'light' ? 'light' : 'dark', reduce: false, watcherNew: false, handover: true, speed: 1, menu: null }
const DEV = { folded: { W: 466, H: 678, strip: 84 }, unfolded: { W: 952, H: 680, strip: 85, side: 280 }, iphone: { W: 402, H: 874 } }

  { id: 'release', sec: 'needs', title: 'Choose the release target', line: 'Asked you a question · Laptop', prov: 'claude', ago: '2m ago', state: 'need' },

  { id: 'babysit', sec: 'working', title: 'Babysit #845 release notes', line: 'Codex · Sotto · Laptop', prov: 'codex', ago: '14m ago', state: 'work', watched: true },
  { id: 'wiring', sec: 'working', title: 'Clean up the wiring schedule', line: 'Claude Code · Panel tools · Laptop', prov: 'claude', ago: '21m ago', state: 'work' },
  { id: 'keys', sec: 'recent', title: 'Add keyboard shortcuts', line: 'Codex · Sotto · Laptop', prov: 'codex', ago: '38m ago', state: 'done' },
  { id: 'login', sec: 'recent', title: 'Fix login test', line: 'Claude Code · Sotto · Laptop', prov: 'claude', ago: '1h ago', state: 'done' },

const I = {
  chev: '<svg width="9" height="9" viewBox="0 0 10 10"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',

    else html += `<div class="layer">${S.tab === 'watcher' ? watcherPage() : simplePage(S.tab === 'computers' ? 'Computers' : 'Settings')}</div>`
    html += `</div><div class="strip" style="right:0;width:${d.strip}px"><div class="clock" style="top:28px">12:16</div><div class="ring" style="top:56px"></div>
      <div class="rail" data-m="rail" style="left:0;right:0"><div style="height:${clear}px;flex:none"></div><span class="circle accent" title="New thread">${I.plus}</span><div style="flex:1;display:flex;flex-direction:column;justify-content:center">${tabsRail()}</div></div></div>`
  } else {
    const t = S.open && byId(S.open)
    html += `<div class="area" id="area" style="left:0;width:${d.W}px">`
    if (S.tab === 'threads') {
      html += `<div class="layer" data-layer="list">${threadsPage()}${tabBar()}</div>`
      if (t) html += `<div class="layer" data-layer="thread">${threadPage(t, 'iphone')}</div>`
    } else html += `<div class="layer">${S.tab === 'watcher' ? watcherPage() : simplePage(S.tab === 'computers' ? 'Computers' : 'Settings')}${tabBar()}</div>`
    html += `</div><div class="statusbar" style="pointer-events:none;z-index:9"><span>12:16</span><span>●●● ▮</span></div>`
  }
  if (S.menu) html += S.menu
  sc.innerHTML = html
  // The conversation starts at its end, as the app's does.
  sc.querySelectorAll('[data-scroll]').forEach(s => { s.scrollTop = s.scrollHeight })
  fitScale()
  $('#cap').textContent = caption()
}
function tabBar() {
  if (S.open && S.tab === 'threads') return ''
  const it = (id, svg, name) => `<div data-tab="${id}" style="display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;width:80px;cursor:pointer;color:${S.tab === id ? 'var(--accenttext)' : 'var(--muted)'}">${svg.replace(/width="28" height="28"/, 'width="24" height="24"')}${name}</div>`
  return `<div style="position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;justify-content:space-around;padding-top:8px;background:linear-gradient(transparent,var(--canvas) 30%)">${it('threads', I.bubble, 'Threads')}${it('watcher', I.owl(24), 'Watcher')}${it('computers', I.desk, 'Computers')}${it('settings', I.sliders, 'Settings')}</div>`
}
function railThread(t, compact) {
  return `${stateChip(t, 'vstate')}
    ${t.agents ? `<span class="rbtn plain" title="Agents: ${t.agents}">${I.people}<span>${t.agents}</span></span>` : ''}
    <span class="rbtn ${t.watched ? 'lit' : 'plain'}" title="${t.watched ? 'Watch: on. Watcher keeps this thread going; while your own turn runs, it can only steer that turn.' : 'Watch: off'}">${I.owl(20)}</span>
    <span class="rbtn plain" title="Show thread actions">${I.dots}</span>`.replace(/<\/span>\s*<span/g, `</span>${compact ? '<div style="height:8px"></div>' : ''}<span`)
}
function caption() {
  const where = { folded: 'iPhone Duo, folded (cover screen)', unfolded: 'iPhone Duo, unfolded and held sideways', iphone: 'iPhone 17' }[S.device]
  const what = S.tab !== 'threads' ? S.tab[0].toUpperCase() + S.tab.slice(1) : S.open ? byId(S.open).title : 'Thread list'
  return `${S.before ? 'Build 45' : 'Proposed'} · ${where} · ${what}`
}
function fitScale() {
  const d = D(), fit = $('#fit'), avail = Math.min(document.querySelector('main').clientWidth - 20, 1080)
  const maxH = window.innerHeight - 140
  const s = Math.min(1, avail / d.W, Math.max(0.36, maxH / d.H))
  S.scale = Math.min(s, avail / d.W)
  $('#screen').style.transform = `scale(${S.scale})`
  fit.style.width = d.W * S.scale + 'px'; fit.style.height = d.H * S.scale + 'px'
}
function fresh() { S.menu = null; controls(); $('#fit').classList.add('still'); render(); requestAnimationFrame(() => $('#fit').classList.remove('still')) }

// ---------- motion ----------
const EASE = 'cubic-bezier(.32,.72,0,1)'
function fade(mutate) {
  const sc = $('#screen'); sc.style.transition = 'opacity .1s'; sc.style.opacity = 0
  setTimeout(() => { mutate(); controls(); render(); sc.style.transition = 'opacity .16s'; sc.style.opacity = 1 }, 100)
}
function push(id) {
  if (S.device === 'unfolded') return swapPane(id)
  if (S.reduce) return fade(() => { S.open = id })
  S.open = id; render()
  const t = $('[data-layer=thread]'), l = $('[data-layer=list]'), rail = $('#rail')
  t.style.transform = 'translateX(100%)'; t.style.boxShadow = '-10px 0 30px rgba(0,0,0,.35)'
  if (rail) rail.style.opacity = 0
  t.offsetWidth
  t.style.transition = l.style.transition = `transform .42s ${EASE}, filter .42s`
  t.style.transform = 'translateX(0)'; l.style.transform = 'translateX(-30%)'; l.style.filter = 'brightness(.75)'
  if (rail) { rail.style.transition = 'opacity .3s .12s'; rail.style.opacity = 1 }
}
function pop(fromDrag) {
  if (S.reduce && !fromDrag) return fade(() => { S.open = null })
  const t = $('[data-layer=thread]'), l = $('[data-layer=list]'), rail = $('#rail')
  if (!t) return
  t.style.transition = l.style.transition = `transform .36s ${EASE}, filter .36s`
  t.style.transform = 'translateX(100%)'; l.style.transform = 'translateX(0)'; l.style.filter = 'none'
  if (rail) { rail.style.transition = 'opacity .2s'; rail.style.opacity = 0 }
  setTimeout(() => { S.open = null; render(); const r = $('#rail'); if (r) { r.style.opacity = 0; r.offsetWidth; r.style.transition = 'opacity .25s'; r.style.opacity = 1 } }, 360)
}
function swapPane(id) {
  if (id === S.open) return
  const p = $('[data-layer=pane]')
  if (!p) { S.open = id; return render() }
  p.style.transition = 'opacity .09s'; p.style.opacity = 0
  setTimeout(() => { S.open = id; render(); const n = $('[data-layer=pane]'); n.style.opacity = 0; n.offsetWidth; n.style.transition = 'opacity .16s'; n.style.opacity = 1 }, 90)
}
function switchTab(tab) {
  if (tab === S.tab) { if (S.open && S.tab === 'threads' && S.device !== 'unfolded') pop(); return }
  const area = $('#area'); area.style.transition = 'opacity .08s'; area.style.opacity = 0
  setTimeout(() => { S.tab = tab; if (S.device === 'unfolded' && tab === 'threads' && !S.open && !S.before) S.open = topRow(); render(); const a = $('#area'); a.style.opacity = 0; a.offsetWidth; a.style.transition = 'opacity .14s'; a.style.opacity = 1 }, 80)
}
function foldTo(dev) {
  const mutate = () => {
    S.device = dev
    // Point 5: unfolding from the thread list opens its top row beside the sidebar. Build 45 shows the cards page.
    if (dev === 'unfolded' && S.tab === 'threads' && !S.open && !S.before) S.open = topRow()
  }
  if (S.reduce) return fade(mutate)
  const before = new Map(); document.querySelectorAll('#screen [data-m]').forEach(el => before.set(el.dataset.m, el.getBoundingClientRect()))
  mutate(); controls(); render()
  const els = [...document.querySelectorAll('#screen [data-m]')]
  els.forEach(el => {
    const a = before.get(el.dataset.m), b = el.getBoundingClientRect()
    if (!a) { el.style.opacity = 0; el.offsetWidth; el.style.transition = 'opacity .3s .15s'; el.style.opacity = 1; return }
    const dx = a.left - b.left, dy = a.top - b.top
    const sx = el.dataset.mt === 't' ? 1 : a.width / b.width, sy = el.dataset.mt === 't' ? 1 : a.height / b.height
    el.style.transformOrigin = '0 0'; el.style.transform = `translate(${dx / S.scale}px,${dy / S.scale}px) scale(${sx},${sy})`
    el.offsetWidth; el.style.transition = `transform .48s ${EASE}`; el.style.transform = 'none'
  })
  // What has no partner (the sidebar's ground, a new pane's bar) fades in under the moving rows.
  document.querySelectorAll('#screen .side, #screen .tbar, #screen .dock').forEach(el => { el.style.opacity = 0; el.offsetWidth; el.style.transition = 'opacity .32s .14s'; el.style.opacity = 1 })
}

// ---------- input ----------
$('#screen').addEventListener('click', e => {
  const m = e.target.closest('.mi'); if (m) { S.menu = null; if (m.dataset.note) toast(m.dataset.note); render(); return }
  if (S.menu && !e.target.closest('.menu')) { S.menu = null; render(); return }
  const row = e.target.closest('[data-row]'); if (row && !drag.moved) return push(row.dataset.row)
  const tab = e.target.closest('[data-tab]'); if (tab) return switchTab(tab.dataset.tab)
  const act = e.target.closest('[data-act]')
  if (act) {
    const a = act.dataset.act
    if (a === 'back') return pop()
    if (a === 'speed') { S.speed = (S.speed + 1) % 3; render(); return }
    if (a === 'neww') { if (S.watcherNew) return toast('This Watcher is new, so there is nothing to hand over yet.'); S.watcherNew = true; S.handover = true; render(); return toast('Started a new Watcher on GPT-5.5.') }
    if (a === 'nohand') { S.handover = false; render(); return }
  }
  const menu = e.target.closest('[data-menu]')
  if (menu) { openMenu(menu); return }
})
function openMenu(el) {
  const kind = el.dataset.menu, watcher = S.tab === 'watcher'
  const sc = $('#screen').getBoundingClientRect(), r = el.getBoundingClientRect()
  const x = Math.min((r.left - sc.left) / S.scale, D().W - 250), yb = D().H - (r.top - sc.top) / S.scale + 6
  let body = ''
  if (kind === 'model') body = `<div class="mh">Codex</div><div class="mi">GPT-5.5 <span>✓</span></div><div class="mi">GPT-5.5 mini</div>` +
    (watcher ? `<div class="mh">Claude Code</div><div class="mi" data-note="Started a new Watcher on Opus 5.5. The last conversation is in Watcher history.">Opus 5.5</div><div class="mi" data-note="Started a new Watcher on Sonnet 5.5.">Sonnet 5.5</div><div class="mn">Another provider’s model starts a new Watcher. This conversation stays in Watcher history.</div>` : '')
  if (kind === 'effort') body = `<div class="mh">Effort</div>${['Low', 'Medium', 'High', 'Max'].map(e => `<div class="mi">${e}${e === 'High' ? ' <span>✓</span>' : ''}</div>`).join('')}`
  if (kind === 'perm') body = `<div class="mh">${watcher ? 'Watcher’s permissions' : 'Permissions'}</div>${['Ask first', 'Auto edits', 'Auto', 'Full access'].map((p, i) => `<div class="mi">${p}${i === 1 ? ' <span>✓</span>' : ''}</div>`).join('')}`
  S.menu = `<div class="menu" style="left:${Math.max(8, x)}px;bottom:${yb}px">${body}</div>`
  render()
}
function toast(words) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = words; $('#screen').appendChild(t)
  setTimeout(() => t.remove(), 2200)
}
// Swipe right anywhere on an open thread goes back, following the finger (folded Duo and iPhone).
const drag = { on: false, moved: false }
$('#screen').addEventListener('pointerdown', e => {
  drag.moved = false
  const t = e.target.closest('[data-layer=thread]'); if (!t || e.target.closest('.dock, .tbar, [data-act]')) return
  Object.assign(drag, { on: true, x: e.clientX, y: e.clientY, dx: 0, t, l: $('[data-layer=list]'), axis: null })
})
window.addEventListener('pointermove', e => {
  if (!drag.on) return
  const dx = (e.clientX - drag.x) / S.scale, dy = (e.clientY - drag.y) / S.scale
  if (!drag.axis && Math.hypot(dx, dy) > 8) drag.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'
  if (drag.axis !== 'x') return
  drag.moved = true; drag.dx = Math.max(0, dx)
  const w = drag.t.offsetWidth
  drag.t.style.transition = drag.l.style.transition = 'none'
  drag.t.style.transform = `translateX(${drag.dx}px)`; drag.t.style.boxShadow = '-10px 0 30px rgba(0,0,0,.35)'
  drag.l.style.transform = `translateX(${-30 + 30 * drag.dx / w}%)`; drag.l.style.filter = `brightness(${.75 + .25 * drag.dx / w})`
})
window.addEventListener('pointerup', () => {
  if (!drag.on) return; drag.on = false
  if (drag.axis !== 'x') return
  if (drag.dx > drag.t.offsetWidth * 0.3) pop(true)
  else { drag.t.style.transition = drag.l.style.transition = `transform .3s ${EASE}, filter .3s`; drag.t.style.transform = 'translateX(0)'; drag.l.style.transform = 'translateX(-30%)'; drag.l.style.filter = 'brightness(.75)' }
  setTimeout(() => { drag.moved = false }, 0)
})
window.addEventListener('resize', fitScale)
controls(); render()
</script>
</body>
</html>
