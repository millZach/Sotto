<!doctype html>
<!-- THROWAWAY PROTOTYPE - containers, no-pill controls, provider cards, Usage sizing and a light sidebar tune for Sotto.
     Before is a copy of today's look from the CSS on main; After is the proposal. Synthetic data only, outside every entrypoint.
     URL: ?s=1..6 picks the tab, &box=A|B|C, &pill=R|N1|N2|N3, &prov=P1|P2, &side=keep|tune, &mode=dark|light, &w=1600|1280|820. -->
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sotto look tune-up (prototype)</title>
<style>
@font-face{font-family:Figtree;font-weight:300 900;font-display:swap;src:url(Figtree.ttf) format("truetype"),url(../../apps/ios/Sotto/Resources/Figtree.ttf) format("truetype")}

/* Theme roles, as the default Sotto theme paints them (src/shared/themes/palettes.ts). --ah is the accent hue. */
:root{color-scheme:dark;--ah:183;
  --canvas:oklch(.115 .008 265);--surface:oklch(.145 .008 265);--raised:oklch(.185 .008 265);--overlay:oklch(.215 .008 265);--sunken:oklch(.155 .008 265);
  --sidebar:oklch(.225 .003 265);--text:oklch(.985 .005 280);--text2:oklch(.86 .01 270);--muted:oklch(.72 .014 265);--faint:oklch(.62 .012 270);
  --border:oklch(.305 .02 265);--input:oklch(.375 .024 265);--hair:color-mix(in oklab,var(--border) 62%,var(--canvas));
  --accent:oklch(.714 .104 var(--ah));--accent-text:oklch(.83 .08 var(--ah));--accent-surface:oklch(.32 .05 var(--ah));
  --wash:color-mix(in oklab,var(--accent-surface) 62%,var(--canvas));--hover:color-mix(in srgb,var(--accent-surface) 55%,transparent);
  --pill:var(--text);--pill-ink:var(--canvas);
  --card-fill:var(--raised);--card-lift:oklch(.165 .008 265);
  --shadow-sm:0 1px 2px rgb(0 0 0/40%);--shadow-md:inset 0 1px 0 rgb(255 255 255/.045),0 1px 2px rgb(0 0 0/.5),0 8px 24px rgb(0 0 0/.45);
  --codex:#d7dbe1;--claude:#e3b58e;--grok:#c9baff;--devin:#a5d8f5;
  --chrome:oklch(.17 .006 265);--chrome-text:oklch(.92 .006 270)}
:root[data-mode=light]{color-scheme:light;
  --canvas:oklch(.978 .004 85);--surface:oklch(.99 .003 85);--raised:oklch(.955 .006 85);--overlay:oklch(.945 .007 85);--sunken:oklch(.945 .008 85);
  --sidebar:oklch(.955 .008 85);--text:oklch(.235 .014 75);--text2:oklch(.36 .014 75);--muted:oklch(.5 .014 75);--faint:oklch(.55 .015 78);
  --border:oklch(.86 .012 80);--input:oklch(.8 .016 80);--hair:color-mix(in oklab,var(--border) 70%,var(--canvas));
  --accent:oklch(.53 .095 var(--ah));--accent-text:oklch(.43 .08 var(--ah));--accent-surface:oklch(.92 .03 var(--ah));
  --wash:color-mix(in oklab,var(--accent-surface) 70%,var(--canvas));
  --card-fill:oklch(.948 .007 85);--card-lift:oklch(.995 .002 85);
  --shadow-sm:0 1px 2px rgb(20 24 22/10%);--shadow-md:0 1px 2px rgb(20 24 22/.07),0 6px 20px rgb(20 24 22/.08);
  --codex:#5d6470;--claude:#b8743c;--grok:#7a5fe0;--devin:#2f86b8;
  --chrome:oklch(.93 .006 85);--chrome-text:oklch(.25 .014 75)}

*{box-sizing:border-box}html,body{margin:0}
body{overflow-x:hidden;font:14px/1.45 Figtree,system-ui,sans-serif;color:var(--chrome-text);background:var(--chrome);padding-bottom:84px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- The review page around the mock-ups (not part of the design) ---------- */
.rv-head{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 18px;background:var(--chrome);border-bottom:1px solid var(--border)}
.rv-head h1{margin:0 auto 0 0;font-size:16px;font-weight:600}
.rv-head h1 small{font-weight:400;color:var(--muted);margin-left:8px}
.rv-tabs{display:flex;flex-wrap:wrap;gap:4px;width:100%}
.rv-tabs button,.rv-opts button,.rv-variants button{border:1px solid var(--border);background:transparent;border-radius:7px;padding:5px 11px;font-size:13px;color:var(--muted)}
.rv-tabs button[aria-selected=true],.rv-opts button[aria-pressed=true],.rv-variants button[aria-pressed=true]{background:var(--text);color:var(--canvas);border-color:var(--text)}
.rv-opts{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.rv-opts span{font-size:12px;color:var(--muted);margin-left:6px}
.rv-body{padding:16px 18px 0}
.rv-intro{max-width:980px;margin:0 0 14px;font-size:14px;color:var(--text2)}
.rv-intro b{color:var(--text)}
.rv-intro ul{margin:6px 0 0;padding-left:18px}
.rv-variants{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 12px}
.rv-variants>span{font-size:12px;color:var(--muted);margin-right:4px}
.rv-pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
.rv-pair>div{min-width:0}
.rv-pair>div>p{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.rv-pair>div>p em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400}
.rv-scene{margin:0 0 6px;font-size:13px;color:var(--text2)}
.frame{position:relative;overflow:hidden;border-radius:8px;outline:1px solid var(--border);cursor:zoom-in;background:var(--canvas)}
.frame>.win{transform-origin:0 0;position:absolute;top:0;left:0}
@media (max-width:900px){.rv-pair{grid-template-columns:1fr}}
.zoom{position:fixed;inset:0;z-index:50;background:rgb(0 0 0/.7);overflow:auto;display:none;padding:12px}
.zoom.on{display:block}.zoom .win{transform-origin:0 0}
.zoom-close{position:fixed;top:10px;right:12px;z-index:51;background:var(--text);color:var(--canvas);border:0;border-radius:7px;padding:6px 12px;display:none}
.zoom.on+.zoom-close{display:block}
.switcher{position:fixed;left:50%;bottom:14px;z-index:40;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;border-radius:12px;background:#111;color:#fff;box-shadow:0 6px 24px rgb(0 0 0/.5);font-size:13px;max-width:calc(100vw - 20px)}
.switcher button{background:#2a2a2a;border:0;color:#fff;border-radius:8px;width:34px;height:32px}
.switcher div{padding:0 8px;line-height:1.25;text-align:center}
.switcher small{display:block;color:#aaa;font-size:11px}
table.pills{border-collapse:collapse;width:100%;min-width:980px;background:var(--canvas);color:var(--text);border-radius:8px;overflow:hidden;outline:1px solid var(--border)}
table.pills th,table.pills td{padding:14px 16px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--hair);font-size:13px}
table.pills th{color:var(--muted);font-weight:500;font-size:12px}
table.pills td:first-child{font-weight:600;width:120px}
table.pills td:last-child{color:var(--muted);width:240px}
@media (max-width:760px){table.pills thead{display:none}table.pills td{display:block;width:auto!important;border:0;padding:6px 14px}table.pills tr{display:block;border-bottom:1px solid var(--hair);padding:8px 0}}

/* ---------- The mock window ---------- */
.win{display:flex;overflow:hidden;background:var(--canvas);color:var(--text);font-size:14px}
.win *{box-sizing:border-box}
.room{flex:1;min-width:0;position:relative;container:room/inline-size;overflow:hidden;display:flex;flex-direction:column}
.room-top{height:44px;flex:none;display:flex;justify-content:flex-end;align-items:center;gap:22px;padding:0 18px;color:var(--muted);font-size:15px}
.room-scroll{flex:1;min-height:0;overflow:hidden}

/* Threads sidebar: today's numbers from threadSidebar.css and sidebarSize.ts (320 wide by default). */
.side{flex:none;width:var(--sw,320px);display:flex;flex-direction:column;background:var(--sidebar);border-right:1px solid var(--hair)}
.side-top{display:flex;align-items:center;gap:4px;height:44px;padding:0 6px 0 14px}
.logo{width:24px;height:24px;border-radius:7px;background:var(--accent);margin-right:auto;position:relative}
.logo::after{content:'';position:absolute;inset:7px 5px;border-radius:50%;border:2px solid var(--canvas);border-top-color:transparent}
.ico{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.ico.on{background:var(--canvas);color:var(--text)}
.ico svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
.search{margin:6px 10px 6px;height:34px;border:1px solid var(--hair);border-radius:8px;background:color-mix(in oklab,var(--canvas) 55%,var(--sidebar));display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--muted);font-size:13px}
.tree{flex:1;padding:4px 14px}
.folder{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 6px;font-size:14px;font-weight:500;color:var(--text)}
.folder .count{margin-left:auto;color:var(--muted);font-size:12px;font-weight:400}
.trow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;align-items:center;column-gap:9px;min-height:30px;padding:0 8px 0 10px;margin-left:12px;border-radius:7px;color:var(--text2)}
.trow .t{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .time{font-size:12px;color:var(--muted)}
.trow.on{background:var(--hover);color:var(--text)}
.ring{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--border)}
.ring.run{border-color:var(--accent);border-right-color:transparent}
.ring.need{background:oklch(.77 .17 65);border:0}
.settled{display:flex;align-items:center;gap:6px;padding:12px 6px 0;color:var(--muted);font-size:12.5px}
.side-foot{padding:8px 8px 10px;border-top:1px solid var(--hair)}
.dseg{display:flex;padding:3px;border-radius:9px;background:var(--canvas);margin-bottom:8px}
.dseg b{flex:1;text-align:center;padding:7px 0;border-radius:7px;font-weight:400;font-size:13.5px;color:var(--text2)}
.pages{display:flex;gap:4px;color:var(--muted)}
.pages .ico.on{background:var(--hover);color:var(--accent-text)}
/* Light tune (variant): a little larger, a little narrower. */
.win[data-side=tune] .side{width:var(--sw-tune,280px)}
.win[data-side=tune] .search{font-size:13.5px;height:36px}
.win[data-side=tune] .tree{padding:6px 10px}
.win[data-side=tune] .folder{font-size:14.5px;min-height:34px}
.win[data-side=tune] .trow{min-height:34px;margin-left:10px}
.win[data-side=tune] .trow .t{font-size:14px}
.win[data-side=tune] .trow .time{font-size:12.5px}
.win[data-side=tune] .settled{font-size:13.5px}
.win[data-side=tune] .dseg b{font-size:14px}

/* ---------- Usage page (copied from usage.css) ---------- */
.u-page{container:usage/inline-size;max-width:1180px;margin:0 auto;padding:4px clamp(20px,5cqi,64px) 40px}
.u-title{display:flex;align-items:center;gap:12px;min-height:40px}
.u-title h1{margin:0;font-size:28px;font-weight:500;letter-spacing:-1px}
.u-refresh{margin-left:auto;color:var(--muted);font-size:14px}
.u-sub{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.u-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px;margin-top:18px}
.u-tabs{display:flex;gap:22px}
.u-tabs b{font-weight:400;color:var(--muted);padding-bottom:8px;border-bottom:2px solid transparent}
.u-tabs b.on{color:var(--text);border-color:var(--accent)}
.u-filters{display:flex;flex-wrap:wrap;gap:8px}
.fbtn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 13px;border:1px solid var(--hair);border-radius:9px;color:var(--text2);font-size:13px;white-space:nowrap}
.fbtn::after{content:'';width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg) translateY(-2px);margin-left:4px}
.u-focus{display:grid;grid-template-columns:252px minmax(0,1fr);align-items:start;gap:52px;margin-top:40px}
.u-index{display:flex;flex-direction:column;gap:2px;margin-left:-16px}
.u-item{position:relative;padding:14px 16px;border-radius:12px}
.u-item.on{background:var(--hover)}
.u-item.on::before{content:'';position:absolute;top:14px;bottom:14px;left:0;width:3px;border-radius:3px;background:var(--accent)}
.u-lab{color:var(--muted);font-size:12.5px}
.u-val{font-size:27px;font-weight:450;line-height:1.15;letter-spacing:-.9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-val.words{font-size:18px;font-weight:500;padding-top:4px;letter-spacing:-.3px}
.u-note{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-stage{min-width:0;padding-top:12px}
.u-stage h2{margin:0;font-size:22px;font-weight:500;letter-spacing:-.5px}
.u-when{margin:8px 0 0;color:var(--muted);font-size:13.5px}
.chart{position:relative;height:var(--ch,230px);margin-top:22px;border-bottom:1px solid var(--border);display:flex;align-items:flex-end;justify-content:space-around;gap:var(--gap,5px)}
.chart i{flex:1 1 0;max-width:52px;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.chart::before,.chart::after{content:'';position:absolute;left:0;right:0;border-top:1px dashed color-mix(in oklab,var(--text) 9%,var(--canvas))}
.chart::before{top:0}.chart::after{top:50%}
.axis{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:12.5px}
.u-prov{margin-top:26px;display:flex;align-items:center;gap:8px;color:var(--text2);font-size:13.5px}
@container usage (max-width:780px){
  .u-focus{grid-template-columns:minmax(0,1fr);gap:30px;margin-top:28px}
  .u-index{flex-direction:row;gap:6px;margin:0 -4px;padding:0 4px 10px;overflow-x:auto;scrollbar-width:thin}
  .u-item{flex:0 0 auto;min-width:172px}
  .u-item .u-val,.u-item .u-note{overflow:visible;text-overflow:clip}
  .u-item.on::before{top:auto;right:16px;bottom:0;left:16px;width:auto;height:3px}
}
@container usage (max-width:640px){.chart{--ch:180px}}
/* After: the index and the chart scale with the room, and the narrow index wraps instead of scrolling sideways. */
.win[data-usage=after] .u-focus{grid-template-columns:clamp(220px,24cqi,300px) minmax(0,1fr);gap:clamp(28px,4cqi,52px)}
.win[data-usage=after] .u-val{font-size:clamp(23px,1.2cqi + 15px,31px)}
.win[data-usage=after] .u-val.words{font-size:clamp(17px,.6cqi + 12px,20px)}
.win[data-usage=after] .chart{--ch:clamp(190px,26cqi,330px)}
@container usage (max-width:780px){
  .win[data-usage=after] .u-focus{grid-template-columns:minmax(0,1fr);gap:26px}
  .win[data-usage=after] .u-index{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:0;padding:0;overflow:visible}
  .win[data-usage=after] .u-item{min-width:0;padding:12px 14px}
  .win[data-usage=after] .u-item .u-val,.win[data-usage=after] .u-item .u-note{overflow:hidden;text-overflow:ellipsis}
  .win[data-usage=after] .u-item.on::before{left:14px;right:14px}
}

/* ---------- Settings page ---------- */
.s-layout{display:grid;grid-template-columns:var(--nw,264px) minmax(0,1fr);height:100%}
.s-nav{background:var(--sidebar);border-right:1px solid var(--hair);padding:56px 12px}
.s-nav b{display:block;font-weight:400;padding:8px 12px;border-radius:8px;color:var(--text2);font-size:14px}
.s-nav b.on{background:var(--hover);color:var(--text)}
.s-main{overflow:hidden;padding:44px clamp(24px,5cqi,64px) 40px;max-width:980px}
.s-h{font-size:28px;font-weight:600;margin:0;letter-spacing:-.5px}
.s-h+p{margin:4px 0 0;color:var(--muted);font-size:15px}
.s-group{margin-top:22px}
.s-gh{display:flex;align-items:center;gap:8px;padding:14px 0 10px;font-size:13.5px;font-weight:600;color:var(--text2);border-bottom:1px solid var(--hair)}
.s-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:20px;padding:16px 0;border-bottom:1px solid var(--hair)}
.s-row h4{margin:0;font-size:15px;font-weight:500}
.s-row p{margin:2px 0 0;color:var(--muted);font-size:13px;max-width:44ch}
.sel{min-width:220px;height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border:1px solid var(--hair);border-radius:10px;font-size:14px;font-weight:500}
.sel::after{content:'';width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg) translateY(-2px)}
.sample{margin:14px 0 6px;padding:14px 16px;border:1px solid var(--hair);border-radius:12px;background:var(--surface);font-size:12px;color:var(--muted)}
.sample code{display:block;font:13.5px/1.6 ui-monospace,Consolas,monospace;color:var(--text);margin-bottom:6px}
.tg{display:inline-block;width:36px;height:20px;border-radius:999px;background:var(--input);position:relative;flex:none}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--canvas);box-shadow:var(--shadow-sm)}
.tg.on{background:var(--accent)}.tg.on::after{left:19px}
/* Buttons and controls: before = pills (global.css: every .tt-button is radius 999px, hairline border; primary is a text-coloured pill). */
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 16px;border:1px solid var(--hair);border-radius:999px;font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;background:transparent}
.btn.primary{background:var(--pill);color:var(--pill-ink);border-color:var(--pill)}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--hair);border-radius:999px}
.seg b{font-weight:400;padding:5px 12px;border-radius:999px;color:var(--muted);font-size:14px}
.seg b.on{background:var(--pill);color:var(--pill-ink)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--input);border-radius:999px;color:var(--muted);font-size:13px;white-space:nowrap}
.findf{display:inline-flex;align-items:center;gap:8px;width:240px;height:34px;padding:0 14px;border:1px solid var(--hair);border-radius:999px;color:var(--muted);font-size:13px}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border:1px solid var(--hair);border-radius:999px;color:var(--muted);font-size:12px}
/* After: rounded rectangles. Pills stay only for toggles and dots. */
.win[data-pill=after] .btn,.pillafter .btn{border-radius:8px;border-color:var(--input);background:var(--surface)}
.win[data-pill=after] .btn.primary,.pillafter .btn.primary{background:var(--pill);border-color:var(--pill)}
.win[data-pill=after] .seg,.pillafter .seg{border:0;border-radius:9px;background:var(--sunken)}
.win[data-pill=after] .seg b,.pillafter .seg b{border-radius:7px}
.win[data-pill=after] .seg b.on,.pillafter .seg b.on{background:var(--overlay);color:var(--text);box-shadow:var(--shadow-sm)}
.win[data-pill=after] .chip,.pillafter .chip{border:0;border-radius:7px;background:var(--sunken);color:var(--text2)}
.win[data-pill=after] .findf,.pillafter .findf{border-radius:8px;border-color:var(--input)}
.win[data-pill=after] .tag,.pillafter .tag{border-radius:5px;border:0;background:var(--sunken);color:var(--text2)}
:root[data-mode=light] :is(.pillafter,.win[data-pill=after]) .seg b.on{background:var(--surface)}
:root[data-mode=light] .pillafter .chip,:root[data-mode=light] .win[data-pill=after] .chip{background:var(--overlay)}
/* Status labels, count badges and the effort meter, as pills today. */
.stat{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;background:var(--wash);color:var(--accent-text);font-size:12px;white-space:nowrap}
.stat::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.badge{display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--canvas);font-size:11px;font-weight:600}
.meter{display:inline-block;width:64px;height:6px;border-radius:999px;background:var(--input);position:relative;overflow:hidden;vertical-align:middle}
.meter::after{content:'';position:absolute;inset:0 25% 0 0;background:var(--accent);border-radius:inherit}
.pdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor}

/* ---------- No-pill directions. Nothing here is fully rounded. ---------- */
/* N1 · Soft square: 4-6px corners everywhere, a rounded-square switch, dots stay for status. */
:is(.win[data-pill=N1],.pv-N1) :is(.btn,.findf,.send){border-radius:6px}
:is(.win[data-pill=N1],.pv-N1) .btn{border-color:var(--input);background:var(--surface)}
:is(.win[data-pill=N1],.pv-N1) .btn.primary{background:var(--pill);border-color:var(--pill)}

:is(.win[data-pill=N1],.pv-N1) :is(.seg,.dseg) b{border-radius:4px}
:is(.win[data-pill=N1],.pv-N1) :is(.seg,.dseg) b.on{background:var(--overlay);color:var(--text);box-shadow:var(--shadow-sm)}
:root[data-mode=light] :is(.win[data-pill=N1],.pv-N1) :is(.seg,.dseg) b.on{background:var(--surface)}
:is(.win[data-pill=N1],.pv-N1) .chip{border:0;border-radius:5px;background:var(--sunken);color:var(--text2)}
:root[data-mode=light] :is(.win[data-pill=N1],.pv-N1) .chip{background:var(--overlay)}
:is(.win[data-pill=N1],.pv-N1) .tag{border:0;border-radius:4px;background:var(--sunken);color:var(--text2)}
:is(.win[data-pill=N1],.pv-N1) .tg{border-radius:5px}
:is(.win[data-pill=N1],.pv-N1) .tg::after{border-radius:3px}
:is(.win[data-pill=N1],.pv-N1) .stat{background:none;padding:0;height:auto}
:is(.win[data-pill=N1],.pv-N1) .badge{border-radius:4px}
:is(.win[data-pill=N1],.pv-N1) .meter{border-radius:2px}
:is(.win[data-pill=N1],.pv-N1) .chart i{border-radius:2px 2px 0 0}
/* N2 · Hard edges: square corners, 1px boxed controls, boxed tabs, a square switch, square status marks. */
:is(.win[data-pill=N2],.pv-N2) :is(.btn,.findf,.send,.chip,.tag,.fbtn,.sel,.search,.badge,.meter,.tg,.tg::after,.u-item,.pcard,.boxable,.composer,.msg-u,.sample,.logo){border-radius:0!important}
:is(.win[data-pill=N2],.pv-N2) .btn{border:1px solid var(--input);background:transparent}
:is(.win[data-pill=N2],.pv-N2) .btn.primary{background:var(--pill);border-color:var(--pill)}
:is(.win[data-pill=N2],.pv-N2) :is(.seg,.dseg){gap:0;padding:0;border:1px solid var(--input);border-radius:0;background:transparent}
:is(.win[data-pill=N2],.pv-N2) :is(.seg,.dseg) b{border-radius:0}
:is(.win[data-pill=N2],.pv-N2) :is(.seg,.dseg) b+b{border-left:1px solid var(--input)}
:is(.win[data-pill=N2],.pv-N2) :is(.seg,.dseg) b.on{background:var(--accent-surface);color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
:is(.win[data-pill=N2],.pv-N2) .chip{border:1px solid var(--input);background:transparent;color:var(--text2)}
:is(.win[data-pill=N2],.pv-N2) .tag{border:1px solid var(--input);background:transparent}
:is(.win[data-pill=N2],.pv-N2) :is(.stat::before,.pdot,.ring,.pcard .who small::before,.dot){border-radius:0!important}
:is(.win[data-pill=N2],.pv-N2) .stat{background:none;padding:0;height:auto}
:is(.win[data-pill=N2],.pv-N2) :is(.u-tabs,.ptabs){gap:0;border-bottom:1px solid var(--input)}
:is(.win[data-pill=N2],.pv-N2) :is(.u-tabs,.ptabs) b{padding:7px 14px;border:1px solid transparent;border-bottom:0;margin-bottom:-1px}
:is(.win[data-pill=N2],.pv-N2) :is(.u-tabs,.ptabs) b.on{border-color:var(--input);background:var(--canvas)}
:is(.win[data-pill=N2],.pv-N2) .chart i{border-radius:0}
:is(.win[data-pill=N2],.pv-N2) .meter{width:66px;height:8px;background:repeating-linear-gradient(90deg,var(--input) 0 15px,transparent 15px 17px)}
:is(.win[data-pill=N2],.pv-N2) .meter::after{right:34px;background:repeating-linear-gradient(90deg,var(--accent) 0 15px,transparent 15px 17px)}
/* N3 · Text first: few boxes. Pickers and status are words, toggles are checkboxes, choices are underlined. */
:is(.win[data-pill=N3],.pv-N3) .btn{border:0;background:none;padding:0 4px;color:var(--accent-text);text-decoration:underline;text-underline-offset:4px;text-decoration-color:color-mix(in oklab,var(--accent-text) 45%,transparent)}
:is(.win[data-pill=N3],.pv-N3) .btn.primary{border-radius:4px;padding:0 14px;color:var(--pill-ink);background:var(--pill);text-decoration:none}
:is(.win[data-pill=N3],.pv-N3) :is(.seg,.dseg){gap:16px;padding:0;border:0;border-radius:0;background:none}
:is(.win[data-pill=N3],.pv-N3) :is(.seg,.dseg) b{padding:4px 0;border-radius:0;background:none;color:var(--muted)}
:is(.win[data-pill=N3],.pv-N3) :is(.seg,.dseg) b.on{background:none;color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
:is(.win[data-pill=N3],.pv-N3) .dseg{justify-content:center;gap:28px;padding:4px 0 2px}
:is(.win[data-pill=N3],.pv-N3) .dseg b{flex:none}
:is(.win[data-pill=N3],.pv-N3) .chip{border:0;border-radius:0;background:none;padding:0 2px;color:var(--text2);gap:4px}
:is(.win[data-pill=N3],.pv-N3) .chip::after{content:'⌄';color:var(--muted);transform:translateY(-3px)}
:is(.win[data-pill=N3],.pv-N3) .chip+.chip::before{content:'·';color:var(--faint);margin-right:8px}
:is(.win[data-pill=N3],.pv-N3) .findf{border:0;border-bottom:1px solid var(--input);border-radius:0;padding:0 2px}
:is(.win[data-pill=N3],.pv-N3) .tag{border:0;border-radius:0;padding:0;height:auto;font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
:is(.win[data-pill=N3],.pv-N3) .tag+.tag::before{content:'·';margin-right:8px;font-family:Figtree,sans-serif}
:is(.win[data-pill=N3],.pv-N3) .tg{width:16px;height:16px;border-radius:3px;background:none;border:1.5px solid var(--input)}
:is(.win[data-pill=N3],.pv-N3) .tg::after{content:'';top:2px;left:5px;width:4px;height:8px;border-radius:0;background:none;box-shadow:none;border:solid transparent;border-width:0 2px 2px 0;transform:rotate(45deg)}
:is(.win[data-pill=N3],.pv-N3) .tg.on{background:var(--accent);border-color:var(--accent)}
:is(.win[data-pill=N3],.pv-N3) .tg.on::after{left:5px;border-color:var(--canvas)}
:is(.win[data-pill=N3],.pv-N3) .stat{background:none;padding:0;height:auto}
:is(.win[data-pill=N3],.pv-N3) :is(.stat::before,.pcard .who small::before){display:none}
:is(.win[data-pill=N3],.pv-N3) .badge{background:none;color:var(--accent-text);padding:0;min-width:0;height:auto;border-radius:0;font-size:12px}
:is(.win[data-pill=N3],.pv-N3) .meter{display:none}
:is(.win[data-pill=N3],.pv-N3) .meter+.mword{display:inline}
.mword{display:none;color:var(--text2);font-size:13px}
:is(.win[data-pill=N3],.pv-N3) .send{border-radius:4px}
:is(.win[data-pill=N3],.pv-N3) .chart i{border-radius:1px 1px 0 0}
.win[data-pill=N2] .tg::after,.pv-N2 .tg::after,.win[data-pill=N2] .stat::before,.pv-N2 .stat::before,.win[data-pill=N2] .pcard .who small::before{border-radius:0}
.win[data-pill=N3] .stat::before,.pv-N3 .stat::before,.win[data-pill=N3] .pcard .who small::before{display:none}
/* The send control in the no-pill directions is a square with an arrow, not a disc. */
.send{display:grid;place-items:center;color:var(--pill-ink);font-size:15px;font-weight:600}

/* ---------- Containers. before = today: 1px hairlines, or nothing. ---------- */
.box{border-radius:0}
/* A: firm outline. A clearly visible line in the border role, 12px corners, room inside. */
.win[data-box=A] .boxable{border:1.5px solid color-mix(in oklab,var(--border) 45%,var(--input));border-radius:12px;padding:18px 20px}
.win[data-box=A] .fbtn,.win[data-box=A] .sel{border:1.5px solid color-mix(in oklab,var(--border) 45%,var(--input))}
/* B: filled. No outline at all; the card is a step lighter (dark) or darker (light) than the page. */
.win[data-box=B] .boxable{border:0;border-radius:14px;background:var(--card-fill);padding:18px 20px}
.win[data-box=B] .fbtn,.win[data-box=B] .sel{border:0;background:var(--card-fill)}
.win[data-box=B] .sample,.win[data-box=B] .boxable .sel{border:0;background:var(--canvas)}
/* C: raised. A lifted surface with a faint edge and a soft shadow. */
.win[data-box=C] .boxable{border:1px solid var(--hair);border-radius:14px;background:var(--card-lift);box-shadow:var(--shadow-md);padding:18px 20px}
.win[data-box=C] .fbtn,.win[data-box=C] .sel{border:1px solid var(--border);background:var(--card-lift);box-shadow:var(--shadow-sm)}
/* Inside any card: rows divide with a firmer line, and the last row loses its line. */
.win:is([data-box=A],[data-box=B],[data-box=C]) .boxable .s-row{border-bottom-color:var(--border)}
.win[data-box=B] .boxable .s-row{border-bottom-color:var(--canvas);border-bottom-width:2px}
.win:is([data-box=A],[data-box=B],[data-box=C]) .boxable .s-row:last-child{border-bottom:0;padding-bottom:4px}
.win:is([data-box=A],[data-box=B],[data-box=C]) .boxable .s-row:first-of-type{padding-top:4px}
.win:is([data-box=A],[data-box=B],[data-box=C]) .s-gh{border-bottom:0;padding:22px 2px 10px}
/* The usage index as one card in a box variant; the chart stage as another. */
.win:is([data-box=A],[data-box=B],[data-box=C]) .u-index{margin-left:0;padding:8px}
.win:is([data-box=A],[data-box=B],[data-box=C]) .u-stage{padding:20px 24px 22px}
.win:is([data-box=A],[data-box=B],[data-box=C]) .u-item.on{background:var(--wash)}

/* ---------- Providers (crossing-settings.css: 4 across, no edges, the toggle at the bottom right) ---------- */
.mark{display:inline-grid;place-items:center;width:20px;height:20px;font-size:17px;line-height:1;flex:none}
.mark[data-p=codex]{color:var(--codex)}.mark[data-p=claude]{color:var(--claude)}.mark[data-p=grok]{color:var(--grok)}.mark[data-p=devin]{color:var(--devin)}
.plist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:6px 0 24px;border-bottom:1px solid var(--hair);margin-top:22px}
.pcard{display:flex;flex-direction:column;padding:6px 12px 12px;border-radius:9px}
.pcard.on{background:var(--wash)}
.pcard .who{display:flex;align-items:flex-start;gap:8px;padding:10px 0}
.pcard .who strong{display:block;font-size:14px;font-weight:600}
.pcard .who small{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12px;color:var(--muted)}
.pcard .who small::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.pcard .who small.ok{color:var(--accent-text)}
.pcard>.tg{align-self:flex-end}
.pdetail h3{display:flex;align-items:center;gap:10px;margin:22px 0 14px;font-size:18px;font-weight:600}
.ptabs{display:flex;gap:22px;border-bottom:1px solid var(--hair)}
.ptabs b{font-weight:400;color:var(--muted);padding-bottom:12px;border-bottom:2px solid transparent;font-size:14px}
.ptabs b.on{color:var(--text);border-color:var(--accent)}
.prow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0}
.prow h4{margin:0;font-size:15px;font-weight:600}.prow p{margin:3px 0 0;color:var(--muted);font-size:13px}
/* P1: separate cards; the toggle sits on the name's line, at its end. */
.win[data-prov=P1] .plist,.win[data-prov=P2] .plist{gap:12px;border-bottom:0;padding-bottom:6px}
.win:is([data-prov=P1],[data-prov=P2]) .pcard{padding:14px 16px;border-radius:12px;border:1.5px solid color-mix(in oklab,var(--border) 45%,var(--input))}
.win:is([data-prov=P1],[data-prov=P2])[data-box=B] .pcard{border-color:transparent;background:var(--card-fill)}
.win:is([data-prov=P1],[data-prov=P2])[data-box=C] .pcard{border:1px solid var(--hair);background:var(--card-lift);box-shadow:var(--shadow-md)}
.win:is([data-prov=P1],[data-prov=P2]) .pcard.on{border-color:var(--accent);background:var(--wash);box-shadow:0 0 0 1px var(--accent)}
.win[data-prov=P1] .pcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:10px;row-gap:6px}
.win[data-prov=P1] .pcard .who{display:contents}
.win[data-prov=P1] .pcard .who>span{display:contents}
.win[data-prov=P1] .pcard .who strong{grid-column:2;grid-row:1}
.win[data-prov=P1] .pcard .who small{grid-column:2/4;grid-row:2;margin:0}
.win[data-prov=P1] .pcard .mark{grid-row:1}
.win[data-prov=P1] .pcard>.tg{grid-column:3;grid-row:1;align-self:center}
/* P2: the toggle leads, right before the mark and name. */
.win[data-prov=P2] .pcard{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;column-gap:10px;row-gap:6px}
.win[data-prov=P2] .pcard>.tg{grid-column:1;grid-row:1;order:-1;align-self:center}
.win[data-prov=P2] .pcard .who{display:contents}
.win[data-prov=P2] .pcard .who>span{display:contents}
.win[data-prov=P2] .pcard .mark{grid-column:2;grid-row:1}
.win[data-prov=P2] .pcard .who strong{grid-column:3;grid-row:1}
.win[data-prov=P2] .pcard .who small{grid-column:2/4;grid-row:2;margin:0}
.win:is([data-prov=P1],[data-prov=P2]) .pdetail{margin-top:18px}
.win:is([data-prov=P1],[data-prov=P2]) .pdetail h3{margin-top:4px}
@container room (max-width:700px){
  .plist{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ---------- Thread room, for the sidebar and all-together scenes ---------- */
.th{padding:4px clamp(20px,5cqi,64px);max-width:860px;margin:0 auto}
.th h2{margin:0 0 4px;font-size:16px;font-weight:600}
.th .meta{display:flex;gap:8px;align-items:center;margin-bottom:22px}
.msg-u{margin:0 0 18px auto;max-width:72%;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--hair);font-size:14px}
.msg-a{margin:0 0 18px;font-size:14px;color:var(--text2);line-height:1.6}
.composer{margin-top:18px;border:1px solid var(--hair);border-radius:16px;padding:12px 12px 10px;background:var(--surface)}
.composer .ph{color:var(--faint);font-size:14px;padding:2px 4px 14px}
.composer .row{display:flex;gap:6px;align-items:center}
.send{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--pill)}
.win[data-box=A] .composer{border:1.5px solid color-mix(in oklab,var(--border) 45%,var(--input))}
.win[data-box=B] .composer{border-color:transparent;background:var(--card-fill)}
.win[data-box=C] .composer{background:var(--card-lift);box-shadow:var(--shadow-md)}
.win[data-box=A] .msg-u{border:1.5px solid color-mix(in oklab,var(--border) 45%,var(--input))}
.win[data-box=B] .msg-u{border-color:transparent;background:var(--card-fill)}
.win[data-box=C] .msg-u{background:var(--card-lift);box-shadow:var(--shadow-sm)}

@media (prefers-reduced-motion:no-preference){.frame>.win{transition:none}}

<script>
const q = new URLSearchParams(location.search)

const PROV = { P1: 'Toggle at the end of the name line', P2: 'Toggle before the name' }
const PILL = { R: 'Rectangles, round toggles (earlier pick)', N1: 'Soft square', N2: 'Hard edges', N3: 'Text first' }
const SIDE = { keep: 'Keep the sidebar as it is', tune: 'Light tune' }
const TABS = ['1 Containers', '2 No pills', '3 Provider cards', '4 Usage sizing', '5 Left sidebar (optional)', '6 All together']

const ico = d => `<span class="ico"><svg viewBox="0 0 16 16"><path d="${d}"/></svg></span>`
const icoOn = d => `<span class="ico on"><svg viewBox="0 0 16 16"><path d="${d}"/></svg></span>`
const P = { chat: 'M2 3h9v6H6l-3 2V9H2zM11 6h3v6h-1v2l-3-2H7', term: 'M2 3h12v10H2zM5 6l2 2-2 2M8 10h3', folder: 'M2 4h4l1 1h7v7H2z', pen: 'M3 13l1-3 7-7 2 2-7 7z', side: 'M2 3h12v10H2zM6 3v10', clock: 'M8 2a6 6 0 1 0 0 12A6 6 0 0 0 8 2zM8 5v3l2 2', bars: 'M3 13V7M6.5 13V3M10 13V8M13.5 13V5', gear: 'M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.5 1.5M11.5 11.5L13 13M3 13l1.5-1.5M11.5 4.5L13 3', help: 'M8 2a6 6 0 1 0 0 12A6 6 0 0 0 8 2zM6.5 6.5a1.5 1.5 0 1 1 2 1.4c-.5.2-.5.6-.5 1.1M8 11v.5', sync: 'M13 6a5 5 0 0 0-9-1M3 10a5 5 0 0 0 9 1M13 2v4H9M3 14v-4h4' }

function sidebar(page) {
  const rows = [['run', 'Tune Usage scaling', '2m', true], ['', 'Provider cards with edges', '18m'], ['need', 'Pill buttons to rectangles', '1h'], ['', 'Release 0.42.3 notes', '3h']]

  <div class="search">⌕&nbsp; Search threads</div>
  <div class="tree"><div class="folder">⌄ ▭ Sotto <span class="count">4</span></div>${r(rows)}<div class="folder" style="margin-top:6px">⌄ ▭ Plant controls <span class="count">2</span></div>${r(rows2)}<div class="settled">› Settled</div></div>
  <div class="side-foot"><div class="dseg"><b>Dictate</b><b>Threads</b></div><div class="pages">${ico(P.clock)}${page === 'usage' ? icoOn(P.bars) : ico(P.bars)}${page === 'settings' ? icoOn(P.gear) : ico(P.gear)}${ico(P.help)}<span style="margin-left:auto">${ico(P.sync)}</span></div></div></aside>`
}
const bars = [3,5,2,8,6,9,4,7,12,10,6,3,2,9,14,11,8,5,7,13,16,12,9,6,4,10,15,18,11,7]
function usage() {
  const items = [['Room left', '80%', 'Claude Code · This computer'], ['Prompts', '142', 'accepted prompts from you', 1], ['Tokens', '3.6M', 'input + output'], ['From cache', '57%', 'of reported input tokens'], ['Most used model', 'Opus 5.5', '88 prompts at send', 0, 1], ['Busiest hour', 'Tue 12pm', 'when you send the most', 0, 1]]
  return `<div class="room-top">— ▢ ✕</div><div class="room-scroll"><div class="u-page">
  <div class="u-title"><h1>Usage</h1><span class="u-refresh">⟳ Refresh</span></div><p class="u-sub">Subscriptions and the work you do in Sotto.</p>
  <div class="u-bar"><div class="u-tabs"><b class="on">Overview</b><b>Subscriptions</b><b>Models</b></div><div class="u-filters"><span class="fbtn">Last 30 days</span><span class="fbtn">All computers</span><span class="fbtn">All providers</span></div></div>
  <div class="u-focus"><div class="u-index boxable">${items.map(([l, v, n, on, w]) => `<div class="u-item${on ? ' on' : ''}"><div class="u-lab">${l}</div><div class="u-val${w ? ' words' : ''}">${v}</div><div class="u-note">${n}</div></div>`).join('')}</div>
  <div class="u-stage boxable"><h2>Prompts</h2><p class="u-when">Point to a day, or use the arrow keys to read it.</p>
  <div class="chart">${bars.map(b => `<i style="height:${b / 18 * 100}%"></i>`).join('')}</div><div class="axis"><span>Sep 22</span><span>Oct 21</span></div>
  <div class="u-prov"><span class="mark" data-p="claude">✳</span>Claude Code <b style="margin-left:6px">96</b><span class="mark" data-p="codex" style="margin-left:14px">◎</span>Codex <b style="margin-left:6px">46</b></div></div></div></div></div>`
}
function settingsGit() {
  return `<div class="s-main"><h2 class="s-h">Git</h2><p>Commits, pull requests, Changes &amp; fetching</p>
  <div class="s-gh">⊸ When a thread commits</div>
  <div class="s-group boxable" style="margin-top:0"><div class="s-row"><div><h4>Commit and pull request style</h4><p>Follows each repository's recent commits and AGENTS.md.</p></div><span class="sel">Repository conventions</span></div>
  <div class="sample"><span>Commit subject</span><code>Let a thread name itself from its first exchange</code><span>An example. Each repository's recent commits and AGENTS.md set the real style.</span></div></div>
  <div class="s-gh">⑂ When a pull request is made or merged</div>
  <div class="s-group boxable" style="margin-top:0"><div class="s-row"><div><h4>Follow pull request templates</h4><p>Drafted pull requests follow the repository's template when Sotto finds one.</p></div><span class="tg on"></span></div>
  <div class="s-row"><div><h4>Default merge method</h4><p>The pull request checklist starts on the method you used last, or Merge the first time.</p></div><span class="sel">Last selected</span></div>
  <div class="s-row"><div><h4>Theme</h4><p>Follows the computer, or stays light or dark.</p></div><span class="seg"><b>Light</b><b>Dark</b><b class="on">System</b></span></div></div></div>`
}
function settingsNav(on) {
  return `<nav class="s-nav">${['General', 'Appearance', 'Providers', 'Agents', 'Git', 'Capture', 'Cleanup', 'Hosts', 'Phones'].map(n => `<b class="${n === on ? 'on' : ''}">${n}</b>`).join('')}</nav>`
}
function providers() {
  const ps = [['codex', '◎', 'Codex', 'Connected', 1, 1], ['claude', '✳', 'Claude Code', 'Connected', 1], ['grok', '⊘', 'Grok Build', 'Disabled'], ['devin', '⬢', 'Devin', 'Disabled']]
  return `<div class="s-main"><h2 class="s-h">Providers</h2><p>Accounts &amp; connections</p>
  <div class="plist">${ps.map(([id, g, n, s, on, sel]) => `<div class="pcard${sel ? ' on' : ''}"><div class="who"><span class="mark" data-p="${id}">${g}</span><span><strong>${n}</strong><small class="${s === 'Connected' ? 'ok' : ''}">${s}</small></span></div><span class="tg${on ? ' on' : ''}" title="Enable ${n}"></span></div>`).join('')}</div>
  <div class="pdetail boxable"><h3><span class="mark" data-p="codex">◎</span>Codex <span class="tag">0.61.0</span></h3><div class="ptabs"><b class="on">Configuration</b><b>Models</b></div>
  <div class="prow"><div><h4>Local connection</h4><p>Uses your Codex sign-in on this computer.</p></div><span class="btn primary">Disconnect</span></div>
  <div class="prow"><div><h4>Installed client</h4><p>Codex 0.61.0 is the newest version.</p></div><span class="btn">Check again</span></div></div></div>`
}
function thread() {
  return `<div class="room-top">— ▢ ✕</div><div class="room-scroll"><div class="th"><h2>Tune Usage scaling</h2><div class="meta"><span class="stat">Running</span><span class="tag">worktree</span><span class="tag">sotto/39d2542a</span></div>
  <div class="msg-u">The metric strip clips at the minimum window. Make it wrap instead.</div>
  <div class="msg-a">Under 780 pixels the index turns into a row that scrolls sideways, and each card is at least 172 pixels wide, so the first one is cut off. I'll make it a two-column grid there and let the chart's height follow the room.</div>
  <div class="composer"><div class="ph">Ask for follow-up changes</div><div class="row"><span class="chip"><span class="mark" data-p="claude" style="width:14px;font-size:13px">✳</span>Opus 5.5</span><span class="chip">High</span><span class="chip">Ask first</span><span class="send">↑</span></div></div></div></div>`
}
function win(w, h, attrs, page) {
  const sw = attrs.side === 'tune' ? Math.round(Math.max(260, Math.min(280, w * .3))) : 320
  if (attrs.pill === 'R') attrs = { ...attrs, pill: 'after' }
  const a = Object.entries(attrs).map(([k, v]) => `data-${k}="${v}"`).join(' ')
  let body
  if (page === 'usage') body = sidebar('usage') + `<div class="room">${usage()}</div>`
  else if (page === 'threads') body = sidebar('threads') + `<div class="room">${thread()}</div>`
  else body = `<div class="room"><div class="s-layout">${settingsNav(page === 'providers' ? 'Providers' : 'Git')}${page === 'providers' ? providers() : settingsGit()}</div></div>`
  return `<div class="win" ${a} style="width:${w}px;height:${h}px;--sw:${sw}px;--sw-tune:${sw}px;--nw:${w <= 820 ? 224 : w <= 980 ? 244 : 264}px">${body}</div>`
}
function pair(scene, beforeHtml, afterHtml, afterLabel, w, h) {
  return `<p class="rv-scene">${scene}</p><div class="rv-pair"><div><p>Before <em>· today</em></p><div class="frame" data-w="${w}" data-h="${h}">${beforeHtml}</div></div><div><p>After <em>· ${afterLabel}</em></p><div class="frame" data-w="${w}" data-h="${h}">${afterHtml}</div></div></div>`
}
const vbtn = (key, val, label) => `<button aria-pressed="${st[key] === val}" data-set="${key}" data-val="${val}">${label}</button>`
const widths = `<div class="rv-variants"><span>Window</span>${[1600, 1280, 820].map(w => vbtn('w', w, w === 820 ? '820 × 560 (minimum)' : w === 1280 ? '1280 × 800' : '1600 × 1000')).join('')}</div>`
const hFor = w => w === 1600 ? 1000 : w === 1280 ? 800 : 560

function render() {
  document.documentElement.dataset.mode = st.mode
  document.documentElement.style.setProperty('--ah', st.ah)
  document.getElementById('opts').innerHTML = `${vbtn('mode', 'dark', 'Dark')}${vbtn('mode', 'light', 'Light')}<span>Accent</span>${vbtn('ah', '183', 'Teal')}${vbtn('ah', '65', 'Amber')}${vbtn('ah', '255', 'Blue')}`
  document.getElementById('tabs').innerHTML = TABS.map((t, i) => `<button role="tab" aria-selected="${st.s === i + 1}" data-set="s" data-val="${i + 1}">${t}</button>`).join('')
  const w = st.w, h = hFor(w)
  let html = ''
  if (st.s === 1) {
    html = `<div class="rv-intro"><b>Containers.</b> Today almost every box is a 1px line in the faintest border role (about 200 places), so cards, filters and settings groups barely separate from the page. Three ways to give them a clear edge, each built only from theme roles so every theme and both modes follow.
    <ul><li><b>A · Firm outline</b>: a 1.5px line between the border and input roles, 12px corners, room inside.</li><li><b>B · Filled surfaces</b>: no line; the card is a step off the page colour.</li><li><b>C · Raised cards</b>: a lifted surface, faint edge and soft shadow.</li></ul></div>
    <div class="rv-variants"><span>Variant</span>${Object.entries(BOX).map(([k, v]) => vbtn('box', k, `${k} · ${v}`)).join('')}</div>${widths}`
    html += pair(`Usage · Overview · ${w} × ${h}`, win(w, h, { box: 'before', side: 'keep' }, 'usage'), win(w, h, { box: st.box, side: 'keep' }, 'usage'), `${st.box} · ${BOX[st.box]}`, w, h)
    html += pair(`Settings · Git · ${w} × ${h}`, win(w, h, { box: 'before', side: 'keep' }, 'git'), win(w, h, { box: st.box, side: 'keep' }, 'git'), `${st.box} · ${BOX[st.box]}`, w, h)
  } else if (st.s === 2) {
    const dirs = ['N1', 'N2', 'N3']
    const row = (name, before, rules) => `<tr><td>${name}</td><td>${before}</td>${dirs.map(d => `<td class="pv-${d}">${before}</td>`).join('')}<td>${rules}</td></tr>`
    html = `<div class="rv-intro"><b>No pills.</b> The person who gave the feedback says pills "scream vibe coded", so these three directions have no fully rounded shape anywhere: buttons, tabs, chips, toggles, badges, the composer's model, effort and permission pickers, status labels and segmented controls such as Dictate / Threads. The table shows every kind side by side; the screens below wear the one you pick, with the <b>${BOX[st.box]}</b> cards.
    <ul><li><b>N1 · Soft square</b>: 4-6px corners on everything, a rounded-square switch, status as a coloured dot and words.</li><li><b>N2 · Hard edges</b>: square corners, 1px boxed controls, boxed tabs, divided segments, a square switch, square status marks.</li><li><b>N3 · Text first</b>: as few boxes as possible. Pickers and status are words, toggles are checkboxes, choices are underlined, secondary buttons are links.</li></ul></div>
    <div style="overflow-x:auto"><table class="pills"><thead><tr><th>Control</th><th>Before</th><th>N1 · Soft square</th><th>N2 · Hard edges</th><th>N3 · Text first</th><th>What replaces the pill</th></tr></thead><tbody>
    ${row('Main button', '<span class="btn primary">Connect</span>', 'N1 6px corners · N2 square · N3 4px corners')}
    ${row('Other buttons', '<span class="btn">Check again</span> <span class="btn">Refresh</span>', 'N1 6px box · N2 square 1px box · N3 an underlined link')}
    ${row('Tabs', '<span class="u-tabs" style="display:inline-flex"><b class="on">Overview</b><b>Models</b></span>', 'N1 and N3 underlined · N2 boxed tabs')}
    ${row('Segmented control', '<span class="seg"><b>Light</b><b>Dark</b><b class="on">System</b></span>', 'N1 straight-sided track, 4px segment · N2 divided boxes · N3 underlined words')}
    ${row('Dictate / Threads', '<span class="dseg" style="display:inline-flex;width:170px;margin:0"><b>Dictate</b><b class="on">Threads</b></span>', 'Same rule as the segmented control')}
    ${row('Composer pickers', '<span class="chip">✳ Opus 5.5</span> <span class="chip">High</span> <span class="chip">Ask first</span>', 'N1 filled 5px chips · N2 square boxes · N3 words with a chevron')}
    ${row('Send', '<span class="send" style="display:inline-grid;width:30px;height:30px;margin:0">↑</span>', 'A square with an arrow instead of a disc')}
    ${row('Toggles', '<span class="tg on"></span> <span class="tg"></span>', 'N1 rounded-square switch · N2 square switch · N3 checkbox')}
    ${row('Status labels', '<span class="stat">Running</span>', 'A coloured dot or mark and the word, no capsule. N3 the word alone')}
    ${row('Count badges', '<span class="badge">3</span>', 'N1 4px box · N2 square · N3 the number in the accent colour')}
    ${row('Tags', '<span class="tag">worktree</span> <span class="tag">0.61.0</span>', 'N1 filled 4px · N2 square outline · N3 plain text')}
    ${row('Find fields', '<span class="findf">⌕ Find in history</span>', 'N1 6px field · N2 square field · N3 an underline')}
    ${row('Effort meter', '<span class="meter"></span><span class="mword">High</span>', 'N1 2px corners · N2 square steps · N3 the word')}
    </tbody></table></div><p style="height:16px"></p>
    <div class="rv-variants"><span>Screens wear</span>${Object.entries(PILL).map(([k, v]) => vbtn('pill', k, `${k} · ${v}`)).join('')}</div>
    <div class="rv-variants"><span>Cards</span>${Object.entries(BOX).map(([k, v]) => vbtn('box', k, `${k} · ${v}`)).join('')}</div>${widths}`
    const after = { box: st.box, side: 'keep', pill: st.pill, prov: st.prov }
    const before = { box: 'before', side: 'keep', pill: 'before', prov: 'before' }
    const lab = `${st.pill} · ${PILL[st.pill]}, ${BOX[st.box].toLowerCase()}`
    html += pair(`Threads · composer, status and tags · ${w} × ${h}`, win(w, h, before, 'threads'), win(w, h, after, 'threads'), lab, w, h)
    html += pair(`Settings · Providers · ${w} × ${h}`, win(w, h, before, 'providers'), win(w, h, after, 'providers'), lab, w, h)
    html += pair(`Settings · Git · ${w} × ${h}`, win(w, h, before, 'git'), win(w, h, after, 'git'), lab, w, h)
    html += pair(`Usage · ${w} × ${h}`, win(w, h, before, 'usage'), win(w, h, after, 'usage'), lab, w, h)
  } else if (st.s === 3) {
    html = `<div class="rv-intro"><b>Provider cards.</b> Today the four providers sit in a row with no edges, and each toggle is at the bottom right, far from the name it turns on. Each card gets an edge in the container style you pick on tab 1 (now <b>${st.box} · ${BOX[st.box]}</b>); the selected one wears the accent. Two places for the toggle:
    <ul><li><b>P1</b>: on the name's line, at its end.</li><li><b>P2</b>: right before the mark and name.</li></ul></div>
    <div class="rv-variants"><span>Variant</span>${Object.entries(PROV).map(([k, v]) => vbtn('prov', k, `${k} · ${v}`)).join('')}</div>${widths}`
    html += pair(`Settings · Providers · ${w} × ${h}`, win(w, h, { box: 'before', side: 'keep', pill: 'before', prov: 'before' }, 'providers'), win(w, h, { box: st.box, side: 'keep', pill: st.pill, prov: st.prov }, 'providers'), `${st.prov} · ${PROV[st.prov]}, with ${st.box} cards`, w, h)
  } else if (st.s === 4) {
    html = `<div class="rv-intro"><b>Usage sizing.</b> What is off today, from <code>usage.css</code>:
    <ul><li>The metric index is a fixed 252px column with fixed 27px numbers, and the chart is a fixed 230px tall at every window size, so at 1600 the chart is a thin strip and at 1280 the index looks cramped beside it.</li>
    <li>Below a 780px-wide room (the 820 window, and 1280 with the sidebar dragged wide) the index becomes a sideways-scrolling row of cards at least 172px wide. The first card is cut off ("…eft", "…%") and half the figures are off screen.</li></ul>
    After: the index and its numbers grow and shrink with the room (220 to 300px), the chart is 190 to 330px tall, and in a narrow room the six figures wrap into a grid you can see all at once. Pick a window size to compare.</div>${widths}`
    html += pair(`Usage · Overview · ${w} × ${h}`, win(w, h, { box: 'before', side: 'keep', usage: 'before' }, 'usage'), win(w, h, { box: 'before', side: 'keep', usage: 'after' }, 'usage'), 'scales with the room', w, h)
  } else if (st.s === 5) {
    html = `<div class="rv-intro"><b>Left sidebar, optional.</b> You like it, so this is a light tune you can turn down. The text goes up a step (thread titles 13 → 14px, folders 14 → 14.5px, rows 30 → 34px tall) and the default width goes from 320px to 280px, or 30% of a narrower window but never under 260px, so less of the window is grey. Longer titles cut off a little sooner. Dragging the edge still sets any width from 260 up, and a width you dragged stays yours.</div>
    <div class="rv-variants"><span>Variant</span>${Object.entries(SIDE).map(([k, v]) => vbtn('side', k, v)).join('')}</div>${widths}`
    html += pair(`Threads · ${w} × ${h}`, win(w, h, { box: 'before', side: 'keep' }, 'threads'), win(w, h, { box: 'before', side: st.side }, 'threads'), SIDE[st.side], w, h)
  } else {
    html = `<div class="rv-intro"><b>All together</b>, with your current picks: containers <b>${st.box}</b>, controls <b>${st.pill} · ${PILL[st.pill]}</b>, provider cards <b>${st.prov}</b>, Usage scaling, sidebar <b>${SIDE[st.side].toLowerCase()}</b>. Change a pick on its own tab and come back.</div>${widths}`
    const all = { box: st.box, side: st.side, pill: st.pill, prov: st.prov, usage: 'after' }
    const none = { box: 'before', side: 'keep', pill: 'before', prov: 'before', usage: 'before' }
    html += pair(`Usage · ${w} × ${h}`, win(w, h, none, 'usage'), win(w, h, all, 'usage'), 'every pick', w, h)
    html += pair(`Settings · Providers · ${w} × ${h}`, win(w, h, none, 'providers'), win(w, h, all, 'providers'), 'every pick', w, h)
    html += pair(`Threads · ${w} × ${h}`, win(w, h, none, 'threads'), win(w, h, all, 'threads'), 'every pick', w, h)
  }
  document.getElementById('body').innerHTML = html
  fit()
  // The before index scrolls its selected card into view, as the app does, which is what clips the first card.
  document.querySelectorAll('.win[data-usage=before] .u-index, .win:not([data-usage]) .u-index').forEach(el => { if (el.scrollWidth > el.clientWidth) el.scrollLeft = el.querySelector('.u-item.on').offsetLeft - 120 })
  const label = st.s === 1 ? `${st.box} · ${BOX[st.box]}` : st.s === 2 ? `${st.pill} · ${PILL[st.pill]}` : st.s === 3 ? `${st.prov} · ${PROV[st.prov]}` : st.s === 5 ? SIDE[st.side] : `${st.w} wide`
  document.getElementById('swLabel').textContent = `${TABS[st.s - 1]} — ${label}`
  document.getElementById('swState').textContent = `picks: containers ${st.box} · controls ${st.pill} · providers ${st.prov} · sidebar ${st.side} · ${st.mode}`
  const u = new URLSearchParams({ s: st.s, box: st.box, pill: st.pill, prov: st.prov, side: st.side, mode: st.mode, w: st.w, ah: st.ah })
  history.replaceState(null, '', '?' + u)
}
function fit() {
  document.querySelectorAll('.frame').forEach(f => {
    const w = +f.dataset.w, h = +f.dataset.h, s = f.clientWidth / w
    f.style.height = Math.round(h * s) + 'px'
    f.firstElementChild.style.transform = `scale(${s})`
  })
}
function cycle(d) {
  const lists = { 1: ['box', ['A', 'B', 'C']], 2: ['pill', ['R', 'N1', 'N2', 'N3']], 3: ['prov', ['P1', 'P2']], 5: ['side', ['keep', 'tune']] }
  const [key, vals] = lists[st.s] || ['w', [1600, 1280, 820]]
  const i = vals.indexOf(st[key]); st[key] = vals[(i + d + vals.length) % vals.length]; render()
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-set]')
  if (b) { const k = b.dataset.set; st[k] = ['s', 'w'].includes(k) ? +b.dataset.val : b.dataset.val; render(); return }
  const f = e.target.closest('.frame')
  if (f) {
    const z = document.getElementById('zoom'), w = +f.dataset.w, s = Math.min(1, (innerWidth - 24) / w)
    z.innerHTML = f.innerHTML; const win = z.firstElementChild; win.style.transform = `scale(${s})`; win.style.position = 'relative'
    z.style.height = ''; z.classList.add('on'); z.firstElementChild.style.marginBottom = `${-(1 - s) * +f.dataset.h}px`
  }
})
const closeZoom = () => document.getElementById('zoom').classList.remove('on')
document.getElementById('zoomClose').onclick = closeZoom
document.getElementById('zoom').addEventListener('click', e => { if (e.target.id === 'zoom') closeZoom() })
document.getElementById('prev').onclick = () => cycle(-1)
document.getElementById('next').onclick = () => cycle(1)
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') return closeZoom()
  if (e.target.closest('input,textarea,[contenteditable]')) return
  if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1)
})
addEventListener('resize', fit)
render()
</script>
</body>
