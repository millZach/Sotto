<!doctype html>
<!--
  VERDICT (October 9, 2026): the owner picked A, "Trimmed card"; the microphone check that passes once Sotto hears a
  voice ("Mic: hears you"); and connecting every installed agent wherever Connect providers runs, setup and the Threads
  page alike. Built in Onboarding.tsx, AgentsStep.tsx, PhoneStep.tsx and their stylesheets, with the coordinator's
  selectInstalledProviders (ADR-0063 and ADR-0036, amended that day). Changes from the drawing: buttons keep setup's
  44px target, so the agent rows and the look's mode switch are a little taller than drawn; a test that has heard
  nothing for six seconds says so; and a client the user turned off reads Turned off, with Connect. B and C are kept
  here as the record of what was weighed.

  PROTOTYPE — throwaway. Question: how should first-run setup fit Sotto's default 1080x720 window with no scroll, how
  should a microphone test that worked look, and how does the coding agents step read once it connects every client
  it finds installed? Raised by the owner on October 9, 2026, from the 0.1.35 test build: Microphone, Shortcut, Coding
  agents and iPhone all scroll at 1080x720; "Microphone ready" gave no sign that the test worked; only Codex connected
  by itself. The first prototype was drawn at 1280x800, which is why it never showed the scroll.
  Layout via ?variant=A|B|C. Microphone check via ?mic=heard|banner. Window ?size=default (1080x720) | min (820x560) |
  large (1280x800) | max (1600x1000). ?agents=all|mixed. ?theme=light. ?step=<id>.
  The bar's "Check every step" walks all nine steps at the current size and says which ones scroll and by how much.
  The microphone test uses this browser's real microphone when it is allowed and a simulated voice otherwise.
  No IPC, no network beyond the page, no persistence.
  Run: from the repository root, serve the folder (any static server) and open
  /docs/prototypes/first-run-setup-fit-prototype.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sotto setup that fits — prototype</title>

<style>
@font-face{font-family:Figtree;src:url('../../src/shared/fonts/figtree-latin.woff2') format('woff2');font-weight:300 900}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#161618;color:#e8e8ea;font:14px/1.5 Figtree,system-ui,sans-serif;overflow:hidden}
#scaler{position:absolute;left:50%;top:calc(50% - 34px);transform-origin:center center}

/* ---------- window and theme roles ---------- */
.win{
  --tt-canvas:var(--b-canvas);--tt-surface:var(--b-surface);--tt-raised:var(--b-raised);
  --tt-sunken:color-mix(in oklab,var(--b-canvas) 55%,var(--b-surface));
  --tt-text:var(--b-text);--tt-muted:color-mix(in oklab,var(--b-muted) 88%,var(--b-text));
  --tt-hairline:var(--b-border);--tt-border:color-mix(in oklab,var(--b-border) 55%,var(--b-muted));
  --tt-accent:var(--b-accent);--tt-on-accent:var(--b-on-accent);
  --tt-accent-text:color-mix(in oklab,var(--b-accent) 82%,var(--b-text));
  --tt-primary:var(--b-text);--tt-on-primary:var(--b-canvas);
  position:relative;display:grid;grid-template-rows:60px minmax(0,1fr);overflow:hidden;border-radius:10px;
  border:1px solid var(--win-edge);background:var(--tt-canvas);color:var(--tt-text);
  font:14px/1.5 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased;box-shadow:0 30px 60px -30px #0009
}
.win[data-appearance=dark]{--tt-success:oklch(0.79 0.13 165);--tt-warning:oklch(0.829 0.171 81);--tt-error:oklch(0.702 0.189 22.2);--win-edge:#2a2a30;--tt-shadow:0 24px 60px rgb(0 0 0 / 55%)}
.win[data-appearance=light]{--tt-success:oklch(0.5 0.11 158);--tt-warning:oklch(0.547 0.156 45.4);--tt-error:oklch(0.509 0.209 28.5);--win-edge:#c9c9cf;--tt-shadow:0 24px 60px rgb(20 24 22 / 16%)}
.win[data-size=default]{width:1080px;height:720px}
.win[data-size=min]{width:820px;height:560px}
.win[data-size=large]{width:1280px;height:800px}
.win[data-size=max]{width:1600px;height:1000px}
.win button,.win select,.win input,.win textarea{font:inherit;color:inherit}
.win :focus-visible{outline:3px solid var(--tt-accent);outline-offset:2px}
.win h1:focus{outline:none}

.strip{display:grid;grid-template-columns:1fr auto;align-items:center;padding:0 6px 0 18px}
.mark{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px}
.winctl{display:flex;color:var(--tt-muted)}
.winctl span{width:46px;height:32px;display:grid;place-items:center}
.room{position:relative;min-height:0;overflow:hidden;background:radial-gradient(circle at 50% 118%,color-mix(in srgb,var(--tt-accent) 12%,transparent),transparent 46%),var(--tt-canvas)}

/* ---------- shared controls (the app's Button, Field, Select) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:1px solid transparent;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;background:none}
.btn.primary{background:var(--tt-primary);color:var(--tt-on-primary)}
.btn.secondary{background:transparent;border-color:var(--tt-border)}
.btn.secondary:hover{background:var(--tt-raised)}
.btn.ghost{color:var(--tt-muted)}
.btn.ghost:hover{background:var(--tt-raised);color:var(--tt-text)}
.btn.sm{height:34px;padding:0 14px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.eyebrow{margin:0 0 8px;color:var(--tt-muted);font-size:12px;font-weight:500;letter-spacing:.02em;text-transform:uppercase}
h1{margin:0;font-weight:500;letter-spacing:-.6px;line-height:1.14}
.lead{margin:0;color:var(--tt-muted)}
.aside{margin:0;color:var(--tt-muted);font-size:13px}
.label{display:block;margin-bottom:6px;font-size:13px;font-weight:600}
.select,.input{width:100%;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--tt-border);background:var(--tt-canvas);font-size:13.5px}
textarea.input{height:auto;padding:10px 12px;resize:none}
.boxed{border:1px solid var(--tt-hairline);border-radius:12px;background:var(--tt-sunken)}
.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stack{display:grid;gap:var(--gap,14px);align-content:start}

/* ---------- the task blocks every layout shares ---------- */
.assure{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.assure li{display:flex;gap:9px;align-items:flex-start;color:var(--tt-muted);font-size:13px;line-height:1.4}
.assure svg{color:var(--tt-activity,var(--tt-accent));flex:none;margin-top:1px}

.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--tt-sunken);border:1px solid var(--tt-hairline);gap:2px;justify-self:start}
.seg button{border:0;background:transparent;height:30px;padding:0 14px;border-radius:7px;cursor:pointer;color:var(--tt-muted);font-weight:600;font-size:13px}
.seg button[aria-checked=true]{background:var(--tt-surface);color:var(--tt-text);box-shadow:0 1px 2px #0003}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.theme{display:grid;gap:6px;padding:6px;border-radius:12px;border:1px solid var(--tt-hairline);background:transparent;cursor:pointer;text-align:left}
.theme[aria-checked=true]{border-color:var(--tt-accent);box-shadow:0 0 0 1px var(--tt-accent)}
.tprev{position:relative;height:var(--prev,52px);border-radius:8px;border:1px solid;overflow:hidden;display:block}
.tprev .s{position:absolute;inset:0 auto 0 0;width:28%}
.tprev .o{position:absolute;left:6px;top:6px;line-height:0}
.tprev .l{position:absolute;left:36%;top:14px;width:44%;height:5px;border-radius:3px;opacity:.85}
.tprev .l.short{top:25px;width:30%;opacity:.55}
.tprev .b{position:absolute;right:8px;bottom:7px;width:34px;height:11px;border-radius:4px}
.theme span.n{font-size:12.5px;font-weight:600;padding:0 2px}

.mic{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:14px 16px}
.wave{display:flex;align-items:center;gap:3px;height:32px;flex:none}
.wave i{width:4px;border-radius:9px;height:calc(6px + var(--h,0) * 26px);background:color-mix(in srgb,var(--tt-muted) 40%,transparent);transition:height 70ms linear}
.mic[data-live=true] .wave i{background:color-mix(in srgb,var(--tt-activity,var(--tt-accent)) 85%,transparent)}
.mic p{flex:1 1 200px;margin:0;font-size:13px;line-height:1.45;color:var(--tt-muted)}
.mic p strong{display:block;color:var(--tt-text);font-weight:600;font-size:13.5px}
.mic .btn{margin-left:auto}
/* mic=heard: the box turns to success once Sotto hears speech */
.mic[data-heard=true]{border-color:color-mix(in srgb,var(--tt-success) 55%,var(--tt-hairline));background:color-mix(in srgb,var(--tt-success) 8%,var(--tt-sunken))}
.mic .ok{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;flex:none;background:color-mix(in srgb,var(--tt-success) 18%,transparent);color:var(--tt-success)}
.meter{position:relative;flex:1 1 160px;height:8px;border-radius:9px;background:color-mix(in srgb,var(--tt-muted) 22%,transparent);overflow:visible}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:9px;background:var(--tt-activity,var(--tt-accent));transition:width 70ms linear}
.meter b{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--tt-text);opacity:.55}
/* mic=banner: access confirmed is the success, said loudly */
.okbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:1px solid color-mix(in srgb,var(--tt-success) 50%,var(--tt-hairline));background:color-mix(in srgb,var(--tt-success) 9%,transparent);font-size:13px}
.okbar svg{color:var(--tt-success);flex:none}
.okbar strong{font-weight:600}
.okbar span{color:var(--tt-muted)}

.shortcut{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 16px;color:var(--tt-muted);font-size:13px}
.keys{display:flex;gap:6px}
kbd{font:600 12px Figtree,system-ui,sans-serif;padding:3px 9px;border-radius:7px;border:1px solid var(--tt-border);background:var(--tt-raised);color:var(--tt-text)}

.agents{list-style:none;margin:0;padding:0;overflow:hidden}
.agent{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;align-items:center;gap:6px 12px;padding:var(--rowpad,8px) 14px;border-top:1px solid var(--tt-hairline)}
.agent:first-child{border-top:0}
.pm{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--tt-surface)}
.an{display:grid;line-height:1.3;min-width:0}
.an strong{font-weight:600;font-size:13.5px}
.an span{color:var(--tt-muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:var(--tt-surface);color:var(--tt-muted);font-size:12px;font-weight:600;white-space:nowrap}
.state[data-k=ready]{background:color-mix(in srgb,var(--tt-success) 12%,transparent);color:var(--tt-text)}
.state[data-k=ready] svg{color:var(--tt-success)}
.state[data-k=warn]{background:color-mix(in srgb,var(--tt-warning) 12%,transparent);color:var(--tt-text)}
.state[data-k=warn] svg{color:var(--tt-warning)}
.agents-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--tt-muted)}

.addproj{display:flex;align-items:center;gap:14px;padding:16px;border:1.5px dashed var(--tt-border);border-radius:12px;background:var(--tt-sunken);width:100%;cursor:pointer;text-align:left}
.addproj svg{color:var(--tt-accent-text);flex:none}
.addproj span{display:grid}
.addproj span span{color:var(--tt-muted);font-size:12.5px}
.rowitem{display:flex;align-items:center;gap:12px;padding:11px 14px}
.rowitem svg{color:var(--tt-accent-text);flex:none}
.rowitem > span{display:grid;line-height:1.35;min-width:0}
.rowitem > span span{color:var(--tt-muted);font-size:12.5px}

.phone{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.phone li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px}
.num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--tt-surface);font-weight:700;font-size:12.5px}
.phone li > div{display:grid;gap:2px;min-width:0}
.phone li > div > span{color:var(--tt-muted);font-size:12.5px;line-height:1.4}
.toggle{display:inline-flex;align-items:center;gap:10px;border:0;background:none;padding:0;cursor:pointer;font-weight:600;font-size:13.5px}
.switch{width:38px;height:22px;border-radius:999px;border:1px solid var(--tt-border);background:var(--tt-raised);position:relative;flex:none}
.switch i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--tt-muted);transition:transform .15s}
.toggle[aria-checked=true] .switch{background:var(--tt-accent);border-color:var(--tt-accent)}
.toggle[aria-checked=true] .switch i{transform:translateX(16px);background:var(--tt-on-accent)}
.phone .code{display:flex;align-items:center;gap:14px;grid-column:2/-1;padding:8px 12px;border-radius:10px;background:var(--tt-canvas);border:1px solid var(--tt-hairline);font-size:12.5px;color:var(--tt-muted)}
.code b{font-size:19px;letter-spacing:.14em;font-weight:500;color:var(--tt-text);font-variant-numeric:tabular-nums;white-space:nowrap}
.code span{flex:1;line-height:1.4}

/* ---------- A: trimmed card, progress above ---------- */
.A{height:100%;display:flex;flex-direction:column;align-items:center;padding:20px 24px 22px}
.A .prog{width:min(680px,100%);flex:none;margin-bottom:12px}
.ptext{display:block;margin-bottom:8px;color:var(--tt-muted);font-size:11.5px;font-weight:600;letter-spacing:.04em;text-align:center;text-transform:uppercase}
.groups{display:flex;gap:10px;margin:0;padding:0;list-style:none}
.groups li{display:grid;gap:5px;min-width:0}
.bars{display:flex;gap:3px}
.bars i{flex:1;height:2px;border-radius:9px;background:color-mix(in srgb,var(--tt-border) 45%,transparent)}
.bars i[data-done=true]{background:color-mix(in srgb,var(--tt-activity,var(--tt-accent)) 55%,transparent)}
.bars i[data-cur=true]{background:var(--tt-activity,var(--tt-accent))}
.gname{font-size:11.5px;color:var(--tt-muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.groups li[data-cur=true] .gname{color:var(--tt-text);font-weight:600}
.card{background:var(--tt-surface);border:1px solid var(--tt-hairline);border-radius:16px;box-shadow:var(--tt-shadow);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.A .card{width:min(680px,100%);flex:0 1 600px}
.body{flex:1 1 auto;min-height:0;overflow-y:auto}
.A .body{padding:26px 36px 18px;--gap:14px}
.A h1{font-size:28px}
.A .lead{margin-top:-4px;font-size:14px}
.foot{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--tt-hairline)}
.A .foot{padding:12px 36px 14px}
.win[data-size=min] .A{padding:12px 16px 14px}
.win[data-size=min] .A .prog{margin-bottom:8px}
.win[data-size=min] .A .body{padding:18px 26px 14px;--gap:12px;--prev:40px;--rowpad:6px}
.win[data-size=min] .A h1{font-size:23px}
.win[data-size=min] .A .lead{font-size:13.5px}
.win[data-size=min] .A .foot{padding:10px 26px 12px}

/* ---------- B: the progress moves into the card, which fills the room ---------- */
.B{height:100%;display:flex;justify-content:center;padding:16px 24px 18px}
.B .card{width:min(720px,100%);height:100%}
.B .chead{flex:none;display:grid;gap:8px;padding:14px 36px 12px;border-bottom:1px solid var(--tt-hairline)}
.B .chead .groups{gap:8px}
.B .body{padding:24px 36px 18px;--gap:14px}
.B .title{display:flex;align-items:center;gap:12px}
.B .ico{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px;border:1px solid color-mix(in srgb,var(--tt-accent) 40%,transparent);background:color-mix(in srgb,var(--tt-accent) 10%,transparent);color:var(--tt-accent-text)}
.B h1{font-size:27px}
.B .lead{font-size:14px;margin-top:-4px}
.B .foot{padding:12px 36px 14px}
.B .foot .count{color:var(--tt-muted);font-size:12.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.win[data-size=min] .B{padding:10px 16px 12px}
.win[data-size=min] .B .chead{padding:10px 26px 9px}
.win[data-size=min] .B .body{padding:16px 26px 12px;--gap:12px;--prev:40px;--rowpad:6px}
.win[data-size=min] .B h1{font-size:23px}
.win[data-size=min] .B .ico{display:none}
.win[data-size=min] .B .lead{font-size:13.5px}
.win[data-size=min] .B .foot{padding:10px 26px 12px}

/* ---------- C: two columns, the words on the left and the task on the right ---------- */
.C{height:100%;display:flex;flex-direction:column;align-items:center;padding:20px 24px 22px}
.C .prog{width:min(900px,100%);flex:none;margin-bottom:12px}
.C .card{width:min(900px,100%);flex:0 1 560px}
.C .body{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:36px;padding:30px 36px 20px;align-items:start}
.C .words{display:grid;gap:12px;align-content:start}
.C .body > .task{align-self:start}
.C .ico{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;border:1px solid color-mix(in srgb,var(--tt-accent) 40%,transparent);background:color-mix(in srgb,var(--tt-accent) 10%,transparent);color:var(--tt-accent-text);margin-bottom:6px}
.C h1{font-size:26px}
.C .lead{font-size:14px}
.C .task{--gap:12px}
.C .foot{padding:12px 36px 14px}
.C .welcome{grid-column:1/-1}
.win[data-size=min] .C{padding:12px 16px 14px}
.win[data-size=min] .C .body{gap:24px;padding:20px 24px 14px;--prev:40px;--rowpad:6px}
.win[data-size=min] .C h1{font-size:22px}
.win[data-size=min] .C .lead{font-size:13px}
.win[data-size=min] .C .ico{display:none}
.win[data-size=min] .C .foot{padding:10px 24px 12px}
.win[data-size=min] .C .themes{grid-template-columns:repeat(2,1fr)}

/* ---------- prototype controls (not part of the design) ---------- */
.proto-bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;background:#000;color:#fff;border-radius:999px;padding:6px;box-shadow:0 10px 30px #0006;z-index:1000;font:600 13px/1 system-ui,sans-serif;outline:2px solid #ffffff2a;white-space:nowrap}
.proto-bar button,.proto-bar select{background:none;border:0;color:#fff;min-width:34px;height:34px;border-radius:17px;cursor:pointer;font:inherit;padding:0 10px}
.proto-bar select option{color:#000}
.proto-bar button:hover,.proto-bar select:hover{background:#ffffff1a}
.proto-bar .lab{min-width:190px;text-align:center}
.proto-bar .sep{width:1px;height:22px;background:#ffffff33;margin:0 4px}
.fit{padding:0 10px;border-radius:12px;height:26px;display:inline-flex;align-items:center}
.fit[data-ok=true]{background:#14532d;color:#bbf7d0}
.fit[data-ok=false]{background:#7f1d1d;color:#fecaca}
.report{position:fixed;right:14px;top:14px;max-width:340px;background:#000;color:#fff;border-radius:12px;padding:12px 14px;font:12.5px/1.5 system-ui,sans-serif;z-index:1000;box-shadow:0 10px 30px #0006;display:none}
.report[data-open=true]{display:block}
.report b{display:block;margin-bottom:4px}
.report .bad{color:#fca5a5}.report .good{color:#86efac}
</style>
</head>
<body>
<div id="scaler"><div class="win" id="win"></div></div>
<div class="report" id="report"></div>
<nav class="proto-bar" aria-label="Prototype controls">
  <button id="prev" aria-label="Previous layout">&larr;</button>
  <span class="lab" id="lab"></span>
  <button id="next" aria-label="Next layout">&rarr;</button>
  <span class="sep"></span>
  <select id="micSel" aria-label="Microphone check"><option value="heard">Mic: hears you</option><option value="banner">Mic: access banner</option></select>
  <select id="sizeSel" aria-label="Window size"><option value="default">1080×720 (default)</option><option value="min">820×560 (minimum)</option><option value="large">1280×800</option><option value="max">1600×1000</option></select>
  <select id="agentsSel" aria-label="Agents on this computer"><option value="all">Agents: all four installed</option><option value="mixed">Agents: some missing</option></select>
  <button id="themeBtn"></button>
  <span class="sep"></span>
  <select id="stepSel" aria-label="Jump to step"></select>
  <span class="fit" id="fit"></span>
  <button id="checkAll">Check every step</button>
</nav>
<script>
const OWL = {
  head: 'M152 282C136 250 132 190 160 150C165 140 176 130 181 150C183 180 205 212 250 212C320 186 480 170 582 228C610 226 636 205 638 172C640 163 648 163 652 178C670 200 678 262 656 310C672 330 684 380 684 460C686 552 669 598 620 630C575 665 480 667 400 667C319 667 224 665 179 630C130 598 113 552 115 460C114 370 124 320 152 282Z',
  eyes: 'M173 435C172 365 188 329 240 329C302 327 354 334 353 420C353 490 330 522 265 522C200 523 172 495 173 435Z M449 445C449 405 460 388 490 380L588 360C614 355 626 380 626 430C627 500 610 523 535 523C480 523 449 500 449 445Z',
  beak: 'M380 499C392 496 408 496 420 499C430 501 431 509 426 515L405 547C402 552 398 552 395 547L374 515C369 509 370 501 380 499Z',

/* ---------- the microphone: this browser's real one when allowed, a simulated voice otherwise ---------- */
let audio = null, frame = 0, simT = 0, loudMs = 0, lastT = 0
async function startMic() {
  stopMic(); S.mic = 'requesting'; S.heard = false; loudMs = 0; render()
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true })
    const ctx = new AudioContext(); const src = ctx.createMediaStreamSource(stream); const an = ctx.createAnalyser(); an.fftSize = 512; src.connect(an)
    audio = { stream, ctx, an, buf: new Float32Array(512) }; S.simulated = false
  } catch { audio = null; S.simulated = true; simT = performance.now() }
  S.mic = 'ready'; S.running = true; lastT = performance.now(); render()
}
function stopMic() { cancelAnimationFrame(frame); S.running = false; if (audio) { audio.stream.getTracks().forEach(t => t.stop()); audio.ctx.close() } audio = null }
function tick() {
  frame = requestAnimationFrame(tick)
  const now = performance.now(), dt = now - lastT; lastT = now
  let level
  if (audio) { audio.an.getFloatTimeDomainData(audio.buf); let s = 0; for (const v of audio.buf) s += v * v; level = Math.min(1, Math.sqrt(s / audio.buf.length) * 3) }
  else { const t = (now - simT) / 1000; level = t < 1.4 ? 0.02 + Math.random() * 0.03 : Math.max(0, 0.35 + 0.3 * Math.sin(t * 9) * Math.sin(t * 2.3) + Math.random() * 0.15) }
  S.level = level
  if (MIC === 'heard' && !S.heard) { loudMs = level > 0.16 ? loudMs + dt : Math.max(0, loudMs - dt / 3); if (loudMs > 350) { S.heard = true; stopMic(); render(); return } }
  const box = document.querySelector('.mic'); if (!box) return
  box.querySelectorAll('.wave i').forEach((bar, at) => bar.style.setProperty('--h', Math.min(1, level * (0.55 + 0.45 * Math.abs(Math.sin(at * 1.7 + now / 140))))))
  const fill = box.querySelector('.meter i'); if (fill) fill.style.width = `${Math.round(Math.min(1, level) * 100)}%`
}

    : last ? `<button class="btn primary" data-act="finish">Finish setup</button>`
    : `<button class="btn ${done ? 'primary' : 'secondary'}" data-act="next">${done ? 'Continue' : 'Skip for now'}</button>`
  return `<footer class="foot">${index > 0 ? '<button class="btn ghost" data-act="back">Back</button>' : '<span></span>'}${countText ?? ''}${fwd}</footer>`
}
function layoutA() {
  const step = STEPS[index], [eyebrow, title, lead] = COPY[step.id]
  const head = step.id === 'welcome' ? `${welcome()}<p class="eyebrow" style="margin:0">${eyebrow}</p><h1 tabindex="-1">${title}</h1><p class="lead">${lead}</p>` : `<h1 tabindex="-1">${title}</h1><p class="lead">${lead}</p>`
  return `<div class="A"><nav class="prog"><span class="ptext">Step ${index + 1} of ${STEPS.length} · ${step.title}</span>${groupsBar()}</nav>
    <section class="card"><div class="body stack">${head}${TASK[step.id]()}</div>${footer()}</section></div>`
}
function layoutB() {
  const step = STEPS[index], [eyebrow, title, lead] = COPY[step.id]
  const head = step.id === 'welcome' ? `${welcome()}<h1 tabindex="-1">${title}</h1><p class="lead">${lead}</p>` : `<div class="title"><span class="ico">${icon(step.icon, 19)}</span><h1 tabindex="-1">${title}</h1></div><p class="lead">${lead}</p>`
  return `<div class="B"><section class="card"><header class="chead">${groupsBar()}</header><div class="body stack">${head}${TASK[step.id]()}</div>${footer(`<span class="count">Step ${index + 1} of ${STEPS.length}</span>`)}</section></div>`
}
function layoutC() {
  const step = STEPS[index], [eyebrow, title, lead] = COPY[step.id]
  const words = `<div class="words">${step.id === 'welcome' ? welcome() : `<span class="ico">${icon(step.icon, 20)}</span>`}<p class="eyebrow" style="margin:0">${eyebrow}</p><h1 tabindex="-1">${title}</h1><p class="lead">${lead}</p></div>`
  return `<div class="C"><nav class="prog"><span class="ptext">Step ${index + 1} of ${STEPS.length} · ${step.title}</span>${groupsBar()}</nav>
    <section class="card"><div class="body">${words}<div class="task stack">${TASK[step.id]()}</div></div>${footer()}</section></div>`
}

/* ---------- render ---------- */
const win = document.getElementById('win')
function applyTheme() {
  const t = THEMES.find(x => x.id === S.theme), p = t[S.appearance]
  for (const [k, v] of Object.entries(p)) win.style.setProperty(`--b-${k.replace(/[A-Z]/g, m => '-' + m.toLowerCase())}`, v)
  win.dataset.appearance = S.appearance
}
function render(focus = false) {
  S.appearance = S.appearance ?? APPEAR
  applyTheme(); win.dataset.size = SIZE
  const b = brandFor(THEMES.find(t => t.id === S.theme), S.appearance)
  const room = { A: layoutA, B: layoutB, C: layoutC }[VAR]()
  win.innerHTML = `<div class="strip"><span class="mark">${owl(b.tile, b.glyph, 22)}Sotto</span><span class="winctl"><span>${icon('min', 16)}</span><span>${icon('max', 14)}</span><span>${icon('close', 16)}</span></span></div><div class="room">${room}</div>`
  if (focus) win.querySelector('h1')?.focus()
  cancelAnimationFrame(frame)
  if (S.running && STEPS[index].id === 'microphone') tick()
  showFit(); syncBar(); fitScale()
}
function overflow() { const body = win.querySelector('.body'); return body ? body.scrollHeight - body.clientHeight : 0 }
function showFit() { const o = overflow(), el = document.getElementById('fit'); el.dataset.ok = o <= 0; el.textContent = o <= 0 ? 'Fits ✓' : `Scrolls ${o}px` }
function fitScale() {
  const w = win.offsetWidth, h = win.offsetHeight
  const s = Math.min(1, (innerWidth - 40) / w, (innerHeight - 110) / h)
  document.getElementById('scaler').style.transform = `translate(-50%, -50%) scale(${s})`
}
function go(to) {
  cancelAnimationFrame(frame)
  if (STEPS[index].id === 'microphone' && STEPS[to]?.id !== 'microphone') stopMic()
  index = Math.max(0, Math.min(STEPS.length - 1, to))
  if (STEPS[index].id === 'agents' && !S.agents) checkAgents()
  render(true)
}
win.addEventListener('click', event => {
  const el = event.target.closest('[data-act]'); if (!el) return
  const act = el.dataset.act, v = el.dataset.v
  if (act === 'next') go(index + 1)
  else if (act === 'back') go(index - 1)
  else if (act === 'finish') alert('Setup saved. The Threads tour opens next.')
  else if (act === 'appear') { S.appearance = v; render() }
  else if (act === 'theme') { S.theme = v; render() }
  else if (act === 'mic') startMic()
  else if (act === 'micstop') { stopMic(); S.mic = 'idle'; render() }
  else if (act === 'agents') checkAgents()
  else if (act === 'project') { S.project = true; render() }
  else if (act === 'phoneOn') { S.phoneOn = !S.phoneOn; if (!S.phoneOn) S.code = null; render() }
  else if (act === 'code') { S.code = !S.code; render() }
  else if (act === 'beta') { S.beta = true; render() }
})
win.addEventListener('input', event => { if (event.target.dataset.act === 'key') { S.key = event.target.value; const pos = event.target.selectionStart; render(); const k = win.querySelector('#key'); k.focus(); k.setSelectionRange(pos, pos) } })

/* ---------- prototype bar ---------- */
const stepSel = document.getElementById('stepSel')
stepSel.innerHTML = STEPS.map((s, at) => `<option value="${at}">${at + 1}. ${s.title}</option>`).join('')
function syncBar() {
  document.getElementById('lab').textContent = `${VAR} — ${VARIANTS[VAR]}`
  document.getElementById('micSel').value = MIC
  document.getElementById('sizeSel').value = SIZE
  document.getElementById('agentsSel').value = AGENTS
  document.getElementById('themeBtn').textContent = S.appearance === 'dark' ? 'Dark' : 'Light'
  stepSel.value = index
  const q = new URLSearchParams({ variant: VAR, mic: MIC, size: SIZE, agents: AGENTS, theme: S.appearance, step: STEPS[index].id })
  history.replaceState(null, '', `?${q}`)
}
const cycle = d => { VAR = KEYS[(KEYS.indexOf(VAR) + d + KEYS.length) % KEYS.length]; render() }
document.getElementById('prev').onclick = () => cycle(-1)
document.getElementById('next').onclick = () => cycle(1)
document.getElementById('micSel').onchange = e => { MIC = e.target.value; S.heard = false; render() }
document.getElementById('sizeSel').onchange = e => { SIZE = e.target.value; render() }
document.getElementById('agentsSel').onchange = e => { AGENTS = e.target.value; S.agents = null; if (index === 5) checkAgents(); else render() }
document.getElementById('themeBtn').onclick = () => { S.appearance = S.appearance === 'dark' ? 'light' : 'dark'; render() }
stepSel.onchange = e => go(Number(e.target.value))
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select,[contenteditable]')) return
  if (e.key === 'ArrowLeft') cycle(-1)
  if (e.key === 'ArrowRight') cycle(1)
})
addEventListener('resize', fitScale)

/* Walks every step in its busiest state at this size and layout, and lists the ones that scroll. */
document.getElementById('checkAll').onclick = () => {
  const saved = { index, S: structuredClone(S) }
  cancelAnimationFrame(frame); agentTimers.forEach(clearTimeout)
  Object.assign(S, { mic: 'ready', running: false, heard: true, agents: AGENT_LIST.map(([id]) => ({ id, k: AGENTS === 'mixed' && id === 'grok' ? 'missing' : AGENTS === 'mixed' && id === 'devin' ? 'warn' : 'ready' })), project: true, phoneOn: true, code: true, beta: true })
  const lines = []
  for (const mic of MIC === 'banner' ? ['banner'] : ['heard']) {
    for (let at = 0; at < STEPS.length; at++) { index = at; render(); const o = overflow(); lines.push(`<div class="${o > 0 ? 'bad' : 'good'}">${at + 1}. ${STEPS[at].title}: ${o > 0 ? `scrolls ${o}px` : 'fits'}</div>`) }
  }
  index = saved.index; Object.assign(S, saved.S); render()
  const r = document.getElementById('report'); r.dataset.open = 'true'
  r.innerHTML = `<b>${VAR} — ${VARIANTS[VAR]} at ${document.getElementById('sizeSel').selectedOptions[0].text}, each step at its tallest</b>${lines.join('')}<div style="margin-top:6px;opacity:.7">Click to close</div>`
  r.onclick = () => { r.dataset.open = 'false' }
}

S.appearance = APPEAR
document.fonts.ready.then(() => { if (STEPS[index].id === 'agents') checkAgents(); render() })
render()
</script>
</body>
</html>
