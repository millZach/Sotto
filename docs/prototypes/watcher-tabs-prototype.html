<!doctype html>
<!--
  Throwaway prototype. Not product code.
  Question: Watcher's Conversation | Watched | Visualize tabs stick out in the header. Which of ten quieter looks should replace the raised segmented track?
  Picked: 5, icons only (Drake, October 24, 2026): chat, eye and constellation with the count as a badge; the shown tab takes the All threads hover fill.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watcher tabs: ten ways</title>
<style>
  :root {
    --canvas: #121211; --raised: #1d1d1d; --sunken: #1a1a19; --hover: #232323; --hairline: #504f4c; --hair-soft: #2c2c2a;
    --text: #faf7ec; --text-2: #d0cdc0; --muted: #919088; --accent: #f2d024; --accent-ink: #121211;
    --night: radial-gradient(130px 70px at 26px 22px, rgba(242,208,36,.14), transparent 72%), linear-gradient(#17171a, #121211);
  }
  :root[data-mode='light'] {
    --canvas: #fbfaf5; --raised: #ffffff; --sunken: #f0eee6; --hover: #ecebe4; --hairline: #c9c6ba; --hair-soft: #e3e1d8;
    --text: #1b1a16; --text-2: #4a4840; --muted: #6d6a60; --accent: #8a6d00; --accent-ink: #fbfaf5;
    --night: radial-gradient(130px 70px at 26px 22px, rgba(180,150,0,.14), transparent 72%), linear-gradient(#f3f2ec, #fbfaf5);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--canvas); color: var(--text); font: 13px/1.4 Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  header.page { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: var(--canvas); border-bottom: 1px solid var(--hair-soft); }
  header.page h1 { margin: 0; font-size: 15px; font-weight: 500; }
  header.page p { margin: 0; color: var(--muted); flex: 1; }
  .modebtn { height: 28px; padding: 0 10px; border: 1px solid var(--hairline); border-radius: 6px; background: transparent; color: var(--text-2); font: inherit; cursor: pointer; }
  main { display: grid; gap: 18px; padding: 20px 24px 60px; max-width: 980px; }
  .card { border: 1px solid var(--hair-soft); border-radius: 10px; overflow: hidden; }
  .card__label { display: flex; gap: 10px; align-items: baseline; padding: 10px 14px 0; }
  .card__label b { font-weight: 600; font-size: 13px; }
  .card__label span { color: var(--muted); font-size: 12px; }
  .card--now { border-color: var(--hairline); border-style: dashed; }

  /* The header strip, as in the app */
  .head { position: relative; display: flex; align-items: center; gap: 4px; height: 52px; padding: 0 14px; background: var(--night); }
  .head__tile { display: grid; place-items: center; width: 24px; height: 24px; margin-right: 6px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); font-size: 13px; }
  .head__name { font-size: 15px; font-weight: 500; letter-spacing: -.2px; margin-right: 4px; }
  .head__list { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px 0 9px; border: 1px solid transparent; border-radius: 8px; color: var(--text-2); }
  .head__list:hover { border-color: var(--hairline); background: var(--hover); color: var(--text); }
  .head__count, .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .head__spacer { flex: 1; }
  .head__stop { height: 28px; padding: 0 10px; border: 1px solid var(--hairline); border-radius: 7px; color: var(--text-2); display: inline-flex; align-items: center; }
  .body { height: 64px; padding: 14px 18px; color: var(--muted); border-top: 1px solid var(--hair-soft); font-size: 12px; }

  .tabs { display: inline-flex; align-items: center; }
  .tab { position: relative; display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--text-2); font: inherit; font-size: 13px; white-space: nowrap; cursor: pointer; padding: 0; }
  .tab:hover { color: var(--text); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .tab[aria-selected='true'] { color: var(--text); }
  .ic { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* 0. Today: raised segment in a sunken track */
  .v0 { gap: 2px; margin-left: 4px; padding: 3px; border-radius: 6px; background: var(--sunken); }
  .v0 .tab { height: 24px; padding: 0 10px; border-radius: 4px; }
  .v0 .tab[aria-selected='true'] { background: var(--hover); box-shadow: 0 1px 2px rgba(0,0,0,.4); }

  /* 1. Underline */
  .v1 { gap: 18px; margin-left: 10px; align-self: stretch; }
  .v1 .tab { height: 100%; }
  .v1 .tab::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; border-radius: 2px 2px 0 0; background: transparent; transition: background .15s; }
  .v1 .tab[aria-selected='true']::after { background: var(--accent); }

  /* 2. Words only: colour and weight carry it */
  .v2 { gap: 16px; margin-left: 10px; }
  .v2 .tab { height: 30px; color: var(--muted); }
  .v2 .tab:hover { color: var(--text-2); }
  .v2 .tab[aria-selected='true'] { color: var(--text); font-weight: 600; }

  /* 3. A sentence with middots */
  .v3 { margin-left: 10px; }
  .v3 .tab { height: 30px; padding: 0 2px; color: var(--muted); }
  .v3 .tab[aria-selected='true'] { color: var(--text); }
  .v3 .sep { color: var(--hairline); padding: 0 8px; user-select: none; }

  /* 4. Same chip as All threads: the shown one wears its hover look */
  .v4 { gap: 2px; }
  .v4 .tab { height: 30px; padding: 0 9px; border: 1px solid transparent; border-radius: 8px; }
  .v4 .tab:hover { background: var(--hover); }
  .v4 .tab[aria-selected='true'] { border-color: var(--hairline); background: var(--hover); }

  /* 5. Icons only, with names on hover */
  .v5 { gap: 2px; margin-left: 6px; }
  .v5 .tab { width: 30px; height: 30px; justify-content: center; border-radius: 8px; color: var(--muted); }
  .v5 .tab:hover { background: var(--hover); color: var(--text); }
  .v5 .tab[aria-selected='true'] { color: var(--text); background: var(--hover); }
  .v5 .ic { width: 16px; height: 16px; }
  .v5 .badge { position: absolute; top: 3px; right: 2px; min-width: 13px; height: 13px; padding: 0 3px; border-radius: 7px; background: var(--text-2); color: var(--canvas); font-size: 9px; font-weight: 600; line-height: 13px; text-align: center; }
  .v5 .tab[title]:hover::before { content: attr(title); position: absolute; top: 34px; left: 50%; transform: translateX(-50%); padding: 3px 7px; border: 1px solid var(--hairline); border-radius: 5px; background: var(--raised); color: var(--text); font-size: 11px; white-space: nowrap; z-index: 3; }

  /* 6. Accent ink on the shown word */
  .v6 { gap: 14px; margin-left: 10px; }
  .v6 .tab { height: 30px; color: var(--muted); }
  .v6 .tab:hover { color: var(--text); }
  .v6 .tab[aria-selected='true'] { color: var(--accent); }
  .v6 .tab[aria-selected='true'] .n { color: var(--accent); opacity: .7; }

  /* 7. One menu button, like All threads */
  .v7 { position: relative; }
  .v7 .tab.menu { height: 30px; padding: 0 8px 0 9px; border: 1px solid transparent; border-radius: 8px; color: var(--text-2); }
  .v7 .tab.menu:hover, .v7 .tab.menu[aria-expanded='true'] { border-color: var(--hairline); background: var(--hover); color: var(--text); }
  .v7 .pop { position: absolute; top: 36px; left: 0; z-index: 3; display: none; min-width: 170px; padding: 4px; border: 1px solid var(--hairline); border-radius: 8px; background: var(--raised); box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .v7 .pop.open { display: grid; }
  .v7 .pop button { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border: 0; border-radius: 5px; background: transparent; color: var(--text-2); font: inherit; text-align: left; cursor: pointer; }
  .v7 .pop button:hover { background: var(--hover); color: var(--text); }
  .v7 .pop button .chk { width: 12px; color: var(--accent); }
  .v7 .pop button .n { margin-left: auto; }

  /* 8. A small accent dot leads the shown word */
  .v8 { gap: 16px; margin-left: 10px; }
  .v8 .tab { height: 30px; padding-left: 10px; color: var(--muted); }
  .v8 .tab::before { content: ''; position: absolute; left: 0; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: var(--accent); opacity: 0; transform: scale(.4); transition: opacity .15s, transform .15s; }
  .v8 .tab[aria-selected='true'] { color: var(--text); }
  .v8 .tab[aria-selected='true']::before { opacity: 1; transform: none; }

  /* 9. Tab strip on the header's bottom edge, its own row */
  .head--two { height: auto; flex-wrap: wrap; padding-top: 11px; row-gap: 4px; }
  .head--two .row1 { display: flex; align-items: center; gap: 4px; width: 100%; height: 30px; }
  .v9 { gap: 20px; width: 100%; padding-left: 30px; height: 34px; align-items: stretch; }
  .v9 .tab { color: var(--muted); }
  .v9 .tab::after { content: ''; position: absolute; left: -2px; right: -2px; bottom: -1px; height: 2px; background: transparent; }
  .v9 .tab[aria-selected='true'] { color: var(--text); }
  .v9 .tab[aria-selected='true']::after { background: var(--text); }

  /* 10. Hairline split, no fill; shown word gets a soft hairline box */
  .v10 { margin-left: 8px; height: 26px; border: 1px solid var(--hair-soft); border-radius: 7px; }
  .v10 .tab { height: 100%; padding: 0 10px; color: var(--muted); }
  .v10 .tab + .tab { border-left: 1px solid var(--hair-soft); }
  .v10 .tab[aria-selected='true'] { color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
  .v10 .tab:first-child { border-radius: 6px 0 0 6px; }
  .v10 .tab:last-child { border-radius: 0 6px 6px 0; }
</style>
</head>
<body>
<header class="page">
  <h1>Watcher tabs: ten ways</h1>
  <p>Click or arrow through each set. Citrine colours. Hover the icons in 5.</p>
  <button class="modebtn" id="mode" type="button">Light</button>
</header>
<main id="list"></main>

<template id="icons">
  <svg class="ic" data-i="conversation" viewBox="0 0 16 16"><path d="M3 3.5h10a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H7l-3 2.5v-2.5H3a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1z"/></svg>
  <svg class="ic" data-i="watched" viewBox="0 0 16 16"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>
  <svg class="ic" data-i="visualize" viewBox="0 0 16 16"><circle cx="3" cy="11" r="1.3"/><circle cx="7" cy="4" r="1.3"/><circle cx="13" cy="6" r="1.3"/><circle cx="10" cy="12" r="1.3"/><path d="M4 10l2.4-5M8.2 4.4l3.6 1.2M12.4 7.2l-1.8 3.7M8.8 12l-4.5-.8"/></svg>
</template>

<script>
const TABS = [['conversation', 'Conversation'], ['watched', 'Watched'], ['visualize', 'Visualize']]
const COUNT = 2
const VARIANTS = [
  { k: 'v0', t: 'Today', d: 'Raised segment in a sunken track. For comparison.', now: true },
  { k: 'v1', t: '1. Underline', d: 'Bare words, a 2px accent rule on the header floor under the shown one.' },
  { k: 'v2', t: '2. Words only', d: 'No shape at all. Muted words; the shown one goes full text and semibold.' },
  { k: 'v3', t: '3. A sentence', d: 'Middots between the words, read like a breadcrumb. Shown word lit.' },
  { k: 'v4', t: '4. Sibling of All threads', d: 'Same chip as All threads; the shown tab wears its hover look. Header reads as one family.' },
  { k: 'v5', t: '5. Icons only', d: 'Chat, eye, constellation. Count is a small badge. Names on hover and to screen readers.' },
  { k: 'v6', t: '6. Accent ink', d: 'Only the shown word changes: it takes the theme accent, echoing the owl tile.' },
  { k: 'v7', t: '7. One menu', d: 'A single "Conversation ⌄" button like All threads; the other views live in its menu.' },
  { k: 'v8', t: '8. Lead dot', d: 'Muted words; a small accent dot appears before the shown one.' },
  { k: 'v9', t: '9. Strip below', d: 'Tabs leave the title row for their own row on the header floor, classic tab strip.' },
  { k: 'v10', t: '10. Hairline split', d: 'Unfilled outline split by hairlines; the shown one gets an accent floor.' },
]
const icon = id => document.getElementById('icons').content.querySelector(`[data-i="${id}"]`).cloneNode(true)

function tabsFor(v) {
  const wrap = document.createElement('div')
  wrap.className = `tabs ${v.k}`
  wrap.setAttribute('role', 'tablist')
  wrap.setAttribute('aria-label', 'Watcher view')
  if (v.k === 'v7') return menuFor(wrap)
  TABS.forEach(([id, label], i) => {
    if (v.k === 'v3' && i) { const s = document.createElement('span'); s.className = 'sep'; s.textContent = '·'; s.setAttribute('aria-hidden', 'true'); wrap.append(s) }
    const b = document.createElement('button')
    b.type = 'button'; b.className = 'tab'; b.dataset.tab = id; b.setAttribute('role', 'tab')
    if (v.k === 'v5') {
      b.title = label; b.setAttribute('aria-label', id === 'watched' ? `${label}, ${COUNT}` : label); b.append(icon(id))
      if (id === 'watched') { const n = document.createElement('span'); n.className = 'badge'; n.textContent = COUNT; n.setAttribute('aria-hidden', 'true'); b.append(n) }
    } else {
      b.append(label)
      if (id === 'watched') { const n = document.createElement('span'); n.className = 'n'; n.textContent = COUNT; b.append(n) }
    }
    wrap.append(b)
  })
  return wrap
}

function menuFor(wrap) {
  wrap.removeAttribute('role')
  const btn = document.createElement('button')
  btn.type = 'button'; btn.className = 'tab menu'; btn.setAttribute('aria-haspopup', 'menu'); btn.setAttribute('aria-expanded', 'false')
  const pop = document.createElement('div'); pop.className = 'pop'; pop.setAttribute('role', 'menu')
  const set = id => {
    wrap.dataset.shown = id
    const [, label] = TABS.find(t => t[0] === id)
    btn.innerHTML = ''; btn.append(icon(id), label)
    if (id === 'watched') { const n = document.createElement('span'); n.className = 'n'; n.textContent = COUNT; btn.append(n) }
    btn.insertAdjacentHTML('beforeend', '<span aria-hidden="true" style="color:var(--muted)">⌄</span>')
    pop.querySelectorAll('button').forEach(b => b.querySelector('.chk').textContent = b.dataset.tab === id ? '✓' : '')
    wrap.closest('.card').querySelector('.body').textContent = bodyText(id)
  }
  TABS.forEach(([id, label]) => {
    const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'menuitemradio'); b.dataset.tab = id
    b.innerHTML = `<span class="chk"></span>${label}${id === 'watched' ? `<span class="n">${COUNT}</span>` : ''}`
    b.onclick = () => { set(id); close() }
    pop.append(b)
  })
  const close = () => { pop.classList.remove('open'); btn.setAttribute('aria-expanded', 'false') }
  btn.onclick = () => { const o = pop.classList.toggle('open'); btn.setAttribute('aria-expanded', String(o)) }
  pop.addEventListener('keydown', e => { if (e.key === 'Escape') { close(); btn.focus() } })
  btn.addEventListener('keydown', e => { if (e.key === 'Escape') close() })
  document.addEventListener('click', e => { if (!wrap.contains(e.target)) close() })
  wrap.append(btn, pop)
  queueMicrotask(() => set('conversation'))
  return wrap
}

const bodyText = id => ({ conversation: 'Watcher\'s conversation shows here.', watched: `The ${COUNT} watched threads show here.`, visualize: 'The night scene with the owls shows here.' })[id]

function select(wrap, id, focus) {
  wrap.querySelectorAll('[role=tab]').forEach(b => {
    const on = b.dataset.tab === id
    b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1
    if (on && focus) b.focus()
  })
  wrap.closest('.card').querySelector('.body').textContent = bodyText(id)
}

const KEYS = { ArrowLeft: i => (i + 2) % 3, ArrowRight: i => (i + 1) % 3, Home: () => 0, End: () => 2 }
for (const v of VARIANTS) {
  const card = document.createElement('section')
  card.className = 'card' + (v.now ? ' card--now' : '')
  card.innerHTML = `<div class="card__label"><b>${v.t}</b><span>${v.d}</span></div>`
  const head = document.createElement('div')
  head.className = 'head' + (v.k === 'v9' ? ' head--two' : '')
  const pre = `<span class="head__tile" aria-hidden="true">🦉</span><span class="head__name">Watcher</span><span class="head__list">All threads <span class="head__count">4</span> ⌄</span>`
  const post = `<span class="head__spacer"></span><span class="head__stop">Stop all</span>`
  const tabs = tabsFor(v)
  if (v.k === 'v9') { const r = document.createElement('div'); r.className = 'row1'; r.innerHTML = pre + post; head.append(r, tabs) }
  else { head.innerHTML = pre; head.append(tabs); head.insertAdjacentHTML('beforeend', post) }
  const body = document.createElement('div'); body.className = 'body'
  card.append(head, body)
  document.getElementById('list').append(card)
  if (tabs.getAttribute('role') === 'tablist') {
    tabs.addEventListener('click', e => { const b = e.target.closest('[role=tab]'); if (b) select(tabs, b.dataset.tab) })
    tabs.addEventListener('keydown', e => {
      const f = KEYS[e.key]; if (!f) return; e.preventDefault()
      const i = TABS.findIndex(t => t[0] === document.activeElement.dataset.tab)
      select(tabs, TABS[f(i)][0], true)
    })
    select(tabs, 'conversation')
  }
}

const mode = document.getElementById('mode')
mode.onclick = () => {
  const light = document.documentElement.dataset.mode !== 'light'
  document.documentElement.dataset.mode = light ? 'light' : 'dark'
  mode.textContent = light ? 'Dark' : 'Light'
}
</script>
</body>
</html>
