  PROTOTYPE — throwaway. Not shipped, not tested, not wired to anything. Nothing here is saved.

  Question: how should a to-do list of things waiting on Zach by hand look and move? (Zach, November 3, 2026.)
  A small list icon with an unread badge; press it and the list unrolls downward like a scroll; check things off;
  it rolls back up. It takes the place of the Needs you lines Watcher repeats in its replies. Question and permission
  cards stay out of it, because they already pop up. On the iPhone and the Duo the icon goes on the side rail.

  Three variants, switchable with ?variant=A|B|C, the arrows in the bar below, or the left and right arrow keys:
    A  Corner scroll: as tall as the list, just under the icon. Steps fold open.
    B  Full-length scroll: runs the height of the window beside the thread. Steps lie open.
    C  Window blind: rolls down over everything but the sidebar, with Done beside To-do.

  Zach's picks (November 3, 2026, ADR-0188): A. Watcher, any thread and Zach can add. New is a loud count, then the rest
  a quiet one. A check tells only a thread that said it waits. Checked items are gone, with a few seconds to undo, so the
  Done row here is not wanted. Items live on the computer whose thread added them. Watcher's Needs you lines stop. Owl first.

  Other URL params: scene=desktop|small|watcher|folded|open|upright|iphone, theme=dark|light, motion=0, open=1.
  Keys: T theme, M motion, Escape rolls it up, H hides the bar.

  Drawn from the real app: tokens from src/shared/themes/palettes.ts, sizes from threadsChrome.css and
  apps/ios/Sotto/Views.swift on fix/duo-thread-rail-no-title-bar (#2126). The window shows Windows' own controls; on
  Linux they go and the icon takes the corner, and on a Mac the traffic lights are at the left. Watcher's night scene
  is left out of its room here, so the words stay readable in a drawing this small.
-->

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--page); color: var(--tt-text); font: 14px/1.45 var(--tt-font); overflow: hidden; display: flex; flex-direction: column; -webkit-text-size-adjust: 100%; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
svg { display: block; flex: none; }
:focus-visible { outline: 2px solid var(--tt-accent); outline-offset: 1px; }

/* The stage, and the window or phone drawn at its real size and scaled to fit. */
#stage { flex: 1; min-height: 0; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
#crop { position: relative; flex: none; overflow: hidden; transform-origin: center center; border-radius: 12px; box-shadow: 0 12px 40px rgb(0 0 0 / 40%); }
#win { position: absolute; top: 0; right: 0; background: var(--tt-canvas); overflow: hidden; }
.phone-scene { font-size: 15.5px; }

/* ── Desktop ── */
.dw { display: flex; height: 100%; }
.side { flex: none; background: var(--tt-sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--tt-sidebar-border); }
.side__top { height: 44px; display: flex; align-items: center; padding: 0 8px 0 14px; gap: 6px; color: var(--tt-muted); }
.tile { width: 18px; height: 18px; border-radius: 5px; background: var(--tt-accent); color: var(--tt-on-accent); display: grid; place-items: center; margin-right: auto; }
.side__search { margin: 0 8px 10px; height: 32px; border: 1px solid var(--tt-field-border); background: var(--tt-sidebar-control); border-radius: 6px; display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--tt-muted); font-size: 13px; }
.needs { margin: 0 8px 8px; background: var(--tt-sidebar-control); border-radius: 8px; padding: 7px 10px; font-size: 13px; }
.needs b { font-weight: 600; } .needs small { color: var(--tt-attention); display: block; font-size: 12px; }
.needs__c { font-size: 12px; padding: 0 5px; border-radius: 4px; background: var(--tt-canvas); color: var(--tt-text-2); margin-left: 6px; font-weight: 600; }
.folder { display: flex; align-items: center; gap: 8px; padding: 6px 14px; font-size: 14px; color: var(--tt-text); }
.folder span:last-child { margin-left: auto; color: var(--tt-muted); font-size: 12px; }
.trow { margin: 0 4px; padding: 7px 10px 7px 12px; border-radius: 8px; display: grid; grid-template-columns: 14px 1fr auto; gap: 2px 8px; align-items: center; font-size: 14px; border: 1px solid transparent; }
.trow.sel { background: var(--tt-sidebar-selected); border-color: color-mix(in oklab, var(--tt-accent) 40%, transparent); }
.trow i { width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--tt-muted); }
.trow.work i { border-color: var(--tt-accent); } .trow.wait i { border-color: var(--tt-attention); }
.trow time { color: var(--tt-muted); font-size: 12px; }
.trow small { grid-column: 2 / 4; color: var(--tt-muted); font-size: 12px; text-align: right; }
.trow.work small { color: var(--tt-accent); } .trow.wait small { color: var(--tt-attention); }
.side__foot { margin-top: auto; display: flex; gap: 2px; padding: 8px; align-items: center; color: var(--tt-muted); }
.side__foot span { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; }
.side__foot span.lit { background: color-mix(in srgb, var(--tt-text) 12%, transparent); color: var(--tt-text); }
.side__foot u { width: 1px; height: 18px; margin: 0 4px; background: var(--tt-hairline); }
.pane { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.phead { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 var(--inset, 164px) 0 14px; white-space: nowrap; color: var(--tt-text-2); font-size: 13px; }
.phead b { color: var(--tt-text); font-weight: 500; font-size: 15px; overflow: hidden; text-overflow: ellipsis; }
.phead .ico { width: 28px; height: 28px; display: grid; place-items: center; color: var(--tt-muted); }
.watch { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 8px; border: 1px solid var(--tt-field-border); border-radius: 6px; color: var(--tt-text); }
.push { margin-left: auto; }
.tscript { flex: 1; min-height: 0; overflow: hidden; padding: 12px 22px; }
.bubble { background: var(--tt-message); border-radius: 14px; padding: 14px 18px; margin: 8px 0 26px auto; max-width: 440px; }
.who { color: var(--tt-text-2); font-size: 13px; margin-bottom: 6px; } .who time { color: var(--tt-muted); margin-left: 6px; }
.compo { margin: 0 16px 16px; background: var(--tt-raised); border-radius: 20px; padding: 14px 18px; min-height: 96px; color: var(--tt-muted); position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; }
.compo div { display: flex; gap: 10px; align-items: center; justify-content: flex-end; font-size: 13px; }
.compo .send { width: 30px; height: 30px; border-radius: 50%; background: var(--tt-overlay); display: grid; place-items: center; }
/* The window's corner, drawn once outside the panes as threads-view__winctl is. */
.winctl { position: absolute; top: 0; right: 0; height: 44px; padding-right: 6px; display: flex; align-items: center; z-index: 30; color: var(--tt-muted); }
.winctl .k { width: 34px; height: 30px; display: grid; place-items: center; border-radius: 6px; }
.winctl__rule { width: 1px; height: 18px; background: var(--tt-hairline); margin: 0 4px 0 8px; }

/* The to-do icon: 34 by 30 on the desktop, a 44 point tile on the rail. */
.tdbtn { position: relative; display: grid; place-items: center; color: var(--tt-muted); }
.tdbtn.k:hover { background: var(--tt-hover); color: var(--tt-text); }
.tdbtn[aria-expanded='true'] { background: var(--tt-accent-surface); color: var(--tt-text); }
.bdg { position: absolute; top: -1px; right: -2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; font-size: 11px; line-height: 16px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; background: var(--tt-badge); color: var(--tt-on-badge); pointer-events: none; }
.bdg.quiet { background: var(--tt-surface); color: var(--tt-text-2); box-shadow: inset 0 0 0 1px var(--tt-field-border); font-weight: 600; }
.bdg.pop { animation: pop .42s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { 0% { transform: scale(.3); } 100% { transform: none; } }
.rail .tdbtn { width: 44px; height: 44px; border-radius: 50%; background: var(--tt-surface); box-shadow: inset 0 0 0 1px var(--tt-hairline); color: var(--tt-text-2); }
.rail .tdbtn[aria-expanded='true'] { background: var(--tt-accent-surface); color: var(--tt-accent); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--tt-accent) 50%, transparent), 0 0 16px color-mix(in oklab, var(--tt-accent) 30%, transparent); }
.rail .bdg { top: -6px; right: -6px; min-width: 18px; height: 18px; line-height: 18px; font-size: 12px; }

/* ── The scroll ── */
.tdw { position: absolute; z-index: 20; overflow: hidden; height: 0; display: none; border-radius: 10px 10px 8px 8px; }
.tds { box-shadow: 0 10px 28px var(--tt-shadow); }
.tdw.flat { border-radius: 0 0 8px 8px; }
.tdw.show { display: block; }
.tdw.anim { transition: height var(--roll-ms, 720ms) cubic-bezier(.32,.72,.28,1); }
.tdw.closing { transition: height 400ms cubic-bezier(.55,0,.25,1); }
.tds { display: flex; flex-direction: column; margin: 0 5px; background: var(--tt-raised); padding-bottom: 16px; box-shadow: inset 0 0 0 1px var(--tt-hairline); border-radius: inherit; }
/* The roll: it travels with the sheet's bottom edge, and thins as the paper leaves it. */
.tdr { position: absolute; left: 0; right: 0; bottom: 0; height: 16px; border-radius: 8px; cursor: pointer; transition: height 720ms cubic-bezier(.32,.72,.28,1);
  background: linear-gradient(to bottom, color-mix(in oklab, var(--tt-overlay) 55%, var(--tt-canvas)), color-mix(in oklab, var(--tt-overlay) 70%, var(--tt-text) 12%) 38%, var(--tt-overlay) 62%, color-mix(in oklab, var(--tt-overlay) 45%, var(--tt-canvas)));
  box-shadow: inset 0 0 0 1px var(--tt-hairline), 0 -7px 12px -6px var(--tt-shadow); }
.tdw:not(.open) .tdr { height: 24px; border-radius: 12px; }
.tdh { flex: none; display: flex; align-items: baseline; gap: 8px; padding: 12px 16px 8px; }
.tdh h2 { margin: 0; font-size: 15px; font-weight: 600; }
.tdh h2:focus { outline: none; }
.tdh span { color: var(--tt-muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.tdb { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 0 6px; scrollbar-width: thin; }
.tdf { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px 10px; border-top: 1px solid color-mix(in oklab, var(--tt-hairline) 70%, transparent); }
.tdf input { flex: 1; min-width: 0; height: 30px; padding: 0 9px; border-radius: 6px; border: 1px solid var(--tt-field-border); background: var(--tt-canvas); font-size: 13px; }
.tdf input::placeholder { color: var(--tt-muted); }
.rollup { flex: none; display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 9px; border-radius: 6px; color: var(--tt-text-2); font-size: 13px; white-space: nowrap; }
.rollup:hover { background: var(--tt-hover); color: var(--tt-text); }

.td { display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 0 4px; padding: 9px 10px 9px 6px; overflow: hidden; }
.td + .td { border-top: 1px solid color-mix(in oklab, var(--tt-hairline) 60%, transparent); }
.td.leaving { transition: height 240ms ease, padding 240ms ease, opacity 240ms ease; }
.chk { width: 30px; height: 30px; display: grid; place-items: center; margin-top: -5px; }
.chk i { width: 19px; height: 19px; border-radius: 6px; border: 1.5px solid var(--tt-field-border); background: var(--tt-canvas); display: grid; place-items: center; color: transparent; transition: background .16s, border-color .16s, transform .16s; }
.chk:hover i { border-color: var(--tt-accent); }
.chk[aria-checked='true'] i { background: var(--tt-accent); border-color: var(--tt-accent); color: var(--tt-on-accent); }
.td.ticked .tt { text-decoration: line-through; color: var(--tt-muted); }
.tt { font-weight: 500; font-size: 14px; line-height: 1.35; }
.tt em { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--tt-badge); margin-right: 6px; vertical-align: 1px; }
.why { color: var(--tt-text-2); font-size: 13px; margin-top: 2px; line-height: 1.4; }
.meta { display: flex; flex-wrap: wrap; gap: 3px 10px; align-items: center; margin-top: 6px; font-size: 12.5px; color: var(--tt-muted); }
.lnk { display: inline-flex; align-items: center; gap: 4px; color: var(--tt-accent); text-align: left; min-height: 22px; }
.lnk:hover { text-decoration: underline; }
.lnk.thr { color: var(--tt-text-2); }
.waits { color: var(--tt-attention); }
.steps { margin: 8px 0 2px; padding: 8px 10px 8px 30px; border-radius: 10px; background: var(--tt-canvas); font-size: 13px; line-height: 1.45; color: var(--tt-text); }
.steps li { padding: 2px 0; } .steps li::marker { color: var(--tt-muted); font-variant-numeric: tabular-nums; }
.note { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.note input { flex: 1 1 160px; min-width: 0; height: 30px; padding: 0 9px; border-radius: 6px; border: 1px solid var(--tt-field-border); background: var(--tt-canvas); font-size: 13px; }
.note input::placeholder { color: var(--tt-muted); }
.btn { height: 30px; padding: 0 11px; border-radius: 6px; font-size: 13px; background: var(--tt-overlay); white-space: nowrap; }
.btn.go { background: var(--tt-accent); color: var(--tt-on-accent); font-weight: 600; }
.dfold { display: flex; align-items: center; gap: 6px; width: 100%; padding: 8px 10px; color: var(--tt-text-2); font-size: 13px; border-radius: 8px; }
.dfold:hover { background: var(--tt-hover); }
.dfold svg { transition: transform .18s; } .dfold[aria-expanded='true'] svg { transform: rotate(90deg); }
.td.done .tt { color: var(--tt-muted); text-decoration: line-through; }
.none { padding: 20px 12px 26px; color: var(--tt-text-2); text-align: center; font-size: 14px; }
/* B lies its steps open and has more room. */
.v-B .td { padding-top: 12px; padding-bottom: 12px; }
/* C is a blind: To-do and Done side by side, each item a card of its own. */
.tdw.v-C .tdb { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0 18px; align-content: start; padding: 0 16px 8px; }
.cgrid h3 { margin: 4px 0 8px; font-size: 13px; font-weight: 600; color: var(--tt-text-2); }
.v-C .td { background: var(--tt-surface); border-radius: 14px; margin-bottom: 8px; border-top: 0; padding: 12px 12px 12px 8px; }
.v-C .td.done { background: transparent; box-shadow: inset 0 0 0 1px var(--tt-hairline); }
/* Phones: the app's type scale, and a 44 point press on each check. */
.phone-scene .tdh h2 { font-size: 17px; } .phone-scene .tt { font-size: 15.5px; } .phone-scene .why, .phone-scene .steps { font-size: 13.5px; }
.phone-scene .meta, .phone-scene .tdf input, .phone-scene .rollup { font-size: 13.5px; }
.phone-scene .td { grid-template-columns: 38px minmax(0,1fr); }
.phone-scene .chk { width: 38px; height: 38px; margin-top: -9px; } .phone-scene .chk i { width: 22px; height: 22px; border-radius: 50%; }
.phone-scene .lnk { min-height: 30px; } .phone-scene .tdf input, .phone-scene .rollup, .phone-scene .btn, .phone-scene .note input { height: 38px; }

/* ── Phones ── */
.ph { height: 100%; position: relative; }
.ph__main { position: absolute; top: 0; left: 0; bottom: 0; display: flex; flex-direction: column; overflow: hidden; }
.ph__main .tscript { padding: 18px 16px 8px; font-size: 15.5px; display: flex; flex-direction: column; justify-content: flex-end; }
.ph .compo { margin: 0 10px 10px; min-height: 90px; border-radius: 24px; }
.ph .compo .r { width: 34px; height: 34px; border-radius: 50%; background: var(--tt-overlay); display: grid; place-items: center; color: var(--tt-text-2); }
.ph .compo .sp { margin-right: auto; }
.ph .bubble { border-radius: 18px; padding: 12px 16px; margin-bottom: 16px; }
.state { display: flex; gap: 8px; align-items: center; color: var(--tt-text-2); font-size: 14px; margin-top: 12px; }
.state i { width: 8px; height: 8px; border-radius: 50%; background: var(--tt-accent); box-shadow: 0 0 10px var(--tt-accent); }
.rail { position: absolute; top: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; }
.clock { font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }
.ring { width: 28px; height: 28px; margin-top: 8px; color: var(--tt-accent); }
.circ { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--tt-accent); background: color-mix(in oklab, var(--tt-accent-surface) 45%, var(--tt-surface)); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--tt-accent) 40%, transparent), 0 0 16px color-mix(in oklab, var(--tt-accent) 22%, transparent); }
.pill { width: 60px; background: var(--tt-surface); box-shadow: inset 0 0 0 1px var(--tt-hairline); border-radius: 30px; padding: 5px; display: flex; flex-direction: column; gap: 2px; align-items: center; }
.tile50 { width: 50px; height: 50px; display: grid; place-items: center; color: var(--tt-text-2); position: relative; border-radius: 50%; }
.tile50.lit { background: var(--tt-accent-surface); color: var(--tt-accent); }
.tile50 .count { position: absolute; top: 2px; right: 0; min-width: 18px; height: 18px; line-height: 18px; border-radius: 999px; font-size: 12px; font-weight: 600; text-align: center; background: var(--tt-badge); color: var(--tt-on-badge); }
.stt { min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; line-height: 1.15; color: var(--tt-accent); text-align: center; padding: 6px 0; font-weight: 500; }
.stt i { width: 8px; height: 8px; border-radius: 50%; background: var(--tt-accent); box-shadow: 0 0 8px var(--tt-accent); }
.lst { position: absolute; top: 0; left: 0; bottom: 0; border-right: 1px solid var(--tt-hairline); padding: 16px 8px; overflow: hidden; }
.lst h1 { font-size: 21px; margin: 2px 8px 18px; font-weight: 600; }
.lst h4 { margin: 12px 8px 6px; font-size: 13.5px; font-weight: 500; color: var(--tt-muted); }
.lrow { padding: 8px; border-radius: 12px; display: grid; grid-template-columns: 16px 1fr auto; gap: 1px 8px; align-items: center; font-weight: 500; font-size: 15px; }
.lrow.sel { background: var(--tt-accent-surface); color: var(--tt-accent); }
.lrow i { width: 8px; height: 8px; border-radius: 50%; background: var(--tt-accent); }
.lrow.w i { background: var(--tt-badge); }
.lrow time { font-weight: 400; font-size: 12px; color: var(--tt-muted); }
.lrow small { grid-column: 2/4; font-weight: 400; font-size: 13px; color: var(--tt-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav { flex: none; height: 104px; padding: 54px 10px 0; display: flex; align-items: center; gap: 8px; }
.nav b { font-size: 17px; font-weight: 600; flex: 1; min-width: 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav .rail, .nav .railish { position: static; }
.nav .tdbtn { width: 40px; height: 40px; }
.statusbar { position: absolute; top: 18px; left: 34px; right: 34px; display: flex; justify-content: space-between; font-weight: 600; font-size: 15px; pointer-events: none; }

/* ── The prototype's own bar, not part of the design ── */
#bar { flex: none; background: #f4f4f5; color: #18181b; padding: 7px 10px calc(7px + env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: center; font-size: 13px; line-height: 1.2; }
:root[data-theme='light'] #bar { background: #18181b; color: #f4f4f5; }
#bar button, #bar select { height: 32px; border-radius: 8px; padding: 0 10px; border: 1px solid currentColor; background: transparent; color: inherit; font: inherit; }
#bar select option { color: #18181b; background: #fff; }
#bar .arw { width: 34px; padding: 0; font-size: 15px; }
#vname { font-weight: 700; min-width: 148px; text-align: center; }
#bar .thin { display: none; } @media (max-width: 620px) { #bar .thin { display: inline; } }
#log { width: 100%; text-align: center; font-size: 12px; opacity: .8; min-height: 15px; }
body.nobar #bar { display: none; }
@media (max-width: 620px) { #vname { min-width: 0; flex: 1 1 110px; white-space: nowrap; font-size: 12.5px; } #bar { gap: 5px; padding: 5px 6px calc(5px + env(safe-area-inset-bottom)); } #bar button, #bar select { height: 30px; padding: 0 6px; font-size: 12px; } #bar .arw { width: 30px; } #scene { flex: 1 1 130px; min-width: 0; } #bmode { flex: 1 1 90px; min-width: 0; max-width: 150px; } #log { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11.5px; } .wide { display: none; } }
@media (prefers-reduced-motion: reduce) { .bdg.pop { animation: none; } }
:root[data-motion='off'] .tdw, :root[data-motion='off'] .tdr, :root[data-motion='off'] .td, :root[data-motion='off'] .dfold svg { transition: none !important; }
:root[data-motion='off'] .bdg.pop { animation: none; }
:root[data-motion='off'] .tdw.fade { animation: fadein .16s linear; }
@keyframes fadein { from { opacity: 0; } }
</style>
</head>
<body>
<div id="stage"><div id="crop"><div id="win"></div></div></div>
<div id="bar">
  <button class="arw" id="prev" aria-label="Previous variant">←</button>
  <span id="vname"></span>
  <button class="arw" id="next" aria-label="Next variant">→</button>
  <select id="scene" aria-label="Where it is shown">
    <option value="desktop">Desktop, Threads</option>
    <option value="watcher">Desktop, Watcher's room</option>
    <option value="small">Desktop, 820 × 560</option>
    <option value="folded">Duo, folded</option>
    <option value="open">Duo, sideways</option>
    <option value="upright">Duo, upright</option>
    <option value="iphone">Other iPhones</option>
  </select>
  <button id="theme">Light</button>
  <button id="motion">Motion on</button>
  <select id="bmode" aria-label="What the badge counts">
    <option value="both">Badge: new loud, rest quiet</option>
    <option value="new">Badge: new only</option>
    <option value="all">Badge: all not checked</option>
  </select>
  <button id="addone"><span class="wide">A thread adds</span><span class="thin">Add</span> one</button>
  <div id="log" role="status"></div>
</div>
<script>
const I = {
  todo: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="6" height="6" rx="1"/><path d="m3 17 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>`,
  check: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>`,
  out: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>`,
  up: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>`,
  right: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>`,
  left: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>`,
  owl: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l3.2 2.2a12 12 0 0 1 7.6 0L19 4v8.5C19 17 16 20 12 20s-7-3-7-7.5z"/><circle cx="9" cy="12" r="2.4" fill="var(--tt-canvas)"/><circle cx="15" cy="12" r="2.4" fill="var(--tt-canvas)"/></svg>`,
  dots: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>`,
  x: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>`,

    el.classList.remove('anim', 'closing', 'fade')
    const a = area()
    for (const k of ['top', 'left', 'right', 'width']) el.style[k] = a[k] === undefined ? '' : a[k] + 'px'
    el.innerHTML = sheet()
    void el.offsetHeight
    layout(true)
    if (!S.motion) el.classList.add('fade')
    // The badge goes quiet as soon as it is opened, and the new dots stay until it is rolled up.
    const u = S.items.filter(i => i.unread); u.forEach(i => { i.unread = false; i.wasNew = true })
    el.querySelectorAll('.tt').forEach(() => {})
    S.items.forEach(i => { if (i.wasNew) i.unread = false })
    const titles = {}; u.forEach(i => titles[i.id] = 1)
    el.querySelectorAll('.td').forEach(r => { if (titles[r.dataset.id]) { const t = r.querySelector('.tt'); if (!t.querySelector('em')) t.insertAdjacentHTML('afterbegin', '<em title="New"></em>') } })
    paintBadge(false)
    $('#tdhead')?.focus({ preventScroll: true })
    say(u.length ? `Unrolled. ${u.length} new, so the badge goes quiet.` : 'Unrolled.')
  } else {
    S.note = null
    if (S.motion) { el.classList.add('anim', 'closing'); el.classList.remove('open'); el.style.height = '0px'; el.addEventListener('transitionend', function f(e) { if (e.target !== el) return; el.removeEventListener('transitionend', f); if (!S.open) el.classList.remove('show') }) }
    else { el.classList.remove('show', 'open'); el.style.height = '0px' }
    paintBadge(false)
    $('#tdbtn')?.focus({ preventScroll: true })
    say('Rolled up.')
  }
}
function keepNewMarks() {
  const el = $('#tdw')
  S.items.forEach(i => { if (i.wasNew) { const r = el?.querySelector(`.td[data-id="${i.id}"] .tt`); if (r && !r.querySelector('em')) r.insertAdjacentHTML('afterbegin', '<em title="New"></em>') } })
}
function refresh() { layout(true); keepNewMarks(); paintBadge(false) }
function tick(id, told) {
  const it = S.items.find(i => i.id === id); if (!it) return
  const row = document.querySelector(`.td[data-id="${id}"]`)
  const finish = () => {
    S.items = S.items.filter(i => i !== it); it.when = 'Just now'; it.told = told || (it.waits ? `Told ${it.thr}` : ''); delete it.wasNew; S.done.unshift(it); S.note = null
    refresh()
    say(told ? `Sent to ${it.thr}: it did not work.` : it.waits ? `Told ${it.thr} you checked this off. It approves nothing.` : `Checked off: ${it.t}.`)
    if (!S.items.length) setTimeout(() => { if (!S.items.length) toggle(false) }, 900)
  }
  if (row && S.motion && S.variant !== 'C') {
    row.classList.add('ticked'); row.querySelector('.chk').setAttribute('aria-checked', 'true')
    setTimeout(() => { row.style.height = row.offsetHeight + 'px'; row.classList.add('leaving'); void row.offsetHeight; row.style.height = '0px'; row.style.paddingTop = row.style.paddingBottom = '0'; row.style.opacity = '0'; setTimeout(finish, 240) }, 340)
  } else if (row && S.motion) { row.classList.add('ticked'); row.querySelector('.chk').setAttribute('aria-checked', 'true'); setTimeout(finish, 340) } else finish()
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]')
  if (t) {
    const a = t.dataset.act, id = t.dataset.id
    if (a === 'tick') tick(id)
    else if (a === 'undo') { const it = S.done.find(i => i.id === id); S.done = S.done.filter(i => i !== it); delete it.told; if (!it.why) it.why = ''; S.items.push(it); refresh(); say(`Put back: ${it.t}.`) }
    else if (a === 'roll') toggle(false)
    else if (a === 'fold') { S.doneOpen = !S.doneOpen; refresh() }
    else if (a === 'steps') { S.foldOpen.has(id) ? S.foldOpen.delete(id) : S.foldOpen.add(id); refresh() }
    else if (a === 'note') { S.note = id; refresh(); $('#noteinp')?.focus() }
    else if (a === 'cancelnote') { S.note = null; refresh() }
    else if (a === 'sendnote') { const v = $('#noteinp')?.value.trim(); tick(id, v ? `You said: ${v}` : 'You said it did not work') }
    else if (a === 'thread') say(`Would open the thread ${t.dataset.thr}.`)
    else if (a === 'link') say(`Would do: ${t.dataset.l}.`)
    return
  }
  // A press outside rolls it up, and leaves focus alone.
  if (S.open && !e.target.closest('#tdw, #bar, #tdbtn')) { toggle(false); document.activeElement?.blur?.() }
})
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)
  if (e.key === 'Escape' && S.open) { e.preventDefault(); if (S.note) { S.note = null; refresh() } else toggle(false); return }
  if (e.key === 'Enter' && e.target.id === 'addinp' && e.target.value.trim()) {
    S.items.push({ id: 'me' + Date.now(), t: e.target.value.trim(), why: '' }); refresh(); say('Added one of your own.'); $('#addinp')?.focus(); return
  }
  if (e.key === 'Enter' && e.target.id === 'noteinp') { document.querySelector('[data-act="sendnote"]')?.click(); return }
  if (typing) return
  if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1)
  else if (e.key === 't' || e.key === 'T') setTheme(S.theme === 'dark' ? 'light' : 'dark')
  else if (e.key === 'm' || e.key === 'M') setMotion(!S.motion)
  else if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('nobar'), fit()
})
function url() { const p = new URLSearchParams({ variant: S.variant, scene: S.scene, theme: S.theme }); if (!S.motion) p.set('motion', '0'); if (S.bmode !== 'both') p.set('badge', S.bmode); history.replaceState(null, '', '?' + p) }
function step(d) { const k = ['A', 'B', 'C']; S.variant = k[(k.indexOf(S.variant) + d + 3) % 3]; applyVariant() }
function applyVariant() { $('#vname').textContent = NAMES[S.variant]; url(); if (S.open) { layout(false); keepNewMarks(); } say(`Showing ${NAMES[S.variant]}.`) }
function setTheme(t) { S.theme = t; document.documentElement.dataset.theme = t; $('#theme').textContent = t === 'dark' ? 'Light' : 'Dark'; url() }
function setMotion(m) { S.motion = m; document.documentElement.dataset.motion = m ? 'on' : 'off'; $('#motion').textContent = m ? 'Motion on' : 'Motion off'; url() }
function fit() {
  const st = $('#stage'), c = SCENES[S.scene], crop = $('#crop'), win = $('#win')
  const aw = st.clientWidth - (innerWidth < 620 ? 0 : 16), ah = st.clientHeight - (innerWidth < 620 ? 0 : 16)
  // A window too wide for a phone shows its right part at a readable size, since the icon and the scroll live there.
  const cropped = c.crop && aw < 720
  const dw = cropped ? c.crop : c.w
  const scale = Math.min(1.25, aw / dw, cropped ? 9 : ah / c.h)
  const dh = cropped ? Math.min(c.h, Math.max(420, Math.floor(ah / scale))) : c.h
  win.classList.toggle('phone-scene', c.kind === 'phone'); win.style.width = c.w + 'px'; win.style.height = dh + 'px'
  crop.style.width = dw + 'px'; crop.style.height = dh + 'px'; crop.style.transform = `scale(${scale})`
  crop.style.margin = `${(dh * scale - dh) / 2}px ${(dw * scale - dw) / 2}px`
  crop.style.borderRadius = cropped ? '0' : ''
}
function setScene(s) { S.scene = s; $('#scene').value = s; drawScene(); fit(); url(); if (S.open) { layout(false); keepNewMarks() } }
$('#prev').onclick = () => step(-1); $('#next').onclick = () => step(1)
$('#scene').onchange = e => setScene(e.target.value)
$('#theme').onclick = () => setTheme(S.theme === 'dark' ? 'light' : 'dark')
$('#motion').onclick = () => setMotion(!S.motion)
$('#bmode').onchange = e => { S.bmode = e.target.value; url(); paintBadge(false); say('Badge rule changed.') }
$('#addone').onclick = () => {
  const a = ADDS[nextAdd++ % ADDS.length]
  const it = { ...a, id: 'add' + nextAdd, unread: true }
  S.items.unshift(it)
  if (S.open) { it.unread = false; it.wasNew = true; refresh() }
  paintBadge(true); say(`${a.thr} added a to-do.`)
}
addEventListener('resize', () => { fit(); if (S.open) { layout(false); keepNewMarks() } })
$('#bmode').value = S.bmode
setTheme(S.theme); setMotion(S.motion); $('#vname').textContent = NAMES[S.variant]; setScene(S.scene)
say(S.log)
document.fonts?.ready?.then(() => { fit() })
if (q.get('open') === '1') { const m = S.motion; S.motion = false; toggle(true); S.motion = m }
</script>
</body>
