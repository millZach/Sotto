<!--
  VERDICT (November 10, 2026): the owner picked A, "Notes on the page"; the look as light, dark or match the system on
  the first note; carrying on to dictation when no agent is ready, with what is left listed on the last note; and
  the walk for new users and again from Help, as Set up Sotto. Shown that the terminal drawn here would need a terminal
  outside a thread (ADR-0111) and main typing a command on stable (ADR-0139), he picked the Sign in dialog paired hosts
  already have (ADR-0037) instead, with Sign in on the folded row; the terminal below is what was weighed, not what was
  built. Recorded in ADR-0200. B and C are kept here as the record of what was weighed.

  PROTOTYPE — throwaway. Question: what should first-run setup look like once it is a walk over Sotto's real pages
  instead of a card of ten steps followed by a tour? Raised by the owner on November 10, 2026. His picks so far, by
  question card that day: the shape is "Guided on the real pages"; setup's first part is done when a first thread is
  open; the walk then carries on through dictation, Tailscale, other computers and the iPhone, each with a skip; an
  agent that is installed but not signed in gets a button that opens Sotto's terminal on the client's own sign-in
  (this amends ADR-0063 decision 3); an agent that is not installed keeps Install guide; the Threads tour is removed;
  straight to stable.

  Three variants of how the guide shows, via ?variant=A|B|C:
    A  Notes on the page: the control is lit, the rest is dimmed, and a note sits beside it.
    B  Guide beside the page: a list of the whole walk docked at the window's edge; the page stays live.
    C  One line across the top: a single band over the page; the page stays live.
  Also ?stop=<id>, ?agents=mixed|none|ready, ?os=win|linux, ?zoom=1 (the window at full size, for a phone).
  Everything that would leave Sotto (a folder picker, a browser, a real terminal, a microphone) is simulated, and the
  dashed "Pretend…" buttons stand in for what the user does outside Sotto. No IPC, no network beyond the page, no
  persistence.
  Run: from the repository root, serve the folder (any static server) and open
  /docs/prototypes/guided-setup-prototype.html
-->

<script>
const I = {

const q = new URLSearchParams(location.search)
const AGENT_SETS = {
  mixed: { codex: 'signed-out', claude: 'signed-out', grok: 'missing', devin: 'missing' },
  none: { codex: 'missing', claude: 'missing', grok: 'missing', devin: 'missing' },

  { id: 'codex', name: 'Codex', letter: 'Cx', command: 'codex login', account: 'ChatGPT Plus · 0.59.1' },
  { id: 'claude', name: 'Claude Code', letter: 'Cl', command: 'claude auth login', account: 'Claude Max · 2.1.4' },
  { id: 'grok', name: 'Grok Build', letter: 'Gk', command: 'grok login', account: 'SuperGrok · 1.0.40' },
  { id: 'devin', name: 'Devin', letter: 'Dv', command: 'devin auth login', account: 'Devin · 3000.11.92' },
]
const S = {
  variant: ['A', 'B', 'C'].includes(q.get('variant')) ? q.get('variant') : 'A',

  zoom: q.get('zoom') === '1',
  stop: 0, agents: {}, terminal: null, termDone: false, project: false, thread: false, mic: 'idle', model: null,

  skipped: new Set(), guided: new Set(), over: false, look: q.get('look') === 'light' ? 'light' : 'system',

S.agents = { ...AGENT_SETS[S.agentSet] }
const anyReady = () => Object.values(S.agents).includes('ready')
const readyAgent = () => AGENTS.find(agent => S.agents[agent.id] === 'ready')
const key = () => S.os === 'linux' ? 'F9' : 'Ctrl+Shift+Space'

/** The walk. `page` is the real page the stop is on; `target` is the real control it lights. */
function stops() {
  const ready = readyAgent()
  const list = [
    { id: 'welcome', group: 'Start', page: 'threads', target: null, title: 'Talk to your computer and your coding agents',
      body: 'Sotto runs Codex, Claude Code, Grok Build and Devin threads in one window, and turns your voice into text on this computer. This walk sets up your first thread, then dictation, other computers and your iPhone. Skip any part. First, pick how Sotto looks.',
      short: 'This walk sets up your first thread, then dictation, other computers and your iPhone.', done: () => true, start: true },
    { id: 'agents', group: 'First thread', page: 'providers', target: '#providers', title: 'Sign in to a coding agent',

function go(delta) {

  const body = { threads: pageThreads, providers: pageProviders, dictation: pageDictation, dictate: pageDictate, hosts: pageHosts }[page]()
  win.dataset.variant = S.over ? 'X' : S.variant
  win.dataset.look = S.look === 'light' ? 'light' : 'dark'
  const band = !S.over && S.variant === 'C' ? guideBand() : ''
  win.innerHTML = `${sidebar(page)}<section class="main">${band}${body}${terminal()}</section>${!S.over && S.variant === 'B' ? guideDock() : ''}`
  const target = S.over ? null : val(stop.target) && win.querySelector(val(stop.target))
  if (!S.over && S.variant === 'A') {
    win.insertAdjacentHTML('beforeend', target ? '<div class="hole" id="hole"></div>' : '<div class="dim"></div>')
    win.insertAdjacentHTML('beforeend', guideNote())
    placeNote(win, target)
  } else if (target) target.classList.add('ring')
  renderAbout(stop)
  renderBar()
  fit()
  const params = new URLSearchParams({ variant: S.variant, stop: stop.id, agents: S.agentSet, os: S.os, ...(S.zoom ? { zoom: '1' } : {}) })
  history.replaceState(null, '', `?${params}`)
}
function placeNote(win, target) {
  const note = win.querySelector('#gnote'), W = 1080, H = 720, gap = 16
  const nh = note.offsetHeight, nw = note.offsetWidth
  if (!target) { note.style.left = `${(W - nw) / 2}px`; note.style.top = `${(H - nh) / 2}px`; return }
  const scale = win.getBoundingClientRect().width / W, wr = win.getBoundingClientRect(), tr = target.getBoundingClientRect()
  const t = { left: (tr.left - wr.left) / scale, top: (tr.top - wr.top) / scale, width: tr.width / scale, height: tr.height / scale }
  const hole = win.querySelector('#hole'), pad = 6
  Object.assign(hole.style, { left: `${t.left - pad}px`, top: `${t.top - pad}px`, width: `${t.width + pad * 2}px`, height: `${t.height + pad * 2}px` })
  const termTop = S.terminal ? H - 230 : H
  let left, top
  if (t.left + t.width + gap + nw < W - gap) { left = t.left + t.width + gap + pad; top = t.top }
  else if (t.top + t.height + gap + nh < termTop - gap) { left = t.left + t.width - nw; top = t.top + t.height + gap + pad }
  else if (t.top - gap - nh > gap) { left = t.left + t.width - nw; top = t.top - gap - pad - nh }
  else { left = t.left - gap - pad - nw; top = t.top }
  note.style.left = `${Math.max(gap, Math.min(W - nw - gap, left))}px`
  note.style.top = `${Math.max(gap, Math.min(termTop - nh - gap, top))}px`
}
function fit() {
  const stage = document.getElementById('stage'), scaler = document.getElementById('scaler')
  stage.dataset.zoom = S.zoom ? '1' : '0'
  const room = Math.min(document.body.clientWidth - 28, 1080)
  const scale = S.zoom ? 1 : Math.min(1, room / 1080)
  scaler.style.transform = `scale(${scale})`
  stage.style.width = S.zoom ? `${room}px` : `${1080 * scale}px`
  stage.style.height = S.zoom ? '' : `${720 * scale}px`
  if (S.zoom) {
    const lit = document.querySelector('#gnote, .dock li[data-now=true], .band, .ring')
    if (lit) { const r = lit.getBoundingClientRect(), s = stage.getBoundingClientRect(); stage.scrollLeft += r.left - s.left - 20; stage.scrollTop += r.top - s.top - 60 }
  }
}

  welcome: ['No setup card. Sotto opens on the real Threads page and the walk starts there.', '<span class="new">Added November 10 from your pick:</span> light, dark or match the system on this first note. It repaints the window at once. Themes stay in Settings › Appearance.', 'The welcome\'s privacy lines sit in this note; the product events notice follows the walk, as it follows the tour today.'],
  agents: ['<span class="new">New on the real page:</span> Sign in on a signed-out agent\'s row in Settings › Providers. It opens Sotto\'s terminal on the client\'s own sign-in command. This amends ADR-0063 decision 3 ("signs in to nothing").', 'Not installed keeps Install guide, as today. Every row uses the same four states in the same words; a client\'s own error sentence is not shown raw.', 'With no agent ready, Skip for now passes over the project and the thread and goes on to dictation, and the last note lists what is left. Try it with "Agents: none installed" below.'],
  project: ['The lit control is the sidebar\'s own Add project. The folder picker is simulated here.'],
  thread: ['The lit control is the sidebar\'s own New thread. Once the thread is open the guide moves to the composer: this is the point you chose as "setup\'s first part is done".', 'From here every stop is optional: Continue to dictation, or Finish here.'],
  omarchy: ['Linux only. One button for the three Omarchy changes, on Settings › Dictation where they can be removed.'],
  mic: ['The same microphone test as today, on Settings › Dictation where it already lives.'],
  model: ['The same three downloads as today, on Settings › Dictation.'],
  shortcut: ['On the Dictate page. Today\'s setup has a paste field instead.'],
  tailscale: ['<span class="new">New stop,</span> as you asked: Tailscale before other computers and the iPhone, because both need it.', 'Get Tailscale opens its download page in the browser; Check again looks for it.'],
  computers: ['The lit control is Settings › Hosts & phones\' own Add host, so the note uses that page\'s word. The real Add host dialog opens from it.'],
  iphone: ['Without Tailscale the switch does not turn on, and says why, with Get Tailscale on the same page. Today the switch stays on beside "nothing was changed".'],
  end: ['The last note lists whatever was skipped and where it lives. There is no separate tour.', 'Help starts the walk again, as you picked on November 10.'],
}
function renderAbout(stop) {
  const g = guideParts()
  const names = { A: 'A · Notes on the page', B: 'B · Guide beside the page', C: 'C · One line across the top' }
  const how = { A: 'The control is lit and the rest of the window is dimmed. The note sits beside the control.', B: 'The whole walk is a list docked at the window\'s right edge. The page stays live and nothing is dimmed; any item can be opened out of order.', C: 'One band across the top of the page. The page stays live and nothing is dimmed.' }
  document.getElementById('about').innerHTML = S.over
    ? '<h2>Setup is closed</h2><p style="color:#a3a5bd;margin:0">This is Sotto with no guide showing. Use Back below to reopen the walk.</p>'
    : `<h2>${names[S.variant]} — stop ${g.count}</h2><p style="color:#a3a5bd;margin:0">${how[S.variant]}</p>
      <div class="said"><b>${val(stop.title)}</b>${val(S.variant === 'C' ? stop.short : stop.body)}${g.status ? `<br><span style="color:${g.status[0] === 'ok' ? '#63d6a8' : '#f0b454'}">${g.status[1]}</span>` : ''}</div>
      <ul>${(NEW[stop.id] || []).map(line => `<li>${line}</li>`).join('')}</ul>`
}
function renderBar() {
  const press = (on, act, label) => `<button aria-pressed="${on}" data-bar="${act}">${label}</button>`
  document.getElementById('bar').innerHTML = `
    <span class="grp">${press(S.variant === 'A', 'v:A', 'A Notes')}${press(S.variant === 'B', 'v:B', 'B Beside')}${press(S.variant === 'C', 'v:C', 'C Line')}</span>
    <span class="grp"><button data-bar="prev">◀ Back</button><button data-bar="next">Next ▶</button><button data-bar="reset">Restart</button></span>
    <span class="more"><span class="grp">${press(S.zoom, 'zoom', 'Full size')}</span>
    <span class="grp">Agents ${press(S.agentSet === 'mixed', 'a:mixed', 'signed out')}${press(S.agentSet === 'none', 'a:none', 'none installed')}${press(S.agentSet === 'ready', 'a:ready', 'ready')}</span>
    <span class="grp">${press(S.os === 'win', 'o:win', 'Windows')}${press(S.os === 'linux', 'o:linux', 'Linux')}</span></span>`
}

/* ---------- presses ---------- */
document.getElementById('win').addEventListener('click', event => {
  const el = event.target.closest('[data-act]')
  if (!el) return
  const [act, arg] = el.dataset.act.split(':')
  if (act === 'forward') return forward()
  if (act === 'back') return go(-1)
  if (act === 'finish' || act === 'quit') { S.over = true; return render() }
  if (act === 'jump') { S.stop = Number(arg); S.terminal = null; return render() }
  if (act === 'look') S.look = arg
  if (act === 'signin') { S.terminal = arg; S.termDone = false }
  if (act === 'term-done') { S.termDone = true; S.agents[S.terminal] = 'ready'; render(); return void setTimeout(() => { S.terminal = null; render() }, 1600) }
  if (act === 'term-close') S.terminal = null
  if (act === 'guide') S.guided.add(arg)
  if (act === 'project') { if (!anyReady()) return; S.project = true }
  if (act === 'thread') { if (!S.project || !anyReady()) return; S.thread = true; S.stop = indexOf('thread') }
  if (act === 'omarchy') S.omarchy = !S.omarchy
  if (act === 'mic') { if (S.mic === 'listening') S.mic = 'idle'; else { S.mic = 'listening'; render(); return void setTimeout(() => { if (S.mic === 'listening') { S.mic = 'heard'; render() } }, 1500) } }
  if (act === 'model') S.model = arg
  if (act === 'tried') S.tried = true
  if (act === 'ts-get') S.tsOpened = true
  if (act === 'ts-on') { S.tailscale = true; S.phoneTold = false }
  if (act === 'host') S.hosts = 1
  if (act === 'beta') S.beta = true
  if (act === 'phones') { if (!S.tailscale) S.phoneTold = true; else { S.phones = !S.phones; if (!S.phones) S.code = false } }
  if (act === 'code') S.code = true
  render()
})
document.getElementById('bar').addEventListener('click', event => {
  const el = event.target.closest('[data-bar]')
  if (!el) return
  const [act, arg] = el.dataset.bar.split(':')
  if (act === 'v') { S.variant = arg; S.over = false }
  if (act === 'prev') { if (S.over) S.over = false; else return go(-1) }
  if (act === 'next') { S.over = false; return forward() }
  if (act === 'a') { S.agentSet = arg; S.agents = { ...AGENT_SETS[arg] }; S.terminal = null; if (!anyReady()) { S.project = false; S.thread = false; if (stopNow().needsAgent) S.stop = indexOf('agents') } }
  if (act === 'o') { const id = stopNow().id; S.os = arg; S.stop = Math.max(0, indexOf(id)) }
  if (act === 'zoom') S.zoom = !S.zoom
  if (act === 'reset') return void (location.href = location.pathname + `?variant=${S.variant}`)
  render()
})
addEventListener('resize', fit)
const first = indexOf(q.get('stop'))
if (first > 0) {
  // A link to a later stop opens with what the earlier stops would have set up.
  if (S.agentSet !== 'none') {
    if (first >= indexOf('project') && !anyReady()) S.agents.codex = 'ready'
    if (first >= indexOf('thread')) S.project = true
    if (first > indexOf('thread')) S.thread = true
  }
  S.stop = stops()[first].needsAgent && !anyReady() ? indexOf('agents') : first
}
document.fonts?.ready.then(render)
render()
</script>
</body>
