<!doctype html>
<!--
  PROTOTYPE, throwaway. Not shipped, not tested, not wired to anything.

  Question: what does Settings › Providers look like with every provider collapsed on open, unavailable models hidden,
  and each provider's models in a small searchable field in place of the full-height Models tab?

  Settled by Zach before this prototype (October 26, 2026): nothing is expanded on open, Codex included; unavailable models
  are hidden, not labelled; the model list is a small field that opens a searchable popover like the composer's model
  picker, and the provider card stays compact.

  Variants (?variant=C|A|B, the bottom bar, or the arrow keys):
    C  Today's cards.           The provider cards ADR-0110 gave the page (Zach's P1), four across. Nothing is chosen on
       open, so there is no detail card; choosing a card shows its detail card under them, with Local connection, a
       Models field and Installed client. The Configuration and Models tabs are gone.
    A  Models inside the card.  Each provider is one row (mark, name, status, switch, chevron). Opening it shows the card:
       Local connection, a Models field, Installed client. The Configuration and Models tabs are gone.
    B  Models on the row.        The Models field sits on the collapsed row itself, so models are one press away without
       opening the card. Opening it shows the rest.

  Proposal for Zach to react to: the field lists models to look through and search; choosing what new threads start with
  stays under Agents. The model new threads start with is marked "Agent setting" in the list.

  Zach's picks (October 26, 2026): A, the Models field inside the provider's open row, and a list to browse, not a
  choice. C was drawn from an older checkout that still had the provider cards; asked about it, he answered "It is
  already a list": main's Providers page is already one row per provider, every row starting closed, so what was built
  is A on it. The open row's Models column became the Models field.
  Other params: theme (dark | light), size (1600 | 1280 | 820 | phone), open (codex | claude | ...), menu (provider id).
-->

<title>Sotto: Providers settings, prototype</title>

<style>

  color-scheme: light;

  --r-text: oklch(0.235 0.014 75); --r-muted-fg: oklch(0.5 0.014 75); --r-placeholder: oklch(0.525 0.015 78);
  --r-border: oklch(0.86 0.012 80); --r-input: oklch(0.8 0.016 80); --r-accent: oklch(0.53 0.095 186);
  --r-accent-fg: oklch(0.99 0.003 85); --r-accent-surface: oklch(0.92 0.03 186); --r-update-fg: oklch(0.43 0.08 186);
  --r-error-fg: oklch(0.509494 0.208583 28.513); --r-sidebar: oklch(0.955 0.008 85); --r-sidebar-selected: oklch(0.895 0.028 188);

}
html {
  --tt-font: 'Figtree', ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
  --tt-canvas: var(--r-canvas); --tt-surface: var(--r-surface); --tt-surface-elevated: var(--r-raised);
  --tt-text: var(--r-text); --tt-text-2: color-mix(in oklab, var(--r-text) 55%, var(--r-muted-fg));
  --tt-text-muted: color-mix(in oklab, var(--r-muted-fg) 85%, var(--r-text)); --tt-text-faint: var(--r-placeholder);
  --tt-hairline: var(--r-border); --tt-field-border: var(--r-input); --tt-field: var(--r-surface);
  --tt-accent: var(--r-accent); --tt-activity: var(--r-update-fg); --tt-on-accent: var(--r-accent-fg);
  --tt-activity-wash: color-mix(in srgb, var(--r-accent) 10%, transparent);
  --tt-hover: color-mix(in srgb, var(--r-accent-surface) 70%, transparent); --tt-selected: var(--r-sidebar-selected);
  --tt-track: color-mix(in srgb, var(--r-text) 18%, transparent); --tt-error: var(--r-error-fg); --tt-focus-ring: var(--r-accent);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #1b1b1e; font-family: var(--tt-font); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--tt-focus-ring); outline-offset: 2px; }
svg.ic { display: block; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
svg.pm { display: block; flex: none; fill: currentColor; color: var(--tt-text-2); }
svg.pm[data-p='codex'] { color: var(--tt-provider-codex); } svg.pm[data-p='claude'] { color: var(--tt-provider-claude); }
svg.pm[data-p='grok'] { color: var(--tt-provider-grok); } svg.pm[data-p='devin'] { color: var(--tt-provider-devin); }
svg.pm[data-p='opencode'] { color: var(--tt-provider-opencode); }

.stage { display: flex; justify-content: center; padding: 70px 12px 110px; }
.win { position: relative; width: var(--w); min-height: var(--h); background: var(--tt-canvas); color: var(--tt-text); font-size: 14px; line-height: 1.45; border: 1px solid #000; display: grid; grid-template-columns: 210px minmax(0, 1fr); }
.win[data-size='820'] { grid-template-columns: 170px minmax(0, 1fr); }
.win[data-size='phone'] { grid-template-columns: 1fr; border: 0; }
.side { background: var(--tt-surface); border-right: 1px solid var(--tt-hairline); padding: 54px 10px; display: grid; align-content: start; gap: 2px; }
.win[data-size='phone'] .side { display: none; }
.side span { padding: 8px 12px; border-radius: 8px; color: var(--tt-text-muted); }
.side span[data-on] { background: var(--tt-selected); color: var(--tt-text); }
.page { padding: 44px 40px 60px; min-width: 0; }
.win[data-size='820'] .page { padding: 32px 20px; }
.win[data-size='phone'] .page { padding: 20px 14px; }
.heading h2 { margin: 0; font-size: 20px; font-weight: 600; }
.heading p { margin: 4px 0 18px; color: var(--tt-text-muted); }

/* The provider list: one row each, opened in place. */
.plist { border: 1px solid var(--tt-hairline); border-radius: 14px; background: var(--tt-surface); }
.prow:first-child .prow__bar { border-radius: 13px 13px 0 0; } .prow:last-child:not([data-open]) .prow__bar { border-radius: 0 0 13px 13px; }
.prow { position: relative; } .prow:has([aria-expanded='true'].mfield__trigger) { z-index: 5; }
.prow + .prow { border-top: 1px solid var(--tt-hairline); }
.prow__bar { display: flex; align-items: center; gap: 10px; padding: 0 14px 0 4px; }
.prow[data-open] .prow__bar { background: var(--tt-activity-wash); }
.prow__open { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; padding: 14px 10px; border: 0; background: transparent; text-align: left; border-radius: 10px; }
.prow__open .chev { color: var(--tt-text-muted); transition: transform 160ms ease; }
.prow[data-open] .prow__open .chev { transform: rotate(90deg); }
.prow__name { display: grid; gap: 3px; min-width: 0; }
.prow__name strong { font-size: 15px; font-weight: 600; }
.prow__name small { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tt-text-muted); }
.prow__name small i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.prow__name small[data-s='connected'] { color: var(--tt-activity); }
.prow__name small[data-s='error'] { color: var(--tt-error); }
.prow__ver { margin-left: 4px; color: var(--tt-text-muted); font-size: 12px; font-weight: 400; }
.toggle { flex: none; width: 34px; height: 20px; border-radius: 10px; border: 0; background: var(--tt-track); position: relative; padding: 0; }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--tt-text); transition: left 140ms ease; }
.toggle[aria-checked='true'] { background: var(--tt-accent); }
.toggle[aria-checked='true']::after { left: 17px; background: var(--tt-on-accent); }
.prow__body { padding: 6px 24px 22px 50px; display: grid; gap: 20px; animation: arrive 160ms ease both; }
.win[data-size='phone'] .prow__body, .win[data-size='820'] .prow__body { padding: 6px 16px 18px; }
@keyframes arrive { from { opacity: .5; } to { opacity: 1; } }
.sect { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.sect > div:first-child { flex: 1 1 220px; min-width: 0; }
.sect h4 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
.sect p { margin: 0; color: var(--tt-text-muted); line-height: 1.6; max-width: 34em; }
.btn { min-height: 34px; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--tt-field-border); background: transparent; font-size: 13px; }
.btn--primary { background: var(--tt-accent); color: var(--tt-on-accent); border-color: transparent; font-weight: 600; }
.foot { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--tt-hairline); display: flex; justify-content: space-between; gap: 16px; align-items: center; }
.foot h4 { margin: 0 0 4px; font-size: 14px; } .foot p { margin: 0; color: var(--tt-text-muted); font-size: 13px; max-width: 44em; line-height: 1.6; }
.note { margin: 0; color: var(--tt-text-muted); font-size: 13px; }

/* The Models field: the composer picker's named-field look (New thread dialog). */
.mfield { position: relative; flex: none; }
.mfield__trigger { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 6px 10px 6px 11px; border-radius: 7px; border: 1px solid var(--tt-field-border); background: var(--tt-field); color: var(--tt-text-2); font-size: 13px; white-space: nowrap; }
.mfield__trigger:hover { color: var(--tt-text); }
.mfield__trigger[aria-expanded='true'] { border-color: var(--tt-accent); color: var(--tt-text); }
.mfield__trigger[disabled] { opacity: .55; cursor: default; }
.mfield__trigger b { font-weight: 600; color: var(--tt-text); }
.prow__bar .mfield__trigger { min-height: 30px; padding: 4px 8px 4px 10px; }
.menu { position: absolute; z-index: 30; top: calc(100% + 6px); right: 0; width: min(320px, calc(100vw - 32px)); max-height: 340px; display: flex; flex-direction: column; border: 1px solid var(--tt-field-border); border-radius: 14px; background: var(--tt-surface-elevated); box-shadow: 0 16px 48px var(--tt-shadow-color); overflow: hidden; }

.menu__search { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px 0 12px; border-bottom: 1px solid var(--tt-hairline); color: var(--tt-text-muted); flex: none; }
.menu__search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--tt-text); font-size: 13px; }
.menu__search input::placeholder { color: var(--tt-text-faint); }
.menu__search button { display: grid; place-items: center; padding: 5px; border: 0; border-radius: 6px; background: transparent; color: var(--tt-text-muted); }
.menu__list { overflow-y: auto; padding: 4px; }
.menu__row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 8px; }
.menu__row:focus-visible, .menu__row:hover { background: var(--tt-hover); outline: 0; }
.menu__row span { display: grid; gap: 2px; min-width: 0; }
.menu__row b { font-weight: 500; font-size: 13px; }
.menu__row small { color: var(--tt-text-muted); font-size: 11.5px; }
.menu__tag { flex: none; font-size: 11px; color: var(--tt-activity); border: 1px solid color-mix(in srgb, var(--r-accent) 45%, var(--r-input)); border-radius: 999px; padding: 1px 7px; }
.menu__group { margin: 8px 10px 2px; color: var(--tt-text-muted); font-size: 11px; display: flex; justify-content: space-between; }
.menu__empty { margin: 10px; color: var(--tt-text-muted); font-size: 13px; }
.menu__note { flex: none; margin: 0; padding: 9px 12px; border-top: 1px solid var(--tt-hairline); color: var(--tt-text-muted); font-size: 12px; }
.win[data-size='phone'] .menu { position: fixed; left: 12px; right: 12px; top: auto; bottom: 120px; width: auto; }

/* Variant C: today's provider cards (ADR-0110, P1) and a detail card under them once one is chosen. */
html { --tt-card: var(--r-raised); --tt-card-selected: color-mix(in srgb, var(--r-accent-surface) 55%, var(--r-raised)); }
html[data-theme='light'] { --tt-card: color-mix(in srgb, var(--r-text) 4%, var(--r-canvas)); }
.cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.win[data-size='820'] .cards, .win[data-size='phone'] .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pcard { position: relative; border: 1px solid transparent; border-radius: 12px; background: var(--tt-card); }
.pcard[data-on] { border-color: var(--tt-accent); background: var(--tt-card-selected); box-shadow: 0 0 0 1px var(--tt-accent); }
.pcard__sel { display: grid; grid-template-columns: auto minmax(0, 1fr) 36px; grid-template-areas: 'mark name .' 'status status status'; align-items: center; gap: 6px 8px; width: 100%; padding: 13px 12px; border: 0; border-radius: 11px; background: transparent; text-align: left; }
.pcard__sel svg { grid-area: mark; } .pcard__sel strong { grid-area: name; font-size: 14px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.pcard__sel small { grid-area: status; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tt-text-muted); }
.pcard__sel small i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.pcard__sel small[data-s='connected'] { color: var(--tt-activity); }
.pcard .toggle { position: absolute; top: 13px; right: 12px; border-radius: 5px; } .pcard .toggle::after { border-radius: 3px; }
.dcard { margin-top: 18px; padding: 0 20px 6px; border-radius: 14px; background: var(--tt-card); animation: arrive 160ms ease both; }
.dcard__head { display: flex; align-items: center; gap: 11px; padding: 18px 0 14px; border-bottom: 1px solid var(--tt-hairline); }
.dcard__head h3 { margin: 0; font-size: 18px; font-weight: 600; }
.dcard__head .ver { padding: 1px 7px; border-radius: 4px; background: var(--r-canvas); color: var(--tt-text-muted); font-size: 12px; }
.dcard__head .icb { margin-left: auto; display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 6px; background: transparent; color: var(--tt-text-muted); }
.dcard .prow__body { padding: 20px 0 16px; }
.cards-hint { margin: 14px 2px 0; color: var(--tt-text-muted); font-size: 13px; }

/* Prototype chrome. */
.bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 50; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 8px; max-width: calc(100vw - 16px); background: #111; color: #eee; border: 1px solid #333; border-radius: 12px; font: 12px system-ui, sans-serif; }
.bar fieldset { display: flex; gap: 3px; border: 0; margin: 0; padding: 0 6px 0 0; align-items: center; }
.bar legend { float: left; padding: 0 4px 0 0; color: #999; }
.bar button { padding: 5px 9px; border-radius: 7px; border: 1px solid #333; background: #1d1d1d; color: #ddd; }
.bar button[aria-pressed='true'] { background: #2a6f69; border-color: #2a6f69; color: #fff; }
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 40; padding: 10px 14px; background: #111; color: #ccc; font: 12.5px/1.45 system-ui, sans-serif; border-bottom: 1px solid #333; }
.top b { color: #fff; }
.readout { color: #8fd; }
@media (max-width: 700px) { .stage { padding: 96px 0 160px; } .top { font-size: 11.5px; } }
@media (prefers-reduced-motion: reduce) { .prow__body { animation: none; } .prow__open .chev, .toggle::after { transition: none; } }
</style>
</head>

const state = {

const SIZES = { 1600: [1600 - 210, 1000], 1280: [1280, 800], 820: [820, 560], phone: [390, 760] }

const mark = (p, size = 20) => `<svg class="pm" data-p="${p}" width="${size}" height="${size}" viewBox="${MARKS[p].viewBox}" aria-hidden="true"><path d="${MARKS[p].path}"/></svg>`
const ic = { chev: '<path d="m9 6 6 6-6 6"/>', down: '<path d="m6 9 6 6 6-6"/>', search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>', x: '<path d="M18 6 6 18M6 6l12 12"/>', refresh: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>' }
const icon = (n, s = 15) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true">${ic[n]}</svg>`
const usable = p => MODELS[p].filter(m => m.ready)
const statusLabel = p => ({ connected: 'Connected', disabled: 'Disabled', error: 'Needs attention' })[STATUS[p]]

function field(p) {
  const list = usable(p)
  const connected = STATUS[p] === 'connected'
  const open = state.menu === p
  const text = !connected ? 'Connect to load models' : list.length ? `<b>${list.length}</b> model${list.length === 1 ? '' : 's'}` : 'No models'
  return `<div class="mfield"><button type="button" class="mfield__trigger" data-menu="${p}" aria-haspopup="dialog" aria-expanded="${open}" aria-label="${LABELS[p]} models, ${connected ? list.length : 0}" ${connected && list.length ? '' : 'disabled'}>${text}${icon('down', 12)}</button>${open ? menu(p) : ''}</div>`
}
function menu(p) {
  const q = state.query.toLowerCase().split(/\s+/).filter(Boolean)
  const all = usable(p).filter(m => q.every(w => `${m.name} ${m.source ?? ''}`.toLowerCase().includes(w)))
  const row = m => `<div class="menu__row" tabindex="-1" role="listitem"><span><b>${esc(m.name)}</b>${m.efforts ? `<small>${m.efforts}</small>` : ''}</span>${m.agent ? '<span class="menu__tag">Agent setting</span>' : m.recommended ? '<small>Recommended</small>' : ''}</div>`
  let body
  if (!all.length) body = '<p class="menu__empty">No matching models.</p>'
  else if (all.some(m => m.source)) {
    const groups = {}; for (const m of all) (groups[m.source] ??= []).push(m)
    body = Object.entries(groups).map(([s, ms]) => `<p class="menu__group" aria-hidden="true">${esc(s)}<span>${ms.length}</span></p>${ms.map(row).join('')}`).join('')
  } else body = all.map(row).join('')
  return `<div class="menu" role="dialog" aria-label="${LABELS[p]} models">
    <div class="menu__search">${icon('search')}<input id="q" aria-label="Search models" placeholder="Search ${LABELS[p]} models" value="${esc(state.query)}"><button type="button" data-close aria-label="Close models">${icon('x')}</button></div>
    <div class="menu__list" role="list">${body}</div>
    <p class="menu__note">Choose what new threads start with under Agents.</p></div>`
}
function body(p) {
  const connected = STATUS[p] === 'connected'
  const conn = p === 'devin' ? 'Install Devin CLI and run devin auth login before connecting.' : p === 'muse' ? 'Uses your Muse sign-in on this computer. Run muse login in a terminal before connecting.' : p === 'opencode' ? 'Sotto runs its own OpenCode, with its own folder and its own sign-ins.' : `Uses your ${CLIENT[p]} sign-in on this computer.`
  return `<div class="prow__body">
    <div class="sect"><div><h4>Local connection</h4><p>${conn}</p></div><button type="button" class="btn ${connected ? '' : 'btn--primary'}">${connected ? 'Disconnect' : 'Connect'}</button></div>
    ${state.variant !== 'B' ? `<div class="sect"><div><h4>Models</h4><p>${connected ? `The models ${CLIENT[p]} offers you now.` : `Connect ${LABELS[p]} to load its models.`}</p></div>${field(p)}</div>` : ''}
    <div class="sect"><div><h4>Installed client</h4><p>${VERSIONS[p] ? `${VERSIONS[p]} is installed, and that is what is published.` : 'Connect this provider to read its installed version.'}</p></div><button type="button" class="btn">Check again</button></div>
  </div>`
}

  win.dataset.size = state.size

    </div>`
  }).join('')
  const cards = Object.keys(LABELS).map(p => `<div class="pcard" ${state.open === p ? 'data-on' : ''}><button type="button" class="pcard__sel" data-open-p="${p}" aria-expanded="${state.open === p}" aria-label="${LABELS[p]}, ${statusLabel(p)}">${mark(p, 21)}<strong>${LABELS[p]}</strong><small data-s="${STATUS[p]}"><i></i>${statusLabel(p)}</small></button><button type="button" class="toggle" role="switch" aria-checked="${STATUS[p] !== 'disabled'}" aria-label="Enable ${LABELS[p]}"></button></div>`).join('')
  const detail = state.open ? `<section class="dcard" aria-label="${LABELS[state.open]} settings"><header class="dcard__head">${mark(state.open, 21)}<h3>${LABELS[state.open]}</h3>${VERSIONS[state.open] ? `<span class="ver">${VERSIONS[state.open]}</span>` : ''}<button type="button" class="icb" aria-label="Refresh ${LABELS[state.open]}">${icon('refresh')}</button></header>${body(state.open)}</section>` : ''

  const bar = document.getElementById('bar')
  const group = (legend, key, values) => `<fieldset><legend>${legend}</legend>${values.map(([v, l]) => `<button type="button" data-k="${key}" data-v="${v}" aria-pressed="${state[key] === v}">${l}</button>`).join('')}</fieldset>`
  bar.innerHTML = group('Variant', 'variant', [['C', "C · today's cards"], ['A', 'A · list'], ['B', 'B · list, on row']]) + group('Theme', 'theme', [['dark', 'Dark'], ['light', 'Light']]) + group('Size', 'size', [['1600', '1600'], ['1280', '1280'], ['820', '820'], ['phone', 'Phone']])
  const q = document.getElementById('q')
  if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length) }
}
document.addEventListener('click', e => {
  const t = e.target.closest('button, .menu')
  if (!t) { if (state.menu) { state.menu = null; state.query = ''; render() } return }
  if (t.classList.contains('menu') && !e.target.closest('[data-close]')) return
  if (t.dataset.k) { state[t.dataset.k] = t.dataset.v; state.menu = null; state.query = '' }
  else if (t.dataset.openP) { state.open = state.open === t.dataset.openP ? null : t.dataset.openP; state.menu = null }
  else if (t.dataset.menu) { state.menu = state.menu === t.dataset.menu ? null : t.dataset.menu; state.query = '' }
  else if (t.dataset.close !== undefined) { const p = state.menu; state.menu = null; state.query = ''; render(); document.querySelector(`[data-menu="${p}"]`)?.focus(); return }
  else if (t.getAttribute('role') === 'switch') { t.setAttribute('aria-checked', t.getAttribute('aria-checked') !== 'true'); return }
  else return
  render()
})
document.addEventListener('input', e => { if (e.target.id === 'q') { state.query = e.target.value; render() } })
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.menu) { e.preventDefault(); const p = state.menu; if (state.query) state.query = ''; else state.menu = null; render(); if (!state.menu) document.querySelector(`[data-menu="${p}"]`)?.focus(); return }
  if (e.key === 'ArrowDown' && state.menu) { e.preventDefault(); const rows = [...document.querySelectorAll('.menu__row')]; const i = rows.indexOf(document.activeElement); rows[Math.min(rows.length - 1, i + 1)]?.focus(); return }
  if (e.key === 'ArrowUp' && state.menu) { e.preventDefault(); const rows = [...document.querySelectorAll('.menu__row')]; const i = rows.indexOf(document.activeElement); if (i <= 0) document.getElementById('q')?.focus(); else rows[i - 1].focus(); return }
  if (!state.menu && document.activeElement?.tagName !== 'INPUT' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { const vs = ['C', 'A', 'B']; state.variant = vs[(vs.indexOf(state.variant) + (e.key === 'ArrowRight' ? 1 : 2)) % 3]; render() }
})
render()
</script>
</body>
