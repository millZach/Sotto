  Also ?state=ready|adding|large|total|many|images|host|drop, ?theme=light and ?width=820.
  Drag a real file over the composer, or press the paperclip, to try the limits (8 files, 10 MB each, 20 MB in all).
  Styles follow src/renderer/src/agents/screenshots.css, threads.css and rich-messages.css; colours are a small
  dark and light set of --tt-* tokens in the Sotto default palette. Figtree (OFL-1.1) is inlined from
  src/shared/fonts/figtree-latin.woff2, so the file makes no network requests.
-->

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; padding-bottom: calc(150px + env(safe-area-inset-bottom)); background: var(--tt-canvas); color: var(--tt-text); font: 15px/1.5 Figtree, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
button, textarea { font: inherit; }
:focus-visible { outline: 2px solid var(--tt-focus-ring); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
svg { display: block; flex: none; }

/* Prototype controls */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 14px; border-bottom: 1px solid var(--tt-hairline); background: var(--tt-surface); font-size: 13px; }
.bar b { font-weight: 600; }
.bar__q { flex-basis: 100%; margin: 0; color: var(--tt-text-2); line-height: 1.45; }
.group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.group > span { color: var(--tt-text-muted); }

<body data-width="full">
<div class="bar" aria-label="Prototype controls">
  <b>Attach any file</b>
  <div class="group"><span id="state-label">State</span>

  <div class="group"><span id="theme-label">Theme</span>

      <button type="button" data-theme-pick="light" aria-pressed="false">Light</button></div></div>
  <div class="group"><span id="width-label">Width</span>
    <div class="seg" id="widths" role="group" aria-labelledby="width-label">
      <button type="button" data-width-pick="full" aria-pressed="true">Full</button>
      <button type="button" data-width-pick="820" aria-pressed="false">820 px</button></div></div>
  <button type="button" class="plain-btn" id="reset">Reset the draft</button>
  <p class="scenario" id="scenario"></p>
</div>

<main class="stage" aria-label="Mock Threads pane">
  <header class="head">
    <span class="mark" aria-hidden="true">C</span>
    <h2>Q3 numbers check</h2>
    <span class="crumb"><span>dashboard</span><span class="tag" id="host-tag" hidden>forge</span></span>
  </header>

  <section class="transcript" aria-label="Transcript">
    <article class="msg" data-role="user"><p class="msg__text">The Q3 numbers in the dashboard look off. Can you take a look?</p></article>
    <article class="msg" data-role="assistant"><p class="who">Codex</p>
      <p class="msg__text">I can. Send me the quarterly report and anything from last night's deploy, and I will compare them.</p></article>
    <div class="proto-tag"><span>After sending</span></div>
    <div id="sent"></div>
  </section>

  <section class="compose" aria-label="Composer">
    <div class="proto-tag proto-tag--left"><span>In the composer</span></div>
    <div class="prompt" id="prompt">
      <textarea class="editor" id="editor" aria-label="Message to Codex" placeholder="Ask Codex anything"></textarea>
      <div id="attach"></div>

      <div class="footer">

          <button type="button" class="chip" aria-label="Effort: High">High</button>
        </div>
        <button type="button" class="send" id="send" aria-label="Send" title="Send"></button>
      </div>
      <div id="message"></div>
      <div class="drop" role="status"><span id="drop-text"></span></div>
    </div>
    <div id="note"></div>
  </section>
</main>

<nav class="vbar" aria-label="Variants">

    <button type="button" data-variant-pick="B">B · Pills</button>
    <button type="button" data-variant-pick="C">C · List</button>
  </div>
  <p id="variant-note"></p>
</nav>

<script>
const PATHS = {

// A stand-in screenshot: a dark app window with a chart, drawn from the shot tokens.
const SHOT = label => `<svg class="shot" viewBox="0 0 208 140" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${label}"><rect width="208" height="140" style="fill:var(--tt-shot-bg)"/><rect width="208" height="16" style="fill:var(--tt-shot-bar)"/><rect x="10" y="28" width="70" height="6" rx="3" style="fill:var(--tt-shot-line)"/><rect x="10" y="40" width="46" height="5" rx="2.5" style="fill:var(--tt-shot-line)"/><path d="M14 118 L48 92 L78 100 L112 64 L142 78 L194 38" fill="none" stroke-width="3" style="stroke:var(--tt-shot-accent)"/><rect x="134" y="26" width="62" height="18" rx="4" style="fill:var(--tt-shot-warn)"/><rect x="10" y="126" width="188" height="1.5" style="fill:var(--tt-shot-line)"/></svg>`

const KB = 1024, MB = 1024 * 1024
const BASE = [
  { id: 'p', kind: 'image', name: 'photo.png', size: 1.1 * MB },
  { id: 'f1', kind: 'file', name: 'quarterly-report.pdf', size: 2.4 * MB },
  { id: 'f2', kind: 'file', name: 'server.log', size: 180 * KB },
  { id: 'f3', kind: 'file', name: 'build-output.zip', size: 8.7 * MB },
]
const TEXT = "Here is the report, last night's deploy log and the build output. Section 3 does not match what the log says shipped."
const LIMIT = { count: 8, each: 10 * MB, total: 20 * MB }

const STATES = {
  ready: { label: 'Ready', scenario: 'The draft holds one screenshot and three files.' },
  adding: { label: 'Adding', scenario: 'The user chose three files a moment ago. Their chips appear once each is staged on the thread’s computer.', status: 'Adding files...', only: 'image', busy: true },
  large: { label: 'One too large', scenario: 'The user chose screen-recording.mov (64 MB).', alert: 'Each file must be 10 MB or smaller. Nothing was attached. Choose a smaller file.',
    note: 'Another limit to consider: 25 MB a file. “Each file must be 25 MB or smaller. Nothing was attached. Choose a smaller file.” The 20 MB total would have to rise with it, or one 25 MB file could never be sent.' },
  total: { label: 'Total too large', scenario: 'The draft holds 12.4 MB and the user chose dataset.csv (9.2 MB).', alert: 'Attachments must total 20 MB or less. Nothing was attached. Remove a file or choose smaller ones.' },
  many: { label: 'Too many', scenario: 'The draft holds four and the user chose six more.', alert: 'Attach up to 8 files at a time.',
    note: 'This one does not say whether anything was lost. A fuller version: “Attach up to 8 files at a time. Nothing was attached.”' },
  images: { label: 'No images', scenario: 'The thread’s model reads text only, and photo.png is in the draft. Send waits until one of them changes.', alert: 'This model does not read images. Choose a model with image support, or remove photo.png.', model: 'gpt-oss-120b', flag: 'image', block: true },
  host: { label: 'Host too old', scenario: 'This thread runs on forge, whose Sotto only keeps images. The user chose the three files; the screenshot was already attached.', alert: 'This host cannot keep files yet. Update Sotto there, then attach them again. Nothing was attached.', only: 'image', host: true },
  drop: { label: 'Drag over', scenario: 'A file is dragged over the composer. Drag a real one here to try it.', drop: true },
}
const VARIANTS = {
  A: 'Same tiles: every attachment is an 88 px tile; a file shows its type icon and extension where a picture would be, with its name and size under it.',
  B: 'Pills: screenshots stay tiles in their own row; files become one-line pills, the name cut in the middle so the extension always shows.',
  C: 'List: one row each under the text, a small thumbnail or type icon at the start, then the name, type and size.',
}

const params = new URLSearchParams(location.search)
const pick = (value, allowed, fallback) => allowed.includes(value) ? value : fallback
const ui = {
  variant: pick((params.get('variant') || '').toUpperCase(), ['A', 'B', 'C'], 'A'),
  state: pick(params.get('state'), Object.keys(STATES), 'ready'),
  theme: pick(params.get('theme'), ['dark', 'light'], 'dark'),
  width: pick(params.get('width'), ['full', '820'], 'full'),
  draft: BASE.slice(),
  sent: [{ text: TEXT, items: BASE.slice() }],
  dragging: false,
  live: null,
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
// The same rule as formatAttachmentSize in MessageContent.tsx.
function size(bytes) {
  if (bytes < 1024) return `${Math.round(bytes)} B`
  if (bytes < MB) return `${Math.max(1, Math.round(bytes / 1024))} KB`
  const mb = bytes / MB
  return `${mb < 10 ? mb.toFixed(1) : Math.round(mb)} MB`
}
// The type a person knows a file by is its extension; a MIME type would call a .log "PLAIN" and a binary "OCTET-STREAM".
const ext = name => { const m = /\.([^./]+)$/.exec(name); return m ? m[1].slice(0, 5).toUpperCase() : 'FILE' }
function kindIcon(item) {
  if (item.kind === 'image') return 'image'
  const e = ext(item.name).toLowerCase()
  if (['zip', 'gz', 'tgz', 'tar', '7z', 'rar', 'xz'].includes(e)) return 'archive'
  if (['ts', 'tsx', 'js', 'mjs', 'json', 'py', 'rs', 'go', 'sh', 'ps1', 'swift', 'kt', 'css', 'html', 'yml', 'yaml'].includes(e)) return 'code'
  if (['pdf', 'txt', 'md', 'log', 'csv', 'doc', 'docx', 'rtf'].includes(e)) return 'text'
  return 'file'
}
const details = item => `${ext(item.name)} · ${size(item.size)}`
const picture = item => item.url ? `<img src="${item.url}" alt="${esc(item.name)}">` : SHOT(esc(item.name))
/** "build-output.zip" as a head that may be cut and a tail that keeps the extension. */
function splitName(name) {
  const dot = name.lastIndexOf('.')
  const keep = dot > 0 ? Math.min(name.length, name.length - dot + 4) : Math.min(name.length, 6)
  return [name.slice(0, name.length - keep), name.slice(name.length - keep)]
}

/* Composer chips */
function removeButton(item, cls, disabled) {
  return `<button type="button" class="${cls}" data-remove="${item.id}" aria-label="Remove ${esc(item.name)}" title="Remove ${esc(item.name)}"${disabled ? ' disabled' : ''}>${icon('x', 12)}</button>`
}
function tile(item, state) {
  const flag = state.flag === item.kind ? ' data-flag' : ''
  const pic = item.kind === 'image'
    ? `<span class="tile__pic">${picture(item)}</span>`
    : `<span class="tile__pic tile__type" aria-hidden="true">${icon(kindIcon(item), 22)}<b>${esc(ext(item.name))}</b></span>`
  const sizeLine = item.kind === 'image' ? '' : `<span class="tile__size">${size(item.size)}</span>`
  return `<li class="tile"${flag}>${pic}<span class="tile__name" title="${esc(item.name)}">${esc(item.name)}</span>${sizeLine}${removeButton(item, 'x', state.busy)}</li>`
}
function pill(item, state) {
  const [head, tail] = splitName(item.name)
  return `<li class="pill">${icon(kindIcon(item), 15)}<span class="pill__name" title="${esc(item.name)}"><span class="pill__head">${esc(head)}</span><span class="pill__tail">${esc(tail)}</span></span><span class="pill__size">${size(item.size)}</span>${removeButton(item, 'xi', state.busy)}</li>`
}
function row(item, state) {
  const flag = state.flag === item.kind ? ' data-flag' : ''
  const lead = item.kind === 'image' ? `<span class="row__lead">${picture(item)}</span>` : `<span class="row__lead">${icon(kindIcon(item), 15)}</span>`
  return `<li class="row"${flag}>${lead}<span class="row__name" title="${esc(item.name)}">${esc(item.name)}</span><span class="row__meta">${details(item)}</span>${removeButton(item, 'xi', state.busy)}</li>`
}
function composerChips(items, state) {
  if (!items.length) return ''
  const images = items.filter(i => i.kind === 'image'), files = items.filter(i => i.kind !== 'image')
  if (ui.variant === 'A') return `<ul class="tiles" aria-label="Attached files">${items.map(i => tile(i, state)).join('')}</ul>`
  if (ui.variant === 'B') return (images.length ? `<ul class="tiles" aria-label="Attached images">${images.map(i => tile(i, state)).join('')}</ul>` : '')
    + (files.length ? `<ul class="pills" aria-label="Attached files">${files.map(i => pill(i, state)).join('')}</ul>` : '')
  return `<ul class="rows" aria-label="Attached files">${items.map(i => row(i, state)).join('')}</ul>`
}

/* Sent message */
function sentImage(item) {
  return `<figure class="ra ra--image" role="listitem"><button type="button" class="ra__frame" aria-label="Open ${esc(item.name)}" title="Open image">${picture(item)}</button>
    <figcaption><span class="ra__name" title="${esc(item.name)}">${esc(item.name)}</span><span class="ra__meta">${details(item)}</span></figcaption></figure>`
}
function sentAttachments(items) {
  if (!items.length) return ''
  const images = items.filter(i => i.kind === 'image'), files = items.filter(i => i.kind !== 'image')
  const label = items.length === 1 ? 'Attachment' : `${items.length} attachments`
  if (ui.variant === 'A') return `<div class="ra-wrap"><div class="ra-list" role="list" aria-label="${label}">${items.map(item => item.kind === 'image' ? sentImage(item)
    : `<figure class="ra ra--tile" role="listitem"><div class="ra__frame" aria-hidden="true">${icon(kindIcon(item), 34)}<b>${esc(ext(item.name))}</b></div>
      <figcaption><span class="ra__name" title="${esc(item.name)}">${esc(item.name)}</span><span class="ra__meta">${details(item)}</span></figcaption></figure>`).join('')}</div></div>`
  const imageList = images.length ? `<div class="ra-list" role="list" aria-label="${images.length === 1 ? 'Image' : `${images.length} images`}">${images.map(sentImage).join('')}</div>` : ''
  const fileLabel = files.length === 1 ? 'File' : `${files.length} files`
  if (ui.variant === 'B') return `<div class="ra-wrap">${imageList}${files.length ? `<div class="ra-list" role="list" aria-label="${fileLabel}">${files.map(item =>
    `<div class="ra ra--file" role="listitem">${icon(kindIcon(item), 16)}<span class="ra__text"><span class="ra__name" title="${esc(item.name)}">${esc(item.name)}</span><span class="ra__meta">${details(item)}</span></span></div>`).join('')}</div>` : ''}</div>`
  return `<div class="ra-wrap">${imageList}${files.length ? `<ul class="ra-rows" aria-label="${fileLabel}">${files.map(item =>
    `<li class="ra">${icon(kindIcon(item), 16)}<span class="ra__name" title="${esc(item.name)}">${esc(item.name)}</span><span class="ra__meta">${details(item)}</span></li>`).join('')}</ul>` : ''}</div>`
}

/* Render */
const $ = id => document.getElementById(id)
function currentState() {
  const base = STATES[ui.state]
  return ui.live ? { ...base, alert: ui.live, note: null, scenario: 'From the files you just chose.' } : base
}
function shownDraft(state) { return state.only ? ui.draft.filter(i => i.kind === state.only) : ui.draft }
function render(focusAfter) {
  const state = currentState()
  document.documentElement.dataset.theme = ui.theme
  document.body.dataset.width = ui.width
  for (const b of document.querySelectorAll('[data-theme-pick]')) b.setAttribute('aria-pressed', String(b.dataset.themePick === ui.theme))
  for (const b of document.querySelectorAll('[data-width-pick]')) b.setAttribute('aria-pressed', String(b.dataset.widthPick === ui.width))
  for (const b of document.querySelectorAll('[data-variant-pick]')) b.setAttribute('aria-pressed', String(b.dataset.variantPick === ui.variant))
  for (const b of document.querySelectorAll('[data-state-pick]')) b.setAttribute('aria-pressed', String(b.dataset.statePick === ui.state && !ui.live))
  $('variant-note').textContent = VARIANTS[ui.variant]
  $('scenario').textContent = state.scenario
  $('host-tag').hidden = !state.host
  const model = state.model || 'GPT-5.5'
  $('model').textContent = model; $('model').setAttribute('aria-label', `Model: ${model}`)

  $('sent').innerHTML = ui.sent.map(m => `<article class="msg" data-role="user">${m.text ? `<p class="msg__text">${esc(m.text)}</p>` : ''}${sentAttachments(m.items)}</article>`).join('')

  const items = shownDraft(state)
  $('attach').innerHTML = composerChips(items, state)
  $('clip').disabled = Boolean(state.busy)
  $('send').disabled = Boolean(state.busy || state.block) || (!$('editor').value.trim() && !items.length)
  $('message').innerHTML = state.status ? `<p class="status" role="status">${state.status}</p>` : state.alert ? `<p class="alert" role="alert">${esc(state.alert)}</p>` : ''
  $('note').innerHTML = state.note ? `<p class="pnote"><b>Prototype note.</b> ${esc(state.note)}</p>` : ''
  const dropping = state.drop || ui.dragging
  $('prompt').toggleAttribute('data-drop', Boolean(dropping))
  $('drop-text').innerHTML = dropping ? `${icon('drop', 16)}Drop to attach` : ''

  const q = new URLSearchParams({ variant: ui.variant, state: ui.state })
  if (ui.theme !== 'dark') q.set('theme', ui.theme)
  if (ui.width !== 'full') q.set('width', ui.width)
  history.replaceState(null, '', `${location.pathname}?${q}`)
  if (focusAfter) focusAfter()
}

/* Adding real files: the same checks, in the same order, as ScreenshotInput.add, with files of any type. */
function addFiles(files) {
  if (!files.length) return
  ui.live = null
  const state = currentState()
  const current = shownDraft(state)
  if (state.host && files.some(f => !f.type.startsWith('image/'))) { ui.state = 'host'; render(); return }
  if (files.length + current.length > LIMIT.count) ui.live = `Attach up to ${LIMIT.count} files at a time.`
  else if (files.some(f => f.size > LIMIT.each)) ui.live = 'Each file must be 10 MB or smaller. Nothing was attached. Choose a smaller file.'
  else if (current.reduce((s, i) => s + i.size, 0) + files.reduce((s, f) => s + f.size, 0) > LIMIT.total) ui.live = 'Attachments must total 20 MB or less. Nothing was attached. Remove a file or choose smaller ones.'
  else {
    if (!['images', 'host'].includes(ui.state)) ui.state = 'ready'
    for (const f of files) {
      const image = ['image/png', 'image/jpeg', 'image/gif', 'image/webp'].includes(f.type)
      ui.draft.push({ id: `u${Math.random().toString(36).slice(2)}`, kind: image ? 'image' : 'file', name: f.name || 'Attachment', size: f.size, url: image ? URL.createObjectURL(f) : null })
    }
  }
  render()
}

/* Wiring */
$('states').innerHTML = Object.entries(STATES).map(([key, s]) => `<button type="button" data-state-pick="${key}" aria-pressed="false">${s.label}</button>`).join('')
$('clip').innerHTML = icon('paperclip', 16)
$('send').innerHTML = icon('up', 16)
$('editor').value = TEXT
document.addEventListener('click', event => {
  const b = event.target.closest('button')
  if (!b) return
  if (b.dataset.statePick) { ui.state = b.dataset.statePick; ui.live = null; render() }
  else if (b.dataset.themePick) { ui.theme = b.dataset.themePick; render() }
  else if (b.dataset.widthPick) { ui.width = b.dataset.widthPick; render() }
  else if (b.dataset.variantPick) { ui.variant = b.dataset.variantPick; render() }
  else if (b.dataset.remove) {
    const buttons = [...document.querySelectorAll('#attach [data-remove]')]
    const at = buttons.indexOf(b)
    ui.draft = ui.draft.filter(i => i.id !== b.dataset.remove)
    ui.live = null
    // Focus stays in the row: the next remove button, else the one before, else the paperclip.
    render(() => { const next = [...document.querySelectorAll('#attach [data-remove]')]; (next[at] || next[at - 1] || $('clip')).focus() })
  }
})
$('reset').addEventListener('click', () => {
  ui.draft = BASE.slice(); ui.sent = [{ text: TEXT, items: BASE.slice() }]; ui.live = null; ui.state = 'ready'; $('editor').value = TEXT; fit(); render()
})
$('clip').addEventListener('click', () => $('picker').click())
$('picker').addEventListener('change', event => { const files = [...event.target.files]; event.target.value = ''; addFiles(files) })
function fit() { const e = $('editor'); e.style.height = 'auto'; e.style.height = `${Math.min(Math.max(e.scrollHeight, 74), 220)}px` }
$('editor').addEventListener('input', () => { fit(); render() })
addEventListener('resize', fit)
$('send').addEventListener('click', () => {
  const state = currentState()
  ui.sent.push({ text: $('editor').value.trim(), items: shownDraft(state).slice() })
  ui.draft = []; ui.live = null; ui.state = 'ready'; $('editor').value = ''; fit()
  render(() => { $('editor').focus(); document.querySelector('#sent .msg:last-child')?.scrollIntoView({ block: 'nearest' }) })
})
let depth = 0
const prompt = $('prompt')
const hasFiles = event => [...(event.dataTransfer?.types || [])].includes('Files')
prompt.addEventListener('dragenter', event => { if (!hasFiles(event)) return; event.preventDefault(); depth += 1; if (!ui.dragging) { ui.dragging = true; render() } })
prompt.addEventListener('dragover', event => { if (hasFiles(event)) event.preventDefault() })
prompt.addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth && ui.dragging) { ui.dragging = false; render() } })
prompt.addEventListener('drop', event => {
  if (!event.dataTransfer?.files.length) return
  event.preventDefault(); depth = 0; ui.dragging = false
  if (ui.state === 'drop') ui.state = 'ready'
  addFiles([...event.dataTransfer.files])
})
prompt.addEventListener('paste', event => {
  const files = [...event.clipboardData.items].filter(i => i.kind === 'file').map(i => i.getAsFile()).filter(Boolean)
  if (files.length) { event.preventDefault(); addFiles(files) }
})
render()
fit()
document.fonts?.ready.then(fit)
</script>
</body>
</html>
