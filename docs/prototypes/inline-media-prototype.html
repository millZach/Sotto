<!doctype html>
<!--
  PROTOTYPE, throwaway. Not shipped, not tested, not wired to anything.

  Zach's ask (October 31, 2026): show images and videos inside a thread and in Watcher — screenshots an agent takes or
  reads, images it generates, screen recordings and GIFs, and his own attachments full size — let him mark any image
  up (arrows, circles, boxes, pen, notes) and send the marked copy back as his reply while the original stays, let an
  agent place callouts on an image, and play an ASCII scene while an image is being generated. Desktop, iPhone and the
  unfolded Duo (pen) together. It must not slow Sotto down.

  Views (pills at the top): Thread, Watcher, Mark up, iPhone, Duo unfolded, Image generating, Providers.
  Variants (bar at the bottom, or the left and right arrow keys):
    Thread, Watcher, iPhone, Duo:   ?layout=A Reading width · B Tiles · C Lead and strip
    Image generating:               ?scene=1 Denoise · 2 Owl at the easel · 3 Loom
  The meter at the bottom right counts what the page holds right now, to show the performance rules at work:
  media load only near the screen and unload when far from it, a video never plays off screen and never autoplays,
  and the ASCII scene draws nothing once it is off screen or finished.

  Picked by Zach on October 31, 2026: layout B (Tiles), scene 2 (Owl at the easel), an Owl feature first, and all four
  sources (Sotto's browser shots, generated images, pictures in tool results, image and video files an agent writes).
  In a tile the owl scene uses a coarser grid, so its characters stay readable at 208x140.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTOTYPE · Sotto inline media and markup</title>
<style>
:root {
  color-scheme: dark;
  --tt-canvas: oklch(0.115 0.008 265);
  --tt-field: oklch(0.145 0.008 265);
  --tt-surface-elevated: oklch(0.185 0.008 265);
  --tt-surface-sunken: oklch(0.1 0.008 265);
  --tt-bubble: oklch(0.205 0.014 265);
  --tt-text: oklch(0.985 0.005 280);
  --tt-text-2: color-mix(in oklab, oklch(0.985 0.005 280) 55%, oklch(0.72 0.014 265));
  --tt-text-muted: color-mix(in oklab, oklch(0.72 0.014 265) 85%, oklch(0.985 0.005 280));
  --tt-hairline: oklch(0.305 0.02 265);
  --tt-border-faint: oklch(0.26 0.016 265);
  --tt-accent: oklch(0.714 0.104 183);
  --tt-on-accent: oklch(0.16 0.02 183);
  --tt-danger: oklch(0.7 0.19 25);
  --tt-warning: oklch(0.83 0.15 82);
  --tt-success: oklch(0.78 0.14 155);
  --tt-hover: color-mix(in srgb, oklch(0.32 0.05 185) 70%, transparent);
  --tt-scrim: rgb(0 0 0 / 82%);
  --tt-shadow-color: rgb(0 0 0 / 70%);
  --tt-font: Figtree, ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
  --tt-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --fade: 160ms;
}
:root[data-theme='light'] {
  color-scheme: light;
  --tt-canvas: oklch(0.978 0.004 85);
  --tt-field: oklch(0.99 0.003 85);
  --tt-surface-elevated: oklch(0.99 0.003 85);
  --tt-surface-sunken: oklch(0.945 0.006 85);
  --tt-bubble: oklch(0.945 0.007 85);
  --tt-text: oklch(0.235 0.014 75);
  --tt-text-2: oklch(0.36 0.014 75);
  --tt-text-muted: oklch(0.5 0.014 75);
  --tt-hairline: oklch(0.86 0.012 80);
  --tt-border-faint: oklch(0.9 0.01 80);
  --tt-accent: oklch(0.5 0.12 200);
  --tt-on-accent: oklch(0.99 0.003 85);
  --tt-danger: oklch(0.55 0.2 25);
  --tt-warning: oklch(0.58 0.13 70);
  --tt-hover: color-mix(in srgb, oklch(0.9 0.03 200) 70%, transparent);
  --tt-scrim: rgb(20 22 26 / 76%);
  --tt-shadow-color: rgb(20 24 22 / 20%);
}
:root[data-motion='reduced'] { --fade: 0ms; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #16181d; color: var(--tt-text); font: 15px/1.5 var(--tt-font); overflow: hidden; }
:root[data-theme='light'] body { background: #c9ccd2; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--tt-accent); outline-offset: 2px; }

/* ---------- prototype chrome (not part of the design) ---------- */
.pnav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; background: #f3f0e8; color: #111; font: 600 13px/1 system-ui, sans-serif; box-shadow: 0 2px 10px rgb(0 0 0 / 30%); }
.pnav b { margin-right: 6px; font-weight: 800; letter-spacing: .02em; }
.pnav button { border: 1px solid #c8c3b6; background: #fff; color: #111; border-radius: 999px; padding: 6px 11px; cursor: pointer; font: inherit; }
.pnav button[aria-pressed='true'] { background: #111; color: #fff; border-color: #111; }
.pnav .gap { flex: 1; }
.pbar { position: fixed; z-index: 100; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 6px 8px; background: #fff; color: #111; border-radius: 999px; box-shadow: 0 6px 24px rgb(0 0 0 / 45%); font: 700 14px/1 system-ui, sans-serif; white-space: nowrap; }
.pbar button { border: 0; width: 34px; height: 34px; border-radius: 50%; background: #111; color: #fff; cursor: pointer; font-size: 16px; }
.pbar button:disabled { opacity: .25; cursor: default; }
.hud { position: fixed; z-index: 100; right: 10px; bottom: 64px; width: 250px; padding: 10px 12px; background: #fffbe8; color: #222; border-radius: 10px; font: 12px/1.45 system-ui, sans-serif; box-shadow: 0 6px 20px rgb(0 0 0 / 35%); }
.hud b { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8a6d00; margin-bottom: 4px; }
.hud .row { display: flex; justify-content: space-between; gap: 8px; }
.hud .x { position: absolute; top: 4px; right: 6px; border: 0; background: none; cursor: pointer; font-size: 14px; color: #777; }
.hud.min { width: auto; padding: 6px 10px; } .hud.min .rows { display: none; }
@media (max-width: 700px) { .hud { bottom: 70px; right: 6px; width: 210px; font-size: 11px; } }
#stage { position: absolute; left: 0; right: 0; bottom: 0; overflow: auto; }
.scaler { transform-origin: top left; }

/* ---------- desktop window ---------- */
.win { position: relative; width: 100%; height: 100%; background: var(--tt-canvas); display: flex; flex-direction: column; overflow: hidden; }
.strip { height: 38px; flex: none; border-bottom: 1px solid var(--tt-hairline); display: flex; align-items: center; padding: 0 16px; gap: 14px; color: var(--tt-text-muted); font-size: 13px; }
.strip b { color: var(--tt-text); font-weight: 600; }
.mark { width: 22px; height: 22px; border-radius: 6px; background: var(--tt-accent); display: grid; place-items: center; color: var(--tt-on-accent); font-weight: 800; font-size: 12px; }
.app { flex: 1; min-height: 0; display: grid; grid-template-columns: 236px 1fr; }
.sidebar { border-right: 1px solid var(--tt-hairline); padding: 12px 10px; font-size: 13px; color: var(--tt-text-2); overflow: hidden; }
.sidebar h4 { margin: 10px 10px 6px; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--tt-text-muted); font-weight: 600; }
.sidebar div { padding: 6px 10px; border-radius: 8px; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar .on { background: var(--tt-hover); color: var(--tt-text); }
.sidebar .light { width: 7px; height: 7px; border-radius: 50%; background: var(--tt-text-muted); flex: none; }
.sidebar .light.work { background: var(--tt-accent); }
.pane { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.pane-head { height: 46px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 22px; border-bottom: 1px solid var(--tt-border-faint); font-weight: 600; font-size: 14px; }
.pane-head span { color: var(--tt-text-muted); font-weight: 400; font-size: 13px; }
.scroll { flex: 1; overflow: auto; min-height: 0; }
.transcript { max-width: 740px; margin: 0 auto; padding: 24px 28px 40px; }
.composer { flex: none; margin: 0 auto 14px; width: min(740px, calc(100% - 40px)); background: var(--tt-field); border: 1px solid var(--tt-hairline); border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.composer .row { display: flex; align-items: flex-end; gap: 8px; }
.composer .ta { flex: 1; min-height: 24px; max-height: 120px; overflow: auto; outline: none; color: var(--tt-text); padding: 4px 2px; }
.composer .ta:empty::before { content: attr(data-ph); color: var(--tt-text-muted); }
.composer .send { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--tt-accent); color: var(--tt-on-accent); cursor: pointer; font-weight: 800; }
.composer .chips { display: flex; gap: 8px; color: var(--tt-text-muted); font-size: 12.5px; }
.deck { display: flex; gap: 8px; flex-wrap: wrap; }
.deck:empty { display: none; }
.staged { position: relative; width: 112px; border-radius: 10px; overflow: hidden; border: 1px solid var(--tt-hairline); background: var(--tt-surface-sunken); }
.staged .badge { position: absolute; left: 6px; bottom: 6px; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--tt-danger); color: #fff; font-weight: 600; }
.staged .rm { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: rgb(0 0 0 / 60%); color: #fff; font-size: 11px; cursor: pointer; }

/* messages */
.msg { position: relative; margin: 0 0 26px; }
.msg header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; color: var(--tt-text-muted); font-size: 12.5px; }
.msg .who { color: var(--tt-text-2); font-weight: 600; }
.msg p { margin: 0 0 8px; color: var(--tt-text-2); line-height: 1.6; }
.msg ol { margin: 0 0 8px; padding-left: 22px; color: var(--tt-text-2); line-height: 1.6; }
.msg ol li::marker { color: var(--tt-accent); font-weight: 700; }
.msg[data-role='user'] { margin-left: max(24px, 14%); padding: 12px 16px; background: var(--tt-bubble); border: 1px solid var(--tt-hairline); border-radius: 14px 14px 4px 14px; }
.steps { color: var(--tt-text-muted); font-size: 13px; margin-bottom: 8px; }
.tool { display: inline-flex; align-items: center; gap: 6px; color: var(--tt-text-muted); font-size: 12.5px; margin: 2px 0 8px; }
.tool i { font-style: normal; width: 16px; height: 16px; display: inline-grid; place-items: center; border-radius: 4px; background: var(--tt-surface-elevated); font-size: 10px; }
.receipt { display: inline-flex; gap: 8px; align-items: center; padding: 6px 10px; border: 1px solid var(--tt-border-faint); border-radius: 10px; font-size: 12.5px; color: var(--tt-text-2); margin: 0 0 10px; }

/* ---------- media, shared ---------- */
.media-group { display: flex; flex-direction: column; gap: 14px; margin: 10px 0 12px; }
.fig { margin: 0; position: relative; }
.frame { position: relative; display: block; overflow: hidden; border: 1px solid var(--tt-border-faint); border-radius: 10px; background: var(--tt-surface-sunken); padding: 0; cursor: zoom-in; }
.frame > img, .frame > canvas, .frame > .marks { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.frame > img { object-fit: contain; opacity: 0; transition: opacity var(--fade) ease; }
.frame > img.in { opacity: 1; }
.frame[data-loaded] .ph { display: none; }
.frame .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--tt-text-muted); font-size: 12px; }
.cap { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12.5px; color: var(--tt-text-muted); min-height: 28px; }
.cap .kind { color: var(--tt-text-2); font-weight: 600; }
.cap .acts { margin-left: auto; display: flex; gap: 2px; opacity: 0; transition: opacity var(--fade) ease; }
.fig:hover .acts, .fig:focus-within .acts, .touch .acts { opacity: 1; }
.act { border: 0; background: transparent; color: var(--tt-text-muted); border-radius: 6px; padding: 4px 8px; font-size: 12.5px; cursor: pointer; }
.act:hover { background: var(--tt-hover); color: var(--tt-text); }
.act.primary { color: var(--tt-accent); font-weight: 600; }
.pin { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--tt-accent); color: var(--tt-on-accent); font: 700 12px/22px var(--tt-font); text-align: center; box-shadow: 0 2px 6px rgb(0 0 0 / 40%); pointer-events: none; }
.cobox { position: absolute; border: 2px dashed var(--tt-accent); border-radius: 6px; pointer-events: none; }
.badge-n { position: absolute; right: 6px; top: 6px; padding: 1px 7px; font-size: 11px; border-radius: 999px; background: var(--tt-accent); color: var(--tt-on-accent); font-weight: 700; }
.video .play { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; border: 0; background: rgb(0 0 0 / 62%); color: #fff; font-size: 20px; cursor: pointer; display: grid; place-items: center; }
.video .vbar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: linear-gradient(transparent, rgb(0 0 0 / 70%)); color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; }
.video .vbar input { flex: 1; accent-color: var(--tt-accent); }
.video .vbar button { border: 0; background: none; color: #fff; cursor: pointer; font-size: 13px; padding: 2px 4px; }
.video .note { position: absolute; left: 10px; top: 8px; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: rgb(0 0 0 / 60%); color: #fff; }
.dur { position: absolute; right: 6px; bottom: 6px; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: rgb(0 0 0 / 65%); color: #fff; font-variant-numeric: tabular-nums; }

/* layout A: reading width */
[data-layout='A'] .fig .frame { width: min(100%, var(--w)); aspect-ratio: var(--ar); max-height: 420px; }
[data-layout='A'] .fig.tall .frame { width: auto; height: 420px; }
[data-layout='A'] .fig.gen .frame { width: min(100%, 380px); }
/* layout B: tiles */
[data-layout='B'] .media-group { flex-direction: row; flex-wrap: wrap; gap: 10px; }
[data-layout='B'] .fig { width: 208px; }
[data-layout='B'] .fig .frame { width: 208px; height: 140px; }
[data-layout='B'] .fig .frame > img { object-fit: cover; }
[data-layout='B'] .cap { flex-wrap: wrap; gap: 0 6px; line-height: 1.35; }
[data-layout='B'] .cap .acts { display: none; }
[data-layout='B'] .pin, [data-layout='B'] .cobox { display: none; }
/* layout C: lead and strip */
[data-layout='C'] .media-group { gap: 8px; }
[data-layout='C'] .lead .frame { width: min(100%, var(--w)); aspect-ratio: var(--ar); max-height: 400px; }
[data-layout='C'] .lead.tall .frame { width: auto; height: 400px; }
[data-layout='C'] .lead.gen .frame { width: min(100%, 360px); }
[data-layout='C'] .strip-row { display: flex; gap: 6px; }
[data-layout='C'] .strip-row .frame { width: 84px; height: 58px; border-radius: 8px; cursor: pointer; }
[data-layout='C'] .strip-row .frame > img { object-fit: cover; }
[data-layout='C'] .strip-row .frame[aria-current='true'] { outline: 2px solid var(--tt-accent); outline-offset: 1px; }
[data-layout='C'] .strip-row .pin, [data-layout='C'] .strip-row .cobox { display: none; }

/* ASCII scene */
.ascii { position: absolute; inset: 0; overflow: hidden; background: var(--tt-surface-sunken); }
.ascii pre { position: absolute; inset: 0; margin: 0; font-family: var(--tt-mono); white-space: pre; overflow: hidden; }
.ascii .bg { color: color-mix(in oklab, var(--tt-text-muted) 60%, transparent); }
.ascii .fg { color: var(--tt-accent); }
.ascii .fg2 { color: var(--tt-warning); }
.gen-line { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--tt-text-muted); margin-top: 6px; }
.gen-line .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tt-accent); animation: pulse 1.4s ease-in-out infinite; }
:root[data-motion='reduced'] .gen-line .dot { animation: none; }
@keyframes pulse { 50% { opacity: .3; } }

/* ---------- viewer and markup editor ---------- */
.ov { position: absolute; inset: 0; z-index: 20; background: var(--tt-scrim); display: flex; flex-direction: column; animation: fadein var(--fade) ease; }
@keyframes fadein { from { opacity: 0; } }
.ov-top { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--tt-surface-elevated); border-bottom: 1px solid var(--tt-hairline); flex-wrap: wrap; }
.ov-top .title { font-size: 13px; color: var(--tt-text-2); margin-right: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.ov-top .sp { flex: 1; }
.tb { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--tt-text-2); cursor: pointer; font-size: 13px; }
.tb:hover { background: var(--tt-hover); color: var(--tt-text); }
.tb[aria-pressed='true'] { background: var(--tt-hover); color: var(--tt-text); border-color: var(--tt-hairline); }
.tb kbd { font: 11px var(--tt-font); color: var(--tt-text-muted); }
.tb.primary { background: var(--tt-accent); color: var(--tt-on-accent); font-weight: 600; }
.tb.primary:hover { filter: brightness(1.08); }
.sepv { width: 1px; height: 22px; background: var(--tt-hairline); margin: 0 4px; }
.ink { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
.ink[aria-checked='true'] { border-color: var(--tt-text); }
.ov-body { flex: 1; min-height: 0; display: flex; }
.stage-wrap { flex: 1; min-width: 0; display: grid; place-items: center; padding: 18px; position: relative; overflow: hidden; }
.mstage { position: relative; box-shadow: 0 16px 40px var(--tt-shadow-color); border-radius: 4px; overflow: visible; background: #fff; }
.mstage img { display: block; width: 100%; height: 100%; border-radius: 4px; user-select: none; -webkit-user-drag: none; }
.mstage svg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.mstage.view svg { cursor: zoom-in; pointer-events: none; }
.mstage.fingers svg { touch-action: pan-x pan-y pinch-zoom; }
.side { width: 270px; flex: none; background: var(--tt-surface-elevated); border-left: 1px solid var(--tt-hairline); padding: 14px; overflow: auto; font-size: 13px; }
.side h5 { margin: 0 0 8px; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--tt-text-muted); display: flex; justify-content: space-between; align-items: center; }
.side ol, .side ul { margin: 0 0 16px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.side li { display: flex; gap: 8px; align-items: flex-start; color: var(--tt-text-2); line-height: 1.4; }
.side li .n { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--tt-accent); color: var(--tt-on-accent); font-weight: 700; font-size: 11px; display: grid; place-items: center; }
.side li .sw { flex: none; width: 12px; height: 12px; border-radius: 3px; margin-top: 4px; }
.side li button { margin-left: auto; border: 0; background: none; color: var(--tt-text-muted); cursor: pointer; }
.side label { display: flex; gap: 8px; align-items: center; color: var(--tt-text-2); margin-top: 4px; cursor: pointer; }
.side .empty { color: var(--tt-text-muted); font-style: italic; }
.hint { padding: 6px 14px 10px; text-align: center; color: color-mix(in oklab, #fff 75%, transparent); font-size: 12.5px; }
:root[data-theme='light'] .hint { color: #fff; }
.note-in { position: absolute; z-index: 3; min-width: 140px; padding: 4px 8px; border-radius: 6px; border: 2px solid var(--tt-danger); background: var(--tt-surface-elevated); color: var(--tt-text); font: 14px var(--tt-font); outline: none; }

/* ---------- phones ---------- */
.devices { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px 10px 120px; }
.states { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.states button { background: #2b2f37; color: #e6e8ee; border: 1px solid #3a3f49; border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
.states button[aria-pressed='true'] { background: var(--tt-accent); color: var(--tt-on-accent); border-color: var(--tt-accent); }
.dnote { font-size: 13px; color: #b9bdc6; max-width: 560px; text-align: center; line-height: 1.45; }
:root[data-theme='light'] .dnote { color: #333; }
.phone { position: relative; width: 393px; height: 852px; border-radius: 54px; border: 10px solid #000; background: var(--tt-canvas); overflow: hidden; box-shadow: 0 30px 60px rgb(0 0 0 / 50%); display: flex; flex-direction: column; flex: none; }
.duo { position: relative; width: 1100px; height: 774px; border-radius: 40px; border: 12px solid #000; background: var(--tt-canvas); overflow: hidden; box-shadow: 0 30px 60px rgb(0 0 0 / 50%); display: flex; flex-direction: column; flex: none; }
.duo::after { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: rgb(255 255 255 / 4%); pointer-events: none; }
.pstatus { height: 50px; flex: none; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 30px 6px; font-weight: 600; font-size: 15px; }
.duo .pstatus { height: 30px; padding: 0 26px 2px; font-size: 13px; }
.ptop { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 14px 10px; }
.ptop .back { width: 36px; height: 36px; border-radius: 50%; background: var(--tt-surface-elevated); border: 0; display: grid; place-items: center; font-size: 18px; }
.ptop .t { flex: 1; font-weight: 600; font-size: 16px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wpill { font-size: 12px; padding: 5px 10px; border-radius: 999px; background: var(--tt-surface-elevated); color: var(--tt-accent); white-space: nowrap; }
.pscroll { flex: 1; overflow: auto; min-height: 0; padding: 6px 16px 10px; -webkit-overflow-scrolling: touch; }

  }
  function prog(now) { const e = now - startedAt; return Math.min(.97, 1 - Math.exp(-e / (durMs / 3.2))) }

}

/* clicks on media: open the viewer, mark up, play, swap the lead */

    if (swap) {

    ov.innerHTML = `<div class="ov-top" role="toolbar" aria-label="Markup tools"><span class="title">${esc(m.name)}</span>${toolBtns}<span class="sepv"></span>${inkBtns}<span class="sepv"></span>${undo}<span class="sp"></span><button class="tb" data-cmd="cancel">Cancel</button><button class="tb primary" data-cmd="add">Add to reply</button></div><div class="ov-body"><div class="stage-wrap"><div class="mstage"><img alt="${esc(m.name)}" src="${srcOf(id)}"><svg viewBox="0 0 ${m.w} ${m.h}" preserveAspectRatio="none" aria-hidden="true"></svg></div></div>${sideHTML}</div><div class="hint">Drag to draw. Press where a note goes, then type. A, O, B, P and T pick a tool. Escape cancels.</div>`
  } else {
    const notes = m.callouts && !duo ? `<div class="pnotes">${m.callouts.map(c => `<div><span class="n">${c.n}</span>${esc(c.note)}</div>`).join('')}</div>` : ''
    ov.innerHTML = `<div class="pov-top"><button data-cmd="cancel">Cancel</button><span class="t">Mark up</span><button class="primary" data-cmd="add">Add to reply</button></div>${duo ? `<div class="pen-hint" data-penhint>${S.fingers ? 'Pen and finger both draw' : 'Pen draws · finger moves the picture'}</div>` : ''}<div class="ov-body"><div class="stage-wrap"><div class="mstage${duo && !S.fingers ? ' fingers' : ''}"><img alt="${esc(m.name)}" src="${srcOf(id)}"><svg viewBox="0 0 ${m.w} ${m.h}" preserveAspectRatio="none" aria-hidden="true"></svg></div></div>${duo ? sideHTML : ''}</div>${notes}<div class="pal" role="toolbar" aria-label="Markup tools">${toolBtns}<span class="sepv"></span>${inkBtns}<span class="sepv"></span>${undo}${duo ? `<span class="sepv"></span><button data-cmd="fingers" aria-pressed="${S.fingers}" aria-label="Draw with a finger too" title="Draw with a finger too">☝</button>` : ''}</div>`
  }
  host.appendChild(ov)
  const stage = $('.mstage', ov), svg = $('svg', stage), wrap = $('.stage-wrap', ov)
  function fit() {
    const W = wrap.clientWidth - 24, H = wrap.clientHeight - 24
    const k = Math.min(W / m.w, H / m.h)
    stage.style.width = m.w * k + 'px'; stage.style.height = m.h * k + 'px'
  }
  fit(); const ro = new ResizeObserver(fit); ro.observe(wrap)
  function render() {
    svg.innerHTML = marksSVG(m, ed)
    const mine = $('[data-mine]', ov)
    if (mine) mine.innerHTML = ed.marks.length ? ed.marks.map((k, i) => `<li><span class="sw" style="background:${INKS.find(x => x[0] === k.ink)[1]}"></span><span>${esc(describeMark(k))}</span><button data-del="${i}" aria-label="Remove ${esc(describeMark(k))}">✕</button></li>`).join('') : '<li class="empty">None yet. Draw on the picture.</li>'
  }
  render()
  const pt = e => { const r = svg.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * m.w, (e.clientY - r.top) / r.height * m.h] }
  let down = null
  svg.addEventListener('pointerdown', e => {
    if (duo && !S.fingers && e.pointerType === 'touch') return   // a finger scrolls on the Duo unless the user says otherwise
    e.preventDefault(); svg.setPointerCapture(e.pointerId)
    const [x, y] = pt(e); down = { x, y, moved: false }
    if (ed.tool === 'note') return
    ed.live = ed.tool === 'pen' ? { t: 'pen', ink: ed.ink, pts: [[x, y, e.pressure || .5]], pressure: e.pointerType === 'pen' } : { t: ed.tool, ink: ed.ink, x0: x, y0: y, x1: x, y1: y }
  })
  svg.addEventListener('pointermove', e => {
    if (!down || !ed.live) return
    const [x, y] = pt(e); down.moved = true
    if (ed.live.t === 'pen') ed.live.pts.push([x, y, e.pressure || .5]); else { ed.live.x1 = x; ed.live.y1 = y }
    svg.innerHTML = marksSVG(m, ed)
  })
  svg.addEventListener('pointerup', e => {
    if (!down) return
    const [x, y] = pt(e)
    if (ed.tool === 'note') { placeNote(x, y); down = null; return }
    const k = ed.live; ed.live = null; down = null
    if (k && (k.t === 'pen' ? k.pts.length > 2 : Math.hypot(k.x1 - k.x0, k.y1 - k.y0) > m.w / 80)) { ed.marks.push(k); ed.redo = [] }
    render()
  })
  function placeNote(x, y) {
    const r = svg.getBoundingClientRect(), sr = stage.getBoundingClientRect()
    const inp = document.createElement('input'); inp.className = 'note-in'; inp.placeholder = 'Type a note'
    inp.setAttribute('aria-label', 'Note text')
    inp.style.left = (x / m.w * sr.width) / (sr.width / stage.offsetWidth) + 'px'; inp.style.top = (y / m.h * sr.height) / (sr.height / stage.offsetHeight) - 16 + 'px'
    stage.appendChild(inp); inp.focus()
    let done = false
    const commit = () => { if (done) return; done = true; const t = inp.value.trim(); inp.remove(); if (t) { ed.marks.push({ t: 'note', ink: ed.ink, x0: x, y0: y, text: t }); ed.redo = []; render() } }
    inp.addEventListener('keydown', ev => { ev.stopPropagation(); if (ev.key === 'Enter') commit(); if (ev.key === 'Escape') { done = true; inp.remove() } })
    inp.addEventListener('blur', commit)
  }
  function setTool(t) { ed.tool = t; $$('[data-tool]', ov).forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === t)) }
  function close() { ro.disconnect(); ov.remove(); document.removeEventListener('keydown', keys, true); onClose && onClose() }
  function add() { onAdd({ id, svg: marksSVG(m, ed, true), count: ed.marks.length }); close() }
  ov.addEventListener('click', e => {
    const t = e.target.closest('[data-tool]'); if (t) return setTool(t.dataset.tool)
    const i = e.target.closest('[data-ink]'); if (i) { ed.ink = i.dataset.ink; $$('[data-ink]', ov).forEach(b => b.setAttribute('aria-checked', b === i)); return }
    const d = e.target.closest('[data-del]'); if (d) { ed.marks.splice(+d.dataset.del, 1); render(); return }
    const c = e.target.closest('[data-cmd]'); if (!c) return
    const cmd = c.dataset.cmd
    if (cmd === 'undo' && ed.marks.length) { ed.redo.push(ed.marks.pop()); render() }
    if (cmd === 'redo' && ed.redo.length) { ed.marks.push(ed.redo.pop()); render() }
    if (cmd === 'cancel') close()
    if (cmd === 'add') add()
    if (cmd === 'fingers') { S.fingers = !S.fingers; c.setAttribute('aria-pressed', S.fingers); stage.classList.toggle('fingers', !S.fingers); $('[data-penhint]', ov).textContent = S.fingers ? 'Pen and finger both draw' : 'Pen draws · finger moves the picture' }
  })
  ov.addEventListener('change', e => {
    if (e.target.dataset.opt === 'show') { ed.showAgent = e.target.checked; render() }
    if (e.target.dataset.opt === 'include') ed.includeAgent = e.target.checked
  })
  function keys(e) {
    if (e.target.matches('input.note-in')) return
    if (e.key === 'Escape') { e.stopPropagation(); close(); return }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); $(`[data-cmd=${e.shiftKey ? 'redo' : 'undo'}]`, ov).click(); return }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { add(); return }
    const tool = TOOLS.find(t => t[3].toLowerCase() === e.key.toLowerCase()); if (tool && !e.ctrlKey && !e.metaKey) { setTool(tool[0]); e.stopPropagation() }
  }
  document.addEventListener('keydown', keys, true)
  $('[data-tool=arrow]', ov).focus()
}

  host.appendChild(ov)

  fit(); const ro = new ResizeObserver(fit); ro.observe(wrap)

  const keys = e => { if (e.key === 'Escape') { e.stopPropagation(); close() } if (e.key.toLowerCase() === 'm' && canMark) { e.stopPropagation(); close(); onMarkup(id) } }

  const states = kind === 'duo' ? [['thread', 'Thread'], ['open', 'Image open'], ['markup', 'Mark up with the pen']] : [['thread', 'Thread'], ['open', 'Image open'], ['markup', 'Mark up'], ['gen', 'Image generating']]
  const note = kind === 'duo'
    ? 'Unfolded, the thread keeps its 680-point reading width. Marking up puts the picture beside the list of marks, with the tools floating at the bottom. The pen draws and a finger moves the picture; ☝ lets a finger draw too. With a mouse here, the mouse draws.'
    : 'Tap a picture to open it full screen, then Mark up. A finger draws on the iPhone. Add to reply puts the marked copy in the reply box; the original stays in the thread.'
  return `<div class="devices" data-layout="${S.layout}"><div class="dnote">${note}</div><div class="states">${states.map(([k, n]) => `<button data-state="${k}" aria-pressed="${k === st}">${n}</button>`).join('')}</div>
    <div class="dev-fit"><div class="${kind === 'duo' ? 'duo' : 'phone'}" id="device" data-layout="${S.layout}">${phoneThread(S.layout, where, kind === 'duo')}</div></div></div>`
}

/* ================================================================== mount */
function render() {
  observers.splice(0).forEach(o => o.disconnect())
  for (const el of playing) pauseVideo(el)
  ;[...running].forEach(h => h.stop())
  renderNav()
  const st = $('#stage'); st.style.top = $('#pnav').offsetHeight + 'px'
  const v = S.view
  let html
  if (v === 'thread' || v === 'markup') html = viewThread()
  else if (v === 'watcher') html = viewWatcher()
  else if (v === 'generating') html = viewGenerating()
  else if (v === 'providers') html = viewProviders()
  else html = viewDevice(v === 'duo' ? 'duo' : 'phone')
  const desktopish = ['thread', 'markup', 'watcher', 'generating', 'providers'].includes(v)
  st.innerHTML = desktopish ? `<div class="scaler" id="scaler">${html}</div>` : html
  fitDesk()
  if (desktopish) mountDesk(); else mountDevice(v === 'duo' ? 'duo' : 'phone')
  renderNav(); renderBar(); hud(); syncUrl()
}
function fitDesk() {
  const st = $('#stage'), sc = $('#scaler'); if (!sc) return
  const W = st.clientWidth, H = st.clientHeight
  if (W >= 1000) { sc.style.width = W + 'px'; sc.style.height = H + 'px'; sc.style.transform = '' }
  else { const k = W / 1280; sc.style.width = '1280px'; sc.style.height = Math.max(800, H / k) + 'px'; sc.style.transform = `scale(${k})` }
}
function fitDevice() {
  const dev = $('#device'); if (!dev) return
  const wrap = dev.parentElement, st = $('#stage')
  const W = dev.offsetWidth, H = dev.offsetHeight
  const k = Math.min(1, (st.clientWidth - 20) / W, Math.max(.45, (st.clientHeight - 150) / H))
  dev.style.transform = k < 1 ? `scale(${k})` : ''; dev.style.transformOrigin = 'top left'
  wrap.style.width = W * k + 'px'; wrap.style.height = H * k + 'px'
}
function mountDesk() {
  const scroller = $('#scroll'); const pane = $('#pane')
  if (S.view === 'generating') {
    hydrate($('#genhost'), null); wireMedia($('#genhost'), { scroller: null, open: () => {}, markup: () => {} })
    $('#replay').onclick = () => { $('#genhost .fig')?._ascii?.stop?.(); delete S.gen.icon; render() }
    $$('[data-scene]').forEach(b => b.onclick = () => { S.scene = b.dataset.scene; $('#genhost .fig')?._ascii?.stop?.(); delete S.gen.icon; render() })
    return
  }
  if (!scroller) return
  scroller.scrollTop = scroller.scrollHeight
  const ctx = {
    scroller,
    open: id => openViewer(pane, id, 'desk', id2 => ctx.markup(id2)),
    markup: id => openEditor(pane, id, 'desk', item => { S.staged.desk.push(item); refreshComposer('desk') }),
  }
  hydrate(scroller, scroller); wireMedia(scroller, ctx); wireComposer('desk', () => render())
  if (S.view === 'markup') ctx.markup('checkout')
}
function mountDevice(kind) {
  const where = kind === 'duo' ? 'duo' : 'phone'
  const dev = $('#device'); fitDevice()
  const scroller = $('[data-pscroll]', dev)
  scroller.scrollTop = scroller.scrollHeight
  const ctx = {
    scroller,
    open: id => openViewer(dev, id, kind, id2 => ctx.markup(id2)),
    markup: id => openEditor(dev, id, kind, item => { S.staged[where].push(item); refreshComposer(where) }),
  }
  hydrate(scroller, scroller); wireMedia(scroller, ctx); wireComposer(where, () => render())
  $$('[data-state]').forEach(b => b.onclick = () => { if (kind === 'duo') S.duoState = b.dataset.state; else S.phoneState = b.dataset.state; render() })
  const st = kind === 'duo' ? S.duoState : S.phoneState
  if (st === 'open') ctx.open('phone')
  if (st === 'markup') ctx.markup(kind === 'duo' ? 'checkout' : 'phone')
  if (st === 'gen') { $('[data-fig=icon]', scroller)?._ascii?.stop?.(); delete S.gen.icon; scroller.innerHTML = scroller.innerHTML; hydrate(scroller, scroller); scroller.scrollTop = scroller.scrollHeight }
}
function refreshComposer(where) {
  const deck = $('#deck-' + where); if (deck) deck.innerHTML = stagedHTML(S.staged[where], where)
  const ta = $('#ta-' + where); if (ta) { ta.dataset.ph = S.staged[where].length ? 'Say what to fix' : ta.getAttribute('aria-label'); ta.focus() }
  const ph = deck?.parentElement?.querySelector('span:not(.badge)'); if (ph && !ta) ph.textContent = S.staged[where].length ? 'Say what to fix' : 'Reply while it works'
}
function wireComposer(where, after) {
  const root = $('#stage')
  root.addEventListener('click', e => {
    const u = e.target.closest('[data-unstage]'); if (u) { const [w, i] = u.dataset.unstage.split(':'); S.staged[w].splice(+i, 1); refreshComposer(w); return }
    const s = e.target.closest('[data-send]'); if (!s) return
    const w = s.dataset.send, ta = $('#ta-' + w), text = ta ? ta.textContent.trim() : ''
    if (!text && !S.staged[w].length) return
    S.sent[w].push({ text, items: S.staged[w].splice(0) }); after()
  }, { once: false })
}

/* ================================================================== chrome */
function renderNav() {
  const n = $('#pnav')
  n.innerHTML = `<b>PROTOTYPE</b>${VIEWS.map(([k, l]) => `<button data-view="${k}" aria-pressed="${k === S.view}">${l}</button>`).join('')}<span class="gap"></span><button data-tog="theme" aria-pressed="${document.documentElement.dataset.theme === 'light'}">Light</button><button data-tog="motion" aria-pressed="${reduced()}">Reduced motion</button>`
}
$('#pnav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return
  if (b.dataset.view) { S.view = b.dataset.view; render() }
  if (b.dataset.tog === 'theme') { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light'; render() }
  if (b.dataset.tog === 'motion') { const r = document.documentElement; r.dataset.motion = reduced() ? 'full' : 'reduced'; render() }
})
function barKind() { return S.view === 'generating' ? 'scene' : (S.view === 'markup' || S.view === 'providers') ? null : 'layout' }
function renderBar() {
  const k = barKind()
  $('#prev').disabled = $('#next').disabled = !k
  $('#plabel').textContent = k === 'scene' ? `Scene ${S.scene} · ${SCENES[S.scene]}` : k === 'layout' ? `${S.layout} · ${LAYOUTS[S.layout]}` : S.view === 'markup' ? 'Mark up · one design' : 'Providers'
}
function cycle(d) {
  const k = barKind(); if (!k) return
  if (k === 'scene') { const keys = Object.keys(SCENES); S.scene = keys[(keys.indexOf(S.scene) + d + keys.length) % keys.length]; delete S.gen.icon }
  else { const keys = Object.keys(LAYOUTS); S.layout = keys[(keys.indexOf(S.layout) + d + keys.length) % keys.length] }
  render()
}
$('#prev').onclick = () => cycle(-1); $('#next').onclick = () => cycle(1)
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable="true"]') || $('.ov, .pov')) return
  if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1)
})
$('#hudx').onclick = () => { const h = $('#hud'); h.classList.toggle('min'); $('#hudx').textContent = h.classList.contains('min') ? '+' : '–' }
function hud() {
  const all = $$('#stage [data-media]').filter(el => !el.dataset.swap || true)
  const loaded = all.filter(el => el.dataset.loaded).length
  const asciiState = running.size ? `drawing (${running.size})` : reduced() ? 'still (reduced motion)' : Object.values(S.gen).some(g => !g.done) ? 'stopped, off screen' : 'stopped, finished'
  $('#hudrows').innerHTML = `<div class="row"><span>Pictures holding pixels</span><b style="all:unset;font-weight:700">${loaded} of ${all.length}</b></div><div class="row"><span>Let go when scrolled away</span><span>${S.unloaded}</span></div><div class="row"><span>Videos playing</span><span>${playing.size}</span></div><div class="row"><span>ASCII scene</span><span>${asciiState}</span></div><div class="row"><span>ASCII frames drawn</span><span>${S.frames}</span></div><div style="margin-top:4px;color:#7a6a3a">Scroll the thread to watch pictures load and let go.</div>`
}
setInterval(() => { if (running.size) hud() }, 500)
addEventListener('resize', () => { fitDesk(); fitDevice() })
if (innerWidth < 700) { $('#hud').classList.add('min'); $('#hudx').textContent = '+' }
if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.dataset.motion = 'reduced'
render()
</script>
</body>
</html>
