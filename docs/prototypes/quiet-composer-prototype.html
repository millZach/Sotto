<!doctype html>
<!-- THROWAWAY PROTOTYPE - fewer boxes in the thread composer, its queued messages and Watcher's composer.
     Real size (1 CSS pixel = 1 app pixel). Today is the look after #1368. Synthetic data only, outside every entrypoint.
     URL: ?d=today|A|B|C &w=1280|820 &mode=dark|light -->
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sotto composer, fewer boxes (prototype)</title>
<style>
@font-face{font-family:Figtree;font-weight:300 900;font-display:swap;src:url(Figtree.ttf) format("truetype"),url(../../apps/ios/Sotto/Resources/Figtree.ttf) format("truetype")}
/* Theme roles as the default Sotto theme paints them, with #1368's card tokens. */
:root{color-scheme:dark;--ah:183;
  --canvas:oklch(.115 .008 265);--surface:oklch(.145 .008 265);--raised:oklch(.185 .008 265);--overlay:oklch(.215 .008 265);--sunken:oklch(.155 .008 265);
  --card:oklch(.185 .008 265);--inset:var(--canvas);--seg-on:var(--overlay);
  --text:oklch(.985 .005 280);--text2:oklch(.86 .01 270);--muted:oklch(.72 .014 265);--faint:oklch(.62 .012 270);
  --border:oklch(.305 .02 265);--input:oklch(.375 .024 265);
  --accent:oklch(.714 .104 var(--ah));--accent-text:oklch(.83 .08 var(--ah));--accent-surface:oklch(.32 .05 var(--ah));
  --hover:color-mix(in srgb,var(--accent-surface) 55%,transparent);--pill:var(--text);--pill-ink:var(--canvas);
  --attention:oklch(.78 .15 70);--shadow-sm:0 1px 2px rgb(0 0 0/40%);--shadow-pop:0 12px 32px rgb(0 0 0/.55);
  --claude:#e3b58e;--codex:#d7dbe1;--chrome:oklch(.17 .006 265);--chrome-text:oklch(.92 .006 270)}
:root[data-mode=light]{color-scheme:light;
  --canvas:oklch(.978 .004 85);--surface:oklch(.99 .003 85);--raised:oklch(.955 .006 85);--overlay:oklch(.945 .007 85);--sunken:oklch(.945 .008 85);
  --card:color-mix(in oklab,oklch(.235 .014 75) 4%,oklch(.978 .004 85));--inset:var(--canvas);--seg-on:var(--surface);
  --text:oklch(.235 .014 75);--text2:oklch(.36 .014 75);--muted:oklch(.5 .014 75);--faint:oklch(.55 .015 78);
  --border:oklch(.86 .012 80);--input:oklch(.8 .016 80);
  --accent:oklch(.53 .095 var(--ah));--accent-text:oklch(.43 .08 var(--ah));--accent-surface:oklch(.92 .03 var(--ah));
  --attention:oklch(.6 .14 60);--shadow-sm:0 1px 2px rgb(20 24 22/10%);--shadow-pop:0 12px 32px rgb(20 24 22/.16);
  --claude:#b8743c;--codex:#5d6470;--chrome:oklch(.93 .006 85);--chrome-text:oklch(.25 .014 75)}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px/1.45 Figtree,system-ui,sans-serif;color:var(--chrome-text);background:var(--chrome);padding-bottom:90px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- The review page (not part of the design) ---------- */
.rv-head{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 16px;background:var(--chrome);border-bottom:1px solid var(--border)}
.rv-head h1{margin:0 auto 0 0;font-size:16px;font-weight:600}.rv-head h1 small{font-weight:400;color:var(--muted);margin-left:8px}
.rv-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
.rv-row span{font-size:12px;color:var(--muted);margin-right:2px}
.rv-row button{border:1px solid var(--border);border-radius:6px;padding:5px 11px;font-size:13px;color:var(--muted)}
.rv-row button[aria-pressed=true]{background:var(--text);color:var(--canvas);border-color:var(--text)}
.rv-body{padding:16px}
.rv-intro{max-width:980px;margin:0 0 16px;color:var(--text2)}.rv-intro b{color:var(--text)}.rv-intro ul{margin:6px 0 0;padding-left:18px}
.rv-scene{margin:22px 0 6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.rv-scene em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400}
.pair{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.pair>div{min-width:0;max-width:100%}
.pair>div>p{margin:0 0 6px;font-size:12px;color:var(--muted)}
.stage{overflow-x:auto;border-radius:8px;outline:1px solid var(--border);background:var(--canvas)}
.keys{margin:10px 0 0;padding:10px 14px;border-radius:8px;background:var(--canvas);color:var(--text2);font-size:13px;max-width:980px}
.keys b{color:var(--text)}.keys ul{margin:4px 0 0;padding-left:18px}
kbd{font:12px ui-monospace,Consolas,monospace;padding:0 4px;border-radius:3px;background:var(--sunken);color:var(--text2)}
.switcher{position:fixed;left:50%;bottom:14px;z-index:40;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;border-radius:12px;background:#111;color:#fff;box-shadow:0 6px 24px rgb(0 0 0/.5);font-size:13px}
.switcher button{background:#2a2a2a;color:#fff;border-radius:8px;width:34px;height:32px}.switcher div{padding:0 8px;text-align:center}

/* ---------- The thread pane at real size ---------- */
.pane{width:var(--pw);padding:18px 0 16px;background:var(--canvas);color:var(--text);position:relative}
.col{width:min(760px,calc(100% - 40px));margin:0 auto}
.head{display:flex;align-items:center;gap:10px;height:40px;padding:0 16px;margin:-18px 0 14px;border-bottom:1px solid color-mix(in oklab,var(--border) 60%,var(--canvas));font-size:14px}
.head b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.head .crumbs{display:flex;align-items:center;gap:2px;margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap;min-width:0}
.msg{margin:0 0 12px;color:var(--text2);font-size:14px;line-height:1.55}
.msg .who{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.working{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin:4px 0 14px}
.working i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--accent);border-right-color:transparent}
.mark{display:inline-grid;place-items:center;width:15px;font-size:13px;line-height:1}
.mark.claude{color:var(--claude)}.mark.codex{color:var(--codex)}
.ico{display:inline-grid;place-items:center;width:16px;height:16px;flex:none}
.ico svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* The composer card (#1368): filled, 16px corners. */
.cmp{position:relative;border-radius:16px;background:var(--card);border:1px solid transparent;padding:12px 14px 10px}
.cmp[data-running]{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.cmp .text{min-height:58px;color:var(--text);font-size:14.5px;padding:2px 2px 10px}
.cmp .text.ph{color:var(--faint)}
.foot{display:flex;align-items:center;gap:6px;min-width:0}
.foot .end{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.send{display:grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--pill);color:var(--pill-ink);font-weight:700;flex:none}
.send.stop{background:var(--accent);color:var(--canvas)}
.send.stop::before{content:'';width:10px;height:10px;border-radius:2px;background:currentColor}
.iconbtn{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--hover);color:var(--text)}
/* Today (#1368): every control a soft-square box. */
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:5px;background:var(--sunken);color:var(--text2);font-size:13px;white-space:nowrap;flex:none}
:root[data-mode=light] .chip{background:var(--overlay)}
.cmp .chip{background:var(--inset)}
.chip .chev,.tb .chev,.qb .chev{opacity:.7;font-size:10px}
.btn{display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:6px;border:1px solid var(--input);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;white-space:nowrap;flex:none}
.under{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 2px 0;color:var(--muted);font-size:12.5px}
.under .chip{height:26px;font-size:12.5px;background:var(--sunken)}
.queue{display:grid;gap:6px;margin:0 0 8px}
.qrow{display:flex;align-items:center;gap:8px;min-height:40px;padding:6px 8px 6px 12px;border-radius:10px;background:var(--card);font-size:13.5px;color:var(--text2)}
.qrow .q{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .n{color:var(--muted);font-size:12px;flex:none}

/* A · Quiet line: text buttons, no boxes. Each is 28px tall with a hover wash, so the hit area stays. */
.tb{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 7px;border-radius:6px;color:var(--text2);font-size:13px;white-space:nowrap;flex:none}
.tb:hover{background:var(--hover);color:var(--text)}
.tb.muted{color:var(--muted)}
.tb.accent{color:var(--accent-text);font-weight:600}
.dotsep{color:var(--faint);flex:none}
.aline{display:flex;flex-wrap:wrap;align-items:center;gap:0 2px;margin:6px 4px 0;color:var(--muted);font-size:12.5px}
.aline .tb{height:26px;font-size:12.5px;color:var(--muted)}
.aq{display:grid;gap:2px;margin:0 0 8px;padding-left:10px;border-left:2px solid color-mix(in oklab,var(--accent) 60%,transparent)}
.aq .qline{display:flex;align-items:center;gap:6px;min-height:32px;font-size:13.5px;color:var(--text2)}
.aq .qline .q{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aq .lab{font-size:12px;color:var(--muted);margin-bottom:2px}

/* B · One button: everything a thread is set to in one quiet button, and where it runs in another. */
.qb{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 9px;border-radius:6px;color:var(--text2);font-size:13px;white-space:nowrap;min-width:0;overflow:hidden}
.qb:hover,.qb[aria-expanded=true]{background:var(--hover);color:var(--text)}
.qb .v{overflow:hidden;text-overflow:ellipsis}
.qb .sep{color:var(--faint)}
.menu{position:absolute;left:10px;bottom:52px;z-index:5;width:min(340px,calc(100% - 20px));padding:6px;border-radius:10px;background:var(--overlay);box-shadow:var(--shadow-pop);border:1px solid color-mix(in oklab,var(--border) 70%,transparent);font-size:13px}
:root[data-mode=light] .menu{background:var(--surface)}
.menu h5{margin:6px 8px 4px;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.menu .opt{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:6px;color:var(--text2)}
.menu .opt.on{color:var(--text)}.menu .opt.on::after{content:'✓';margin-left:auto;color:var(--accent-text)}
.menu .opt.hl{background:var(--hover)}
.menu .rowopts{display:flex;gap:2px;padding:0 4px 4px}
.menu .rowopts span{flex:1;text-align:center;height:28px;line-height:28px;border-radius:5px;color:var(--muted)}
.menu .rowopts span.on{background:var(--seg-on);color:var(--text);box-shadow:var(--shadow-sm)}
.menu .hint{margin:4px 8px 2px;color:var(--faint);font-size:11.5px}
.menu hr{border:0;height:1px;background:color-mix(in oklab,var(--border) 60%,transparent);margin:4px 2px}
.bq{display:flex;align-items:center;gap:8px;min-height:34px;margin:0 0 8px;padding:0 8px 0 12px;border-radius:10px;background:var(--card);font-size:13px;color:var(--text2)}
.bq .q{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split{display:inline-flex;align-items:stretch;height:30px;border-radius:6px;overflow:hidden;flex:none}
.split button{display:inline-flex;align-items:center;gap:6px;padding:0 10px;background:var(--pill);color:var(--pill-ink);font-size:13px;font-weight:600}
.split button+button{border-left:1px solid color-mix(in oklab,var(--pill-ink) 25%,transparent);padding:0 8px}

/* C · Split by lifecycle: where it runs moves to the thread's header; the composer keeps what the next message uses,
   and queued messages live inside the composer, above what you type. */
.crumb{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 6px;border-radius:6px;color:var(--muted);white-space:nowrap}
.crumb:hover{background:var(--hover);color:var(--text)}
.crumbsep{color:var(--faint)}
.inq{display:grid;gap:0;margin:-4px -6px 8px;padding:0 0 8px;border-bottom:2px solid var(--inset)}
.inq .qline{display:flex;align-items:center;gap:6px;min-height:32px;padding:0 6px;font-size:13.5px;color:var(--text2)}
.inq .qline .q{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inq .qline .n{color:var(--muted);font-size:12px;width:16px;flex:none}
.tag{font-size:11.5px;color:var(--muted)}
.cfoot-c{display:flex;align-items:center;gap:2px;min-width:0}
.tb .k{color:var(--faint);font-size:11.5px;margin-left:2px}

/* Narrow: what each direction folds first at an 820 window (a 560 pane). */
.pane[data-w='820'] .wide-only{display:none}
.pane[data-w='820'] .tb .lbl-long{display:none}
.watch{display:inline-flex;align-items:center;gap:6px}
</style>
</head>
<body>
<header class="rv-head">
  <h1>Composer, fewer boxes <small>prototype · nothing in the app has changed</small></h1>
  <div class="rv-row" id="dirs"></div>
  <div class="rv-row" id="opts"></div>
</header>
<main class="rv-body" id="body"></main>
<div class="switcher"><button id="prev" aria-label="Previous direction">‹</button><div id="sw"></div><button id="next" aria-label="Next direction">›</button></div>
<script>
const q = new URLSearchParams(location.search)
const st = { d: q.get('d') || 'A', w: +(q.get('w') || 1280), mode: q.get('mode') || 'dark' }
const DIRS = { today: 'Today (after #1368)', A: 'A · Quiet line', B: 'B · One settings button', C: 'C · Split by lifecycle' }
const I = {
  clip: 'M11.5 7.5 7.2 11.8a2.6 2.6 0 0 1-3.7-3.7l4.6-4.6a1.7 1.7 0 0 1 2.5 2.5L6 10.6a.8.8 0 0 1-1.2-1.2l4-4',
  host: 'M2.5 3.5h11v7h-11zM6 13h4M8 10.5V13', ws: 'M3 3.5h4l1 1.5h5v7.5H3z', br: 'M5 3v10M5 6.5a3 3 0 0 0 3 3h1.5M11 9.5a1.5 1.5 0 1 0 0 .01M5 3a1.2 1.2 0 1 0 0 .01',
  edit: 'M3 13l1-3 6.5-6.5 2 2L6 12z', x: 'M4 4l8 8M12 4l-8 8', up: 'M8 13V3M4 7l4-4 4 4', down: 'M8 3v10M4 9l4 4 4-4',
  steer: 'M3 8h8M8 4l4 4-4 4', gauge: 'M3 11a5 5 0 1 1 10 0M8 11l2.5-3', shield: 'M8 2.5l4.5 1.5v3.5c0 3-2 5-4.5 6-2.5-1-4.5-3-4.5-6V4z', owl: 'M4 4l1.5 1.5M12 4l-1.5 1.5M4 8a2 2 0 1 0 4 0 2 2 0 1 0-4 0M8 8a2 2 0 1 0 4 0 2 2 0 1 0-4 0',
  plus: 'M8 3v10M3 8h10', dots: 'M4 8h.01M8 8h.01M12 8h.01', eye: 'M2 8s2.2-4 6-4 6 4 6 4-2.2 4-6 4-6-4-6-4zM8 6.5a1.5 1.5 0 1 0 0 3'
}
const svg = d => `<span class="ico"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="${d}"/></svg></span>`
const icon = (d, label) => `<button class="iconbtn" aria-label="${label}" title="${label}">${svg(d)}</button>`
const CL = '<span class="mark claude" aria-hidden="true">✳</span>', CX = '<span class="mark codex" aria-hidden="true">◎</span>'
const chev = '<span class="chev" aria-hidden="true">⌄</span>'
const Q = ['Also update the README section on remote hosts', 'Then run the host contract tests again']

function transcript(busy) {
  return `<div class="msg"><span class="who">You</span>Make the Usage index wrap into a grid when the window is narrow.</div>
  <div class="msg"><span class="who">Claude</span>The index becomes a sideways row under 780 pixels. I'll switch it to a two-column grid there and let the chart follow the room.</div>
  ${busy ? '<div class="working"><i></i>Editing usage.css</div>' : ''}`
}

/* ---- Today, after #1368: soft squares, still a box each ---- */
function today(s) {
  if (s === 'watcher') return `<div class="cmp"><div class="text ph">Ask about your threads, or say what to start or send</div>
    <div class="foot">${icon(I.clip, 'Attach')}<span class="btn">${svg(I.plus)} New Watcher</span><span class="chip">${CX} GPT-5.4 ${chev}</span><span class="chip wide-only">Ask for approval ${chev}</span><span class="end"><button class="send" aria-label="Send">↑</button></span></div></div>`
  const busy = s === 'busy'
  return `${busy ? `<div class="queue">${Q.map((t, i) => `<div class="qrow"><span class="n">${i + 1}</span><span class="q">${t}</span><span class="btn">Steer now</span>${icon(I.edit, 'Edit queued message ' + (i + 1))}${icon(I.x, 'Remove queued message ' + (i + 1))}</div>`).join('')}</div>` : ''}
  <div class="cmp"${busy ? ' data-running' : ''}><div class="text${busy ? '' : ' ph'}">${busy ? 'And keep the 820 layout in the verification note' : 'Ask for follow-up changes'}</div>
  <div class="foot">${icon(I.clip, 'Attach')}<span class="chip">${CL} Opus 5.5 ${chev}</span><span class="chip">High ${chev}</span><span class="chip">Full access ${chev}</span>
  <span class="end">${busy ? '<span class="btn">Steer now</span><button class="send stop" aria-label="Stop"></button>' : '<button class="send" aria-label="Send">↑</button>'}</span></div></div>
  <div class="under"><span class="chip">${svg(I.host)} forge ${chev}</span><span class="chip">${svg(I.ws)} Current checkout ${chev}</span><span class="chip">${svg(I.br)} main ${chev}</span></div>`
}

/* ---- A · Quiet line ---- */
function dirA(s) {
  if (s === 'watcher') return `<div class="cmp"><div class="text ph">Ask about your threads, or say what to start or send</div>
    <div class="foot">${icon(I.clip, 'Attach')}<button class="tb">${svg(I.plus)} New Watcher</button><span class="dotsep">·</span><button class="tb">${CX} GPT-5.4 ${chev}</button><button class="tb muted">Ask for approval ${chev}</button><span class="end"><button class="send" aria-label="Send">↑</button></span></div></div>`
  const busy = s === 'busy'
  return `${busy ? `<div class="aq" role="list" aria-label="Queued messages"><div class="lab">Queued · sends when Claude finishes</div>${Q.map((t, i) => `<div class="qline" role="listitem"><span class="q">${t}</span><button class="tb accent">${svg(I.steer)} Steer now</button>${icon(I.edit, 'Edit queued message ' + (i + 1))}${icon(I.x, 'Remove queued message ' + (i + 1))}</div>`).join('')}</div>` : ''}
  <div class="cmp"${busy ? ' data-running' : ''}><div class="text${busy ? '' : ' ph'}">${busy ? 'And keep the 820 layout in the verification note' : 'Ask for follow-up changes'}</div>
  <div class="foot">${icon(I.clip, 'Attach')}<button class="tb" aria-label="Model: Opus 5.5">${CL} Opus 5.5 ${chev}</button><button class="tb muted" aria-label="Reasoning: High">High ${chev}</button><button class="tb muted" aria-label="Permissions: Full access"><span class="lbl-long">Full access</span><span class="ico" aria-hidden="true">${svg(I.shield)}</span> ${chev}</button>
  <span class="end">${busy ? '<button class="tb accent">Steer now <span class="k">Ctrl ↵</span></button><button class="send stop" aria-label="Stop"></button>' : '<button class="send" aria-label="Send">↑</button>'}</span></div></div>
  <div class="aline"><button class="tb">${svg(I.host)} forge</button><span class="dotsep">·</span><button class="tb">${svg(I.ws)} Current checkout</button><span class="dotsep">·</span><button class="tb">${svg(I.br)} main</button></div>`
}

/* ---- B · One settings button ---- */
function dirB(s) {
  const setBtn = (open, label = `${CL}<span class="v">Opus 5.5</span><span class="sep">·</span><span class="v">High</span><span class="sep wide-only">·</span><span class="v wide-only">Full access</span>`) =>
    `<button class="qb" aria-haspopup="dialog" aria-expanded="${open}" aria-label="Thread settings: Opus 5.5, High reasoning, Full access">${label} ${chev}</button>`
  if (s === 'watcher') return `<div class="cmp"><div class="text ph">Ask about your threads, or say what to start or send</div>
    <div class="foot">${icon(I.clip, 'Attach')}${icon(I.plus, 'New Watcher')}<button class="qb" aria-label="Watcher settings: GPT-5.4, Ask for approval">${CX}<span class="v">GPT-5.4</span><span class="sep">·</span><span class="v">Ask for approval</span> ${chev}</button><span class="end"><button class="send" aria-label="Send">↑</button></span></div></div>`
  const busy = s === 'busy', open = s === 'menu'
  const menu = open ? `<div class="menu" role="dialog" aria-label="Thread settings"><h5>MODEL <kbd>Ctrl ⇧ O</kbd></h5>
    <div class="opt on hl">${CL} Opus 5.5</div><div class="opt">${CL} Sonnet 5.5</div><div class="opt">${CX} GPT-6.1-Sol</div>
    <h5>REASONING</h5><div class="rowopts"><span>Low</span><span>Medium</span><span class="on">High</span><span>Max</span></div>
    <h5>PERMISSIONS</h5><div class="rowopts"><span>Ask first</span><span>Edits</span><span class="on">Full access</span></div>
    <hr><div class="hint">Arrow keys move, Enter picks, Esc closes.</div></div>` : ''
  return `${busy ? `<div class="bq"><span class="tag">2 queued</span><span class="q">· ${Q[0]}</span><button class="tb accent">${svg(I.steer)} Steer now</button>${icon(I.dots, 'Queued message actions')}</div>` : ''}
  <div class="cmp"${busy ? ' data-running' : ''}>${menu}<div class="text${busy ? '' : ' ph'}">${busy ? 'And keep the 820 layout in the verification note' : 'Ask for follow-up changes'}</div>
  <div class="foot">${icon(I.clip, 'Attach')}${setBtn(open)}
  <span class="end">${busy ? '<span class="split"><button aria-label="Queue this message">Queue ↵</button><button aria-label="Steer now: send without waiting">Steer</button></span><button class="send stop" aria-label="Stop"></button>' : '<button class="send" aria-label="Send">↑</button>'}</span></div></div>
  <div class="aline"><button class="qb" style="height:26px;font-size:12.5px;color:var(--muted)" aria-label="Where it runs: forge, Current checkout, main">${svg(I.host)} forge <span class="sep">/</span> Current checkout <span class="sep">/</span> ${svg(I.br)} main ${chev}</button></div>`
}

/* ---- C · Split by lifecycle ---- */
function dirC(s) {
  if (s === 'watcher') return `<div class="cmp"><div class="text ph">Ask about your threads, or say what to start or send</div>
    <div class="foot">${icon(I.clip, 'Attach')}<button class="tb" aria-label="Model: GPT-5.4">${CX} GPT-5.4 ${chev}</button><button class="tb muted" aria-label="Permissions: Ask for approval">${svg(I.shield)}<span class="lbl-long">Ask for approval</span> ${chev}</button><span class="end"><button class="send" aria-label="Send">↑</button></span></div></div>`
  const busy = s === 'busy'
  return `<div class="cmp"${busy ? ' data-running' : ''}>
  ${busy ? `<div class="inq" role="list" aria-label="Queued messages">${Q.map((t, i) => `<div class="qline" role="listitem"><span class="n">${i + 1}</span><span class="q">${t}</span><button class="tb accent" aria-label="Steer now: send queued message ${i + 1} without waiting">${svg(I.steer)}<span class="lbl-long">Steer now</span></button>${icon(I.edit, 'Edit queued message ' + (i + 1))}${icon(I.x, 'Remove queued message ' + (i + 1))}</div>`).join('')}</div>` : ''}
  <div class="text${busy ? '' : ' ph'}">${busy ? 'And keep the 820 layout in the verification note' : 'Ask for follow-up changes'}</div>
  <div class="foot">${icon(I.clip, 'Attach')}<div class="cfoot-c"><button class="tb" aria-label="Model: Opus 5.5">${CL} Opus 5.5 ${chev}</button><button class="tb muted" aria-label="Reasoning: High">${svg(I.gauge)} High ${chev}</button><button class="tb muted" aria-label="Permissions: Full access">${svg(I.shield)}<span class="lbl-long">Full access</span> ${chev}</button></div>
  <span class="end">${busy ? '<button class="tb accent" title="Send this now, without waiting">Steer now <span class="k">Ctrl ↵</span></button><button class="send stop" aria-label="Stop"></button>' : '<button class="send" aria-label="Send">↑</button>'}</span></div></div>`
}
const header = (w, d) => {
  const crumbs = d === 'C'
    ? `<span class="crumbs" role="group" aria-label="Where this thread runs"><button class="crumb">${svg(I.host)} forge</button><span class="crumbsep">›</span><button class="crumb"><span class="wide-only">Current checkout</span><span style="display:${w === 820 ? 'inline' : 'none'}">Checkout</span></button><span class="crumbsep">›</span><button class="crumb">${svg(I.br)} main</button></span>`
    : `<span class="crumbs">${icon(I.eye, 'Watch')}${icon(I.dots, 'More')}</span>`
  return `<div class="head"><span class="mark claude">✳</span><b>Usage index wraps when narrow</b>${crumbs}</div>`
}
const watcherHead = d => `<div class="head">${svg(I.owl)}<b>Watcher</b><span class="crumbs">${d === 'C' ? `<button class="crumb">${svg(I.plus)} New Watcher</button>` : ''}</span></div>`
const render1 = (d, scene) => ({ today, A: dirA, B: dirB, C: dirC })[d](scene)
const paneW = w => w === 820 ? 560 : 1000

function pane(d, scene) {
  const w = st.w
  const head = scene === 'watcher' ? watcherHead(d) : header(w, d)
  const body = scene === 'watcher' ? `<div class="msg"><span class="who">You</span>Keep an eye on the footer links and the visual gate.</div>` : scene === 'menu' ? '<div style="height:300px"></div>' : transcript(scene === 'busy')
  return `<div class="stage"><div class="pane" data-w="${w}" style="--pw:${paneW(w)}px">${head}<div class="col">${body}${render1(d, scene)}</div></div></div>`
}
const NOTES = {
  today: '<b>Today</b>, after #1368: soft squares, but still eight boxed controls in a busy thread.',
  A: `<b>A · Quiet line.</b> Every control stays where it is today but loses its box: values are text buttons with a chevron, 28px tall with a hover wash, so the hit area does not shrink. Where it runs is one muted line under the composer. Queued messages hang off a thin accent rule above it.
     <ul><li>Like the row under the prompt in Claude's desktop app and the text controls in Claude Code for VS Code.</li><li>Narrow: Full access shrinks to its shield, with the name kept for screen readers.</li></ul>`,
  B: `<b>B · One settings button.</b> Model, reasoning and permissions are one quiet button that opens one panel (shown in "Settings open"). Where it runs is one button too. While a turn runs, the send area becomes <i>Queue</i> or <i>Steer</i>, and the queue folds to one line with a menu.
     <ul><li>Like Codex's combined model and effort control and Claude Code's model picker with effort inside.</li><li>Fewest things on screen; changing permissions mid-run takes two presses.</li></ul>`,
  C: `<b>C · Split by lifecycle.</b> Where a thread runs is chosen once, so forge, Current checkout and main move up to the thread's header as a path. The composer keeps only what the next message uses, as text with small icons. Queued messages live inside the composer, above what you type.
     <ul><li>Like the worktree and branch controls in the Codex app's header and Zed's title-bar worktree picker.</li><li>Watcher's New Watcher moves to Watcher's header the same way.</li></ul>`
}
const KEYS = {
  today: '',
  A: `<b>Keyboard.</b> Tab goes Attach → Model → Reasoning → Permissions → (Steer now) → Send/Stop → forge → Current checkout → main. Enter queues while a turn runs; <kbd>Ctrl ↵</kbd> steers now. Every text button keeps a visible focus ring and a name that says its value ("Model: Opus 5.5").`,
  B: `<b>Keyboard.</b> Tab goes Attach → Thread settings → Queue/Steer → Stop → Where it runs. The settings panel is one dialog: arrow keys move, Enter picks, Esc closes and returns focus. <kbd>Ctrl ⇧ O</kbd> opens it (not M: <kbd>Ctrl ⇧ M</kbd> is pane zoom, and Ctrl ⇧ G/X/L are the branch toolbar's).`,
  C: `<b>Keyboard.</b> In the composer, Tab goes queued 1 (Steer now, Edit, Remove) → queued 2 → text → Attach → Model → Reasoning → Permissions → Steer now → Stop. The header path is reached from the header, in the order the eye reads it. <kbd>Ctrl ↵</kbd> steers now.`
}
function render() {
  document.documentElement.dataset.mode = st.mode
  const b = (k, v, l) => `<button aria-pressed="${st[k] === v}" data-k="${k}" data-v="${v}">${l}</button>`
  document.getElementById('dirs').innerHTML = `<span>Direction</span>${Object.entries(DIRS).map(([k, v]) => b('d', k, v)).join('')}`
  document.getElementById('opts').innerHTML = `<span>Window</span>${b('w', 1280, '1280 (1000 pane)')}${b('w', 820, '820 minimum (560 pane)')}<span style="margin-left:10px">Mode</span>${b('mode', 'dark', 'Dark')}${b('mode', 'light', 'Light')}`
  const d = st.d
  const scenes = [['idle', 'A new message'], ['busy', 'Running, 2 queued, Steer now available'], ...(d === 'B' ? [['menu', 'Settings open']] : []), ['watcher', "Watcher's composer"]]
  let html = `<div class="rv-intro">${NOTES[d]}</div>${KEYS[d] ? `<div class="keys">${KEYS[d]}</div>` : ''}`
  for (const [scene, label] of scenes) {
    const sideBySide = d !== 'today'
    html += `<p class="rv-scene">${label} <em>· ${st.w} window, real size</em></p><div class="pair">`
    if (sideBySide) html += `<div><p>Today</p>${scene === 'menu' ? '<div class="stage" style="width:' + paneW(st.w) + 'px;padding:40px 16px;color:var(--muted);background:var(--canvas)">Today has no combined panel: each chip opens its own list.</div>' : pane('today', scene)}</div>`
    html += `<div><p>${DIRS[d]}</p>${pane(d, scene)}</div></div>`
  }
  document.getElementById('body').innerHTML = html
  document.getElementById('sw').textContent = `${DIRS[d]} · ${st.w} · ${st.mode}`
  history.replaceState(null, '', '?' + new URLSearchParams({ d, w: st.w, mode: st.mode }))
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-k]'); if (!t) return
  st[t.dataset.k] = t.dataset.k === 'w' ? +t.dataset.v : t.dataset.v; render()
})
const order = ['today', 'A', 'B', 'C']
const cycle = n => { st.d = order[(order.indexOf(st.d) + n + order.length) % order.length]; render() }
document.getElementById('prev').onclick = () => cycle(-1); document.getElementById('next').onclick = () => cycle(1)
document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1) })
render()
</script>
</body>
</html>
