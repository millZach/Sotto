<!--
  PROTOTYPE - throwaway. Not shipped, not tested, not wired to anything.

  Question: pressing the owl in the Threads sidebar swaps the whole window in one frame. The sidebar vanishes, the thread
  pane becomes Watcher's room, and the foot controls (room switch, page icons, update) reappear as a pill centred under
  Watcher's composer. Drake found it abrupt and confusing, the controls "jump to the bottom of the prompt box".
  How should the window move between the two?

  Picked: not yet. Drake picks from the ten below.

  Ten variants, each running both ways (Threads to Watcher and back). Open one large with ?variant=N, step with the
  arrow keys, Space plays. Scrub with the slider. Reduced motion turns every variant into a 160 ms crossfade.
    1  Glide. The foot lifts off as one piece and glides to the dock while the sidebar slides away and the room fades in behind it.
    2  Stay put. The controls stay where your hand is. The sidebar melts away around its foot, which lifts into a card while the room arrives.
    3  Fold. The sidebar folds to its narrow rail first, then the rail slides away and the room fades in. Two short steps instead of one jump.
    4  Owl flight. The owl lifts out of its cell and flies to the dock in a few blocky wing beats, leaving dim dots. The pill opens around it as night comes in.
    5  Stretch. The room switch slides along the bottom edge to the dock and the pill grows out of it, while one room dissolves into the other.
    6  Iris. The owl dips as it is pressed, then a circle of night opens from it and spreads until the room fills the window.
    7  Pan. The window pans left to Watcher, which sits beside Threads. Threads slides out to the right while the room slides in, with the scene and the parts moving at their own depths.
    8  Zoom. Watcher opens out of the owl in the sidebar foot and grows to fill the window, while Threads stays in place and dims behind it.
    9  Night falls. A band of flickering ASCII sweeps from left to right. Threads breaks into glyphs ahead of it and the night room settles in behind it.
   10  Rise. The room rises from below the window edge as one sheet and covers Threads, which sinks a little and dims as the sheet passes over it.

  The stage is a 1280x800 window drawn in Citrine, the built-in theme Drake's screenshots show (colours from
  src/shared/themes/palettes.ts, checked against the raw pixels of his screenshots), with the real owl glyph and the real
  night scene painter, so the geometry matches the app: sidebar 268 wide with the foot at its bottom, Watcher's composer
  760 wide, the dock pill 398x42 centred under it. Known small differences: the foot's switch is 36 px tall here (34 in
  the app) and its labels are 14 px (12.5 px in the dock). The sliding lit thumb in several variants is a mock-up
  flourish: the real switch lights the selected button's own background.
  Built from sources kept outside the repo (a stage, an engine and one file per variant); this file is the artifact.
-->

:root {

  --canvas: #121211;
  --sidebar: #1c1c1c;
  --elev: #1d1d1d;
  --sunken: #202020;
  --seg-on: #232323;
  --field: #151515;
  --hairline: #504f4c;
  --hairline-faint: #383838;
  --text: #faf7ec;
  --text-2: #e3e1d4;
  --muted: #d0cdc0;
  --dim: #938d72;
  --accent-text: #faf7eb;
  --ink: #919088;
  --warn: #ffb900;
  --ok: #8fcf9e;
  --attn: #fe9a00;
  --selected: #363328;
  --hover: rgb(255 255 255 / 6%);
  --shadow-color: rgb(0 0 0 / 73%);
  --shadow-sm: 0 1px 2px rgb(0 0 0 / 40%);
  --win-shadow: 0 30px 80px -20px rgb(0 0 0 / 80%);
  --send: #595655;
  --prov-codex: #c9ced6;
  --prov-claude: #e2ad80;
  --prov-grok: #bfaefc;
  --lights-red: #ff5f57;
  --lights-yellow: #febc2e;
  --lights-green: #28c840;
  --page: #0e0e0d;

  --page-muted: #a09e99;
  --page-line: #2c2c2a;

}

:root[data-theme='light'] {
  --canvas: #f7f6f0;
  --sidebar: #e9e7e1;
  --elev: #f2f1ec;

  --seg-on: #fdfcf9;

/* The stage: one 1280x800 logical window holding both layouts at once. Every region is absolutely placed so the rects
   in BRIEF.md hold exactly. Colours come from tokens.css only. */
.win { position: relative; width: 1280px; height: 800px; overflow: hidden; border-radius: 12px; background: var(--canvas); color: var(--text);
  font: 14px/1.4 var(--font-ui); -webkit-font-smoothing: antialiased; user-select: none; box-shadow: var(--win-shadow); isolation: isolate; }
.win *, .win *::before, .win *::after { box-sizing: border-box; }
.win button { font: inherit; }
.win svg { display: block; }

.layer { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; background: var(--canvas); overflow: hidden; }
.layer--t { z-index: 1; }
.layer--w { z-index: 2; }
.win[data-view='threads'] .layer--w, .win[data-view='watcher'] .layer--t { visibility: hidden; }
.win[data-run] .layer { visibility: visible; }
.fx { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; z-index: 50; pointer-events: none; overflow: hidden; }
.fx .ghost { position: absolute; margin: 0; }
.fx canvas { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; }
.ghost-chrome { position: absolute; border: 1px solid var(--hairline); border-radius: 10px; background: var(--elev); box-shadow: 0 8px 22px -10px var(--shadow-color); opacity: 0; }

/* Persistent chrome: window controls and the owl tile never move in any variant. */
.win__chrome { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; z-index: 60; pointer-events: none; }
.lights { position: absolute; left: 14px; top: 16px; display: flex; gap: 8px; }

.lights i:nth-child(2) { background: var(--lights-yellow); }
.lights i:nth-child(3) { background: var(--lights-green); }
.tile { position: absolute; left: 84px; top: 10px; width: 24px; height: 24px; color: var(--accent-text); }

/* The controls shared by the sidebar foot and the dock pill. Styled by class alone so a clone in .fx looks the same. */
.ctl { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 7px;
  background: transparent; color: var(--muted); text-decoration: none; cursor: pointer; }
.ctl:hover { background: var(--hover); color: var(--text); }
.pages { display: flex; align-items: center; }
.seg { position: relative; display: grid; grid-template-columns: 46px minmax(0, 1fr); width: 236px; height: 36px; padding: 3px; border-radius: 6px; background: var(--sunken); }
.seg__thumb { position: absolute; top: 3px; height: 30px; border-radius: 4px; background: var(--seg-on); box-shadow: var(--shadow-sm); }
.seg[data-sel='owl'] .seg__thumb { left: 3px; width: 46px; }
.seg[data-sel='threads'] .seg__thumb { left: 49px; width: 184px; }
.seg__cell { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; min-width: 0; height: 30px; padding: 0; border: 0;
  border-radius: 4px; background: transparent; color: var(--muted); font-size: 14px; cursor: pointer; }
.seg__cell:hover { color: var(--text); }
.seg[data-sel='threads'] .seg__cell[data-ctl='threads'] { color: var(--text); }
.seg[data-sel='owl'] .seg__cell[data-ctl='owl'] { color: var(--accent-text); }
.owl { display: block; flex: none; fill: currentColor; }

/* ---------- Threads layer ---------- */
.t-sb { position: absolute; left: 0; top: 0; width: 268px; height: 800px; background: var(--sidebar); border-right: 1px solid var(--hairline); }
.t-top { position: absolute; left: 0; top: 0; width: 267px; height: 44px; }
.t-top .act { position: absolute; top: 8px; display: inline-grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 7px;
  background: transparent; color: var(--muted); }
.t-top .act:nth-child(1) { left: 173px; }
.t-top .act:nth-child(2) { left: 203px; }
.t-top .act:nth-child(3) { left: 233px; }
.t-search { position: absolute; left: 8px; top: 48px; display: flex; align-items: center; gap: 8px; width: 251px; height: 32px; padding: 0 10px;
  border: 1px solid var(--hairline-faint); border-radius: 6px; background: var(--field); color: var(--dim); font-size: 13.5px; }
.t-list { position: absolute; left: 0; top: 88px; width: 267px; height: 615px; padding: 4px 4px 0; overflow: hidden; }
.t-group { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 8px; color: var(--text-2); font-size: 13.5px; font-weight: 600; }
.t-group svg { color: var(--dim); }
.t-group em { margin-left: auto; color: var(--dim); font-size: 12px; font-style: normal; font-weight: 400; font-variant-numeric: tabular-nums; }
.t-row { position: relative; height: 54px; padding: 6px 10px 0 30px; border: 1px solid transparent; border-radius: 8px; }
.t-row[data-current] { background: var(--selected); border-color: var(--hairline-faint); }
.t-row .ring { position: absolute; left: 10px; top: 11px; width: 11px; height: 11px; border: 2px solid var(--dim); border-radius: 50%; }
.t-row[data-state='needs'] .ring { border-color: var(--attn); }
.t-row[data-state='working'] .ring { border-color: var(--ok); border-right-color: transparent; }
.t-title { display: block; overflow: hidden; padding-right: 64px; color: var(--text); font-size: 13.5px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.t-time { position: absolute; right: 10px; top: 7px; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
.t-meta { display: flex; align-items: center; gap: 6px; height: 22px; margin-top: 3px; color: var(--dim); }
.t-status { margin-left: auto; font-size: 12px; }
.t-status[data-state='needs'] { color: var(--warn); }
.t-status[data-state='working'] { color: var(--ok); }
.t-settled { display: flex; align-items: center; gap: 8px; height: 30px; margin: 8px 4px 0; padding: 0 10px; color: var(--text-2); font-size: 13.5px; }
.t-sb .foot { position: absolute; left: 10px; top: 709px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px 0; width: 248px; height: 91px;
  padding: 8px 6px 10px; border-top: 1px solid var(--hairline); }
.t-sb .foot .seg { flex: 1 0 100%; }
.t-sb .foot .upd { margin-left: auto; }

.t-pane { position: absolute; left: 268px; top: 0; width: 1012px; height: 800px; }
.t-head { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 8px; width: 1012px; height: 44px; padding: 0 18px 0 24px; }
.t-head h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.1px; }
.t-head .sub { color: var(--dim); font-size: 13px; }
.t-head .chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 7px; color: var(--muted); font-size: 13px; }
.t-head .tools { display: flex; gap: 2px; margin-left: auto; color: var(--muted); }
.t-head .tools i { display: inline-grid; place-items: center; width: 28px; height: 28px; }
.t-badge { color: var(--muted); }
.t-msgs { position: absolute; left: 126px; top: 70px; width: 760px; }
.t-user { margin: 0 0 26px 80px; padding: 12px 18px 16px; border: 1px solid var(--hairline-faint); border-radius: 12px; background: var(--elev); font-size: 15px; line-height: 1.55; }
.t-user small, .t-who small { margin-left: 8px; color: var(--dim); font-size: 12px; font-weight: 400; }
.t-user b, .t-who b { font-size: 12.5px; font-weight: 600; }
.t-user p, .t-reply { margin: 6px 0 0; }
.t-who { padding: 0 2px; }
.t-reply { font-size: 15px; line-height: 1.6; color: var(--text-2); }
.t-working { display: flex; align-items: center; gap: 8px; margin-top: 18px; color: var(--muted); font-size: 14px; }
.t-working i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.t-composer { position: absolute; left: 126px; top: 630px; width: 760px; height: 115px; border: 1px solid var(--hairline-faint); border-radius: 14px; background: var(--elev); }

.t-composer .row { position: absolute; left: 10px; bottom: 10px; display: flex; align-items: center; gap: 8px; }
.t-composer .stop { position: absolute; right: 10px; bottom: 10px; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--accent-text); color: var(--canvas); }
.t-composer .stop i { width: 10px; height: 10px; border-radius: 2px; background: currentColor; }
.t-note { position: absolute; left: 132px; top: 756px; display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
.pill-chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border: 1px solid var(--hairline-faint); border-radius: 999px; color: var(--muted); font-size: 13px; }
.pill-chip svg { color: var(--dim); }
.plain-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 8px; color: var(--muted); font-size: 13.5px; }

/* ---------- Watcher layer ---------- */
.w-scene { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; }
.w-head { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 14px; width: 1280px; height: 44px; padding-left: 116px; }
.w-head h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.1px; }
.w-all { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 13px; }
.w-tabs { display: inline-flex; gap: 2px; height: 34px; padding: 3px; border: 1px solid var(--hairline-faint); border-radius: 8px; background: color-mix(in srgb, var(--canvas) 70%, var(--sunken)); }
.w-tabs span { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 12px; border-radius: 5px; color: var(--muted); font-size: 13px; }
.w-tabs span.on { background: var(--seg-on); color: var(--text); box-shadow: var(--shadow-sm); }
.w-tabs em { color: var(--dim); font-size: 12px; font-style: normal; }
.w-need { position: absolute; left: 260px; top: 54px; display: flex; align-items: center; gap: 14px; width: 760px; height: 22px; font-size: 13px; color: var(--dim); }
.w-need b { color: var(--warn); font-weight: 600; }
.w-need u { color: var(--text); font-weight: 600; text-decoration-color: color-mix(in srgb, var(--text) 40%, transparent); text-underline-offset: 3px; }
.w-need i { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border: 2px solid var(--attn); border-radius: 50%; }
.w-rule { position: absolute; left: 260px; top: 86px; width: 760px; height: 1px; background: var(--hairline-faint); }
.w-body { position: absolute; left: 260px; top: 180px; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 760px; text-align: center; }
.w-body svg { color: var(--muted); }
.w-body b { font-size: 15px; font-weight: 600; }
.w-body p { margin: 0; color: var(--dim); font-size: 13px; }
.w-composer { position: absolute; left: 260px; top: 590px; width: 760px; height: 135px; border-radius: 14px; background: var(--elev); }
.w-composer .ph { position: absolute; left: 18px; top: 16px; color: var(--muted); font-size: 16px; }
.w-composer .row { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 6px; }
.w-composer .send { display: grid; place-items: center; width: 34px; height: 34px; margin-left: auto; border-radius: 8px; background: var(--send); color: var(--muted); }
.w-dock { position: absolute; left: 0; bottom: 0; width: 1280px; height: 54px; }

.pill .sep { flex: none; width: 1px; height: 18px; margin: 0 5px; background: var(--hairline); }

.win[data-dock='corner'] .w-dock { left: 0; top: 0; width: 268px; height: 800px; }

.win[data-dock='corner'] .pill .seg { order: -1; flex: 1 0 100%; }
.win[data-dock='corner'] .pill .upd { margin-left: auto; }

/* The page around the stages: header, cards, scrubber, focus bar. Main-loop owned. */
html { background: var(--page); color: var(--page-text); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100vh; }
button { font: inherit; }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px 32px; max-width: 1520px; margin: 0 auto; padding: 30px 32px 6px; }

.top p { max-width: 64ch; margin: 8px 0 0; color: var(--page-muted); font-size: 14px; line-height: 1.55; }
.toolbar { position: sticky; top: 0; z-index: 30; border-bottom: 1px solid var(--page-line); background: color-mix(in srgb, var(--page) 94%, transparent); }
.toolbar .tools { max-width: 1520px; margin: 0 auto; padding: 10px 32px; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.tools .all { height: 36px; padding: 0 14px; border: 1px solid var(--page-line); border-radius: 9px; background: var(--page-card); color: var(--page-text); font-size: 13px; cursor: pointer; }
.tools .all:hover { background: var(--page-line); }
.tools .group { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--page-line); border-radius: 9px; background: var(--page-card); }
.tools .label { padding: 0 6px 0 8px; color: var(--page-muted); font-size: 12.5px; align-self: center; }
.tools button { height: 28px; padding: 0 11px; border: 0; border-radius: 6px; background: transparent; color: var(--page-muted); font-size: 13px; cursor: pointer; }
.tools button[aria-pressed='true'] { background: var(--page-line); color: var(--page-text); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 26px; max-width: 1520px; margin: 0 auto; padding: 22px 32px 110px; }
.card { min-width: 0; padding: 16px 16px 14px; border: 1px solid var(--page-line); border-radius: 16px; background: var(--page-card); }
.card__head { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1px 12px; align-items: center; margin-bottom: 12px; padding-right: 92px; cursor: pointer; }
.card__open { position: absolute; right: 0; top: 0; height: 26px; padding: 0 10px; border: 1px solid var(--page-line); border-radius: 7px; background: transparent; color: var(--page-muted); font-size: 12.5px; cursor: pointer; }
.card__open:hover { background: var(--page-line); color: var(--page-text); }
.card__n { grid-row: 1 / 3; display: grid; place-items: center; width: 32px; height: 32px; border: 1px solid var(--page-line); border-radius: 50%; color: var(--page-muted); font-size: 14px; font-weight: 600; }
.card__head h2 { margin: 0; font-size: 16px; font-weight: 600; }
.card__feel { margin: 0; color: var(--page-muted); font-size: 13.5px; line-height: 1.45; }
.card__stage { overflow: hidden; border-radius: 12px; line-height: 0; }
.viewport { overflow: hidden; }
.card__ctl { display: flex; align-items: center; gap: 12px; margin: 12px 0 4px; }
.play { flex: none; min-width: 108px; height: 32px; padding: 0 14px; border: 1px solid var(--page-line); border-radius: 8px; background: var(--page-text); color: var(--page); font-size: 13px; font-weight: 600; cursor: pointer; }
.scrub { flex: 1; min-width: 0; accent-color: var(--page-text); }
.time { flex: none; min-width: 88px; color: var(--page-muted); font: 12px var(--font-mono); text-align: right; }
.card__notes { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 14px; margin: 12px 0 0; font-size: 12.5px; line-height: 1.5; }
.card__notes dt { color: var(--page-muted); }
.card__notes dd { margin: 0; }
.bar { position: fixed; left: 50%; bottom: 18px; z-index: 20; display: none; align-items: center; gap: 6px; padding: 6px; border: 1px solid var(--page-line); border-radius: 12px; background: var(--page-card); box-shadow: 0 12px 40px -12px rgb(0 0 0 / 60%); transform: translateX(-50%); }
.bar button { height: 32px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--page-text); font-size: 13px; cursor: pointer; }
.bar button:hover { background: var(--page-line); }
.bar span { min-width: 190px; padding: 0 8px; text-align: center; font-size: 13px; }
body[data-focus] .bar { display: flex; }
body[data-focus] .card:not([data-focus]) { display: none; }
body[data-focus] .top { display: none; }
body[data-focus] .grid { grid-template-columns: minmax(0, min(1280px, calc((100vh - 320px) * 1.6))); justify-content: center; padding-top: 14px; }
body[data-focus] .card__open { display: none; }
body[data-bare] .top, body[data-bare] .toolbar, body[data-bare] .bar, body[data-bare] .card__head, body[data-bare] .card__ctl, body[data-bare] .card__notes { display: none; }
body[data-bare] .grid { display: block; max-width: none; padding: 0; }
body[data-bare] .card { padding: 0; border: 0; border-radius: 0; background: transparent; }
body[data-bare] .card__stage { border-radius: 0; }
body[data-bare] .win { border-radius: 0; box-shadow: none; }

      { transform: `translate(${dx * 0.85}px, ${dy * 0.85}px)`, opacity: 0, offset: 0.8 },
      { transform: `translate(${dx}px, ${dy}px)`, opacity: 0 }], { delay: 40, duration: 600, easing: ease.inOut })
    r.anim(P.wComposer, [
      { transform: `translate(${-dx}px, ${-dy}px)`, opacity: 0 },
      { transform: `translate(${-dx * 0.4}px, ${-dy * 0.4}px)`, opacity: 1, offset: 0.55 },
      { transform: `translate(${-dx * 0.15}px, ${-dy * 0.15}px)`, opacity: 1, offset: 0.8 },
      { transform: 'translate(0px, 0px)', opacity: 1 }], { delay: 40, duration: 600, easing: ease.inOut })

    // The foot becomes the card: its top hairline grows into a full outline, radius and shadow, and it lifts 10 px.

    r.anim(chrome.el, r.sample(20, u => {

        borderTopColor: hair, borderLeftColor: side, borderRightColor: side, borderBottomColor: side,

/* src/variants/03-fold.js */
/* 3 Fold: a staged transition through the sidebar's collapsed rail. Stage A folds the sidebar to an 80 px rail with the
   controls stacked at its foot; stage B lays the stack down into the dock's row as the rail slides off. */
Transitions.register({
  id: 'fold', n: 3, name: 'Fold',
  feel: 'The sidebar folds to its narrow rail first, then the rail slides away and the room fades in. Two short steps instead of one jump.',
  controls: 'First the switch shrinks to the owl and the page icons stack in a column at the rail\'s foot. Then a pill outline gathers the column and lays it down into the dock\'s row.',
  cost: 'Custom code. A temporary rail that is never saved, with an owl button in it, and the foot rects captured before the Threads page unmounts. Then a staged FLIP from the rail icons to the pill.',
  duration: 840,
  run(r) {
    const { s, R, ease, fn, lerp, clamp } = r, P = s.part, T = 840, A = 0.42
    r.stack('t-over-w')
    const bg = s.T.style.background; s.T.style.background = 'transparent'; r.undo(() => { s.T.style.background = bg })
    const ov = P.sb.style.overflow; P.sb.style.overflow = 'hidden'; r.undo(() => { P.sb.style.overflow = ov })
    const seg01 = (u, a, b, f = fn.inOut) => f(clamp((u - a) / (b - a), 0, 1))

    // Stage A: the sidebar folds to an 80 px rail. Stage B: the rail slides off.
    r.anim(P.sb, r.sample(28, u => {
      const a = seg01(u, 0.02, A), b = seg01(u, 0.46, 0.86)
      return { width: lerp(268, 80, a) + 'px', transform: `translateX(${-81 * b}px)` }
    }))
    r.fade(P.sbTop, 1, 0, { duration: 0.22 * T, easing: ease.soft })
    r.fade(P.search, 1, 0, { duration: 0.26 * T, easing: ease.soft })
    // Thread rows shrink to their status rings: the text fades and the rail clips what is left.
    for (const el of s.qa('.t-row .t-title, .t-row .t-meta, .t-group, .t-settled')) r.fade(el, 1, 0, { delay: 0.02 * T, duration: 0.28 * T, easing: ease.soft })
    // The foot's hairline rises above the stacked column and narrows with the rail.
    r.anim(P.foot, [{ transform: 'translateY(0px)', width: '248px' }, { transform: 'translateY(-109px)', width: '60px' }], { delay: 0.02 * T, duration: (A - 0.02) * T, easing: ease.inOut })

    // The thread pane keeps its column centred in the wider pane, then hands its composer to the room.
    const shift = -94
    r.anim(P.tHead, [{ transform: 'translateX(0px)', opacity: 1 }, { transform: 'translateX(-188px)', opacity: 1, offset: 0.6 }, { transform: 'translateX(-188px)', opacity: 0 }], { duration: 0.62 * T, easing: ease.inOut })
    for (const el of [P.tMsgs, P.tNote]) r.anim(el, [{ transform: 'translateX(0px)', opacity: 1 }, { transform: `translateX(${shift}px)`, opacity: 1, offset: 0.72 }, { transform: `translateX(${shift}px)`, opacity: 0 }], { duration: 0.64 * T, easing: ease.inOut })
    const cdx = R.wComposer.x - R.tComposer.x, cdy = R.wComposer.y - R.tComposer.y
    r.anim(P.tComposer, r.sample(24, u => {
      const a = seg01(u, 0.02, A), b = seg01(u, A, 0.64)
      return { transform: `translate(${lerp(0, shift, a) + (cdx - shift) * b}px, ${cdy * b}px)`, opacity: 1 - seg01(u, 0.64, 0.74, fn.linear) }
    }))

    // The room arrives during stage B, overlapping the rail's exit.
    r.fade(P.wScene, 0, 1, { delay: 0.26 * T, duration: 0.42 * T, easing: ease.soft })
    r.fade(P.wHead, 0, 1, { delay: 0.36 * T, duration: 0.3 * T })
    for (const el of [P.wNeed, P.wRule, P.wBody]) r.fade(el, 0, 1, { delay: 0.46 * T, duration: 0.3 * T })
    r.fade(P.wComposer, 0, 1, { delay: 0.52 * T, duration: 0.12 * T })
    r.fade(P.dock, 0, 1, { delay: 0.9 * T, duration: 0.1 * T })

    // The rail's column: usage, settings, help, switch (owl only), update, bottom up from the window edge, centred on x 40.
    const rail = { usage: { x: 25, y: 612 }, settings: { x: 25, y: 646 }, help: { x: 25, y: 680 }, seg: { x: 14, y: 716 }, update: { x: 25, y: 760 } }
    const order = ['usage', 'settings', 'help', 'seg', 'update']
    // Stage B lay-down window: the outline and every control share it, so the controls stay inside the outline in flight.
    const LA = A + 0.03, LB = 0.92

    // A pill outline gathers the column at the start of stage B and lays down with it into the dock.
    const col = { x: 8, y: 604, w: 64, h: 194 }, d = R.pill, chrome = r.ghostChrome()
    r.anim(chrome.el, r.sample(32, u => {
      const e = seg01(u, LA, LB)
      return { left: lerp(col.x, d.x, e) + 'px', top: lerp(col.y, d.y, e) + 'px', width: lerp(col.w, d.w, e) + 'px', height: lerp(col.h, d.h, e) + 'px',
        opacity: seg01(u, A - 0.02, A + 0.1, fn.linear) * (1 - seg01(u, 0.92, 1, fn.linear)) }
    }))

    // Each control: foot, then rail (offset A), then its pill slot.
    const path = (g, k, extra) => r.sample(40, u => {
      const a = seg01(u, 0.03, A), b = seg01(u, LA, LB)
      const rx = rail[order[k]].x - g.from.x, ry = rail[order[k]].y - g.from.y
      const x = lerp(0, rx, a) + (g.dx - rx) * b, y = lerp(0, ry, a) + (g.dy - ry) * b
      return { transform: `translate(${x}px, ${y}px)`, ...(extra ? extra(u, a, b) : {}) }
    })

    r.ghostSeg()
    order.forEach((id, k) => {
      if (id === 'seg') {
        const g = r.ghostSeg()
        g.el.style.overflow = 'hidden'
        // The switch shrinks to the owl cell in the rail and opens back to its full width in the pill.
        r.anim(g.el, path(g, k, (u, a, b) => ({ width: (236 - 184 * a + 184 * b) + 'px' })))
        r.anim(g.cells.threads, r.sample(20, u => ({ opacity: 1 - seg01(u, 0.02, 0.22, fn.linear) + seg01(u, 0.72, 0.92, fn.linear) })))
        r.slideThumb(g, { delay: 0.1 * T, duration: 0.26 * T, easing: ease.inOut })
        return
      }
      const g = r.ghost(id)
      r.anim(g.el, path(g, k))
    })
  },
})

/* src/variants/04-owl-flight.js */
/* 4 Owl flight: only the owl travels; the pill unfolds around its landing. */
Transitions.register({
  id: 'owl-flight', n: 4, name: 'Owl flight',
  feel: 'The owl lifts out of its cell and flies to the dock in a few blocky wing beats, leaving dim dots. The pill opens around it as night comes in.',
  controls: 'The owl flies from the foot to its slot. While the rest of the foot fades where it is, the pill already grows out of the owl\'s slot, and the icons and the Threads label come out of its ends.',
  cost: 'Threads unmounts when Watcher opens, so capture the owl\'s and the foot\'s rects first (or use the View Transitions API), grow the pill from the owl\'s slot, and draw the trail on a canvas or a few spans.',
  duration: 820,
  run(r) {
    const { s, R, ease, fn, lerp, clamp } = r, P = s.part
    const cssVar = window.StageHelpers.cssVar
    r.stack('t-over-w')
    const bg = s.T.style.background; s.T.style.background = 'transparent'; r.undo(() => { s.T.style.background = bg })

    // Beats (ms): owl lifts 0-90, flies 90-600, lands 600; the foot fades 180-480; the pill opens 300-790, so the two overlap.
    const FLY0 = 90, FLY1 = 600, OPEN0 = 300, OPEN1 = 790

    // The old room leaves, the new one comes in.
    r.anim(P.sb, [{ transform: 'translateX(0)' }, { transform: 'translateX(-268px)' }], { delay: 200, duration: 500, easing: ease.inOut })
    r.fade(P.foot, 1, 0, { delay: 180, duration: 300, easing: ease.soft })
    for (const el of [P.tHead, P.tMsgs, P.tNote]) r.fade(el, 1, 0, { delay: 120, duration: 360, easing: ease.soft })
    const cdx = R.wComposer.x - R.tComposer.x, cdy = R.wComposer.y - R.tComposer.y
    r.anim(P.tComposer, [
      { transform: 'translate(0px, 0px)', opacity: 1 },
      { transform: `translate(${cdx}px, ${cdy}px)`, opacity: 1, offset: 0.7 },
      { transform: `translate(${cdx}px, ${cdy}px)`, opacity: 0 }], { delay: 140, duration: 560, easing: ease.inOut })
    r.fade(P.wScene, 0, 1, { delay: 60, duration: 480, easing: ease.out })
    r.fade(P.wHead, 0, 1, { delay: 120, duration: 320 })
    for (const el of [P.wNeed, P.wRule, P.wBody]) r.fade(el, 0, 1, { delay: 160, duration: 320 })
    r.anim(P.wComposer, [{ opacity: 0 }, { opacity: 1 }], { delay: 340, duration: 280, easing: ease.out })
    // The real dock stays out of sight until the ghosts sit on it; then the chrome steps aside so its separators show.
    r.fade(P.dock, 0, 1, { delay: 750, duration: 20 })

    // Ghosts, in z-order: chrome, switch, icons, then the owl on top.
    const d = R.d, o = d.owl
    const chrome = r.ghostChrome()
    const cx = Math.round(o.x + o.w / 2)
    const L = u => lerp(o.x - 2, R.pill.x, u), Rt = u => lerp(o.x + o.w + 2, R.pill.x + R.pill.w, u)
    r.anim(chrome.el, r.sample(24, u => {
      const e = fn.out(u)
      return { left: L(e) + 'px', width: (Rt(e) - L(e)) + 'px', top: lerp(o.y - 4, R.pill.y, e) + 'px', height: lerp(o.h + 8, R.pill.h, e) + 'px',
        borderRadius: '10px', opacity: u >= 0.96 ? 0 : Math.min(1, u / 0.15) }
    }), { delay: OPEN0, duration: OPEN1 - OPEN0 })
    // When does the chrome's edge pass x? Solve fn.out(e) for the edge, then delay the control by that much.
    const edgeAt = x => {
      for (let i = 0; i <= 60; i++) { const u = i / 60, e = fn.out(u); if (x < cx ? L(e) <= x : Rt(e) >= x) return OPEN0 + u * (OPEN1 - OPEN0) }
      return OPEN1
    }
    const seg = r.ghostSeg()
    seg.el.dataset.sel = 'owl'; seg.cells.owl.style.visibility = 'hidden'
    // The switch sits in its slot and is clipped to the growing chrome, so it never sticks out of it.
    r.anim(seg.el, r.sample(24, u => {
      const e = fn.out(u), l = Math.max(0, Math.round(L(e) - d.seg.x)), rr = Math.max(0, Math.round(d.seg.x + d.seg.w - Rt(e)))
      return { transform: `translate(${seg.dx}px, ${seg.dy}px)`, clipPath: `inset(0px ${rr}px 0px ${l}px)`, opacity: u >= 0.96 ? 1 : Math.min(1, u / 0.15) }
    }), { delay: OPEN0, duration: OPEN1 - OPEN0 })
    r.anim(seg.thumb, [{ left: '26px', width: '0px' }, { left: '3px', width: '46px' }], { delay: FLY1 - 40, duration: 160, easing: ease.out })
    for (const id of ['usage', 'settings', 'help', 'update']) {
      const g = r.ghost(id), side = g.to.x < cx ? 1 : -1, at = edgeAt(side > 0 ? g.to.x + g.to.w : g.to.x)
      r.anim(g.el, [{ transform: `translate(${g.dx + 8 * side}px, ${g.dy}px)`, opacity: 0 }, { transform: `translate(${g.dx}px, ${g.dy}px)`, opacity: 1 }],
        { delay: at, duration: Math.max(60, OPEN1 + 10 - at), easing: ease.out })
    }

    // The owl: a lift, then one arc to its slot, eased in and out as one move.
    // Only the owl leaves the foot: the other foot originals stay visible and fade with the foot (each ghost's undo restores them).
    for (const sel of ['.seg', '[data-ctl="usage"]', '[data-ctl="settings"]', '[data-ctl="help"]', '[data-ctl="update"]']) s.q(`.foot ${sel}`).style.visibility = ''
    const owl = r.ghost('owl')
    const T0 = FLY0 / 820, T1 = FLY1 / 820, lift = -10, arc = -110
    const bx = owl.dx, by = owl.dy
    const path = q => {                        // q = flight progress 0..1 (eased); quadratic arc from the lifted spot
      const c1x = bx * 0.45, c1y = lift + (by - lift) / 2 + arc
      const x = 2 * (1 - q) * q * c1x + q * q * bx
      const y = (1 - q) * (1 - q) * lift + 2 * (1 - q) * q * c1y + q * q * by
      return { x, y }
    }
    const at = u => {                          // owl offset at run progress u
      if (u <= T0) return { x: 0, y: lift * fn.out(clamp(u / T0, 0, 1)) }
      return path(fn.inOut(clamp((u - T0) / (T1 - T0), 0, 1)))
    }
    // Held steps (no in-betweens): whole-pixel positions and a scale of 1, 1.25 or 1.5 (16, 20 or 24 px owl).
    const size = u => {
      const up = u <= T0 ? u / T0 : 1, down = clamp((T1 - u) / 0.12, 0, 1), v = Math.min(up, down)
      return v < 0.34 ? 1 : v < 0.67 ? 1.25 : 1.5
    }
    r.anim(owl.el, r.sample(96, u => {
      const p = at(u)
      return { transform: `translate(${Math.round(p.x)}px, ${Math.round(p.y)}px) scale(${size(u)})`, color: u < T1 - 0.05 ? owl.colorFrom : owl.colorTo, easing: 'step-end' }
    }))
    // Wing flap: whole steps of scaleY on the owl's svg, no in-betweens.
    const wing = owl.el.querySelector('svg'), beats = 6, kf = [{ transform: 'scaleY(1)', offset: 0, easing: 'step-end' }]
    for (let i = 0; i < beats; i++) {
      const u0 = (FLY0 + (i + 0.5) * (FLY1 - FLY0) / (beats + 1)) / 820, u1 = u0 + 0.045
      kf.push({ transform: i % 2 ? 'scaleY(0.5)' : 'scaleY(0.75)', offset: u0, easing: 'step-end' }, { transform: 'scaleY(1)', offset: u1, easing: 'step-end' })
    }
    kf.push({ transform: 'scaleY(1)', offset: 1 })
    r.anim(wing, kf)

    // The trail: dim dots dropped along the path, fading behind the owl. Drawn at whole pixels.
    const cv = r.canvas(), ctx = cv.ctx, ink = cssVar('--ink'), mono = "'Spline Sans Mono', ui-monospace, Menlo, monospace"
    const ox = owl.from.x + owl.from.w / 2, oy = owl.from.y + owl.from.h / 2, life = 260, step = 26
    r.drive({}, (p, t, dir) => {
      cv.clear()
      ctx.font = `bold 14px ${mono}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = ink
      for (let k = FLY0 + step; k < FLY1 - 70; k += step) {
        const age = dir < 0 ? k - t : t - k   // the trail stays behind the owl whichever way it flies
        if (age < 0 || age > life) continue
        const q = at(k / 820), a = (1 - age / life) * clamp(t / 120, 0, 1) * clamp((820 - t) / 120, 0, 1)   // gone at both ends, either direction
        ctx.globalAlpha = a
        ctx.fillText(age < life / 2 ? ':' : '.', Math.round(ox + q.x), Math.round(oy + q.y + 6))
      }
      ctx.globalAlpha = 1
    })
  },
})

/* src/variants/05-stretch.js */
/* 5 Stretch: the room switch is the hero. It slides along the bottom edge to the dock and the pill grows out of it. */
Transitions.register({
  id: 'stretch', n: 5, name: 'Stretch',
  feel: 'The room switch slides along the bottom edge to the dock and the pill grows out of it, while one room dissolves into the other.',
  controls: 'The switch travels on its own and the lit thumb moves to the owl on the way. The icons fade in the foot, then slide out of the switch: page icons from its left end, update from its right.',
  cost: "Rect capture plus FLIP: the foot and the dock are separate, and Threads unmounts when Watcher opens, so capture the foot's rects first or use View Transitions. The growing pill box and the sliding thumb are new elements.",
  duration: 780,
  run(r) {
    const { s, R, ease, fn, lerp, clamp } = r, P = s.part
    const seg0 = R.f.seg, seg1 = R.d.seg, pill = R.pill
    const ph = (u, a, b) => clamp((u - a) / (b - a), 0, 1)

    // The worlds dissolve in sequence: the old room's text is gone by 35%, the new room's scene carries the middle, its text arrives after.
    // Threads sits on top with a clear background so its sidebar box stays in view while the room comes up under it.
    r.stack('t-over-w')
    const tbg = s.T.style.background; s.T.style.background = 'transparent'; r.undo(() => { s.T.style.background = tbg })
    // Text leaves first; the boxes it sat in (sidebar, composers) stay a little longer so the window is never empty.
    for (const el of [P.tHead, P.tMsgs, P.tNote]) r.fade(el, 1, 0, { duration: 240, easing: ease.soft })
    r.fade(P.sbTop, 1, 0, { duration: 220, easing: ease.soft })
    // The thread list overlaps nothing the room brings in, so it stays readable through the middle.
    for (const el of [P.search, P.list]) r.fade(el, 1, 0, { delay: 140, duration: 300, easing: ease.soft })
    for (const el of P.tComposer.children) r.fade(el, 1, 0, { duration: 220, easing: ease.soft })
    r.fade(P.tComposer, 1, 0, { delay: 220, duration: 240, easing: ease.soft })
    r.anim(P.sb, [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(0.985)', opacity: 0 }], { duration: 560, easing: ease.inOut })
    r.anim(P.pane, [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(0.985)', opacity: 0 }], { duration: 420, easing: ease.inOut })
    s.W.style.transformOrigin = '640px 400px'; r.undo(() => { s.W.style.transformOrigin = '' })
    r.anim(s.W, [{ transform: 'scale(1.012)', opacity: 0 }, { opacity: 1, offset: 0.45 }, { transform: 'none', opacity: 1 }], { delay: 40, duration: 660, easing: ease.out })
    for (const el of [P.wHead, P.wNeed, P.wRule, P.wBody]) r.fade(el, 0, 1, { delay: 240, duration: 280, easing: ease.out })
    r.anim(P.wComposer, [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { delay: 60, duration: 260, easing: ease.out })
    for (const el of P.wComposer.children) r.fade(el, 0, 1, { delay: 250, duration: 260, easing: ease.out })
    r.fade(P.dock, 0, 1, { delay: 720, duration: 60 })

    // Where the switch is at timeline fraction u: x eases across, y drops to the dock line early so it runs along the bottom edge.
    const segAt = u => {
      const mx = fn.inOut(ph(u, 0.02, 0.88)), my = fn.out(ph(u, 0.02, 0.4))
      return { x: lerp(seg0.x, seg1.x, mx), y: lerp(seg0.y, seg1.y, my) }
    }
    const grow = u => fn.out(ph(u, 0.46, 1))

    // The pill chrome grows from the switch's own rect.
    const chrome = r.ghostChrome()
    const L = seg1.x - pill.x, Rt = pill.x + pill.w - (seg1.x + seg1.w), Tp = seg1.y - pill.y, Bt = pill.y + pill.h - (seg1.y + seg1.h)
    r.anim(chrome.el, r.sample(32, u => {
      const p = segAt(u), g = grow(u)
      return { left: (p.x - L * g) + 'px', top: (p.y - Tp * g) + 'px', width: (seg1.w + (L + Rt) * g) + 'px', height: (seg1.h + (Tp + Bt) * g) + 'px',
        borderRadius: lerp(6, 10, g) + 'px', opacity: ph(u, 0.3, 0.5) * (1 - ph(u, 0.94, 1)) }
    }), { easing: ease.linear })

    // The foot's icons fade where they are, then slide out from under the switch's ends to their slots.
    const groups = [['usage', 'left'], ['settings', 'left'], ['help', 'left'], ['update', 'right']]
    for (const [id, end] of groups) {
      const g = r.ghost(id), to = R.d[id]
      const relY = to.y - seg1.y
      const relX = end === 'left' ? to.x - seg1.x : to.x - (seg1.x + seg1.w)
      const startRel = end === 'left' ? 2 : -to.w - 2
      const delay = id === 'usage' ? 0 : id === 'settings' ? 0.02 : id === 'help' ? 0.04 : 0.03
      r.anim(g.el, r.sample(32, u => {
        if (u < 0.36) return { transform: 'translate(0px, 0px)', opacity: 1 - fn.soft(ph(u, 0, 0.34)), color: g.colorFrom }
        const p = segAt(u), e = fn.out(ph(u, 0.48 + delay, 1))
        const ax = (end === 'left' ? p.x : p.x + seg1.w) + lerp(startRel, relX, e)
        return { transform: `translate(${ax - g.from.x}px, ${p.y + relY - g.from.y}px)`, opacity: ph(u, 0.46 + delay, 0.7 + delay), color: g.colorTo }
      }), { easing: ease.linear })
    }

    // The switch itself, on top of everything, so the icons appear to come out of it.
    const seg = r.ghostSeg()
    r.anim(seg.el, r.sample(32, u => { const p = segAt(u); return { transform: `translate(${p.x - seg0.x}px, ${p.y - seg0.y}px)` } }), { easing: ease.linear })
    r.slideThumb(seg, { delay: 220, duration: 300, easing: ease.inOut })
  },

/* 9 Night falls: an ASCII wipe. A front of flickering glyph cells sweeps left to right; the room is behind it, Threads ahead. */
Transitions.register({
  id: 'night-falls', n: 9, name: 'Night falls',

  cost: 'Custom code. App.tsx shows one page at a time, so use a view transition: old page as a snapshot, a polygon clip on the new one from script. A canvas draws the band from the settled night scene.',
  duration: 840,
  run(r) {
    const { s, R, clamp, lerp } = r, P = s.part
    const { cssVar } = window.StageHelpers
    const { cw, ch, cols, rows } = s.scene || { cw: 7, ch: 12, cols: 183, rows: 67 }

    const W = s.W
    r.undo(() => { W.style.clipPath = '' })

    // The controls' rects (foot and pill): cells over them burn brighter, so the controls read as breaking up and re-forming.
    const hot = []
    for (const src of [R.f, R.d]) for (const id of ['usage', 'settings', 'help', 'update', 'threads']) hot.push(src[id])
    const isHot = (x, y) => hot.some(b => x + cw > b.x && x < b.x + b.w && y + ch > b.y && y < b.y + b.h)

      h = Math.imul(h ^ (h >>> 13), 1274126177)
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296

    const fx = r.canvas(), ctx = fx.ctx

    const frontAt = p => Math.round(lerp(-BAND - 4 * cw, 1280, p) / cw) * cw

      const settle = clamp((p - 0.88) / 0.12, 0, 1)

    const owl = r.ghost('owl')
    const ride = u => clamp((frontAt(u) + BAND * 0.5 - owl.from.x) / (owl.to.x - owl.from.x), 0, 1)

  },

    for (const d of defs) { if (cards[d.id]) { if (def && d.id === def.id) cards[d.id].dataset.focus = ''; else delete cards[d.id].dataset.focus } }
    if (def) { body.dataset.focus = ''; bar.querySelector('span').textContent = `${def.n} of ${defs.length}: ${def.name}`; window.scrollTo(0, 0) } else delete body.dataset.focus
    // Sotto serves a question's page in a sandbox with an opaque origin, where replaceState throws: the address is a nicety only.
    if (!bare) { try { const u = new URL(location.href); if (def) u.searchParams.set('variant', def.n); else u.searchParams.delete('variant'); history.replaceState(null, '', u) } catch (e) { /* sandboxed */ } }
    for (const d of defs) stages[d.id].fit(cards[d.id].querySelector('.card__stage').clientWidth || 1280)
  }
  bar.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return
    if (b.hasAttribute('data-grid')) { setFocus(null); return }
    const cur = defs.findIndex(d => cards[d.id].hasAttribute('data-focus'))
    setFocus(defs[(cur + Number(b.dataset.step) + defs.length) % defs.length])
  })
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return
    if (/^[0-9]$/.test(e.key)) { const n = e.key === '0' ? 10 : Number(e.key); const d = defs.find(x => x.n === n); if (d) setFocus(d); return }
    const cur = defs.findIndex(d => cards[d.id].hasAttribute('data-focus'))
    if (cur < 0) return
    if (e.key === 'ArrowRight') setFocus(defs[(cur + 1) % defs.length])
    else if (e.key === 'ArrowLeft') setFocus(defs[(cur - 1 + defs.length) % defs.length])
    else if (e.key === 'Escape') setFocus(null)
    else if (e.key === ' ' && !e.target.matches('button, a, select, [role="tab"]')) { e.preventDefault(); const s = stages[defs[cur].id]; if (s.run) { if (s.playing) s.pause(); else s.go(s.dir) } else s.go() }
  })

  const tools = app.querySelector('.tools')
  tools.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return
    if (b.hasAttribute('data-all')) { defs.forEach((d, i) => setTimeout(() => { const s = stages[d.id]; if (!s.run && s.win.getBoundingClientRect().width > 0) s.go() }, i * 140)); return }
    setPressed(b.parentElement, b)
    if (b.dataset.themeSet) { Object.values(stages).forEach(s => { if (s.run) s.finish(s.pos < s.runDefDuration() / 2 ? 'threads' : 'watcher') }); root.dataset.theme = b.dataset.themeSet; Object.values(stages).forEach(s => s.refreshTheme()) }
    if (b.dataset.speed) Object.values(stages).forEach(s => { s.speed = Number(b.dataset.speed) })
    if (b.dataset.rm) Object.values(stages).forEach(s => { s.forceReduced = b.dataset.rm === '1' })
  })
  if (params.get('theme') === 'light') setPressed(tools.querySelector('[data-theme-set]').parentElement, tools.querySelector('[data-theme-set="light"]'))
  if (params.get('rm') === '1') { Object.values(stages).forEach(s => { s.forceReduced = true }); setPressed(tools.querySelector('[data-rm]').parentElement, tools.querySelector('[data-rm="1"]')) }

  if (focusDef) setFocus(focusDef)
  if (bare) for (const d of defs) if (!focusDef || d.id !== focusDef.id) cards[d.id].style.display = 'none'

  async function ready() {
    // Canvas text does not wait for a font face: load the faces, then repaint every night scene in the right one.
    try { await Promise.all([document.fonts.load('14px "Figtree"'), document.fonts.load('600 14px "Figtree"'), document.fonts.load('10.5px "Spline Sans Mono"')]); await document.fonts.ready } catch (e) { /* fonts are optional */ }
    for (const d of defs) { stages[d.id].fit(cards[d.id].querySelector('.card__stage').clientWidth || 1280); stages[d.id].paintScene() }
    const st = params.get('static'), fr = params.get('freeze')
    if (focusDef && st) stages[focusDef.id].setStatic(st)
    if (focusDef && fr !== null && fr !== '' && Number.isFinite(Number(fr))) stages[focusDef.id].freeze(Number(fr))
    window.__ready = true
  }
  ready()
})()

</script>
</body>
</html>
