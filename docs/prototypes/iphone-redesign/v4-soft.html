<!doctype html>
<!--
  PROTOTYPE, throwaway. Variant 4 · Soft.
  Tactile and friendly, still calm. State is carried by soft tonal fields (accent for working, warning for needs you,
  danger for stopped) instead of small dots, so a glance at the colour tells you where to look. Providers are
  pillowy tinted tiles derived from the theme's own roles. Grouped content sits in rounded inset groups like iOS
  Settings, a little warmer. Every press squishes and springs back, toggles and segmented controls slide on a spring,
  sheets bounce gently into place. Type follows one six-step scale (12 / 13.5 / 15.5 / 17 / 20 / 28) and spacing one
  eight-step scale on a 4 px grid; both scale with Text size and Message density in Settings.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTOTYPE · Sotto iPhone · Soft</title>
<style>
@font-face { font-family: Figtree; src: url(../../../src/renderer/src/assets/fonts/figtree-latin.woff2) format("woff2"); font-weight: 300 900; }

:root {
  /* Scales: text multiplies by --ts (Text size), message spacing by --dens (Message density). */
  --ts: 1;
  --dens: 1;
  --t-cap: calc(12px * var(--ts));
  --t-sm: calc(13.5px * var(--ts));
  --t-body: calc(15.5px * var(--ts));
  --t-md: calc(17px * var(--ts));
  --t-lg: calc(20px * var(--ts));
  --t-xl: calc(28px * var(--ts));

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s7: 32px; --s8: 40px;
  --r-xs: 8px; --r-sm: 14px; --r-md: 20px; --r-lg: 26px; --r-xl: 32px; --pill: 999px;

  --sb: 50px;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;

  /* Motion */
  --spring: linear(0, 0.049, 0.173, 0.321, 0.476, 0.623, 0.751, 0.849, 0.931, 0.991, 1.03, 1.053, 1.063, 1.064, 1.059, 1.051, 1.041, 1.031, 1.022, 1.014, 1.008, 1.003, 1, 0.997, 0.996, 0.996, 0.996, 0.996, 0.997, 0.998, 0.998, 0.999, 0.999, 1, 1, 1, 1);
  --bounce: linear(0, 0.111, 0.342, 0.618, 0.878, 1.082, 1.21, 1.264, 1.256, 1.206, 1.135, 1.062, 1, 0.956, 0.933, 0.929, 0.939, 0.956, 0.976, 0.994, 1.008, 1.016, 1.019, 1.018, 1.014, 1.009, 1.004, 0.999, 0.996, 0.995, 0.995, 0.996, 0.997, 1);
  --glide: cubic-bezier(.22, .9, .24, 1);

  /* Derived from theme roles only */
  --accent-text: color-mix(in oklab, var(--accent) 58%, var(--ink));
  --warning-text: color-mix(in oklab, var(--warning) 45%, var(--ink));
  --danger-text: color-mix(in oklab, var(--danger) 50%, var(--ink));
  --hue-claude: color-mix(in oklch, var(--warning) 55%, var(--danger));
  --hue-codex: var(--accent);
  --hue-grok: color-mix(in oklch longer hue, var(--accent), var(--danger));
  --group: var(--surface);
  --quiet-fill: color-mix(in oklab, var(--ink) 7%, transparent);
  --divider: color-mix(in oklab, var(--border) 70%, transparent);
}
:root[data-appearance="dark"] {
  --hi: rgba(255,255,255,.055);
  --shadow-soft: inset 0 1px 0 rgba(255,255,255,.04), 0 1px 2px rgba(0,0,0,.35), 0 12px 28px -16px rgba(0,0,0,.8);
  --shadow-pop: inset 0 1px 0 rgba(255,255,255,.07), 0 18px 48px -10px rgba(0,0,0,.75), 0 2px 6px rgba(0,0,0,.4);
  --thumb: color-mix(in oklab, var(--overlay) 80%, var(--ink));
  --knob: var(--ink);
  --key: color-mix(in oklab, var(--overlay) 88%, var(--ink));
  --key-alt: var(--raised);
  --kb-bg: color-mix(in oklab, var(--surface) 70%, var(--canvas));
  --on-warning: var(--canvas);
  --tone-fill: color-mix(in oklab, var(--ink) 11%, transparent);
  --group: color-mix(in oklab, var(--surface) 55%, var(--raised));
}
:root[data-appearance="light"] {
  --hi: rgba(255,255,255,.7);
  --shadow-soft: inset 0 1px 0 rgba(255,255,255,.7), 0 1px 2px rgba(0,0,0,.06), 0 10px 26px -14px rgba(0,0,0,.18);
  --shadow-pop: inset 0 1px 0 rgba(255,255,255,.8), 0 18px 44px -12px rgba(0,0,0,.25), 0 2px 6px rgba(0,0,0,.08);
  --thumb: var(--surface);
  --knob: var(--surface);
  --key: var(--surface);
  --key-alt: color-mix(in oklab, var(--overlay) 70%, var(--border));
  --kb-bg: color-mix(in oklab, var(--overlay) 80%, var(--border));
  --on-warning: var(--ink);
  --tone-fill: color-mix(in oklab, var(--surface) 80%, transparent);
  --group: var(--surface);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); color: var(--ink);
  font-family: Figtree, -apple-system, system-ui, sans-serif; font-size: var(--t-body); line-height: 1.4;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; font-feature-settings: "tnum" 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: default; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
svg { flex: none; display: block; }
h1, h2, h3, p { margin: 0; }
.tt > span, .ct > span { display: block; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Theme repaint: a short cross-fade when the palette changes */
.repaint, .repaint * { transition: background-color .4s ease, color .4s ease, border-color .4s ease, box-shadow .4s ease !important; }

/* Squish: every press gives a little and springs back */
.sq { transition: transform .55s var(--bounce), background-color .25s, color .25s, box-shadow .25s, opacity .25s; }
.sq:active:not(:disabled):not([aria-disabled="true"]) { transform: scale(var(--sqk, .97)); transition: transform .09s ease-out, background-color .1s; }
.sq.big { --sqk: .985; }

#app { position: fixed; inset: 0; overflow: hidden; overflow: clip; background: var(--canvas); }

/* Status bar */
.statusbar { position: absolute; top: 0; left: 0; right: 0; height: var(--sb); z-index: 60; display: flex; align-items: center;
  justify-content: space-between; padding: 4px 26px 0 40px; pointer-events: none; font-size: 16.5px; font-weight: 650; letter-spacing: -.01em; }
.statusbar .icons { display: flex; gap: 6px; align-items: center; }
.real-sb .statusbar > * { visibility: hidden; }

/* Screens */
#stage { position: absolute; inset: 0; transition: transform .5s var(--glide), border-radius .5s var(--glide), filter .5s; transform-origin: 50% 100%; overflow: hidden; }
#stage.recede { transform: scale(.92) translateY(6px); border-radius: var(--r-xl); filter: brightness(.72); }
.screen { position: absolute; inset: 0; background: var(--canvas); display: flex; flex-direction: column; overflow: hidden;
  transition: transform .52s var(--glide), filter .52s; }
.screen.pushed { transform: translateX(104%); box-shadow: -16px 0 40px rgba(0,0,0,.28); }
.screen.pushed.in { transform: none; }
.screen.behind { transform: translateX(-26%); filter: brightness(.6); }

/* Tabs */
.sb-fade { position: absolute; top: 0; left: 0; right: 0; height: calc(var(--sb) + 10px); z-index: 15; pointer-events: none;
  background: linear-gradient(var(--canvas) 62%, color-mix(in oklab, var(--canvas) 0%, transparent)); }
.tabview { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding-top: var(--sb); padding-bottom: calc(120px + env(safe-area-inset-bottom));
  opacity: 0; visibility: hidden; transform: translateY(12px); transition: opacity .22s, transform .5s var(--spring), visibility 0s .25s;
  overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.tabview.on { opacity: 1; visibility: visible; transform: none; transition: opacity .3s, transform .55s var(--spring), visibility 0s; }

.tabbar { position: absolute; left: var(--s4); right: var(--s4); bottom: calc(max(env(safe-area-inset-bottom), 10px) + 6px); height: 66px; z-index: 20;
  border-radius: 33px; padding: 6px; display: grid; grid-template-columns: repeat(3, 1fr);
  background: color-mix(in oklab, var(--overlay) 86%, transparent); -webkit-backdrop-filter: blur(22px) saturate(1.5); backdrop-filter: blur(22px) saturate(1.5);
  box-shadow: var(--shadow-pop); transition: transform .45s var(--glide), opacity .3s; }
.tabbar .blob { position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 3); border-radius: 27px; background: var(--accent-surface);
  transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .6s var(--spring); }
.tab { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px;
  font-size: 12px; font-weight: 650; color: var(--muted); }
.tab[aria-selected="true"] { color: var(--accent-text); }
.tab .badge { position: absolute; top: 3px; left: calc(50% + 6px); }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--pill); background: var(--warning); color: var(--on-warning);
  font-size: 12px; font-weight: 800; display: grid; place-items: center; box-shadow: 0 0 0 2.5px color-mix(in oklab, var(--overlay) 90%, transparent); }
.badge.bump { animation: bump .6s var(--bounce); }
@keyframes bump { 0% { transform: scale(.6); } 100% { transform: scale(1); } }

/* Shared bits */
.page-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: var(--s3) var(--s4) var(--s2) var(--s5); min-height: 60px; }
.page-head h1 { font-size: var(--t-xl); font-weight: 760; letter-spacing: -.025em; line-height: 1.1; }
.sub { color: var(--muted); font-size: var(--t-sm); padding: 0 var(--s5); }

.round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--raised); color: var(--ink); box-shadow: var(--shadow-soft); }
.fab { width: 48px; height: 48px; border-radius: 17px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25), inset 0 -3px 0 rgba(0,0,0,.14), 0 10px 22px -8px color-mix(in oklab, var(--accent) 70%, transparent); }

.btn { min-height: 44px; padding: 0 var(--s5); border-radius: var(--pill); font-size: var(--t-sm); font-weight: 700; display: inline-flex; align-items: center;
  justify-content: center; gap: var(--s2); white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -3px 0 rgba(0,0,0,.14), 0 8px 18px -10px color-mix(in oklab, var(--accent) 80%, transparent); }
.btn.primary:disabled { background: color-mix(in oklab, var(--ink) 9%, transparent); color: var(--muted); box-shadow: none; }
.btn.tonal { background: var(--quiet-fill); color: var(--ink); }
.btn.on-tone { background: var(--tone-fill); color: var(--ink); box-shadow: inset 0 1px 0 var(--hi); }
.btn.danger { background: var(--danger-surface); color: var(--danger-text); box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--danger) 30%, transparent); }
.btn.accent-tone { background: var(--accent-surface); color: var(--accent-text); }
.btn.lg { min-height: 56px; font-size: var(--t-body); padding: 0 var(--s6); }
.btn.done { background: var(--accent-surface); color: var(--accent-text); box-shadow: none; }

.spin { width: 16px; height: 16px; border-radius: 50%; border: 2.2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.pop-in { animation: popin .55s var(--bounce); }
@keyframes popin { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* Provider tiles */
.tile { --hue: var(--hue-codex); width: 40px; height: 40px; flex: none; border-radius: 13px; display: grid; place-items: center; position: relative;
  font-size: 15px; font-weight: 780; letter-spacing: -.02em;
  background: color-mix(in oklab, var(--hue) 30%, var(--raised)); color: color-mix(in oklab, var(--hue) 45%, var(--ink));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.1), inset 0 -2px 0 rgba(0,0,0,.12); }
.tile.sm { width: 26px; height: 26px; border-radius: 9px; font-size: 11px; }
.tile.xs { width: 22px; height: 22px; border-radius: 7px; font-size: 10px; }
.p-claude { --hue: var(--hue-claude); }
.p-codex { --hue: var(--hue-codex); }
.p-grok { --hue: var(--hue-grok); }
.tile.alive::after { content: ""; position: absolute; inset: -3px; border-radius: 16px; border: 2px solid color-mix(in oklab, var(--hue) 70%, transparent);
  animation: breathe 2.2s ease-out infinite; }
@keyframes breathe { 0% { transform: scale(.92); opacity: .9; } 100% { transform: scale(1.28); opacity: 0; } }

/* Threads home */
.home-row { display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s4); flex-wrap: wrap; }
.picker { min-height: 40px; padding: 0 var(--s3) 0 var(--s3); border-radius: var(--pill); background: var(--raised); display: inline-flex; align-items: center; gap: var(--s2);
  font-size: var(--t-sm); font-weight: 650; box-shadow: var(--shadow-soft); position: relative; }
.picker::before { content: ""; position: absolute; inset: -2px 0; }
.picker .chev { color: var(--muted); transition: transform .4s var(--spring); }
.picker[aria-expanded="true"] .chev { transform: rotate(180deg); }
.summary { display: flex; gap: var(--s2); margin-left: auto; }
.chip { height: 30px; padding: 0 var(--s3); border-radius: var(--pill); display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-cap); font-weight: 700; white-space: nowrap; }
.chip.work { background: var(--accent-surface); color: var(--accent-text); }
.chip.need { background: var(--warning-surface); color: var(--warning-text); }
.chip .pulse { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; transform: scale(.7); } }

.search { margin: var(--s3) var(--s4) 0; height: 48px; border-radius: var(--pill); background: var(--raised); display: flex; align-items: center; gap: var(--s2);
  padding: 0 var(--s2) 0 var(--s4); color: var(--muted); box-shadow: inset 0 1.5px 3px rgba(0,0,0,.18), inset 0 0 0 1px color-mix(in oklab, var(--border) 50%, transparent);
  transition: box-shadow .25s; }
.search:focus-within { box-shadow: inset 0 1.5px 3px rgba(0,0,0,.18), 0 0 0 2.5px var(--accent); }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; color: var(--ink); font: inherit; font-size: max(16px, var(--t-body)); }
.search input::placeholder { color: var(--placeholder); }
.search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }
.search .clear { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--quiet-fill); color: var(--muted); }
.search .clear[hidden] { display: none; }

.sec-h { display: flex; align-items: center; gap: var(--s2); padding: var(--s6) var(--s5) var(--s3); font-size: var(--t-md); font-weight: 720; letter-spacing: -.01em; }
.sec-h .count { min-width: 22px; height: 22px; padding: 0 7px; border-radius: var(--pill); background: var(--quiet-fill); color: var(--muted); font-size: 12px; font-weight: 750; display: inline-grid; place-items: center; }

.note { margin: var(--s4) var(--s4) 0; padding: var(--s3) var(--s3) var(--s3) var(--s3); border-radius: var(--r-md); background: var(--group); box-shadow: var(--shadow-soft);
  display: flex; align-items: center; gap: var(--s3); }
.note .ic { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; background: var(--danger-surface); color: var(--danger-text); flex: none; }
.note .txt { flex: 1; min-width: 0; font-size: var(--t-sm); color: var(--muted); line-height: 1.35; }
.note .txt b { display: block; color: var(--ink); font-weight: 700; overflow-wrap: anywhere; }

.card { position: relative; margin: 0 var(--s4) var(--s3); border-radius: var(--r-lg); padding: var(--s4); overflow: hidden; }
.card.need { background: var(--warning-surface); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--warning) 22%, transparent), var(--shadow-soft); }
.card.work { background: var(--accent-surface); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--accent) 20%, transparent), var(--shadow-soft); display: block; width: calc(100% - 2 * var(--s4)); text-align: left; }
.card.work::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(105deg, transparent 35%, color-mix(in oklab, var(--accent) 12%, transparent) 50%, transparent 65%);
  background-size: 250% 100%; animation: tide 3.6s ease-in-out infinite; }
@keyframes tide { from { background-position: 120% 0; } to { background-position: -20% 0; } }
.ch { display: flex; align-items: center; gap: var(--s3); width: 100%; text-align: left; position: relative; z-index: 1; }
.ch .tt { flex: 1; min-width: 0; }
.ch .title { font-size: var(--t-body); font-weight: 700; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ch .meta { font-size: var(--t-cap); color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch .ago { font-size: var(--t-cap); color: var(--muted); align-self: flex-start; white-space: nowrap; padding-top: 2px; }
button.ch { border-radius: var(--r-sm); }
.ask { font-size: var(--t-md); font-weight: 650; line-height: 1.3; margin: var(--s3) 0 var(--s3); letter-spacing: -.005em; }
.opts { display: flex; flex-wrap: wrap; gap: var(--s2); }
.opt { min-height: 44px; padding: 0 var(--s4); border-radius: var(--pill); font-size: var(--t-sm); font-weight: 700; display: inline-flex; align-items: center; gap: 6px;
  background: var(--tone-fill); box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--warning) 30%, transparent), inset 0 1px 0 var(--hi), 0 2px 4px -2px rgba(0,0,0,.3); }
.opt[aria-checked="true"] { background: var(--warning); color: var(--on-warning); box-shadow: inset 0 -2px 0 rgba(0,0,0,.14), 0 6px 14px -8px color-mix(in oklab, var(--warning) 90%, transparent); }
.opt .ck { width: 0; overflow: hidden; transition: width .35s var(--spring); display: inline-flex; }
.opt[aria-checked="true"] .ck { width: 16px; }
.card-actions { display: flex; gap: var(--s2); margin-top: var(--s4); justify-content: flex-end; flex-wrap: wrap; }
.card-actions .grow { margin-right: auto; }
.cmd { font-family: var(--mono); font-size: calc(15px * var(--ts)); background: color-mix(in oklab, var(--code-bg) 75%, transparent); color: var(--code-ink); border-radius: var(--r-sm);
  padding: var(--s3) var(--s4); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--warning) 22%, transparent); display: flex; gap: var(--s2); overflow-x: auto; white-space: pre; }
.cmd .pr { color: var(--muted); user-select: none; }
.where { font-size: var(--t-cap); color: var(--muted); margin-top: var(--s2); overflow-wrap: anywhere; line-height: 1.4; }
.live-line { display: flex; align-items: center; gap: var(--s2); margin-top: var(--s3); font-size: var(--t-sm); position: relative; z-index: 1; color: var(--ink); }
.live-line .spin { width: 14px; height: 14px; color: var(--accent-text); }
.live-line span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.work-foot { display: flex; align-items: center; justify-content: space-between; margin-top: var(--s3); position: relative; z-index: 1; font-size: var(--t-cap); color: var(--muted); }
.work-foot .el { font-variant-numeric: tabular-nums; font-weight: 650; color: var(--accent-text); }

.group { margin: 0 var(--s4); border-radius: var(--r-lg); background: var(--group); box-shadow: var(--shadow-soft); overflow: hidden; }
.row { display: flex; align-items: center; gap: var(--s3); width: 100%; text-align: left; position: relative; min-height: 64px;
  padding: calc(var(--s3) * var(--dens) + 2px) var(--s4); }
.row + .row::before, .row + .collapse::before { content: ""; position: absolute; top: 0; left: 68px; right: 0; height: 1px; background: var(--divider); }
.row.unread { background: color-mix(in oklab, var(--accent-surface) 80%, var(--group)); }
.row.failed { background: color-mix(in oklab, var(--danger-surface) 85%, var(--group)); }
.row.unread::before, .row.failed::before, .row.unread + .row::before, .row.failed + .row::before { left: 0; }
.row .tt { flex: 1; min-width: 0; }
.row .title { font-size: var(--t-body); font-weight: 650; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .line { font-size: var(--t-sm); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.row .side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; align-self: center; }
.row .ago { font-size: var(--t-cap); color: var(--muted); white-space: nowrap; }
.tag { height: 22px; padding: 0 9px; border-radius: var(--pill); font-size: 11.5px; font-weight: 750; display: inline-flex; align-items: center; white-space: nowrap; }
.tag.fin { background: var(--accent); color: var(--accent-ink); }
.tag.fail { background: color-mix(in oklab, var(--danger) 22%, transparent); color: var(--danger-text); }
.tag.ok { background: var(--accent-surface); color: var(--accent-text); }
.tag.off { background: var(--danger-surface); color: var(--danger-text); }
.tag.mute { background: var(--quiet-fill); color: var(--muted); }

.settled-toggle { display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: 56px; padding: 0 var(--s4); font-size: var(--t-body); font-weight: 650; }
.settled-toggle .chev { margin-left: auto; color: var(--muted); transition: transform .45s var(--spring); }

  opacity: 0 !important; transform: scale(.94) !important; margin-top: 0 !important; margin-bottom: 0 !important; padding-top: 0 !important; padding-bottom: 0 !important; }

/* Thread */
.th-head { padding-top: var(--sb); background: var(--canvas); position: relative; z-index: 3; transition: box-shadow .3s; }

.th-dot.working::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
.compact .th-dot.working { width: 30px; opacity: 1; transform: none; }
.state-pill { height: 30px; padding: 0 var(--s3); border-radius: var(--pill); display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-cap); font-weight: 750; white-space: nowrap; }
.state-pill.working { background: var(--accent-surface); color: var(--accent-text); }

.th-more { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .45s var(--glide), opacity .3s; }

.git { display: flex; gap: var(--s2); margin: var(--s1) calc(-1 * var(--s4)) 0; padding: 0 var(--s4); overflow-x: auto; scrollbar-width: none;
  -webkit-mask-image: linear-gradient(90deg, black 88%, transparent); mask-image: linear-gradient(90deg, black 88%, transparent); }

.gchip { height: 30px; padding: 0 var(--s3); border-radius: var(--pill); background: var(--raised); display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--t-cap); font-weight: 650; color: var(--ink); max-width: 100%; min-width: 0; box-shadow: inset 0 1px 0 var(--hi); }

  box-shadow: inset 0 1.5px 3px rgba(0,0,0,.2), inset 0 0 0 1px color-mix(in oklab, var(--border) 40%, transparent); }
.seg .thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / var(--n, 2)); border-radius: var(--pill); background: var(--thumb);
  box-shadow: 0 2px 8px rgba(0,0,0,.22), inset 0 1px 0 var(--hi); transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .55s var(--spring); }

.th-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; position: relative; }

.msg { margin-bottom: calc(var(--s5) * var(--dens)); }

.bubble { max-width: 84%; background: color-mix(in oklab, var(--bubble) 60%, var(--accent-surface)); color: var(--bubble-ink); padding: calc(10px * var(--dens) + 1px) 15px; border-radius: 22px 22px 8px 22px;
  font-size: var(--t-body); line-height: 1.42; box-shadow: inset 0 1px 0 var(--hi); overflow-wrap: anywhere; }

.md { background: var(--group); border-radius: 8px var(--r-md) var(--r-md) var(--r-md); padding: calc(var(--s4) * var(--dens)) var(--s4); box-shadow: var(--shadow-soft);

  font-size: 12.5px; font-weight: 780; display: grid; place-items: center; }

  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--border) 75%, transparent); overflow-wrap: anywhere; }

  padding: .06em .5em .1em; margin: 0 .08em; border-radius: 7px; background: var(--raised); color: var(--ink); vertical-align: .06em;
  box-shadow: inset 0 0 0 1px var(--border), inset 0 -2.5px 0 color-mix(in oklab, var(--border) 85%, transparent), 0 1px 1px rgba(0,0,0,.25); }

  overflow-x: auto; box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--border) 80%, transparent), inset 0 2px 6px rgba(0,0,0,.12); }
.md pre::before { content: attr(data-lang); position: absolute; top: 7px; left: var(--s4); font-family: Figtree, sans-serif; font-size: 11px; font-weight: 700; color: var(--muted); }
.md pre code { background: none; box-shadow: none; padding: 0; border-radius: 0; font-size: calc(13px * var(--ts)); line-height: 1.55; white-space: pre; overflow-wrap: normal; }
.live { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); border-radius: var(--r-md); background: var(--accent-surface); font-size: var(--t-sm);
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--accent) 20%, transparent); position: relative; overflow: hidden; }
.live::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, color-mix(in oklab, var(--accent) 14%, transparent) 50%, transparent 65%);
  background-size: 250% 100%; animation: tide 3s ease-in-out infinite; pointer-events: none; }
.live .spin { color: var(--accent-text); }
.live .tx { flex: 1; min-width: 0; }
.live .tx b { display: block; font-weight: 700; }
.live .tx span { display: block; color: var(--muted); font-family: var(--mono); font-size: calc(12px * var(--ts)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live .el { font-size: var(--t-cap); font-weight: 700; color: var(--accent-text); font-variant-numeric: tabular-nums; }

.th-empty { text-align: center; color: var(--muted); padding: var(--s8) var(--s5); font-size: var(--t-sm); }
.th-empty .tile { margin: 0 auto var(--s3); width: 56px; height: 56px; border-radius: 18px; font-size: 20px; }
.th-empty b { display: block; color: var(--ink); font-size: var(--t-md); margin-bottom: var(--s1); }

.act { display: flex; align-items: center; gap: var(--s3); padding: calc(var(--s3) * var(--dens) + 2px) var(--s4); position: relative; min-height: 60px; }
.act + .act::before { content: ""; position: absolute; top: 0; left: 64px; right: 0; height: 1px; background: var(--divider); }
.act.running { background: color-mix(in oklab, var(--accent-surface) 85%, var(--group)); }

.act .ki { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; flex: none; background: color-mix(in oklab, var(--kh) 26%, var(--raised)); color: color-mix(in oklab, var(--kh) 50%, var(--ink)); }
.k-command { --kh: var(--accent); } .k-file-change { --kh: var(--hue-claude); } .k-tool { --kh: var(--muted); } .k-reasoning { --kh: var(--hue-grok); } .k-plan { --kh: var(--warning); }
.act .tt { flex: 1; min-width: 0; }
.act .a1 { font-size: var(--t-sm); font-weight: 700; }
.act .a2 { font-family: var(--mono); font-size: calc(12px * var(--ts)); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; direction: ltr; }
.act .a2 b { color: var(--ink); font-weight: 600; }
.act .rt { font-size: var(--t-cap); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; display: flex; gap: 6px; align-items: center; font-weight: 650; }
.act .rt .add { color: var(--accent-text); } .act .rt .del { color: var(--danger-text); }
.act.running .rt { color: var(--accent-text); }
.act-sum { display: flex; gap: var(--s2); margin-bottom: var(--s3); flex-wrap: wrap; }

.composer { display: flex; align-items: flex-end; gap: var(--s2); padding: var(--s2) var(--s3) calc(max(env(safe-area-inset-bottom), 14px) + 4px); background: var(--canvas); position: relative; z-index: 2;
  transition: padding .35s var(--glide); }
.kb-open .composer { padding-bottom: var(--s2); }
.field { flex: 1; min-width: 0; min-height: 48px; border-radius: 24px; background: var(--raised); padding: 12px var(--s4); text-align: left; font-size: var(--t-body); color: var(--placeholder);
  box-shadow: inset 0 1.5px 3px rgba(0,0,0,.18), inset 0 0 0 1px color-mix(in oklab, var(--border) 50%, transparent); transition: box-shadow .25s; line-height: 1.4; overflow-wrap: anywhere; }
.field.has { color: var(--ink); }
.kb-open .field { box-shadow: inset 0 1.5px 3px rgba(0,0,0,.18), 0 0 0 2.5px var(--accent); }
.caret { display: none; width: 2px; height: 1.15em; background: var(--accent); vertical-align: -3px; margin-left: 1px; border-radius: 1px; animation: blink 1s steps(1) infinite; }
.kb-open .caret { display: inline-block; }
@keyframes blink { 50% { opacity: 0; } }
.cbtn { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.cbtn.stop { background: var(--danger-surface); color: var(--danger-text); box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--danger) 30%, transparent); }
.cbtn.send { background: var(--accent); color: var(--accent-ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -3px 0 rgba(0,0,0,.14); }

.kb { height: 0; overflow: hidden; background: var(--kb-bg); transition: height .42s var(--glide); flex: none; position: relative; z-index: 2; }
.kb.open { height: calc(296px + env(safe-area-inset-bottom)); }
.kb .keys { height: 296px; padding: 10px 4px 0; display: flex; flex-direction: column; gap: 11px; }
.kb .kr { display: flex; gap: 6px; justify-content: center; }
.kb .kr.mid { padding: 0 18px; }
.key { flex: 1; height: 44px; max-width: 40px; border-radius: 9px; background: var(--key); color: var(--ink); font-size: 22px; font-weight: 420; display: grid; place-items: center;
  box-shadow: 0 1.5px 0 rgba(0,0,0,.35); transition: transform .4s var(--bounce), background-color .15s; }

.key.space { max-width: none; flex: 5; font-size: 15px; color: var(--muted); }

.key.go:disabled { background: var(--key-alt); color: var(--muted); }

/* Sheets */
.layer { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
.layer.open { pointer-events: auto; }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.5); opacity: 0; transition: opacity .35s; }
.layer.open .scrim { opacity: 1; }
.sheet { position: absolute; left: 0; right: 0; bottom: -48px; padding: 0 var(--s5) calc(48px + max(env(safe-area-inset-bottom), 16px)); background: var(--surface);
  border-radius: var(--r-xl) var(--r-xl) 0 0; transform: translateY(110%); transition: transform .62s var(--spring); max-height: calc(100% - var(--sb) - 16px + 48px);
  overflow-y: auto; overflow-x: hidden; box-shadow: 0 -12px 50px rgba(0,0,0,.35), inset 0 1px 0 var(--hi); overscroll-behavior: contain; }
.layer.open .sheet { transform: translateY(0); }

.grab { width: 40px; height: 5px; border-radius: 3px; background: color-mix(in oklab, var(--muted) 45%, transparent); margin: 9px auto var(--s4); }
.sh-from { display: flex; align-items: center; gap: var(--s2); font-size: var(--t-cap); color: var(--muted); font-weight: 600; min-width: 0; }
.sh-from span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh-q { font-size: var(--t-lg); font-weight: 740; letter-spacing: -.015em; line-height: 1.25; margin: var(--s3) 0 var(--s5); }
.choices { display: flex; flex-direction: column; gap: var(--s2); }

  box-shadow: inset 0 0 0 1.5px transparent, inset 0 1px 0 var(--hi); transition: transform .55s var(--bounce), background-color .25s, box-shadow .25s; }
.choice[aria-checked="true"] { background: var(--accent-surface); box-shadow: inset 0 0 0 2px var(--accent); }
.radio { width: 24px; height: 24px; border-radius: 50%; flex: none; margin-top: 1px; box-shadow: inset 0 0 0 2px color-mix(in oklab, var(--muted) 70%, transparent); display: grid; place-items: center; transition: box-shadow .25s; }
.radio::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform .5s var(--bounce); }
[aria-checked="true"] > .radio { box-shadow: inset 0 0 0 2px var(--accent); }
[aria-checked="true"] > .radio::after { transform: scale(1); }
.choice .cl { font-size: var(--t-body); font-weight: 720; }
.choice .cd { font-size: var(--t-sm); color: var(--muted); margin-top: 2px; line-height: 1.35; }
.choice .ct { flex: 1; min-width: 0; }
.own { margin-top: var(--s2); }
.own textarea { width: 100%; min-height: 84px; resize: none; border: 0; outline: 0; border-radius: var(--r-sm); background: var(--canvas); color: var(--ink); font: inherit; font-size: max(16px, var(--t-body));
  padding: var(--s3) var(--s4); box-shadow: inset 0 1.5px 3px rgba(0,0,0,.2), inset 0 0 0 1px var(--border); }

.sh-actions { display: grid; grid-template-columns: 1fr 1.7fr; gap: var(--s3); margin-top: var(--s3); position: sticky; bottom: 48px; padding-top: var(--s3); z-index: 2;
  background: linear-gradient(color-mix(in oklab, var(--surface) 0%, transparent), var(--surface) 30%); }
.sh-stack { display: flex; flex-direction: column; gap: var(--s2); margin-top: var(--s5); }
.sh-label { font-size: var(--t-cap); font-weight: 700; color: var(--muted); margin: var(--s4) 0 var(--s2); }
.sh-path { font-family: var(--mono); font-size: calc(12.5px * var(--ts)); color: var(--ink); background: var(--raised); padding: var(--s3) var(--s4); border-radius: var(--r-sm); overflow-wrap: anywhere; line-height: 1.5; }
.sh-path small { display: block; font-family: Figtree, sans-serif; font-size: var(--t-cap); color: var(--muted); margin-top: 4px; }
.big-cmd { font-family: var(--mono); font-size: calc(19px * var(--ts)); padding: var(--s4) var(--s5); border-radius: var(--r-md); background: var(--code-bg); color: var(--code-ink);
  box-shadow: inset 0 0 0 1px var(--border), inset 0 2px 8px rgba(0,0,0,.15); display: flex; gap: var(--s3); }

.perm-head { display: flex; gap: var(--s3); align-items: center; margin-top: var(--s2); }

/* New thread (full sheet) */
.sheet.full { top: calc(var(--sb) + 12px); max-height: none; display: flex; flex-direction: column; padding: 0 0 48px; overflow: hidden; }
.nt-top { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--s3); min-height: 48px; }
.nt-top h2 { font-size: var(--t-md); font-weight: 740; }
.txtbtn { min-height: 44px; min-width: 44px; padding: 0 var(--s3); border-radius: var(--pill); font-size: var(--t-body); font-weight: 650; color: var(--accent-text); display: inline-flex; align-items: center; gap: 2px; }
.txtbtn[hidden] { visibility: hidden; display: inline-flex; }
.progress { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: var(--s2) var(--s5) 0; }
.progress div { display: flex; flex-direction: column; gap: 6px; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.progress i { height: 6px; border-radius: 3px; background: var(--quiet-fill); position: relative; overflow: hidden; }
.progress i::after { content: ""; position: absolute; inset: 0; background: var(--accent); border-radius: 3px; transform: scaleX(0); transform-origin: left; transition: transform .55s var(--spring); }

function resolvedAppearance() {
  if (st.appearance === 'System') return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
  return st.appearance.toLowerCase()
}
function paint(animate) {
  const root = document.documentElement
  if (animate && !reduce.matches) { root.classList.add('repaint'); clearTimeout(paint.t); paint.t = setTimeout(() => root.classList.remove('repaint'), 450) }
  S.applyTheme(st.theme, resolvedAppearance(), root)
  root.style.setProperty('--ts', st.textSize)
  root.style.setProperty('--dens', st.density === 'Compact' ? 0.62 : 1)
}
matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (st.appearance === 'System') { paint(true); renderSettings() } })

/* ---------- Toast ---------- */
function toast(text, icon = 'check') {
  const t = $('#toast')
  t.innerHTML = `<span class="tic">${ic(icon, 16, 2.4)}</span><span>${esc(text)}</span>`
  t.classList.toggle('up', !!$('.screen.pushed.in'))
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show')
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600)
}

/* ---------- Threads home ---------- */
function matches(t) {
  if (st.filter !== 'all' && t.computer !== st.filter) return false
  const q = st.query.trim().toLowerCase()
  if (!q) return true
  return [t.title, t.project, t.line, prov(t.provider), comp(t.computer).name].join(' ').toLowerCase().includes(q)
}
function buildThreadsShell() {
  $('#tab-threads').innerHTML = `
    <header class="page-head">
      <h1>Threads</h1>
      <button class="fab sq" data-act="new-thread" aria-label="Start a new thread">${ic('plus', 24, 2.4)}</button>
    </header>
    <div class="home-row">
      <button class="picker sq" id="picker" data-act="pick-computer" aria-haspopup="menu" aria-expanded="false"></button>
      <div class="summary" id="summary"></div>
    </div>
    <label class="search" id="search">
      ${ic('search', 19)}
      <span class="vh">Search threads</span>
      <input id="q" type="search" placeholder="Search threads" autocomplete="off" enterkeyhint="search">
      <button class="clear sq" id="q-clear" data-act="clear-search" aria-label="Clear search" hidden>${ic('x', 16, 2.4)}</button>
    </label>
    <div id="threads-body"></div>`
  const q = $('#q')
  q.addEventListener('input', () => { st.query = q.value; $('#q-clear').hidden = !q.value; renderThreads() })
  q.addEventListener('keydown', e => { if (e.key === 'Enter') q.blur() })
  // Close the keyboard when the list is scrolled by a finger or wheel, not when the list reflows under the typing.
  const sc = $('#tab-threads')
  const drop = () => { if (document.activeElement === q) q.blur() }
  sc.addEventListener('touchmove', drop, { passive: true })
  sc.addEventListener('wheel', drop, { passive: true })
}
function renderThreads() {
  const vis = st.threads.filter(matches)
  const need = vis.filter(t => t.state === 'needs-you')
  const work = vis.filter(t => t.state === 'working')
  const recent = vis.filter(t => ['finished-unread', 'done', 'failed'].includes(t.state))
  const settled = vis.filter(t => t.state === 'settled')
  const all = st.threads.filter(t => st.filter === 'all' || t.computer === st.filter)
  const nW = all.filter(t => t.state === 'working').length, nN = all.filter(t => t.state === 'needs-you').length
  const fc = st.filter === 'all' ? null : comp(st.filter)
  $('#picker').innerHTML = `${ic('computer', 17)}<span>${fc ? esc(fc.name) : 'All computers'}</span><span class="chev">${ic('chevD', 16, 2.4)}</span>`
  $('#picker').setAttribute('aria-label', `Showing ${fc ? fc.name : 'all computers'}. Choose a computer`)
  $('#summary').innerHTML = (nW ? `<span class="chip work"><span class="pulse"></span>${nW} working</span>` : '') + (nN ? `<span class="chip need">${nN} need${nN === 1 ? 's' : ''} you</span>` : '')

  let h = ''
  const off = S.computers.find(c => c.status === 'unreachable')
  if (off && (st.filter === 'all' || st.filter === off.id) && !st.query) h += `
    <div class="note" id="offline-note">
      <span class="ic">${ic('offline', 20)}</span>
      <div class="txt"><b>${esc(off.name)}</b>Can’t be reached. Showing what was last seen.</div>
      <button class="btn tonal sq" data-act="retry" data-id="${off.id}" aria-label="Try reaching ${esc(off.name)} again">Try again</button>
    </div>`
  if (!vis.length) {
    h += `<div class="empty"><b>No threads match “${esc(st.query)}”.</b>Search looks at titles, projects and what each thread is doing.<br><button class="btn tonal sq" data-act="clear-search">Clear search</button></div>`
  }
  if (need.length) h += `<h2 class="sec-h">Needs you <span class="count">${need.length}</span></h2>` + need.map(needCard).join('')
  if (work.length) h += `<h2 class="sec-h">Working now <span class="count">${work.length}</span></h2>` + work.map(workCard).join('')
  if (recent.length) h += `<h2 class="sec-h">Recent</h2><div class="group">${recent.map(rowHtml).join('')}</div>`
  if (settled.length) {
    const open = st.settledOpen || !!st.query
    h += `<div style="height:var(--s5)"></div><div class="group">
      <button class="settled-toggle sq big" data-act="toggle-settled" aria-expanded="${open}" ${st.query ? 'disabled' : ''}>Settled <span class="count">${settled.length}</span><span class="chev">${ic('chevD', 18, 2.2)}</span></button>
      <div class="collapse ${open ? 'open' : ''}" id="settled"><div>${settled.map(rowHtml).join('')}</div></div></div>`
  }
  $('#threads-body').innerHTML = h
  st.arriving = null
  tick()
  renderBadge()
}

function needCard(t) {

function workCard(t) {
  const c = comp(t.computer)
  return `<button class="card work sq big${st.arriving === t.id ? ' arrive' : ''}" data-act="open-thread" data-id="${t.id}" id="card-${t.id}" aria-label="Open ${esc(t.title)}, working">
    <span class="ch">${tile(t.provider, '', true)}<span class="tt"><span class="title">${esc(t.title)}</span><span class="meta">${prov(t.provider)} on ${esc(c.name)}</span></span></span>
    <span class="live-line"><span class="spin"></span><span>${esc(t.line)}</span></span>

function rowHtml(t) {
  const cls = t.state === 'finished-unread' ? 'unread' : t.state === 'failed' ? 'failed' : ''
  const tag = t.state === 'finished-unread' ? '<span class="tag fin">Finished</span>' : t.state === 'failed' ? '<span class="tag fail">Stopped</span>' : ''
  const lbl = `Open ${t.title}${t.state === 'finished-unread' ? ', finished, not read yet' : t.state === 'failed' ? ', stopped with an error' : ''}`
  return `<button class="row sq big ${cls}" data-act="open-thread" data-id="${t.id}" aria-label="${esc(lbl)}">
    ${tile(t.provider)}
    <span class="tt"><span class="title">${esc(t.title)}</span><span class="line">${esc(t.line)}</span></span>
    <span class="side"><span class="ago">${esc(t.ago)}</span>${tag}</span></button>`

function renderBadge() {
  const n = badgeCount(), tab = $('[data-tab="threads"]')
  const old = $('.badge', tab)
  tab.setAttribute('aria-label', n ? `Threads, ${n} waiting for you` : 'Threads')
  if (!n) { old && old.remove(); return }
  if (old && old.textContent === String(n)) return
  if (old) { old.textContent = n; old.classList.remove('bump'); void old.offsetWidth; old.classList.add('bump') }
  else tab.insertAdjacentHTML('beforeend', `<span class="badge" aria-hidden="true">${n}</span>`)
}
function tick() {
  const t = Date.now()
  $$('[data-since]').forEach(el => { el.textContent = fmtEl(t - +el.dataset.since) })
}
setInterval(tick, 1000)

function leave(el) {
  return new Promise(res => {
    if (!el) return res()
    el.style.height = el.offsetHeight + 'px'; void el.offsetHeight
    el.classList.add('leaving'); el.style.height = '0px'
    setTimeout(res, reduce.matches ? 200 : 460)
  })
}

/* ---------- Answering ---------- */
async function sendAnswer(id, choice, btn) {
  const t = thread(id)
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Sending…' }
  await wait(900)
  if (btn) { btn.classList.add('done'); btn.innerHTML = `<span class="pop-in" style="display:inline-flex">${ic('check', 18, 2.6)}</span>Answered` }
  await wait(650)
  if (isSheetOpen()) await closeSheet()
  await leave($('#card-' + id))
  const label = choice === '__own' ? 'your answer' : S.question.options.find(o => o.id === choice)?.label
  Object.assign(t, { state: 'working', line: `Working on your answer: ${label}`, ago: 'now', startedAt: Date.now() })
  st.arriving = id; delete st.picked[id]
  renderThreads()
  toast('Answer sent')
}
async function answerPermission(id, choice, btn) {
  const t = thread(id)
  const labels = { once: ['Allowing…', 'Allowed'], always: ['Allowing…', 'Allowed'], deny: ['Denying…', 'Denied'] }
  if (btn) { $$('button', btn.parentElement).forEach(b => b.disabled = true); btn.disabled = false; btn.style.pointerEvents = 'none'; btn.innerHTML = `<span class="spin"></span>${labels[choice][0]}` }
  await wait(800)
  if (btn) { btn.classList.add('done'); btn.innerHTML = `<span class="pop-in" style="display:inline-flex">${ic('check', 18, 2.6)}</span>${labels[choice][1]}` }
  await wait(600)
  if (isSheetOpen()) await closeSheet()
  await leave($('#card-' + id))
  if (choice === 'deny') Object.assign(t, { state: 'done', line: 'You denied npm ci', ago: 'now' })
  else Object.assign(t, { state: 'working', line: 'Running npm ci', ago: 'now', startedAt: Date.now() })
  st.arriving = id
  renderThreads()
  toast(choice === 'deny' ? 'Denied. Codex was told not to run npm ci.' : choice === 'always' ? 'Allowed. npm ci won’t ask again in this project.' : 'Allowed once. Codex is running npm ci.')
}

/* ---------- Sheets ---------- */
let sheetReturn = null
const isSheetOpen = () => $('#sheet-layer').classList.contains('open')
function openSheet(html, { full = false, label = 'Sheet' } = {}) {
  sheetReturn = document.activeElement
  const sh = $('#sheet'), layer = $('#sheet-layer')
  sh.className = 'sheet' + (full ? ' full' : '')
  sh.setAttribute('aria-label', label)
  sh.innerHTML = html
  sh.scrollTop = 0
  layer.classList.remove('closing')
  void sh.offsetWidth
  layer.classList.add('open')
  if (full) $('#stage').classList.add('recede')
  setTimeout(() => { const f = $('button:not(:disabled)', sh); f && f.focus({ preventScroll: true }) }, 60)
}
function closeSheet() {
  const layer = $('#sheet-layer')
  if (!layer.classList.contains('open')) return Promise.resolve()
  layer.classList.add('closing'); layer.classList.remove('open')
  $('#stage').classList.remove('recede')
  closeMenu()
  return new Promise(r => setTimeout(() => { layer.classList.remove('closing'); if (sheetReturn && document.contains(sheetReturn)) sheetReturn.focus({ preventScroll: true }); r() }, reduce.matches ? 200 : 380))
}

/* ---------- Menus ---------- */
let menuAnchor = null, menuPick = null
function openMenu(anchor, items, onPick, { align = 'left', width } = {}) {
  closeMenu()
  menuAnchor = anchor; menuPick = onPick
  const m = $('#menu'), layer = $('#menu-layer'), app = $('#app').getBoundingClientRect()
  m.innerHTML = items.map((it, i) => `<button role="menuitemradio" data-i="${i}" aria-checked="${!!it.selected}" ${it.disabled ? 'disabled' : ''} class="sq">
    ${it.lead || ''}<span class="mt"><span class="ml" style="display:block">${esc(it.label)}</span>${it.desc ? `<span class="md2" style="display:block">${esc(it.desc)}</span>` : ''}</span>
    <span class="mck">${it.selected ? ic('check', 18, 2.6) : ''}</span></button>`).join('')
  const r = anchor.getBoundingClientRect()
  const w = Math.min(width || Math.max(r.width, 240), app.width - 32)
  m.style.width = w + 'px'
  let left = align === 'right' ? r.right - w : r.left
  left = Math.max(16, Math.min(left, app.width - w - 16))
  m.style.left = left + 'px'; m.style.top = '0px'
  const mh = m.offsetHeight
  let top = r.bottom + 8, oy = '0%'
  if (top + mh > app.height - 24) { top = Math.max(r.top - mh - 8, 60); oy = '100%' }
  m.style.top = top + 'px'
  m.style.setProperty('--ox', `${Math.round(r.left + r.width / 2 - left)}px`); m.style.setProperty('--oy', oy)
  anchor.setAttribute('aria-expanded', 'true')
  void m.offsetWidth
  layer.classList.add('open')
  $$('button', m).forEach(b => b.onclick = e => { e.stopPropagation(); const it = items[+b.dataset.i]; closeMenu(); onPick(it) })
  setTimeout(() => { const f = $('button[aria-checked="true"]', m) || $('button:not(:disabled)', m); f && f.focus({ preventScroll: true }) }, 40)
}
function closeMenu() {
  const layer = $('#menu-layer')
  if (!layer.classList.contains('open')) return false
  layer.classList.remove('open')
  if (menuAnchor) { menuAnchor.setAttribute('aria-expanded', 'false'); if (document.contains(menuAnchor)) menuAnchor.focus({ preventScroll: true }) }
  menuAnchor = null
  return true
}
$('#menu-layer').addEventListener('click', e => { if (e.target.id === 'menu-layer') closeMenu() })

function renderThreadState() {

function renderMessages() {

  }
  pane.innerHTML = list.map(m => m.role === 'user'

function renderActivity() {
  const t = thread(cur.id), pane = $('.pane[data-pane="act"]', cur.scr)

  const acts = S.activity.map(a => ({ ...a, status: a.status === 'running' && t.state !== 'working' ? 'done' : a.status, title: a.status === 'running' && t.state !== 'working' ? 'Ran' : a.title }))
  const files = acts.filter(a => a.kind === 'file-change')
  const add = files.reduce((s, a) => s + a.added, 0), del = files.reduce((s, a) => s + a.removed, 0)
  pane.innerHTML = `<div class="act-sum"><span class="chip work" style="${t.state === 'working' ? '' : 'display:none'}"><span class="pulse"></span>1 running</span><span class="chip" style="background:var(--quiet-fill);color:var(--ink)">${files.length} files edited · <span style="color:var(--accent-text)">+${add}</span> <span style="color:var(--danger-text)">−${del}</span></span></div>
    <div class="group" style="margin:0">${acts.map(a => {
      let subj = ''

        if (a.kind === 'command') subj = esc(a.subject)

      }
      const rt = a.status === 'running' ? `<span class="spin" style="width:14px;height:14px"></span><span data-since="${t.startedAt + 13 * 60000}">${fmtEl(Date.now() - t.startedAt - 13 * 60000)}</span>`
        : a.added != null ? `<span class="add">+${a.added}</span><span class="del">−${a.removed}</span>` : a.duration ? esc(a.duration) : ''
      return `<div class="act k-${a.kind}${a.status === 'running' ? ' running' : ''}"><span class="ki">${ic(icon[a.kind], 18)}</span>
        <span class="tt"><span class="a1" style="display:block">${esc(a.title)}</span>${subj ? `<span class="a2" style="display:block">${subj}</span>` : ''}</span><span class="rt">${rt}</span></div>`

function buildKeys() {
  const rows = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm']
  const k = l => `<button class="key" tabindex="-1" data-k="${l}">${l}</button>`
  $('.keys', cur.scr).innerHTML = `
    <div class="kr">${[...rows[0]].map(k).join('')}</div>
    <div class="kr mid">${[...rows[1]].map(k).join('')}</div>
    <div class="kr"><button class="key alt" tabindex="-1" data-k="shift" aria-label="Shift">${ic('shift', 20, 1.8)}</button>${[...rows[2]].map(k).join('')}<button class="key alt" tabindex="-1" data-k="del" aria-label="Delete">${ic('backspace', 22, 1.8)}</button></div>
    <div class="kr"><button class="key alt" tabindex="-1" data-k="123" style="flex:2.2">123</button><button class="key space" tabindex="-1" data-k=" ">space</button><button class="key go" tabindex="-1" data-k="send" disabled>Send</button></div>`
  $$('.key', cur.scr).forEach(b => b.onclick = e => {
    e.stopPropagation()
    const v = b.dataset.k
    if (v === 'send') return sendMsg()
    if (v === 'shift' || v === '123') return
    if (v === 'del') cur.text = cur.text.slice(0, -1)
    else if (!cur.text && v !== ' ') cur.text = v.toUpperCase()
    else cur.text += v
    setText()
  })
}
function setText() {
  const f = $('.field', cur.scr)
  f.classList.toggle('has', !!cur.text)
  $('.ftx', f).textContent = cur.text || 'Reply to this thread'
  if (!!cur.text !== !!$('.cbtn.send', cur.scr)) renderThreadState()
}
function setKb(open) {
  if (!cur) return
  cur.kb = open
  const scr = cur.scr
  $('.kb', scr).classList.toggle('open', open)
  scr.classList.toggle('kb-open', open)
  $('.th-head', scr).classList.toggle('compact', open)
  const sc = $('.th-scroll', scr)
  if (open && !cur.text) { cur.text = thread(cur.id).fresh && !msgs[cur.id].length ? 'Add a clear button to the search field' : 'Thanks, the tooltips look right now'; setText() }
  const keep = () => { sc.scrollTop = sc.scrollHeight }
  if (open) { let n = 0; const f = () => { keep(); if (++n < 28) requestAnimationFrame(f) }; f() }
}
async function sendMsg() {
  if (!cur || !cur.text.trim()) return
  const t = thread(cur.id), text = cur.text.trim()
  const list = msgs[cur.id]
  const m = { role: 'user', text, isNew: true, stamp: '<span class="spin" style="width:11px;height:11px;border-width:1.8px"></span>Sending…' }
  list.push(m)
  cur.text = ''; setText()
  if (t.fresh && list.length === 1) { t.title = text.length > 40 ? text.slice(0, 40) + '…' : text; $('.th-title', cur.scr).textContent = t.title }
  renderMessages(); renderThreadState()
  const sc = $('.th-scroll', cur.scr); sc.scrollTop = sc.scrollHeight
  const me = cur
  await wait(800)
  m.stamp = `${ic('check', 13, 2.6)}Sent`
  if (t.state !== 'working') Object.assign(t, { state: 'working', line: 'Reading your message', startedAt: Date.now(), ago: 'now' })
  if (cur === me) { renderMessages(); renderThreadState(); renderActivity(); sc.scrollTop = sc.scrollHeight }
  renderThreads()
}
async function stopTurn(btn) {

  const live = $('#live', me.scr); if (live) { live.classList.add('leave'); await wait(380) }

  toast('Stopped. What it already did is kept.', 'check')
}
function back() {
  if (!cur) return

  cur = null
  setTimeout(() => scr.remove(), 560)

  const tab = e.target.closest('.tab'); if (tab) return setTab(tab.dataset.tab)
  const segBtn = e.target.closest('[data-seg] button')
  if (segBtn) {
    const g = segBtn.closest('[data-seg]'), v = segBtn.dataset.v, name = g.dataset.seg
    const opts = $$('button', g).map(b => b.dataset.v)
    g.style.setProperty('--i', opts.indexOf(v))
    $$('button', g).forEach(b => b.setAttribute('aria-checked', b === segBtn))
    if (name === 'appearance') { st.appearance = v; paint(true); setTimeout(renderSettings, 420) }
    if (name === 'density') { st.density = v; paint(); setTimeout(renderSettings, 380) }
    return
  }
  const sw = e.target.closest('.sw')
  if (sw) { st.theme = sw.dataset.theme; $$('.sw').forEach(x => x.setAttribute('aria-checked', x === sw)); paint(true); return }
  const ts = e.target.closest('.ts-stop')
  if (ts) { const i = +ts.dataset.ts; st.textSize = TEXT_STEPS[i]; $('.ts-track').style.setProperty('--p', i); $$('.ts-stop').forEach(b => b.setAttribute('aria-checked', b === ts)); $('.ts-ends .nm').textContent = S.settings.textSizes[i]; paint(); return }
  const nf = e.target.closest('[data-notif]')
  if (nf) { const id = nf.dataset.notif; st.notif[id] = !st.notif[id]; nf.setAttribute('aria-checked', st.notif[id]); return }

  const el = e.target.closest('[data-act]'); if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return
  const id = el.dataset.id
  switch (el.dataset.act) {
    case 'new-thread': return newThread()
    case 'pick-computer': return computerMenu(el)
    case 'clear-search': st.query = ''; $('#q').value = ''; $('#q-clear').hidden = true; renderThreads(); return
    case 'toggle-settled': st.settledOpen = !st.settledOpen; el.setAttribute('aria-expanded', st.settledOpen); $('#settled').classList.toggle('open', st.settledOpen); return
    case 'open-thread': return openThread(id)
    case 'open-question': return questionSheet(id)
    case 'open-permission': return permissionSheet(id)
    case 'opt': {
      st.picked[id] = el.dataset.v
      $$(`#card-${id} .opt`).forEach(o => o.setAttribute('aria-checked', o === el))
      $(`#card-${id} [data-act="card-send"]`).disabled = false
      return
    }
    case 'card-send': return sendAnswer(id, st.picked[id], el)
    case 'perm': return answerPermission(id, el.dataset.v, el)
    case 'retry': {
      const c = comp(id), old = el.innerHTML
      el.disabled = true; el.innerHTML = '<span class="spin"></span>Trying…'
      await wait(1500)
      el.disabled = false; el.innerHTML = old
      toast(`Still can’t reach ${c.name}. Check it is awake.`, 'offline')
      return
    }
    case 'close-sheet': return closeSheet()
    case 'back': return back()
    case 'stop': return stopTurn(el)
    case 'send-msg': return sendMsg()
    case 'nt-computer': nt.computer = id; nt.project = null; nt.step = 1; return renderNt()
    case 'nt-project': nt.project = +el.dataset.i; nt.step = 2; return renderNt()
    case 'nt-back': nt.step = Math.max(0, nt.step - 1); return renderNt()
    case 'nt-goto': nt.step = +el.dataset.step; return renderNt()
    case 'nt-open': return ntOpen(el)
    case 'field': return fieldMenu(el)
  }
})

// Search loses focus (and the keyboard closes) on any press outside it.
document.addEventListener('pointerdown', e => {
  const q = $('#q')
  if (q && document.activeElement === q && !e.target.closest('#search')) q.blur()
}, true)
// The sheet's spring overshoot hangs below the frame; never let the frame itself scroll to it.
$('#app').addEventListener('scroll', e => { e.currentTarget.scrollTop = 0; e.currentTarget.scrollLeft = 0 })
// iOS needs a touch listener for :active to show the squish.
document.addEventListener('touchstart', () => {}, { passive: true })

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return
  if (closeMenu()) return
  if (isSheetOpen()) return closeSheet()
  if (cur && cur.kb) return setKb(false)
  if (document.activeElement === $('#q')) return $('#q').blur()
  if (cur) back()
})

/* ---------- Start ---------- */
;(function start() {
  const probe = $('#sb-probe').offsetHeight
  if (probe > 20) { document.documentElement.style.setProperty('--sb', probe + 'px'); document.documentElement.classList.add('real-sb') }
  paint()
  buildTabs()
  buildThreadsShell()
  renderThreads()
  renderComputers()
  renderSettings()
})()
</script>
</body>
