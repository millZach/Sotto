  $$('#sheet .steps i').forEach((el, i) => el.classList.toggle('on', i < n.step))
  $('#ntLabel').textContent = ['Step 1 of 3: computer', 'Step 2 of 3: project', 'Step 3 of 3: options'][n.step - 1]
  ;[1, 2, 3].forEach(i => { const p = $(`#nt${i}`); p.classList.toggle('left', i < n.step); p.classList.toggle('right', i > n.step); p.inert = i !== n.step })
  $('#nt1').innerHTML = `<h3 class="s-title" style="margin-top:0">Where should it run?</h3><p class="s-sub">Threads run on a computer with Sotto open.</p><div style="margin-top:var(--sp-5)">` +
    D.computers.map(c => {
      const count = D.newThread.projects.filter(p => p.computer === c.id).length
      return `<button class="pick press" data-nt-computer="${c.id}" ${c.status !== 'online' ? 'disabled' : ''} aria-label="${esc(c.name)}${c.status !== 'online' ? ', can’t be reached' : ''}">
        <span class="light ${c.status === 'online' ? 'acc' : 'bad'}"></span><span class="tx"><div class="pt">${esc(c.name)}</div>
        <div class="pd">${c.status === 'online' ? `Online · ${count} ${count === 1 ? 'project' : 'projects'}` : 'Can’t be reached right now'}</div></span>${c.status === 'online' ? ic('chevR', 'chev') : ''}</button>`
    }).join('') + '</div>'
  if (n.computer) {
    $('#nt2').innerHTML = `<div class="crumbs"><button class="crumb press" data-nt-step="1" aria-label="Change computer, now ${esc(compName(n.computer))}">${ic('computer', 'sm')}<span>${esc(compName(n.computer))}</span></button></div>
      <h3 class="s-title" style="margin-top:0">Which project?</h3><p class="s-sub">The thread works in this folder.</p><div style="margin-top:var(--sp-5)">` +
      D.newThread.projects.filter(p => p.computer === n.computer).map(p => `<button class="pick press" data-nt-project="${esc(p.name)}">
        <span class="ic" style="color:var(--accent-text)">${ic('folder')}</span><span class="tx"><div class="pt">${esc(p.name)}</div><div class="pd">${esc(p.path)} · ${p.threads} threads</div></span>${ic('chevR', 'chev')}</button>`).join('') + '</div>'
  }
  if (n.project) renderNTOptions()
  const foot = $('#ntFoot')
  foot.innerHTML = n.step === 1 ? `<p class="phint" style="margin:0;min-height:44px;display:flex;align-items:center">Choose a computer to continue.</p>`
    : n.step === 2 ? `<p class="phint" style="margin:0;min-height:44px;display:flex;align-items:center">Choose a project to continue.</p>`
    : `<button class="btn primary wide press" id="ntOpen">Open thread on ${esc(compName(n.computer))}</button>`
}
function renderNTOptions() {
  const n = S.nt
  $('#nt3').innerHTML = `<div class="crumbs">
      <button class="crumb press" data-nt-step="1" aria-label="Change computer, now ${esc(compName(n.computer))}">${ic('computer', 'sm')}<span>${esc(compName(n.computer))}</span></button>
      <button class="crumb press" data-nt-step="2" aria-label="Change project, now ${esc(n.project)}">${ic('folder', 'sm')}<span>${esc(n.project)}</span></button></div>
    <h3 class="s-title" style="margin-top:0">How should it work?</h3><p class="s-sub">These start from your new thread defaults.</p><div style="margin-top:var(--sp-5)">` +
    ['model', 'effort', 'permissions', 'working'].map(f => `<button class="fieldbox press" data-nt-field="${f}" aria-haspopup="menu" aria-label="${fieldNames[f]}: ${esc(labelOf(f, n[f]))}. Change">
      <span class="tx"><div class="fl">${fieldNames[f]}</div><div class="fv">${esc(labelOf(f, n[f]))}</div></span>${ic('updown', 'ud')}</button>`).join('') + '</div>' +
    (n.permissions === 'full' ? `<p class="phint">Full access runs commands without asking. You can still stop the thread from here.</p>` : '')
}
async function openNewThread(b) {
  const n = S.nt
  b.classList.add('busy', 'opening'); b.innerHTML = '<i class="spin"></i>Opening…'
  $$('#ntHead button').forEach(x => x.disabled = true)
  await wait(1300)
  const model = D.newThread.models.find(m => m.id === n.model)
  const t = { id: 'n' + now(), title: 'New thread', provider: model.provider, computer: n.computer, project: n.project, state: 'done', ago: 'now', line: 'Waiting for your first message', fresh: true, since: null,
    branch: n.working === 'worktree' ? 'sotto/k3x9' : null }
  S.threads.unshift(t); renderThreads()
  closeSheet(); await wait(300)
  openThread(t.id); toast(`Opened on ${compName(n.computer)}.`)
  setTimeout(() => openKb('reply'), 560)
}

/* ---------- Settings ---------- */
const sizes = [0.9, 1, 1.1, 1.2, 1.32]
function renderSettings() {
  const app = resolvedAppearance()
  const seg = (name, opts, cur, key) => `<div class="seg" role="radiogroup" aria-label="${name}"><i class="knob"></i>${opts.map(o => `<button role="radio" aria-checked="${o === cur}" data-${key}="${o}">${o}</button>`).join('')}</div>`
  $('#settingsPage').innerHTML = `
    <div class="page-head"><h1 class="page-title">Settings</h1></div>
    <p class="page-sub">These are kept on this iPhone. They don’t change any computer’s settings.</p>

    <section class="group"><h2>Look</h2>
      <div class="panel">
        <div class="prow"><span class="plabel">Appearance</span><span class="pvalue">${S.appearance === 'System' ? `Following the iPhone: ${app}` : ''}</span></div>
        ${seg('Appearance', D.settings.appearance, S.appearance, 'appearance')}
      </div>
      <div class="panel">
        <div class="prow"><span class="plabel">Theme</span><span class="pvalue">${esc(D.THEMES[S.theme].label)}, ${app}</span></div>
        <div class="themes" role="radiogroup" aria-label="Theme">
          ${Object.entries(D.THEMES).map(([id, th]) => { const r = th[app]; return `<button class="theme press" role="radio" aria-checked="${S.theme === id}" data-theme="${id}" aria-label="${th.label} theme"
            style="--tc:${r.canvas};--ta:${r.accent};--ti:${r.ink};--tm:${r.muted};--tb:${r.bubble}">
            <span class="room"><i class="l1"></i><i class="l2"></i><i class="bb"></i><i class="dot"></i></span>
            <span class="name">${th.label}${ic('check', 'sm')}</span></button>` }).join('')}
        </div>
        <p class="phint">The theme colours the light at the top of each screen, what’s working and what you can tap.</p>
      </div>
      <div class="panel">
        <div class="prow"><span class="plabel">Text size</span><span class="pvalue">${D.settings.textSizes[S.textSize]}</span></div>
        <div class="sizes" role="radiogroup" aria-label="Text size">
          ${D.settings.textSizes.map((l, i) => `<button class="size press" role="radio" aria-checked="${S.textSize === i}" data-size="${i}" aria-label="${l}"><span style="font-size:${13 + i * 3}px">A</span></button>`).join('')}
        </div>
        <div class="preview" aria-hidden="true"><div class="t">Pick the drawer shortcut</div><div class="l">Asks: which shortcut should open the terminal drawer?</div></div>
      </div>
      <div class="panel">
        <div class="prow"><span class="plabel">Message density</span></div>
        ${seg('Message density', D.settings.density, S.density, 'density')}
        <p class="phint">${S.density === 'Compact' ? 'Tighter spacing fits more of a thread on screen.' : 'Room between messages, lists and steps.'}</p>
      </div>
    </section>

    <section class="group"><h2>Notifications</h2>
      <div class="panel" style="padding-top:var(--sp-1);padding-bottom:var(--sp-1)">
        ${S.notifications.map(n => `<button class="toggle-row" role="switch" aria-checked="${n.on}" data-notif="${n.id}">
          <span class="tx"><div class="plabel">${esc(n.label)}</div>${n.description ? `<div class="d">${esc(n.description)}</div>` : ''}</span><span class="sw" aria-hidden="true"></span></button>`).join('')}
      </div>
      <p class="note-line">${esc(D.settings.notificationNote)}</p>
    </section>

    <section class="group"><h2>New thread defaults</h2>
      <div class="panel" style="padding-top:var(--sp-1);padding-bottom:var(--sp-1)">
        ${['model', 'effort', 'permissions', 'working'].map(f => `<button class="def-row press" data-def="${f}" aria-haspopup="menu" aria-label="${fieldNames[f]}: ${esc(labelOf(f, S.defaults[f]))}. Change">
          <span class="k1">${fieldNames[f]}</span><span class="v1">${esc(labelOf(f, S.defaults[f]))}</span>${ic('updown', 'sm')}</button>`).join('')}
      </div>
      <p class="note-line">A computer that can’t let this iPhone grant permission starts every thread by asking.</p>
    </section>

    <section class="group"><h2>About</h2>
      <div class="panel about"><span class="logo" aria-hidden="true">S</span><span><div class="plabel">Sotto 0.1.28</div><div class="pvalue">Connected to 2 of 3 computers</div></span></div>
    </section>`
  $$('#settingsPage .seg').forEach(placeKnob)
}
$('#settingsPage').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return
  if (b.dataset.appearance) { S.appearance = b.dataset.appearance; paint(); renderSettings(); return }
  if (b.dataset.theme) { S.theme = b.dataset.theme; paint(); renderSettings(); toast(`${D.THEMES[S.theme].label} theme on.`); return }
  if (b.dataset.size) { S.textSize = +b.dataset.size; document.documentElement.style.setProperty('--ts', sizes[S.textSize]); renderSettings(); return }
  if (b.dataset.density) { S.density = b.dataset.density; document.documentElement.style.setProperty('--dens', S.density === 'Compact' ? .62 : 1); renderSettings(); return }
  if (b.dataset.notif) { const n = S.notifications.find(x => x.id === b.dataset.notif); n.on = !n.on; b.setAttribute('aria-checked', n.on); return }
  if (b.dataset.def) return openFieldMenu(b, b.dataset.def, S.defaults, () => { renderSettings(); toast('New thread defaults saved.') })
})

/* ---------- Computers ---------- */
function renderComputers() {
  $('#computersPage').innerHTML = `
    <div class="page-head"><h1 class="page-title">Computers</h1></div>
    <p class="page-sub">Each computer runs Sotto and shares its threads with this iPhone.</p>
    <div class="stack" style="margin-top:var(--sp-6)">
    ${D.computers.map(c => {
      const projects = new Set([...D.newThread.projects.filter(p => p.computer === c.id).map(p => p.name), ...S.threads.filter(t => t.computer === c.id).map(t => t.project)])
      const nThreads = S.threads.filter(t => t.computer === c.id).length
      const up = c.status === 'online'
      return `<article class="pc ${up ? 'online' : 'down'}">
        <div class="pc-h"><span class="ic">${ic('computer')}</span><span class="tx"><div class="n">${esc(c.name)}</div>
          <div class="s"><i class="light ${up ? 'acc' : 'bad'}"></i>${up ? 'Online' : 'Can’t be reached'}</div></span></div>
        <div class="facts">
          <div class="fact"><b>${c.canAnswer ? 'Can answer' : 'Can’t answer'}</b><span>${c.canAnswer ? 'Questions and permissions' : 'Answer on the computer'}</span></div>
          <div class="fact"><b class="num">${projects.size} ${projects.size === 1 ? 'project' : 'projects'}</b><span>${nThreads} ${nThreads === 1 ? 'thread' : 'threads'}</span></div>
        </div>
        <div class="pc-actions">
          <button class="btn soft press" data-show="${c.id}">Show its threads</button>
          ${up ? '' : `<button class="btn ghost press" data-retry="${c.id}" ${S.desktopTry === 'trying' ? 'disabled' : ''}>${S.desktopTry === 'trying' ? '<i class="spin"></i>Trying' : `${ic('retry', 'sm')}Try again`}</button>`}
        </div>
        ${!up && S.desktopTry === 'failed' ? '<p class="phint">Still can’t reach it. Check that Sotto is open on DESKTOP-8NPFSBM and that it’s on the same network.</p>' : ''}
      </article>`
    }).join('')}</div>`
}
$('#computersPage').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return
  if (b.dataset.show) { S.filter = b.dataset.show; renderThreads(); setTab('threads'); $('#threadsScroll').scrollTop = 0; return }
  if (b.dataset.retry) { S.desktopTry = 'trying'; renderComputers(); await wait(1600); S.desktopTry = 'failed'; renderComputers(); renderThreads() }
})

addEventListener('resize', () => { $$('.seg').forEach(placeKnob) })
document.addEventListener('touchstart', () => {}, { passive: true })
renderThreads(); renderTabs()
/* Prototype only: ?open=t3 opens a thread on load */
{ const id = new URLSearchParams(location.search).get('open'); if (id && thread(id)) document.fonts.ready.then(() => openThread(id)) }
</script>
</body>
</html>
