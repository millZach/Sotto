<!doctype html>
<!--
  PROTOTYPE, throwaway. Steps folded into one live line, on top of glow-refined.html (the approved Glow look, with the
  thread page that shipped: title scrolls away, steps inline).
  The question: a busy thread shows dozens of step lines and they bury the messages. Zach asked for the tool calls to
  shrink to one line that shows the thing is working, in the theme, and opens to show them all. He chose:
  - Each run of steps between two messages folds into one line.
  - While the run works, the line shows the step running now (verb and subject, with its time) in the accent, with an
    effect that says it is alive. Three effects, switchable with ?fold=A|B|C, the prototype-only pill where the island
    is, or the left and right arrow keys: A · Sweep, B · Pulse, C · Glow edge.
  - Once the run ends, the line is "14 steps · 1m 32s". Failed steps get nothing special on the folded line.
  - A press opens the steps in place, as the inline trail, with a spring; another press folds them.
  The open thread's working run gains a step every 2.5 s and, after a while, ends with a short note from the agent and
  starts a new run, so the line can be watched changing. Stop folds the run; a reply ends it and the next steps start
  a new run after the reply. ?open=t3 opens the busy thread on load. Everything else is glow-refined.html as it was.
  Glow, refined:
  - Threads, Computers and Settings scroll as one page, like Soft: the heading, the + button, the computer picker,
    the summary, search and the wash all move up with the list; content fades out under the status bar.
  What Glow was:
  Light is status. Every screen has a soft wash at the top, mixed from the chosen theme's accent into the canvas, so the
  theme colours the whole room rather than sitting in buttons. A thread that is working breathes with a slow accent halo,
  a thread that needs the user carries a warm glow (and warms the Threads wash while anything waits), and a thread that
  stopped with an error has a faint danger edge. Bars that float over content (tab bar, thread header, reply box, menus)
  are frosted glass with a hairline highlight, echoing the desktop's frosted window. The reply box glows while it is
  focused. Glows stay low and slow: depth and hierarchy, never neon.
-->

<style>
@font-face { font-family: Figtree; src: url(../../../src/renderer/src/assets/fonts/figtree-latin.woff2) format("woff2"); font-weight: 300 900; }

/* ---------- Scales ---------- */
:root {
  --ts: 1;          /* text size step */
  --dens: 1;        /* message density */
  --fs-cap: calc(12px * var(--ts));
  --fs-sm: calc(13.5px * var(--ts));
  --fs-body: calc(15.5px * var(--ts));
  --fs-lead: calc(17px * var(--ts));
  --fs-title: calc(21px * var(--ts));
  --fs-display: calc(28px * var(--ts));
  --lh-tight: 1.22;
  --lh: 1.45;

  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-7: 32px; --sp-8: 44px;
  --gutter: var(--sp-5);
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px;

  --sb-h: calc(50px + env(safe-area-inset-top));
  --safe-b: max(env(safe-area-inset-bottom), 18px);
  --kb-h: 296px;
  --tab-h: 62px;

  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.32, .72, 0, 1);
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;

  /* Derived from theme roles only */
  --accent-text: color-mix(in oklab, var(--accent) 84%, var(--ink));
  --warn-text: color-mix(in oklab, var(--warning) 62%, var(--ink));
  --danger-text: color-mix(in oklab, var(--danger) 78%, var(--ink));
  --glass: color-mix(in oklch, var(--surface) 58%, transparent);
  --glass-strong: color-mix(in oklch, var(--overlay) 76%, transparent);
  --hairline: color-mix(in oklch, var(--ink) 10%, transparent);
  --hl: color-mix(in oklch, var(--ink) 10%, transparent);
  --wash-a: color-mix(in oklch, var(--accent) 34%, transparent);
  --wash-b: color-mix(in oklch, var(--accent) 16%, transparent);
  --wash-w: color-mix(in oklch, var(--warning) 22%, transparent);
  --fill-soft: color-mix(in oklch, var(--ink) 7%, transparent);
  --fill-softer: color-mix(in oklch, var(--ink) 4.5%, transparent);
  --shadow-far: 0 24px 60px -20px rgba(0, 0, 0, .6);
}
[data-appearance="light"] {
  --warn-text: color-mix(in oklab, var(--warning) 48%, var(--ink));
  --danger-text: color-mix(in oklab, var(--danger) 70%, var(--ink));
  --accent-text: color-mix(in oklab, var(--accent) 78%, var(--ink));
  --glass: color-mix(in oklch, var(--surface) 68%, transparent);
  --glass-strong: color-mix(in oklch, var(--surface) 80%, transparent);
  --hl: color-mix(in oklch, var(--surface) 95%, transparent);
  --wash-a: color-mix(in oklch, var(--accent) 22%, transparent);
  --wash-b: color-mix(in oklch, var(--accent) 11%, transparent);
  --wash-w: color-mix(in oklch, var(--warning) 20%, transparent);
  --shadow-far: 0 24px 50px -22px rgba(0, 0, 0, .28);
}

/* ---------- Base ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); }
body { font-family: Figtree, -apple-system, system-ui, sans-serif; color: var(--ink); font-size: var(--fs-body); line-height: var(--lh);
  -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 0; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 12px; }
h1, h2, h3, h4, p { margin: 0; }
code, pre { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 16px; height: 16px; }
svg.i.lg { width: 24px; height: 24px; }

#phone { position: fixed; inset: 0; overflow: hidden; overflow: clip; background: rgb(0 0 0); }
#stage { position: absolute; inset: 0; overflow: hidden; overflow: clip; background: var(--canvas); transform-origin: 50% 100%;
  transition: transform .5s var(--spring), border-radius .5s var(--spring); }
.sheet-open #stage { transform: scale(.94) translateY(6px); border-radius: 26px; }

/* ---------- Status bar ---------- */
.statusbar { position: absolute; z-index: 60; top: 0; left: 0; right: 0; height: var(--sb-h); padding: env(safe-area-inset-top) 28px 0 34px;
  display: flex; align-items: center; justify-content: space-between; pointer-events: none; font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
.statusbar .right { display: flex; gap: 6px; align-items: center; }
.statusbar svg { fill: currentColor; stroke: none; }

/* ---------- Wash: the theme colours the room ---------- */
.wash { position: absolute; z-index: 0; left: -10%; right: -10%; top: 0; height: 520px; pointer-events: none; overflow: hidden; }
.wash::before, .wash::after { content: ""; position: absolute; inset: 0; }
.wash::before {
  background:
    radial-gradient(60% 52% at 18% 0%, var(--wash-a), transparent 72%),
    radial-gradient(48% 44% at 88% 6%, var(--wash-b), transparent 72%);
  animation: drift 26s ease-in-out infinite alternate;
}
.wash::after { background: radial-gradient(46% 40% at 86% 2%, var(--wash-w), transparent 70%); opacity: 0; transition: opacity 1.6s ease; }
.wash.warm::after { opacity: 1; animation: drift 31s ease-in-out infinite alternate-reverse; }
.wash.short { height: 330px; }
.wash.quiet { --wash-a: color-mix(in oklch, var(--accent) 16%, transparent); --wash-b: color-mix(in oklch, var(--accent) 8%, transparent); }
.wash.failed { --wash-a: color-mix(in oklch, var(--danger) 16%, transparent); --wash-b: color-mix(in oklch, var(--accent) 8%, transparent); }
@keyframes drift { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(-3%, 2%, 0) scale(1.07); } }

/* ---------- Glass ---------- */
.glass { background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.7); backdrop-filter: blur(22px) saturate(1.7);
  box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px var(--hairline); }

/* ---------- Screens ---------- */
.screen { position: absolute; inset: 0; overflow: hidden; overflow: clip; background: var(--canvas); }
.tab-root::after { content: ""; position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; height: calc(var(--tab-h) + var(--safe-b) + 36px); pointer-events: none;
  background: linear-gradient(to bottom, transparent, color-mix(in oklch, var(--canvas) 88%, transparent) 55%); }
.tab-root { opacity: 0; visibility: hidden; transform: scale(.985); transition: opacity .28s ease, transform .36s var(--ease), visibility 0s .36s; }
.tab-root.on { opacity: 1; visibility: visible; transform: none; transition: opacity .28s ease, transform .36s var(--ease), visibility 0s; }
.tab-root.under { transform: translateX(-24%); transition: transform .46s var(--spring); }
.tab-root .dim { position: absolute; inset: 0; z-index: 30; background: rgba(0, 0, 0, .32); opacity: 0; pointer-events: none; transition: opacity .46s var(--spring); }
.tab-root.under .dim { opacity: 1; }
#scr-thread { z-index: 20; transform: translateX(102%); visibility: hidden; box-shadow: -18px 0 40px -18px rgba(0, 0, 0, .55);
  transition: transform .46s var(--spring), visibility 0s .46s; }
#scr-thread.in { transform: none; visibility: visible; transition: transform .46s var(--spring), visibility 0s; }
.scroll { position: absolute; inset: 0; z-index: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
/* A tab page is one scrolling sheet: the wash, the heading and its controls all move up with the list. The page clips
   the wash sideways so the drift never widens the scroll. */
.page { padding: var(--sb-h) var(--gutter) calc(var(--tab-h) + var(--safe-b) + var(--sp-8)); position: relative; isolation: isolate; overflow-x: clip; }
.page > .wash { z-index: -1; }

/* Content fades out under the status bar once the page moves, so text never meets the clock. At rest it is clear
   and the wash reaches the top edge. */
.sb-fade { position: absolute; z-index: 8; top: 0; left: 0; right: 0; height: calc(var(--sb-h) + 10px); pointer-events: none;
  background: linear-gradient(var(--canvas) 62%, color-mix(in oklch, var(--canvas) 0%, transparent)); opacity: var(--sbf, 0); }

.page-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); min-height: 52px; margin-top: 0; }
.page-title { font-size: var(--fs-display); font-weight: 720; letter-spacing: -.025em; line-height: 1.1; }
.page-sub { color: var(--muted); font-size: var(--fs-sm); margin-top: var(--sp-1); }

.fab { position: relative; flex: none; margin-right: calc(var(--sp-1) * -1); width: 44px; height: 44px; border-radius: 50%;

  box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px color-mix(in oklch, var(--accent) 28%, transparent), 0 8px 26px -8px color-mix(in oklch, var(--accent) 55%, transparent); }

/* ---------- Press feedback ---------- */
.press { transition: transform .16s var(--ease), background-color .2s ease, box-shadow .3s ease, opacity .2s ease; }
.press:active:not(:disabled) { transform: scale(.972); }

/* ---------- Buttons ---------- */
.btn { min-height: 44px; padding: 0 var(--sp-4); border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  font-weight: 640; font-size: var(--fs-body); white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-ink);
  box-shadow: inset 0 1px 0 color-mix(in oklch, var(--accent-ink) 14%, transparent), 0 8px 22px -10px color-mix(in oklch, var(--accent) 80%, transparent); }

/* ---------- Lights ---------- */
.light { width: 8px; height: 8px; border-radius: 50%; flex: none; background: currentColor;
  box-shadow: 0 0 0 3px color-mix(in oklch, currentColor 18%, transparent), 0 0 12px color-mix(in oklch, currentColor 70%, transparent); }
.light.acc { color: var(--accent); }

/* ---------- Threads home ---------- */
.controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-2) var(--sp-3); margin-top: var(--sp-3); }
.selector { min-height: 44px; padding: 0 var(--sp-3) 0 var(--sp-3); border-radius: 999px; display: inline-flex; align-items: center; gap: var(--sp-2);
  font-weight: 620; font-size: var(--fs-sm); background: var(--fill-soft); box-shadow: inset 0 0 0 1px var(--hairline); max-width: 100%; }
.selector .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.summary { display: flex; gap: var(--sp-4); font-size: var(--fs-sm); color: var(--muted); }
.summary span { display: inline-flex; align-items: center; white-space: nowrap; }
.summary .light { margin-right: var(--sp-2); }

.search { margin-top: var(--sp-3); min-height: 46px; border-radius: 999px; display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-1) 0 var(--sp-4);
  background: color-mix(in oklch, var(--surface) 70%, transparent); box-shadow: inset 0 0 0 1px var(--hairline); color: var(--muted); transition: box-shadow .3s ease, background .3s ease; }
.search.focus { box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--accent) 60%, transparent), 0 0 0 4px color-mix(in oklch, var(--accent) 14%, transparent), 0 0 26px -6px color-mix(in oklch, var(--accent) 45%, transparent); }
.search .field { flex: 1; min-height: 46px; display: flex; align-items: center; font-size: var(--fs-body); color: var(--ink); min-width: 0; overflow: hidden; white-space: nowrap; }
.search .ph { color: var(--placeholder); }
.caret { display: none; width: 2px; height: 1.15em; background: var(--accent); margin-left: 1px; border-radius: 1px; animation: blink 1.05s steps(1) infinite; flex: none; }
.focus .caret { display: inline-block; }
@keyframes blink { 50% { opacity: 0; } }
.search .clear { width: 44px; height: 44px; display: grid; place-items: center; color: var(--muted); }

.note { margin-top: var(--sp-4); padding: var(--sp-3) var(--sp-3) var(--sp-3) var(--sp-4); border-radius: var(--r-md); display: flex; gap: var(--sp-3); align-items: center;
  background: linear-gradient(90deg, color-mix(in oklab, var(--danger) 9%, var(--surface)), var(--surface) 70%); box-shadow: inset 0 0 0 1px var(--hairline); font-size: var(--fs-sm); color: var(--muted); }
.note p { flex: 1; min-width: 0; }
.note b { color: var(--ink); font-weight: 640; }
.note .btn { min-height: 40px; padding: 0 var(--sp-3); font-size: var(--fs-sm); flex: none; }

.sec { display: flex; align-items: center; gap: var(--sp-2); margin: var(--sp-7) 0 var(--sp-3); font-size: var(--fs-sm); font-weight: 650; color: var(--ink); }
.sec .count { color: var(--muted); font-weight: 500; }
.sec + .stack { margin-top: 0; }
.stack { display: flex; flex-direction: column; gap: var(--sp-3); }

/* Cards that need you: warm glow */
.card { position: relative; isolation: isolate; display: block; width: 100%; border-radius: var(--r-lg); background: var(--surface);
  box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px var(--hairline); }
.card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; pointer-events: none; }
.card.need { background: linear-gradient(180deg, color-mix(in oklab, var(--warning) 11%, var(--surface)), var(--surface) 72%);
  box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px color-mix(in oklch, var(--warning) 30%, transparent); }
.card.need::before { box-shadow: 0 14px 44px -16px color-mix(in oklch, var(--warning) 60%, transparent); animation: glow 6s ease-in-out infinite; }
.card.need.answered { background: linear-gradient(180deg, color-mix(in oklab, var(--accent) 14%, var(--surface)), var(--surface) 72%);
  box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px color-mix(in oklch, var(--accent) 45%, transparent); transition: background .4s ease, box-shadow .4s ease; }
.card.need.answered::before { box-shadow: 0 14px 44px -14px color-mix(in oklch, var(--accent) 70%, transparent); animation: none; }
@keyframes glow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

.card-open { display: block; width: 100%; padding: var(--sp-4) var(--sp-4) var(--sp-2); border-radius: var(--r-lg) var(--r-lg) 0 0; }
.card-top { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-cap); color: var(--muted); font-weight: 600; min-height: 18px; }
.card-top .tag { color: var(--warn-text); }
.card.working .card-top .tag { color: var(--accent-text); }
.card-top .ago { margin-left: auto; font-weight: 500; }
.card-title { font-size: var(--fs-lead); font-weight: 650; line-height: var(--lh-tight); margin-top: var(--sp-2); letter-spacing: -.01em; }
.card-meta { font-size: var(--fs-sm); color: var(--muted); margin-top: var(--sp-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-ask { font-size: var(--fs-body); margin-top: var(--sp-3); line-height: 1.38; }
.card-ask code, .inline-code { font-size: .9em; padding: 2px 7px; border-radius: 7px; background: var(--code-bg); color: var(--code-ink); box-shadow: inset 0 0 0 1px var(--hairline); white-space: nowrap; }
.choices { display: flex; flex-wrap: wrap; gap: var(--sp-2); padding: var(--sp-2) var(--sp-4) 0; }
.chip { min-height: 44px; padding: 0 var(--sp-4); border-radius: 999px; font-size: var(--fs-sm); font-weight: 620; background: var(--fill-soft);
  box-shadow: inset 0 0 0 1px var(--hairline); display: inline-flex; align-items: center; gap: var(--sp-2); }
.chip[aria-checked="true"] { background: color-mix(in oklab, var(--accent) 20%, var(--surface)); color: var(--ink);
  box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 18px -4px color-mix(in oklch, var(--accent) 55%, transparent); }
.card-actions { display: flex; gap: var(--sp-2); justify-content: flex-end; padding: var(--sp-3) var(--sp-3) var(--sp-3); flex-wrap: wrap; }
.card-actions .btn { min-height: 44px; font-size: var(--fs-sm); }
.card-actions .spacer { flex: 1; }

/* Working cards: a breathing accent halo and a light that runs along the bottom edge */
.card.working { text-align: left; padding: var(--sp-4); overflow: hidden;
  background: linear-gradient(180deg, color-mix(in oklab, var(--accent) 9%, var(--surface)), var(--surface) 70%);
  box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px color-mix(in oklch, var(--accent) 26%, transparent); }
.card-wrap { position: relative; isolation: isolate; border-radius: var(--r-lg); }
.card-wrap.working::before { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; pointer-events: none;
  box-shadow: 0 12px 40px -14px color-mix(in oklch, var(--accent) 70%, transparent), 0 0 0 1px color-mix(in oklch, var(--accent) 22%, transparent);
  animation: glow 4.4s ease-in-out infinite; }
.runner { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; overflow: hidden; }
.runner::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -40%;
  background: linear-gradient(90deg, transparent, color-mix(in oklch, var(--accent) 90%, transparent), transparent); animation: run 2.8s var(--ease) infinite; }
@keyframes run { to { left: 100%; } }
.live { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-3); font-size: var(--fs-sm); min-width: 0; }
.live .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheen { background: linear-gradient(90deg, var(--muted) 0%, var(--muted) 38%, var(--ink) 50%, var(--muted) 62%, var(--muted) 100%);
  background-size: 260% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 3.2s linear infinite; }
@keyframes sheen { from { background-position: 100% 0; } to { background-position: -160% 0; } }
.elapsed { font-variant-numeric: tabular-nums; color: var(--muted); font-size: var(--fs-cap); font-weight: 550; white-space: nowrap; }
