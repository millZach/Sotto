</head>
<body>
<div id="phone">
  <div class="statusbar" aria-hidden="true">
    <span class="num">9:41</span>
    <span class="right">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.2c2.4 0 4.6.9 6.2 2.5l1.2-1.2C13.4 1.5 10.8.5 8 .5S2.6 1.5.6 3.5l1.2 1.2C3.4 3.1 5.6 2.2 8 2.2zm0 3.4c1.5 0 2.8.6 3.8 1.5L13 5.9C11.7 4.7 9.9 3.9 8 3.9s-3.7.8-5 2l1.2 1.2c1-.9 2.3-1.5 3.8-1.5zm0 3.4c.6 0 1.1.2 1.5.6L8 11.1 6.5 9.6c.4-.4.9-.6 1.5-.6z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.6" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" opacity=".45"/></svg>
    </span>
  </div>

  <div class="proto" id="proto" role="group" aria-label="Prototype only: thread page version"><span class="pl" aria-hidden="true">proto</span><button data-v="A" aria-label="Thread version A, folded steps"><span>A</span></button><button data-v="B" aria-label="Thread version B, title scrolls away"><span>B</span></button><button data-v="C" aria-label="Thread version C, live strip"><span>C</span></button></div>

  <main id="stage">
    <section class="screen tab-root on" id="scr-threads" aria-label="Threads">
      <div class="scroll" id="threadsScroll"><div class="page"><div class="wash" id="threadsWash"></div><div id="threadsPage"></div></div></div>
      <div class="sb-fade" aria-hidden="true"></div>
      <div class="dim"></div>
    </section>
    <section class="screen tab-root" id="scr-computers" aria-label="Computers">
      <div class="scroll"><div class="page"><div class="wash short"></div><div id="computersPage"></div></div></div>
      <div class="sb-fade" aria-hidden="true"></div>
    </section>
    <section class="screen tab-root" id="scr-settings" aria-label="Settings">
      <div class="scroll"><div class="page"><div class="wash"></div><div id="settingsPage"></div></div></div>
      <div class="sb-fade" aria-hidden="true"></div>
    </section>
    <section class="screen" id="scr-thread" aria-label="Thread"></section>

    <nav class="tabbar glass" id="tabbar" aria-label="Tabs"></nav>
  </main>

  <div id="scrim"></div>
  <div id="sheet" role="dialog" aria-modal="true" aria-label="Sheet"></div>
  <div id="menuCatch"></div>
  <div id="menu" role="menu"></div>
  <div id="kb" aria-label="Keyboard"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div class="homebar"></div>
</div>

<script>
window.VARIANT = { name: 'Glow, refined', intent: 'Glow, refined page by page. Tab pages scroll as one sheet with the wash, and the thread page comes in three versions (?thread=A|B|C) that keep the top to one line and put the agent’s steps in the conversation. Light is status. The chosen theme washes the top of every screen, working threads breathe with a soft accent halo, anything that needs you glows warm, and the bars that float over content are frosted glass.' }

const D = window.SOTTO
const $ = (s, r = document) => r.querySelector(s)
const $$ = (s, r = document) => [...r.querySelectorAll(s)]
const esc = s => D.esc(String(s))
const reduce = matchMedia('(prefers-reduced-motion: reduce)')
const wait = ms => new Promise(r => setTimeout(r, ms))
const phone = $('#phone')

/* ---------- Icons ---------- */
const P = {
  plus: '<path d="M12 5v14M5 12h14"/>', up: '<path d="M12 19V5M6 11l6-6 6 6"/>',
  chevL: '<path d="M15 5l-7 7 7 7"/>', chevR: '<path d="M9 5l7 7-7 7"/>', chevD: '<path d="M7 10l5 5 5-5"/>',
  updown: '<path d="M8 9l4-4 4 4M8 15l4 4 4-4"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
  x: '<path d="M7 7l10 10M17 7L7 17"/>',
  threads: '<path d="M5 5h14a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 19 16h-7.5L7 19.5V16H5a1.5 1.5 0 0 1-1.5-1.5v-8A1.5 1.5 0 0 1 5 5z"/>',
  computer: '<rect x="3" y="4.5" width="18" height="11.5" rx="2"/><path d="M8.5 20h7M12 16v4"/>',
  settings: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/>',
  branch: '<circle cx="6.5" cy="5.5" r="2"/><circle cx="6.5" cy="18.5" r="2"/><circle cx="17.5" cy="7.5" r="2"/><path d="M6.5 7.5v9M17.5 9.5c0 4-11 2.5-11 7"/>',
  pr: '<circle cx="6.5" cy="5.5" r="2"/><circle cx="6.5" cy="18.5" r="2"/><circle cx="17.5" cy="18.5" r="2"/><path d="M6.5 7.5v9M17.5 16.5V10a3 3 0 0 0-3-3H11M13 5l-2 2 2 2"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  terminal: '<rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M7.5 10l3 2.5-3 2.5M13 15h4"/>',
  pencil: '<path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/>',
  file: '<path d="M7 3h7l5 5v13H7zM14 3v5h5"/>',
  spark: '<path d="M12 4v4M12 16v4M4 12h4M16 12h4M7 7l2 2M15 15l2 2M7 17l2-2M15 9l2-2"/>',
  copy: '<rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/>',
  retry: '<path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4.5H15"/>',
  shift: '<path d="M12 4.5l7.5 7.5H15.5v7h-7v-7H4.5z"/>',
  del: '<path d="M9 6h11v12H9l-6-6zM12 9.5l5 5M17 9.5l-5 5"/>',
  shield: '<path d="M12 3.5l7 2.8V11c0 4.4-2.9 7.8-7 9.5-4.1-1.7-7-5.1-7-9.5V6.3z"/>',
  q: '<circle cx="12" cy="12" r="8.5"/><path d="M9.8 9.6a2.3 2.3 0 1 1 3.2 2.1c-.6.3-1 .8-1 1.5v.6M12 16.6v.1"/>',
  globe: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 2.5 14.4 0 17M12 3.5c-2.5 2.6-2.5 14.4 0 17"/>',
  mic: '<rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M6 11.5a6 6 0 0 0 12 0M12 17.5v3"/>',
  steps: '<path d="M10 6.5h9.5M10 12h9.5M10 17.5h9.5"/><circle cx="5.5" cy="6.5" r="1.6"/><circle cx="5.5" cy="12" r="1.6"/><circle cx="5.5" cy="17.5" r="1.6"/>',
  folder: '<path d="M3.5 7a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>',
}
const ic = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`

/* ---------- State ---------- */
const mins = s => (/^(\d+)m$/.exec(s || '') || [0, 0])[1] * 60
const now = () => Date.now()
const S = {
  theme: 'sotto', appearance: 'Dark', textSize: 1, density: 'Comfortable',
  tab: 'threads', filter: 'all', query: '', settledOpen: false,
  threads: D.threads.map(t => ({ ...t, since: t.started ? now() - mins(t.started) * 1000 : null })),
  picked: {},            // threadId -> option id on the inline card
  msgs: {},              // threadId -> messages
  open: null, kb: null, reply: '', shift: true,
  stopped: {}, live: {},
  notifications: D.settings.notifications.map(n => ({ ...n })),
  defaults: { model: 'opus', effort: 'High', permissions: 'ask', working: 'shared' },
  desktopTry: 'idle', menuFor: null, nt: null, q: null, ownText: '',
}
const compName = id => (D.computers.find(c => c.id === id) || {}).name || id
const provName = id => D.providers[id] || id
const thread = id => S.threads.find(t => t.id === id)

/* ---------- Theme ---------- */
function resolvedAppearance() {
  if (S.appearance === 'System') return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
  return S.appearance.toLowerCase()
}
function paint() { D.applyTheme(S.theme, resolvedAppearance(), document.documentElement) }
paint()
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', () => { if (S.appearance === 'System') { paint(); renderSettings() } })

/* ---------- Toast ---------- */
let toastTimer
function toast(text) {
  const t = $('#toast')
  t.innerHTML = `<i class="ok">${ic('check', 'sm')}</i><span>${esc(text)}</span>`
  t.classList.remove('on'); void t.offsetWidth; t.classList.add('on')
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600)
}

/* ---------- Elapsed tickers ---------- */
function fmt(sec) {
  sec = Math.max(0, Math.floor(sec))
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60
  return h ? `${h}h ${String(m).padStart(2, '0')}m` : m ? `${m}m ${String(s).padStart(2, '0')}s` : `${s}s`
}
setInterval(() => { $$('[data-since]').forEach(el => { el.textContent = fmt((now() - +el.dataset.since) / 1000) }) }, 1000)
const elapsed = t => t.since ? `<span class="elapsed" data-since="${t.since}">${fmt((now() - t.since) / 1000)}</span>` : ''

/* ---------- Tabs ---------- */
function badgeCount() { return S.threads.filter(t => t.state === 'needs-you' || t.state === 'finished-unread').length }
let lastBadge = null
function renderTabs() {
  const n = badgeCount()
  const tabs = [['threads', 'Threads', 'threads'], ['computers', 'Computers', 'computer'], ['settings', 'Settings', 'settings']]
  $('#tabbar').innerHTML = tabs.map(([id, label, icon]) => `
    <button class="tab press" data-tab="${id}" ${S.tab === id ? 'aria-current="page"' : ''} aria-label="${label}${id === 'threads' && n ? `, ${n} waiting` : ''}">
      ${ic(icon)}<span>${label}</span>${id === 'threads' && n ? `<b class="badge ${lastBadge !== null && lastBadge !== n ? 'pop' : ''}">${n}</b>` : ''}
    </button>`).join('')
  lastBadge = n
}
function setTab(id) {
  if (S.tab === id) { const sc = $(`#scr-${id} .scroll`); sc?.scrollTo({ top: 0, behavior: 'smooth' }); return }
  closeKb(); S.tab = id
  $$('.tab-root').forEach(s => s.classList.toggle('on', s.id === `scr-${id}`))
  if (id === 'settings') renderSettings()
  if (id === 'computers') renderComputers()
  renderTabs()
}
$('#tabbar').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab) })

/* Each tab page scrolls as one sheet; the status-bar fade comes in over the first few points of travel */
$$('.tab-root').forEach(scr => {
  const sc = $('.scroll', scr), fade = $('.sb-fade', scr)
  sc.addEventListener('scroll', () => fade.style.setProperty('--sbf', Math.min(1, Math.max(0, sc.scrollTop / 24)).toFixed(3)), { passive: true })
})

/* ---------- Threads home ---------- */
function groups() {
  const q = S.query.trim().toLowerCase()
  const inComp = S.threads.filter(t => S.filter === 'all' || t.computer === S.filter)
  const list = inComp.filter(t => !q || [t.title, t.project, t.line, compName(t.computer), provName(t.provider)].join(' ').toLowerCase().includes(q))
  return {
    all: inComp, list, q,
    needs: list.filter(t => t.state === 'needs-you'),
    working: list.filter(t => t.state === 'working'),
    recent: list.filter(t => ['finished-unread', 'done', 'failed'].includes(t.state)),
    settled: list.filter(t => t.state === 'settled'),
  }
}

function needCard(t) {
  const isQ = t.id === D.question.thread
  const picked = S.picked[t.id]
  if (isQ) return `
  <article class="card need" data-card="${t.id}">
    <button class="card-open press" data-question="${t.id}" aria-label="Open the question from ${esc(t.title)}">
      <div class="card-top"><span class="light warn"></span><span class="tag">Question</span><span class="ago">${esc(t.ago)}</span></div>
      <h3 class="card-title">${esc(t.title)}</h3>
      <p class="card-meta">${esc(provName(t.provider))} on ${esc(compName(t.computer))}</p>
      <p class="card-ask">${esc(D.question.text)}</p>
    </button>
    <div class="choices" role="radiogroup" aria-label="Answers">
      ${D.question.options.map(o => `<button class="chip press" role="radio" aria-checked="${picked === o.id}" data-pick="${t.id}:${o.id}">${esc(o.label)}</button>`).join('')}
    </div>
    <div class="card-actions">
      <button class="btn ghost press" data-question="${t.id}" data-own="1">Write your own</button><span class="spacer"></span>
      <button class="btn primary press" data-send-inline="${t.id}" ${picked ? '' : 'disabled'}>Send answer</button>
    </div>
  </article>`
  return `
  <article class="card need" data-card="${t.id}">
    <button class="card-open press" data-permission="${t.id}" aria-label="Open the permission request from ${esc(t.title)}">
      <div class="card-top"><span class="light warn"></span><span class="tag">Permission</span><span class="ago">${esc(t.ago)}</span></div>
      <h3 class="card-title">${esc(t.title)}</h3>
      <p class="card-meta">${esc(provName(t.provider))} on ${esc(compName(t.computer))}</p>
      <p class="card-ask">Wants to run <code>${esc(D.permission.command)}</code> in its worktree.</p>
    </button>
    <div class="card-actions">
      <button class="btn ghost press" data-permission="${t.id}">More choices</button><span class="spacer"></span>
      <button class="btn soft press" data-perm-inline="${t.id}:deny">Deny</button>
      <button class="btn primary press" data-perm-inline="${t.id}:once">Allow once</button>
    </div>
  </article>`
}
function workingCard(t, arrive) {
  return `<div class="card-wrap working ${arrive ? 'arrive' : ''}" data-card="${t.id}">
    <button class="card working press" data-open="${t.id}" aria-label="Open thread: ${esc(t.title)}, working">
      <div class="card-top"><span class="light acc breathe"></span><span class="tag">Working</span><span class="ago">${elapsed(t)}</span></div>
      <h3 class="card-title">${esc(t.title)}</h3>
      <p class="card-meta">${esc(provName(t.provider))} on ${esc(compName(t.computer))} · ${esc(t.project)}</p>
      <p class="live"><span class="txt sheen">${esc(t.line)}</span></p>
      <span class="runner" aria-hidden="true"></span>
    </button></div>`
}
function row(t) {
  const cls = t.state === 'finished-unread' ? 'unread' : t.state === 'failed' ? 'failed' : ''
  const light = t.state === 'finished-unread' ? 'acc' : t.state === 'failed' ? 'bad' : 'off'
  const said = t.state === 'finished-unread' ? 'finished, unread' : t.state === 'failed' ? 'stopped with an error' : t.state === 'settled' ? 'settled' : 'finished'
  return `<button class="row press ${cls}" data-open="${t.id}" aria-label="Open thread: ${esc(t.title)}, ${said}">
    <span class="light ${light}"></span>
    <span class="body"><span class="t">${esc(t.title)}</span><span class="l">${esc(t.line)} · ${esc(compName(t.computer))}</span></span>
    <span class="a">${esc(t.ago)}</span></button>`
}

let arriveId = null
function renderThreads() {
  const g = groups()
  const needN = g.all.filter(t => t.state === 'needs-you').length, workN = g.all.filter(t => t.state === 'working').length
  const showDesk = S.filter === 'all' || S.filter === 'desktop'
  const fName = S.filter === 'all' ? 'All computers' : compName(S.filter)
  const fLight = S.filter === 'all' ? 'acc' : (D.computers.find(c => c.id === S.filter).status === 'online' ? 'acc' : 'bad')
  const searchHTML = `
    <div class="search ${S.kb === 'search' ? 'focus' : ''}" id="search">
      ${ic('search')}
      <div class="field" role="searchbox" tabindex="0" aria-label="Search threads" id="searchField">
        ${S.query ? `<span>${esc(S.query)}</span>` : (S.kb === 'search' ? '' : '<span class="ph">Search threads</span>')}<i class="caret"></i>
        ${!S.query && S.kb === 'search' ? '<span class="ph">Search threads</span>' : ''}
      </div>
      ${S.query ? `<button class="clear press" id="clearSearch" aria-label="Clear search">${ic('x')}</button>` : ''}
    </div>`
  let html = `
    <div class="page-head"><h1 class="page-title">Threads</h1>
      <button class="fab glass press" id="newBtn" aria-label="New thread">${ic('plus', 'lg')}</button></div>
    <div class="controls">
      <button class="selector press" id="compSel" aria-haspopup="menu" aria-label="Show threads from: ${esc(fName)}"><span class="light ${fLight}"></span><span class="lbl">${esc(fName)}</span>${ic('chevD', 'sm')}</button>
      <div class="summary" aria-label="${workN} working, ${needN} need you">
        <span><i class="light acc ${workN ? 'breathe' : 'off'}"></i><b>${workN}</b> working</span>
        <span><i class="light ${needN ? 'warn' : 'off'}"></i><b>${needN}</b> ${needN === 1 ? 'needs' : 'need'} you</span>
      </div>
    </div>
    ${searchHTML}
    ${showDesk && !g.q ? `<div class="note" role="status">${ic('computer')}<p>${S.desktopTry === 'failed' ? '<b>Still can’t reach DESKTOP-8NPFSBM.</b> Check that Sotto is open on it.' : '<b>Can’t reach DESKTOP-8NPFSBM.</b> Showing its last shared threads.'}</p>
      <button class="btn soft press" id="retryDesk" ${S.desktopTry === 'trying' ? 'disabled' : ''}>${S.desktopTry === 'trying' ? '<i class="spin"></i>Trying' : 'Try again'}</button></div>` : ''}`
  if (!g.list.length) html += `<p class="empty">${g.q ? `No threads match “${esc(S.query)}”.` : 'No threads here yet. Tap New thread to start one.'}</p>`
  if (g.needs.length) html += `<h2 class="sec"><span class="light warn"></span>Needs you <span class="count">${g.needs.length}</span></h2><div class="stack">${g.needs.map(needCard).join('')}</div>`
  if (g.working.length) html += `<h2 class="sec"><span class="light acc"></span>Working now <span class="count">${g.working.length}</span></h2><div class="stack">${g.working.map(t => workingCard(t, t.id === arriveId)).join('')}</div>`
  if (g.recent.length) html += `<h2 class="sec">Recent <span class="count">${g.recent.length}</span></h2><div class="list">${g.recent.map(row).join('')}</div>`
  if (g.settled.length) {
    const open = S.settledOpen || !!g.q
    html += g.q ? `<h2 class="sec">Settled <span class="count">${g.settled.length}</span></h2>` :
      `<button class="settled-toggle press" id="settledToggle" aria-expanded="${open}" aria-label="${open ? 'Hide' : 'Show'} settled threads">${ic('chevR', 'sm chev')}Settled<span class="count">${g.settled.length}</span></button>`
    html += `<div class="expand ${open ? 'open' : ''}" id="settledBox"><div><div class="list">${g.settled.map(row).join('')}</div></div></div>`
  }
  $('#threadsPage').innerHTML = html
  $('#threadsWash').classList.toggle('warm', needN > 0)
  arriveId = null
  renderTabs()
}

$('#threadsPage').addEventListener('click', async e => {
  const b = e.target.closest('button, [role=searchbox]'); if (!b) return
  if (b.id === 'newBtn') return openNewThreadSheet()
  if (b.id === 'compSel') return openMenu(b, computerMenu())
  if (b.id === 'searchField') return openKb('search')
  if (b.id === 'clearSearch') { S.query = ''; renderThreads(); return }
  if (b.id === 'settledToggle') {
    S.settledOpen = !S.settledOpen
    b.setAttribute('aria-expanded', S.settledOpen); b.setAttribute('aria-label', `${S.settledOpen ? 'Hide' : 'Show'} settled threads`)
    $('#settledBox').classList.toggle('open', S.settledOpen); return
  }
  if (b.id === 'retryDesk') {
    S.desktopTry = 'trying'; renderThreads(); await wait(1600); S.desktopTry = 'failed'; renderThreads(); return
  }
  if (b.dataset.pick) {
    const [tid, oid] = b.dataset.pick.split(':'); S.picked[tid] = S.picked[tid] === oid ? null : oid
    const card = b.closest('.card')
    $$('.chip', card).forEach(c => c.setAttribute('aria-checked', c.dataset.pick === `${tid}:${S.picked[tid]}`))
    $('[data-send-inline]', card).disabled = !S.picked[tid]; return
  }
  if (b.dataset.sendInline) {
    const t = thread(b.dataset.sendInline), opt = D.question.options.find(o => o.id === S.picked[t.id])
    return resolveRequest(t, b, { busy: 'Sending', done: 'Answered', next: { state: 'working', line: `Using your answer: ${opt.label}` }, toastText: `Answer sent to ${t.title}.` })
  }
  if (b.dataset.permInline) {
    const [tid, kind] = b.dataset.permInline.split(':'); return permAction(thread(tid), kind, b)
  }
  if (b.dataset.question) return openQuestion(thread(b.dataset.question), !!b.dataset.own)
  if (b.dataset.permission) return openPermission(thread(b.dataset.permission))
  if (b.dataset.open) return openThread(b.dataset.open)
})

function permAction(t, kind, btn) {
  const map = {
    once: { busy: 'Allowing', done: 'Allowed', next: { state: 'working', line: 'Running npm ci' }, toastText: 'Allowed npm ci once.' },
    always: { busy: 'Allowing', done: 'Allowed', next: { state: 'working', line: 'Running npm ci' }, toastText: 'npm ci is now always allowed.' },
    deny: { busy: 'Denying', done: 'Denied', next: { state: 'done', line: 'You denied npm ci', ago: 'now' }, toastText: 'Denied npm ci.' },
  }
  return resolveRequest(t, btn, map[kind])
}

/* Sending → done → the card leaves Needs you and arrives where the thread now belongs */
async function resolveRequest(t, btn, { busy, done, next, toastText }, fromSheet) {
  const card = $(`[data-card="${t.id}"]`)
  if (btn) { btn.classList.add('busy'); btn.innerHTML = `<i class="spin"></i>${busy}…`; btn.closest('.card, #sheet')?.querySelectorAll('button').forEach(x => { if (x !== btn) x.disabled = true }) }
  await wait(900)
  if (btn) btn.innerHTML = `${ic('check', 'sm')}${done}`
  if (!fromSheet && card) card.classList.add('answered')
  await wait(fromSheet ? 450 : 650)
  if (fromSheet) { closeSheet(); await wait(380) }
  const live = $(`[data-card="${t.id}"]`)
  if (live && S.tab === 'threads') {
    live.classList.add('answered')
    live.style.height = live.offsetHeight + 'px'; void live.offsetHeight
    live.classList.add('leaving'); live.style.height = '0px'; live.style.marginBottom = `-${getComputedStyle(live.parentElement).rowGap}`
    await wait(reduce.matches ? 150 : 430)
  }
  Object.assign(t, next); if (next.state === 'working') t.since = now(); else t.since = null
  delete S.picked[t.id]
  arriveId = next.state === 'working' ? t.id : null
  renderThreads(); toast(toastText)
}

/* ---------- Computer menu ---------- */
function computerMenu() {
  const item = (id, name, desc, light) => `<button class="mi" role="menuitemradio" aria-checked="${S.filter === id}" data-filter="${id}">
    <span class="light ${light}"></span><span class="tx"><div class="mt">${esc(name)}</div>${desc ? `<div class="md2">${esc(desc)}</div>` : ''}</span>
    <span class="ck">${S.filter === id ? ic('check', 'sm') : ''}</span></button>`
  return item('all', 'All computers', '', 'acc') + '<div class="msep"></div>' +
    D.computers.map(c => item(c.id, c.name, c.status === 'online' ? 'Online' : 'Can’t be reached', c.status === 'online' ? 'acc' : 'bad')).join('')
}

/* ---------- Menu (popover) ---------- */
let menuHandler = null, menuAnchor = null
function openMenu(anchor, html, handler) {
  const m = $('#menu'), stageRect = phone.getBoundingClientRect(), r = anchor.getBoundingClientRect()
  m.innerHTML = html; menuHandler = handler || null; menuAnchor = anchor
  anchor.classList.add('open'); anchor.setAttribute('aria-expanded', 'true')
  m.style.width = Math.min(Math.max(r.width, 250), stageRect.width - 24) + 'px'
  m.style.left = '0px'; m.style.top = '0px'; m.classList.remove('on')
  const mh = Math.min(m.scrollHeight, stageRect.height * .7), mw = m.offsetWidth
  let left = Math.min(Math.max(r.left - stageRect.left, 12), stageRect.width - mw - 12)
  let top = r.bottom - stageRect.top + 8, origin = 'top'
  if (top + mh > stageRect.height - 24) { top = r.top - stageRect.top - mh - 8; origin = 'bottom' }
  m.style.left = left + 'px'; m.style.top = Math.max(top, 56) + 'px'
  m.style.transformOrigin = `${r.left - stageRect.left - left + r.width / 2}px ${origin}`
  $('#menuCatch').classList.add('on')
  requestAnimationFrame(() => { m.classList.add('on'); ($('.mi[aria-checked="true"]', m) || $('.mi', m))?.focus({ preventScroll: true }) })
}
function closeMenu() {
  $('#menu').classList.remove('on'); $('#menuCatch').classList.remove('on')
  if (menuAnchor) { menuAnchor.classList.remove('open'); menuAnchor.setAttribute('aria-expanded', 'false'); menuAnchor.focus?.({ preventScroll: true }) }
  menuAnchor = null
}
$('#menuCatch').addEventListener('pointerdown', e => { e.preventDefault(); closeMenu() })
$('#menu').addEventListener('click', e => {
  const b = e.target.closest('.mi'); if (!b || b.disabled) return
  if (b.dataset.filter) { S.filter = b.dataset.filter; closeMenu(); renderThreads(); return }
  if (menuHandler) { menuHandler(b.dataset.value); closeMenu() }
})

/* ---------- Keyboard (drawn) ---------- */
function renderKb() {
  const rows = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm']
  const k = c => `<button class="k" data-key="${c}" aria-label="${c}">${S.shift ? c.toUpperCase() : c}</button>`
  const ret = S.kb === 'search' ? 'search' : S.kb === 'own' ? 'done' : 'return'
  $('#kb').innerHTML = `
    <div class="kr">${[...rows[0]].map(k).join('')}</div>
    <div class="kr mid">${[...rows[1]].map(k).join('')}</div>
    <div class="kr"><button class="k fn ${S.shift ? 'on' : ''}" data-key="shift" aria-label="Shift">${ic('shift')}</button>${[...rows[2]].map(k).join('')}<button class="k fn" data-key="del" aria-label="Delete">${ic('del')}</button></div>
    <div class="kr"><button class="k fn" data-key="123" aria-label="Numbers">123</button><button class="k space" data-key=" " aria-label="Space">space</button><button class="k fn ret ${S.kb !== 'reply' ? 'go' : ''}" data-key="ret" aria-label="${ret}">${ret}</button></div>
    <div class="kb-foot" aria-hidden="true">${ic('globe', 'lg')}${ic('mic', 'lg')}</div>`
}
function openKb(mode) {
  S.kb = mode; S.shift = mode !== 'search' && !(mode === 'reply' ? S.reply : S.ownText)
  renderKb(); phone.classList.add('kb-open')
  if (mode === 'search') { kbOpenedAt = now(); renderThreads() }
  if (mode === 'reply') { setDrop(false); renderDock(); setTimeout(() => { const sc = $('#tScroll'); sc && sc.scrollTo({ top: sc.scrollHeight, behavior: reduce.matches ? 'auto' : 'smooth' }) }, 60) }
  if (mode === 'own') { renderOwn(); setTimeout(() => $('#own')?.scrollIntoView({ block: 'center', behavior: 'smooth' }), 80) }
}
let kbOpenedAt = 0
function closeKb() {
  if (!S.kb) return
  const mode = S.kb; S.kb = null; phone.classList.remove('kb-open')
  if (mode === 'search') renderThreads()
  if (mode === 'reply') renderDock()
  if (mode === 'own') renderOwn()
}
function typeKey(key) {
  const mode = S.kb; if (!mode) return
  let val = mode === 'search' ? S.query : mode === 'reply' ? S.reply : S.ownText
  if (key === 'shift') { S.shift = !S.shift; renderKb(); return }
  if (key === '123') return
  if (key === 'ret') {
    if (mode === 'reply') { if (S.reply.trim()) sendReply(); return }
    closeKb(); return
  }
  if (key === 'del') val = val.slice(0, -1)
  else { val += S.shift ? key.toUpperCase() : key; if (S.shift) { S.shift = false; renderKb() } }
  if (mode === 'search') { S.query = val; renderThreads() }
  else if (mode === 'reply') { S.reply = val; renderDock() }
  else { S.ownText = val; renderOwn(); updateQuestionSend() }
}
$('#kb').addEventListener('pointerdown', e => e.preventDefault())
$('#kb').addEventListener('click', e => { const b = e.target.closest('[data-key]'); if (b) typeKey(b.dataset.key) })

/* Tap anywhere outside the search field, or scroll, and the keyboard goes */
document.addEventListener('pointerdown', e => {
  if (!S.kb) return
  if (e.target.closest('#kb')) return
  if (S.kb === 'search' && !e.target.closest('#search')) closeKb()
  if (S.kb === 'reply' && e.target.closest('#tScroll, .back')) closeKb()
  if (S.kb === 'own' && !e.target.closest('#own') && !e.target.closest('.sfoot')) closeKb()
}, true)
const scrollCloses = () => { if (S.kb === 'search' && now() - kbOpenedAt > 350) closeKb() }
$('#threadsScroll').addEventListener('wheel', scrollCloses, { passive: true })
$('#threadsScroll').addEventListener('touchmove', scrollCloses, { passive: true })

/* Physical keys work too, for the prototype on a computer */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('#menu').classList.contains('on')) return closeMenu()
    if (S.drop) return setDrop(false)
    if (S.kb) return closeKb()
    if (phone.classList.contains('sheet-open')) return closeSheet()
    if (S.open) return closeThread()
    return
  }
  /* Prototype only: left and right arrows cycle the thread versions, unless something is being typed */
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && S.open && !S.kb && !e.metaKey && !e.ctrlKey && !e.altKey && !e.shiftKey
    && !document.activeElement?.closest?.('input, textarea, [contenteditable], [role=textbox], [role=searchbox]')) {
    e.preventDefault(); setVersion(VERSIONS[(VERSIONS.indexOf(S.tv) + (e.key === 'ArrowRight' ? 1 : 2)) % 3]); return
  }
  if (!S.kb || e.metaKey || e.ctrlKey || e.altKey) return
  if (e.key === 'Backspace') { e.preventDefault(); typeKey('del') }
  else if (e.key === 'Enter') { e.preventDefault(); typeKey('ret') }
  else if (e.key.length === 1) { e.preventDefault(); const wasShift = S.shift; S.shift = false; typeKey(e.key); if (wasShift) renderKb() }
})

/* ---------- Thread ---------- */
/* The open thread's history in time order: messages and the steps between them. Indexes point into D.messages and
   D.activity; the last step is still running. Other threads reuse this content, as before. */
const TIMELINE = [{ msg: 0 }, { steps: [0, 1] }, { msg: 1 }, { msg: 2 }, { steps: [2, 3, 4] }, { msg: 3 }, { running: 5 }]
const STEP_SINCE = now() - 41 * 1000
const VERSIONS = ['A', 'B', 'C']
S.tv = (() => { const v = (new URLSearchParams(location.search).get('thread') || 'B').toUpperCase(); return VERSIONS.includes(v) ? v : 'B' })()
S.fold = {}      // fold or chip key -> open
S.drop = false   // A's details panel or C's steps drawer
const KIND_ICON = { command: 'terminal', 'file-change': 'pencil', tool: 'file', reasoning: 'spark', plan: 'file' }
const baseName = p => p.split(/[\\/]/).pop()
const sinceHTML = since => `<span class="elapsed" data-since="${since}">${fmt((now() - since) / 1000)}</span>`

function msgsFor(t) {
  if (!S.msgs[t.id]) S.msgs[t.id] = t.fresh ? [] : D.messages.map(m => ({ ...m }))
  return S.msgs[t.id]
}
/** What the thread is doing right now, if anything: the running step, a stop, or an error. */
function liveFor(t) {
  if (S.stopped[t.id]) return { cls: 'stopped', h: 'Stopped', d: 'Send a message to continue.' }
  if (S.live[t.id]) return S.live[t.id]
  if (t.state === 'working') {
    if (t.id === 't3') { const a = D.activity[TIMELINE.at(-1).running]; return { cls: '', h: 'Running npm test…', verb: a.title, d: a.subject, step: a, since: STEP_SINCE } }
    return { cls: '', h: t.line, d: '', since: t.since }
  }
  if (t.state === 'failed') return { cls: 'failed', h: t.line, d: 'Reply to try again.' }
  return null
}
function stateWord(t) {
  if (S.stopped[t.id]) return ['', 'Stopped', 'off']
  return { 'working': ['working', 'Working', 'acc breathe'], 'failed': ['failed', 'Stopped', 'bad'], 'needs-you': ['', 'Needs you', 'warn'], 'settled': ['', 'Settled', 'off'] }[t.state] || ['', 'Finished', 'off']
}
/** Messages and finished step runs, in time order. A fresh thread has only its own messages. */
function itemsFor(t) {
  const msgs = msgsFor(t)
  if (t.fresh) return msgs.map(m => ({ m }))
  const out = TIMELINE.filter(x => !('running' in x)).map(x => 'msg' in x ? { m: msgs[x.msg] } : { steps: x.steps.map(i => D.activity[i]), g: x.steps.join('') })
  msgs.slice(4).forEach(m => out.push({ m }))
  return out
}
function stepCount(t) {
  const l = liveFor(t)
  return itemsFor(t).reduce((n, x) => n + (x.steps ? x.steps.length : 0), 0) + (l && l.step ? 1 : 0)
}
const washCls = t => t.state === 'failed' ? 'failed' : t.state === 'working' ? '' : 'quiet'

/* One step: icon, verb, subject in monospace (a file's name, or the whole command), and its duration or line counts */
function stepHTML(a) {
  const isPath = a.kind === 'file-change' || a.kind === 'tool'
  const subj = a.subject ? (isPath ? baseName(a.subject) : a.subject) : ''
  const meta = a.added != null ? `<b class="plus">+${a.added}</b><b class="minus">−${a.removed}</b>` : a.kind === 'command' && a.duration ? esc(a.duration) : ''
  return `<li class="step k-${a.kind}"><span class="si" aria-hidden="true">${ic(KIND_ICON[a.kind] || 'file', 'sm')}</span><span class="sv">${esc(a.title)}</span>${subj ? `<code class="ss" title="${esc(a.subject)}">${esc(subj)}</code>` : ''}${meta ? `<span class="sm">${meta}</span>` : ''}</li>`
}
function liveStepHTML(live) {
  if (live.cls === 'stopped') return `<li class="step halt"><span class="si" aria-hidden="true"><i class="mini-sq"></i></span><span class="sv">Stopped by you</span></li>`
  if (live.cls === 'failed') return `<li class="step bad"><span class="si" aria-hidden="true">${ic('x', 'sm')}</span><span class="sv">${esc(live.h)}</span></li>`
  return `<li class="step running" role="status"><span class="si" aria-hidden="true"><i class="mini-spin"></i></span><span class="sv">${esc(live.step ? live.verb : live.h)}</span>${live.step ? `<code class="ss" title="${esc(live.d)}">${esc(live.d)}</code>` : ''}${live.since ? `<span class="sm">${sinceHTML(live.since)}</span>` : ''}</li>`
}
function summarize(steps) {
  const c = k => steps.filter(a => a.kind === k).length
  const parts = []
  if (c('reasoning')) parts.push('thought')
  const r = c('tool'); if (r) parts.push(`read ${r} ${r === 1 ? 'file' : 'files'}`)
  const e = c('file-change'); if (e) parts.push(`edited ${e} ${e === 1 ? 'file' : 'files'}`)
  const n = c('command'); if (n) parts.push(`ran ${n} ${n === 1 ? 'command' : 'commands'}`)
  return { text: parts.join(', ').replace(/^./, ch => ch.toUpperCase()),
    add: steps.reduce((s, a) => s + (a.added || 0), 0), rem: steps.reduce((s, a) => s + (a.removed || 0), 0) }
}

/* ---- Header ---- */
function pillHTML(t) {
  const [pcls, pword, plight] = stateWord(t)
  return `<span class="state-pill ${pcls}"><i class="light ${plight}"></i><span class="word">${pword}</span>${t.since && !S.stopped[t.id] ? elapsed(t) : ''}</span>`
}
function headHTML(t) {
  const back = `<button class="back press" aria-label="Back to threads">${ic('chevL', 'lg')}</button>`
  if (S.tv === 'A') return `<div class="bar">${back}
    <button class="ttl press" id="ttlBtn" aria-expanded="${S.drop}" aria-controls="tDrop" data-label="${esc(t.title)}" aria-label="${esc(t.title)}. ${S.drop ? 'Hide' : 'Show'} thread details">
      <span class="tt">${esc(t.title)}</span>${ic('chevD', 'sm chev')}</button>${pillHTML(t)}</div>`
  if (S.tv === 'B') return `<div class="bar">${back}<span class="mini" aria-hidden="true">${esc(t.title)}</span>${pillHTML(t)}</div>`
  return `<div class="bar">${back}<h1 class="ttl"><span class="tt">${esc(t.title)}</span></h1>${pillHTML(t)}</div>${stripHTML(t)}`
}
/* C: the current step, live, and how many steps the thread has taken. Opens the drawer. */
function stripHTML(t) {
  const live = liveFor(t), n = stepCount(t)
  if (!n && !live) return ''
  let cls = 'idle', icon = ic('check', 'sm'), text = 'Finished', said = 'Finished', tail = ''
  if (live && !live.cls) { cls = ''; icon = '<i class="mini-spin"></i>'; text = `<span class="sheen">${esc(live.h)}</span>`; said = live.h; tail = live.since ? sinceHTML(live.since) : '' }
  else if (live && live.cls === 'failed') { cls = 'bad'; icon = ic('x', 'sm'); text = esc(live.h); said = live.h }
  else if (live && live.cls === 'stopped') { icon = '<i class="mini-sq"></i>'; text = said = 'Stopped by you' }
  const label = `${said.replace(/…$/, '')}. ${n} ${n === 1 ? 'step' : 'steps'}.`
  return `<div class="strip-x"><div><button class="strip press ${cls}" id="stripBtn" aria-expanded="${S.drop}" aria-controls="tDrop" data-label="${esc(label)}" aria-label="${esc(label)} ${S.drop ? 'Hide' : 'Show'} every step and the branch">
    <span class="sic" aria-hidden="true">${icon}</span><span class="stx">${text}</span>${tail}<span class="scount">${n} ${n === 1 ? 'step' : 'steps'}${ic('chevD', 'sm chev')}</span>
    ${cls === '' ? '<span class="runner" aria-hidden="true"></span>' : ''}</button></div></div>`
}

/* ---- Details panel (A) and steps drawer (C) ---- */
function whoHTML(t) {
  return `<div class="dd-who"><span class="mark" aria-hidden="true">${esc(provName(t.provider)[0])}</span><span class="tx"><b>${esc(provName(t.provider))} on ${esc(compName(t.computer))}</b><span>${esc(t.project)}</span></span></div>`
}
function branchHTML(t) {
  const g = D.git, rich = t.id === 't3'
  if (!t.branch) return `<div class="dd-row"><span class="ib">${ic('folder', 'sm')}</span><span class="v">Works in the project’s own folder<small>No branch of its own</small></span></div>`

/* ---- Conversation ---- */
function msgHTML(t, m, showWho, extra = '') {

    (m.pending || m.sent ? `<div class="msg-state">${m.pending ? '<i class="spin" style="width:11px;height:11px;border-width:1.5px"></i>Sending…' : ic('check', 'sm') + 'Sent'}</div>` : '')
  const md = D.markdown(m.text).replace(/<pre data-lang="([^"]*)">([\s\S]*?)<\/pre>/g, (_, lang, code) =>

  return `<div class="msg bot">${showWho ? `<div class="who"><span class="mark">${esc(provName(t.provider)[0])}</span>${esc(provName(t.provider))}</div>` : ''}${extra}<div class="md">${md}</div></div>`

/* A: a run of steps folds into one quiet row that opens in place */
function foldHTML(t, x) {

    <button class="fold-row press" data-fold="${key}" aria-expanded="${open}" aria-controls="${key}" data-label="${esc(s.text + lines)}" aria-label="${esc(s.text + lines)}. ${open ? 'Hide' : 'Show'} the steps">
      <span class="stackic" aria-hidden="true">${kinds.map(k => `<span class="k-${k}">${ic(KIND_ICON[k] || 'file', 'sm')}</span>`).join('')}</span>
      <span class="ft">${esc(s.text)}</span>${lines ? `<span class="fm"><span aria-hidden="true">·</span><b class="plus">+${s.add}</b><b class="minus">−${s.rem}</b></span>` : ''}${ic('chevR', 'sm chev')}</button>

function chipHTML(t, x) {

}
/* B: the big title, who and where, and the branch as one chip row, all at the top of the conversation */

        : t.pr ? `<span class="gchip">${ic('pr', 'sm')}#${t.pr} merged</span>` : ''}</button>`

function renderTBody() {

  let html = v === 'B' ? `<div class="wash ${washCls(t)}"></div>${heroHTML(t)}` : ''
  html += '<div class="msgs">'
  if (!msgsFor(t).length) html += `<p class="thread-empty">This thread is open on ${esc(compName(t.computer))}. Write the first message below.</p>`
  let prevRole = null, waiting = null

    if (x.steps) {

$('#scr-thread').addEventListener('click', async e => {

  if (b.id === 'replyField') return openKb('reply')
  if (b.id === 'ttlBtn' || b.id === 'stripBtn') return setDrop(!S.drop)
  if (b.id === 'gitHint') return openMenu(b, gitInfo(), null)
  if (b.dataset.fold || b.dataset.chip) {

    return
  }
  if (b.id === 'sendBtn') return sendReply()

    b.disabled = true; b.innerHTML = '<i class="spin"></i>'; b.setAttribute('aria-label', 'Stopping')

async function sendReply() {

        <button class="btn primary wide press" data-perm="${t.id}:once" data-autofocus>${esc(p.choices[0].label)}</button>
        <button class="btn soft wide press" data-perm="${t.id}:always">${esc(p.choices[1].label)}</button>
        <button class="btn danger wide press" data-perm="${t.id}:deny">${esc(p.choices[2].label)}</button>
        <button class="btn ghost wide press" id="pLater">Not now</button>
      </div>
      <div style="height:calc(var(--safe-b))"></div>
    </div>`, { warm: true, label: 'Permission' })
}

/* ---------- New thread ---------- */
const optLists = {
  model: () => D.newThread.models.map(m => ({ value: m.id, label: m.label })),
  effort: () => D.newThread.efforts.map(x => ({ value: x, label: x })),
  permissions: () => D.newThread.permissions.map(p => ({ value: p.id, label: p.label })),
  working: () => D.newThread.workingCopy.map(w => ({ value: w.id, label: w.label, desc: w.description })),
}
const fieldNames = { model: 'Model', effort: 'Effort', permissions: 'Permissions', working: 'Working copy' }
const labelOf = (field, v) => (optLists[field]().find(o => o.value === v) || {}).label || v
function openFieldMenu(anchor, field, target, after) {
  const cur = target[field]
  const html = optLists[field]().map(o => `<button class="mi" role="menuitemradio" aria-checked="${o.value === cur}" data-value="${esc(o.value)}">
    <span class="tx"><div class="mt">${esc(o.label)}</div>${o.desc ? `<div class="md2">${esc(o.desc)}</div>` : ''}</span><span class="ck">${o.value === cur ? ic('check', 'sm') : ''}</span></button>`).join('')
  openMenu(anchor, html, v => { target[field] = v; after() })
}
function openNewThreadSheet() {
  closeKb()
  S.nt = { step: 1, computer: null, project: null, ...S.defaults }
  openSheet(`<div class="nt-head" id="ntHead"></div>
    <div class="steps" aria-hidden="true"><i></i><i></i><i></i></div><p class="step-label" id="ntLabel"></p>
    <div class="nt-pages"><div class="nt-page" id="nt1"></div><div class="nt-page right" id="nt2"></div><div class="nt-page right" id="nt3"></div></div>
    <div class="sfoot" id="ntFoot"></div>`, { tall: true, label: 'New thread' })
  renderNT()
}
function renderNT() {
  const n = S.nt
  $('#ntHead').innerHTML = n.step > 1
    ? `<button class="btn ghost press" id="ntBack" aria-label="Back to step ${n.step - 1}">${ic('chevL', 'sm')}Back</button><h2>New thread</h2><button class="btn ghost press" id="ntCancel">Cancel</button>`
    : `<button class="btn ghost press" id="ntCancel">Cancel</button><h2>New thread</h2><span style="min-width:74px"></span>`
  $$('#sheet .steps i').forEach((el, i) => el.classList.toggle('on', i < n.step))
  $('#ntLabel').textContent = ['Step 1 of 3: computer', 'Step 2 of 3: project', 'Step 3 of 3: options'][n.step - 1]
  ;[1, 2, 3].forEach(i => { const p = $(`#nt${i}`); p.classList.toggle('left', i < n.step); p.classList.toggle('right', i > n.step); p.inert = i !== n.step })
  $('#nt1').innerHTML = `<h3 class="s-title" style="margin-top:0">Where should it run?</h3><p class="s-sub">Threads run on a computer with Sotto open.</p><div style="margin-top:var(--sp-5)">` +
    D.computers.map(c => {
      const count = D.newThread.projects.filter(p => p.computer === c.id).length
      return `<button class="pick press" data-nt-computer="${c.id}" ${c.status !== 'online' ? 'disabled' : ''} aria-label="${esc(c.name)}${c.status !== 'online' ? ', can’t be reached' : ''}">
        <span class="light ${c.status === 'online' ? 'acc' : 'bad'}"></span><span class="tx"><div class="pt">${esc(c.name)}</div>
        <div class="pd">${c.status === 'online' ? `Online · ${count} ${count === 1 ? 'project' : 'projects'}` : 'Can’t be reached right now'}</div></span>${c.status === 'online' ? ic('chevR', 'chev') : ''}</button>`
    }).join('') + '</div>'
  if (n.computer) {
    $('#nt2').innerHTML = `<div class="crumbs"><button class="crumb press" data-nt-step="1" aria-label="Change computer, now ${esc(compName(n.computer))}">${ic('computer', 'sm')}<span>${esc(compName(n.computer))}</span></button></div>
      <h3 class="s-title" style="margin-top:0">Which project?</h3><p class="s-sub">The thread works in this folder.</p><div style="margin-top:var(--sp-5)">` +
      D.newThread.projects.filter(p => p.computer === n.computer).map(p => `<button class="pick press" data-nt-project="${esc(p.name)}">
        <span class="ic" style="color:var(--accent-text)">${ic('folder')}</span><span class="tx"><div class="pt">${esc(p.name)}</div><div class="pd">${esc(p.path)} · ${p.threads} threads</div></span>${ic('chevR', 'chev')}</button>`).join('') + '</div>'
  }
  if (n.project) renderNTOptions()
  const foot = $('#ntFoot')
  foot.innerHTML = n.step === 1 ? `<p class="phint" style="margin:0;min-height:44px;display:flex;align-items:center">Choose a computer to continue.</p>`
    : n.step === 2 ? `<p class="phint" style="margin:0;min-height:44px;display:flex;align-items:center">Choose a project to continue.</p>`
    : `<button class="btn primary wide press" id="ntOpen">Open thread on ${esc(compName(n.computer))}</button>`
}
function renderNTOptions() {
  const n = S.nt
  $('#nt3').innerHTML = `<div class="crumbs">
      <button class="crumb press" data-nt-step="1" aria-label="Change computer, now ${esc(compName(n.computer))}">${ic('computer', 'sm')}<span>${esc(compName(n.computer))}</span></button>
      <button class="crumb press" data-nt-step="2" aria-label="Change project, now ${esc(n.project)}">${ic('folder', 'sm')}<span>${esc(n.project)}</span></button></div>
    <h3 class="s-title" style="margin-top:0">How should it work?</h3><p class="s-sub">These start from your new thread defaults.</p><div style="margin-top:var(--sp-5)">` +
    ['model', 'effort', 'permissions', 'working'].map(f => `<button class="fieldbox press" data-nt-field="${f}" aria-haspopup="menu" aria-label="${fieldNames[f]}: ${esc(labelOf(f, n[f]))}. Change">
      <span class="tx"><div class="fl">${fieldNames[f]}</div><div class="fv">${esc(labelOf(f, n[f]))}</div></span>${ic('updown', 'ud')}</button>`).join('') + '</div>' +
    (n.permissions === 'full' ? `<p class="phint">Full access runs commands without asking. You can still stop the thread from here.</p>` : '')
}
async function openNewThread(b) {
  const n = S.nt
  b.classList.add('busy', 'opening'); b.innerHTML = '<i class="spin"></i>Opening…'
  $$('#ntHead button').forEach(x => x.disabled = true)
  await wait(1300)
  const model = D.newThread.models.find(m => m.id === n.model)
  const t = { id: 'n' + now(), title: 'New thread', provider: model.provider, computer: n.computer, project: n.project, state: 'done', ago: 'now', line: 'Waiting for your first message', fresh: true, since: null,
    branch: n.working === 'worktree' ? 'sotto/k3x9' : null }
  S.threads.unshift(t); renderThreads()
  closeSheet(); await wait(300)
  openThread(t.id); toast(`Opened on ${compName(n.computer)}.`)
  setTimeout(() => openKb('reply'), 560)
}

/* ---------- Settings ---------- */
const sizes = [0.9, 1, 1.1, 1.2, 1.32]
function renderSettings() {
  const app = resolvedAppearance()
  const seg = (name, opts, cur, key) => `<div class="seg" role="radiogroup" aria-label="${name}"><i class="knob"></i>${opts.map(o => `<button role="radio" aria-checked="${o === cur}" data-${key}="${o}">${o}</button>`).join('')}</div>`
  $('#settingsPage').innerHTML = `
    <div class="page-head"><h1 class="page-title">Settings</h1></div>
    <p class="page-sub">These are kept on this iPhone. They don’t change any computer’s settings.</p>

    <section class="group"><h2>Look</h2>
      <div class="panel">
        <div class="prow"><span class="plabel">Appearance</span><span class="pvalue">${S.appearance === 'System' ? `Following the iPhone: ${app}` : ''}</span></div>
        ${seg('Appearance', D.settings.appearance, S.appearance, 'appearance')}
      </div>
      <div class="panel">
        <div class="prow"><span class="plabel">Theme</span><span class="pvalue">${esc(D.THEMES[S.theme].label)}, ${app}</span></div>
        <div class="themes" role="radiogroup" aria-label="Theme">
          ${Object.entries(D.THEMES).map(([id, th]) => { const r = th[app]; return `<button class="theme press" role="radio" aria-checked="${S.theme === id}" data-theme="${id}" aria-label="${th.label} theme"
            style="--tc:${r.canvas};--ta:${r.accent};--ti:${r.ink};--tm:${r.muted};--tb:${r.bubble}">
            <span class="room"><i class="l1"></i><i class="l2"></i><i class="bb"></i><i class="dot"></i></span>
            <span class="name">${th.label}${ic('check', 'sm')}</span></button>` }).join('')}
        </div>
        <p class="phint">The theme colours the light at the top of each screen, what’s working and what you can tap.</p>
      </div>
      <div class="panel">
        <div class="prow"><span class="plabel">Text size</span><span class="pvalue">${D.settings.textSizes[S.textSize]}</span></div>
        <div class="sizes" role="radiogroup" aria-label="Text size">
          ${D.settings.textSizes.map((l, i) => `<button class="size press" role="radio" aria-checked="${S.textSize === i}" data-size="${i}" aria-label="${l}"><span style="font-size:${13 + i * 3}px">A</span></button>`).join('')}
        </div>
        <div class="preview" aria-hidden="true"><div class="t">Pick the drawer shortcut</div><div class="l">Asks: which shortcut should open the terminal drawer?</div></div>
      </div>
      <div class="panel">
        <div class="prow"><span class="plabel">Message density</span></div>
        ${seg('Message density', D.settings.density, S.density, 'density')}
        <p class="phint">${S.density === 'Compact' ? 'Tighter spacing fits more of a thread on screen.' : 'Room between messages, lists and steps.'}</p>
      </div>
    </section>

    <section class="group"><h2>Notifications</h2>
      <div class="panel" style="padding-top:var(--sp-1);padding-bottom:var(--sp-1)">
        ${S.notifications.map(n => `<button class="toggle-row" role="switch" aria-checked="${n.on}" data-notif="${n.id}">
          <span class="tx"><div class="plabel">${esc(n.label)}</div>${n.description ? `<div class="d">${esc(n.description)}</div>` : ''}</span><span class="sw" aria-hidden="true"></span></button>`).join('')}
      </div>
      <p class="note-line">${esc(D.settings.notificationNote)}</p>
    </section>

    <section class="group"><h2>New thread defaults</h2>
      <div class="panel" style="padding-top:var(--sp-1);padding-bottom:var(--sp-1)">
        ${['model', 'effort', 'permissions', 'working'].map(f => `<button class="def-row press" data-def="${f}" aria-haspopup="menu" aria-label="${fieldNames[f]}: ${esc(labelOf(f, S.defaults[f]))}. Change">
          <span class="k1">${fieldNames[f]}</span><span class="v1">${esc(labelOf(f, S.defaults[f]))}</span>${ic('updown', 'sm')}</button>`).join('')}
      </div>
      <p class="note-line">A computer that can’t let this iPhone grant permission starts every thread by asking.</p>
    </section>

    <section class="group"><h2>About</h2>
      <div class="panel about"><span class="logo" aria-hidden="true">S</span><span><div class="plabel">Sotto 0.1.28</div><div class="pvalue">Connected to 2 of 3 computers</div></span></div>
    </section>`
  $$('#settingsPage .seg').forEach(placeKnob)
}
$('#settingsPage').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return
  if (b.dataset.appearance) { S.appearance = b.dataset.appearance; paint(); renderSettings(); return }
  if (b.dataset.theme) { S.theme = b.dataset.theme; paint(); renderSettings(); toast(`${D.THEMES[S.theme].label} theme on.`); return }
  if (b.dataset.size) { S.textSize = +b.dataset.size; document.documentElement.style.setProperty('--ts', sizes[S.textSize]); renderSettings(); return }
  if (b.dataset.density) { S.density = b.dataset.density; document.documentElement.style.setProperty('--dens', S.density === 'Compact' ? .62 : 1); renderSettings(); return }
  if (b.dataset.notif) { const n = S.notifications.find(x => x.id === b.dataset.notif); n.on = !n.on; b.setAttribute('aria-checked', n.on); return }
  if (b.dataset.def) return openFieldMenu(b, b.dataset.def, S.defaults, () => { renderSettings(); toast('New thread defaults saved.') })
})

/* ---------- Computers ---------- */
function renderComputers() {
  $('#computersPage').innerHTML = `
    <div class="page-head"><h1 class="page-title">Computers</h1></div>
    <p class="page-sub">Each computer runs Sotto and shares its threads with this iPhone.</p>
    <div class="stack" style="margin-top:var(--sp-6)">
    ${D.computers.map(c => {
      const projects = new Set([...D.newThread.projects.filter(p => p.computer === c.id).map(p => p.name), ...S.threads.filter(t => t.computer === c.id).map(t => t.project)])
      const nThreads = S.threads.filter(t => t.computer === c.id).length
      const up = c.status === 'online'
      return `<article class="pc ${up ? 'online' : 'down'}">
        <div class="pc-h"><span class="ic">${ic('computer')}</span><span class="tx"><div class="n">${esc(c.name)}</div>
          <div class="s"><i class="light ${up ? 'acc' : 'bad'}"></i>${up ? 'Online' : 'Can’t be reached'}</div></span></div>
        <div class="facts">
          <div class="fact"><b>${c.canAnswer ? 'Can answer' : 'Can’t answer'}</b><span>${c.canAnswer ? 'Questions and permissions' : 'Answer on the computer'}</span></div>
          <div class="fact"><b class="num">${projects.size} ${projects.size === 1 ? 'project' : 'projects'}</b><span>${nThreads} ${nThreads === 1 ? 'thread' : 'threads'}</span></div>
        </div>
        <div class="pc-actions">
          <button class="btn soft press" data-show="${c.id}">Show its threads</button>
          ${up ? '' : `<button class="btn ghost press" data-retry="${c.id}" ${S.desktopTry === 'trying' ? 'disabled' : ''}>${S.desktopTry === 'trying' ? '<i class="spin"></i>Trying' : `${ic('retry', 'sm')}Try again`}</button>`}
        </div>
        ${!up && S.desktopTry === 'failed' ? '<p class="phint">Still can’t reach it. Check that Sotto is open on DESKTOP-8NPFSBM and that it’s on the same network.</p>' : ''}
      </article>`
    }).join('')}</div>`
}
$('#computersPage').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return
  if (b.dataset.show) { S.filter = b.dataset.show; renderThreads(); setTab('threads'); $('#threadsScroll').scrollTop = 0; return }
  if (b.dataset.retry) { S.desktopTry = 'trying'; renderComputers(); await wait(1600); S.desktopTry = 'failed'; renderComputers(); renderThreads() }
})

addEventListener('resize', () => { $$('.seg').forEach(placeKnob) })
document.addEventListener('touchstart', () => {}, { passive: true })
renderThreads(); renderTabs()
</script>
</body>
</html>
