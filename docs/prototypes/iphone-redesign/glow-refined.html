<!doctype html>
<!--
  PROTOTYPE, throwaway. Glow, refined (Zach picked Glow from the five variants; this copy refines it page by page).
  Refinements over v2-glow.html:
  - Threads, Computers and Settings scroll as one page, like Soft: the heading, the + button, the computer picker,
    the summary, search and the wash all move up with the list; content fades out under the status bar.
  - The thread page: Zach chose version B (title scrolls away, steps inline) on 2026-10-04. A and C stay behind ?thread=A|C for the record; the prototype-only
    pill in the status bar, or the left and right arrow keys. None has a Messages/Activity switch; the agent's steps
    sit in the conversation in time order. A · Folded steps, B · Title scrolls away, C · Live strip.
  What Glow was:
  Light is status. Every screen has a soft wash at the top, mixed from the chosen theme's accent into the canvas, so the
  theme colours the whole room rather than sitting in buttons. A thread that is working breathes with a slow accent halo,
  a thread that needs the user carries a warm glow (and warms the Threads wash while anything waits), and a thread that
  stopped with an error has a faint danger edge. Bars that float over content (tab bar, thread header, reply box, menus)
  are frosted glass with a hairline highlight, echoing the desktop's frosted window. The reply box glows while it is
  focused. Glows stay low and slow: depth and hierarchy, never neon.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTOTYPE · iPhone redesign · Glow, refined</title>
<script src="data.js"></script>
<style>
@font-face { font-family: Figtree; src: url(../../../src/renderer/src/assets/fonts/figtree-latin.woff2) format("woff2"); font-weight: 300 900; }

/* ---------- Scales ---------- */
:root {
  --ts: 1;          /* text size step */
  --dens: 1;        /* message density */
  --fs-cap: calc(12px * var(--ts));
  --fs-sm: calc(13.5px * var(--ts));
  --fs-body: calc(15.5px * var(--ts));
  --fs-lead: calc(17px * var(--ts));
  --fs-title: calc(21px * var(--ts));
  --fs-display: calc(28px * var(--ts));
  --lh-tight: 1.22;
  --lh: 1.45;

  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-7: 32px; --sp-8: 44px;
  --gutter: var(--sp-5);
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px;

  --sb-h: calc(50px + env(safe-area-inset-top));
  --safe-b: max(env(safe-area-inset-bottom), 18px);
  --kb-h: 296px;
  --tab-h: 62px;

  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.32, .72, 0, 1);
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;

  /* Derived from theme roles only */
  --accent-text: color-mix(in oklab, var(--accent) 84%, var(--ink));
  --warn-text: color-mix(in oklab, var(--warning) 62%, var(--ink));
  --danger-text: color-mix(in oklab, var(--danger) 78%, var(--ink));
  --glass: color-mix(in oklch, var(--surface) 58%, transparent);
  --glass-strong: color-mix(in oklch, var(--overlay) 76%, transparent);
  --hairline: color-mix(in oklch, var(--ink) 10%, transparent);
  --hl: color-mix(in oklch, var(--ink) 10%, transparent);
  --wash-a: color-mix(in oklch, var(--accent) 34%, transparent);
  --wash-b: color-mix(in oklch, var(--accent) 16%, transparent);
  --wash-w: color-mix(in oklch, var(--warning) 22%, transparent);
  --fill-soft: color-mix(in oklch, var(--ink) 7%, transparent);
  --fill-softer: color-mix(in oklch, var(--ink) 4.5%, transparent);
  --shadow-far: 0 24px 60px -20px rgba(0, 0, 0, .6);
}
[data-appearance="light"] {
  --warn-text: color-mix(in oklab, var(--warning) 48%, var(--ink));
  --danger-text: color-mix(in oklab, var(--danger) 70%, var(--ink));
  --accent-text: color-mix(in oklab, var(--accent) 78%, var(--ink));
  --glass: color-mix(in oklch, var(--surface) 68%, transparent);
  --glass-strong: color-mix(in oklch, var(--surface) 80%, transparent);
  --hl: color-mix(in oklch, var(--surface) 95%, transparent);
  --wash-a: color-mix(in oklch, var(--accent) 22%, transparent);
  --wash-b: color-mix(in oklch, var(--accent) 11%, transparent);
  --wash-w: color-mix(in oklch, var(--warning) 20%, transparent);
  --shadow-far: 0 24px 50px -22px rgba(0, 0, 0, .28);
}

/* ---------- Base ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); }
body { font-family: Figtree, -apple-system, system-ui, sans-serif; color: var(--ink); font-size: var(--fs-body); line-height: var(--lh);
  -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 0; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 12px; }
h1, h2, h3, h4, p { margin: 0; }
code, pre { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 16px; height: 16px; }
svg.i.lg { width: 24px; height: 24px; }

#phone { position: fixed; inset: 0; overflow: hidden; overflow: clip; background: rgb(0 0 0); }
#stage { position: absolute; inset: 0; overflow: hidden; overflow: clip; background: var(--canvas); transform-origin: 50% 100%;
  transition: transform .5s var(--spring), border-radius .5s var(--spring); }
.sheet-open #stage { transform: scale(.94) translateY(6px); border-radius: 26px; }

/* ---------- Status bar ---------- */
.statusbar { position: absolute; z-index: 60; top: 0; left: 0; right: 0; height: var(--sb-h); padding: env(safe-area-inset-top) 28px 0 34px;
  display: flex; align-items: center; justify-content: space-between; pointer-events: none; font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
.statusbar .right { display: flex; gap: 6px; align-items: center; }
.statusbar svg { fill: currentColor; stroke: none; }

/* ---------- Wash: the theme colours the room ---------- */
.wash { position: absolute; z-index: 0; left: -10%; right: -10%; top: 0; height: 520px; pointer-events: none; overflow: hidden; }
.wash::before, .wash::after { content: ""; position: absolute; inset: 0; }
.wash::before {
  background:
    radial-gradient(60% 52% at 18% 0%, var(--wash-a), transparent 72%),
    radial-gradient(48% 44% at 88% 6%, var(--wash-b), transparent 72%);
  animation: drift 26s ease-in-out infinite alternate;
}
.wash::after { background: radial-gradient(46% 40% at 86% 2%, var(--wash-w), transparent 70%); opacity: 0; transition: opacity 1.6s ease; }
.wash.warm::after { opacity: 1; animation: drift 31s ease-in-out infinite alternate-reverse; }
.wash.short { height: 330px; }
.wash.quiet { --wash-a: color-mix(in oklch, var(--accent) 16%, transparent); --wash-b: color-mix(in oklch, var(--accent) 8%, transparent); }
.wash.failed { --wash-a: color-mix(in oklch, var(--danger) 16%, transparent); --wash-b: color-mix(in oklch, var(--accent) 8%, transparent); }
@keyframes drift { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(-3%, 2%, 0) scale(1.07); } }

/* ---------- Glass ---------- */
.glass { background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.7); backdrop-filter: blur(22px) saturate(1.7);
  box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px var(--hairline); }

/* ---------- Screens ---------- */
.screen { position: absolute; inset: 0; overflow: hidden; overflow: clip; background: var(--canvas); }
.tab-root::after { content: ""; position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; height: calc(var(--tab-h) + var(--safe-b) + 36px); pointer-events: none;
  background: linear-gradient(to bottom, transparent, color-mix(in oklch, var(--canvas) 88%, transparent) 55%); }
.tab-root { opacity: 0; visibility: hidden; transform: scale(.985); transition: opacity .28s ease, transform .36s var(--ease), visibility 0s .36s; }
.tab-root.on { opacity: 1; visibility: visible; transform: none; transition: opacity .28s ease, transform .36s var(--ease), visibility 0s; }
.tab-root.under { transform: translateX(-24%); transition: transform .46s var(--spring); }
.tab-root .dim { position: absolute; inset: 0; z-index: 30; background: rgba(0, 0, 0, .32); opacity: 0; pointer-events: none; transition: opacity .46s var(--spring); }
.tab-root.under .dim { opacity: 1; }
#scr-thread { z-index: 20; transform: translateX(102%); visibility: hidden; box-shadow: -18px 0 40px -18px rgba(0, 0, 0, .55);
  transition: transform .46s var(--spring), visibility 0s .46s; }
#scr-thread.in { transform: none; visibility: visible; transition: transform .46s var(--spring), visibility 0s; }
.scroll { position: absolute; inset: 0; z-index: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
/* A tab page is one scrolling sheet: the wash, the heading and its controls all move up with the list. The page clips
   the wash sideways so the drift never widens the scroll. */
.page { padding: var(--sb-h) var(--gutter) calc(var(--tab-h) + var(--safe-b) + var(--sp-8)); position: relative; isolation: isolate; overflow-x: clip; }
.page > .wash { z-index: -1; }

/* Content fades out under the status bar once the page moves, so text never meets the clock. At rest it is clear
   and the wash reaches the top edge. */
.sb-fade { position: absolute; z-index: 8; top: 0; left: 0; right: 0; height: calc(var(--sb-h) + 10px); pointer-events: none;
  background: linear-gradient(var(--canvas) 62%, color-mix(in oklch, var(--canvas) 0%, transparent)); opacity: var(--sbf, 0); }

.page-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); min-height: 52px; margin-top: 0; }
.page-title { font-size: var(--fs-display); font-weight: 720; letter-spacing: -.025em; line-height: 1.1; }
.page-sub { color: var(--muted); font-size: var(--fs-sm); margin-top: var(--sp-1); }

.fab { position: relative; flex: none; margin-right: calc(var(--sp-1) * -1); width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; color: var(--accent-text);
  box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px color-mix(in oklch, var(--accent) 28%, transparent), 0 8px 26px -8px color-mix(in oklch, var(--accent) 55%, transparent); }

/* ---------- Press feedback ---------- */
.press { transition: transform .16s var(--ease), background-color .2s ease, box-shadow .3s ease, opacity .2s ease; }
.press:active:not(:disabled) { transform: scale(.972); }

/* ---------- Buttons ---------- */
.btn { min-height: 44px; padding: 0 var(--sp-4); border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  font-weight: 640; font-size: var(--fs-body); white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-ink);
  box-shadow: inset 0 1px 0 color-mix(in oklch, var(--accent-ink) 14%, transparent), 0 8px 22px -10px color-mix(in oklch, var(--accent) 80%, transparent); }
.btn.soft { background: var(--fill-soft); color: var(--ink); }
.btn.ghost { color: var(--accent-text); }
.btn.warn { background: color-mix(in oklab, var(--warning) 88%, var(--canvas)); color: var(--accent-ink); }
.btn.danger { background: color-mix(in oklch, var(--danger) 13%, transparent); color: var(--danger-text); }
.btn:disabled { opacity: .42; box-shadow: none; }
.btn.wide { width: 100%; }
.btn.busy { pointer-events: none; }
.btn .spin { width: 15px; height: 15px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Lights ---------- */
.light { width: 8px; height: 8px; border-radius: 50%; flex: none; background: currentColor;
  box-shadow: 0 0 0 3px color-mix(in oklch, currentColor 18%, transparent), 0 0 12px color-mix(in oklch, currentColor 70%, transparent); }
.light.acc { color: var(--accent); }
.light.warn { color: var(--warning); }
.light.bad { color: var(--danger); }
.light.off { color: var(--muted); background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }
.light.breathe { animation: breathe 2.6s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: .55; transform: scale(.88); } 50% { opacity: 1; transform: scale(1); } }

/* ---------- Threads home ---------- */
.controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-2) var(--sp-3); margin-top: var(--sp-3); }
.selector { min-height: 44px; padding: 0 var(--sp-3) 0 var(--sp-3); border-radius: 999px; display: inline-flex; align-items: center; gap: var(--sp-2);
  font-weight: 620; font-size: var(--fs-sm); background: var(--fill-soft); box-shadow: inset 0 0 0 1px var(--hairline); max-width: 100%; }
.selector .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.summary { display: flex; gap: var(--sp-4); font-size: var(--fs-sm); color: var(--muted); }
.summary span { display: inline-flex; align-items: center; white-space: nowrap; }
.summary .light { margin-right: var(--sp-2); }
.summary b { color: var(--ink); font-weight: 650; margin-right: .3em; }

.search { margin-top: var(--sp-3); min-height: 46px; border-radius: 999px; display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-1) 0 var(--sp-4);
  background: color-mix(in oklch, var(--surface) 70%, transparent); box-shadow: inset 0 0 0 1px var(--hairline); color: var(--muted); transition: box-shadow .3s ease, background .3s ease; }
.search.focus { box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--accent) 60%, transparent), 0 0 0 4px color-mix(in oklch, var(--accent) 14%, transparent), 0 0 26px -6px color-mix(in oklch, var(--accent) 45%, transparent); }
.search .field { flex: 1; min-height: 46px; display: flex; align-items: center; font-size: var(--fs-body); color: var(--ink); min-width: 0; overflow: hidden; white-space: nowrap; }
.search .ph { color: var(--placeholder); }
.caret { display: none; width: 2px; height: 1.15em; background: var(--accent); margin-left: 1px; border-radius: 1px; animation: blink 1.05s steps(1) infinite; flex: none; }
.focus .caret { display: inline-block; }
@keyframes blink { 50% { opacity: 0; } }
.search .clear { width: 44px; height: 44px; display: grid; place-items: center; color: var(--muted); }

.note { margin-top: var(--sp-4); padding: var(--sp-3) var(--sp-3) var(--sp-3) var(--sp-4); border-radius: var(--r-md); display: flex; gap: var(--sp-3); align-items: center;
  background: linear-gradient(90deg, color-mix(in oklab, var(--danger) 9%, var(--surface)), var(--surface) 70%); box-shadow: inset 0 0 0 1px var(--hairline); font-size: var(--fs-sm); color: var(--muted); }
.note p { flex: 1; min-width: 0; }
.note b { color: var(--ink); font-weight: 640; }
.note .btn { min-height: 40px; padding: 0 var(--sp-3); font-size: var(--fs-sm); flex: none; }

.sec { display: flex; align-items: center; gap: var(--sp-2); margin: var(--sp-7) 0 var(--sp-3); font-size: var(--fs-sm); font-weight: 650; color: var(--ink); }
.sec .count { color: var(--muted); font-weight: 500; }
.sec + .stack { margin-top: 0; }
.stack { display: flex; flex-direction: column; gap: var(--sp-3); }

/* Cards that need you: warm glow */
.card { position: relative; isolation: isolate; display: block; width: 100%; border-radius: var(--r-lg); background: var(--surface);
  box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px var(--hairline); }
.card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; pointer-events: none; }
.card.need { background: linear-gradient(180deg, color-mix(in oklab, var(--warning) 11%, var(--surface)), var(--surface) 72%);
  box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px color-mix(in oklch, var(--warning) 30%, transparent); }
.card.need::before { box-shadow: 0 14px 44px -16px color-mix(in oklch, var(--warning) 60%, transparent); animation: glow 6s ease-in-out infinite; }
.card.need.answered { background: linear-gradient(180deg, color-mix(in oklab, var(--accent) 14%, var(--surface)), var(--surface) 72%);
  box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px color-mix(in oklch, var(--accent) 45%, transparent); transition: background .4s ease, box-shadow .4s ease; }
.card.need.answered::before { box-shadow: 0 14px 44px -14px color-mix(in oklch, var(--accent) 70%, transparent); animation: none; }
@keyframes glow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

.card-open { display: block; width: 100%; padding: var(--sp-4) var(--sp-4) var(--sp-2); border-radius: var(--r-lg) var(--r-lg) 0 0; }
.card-top { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-cap); color: var(--muted); font-weight: 600; min-height: 18px; }
.card-top .tag { color: var(--warn-text); }
.card.working .card-top .tag { color: var(--accent-text); }
.card-top .ago { margin-left: auto; font-weight: 500; }
.card-title { font-size: var(--fs-lead); font-weight: 650; line-height: var(--lh-tight); margin-top: var(--sp-2); letter-spacing: -.01em; }
.card-meta { font-size: var(--fs-sm); color: var(--muted); margin-top: var(--sp-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-ask { font-size: var(--fs-body); margin-top: var(--sp-3); line-height: 1.38; }
.card-ask code, .inline-code { font-size: .9em; padding: 2px 7px; border-radius: 7px; background: var(--code-bg); color: var(--code-ink); box-shadow: inset 0 0 0 1px var(--hairline); white-space: nowrap; }
.choices { display: flex; flex-wrap: wrap; gap: var(--sp-2); padding: var(--sp-2) var(--sp-4) 0; }
.chip { min-height: 44px; padding: 0 var(--sp-4); border-radius: 999px; font-size: var(--fs-sm); font-weight: 620; background: var(--fill-soft);
  box-shadow: inset 0 0 0 1px var(--hairline); display: inline-flex; align-items: center; gap: var(--sp-2); }
.chip[aria-checked="true"] { background: color-mix(in oklab, var(--accent) 20%, var(--surface)); color: var(--ink);
  box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 18px -4px color-mix(in oklch, var(--accent) 55%, transparent); }
.card-actions { display: flex; gap: var(--sp-2); justify-content: flex-end; padding: var(--sp-3) var(--sp-3) var(--sp-3); flex-wrap: wrap; }
.card-actions .btn { min-height: 44px; font-size: var(--fs-sm); }
.card-actions .spacer { flex: 1; }

/* Working cards: a breathing accent halo and a light that runs along the bottom edge */
.card.working { text-align: left; padding: var(--sp-4); overflow: hidden;
  background: linear-gradient(180deg, color-mix(in oklab, var(--accent) 9%, var(--surface)), var(--surface) 70%);
  box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px color-mix(in oklch, var(--accent) 26%, transparent); }
.card-wrap { position: relative; isolation: isolate; border-radius: var(--r-lg); }
.card-wrap.working::before { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; pointer-events: none;
  box-shadow: 0 12px 40px -14px color-mix(in oklch, var(--accent) 70%, transparent), 0 0 0 1px color-mix(in oklch, var(--accent) 22%, transparent);
  animation: glow 4.4s ease-in-out infinite; }
.runner { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; overflow: hidden; }
.runner::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -40%;
  background: linear-gradient(90deg, transparent, color-mix(in oklch, var(--accent) 90%, transparent), transparent); animation: run 2.8s var(--ease) infinite; }
@keyframes run { to { left: 100%; } }
.live { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-3); font-size: var(--fs-sm); min-width: 0; }
.live .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheen { background: linear-gradient(90deg, var(--muted) 0%, var(--muted) 38%, var(--ink) 50%, var(--muted) 62%, var(--muted) 100%);
  background-size: 260% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 3.2s linear infinite; }
@keyframes sheen { from { background-position: 100% 0; } to { background-position: -160% 0; } }
.elapsed { font-variant-numeric: tabular-nums; color: var(--muted); font-size: var(--fs-cap); font-weight: 550; white-space: nowrap; }

/* Recent: a quiet list on one surface */
.list { border-radius: var(--r-lg); background: color-mix(in oklch, var(--surface) 88%, transparent); box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px var(--hairline); overflow: hidden; }
.row { position: relative; display: flex; gap: var(--sp-3); align-items: flex-start; width: 100%; padding: calc(var(--sp-3) * var(--dens) + 2px) var(--sp-4); min-height: 60px; text-align: left; }
.row + .row::after { content: ""; position: absolute; top: 0; left: calc(var(--sp-4) + 20px); right: 0; height: 1px; background: var(--hairline); }
.row:active { background: var(--fill-softer); }
.row .light { margin-top: 7px; }
.row .body { flex: 1; min-width: 0; }
.row .t { display: block; font-weight: 560; font-size: var(--fs-body); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row.unread .t { font-weight: 680; }
.row .l { display: block; font-size: var(--fs-sm); color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .a { font-size: var(--fs-cap); color: var(--muted); white-space: nowrap; margin-top: 3px; }
.row.failed { background: linear-gradient(90deg, color-mix(in oklch, var(--danger) 10%, transparent), transparent 55%); }
.row.failed::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--danger); box-shadow: 0 0 14px var(--danger); opacity: .8; }
.row.failed .l { color: var(--danger-text); }

.settled-toggle { width: 100%; min-height: 52px; display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-6); padding: 0 var(--sp-1); color: var(--muted); font-size: var(--fs-sm); font-weight: 650; }
.settled-toggle .chev { transition: transform .3s var(--ease); }
.settled-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
.settled-toggle .count { margin-left: auto; font-weight: 500; }
.expand { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .38s var(--ease), opacity .3s ease; opacity: 0; }
.expand.open { grid-template-rows: 1fr; opacity: 1; }
.expand > div { overflow: hidden; }
.empty { color: var(--muted); padding: var(--sp-7) var(--sp-1); font-size: var(--fs-body); }

.leaving { overflow: hidden; transition: height .42s var(--ease), opacity .3s ease, transform .42s var(--ease), margin .42s var(--ease) !important; opacity: 0 !important; transform: scale(.96) translateX(6%) !important; }
.arrive { animation: arrive .7s var(--ease) both; }
@keyframes arrive { from { opacity: 0; transform: translateY(-10px) scale(.98); } }

/* ---------- Tab bar ---------- */
.tabbar { position: absolute; z-index: 40; left: var(--sp-4); right: var(--sp-4); bottom: var(--safe-b); height: var(--tab-h); border-radius: 999px;
  display: flex; padding: 5px; box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px var(--hairline), 0 14px 40px -12px rgba(0, 0, 0, .5);
  transition: transform .46s var(--spring), opacity .3s ease; }
.tabbar.away { transform: translateY(calc(100% + var(--safe-b) + 10px)); }
.tab { flex: 1; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative;
  font-size: calc(11.5px * min(var(--ts), 1.15)); font-weight: 620; color: var(--muted); transition: color .25s ease, background .3s ease, box-shadow .3s ease; }
.tab[aria-current="page"] { color: var(--accent-text); background: color-mix(in oklch, var(--accent) 14%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--accent) 20%, transparent), 0 0 22px -6px color-mix(in oklch, var(--accent) 50%, transparent); }
.badge { position: absolute; top: 5px; left: calc(50% + 6px); min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; font-size: 11.5px; font-weight: 700;
  display: grid; place-items: center; background: var(--warning); color: var(--accent-ink); box-shadow: 0 0 12px -2px color-mix(in oklch, var(--warning) 80%, transparent); }
[data-appearance="light"] .badge { color: var(--ink); }
.badge.pop { animation: pop .45s var(--ease); }
@keyframes pop { 40% { transform: scale(1.3); } }

.homebar { position: absolute; z-index: 90; bottom: 7px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); opacity: .55; pointer-events: none; }

/* ---------- Thread ---------- */
/* Shared by all three versions: a glass header that is one line tall, a back button and a status pill. */
.thead { position: absolute; z-index: 13; top: 0; left: 0; right: 0; padding: var(--sb-h) var(--sp-4) var(--sp-2);
  border-radius: 0 0 var(--r-lg) var(--r-lg); box-shadow: inset 0 -1px 0 var(--hairline), 0 10px 30px -18px rgba(0, 0, 0, .5); }
.thead .bar { display: flex; align-items: center; gap: var(--sp-2); min-height: 44px; }
.back { width: 44px; height: 44px; margin-left: -10px; border-radius: 50%; display: grid; place-items: center; color: var(--accent-text); flex: none; }
.ttl { flex: 1; min-width: 0; min-height: 44px; display: flex; align-items: center; gap: var(--sp-1); margin-left: calc(var(--sp-1) * -1); padding: 0 var(--sp-1); border-radius: 12px; }
.ttl .tt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; font-size: var(--fs-body); }
.ttl .chev { color: var(--muted); transition: transform .4s var(--spring); }
.ttl[aria-expanded="true"] .chev { transform: rotate(180deg); }
button.ttl:active { background: var(--fill-softer); }
.state-pill { display: inline-flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-3); min-height: 30px; border-radius: 999px; font-size: var(--fs-cap); font-weight: 620;
  background: var(--fill-soft); color: var(--muted); flex: none; white-space: nowrap; }
.state-pill.working { color: var(--accent-text); background: color-mix(in oklch, var(--accent) 13%, transparent); }
.state-pill.working .elapsed { color: var(--accent-text); }
/* A and C: while it works, the breathing light and the timer say it; the word stays for screen readers */
.thead.glass .state-pill.working .word { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.state-pill.failed { color: var(--danger-text); background: color-mix(in oklch, var(--danger) 12%, transparent); }
.plus { color: var(--accent-text); font-weight: 650; }
.minus { color: var(--danger-text); font-weight: 650; }
.seg { display: flex; padding: 3px; border-radius: 999px; background: var(--fill-soft); margin-top: var(--sp-3); position: relative; }
.seg button { flex: 1; text-align: center; min-height: 38px; border-radius: 999px; font-size: var(--fs-sm); font-weight: 620; color: var(--muted); position: relative; z-index: 1; transition: color .25s ease; }
.seg button[aria-pressed="true"], .seg button[aria-checked="true"] { color: var(--ink); }
.seg .knob { position: absolute; top: 3px; bottom: 3px; left: 3px; border-radius: 999px; background: var(--raised);
  box-shadow: inset 0 1px 0 var(--hl), 0 2px 8px -2px rgba(0, 0, 0, .35), 0 0 0 1px var(--hairline); transition: transform .38s var(--spring), width .38s var(--spring); }
[data-appearance="light"] .seg .knob { background: var(--surface); }

/* One step the agent took. The same line is dressed differently by each version's container. */
.steplist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.step { display: flex; align-items: center; gap: var(--sp-2); min-height: 34px; font-size: var(--fs-sm); color: var(--muted); min-width: 0; }
.step .si { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--fill-soft); color: var(--muted); }
.step .si svg.i.sm { width: 14px; height: 14px; }
.step.k-file-change .si { color: var(--accent-text); background: color-mix(in oklch, var(--accent) 13%, transparent); }
.step .sv { color: var(--ink); font-weight: 600; white-space: nowrap; flex: none; }
.step .ss { flex: 1; min-width: 0; font-family: var(--mono); font-size: calc(12px * var(--ts)); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step .sm { flex: none; font-size: var(--fs-cap); font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-flex; gap: 5px; margin-left: auto; }
.step.k-reasoning .sv { font-weight: 560; color: var(--muted); }
.step.running .si { color: var(--accent-text); background: color-mix(in oklch, var(--accent) 16%, transparent); }
.step.running .sv, .step.running .sm, .step.running .elapsed { color: var(--accent-text); }
.step.halt .sv { color: var(--muted); }
.step.bad .sv, .step.bad .si { color: var(--danger-text); }
.step.bad .si { background: color-mix(in oklch, var(--danger) 12%, transparent); }
.mini-spin { width: 12px; height: 12px; border-radius: 50%; border: 1.6px solid currentColor; border-right-color: transparent; animation: spin .9s linear infinite; display: block; }
.mini-sq { width: 9px; height: 9px; border-radius: 2.5px; background: currentColor; display: block; }

/* Details: provider, computer, project, branch, pull request and checks. A's title panel and C's drawer both use it. */
.tdrop { position: absolute; z-index: 12; left: var(--sp-3); right: var(--sp-3); top: calc(var(--thead-h, 100px) + var(--sp-2)); border-radius: var(--r-lg);
  padding: var(--sp-4); background: var(--glass-strong); -webkit-backdrop-filter: blur(26px) saturate(1.8); backdrop-filter: blur(26px) saturate(1.8);
  box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px var(--hairline), var(--shadow-far);
  max-height: calc(100% - var(--thead-h, 100px) - var(--dock-h, 70px) - var(--safe-b) - var(--sp-6)); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
  opacity: 0; visibility: hidden; transform: translateY(-14px) scale(.96); transform-origin: 50% 0; pointer-events: none;
  transition: opacity .2s ease, transform .46s var(--spring), visibility 0s .46s; }
.tdrop.on { opacity: 1; visibility: visible; transform: none; pointer-events: auto; transition: opacity .22s ease, transform .5s cubic-bezier(.3, 1.25, .5, 1), visibility 0s; }
.tcatch { position: absolute; z-index: 11; inset: 0; display: none; }
.tcatch.on { display: block; }
.dd-who { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; }
.mark { width: 18px; height: 18px; border-radius: 6px; display: grid; place-items: center; flex: none; background: color-mix(in oklch, var(--accent) 22%, transparent); color: var(--accent-text); font-size: 10px; font-weight: 800; }
.dd-who .mark { width: 28px; height: 28px; border-radius: 9px; font-size: 13px; }
.dd-who .tx { min-width: 0; display: flex; flex-direction: column; }
.dd-who b { font-weight: 650; font-size: var(--fs-body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd-who .tx > span { color: var(--muted); font-size: var(--fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd-sec { margin-top: var(--sp-3); padding-top: var(--sp-3); box-shadow: inset 0 1px 0 var(--hairline); }
.dd-h { font-size: var(--fs-cap); font-weight: 650; color: var(--muted); margin: 0 0 var(--sp-1); display: flex; gap: var(--sp-2); }
.dd-h .count { margin-left: auto; font-weight: 550; }
.dd-row { display: flex; align-items: center; gap: var(--sp-3); min-height: 38px; font-size: var(--fs-sm); min-width: 0; }
.dd-row .ib { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; flex: none; background: var(--fill-soft); color: var(--muted); }
.dd-row .v { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.dd-row .v small { color: var(--muted); font-size: var(--fs-cap); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd-row .mono { font-family: var(--mono); font-size: calc(12.5px * var(--ts)); word-break: break-all; line-height: 1.35; }
.dd-row .r { flex: none; color: var(--muted); font-size: var(--fs-cap); font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-flex; gap: 5px; }
.dd-later { margin-top: var(--sp-2); font-size: var(--fs-cap); color: var(--muted); }
.dd-turn { margin-top: var(--sp-3); font-size: var(--fs-cap); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd-h + .dd-turn { margin-top: 0; }
.dd-turn q { color: var(--ink); }
.tdrop .steplist { margin: var(--sp-1) 0 0; }

/* ---- A · Folded steps ---- */
.fold { align-self: flex-start; max-width: 100%; margin: calc(var(--sp-2) * -1) 0; }
.fold-row { max-width: 100%; min-height: 44px; display: inline-flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-3) 0 var(--sp-1); border-radius: 999px;
  color: var(--muted); font-size: var(--fs-sm); font-weight: 580; text-align: left; }
.fold-row .stackic { display: flex; flex: none; }
.fold-row .stackic span { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in oklab, var(--ink) 9%, var(--canvas)); color: var(--muted);
  box-shadow: 0 0 0 2px var(--canvas); }
.fold-row .stackic span + span { margin-left: -7px; }
.fold-row .stackic svg.i.sm { width: 13px; height: 13px; }
.fold-row .stackic .k-file-change { color: var(--accent-text); background: color-mix(in oklab, var(--accent) 16%, var(--canvas)); }
.fold-row .ft { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fold-row .fm { flex: none; display: inline-flex; gap: 5px; font-size: var(--fs-cap); font-variant-numeric: tabular-nums; }
.fold-row .chev { flex: none; transition: transform .45s var(--spring); }
.fold-row[aria-expanded="true"] .chev { transform: rotate(90deg); }
.fold-row[aria-expanded="true"] { color: var(--ink); }
.fold-row:active { background: var(--fill-softer); }
.fold-x { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s var(--spring); }
.fold-x > div { overflow: hidden; min-height: 0; }
.fold.open .fold-x { grid-template-rows: 1fr; }
.fold-body { margin: var(--sp-1) 0 var(--sp-2) 0; padding: var(--sp-1) var(--sp-3); border-radius: var(--r-md); background: var(--fill-softer); box-shadow: inset 0 0 0 1px var(--hairline);
  opacity: 0; transform: translateY(-8px) scale(.97); transform-origin: 0 0; transition: opacity .2s ease, transform .55s cubic-bezier(.3, 1.35, .5, 1); }
.fold.open { align-self: stretch; }
.fold.open .fold-body { opacity: 1; transform: none; }
.liverow { display: flex; align-items: center; gap: var(--sp-2); min-height: 40px; margin: 0 var(--sp-3) var(--sp-2); padding: 0 var(--sp-3) 0 var(--sp-2); border-radius: 999px; font-size: var(--fs-sm);
  box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px color-mix(in oklch, var(--accent) 26%, transparent), 0 10px 26px -14px color-mix(in oklch, var(--accent) 70%, transparent); }
.liverow .orb { width: 20px; height: 20px; border-radius: 50%; flex: none; position: relative; }
.liverow .orb::before, .liverow .orb::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--accent); }
.liverow .orb::after { inset: 0; background: color-mix(in oklch, var(--accent) 40%, transparent); animation: ripple 2.2s ease-out infinite; }
.liverow .lh { flex: none; font-weight: 650; white-space: nowrap; }
.liverow .ld { flex: 1; min-width: 0; font-family: var(--mono); font-size: calc(12px * var(--ts)); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.liverow .lh.only { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.liverow .elapsed { color: var(--accent-text); }
.liverow.stopped { box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px var(--hairline); }
.liverow.stopped .orb::before { background: var(--muted); }
.liverow.failed { box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px color-mix(in oklch, var(--danger) 34%, transparent); }
.liverow.failed .orb::before { background: var(--danger); }
.liverow.failed .lh { color: var(--danger-text); }
.liverow.stopped .orb::after, .liverow.failed .orb::after { display: none; }

/* ---- B · Title scrolls away ---- */
.thead.slim { border-radius: 0; background: transparent; box-shadow: none; transition: background-color .3s ease, box-shadow .3s ease; }
.thead.slim.stuck { background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.7); backdrop-filter: blur(22px) saturate(1.7); box-shadow: inset 0 -1px 0 var(--hairline); }
.thead.slim .mini { flex: 1; min-width: 0; font-weight: 650; font-size: var(--fs-body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  opacity: 0; transform: translateY(8px); transition: opacity .25s ease, transform .35s var(--ease); }
.thead.slim.titled .mini { opacity: 1; transform: none; }
.thead.slim .state-pill { min-height: 28px; padding: 0 var(--sp-2) 0 var(--sp-3); }
.thead.slim.titled .state-pill.working .word { display: none; }
.tscroll { position: relative; isolation: isolate; overflow-x: clip; }
#tScroll { scroll-padding: calc(var(--thead-h, 100px) + var(--sp-2)) 0 calc(var(--dock-h, 70px) + var(--safe-b) + var(--sp-3)); }
.kb-open #tScroll { scroll-padding-bottom: calc(var(--dock-h, 70px) + var(--kb-h) + var(--sp-3)); }
.tscroll > .wash { z-index: -1; }
.thero { padding: var(--sp-1) 0 var(--sp-2); }
.ttitle { font-size: var(--fs-display); font-weight: 720; line-height: 1.12; letter-spacing: -.025em; }
.tmeta { font-size: var(--fs-sm); color: var(--muted); margin-top: var(--sp-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chiprow { display: flex; align-items: center; gap: var(--sp-2); width: 100%; min-height: 44px; margin-top: var(--sp-2); border-radius: 999px; text-align: left; }
.gchip { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 var(--sp-3) 0 var(--sp-2); border-radius: 999px; flex: none; white-space: nowrap;
  font-size: var(--fs-cap); font-weight: 620; color: var(--muted); background: color-mix(in oklch, var(--surface) 70%, transparent); box-shadow: inset 0 0 0 1px var(--hairline); }
.gchip.br { flex: 0 1 auto; min-width: 0; font-family: var(--mono); font-weight: 500; color: var(--ink); }
.gchip.br span { overflow: hidden; text-overflow: ellipsis; }
.gchip.num { padding-left: var(--sp-3); }
.gchip .light { width: 6px; height: 6px; margin: 0 2px; }
.chiprow:active .gchip { background: var(--fill-soft); }
.trail { list-style: none; position: relative; margin: calc(var(--sp-2) * -1) 0 calc(var(--sp-2) * -1) var(--sp-2); padding: 2px 0 2px var(--sp-4); display: flex; flex-direction: column; }
.trail::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 1.5px; border-radius: 1px; background: color-mix(in oklch, var(--ink) 14%, transparent); }
.trail .step { min-height: 26px; font-size: var(--fs-cap); gap: 7px; }
.trail .step .si { width: 16px; height: 16px; background: none; border-radius: 0; }
.trail .step .ss { font-size: calc(11.5px * var(--ts)); }
.trail .step .sv { font-weight: 620; }

/* ---- C · Live strip ---- */
.strip-x { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .42s var(--spring), opacity .25s ease; }
.strip-x > div { overflow: hidden; min-height: 0; }
.kb-open #scr-thread[data-v="C"] .strip-x { grid-template-rows: 0fr; opacity: 0; }
.strip { width: 100%; min-height: 44px; margin-top: var(--sp-1); display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-1) 0 var(--sp-3); border-radius: 999px;
  font-size: var(--fs-sm); text-align: left; position: relative; overflow: hidden;
  background: color-mix(in oklch, var(--accent) 10%, transparent); box-shadow: inset 0 1px 0 var(--hl), inset 0 0 0 1px color-mix(in oklch, var(--accent) 24%, transparent); }
.strip .sic { width: 16px; display: grid; place-items: center; flex: none; color: var(--accent-text); }
.strip .stx { flex: 1; min-width: 0; font-weight: 620; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.strip .elapsed { color: var(--accent-text); }
.strip .sheen { background-image: linear-gradient(90deg, var(--ink) 0%, var(--ink) 38%, var(--muted) 50%, var(--ink) 62%, var(--ink) 100%); }
.strip .scount { flex: none; display: inline-flex; align-items: center; gap: 2px; height: 34px; padding: 0 var(--sp-2) 0 var(--sp-3); border-radius: 999px;
  font-size: var(--fs-cap); font-weight: 650; color: var(--ink); background: var(--fill-soft); }
.strip .scount .chev { color: var(--muted); transition: transform .4s var(--spring); }
.strip[aria-expanded="true"] .scount .chev { transform: rotate(180deg); }
.strip.idle { background: var(--fill-softer); box-shadow: inset 0 1px 0 var(--hl), inset 0 0 0 1px var(--hairline); }
.strip.idle .sic { color: var(--muted); }
.strip.bad { background: color-mix(in oklch, var(--danger) 10%, transparent); box-shadow: inset 0 1px 0 var(--hl), inset 0 0 0 1px color-mix(in oklch, var(--danger) 28%, transparent); }
.strip.bad .sic, .strip.bad .stx { color: var(--danger-text); }
.stepchip { display: inline-flex; align-items: center; min-height: 44px; margin: calc(var(--sp-3) * -1) 0 calc(var(--sp-1) * -1); border-radius: 999px; }
.stepchip .pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 var(--sp-2); border-radius: 999px; font-size: var(--fs-cap); font-weight: 640; color: var(--muted);
  background: var(--fill-soft); box-shadow: inset 0 0 0 1px var(--hairline); transition: background .25s ease, color .25s ease; }
.stepchip .pill svg.i.sm { width: 14px; height: 14px; }
.stepchip .chev { transition: transform .4s var(--spring); }
.stepchip[aria-expanded="true"] .pill { color: var(--ink); background: color-mix(in oklch, var(--accent) 12%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--accent) 30%, transparent); }
.stepchip[aria-expanded="true"] .chev { transform: rotate(180deg); }
.chip-x { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s var(--spring); }
.chip-x > div { overflow: hidden; min-height: 0; }
.chip-x.open { grid-template-rows: 1fr; }
.chip-body { margin: var(--sp-2) 0 var(--sp-3); padding: var(--sp-1) var(--sp-3); border-radius: var(--r-md); background: var(--fill-softer); box-shadow: inset 0 0 0 1px var(--hairline);
  opacity: 0; transform: translateY(-6px); transition: opacity .2s ease, transform .5s cubic-bezier(.3, 1.35, .5, 1); }
.chip-x.open .chip-body { opacity: 1; transform: none; }

/* Prototype only: picks the thread version. Sits where the iPhone's island is, so it never reads as part of the design. */
.proto { position: absolute; z-index: 70; top: calc(env(safe-area-inset-top) + 3px); left: 50%; transform: translateX(-50%); display: none; align-items: center; height: 44px;
  padding: 0 2px 0 var(--sp-3); border-radius: 999px; background: color-mix(in oklch, var(--canvas) 86%, transparent); box-shadow: 0 0 0 1px var(--border);
  outline: 1.5px dashed color-mix(in oklch, var(--warning) 70%, transparent); outline-offset: 2px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.thread-on .proto { display: flex; }
.proto .pl { margin-right: var(--sp-1); letter-spacing: .02em; }
.proto button { width: 40px; height: 44px; display: grid; place-items: center; font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--muted); }
.proto button span { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; }
.proto button[aria-pressed="true"] { color: var(--ink); }
.proto button[aria-pressed="true"] span { background: color-mix(in oklch, var(--warning) 26%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--warning) 55%, transparent); }

.tscroll { padding: var(--thead-h, 260px) var(--sp-4) calc(var(--dock-h, 70px) + var(--safe-b) + var(--sp-6)); }
.kb-open .tscroll { padding-bottom: calc(var(--dock-h, 70px) + var(--kb-h) + var(--sp-5)); }
.msgs { display: flex; flex-direction: column; gap: calc(var(--sp-5) * var(--dens)); padding-top: var(--sp-3); }
.msg.user { align-self: flex-end; max-width: 84%; background: var(--bubble); color: var(--bubble-ink); padding: calc(var(--sp-3) * var(--dens)) var(--sp-4);
  border-radius: 20px 20px 6px 20px; box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px color-mix(in oklch, var(--accent) 12%, transparent); font-size: var(--fs-body); line-height: 1.4; }
.msg.user.sending { opacity: .62; }
.msg-state { align-self: flex-end; font-size: var(--fs-cap); color: var(--muted); margin-top: calc(var(--sp-4) * var(--dens) * -1 + 2px); display: flex; gap: 5px; align-items: center; }
.msg.bot { font-size: var(--fs-body); line-height: 1.5; -webkit-user-select: text; user-select: text; }
.who { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-cap); color: var(--muted); font-weight: 620; margin-bottom: var(--sp-2); }
.who .mark { width: 18px; height: 18px; border-radius: 6px; display: grid; place-items: center; background: color-mix(in oklch, var(--accent) 22%, transparent); color: var(--accent-text); font-size: 10px; font-weight: 800; }
.md > * + * { margin-top: calc(var(--sp-3) * var(--dens)); }
.md h4 { font-size: var(--fs-body); font-weight: 700; letter-spacing: -.005em; margin-top: calc(var(--sp-5) * var(--dens)); }
.md h4:first-child { margin-top: 0; }
.md ul, .md ol { padding: 0; margin-left: 0; list-style: none; }
.md li { position: relative; padding-left: 22px; }
.md li + li { margin-top: calc(var(--sp-2) * var(--dens)); }
.md ul > li::before { content: ""; position: absolute; left: 6px; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: .85; }
.md ol { counter-reset: n; }
.md ol > li { counter-increment: n; }
.md ol > li::before { content: counter(n); position: absolute; left: 0; top: .1em; font-size: var(--fs-cap); font-weight: 700; color: var(--accent-text); font-variant-numeric: tabular-nums;
  width: 17px; height: 17px; border-radius: 6px; display: grid; place-items: center; background: color-mix(in oklch, var(--accent) 15%, transparent); line-height: 1; }
.md strong { font-weight: 680; }
.md code { font-size: .86em; padding: 1px 6px; border-radius: 6px; background: var(--code-bg); color: var(--code-ink); box-shadow: inset 0 0 0 1px var(--hairline); white-space: break-spaces; word-break: break-word; }
.md kbd, .card-ask kbd { font-family: Figtree, system-ui, sans-serif; font-size: .82em; font-weight: 650; padding: 1px 7px 2px; margin: 0 1px; border-radius: 6px; white-space: nowrap;
  background: var(--raised); color: var(--ink); box-shadow: inset 0 0 0 1px var(--border), inset 0 -2px 0 var(--border), 0 1px 2px rgba(0, 0, 0, .25); }
[data-appearance="light"] .md kbd { background: var(--surface); }
.codebox { border-radius: var(--r-md); background: var(--code-bg); box-shadow: inset 0 0 0 1px var(--hairline); overflow: hidden; }
.codebox .ch { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--sp-1) 0 var(--sp-3); font-size: var(--fs-cap); color: var(--muted); border-bottom: 1px solid var(--hairline); }
.codebox .ch button { min-height: 36px; padding: 0 var(--sp-3); border-radius: 999px; font-weight: 620; color: var(--accent-text); }
.md pre { margin: 0; padding: var(--sp-3); overflow-x: auto; font-size: calc(13px * var(--ts)); line-height: 1.5; color: var(--code-ink); -webkit-user-select: text; user-select: text; }
.md pre code { background: none; box-shadow: none; padding: 0; font-size: inherit; white-space: pre; word-break: normal; }

@keyframes ripple { from { transform: scale(.35); opacity: .9; } to { transform: scale(1.15); opacity: 0; } }
.thread-empty { text-align: center; color: var(--muted); padding: var(--sp-8) var(--sp-5); font-size: var(--fs-body); }

/* The reply dock and, in A, the live step that rides on top of it */
.dockarea { position: absolute; z-index: 15; left: var(--sp-3); right: var(--sp-3); bottom: var(--safe-b); transition: bottom .42s var(--spring); }
.kb-open .dockarea { bottom: calc(var(--kb-h) + var(--sp-2)); }
.dock { position: relative; border-radius: 26px; padding: 6px 6px 6px var(--sp-4);
  display: flex; align-items: flex-end; gap: var(--sp-2); transition: box-shadow .5s ease;
  box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px var(--hairline), 0 14px 40px -14px rgba(0, 0, 0, .5); }
.dock.focus { box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px color-mix(in oklch, var(--accent) 55%, transparent), 0 0 0 5px color-mix(in oklch, var(--accent) 12%, transparent), 0 0 34px -4px color-mix(in oklch, var(--accent) 50%, transparent); }
.dock .field { flex: 1; min-width: 0; min-height: 44px; padding: 11px 0; font-size: var(--fs-body); line-height: 1.4; max-height: 120px; overflow-y: auto; word-break: break-word; cursor: text; }
.dock .field .ph { color: var(--placeholder); }
.round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.round.send { background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 18px -6px color-mix(in oklch, var(--accent) 80%, transparent); }
.round.stop { background: var(--fill-soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--hairline); }
.round.stop .sq { width: 13px; height: 13px; border-radius: 3.5px; background: currentColor; }
.round.pop-in { animation: popin .3s var(--ease); }
@keyframes popin { from { transform: scale(.6); opacity: 0; } }

/* ---------- Keyboard ---------- */
#kb { position: absolute; z-index: 80; left: 0; right: 0; bottom: 0; height: var(--kb-h); padding: 8px 3px 0;
  background: color-mix(in oklch, var(--overlay) 86%, transparent); -webkit-backdrop-filter: blur(30px) saturate(1.5); backdrop-filter: blur(30px) saturate(1.5);
  box-shadow: inset 0 1px 0 var(--hairline); transform: translateY(102%); transition: transform .42s var(--spring); }
[data-appearance="light"] #kb { background: color-mix(in oklab, var(--border) 62%, var(--canvas)); }
.kb-open #kb { transform: none; }
.kr { display: flex; justify-content: center; gap: 6px; margin-bottom: 11px; }
.k { height: 42px; flex: 0 1 calc((100% - 54px) / 10); border-radius: 6px; font-size: 22px; font-weight: 420; display: grid; place-items: center;
  background: color-mix(in oklab, var(--ink) 30%, var(--overlay)); color: var(--ink); box-shadow: 0 1px 0 rgba(0, 0, 0, .4); }
[data-appearance="light"] .k { background: var(--surface); box-shadow: 0 1px 0 rgba(0, 0, 0, .25); }
.k.fn { background: color-mix(in oklab, var(--ink) 14%, var(--overlay)); font-size: 15px; flex: 0 0 auto; padding: 0 11px; min-width: 44px; }
[data-appearance="light"] .k.fn { background: color-mix(in oklab, var(--border) 92%, var(--ink)); }
.k.space { flex: 1 1 auto; font-size: 15px; }
.k.ret { flex: 0 0 88px; font-size: 15px; }
.k.ret.go { background: var(--accent); color: var(--accent-ink); }
.k.on { background: var(--ink); color: var(--canvas); }
.k:active { background: color-mix(in oklab, var(--ink) 45%, var(--overlay)); }
.kr.mid { padding: 0 18px; }
.kb-foot { display: flex; justify-content: space-between; padding: 0 26px; color: var(--ink); opacity: .75; }

/* ---------- Scrim, sheets, menus, toast ---------- */
#scrim { position: absolute; z-index: 50; inset: 0; background: rgba(0, 0, 0, .46); opacity: 0; pointer-events: none; transition: opacity .4s ease; }
.sheet-open #scrim { opacity: 1; pointer-events: auto; }
#sheet { position: absolute; z-index: 55; left: 0; right: 0; bottom: 0; max-height: calc(100% - var(--sb-h) - 6px); display: flex; flex-direction: column;
  border-radius: var(--r-xl) var(--r-xl) 0 0; background: var(--surface); overflow: hidden; isolation: isolate;
  box-shadow: inset 0 1px 0 var(--hl), 0 -20px 60px -20px rgba(0, 0, 0, .55); transform: translateY(104%); visibility: hidden; transition: transform .5s var(--spring), visibility 0s .5s; }
[data-appearance="dark"] #sheet { background: var(--raised); }
.sheet-open #sheet { transform: none; visibility: visible; transition: transform .5s var(--spring), visibility 0s; }
#sheet.tall { height: calc(100% - var(--sb-h) - 6px); }
#sheet .wash { height: 300px; z-index: -1; }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--ink); opacity: .22; margin: 8px auto 2px; flex: none; }
.sbody { flex: 1; overflow-y: auto; overflow-x: hidden; padding: var(--sp-3) var(--gutter) var(--sp-4); scrollbar-width: none; }
.sfoot { padding: var(--sp-3) var(--gutter) calc(var(--safe-b) + var(--sp-2)); display: flex; gap: var(--sp-2); flex: none; box-shadow: inset 0 1px 0 var(--hairline); }
.sfoot .btn { flex: 1; }
.kb-open .sfoot { padding-bottom: calc(var(--kb-h) + var(--sp-3)); }
.from { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-sm); color: var(--muted); min-width: 0; }
.from span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-title { font-size: var(--fs-title); font-weight: 690; line-height: var(--lh-tight); letter-spacing: -.02em; margin-top: var(--sp-3); }
.s-sub { color: var(--muted); font-size: var(--fs-sm); margin-top: var(--sp-2); }
.opts { display: flex; flex-direction: column; gap: var(--sp-2); margin-top: var(--sp-5); }
.opt { width: 100%; display: flex; gap: var(--sp-3); align-items: flex-start; padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md); text-align: left; min-height: 56px;
  background: var(--fill-softer); box-shadow: inset 0 0 0 1px var(--hairline); transition: box-shadow .3s ease, background .3s ease, transform .16s var(--ease); }
.opt .radio { width: 22px; height: 22px; border-radius: 50%; flex: none; margin-top: 1px; box-shadow: inset 0 0 0 1.5px var(--border); display: grid; place-items: center; transition: box-shadow .25s ease, background .25s ease; }
.opt .radio svg { opacity: 0; transform: scale(.5); transition: opacity .2s ease, transform .25s var(--ease); color: var(--accent-ink); }
.opt[aria-checked="true"] { background: color-mix(in oklch, var(--accent) 12%, transparent); box-shadow: inset 0 0 0 1.5px color-mix(in oklch, var(--accent) 80%, transparent), 0 0 26px -8px color-mix(in oklch, var(--accent) 60%, transparent); }
.opt[aria-checked="true"] .radio { background: var(--accent); box-shadow: 0 0 10px -1px color-mix(in oklch, var(--accent) 70%, transparent); }
.opt[aria-checked="true"] .radio svg { opacity: 1; transform: none; }
.opt .ot { font-weight: 650; font-size: var(--fs-body); }
.opt .od { color: var(--muted); font-size: var(--fs-sm); margin-top: 2px; line-height: 1.38; }
.opt:disabled { opacity: .55; }
.own { margin-top: var(--sp-2); min-height: 76px; border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); background: var(--code-bg); box-shadow: inset 0 0 0 1px var(--hairline); font-size: var(--fs-body); }
.own.focus { box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--accent) 60%, transparent), 0 0 24px -6px color-mix(in oklch, var(--accent) 50%, transparent); }
.own .ph { color: var(--placeholder); }
.cmd { margin-top: var(--sp-5); border-radius: var(--r-md); background: var(--code-bg); color: var(--code-ink); padding: var(--sp-4); font-family: var(--mono); font-size: calc(16px * var(--ts));
  box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--warning) 30%, transparent), 0 10px 34px -18px color-mix(in oklch, var(--warning) 70%, transparent); }
.cmd .p { color: var(--muted); margin-right: 10px; }
.where { margin-top: var(--sp-4); font-size: var(--fs-sm); color: var(--muted); }
.where .path { display: block; font-family: var(--mono); font-size: calc(12.5px * var(--ts)); color: var(--ink); word-break: break-all; margin: 3px 0; line-height: 1.45; }
.stackbtns { display: flex; flex-direction: column; gap: var(--sp-2); margin-top: var(--sp-6); }

/* New thread */
.nt-head { display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 var(--sp-2); flex: none; }
.nt-head .btn { min-width: 74px; }
.nt-head h2 { font-size: var(--fs-lead); font-weight: 680; }
.steps { display: flex; gap: 6px; padding: 0 var(--gutter); flex: none; }
.steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--fill-soft); position: relative; overflow: hidden; }
.steps i::after { content: ""; position: absolute; inset: 0; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .5s var(--ease); box-shadow: 0 0 10px var(--accent); }
.steps i.on::after { transform: none; }
.step-label { padding: var(--sp-2) var(--gutter) 0; font-size: var(--fs-cap); color: var(--muted); font-weight: 600; flex: none; }
.nt-pages { flex: 1; position: relative; overflow: hidden; overflow: clip; }
.nt-page { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: var(--sp-4) var(--gutter) var(--sp-6); transition: transform .44s var(--spring), opacity .3s ease; scrollbar-width: none; }
.nt-page.right { transform: translateX(100%); opacity: 0; pointer-events: none; }
.nt-page.left { transform: translateX(-30%); opacity: 0; pointer-events: none; }
.pick { width: 100%; display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-4); border-radius: var(--r-md); text-align: left; min-height: 64px;
  background: var(--fill-softer); box-shadow: inset 0 0 0 1px var(--hairline); }
.pick + .pick { margin-top: var(--sp-2); }
.pick .tx { flex: 1; min-width: 0; }
.pick .pt { font-weight: 650; font-size: var(--fs-body); overflow: hidden; text-overflow: ellipsis; }
.pick .pd { font-size: var(--fs-sm); color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick .chev { color: var(--muted); }
.pick:disabled { opacity: .62; }
.crumbs { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-bottom: var(--sp-5); }
.crumb { min-height: 36px; padding: 0 var(--sp-3); border-radius: 999px; background: var(--fill-soft); font-size: var(--fs-sm); font-weight: 620; display: inline-flex; align-items: center; gap: 6px; max-width: 100%; }
.crumb span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fieldbox { width: 100%; display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md); text-align: left; min-height: 64px;
  background: var(--fill-softer); box-shadow: inset 0 0 0 1px var(--hairline); }
.fieldbox + .fieldbox { margin-top: var(--sp-2); }
.fieldbox.open { box-shadow: inset 0 0 0 1.5px color-mix(in oklch, var(--accent) 70%, transparent), 0 0 24px -8px color-mix(in oklch, var(--accent) 60%, transparent); }
.fieldbox .tx { flex: 1; min-width: 0; }
.fieldbox .fl { font-size: var(--fs-cap); color: var(--muted); font-weight: 600; }
.fieldbox .fv { font-size: var(--fs-body); font-weight: 620; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fieldbox .ud { color: var(--muted); }
.opening { position: relative; overflow: hidden; }
.opening::after { content: ""; position: absolute; top: 0; bottom: 0; width: 45%; left: -45%; background: linear-gradient(90deg, transparent, color-mix(in oklch, var(--accent-ink) 35%, transparent), transparent); animation: run 1.1s linear infinite; }

#menuCatch { position: absolute; z-index: 85; inset: 0; display: none; }
#menuCatch.on { display: block; }
#menu { position: absolute; z-index: 86; min-width: 240px; max-width: calc(100% - 24px); border-radius: 18px; padding: 6px; background: var(--glass-strong);
  -webkit-backdrop-filter: blur(26px) saturate(1.8); backdrop-filter: blur(26px) saturate(1.8);
  box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px var(--hairline), var(--shadow-far); opacity: 0; transform: scale(.9); pointer-events: none;
  transition: opacity .2s ease, transform .3s var(--spring); max-height: 70%; overflow-y: auto; }
#menu.on { opacity: 1; transform: none; pointer-events: auto; }
.mi { width: 100%; display: flex; align-items: center; gap: var(--sp-3); min-height: 48px; padding: var(--sp-2) var(--sp-3); border-radius: 12px; text-align: left; }
.mi:active, .mi:focus-visible { background: var(--fill-soft); }
.mi .tx { flex: 1; min-width: 0; }
.mi .mt { font-weight: 600; font-size: var(--fs-body); }
.mi .md2 { font-size: var(--fs-cap); color: var(--muted); margin-top: 1px; }
.mi .ck { width: 20px; color: var(--accent-text); flex: none; }
.mi:disabled { opacity: .5; }
.msep { height: 1px; background: var(--hairline); margin: 4px 10px; }
.minfo { padding: var(--sp-3); font-size: var(--fs-sm); }
.minfo .mrow { display: flex; justify-content: space-between; gap: var(--sp-3); padding: 5px 0; color: var(--muted); }
.minfo .mrow b { color: var(--ink); font-weight: 600; text-align: right; }
.minfo h5 { margin: 0 0 var(--sp-2); font-size: var(--fs-body); font-weight: 680; line-height: 1.3; }
.minfo .later { margin-top: var(--sp-2); font-size: var(--fs-cap); color: var(--muted); }

#toast { position: absolute; z-index: 95; top: calc(var(--sb-h) + 2px); left: 50%; max-width: calc(100% - 32px); transform: translate(-50%, -140%) scale(.6);
  opacity: 0; display: flex; align-items: center; gap: var(--sp-2); padding: 10px 18px 10px 12px; border-radius: 999px; font-size: var(--fs-sm); font-weight: 620;
  background: var(--glass-strong); -webkit-backdrop-filter: blur(24px) saturate(1.8); backdrop-filter: blur(24px) saturate(1.8);
  box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px var(--hairline), var(--shadow-far), 0 0 30px -10px color-mix(in oklch, var(--accent) 60%, transparent);
  transition: transform .5s var(--spring), opacity .3s ease; pointer-events: none; }
#toast.on { transform: translate(-50%, 0) scale(1); opacity: 1; }
#toast .ok { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); flex: none; }
#toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Settings ---------- */
.group { margin-top: var(--sp-7); }
.group > h2 { font-size: var(--fs-sm); font-weight: 650; color: var(--muted); margin: 0 var(--sp-1) var(--sp-2); }
.panel { border-radius: var(--r-lg); background: color-mix(in oklch, var(--surface) 88%, transparent); box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px var(--hairline); padding: var(--sp-4); }
.panel + .panel { margin-top: var(--sp-3); }
.prow { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
.plabel { font-weight: 640; font-size: var(--fs-body); }
.pvalue { color: var(--muted); font-size: var(--fs-sm); }
.phint { color: var(--muted); font-size: var(--fs-sm); margin-top: var(--sp-2); line-height: 1.4; }
.panel .seg { margin-top: var(--sp-3); }
.themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-3); margin-top: var(--sp-3); }
.theme { display: flex; flex-direction: column; gap: 6px; align-items: stretch; text-align: left; border-radius: 16px; padding: 0; }
.theme .room { position: relative; height: 92px; border-radius: 14px; overflow: hidden; background: var(--tc);
  box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--ti) 12%, transparent); transition: box-shadow .3s ease, transform .2s var(--ease); }
.theme .room::before { content: ""; position: absolute; inset: 0; background: radial-gradient(90% 70% at 15% 0%, color-mix(in oklch, var(--ta) 45%, transparent), transparent 70%); }
.theme .room i { position: absolute; display: block; border-radius: 4px; }
.theme .l1 { left: 10px; top: 14px; width: 54%; height: 7px; background: var(--ti); opacity: .9; }
.theme .l2 { left: 10px; top: 27px; width: 38%; height: 5px; background: var(--tm); opacity: .9; }
.theme .bb { right: 10px; top: 44px; width: 46%; height: 14px; border-radius: 7px !important; background: var(--tb); }
.theme .dot { left: 10px; bottom: 10px; width: 26px; height: 12px; border-radius: 6px !important; background: var(--ta); box-shadow: 0 0 12px var(--ta); }
.theme .name { font-size: var(--fs-sm); font-weight: 620; display: flex; align-items: center; gap: 6px; padding: 0 2px; min-height: 22px; }
.theme .name svg { color: var(--accent-text); opacity: 0; transition: opacity .2s ease; }
.theme[aria-checked="true"] .room { box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--ti) 12%, transparent), 0 0 0 2px var(--canvas), 0 0 0 4px var(--accent), 0 0 28px -4px color-mix(in oklch, var(--accent) 65%, transparent); }
.theme[aria-checked="true"] .name svg { opacity: 1; }
.sizes { display: flex; align-items: flex-end; justify-content: space-between; margin-top: var(--sp-3); padding: 4px; border-radius: 16px; background: var(--fill-softer); position: relative; }
.sizes::before { content: ""; position: absolute; left: 30px; right: 30px; top: 50%; height: 2px; background: var(--hairline); }
.size { position: relative; z-index: 1; flex: 1; min-height: 52px; display: grid; place-items: center; border-radius: 12px; font-weight: 650; color: var(--muted); transition: color .25s ease, background .3s ease, box-shadow .3s ease; }
.size span { line-height: 1; }

[data-appearance="light"] .size[aria-checked="true"] { background: var(--surface); }

.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: var(--ink); opacity: .82; box-shadow: 0 2px 6px rgba(0, 0, 0, .35); transition: transform .35s var(--spring), background .3s ease; }
[data-appearance="light"] .sw::after { background: var(--surface); opacity: 1; }
[aria-checked="true"] > .sw { background: var(--accent); box-shadow: 0 0 16px -3px color-mix(in oklch, var(--accent) 70%, transparent); }
[aria-checked="true"] > .sw::after { transform: translateX(20px); background: var(--accent-ink); opacity: 1; }
.note-line { color: var(--muted); font-size: var(--fs-sm); margin: var(--sp-2) var(--sp-1) 0; line-height: 1.4; }
.def-row { display: flex; align-items: center; gap: var(--sp-3); width: 100%; min-height: 54px; text-align: left; padding: var(--sp-2) 0; }
.def-row + .def-row { box-shadow: inset 0 1px 0 var(--hairline); }
.def-row .k1 { flex: 1; font-weight: 600; }
.def-row .v1 { color: var(--muted); font-size: var(--fs-sm); max-width: 58%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.about { display: flex; align-items: center; gap: var(--sp-3); }
.about .logo { width: 44px; height: 44px; border-radius: 13px; flex: none; background: radial-gradient(70% 70% at 30% 20%, color-mix(in oklab, var(--accent) 80%, var(--ink)), var(--accent-surface));
  box-shadow: 0 0 24px -6px color-mix(in oklch, var(--accent) 70%, transparent), inset 0 1px 0 var(--hl); display: grid; place-items: center; color: var(--accent-ink); font-weight: 800; font-size: 20px; }

/* ---------- Computers ---------- */
.pc { padding: var(--sp-4); border-radius: var(--r-lg); background: color-mix(in oklch, var(--surface) 90%, transparent); box-shadow: inset 0 1px 0 var(--hl), 0 0 0 1px var(--hairline); position: relative; overflow: hidden; }
.pc.online { background: linear-gradient(180deg, color-mix(in oklab, var(--accent) 7%, var(--surface)), var(--surface) 70%); }
.pc.down { background: linear-gradient(90deg, color-mix(in oklab, var(--danger) 9%, var(--surface)), var(--surface) 60%); }
.pc.down::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--danger); box-shadow: 0 0 14px var(--danger); opacity: .75; }
.pc-h { display: flex; align-items: center; gap: var(--sp-3); }
.pc-h .ic { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: var(--fill-soft); flex: none; }
.pc.online .pc-h .ic { color: var(--accent-text); background: color-mix(in oklch, var(--accent) 14%, transparent); }
.pc-h .tx { flex: 1; min-width: 0; }
.pc-h .n { font-weight: 680; font-size: var(--fs-lead); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-h .s { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-sm); color: var(--muted); margin-top: 2px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); margin-top: var(--sp-4); }
.fact { padding: var(--sp-2) var(--sp-3); border-radius: 12px; background: var(--fill-softer); font-size: var(--fs-sm); }
.fact b { display: block; font-size: var(--fs-body); font-weight: 650; }
.fact span { color: var(--muted); }
.pc-actions { display: flex; gap: var(--sp-2); margin-top: var(--sp-3); flex-wrap: wrap; }
.pc-actions .btn { font-size: var(--fs-sm); }

/* ---------- Reduced motion: fades or nothing ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
  .tab-root, .tab-root.on, .tab-root.under, #scr-thread, #scr-thread.in, #sheet, .sheet-open #sheet, #kb, .kb-open #kb, .tabbar, .tabbar.away, #toast, #toast.on, #menu, .nt-page, .dockarea, .tdrop, .tdrop.on, .fold-body, .chip-body, #stage, .sheet-open #stage {
    transform: none !important; }
  #scr-thread { opacity: 0; transition: opacity .2s ease, visibility 0s .2s !important; }
  #scr-thread.in { opacity: 1; transition: opacity .2s ease, visibility 0s !important; }
  #sheet { opacity: 0; visibility: hidden; transition: opacity .2s ease, visibility 0s .2s !important; }
  .sheet-open #sheet { opacity: 1; visibility: visible; transition: opacity .2s ease, visibility 0s !important; }
  #kb { opacity: 0; visibility: hidden; transition: opacity .15s ease !important; }
  .kb-open #kb { opacity: 1; visibility: visible; }
  .tabbar.away { opacity: 0; pointer-events: none; }
  .sheen { color: var(--muted); background: none; }
  .runner { display: none; }
  .leaving { transform: none !important; }
  .fold-x, .chip-x, .strip-x, .sb-fade { transition: none !important; }
  .tdrop { transition: opacity .15s ease, visibility 0s .15s !important; }
  .tdrop.on { transition: opacity .15s ease, visibility 0s !important; }
}
