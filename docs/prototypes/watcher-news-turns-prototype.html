<!doctype html>
<!--
  PROTOTYPE — throwaway. Not shipped, not tested, not wired to anything.

  Question: how should Watcher's news turns show in its Conversation? Sotto sends Watcher a hidden wake-up for each
  batch of news from watched threads. Watcher runs a short turn and usually writes a reply. The wake-up is hidden, so
  today the turn's work has no message to sit under. It drops to the bottom of the conversation as a stack of
  "Worked for" rows, and the news reply joins your turn above it, which folds your own answer away.

    now  As it ships (October 19). The stack at the bottom, and your answers folded under news replies.
    a    In place. Every news turn reads like a turn you started, without your bubble: a "Worked for" line, then the reply.
    b    In the reply. A news reply has no line of its own. Its header says "After news · 7.1s" and opens the work.
    c    One line per run. News turns in a row between your messages share one work line above their replies.
    d    Folded run. News turns in a row between your messages fold to one line. Opening it shows their replies.

  a to d all fix the order: work sits with its own turn, before that turn's reply. A news turn that wrote no reply
  shows its work line where it happened (a, c) or nothing (b, d).

  Bar: ← → (or the arrow keys) switch variants. Light flips the palette. 820 frames the window at its minimum size.
  The sample turns follow the timing of Zach's Watcher thread from October 19. The words are made up.

  Picked: b (Zach, October 19, 2026), and only the rows change: how often Watcher hears news stays as it is. ADR-0073.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sotto — Watcher news turns, prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face { font-family: 'Figtree'; font-weight: 300 900; font-display: swap; src: url('../../src/shared/fonts/figtree-latin.woff2') format('woff2'); }
:root {
  color-scheme: dark;
  --tt-canvas: oklch(0.115 0.008 265); --tt-field: oklch(0.145 0.008 265); --tt-surface-elevated: oklch(0.185 0.008 265); --tt-sunken: oklch(0.13 0.008 265);
  --tt-text: oklch(0.985 0.005 280); --tt-text-2: color-mix(in oklab, oklch(0.985 0.005 280) 55%, oklch(0.72 0.014 265));
  --tt-text-muted: color-mix(in oklab, oklch(0.72 0.014 265) 85%, oklch(0.985 0.005 280));
  --tt-hairline: oklch(0.305 0.02 265); --tt-field-border: oklch(0.375 0.024 265);
  --tt-accent: oklch(0.714 0.104 183); --tt-on-accent: oklch(0.16 0.012 190); --tt-activity: oklch(0.78 0.12 150);
  --tt-hover: color-mix(in srgb, oklch(0.32 0.05 185) 70%, transparent); --bubble: oklch(0.17 0.01 265);
  --tt-font: 'Figtree', ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
}
:root[data-theme='light'] {
  color-scheme: light;
  --tt-canvas: oklch(0.978 0.004 85); --tt-field: oklch(0.99 0.003 85); --tt-surface-elevated: oklch(0.955 0.006 85); --tt-sunken: oklch(0.965 0.005 85);
  --tt-text: oklch(0.2 0.01 265); --tt-text-2: oklch(0.36 0.012 265); --tt-text-muted: oklch(0.45 0.012 265);
  --tt-hairline: oklch(0.88 0.006 85); --tt-field-border: oklch(0.78 0.01 85);
  --tt-accent: oklch(0.52 0.1 183); --tt-on-accent: oklch(0.99 0.003 85); --tt-activity: oklch(0.5 0.12 150);
  --tt-hover: oklch(0.93 0.02 185); --bubble: oklch(0.95 0.006 85);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #050506; color: var(--tt-text); font: 14px/1.5 var(--tt-font); }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--tt-accent); outline-offset: 2px; }
.stage { min-height: 100%; display: grid; place-items: center; }
.app { display: grid; grid-template-rows: auto 1fr auto; width: 100vw; height: 100vh; background: var(--tt-canvas); overflow: hidden; }
.app[data-small] { width: 820px; height: 560px; box-shadow: 0 0 0 1px #333, 0 20px 60px rgb(0 0 0 / 50%); }
.head { display: flex; align-items: center; gap: 14px; padding: 12px 24px; border-bottom: 1px solid var(--tt-hairline); font-size: 13.5px; color: var(--tt-text-muted); }
.head b { color: var(--tt-text); font-weight: 600; font-size: 15px; display: inline-flex; gap: 8px; align-items: center; }
.head .tab { padding: 3px 10px; border-radius: 999px; }
.head .tab[aria-current] { background: var(--tt-hover); color: var(--tt-text); }
.scroll { overflow: auto; }
.col { max-width: 900px; margin: 0 auto; padding: 24px 32px 40px; }
.composer { max-width: 900px; width: calc(100% - 64px); margin: 0 auto 16px; border: 1px solid var(--tt-field-border); border-radius: 14px; background: var(--tt-field); padding: 12px 16px; color: var(--tt-text-muted); }

/* Transcript, roughly as it ships (threads.css, activity.css). */
.msg { position: relative; margin: 0 0 28px; }
.msg header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; color: var(--tt-text-muted); font-size: 12.5px; }
.who { color: var(--tt-text-2); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.msg p { margin: 0; color: var(--tt-text-2); line-height: 1.6; font-size: 15px; }
.msg[data-role='user'] { margin-left: max(24px, 12%); padding: 14px 18px; background: var(--bubble); border: 1px solid var(--tt-hairline); border-radius: 14px 14px 4px 14px; }
.msg[data-role='user'] p { color: var(--tt-text); }
.work { margin: 0 0 20px; border-bottom: 1px solid var(--tt-field-border); }
.msg + .work { margin-top: -8px; }
.sum { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; min-height: 32px; margin: 0 0 0 -6px; padding: 0 10px 0 6px; border: 0; border-radius: 8px; background: transparent; color: var(--tt-text-muted); font-size: 14px; cursor: pointer; text-align: left; }
.sum:hover { background: var(--tt-hover); color: var(--tt-text-2); }
.work > .sum { margin-bottom: 8px; }
.headline { color: var(--tt-text-2); font-weight: 500; font-variant-numeric: tabular-nums; }
.counts { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev { flex: none; transition: transform .16s ease; }
[aria-expanded='true'] > .chev { transform: rotate(90deg); }
.group { margin: 0 0 24px; }
.rows { margin: 2px 0 12px 1px; padding: 0 0 0 10px; border-left: 1px solid var(--tt-hairline); list-style: none; color: var(--tt-text-2); font-size: 14px; }
.rows li { display: flex; gap: 10px; padding: 3px 0; }
.rows li span:last-child { margin-left: auto; color: var(--tt-text-muted); font-variant-numeric: tabular-nums; }
.rows .run { color: var(--tt-activity); }
.live { display: flex; gap: 8px; color: var(--tt-text-muted); margin: -8px 0 20px; font-variant-numeric: tabular-nums; }
.live::before { content: ''; width: 7px; height: 7px; margin-top: 8px; border-radius: 50%; background: var(--tt-activity); }
.inner { padding: 4px 0 4px 14px; border-left: 1px solid var(--tt-hairline); margin: 0 0 16px 1px; }
.news-tag { padding: 0 7px; border: 1px solid var(--tt-hairline); border-radius: 999px; color: var(--tt-text-2); font-size: 11.5px; line-height: 18px; }
.hdrbtn { display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; margin-left: -2px; min-height: 22px; border: 0; border-radius: 6px; background: transparent; color: var(--tt-text-muted); font-size: 12.5px; cursor: pointer; font-variant-numeric: tabular-nums; }
.hdrbtn:hover { background: var(--tt-hover); color: var(--tt-text-2); }
.marker { position: fixed; top: 64px; right: 16px; max-width: 260px; padding: 10px 12px; border-radius: 10px; background: #fff3; backdrop-filter: blur(6px); color: #fff; font-size: 12.5px; line-height: 1.45; }
:root[data-theme='light'] .marker { background: #0002; color: #111; }

/* Prototype bar, not part of the design. */
.bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 999px; background: #fffef0; color: #111; box-shadow: 0 6px 24px rgb(0 0 0 / 45%); font: 13px/1 system-ui, sans-serif; z-index: 10; }
.bar button { border: 0; background: #e8e6d8; border-radius: 999px; padding: 8px 12px; cursor: pointer; color: #111; }
.bar button[aria-pressed='true'] { background: #111; color: #fffef0; }
.bar .label { padding: 0 10px; min-width: 250px; text-align: center; font-weight: 600; }
</style>
</head>
<body>
<div class="stage"><div class="app" id="app">
  <div class="head"><b><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="5.5" cy="7" r="2.6" fill="none" stroke="currentColor"/><circle cx="10.5" cy="7" r="2.6" fill="none" stroke="currentColor"/><path d="M8 10l-1 2h2z" fill="currentColor"/></svg>Watcher</b>
    <span class="tab">All threads 14</span><span class="tab" aria-current="page">Conversation</span><span class="tab">Watched 5</span></div>
  <div class="scroll" id="scroll"><div class="col" id="col"></div></div>
  <div class="composer">Watcher message</div>
</div></div>
<div class="marker" id="marker"></div>
<div class="bar" role="toolbar" aria-label="Prototype">
  <button id="prev" aria-label="Previous variant">←</button><span class="label" id="label"></span><button id="next" aria-label="Next variant">→</button>
  <button id="theme" aria-pressed="false">Light</button><button id="small" aria-pressed="false">820</button>
</div>
<script>
const OWL = '<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><circle cx="5.5" cy="7" r="2.6" fill="none" stroke="currentColor"/><circle cx="10.5" cy="7" r="2.6" fill="none" stroke="currentColor"/></svg>'
const CHEV = '<svg class="chev" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>'

// Turns in time order. news: true is a hidden wake-up's turn. The last turn is running.
const TURNS = [
  { at: '11:54', you: 'Watch my open threads and tell me when one needs me.', took: '30s', counts: 'Used 11 tools, thought 5 times', rows: [['Thinking', '0.4s'], ['list_threads', '1.2s'], ['watch_thread', '0.3s'], ['watch_thread', '0.3s']],
    reply: 'Watching five threads now. I will keep them going and bring you their questions.' },
  { at: '11:55', news: true, took: '1.6s', counts: 'Thought once', rows: [['Thinking', '0.2s']], reply: 'Noted: the fix/remote-thread-backlog thread finished its turn. Nothing needs you.' },
  { at: '11:55', news: true, took: '7.1s', counts: 'Used 2 tools, thought 2 times', rows: [['Thinking', '0.8s'], ['read_operation', '1.9s'], ['read_thread', '2.1s'], ['Thinking', '2.0s']],
    reply: 'The host-update thread answered my brief: it pushed the branch and CI is running. I will check back when CI ends.' },
  { at: '11:56', you: 'What is the update-all thread waiting on?', took: '10s', counts: 'Used 1 tool, thought 2 times', rows: [['Thinking', '0.5s'], ['read_thread', '1.4s'], ['Thinking', '1.1s']],
    reply: 'It is waiting on a permission to run the Playwright suite. Open it beside me to answer; I cannot answer for you.' },
  { at: '11:56', news: true, took: '6.1s', counts: 'Used 1 tool, thought once', rows: [['read_thread', '1.6s'], ['Thinking', '0.9s']], reply: 'The update-all thread got your permission and is running its suite.' },
  { at: '11:57', news: true, took: '7.3s', counts: 'Used 1 tool, thought once', rows: [['read_operation', '2.0s'], ['Thinking', '1.1s']], reply: 'CI went green on the host-update pull request. It is ready for your review.' },
  { at: '11:58', news: true, took: '3.0s', counts: 'Used 1 tool', rows: [['list_threads', '1.0s']], reply: null },
  { at: '11:59', you: 'Merge the host-update one if CI is green.', took: '27s', counts: 'Used 1 tool, thought 2 times', rows: [['Thinking', '0.8s'], ['send_thread', '1.0s'], ['Thinking', '0.6s']],
    reply: 'Sent it the merge. It will merge once its required checks pass and tell me.' },
  { at: '11:59', news: true, took: '4.4s', counts: 'Used 1 tool, thought once', rows: [['read_operation', '1.1s'], ['Thinking', '0.7s']], reply: 'The host-update pull request merged.' },
  { at: '12:00', news: true, took: '4.5s', counts: 'Used 1 tool', rows: [['read_thread', '1.5s']], reply: 'The backlog thread started its next turn on its own brief.' },
  { at: '12:00', you: 'Start a thread to look at why the Linux build is slow.', running: true, rows: [['Thinking', '1.0s'], ['ToolSearch', '0.6s'], ['list_projects', '0.4s'], ['Thinking', '0.9s'], ['Bash', 'Running 1s', true]] },
]

const VARIANTS = [
  ['now', 'As it ships', 'The news turns’ work stacks up at the bottom, below every reply. Each news reply joins your turn above it, so your own answer folds under “Worked for”.'],
  ['a', 'In place', 'Each news turn reads like a turn you started, without your bubble: its “Worked for” line, then its reply. A news turn with no reply keeps just its line.'],
  ['b', 'In the reply', 'A news reply has no line of its own. Its header says “After news · 7.1s” and opens the work under it. A news turn with no reply shows nothing.'],
  ['c', 'One line per run', 'News turns in a row share one work line above their replies. Opening it lists each turn’s work.'],
  ['d', 'Folded run', 'News turns in a row fold to one line, replies and all. Your own turns stay as they are.'],
]
let index = Math.max(0, VARIANTS.findIndex(v => v[0] === new URLSearchParams(location.search).get('variant')))
const open = new Set()

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const you = t => `<article class="msg" data-role="user"><header><span class="who">You</span><time>${t.at}</time></header><p>${esc(t.you)}</p></article>`
const reply = (t, extra = '') => `<article class="msg" data-role="assistant"><header><span class="who">${OWL}Watcher</span><time>${t.at}</time>${extra}</header><p>${esc(t.reply)}</p></article>`
const rows = list => `<ul class="rows">${list.map(([name, time, run]) => `<li><span>${esc(name)}</span><span class="${run ? 'run' : ''}">${time}</span></li>`).join('')}</ul>`
const toggle = (id, inner, cls = 'sum') => `<button class="${cls}" data-open="${id}" aria-expanded="${open.has(id)}">${inner}</button>`
// A finished turn's fold, as TurnWork draws it: headline only, a rule under it.
const fold = (id, headline, body) => `<section class="work">${toggle(id, `<span class="headline">${headline}</span>${CHEV}`)}${open.has(id) ? `<div>${body}</div>` : ''}</section>`
// A group on its own, as ActivityGroupView draws it: chevron, headline, counts.
const group = (id, t) => `<section class="group">${toggle(id, `${CHEV}<span class="headline">Worked for ${t.took}</span><span class="counts">${t.counts}</span>`)}${open.has(id) ? rows(t.rows) : ''}</section>`
const running = t => `${you(t)}<section class="group">${rows(t.rows)}</section>`
const liveLine = '<div class="live">Working for 7s · Bash</div>'
const userTurn = (t, i) => t.running ? running(t) : you(t) + fold(`u${i}`, `Worked for ${t.took}`, `<div class="group">${rows(t.rows)}</div>`) + reply(t)

function now() {
  // splitTurns joins each news reply to the user turn before it; the last written reply becomes the final one.
  let html = '', stack = ''
  const owners = []
  TURNS.forEach((t, i) => { if (!t.news) owners.push({ t, i, news: [] }); else owners.at(-1).news.push({ t, i }) })
  for (const { t, i, news } of owners) {
    if (t.running) { html += running(t); continue }
    const replies = news.filter(n => n.t.reply)
    const final = replies.at(-1)?.t ?? t
    const folded = [t, ...replies.slice(0, -1).map(n => n.t)].filter(x => x !== final)
    html += you(t) + fold(`u${i}`, `Worked for ${replies.length ? '1m 12s' : t.took}`, `<div class="group">${rows(t.rows)}</div>${folded.map(x => reply(x)).join('')}`) + reply(final)
    for (const n of news) stack += group(`n${n.i}`, n.t)
  }
  return html + stack + liveLine
}
function a() {
  return TURNS.map((t, i) => !t.news ? userTurn(t, i)
    : t.reply ? fold(`n${i}`, `Worked for ${t.took}`, `<div class="group">${rows(t.rows)}</div>`) + reply(t) : group(`n${i}`, t)).join('') + liveLine
}
function b() {
  return TURNS.map((t, i) => !t.news ? userTurn(t, i) : !t.reply ? ''
    : `<article class="msg" data-role="assistant"><header><span class="who">${OWL}Watcher</span><time>${t.at}</time>${toggle(`n${i}`, `After news · ${t.took}${CHEV}`, 'hdrbtn')}</header>${open.has(`n${i}`) ? `<div class="inner">${rows(t.rows)}</div>` : ''}<p>${esc(t.reply)}</p></article>`).join('') + liveLine
}
function runs() {
  const out = []
  TURNS.forEach((t, i) => { if (t.news && out.at(-1)?.news) out.at(-1).items.push({ t, i }); else out.push(t.news ? { news: true, items: [{ t, i }] } : { t, i }) })
  return out
}
const seconds = items => items.reduce((sum, { t }) => sum + parseFloat(t.took), 0).toFixed(1)
function c() {
  return runs().map(run => !run.news ? userTurn(run.t, run.i) : (() => {
    const id = `r${run.items[0].i}`, n = run.items.length
    const headline = n === 1 ? `Worked for ${run.items[0].t.took}` : `Worked on news ${n} times · ${seconds(run.items)}s`
    const body = run.items.map(({ t }) => `<div class="group"><div class="counts" style="color:var(--tt-text-muted);font-size:13px">${t.at} · ${t.took} · ${t.counts}</div>${rows(t.rows)}</div>`).join('')
    return fold(id, headline, body) + run.items.filter(({ t }) => t.reply).map(({ t }) => reply(t)).join('')
  })()).join('') + liveLine
}
function d() {
  return runs().map(run => !run.news ? userTurn(run.t, run.i) : (() => {
    const id = `r${run.items[0].i}`, replies = run.items.filter(({ t }) => t.reply)
    const headline = `${replies.length === 1 ? 'One reply' : `${replies.length} replies`} to news · ${run.items[0].t.at}–${run.items.at(-1).t.at}`
    const body = run.items.map(({ t, i }) => t.reply ? fold(`n${i}`, `Worked for ${t.took}`, `<div class="group">${rows(t.rows)}</div>`) + reply(t) : group(`n${i}`, t)).join('')
    return `<section class="group">${toggle(id, `${CHEV}<span class="headline">${headline}</span>`)}${open.has(id) ? `<div class="inner">${body}</div>` : ''}</section>`
  })()).join('') + liveLine
}
const RENDER = { now, a, b, c, d }

function draw() {
  const [key, name, note] = VARIANTS[index]
  document.getElementById('col').innerHTML = RENDER[key]()
  document.getElementById('label').textContent = `${key} — ${name}`
  document.getElementById('marker').textContent = note
  const url = new URL(location.href); url.searchParams.set('variant', key); history.replaceState(null, '', url)
}
const step = by => { index = (index + by + VARIANTS.length) % VARIANTS.length; open.clear(); draw(); const s = document.getElementById('scroll'); s.scrollTop = s.scrollHeight }
document.getElementById('prev').onclick = () => step(-1)
document.getElementById('next').onclick = () => step(1)
document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1) })
document.getElementById('col').addEventListener('click', e => {
  const b = e.target.closest('[data-open]'); if (!b) return
  const id = b.dataset.open; open.has(id) ? open.delete(id) : open.add(id); draw()
})
document.getElementById('theme').onclick = e => { const light = document.documentElement.dataset.theme !== 'light'; document.documentElement.dataset.theme = light ? 'light' : ''; e.target.setAttribute('aria-pressed', light) }
document.getElementById('small').onclick = e => { const app = document.getElementById('app'); const on = !app.hasAttribute('data-small'); app.toggleAttribute('data-small', on); e.target.setAttribute('aria-pressed', on) }
draw(); document.getElementById('scroll').scrollTop = 1e6
</script>
</body>
</html>
