<title>Owlets looks, prototype</title>
<!--
  PROTOTYPE — throwaway. Not shipped, not tested, not wired to anything. Every press changes memory only,
  and the page asks no other host for anything: the font is the file beside it.

  Question: how should Owlets look? Owlets are Sotto's own named helpers, its version of Grok Bot or
  Hermes Agent. Three looks, A, B and C, each after one reference, for Zach to pick from or take parts of
  (his ask on November 19, 2026: "three prototypes with how owlets will look. Use Grok Bot, Devin bots,
  and Hermes bots as examples").

  The looks differ in what they put first and in how an owlet is organised:
    A  after Grok Bot        Computers and screens. Owlets are grouped by the computer they live on, and
                             each has a screen you can watch. Open one for its chat beside its screen.
    B  after Devin Bots      Outcomes and Needs you. An owlet owns an outcome. The page opens on every
                             card waiting for you; an owlet opens on its work, grouped by where it stands.
    C  after Hermes Agent    One long chat and its pages. The owlets sit on a branch. Each has one chat
                             that never ends, its runs as tabs beside it, and routines docked next to it.

  The same four owlets, two changes waiting and reports are in all three (the sample data at the top of the script).
  One file on purpose, with the Figtree files beside it: the repository's lint reads every .js file, and this is not product code.

  The bar: look (← → cycle), jump to a screen, theme, window size, start again. Under 700px wide the window
  frame goes, the page is the iPhone app, and the caption is its short form until More is pressed. Add &bare=1 to any link to drop the bar and the caption.
-->

/* ==================== Shared: tokens, the prototype’s own controls, the window and phone chrome, and the parts every look draws the same way ==================== */
/*

 * Each look's own layout follows under its own heading, further down.

 */

  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
    U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Figtree';
  font-style: normal;
  font-weight: 300 900;
  font-display: swap;
  src: url('figtree-latin-ext.woff2') format('woff2');

    U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}

:root {
  color-scheme: dark;
  --tt-canvas: oklch(0.115 0.008 265);
  --tt-surface: oklch(0.145 0.008 265);
  --tt-raised: oklch(0.185 0.008 265);
  --tt-overlay: oklch(0.215 0.008 265);
  --tt-card: var(--tt-raised);
  --tt-well: var(--tt-canvas);
  --tt-sidebar: oklch(0.235 0.003 265);
  --tt-text: oklch(0.985 0.005 280);
  --tt-text-2: color-mix(in oklab, oklch(0.985 0.005 280) 55%, oklch(0.72 0.014 265));
  --tt-muted: oklch(0.72 0.014 265);
  --tt-hairline: oklch(0.305 0.02 265);
  --tt-field-border: oklch(0.42 0.02 265);
  --tt-accent: oklch(0.714403 0.104089 183.092);
  --tt-accent-text: oklch(0.83 0.08 183);
  --tt-on-accent: oklch(0.16 0.012 190);
  --tt-accent-surface: oklch(0.32 0.05 185);
  --tt-accent-wash: color-mix(in srgb, oklch(0.714403 0.104089 183.092) 14%, transparent);
  --tt-message: oklch(0.205 0.014 265);
  --tt-warning-text: oklch(0.829017 0.171221 81.038);
  --tt-warning-surface: oklch(0.315 0.032 80);
  --tt-error-text: oklch(0.702184 0.189226 22.228);
  --tt-success: oklch(0.79 0.13 165);
  --tt-hover: color-mix(in srgb, oklch(0.985 0.005 280) 7%, transparent);
  --tt-selected: color-mix(in oklab, oklch(0.714403 0.104089 183.092) 20%, oklch(0.185 0.008 265));
  --tt-scrim: rgb(0 0 0 / 55%);
  --tt-shadow: 0 18px 50px rgb(0 0 0 / 55%);
  --tt-font: 'Figtree', ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
  --tt-mono: ui-monospace, 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace;
}
:root[data-theme='light'] {
  color-scheme: light;
  --tt-canvas: oklch(0.978 0.004 85);
  --tt-surface: oklch(0.99 0.003 85);
  --tt-raised: oklch(0.955 0.006 85);
  --tt-overlay: oklch(0.99 0.003 85);
  --tt-card: color-mix(in oklab, oklch(0.978 0.004 85) 95%, oklch(0.235 0.014 75));
  --tt-well: var(--tt-canvas);
  --tt-sidebar: oklch(0.955 0.008 85);
  --tt-text: oklch(0.235 0.014 75);
  --tt-text-2: oklch(0.34 0.014 75);
  --tt-muted: oklch(0.47 0.014 75);
  --tt-hairline: oklch(0.86 0.012 80);
  --tt-field-border: oklch(0.72 0.016 80);
  --tt-accent: oklch(0.53 0.095 186);
  --tt-accent-text: oklch(0.42 0.08 186);
  --tt-on-accent: oklch(0.99 0.003 85);
  --tt-accent-surface: oklch(0.92 0.03 186);
  --tt-accent-wash: color-mix(in srgb, oklch(0.53 0.095 186) 12%, transparent);
  --tt-message: oklch(0.93 0.012 85);
  --tt-warning-text: oklch(0.47 0.14 50);
  --tt-warning-surface: oklch(0.955 0.018 80);
  --tt-error-text: oklch(0.48 0.2 28);
  --tt-success: oklch(0.45 0.12 160);
  --tt-hover: color-mix(in srgb, oklch(0.235 0.014 75) 7%, transparent);
  --tt-selected: color-mix(in oklab, oklch(0.53 0.095 186) 16%, oklch(0.955 0.006 85));
  --tt-scrim: rgb(0 0 0 / 30%);
  --tt-shadow: 0 18px 50px rgb(0 0 0 / 18%);
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #16171b; font-family: var(--tt-font); -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4, p, ul, ol, dl, dd, pre { margin: 0; padding: 0; }
ul, ol { list-style: none; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ============ the prototype's own controls: not part of any look ============ */
.stage { height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(440px, 1fr); justify-items: center; gap: 8px; padding: 10px 12px 78px; }
.cap { max-width: 1180px; width: 100%; font: 13px/1.45 system-ui, sans-serif; color: #cfd1d9; }
.cap strong { color: #fff; }
.cap .cap__rule { color: #a9acb8; }
.bar { position: fixed; left: 0; right: 0; bottom: 12px; margin: 0 auto; width: max-content; z-index: 90; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; padding: 8px; max-width: calc(100vw - 16px); background: #0d0e11; color: #eee; border: 1px solid #454752; border-radius: 12px; font: 13px system-ui, sans-serif; box-shadow: 0 6px 24px rgb(0 0 0 / 50%); }
.bar button, .bar select { min-height: 36px; padding: 4px 10px; border-radius: 8px; border: 1px solid #454752; background: #1b1c21; color: #eee; font: inherit; }
.bar .lab { min-width: 172px; text-align: center; font-weight: 600; padding: 0 4px; }
.bar :focus-visible { outline: 2px solid #7fe0d0; outline-offset: 1px; }
.bar .sep { width: 1px; align-self: stretch; background: #454752; margin: 0 2px; }
.cap__more { border: 0; background: none; padding: 0 2px; color: #7fe0d0; font: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.cap__more:focus-visible { outline: 2px solid #7fe0d0; outline-offset: 2px; }

.win { position: relative; width: 100%; height: 100%; min-height: 440px; background: var(--tt-canvas); color: var(--tt-text); font-size: 14px; line-height: 1.45; border: 1px solid #000; overflow: hidden; display: flex; flex-direction: column; container-type: inline-size; container-name: win; }
.stage[data-size='1600x1000'] .win { width: 1600px; height: 1000px; }
.stage[data-size='1280x800'] .win { width: 1280px; height: 800px; }
.stage[data-size='820x560'] .win { width: 820px; height: 560px; }
.stage[data-size='390x844'] .win { width: 390px; height: 844px; border-radius: 34px; border: 0; box-shadow: 0 0 0 9px #050506, 0 0 0 10px #3a3b42; margin: 10px 0; }
.stage:not([data-size='fit']) { justify-items: start; overflow-x: auto; }
.stage:not([data-size='fit']) .win { justify-self: center; flex: none; }
.stage:not([data-size='fit']) { grid-template-rows: auto auto; height: auto; min-height: 100dvh; align-content: start; }

/* bare: the window is the whole viewport, for checking a look at an exact size */
body[data-bare='true'] .stage { padding: 0; gap: 0; grid-template-rows: 1fr; min-height: 100dvh; height: 100dvh; }
body[data-bare='true'] .cap, body[data-bare='true'] .bar { display: none; }
body[data-bare='true'] .win { width: 100vw; height: 100dvh; min-height: 0; border: 0; border-radius: 0; box-shadow: none; margin: 0; }

@media (max-width: 700px) {
  .stage, .stage:not([data-size='fit']) { padding: 0; gap: 0; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100dvh; min-height: 0; overflow: hidden; justify-items: stretch; }
  .stage .win, .stage[data-size] .win { width: 100%; height: 100%; min-height: 0; border: 0; border-radius: 0; box-shadow: none; margin: 0; }
  .top { display: flex; flex-direction: column; min-width: 0; background: #0d0e11; border-bottom: 1px solid #454752; }
  .bar { position: static; margin: 0; width: auto; max-width: none; border: 0; border-radius: 0; box-shadow: none; padding: 6px 8px 4px; justify-content: flex-start; flex-wrap: nowrap; min-width: 0; }
  .bar button, .bar select { min-height: 44px; min-width: 44px; flex: none; font-size: 16px; }
  .bar .lab { min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .bar .size, .bar .sep, .bar .reset { display: none; }
  .bar .jump { width: 104px; }
  .cap { padding: 0 10px 8px; font-size: 12px; line-height: 1.4; max-width: none; }
  body[data-bare='true'] .top { display: none; }
  body[data-bare='true'] .stage { grid-template-rows: minmax(0, 1fr); }
}
.top { width: 100%; display: flex; justify-content: center; }

/* ============ focus, text helpers ============ */
.win :focus-visible { outline: 2px solid var(--tt-accent); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--tt-muted); }
.t2 { color: var(--tt-text-2); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.mono { font-family: var(--tt-mono); font-size: 0.92em; }
.grow { flex: 1; min-width: 0; }
.clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wrap { overflow-wrap: anywhere; }

/* ============ window chrome: one room under a thin strip ============ */
.strip { flex: none; height: 36px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 10px; color: var(--tt-muted); font-size: 13px; }
.strip__mark { display: flex; align-items: center; gap: 8px; color: var(--tt-text-2); font-weight: 600; }
.strip__mark svg { width: 18px; height: 18px; }
.switch { display: flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--tt-surface); }
.switch span { padding: 3px 12px; border-radius: 7px; }
.switch .on { background: var(--tt-overlay); color: var(--tt-text); font-weight: 600; }
.strip__ctl { justify-self: end; display: flex; gap: 16px; padding-right: 4px; font-size: 13px; }
.room { flex: 1; min-height: 0; display: flex; flex-direction: column; }
@container win (max-width: 900px) { .strip__mark span { display: none; } }

/* ============ phone chrome: the iPhone app's page over its tab bar ============ */
.win[data-phone='true'] { font-size: 16px; line-height: 1.4; }
.ph { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.ph__body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.ph__tabs { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); padding: 6px 8px max(8px, env(safe-area-inset-bottom)); background: var(--tt-surface); border-top: 1px solid var(--tt-hairline); }
.ph__tabs span { display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--tt-muted); padding: 4px 0; }
.ph__tabs span svg { width: 22px; height: 22px; }
.ph__tabs .on { color: var(--tt-accent-text); font-weight: 600; }
.ph__nav { flex: none; display: flex; align-items: center; gap: 6px; min-height: 52px; padding: 6px 10px; }
.ph__nav h1 { font-size: 17px; font-weight: 650; }
.ph__meta { flex: none; display: flex; gap: 10px; align-items: center; padding: 0 16px 8px; font-size: 13px; color: var(--tt-muted); min-width: 0; }
.ph__big { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
.ph__scroll { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; }

/* ============ shared parts ============ */
.btn { min-height: 32px; padding: 5px 14px; border-radius: 8px; border: 1px solid var(--tt-field-border); background: transparent; font-size: 13px; font-weight: 550; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { background: var(--tt-hover); }
.btn--primary { background: var(--tt-accent); color: var(--tt-on-accent); border-color: transparent; font-weight: 650; }
.btn--primary:hover { background: var(--tt-accent); filter: brightness(1.08); }
.btn--quiet { border-color: transparent; color: var(--tt-text-2); }
.btn--link { border: 0; padding: 0; min-height: 0; color: var(--tt-accent-text); text-decoration: underline; text-underline-offset: 2px; background: none; font-weight: 500; white-space: normal; text-align: left; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.win[data-phone='true'] .btn { min-height: 44px; font-size: 15px; padding: 8px 16px; border-radius: 10px; }
.win[data-phone='true'] .btn--link { min-height: 0; padding: 0; }
.iconbtn { width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; display: inline-grid; place-items: center; color: var(--tt-text-2); flex: none; }
.iconbtn:hover { background: var(--tt-hover); }
.iconbtn svg { width: 18px; height: 18px; }
.win[data-phone='true'] .iconbtn { width: 44px; height: 44px; }
.win[data-phone='true'] .iconbtn svg { width: 22px; height: 22px; }

.owltag { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--tt-hairline); color: var(--tt-muted); vertical-align: middle; letter-spacing: 0; }
.idea { display: inline-block; font-size: 11px; font-weight: 600; line-height: 1.3; padding: 1px 6px; border-radius: 999px; border: 1px dashed var(--tt-field-border); color: var(--tt-muted); vertical-align: 1px; white-space: nowrap; }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--tt-muted); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--tt-field-border); flex: none; }
.chip--working { color: var(--tt-accent-text); }
.chip--working i { background: var(--tt-accent); animation: pulse 1.6s ease-in-out infinite; }
.chip--needs { color: var(--tt-warning-text); }
.chip--needs i { background: var(--tt-warning-text); border-radius: 2px; transform: rotate(45deg); }
@keyframes pulse { 50% { opacity: 0.35; } }

.owl { flex: none; display: block; }
.owl .b { fill: color-mix(in oklab, var(--tt-text) 26%, var(--tt-canvas)); }
.owl .f { fill: color-mix(in oklab, var(--tt-text) 44%, var(--tt-canvas)); }
.owl .e { fill: var(--tt-canvas); }
.owl .p { fill: var(--tt-text); }
.owl .k { fill: var(--tt-warning-text); }
.owl .z { stroke: var(--tt-text-2); stroke-width: 1.6; fill: none; stroke-linecap: round; }
.owl[data-state='working'] .p { fill: var(--tt-accent); }

.card { background: var(--tt-card); border-radius: 14px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--tt-muted); }
.kv dd { overflow-wrap: anywhere; }

/* the change card: what will be sent, in full, and the two answers */
.req { background: var(--tt-card); border-radius: 14px; padding: 14px 16px 12px; display: grid; gap: 10px; box-shadow: inset 3px 0 0 var(--tt-warning-text); }
.req h3 { font-size: 15px; font-weight: 650; }
.req__by { font-size: 13px; color: var(--tt-muted); margin-top: 1px; }
.req__body { font-family: var(--tt-font); font-size: 14px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--tt-well); border-radius: 10px; padding: 10px 12px; color: var(--tt-text); }
.req__note { font-size: 13px; color: var(--tt-text-2); }
.req__foot { font-size: 12px; color: var(--tt-muted); }
.req--q { box-shadow: inset 3px 0 0 var(--tt-accent); }
.req__opts { display: grid; gap: 6px; }
.opt { display: grid; gap: 1px; text-align: left; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--tt-field-border); background: var(--tt-well); min-height: 44px; }
.opt:hover { background: var(--tt-hover); }
.opt strong { font-weight: 600; font-size: 14px; }
.opt span { font-size: 13px; color: var(--tt-muted); }
.opt em { font-style: normal; font-size: 12px; color: var(--tt-accent-text); font-weight: 600; }
.answered { font-size: 13px; color: var(--tt-text-2); padding: 8px 12px; border-radius: 10px; background: var(--tt-card); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.win[data-phone='true'] .req h3 { font-size: 17px; }
.win[data-phone='true'] .req__body { font-size: 16px; }
.win[data-phone='true'] .req .btnrow .btn { flex: 1 1 140px; }

/* a report from a run */
.report { background: var(--tt-card); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; }
.report__label { font-size: 12px; font-weight: 600; color: var(--tt-accent-text); }
.report h3 { font-size: 16px; font-weight: 650; }
.report__meta { font-size: 13px; color: var(--tt-muted); }
.report__sum { font-size: 14px; color: var(--tt-text); }
.report h4 { font-size: 13px; font-weight: 600; color: var(--tt-muted); margin-bottom: 4px; }
.report li { position: relative; padding: 2px 0 2px 14px; font-size: 14px; overflow-wrap: anywhere; }
.report li::before { content: ''; position: absolute; left: 2px; top: 0.72em; width: 4px; height: 4px; border-radius: 50%; background: var(--tt-muted); }
.report__did { font-size: 13px; color: var(--tt-text-2); border-top: 1px solid var(--tt-well); padding-top: 8px; display: flex; flex-wrap: wrap; gap: 2px 14px; }
.report__did b { font-weight: 600; color: var(--tt-muted); }
.win[data-phone='true'] .report li, .win[data-phone='true'] .report__sum { font-size: 16px; }

/* a conversation */
.talk { display: grid; gap: 14px; align-content: start; }
.msg p { overflow-wrap: anywhere; }
.msg--you { justify-self: end; max-width: 86%; background: var(--tt-message); border-radius: 14px; padding: 8px 12px; }
.msg--owl .msg__who { font-size: 13px; font-weight: 650; color: var(--tt-text-2); margin-bottom: 2px; }
.msg__who span, .msg__at { font-weight: 400; font-size: 12px; color: var(--tt-muted); margin-left: 6px; }
.msg--you .msg__at { display: block; margin: 2px 0 0; text-align: right; }
.msg__noted { font-size: 12px; color: var(--tt-muted); margin-top: 4px; }
.day { text-align: center; font-size: 12px; color: var(--tt-muted); }
.steps { display: grid; gap: 2px; font-size: 13px; color: var(--tt-muted); }
.steps li { display: flex; gap: 8px; align-items: baseline; }
.steps li::before { content: ''; flex: none; width: 5px; height: 5px; border-radius: 50%; border: 1px solid var(--tt-muted); transform: translateY(-1px); }
.steps li.live { color: var(--tt-accent-text); }
.steps li.live::before { background: var(--tt-accent); border-color: var(--tt-accent); animation: pulse 1.6s ease-in-out infinite; }
.composer { display: flex; align-items: center; gap: 6px; background: var(--tt-card); border-radius: 14px; padding: 6px 6px 6px 14px; }
.composer input { flex: 1; min-width: 0; min-height: 32px; border: 0; background: transparent; outline-offset: 4px; }
.composer input::placeholder { color: var(--tt-muted); opacity: 1; }
.win[data-phone='true'] .composer input { min-height: 40px; font-size: 16px; }

/* a switch, a field */
.sw { flex: none; position: relative; width: 36px; height: 20px; border-radius: 10px; border: 1px solid var(--tt-field-border); background: var(--tt-well); padding: 0; }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--tt-muted); transition: transform 0.12s; }
.sw[aria-checked='true'] { background: var(--tt-accent); border-color: transparent; }
.sw[aria-checked='true']::after { transform: translateX(16px); background: var(--tt-on-accent); }
.win[data-phone='true'] .sw { width: 50px; height: 30px; border-radius: 15px; }
.win[data-phone='true'] .sw::after { width: 24px; height: 24px; }

/*
 * PROTOTYPE — throwaway. State, the URL, the prototype's bar, and the parts every look draws the
 * same way. Each look registers itself in VARIANTS under its own heading below and owns its whole room.
 *
 * URL: ?variant=A|B|C &screen=page|owlet|setup &owlet=<id> &tab=<id> &open=<layer> &theme=dark|light
 *      &size=fit|1600x1000|1280x800|820x560|390x844 &at=end &bare=1 (no bar or caption: the window is the viewport)
 */

const VARIANTS = {};
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const owletById = (id) => OWLETS.find((o) => o.id === id);

const Q = new URLSearchParams(location.search);
const S = {
  variant: ['A', 'B', 'C'].includes((Q.get('variant') || '').toUpperCase()) ? Q.get('variant').toUpperCase() : 'A',
  screen: ['page', 'owlet', 'setup'].includes(Q.get('screen')) ? Q.get('screen') : 'page',
  owlet: owletById(Q.get('owlet')) ? Q.get('owlet') : null,
  tab: Q.get('tab'),
  open: Q.get('open'),
  at: Q.get('at'),
  edit: owletById(Q.get('edit')) ? Q.get('edit') : null,
  theme: Q.get('theme') === 'light' ? 'light' : 'dark',
  size: ['fit', '1600x1000', '1280x800', '820x560', '390x844'].includes(Q.get('size')) ? Q.get('size') : 'fit',
  bare: Q.has('bare'),
  more: false,

  sent: {},
  flags: {},
  form: null,

};

/* An owlet's face. The shape is its look; the eyes say what it is doing. Colour is the theme's. */
function owl(look, state, size = 28) {
  const heads = {
    round: 'M4 17c0-8 5-13 12-13s12 5 12 13-5 12-12 12S4 25 4 17z',
    tufts: 'M4 4l6.5 4.5c1.7-.7 3.5-1 5.5-1s3.8.3 5.5 1L28 4v14c0 7-5 11-12 11S4 25 4 18z',
    small: 'M6 18c0-7 4-11.5 10-11.5S26 11 26 18s-4 10.5-10 10.5S6 25 6 18z',
    heart: 'M16 7.5c3.5-4.5 12-3 12 6C28 22 22 28 16 29 10 28 4 22 4 13.5c0-9 8.5-10.5 12-6z',
  };
  const r = look === 'small' ? 5.2 : 4.7;
  const eyes =
    state === 'idle'
      ? '<path class="z" d="M8 16.5q3 2.6 6 0M18 16.5q3 2.6 6 0"/>'
      : `<circle class="e" cx="11" cy="16" r="${r}"/><circle class="e" cx="21" cy="16" r="${r}"/><circle class="p" cx="11" cy="16" r="${state === 'needs' ? 2.7 : 2.2}"/><circle class="p" cx="21" cy="16" r="${state === 'needs' ? 2.7 : 2.2}"/>`;
  const badge = state === 'needs' ? '<path class="k" d="M27 1.5l3.5 3.5L27 8.5 23.5 5z"/>' : '';
  return `<svg class="owl" data-state="${state}" width="${size}" height="${size}" viewBox="0 0 32 32" aria-hidden="true"><path class="b" d="${heads[look] || heads.round}"/>${eyes}<path class="f" d="M14.4 20h3.2L16 23.2z"/>${badge}</svg>`;
}

/* ---------- what an owlet is doing, given what has been answered in this sitting ---------- */
const pendingOf = (o) => [o.change, o.question].filter((id) => id && !S.answers[id]);
function statusOf(o) {
  if (o.status === 'working') return 'working';
  if (o.status === 'needs') return pendingOf(o).length ? 'needs' : 'idle';
  return 'idle';
}
function lineOf(o) {
  const st = statusOf(o);
  if (o.status === 'needs' && st === 'idle') return 'Nothing is waiting';
  return o.line;
}
const chip = (o) => {
  const st = statusOf(o);
  return `<span class="chip chip--${st}"><i></i>${STATUS[st].label}</span>`;
};
const needsNote = (o) => {
  const n = pendingOf(o).length;
  return o.status === 'working' && n ? `<span class="chip chip--needs"><i></i>${n} need${n === 1 ? 's' : ''} you</span>` : '';
};
const homeName = (o) => COMPUTERS[o.home].name;
const acctLabel = (id) => `${ACCOUNTS[id].plugin} · ${ACCOUNTS[id].name}`;
const idea = (text = 'Idea') => `<span class="idea">${esc(text)}</span>`;
const spark = (days) => {
  const max = Math.max(1, ...days);
  return `<span class="spark" aria-hidden="true">${days.map((d) => `<i class="${d ? 'on' : ''}" style="height:${d ? Math.round(4 + (d / max) * 14) : 2}px"></i>`).join('')}</span>`;
};

/* ---------- the change card: every word that will be sent, and the two answers ---------- */
function changeCard(id, foot = '') {
  const c = CHANGES[id];
  const o = owletById(c.owlet);
  const a = S.answers[id];
  if (a) {
    return `<p class="answered" tabindex="-1" data-key="ans-${id}"><span>${esc(a === 'allowed' ? c.allowed : c.denied)}</span><button class="btn--link" data-act="unanswer" data-id="${id}" data-key="un-${id}">Show the card again (prototype)</button></p>`;
  }
  return `<section class="req" aria-labelledby="req-${id}" data-req="${id}">
    <div><h3 id="req-${id}">${esc(c.title)}</h3>
    <p class="req__by">${esc(o.name)} asks, on ${esc(homeName(o))} · ${esc(c.asked)} · with ${esc(c.account)}</p></div>
    <dl class="kv">${c.rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    <pre class="req__body">${esc(c.body)}</pre>
    <p class="req__note">${c.kind === 'mail' ? 'Nothing is sent' : 'Nothing is posted'} until you press ${esc(c.allow)}. Only you can answer this.</p>
    <div class="btnrow"><button class="btn btn--primary" data-act="allow" data-id="${id}" data-key="allow-${id}">${esc(c.allow)}</button><button class="btn" data-act="deny" data-id="${id}" data-key="deny-${id}">${esc(c.deny)}</button></div>
    ${foot ? `<p class="req__foot">${foot}</p>` : ''}
  </section>`;
}

function questionCard(id) {
  const q = QUESTIONS[id];
  const a = S.answers[id];
  if (a) {
    const picked = q.options.find((x) => x.id === a);
    return `<p class="answered" tabindex="-1" data-key="ans-${id}"><span>${picked ? `You answered: ${esc(picked.label)}.` : 'You skipped this question.'}</span><button class="btn--link" data-act="unanswer" data-id="${id}" data-key="un-${id}">Show the card again (prototype)</button></p>`;
  }
  return `<section class="req req--q" aria-labelledby="req-${id}" data-req="${id}">
    <div><h3 id="req-${id}">${esc(q.title)}</h3><p class="req__by">On ${esc(homeName(owletById(q.owlet)))} · ${esc(q.asked)}</p></div>
    <p>${esc(q.text)}</p>
    <div class="req__opts">${q.options
      .map((x) => `<button class="opt" data-act="answer" data-id="${id}" data-opt="${x.id}" data-key="opt-${id}-${x.id}"><strong>${esc(x.label)}</strong><span>${esc(x.note)}</span>${x.recommended ? `<em>${esc(owletById(q.owlet).name)} suggests this</em>` : ''}</button>`)
      .join('')}</div>
    <div class="btnrow"><button class="btn btn--quiet" data-act="answer" data-id="${id}" data-opt="skipped" data-key="skip-${id}">Skip</button></div>
  </section>`;
}

/* ---------- a report from a run ---------- */
function reportCard(o, opts = {}) {
  const r = o.report;
  return `<article class="report" aria-label="Report: ${esc(r.title)}">
    <div>${opts.label === false ? '' : `<p class="report__label">${esc(opts.label || 'While you were away')}</p>`}
    <h3>${esc(r.title)}</h3>
    <p class="report__meta">${esc(r.when)} · ran on ${esc(r.on)} · took ${esc(r.took)}</p></div>
    <p class="report__sum">${esc(r.summary)}</p>
    ${r.groups.map((g) => `<div><h4>${esc(g.h)}</h4><ul>${g.items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}
    <p class="report__did"><b>What it did</b>${r.did.map((d) => `<span>${esc(d)}</span>`).join('')}</p>
    ${opts.after || ''}
  </article>`;
}

/* ---------- a conversation, from the owlet's sample chat plus anything typed in this sitting ---------- */
function talk(o, opts = {}) {
  const parts = o.chat.map((m) => {
    if (m.who === 'day') return `<p class="day">${esc(m.text)}</p>`;
    if (m.who === 'you') return `<div class="msg msg--you"><p>${esc(m.text)}</p><span class="msg__at">${esc(m.at)}</span></div>`;
    if (m.who === 'owlet') return `<div class="msg msg--owl"><p class="msg__who">${esc(o.name)}<span>${esc(m.at)}</span></p><p>${esc(m.text)}</p>${m.noted ? `<p class="msg__noted">${esc(m.noted)} ${idea()}</p>` : ''}</div>`;
    if (m.who === 'steps') return `<ul class="steps" aria-label="Steps">${m.items.map((s, i) => `<li class="${m.live && i === m.items.length - 1 ? 'live' : ''}">${esc(s)}</li>`).join('')}</ul>`;
    if (m.who === 'report') return reportCard(o, opts.report || {});
    if (m.who === 'change') return changeCard(m.id, opts.changeFoot || '');
    if (m.who === 'question') return questionCard(m.id);
    return '';
  });
  (S.sent[o.id] || []).forEach((t) => {
    parts.push(`<div class="msg msg--you"><p>${esc(t)}</p><span class="msg__at">Now</span></div>`);
    parts.push(`<div class="msg msg--owl"><p class="msg__who">${esc(o.name)}<span>Now</span></p><p class="muted">This is a prototype, so ${esc(o.name)} has no answer. Nothing left this page.</p></div>`);
  });
  return `<div class="talk">${parts.join('')}</div>`;
}
const composer = (o, label) =>
  `<form class="composer" data-form="say" data-owlet="${o.id}"><input type="text" name="say" autocomplete="off" aria-label="${esc(label || `Message ${o.name}`)}" placeholder="${esc(label || `Message ${o.name}`)}" data-key="say-${o.id}"><button class="btn btn--primary" type="submit" aria-label="Send the message to ${esc(o.name)}" data-key="send-${o.id}">${ic('send')}<span>Send</span></button></form>`;

/* ---------- the setup form's sample state, shared so each look lays it out its own way ---------- */
function formFor(id) {
  const o = id ? owletById(id) : null;
  if (S.form && S.form.id === (id || 'new')) return S.form;
  S.form = o
    ? { id, name: o.name, look: o.look, title: o.title, role: o.role, outcome: o.outcome, home: o.home, model: o.model, accounts: [...o.accounts], runs: o.routines.length ? 'routine' : 'asked', words: o.routines[0] ? o.routines[0].words : '', template: null, cap: String(o.limit.cap) }
    : { id: 'new', name: '', look: 'round', title: '', role: '', outcome: '', home: 'here', model: COMPUTERS.here.models[0], accounts: [], runs: 'asked', words: '', template: 'blank', cap: '10' };

}
/* What the plain words of a schedule are read as. A fixed table: the prototype only shows the idea. */
function readSchedule(words) {
  const w = (words || '').trim().toLowerCase();
  const table = {
    'weekdays at 7:30am': ['Monday to Friday at 7:30 am', 'Friday, 7:30 am'],
    'every day at 6pm': ['Every day at 6:00 pm', 'Today, 6:00 pm'],
    'every monday 9am': ['Every Monday at 9:00 am', 'Monday, 9:00 am'],
    'when ci on main goes red': ['Each time CI on main goes red', 'Waits for a red run'],
    'when a new issue opens': ['Each time a new issue opens', 'Waits for an issue'],
  };
  if (!w) return null;
  return table[w] || ['Sotto would say here how it read your words', 'and when the next run is'];
}

/* ---------- state, URL, render ---------- */
function syncUrl() {
  const u = new URL(location.href);
  const put = (k, v, dflt) => (v == null || v === dflt ? u.searchParams.delete(k) : u.searchParams.set(k, v));
  put('variant', S.variant);
  put('screen', S.screen, 'page');
  put('owlet', S.owlet);
  put('tab', S.tab);
  put('open', S.open);
  put('at', S.at);
  put('edit', S.edit);
  put('theme', S.theme, 'dark');
  put('size', S.size, 'fit');
  history.replaceState(null, '', u);
}
const isPhone = () => $('#win').clientWidth <= 700;

function render(focusSel) {
  const v = VARIANTS[S.variant];
  const win = $('#win');
  const active = document.activeElement;
  const hadFocus = !!(active && win.contains(active));
  const keep = hadFocus ? active.getAttribute('data-key') : null;
  const scrolls = {};
  $$('[data-scroll]', win).forEach((el) => (scrolls[el.dataset.scroll] = el.scrollTop));
  document.documentElement.dataset.theme = S.theme;
  document.body.dataset.bare = String(S.bare);
  $('#stage').dataset.size = S.size;
  const phone = isPhone();
  win.dataset.phone = String(phone);
  win.dataset.variant = S.variant;
  if (!S.owlet && S.screen === 'owlet') S.owlet = v.first;
  const room = v.view(S, phone);
  const layer = v.layer ? v.layer(S, phone) : '';
  win.innerHTML =
    (phone
      ? `<div class="ph"><div class="ph__body">${room}</div><div class="ph__tabs" aria-label="Sotto’s pages. Only Owlets is drawn."><span>${ic('list')}Threads</span><span>${ic('eye')}Watcher</span><span class="on">${ic('owl')}Owlets</span></div></div>`
      : `<div class="strip" aria-label="Sotto’s window. Only the Owlets page is drawn."><span class="strip__mark">${ic('owl')}<span>Sotto Owl</span></span><div class="switch"><span>Dictate</span><span>Watcher</span><span>Threads</span><span class="on">Owlets</span></div><span class="strip__ctl" aria-hidden="true"><span>–</span><span>▢</span><span>✕</span></span></div><div class="room">${room}</div>`) +
    layer;
  $('#toast').textContent = S.toast;
  $$('[data-scroll]', win).forEach((el) => {
    if (scrolls[el.dataset.scroll] != null) el.scrollTop = scrolls[el.dataset.scroll];
    else if (S.at === 'end' && el.hasAttribute('data-stick')) el.scrollTop = el.scrollHeight;
  });
  if (S.at === 'card') {
    const card = $('[data-req]', win);
    if (card) card.scrollIntoView({ block: 'center' });
  }
  const layerEl = $('.layer', win);
  let target = (focusSel && $(focusSel, win)) || (keep && $(`[data-key="${keep}"]`, win));
  // an open layer keeps the focus inside it, whatever was focused under it
  if (layerEl && target && !layerEl.contains(target)) target = null;
  if (target) target.focus({ preventScroll: !focusSel });
  else if (layerEl) {
    const first = $('.layer [data-first]', win) || $('.layer button, .layer input, .layer select, .layer textarea', win);
    if (first) first.focus();
  } else if (hadFocus) {
    // what was focused is gone: go to the new screen's first sensible control, never back to the page's top
    const auto = $('[data-autofocus], [data-first]', win);
    if (auto) auto.focus({ preventScroll: true });
  }
  // the bar and the caption. On a phone the caption is its short form until More is pressed.
  const small = window.matchMedia('(max-width: 700px)').matches;
  $('#lab').textContent = small ? `${S.variant} · ${v.short}` : `${S.variant} · ${v.name}`;
  const rule = '<span class="cap__rule">Parts marked <b>Idea</b> are not decided. All of it is sample data: nothing is read or sent.</span>';
  $('#cap').innerHTML =
    small && !S.more
      ? `<strong>${S.variant} · ${esc(v.ref)}.</strong> ${v.brief} <button type="button" class="cap__more" id="more" aria-expanded="false">More</button>`
      : `<strong>${S.variant} · ${esc(v.ref)}.</strong> ${v.caption} ${rule}${small ? ' <button type="button" class="cap__more" id="more" aria-expanded="true">Less</button>' : ''}`;
  $('#theme').textContent = S.theme === 'dark' ? 'Light' : 'Dark';
  $('#theme').setAttribute('aria-label', S.theme === 'dark' ? 'Switch to the light theme' : 'Switch to the dark theme');
  $('#size').value = S.size;
  $('#jump').value = '';
  document.title = `Owlets looks · ${S.variant} · ${v.name}`;
  syncUrl();
}
function go(patch, focusSel) {
  Object.assign(S, patch);
  render(focusSel);
}
function closeLayer() {
  const back = S.opener;
  S.opener = null;
  go({ open: null }, back ? `[data-key="${back}"]` : null);
}
function cycle(delta) {
  const keys = Object.keys(VARIANTS);
  const next = keys[(keys.indexOf(S.variant) + delta + keys.length) % keys.length];
  go({ variant: next, screen: 'page', owlet: null, tab: null, open: null, at: null, edit: null, form: null });
}

function parseSet(str) {
  const out = {};
  new URLSearchParams(str).forEach((v, k) => (out[k] = v === 'null' ? null : v));
  return out;
}

document.addEventListener('click', (e) => {
  const win = $('#win');
  const el = e.target.closest('[data-set], [data-act]');
  if (!el || !win.contains(el)) {
    // a press on the scrim closes the layer
    if (e.target.classList && e.target.classList.contains('layer')) closeLayer();
    return;
  }
  if (el.dataset.set != null) {
    const patch = parseSet(el.dataset.set);
    // remember what opened a layer, so closing it can hand the focus back
    if (patch.open && !S.open) S.opener = el.getAttribute('data-key');
    if (patch.screen && patch.screen !== S.screen) S.form = patch.screen === 'setup' ? null : S.form;
    go(patch, el.dataset.focus || null);
    return;
  }
  const act = el.dataset.act;
  const id = el.dataset.id;
  if (act === 'allow' || act === 'deny') {
    S.answers[id] = act === 'allow' ? 'allowed' : 'denied';
    S.toast = act === 'allow' ? CHANGES[id].allowed : CHANGES[id].denied;
    render(`[data-key="ans-${id}"]`);
  } else if (act === 'answer') {
    S.answers[id] = el.dataset.opt;
    render(`[data-key="ans-${id}"]`);
  } else if (act === 'unanswer') {
    delete S.answers[id];
    render(`[data-req="${id}"] button`);
  } else if (act === 'switch') {
    const on = el.getAttribute('aria-checked') !== 'true';
    el.setAttribute('aria-checked', String(on));
    S.flags[el.dataset.flag] = on;
  } else if (act === 'close') {
    closeLayer();
  } else if (VARIANTS[S.variant].act) {
    VARIANTS[S.variant].act(act, el);
  }
});

document.addEventListener('submit', (e) => {
  const f = e.target;
  if (!f.dataset || !f.dataset.form) return;
  e.preventDefault();
  if (f.dataset.form === 'say') {
    const text = f.elements.say.value.trim();
    if (!text) return;
    (S.sent[f.dataset.owlet] ||= []).push(text);
    render(`[data-key="say-${f.dataset.owlet}"]`);
    const stick = $('[data-stick]');
    if (stick) stick.scrollTop = stick.scrollHeight;
  } else if (f.dataset.form === 'setup') {
    const name = (S.form && S.form.name) || 'The owlet';
    S.toast = S.edit ? `${name} is saved. This is a prototype, so nothing was kept.` : `${name} is made. This is a prototype, so nothing was kept.`;
    go({ screen: S.edit ? 'owlet' : 'page', owlet: S.edit || null, edit: null, open: null, form: null });
  }
});

/* setup fields write into S.form without a redraw, except the ones that change what is offered */
document.addEventListener('input', (e) => {
  const el = e.target;
  if (!el.dataset || !el.dataset.f || !S.form) return;
  const f = el.dataset.f;
  if (f === 'accounts') {
    const set = new Set(S.form.accounts);
    el.checked ? set.add(el.value) : set.delete(el.value);
    S.form.accounts = [...set];
    return;
  }
  S.form[f] = el.value;
  if (f === 'home') {
    S.form.model = COMPUTERS[el.value].models[0];
    S.form.accounts = S.form.accounts.filter((a) => COMPUTERS[el.value].accounts.includes(a));
    render(`[data-key="${el.getAttribute('data-key')}"]`);
  } else if (f === 'runs' || f === 'template' || f === 'look') {
    if (f === 'template') {
      const t = TEMPLATES.find((x) => x.id === el.value);
      Object.assign(S.form, { title: t.title, role: t.role, outcome: t.outcome, words: t.when, runs: t.when ? 'routine' : 'asked' });
    }
    render(`[data-key="${el.getAttribute('data-key')}"]`);
  } else if (f === 'words') {
    const out = $('#read-words');
    const r = readSchedule(el.value);
    if (out) out.innerHTML = r ? `Sotto reads this as: <b>${esc(r[0])}</b>. Next: ${esc(r[1])}.` : 'Say when in your own words.';
  }
});

document.addEventListener('keydown', (e) => {
  const win = $('#win');
  const hasLayer = !!$('.layer', win);
  if (e.key === 'Escape') {
    if (S.open) {
      e.preventDefault();
      closeLayer();
    } else if (VARIANTS[S.variant].escape && VARIANTS[S.variant].escape()) {
      e.preventDefault();
    }
    return;
  }
  if (e.key === 'Tab' && hasLayer) {
    const items = $$('.layer button, .layer input, .layer select, .layer textarea, .layer [tabindex="0"]', win).filter((x) => !x.disabled && x.offsetParent !== null);
    if (!items.length) return;
    const first = items[0];
    const last = items[items.length - 1];
    if (!$('.layer', win).contains(document.activeElement)) {
      e.preventDefault();
      first.focus();
    } else if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
    return;
  }
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && e.target.matches && e.target.matches('[role="tab"]')) {
    const tabs = $$('[role="tab"]', e.target.closest('[role="tablist"]'));
    const next = tabs[(tabs.indexOf(e.target) + (e.key === 'ArrowLeft' ? -1 : 1) + tabs.length) % tabs.length];
    const k = next.getAttribute('data-key');
    e.preventDefault();
    next.click();
    const now = $(`[data-key="${k}"]`, win);
    if (now) now.focus();
    return;
  }
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !e.altKey && !e.ctrlKey && !e.metaKey) {
    const t = e.target;
    if (t.matches && t.matches('input, textarea, select, [contenteditable], [role="tab"], [role="radio"]')) return;
    if (hasLayer) return;
    e.preventDefault();
    cycle(e.key === 'ArrowLeft' ? -1 : 1);
  }
});

function boot() {
  $('#prev').onclick = () => cycle(-1);

}

/*

 * Grok Bot's Bots share one computer and each has a screen you can watch; the chat shows each step; a
 * routine belongs to one Bot; skills are shared. Here the shared computer is the owlet's home: This
 * computer or a paired host. The page groups owlets by home and shows each one's screen. An owlet opens
 * on its chat beside its screen. A new owlet is a short dialog: a name, a look, its job, its home.
 */

(() => {
  const CARD_FOOT = `${idea()} It waits here until you answer, at the desktop or on the phone. Today a thread’s card lapses after five minutes.`;

  function screen(o, size) {
    const s = o.screen;
    const st = statusOf(o);
    const mini = size === 'mini';
    let body;
    if (s.asleep) body = `<div class="a-asleep">${owl(o.look, 'idle', mini ? 30 : 44)}<span>${esc(s.asleep)}</span></div>`;
    else if (s.log) body = `<div class="a-screen__body a-screen__body--log"><p class="a-screen__sub clip">${esc(s.sub)}</p>${s.log.map((l) => `<div class="a-log ${l.startsWith('✗') ? 'bad' : ''}">${esc(l)}</div>`).join('')}</div>`;
    else body = `<div class="a-screen__body a-screen__body--rows"><p class="a-screen__sub clip">${esc(s.sub)}</p>${s.rows.map((r) => `<div class="a-srow ${r.mark ? 'mark' : ''}"><b>${esc(r.a)}</b><span>${esc(r.b)}</span><i>${esc(r.c)}</i></div>`).join('')}</div>`;
    const foot = o.status === 'needs' && st === 'idle' ? 'Nothing is waiting.' : s.foot;
    return `<div class="a-screen a-screen--${size}"><div class="a-screen__bar"><span class="clip">${esc(s.title)}</span></div>${body}<p class="a-screen__foot ${s.live ? 'live' : ''}"><span class="clip">${esc(foot)}</span></p></div>`;
  }
  /* on the phone a screen is a small picture of itself: bars, no words */
  function thumb(o) {
    const s = o.screen;
    const kind = s.asleep ? 'asleep' : s.log ? 'log' : 'rows';
    return `<span class="a-thumb a-thumb--${kind}">${kind === 'asleep' ? owl(o.look, 'idle', 22) : '<i></i><i class="hi"></i><i></i><i></i>'}</span>`;

  function tile(o) {
    const st = statusOf(o);

      <div aria-hidden="true">${screen(o, 'mini')}</div>
      <div class="a-tile__who" aria-hidden="true">${owl(o.look, st, 30)}<span class="grow"><strong>${esc(o.name)}</strong><span class="muted">${esc(o.title)}</span></span>${chip(o)}</div>
      <div class="a-tile__meta" aria-hidden="true"><span>${esc(o.model)}</span>${needsNote(o)}<span class="wrap">${esc(lineOf(o))}</span></div>

  function page() {
    return `<div class="a-page" data-scroll="a-page">
      <header class="a-head"><div class="grow"><h1>Owlets <span class="owltag">Owl</span></h1>

      <div class="a-homes">${Object.values(COMPUTERS)
        .map((c) => {

          <div class="a-tiles">${mine.map(tile).join('')}</div>
          <div class="a-shared"><p><b>Plugin accounts here</b>${c.accounts.map(acctLabel).map(esc).join(', ')}</p><p><b>Skills here</b>${c.skills.map(esc).join(', ')} ${idea()}</p></div></section>`;

  /* the panel beside the chat: the screen, the routines, the skills */
  function side(o) {
    const tab = ['screen', 'routines', 'skills'].includes(S.tab) ? S.tab : 'screen';
    const c = COMPUTERS[o.home];
    const others = OWLETS.filter((x) => x.home === o.home && x.id !== o.id);

    if (tab === 'screen') {
      panel = `${screen(o, 'big')}
        <p class="xs muted">${idea()} A screen shows what the owlet has open: a plugin read, a page in Sotto’s browser, a file in its folder. You can watch, and you never have to.</p>
        <div class="a-block"><h3 class="sec-h">It may use</h3><div class="card rows">${o.accounts.map((a) => `<div class="a-line"><span class="grow"><strong>${esc(acctLabel(a))}</strong><span class="muted">${ACCOUNT_RULES[ACCOUNTS[a].kind].join('. ')}.</span></span></div>`).join('')}</div></div>
        <div class="a-block"><h3 class="sec-h">On ${esc(c.name)} with it</h3><div class="card rows">${
          others.length
            ? others.map((x) => `<button class="a-line btn--quiet" style="width:100%;border:0;background:none;text-align:left" data-set="owlet=${x.id}&tab=null&open=null&at=null" data-key="nb-${x.id}" aria-label="Open ${esc(x.name)}, ${esc(x.title)}">${owl(x.look, statusOf(x), 26)}<span class="grow"><strong>${esc(x.name)}</strong><span class="muted">${esc(x.title)}</span></span>${chip(x)}</button>`).join('')
            : '<p class="a-line muted">No other owlet lives here.</p>'

    } else if (tab === 'routines') {
      panel = `<p class="xs muted">${idea()} A routine starts this owlet by itself, at a time or when something happens. Schedules are not decided.</p>
        ${
          o.routines.length
            ? o.routines
                .map((r) => {
                  const on = S.flags[`rt-${o.id}-${r.id}`] ?? r.on;
                  return `<div class="card a-rt"><div class="a-rt__top"><strong class="grow">${esc(r.name)}</strong><span class="xs muted">Active</span><button class="sw" role="switch" aria-checked="${on}" aria-label="${esc(r.name)} is active" data-act="switch" data-flag="rt-${o.id}-${r.id}" data-key="rt-${o.id}-${r.id}"></button></div>
                  <dl class="kv"><dt>When to run</dt><dd>${esc(r.when)}</dd><dt>Instruction</dt><dd>${esc(r.instruction)}</dd><dt>Next run</dt><dd>${esc(r.next)}</dd></dl>
                  <div class="btnrow"><button class="btn" data-act="runnow" data-id="${r.id}" data-key="run-${r.id}">${ic('play')}Run it now</button></div>
                  <div><h4 class="sec-h">Run history</h4><ul class="a-hist">${r.history.map((h) => `<li><span>${esc(h[0])}</span><span>${esc(h[1])}</span><span>${esc(h[2])}</span></li>`).join('')}</ul></div></div>`;

                .join('')
            : `<div class="card a-rt"><p>No routines. ${esc(o.name)} works when you ask.</p></div>`
        }
        <p class="xs muted">To add one, tell ${esc(o.name)} in the chat: “Every weekday at 6, sweep the inbox.” It shows you the routine before it starts.</p>`;
    } else {
      panel = `<p class="xs muted">${idea()} A skill is a saved way of doing a job. An owlet writes one when you ask it to, and every owlet on ${esc(c.name)} can use it.</p>
        <div class="card rows" style="padding:2px 12px">${c.skills.map((s) => `<div class="a-line"><span class="grow"><strong>${esc(s)}</strong><span class="muted">${esc((OWLETS.flatMap((x) => x.skills).find((k) => k.name === s) || { by: `Kept on ${c.name}` }).by)}</span></span></div>`).join('')}</div>`;

  function setupDialog(phone) {
    const f = formFor(S.edit);
    const o = S.edit ? owletById(S.edit) : null;
    return `<div class="layer"><form class="dialog ${phone ? 'is-full' : ''}" role="dialog" aria-modal="true" aria-labelledby="a-dlg-h" data-form="setup">
      <div class="layer__head"><h2 id="a-dlg-h">${o ? `Edit ${esc(o.name)}` : 'New owlet'}</h2><button type="button" class="iconbtn" data-act="cancel-setup" data-key="dlg-x" aria-label="Close without saving">${ic('x')}</button></div>
      <div class="layer__body"><div class="a-form">
        <div class="a-form__two">${F.text(f, 'name', 'Name', { ph: 'Tawny', first: true })}${F.look(f)}</div>
        ${F.area(f, 'role', 'Its job', { rows: 3, ph: 'Read the Work mailbox. Tell me what needs a reply…', hint: 'Say it as you would to a person. This is its role, and the first thing it reads in every chat.' })}
        ${F.home(f)}
        ${F.model(f)}
        ${F.accounts(f)}
        ${F.runs(f)}
      </div></div>
      <div class="layer__foot"><button type="button" class="btn" data-act="cancel-setup" data-key="dlg-cancel">Cancel</button><button type="submit" class="btn btn--primary" data-key="dlg-save">${o ? 'Save the changes' : 'Make the owlet'}</button></div>
    </form></div>`;
