  /* ---------- phone ---------- */
  function phonePage() {
    return `<div class="ph__nav"><h1 class="ph__big">Owlets</h1><span class="owltag">Owl</span><span class="grow"></span><button class="iconbtn" data-set="screen=setup&edit=null" data-key="new" aria-label="New owlet">${ic('plus')}</button></div>
      <div class="ph__scroll" data-scroll="a-ph-page">${Object.values(COMPUTERS)
        .map((c) => {
          const mine = OWLETS.filter((o) => o.home === c.id);
          return `<section class="a-psec" aria-labelledby="a-ph-${c.id}"><h2 id="a-ph-${c.id}">${ic('home')}${esc(c.name)} · ${esc(c.state)}</h2><div class="card rows">${mine
            .map((o) => {
              const st = statusOf(o);
              return `<button class="a-prow" data-set="screen=owlet&owlet=${o.id}&at=null" data-key="tile-${o.id}" aria-label="Open ${esc(o.name)}, ${esc(o.title)}. ${STATUS[st].label}. ${esc(o.model)}.">
                ${owl(o.look, st, 38)}<span class="grow" aria-hidden="true"><span class="who"><strong>${esc(o.name)}</strong><span>${esc(o.title)}</span></span><span class="line">${chip(o)} · ${esc(o.model)}</span><span class="line clip">${esc(lineOf(o))}</span></span><span aria-hidden="true">${thumb(o)}</span></button>`;
            })
            .join('')}</div><p class="a-pshare">They share its plugin accounts: ${c.accounts.map(acctLabel).map(esc).join(', ')}.</p></section>`;
        })
        .join('')}</div>`;
  }
  function phoneOpen(o) {
    const st = statusOf(o);
    return `<h1 class="vh">${esc(o.name)}, ${esc(o.title)}</h1><div class="ph__nav"><button class="iconbtn" data-set="screen=page&owlet=null&at=null" data-key="back" data-autofocus data-focus="[data-key='tile-${o.id}']" aria-label="Back to all owlets">${ic('back')}</button>
      <button class="a-phwho" data-set="open=profile" data-key="who" aria-label="${esc(o.name)}, ${esc(o.title)}. Show its role, home and routines">${owl(o.look, st, 34)}<span class="grow"><strong>${esc(o.name)}</strong><span class="sub clip">${esc(homeName(o))} · ${esc(o.model)}</span></span></button>
      <button class="btn" data-set="open=side" data-key="showscreen" aria-label="Watch ${esc(o.name)}’s screen">${ic('screen')}Watch</button></div>
      <p class="ph__meta">${chip(o)}${needsNote(o)}<span class="clip">${esc(lineOf(o))}</span></p>
      <div class="ph__scroll a-phchat" data-scroll="a-chat-${o.id}" data-stick>${talk(o, { changeFoot: CARD_FOOT })}</div>
      <div class="a-phfoot">${composer(o)}</div>`;
  }
  function profileSheet(o) {
    const c = COMPUTERS[o.home];
    return `<div class="layer"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="a-prof-h"><div class="layer__head">${owl(o.look, statusOf(o), 34)}<h2 id="a-prof-h">${esc(o.name)} · ${esc(o.title)}</h2><button class="iconbtn" data-act="close" data-key="prof-x" aria-label="Close" data-first>${ic('x')}</button></div>
      <div class="layer__body"><p>${esc(o.role)}</p>
      <dl class="kv"><dt>Home</dt><dd>${esc(c.name)}</dd><dt>Model</dt><dd>${esc(o.model)}</dd><dt>May use</dt><dd>${o.accounts.map(acctLabel).map(esc).join(', ')}</dd><dt>Runs</dt><dd>${o.routines.length ? o.routines.map((r) => esc(r.when)).join('; ') + ' ' + idea() : 'When you ask'}</dd></dl>
      <div class="btnrow"><button class="btn" data-set="screen=setup&edit=${o.id}&open=null" data-key="prof-edit">${ic('pencil')}Edit ${esc(o.name)}</button></div></div></div></div>`;
  }

  VARIANTS.A = {
    name: 'after Grok Bot',
    ref: 'after Grok Bot (xAI)',
    short: 'Grok Bot',
    brief: 'Computers and screens: owlets grouped by the computer they live on, a screen to watch for each, routines, shared skills, and the card on the phone.',
    first: 'tawny',
    caption:
      'Computers and screens. It borrows Grok Bot’s named Bots with a job, the one computer they share and the screen each has that you can watch, routines that belong to one Bot, skills that are shared, and a phone that shows the work and the card. Here the shared computer is the owlet’s home: This computer or forge.',
    jump(name) {
      if (name === 'owlet') return { screen: 'owlet', owlet: 'scops' };
      if (name === 'change') return { screen: 'owlet', owlet: 'tawny', at: 'end' };
      if (name === 'setup') return { screen: 'setup' };
      if (name === 'edit') return { screen: 'setup', edit: 'tawny', owlet: 'tawny' };
      return {};
    },
    view(S, phone) {
      const o = S.owlet ? owletById(S.owlet) : S.edit ? owletById(S.edit) : null;
      if (phone) return o && (S.screen === 'owlet' || S.screen === 'setup') ? phoneOpen(o) : phonePage();
      return o && (S.screen === 'owlet' || S.screen === 'setup') ? open(o) : page();
    },
    layer(S, phone) {
      if (S.screen === 'setup') return setupDialog(phone);
      const o = S.owlet && owletById(S.owlet);
      if (!o) return '';
      if (S.open === 'side')
        return `<div class="layer"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(o.name)}’s screen, routines and skills"><div class="layer__head"><h2>${esc(o.name)} on ${esc(homeName(o))}</h2><button class="iconbtn" data-act="close" data-key="side-x" aria-label="Close" data-first>${ic('x')}</button></div>${side(o)}</div></div>`;
      if (S.open === 'profile') return profileSheet(o);
      return '';
    },
    act(name, el) {
      if (name === 'cancel-setup') {
        const back = S.edit;
        go({ screen: back ? 'owlet' : 'page', owlet: back || null, edit: null, form: null }, back ? '[data-key="edit"], [data-key="who"]' : '[data-key="new"]');
      } else if (name === 'runnow') {
        S.toast = 'This is a prototype. Nothing ran.';
        el.textContent = 'Sample only. Nothing ran.';
      } else if (name === 'stop') {
        S.toast = 'This is a prototype. Nothing was stopped.';
        el.textContent = 'Sample only';
      }
    },
    escape() {
      if (S.screen === 'setup') {
        this.act('cancel-setup');
        return true;
      }
      return false;
    },
  };
})();

/* ==================== Look B ==================== */
/*
 * PROTOTYPE — look B, after Devin Bots (Cognition, announced November 17, 2026): outcomes and Needs you.
 *
 * A Devin Bot owns an outcome, starts a session for each piece of work, and gathers every approval,
 * decision and report in one Needs you list. Here the page opens on every card waiting for you, across
 * all owlets, with what each owlet owns beside it. An owlet opens on its work grouped by where it stands,
 * and its settings are tabs on the same page. A new owlet starts from a template.
 */

(() => {
  const CARD_FOOT = `${idea()} It stays in Needs you until you answer, however long that is. Today a thread’s card lapses after five minutes.`;
  const TABS = [['work', 'Work'], ['reports', 'Reports'], ['runs', 'When it runs'], ['uses', 'May use'], ['knows', 'Knows'], ['limit', 'Limit']];

  const needItems = () => OWLETS.flatMap((o) => [o.change && { type: 'change', id: o.change, o }, o.question && { type: 'question', id: o.question, o }].filter(Boolean));
  const openCount = () => needItems().filter((i) => !S.answers[i.id]).length;

  /* an owlet's work, with what was answered in this sitting moved from Needs you to Done */
  function groups(o) {
    const key = (x, g, i) => x.change || x.question || `${g}${i}`;
    const tag = (list, g) => list.map((x, i) => ({ ...x, k: key(x, g, i), g }));
    const needs = tag(o.work.needs, 'needs');
    const open = needs.filter((x) => !S.answers[x.k]);
    const answered = needs.filter((x) => S.answers[x.k]).map((x) => ({ ...x, g: 'done', s: x.change ? (S.answers[x.k] === 'allowed' ? 'Just now · you allowed it' : 'Just now · you said no') : S.answers[x.k] === 'skipped' ? 'Just now · you skipped it' : 'Just now · you answered' }));
    return { needs: open, working: tag(o.work.working, 'working'), next: tag(o.work.next, 'next'), done: [...answered, ...tag(o.work.done, 'done')] };
  }
  const GROUPS = [['needs', 'Needs you'], ['working', 'Working'], ['next', 'Up next'], ['done', 'Done']];

  function counts(o) {
    const g = groups(o);
    return `<span class="b-counts">${GROUPS.map(([k, l]) => `<span class="${g[k].length && (k === 'needs' || k === 'working') ? `n-${k}` : ''}">${l} <b>${g[k].length}</b></span>`).join('')}</span>`;
  }

  function item(i) {
    const o = i.o;
    const c = i.type === 'change' ? CHANGES[i.id] : QUESTIONS[i.id];
    return `<div class="b-item"><p class="b-from"><span class="b-kind">${i.type === 'change' ? 'Change' : 'Question'}</span>
      <button data-set="screen=owlet&owlet=${o.id}&tab=null&at=null" data-key="from-${i.id}" aria-label="Open ${esc(o.name)}, ${esc(o.title)}">${owl(o.look, statusOf(o), 22)}${esc(o.name)} <span>${esc(o.title)}</span></button>
      <span>${esc(homeName(o))} · asked ${esc(c.asked)}</span></p>
      ${i.type === 'change' ? changeCard(i.id, CARD_FOOT) : questionCard(i.id)}</div>`;
  }
  function reports() {
    const list = ['elf', 'scops', 'tawny'].map(owletById);
    return `<div class="card rows b-reps">${list
      .map((o) => {
        const openR = !!S.flags[`rep-${o.id}`];
        return `<div class="b-rep"><button aria-expanded="${openR}" data-act="toggle-rep" data-id="${o.id}" data-key="rep-${o.id}">${owl(o.look, statusOf(o), 26)}<span><strong>${esc(o.report.title)}</strong><span class="sub">${esc(o.name)} · ${esc(o.report.when)} · ${esc(o.report.summary)}</span></span><span class="chev" aria-hidden="true"></span></button>${openR ? reportCard(o, { label: false }) : ''}</div>`;
      })
      .join('')}</div>`;
  }
  function needsColumn(phone) {
    const n = openCount();
    return `<section aria-labelledby="b-needs-h"><div class="b-h"><h2 id="b-needs-h" class="${phone ? 'vh' : ''}">Needs you</h2><span class="count ${phone ? 'vh' : ''}">${n}</span><p>Only you can answer these. Nothing is sent or posted until you do.</p></div>
      <div class="b-items">${n ? '' : '<p class="card b-none">Nothing needs you.</p>'}${needItems().map(item).join('')}</div></section>
      <section aria-labelledby="b-rep-h"><div class="b-h"><h2 id="b-rep-h">While you were away</h2><p>Reports from runs you did not watch.</p></div>${reports()}</section>`;
  }
  function own(o) {
    const st = statusOf(o);
    return `<button class="b-own" data-set="screen=owlet&owlet=${o.id}&tab=null&at=null" data-key="own-${o.id}" aria-label="Open ${esc(o.name)}, ${esc(o.title)}. ${STATUS[st].label}. Lives on ${esc(homeName(o))}. ${esc(o.model)}.">
      <span class="b-own__top">${owl(o.look, st, 26)}<strong>${esc(o.name)}</strong><span class="muted grow">${esc(o.title)}</span>${chip(o)}</span>
      <span class="b-own__what">${esc(o.outcome)}</span>
      <span class="b-own__meta"><span>${esc(homeName(o))}</span><span>${esc(o.model)}</span>${spark(o.days)}</span>
      ${counts(o)}</button>`;
  }
  const ordered = () => [...OWLETS].sort((a, b) => ({ working: 0, needs: 1, idle: 2 })[statusOf(a)] - { working: 0, needs: 1, idle: 2 }[statusOf(b)]);

  function page() {
    return `<div class="b-page">
      <div class="b-main" data-scroll="b-main"><div class="b-in"><h1 class="b-title">Owlets <span class="owltag">Owl</span></h1>${needsColumn()}</div></div>
      <aside class="b-side" data-scroll="b-side" aria-label="Your owlets and what each one owns"><div class="b-side__h"><h2>What each one owns</h2><button class="btn btn--primary" data-set="screen=setup&edit=null" data-key="new">${ic('plus')}New owlet</button></div>${ordered().map(own).join('')}
      <p class="xs muted" style="padding:2px 4px">The bars are runs a day for the last two weeks.</p></aside>
    </div>`;
  }

  /* ---------- one owlet ---------- */
  function workTab(o, phone) {
    const g = groups(o);
    return `<div class="b-in">
      <div class="card b-away"><span class="lab">While you were away · ${esc(o.report.when)}</span><p>${esc(o.report.summary)}</p><button class="btn" data-set="tab=reports" data-key="read-report">Read the report</button></div>
      <div class="b-board">${GROUPS.map(
        ([k, l]) => `<section class="b-group" data-g="${k}" aria-labelledby="b-g-${k}"><h3 id="b-g-${k}">${l} <span class="n">${g[k].length}</span></h3><div class="b-stack">${
          g[k].length
            ? g[k].map((x) => `<button class="b-work" data-set="open=item:${x.k}" data-key="work-${x.k}"><strong>${esc(x.t)}</strong><span>${esc(x.s)}</span></button>`).join('')
            : `<p class="b-empty">${k === 'needs' ? 'Nothing needs you.' : k === 'working' ? 'Not working now.' : k === 'next' ? 'Nothing planned. It works when you ask.' : 'Nothing yet.'}</p>`
        }</div></section>`
      ).join('')}</div>
    </div>`;
  }
  function reportsTab(o) {
    return `<div class="b-in narrow">${reportCard(o)}<div><h3 class="sec-h" style="margin-bottom:8px">Earlier</h3><div class="card rows b-set">${o.work.done
      .filter((x) => !x.report)
      .map((x) => `<div class="b-setrow"><span class="grow"><strong>${esc(x.t)}</strong><span class="sub">${esc(x.s)}</span></span></div>`)
      .join('') || '<p class="b-setrow muted">No earlier runs.</p>'}</div></div></div>`;
  }
  function runsTab(o) {
    return `<div class="b-in narrow"><p class="small muted">${idea()} What starts ${esc(o.name)} without a message from you. Schedules and events are not decided. Whatever starts it, a change still waits for you.</p>
      <div class="card rows b-set"><div class="b-setrow"><span class="grow"><strong>When you ask</strong><span class="sub">A message from you, at the desktop or on the phone.</span></span><span class="xs muted">Always</span></div>
      ${o.routines
        .map((r) => {
          const on = S.flags[`rt-${o.id}-${r.id}`] ?? r.on;
          return `<div class="b-setrow"><span class="grow"><strong>${esc(r.when)}</strong><span class="sub">${esc(r.name)}: ${esc(r.instruction)}</span><span class="sub">Next: ${esc(r.next)} · last: ${esc(r.history[0][0])}, ${esc(r.history[0][2])}</span></span><button class="sw" role="switch" aria-checked="${on}" aria-label="${esc(r.when)} starts ${esc(o.name)}" data-act="switch" data-flag="rt-${o.id}-${r.id}" data-key="rt-${o.id}-${r.id}"></button></div>`;
        })
        .join('')}</div>
      <div class="field" style="max-width:360px"><label for="b-add-run">Add a time or an event</label><select id="b-add-run" data-key="b-add-run"><option>Choose…</option><option>Every hour</option><option>Every day at a time</option><option>Every week on a day</option><option>Once, at a date and time</option><option>When a new issue opens</option><option>When CI on main goes red</option><option>When mail arrives in an account</option></select><p class="hint">Sample only. An event would need a source Sotto trusts and a cap on how often it may start.</p></div></div>`;
  }
  function usesTab(o) {
    const c = COMPUTERS[o.home];
    return `<div class="b-in narrow"><div><h3 class="sec-h" style="margin-bottom:8px">Plugin accounts</h3><div class="card rows b-set">${c.accounts
      .map((a) => {
        const on = S.flags[`acc-${o.id}-${a}`] ?? o.accounts.includes(a);
        return `<div class="b-setrow"><span class="grow"><strong>${esc(acctLabel(a))}</strong><span class="sub">${ACCOUNT_RULES[ACCOUNTS[a].kind].join('. ')}.</span></span><button class="sw" role="switch" aria-checked="${on}" aria-label="${esc(o.name)} may use ${esc(acctLabel(a))}" data-act="switch" data-flag="acc-${o.id}-${a}" data-key="acc-${o.id}-${a}"></button></div>`;
      })
      .join('')}</div><p class="xs muted" style="margin-top:6px">These are the accounts on ${esc(c.name)}. An owlet never answers its own card: every send, post or deploy waits in Needs you.</p></div>
      <div><h3 class="sec-h" style="margin-bottom:8px">Where it lives</h3><div class="card b-set"><div class="b-setrow"><span class="grow"><strong>${esc(c.name)} · ${esc(o.model)}</strong><span class="sub">${esc(c.kind)}. Its work, its reports and its sign-ins stay there.</span></span><button class="btn" data-set="screen=setup&edit=${o.id}" data-key="uses-edit">Change</button></div></div></div></div>`;
  }
  function knowsTab(o) {
    const lines = [...o.memory.you, ...o.memory.learned].filter((_, i) => !S.flags[`forgot-${o.id}-${i}`]);
    const all = [...o.memory.you, ...o.memory.learned];
    return `<div class="b-in narrow"><div><h3 class="sec-h" style="margin-bottom:8px">Instructions · you write these</h3><div class="card b-set"><div class="b-setrow"><p class="grow">${esc(o.role)}</p><button class="btn" data-set="screen=setup&edit=${o.id}" data-key="knows-edit">${ic('pencil')}Edit</button></div></div></div>
      <div><h3 class="sec-h" style="margin-bottom:8px">What it has learned · it writes these ${idea()}</h3><div class="card b-set"><ul class="b-lines rows">${
        lines.length ? all.map((t, i) => (S.flags[`forgot-${o.id}-${i}`] ? '' : `<li><span>${esc(t)}</span><button class="btn" data-act="forget" data-id="${o.id}-${i}" data-key="forget-${o.id}-${i}" aria-label="Remove: ${esc(t)}">Remove</button></li>`)).join('') : '<li class="muted">Nothing yet.</li>'
      }</ul></div><p class="xs muted" style="margin-top:6px">It reads these at the start of every run. A line here is something it noticed, never a permission.</p></div></div>`;
  }
  function limitTab(o) {
    const pct = Math.round((o.limit.spent / o.limit.cap) * 100);
    return `<div class="b-in narrow"><p class="small muted">${idea()} A monthly limit on what this owlet’s model may cost, counted the way Usage counts a thread.</p>
      <div class="card b-set" style="padding:14px 16px;display:grid;gap:10px"><div class="b-setrow" style="padding:0"><span class="grow"><strong>Monthly limit</strong><span class="sub">Spent this month: $${o.limit.spent.toFixed(2)} of $${o.limit.cap}. The month starts on the 1st.</span></span><span class="t2" style="font-weight:650">$${o.limit.cap}</span></div>
      <div class="meter" role="img" aria-label="${pct} percent of the monthly limit used"><i style="width:${pct}%"></i></div>
      <p class="small t2">At the limit ${esc(o.name)} stops and says so in Needs you. It can ask for more. Only you can raise it.</p></div></div>`;
  }

  function sayRow(o) {
    const sent = S.sent[o.id] || [];
    const last = sent.length ? `<p class="last"><b>You:</b> ${esc(sent[sent.length - 1])} <br><b>${esc(o.name)}:</b> This is a prototype, so there is no answer. Nothing left this page.</p>` : `<p class="last"><b>${esc(o.name)}, ${esc(o.lastAt)}:</b> ${esc(o.last)}</p>`;
    return `<div class="b-say"><div>${last}${composer(o, `Tell ${o.name} what to change`)}</div></div>`;
  }

  function open(o, phone) {
    const tab = TABS.some(([k]) => k === S.tab) ? S.tab : 'work';
    const st = statusOf(o);
    const body = { work: workTab, reports: reportsTab, runs: runsTab, uses: usesTab, knows: knowsTab, limit: limitTab }[tab](o, phone);
    const tabs = `<div class="b-tabs" role="tablist" aria-label="${esc(o.name)}’s work and settings">${TABS.map(([k, l]) => `<button role="tab" aria-selected="${tab === k}" tabindex="${tab === k ? 0 : -1}" data-set="tab=${k}" data-key="btab-${k}">${l}</button>`).join('')}</div>`;
    const owns = `<div class="b-owns"><span class="lab">Owns</span><p>${esc(o.outcome)}</p></div>`;
    const stop = st === 'working' ? `<button class="btn" data-act="stop" data-key="stop" aria-label="Stop ${esc(o.name)}’s work">${ic('stop')}Stop</button>` : '';
    if (phone) {
      return `<div class="ph__nav"><button class="iconbtn" data-set="screen=page&owlet=null&tab=null&open=null" data-focus="[data-key='own-${o.id}'], [data-key='from-${o.change || o.question}']" data-key="back" data-autofocus aria-label="Back to Needs you and all owlets">${ic('back')}</button>${owl(o.look, st, 30)}<div class="grow"><h1 class="clip">${esc(o.name)}</h1><p class="xs muted clip">${esc(homeName(o))} · ${esc(o.model)}</p></div>${chip(o)}</div>
        ${owns}${tabs}<div class="b-body ph__scroll" role="tabpanel" data-scroll="b-body-${o.id}-${tab}">${body}</div>${tab === 'work' ? sayRow(o) : ''}`;
    }
    return `<div class="b-open">
      <header class="b-bar"><button class="iconbtn" data-set="screen=page&owlet=null&tab=null&open=null" data-focus="[data-key='own-${o.id}']" data-key="back" data-autofocus aria-label="Back to Needs you and all owlets">${ic('back')}</button>${owl(o.look, st, 30)}
        <div class="grow"><h1>${esc(o.name)}<span>${esc(o.title)}</span></h1><p class="small muted">Lives on ${esc(homeName(o))} · ${esc(o.model)}</p></div>${chip(o)}${needsNote(o)}${stop}</header>
      ${owns}${tabs}
      <div class="b-body" role="tabpanel" data-scroll="b-body-${o.id}-${tab}">${body}</div>
      ${tab === 'work' ? sayRow(o) : ''}
    </div>`;
  }

  function itemSheet(o) {
    const k = S.open.slice(5);
    const g = groups(o);
    const all = [...g.needs, ...g.working, ...g.next, ...g.done];
    const x = all.find((y) => y.k === k);
    if (!x) return '';
    let body;
    if (x.change) body = changeCard(x.change, CARD_FOOT);
    else if (x.question) body = questionCard(x.question);
    else if (x.report) body = reportCard(o, { label: false });
    else if (x.g === 'working') {
      const live = o.chat.find((m) => m.who === 'steps' && m.live);
      body = `<p class="t2">${esc(x.s)}</p><ul class="steps" aria-label="Steps so far">${(live ? live.items : []).map((s, i, a) => `<li class="${i === a.length - 1 ? 'live' : ''}">${esc(s)}</li>`).join('')}</ul><p class="small muted">It has read and written nothing outside GitHub. If it wants to post, the card comes to Needs you.</p>`;
    } else if (x.g === 'next') body = `<p class="t2">${esc(x.s)}</p><p class="small muted">Not started. ${idea()} It starts by itself at that time, and the report lands here.</p><div class="btnrow"><button class="btn" data-act="runnow" data-key="item-run">${ic('play')}Start it now</button></div>`;
    else body = `<p class="t2">${esc(x.s)}</p><p class="small muted">Finished. Nothing is waiting.</p>`;
    return `<div class="layer"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="b-item-h"><div class="layer__head"><h2 id="b-item-h">${esc(x.t)}</h2><button class="iconbtn" data-act="close" data-key="item-x" aria-label="Close" data-first>${ic('x')}</button></div>
      <div class="layer__body"><p class="small muted">${esc(o.name)} · ${esc(homeName(o))} · ${esc(GROUPS.find(([gk]) => gk === x.g)[1])}</p>${body}</div></div></div>`;
  }

  /* ---------- setup ---------- */
  function setup(phone) {
    const f = formFor(S.edit);
    const o = S.edit ? owletById(S.edit) : null;
    const templates = `<div class="card"><h2 id="b-tpl-h">Start from</h2><div class="pick b-tpl" role="radiogroup" aria-labelledby="b-tpl-h">${TEMPLATES.map(
      (t) => `<label><input type="radio" name="template" value="${t.id}" data-f="template" data-key="f-tpl-${t.id}" ${f.template === t.id ? 'checked' : ''}><span><strong>${esc(t.name)}</strong><span>${esc(t.outcome || 'An empty owlet. You write all of it.')}</span></span></label>`
    ).join('')}</div><p class="xs muted">${idea()} A template fills in the form. You can change every word.</p></div>`;
    const cards = `<div class="b-setup__cards">
      <div class="card"><h2>What it owns</h2><div class="b-two">${F.text(f, 'name', 'Name', { ph: 'Scops', first: true })}${F.text(f, 'title', 'What it is, in a word or two', { ph: 'Repo upkeep' })}</div>
        ${F.area(f, 'outcome', 'Outcome', { rows: 2, ph: 'main stays green…', hint: 'One sentence that stays true because this owlet is here.' })}
        ${F.area(f, 'role', 'Instructions', { rows: 3, hint: 'How to do the work. It reads these at the start of every run.' })}</div>
      <div class="card"><h2>Where it lives</h2><div class="b-two">${F.home(f, 'Home computer', '')}${F.model(f)}</div></div>
      <div class="card"><h2>What it may use</h2>${F.accounts(f, 'Plugin accounts')}</div>
      <div class="card"><h2>When it runs</h2>${F.runs(f, 'It starts')}</div>
      <div class="card"><h2>Limit ${idea()}</h2>${F.text(f, 'cap', 'Monthly limit in US dollars', { hint: 'At the limit it stops and tells you. Only you can raise it.' })}</div>
    </div>`;
    return `<form class="b-setup" data-form="setup">
      <div class="${phone ? 'ph__nav' : 'b-bar'}"><button type="button" class="iconbtn" data-act="cancel-setup" data-key="set-back" aria-label="Back without saving">${ic('back')}</button><h1 class="grow">${o ? `Edit ${esc(o.name)}` : 'New owlet'}</h1></div>
      <div class="b-setup__scroll" data-scroll="b-setup"><div class="b-setup__grid ${o ? 'one' : ''}">${o ? '' : templates}${cards}</div></div>
      <div class="b-setup__foot"><button type="button" class="btn" data-act="cancel-setup" data-key="set-cancel">Cancel</button><button type="submit" class="btn btn--primary" data-key="set-save">${o ? 'Save the changes' : 'Make the owlet'}</button></div>
    </form>`;
  }

  function phonePage() {
    const tab = S.tab === 'owlets' ? 'owlets' : 'needs';
    return `<div class="ph__nav"><h1 class="ph__big">Owlets</h1><span class="owltag">Owl</span><span class="grow"></span><button class="iconbtn" data-set="screen=setup&edit=null" data-key="new" aria-label="New owlet">${ic('plus')}</button></div>
      <div class="b-seg" role="tablist" aria-label="Needs you or all owlets"><button role="tab" aria-selected="${tab === 'needs'}" tabindex="${tab === 'needs' ? 0 : -1}" data-set="tab=needs" data-key="seg-needs">Needs you<span class="count">${openCount()}</span></button><button role="tab" aria-selected="${tab === 'owlets'}" tabindex="${tab === 'owlets' ? 0 : -1}" data-set="tab=owlets" data-key="seg-owlets">Owlets ${OWLETS.length}</button></div>
      <div class="ph__scroll" role="tabpanel" data-scroll="b-ph-${tab}"><div class="b-phpad">${tab === 'needs' ? needsColumn(true) : `<div style="display:grid;gap:10px">${ordered().map(own).join('')}</div>`}</div></div>`;
  }

  VARIANTS.B = {
    name: 'after Devin Bots',
    ref: 'after Devin Bots (Cognition)',
    short: 'Devin Bots',
    brief: 'Outcomes and Needs you: each owlet owns an outcome, every card waiting for you is in one list, and its work is grouped by where it stands.',
    first: 'scops',
    caption:
      'Outcomes and Needs you. It borrows the Devin Bot that owns an outcome and not a task, one Needs you list for every approval, decision and report, work grouped by where it stands, triggers on a time or an event, templates to start from, and a usage limit. The page opens on every card waiting for you.',
    jump(name) {
      if (name === 'owlet') return { screen: 'owlet', owlet: 'scops' };
      if (name === 'change') return { screen: 'owlet', owlet: 'scops', open: 'item:comment-214' };
      if (name === 'setup') return { screen: 'setup' };
      if (name === 'edit') return { screen: 'setup', edit: 'scops', owlet: 'scops' };
      return {};
    },
    view(S, phone) {
      if (S.screen === 'setup') return setup(phone);
      const o = S.screen === 'owlet' && S.owlet ? owletById(S.owlet) : null;
      if (o) return open(o, phone);
      return phone ? phonePage() : page();
    },
    layer(S) {
      const o = S.owlet && owletById(S.owlet);
      if (o && S.open && S.open.startsWith('item:')) return itemSheet(o);
      return '';
    },
    act(name, el) {
      if (name === 'toggle-rep') {
        S.flags[`rep-${el.dataset.id}`] = !S.flags[`rep-${el.dataset.id}`];
        render();
      } else if (name === 'forget') {
        S.flags[`forgot-${el.dataset.id}`] = true;
        S.toast = 'Removed. This is a prototype, so nothing was changed.';
        render('[data-key^="forget-"], [data-key="btab-knows"]');
      } else if (name === 'cancel-setup') {
        const back = S.edit;
        go({ screen: back ? 'owlet' : 'page', owlet: back || null, edit: null, form: null }, back ? '[data-key="btab-work"]' : '[data-key="new"]');
      } else if (name === 'runnow' || name === 'stop') {
        S.toast = 'This is a prototype. Nothing changed.';
        el.textContent = 'Sample only';
      }
    },
    escape() {
      if (S.screen === 'setup') {
        this.act('cancel-setup');
        return true;
      }
      // a report opened in place closes on Escape too
      const rep = document.activeElement && document.activeElement.closest ? document.activeElement.closest('.b-rep') : null;
      const btn = rep && rep.querySelector('button[aria-expanded="true"]');
      if (btn) {
        S.flags[`rep-${btn.dataset.id}`] = false;
        render(`[data-key="rep-${btn.dataset.id}"]`);
        return true;
      }
      return false;
    },
  };
})();

/* ==================== Look C ==================== */
/*
 * PROTOTYPE — look C, after Hermes Agent's Bot Mode (Nous Research): one long chat and its pages.
 *
 * In Bot Mode a bot is a profile: a role, a model, memory and skills of its own, with one main chat that
 * is never started over, every other run a tab beside it, and its routines docked next to the chat in
 * plain words. Here the owlets sit on a branch drawn in text characters, as the owls of Watcher's room
 * are. An owlet opens on its one chat; its runs are tabs; its routines are docked; and what it is (role,
 * home, accounts, routines, memory, skills) is a set of pages you can read and change.
 */

(() => {
  const OWL = {
    round: [' ,_, ', '(E,E)', '/)_) ', ' " " '],
    tufts: ['/\\_/\\', '(E,E)', '/)_) ', ' " " '],
    small: [' ._. ', '(E,E)', ' (_) ', ' " " '],
    heart: [' ,-, ', '{E,E}', '/)_) ', ' " " '],
  };
  const EYE = { working: 'o', needs: 'O', idle: '-' };
  const TWIG = '─'.repeat(11) + '┴' + '─'.repeat(17) + '┬' + '─'.repeat(23) + '┴' + '─'.repeat(9);
  const twig = () => `<span class="c-twig" data-deco aria-hidden="true">${TWIG.repeat(6)}</span>`;

  /* an owlet in text characters: four lines, the eyes say what it is doing */
  function ascii(o, st = statusOf(o)) {
    const eye = `<span class="eye">${EYE[st]}</span>`;
    const lines = OWL[o.look].map((l) => esc(l).replace(/E/g, eye));
    const mark = st === 'needs' ? '<span class="mark"> !</span>' : st === 'idle' ? '<span class="zz"> z</span>' : '  ';
    lines[0] = `  ${lines[0]}${mark}`;
    for (let i = 1; i < lines.length; i++) lines[i] = `  ${lines[i]}  `;
    return `<pre class="c-ascii" data-state="${st}" data-deco aria-hidden="true">${lines.join('\n')}</pre>`;
  }
  const face = (o, st = statusOf(o)) => `<span class="c-ascii" data-state="${st}" data-deco aria-hidden="true">${esc(OWL[o.look][1]).replace(/E/g, `<span class="eye">${EYE[st]}</span>`)}${st === 'needs' ? '<span class="mark">!</span>' : ''}</span>`;

  /* a night sky in text characters, the same every time. The page shows as much of it as it has room for. */
  const SKY = (() => {
    let seed = 11;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const rows = [];
    for (let y = 0; y < 18; y++) {
      let row = '';
      for (let x = 0; x < 210; x++) {
        const r = rnd();
        row += r < 0.011 ? '·' : r < 0.016 ? '*' : r < 0.019 ? '+' : r < 0.0205 ? '<b>*</b>' : ' ';
      }
      rows.push(row);
    }
    return rows.join('\n');
  })();
  const MARGIN = ['   ·', ' *', '      ·', '  <b>·</b>', '', '    +', ' ·', '', '      *', '  ·', '', '   <b>*</b>', '       ·', ' ·', '', '    ·', '  +', '', '      ·', ' *', '', '   ·'].join('\n');

  const cardFoot = (o) => `It lapses in five minutes if nobody answers, and then nothing is sent. That is Sotto’s rule for a thread’s card today. ${idea()} After a lapse ${esc(o.name)} would say so here, and ask again when you tell it to.`;
  const label = (o) => {
    const st = statusOf(o);
    const n = pendingOf(o).length;
    return `Open ${o.name}, ${o.title}. ${STATUS[st].label}${o.status === 'working' && n ? `, and ${n} need you` : ''}. Lives on ${homeName(o)}. ${o.model}.`;
  };

  function page() {
    return `<div class="c-page" data-scroll="c-page">
      <header class="c-head"><div class="grow"><h1>Owlets <span class="owltag">Owl</span></h1><p class="muted">Each owlet has one chat that is never started over. Press one to open it.</p></div>
      <button class="btn btn--primary" data-set="screen=setup&edit=null" data-key="new">${ic('plus')}New owlet</button></header>
      <div class="c-sky" data-deco aria-hidden="true"><pre>${SKY}</pre><span class="c-moon">☾</span></div>
      <div class="c-scene">
        <div class="c-row" style="--n:${OWLETS.length}">${OWLETS.map(
          (o) => `<button class="c-bird" data-set="screen=owlet&owlet=${o.id}&tab=null&at=null" data-key="bird-${o.id}" aria-label="${esc(label(o))}">
            ${ascii(o)}${twig()}
            <span class="c-name" aria-hidden="true">${esc(o.name)}</span><span class="c-title" aria-hidden="true">${esc(o.title)}</span>
            <span class="c-chips" aria-hidden="true">${chip(o)}${needsNote(o)}</span>
            <span class="c-where" aria-hidden="true">${esc(homeName(o))} · ${esc(o.model)}</span>
            <span class="c-said" aria-hidden="true">“${esc(o.last)}” <i>${esc(o.lastAt)}</i></span></button>`
        ).join('')}</div>
      </div>
      <p class="c-key"><span><span class="c-ascii" data-state="working" data-deco aria-hidden="true">(<span class="eye">o</span>,<span class="eye">o</span>)</span> eyes open: working</span><span><span class="c-ascii" data-state="idle" data-deco aria-hidden="true">(<span class="eye">-</span>,<span class="eye">-</span>)</span> eyes shut: idle</span><span><span class="c-ascii" data-state="needs" data-deco aria-hidden="true">(<span class="eye">O</span>,<span class="eye">O</span>)<span class="mark">!</span></span> wide eyes and a mark: needs you</span></p>
    </div>`;
  }

  /* the pane docked beside the chat: this owlet's routines in plain words, and a look at its pages */
  function dock(o, inSheet) {
    const used = o.memory.used;
    const fresh = o.skills.filter((s) => s.state === 'new').length;
    return `<aside class="c-dock" aria-label="${esc(o.name)}’s routines" data-scroll="c-dock-${o.id}">
      ${inSheet ? '' : `<div class="c-dock__h"><h2>Routines ${idea()}</h2><button class="iconbtn" data-act="dock" data-key="dock-x" aria-label="Hide the routines">${ic('x')}</button></div>`}
      <p class="xs muted">A routine starts ${esc(o.name)} by itself. You write when in your own words, and its report lands in the chat. Schedules are not decided.</p>
      ${
        o.routines.length
          ? o.routines
              .map((r) => {
                const on = S.flags[`rt-${o.id}-${r.id}`] ?? r.on;
                const quiet = S.flags[`quiet-${o.id}-${r.id}`] ?? true;
                const read = readSchedule(r.words);
                return `<div class="card c-rt"><div class="c-rt__top"><strong>${esc(r.name)}</strong><button class="sw" role="switch" aria-checked="${on}" aria-label="${esc(r.name)} is on" data-act="switch" data-flag="rt-${o.id}-${r.id}" data-key="rt-${o.id}-${r.id}"></button></div>
                  <p class="c-words">${esc(r.words)}</p>
                  <p class="xs muted">Sotto reads this as: ${esc(read[0])}. Next: ${esc(r.next)}.</p>
                  <p class="small t2">${esc(r.instruction)}</p>
                  <div class="c-quiet"><span>Say nothing when there is nothing to report</span><button class="sw" role="switch" aria-checked="${quiet}" aria-label="${esc(r.name)} says nothing when there is nothing to report" data-act="switch" data-flag="quiet-${o.id}-${r.id}" data-key="quiet-${o.id}-${r.id}"></button></div>
                  <div class="btnrow"><button class="btn" data-act="runnow" data-key="run-${r.id}">${ic('play')}Run it now</button></div></div>`;
              })
              .join('')
          : `<div class="card c-rt"><p>No routines. ${esc(o.name)} works when you ask.</p></div>`
      }
      <div class="field"><label for="c-add">Add a routine, in your own words</label><input type="text" id="c-add" class="inp" data-key="c-add" autocomplete="off" placeholder="fridays at 4pm"><div class="btnrow"><button type="button" class="btn" data-act="add-routine" data-key="c-add-btn">Read it back to me</button></div><p class="hint" id="c-add-out">Sotto says how it read your words before anything starts.</p></div>
      <div class="c-about"><h3 class="sec-h">${esc(o.name)}’s pages</h3><div class="card rows">
        <div class="c-pgline"><strong>Role</strong><span class="muted">${esc(o.role.slice(0, 96))}…</span></div>
        <div class="c-pgline"><strong>May use</strong><span class="muted">${o.accounts.map(acctLabel).map(esc).join(', ')}</span></div>
        <div class="c-pgline"><strong>Memory ${idea()}</strong><span class="muted">${used.toLocaleString('en-US')} of 2,200 characters</span><div class="meter" role="img" aria-label="${Math.round((used / 2200) * 100)} percent of its memory used"><i style="width:${Math.round((used / 2200) * 100)}%"></i></div></div>
        <div class="c-pgline"><strong>Skills ${idea()}</strong><span class="muted">${o.skills.length} written${fresh ? `, ${fresh} new for you to read` : ''}</span></div>
      </div><div class="btnrow"><button class="btn" data-set="screen=setup&edit=${o.id}&open=null" data-key="dock-pages">${ic('page')}Open its pages</button></div></div>
    </aside>`;
  }

  function chatBody(o, tab) {
    if (tab === 'run') {
      const r = o.report;
      return `<div class="c-col c-run"><p class="c-runhead">Run · ${esc(r.title)} · ${esc(r.when)} · on ${esc(r.on)} · took ${esc(r.took)}${o.routines.length ? ' · started by its routine' : ' · started by your message'}</p>
        <ol class="steps" aria-label="Every step of this run">${r.steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol>
        ${reportCard(o, { label: false })}
        <p class="small muted">A run is a record of its own. Its report also went into ${esc(o.name)}’s chat, and that is where you talk about it.</p>
        <div class="btnrow"><button class="btn" data-set="tab=chat" data-key="to-chat">Go to ${esc(o.name)}’s chat</button></div></div>`;
    }
    return `<div class="c-col">${talk(o, { changeFoot: cardFoot(o), report: { after: `<div class="btnrow"><button class="btn" data-set="tab=run&at=null" data-key="open-run">Open this run</button></div>` } })}</div>`;
  }

  function tabs(o, tab, phone) {
    const closed = !!S.flags['c-dock-closed'];
    return `<div class="c-tabs"><div role="tablist" aria-label="${esc(o.name)}’s chat and its runs" style="display:flex;gap:2px">
      <button role="tab" aria-selected="${tab === 'chat'}" tabindex="${tab === 'chat' ? 0 : -1}" data-set="tab=chat&at=null" data-key="ctab-chat"><span class="pin" aria-hidden="true"></span>${esc(o.name)}’s chat</button>
      <button role="tab" aria-selected="${tab === 'run'}" tabindex="${tab === 'run' ? 0 : -1}" data-set="tab=run&at=null" data-key="ctab-run">Run · ${esc(o.report.tab)}</button></div>
      <span class="grow"></span>${phone ? '' : `<button class="btn c-dockbtn" data-act="dock" data-key="dockbtn" data-wide="${closed ? 'closed' : 'open'}">${ic('clock')}Routines</button>`}</div>`;
  }

  function open(o, phone) {
    const tab = S.tab === 'run' ? 'run' : 'chat';
    const st = statusOf(o);
    const closed = !!S.flags['c-dock-closed'];
    const body = `<section class="c-chat" aria-label="${tab === 'chat' ? `Chat with ${esc(o.name)}` : `A run of ${esc(o.name)}`}">
        ${phone ? '' : `<pre class="c-margin c-margin--l" data-deco aria-hidden="true">${MARGIN}</pre><pre class="c-margin c-margin--r" data-deco aria-hidden="true">${MARGIN}</pre>`}
        <div class="c-chat__scroll" role="tabpanel" data-scroll="c-chat-${o.id}-${tab}" ${tab === 'chat' ? 'data-stick' : ''}>${chatBody(o, tab)}</div>
        ${tab === 'chat' ? `<div class="c-chat__foot"><div class="c-col">${composer(o)}</div></div>` : ''}
      </section>`;
    if (phone) {
      return `<h1 class="vh">${esc(o.name)}, ${esc(o.title)}</h1><div class="ph__nav c-who"><button class="iconbtn" data-set="screen=page&owlet=null&tab=null&at=null" data-focus="[data-key='bird-${o.id}']" data-key="back" data-autofocus aria-label="Back to all owlets">${ic('back')}</button>
        <button class="c-phname" data-set="screen=setup&edit=${o.id}" data-key="who" aria-label="${esc(o.name)}, ${esc(o.title)}. Open its pages"><strong>${face(o)} ${esc(o.name)}</strong><span class="sub clip">${esc(o.title)}</span></button>
        <button class="btn" data-set="open=dock" data-key="dockbtn">${ic('clock')}Routines</button></div>
        <p class="ph__meta">${chip(o)}${needsNote(o)}<span class="clip">${esc(homeName(o))} · ${esc(o.model)}</span></p>
        ${tabs(o, tab, true)}${body}`;
    }
    return `<div class="c-open">
      <nav class="c-strip" aria-label="Owlets on the branch"><button class="c-perch" data-set="screen=page&owlet=null&tab=null&at=null" data-focus="[data-key='bird-${o.id}']" data-key="back" data-autofocus>${ic('back')}<span>The branch</span></button>${OWLETS.map(
        (x) => `<button class="c-perch" aria-current="${x.id === o.id}" data-set="owlet=${x.id}&tab=null&at=null&open=null" data-key="perch-${x.id}" aria-label="${esc(label(x))}">${face(x)}<span aria-hidden="true">${esc(x.name)}</span></button>`
      ).join('')}<span class="grow"></span><button class="btn btn--quiet" data-set="screen=setup&edit=null" data-key="new">${ic('plus')}New owlet</button></nav>
      <header class="c-who"><h1>${esc(o.name)}<span>${esc(o.title)}</span></h1><p class="small muted grow">Lives on ${esc(homeName(o))} · ${esc(o.model)}</p>${chip(o)}${needsNote(o)}
        <button class="btn" data-set="screen=setup&edit=${o.id}" data-key="pages">${ic('page')}Its pages</button>${st === 'working' ? `<button class="btn" data-act="stop" data-key="stop" aria-label="Stop ${esc(o.name)}’s work">${ic('stop')}Stop</button>` : ''}</header>
      ${tabs(o, tab, false)}
      <div class="c-body ${closed ? 'is-wide' : ''}">${body}${closed ? '' : dock(o)}</div>
    </div>`;
  }

  /* ---------- its pages ---------- */
  const PAGES = [['who', 'Who it is'], ['role', 'Role'], ['home', 'Lives on'], ['uses', 'May use'], ['routines', 'Routines'], ['memory', 'Memory'], ['skills', 'Skills']];
  function book(phone) {
    const f = formFor(S.edit);
    const o = S.edit ? owletById(S.edit) : null;
    const pg = (key, inner, tag = '') => {
      const i = PAGES.findIndex(([k]) => k === key);
      return `<section class="c-pg" id="pg-${key}" aria-labelledby="pg-${key}-h"><header><h2 id="pg-${key}-h">${PAGES[i][1]} ${tag}</h2><span class="no">${i + 1} / ${PAGES.length}</span></header>${inner}</section>`;
    };
    const looks = `<div class="field" role="radiogroup" aria-labelledby="c-look-l"><span class="lbl" id="c-look-l">Look</span><div class="c-looks">${Object.keys(LOOKS)
      .map((k) => `<label><input type="radio" name="look" value="${k}" data-f="look" data-key="f-look-${k}" ${f.look === k ? 'checked' : ''} aria-label="${LOOKS[k]}">${ascii({ look: k }, 'working')}</label>`)
      .join('')}</div></div>`;
    const mem = o
      ? `<p class="small muted">${o.memory.used.toLocaleString('en-US')} of 2,200 characters. It is kept small on purpose, so ${esc(o.name)} reads all of it every time.</p><div class="meter" role="img" aria-label="${Math.round((o.memory.used / 2200) * 100)} percent used"><i style="width:${Math.round((o.memory.used / 2200) * 100)}%"></i></div>
         <ul class="c-lines">${[...o.memory.you.map((t) => ['About you', t]), ...o.memory.learned.map((t) => ['It learned', t])]
           .map(([w, t], i) => (S.flags[`forgot-${o.id}-${i}`] ? '' : `<li><span class="who">${w}</span><span>${esc(t)}</span><button type="button" class="btn" data-act="forget" data-id="${o.id}-${i}" data-key="forget-${o.id}-${i}" aria-label="Remove: ${esc(t)}">Remove</button></li>`))
           .join('')}</ul><p class="xs muted">A line here is something it noticed. It is never a permission.</p>`
      : '<p class="muted">Empty. It writes a line here when it learns how you like something done, and you can remove any line.</p>';
    const skills = o
      ? `<ul class="c-lines">${o.skills
          .map((s, i) => {
            const st = S.flags[`skill-${o.id}-${i}`] || s.state;
            return `<li><span><strong style="font-weight:600">${esc(s.name)}</strong><br><span class="muted small">${esc(s.by)}${st === 'new' ? '. New: it is not used until you keep it.' : st === 'gone' ? '. Thrown away.' : '. Kept.'}</span></span>${st === 'new' ? `<button type="button" class="btn" data-act="skill" data-id="${o.id}-${i}" data-to="kept" data-key="keep-${o.id}-${i}" aria-label="Keep the skill ${esc(s.name)}">Keep it</button><button type="button" class="btn" data-act="skill" data-id="${o.id}-${i}" data-to="gone" data-key="toss-${o.id}-${i}" aria-label="Throw away the skill ${esc(s.name)}">Throw it away</button>` : ''}</li>`;
          })
          .join('')}</ul><p class="xs muted">A skill is a page ${esc(o.name)} wrote about how to do one job, so the next run starts from it.</p>`
      : '<p class="muted">None yet. After a job goes well, it can write down how it did it. Nothing it writes is used until you keep it.</p>';
    const r = readSchedule(f.words);
    const routines = `<div class="field"><label for="f-words">When it runs, in your own words</label><input type="text" id="f-words" data-f="words" data-key="f-words" value="${esc(f.words)}" autocomplete="off" placeholder="weekdays at 7:30am"><p class="hint" id="read-words">${r ? `Sotto reads this as: <b>${esc(r[0])}</b>. Next: ${esc(r[1])}.` : 'Leave it empty and it works only when you ask.'}</p></div>
      <p class="small t2">A routine’s report lands in the owlet’s chat. If the run wants to send something and you are not there, the card lapses and nothing is sent; it tells you in the chat.</p>`;
    return `<form class="c-book" data-form="setup">
      <div class="${phone ? 'ph__nav' : 'c-book__bar'}"><button type="button" class="iconbtn" data-act="cancel-setup" data-key="book-back" aria-label="Back without saving">${ic('back')}</button><h1 class="grow">${o ? `${esc(o.name)}’s pages` : 'A new owlet’s pages'}</h1>
        ${phone ? '' : `<button type="button" class="btn" data-act="cancel-setup" data-key="book-cancel">Cancel</button>`}<button type="submit" class="btn btn--primary" data-key="book-save">${o ? 'Save the pages' : 'Make the owlet'}</button></div>
      <div class="c-book__body"><nav class="c-index" aria-label="Pages">${PAGES.map(([k, l], i) => `<button type="button" data-act="page" data-id="${k}" data-key="idx-${k}"><i>${i + 1}</i>${l}</button>`).join('')}</nav>
      <div class="c-pages" data-scroll="c-pages"><div>
        ${pg('who', `<div class="c-two">${F.text(f, 'name', 'Name', { ph: 'Elf', first: true })}${F.text(f, 'title', 'Title', { ph: 'Morning brief', hint: 'What it is, in a word or two.' })}</div>${looks}`)}
        ${pg('role', F.area(f, 'role', 'What it is for and how it works', { rows: 5, hint: 'It reads this page at the start of every chat and every run. Write it as you would brief a person.' }))}
        ${pg('home', `<div class="c-two">${F.home(f, 'Computer', '')}${F.model(f)}</div><p class="xs muted">Its chat, its pages and its runs are kept on that computer. You reach them from this desktop and from your paired iPhone.</p>`)}
        ${pg('uses', F.accounts(f, 'Plugin accounts'))}
        ${pg('routines', routines, idea())}
        ${pg('memory', mem, idea())}
        ${pg('skills', skills, idea())}
      </div></div></div>
    </form>`;
  }

  function phonePage() {
    return `<div class="ph__nav"><h1 class="ph__big">Owlets</h1><span class="owltag">Owl</span><span class="grow"></span><button class="iconbtn" data-set="screen=setup&edit=null" data-key="new" aria-label="New owlet">${ic('plus')}</button></div>
      <div class="ph__scroll" data-scroll="c-ph-page"><div class="c-plist">${OWLETS.map(
        (o) => `<button class="c-prow" data-set="screen=owlet&owlet=${o.id}&tab=null&at=null" data-key="bird-${o.id}" aria-label="${esc(label(o))}"><span class="perch" aria-hidden="true">${ascii(o)}${twig()}</span>
          <span class="info" aria-hidden="true"><span class="c-name">${esc(o.name)}<span>${esc(o.title)}</span></span><span>${chip(o)} ${needsNote(o)}</span><span class="c-where">${esc(homeName(o))} · ${esc(o.model)}</span><span class="c-said clip">“${esc(o.last)}”</span></span></button>`
      ).join('')}<p class="xs muted" style="padding:6px 4px">Eyes open: working. Eyes shut: idle. Wide eyes and a mark: needs you.</p></div></div>`;
  }

  VARIANTS.C = {
    name: 'after Hermes Agent',
    ref: 'after Hermes Agent’s Bot Mode (Nous Research)',
    short: 'Hermes',
    brief: 'One long chat and its pages: one chat per owlet that is never started over, runs as tabs, routines in plain words, and pages for its role and memory.',
    first: 'elf',
    caption:
      'One long chat and its pages. It borrows the Hermes bot that is a profile with a role, memory and skills of its own, one main chat that is never started over, each run a tab beside it, routines docked next to the chat and written in plain words, and a small memory you can read. It is drawn as a sibling of Watcher’s room, with the owlets on a branch.',
    jump(name) {
      if (name === 'owlet') return { screen: 'owlet', owlet: 'elf' };
      if (name === 'change') return { screen: 'owlet', owlet: 'tawny', at: 'end' };
      if (name === 'setup') return { screen: 'setup' };
      if (name === 'edit') return { screen: 'setup', edit: 'elf', owlet: 'elf' };
      return {};
    },
    view(S, phone) {
      if (S.screen === 'setup') return book(phone);
      const o = S.screen === 'owlet' && S.owlet ? owletById(S.owlet) : null;
      if (o) return open(o, phone);
      return phone ? phonePage() : page();
    },
    layer(S) {
      const o = S.owlet && owletById(S.owlet);
      if (o && S.open === 'dock' && S.screen === 'owlet')
        return `<div class="layer"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="c-dock-h"><div class="layer__head"><h2 id="c-dock-h">${esc(o.name)}’s routines ${idea()}</h2><button class="iconbtn" data-act="close" data-key="dock-sx" aria-label="Close" data-first>${ic('x')}</button></div>${dock(o, true)}</div></div>`;
      return '';
    },
    act(name, el) {
      if (name === 'dock') {
        if ($('#win').clientWidth < 1000) {
          S.opener = el.getAttribute('data-key');
          return go({ open: 'dock' });
        }
        S.flags['c-dock-closed'] = !S.flags['c-dock-closed'];
        render(S.flags['c-dock-closed'] ? '[data-key="dockbtn"]' : '[data-key="dock-x"]');
      } else if (name === 'page') {
        const pgEl = $(`#pg-${el.dataset.id}`);
        if (pgEl) {
          pgEl.scrollIntoView({ block: 'start' });
          const first = $('input, textarea, select, button', pgEl);
          if (first) first.focus({ preventScroll: true });
        }
      } else if (name === 'forget') {
        S.flags[`forgot-${el.dataset.id}`] = true;
        S.toast = 'Removed. This is a prototype, so nothing was changed.';
        render('[data-key^="forget-"], [data-key="idx-memory"]');
      } else if (name === 'skill') {
        S.flags[`skill-${el.dataset.id}`] = el.dataset.to;
        render('[data-key="idx-skills"]');
      } else if (name === 'add-routine') {
        const v = $('#c-add').value.trim();
        $('#c-add-out').textContent = v ? `Sample only. Sotto would say here how it read “${v}”, and nothing would start until you agreed.` : 'Write when it should run first.';
      } else if (name === 'cancel-setup') {
        const back = S.edit;
        go({ screen: back ? 'owlet' : 'page', owlet: back || null, edit: null, form: null }, back ? '[data-key="pages"], [data-key="who"]' : '[data-key="new"]');
      } else if (name === 'runnow' || name === 'stop') {
        S.toast = 'This is a prototype. Nothing changed.';
        el.textContent = 'Sample only';
      }
    },
    escape() {
      if (S.screen === 'setup') {
        this.act('cancel-setup');
        return true;
      }
      return false;
    },
  };
})();

boot();
</script>
</body>
</html>
