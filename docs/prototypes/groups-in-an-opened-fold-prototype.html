<!doctype html>
<!--
  PROTOTYPE — throwaway. Not shipped, not tested, not wired to anything.

  Question: when you open a finished turn's Worked for line, how should the groups inside it start? Zach, November 19,
  2026, on the "Run model gauntlet" thread: "The problem is all of the commands unfold when I expand one of them." That
  turn holds a reply and a group ("Ran 2 commands") for each 20-minute check, so opening its line opens about twenty.

    a    As it ships (Zach's card of November 15). Every group inside an opened fold starts open.
    b    Folded. Every group inside starts folded, as it does while the agent works. Press one to open it alone.
    c    Open only when there are few. A fold with one or two groups opens them; one with more starts them folded.

  In every variant a group you press stays as you left it (the fix already in the pull request), and a turn whose fold
  holds a single group and no replies shows its steps straight under the line, as it does now.

  Bar: arrows (or the arrow keys) switch variants. "Long turn" flips between Zach's long turn and a short turn of two
  groups. Light flips the palette. 820 frames the window at its minimum size. The words are made up.

  Picked: b (Zach, November 19, 2026). ADR-0134, November 19 amendment.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sotto — groups in an opened fold, prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face { font-family: 'Figtree'; font-weight: 300 900; font-display: swap; src: url('../../src/shared/fonts/figtree-latin.woff2') format('woff2'); }
:root {
  color-scheme: dark;
  --tt-canvas: oklch(0.115 0.008 265); --tt-field: oklch(0.145 0.008 265); --tt-surface-elevated: oklch(0.185 0.008 265);
  --tt-text: oklch(0.985 0.005 280); --tt-text-2: color-mix(in oklab, oklch(0.985 0.005 280) 55%, oklch(0.72 0.014 265));
  --tt-text-muted: color-mix(in oklab, oklch(0.72 0.014 265) 85%, oklch(0.985 0.005 280));
  --tt-hairline: oklch(0.305 0.02 265); --tt-field-border: oklch(0.375 0.024 265);
  --tt-accent: oklch(0.714 0.104 183); --tt-activity: oklch(0.78 0.12 150);
  --tt-hover: color-mix(in srgb, oklch(0.32 0.05 185) 70%, transparent); --bubble: oklch(0.17 0.01 265);
  --tt-font: 'Figtree', ui-sans-serif, system-ui, 'Segoe UI', sans-serif; --mono: ui-monospace, 'Cascadia Code', Consolas, monospace;
}
:root[data-theme='light'] {
  color-scheme: light;
  --tt-canvas: oklch(0.978 0.004 85); --tt-field: oklch(0.99 0.003 85); --tt-surface-elevated: oklch(0.955 0.006 85);
  --tt-text: oklch(0.2 0.01 265); --tt-text-2: oklch(0.36 0.012 265); --tt-text-muted: oklch(0.45 0.012 265);
  --tt-hairline: oklch(0.88 0.006 85); --tt-field-border: oklch(0.78 0.01 85);
  --tt-accent: oklch(0.52 0.1 183); --tt-activity: oklch(0.5 0.12 150);
  --tt-hover: oklch(0.93 0.02 185); --bubble: oklch(0.95 0.006 85);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #050506; color: var(--tt-text); font: 14px/1.5 var(--tt-font); }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--tt-accent); outline-offset: 2px; }
.stage { min-height: 100%; display: grid; place-items: center; }
.app { display: grid; grid-template-rows: auto 1fr auto; width: 100vw; height: 100vh; background: var(--tt-canvas); overflow: hidden; }
.app[data-small] { width: 820px; height: 560px; box-shadow: 0 0 0 1px #333, 0 20px 60px rgb(0 0 0 / 50%); }
.head { display: flex; align-items: center; gap: 14px; padding: 12px 24px; border-bottom: 1px solid var(--tt-hairline); font-size: 13.5px; color: var(--tt-text-muted); }
.head b { color: var(--tt-text); font-weight: 600; font-size: 15px; }
.scroll { overflow: auto; }
.col { max-width: 900px; margin: 0 auto; padding: 24px 32px 120px; }
.composer { max-width: 900px; width: calc(100% - 64px); margin: 0 auto 16px; border: 1px solid var(--tt-field-border); border-radius: 14px; background: var(--tt-field); padding: 12px 16px; color: var(--tt-text-muted); }
.msg { margin: 0 0 22px; }
.msg header { display: flex; gap: 10px; margin-bottom: 6px; color: var(--tt-text-muted); font-size: 12.5px; }
.who { color: var(--tt-text-2); font-weight: 500; }
.msg p { margin: 0; color: var(--tt-text-2); line-height: 1.6; font-size: 15px; }
.msg[data-role='user'] { margin-left: max(24px, 12%); padding: 14px 18px; background: var(--bubble); border: 1px solid var(--tt-hairline); border-radius: 14px 14px 4px 14px; }
.msg[data-role='user'] p { color: var(--tt-text); }
.work { margin: 0 0 20px; border-bottom: 1px solid var(--tt-field-border); padding-bottom: 6px; }
.sum { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; min-height: 32px; margin: 0 0 0 -6px; padding: 0 10px 0 6px; border: 0; border-radius: 8px; background: transparent; color: var(--tt-text-muted); font-size: 14px; cursor: pointer; text-align: left; }
.sum:hover { background: var(--tt-hover); color: var(--tt-text-2); }
.headline { color: var(--tt-text-2); font-weight: 500; font-variant-numeric: tabular-nums; }
.chev { flex: none; transition: transform .16s ease; display: inline-block; }
[aria-expanded='true'] > .chev { transform: rotate(90deg); }
.inside { padding: 4px 0 4px 4px; }
.group { margin: 2px 0 8px; }
.rows { list-style: none; margin: 0 0 0 22px; padding: 0; }
.rows li { font-family: var(--mono); font-size: 12.5px; color: var(--tt-text-muted); padding: 2px 0; }
.live { display: flex; align-items: center; gap: 10px; margin: 6px 0 18px; color: var(--tt-text-2); }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--tt-activity); box-shadow: 0 0 0 0 var(--tt-activity); animation: pulse 1.6s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--tt-activity) 60%, transparent); } 100% { box-shadow: 0 0 0 8px transparent; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } .chev { transition: none; } }
.glow { background: linear-gradient(90deg, var(--tt-text-2) 40%, var(--tt-accent) 50%, var(--tt-text-2) 60%); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: glow 3s linear infinite; }
@keyframes glow { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@media (prefers-reduced-motion: reduce) { .glow { animation: none; color: var(--tt-text-2); background: none; } }
.bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; padding: 6px 8px; border-radius: 12px; background: #16161a; border: 1px solid #333; color: #ddd; font: 13px/1 var(--tt-font); z-index: 10; box-shadow: 0 8px 30px rgb(0 0 0 / 50%); }
.bar button { background: #26262c; border: 1px solid #3a3a42; color: #eee; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.bar button[aria-pressed='true'] { background: #2f5d58; border-color: #4c8f87; }
.bar .name { min-width: 300px; text-align: center; }
.state { font-size: 12px; color: var(--tt-text-muted); margin: 0 0 18px; padding: 8px 12px; border: 1px dashed var(--tt-hairline); border-radius: 8px; }
</style>
</head>
<body>
<div class="stage"><div class="app" id="app">
  <div class="head"><b>Run model gauntlet and upload Fable 5-2 results</b><span>Claude Code · forge</span></div>
  <div class="scroll"><div class="col" id="col"></div></div>
  <div class="composer">Reply…</div>
</div></div>
<div class="bar" role="toolbar" aria-label="Prototype">
  <button id="prev" aria-label="Previous variant">←</button>
  <span class="name" id="name"></span>
  <button id="next" aria-label="Next variant">→</button>
  <button id="long" aria-pressed="true">Long turn</button>
  <button id="light" aria-pressed="false">Light</button>
  <button id="small" aria-pressed="false">820</button>
</div>
<script>
const VARIANTS = [
  { id: 'a', name: 'a · As it ships: every group inside starts open' },
  { id: 'b', name: 'b · Folded: press one to open it alone' },
  { id: 'c', name: 'c · Open only when there are one or two' },
]
const params = new URLSearchParams(location.search)
let variant = Math.max(0, VARIANTS.findIndex(v => v.id === params.get('variant')))
let long = true
let turnOpen = true
const groupOpen = new Map()
const LONG = [
  ['19:01', 'Started the gauntlet on forge. I will check back every 20 minutes.', ['npm run gauntlet -- --model fable-5-2', 'tail -n 40 gauntlet.log']],
  ['19:21', 'Still running: 14 of 60 tasks done, no failures.', ['tail -n 40 gauntlet.log', 'ls results/']],
  ['19:41', 'Still running: 29 of 60 tasks done, one retry.', ['tail -n 40 gauntlet.log', 'ls results/', 'grep -c PASS results/*.json']],
  ['20:13', 'Fixed the scorer path and restarted the last batch.', ['git diff scorer.ts', 'npm run gauntlet -- --resume']],
  ['20:33', 'Still running: 47 of 60 tasks done.', ['tail -n 40 gauntlet.log', 'ls results/']],
  ['20:53', 'All 60 tasks finished. Uploading the results now.', ['node upload.mjs results/', 'curl -s results.example/api/status']],
  ['21:13', 'Checked the upload: every file arrived.', ['tail -n 40 upload.log', 'ls results/uploaded']],
]
const SHORT = [
  ['18:46', 'Reading the gauntlet config first.', ['cat gauntlet.config.json', 'ls tasks/']],
  ['18:47', 'The config names Fable 5-2 already, so I only need the key.', ['grep -n model gauntlet.config.json']],
]
const el = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content }
const chev = '<span class="chev" aria-hidden="true">›</span>'
function group(key, cmds, startOpen) {
  const open = groupOpen.has(key) ? groupOpen.get(key) : startOpen
  const rows = open ? '<ul class="rows">' + cmds.map(c => '<li>' + c + '</li>').join('') + '</ul>' : ''
  return '<div class="group"><button class="sum" data-group="' + key + '" aria-expanded="' + open + '">' + chev + '<span>Ran ' + cmds.length + ' command' + (cmds.length === 1 ? '' : 's') + '</span></button>' + rows + '</div>'
}
const reply = (at, text) => '<article class="msg"><header><span class="who">Claude Code</span><time>' + at + '</time></header><p>' + text + '</p></article>'
const user = '<article class="msg" data-role="user"><header><span class="who">You</span><time>18:45</time></header><p>Run the model gauntlet against Fable 5-2 and upload the results when it finishes.</p></article>'
function render() {
  const v = VARIANTS[variant].id
  document.getElementById('name').textContent = VARIANTS[variant].name
  history.replaceState(null, '', '?variant=' + v)
  const list = long ? LONG : SHORT
  const startOpen = v === 'a' ? true : v === 'b' ? false : list.length <= 2
  const steps = list.reduce((n, r) => n + r[2].length * 2, 0)
  const cmds = list.reduce((n, r) => n + r[2].length, 0)
  const inner = list.map(([at, text, c], i) => reply(at, text) + group((long ? 'l' : 's') + i, c, startOpen)).join('')
  let html = user + '<section class="work"><button class="sum" data-turn aria-expanded="' + turnOpen + '">' + chev + '<span class="headline">Worked for ' + (long ? '2h 28m' : '1m 12s') + ' · ' + steps + ' steps · Ran ' + cmds + ' commands</span></button>' + (turnOpen ? '<div class="inside">' + inner + '</div>' : '') + '</section>'
  html += reply(long ? '21:15' : '18:48', long ? 'Uploaded all 60 results. The gauntlet passed 57 of 60.' : 'Ready to start: say go and I will run it.')
  const pressed = [...groupOpen].map(([k, o]) => k + ' ' + (o ? 'open' : 'folded')).join(', ') || 'none'
  html += '<p class="state">State · variant ' + v + ' · ' + (long ? 'long turn, ' + list.length + ' groups' : 'short turn, 2 groups') + ' · Worked for ' + (turnOpen ? 'open' : 'folded') + ' · groups you pressed: ' + pressed + '</p>'
  document.getElementById('col').replaceChildren(el(html))
}
document.getElementById('col').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return
  if (b.hasAttribute('data-turn')) turnOpen = !turnOpen
  else if (b.dataset.group) groupOpen.set(b.dataset.group, b.getAttribute('aria-expanded') !== 'true')
  render()
})
const step = d => { variant = (variant + d + VARIANTS.length) % VARIANTS.length; render() }
document.getElementById('prev').onclick = () => step(-1)
document.getElementById('next').onclick = () => step(1)
document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1) })
document.getElementById('long').onclick = e => { long = !long; e.currentTarget.setAttribute('aria-pressed', long); render() }
document.getElementById('light').onclick = e => { const on = document.documentElement.dataset.theme !== 'light'; document.documentElement.dataset.theme = on ? 'light' : ''; e.currentTarget.setAttribute('aria-pressed', on) }
document.getElementById('small').onclick = e => { const a = document.getElementById('app'); a.toggleAttribute('data-small'); e.currentTarget.setAttribute('aria-pressed', a.hasAttribute('data-small')) }
render()
</script>
</body>
</html>
