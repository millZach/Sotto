<!doctype html>
<!--
  PROTOTYPE, throwaway. Not shipped, not tested, not wired to anything.

  Question (E6 #1029 with E9 #1032): how does Zach see, and change, which machine and which thread each worker
  belongs to: Watcher's workers, and workers a thread delegated?

  Surfaces (switch at the top):
    Settings -> Watcher   "Where new workers start" and each machine's own Threads in flight limit (1 to 8, default 4).
    Watcher's room        the per-machine limit line, receipts that record the machine and Watcher's reason, a full
                          machine refusing, a machine with no copy of the project, low free memory as a fact.
    Delegation            an ordinary thread that delegated: its children, their machine and outcome, the wait and its
                          timeout, "Delegated by", your turn in a child pausing the parent's sends, Stop cascading,
                          the permission ceiling refusing a wider child.

  Variants (?variant=A|B|C, the bottom switcher, or the arrow keys):
    A  In place.     Machines are words where the work already is: a row per machine in Settings, a limit line under
                     Watcher's header, a machine line in each receipt, delegation cards in the parent's transcript and
                     children indented under the parent in the sidebar.
    B  Machines.     Machines are things on screen: a tile per machine in Settings where you pick the default, a strip
                     of machine chips with meters under Watcher's header (each opens what runs there), and a Delegated
                     panel beside the parent grouped by machine.
    C  Thread tree.  Who works for whom comes first: one machines table in Settings, a Workers tab in the room that
                     draws Watcher and each delegating thread with their workers under them, and a tree in the sidebar
                     with a breadcrumb in the child's header.

  Settled before this prototype (plan.md, Zach, October 14, 2026): delegation is one level deep and shares the
  starts-only limit; the default is This computer, so nothing moves until you choose; your words override it for one
  request; a machine with no copy is refused, never cloned; an older host's facts read "unknown", never guessed.

  Every number is computed from one model: change a limit in Settings and the room, the refusals and the readout follow.
  ?shot=1 hides the prototype's own bars for screenshots. Other params: surface, theme, size, machines, room, deleg,
  pane, child, tab, placement, lowmem, open, l_local, l_forge, l_studio.
-->

* { box-sizing: border-box; }

        <div class="composer__row">
          <button type="button" class="iconbtn" data-k="cattach" aria-label="Attach a file">${ic('clip', 15)}</button>
          <div class="chips"><button type="button" class="chip" data-k="cmodel">${pm(w.prov, 13)}${MODEL[w.prov]}${ic('down', 13)}</button>
          <button type="button" class="chip" data-k="cperm">Allow edits${ic('down', 13)}</button></div>
          ${working ? `<button type="button" class="send send--stop" data-k="cstop" aria-label="Stop ${w.title}"><i></i></button>` : `<button type="button" class="send" data-k="csend" aria-label="Send">${ic('up', 15)}</button>`}
        </div>
      </div>
      <p class="under">${ic('fork', 13)}<span>${v === 'A' ? '' : `Delegated by ${PARENT}. `}${note}</span></p>
    </div>`;
}
function renderThreads() {
  return `<div class="tp"><aside class="tside" aria-label="Threads">${sidebar()}</aside><section class="pane" aria-label="${S.pane === 'parent' ? PARENT : delegated().find(k => k.id === S.child).title}">${S.pane === 'child' ? childPane() : parentPane()}</section></div>`;
}

/* ---------- render, focus and state ---------- */
const win = document.getElementById('win');
let lastSurfaceKey = '';
function render() {
  if (S.surface !== 'room' && S.tab === 'workers' && S.variant !== 'C') S.tab = 'conversation';
  if (S.variant !== 'C' && S.tab === 'workers') S.tab = 'conversation';
  const active = document.activeElement && document.activeElement.closest ? document.activeElement.closest('[data-k]') : null;
  const k = active && win.contains(active) ? active.dataset.k : null;
  const keep = {};
  win.querySelectorAll('[data-scroll]').forEach(el => { keep[el.dataset.scroll] = el.scrollTop; });
  const [w, h, sz] = SIZES[S.size];
  document.documentElement.dataset.theme = S.theme;
  document.body.classList.toggle('shot', S.shot);
  win.dataset.size = sz;
  win.style.setProperty('--w', w + 'px');
  win.style.setProperty('--h', h + 'px');
  win.style.setProperty('--fit', S.shot ? 1 : Math.min(1, (innerWidth - 24) / w));
  if (S.shot) { win.style.setProperty('--w', '100vw'); win.style.setProperty('--h', '100vh'); }
  const surface = { settings: renderSettings, room: renderRoom, delegation: renderThreads }[S.surface]();
  win.innerHTML = surface + wctl();
  const key = [S.surface, S.variant, S.room, S.deleg, S.pane, S.child, S.tab].join('|');
  win.querySelectorAll('[data-scroll]').forEach(el => {
    if (key === lastSurfaceKey && keep[el.dataset.scroll] !== undefined) el.scrollTop = keep[el.dataset.scroll];
    else if (el.hasAttribute('data-bottom')) el.scrollTop = el.scrollHeight;
  });
  lastSurfaceKey = key;
  if (S.justOpened) {
    const pop = win.querySelector('[data-pop]');
    const first = pop && pop.querySelector('button, select, input, a[href]');
    if (first) first.focus();
    S.justOpened = false;
  } else if (k) {
    const el = win.querySelector(`[data-k="${CSS.escape(k)}"]`);
    if (el) el.focus();
  }
  syncBars();
  syncURL();
  if (!S.shot) document.querySelector('.stage').style.paddingTop = (document.querySelector('.proto-top').offsetHeight + 20) + 'px';
}
function syncBars() {
  document.querySelectorAll('#pt-surface button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.surface === S.surface)));
  document.getElementById('pt-machines').value = S.machines;
  document.getElementById('pt-room').value = S.room;
  document.getElementById('pt-deleg').value = S.deleg;
  document.getElementById('pt-size').value = S.size;
  document.getElementById('pt-low').checked = S.lowmem || S.room === 'lowmem';
  document.getElementById('pt-low').disabled = S.room === 'lowmem';
  document.getElementById('pt-room-l').style.display = S.surface === 'room' ? '' : 'none';
  document.getElementById('pt-deleg-l').style.display = S.surface === 'delegation' ? '' : 'none';
  document.getElementById('pt-theme').textContent = S.theme === 'dark' ? 'Light' : 'Dark';
  document.getElementById('pv-label').textContent = `${S.variant}: ${VARIANTS[S.variant]}`;
  const lines = machines().map(m => !m.connected ? `${m.name} not connected` : `${m.name} ${count(m.id)} of ${limit(m.id)}${m.facts ? `, ${m.free} GB free` : ', facts unknown'}`).join(' · ');
  const kids = delegated().map(w => `${w.title}: ${OUT[w.outcome]} on ${name(w.on)}`).join(' · ');
  document.getElementById('pt-state').textContent = `Default: ${S.placement === 'watcher' ? 'Let Watcher choose' : name(S.placement)}${S.placement !== 'watcher' && !live(S.placement) ? ' (not connected)' : ''}  |  ${lines}  |  Delegated by ${PARENT}: ${kids || 'none'}`;
}
function syncURL() {
  const q = new URLSearchParams({ variant: S.variant, surface: S.surface, theme: S.theme, size: S.size, machines: S.machines, room: S.room, deleg: S.deleg, pane: S.pane, child: S.child, tab: S.tab, placement: S.placement });
  if (S.lowmem) q.set('lowmem', '1');
  for (const id of ['local', 'forge', 'studio']) if (S.limits[id] !== 4) q.set('l_' + id, S.limits[id]);
  if (!S.kids) q.set('kids', '0');
  if (S.shot) q.set('shot', '1');
  history.replaceState(null, '', '?' + q.toString());
}
function navigate(go) {
  S.open = null;
  if (go === 'settings' || go === 'room' || go === 'delegation') { S.surface = go; if (go === 'room') S.tab = 'conversation'; }
  else if (go === 'parent') { S.surface = 'delegation'; S.pane = 'parent'; }
  else if (go.startsWith('child:')) { S.surface = 'delegation'; S.pane = 'child'; S.child = go.slice(6); }
  else return;
  render();
  const focusTarget = win.querySelector(S.surface === 'settings' ? '.snav__item[aria-current]' : S.surface === 'room' ? '#wmsg' : '.trow[aria-current]');
  if (focusTarget) focusTarget.focus();
}
win.addEventListener('click', e => {
  const t = e.target.closest('[data-act], [data-go]');
  if (!t) {
    if (S.open && !e.target.closest('[data-pop]')) { S.open = null; render(); }
    return;
  }
  if (t.dataset.go) { if (t.dataset.go !== 'none') navigate(t.dataset.go); else if (t.closest('.trow')) { /* other threads are not drawn */ } return; }
  const act = t.dataset.act;
  if (act === 'toggle') { const next = S.open === t.dataset.open ? null : t.dataset.open; S.open = next; S.justOpened = !!next; S.opener = t.dataset.k; render(); }
  else if (act === 'close') closePop();
  else if (act === 'tab') { S.tab = t.dataset.tab; render(); }
  else if (act === 'kids') { S.kids = !S.kids; render(); }
  else if (act === 'step') { S.limits[t.dataset.m] = Math.min(8, Math.max(1, S.limits[t.dataset.m] + Number(t.dataset.d))); render(); }
});
win.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'place') { S.placement = t.value; render(); }
  if (t.dataset.act === 'limit') { S.limits[t.dataset.m] = Number(t.value); render(); }
});
function closePop() {
  const opener = S.opener;
  S.open = null; render();
  const el = opener && win.querySelector(`[data-k="${CSS.escape(opener)}"]`);
  if (el) el.focus();
}
function cycle(d) {
  const keys = Object.keys(VARIANTS);
  S.variant = keys[(keys.indexOf(S.variant) + d + keys.length) % keys.length];
  S.open = null; render();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.open) { e.preventDefault(); closePop(); return; }
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const tl = e.target.closest && e.target.closest('[role="tablist"]');
  if (tl) {
    const tabsEls = [...tl.querySelectorAll('[role="tab"]')];
    const i = tabsEls.indexOf(e.target.closest('[role="tab"]'));
    const next = tabsEls[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabsEls.length) % tabsEls.length];
    S.tab = next.dataset.tab; render(); e.preventDefault();
    const now = win.querySelector(`[data-k="tab-${S.tab}"]`); if (now) now.focus();
    return;
  }
  if (e.target.closest && e.target.closest('input, select, textarea, [contenteditable], [role="radiogroup"], fieldset, table, .step')) return;
  e.preventDefault(); cycle(e.key === 'ArrowRight' ? 1 : -1);
});
document.getElementById('pv-prev').addEventListener('click', () => cycle(-1));
document.getElementById('pv-next').addEventListener('click', () => cycle(1));
document.querySelectorAll('#pt-surface button').forEach(b => b.addEventListener('click', () => { S.surface = b.dataset.surface; S.open = null; render(); }));
document.getElementById('pt-machines').addEventListener('change', e => { S.machines = e.target.value; render(); });
document.getElementById('pt-room').addEventListener('change', e => { S.room = e.target.value; render(); });
document.getElementById('pt-deleg').addEventListener('change', e => { S.deleg = e.target.value; S.pane = S.deleg === 'yourturn' ? 'child' : S.pane; S.child = S.deleg === 'yourturn' ? 'd2' : S.child; render(); });
document.getElementById('pt-low').addEventListener('change', e => { S.lowmem = e.target.checked; render(); });
document.getElementById('pt-size').addEventListener('change', e => { S.size = e.target.value; render(); });
document.getElementById('pt-theme').addEventListener('click', () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; render(); });
addEventListener('resize', () => render());
if (S.open) S.opener = S.open.startsWith('mchip:') ? S.open : S.open === 'dpanel' ? 'dp-btn' : 'more';
render();
})();
</script>
</body>
</html>
