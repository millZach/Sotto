<title>Owlets sidebar, prototype</title>
<!--
  PROTOTYPE — throwaway. Not shipped, not tested, not wired to anything. Every press changes memory only,
  and the page asks no other host for anything: the font is the file beside it.

  Question: what should a row in the Owlets sidebar show? Zach looked at three Owlets looks
  (docs/prototypes/owlets-looks/) on November 19, 2026 and said: "I kind of prefer just a side bar that has
  all the owlets in one bar on the left with a main thread window for them. Easiest to manage and add as
  many as you like". So this is one layout, Sotto's own Threads page (a sidebar and a pane), with three
  row variants on the same route, switchable with ?variant= and the bar at the bottom:

    R1  Names       A status ring and a name. A to Z.
    R2  Two lines   The owlet's own mark, its name and role, then the home computer and what happened last or
                    the next run. Newest first.
    R3  Grouped     Folding heads by state (Working now, New reports, Idle) or by computer. One line a row.

  The same twenty made-up owlets are in all three, and the thread window, the cards, the setup and the
  phone are the same whichever rows are showing.

  Built in, from Zach's answers: a page of its own, an Owl feature; a schedule and events as well as when
  asked; a card nobody answers lapses in five minutes and nothing is sent; the same tools as a thread, under
  its permission mode; a folder of its own; one home computer and a model each; a scheduled run due while
  its computer sleeps is skipped and the next report says so; Needs you and an unread mark, no notification;
  every run is more turns in its one thread; the three events are a red CI run, a new issue or comment and
  new mail; owlets are drawn; the iPhone also sets one up and edits it; nothing of Watcher is here.

  One file on purpose, with the Figtree files beside it: the repository's lint reads every .js file, and
  this is not product code.

  The bar: rows (← → cycle), jump to a screen, theme, window size, start again. Under 700px wide the window
  frame goes and the page is the iPhone app. Add &bare=1 to any link to drop the bar and the caption.

  URL: ?variant=R1|R2|R3 &owlet=<id> &screen=setup &edit=<id> &group=state|computer &q=<search>
       &where=all|here|forge &side=open|rail &open=about &at=report|card|lapsed|end|top
       &theme=dark|light &size=fit|1600x1000|1280x800|820x560|390x844 &bare=1
-->

  --tt-hairline: oklch(0.305 0.02 265);
  --tt-field-border: oklch(0.42 0.02 265);

  --tt-well: oklch(0.978 0.004 85);
  --tt-field: oklch(0.99 0.003 85);
  --tt-overlay: oklch(0.99 0.003 85);
  --tt-bubble: oklch(0.93 0.012 85);

  --tt-hairline: oklch(0.86 0.012 80);
  --tt-field-border: oklch(0.72 0.016 80);
  --tt-accent: oklch(0.53 0.095 186);
  --tt-accent-text: oklch(0.4 0.08 186);
  --tt-on-accent: oklch(0.99 0.003 85);

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: #16171b; font-family: var(--tt-font); -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4, p, ul, ol, dl, dd, pre, fieldset, legend { margin: 0; padding: 0; }
fieldset { border: 0; min-width: 0; }
ul, ol { list-style: none; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ============ the prototype's own controls: not part of the design ============ */
.stage { height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(440px, 1fr); justify-items: center; gap: 8px; padding: 10px 12px 78px; }
.top { width: 100%; display: flex; justify-content: center; }
.cap { max-width: 1180px; width: 100%; font: 13px/1.45 system-ui, sans-serif; color: #cfd1d9; }
.cap strong { color: #fff; }
.cap .cap__rule { color: #a9acb8; }
.bar { position: fixed; left: 0; right: 0; bottom: 12px; margin: 0 auto; width: max-content; z-index: 90; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; padding: 8px; max-width: calc(100vw - 16px); background: #0d0e11; color: #eee; border: 1px solid #454752; border-radius: 12px; font: 13px system-ui, sans-serif; box-shadow: 0 6px 24px rgb(0 0 0 / 50%); }
.bar button, .bar select { min-height: 36px; padding: 4px 10px; border-radius: 8px; border: 1px solid #454752; background: #1b1c21; color: #eee; font: inherit; }
.bar .lab { min-width: 132px; text-align: center; font-weight: 600; padding: 0 4px; }
.bar :focus-visible { outline: 2px solid #7fe0d0; outline-offset: 1px; }
.bar .sep { width: 1px; align-self: stretch; background: #454752; margin: 0 2px; }
.cap__more { border: 0; background: none; padding: 0 2px; color: #7fe0d0; font: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.cap__more:focus-visible { outline: 2px solid #7fe0d0; outline-offset: 2px; }

.win { position: relative; width: 100%; height: 100%; min-height: 440px; background: var(--tt-canvas); color: var(--tt-text); font-size: 14px; line-height: 1.45; border: 1px solid #000; overflow: hidden; display: flex; flex-direction: column; }
.stage[data-size='1600x1000'] .win { width: 1600px; height: 1000px; }
.stage[data-size='1280x800'] .win { width: 1280px; height: 800px; }
.stage[data-size='820x560'] .win { width: 820px; height: 560px; }
.stage[data-size='390x844'] .win { width: 390px; height: 844px; border-radius: 34px; border: 0; box-shadow: 0 0 0 9px #050506, 0 0 0 10px #3a3b42; margin: 10px 0; }
.stage:not([data-size='fit']) { justify-items: start; overflow-x: auto; grid-template-rows: auto auto; height: auto; min-height: 100dvh; align-content: start; }
.stage:not([data-size='fit']) .win { justify-self: center; flex: none; }

/* bare: the window is the whole viewport, for checking at an exact size */
body[data-bare='true'] .stage { padding: 0; gap: 0; grid-template-rows: 1fr; min-height: 100dvh; height: 100dvh; }
body[data-bare='true'] .cap, body[data-bare='true'] .bar { display: none; }
body[data-bare='true'] .win { width: 100vw; height: 100dvh; min-height: 0; border: 0; border-radius: 0; box-shadow: none; margin: 0; }

@media (max-width: 700px) {
  .stage, .stage:not([data-size='fit']) { padding: 0; gap: 0; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100dvh; min-height: 0; overflow: hidden; justify-items: stretch; }
  .stage .win, .stage[data-size] .win { width: 100%; height: 100%; min-height: 0; border: 0; border-radius: 0; box-shadow: none; margin: 0; }
  .top { display: flex; flex-direction: column; min-width: 0; background: #0d0e11; border-bottom: 1px solid #454752; }
  .bar { position: static; margin: 0; width: auto; max-width: none; border: 0; border-radius: 0; box-shadow: none; padding: 6px 8px 4px; justify-content: flex-start; flex-wrap: nowrap; min-width: 0; }
  .bar button, .bar select { min-height: 44px; min-width: 44px; flex: none; font-size: 16px; }
  .bar .lab { min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .bar .size, .bar .sep, .bar .reset { display: none; }
  .bar .jump { width: 104px; }
  .cap { padding: 0 10px 8px; font-size: 12px; line-height: 1.4; max-width: none; }
  body[data-bare='true'] .top { display: none; }
  body[data-bare='true'] .stage { grid-template-rows: minmax(0, 1fr); }
}

/* ============ focus, text helpers ============ */
.win :focus-visible { outline: 2px solid var(--tt-accent); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--tt-muted); }
.mono { font-family: var(--tt-mono); font-size: 0.92em; }
.grow { flex: 1; min-width: 0; }

.owltag { flex: none; font-size: 11px; font-weight: 600; line-height: 1.4; padding: 0 6px; border-radius: 4px; border: 1px solid var(--tt-field-border); color: var(--tt-muted); }
.idea { display: inline-block; flex: none; font-size: 11px; font-weight: 600; line-height: 1.4; padding: 0 6px; border-radius: 999px; border: 1px dashed var(--tt-field-border); color: var(--tt-muted); white-space: nowrap; }

/* The status ring, as a thread's: an outline at rest, a ring that turns while it works, amber when it wants
   you, green with a filled centre for a report nobody has read. */
.ring { display: block; flex: none; width: 10px; height: 10px; justify-self: center; border: 1.5px solid var(--tt-muted); border-radius: 50%; }
.ring[data-state='working'] { border: 0; background: conic-gradient(var(--tt-accent-text) 0 32%, color-mix(in srgb, var(--tt-accent-text) 26%, transparent) 32% 100%); -webkit-mask: radial-gradient(circle, transparent 38%, #000 42%); mask: radial-gradient(circle, transparent 38%, #000 42%); animation: ring 1.5s linear infinite; }
.ring[data-state='needs'] { border: 2px solid var(--tt-warning-text); }
.ring[data-unread] { border: 1.5px solid var(--tt-success); background: radial-gradient(circle, var(--tt-success) 0 30%, transparent 34%); }
@keyframes ring { to { rotate: 360deg; } }

.owl { flex: none; display: block; }
.owl .b { fill: color-mix(in oklab, var(--tt-text) 34%, var(--tt-canvas)); }
.owl .f { fill: color-mix(in oklab, var(--tt-text) 58%, var(--tt-canvas)); }
.owl .e { fill: var(--tt-canvas); }
.owl .p { fill: var(--tt-text); }
.owl .z { stroke: var(--tt-text-2); stroke-width: 1.6; fill: none; stroke-linecap: round; }
.owl[data-state='working'] .p { fill: var(--tt-accent); }
.owl[data-state='needs'] .p { fill: var(--tt-warning-text); }

/* ============ the page: Sotto's Threads layout, a sidebar and a pane ============ */
.shell { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: 280px minmax(0, 1fr); }
.shell[data-side='rail'], .shell[data-side='over'] { grid-template-columns: 52px minmax(0, 1fr); }
.shell[data-side='over'] .side { position: absolute; inset: 0 auto 0 0; z-index: 30; width: 280px; box-shadow: var(--tt-shadow); }
.shell__scrim { position: absolute; inset: 0; z-index: 20; background: var(--tt-scrim); }

.side { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--tt-sidebar); border-right: 1px solid var(--tt-hairline); }
.side__top { flex: none; display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 6px 0 14px; }
.mark { display: block; flex: none; width: 24px; height: 24px; }
.side__top .mark { margin-right: auto; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px 0 6px; border: 0; border-radius: 6px; background: transparent; color: var(--tt-text-2); font-size: 13px; font-weight: 500; white-space: nowrap; }
.tbtn:hover, .ibtn:hover { background: var(--tt-hover-soft); color: var(--tt-text); }
.tbtn svg { width: 16px; height: 16px; flex: none; }
.ibtn { display: grid; place-items: center; flex: none; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--tt-muted); }
.ibtn svg { width: 16px; height: 16px; }
.side__title { flex: none; display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 10px 6px 14px; }
.side__title h2 { font-size: 13px; font-weight: 600; }
.side__order { font-size: 12px; color: var(--tt-muted); white-space: nowrap; }
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 6px; background: var(--tt-card); }
.seg button { height: 20px; padding: 0 7px; border: 0; border-radius: 4px; background: transparent; color: var(--tt-muted); font-size: 12px; white-space: nowrap; }
.seg button[aria-pressed='true'] { background: var(--tt-overlay); color: var(--tt-text); font-weight: 600; }

.search { position: relative; display: flex; flex: none; align-items: center; height: 32px; margin: 0 8px 8px; color: var(--tt-muted); }
.search > svg { position: absolute; left: 9px; top: 50%; width: 16px; height: 16px; translate: 0 -50%; pointer-events: none; }
.search input { width: 100%; height: 100%; min-width: 0; padding: 0 28px 0 32px; border: 1px solid var(--tt-hairline); border-radius: 6px; background: var(--tt-field); color: var(--tt-text); font-size: 13px; }
.search input::placeholder { color: var(--tt-muted); opacity: 1; }
.search input::-webkit-search-cancel-button { display: none; }
.search__clear { position: absolute; top: 50%; right: 4px; display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: var(--tt-muted); translate: 0 -50%; }
.search__clear svg { width: 14px; height: 14px; }
.search__clear[hidden] { display: none; }

/* Needs you: the Threads sidebar's own card. A card that waits leads; a card that lapsed rests under it. */
.needs { flex: none; margin: 0 8px 6px; padding: 3px 7px 2px; border-radius: 8px; background: var(--tt-card); }
.needs__head { display: flex; align-items: center; gap: 6px; min-height: 22px; }
.needs__head h2 { font-size: 13px; font-weight: 600; }
.needs__count { padding: 0 5px; border-radius: 4px; background: var(--tt-well); color: var(--tt-text-2); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.needs__longest { margin-left: auto; color: var(--tt-muted); font-size: 12px; white-space: nowrap; }
.needs__entry { border-top: 1px solid var(--tt-hairline); }
.needs__line { display: flex; align-items: center; gap: 6px; min-width: 0; min-height: 28px; }
.needs__title { flex: 1 1 auto; min-width: 0; padding: 0; border: 0; background: transparent; font-size: 13px; font-weight: 500; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.needs__title span { font-weight: 400; color: var(--tt-muted); }
.needs__entry[data-rest] .needs__line { color: var(--tt-muted); font-size: 12px; }
.needs__entry[data-rest] .needs__title { flex: 0 1 auto; color: var(--tt-text-2); font-size: 12px; }
.needs__when { flex: none; white-space: nowrap; }
.needs__actions { display: flex; flex: none; gap: 4px; margin-left: auto; }
.nbtn { flex: none; min-height: 22px; padding: 0 6px; border: 1px solid var(--tt-field-border); border-radius: 6px; background: var(--tt-well); font-size: 12px; white-space: nowrap; }
.nbtn--ghost { border-color: transparent; background: transparent; color: var(--tt-muted); }
.nbtn:hover { background: var(--tt-hover-soft); }
.needs__entry[data-rest]:not(:hover, :focus-within) .needs__actions { opacity: 0; }
@media (hover: none) { .needs__entry[data-rest] .needs__actions { opacity: 1 !important; } }

.side__scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 4px 12px; scrollbar-width: thin; scrollbar-color: var(--tt-hairline) transparent; }
.side__empty { margin: 6px 10px; color: var(--tt-muted); font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
.row { position: relative; display: flex; margin: 1px 0; border: 1px solid transparent; border-radius: 6px; }
.row:hover { background: var(--tt-hover); }
.row[data-current] { background: var(--tt-selected); border-color: var(--tt-selected-border); }
.row__btn { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; column-gap: 9px; align-items: center; flex: 1; min-width: 0; min-height: 34px; padding: 0 8px 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--tt-text-2); text-align: left; }
.row__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 500; }
.row[data-current] .row__name { color: var(--tt-text); }
.row__l1 { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.row__l1 .row__name { flex: 0 1 auto; }
.row__role { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tt-muted); font-size: 13px; }
.row__end { display: inline-flex; align-items: center; color: var(--tt-muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row__end svg { width: 14px; height: 14px; }
.row__end[data-tone='needs'] { color: var(--tt-warning-text); }
.row__end[data-tone='working'] { color: var(--tt-accent-text); }
/* two lines: the owlet's own mark, its name and role, then the home computer and what happened or what is next */
.row--two .row__btn { grid-template-columns: 31px minmax(0, 1fr); column-gap: 8px; row-gap: 3px; min-height: 52px; padding: 7px 8px 8px; }
.row--two .row__name { font-weight: 600; color: var(--tt-text); }
.row__face { grid-column: 1; grid-row: 1 / span 2; position: relative; width: 31px; height: 31px; }
.row__face .ring { position: absolute; right: 0; bottom: 0; }
.row__face .ring:not([data-state='working']) { background-color: var(--tt-sidebar); }
.row[data-current] .row__face .ring:not([data-state='working']) { background-color: var(--tt-selected); }
.row--two .row__l1 { grid-column: 2; grid-row: 1; }
.row__l2 { grid-column: 2; grid-row: 2; display: flex; gap: 10px; min-width: 0; color: var(--tt-muted); font-size: 13px; line-height: 1.3; }
.row__home { flex: none; white-space: nowrap; }
.row__what { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row__what[data-tone='needs'] { color: var(--tt-warning-text); }
.row__what[data-tone='working'] { color: var(--tt-accent-text); }
.row__what[data-tone='news'] { color: var(--tt-text-2); }
/* groups: a quiet head that folds, as Working now and Recent do */
.group { margin-bottom: 8px; }
.group__head { display: flex; align-items: center; gap: 5px; width: 100%; min-height: 28px; padding: 0 12px 0 6px; border: 0; border-radius: 6px; background: transparent; color: var(--tt-muted); font-size: 12px; font-weight: 600; letter-spacing: .02em; text-align: left; }
.group__head:hover { background: var(--tt-hover); color: var(--tt-text); }
.group__head svg { flex: none; width: 14px; height: 14px; transition: transform .16s ease; }
.group__head[aria-expanded='true'] svg { transform: rotate(90deg); }
.group__count { margin-left: auto; font-weight: 400; font-variant-numeric: tabular-nums; }

/* the foot: the room switch, with Owlets as a fourth room, then Usage, Settings and Help */
.side__foot { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 12px 10px; color: var(--tt-muted); }
.side__foot span { position: relative; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; }
.side__foot svg { width: 18px; height: 18px; }
.side__foot .on { background: var(--tt-card); color: var(--tt-text); }
.side__foot .on::after { content: ''; position: absolute; left: 8px; right: 8px; bottom: 2px; height: 2px; border-radius: 2px; background: var(--tt-text-2); }
.side__foot .sep { width: 1px; height: 18px; border-radius: 0; background: var(--tt-hairline); }

/* collapsed: the rail, as the Threads sidebar folds at a narrow window */
.rail { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; min-height: 0; padding: 10px 0 8px; background: var(--tt-sidebar); border-right: 1px solid var(--tt-hairline); }
.rail__list { flex: 1; min-height: 0; width: 100%; overflow-y: auto; scrollbar-width: none; }
.rail__list::-webkit-scrollbar { display: none; }
.rail__list ul { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 2px 0 6px; }
.rail__list li { position: relative; display: grid; place-items: center; width: 42px; height: 40px; }
.tile { position: relative; display: grid; place-items: center; width: 32px; height: 34px; padding: 0; border: 1px solid var(--tt-hairline); border-radius: 8px; background: var(--tt-card); color: var(--tt-text-2); font-size: 13px; font-weight: 500; }
.tile:hover { color: var(--tt-text); border-color: var(--tt-field-border); }
.tile[aria-current='true'] { background: var(--tt-selected); border-color: color-mix(in srgb, var(--tt-accent) 30%, var(--tt-field-border)); color: var(--tt-text); }
.rail__list li > .ring { position: absolute; right: 1px; bottom: 0; pointer-events: none; }
.rail__list li > .ring:not([data-state='working']) { background-color: var(--tt-sidebar); }
.rail__foot { flex: none; display: grid; gap: 6px; color: var(--tt-muted); }
.rail__foot span { display: grid; place-items: center; width: 28px; height: 28px; }
.rail__foot svg { width: 18px; height: 18px; }

/* ============ the pane: one owlet's thread ============ */
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--tt-canvas); }
.pane__head { flex: none; display: flex; align-items: center; gap: 14px; height: 44px; padding: 0 10px 0 18px; min-width: 0; }
.pane__who { display: flex; align-items: center; gap: 10px; flex: 0 1 auto; min-width: 0; }
.pane__head h1 { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pane__role { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tt-muted); font-size: 13px; }
.pane__fact { display: inline-flex; align-items: center; gap: 6px; flex: 0 1 auto; min-width: 0; color: var(--tt-text-2); font-size: 13px; white-space: nowrap; }
.pane__fact svg { flex: none; width: 16px; height: 16px; color: var(--tt-muted); }
.pane__fact span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.hbtn { display: inline-flex; align-items: center; gap: 6px; flex: none; height: 28px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--tt-text-2); font-size: 13px; font-weight: 500; white-space: nowrap; }
.hbtn:hover { background: var(--tt-hover-soft); color: var(--tt-text); }
.hbtn svg { width: 16px; height: 16px; }
.pane__runs { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding: 0 18px 9px; border-bottom: 1px solid var(--tt-hairline); color: var(--tt-text-2); font-size: 13px; }
.pane__runs b { font-weight: 600; color: var(--tt-muted); }
.pane__runs span { display: inline-flex; align-items: center; gap: 5px; }
.pane__runs svg { flex: none; width: 14px; height: 14px; color: var(--tt-muted); }
.pane__runs .pane__next { margin-left: auto; color: var(--tt-muted); }
.pane__scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 20px 22px; scrollbar-width: thin; scrollbar-color: var(--tt-hairline) transparent; }
.col { max-width: 760px; margin: 0 auto; }
.pane__foot { flex: none; padding: 0 20px 18px; }

/* a conversation */
.talk { display: grid; gap: 18px; align-content: start; font-size: 16px; line-height: 1.6; }
.msg p { overflow-wrap: anywhere; }
.msg__who { margin-bottom: 3px; color: var(--tt-text-2); font-size: 12px; font-weight: 600; line-height: 1.4; }
.msg__who span { margin-left: 10px; color: var(--tt-muted); font-weight: 400; }
.msg--you { justify-self: end; max-width: 86%; padding: 11px 16px 13px; border-radius: 14px; background: var(--tt-bubble); }
.day { color: var(--tt-muted); font-size: 12px; text-align: center; }
.note { color: var(--tt-muted); font-size: 13px; line-height: 1.5; }
.runline { display: flex; align-items: center; gap: 8px; color: var(--tt-muted); font-size: 13px; line-height: 1.4; }
.runline svg { flex: none; width: 14px; height: 14px; }
.runline span { min-width: 0; }
.runline::after { content: ''; flex: 1 1 24px; height: 1px; background: var(--tt-hairline); }
.steps { color: var(--tt-muted); font-size: 13px; line-height: 1.5; }
.steps summary { display: inline-flex; align-items: center; gap: 6px; width: max-content; max-width: 100%; border-radius: 6px; cursor: pointer; list-style: none; }
.steps summary::-webkit-details-marker { display: none; }
.steps summary svg { width: 13px; height: 13px; }
.steps[open] summary svg { transform: rotate(90deg); }
.steps ul { display: grid; gap: 2px; margin-top: 6px; }
.steps li { display: flex; gap: 8px; align-items: baseline; overflow-wrap: anywhere; }
.steps li::before { content: ''; flex: none; width: 5px; height: 5px; border: 1px solid var(--tt-muted); border-radius: 50%; transform: translateY(-1px); }
.working { display: flex; align-items: center; gap: 9px; color: var(--tt-accent-text); font-size: 14px; }

/* a report from a run nobody was there for */
.report { display: grid; gap: 12px; padding: 14px 16px; border-radius: 14px; background: var(--tt-card); font-size: 14px; line-height: 1.5; }
.report__label { color: var(--tt-accent-text); font-size: 12px; font-weight: 600; }
.report h3 { font-size: 17px; font-weight: 650; line-height: 1.3; }
.report__meta { margin-top: 2px; color: var(--tt-muted); font-size: 13px; }
.report__missed { display: flex; gap: 9px; align-items: flex-start; padding: 8px 12px; border-radius: 10px; background: var(--tt-well); color: var(--tt-text-2); }
.report__missed svg { flex: none; width: 16px; height: 16px; margin-top: 3px; color: var(--tt-warning-text); }
.report__missed strong { color: var(--tt-warning-text); font-weight: 600; }
.report__sum { font-size: 15px; }
.report h4 { margin-bottom: 6px; color: var(--tt-muted); font-size: 13px; font-weight: 600; }
.report li { position: relative; padding: 2px 0 2px 14px; overflow-wrap: anywhere; }
.report li::before { content: ''; position: absolute; left: 2px; top: 0.74em; width: 4px; height: 4px; border-radius: 50%; background: var(--tt-muted); }
.report__did { display: flex; flex-wrap: wrap; gap: 2px 14px; padding-top: 9px; border-top: 1px solid var(--tt-well); color: var(--tt-text-2); font-size: 13px; }
.report__did b { color: var(--tt-muted); font-weight: 600; }

/* the card: every word that will go, and the two answers. Lapsed, it keeps the words and loses the answers. */
.req { display: grid; gap: 10px; padding: 14px 16px 12px; border-radius: 14px; background: var(--tt-card); box-shadow: inset 3px 0 0 var(--tt-warning-text); font-size: 14px; line-height: 1.5; }
.req--lapsed { box-shadow: inset 3px 0 0 var(--tt-field-border); }
.report .req { border-radius: 10px; background: var(--tt-well); }
.req__top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
.req h3 { font-size: 15px; font-weight: 650; }
.req__state { color: var(--tt-warning-text); font-size: 13px; font-weight: 600; }
.req__by { margin-top: 1px; color: var(--tt-muted); font-size: 13px; }
.req__h, .report .req__h { margin: 0; color: var(--tt-muted); font-size: 13px; font-weight: 600; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--tt-muted); }
.kv dd { overflow-wrap: anywhere; }
.req__body { padding: 10px 12px; border-radius: 10px; background: var(--tt-well); color: var(--tt-text); font-family: var(--tt-font); font-size: 14px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.report .req .req__body { background: var(--tt-card); }
.req__note { color: var(--tt-text-2); font-size: 13px; }
.req__foot { color: var(--tt-muted); font-size: 12px; }
.req__later { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding-top: 10px; border-top: 1px solid var(--tt-hairline); color: var(--tt-muted); font-size: 13px; }
.req__later p { flex: 1 1 220px; min-width: 0; }
.answered { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 8px 12px; border-radius: 10px; background: var(--tt-card); color: var(--tt-text-2); font-size: 13px; line-height: 1.5; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; padding: 5px 14px; border: 1px solid var(--tt-field-border); border-radius: 6px; background: transparent; font-size: 13px; font-weight: 550; white-space: nowrap; }
.btn:hover { background: var(--tt-hover-soft); }
.btn--primary { border-color: transparent; background: var(--tt-accent); color: var(--tt-on-accent); font-weight: 650; }
.btn--primary:hover { background: var(--tt-accent); filter: brightness(1.08); }
.btn--link { min-height: 0; padding: 0; border: 0; background: none; color: var(--tt-accent-text); font-size: inherit; font-weight: 500; text-align: left; text-decoration: underline; text-underline-offset: 2px; white-space: normal; }
.btn svg { flex: none; width: 16px; height: 16px; }
.btnrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

/* the composer: the message, then what the thread is set to, as a thread's own shows it */
.composer { display: grid; gap: 4px; padding: 12px 10px 8px 16px; border-radius: 14px; background: var(--tt-card); }
.composer:has(textarea:focus-visible), .composer:has(input[type='text']:focus-visible) { box-shadow: 0 0 0 1.5px var(--tt-accent); }
.composer textarea, .composer input[type='text'] { width: 100%; min-width: 0; padding: 0; border: 0; background: transparent; font-size: 16px; line-height: 1.5; resize: none; }
.composer textarea:focus-visible, .composer input[type='text']:focus-visible { outline: none; }
.composer textarea::placeholder, .composer input::placeholder { color: var(--tt-muted); opacity: 1; }
.composer__foot { display: flex; align-items: center; gap: 2px; min-width: 0; }
.chipbtn { display: inline-flex; align-items: center; gap: 5px; flex: 0 1 auto; min-width: 0; height: 28px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--tt-muted); font-size: 13px; white-space: nowrap; }
.chipbtn:hover { background: var(--tt-hover-soft); color: var(--tt-text); }
.chipbtn svg { flex: none; width: 15px; height: 15px; }
.chipbtn span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.composer__send { display: grid; place-items: center; flex: none; width: 32px; height: 32px; margin-left: 6px; padding: 0; border: 0; border-radius: 50%; background: var(--tt-text); color: var(--tt-canvas); }
.composer__send svg { width: 18px; height: 18px; }
.win .composer__send:focus-visible { border-radius: 50%; }

/* ============ setting one up, in the pane ============ */
.setup { display: flex; flex: 1; flex-direction: column; min-width: 0; min-height: 0; }
.setup .pane__head { gap: 8px; border-bottom: 1px solid var(--tt-hairline); }
.setup__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 20px 32px; align-items: start; max-width: 1000px; margin: 0 auto; }
.setup__col { display: grid; gap: 16px; align-content: start; min-width: 0; }
.field { display: grid; gap: 5px; min-width: 0; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px 12px; }
.pair > .hint { grid-column: 1 / -1; }
.markrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; }
.markrow .lbl { display: inline-flex; align-items: center; gap: 8px; }
.looks { display: flex; gap: 8px; }
.looks label { position: relative; display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid var(--tt-field-border); border-radius: 8px; background: var(--tt-field); cursor: pointer; }
.looks label:has(input:checked) { border-color: var(--tt-accent); background: var(--tt-selected); }
.looks label:has(input:focus-visible) { outline: 2px solid var(--tt-accent); outline-offset: 2px; }
.looks input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.field > label, .field > .lbl, .field > legend { color: var(--tt-text-2); font-size: 13px; font-weight: 600; }
.field > legend { margin-bottom: 5px; }
.hint { color: var(--tt-muted); font-size: 12px; line-height: 1.45; }
.hint--warn { color: var(--tt-warning-text); }
.field input[type='text'], .field textarea, .field select { width: 100%; min-width: 0; min-height: 34px; padding: 6px 10px; border: 1px solid var(--tt-field-border); border-radius: 6px; background: var(--tt-field); font-size: 14px; }
.field textarea { min-height: 72px; line-height: 1.45; resize: vertical; }
.field input[aria-invalid='true'] { border-color: var(--tt-error-text); }
.pick { display: grid; gap: 6px; }
.pick--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pick label { display: flex; gap: 10px; align-items: flex-start; min-height: 44px; padding: 8px 10px; border: 1px solid var(--tt-field-border); border-radius: 8px; background: var(--tt-field); cursor: pointer; }
.pick label:has(input:checked) { border-color: var(--tt-accent); background: var(--tt-selected); }
.pick label:has(input:focus-visible) { outline: 2px solid var(--tt-accent); outline-offset: 2px; }
.pick input { flex: none; margin: 3px 0 0; accent-color: var(--tt-accent); }
.pick input:focus-visible { outline: none; }
.pick strong { display: block; font-size: 14px; font-weight: 600; }
.pick label > span { min-width: 0; }
.pick label > span > span { display: block; color: var(--tt-muted); font-size: 12px; line-height: 1.4; }
.pick label:has(input:checked) > span > span { color: var(--tt-text-2); }
.pick label[data-off='true'] { border-style: dashed; cursor: default; }
.pick label[data-off='true'] strong { color: var(--tt-muted); }
.sw { position: relative; flex: none; width: 36px; height: 20px; padding: 0; border: 1px solid var(--tt-field-border); border-radius: 10px; background: var(--tt-well); }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--tt-muted); transition: transform .12s; }
.sw[aria-checked='true'] { border-color: transparent; background: var(--tt-accent); }
.sw[aria-checked='true']::after { background: var(--tt-on-accent); transform: translateX(16px); }
.win .sw:focus-visible { border-radius: 10px; }
.when { display: grid; gap: 10px; padding: 12px; border-radius: 10px; background: var(--tt-card); }
.when__row { display: flex; gap: 10px; align-items: center; min-height: 24px; }
.when__row > svg { flex: none; width: 18px; height: 18px; margin: 0 9px; color: var(--tt-accent-text); }
.when__row strong { font-size: 14px; font-weight: 600; }
.when__row span span { display: block; color: var(--tt-muted); font-size: 12px; }
.when__sub { display: grid; gap: 5px; padding-left: 46px; }
.when__events { display: grid; gap: 6px; padding-top: 10px; border-top: 1px solid var(--tt-hairline); }
.when__events > .lbl { font-size: 14px; font-weight: 600; }
.ev { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: center; min-height: 34px; }
.ev input { margin: 0 10px 0 11px; accent-color: var(--tt-accent); width: 15px; height: 15px; }
.ev__words { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; font-size: 14px; }
.ev__words select { width: auto; max-width: 100%; min-height: 30px; padding: 3px 8px; }
.ev[data-off='true'] label { color: var(--tt-muted); }
.ev .hint { grid-column: 2; }

/* ============ layers: anything that opens over the room. Escape closes it. ============ */
.layer { position: absolute; inset: 0; z-index: 40; display: flex; background: var(--tt-scrim); }
.sheet { display: flex; flex-direction: column; width: min(440px, 100%); height: 100%; margin-left: auto; background: var(--tt-overlay); box-shadow: var(--tt-shadow); }
.layer__head { flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 12px 10px 16px; }
.layer__head h2 { flex: 1; min-width: 0; font-size: 17px; font-weight: 650; }
.layer__body { flex: 1; min-height: 0; overflow: auto; display: grid; gap: 14px; align-content: start; padding: 4px 16px 16px; }
.layer__foot { flex: none; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid var(--tt-hairline); }
.about { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 16px; font-size: 15px; }
.about dt { color: var(--tt-muted); }
.about dd { overflow-wrap: anywhere; }
.about dd span { display: block; color: var(--tt-muted); font-size: 13px; }
.iconbtn { display: inline-grid; place-items: center; flex: none; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--tt-text-2); }
.iconbtn:hover { background: var(--tt-hover-soft); }
.iconbtn svg { width: 18px; height: 18px; }
.toast { position: absolute; left: 50%; bottom: 18px; z-index: 60; max-width: calc(100% - 32px); padding: 8px 14px; border-radius: 10px; background: var(--tt-overlay); box-shadow: var(--tt-shadow); color: var(--tt-text); font-size: 13px; line-height: 1.4; translate: -50% 0; pointer-events: none; }

/* ============ the phone: the iPhone app's list, and a thread a press opens ============ */
.win[data-phone='true'] { font-size: 16px; line-height: 1.4; }
.ph { display: flex; flex: 1; flex-direction: column; min-height: 0; }
.ph__scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.ph__tabs { flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 6px max(8px, env(safe-area-inset-bottom)); border-top: 1px solid var(--tt-hairline); background: var(--tt-sidebar); }
.ph__tabs span { position: relative; display: grid; justify-items: center; gap: 2px; padding: 4px 0; color: var(--tt-muted); font-size: 11px; }
.ph__tabs svg { width: 24px; height: 24px; }
.ph__tabs .on { color: var(--tt-accent-text); font-weight: 600; }
.ph__tabs b { position: absolute; top: 0; left: calc(50% + 5px); display: grid; place-items: center; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--tt-warning-text); color: var(--tt-canvas); font-size: 11px; font-weight: 700; line-height: 1; }
.pl__head { display: flex; align-items: center; gap: 10px; padding: 18px 16px 12px 20px; }
.pl__head h1 { display: flex; flex: 1; align-items: center; gap: 10px; min-width: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
.pl__add { display: grid; place-items: center; flex: none; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: var(--tt-card); color: var(--tt-accent-text); }
.pl__add svg { width: 24px; height: 24px; }
.win .pl__add:focus-visible { border-radius: 50%; }
.pl__find { display: flex; gap: 8px; padding: 0 16px 10px; }
.pl__where { flex: none; width: 142px; height: 44px; padding: 0 10px 0 14px; border: 1px solid var(--tt-hairline); border-radius: 22px; background: var(--tt-card); font-size: 15px; font-weight: 500; }
.win .pl__where:focus-visible { border-radius: 22px; }
.pl__order { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 6px 20px 2px 22px; color: var(--tt-muted); font-size: 15px; }
.pl__order .seg button { height: 32px; padding: 0 12px; font-size: 14px; }
.win[data-phone='true'] .search { flex: 1; height: 44px; margin: 0; }
.win[data-phone='true'] .search > svg { left: 13px; width: 18px; height: 18px; }
.win[data-phone='true'] .search input { padding: 0 40px 0 40px; border-radius: 22px; background: var(--tt-card); font-size: 16px; }
.win[data-phone='true'] .search input:focus-visible { border-radius: 22px; }
.win[data-phone='true'] .search__clear { right: 2px; width: 40px; height: 40px; }
.win[data-phone='true'] .needs { margin: 0 16px 6px; padding: 6px 12px 2px; border-radius: 14px; }
.win[data-phone='true'] .needs__head h2 { font-size: 15px; }
.win[data-phone='true'] .needs__line { min-height: 44px; gap: 10px; }
.win[data-phone='true'] .needs__title { min-height: 44px; font-size: 16px; }
.win[data-phone='true'] .needs__entry[data-rest] .needs__line, .win[data-phone='true'] .needs__entry[data-rest] .needs__title { font-size: 14px; }
.win[data-phone='true'] .nbtn { min-height: 36px; padding: 0 12px; border-radius: 8px; font-size: 14px; }
.win[data-phone='true'] .ring { width: 12px; height: 12px; }
.pl__list { padding: 0 0 12px; }
.win[data-phone='true'] .row { margin: 0; border: 0; border-radius: 0; }
.win[data-phone='true'] .row:hover { background: transparent; }
.win[data-phone='true'] .row__btn { grid-template-columns: 12px minmax(0, 1fr) auto; column-gap: 14px; min-height: 48px; padding: 8px 20px 8px 22px; border-radius: 0; }
.win[data-phone='true'] .row__name { color: var(--tt-text); font-size: 17px; font-weight: 600; }
.win[data-phone='true'] .row__role { font-size: 15px; }
.win[data-phone='true'] .row__end { font-size: 13px; }

/* An owlet with no thread written out gets one from its last run. */
function threadOf(o) {
  if (o.thread) return o.thread;
  const l = o.last;
  const items = [{ t: 'day', text: l.day }];
  if (l.asked) items.push({ t: 'you', at: l.at, text: l.asked });
  else items.push({ t: 'run', icon: 'clock', by: l.by, at: l.at });
  items.push({ t: 'steps', took: l.took, n: l.steps }, { t: 'owlet', at: l.at, text: l.said });
  return items;
}
function transcript(o) {
  const parts = threadOf(o).map((m) => {
    if (m.t === 'day') return `<p class="day">${esc(m.text)}</p>`;
    if (m.t === 'note') return `<p class="note">${esc(m.text)}</p>`;
    if (m.t === 'you') return `<div class="msg msg--you"><p class="msg__who">You<span>${esc(m.at)}</span></p><p>${esc(m.text)}</p></div>`;
    if (m.t === 'owlet') return `<div class="msg msg--owl"><p class="msg__who">${esc(o.name)}<span>${esc(m.at)}</span></p><p>${esc(m.text)}</p></div>`;
    if (m.t === 'run') return `<p class="runline">${ic(m.icon)}<span>${esc(m.by)} · ${esc(m.at)}</span></p>`;
    if (m.t === 'steps') {
      const n = m.items ? m.items.length : m.n;
      const head = `${n} step${n === 1 ? '' : 's'}${m.took ? ` · ${esc(m.took)}` : ''}`;
      return m.items ? `<details class="steps"${m.open ? ' open' : ''}><summary>${head}${ic('chev')}</summary><ul>${m.items.map((s) => `<li>${esc(s)}</li>`).join('')}</ul></details>` : `<p class="steps">${head}</p>`;
    }
    if (m.t === 'working') return `<p class="working"><i class="ring" data-state="working"></i><span>${esc(m.text)}</span></p>`;
    if (m.t === 'report') return report(o, m.id);
    if (m.t === 'card') return card(m.id);
    return '';
  });
  /* a lapsed card asked again: your words, its answer, and the new card */
  o.cards.filter((id) => CARDS[id].after && S.again[CARDS[id].after]).forEach((id) => {
    const w = CARD_WORDS[CARDS[id].kind];
    parts.push(`<div class="msg msg--you"><p class="msg__who">You<span>9:12 am</span></p><p>${w.tell[0].toUpperCase()}${w.tell.slice(1)}.</p></div>`);
    parts.push(`<div class="msg msg--owl"><p class="msg__who">${esc(o.name)}<span>9:12 am</span></p><p>I am asking again. This is a new card, and only you can answer it.</p></div>`);
    parts.push(card(id));
  });
  (S.sent[o.id] || []).forEach((t) => {
    parts.push(`<div class="msg msg--you"><p class="msg__who">You<span>Now</span></p><p>${esc(t)}</p></div>`);
    parts.push(`<div class="msg msg--owl"><p class="msg__who">${esc(o.name)}<span>Now</span></p><p class="muted">This is a prototype, so ${esc(o.name)} has no answer. Nothing left this page.</p></div>`);
  });
  return `<div class="talk">${parts.join('')}</div>`;
}
function runsLine(o) {

function blankEvents() {
  return { mail: { on: false, in: '' }, ci: { on: false, in: '' }, issue: { on: false, in: '' } };
}
function formFor(id) {
  if (S.form && S.form.id === (id || 'new')) return S.form;
  const o = id ? byId(id) : null;
  const events = blankEvents();
  if (o) o.events.forEach((e) => (events[e.kind] = { on: true, in: e.in }));
  S.form = o
    ? { id, name: o.name, look: o.look, title: o.title, role: o.role, home: o.home, model: o.model, mode: o.mode, accounts: [...o.accounts], schedOn: !!o.words, words: o.words, events }
    : { id: 'new', name: '', look: 'round', title: '', role: '', home: 'here', model: COMPUTERS.here.models[0], mode: 'ask', accounts: [], schedOn: false, words: '', events };
  return S.form;
}
/* How Sotto reads a schedule's plain words back. A fixed table: the prototype only shows the idea. */
function readSchedule(words) {
  const w = (words || '').trim().toLowerCase();
  if (!w) return null;
  const known = OWLETS.find((o) => o.words === w);
  return known ? [known.read, known.next, known.nextShort] : null;
}
const readBack = (words) => {
  const r = readSchedule(words);
  if (r) return `Sotto reads this as: <b>${esc(r[0])}</b>. Next: ${esc(r[1])}.`;
  return (words || '').trim() ? 'Sotto would say here how it read your words, and when the next run is.' : 'Say when in your own words, such as “weekdays at 7:30am”.';
};
const folderLine = (f) => `Its folder: <span class="mono">Owlets/${esc(f.name.trim() || '…')}</span> on ${esc(COMPUTERS[f.home].name)}. Sotto makes it, and its thread and its files live there.`;

  return need === 'mail' ? have.map((a) => ACCOUNTS[a].name) : REPOS;
}

    </div><p class="hint">A run nobody started uses the same permission mode. A card it leaves waits five minutes, then lapses, and nothing is sent.</p></fieldset>`;
  const head = phone
    ? `<header class="pane__head"><button type="button" class="hbtn" data-act="cancel-setup" data-key="cancel">Cancel</button><h1 id="setup-h" class="grow">${editing ? `Edit ${esc(byId(S.edit).name)}` : 'New owlet'}</h1><button class="btn btn--primary" type="submit" data-key="save">${editing ? 'Save' : 'Make it'}</button></header>`
    : `<header class="pane__head"><h1 id="setup-h">${editing ? `Edit ${esc(byId(S.edit).name)}` : 'New owlet'}</h1><span class="grow"></span><button type="button" class="btn" data-act="cancel-setup" data-key="cancel">Cancel</button><button class="btn btn--primary" type="submit" data-key="save">${editing ? 'Save' : 'Make the owlet'}</button></header>`;

}
function modeLine(f) {

  return 'The same modes a thread has. A run that starts by itself uses this one too.';
}

/* ==================== The phone ==================== */
function phoneList() {

      <div class="pl__find"><select class="pl__where" id="where" data-key="where" aria-label="Show the owlets on">${[['all', 'All computers'], ['here', 'This computer'], ['forge', 'forge']].map(([id, label]) => `<option value="${id}" ${S.where === id ? 'selected' : ''}>${label}</option>`).join('')}</select>${search()}</div>
      <div data-needs>${needsCard()}</div>
      <div class="pl__order">${order}</div>
      <div class="pl__list" data-list>${list(true)}</div>
    </div>
    <div class="ph__tabs" aria-label="Sotto’s pages. Only Owlets is drawn."><span>${ic('bubbles')}Threads</span><span>${ic('owl')}Watcher</span><span class="on">${ic('owlets')}Owlets${live().length + rested().length ? `<b>${live().length + rested().length}</b>` : ''}</span><span>${ic('monitor')}Computers</span><span>${ic('sliders')}Settings</span></div>
  </div>`;
}
function phoneThread(o) {
  const st = statusOf(o);

    <header class="ph__nav"><button class="iconbtn" data-act="back" data-key="back" aria-label="Back to Owlets">${ic('back')}</button><h1>${esc(o.name)}</h1><span class="pill" data-tone="${st === 'idle' ? '' : st}">${ring(o)}${esc(stateWords(o))}</span><button class="iconbtn" data-act="about" data-key="about" aria-label="About ${esc(o.name)}: its role, home, model and when it runs">${ic('dots')}</button></header>
    <p class="ph__sub">${esc(sub)}</p>

    <div class="pane__foot">${composer(o, true)}</div>

}
function aboutSheet(o) {
  const runs = ['When you ask', o.words ? `On a schedule: ${o.words}` : '', ...o.events.map((e) => `When ${evText(e)}`)].filter(Boolean);
  return `<div class="layer"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="about-h">
    <div class="layer__head">${owl(o.look, statusOf(o), 32)}<h2 id="about-h">${esc(o.name)}</h2><button class="iconbtn" data-act="close" data-key="about-x" aria-label="Close" data-first>${ic('x')}</button></div>
    <div class="layer__body"><dl class="about">
      <dt>Role</dt><dd>${esc(o.title)}<span>${esc(o.role)}</span></dd>
      <dt>Home</dt><dd>${esc(homeOf(o).name)}<span>${esc(homeOf(o).kind)}</span></dd>
      <dt>Folder</dt><dd class="mono">Owlets/${esc(o.name)}</dd>
      <dt>Model</dt><dd>${esc(o.model)}</dd>
      <dt>Permissions</dt><dd>${MODES[o.mode].label}<span>${MODES[o.mode].says}</span></dd>
      <dt>Accounts</dt><dd>${o.accounts.length ? o.accounts.map((a) => esc(acctLabel(a))).join('<br>') : 'None'}</dd>
      <dt>Runs</dt><dd>${runs.map(esc).join('<br>')}${o.words && o.next ? `<span>Next: ${esc(o.next)}</span>` : ''}</dd>
    </dl></div>
    <div class="layer__foot"><button class="btn" data-act="edit" data-key="about-edit">${ic('pencil')}Edit</button></div>

/* ==================== Draw ==================== */
const layout = () => {
  const w = $('#win').clientWidth;
  return w <= 700 ? 'phone' : w <= 900 ? 'narrow' : 'wide';
};
function view(m) {
  if (m === 'phone') {
    if (S.screen === 'setup') return `<div class="ph">${setup(true)}</div>`;
    return S.owlet ? phoneThread(current()) : phoneList();
  }
  const side = S.side || (m === 'narrow' ? 'rail' : 'open');
  const over = m === 'narrow' && side === 'open';
  return `<div class="shell" data-side="${over ? 'over' : side}">
    ${side === 'rail' || over ? rail() : ''}
    ${side === 'open' ? sidebar() : ''}
    ${over ? '<div class="shell__scrim" data-act="side" data-to="rail"></div>' : ''}
    <main class="pane">${S.screen === 'setup' ? setup(false) : pane(current())}</main>
  </div>`;
}
function placeThread(el) {
  const o = current();
  const want = S.at || (o.thread && o.thread.some((m) => m.t === 'report') && isUnread(o) ? 'report' : 'end');
  const target = { report: '[data-report]', card: '[data-req][data-live]', lapsed: '.req--lapsed' }[want];
  const hit = target && $(target, el);
  if (want === 'top') el.scrollTop = 0;
  else if (hit) el.scrollTop = hit.getBoundingClientRect().top - el.getBoundingClientRect().top + el.scrollTop - 14;
  else el.scrollTop = el.scrollHeight;
}
function syncUrl() {
  const u = new URL(location.href);
  const put = (k, v, dflt) => (v == null || v === '' || v === dflt ? u.searchParams.delete(k) : u.searchParams.set(k, v));
  u.searchParams.delete('row');
  put('variant', S.variant);
  put('screen', S.screen, 'page');
  put('owlet', byId(S.owlet) ? S.owlet : null);
  put('edit', S.edit);
  put('group', S.group, 'state');
  put('q', S.q);
  put('where', S.where, 'all');
  put('side', S.side);
  put('open', S.open);
  put('at', S.at);
  put('theme', S.theme, 'dark');
  put('size', S.size, 'fit');
  history.replaceState(null, '', u);
}
let toastTimer = 0;
function render(focusSel) {
  const win = $('#win');
  const active = document.activeElement;
  const hadFocus = !!(active && win.contains(active));
  const keep = hadFocus ? active.getAttribute('data-key') : null;
  const scrolls = {};
  $$('[data-scroll]', win).forEach((el) => (scrolls[el.dataset.scroll] = el.scrollTop));
  document.documentElement.dataset.theme = S.theme;
  document.body.dataset.bare = String(S.bare);
  $('#stage').dataset.size = S.size;
  // the prototype's own bar and caption, first: the caption's height sets the window's
  const v = VARIANTS[S.variant];
  const small = window.matchMedia('(max-width: 700px)').matches;
  $('#lab').textContent = `${S.variant} · ${v.name}`;
  const rule = '<span class="cap__rule">The part marked <b>Idea</b> is not decided. All of it is sample data: nothing is read or sent.</span>';
  $('#cap').innerHTML =
    small && !S.more
      ? `<strong>${S.variant} · ${esc(v.name)}.</strong> ${v.brief} <button type="button" class="cap__more" id="more" aria-expanded="false">More</button>`
      : `<strong>${S.variant} · ${esc(v.name)}.</strong> ${v.caption} ${SHARED_CAPTION} ${rule}${small ? ' <button type="button" class="cap__more" id="more" aria-expanded="true">Less</button>' : ''}`;
  $('#theme').textContent = S.theme === 'dark' ? 'Light' : 'Dark';
  $('#theme').setAttribute('aria-label', S.theme === 'dark' ? 'Switch to the light theme' : 'Switch to the dark theme');
  $('#size').value = S.size;
  $('#jump').value = '';
  document.title = `Owlets sidebar · ${S.variant} · ${v.name}`;
  const m = layout();
  win.dataset.phone = String(m === 'phone');
  win.dataset.variant = S.variant;
  win.dataset.layout = m;
  win.innerHTML = view(m) + (S.open === 'about' ? aboutSheet(current()) : '') + (S.toast ? `<p class="toast" aria-hidden="true">${esc(S.toast)}</p>` : '');
  $('#toast').textContent = S.toast;
  clearTimeout(toastTimer);
  if (S.toast) toastTimer = setTimeout(() => { S.toast = ''; const t = $('.toast', win); if (t) t.remove(); }, 5000);
  $$('[data-scroll]', win).forEach((el) => {
    const k = el.dataset.scroll;
    if (el.hasAttribute('data-stick')) {
      if (scrolls[k] != null && !S.jump) el.scrollTop = scrolls[k];
      else placeThread(el);
    } else if (scrolls[k] != null) el.scrollTop = scrolls[k];
    else if (k === 'side' || k === 'rail') {
      const cur = $('[aria-current="true"]', el);
      if (cur) {
        const r = cur.getBoundingClientRect();
        const b = el.getBoundingClientRect();
        if (r.bottom > b.bottom - 6) el.scrollTop += r.bottom - b.bottom + 10;
        else if (r.top < b.top) el.scrollTop += r.top - b.top - 10;
        const first = el.scrollTop > 0 && $$('li, .group', el).find((x) => x.getBoundingClientRect().top >= b.top - 1);
        if (first) el.scrollTop += first.getBoundingClientRect().top - b.top - 2;
      }
    }
  });
  S.jump = false;
  const layerEl = $('.layer', win);
  const wanted = [].concat(focusSel || []).map((sel) => $(sel, win)).find(Boolean);
  let target = wanted || (keep && $(`[data-key="${keep}"]`, win));
  if (layerEl && target && !layerEl.contains(target)) target = null;
  if (target) target.focus({ preventScroll: !wanted });
  else if (layerEl) {
    const first = $('.layer [data-first]', win) || $('.layer button', win);
    if (first) first.focus();
  } else if (hadFocus) {
    const auto = $('[data-first], [aria-current="true"], [data-key="back"], [data-key="new"]', win);
    if (auto) auto.focus({ preventScroll: true });
  }
  syncUrl();
}
function go(patch, focusSel) {
  if ('owlet' in patch || 'at' in patch || 'screen' in patch) S.jump = true;
  Object.assign(S, patch);
  render(focusSel);
}
/* only the list and the Needs you card redraw as you type, so the search box keeps its caret */
function redrawList() {
  const win = $('#win');
  const phone = layout() === 'phone';
  $$('[data-list]', win).forEach((el) => (el.innerHTML = list(phone)));
  const clear = $('.search__clear', win);
  if (clear) clear.hidden = !S.q;
  syncUrl();
}
function closeLayer() {
  const back = S.opener;
  S.opener = null;
  go({ open: null }, back ? `[data-key="${back}"]` : null);
}
function cycle(delta) {
  const keys = Object.keys(VARIANTS);
  go({ variant: keys[(keys.indexOf(S.variant) + delta + keys.length) % keys.length] });
}
function leaveSetup() {
  const back = S.opener;
  S.opener = null;
  S.form = null;
  const keys = back === 'new' ? ['new', 'expand'] : [back, 'edit', 'about', 'new'];
  go({ screen: 'page', edit: null }, keys.filter(Boolean).map((k) => `[data-key="${k}"]`));
}

/* ==================== Presses, typing and keys ==================== */
document.addEventListener('click', (e) => {
  const win = $('#win');
  const el = e.target.closest('[data-act]');
  if (!el || !win.contains(el)) {
    if (e.target.classList && e.target.classList.contains('layer')) closeLayer();
    return;
  }
  const act = el.dataset.act;
  const id = el.dataset.id;
  const m = layout();
  const overSide = m === 'narrow' && S.side === 'open';
  const rowKey = (oid) => (m === 'phone' ? '[data-key="back"]' : m === 'narrow' ? `[data-key="tile-${oid}"]` : `[data-key="row-${oid}"]`);
  if (act === 'open') {
    S.read[id] = true;
    go({ owlet: id, screen: 'page', edit: null, at: null, form: null, side: overSide ? null : S.side }, rowKey(id));
  } else if (act === 'goto-card' || act === 'answer' || act === 'goto-lapsed') {
    const oid = CARDS[id].owlet;
    S.read[oid] = true;
    const lapsed = act === 'goto-lapsed';
    go({ owlet: oid, screen: 'page', edit: null, form: null, at: lapsed ? 'lapsed' : 'card', side: overSide ? null : S.side }, lapsed ? `[data-key="lapsed-${id}"]` : act === 'answer' ? `[data-key="allow-${id}"]` : m === 'phone' ? '[data-key="back"]' : `[data-key="needs-${id}"]`);
  } else if (act === 'dismiss') {
    S.dismissed[id] = true;
    render('#q');
  } else if (act === 'allow' || act === 'deny') {
    S.answers[id] = act === 'allow' ? 'allowed' : 'denied';
    S.toast = act === 'allow' ? CARDS[id].allowed : CARD_WORDS[CARDS[id].kind].denied;
    render(`[data-key="ans-${id}"]`);
  } else if (act === 'unanswer') {
    delete S.answers[id];
    render(`[data-key="allow-${id}"]`);
  } else if (act === 'lapse') {
    S.lapsedNow[id] = true;
    S.toast = CARD_WORDS[CARDS[id].kind].gone;
    render(`[data-key="lapsed-${id}"]`);
  } else if (act === 'unlapse') {
    delete S.lapsedNow[id];
    render(`[data-key="allow-${id}"]`);
  } else if (act === 'again') {
    S.again[id] = true;
    go({ at: 'card' }, `[data-key="allow-${id}-again"]`);
  } else if (act === 'new') {
    S.form = null;
    S.opener = 'new';
    go({ screen: 'setup', edit: null, open: null, side: overSide ? null : S.side }, '#f-name');
  } else if (act === 'edit') {
    const o = current();
    S.form = null;
    S.opener = S.open === 'about' ? 'about' : el.getAttribute('data-key');
    const f = el.dataset.focus;
    go({ screen: 'setup', edit: o.id, owlet: o.id, open: null }, f === 'mode' ? `[data-key="f-mode-${o.mode}"]` : f === 'model' ? '#f-model' : '#f-name');
  } else if (act === 'cancel-setup') {
    leaveSetup();
  } else if (act === 'side') {
    go({ side: el.dataset.to === 'rail' && m === 'narrow' ? null : el.dataset.to === 'open' && m === 'wide' ? null : el.dataset.to }, el.dataset.to === 'open' ? '[data-key="collapse"]' : '[data-key="expand"]');
  } else if (act === 'fold') {
    S.folds[id] = !S.folds[id];
    render();
  } else if (act === 'group') {
    go({ group: el.dataset.to });
  } else if (act === 'clear-q') {
    S.q = '';
    $('#q').value = '';
    redrawList();
    $('#q').focus();
  } else if (act === 'back') {
    const from = S.owlet;
    go({ owlet: null, open: null, at: null }, `[data-key="row-${from}"]`);
  } else if (act === 'about') {
    S.opener = 'about';
    go({ open: 'about' });
  } else if (act === 'close') {
    closeLayer();
  } else if (act === 'sched') {
    S.form.schedOn = !S.form.schedOn;
    render(S.form.schedOn ? '#f-words' : '[data-key="f-sched"]');
  }
});

document.addEventListener('submit', (e) => {
  const f = e.target;
  if (!f.dataset || !f.dataset.form) return;
  e.preventDefault();
  if (f.dataset.form === 'say') {
    const text = f.elements.say.value.trim();
    if (!text) return;
    (S.sent[f.dataset.owlet] ||= []).push(text);
    delete S.drafts[f.dataset.owlet];
    go({ at: 'end' }, `[data-key="say-${f.dataset.owlet}"]`);
  } else if (f.dataset.form === 'setup') {
    const d = S.form;
    const name = d.name.trim();
    if (!name) {
      const box = $('#f-name');
      box.setAttribute('aria-invalid', 'true');
      $('#folder-line').textContent = 'Give it a name first.';
      box.focus();
      return;
    }
    const r = d.schedOn ? readSchedule(d.words) : null;
    const events = Object.keys(EVENTS).filter((k) => d.events[k].on && eventChoices(d, k)).map((k) => ({ kind: k, in: eventChoices(d, k).includes(d.events[k].in) ? d.events[k].in : eventChoices(d, k)[0] }));
    const fields = { name, look: d.look, title: d.title.trim() || 'No role yet', role: d.role, home: d.home, model: d.model, mode: d.mode, accounts: [...d.accounts], words: d.schedOn ? d.words.trim() : '', read: r ? r[0] : '', next: r ? r[1] : '', nextShort: r ? r[2] : '', events };
    if (S.edit) {
      Object.assign(byId(S.edit), fields);
      S.toast = `${name} is saved. A prototype keeps it only until you leave this page.`;
      leaveSetup();
    } else {
      const id = `made-${++S.made}`;
      OWLETS.push({ id, code: name.slice(0, 2), state: 'idle', unread: false, ago: -S.made, cards: [], last: { at: 'Now', words: 'Made just now' }, thread: [{ t: 'day', text: 'Today' }, { t: 'note', text: `You made ${name} just now. Its folder is Owlets/${name} on ${COMPUTERS[d.home].name}. It has not run yet.` }], ...fields });
      S.toast = `${name} is made. A prototype keeps it only until you leave this page.`;
      S.opener = null;
      S.form = null;
      go({ screen: 'page', edit: null, owlet: id, at: null }, ['[data-key="back"]', `[data-key="row-${id}"]`, `[data-key="tile-${id}"]`]);
    }
  }
});

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'q') {
    S.q = el.value;
    redrawList();
    return;
  }
  if (el.name === 'say') {
    const form = el.closest('form');
    if (form) S.drafts[form.dataset.owlet] = el.value;
    return;
  }
  if (!S.form || !el.dataset) return;
  const d = S.form;
  if (el.dataset.ev) {
    d.events[el.dataset.ev].on = el.checked;
    return;
  }
  if (el.dataset.evin) {
    d.events[el.dataset.evin].in = el.value;
    return;
  }
  const f = el.dataset.f;
  if (!f) return;
  if (f === 'accounts') {
    const set = new Set(d.accounts);
    el.checked ? set.add(el.value) : set.delete(el.value);
    d.accounts = [...set];
    render(`[data-key="${el.getAttribute('data-key')}"]`);
    return;
  }
  d[f] = el.value;
  if (f === 'home') {
    d.model = COMPUTERS[el.value].models.includes(d.model) ? d.model : COMPUTERS[el.value].models[0];
    d.accounts = d.accounts.filter((a) => COMPUTERS[el.value].accounts.includes(a));
    render(`[data-key="${el.getAttribute('data-key')}"]`);
  } else if (f === 'mode') {
    const line = $('#mode-line');
    line.textContent = modeLine(d);
    line.classList.toggle('hint--warn', d.mode === 'full');
  } else if (f === 'name') {
    el.removeAttribute('aria-invalid');
    $('#folder-line').innerHTML = folderLine(d);
  } else if (f === 'words') {
    $('#read-words').innerHTML = readBack(el.value);
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'where') go({ where: e.target.value });
});

document.addEventListener('keydown', (e) => {
  const win = $('#win');
  const t = e.target;
  const hasLayer = !!$('.layer', win);
  if (e.key === 'Escape') {
    const m = layout();
    if (S.open) closeLayer();
    else if (m === 'narrow' && S.side === 'open') go({ side: null }, '[data-key="expand"]');
    else if (t.id === 'q' && S.q) {
      S.q = '';
      t.value = '';
      redrawList();
    } else if (S.screen === 'setup') leaveSetup();
    else return;
    e.preventDefault();
    return;
  }
  if (e.key === 'Tab' && hasLayer) {
    const items = $$('.layer button, .layer input, .layer select, .layer textarea', win).filter((x) => !x.disabled && x.offsetParent !== null);
    if (!items.length) return;
    const first = items[0];
    const last = items[items.length - 1];
    if (!$('.layer', win).contains(document.activeElement) || (!e.shiftKey && document.activeElement === last)) {
      e.preventDefault();
      first.focus();
    } else if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    }
    return;
  }
  if (e.key === 'Enter' && !e.shiftKey && t.matches && t.matches('.composer textarea')) {
    e.preventDefault();
    t.form.requestSubmit();
    return;
  }
  // the list answers the arrow keys, as the Threads sidebar's does
  if (['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(e.key) && t.matches && t.matches('.row__btn, .tile, .group__head')) {
    const items = $$('.row__btn, .tile, .group__head', t.closest('nav, .pl__list'));
    const i = items.indexOf(t);
    const next = e.key === 'Home' ? items[0] : e.key === 'End' ? items[items.length - 1] : items[Math.max(0, Math.min(items.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))];
    e.preventDefault();
    next.focus();
    return;
  }
  if (e.key === 'ArrowDown' && t.id === 'q') {
    const firstRow = $('[data-list] .row__btn, [data-list] .group__head', win);
    if (firstRow) {
      e.preventDefault();
      firstRow.focus();
    }
    return;
  }
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !e.altKey && !e.ctrlKey && !e.metaKey) {
    if (t.matches && t.matches('input, textarea, select, [contenteditable], summary')) return;
    if (hasLayer) return;
    e.preventDefault();
    cycle(e.key === 'ArrowLeft' ? -1 : 1);
  }
});

function boot() {
  $('#prev').onclick = () => cycle(-1);
  $('#next').onclick = () => cycle(1);
  $('#theme').onclick = () => go({ theme: S.theme === 'dark' ? 'light' : 'dark' });
  $('#size').onchange = (e) => go({ size: e.target.value, side: null });
  $('#cap').addEventListener('click', (e) => {
    if (e.target.id === 'more') {
      S.more = !S.more;
      render();
      $('#more').focus();
    }
  });
  $('#reset').onclick = () => {
    OWLETS.splice(0, OWLETS.length, ...JSON.parse(ORIGINAL));
    Object.assign(S, { answers: {}, lapsedNow: {}, again: {}, dismissed: {}, read: {}, sent: {}, drafts: {}, folds: {}, form: null, toast: '', opener: null, q: '', where: 'all' });
    go({ screen: 'page', owlet: null, edit: null, open: null, at: null, side: null });
  };
  $('#jump').onchange = (e) => {
    const to = {
      page: { owlet: null },
      report: { owlet: 'tawny', at: 'report' },
      card: { owlet: 'barn', at: 'card' },
      working: { owlet: 'scops', at: 'end' },
      setup: { screen: 'setup' },
      edit: { screen: 'setup', edit: 'tawny', owlet: 'tawny' },
    }[e.target.value];
    S.form = null;
    S.opener = null;
    go({ screen: 'page', owlet: null, edit: null, open: null, at: null, ...to });
  };
  let was = null;
  new ResizeObserver(() => {
    const now = layout();
    if (was !== null && now !== was) render();
    was = now;
  }).observe($('#win'));
  render();
  document.fonts.ready.then(() => {
    if (document.activeElement && $('#win').contains(document.activeElement)) return;
    S.jump = true;
    render();
  });
}
boot();
</script>
</body>
</html>
