<!doctype html>
<!--
  PROTOTYPE — throwaway. Two questions, one file:

  1. Browser sharing. With "Let agents use the browser without asking" on, every page in a thread's browser is
     shared with that thread's agent: the pages it opens and the pages you open, and a page stays shared when it
     moves to another site. (Zach, October 5, 2026: "Every page in the thread".) How should Tools > Browser say a
     page is shared, and how do you make one page private?
  2. Forge thread tools. A thread on a paired host gets Agents, Changes and Files in Tools instead of
     "<Tool> is on the host machine." (Zach, October 5, 2026: these three first.) Changes starts with Working tree and
     Branch changes; Latest turn and Checkpoints need turn checkpoints on the host, which come later. Files cannot
     reveal a folder on another computer. How much of that should the surfaces say?

  Scenes via ?scene=browser|remote. Variants via ?variant=A|B|C. ?theme=light. Browser page via ?page=agent|yours|private|off.
  Forge surface via ?surface=files|changes|agents|browser|terminal|iphone.
  The window copies the Tools panel (artifacts/browser-grant, artifacts/tools-rail, artifacts/changes-diff,
  artifacts/agents-view) and the Sotto theme's resolved --tt-* values. No host calls, no persistence.
  Open the file directly, or serve the repo root and open /docs/prototypes/remote-tools-and-browser-sharing-prototype.html
-->

const NOTES = {
  browser: {
    A: `<b>A, the least change.</b> The Share button already in the tab line starts pressed on every page, yours included, and stays pressed when the page moves to another site (Studio → Google sign-in). Pressing it makes that one page private, and the line under the address says so with a way back. The thread line keeps today's words and its Stop. Pick <i>A page you opened</i>: it looks the same as the agent's page, which is the point.`,
    B: `<b>B, one sentence about this page.</b> The Share button leaves the tab line. The line under the address says what the agent has on the page in front of you, with <b>Make private</b> for this page and <b>Stop for this thread</b> for every page. More words, but nothing to decode from a pressed icon.`,
    C: `<b>C, a mark on every tab.</b> Each page tab carries an eye while the agent can see it, or a lock once you make it private, so you can tell at a glance across tabs. The tab line's button becomes a lock that makes this page private. The thread line is unchanged.`,
  },
  remote: {
    A: `<b>A, the same as a local thread.</b> Files, Changes and Agents look exactly as they do for a thread on this computer, read from forge. The footer adds <b>on forge</b>. Controls forge can't serve are simply absent: no Show in folder, and the Changes scope menu offers Working tree and Branch changes only.`,
    B: `<b>B, a line saying where it comes from.</b> A thin line under each surface's chrome says it's on forge, when it was read, and offers Refresh. Missing controls are absent as in A. It says more, but it repeats on every surface.`,
    C: `<b>C, name what's missing.</b> Like A, but what forge can't do yet stays visible and disabled with its reason: Show in folder, Checkpoints and Latest turn in the scope menu (open it). Honest about the gap, but it shows controls you can't press.`,
  },
}
function render() {
  document.documentElement.dataset.theme = state.theme
  document.getElementById('h1').textContent = state.scene === 'browser' ? 'Every page in a thread is shared with its agent' : 'A thread on forge gets Files, Changes and Agents'
  document.getElementById('lede').innerHTML = state.scene === 'browser'
    ? 'With <b>Let agents use the browser without asking</b> on, the agent can see and use every page in its thread’s browser: pages it opens, pages you open, and a page that moves to another site. Which way should Tools › Browser say so, and let you make one page private?'
    : 'Today every tool but PR says “… is on the host machine.” for a forge thread. First step: Files, Changes (Working tree and Branch changes) and Agents work, read from forge. How much should they say about being on forge, and about what forge can’t do yet?'
  document.getElementById('controls').innerHTML = controls()
  document.getElementById('stage').innerHTML = state.scene === 'browser' ? browserScene() : remoteScene()
  document.getElementById('settings').innerHTML = state.scene === 'browser' ? browserSettings() : ''
  document.getElementById('notes').innerHTML = NOTES[state.scene][state.variant]
  document.getElementById('label').textContent = `${state.variant} — ${NAMES[state.scene][state.variant]}`
  save()
}
document.addEventListener('click', event => {
  const set = event.target.closest('[data-set]')
  if (set) { const key = set.dataset.set; state[key] = key === 'menu' ? set.dataset.value === 'true' : set.dataset.value; if (key === 'scene') state.variant = 'A'; render(); return }
  const surface = event.target.closest('.rail [data-surface]')
  if (surface && state.scene === 'remote') { state.surface = surface.dataset.surface; state.menu = false; render(); return }
  if (event.target.closest('#scope')) { state.menu = !state.menu; render(); return }
  if (event.target.closest('#grantSwitch')) { state.page = state.page === 'off' ? 'agent' : 'off'; render() }
})
const cycle = step => { const keys = ['A', 'B', 'C']; state.variant = keys[(keys.indexOf(state.variant) + step + keys.length) % keys.length]; render() }
document.getElementById('prev').onclick = () => cycle(-1)
document.getElementById('next').onclick = () => cycle(1)
document.addEventListener('keydown', event => {
  if (event.target.closest?.('input,textarea,[contenteditable]')) return
  if (event.key === 'ArrowLeft') cycle(-1)
  if (event.key === 'ArrowRight') cycle(1)
})
render()
</script>
</body>
</html>
