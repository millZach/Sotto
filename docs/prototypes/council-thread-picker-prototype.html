<!doctype html>
<!--
  Throwaway prototype. Not product code.
  Question: how should the Council page choose the thread a question comes from,
  so the right thread is easy to find when titles look alike?
  Variants: A "From this thread" (fixed line + Change opens search), B "Recent rows", C "Search list".
  Each variant can show the chosen thread's last exchange (toggle at top).
  Picked: A, without the last-exchange preview (Drake, 2026-11-03).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Council thread picker</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a18; --raised: #232320; --line: #2f2f2b;
    --text: #ecebe6; --dim: #9d9b92; --faint: #6f6d66; --accent: #e8c547; --accent-ink: #1a1500;
    --r: 8px; --r-sm: 6px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 Figtree, system-ui, sans-serif; }
  .bar { display: flex; gap: 8px; align-items: center; padding: 12px 24px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .bar button, .seg button { background: none; border: 1px solid var(--line); color: var(--dim); padding: 5px 12px; border-radius: 999px; font: inherit; cursor: pointer; }
  .bar button[aria-pressed=true] { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .bar label { margin-left: auto; color: var(--dim); display: flex; gap: 6px; align-items: center; }
  main { max-width: 760px; margin: 32px auto; padding: 0 24px; }
  h1 { font-size: 13px; font-weight: 500; color: var(--faint); margin: 0 0 16px; letter-spacing: .02em; }
  .field-label { color: var(--dim); font-size: 12px; margin: 0 0 6px; }
  .from { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
  .from .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .link { background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
  .link:focus-visible, .row:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .icon { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font-size: 10px; font-weight: 700; flex: none; }
  .icon.claude { background: #3a2a22; color: #e3a37d; } .icon.codex { background: #22303a; color: #8ec2e6; }
  .icon.grok { background: #2a2a2a; color: #cfcfcf; } .icon.devin { background: #23332a; color: #8fd1a6; }
  .meta { color: var(--faint); font-size: 12px; white-space: nowrap; }
  .preview { margin: 8px 2px 0; color: var(--faint); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preview b { color: var(--dim); font-weight: 500; }
  .list { margin-top: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .search { width: 100%; background: var(--raised); border: 0; border-bottom: 1px solid var(--line); color: var(--text); font: inherit; padding: 10px 12px; }
  .scroll { max-height: 300px; overflow: auto; padding: 4px; }
  .group { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 10px 8px 4px; }
  .row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; color: var(--text); font: inherit; padding: 7px 8px; border-radius: var(--r-sm); cursor: pointer; }
  .row:hover, .row.active { background: var(--raised); }
  .row[aria-selected=true] .title::after { content: "  ✓"; color: var(--accent); }
  .row .body { flex: 1; min-width: 0; }
  .row .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .question { margin-top: 20px; }
  .question textarea { width: 100%; min-height: 76px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); color: var(--text); font: inherit; padding: 10px 12px; resize: vertical; }
  .note { margin-top: 28px; color: var(--faint); font-size: 12.5px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .empty { color: var(--faint); padding: 14px 10px; }
</style>
</head>
<body>
<div class="bar" role="toolbar" aria-label="Variant">
  <button data-v="A" aria-pressed="true">A · From this thread</button>
  <button data-v="B" aria-pressed="false">B · Recent rows</button>
  <button data-v="C" aria-pressed="false">C · Search list</button>
  <label><input type="checkbox" id="pv" checked> Last exchange preview</label>
</div>
<main>
  <h1>COUNCIL</h1>
  <div id="picker"></div>
  <div class="question"><p class="field-label">Question</p><textarea placeholder="What should the Council weigh in on?"></textarea></div>
  <p class="note" id="note"></p>
</main>
<script>
const T = [
  ['Council view should be more similar to Watcher in that you…','Sotto','claude','2m','You: make Council look like Watcher’s room','feat/council-watcher-look'],
  ['I want to add a button below where I have this red box…','Sotto','codex','14m','Claude: added the button under the composer','sotto/9c1e'],
  ['Clean up and organize ~/Developer','Home','claude','1h','Claude: moved 41 folders into archive/','—'],
  ['Harden sshLauncher, council, devinAdapter flakes','Sotto','codex','2h','Codex: PR #2093 is green, waiting on merge','fix/harden-flakes'],
  ['App empty/loading/error states inventory and fill','Sotto','claude','3h','You: start with the Usage page','fix/empty-states'],
  ['Backend: IPC contract audit, remove any bridges','Sotto','grok','3h','Grok: 3 unused channels found','chore/ipc-audit'],
  ['Backend: storage notices and catalog loaders review','Sotto','codex','4h','Codex: review posted, 2 findings','chore/storage-review'],
  ['Compaction recovery: complete pagination, stale PR facts…','Sotto','claude','5h','Claude: pagination finished, tests pass','fix/compaction-recovery'],
  ['Settle gate: refresh blocking children, name exact blocker','Sotto','codex','6h','Codex: blocker now named in the card','fix/settle-gate'],
  ['Current composer + settings surface polish','Sotto','claude','yesterday','Claude: merged #2091','fix/composer-settings-polish'],
  ['Sidebar card family stale/empty-state polish','Sotto','devin','yesterday','Devin: screenshots attached','fix/sidebar-cards'],
  ['Research: compaction handoff quality for Watcher','Research','claude','yesterday','Claude: report written to docs/research','—'],
  ['Research: swarm synthesis failure modes','Research','grok','2d','Grok: 5 failure modes listed','—'],
  ['Popup window polish and checklist fixes','Sotto','codex','2d','Codex: merged #2088','fix/polish-shortcut-popup'],
  ['Council chamber design polish','Sotto','claude','3d','Claude: picked variant B','feat/council-chamber'],
].map(([title, project, p, ago, last, branch], i) => ({ id: i, title, project, p, ago, last, branch }))
const P = { claude: 'C', codex: 'X', grok: 'G', devin: 'D' }
let v = 'A', chosen = 0, open = false, q = '', active = 0
const $ = s => document.querySelector(s)
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const icon = t => `<span class="icon ${t.p}" aria-hidden="true">${P[t.p]}</span>`
const preview = () => $('#pv').checked ? `<p class="preview">${esc(T[chosen].last)}</p>` : ''
const row = (t, sub) => `<button class="row${t.id === T[active]?.id ? '' : ''}" role="option" data-id="${t.id}" aria-selected="${t.id === chosen}">
  ${icon(t)}<span class="body"><div class="title">${esc(t.title)}</div>${sub ? `<div class="sub">${esc(sub(t))}</div>` : ''}</span><span class="meta">${t.ago}</span></button>`
function searchList(focus) {
  const hits = T.filter(t => (t.title + ' ' + t.project + ' ' + t.branch).toLowerCase().includes(q.toLowerCase()))
  const groups = [...new Set(hits.map(t => t.project))]
  return `<div class="list"><input class="search" placeholder="Find a thread" value="${esc(q)}" aria-label="Find a thread" ${focus ? 'data-focus' : ''}>
    <div class="scroll" role="listbox">${hits.length ? groups.map(g => `<div class="group">${esc(g)}</div>` + hits.filter(t => t.project === g).map(t => row(t, t => t.branch !== '—' ? t.branch : t.last)).join('')).join('') : '<div class="empty">No thread matches.</div>'}</div></div>`
}
const notes = {
  A: 'Opened from a thread (its menu or composer), the Council already knows the thread. Change opens the search list. Escape closes it.',
  B: 'Five most recent threads, newest first. “More threads” opens the search list for the rest.',
  C: 'Always a search list. Grouped by project like the sidebar. Each row shows its branch, or its last message when there is no branch.',
}
function render(focus) {
  const t = T[chosen]
  let html = '<p class="field-label">From</p>'
  if (v === 'A') {
    html += `<div class="from">${icon(t)}<span class="title">${esc(t.title)}</span><span class="meta">${esc(t.project)} · ${t.ago}</span><button class="link" data-act="toggle" aria-expanded="${open}">${open ? 'Done' : 'Change'}</button></div>`
    html += open ? searchList(focus) : preview()
  } else if (v === 'B') {
    html += `<div class="list"><div class="scroll" role="listbox" style="max-height:none">${T.slice(0, 5).map(t => row(t, t => t.project + (t.id === chosen && $('#pv').checked ? ' · ' + t.last : ''))).join('')}
      <button class="row" data-act="more"><span class="body" style="color:var(--accent)">More threads…</span></button></div></div>`
    if (open) html += searchList(focus)
  } else {
    html += searchList(focus) + preview()
  }
  $('#picker').innerHTML = html
  $('#note').textContent = notes[v]
  const s = $('[data-focus]'); if (s) { s.focus(); s.setSelectionRange(q.length, q.length) }
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return
  if (b.dataset.v) { v = b.dataset.v; open = false; q = ''; document.querySelectorAll('.bar button').forEach(x => x.setAttribute('aria-pressed', x === b)); return render() }
  if (b.dataset.act === 'toggle') { open = !open; q = ''; return render(open) }
  if (b.dataset.act === 'more') { open = true; return render(true) }
  if (b.dataset.id) { chosen = +b.dataset.id; if (v !== 'C') { open = false; q = '' } render() }
})
document.addEventListener('input', e => { if (e.target.classList.contains('search')) { q = e.target.value; render(true) } })
document.addEventListener('keydown', e => { if (e.key === 'Escape' && open) { open = false; q = ''; render() } })
$('#pv').addEventListener('change', () => render())
render()
</script>
</body>
</html>
