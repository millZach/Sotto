<!doctype html>
<!--
  PROTOTYPE - throwaway. Not shipped, not tested, not wired to anything.

  Question (#1312, its last piece): a check is a delegation with test_run, and its brief asks the check's thread to
  reply first with the verdict, the counts and the failing lines, inside the 32 KiB Sotto passes on (ADR-0082, check
  queue decision 5, "The reply is the contract"). Today a check's row of delegated work shows only the brief's title and
  the outcome, never the reply. How should the row show the reply's opening (verdict, counts, failing lines), quoted and
  attributed as the thread's own words, without the card turning into a log viewer?

  Fixed by Zach on October 23, and not varied here: the card shows the reply's verdict, counts and failing lines, marked
  as the thread's words. The outcome stays Answered: no new outcome word, no pass or fail state. Sotto never reads pass or
  fail from the reply, so nothing is coloured, badged or iconed green or red, and nothing says Passed or Failed except
  the thread's own text, quoted as it wrote it. The name in the UI is "check".

  Three variants on ?variant=a|b|c, switchable with the bar (Left/Right arrows too):
    A  Quoted lead       the reply's first two lines quoted under the row, attributed; more lines on a press, then
                         Open the check for the rest
    B  In the fold       the row unchanged but for a Reply disclosure; it opens the reply's opening in a scroll-capped
                         monospace block with an attribution header and Open the check
    C  Excerpt and tray  the reply's first line, in quotes, as a second line on the row; the rest in a tray over the
                         bottom of the transcript, only on a press

  Every variant draws the same two turns of one delegating thread, so they compare in context:
    Turn 1 (older):  a Building row (not a check), a check on the Mac mini whose reply passed, and a check on forge
                     whose reply does not follow the contract (it opens with prose).
    Turn 2 (newest): a check on forge whose reply failed 2 tests, a check on this computer whose reply was cut at
                     32 KiB (truncated: true), and a check still Working, waiting its turn on forge.
  A check's row is marked Check with a flask, the kind word and mark this prototype gives it (Tools › Agents already
  marks a waiting check "Check"). Every disclosure answers Escape; a second Escape closes the Worked for fold, as the
  real fold does. What a press would open in Sotto (a thread) is said in the bar instead.

  Bar: A/B/C and the arrows (Left/Right keys too), Size (1280x800 or the 820x560 minimum; the window is drawn at that
  size, sidebar at its default width), Reduced motion (also follows the OS setting), Light, and Show, which scrolls a
  sample into view. URL: variant, theme, motion, size.
  Palette: SOTTO_DARK/LIGHT through --tt-* roles, copied from delegated-work-prototype.html; the roles that file lacks
  (activity, error-text, warning-text, link, code, sidebar, card, shadow) are derived as tokens.css derives them.
  Rows: the markup, classes and spacing of DelegatedWork.tsx and delegation.css on main, October 28, 2026.

  Picked: C, Excerpt and tray (Zach, 2026-10-28), with the row saying Check and a flask in place of its kind of
  work, and a card whose reply was not kept saying "Its reply wasn't kept here. Open the check to read it in its
  thread." The waiting check shows no queue line (ADR-0082, check queue decision 1).
-->
<html lang="en">

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

  --tt-text-muted: color-mix(in oklab, oklch(0.72 0.014 265) 85%, oklch(0.985 0.005 280));
  --tt-hairline: oklch(0.305 0.02 265); --tt-field-border: oklch(0.375 0.024 265);

}
:root[data-theme='light'] {

  --tt-hover: oklch(0.93 0.008 85);
  --tt-text: oklch(0.235 0.014 75);
  --tt-text-2: color-mix(in oklab, oklch(0.235 0.014 75) 55%, oklch(0.5 0.014 75));
  --tt-text-muted: color-mix(in oklab, oklch(0.5 0.014 75) 85%, oklch(0.235 0.014 75));
  --tt-hairline: oklch(0.86 0.012 80); --tt-field-border: oklch(0.8 0.016 80);
  --tt-accent: oklch(0.5 0.09 183); --tt-accent-text: oklch(0.42 0.08 183);
  --tt-error: oklch(0.52 0.18 25); --tt-success: oklch(0.5 0.12 160); --tt-warning: oklch(0.55 0.13 70);
  --tt-message: oklch(0.94 0.006 85);
  --tt-hover-strong: oklch(0.905 0.01 85);
  --tt-sidebar: oklch(0.965 0.005 85);

}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--tt-canvas); color: var(--tt-text); font: 14px/1.5 var(--tt-font-ui); }
button { font: inherit; color: inherit; }
.tt-focusable:focus-visible, .bar button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--tt-focus-ring); outline-offset: 2px; }
.tt-visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.tt-paragraph { text-wrap: pretty; }

/* ---------- prototype bar (not part of the design) ---------- */
body { display: grid; grid-template-rows: auto minmax(0, 1fr); }
.bar { display: grid; gap: 4px; padding: 6px 10px; border-bottom: 1px solid var(--tt-hairline); background: var(--tt-surface-sunken); font-size: 12px; }
.bar__row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
.bar b { margin-right: 2px; font-size: 13px; font-weight: 600; }
.bar button { padding: 2px 8px; border: 1px solid var(--tt-hairline); border-radius: 6px; background: transparent; font-size: 12px; cursor: pointer; }
.bar button[aria-pressed='true'] { border-color: var(--tt-field-border); background: var(--tt-surface-elevated); color: var(--tt-accent-text); }
.bar .tag { padding: 1px 6px; border: 1px dashed var(--tt-field-border); border-radius: 4px; color: var(--tt-text-muted); font-size: 11px; }
.bar .lbl { margin-left: 6px; color: var(--tt-text-muted); }
.bar .sp { flex: 1; }
.bar .name { min-width: 0; color: var(--tt-text-2); }
.bar .said { color: var(--tt-text-2); font-style: italic; }
.bar [role='group'] { display: inline-flex; flex-wrap: wrap; gap: 4px; }

/* ---------- the window, framed at the chosen size ---------- */
.stage { min-height: 0; overflow: auto; padding: 14px; }
.frame { position: relative; display: grid; grid-template-rows: 32px minmax(0, 1fr); margin: 0 auto; overflow: hidden; border: 1px solid var(--tt-field-border); border-radius: 10px; background: var(--tt-canvas); box-shadow: var(--tt-shadow-lg); }
.frame[data-size='1280x800'] { width: 1280px; height: 800px; --sidebar: 280px; }
.frame[data-size='820x560'] { width: 820px; height: 560px; --sidebar: 260px; }
.app-strip { display: flex; align-items: center; gap: 10px; padding-left: 14px; border-bottom: 1px solid var(--tt-hairline); color: var(--tt-text-muted); font-size: 12px; }
.app-strip b { color: var(--tt-text-2); font-weight: 600; }
.app-strip .wc { display: flex; margin-left: auto; height: 100%; }
.app-strip .wc > span { display: grid; place-items: center; width: 42px; }
.threads-view { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 0; }
.thread-nav { display: flex; flex-direction: column; gap: 2px; min-height: 0; padding: 10px; overflow: hidden; border-right: 1px solid var(--tt-hairline); background: var(--tt-sidebar); font-size: 13.5px; }
.thread-nav__new { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; color: var(--tt-text-2); }
.thread-nav__project { margin: 12px 8px 4px; color: var(--tt-text-muted); font-size: 12px; }
.thread-nav__item { display: grid; grid-template-columns: 10px minmax(0, 1fr); align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 8px; color: var(--tt-text-2); }
.thread-nav__item span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thread-nav__item[data-current] { background: var(--tt-hover-strong); color: var(--tt-text); }
.thread-workspace { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.thread-workspace__head { display: flex; flex: none; align-items: center; gap: 10px; height: 44px; padding: 0 6px 0 18px; }
.thread-workspace__head h2 { min-width: 3em; margin: 0; overflow: hidden; font-size: 15px; font-weight: 500; letter-spacing: -.2px; text-overflow: ellipsis; white-space: nowrap; }
.thread-workspace__crumb { display: flex; flex: 0 100 auto; align-items: center; gap: 7px; min-width: 0; color: var(--tt-text-muted); font-size: 12.5px; }
.thread-workspace__crumb::before { content: '/'; }
.thread-workspace__actions { display: flex; gap: 2px; margin-left: auto; color: var(--tt-text-muted); }
.thread-workspace__actions > span { display: grid; place-items: center; width: 30px; height: 30px; }
.thread-pane { position: relative; display: flex; flex: 1; flex-direction: column; min-height: 0; }
.thread-workspace__transcript { flex: 1; min-height: 0; overflow-y: auto; padding: 28px max(24px, calc((100% - 760px) / 2)); scrollbar-width: thin; }
.thread-workspace__transcript:focus-visible { outline: 2px solid var(--tt-focus-ring); outline-offset: -2px; }
.thread-workspace__compose { flex: none; padding: 8px max(24px, calc((100% - 760px) / 2)) 20px; }
.thread-prompt { display: grid; gap: 10px; padding: 14px 16px 10px; border: 1px solid transparent; border-radius: 16px; background: var(--tt-card); }
.thread-prompt__text { color: var(--tt-text-muted); font-size: 15px; }
.thread-prompt__bar { display: flex; align-items: center; gap: 10px; color: var(--tt-text-muted); font-size: 12.5px; }
.thread-prompt__send { display: grid; place-items: center; width: 28px; height: 28px; margin-left: auto; border-radius: 50%; background: var(--tt-text); color: var(--tt-canvas); }
/* The real narrow (980px) and short (760px) window rules, applied by the frame's size rather than the page's. */
.frame[data-size='820x560'] .thread-workspace__head { padding-left: 14px; }
.frame[data-size='820x560'] .thread-workspace__crumb { display: none; }
.frame[data-size='820x560'] .thread-workspace__transcript { padding: 18px 18px; }
.frame[data-size='820x560'] .thread-workspace__compose { padding: 6px 16px 12px; }
.frame[data-size='820x560'] .thread-prompt { padding: 10px 14px 8px; gap: 6px; }
.frame[data-size='820x560'] .thread-message[data-role='user'] { margin-left: 24px; }

/* ---------- transcript: messages and the Worked for fold (threads.css, activity.css, rich-messages.css) ---------- */
.thread-message { position: relative; margin: 0 0 28px; }
.thread-message header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; color: var(--tt-text-muted); font-size: 12.5px; }
.thread-message__who { color: var(--tt-text-2); font-weight: 500; }
.thread-message time { font-size: 12px; font-variant-numeric: tabular-nums; }
.thread-message[data-role='user'] { margin-left: max(24px, 12%); padding: 14px 18px; border: 1px solid transparent; border-radius: 14px 14px 4px 14px; background: var(--tt-message); }
.thread-message[data-role='user'] p { margin: 0; color: var(--tt-text); font-size: 15px; line-height: 1.6; }
.rich-message { min-width: 0; color: var(--tt-text-2); font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; }
.rich-message p { margin: 0 0 12px; } .rich-message p:last-child { margin: 0; }
.rich-message code { padding: 1px 5px; border: 1px solid var(--tt-hairline); border-radius: 5px; background: var(--tt-code-bg); font-family: var(--tt-font-mono); font-size: 13.5px; }
.thread-work { margin: 0 0 20px; border-bottom: 1px solid var(--tt-field-border); }
.thread-message + .thread-work { margin-top: -8px; }
.thread-work__summary { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 32px; margin: 0 0 8px -6px; padding: 0 8px 0 6px; border: 0; border-radius: 8px; background: transparent; color: var(--tt-text-muted); font-size: 14px; font-variant-numeric: tabular-nums; text-align: left; cursor: pointer; }
.thread-work__summary:hover { background: var(--tt-hover); color: var(--tt-text-2); }
.thread-work__summary > svg { flex: none; transition: rotate 120ms ease; }
.thread-work[data-expanded] .thread-work__summary > svg { rotate: 90deg; }
.thread-work__body { padding: 8px 0 4px; }

/* ---------- delegated work: delegation.css as on main ---------- */
.delegated-work { display: grid; gap: 10px; margin: 0 0 16px; padding: 0; list-style: none; }
.thread-message ~ .delegated-work { margin-top: -12px; margin-bottom: 28px; }
.thread-work__body > ul.delegated-work { margin: 4px 0 12px 1px; padding-left: 10px; border-left: 1px solid var(--tt-hairline); }
.delegated-work__row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 2px 8px; min-width: 0; font-size: 14px; }
.delegated-work__glyph { flex: none; color: var(--tt-text-muted); }
.delegated-work__name { display: flex; align-items: baseline; gap: 8px; min-width: 0; color: var(--tt-text); font-weight: 500; white-space: nowrap; }
.delegated-work__name > :last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.delegated-work__kind { flex: none; color: var(--tt-text-2); font-weight: 400; }
.delegated-work__state { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
.delegated-work__meta, .delegated-work__line { grid-column: 2 / -1; margin: 0; font-size: 12.5px; line-height: 1.5; }
.delegated-work__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 7px; color: var(--tt-text-muted); }
.delegated-work__machine { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.delegated-work__machine > svg { flex: none; }
.delegated-work__machine[data-kind='remote'] > svg { color: var(--tt-accent-text, var(--tt-text-muted)); }
.delegated-work__line { color: var(--tt-text-2); }
.provider-mark { flex: none; color: var(--tt-text-muted); }
.delegated-work-still { display: grid; gap: 8px; margin: -12px 0 28px; padding-top: 10px; border-top: 1px solid var(--tt-hairline); }
.delegated-work-still__heading { margin: 0; color: var(--tt-text-muted); font-size: 13px; }
.delegated-work-still > .delegated-work { margin: 0; }
.thread-work__delegated { color: var(--tt-text-muted); }
.delegation-link { display: inline; min-width: 0; max-width: 100%; overflow: hidden; padding: 0; border: 0; border-radius: 3px; background: none; color: var(--tt-text); font: inherit; font-weight: 500;
  text-align: left; text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 45%, transparent); text-overflow: ellipsis; text-underline-offset: 3px; white-space: nowrap; cursor: pointer; }
.delegation-link:hover { text-decoration-color: currentColor; }
.delegated-work__state:is([data-state='working']) { color: var(--tt-activity); }
.delegated-work__state:is([data-state='answered']) { color: var(--tt-text-muted); }
.delegation-ring { display: block; flex: none; width: 10px; height: 10px; box-sizing: border-box; border: 1.5px solid var(--tt-hairline); border-radius: 50%; }
.delegation-ring[data-outcome='working'] { border: 0; background: conic-gradient(var(--tt-activity) 0 32%, color-mix(in srgb, var(--tt-activity) 22%, transparent) 32% 100%); mask: radial-gradient(circle, transparent 38%, currentcolor 42%); }
.delegation-ring[data-outcome='answered'] { border-color: var(--tt-text-muted); background: color-mix(in srgb, var(--tt-text-muted) 55%, transparent); }
@keyframes delegation-ring { to { rotate: 360deg; } }

/* ---------- new: a check's reply, as the thread wrote it ----------
   Shared by the variants: another thread's words wear a dashed edge in field-border, as a brief the delegating
   thread sent does in the delegated thread (delegation.css, data-from='delegation'). No status colour anywhere. */
.check-ghost { display: inline-flex; flex: none; align-items: center; gap: 4px; min-height: 24px; margin: 0 0 0 -6px; padding: 0 6px; border: 0; border-radius: var(--tt-radius-sm); background: transparent; color: var(--tt-text-2); font-size: 12.5px; cursor: pointer; }
.check-ghost:hover { background: var(--tt-hover); color: var(--tt-text); }
.check-ghost > svg { flex: none; transition: rotate 120ms ease; }
.check-ghost[aria-expanded='true'] > svg { rotate: 90deg; }
.check-open { flex: none; min-height: 24px; padding: 0; border: 0; border-radius: 2px; background: transparent; color: var(--tt-link); font-size: 12.5px; font-weight: 600; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; cursor: pointer; }
.check-cut { margin: 0; color: var(--tt-text-2); font-size: 12.5px; line-height: 1.5; }
.check-pre { margin: 0; color: var(--tt-text); font: 12.5px/1.55 var(--tt-font-mono); white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 2; }

/* A: Quoted lead. */
.check-reply { grid-column: 2 / -1; min-width: 0; margin: 6px 0 2px; }
.check-reply__who { display: flex; align-items: center; gap: 6px; margin: 0 0 4px; color: var(--tt-text-2); font-size: 12.5px; }
.check-reply__who > svg { flex: none; color: var(--tt-text-muted); }
.check-reply__quote { margin: 0; padding: 1px 0 1px 12px; border-left: 2px dashed var(--tt-field-border); color: var(--tt-text); font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.check-reply__quote p { margin: 0; white-space: pre-wrap; }
.check-reply__quote p + p { margin-top: 2px; }
.check-reply__quote .check-reply__gap { height: 6px; }
.check-reply__quote[data-clamped] { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }
.check-reply__more { margin: 0; padding: 6px 0 2px 12px; border-left: 2px dashed var(--tt-field-border); }
.check-reply__more .check-pre { color: var(--tt-text-2); }
.check-reply__foot { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 14px; margin: 4px 0 0; color: var(--tt-text-2); font-size: 12.5px; }
.check-reply__cut { margin-top: 6px; }

/* B: In the fold. The disclosure sits under the state, on the meta line's row. */
.delegated-work__row[data-b-reply] > .delegated-work__meta { grid-column: 2; grid-row: 2; }
.delegated-work__row[data-b-reply] > .check-ghost { grid-column: 3; grid-row: 2; justify-self: end; margin: 0 -6px 0 0; }
.check-fold { grid-column: 2 / -1; min-width: 0; margin: 6px 0 2px; border: 1px dashed var(--tt-field-border); border-radius: var(--tt-radius-md); background: var(--tt-code-bg); }
.check-fold__head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 7px 10px; border-bottom: 1px solid var(--tt-hairline); color: var(--tt-text-2); font-size: 12.5px; }
.check-fold__who { display: inline-flex; flex: 1 1 220px; align-items: baseline; gap: 6px; min-width: 0; }
.check-fold__who > svg { flex: none; align-self: center; color: var(--tt-text-muted); }
.check-fold__who b { color: var(--tt-text); font-weight: 500; }
.check-fold__text { max-height: calc(14 * 1.55em + 8px); overflow: auto; padding: 8px 10px; font-size: 12.5px; scrollbar-width: thin; }
.frame[data-size='820x560'] .check-fold__text { max-height: calc(9 * 1.55em + 8px); }
/* A scroll-capped reply fades its last line while more of it is below. */
:is(.check-fold__text, .check-tray__text)[data-more] { mask-image: linear-gradient(to bottom, currentColor calc(100% - 1.8em), transparent); }
.check-fold__foot { margin: 0; padding: 6px 10px 7px; border-top: 1px solid var(--tt-hairline); color: var(--tt-text-2); font-size: 12.5px; }

/* C: Excerpt on the row, the rest in a tray. */
.check-excerpt { display: flex; grid-column: 2 / -1; align-items: baseline; gap: 6px; min-width: 0; margin: 1px 0 1px; color: var(--tt-text-2); font-size: 13px; line-height: 1.5; }
.check-excerpt__who { flex: none; color: var(--tt-text-muted); }
.check-excerpt q { min-width: 0; overflow: hidden; color: var(--tt-text-2); text-overflow: ellipsis; white-space: nowrap; }
.check-excerpt__cut { flex: none; color: var(--tt-text-muted); font-size: 12.5px; }
.check-excerpt .check-open { margin-left: 4px; }

/** The first n lines with words in them, blank lines between kept, and where they end. */
function firstLines(ls, from, n) {
  let i = from, got = 0
  while (i < ls.length && ls[i].trim() === '') i++

/* A: the first two lines, quoted and attributed, under the row; up to ten more on a press. */
function quotedLead(r) {
  const ls = linesOf(r), lead = firstLines(ls, 0, 2), more = firstLines(ls, lead.end, 10)

  const shownTo = open ? more.end : lead.end
  const rest = restWords(r, shownTo)
  const openBtn = rest || r.truncated ? `<button type="button" class="check-open tt-focusable" data-act="open" data-row="${r.id}" data-key="aopen-${r.id}" aria-label="${esc(openName(r))}">Open the check</button>` : ''

    aria-label="Reply from ${esc(r.title)}, the check on ${esc(on(r.machine))}">${icon('chev', 13)}Reply</button>`

function foldBlock(r) {
  const ls = linesOf(r), shown = ls.slice(0, MOST_B), rest = restWords(r, Math.min(ls.length, MOST_B))
  const scrolls = shown.length > 9
  return `<section class="check-fold" id="fold-${r.id}" aria-label="Reply from ${esc(r.title)}, the check on ${esc(on(r.machine))}, in its own words"${reveal === r.id ? ' data-reveal' : ''}>
    <div class="check-fold__head"><span class="check-fold__who">${icon('quote', 13)}<span><b>${esc(r.title)}</b> replied on ${esc(on(r.machine))} · ${r.at}</span></span>
      <button type="button" class="check-open tt-focusable" data-act="open" data-row="${r.id}" data-key="bopen-${r.id}" aria-label="${esc(openName(r))}">Open the check</button></div>
    <div class="check-fold__text"${scrolls ? ` tabindex="0" role="region" aria-label="${shown.length < ls.length ? `The reply's first ${MOST_B} lines` : 'Its whole reply'}" data-key="bpre-${r.id}"` : ''}><pre class="check-pre">${esc(shown.join('\n'))}</pre></div>
    ${rest || r.truncated ? `<p class="check-fold__foot tt-paragraph">${shown.length < ls.length ? `Its first ${MOST_B} lines. ` : ''}${r.truncated ? cutWords : esc(rest)}</p>` : ''}
  </section>`
}

/* C: the first line in quotes on the row; the tray opens on a press. */
function excerpt(r) {
  const first = linesOf(r).find(l => l.trim() !== '')
  const open = S.tray === r.id
  return `<p class="check-excerpt"><span class="check-excerpt__who">It replied</span><q title="${esc(first)}">${esc(first)}</q>${r.truncated ? '<span class="check-excerpt__cut">· cut at 32 KiB</span>' : ''}
    <button type="button" class="check-open tt-focusable" data-act="c-tray" data-row="${r.id}" data-key="c-${r.id}" aria-expanded="${open}" aria-controls="check-tray"
      aria-label="Read the reply from ${esc(r.title)}, the check on ${esc(on(r.machine))}">Read its reply</button></p>`
}
function tray(r) {
  const ls = linesOf(r), shown = ls.slice(0, MOST_B), rest = restWords(r, Math.min(ls.length, MOST_B))
  return `<section class="check-tray" id="check-tray" role="dialog" aria-modal="false" tabindex="-1" aria-labelledby="tray-who" data-key="tray"${reveal === 'tray' ? ' data-reveal' : ''}>
    <div class="check-tray__head">
      <h3 class="check-tray__who" id="tray-who"><b>${esc(r.title)}</b><span>Its reply, in its own words, on ${esc(on(r.machine))} · ${r.at}</span></h3>
      <button type="button" class="check-tray__close tt-focusable" data-act="c-close" data-key="tclose" aria-label="Close the reply">${icon('x', 16)}</button>
    </div>
    <div class="check-tray__text"${shown.length > 8 ? ` tabindex="0" role="region" aria-label="${shown.length < ls.length ? `The reply's first ${MOST_B} lines` : 'Its whole reply'}" data-key="tpre"` : ''}><pre class="check-pre">${esc(shown.join('\n'))}</pre></div>
    <p class="check-tray__foot tt-paragraph"><span>${shown.length < ls.length ? `Its first ${MOST_B} lines. ` : ''}${r.truncated ? cutWords : esc(rest || 'That is all of its reply.')}</span>
      <button type="button" class="check-open tt-focusable" data-act="open" data-row="${r.id}" data-key="topen" aria-label="${esc(openName(r))}">Open the check</button></p>
  </section>`
}

/* ---------- the transcript ---------- */
function turn(T) {
  const rows = T.rows.map(id => ROWS[id]), open = S.folds[T.id]
  const checks = rows.filter(r => r.check).length, others = rows.length - checks
  const summary = [others && `${others} delegated thread${others > 1 ? 's' : ''}`, checks && `${checks} check${checks > 1 ? 's' : ''}`].filter(Boolean).join(' · ')
  const still = rows.filter(r => r.outcome === 'working')
  return `<article class="thread-message" data-role="user"><p>${esc(T.user)}</p></article>
  <section class="thread-work"${open ? ' data-expanded' : ''} data-turn="${T.id}" aria-labelledby="${T.id}-headline">
    <button type="button" class="thread-work__summary tt-focusable" data-act="fold" data-turn="${T.id}" data-key="fold-${T.id}" aria-expanded="${open}" aria-controls="${T.id}-body">
      <span id="${T.id}-headline">${T.worked}<span class="thread-work__delegated"> · ${summary}</span></span>${icon('chev', 14)}</button>
    ${open ? `<div class="thread-work__body" id="${T.id}-body"><ul class="delegated-work" aria-label="Delegated work">${rows.map(row).join('')}</ul></div>` : ''}
  </section>
  <article class="thread-message" data-role="assistant"><header><span class="thread-message__who">Claude Code</span><time>${T.replyAt}</time></header>
    <div class="rich-message">${T.reply.map(p => `<p>${p}</p>`).join('')}</div></article>
  ${!open && still.length ? `<section class="delegated-work-still" aria-labelledby="${T.id}-still"><p id="${T.id}-still" class="delegated-work-still__heading">Still working after this reply</p>
    <ul class="delegated-work">${still.map(row).join('')}</ul></section>` : ''}`
}

function render(focusKey, keepScroll = true) {
  const top = tx.scrollTop
  tx.innerHTML = TURNS.map(turn).join('')
  trayslot.innerHTML = S.v === 'c' && S.tray ? tray(ROWS[S.tray]) : ''
  const t = trayslot.firstElementChild
  if (t) fitTray(); else tx.style.paddingBottom = ''
  document.querySelectorAll('.check-fold__text, .check-tray__text').forEach(moreBelow)
  if (keepScroll) tx.scrollTop = top
  reveal = null
  if (focusKey) document.querySelector(`[data-key="${focusKey}"]`)?.focus({ preventScroll: true })
}
function settings() {
  root.dataset.theme = S.theme
  if (S.motion === 'reduce') root.dataset.reducedMotion = 'on'; else delete root.dataset.reducedMotion
  frame.dataset.size = S.size
  document.getElementById('theme').setAttribute('aria-pressed', String(S.theme === 'light'))
  document.getElementById('motion').setAttribute('aria-pressed', String(S.motion === 'reduce'))
  document.querySelectorAll('#sizes [data-size]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.size === S.size)))
  document.querySelectorAll('#vbtns [data-v]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.v)))
  const v = VARIANTS.find(x => x.k === S.v)
  document.getElementById('vname').textContent = `${v.k.toUpperCase()}. ${v.n}: ${v.why}`
  try { const u = new URL(location.href); for (const [k, val] of [['variant', S.v], ['theme', S.theme], ['motion', S.motion], ['size', S.size]]) u.searchParams.set(k, val); history.replaceState(null, '', u) } catch { /* sandboxed */ }
}
/** A thread opens at its newest turn: its user message at the top. */
function toNewest() { const last = [...tx.querySelectorAll('.thread-message[data-role="user"]')].at(-1); if (last) tx.scrollTop += last.getBoundingClientRect().top - tx.getBoundingClientRect().top - 12 }
function setVariant(k) { S.v = k; S.aOpen.clear(); S.bOpen.clear(); S.tray = null; settings(); render(undefined, false); toNewest() }
function say(words) { document.getElementById('said').textContent = words }
/** The tray stops short of its row's height, so the row fits above it; the transcript gains room to scroll under it. */
function fitTray() {
  const t = trayslot.firstElementChild, el = document.getElementById(`row-${S.tray}`); if (!t || !el) return
  t.style.maxHeight = `${Math.max(200, Math.min(400, tx.clientHeight - el.getBoundingClientRect().height - 28))}px`
  tx.style.paddingBottom = `${t.offsetHeight + 16}px`
  moreBelow(t.querySelector('.check-tray__text'))
}
/** Keeps a row in view above the tray. */
function keepAbove(el) {
  const t = trayslot.firstElementChild; if (!el || !t) return
  // The tray stops short of its row, which stays in view at the transcript's top, however short the window.
  const view = tx.getBoundingClientRect()
  fitTray()
  const r = el.getBoundingClientRect(), limit = trayslot.firstElementChild.getBoundingClientRect().top - 10
  if (r.bottom > limit || r.top < view.top) tx.scrollTop += r.top - view.top - 8
}

function moreBelow(el) { if (el.scrollTop + el.clientHeight < el.scrollHeight - 2) el.dataset.more = ''; else delete el.dataset.more }
document.addEventListener('scroll', e => { if (e.target.matches?.('.check-fold__text, .check-tray__text')) moreBelow(e.target) }, true)

/* ---------- presses ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return
  const r = ROWS[b.dataset.row]
  switch (b.dataset.act) {
    case 'fold': S.folds[b.dataset.turn] = !S.folds[b.dataset.turn]; render(b.dataset.key); break
    case 'a-more': S.aOpen.has(r.id) ? S.aOpen.delete(r.id) : (S.aOpen.add(r.id), reveal = r.id); render(b.dataset.key); break
    case 'b-reply': S.bOpen.has(r.id) ? S.bOpen.delete(r.id) : (S.bOpen.add(r.id), reveal = r.id); render(b.dataset.key); break
    case 'c-tray':
      if (S.tray === r.id) { S.tray = null; render(b.dataset.key); break }
      S.tray = r.id; reveal = 'tray'; render('tray'); keepAbove(document.getElementById(`row-${r.id}`)); break
    case 'c-close': { const from = S.tray; S.tray = null; render(`c-${from}`); break }
    case 'open': say(`Pressed Open: in Sotto this opens "${r.title}" in this pane, with its whole reply, as a row's link does.`); break
  }
})
document.getElementById('vbtns').innerHTML = VARIANTS.map(v => `<button data-v="${v.k}" aria-label="Variant ${v.k.toUpperCase()}, ${v.n}">${v.k.toUpperCase()}</button>`).join('')
document.getElementById('vbtns').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) setVariant(b.dataset.v) })
const step = d => setVariant(VARIANTS[(VARIANTS.findIndex(v => v.k === S.v) + d + VARIANTS.length) % VARIANTS.length].k)
document.getElementById('prev').addEventListener('click', () => step(-1))
document.getElementById('next').addEventListener('click', () => step(1))
document.getElementById('sizes').addEventListener('click', e => { const b = e.target.closest('[data-size]'); if (b) { S.size = b.dataset.size; settings(); render(); if (S.tray) keepAbove(document.getElementById(`row-${S.tray}`)) } })
document.getElementById('theme').addEventListener('click', () => { S.theme = S.theme === 'light' ? 'dark' : 'light'; settings() })
document.getElementById('motion').addEventListener('click', () => { S.motion = S.motion === 'reduce' ? 'full' : 'reduce'; settings() })
const JUMPS = [['fail', 'Failing'], ['pass', 'Passing'], ['prose', 'Prose first'], ['cut', 'Cut at 32 KiB'], ['wait', 'Waiting'], ['build', 'Not a check']]
document.getElementById('jumps').innerHTML = JUMPS.map(([id, w]) => `<button data-jump="${id}" aria-label="Scroll to the ${w.toLowerCase()} sample">${w}</button>`).join('')
document.getElementById('jumps').addEventListener('click', e => {
  const b = e.target.closest('[data-jump]'); if (!b) return
  const T = TURNS.find(t => t.rows.includes(b.dataset.jump))
  if (!S.folds[T.id] && b.dataset.jump !== 'wait') { S.folds[T.id] = true; render() }
  const el = document.getElementById(`row-${b.dataset.jump}`)
  if (el) tx.scrollTop += el.getBoundingClientRect().top - tx.getBoundingClientRect().top - 12
})

/* ---------- keys: Left/Right switch variants; Escape closes what is open nearest focus ---------- */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const a = document.activeElement
    if (S.tray && (trayslot.contains(a) || a?.dataset.act === 'c-tray' || !a || a === document.body || tx.contains(a))) { const from = S.tray; S.tray = null; render(`c-${from}`); e.preventDefault(); return }
    const li = a?.closest?.('.delegated-work__row')
    const id = li?.id.replace('row-', '')
    if (id && S.v === 'a' && S.aOpen.has(id)) { S.aOpen.delete(id); render(`a-${id}`); e.preventDefault(); return }
    if (id && S.v === 'b' && S.bOpen.has(id)) { S.bOpen.delete(id); render(`b-${id}`); e.preventDefault(); return }
    const fold = a?.closest?.('.thread-work[data-expanded]')
    if (fold) { S.folds[fold.dataset.turn] = false; render(`fold-${fold.dataset.turn}`); e.preventDefault() }
    return
  }
  if (e.altKey || e.metaKey || e.ctrlKey || e.shiftKey) return
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return
  if (e.key === 'ArrowRight') { step(1); e.preventDefault() } else if (e.key === 'ArrowLeft') { step(-1); e.preventDefault() }
})
document.getElementById('headmark').innerHTML = MARK.claude(15)
if (S.motion === 'full' && matchMedia('(prefers-reduced-motion: reduce)').matches) say('Your system asks for reduced motion, so nothing here moves whatever the toggle says.')
settings(); render(undefined, false); toNewest()
</script>
</body>
</html>
