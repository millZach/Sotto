  :root { --page: #1b1d21; --page-text: #e8e8e8; font-family: Figtree, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; padding-bottom: 90px; background: var(--page); color: var(--page-text); }
  .proto-top { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 14px; background: #0e0f12; border-bottom: 1px solid #2a2d33; font-size: 13px; }
  .proto-top b { font-weight: 600; }
  .proto-top .grp { display: flex; gap: 4px; align-items: center; }
  .proto-top button { font: inherit; padding: 4px 10px; border-radius: 999px; border: 1px solid #3a3e46; background: transparent; color: inherit; cursor: pointer; }
  .proto-top button[aria-pressed='true'] { background: #e8e8e8; color: #111; border-color: #e8e8e8; }
  .proto-note { padding: 10px 14px 0; font-size: 13px; color: #b5b7bb; max-width: 1100px; line-height: 1.5; }
  .stage { padding: 14px; display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
  .shot { display: flex; flex-direction: column; gap: 6px; }
  .shot__label { font-size: 12px; color: #9a9da3; }
  .shot__clip { overflow: hidden; border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  .shot__scale { transform-origin: 0 0; }

  /* ===== A mock Sotto window, at real pixels, then scaled ===== */
  .win { position: relative; overflow: hidden; font-family: Figtree, system-ui, sans-serif; color: var(--tt-text); background: var(--tt-surface); }
  .win[data-theme='dark'] {
    --tt-surface: #101215; --tt-surface-elevated: #15181c; --tt-surface-sunken: #0b0d10; --tt-text: #ecedee; --tt-text-2: #c9cbce;
    --tt-text-muted: #9ea2a8; --tt-text-faint: #5b6068; --tt-hairline: #262a30; --tt-panel-border: #2c3036; --tt-accent: #3cb9a7;
    --tt-accent-contrast: #06201c; --tt-backdrop: rgba(0,0,0,.6); --tt-focus: #5fd3c1; --node: #15181c; --dim: .28; --group: rgba(60,185,167,.07);
    --primary-bg: #ecedee; --primary-text: #111316;
  }
  .win[data-theme='light'] {
    --tt-surface: #f7f6f3; --tt-surface-elevated: #f2f1ed; --tt-surface-sunken: #ebeae6; --tt-text: #1d1f22; --tt-text-2: #3c3f44;
    --tt-text-muted: #62666c; --tt-text-faint: #a8abb0; --tt-hairline: #dfddd8; --tt-panel-border: #d6d4cf; --tt-accent: #0f7a70;
    --tt-accent-contrast: #ffffff; --tt-backdrop: rgba(30,30,30,.35); --tt-focus: #0f7a70; --node: #f7f6f3; --dim: .32; --group: rgba(15,122,112,.07);
    --primary-bg: #1d1f22; --primary-text: #ffffff;
  }
  /* The thread behind the dialog, blurred */
  .win__behind { position: absolute; inset: 0; display: grid; grid-template-columns: 300px 1fr; filter: blur(4px); opacity: .7; }
  .win__side { background: var(--tt-surface-elevated); border-right: 1px solid var(--tt-hairline); }
  .win__room { padding: 80px 120px; }
  .win__room div { height: 18px; margin: 14px 0; border-radius: 6px; background: var(--tt-hairline); }
  .win__backdrop { position: absolute; inset: 0; background: var(--tt-backdrop); }

  /* The dialog: rich-diagram-viewer */
  .viewer { position: absolute; inset: 24px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--tt-panel-border); border-radius: 14px; background: var(--tt-surface-sunken); box-shadow: 0 24px 60px rgba(0,0,0,.35); }
  .viewer__bar { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 8px 6px 18px; border-bottom: 1px solid var(--tt-hairline); background: var(--tt-surface-elevated); }
  .viewer__title { flex: 1; min-width: 0; margin: 0; overflow: hidden; font-size: 16px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
  .viewer__controls { display: flex; align-items: center; gap: 2px; }
  .icon { display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: var(--tt-text-2); font-size: 15px; }
  .zoom { min-width: 52px; color: var(--tt-text-2); font-size: 14px; text-align: center; font-variant-numeric: tabular-nums; }
  .divider { width: 1px; height: 20px; margin: 0 6px; background: var(--tt-hairline); }
  .viewport { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; }
  .viewport svg { width: 92%; height: 92%; }
  .hint { margin: 0; padding: 8px 18px; border-top: 1px solid var(--tt-hairline); color: var(--tt-text-muted); font-size: 12px; line-height: 1.4; }

  /* Drawing */
  .n rect, .n polygon { fill: var(--node); stroke: var(--tt-text-faint); stroke-width: 1.5; }
  .n text { fill: var(--tt-text); font: 500 15px Figtree, system-ui, sans-serif; text-anchor: middle; dominant-baseline: middle; }
  .e { stroke: var(--tt-text-faint); stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  .g rect { fill: var(--group); stroke: var(--tt-hairline); }
  .g text { fill: var(--tt-text-muted); font: 500 14px Figtree, system-ui, sans-serif; text-anchor: middle; }
  .n, .e { transition: opacity 220ms ease; }
  svg[data-step] .n:not(.lit), svg[data-step] .e:not(.lit) { opacity: var(--dim); }
  .n.lit rect, .n.lit polygon { stroke: var(--tt-accent); stroke-width: 3; }
  .e.lit { stroke: var(--tt-accent); stroke-width: 2.5; }

  /* Interactive page stand-in */
  .page { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: var(--tt-surface); }
  .page__gauge { display: flex; gap: 12px; align-items: flex-end; height: 50%; }
  .page__bar { width: 60px; border-radius: 8px 8px 0 0; background: var(--tt-text-faint); transition: height 260ms ease, background 260ms ease; }
  .page__bar.lit { background: var(--tt-accent); }
  .page__caption { color: var(--tt-text-muted); font-size: 14px; }

  /* ===== The walkthrough bar, the card's visual-stepper ===== */
  .stepper { padding: 12px 18px 14px; border-top: 1px solid var(--tt-hairline); background: var(--tt-surface-elevated); }
  .stepper__head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
  .stepper__count { flex: none; color: var(--tt-text-muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stepper__dots { display: flex; flex: 1 1 auto; flex-wrap: wrap; align-items: center; gap: 0 4px; min-width: 0; }
  .dot { display: grid; place-items: center; width: 20px; height: 24px; padding: 0; border: 0; border-radius: 6px; background: transparent; cursor: pointer; }
  .dot::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--tt-text-faint); }
  .dot[data-state='done']::before { background: var(--tt-text-muted); }
  .dot[data-state='current'] { width: 30px; }
  .dot[data-state='current']::before { width: 22px; border-radius: 5px; background: var(--tt-accent); }
  .stepper__nav { display: flex; flex: none; gap: 8px; margin-left: auto; }
  .btn { min-width: 70px; min-height: 30px; padding: 0 12px; border: 1px solid var(--tt-panel-border); border-radius: 999px; background: transparent; color: var(--tt-text); font: 500 13px Figtree, system-ui, sans-serif; cursor: pointer; }
  .btn--primary { border-color: var(--primary-bg); background: var(--primary-bg); color: var(--primary-text); }
  .btn[aria-disabled='true'] { border-color: var(--tt-hairline); color: var(--tt-text-muted); cursor: not-allowed; }
  .btn:focus-visible, .dot:focus-visible { outline: 2px solid var(--tt-focus); outline-offset: 2px; }
  .stepper__text { min-height: 50px; margin: 10px 0 0; color: var(--tt-text); font-size: 16px; line-height: 1.55; overflow-wrap: anywhere; white-space: pre-wrap; }

  /* B: the words hold at most three lines; a longer step scrolls inside, so the picture keeps its room. */
  .viewer[data-variant='B'] .stepper__text { max-height: calc(1.55em * 3); overflow-y: auto; }
  /* C: on a wide window, the words sit left of the controls in one band; at the minimum it falls back to A. */
  .viewer[data-variant='C'] .stepper { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 28px; align-items: start; }
  .viewer[data-variant='C'] .stepper__text { grid-column: 1; grid-row: 1; margin: 0; min-height: 0; max-height: calc(1.55em * 4); overflow-y: auto; }
  .viewer[data-variant='C'] .stepper__head { grid-column: 2; grid-row: 1; flex-direction: column; align-items: flex-end; gap: 6px; flex-wrap: nowrap; }
  .viewer[data-variant='C'] .stepper__dots { flex: none; justify-content: flex-end; max-width: 260px; }
  .viewer[data-variant='C'] .stepper__nav { margin-left: 0; }
  .win[data-w='820'] .viewer[data-variant='C'] .stepper { display: block; }
  .win[data-w='820'] .viewer[data-variant='C'] .stepper__head { flex-direction: row; align-items: center; flex-wrap: wrap; }
  .win[data-w='820'] .viewer[data-variant='C'] .stepper__nav { margin-left: auto; }
  .win[data-w='820'] .viewer[data-variant='C'] .stepper__text { margin-top: 10px; }

  /* Prototype switcher pill */
  .pill { position: fixed; left: 50%; bottom: 16px; z-index: 20; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 999px; background: #ffe259; color: #111; box-shadow: 0 8px 26px rgba(0,0,0,.45); font: 600 13px Figtree, system-ui, sans-serif; }
  .pill button { width: 30px; height: 30px; border: 0; border-radius: 50%; background: #111; color: #ffe259; font-size: 15px; cursor: pointer; }
  .pill span { min-width: 220px; text-align: center; }
  @media (max-width: 600px) { .pill span { min-width: 150px; font-size: 12px; } }
</style>
</head>
<body>
<div class="proto-top" id="controls"></div>
<p class="proto-note" id="note"></p>
<div class="stage" id="stage"></div>
<div class="pill"><button type="button" id="prev" aria-label="Previous variant">←</button><span id="variantLabel"></span><button type="button" id="next" aria-label="Next variant">→</button></div>

<script>
const VARIANTS = {
  A: 'A · The card\'s bar, grows with the words',
  B: 'B · The card\'s bar, words hold three lines',
  C: 'C · Words left, controls right when wide',
}
const NOTES = {
  A: 'The card\'s bar exactly: count, dots, Back/Next on one line, the step\'s words under them. A long step makes the bar taller and the picture gives up the room.',
  B: 'The same bar, but the step\'s words stop at three lines and scroll inside the bar, so a long step never shrinks the picture.',
  C: 'The same pieces in one band on a wide window: words on the left, count, dots and Back/Next stacked on the right. At the 820x560 minimum it falls back to A.',
}
const STEPS = [
  { node: 'tin', text: 'SLK6_DT reads the inlet temperature, TT-601, from its analog input every scan.' },
  { node: 'tout', text: 'It reads the outlet temperature, TT-602, the same way.' },
  { node: 'filt', text: 'Each reading goes through a first-order filter with a 2 second time constant, so a single noisy scan does not move ΔT.' },
  { node: 'bad', text: 'If either transmitter reports bad quality (open circuit, out of range below 3.8 mA or above 20.5 mA, or a module fault), the block holds the last good ΔT, sets SLK6_DT.BadPV, and keeps holding until both inputs have been good for five consecutive seconds. Operators see the value turn magenta on the faceplate and an "Input bad" note under it; nothing downstream trips on a held value, but the firing-rate trim stops adjusting until the inputs recover, so expect the steam header to drift a little while it holds.', long: true },
  { node: 'sub', text: 'With both inputs good, it subtracts: ΔT = outlet − inlet.' },
  { node: 'clamp', text: 'The result is clamped to 0–150 °F, the range the trim loop was tuned for.' },
  { node: 'out', text: 'The clamped ΔT is written to SLK6_DT.Out, which the firing-rate trim reads.' },
]
const SHORT_FOR_LONG = 'If either transmitter reports bad quality, the block holds the last good ΔT and sets SLK6_DT.BadPV.'
const SIZES = [[1600, 1000], [1280, 800], [820, 560]]

const params = new URLSearchParams(location.search)
const state = {
  variant: VARIANTS[params.get('variant')] ? params.get('variant') : 'A',
  view: params.get('view') ?? 'all',      // all | one
  size: Number(params.get('size') ?? 1280),
  theme: params.get('theme') ?? 'dark',
  kind: params.get('kind') ?? 'diagram',  // diagram | page
  long: params.get('long') !== '0',
  step: Number(params.get('step') ?? 4) - 1,
}

function stepsNow() { return STEPS.map(s => s.long && !state.long ? { ...s, text: SHORT_FOR_LONG } : s) }

function drawing() {
  const lit = STEPS[state.step].node
  const node = (id, x, y, w, h, label, shape) => {
    const cls = `n${id === lit ? ' lit' : ''}`
    if (shape === 'diamond') return `<g class="${cls}"><polygon points="${x + w / 2},${y} ${x + w},${y + h / 2} ${x + w / 2},${y + h} ${x},${y + h / 2}"/><text x="${x + w / 2}" y="${y + h / 2}">${label}</text></g>`
    return `<g class="${cls}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/><text x="${x + w / 2}" y="${y + h / 2}">${label}</text></g>`
  }
  const edge = (d, to) => `<path class="e${to === lit ? ' lit' : ''}" d="${d}"/>`
  return `<svg viewBox="0 0 1000 420" data-step="${state.step}" aria-hidden="true">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" style="color:var(--tt-text-faint)"/></marker></defs>
    <g class="g"><rect x="20" y="20" width="250" height="380" rx="6"/><text x="145" y="46">Inputs</text></g>
    ${node('tin', 50, 80, 190, 56, 'Read TT-601 inlet')}
    ${node('tout', 50, 290, 190, 56, 'Read TT-602 outlet')}
    ${edge('M240,108 C300,108 300,190 330,200', 'filt')}
    ${edge('M240,318 C300,318 300,230 330,220', 'filt')}
    ${node('filt', 330, 182, 150, 56, 'Filter 2 s')}
    ${edge('M480,210 L520,210', 'bad')}
    ${node('bad', 520, 150, 150, 120, 'Inputs good?', 'diamond')}
    ${edge('M670,210 L710,210', 'sub')}
    ${node('sub', 710, 182, 120, 56, 'Out − In')}
    ${edge('M830,210 L860,210', 'clamp')}
    ${node('clamp', 860, 182, 120, 56, 'Clamp')}
    ${edge('M920,238 L920,320', 'out')}
    ${node('out', 820, 320, 160, 56, 'SLK6_DT.Out')}
    ${edge('M595,270 C595,348 700,348 820,348', 'bad')}
  </svg>`
}

function page() {
  const heights = [40, 52, 46, 30, 68, 60, 64]
  return `<div class="page"><div class="page__gauge">${heights.map((h, i) => `<div class="page__bar${i === state.step ? ' lit' : ''}" style="height:${h}%"></div>`).join('')}</div>
    <div class="page__caption">The agent's page, shown step ${state.step + 1}</div></div>`
}

function stepper() {
  const steps = stepsNow(), count = steps.length, cur = state.step
  const dots = steps.map((_, i) => `<button type="button" class="dot" tabindex="${i === cur ? 0 : -1}" aria-label="Go to step ${i + 1}" ${i === cur ? 'aria-current="step" data-state="current"' : i < cur ? 'data-state="done"' : ''} data-go="${i}"></button>`).join('')
  const last = cur === count - 1
  return `<div class="stepper" role="group" aria-label="Walkthrough">
    <div class="stepper__head">
      <span class="stepper__count">Step ${cur + 1} of ${count}</span>
      <div class="stepper__dots" role="group" aria-label="Steps">${dots}</div>
      <div class="stepper__nav">
        <button type="button" class="btn" ${cur === 0 ? 'aria-disabled="true"' : ''} data-go="${cur - 1}">Back</button>
        <button type="button" class="btn btn--primary" data-go="${last ? 0 : cur + 1}">${last ? 'Start over' : 'Next'}</button>
      </div>
    </div>
    <p class="stepper__text" aria-live="polite">${steps[cur].text}</p>
  </div>`
}

function windowHtml(w, h, theme) {
  const diagram = state.kind === 'diagram'
  const controls = diagram
    ? `<span class="icon">−</span><output class="zoom">100%</output><span class="icon">+</span><span class="icon">⛶</span><span class="divider"></span><span class="icon">⧉</span><span class="icon">✕</span>`
    : `<span class="icon">⧉</span><span class="icon">✕</span>`
  const title = diagram ? 'Flowchart: How SLK6_DT calculates ΔT' : 'Interactive page: How SLK6_DT calculates ΔT'
  const hint = diagram ? `<p class="hint">← → to step · Drag or ↑ ↓ to move · Scroll or +/− to zoom · 0 to fit</p>` : ''
  return `<div class="win" data-theme="${theme}" data-w="${w}" style="width:${w}px;height:${h}px">
    <div class="win__behind"><div class="win__side"></div><div class="win__room"><div></div><div style="width:70%"></div><div style="width:85%"></div></div></div>
    <div class="win__backdrop"></div>
    <div class="viewer" data-variant="${state.variant}" role="dialog" aria-label="${title}">
      <header class="viewer__bar"><h2 class="viewer__title">${title}</h2><div class="viewer__controls">${controls}</div></header>
      <div class="viewport">${diagram ? drawing() : page()}</div>
      ${stepper()}
      ${hint}
    </div>
  </div>`
}

function shot(w, h, theme, maxW) {
  const scale = Math.min(1, maxW / w)
  return `<div class="shot"><span class="shot__label">${w}×${h} · ${theme}</span>
    <div class="shot__clip" style="width:${w * scale}px;height:${h * scale}px"><div class="shot__scale" style="transform:scale(${scale})">${windowHtml(w, h, theme)}</div></div></div>`
}

function render() {
  const avail = Math.max(280, document.documentElement.clientWidth - 28)
  const stage = document.getElementById('stage')
  if (state.view === 'all') {
    const col = avail >= 1100 ? (avail - 22) / 2 : avail
    stage.innerHTML = SIZES.flatMap(([w, h]) => ['dark', 'light'].map(t => shot(w, h, t, col))).join('')
  } else {
    const [w, h] = SIZES.find(([sw]) => sw === state.size) ?? SIZES[1]
    stage.innerHTML = shot(w, h, state.theme, avail)
  }
  document.getElementById('variantLabel').textContent = VARIANTS[state.variant]
  document.getElementById('note').textContent = NOTES[state.variant] + '  Back, Next, the dots and ← → all work; Esc would close.'
  renderControls()
  const q = new URLSearchParams({ variant: state.variant, view: state.view, size: state.size, theme: state.theme, kind: state.kind, long: state.long ? '1' : '0', step: state.step + 1 })
  history.replaceState(null, '', '?' + q)
}

function renderControls() {
  const btn = (key, val, label) => `<button type="button" data-set="${key}" data-val="${val}" aria-pressed="${String(state[key]) === String(val)}">${label}</button>`
  document.getElementById('controls').innerHTML = `
    <b>PROTOTYPE</b>
    <span class="grp">${btn('view', 'all', 'All sizes')}${btn('view', 'one', 'One')}</span>
    ${state.view === 'one' ? `<span class="grp">${SIZES.map(([w, h]) => btn('size', w, `${w}×${h}`)).join('')}</span><span class="grp">${btn('theme', 'dark', 'Dark')}${btn('theme', 'light', 'Light')}</span>` : ''}
    <span class="grp">${btn('kind', 'diagram', 'Diagram')}${btn('kind', 'page', 'Interactive page')}</span>
    <span class="grp">${btn('long', true, 'Long step 4')}${btn('long', false, 'Short step 4')}</span>`
}

document.addEventListener('click', event => {
  const set = event.target.closest('[data-set]')
  if (set) {
    const key = set.dataset.set, raw = set.dataset.val
    state[key] = key === 'size' ? Number(raw) : key === 'long' ? raw === 'true' : raw
    render(); return
  }
  const go = event.target.closest('[data-go]')
  if (go && go.getAttribute('aria-disabled') !== 'true') {
    const n = Number(go.dataset.go)
    if (n >= 0 && n < STEPS.length) { state.step = n; render() }
  }
})
const cycle = d => { const keys = Object.keys(VARIANTS); state.variant = keys[(keys.indexOf(state.variant) + d + keys.length) % keys.length]; render() }
document.getElementById('prev').onclick = () => cycle(-1)
document.getElementById('next').onclick = () => cycle(1)
document.addEventListener('keydown', event => {
  if (event.altKey || event.ctrlKey || event.metaKey) return
  if (event.shiftKey && (event.key === 'ArrowLeft' || event.key === 'ArrowRight')) { cycle(event.key === 'ArrowRight' ? 1 : -1); return }
  if (event.key === 'ArrowLeft' && state.step > 0) { state.step--; render() }
  if (event.key === 'ArrowRight' && state.step < STEPS.length - 1) { state.step++; render() }
})
addEventListener('resize', render)
render()
</script>
</body>
</html>
