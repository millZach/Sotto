<!doctype html>
<!-- Throwaway native iOS design fixture. Selected pairing B and thread-first flow; no host calls. -->
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sotto - iOS flow prototype</title><link rel="stylesheet" href="/src/renderer/src/styles/tokens.css"><style>
@font-face{font-family:Figtree;src:url('/src/renderer/src/assets/fonts/figtree-latin.woff2');font-weight:300 900}*{box-sizing:border-box}body{margin:0;background:var(--tt-canvas);color:var(--tt-text);font:17px/1.55 Figtree,system-ui,sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{min-height:44px;min-width:44px;padding:9px 14px;border:0;border-radius:10px;background:transparent;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--tt-focus-ring);outline-offset:2px}.primary{background:var(--tt-accent-surface);color:var(--tt-accent-surface-text);font-weight:600}.quiet{color:var(--tt-accent-text)}.app{overflow:hidden;max-width:520px;margin:auto;height:calc(100dvh - 68px);display:flex;flex-direction:column}.top{min-height:64px;display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--tt-hairline);gap:10px}.top strong{font-size:18px;flex:1;line-height:1.3}.room{flex:1;overflow:auto;padding:24px}.room h1{font-size:28px;line-height:1.2;margin:0 0 30px;letter-spacing:-.6px}.room p{margin:0 0 24px}.muted{color:var(--tt-text-muted);font-size:14px}.field{display:grid;gap:8px;margin-bottom:22px}.field label{font-size:14px}.field input,textarea{border:1px solid var(--tt-border);background:var(--tt-field);border-radius:10px;width:100%;padding:12px;min-height:48px}.field input{font-size:17px}#code{font-size:24px;letter-spacing:4px}.row{display:block;width:100%;text-align:left;border-bottom:1px solid var(--tt-hairline);border-radius:0;padding:20px 0}.row strong{display:block;font-weight:600;font-size:17px}.row small{display:block;color:var(--tt-text-muted);font-size:14px;margin-top:5px}.message{margin:0 0 30px}.message.user{padding:14px 16px;background:var(--tt-message-surface);border-radius:12px}.message strong{font-size:14px;color:var(--tt-text-muted);font-weight:500;display:block;margin-bottom:8px}.message p{margin:0}.request{border-top:1px solid var(--tt-border);padding-top:24px}.request button{display:block;width:100%;margin:10px 0;text-align:left;background:var(--tt-surface-elevated)}.request .primary{background:var(--tt-accent-surface)}.composer{padding:12px 20px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--tt-hairline);display:flex;align-items:flex-end;gap:10px}.composer textarea{resize:none;height:52px;padding:12px;font-size:17px}.composer button{flex-shrink:0}.notice{padding:14px 20px;background:var(--tt-surface-elevated);font-size:14px}.tools{position:fixed;bottom:0;left:0;width:100%;height:68px;display:flex;gap:8px;justify-content:center;align-items:center;border-top:1px solid var(--tt-border);background:var(--tt-surface-overlay)}.tools select{font-size:14px;min-height:44px;max-width:210px;padding:8px;background:var(--tt-field);border:1px solid var(--tt-border);border-radius:8px}.tools button{font-size:14px}.state{font-size:12px;color:var(--tt-text-muted);padding-top:24px}.arrive{animation:arrive .18s ease-out}@keyframes arrive{from{opacity:.5;transform:translateX(6px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.arrive{animation:none}}@media(max-width:380px){.room{padding:20px}.composer{padding-inline:16px}.top strong{font-size:17px}}
</style></head><body><main class="app" id="app"></main><aside class="tools" aria-label="Prototype controls"><select id="scenario" aria-label="Preview native app state"><option value="pair">Pair iPhone</option><option value="list">Thread list</option><option value="thread">Thread</option><option value="question">Question</option><option value="permission">Permission</option><option value="uncertain">Unconfirmed send</option><option value="offline">Reconnect</option></select><button id="theme">Light</button></aside><script>
const state={screen:new URLSearchParams(location.search).get('state')||'pair',draft:'',feedback:''};const app=document.querySelector('#app');const scenario=document.querySelector('#scenario');function go(screen){state.screen=screen;state.feedback='';history.replaceState(null,'','?state='+screen);scenario.value=screen;render()}function render(){const pair=state.screen==='pair',list=state.screen==='list';app.innerHTML=`<header class="top">${!pair&&!list?'<button class="quiet" id="back" aria-label="Back to threads">&lsaquo;</button>':''}<strong>${pair?'Sotto':list?'Forge':'Keep the host running'}</strong>${list?'<button class="quiet" id="host">Host</button>':''}</header>${state.screen==='offline'?'<div class="notice">Connection lost. Your draft is here; work continues on Forge. <button class="quiet" id="retry">Reconnect</button></div>':''}<div class="room arrive">${pair?`<h1>Pair with Forge</h1><p class="muted">Read the pairing code on Forge and enter it here.</p><form id="pair"><div class="field"><label for="address">Host address</label><input id="address" type="url" placeholder="https://forge.your-tailnet.ts.net" required></div><div class="field"><label for="code">Pairing code</label><input id="code" autocapitalize="characters" autocomplete="off" required placeholder="ABC123"></div><button class="primary" type="submit">Pair this iPhone</button></form><p class="state">Pairing identifies this iPhone. It does not answer permission requests.</p>`:list?`<h1>Threads</h1><button class="row" id="open"><strong>Keep the host running</strong><small>Sotto - Needs your answer</small></button><button class="row" id="second"><strong>Check the release notes</strong><small>Sotto - Ready</small></button>`:`<article class="message user"><p>Keep the Forge host running when I close the desktop app.</p></article><article class="message"><strong>Claude Code</strong><p>The host now owns the running work. The desktop and iPhone can reconnect to the same threads.</p></article>${state.screen==='question'?'<section class="request"><p>Which thread should I verify first?</p><button id="answer" class="primary">The Forge host thread</button><button id="other">The release notes thread</button></section>':state.screen==='permission'?'<section class="request"><p>Allow this command?</p><p class="muted">npm run test:host</p><button id="allow" class="primary">Allow once</button><button id="deny">Deny</button></section>':state.screen==='uncertain'?'<div class="notice">Send unconfirmed. Check the thread before sending again. <button class="quiet" id="check">Check delivery</button></div>':''}<div id="feedback" role="status">${state.feedback}</div>`}</div>${!pair&&!list?'<form class="composer" id="send"><textarea aria-label="Reply" placeholder="Reply to this thread" rows="1"></textarea><button class="primary" type="submit" '+(['offline','uncertain'].includes(state.screen)?'disabled':'')+'>Send</button></form>':''}`;document.querySelector('#pair')?.addEventListener('submit',e=>{e.preventDefault();go('list')});document.querySelector('#open')?.addEventListener('click',()=>go('question'));document.querySelector('#second')?.addEventListener('click',()=>go('thread'));document.querySelector('#back')?.addEventListener('click',()=>go('list'));document.querySelector('#host')?.addEventListener('click',()=>go('pair'));for(const id of ['answer','other','allow','deny'])document.querySelector('#'+id)?.addEventListener('click',()=>{state.screen='thread';state.feedback='Answer sent.';render()});document.querySelector('#retry')?.addEventListener('click',()=>go('thread'));document.querySelector('#check')?.addEventListener('click',()=>go('thread'));const text=document.querySelector('textarea');if(text){text.value=state.draft;text.addEventListener('input',()=>state.draft=text.value)}document.querySelector('#send')?.addEventListener('submit',e=>{e.preventDefault();if(!state.draft.trim())return;state.draft='';state.feedback='Reply sent.';render()})}scenario.onchange=()=>go(scenario.value);document.querySelector('#theme').onclick=e=>{const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';e.target.textContent=light?'Dark':'Light'};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName))go('list')});scenario.value=state.screen;render();
</script></body></html>
