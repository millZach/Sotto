<!doctype html>
<!--
  PROTOTYPE - throwaway. Not shipped, not tested, not wired to anything. A guided walkthrough: press Next (or the right
  arrow, or tap the window) and it plays each variant's whole journey, with nothing to type. Auto-play is on and steps
  about every 4 to 6 seconds; any press pauses it.

  Question (#1178, "Move threads to another machine from Watcher, with a handoff for each"): once Zach picks a machine,
  how are threads chosen, where does each move's progress show, and does a thread's own pane offer the move too?

    A  Choose from a list    Move threads, then forge, opens a checklist: movable threads ticked, the one that would
                             start with less permission unticked (ticking it is the yes), the rest greyed with why.
                             Progress is on each thread's row: the panel, All threads, the Threads sidebar, its pane.
                             A thread's More menu also has "Continue on another machine…".
    B  Confirm once, read    Move threads, then forge, asks once in a sheet, with nothing to tick. Progress is only in
       Watcher's reply       Watcher's reply, one receipt card per thread; the narrower one waits on its card.
    C  Ask Watcher first     Move threads, then forge, writes the request into Watcher's composer. Watcher answers with
                             a plan card to confirm. Progress is on the rows; waits show in the needs-you line.

  Fixed (issue #1178 "Decided, October 21"; ADR-0105 decision 7; ADR-0089), and decided by Zach on October 29:
    - A move is "continue on another machine": a new thread with its own Sotto thread ID. The original is settled once
      the new thread is confirmed running and its first turn has ended; its worktree is kept.
    - A moved thread starts working right away with its handover; Zach writes no first message (October 29).
    - Move threads is hidden while no other machine is connected (October 29).
    - Uncommitted work refuses the move. Not moved, each with why: a turn running, a question or permission card,
      background work, an unresolved send; a delegating thread with children working; any delegated thread; Watcher.
    - A move that would start narrower than the thread runs now says so and waits for a press.
    - A watched thread's new thread is watched. Babysitting starts on the target.
    - Lost touch: "This thread is waiting for forge to answer about its move. Nothing was lost." with Keep it here.
    - Machines: This computer, forge (Linux), studio (a Mac, not connected: listed, disabled, with why).

  Sample: seven threads on This computer. Movable: Tray icon at night (watched), Owl release notes (pull request #1771,
  babysat), Linux tray menu spacing (Full access here; your new-thread default allows Allow edits). Not movable: Footer
  links (3 files not committed), Streaming WAV stall (turn running, started by Watcher, so Stop all shows), Make Stop
  reach waiting checks (its delegated thread is working), Unit suite after the fix (a delegated thread).

  Controls: Back, Next, the step counter and Auto-play; small jump links (Start, A, B, C, End), Light and Reduced
  motion at the top. The window is drawn at 1280x800 and scaled to fit (on a phone, to the screen's width). Reduced
  motion shows each step at once with no pointer. URL: theme, motion, and step (for example ?step=b3).
  Palette, markup and words as in the first version of this file: WatcherView.tsx, WatcherStopAll.tsx,
  WatcherReceipts.tsx, WatcherOverview.tsx, ContinueThread.tsx and watcher.css on main, October 29, 2026.

  Picked: B, "Confirm once, read Watcher's reply" (Zach, 2026-10-29): Move threads next to Stop all opens one sheet,
  "Move 3 threads to forge?", listing what moves now, what asks first and what stays and why; progress is reported on
  one receipt card per thread in Watcher's reply, where a thread that would start narrower waits for its press. Also
  picked: "Continue on another machine…" in a thread's More menu (yes). Decided the same day: a moved thread starts
  working right away from its handover, and Move threads is hidden while no other machine is connected.
-->

.mmenu [role='menuitem'] b { display: block; font-size: 13.5px; font-weight: 500; }
.mmenu [role='menuitem'] small { display: block; color: var(--tt-text-2); font-size: 12.5px; line-height: 1.45; }

/* A: the move panel under Move threads: the checklist, then each thread's progress. */
.mpanel { position: absolute; top: calc(100% + 4px); right: 0; z-index: 30; display: flex; flex-direction: column; width: min(460px, calc(100cqw - 24px)); max-height: calc(100cqh - 56px);
  border: 1px solid var(--tt-border-faint); border-radius: 12px; background: var(--tt-surface-elevated); box-shadow: var(--tt-shadow-overlay); }

.mpanel__head h2[tabindex]:focus { outline: none; }
.xbtn { display: grid; flex: none; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: var(--tt-radius-sm); background: transparent; color: var(--tt-text-2); cursor: pointer; }
.xbtn:hover { background: var(--tt-hover); color: var(--tt-text); }
.mpanel__body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 16px 6px; scrollbar-width: thin; }

.mlist { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.mrow { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; column-gap: 9px; row-gap: 2px; padding: 7px 8px; margin: 0 -8px; border-radius: 8px; font-size: 13.5px; }
.mrow:has(> input:hover) { background: var(--tt-hover); }

.mrow__name { display: flex; align-items: center; gap: 7px; min-width: 0; font-weight: 500; cursor: pointer; }

.mrow > .ring { justify-self: center; }
.mrow > svg.done { justify-self: center; color: var(--watcher-ready-ink); }
.mpanel__note { flex: none; margin: 0; padding: 8px 16px 0; border-top: 1px solid var(--tt-hairline); color: var(--tt-text-2); font-size: 12.5px; line-height: 1.5; }
.mpanel__actions { display: flex; flex: none; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; padding: 10px 16px 14px; }
.mpanel__fold { display: inline-flex; align-items: center; gap: 4px; margin: 10px 0 2px; padding: 0; border: 0; border-radius: 3px; background: transparent; color: var(--tt-text-2); font-size: 12.5px; font-weight: 600; cursor: pointer; }

/* B: the sheet over the room. */
.scrim { position: absolute; inset: 0; z-index: 40; background: var(--tt-scrim); }
.sheet { position: absolute; top: 50%; left: 50%; z-index: 41; display: flex; flex-direction: column; width: min(540px, calc(100cqw - 32px)); max-height: calc(100cqh - 40px); translate: -50% -50%;
  border: 1px solid var(--tt-border-faint); border-radius: var(--tt-radius-lg); background: var(--tt-surface-elevated); box-shadow: var(--tt-shadow-overlay); }

.srow { display: grid; grid-template-columns: 16px minmax(0, 1fr); column-gap: 9px; row-gap: 1px; padding: 6px 0; font-size: 13.5px; }

.srow__name { min-width: 0; overflow: hidden; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.srow__line { grid-column: 2; margin: 0; color: var(--tt-text-2); font-size: 12.5px; line-height: 1.45; }

.srow__meta { grid-column: 2; display: flex; flex-wrap: wrap; margin: 0; color: var(--tt-text-muted); font-size: 12.5px; }

/* The needs-you line and the machines line (watcher.css). */
.watcher-glance, .watcher-machines { position: relative; z-index: 6; flex: none; margin: 0 max(24px, calc((100% - 760px) / 2)); padding: 3px 0 10px; box-shadow: inset 0 -1px 0 var(--tt-hairline); color: var(--tt-text-muted); font-size: 13px; line-height: 1.5; }

.watcher-glance__lead { margin: 0; color: var(--watcher-needs-ink); font-weight: 600; white-space: nowrap; }

  text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--tt-text) 30%, transparent); text-underline-offset: 3px; }

/* Receipt cards (WatcherReceipts.tsx), and the move's own cards in B. */
.receipts { display: grid; gap: 8px; margin: -16px 0 28px; padding: 0; list-style: none; }
.receipt-card { display: grid; gap: 4px; min-width: 0; padding: 11px 14px 12px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-md); background: var(--tt-surface); }

.steps { display: flex; gap: 3px; margin: 5px 0 1px; padding-left: 23px; list-style: none; }
.steps li { width: 22px; height: 3px; border-radius: 2px; background: var(--tt-hairline); }
.steps li[data-done] { background: var(--tt-activity); }
.mrow .steps { grid-column: 2 / -1; padding-left: 0; margin: 3px 0 1px; }

/* C: Watcher's plan card. */
.plan { display: grid; gap: 2px; margin: -16px 0 28px; padding: 12px 14px 12px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-md); background: var(--tt-surface); }

.plan__fold { display: inline-flex; align-items: center; gap: 4px; justify-self: start; margin: 8px 0 0; padding: 0; border: 0; border-radius: 3px; background: transparent; color: var(--tt-text-2); font-size: 12.5px; font-weight: 600; cursor: pointer; }

.prompt { display: grid; gap: 8px; padding: 12px 14px 10px 16px; border: 1px solid var(--tt-hairline); border-radius: 16px; background: color-mix(in oklab, var(--tt-surface-elevated) 88%, transparent); backdrop-filter: blur(12px); }
.prompt:focus-within { border-color: var(--tt-accent-border); }
.prompt textarea { width: 100%; min-height: 44px; max-height: 120px; padding: 0; border: 0; outline: 0; background: transparent; color: var(--tt-text); font-size: 15px; line-height: 1.5; resize: none; }
.prompt textarea::placeholder { color: var(--tt-text-muted); }

.frame[data-size='820x560'] .prompt textarea { min-height: 24px; }
.prompt__bar { display: flex; align-items: center; gap: 4px; color: var(--tt-text-2); font-size: 13px; }
.prompt__chip { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 8px; border-radius: 7px; white-space: nowrap; }
.prompt__send { display: grid; place-items: center; width: 28px; height: 28px; margin-left: auto; padding: 0; border: 0; border-radius: 50%; background: var(--tt-accent); color: var(--tt-canvas); cursor: pointer; }
.prompt__send:disabled { background: var(--tt-hover-strong); color: var(--tt-text-muted); cursor: default; }

/* All threads (WatcherOverview.tsx), over the room. */
.list-scrim { position: absolute; inset: 0; z-index: 20; }
.wlist { position: absolute; top: 44px; left: 70px; z-index: 21; display: flex; flex-direction: column; width: min(400px, calc(100cqw - 16px)); max-height: calc(100cqh - 56px); overflow: hidden;
  border: 1px solid var(--tt-border-faint); border-radius: 12px; background: var(--tt-surface-elevated); box-shadow: var(--tt-shadow-overlay); }

.wgroup { margin: 0 0 6px; }

.wrow { position: relative; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; column-gap: 9px; row-gap: 3px; margin: 1px 0; padding: 7px 10px; border-radius: 7px; }
.wrow:hover { background: var(--tt-hover); }
.wrow__open { display: flex; min-width: 0; padding: 0; border: 0; background: transparent; color: var(--tt-text); font-size: 13.5px; font-weight: 500; text-align: left; cursor: pointer; }

.wrow__status { flex-shrink: 0; margin-left: auto; white-space: nowrap; }

/* ---------- the Threads page ---------- */
.tpage { display: grid; grid-template-rows: 32px minmax(0, 1fr); height: 100%; }

.nrow { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; column-gap: 8px; width: 100%; min-height: 32px; padding: 5px 8px; border: 0; border-radius: 8px; background: transparent; color: var(--tt-text-2); text-align: left; cursor: pointer; }

.nrow__sub { grid-column: 2 / -1; display: flex; align-items: center; gap: 5px; min-width: 0; color: var(--tt-text-muted); font-size: 12px; line-height: 1.4; }

.tw { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; container: tpane / inline-size; }
.tw__head { position: relative; z-index: 10; display: flex; flex: none; align-items: center; gap: 9px; height: 44px; padding: 0 8px 0 18px; }
.tw__head h2 { min-width: 3em; margin: 0; overflow: hidden; font-size: 15px; font-weight: 500; letter-spacing: -.2px; text-overflow: ellipsis; white-space: nowrap; }
.tw__crumb { display: flex; flex: 0 100 auto; align-items: center; gap: 7px; min-width: 0; color: var(--tt-text-muted); font-size: 12.5px; white-space: nowrap; }

.tw__actions { position: relative; display: flex; align-items: center; gap: 2px; margin-left: auto; }
.tw__branch { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 8px; border-radius: 7px; color: var(--tt-text-2); font: 12.5px var(--tt-font-mono); white-space: nowrap; }
.iconbtn { display: grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--tt-text-2); cursor: pointer; }
.iconbtn:hover, .iconbtn[aria-expanded='true'] { background: var(--tt-hover); color: var(--tt-text); }
.frame[data-size='820x560'] .tw__crumb { display: none; }
.frame[data-size='820x560'] .tw__head { padding-left: 14px; }
.pmenu { position: absolute; top: calc(100% + 4px); right: 0; z-index: 30; display: grid; gap: 1px; width: 290px; padding: 6px; border: 1px solid var(--tt-border-faint); border-radius: 12px;

    case 'fenced': return { lead: 'Moving', short: 'Holding sends', row: 'holding sends', tone: 'working', n, line: 'It takes no new sends here while it moves.' }
    case 'branch': return { lead: 'Moving', short: 'Branch sent', row: 'branch sent', tone: 'working', n, line: `<span class="mono">${esc(t.branch)}</span> at <span class="mono">${t.commit}</span> is on forge.` }
    case 'started': return { lead: 'Moving', short: 'Started on forge', row: 'started there', tone: 'working', n,
      line: ['The new thread on forge is reading the handover.', t.pr ? `Babysitting #${t.pr} goes on there.` : '', t.watched ? 'Watcher watches it there.' : ''].filter(Boolean).join(' ') }
    case 'ended': return { lead: 'Moving', short: 'First turn ended', row: 'first turn ended', tone: 'working', n, line: 'Its first turn on forge ended. Settling the thread here…' }
    case 'settled': return { lead: 'Moved', short: 'Continued on forge', tone: 'ready', n: 5, line: `Settled here, and its worktree is kept.${t.watched ? ' Watcher watches it on forge now.' : ''}` }
    case 'lost': return { lead: 'Moving', short: 'Waiting for forge', row: 'waiting for forge', tone: 'needs', line: 'This thread is waiting for forge to answer about its move. Nothing was lost.' }
    case 'keeping': return { lead: 'Keeping it here', short: 'Waiting for forge', row: 'waiting for forge', tone: 'needs',
      line: S.forgeDown ? 'forge isn’t answering, so this thread stays held until it does, since forge may already be running the new thread. Nothing was lost.' : 'Asking forge to stop and settle the thread it made for the move…' }
    case 'kept': return { lead: 'Kept here', short: 'Kept here', tone: 'quiet',
      line: m.made ? 'forge stopped and settled the thread it made for the move. You can send here again.' : 'forge holds no thread for the move. You can send here again.' }
    case 'stayed': return { lead: 'Kept here', short: 'Kept here', tone: 'quiet', line: 'Nothing was sent to forge. You can send here as before.' }
  }
}
const stepsTrack = n => `<ol class="steps" aria-hidden="true">${STEPS.map((_, i) => `<li${i < n ? ' data-done' : ''}></li>`).join('')}</ol>`

/* ---------- what a thread is doing, as its rows say it ---------- */
function rowState(id) {
  if (isNew(id)) {
    const m = mv(baseOf(id))
    if (m.step === 'started' || (['lost', 'keeping'].includes(m.step) && m.from === 'started')) return { word: 'Working', tone: 'working', sub: 'Reading the handover' }
    return { word: 'Idle', tone: 'quiet' }
  }
  const t = T[id], m = mv(id)
  if (m && m.step === 'settled') return { word: rows() ? 'Continued on forge' : 'Settled', tone: 'quiet', settled: true }
  if (m && rows() && !['kept', 'stayed'].includes(m.step)) { const w = stepWords(id); return { word: w.short, tone: w.tone, sub: m.step === 'asks' ? 'Move to forge waits for you' : `To forge · ${w.row}`, moving: true } }
  if (t.working) return { word: 'Working', tone: 'working' }
  return { word: t.pr ? 'Pull request open' : 'Idle', tone: 'quiet' }
}

  { v: 'a', press: '[data-act="page-threads"]', state: S => { S.page = 'threads'; S.selected = 'tray'; S.moves = moves({ tray: 'settled', notes: 'settled', menu: 'ended' }) }, ring: ['.nav__scroll ul:first-of-type', '.note'],
    text: 'Each thread’s row says how its move is going. Once the new thread’s first turn ends, the one here is settled and reads “Continued on forge”, with a link. Its worktree is kept.' },
  { v: 'a', press: '[data-act="select"][data-id="menu"]', state: S => { S.page = 'threads'; S.selected = 'menu'; S.forgeDown = true; S.moves = moves({ tray: 'settled', notes: 'settled', menu: { step: 'lost', from: 'branch' } }) }, ring: ['.strip'],
    text: 'If forge stops answering mid-move, the thread stays held and says so: nothing was lost. Keep it here asks forge to give it back.' },
  { v: 'a', pre: S => { S.page = 'threads'; S.selected = 'tray' }, press: '[data-act="more"]', state: S => { S.page = 'threads'; S.selected = 'tray'; S.layer = 'pmenu' }, ring: ['[data-key="pm-machine"]'],
    text: 'Only in A: a thread’s own More menu has Continue on another machine…, next to Continue on another provider….' },
  { v: 'a', press: '[data-key="pm-machine"]', state: S => { S.page = 'threads'; S.selected = 'tray'; S.cont = 'tray' }, ring: ['.strip'],
    text: 'It puts a strip over the composer. Move to forge starts the new thread there at once, working from its handover. There is nothing to write first.' },
  // B: Confirm once, read Watcher's reply.
  { v: 'b', press: '[data-act="move-btn"]', state: S => { S.layer = 'mmenu' }, ring: ['[data-key="mm-forge"]'],
    text: 'B starts the same way: Move threads, then forge.' },
  { v: 'b', press: '[data-act="mm-forge"]', state: S => { S.layer = 'sheet' }, ring: ['.sheet'],
    text: 'B asks once, in a sheet: what moves now, what asks you first, and what stays and why. There is nothing to tick.' },
  { v: 'b', press: '[data-act="b-move"]', state: S => { S.conv = B_CONV(); S.moves = moves({ tray: 'branch', notes: 'branch', menu: 'asks' }) }, ring: ['[data-move="tray"]', '[data-move="notes"]'], show: '[data-move="tray"]',
    text: 'Watcher reports the moves in its reply, one card per thread. The threads’ own rows show nothing; it all happens here.' },
  { v: 'b', state: S => { S.conv = B_CONV(); S.moves = moves({ tray: 'branch', notes: 'branch', menu: 'asks' }) }, ring: ['[data-move="menu"]'],
    text: 'Linux tray menu spacing would start with less permission on forge, so its card waits for your press.' },
  { v: 'b', press: '[data-move="menu"] [data-act="narrow-ok"]', state: S => { S.conv = B_CONV(); S.moves = moves({ tray: 'started', notes: 'started', menu: 'fenced' }) }, ring: ['[data-move="tray"]', '[data-move="notes"]'], show: '[data-move="tray"]',
    text: 'Pressed. The first two have started on forge and are already working from their handover. Watcher watches the one it watched here.' },
  { v: 'b', state: S => { S.conv = B_CONV(); S.forgeDown = true; S.moves = moves({ tray: 'settled', notes: { step: 'lost', from: 'started' }, menu: { step: 'lost', from: 'fenced' } }) }, ring: ['[data-move="tray"]', '[data-move="notes"]'], show: '[data-move="tray"]',
    text: 'Tray icon at night is done: settled here, continued on forge. Then forge stopped answering, so the others are held. Nothing was lost.' },
  { v: 'b', press: '[data-move="notes"] [data-act="keep"]', state: S => { S.conv = B_CONV(); S.forgeDown = true; S.moves = moves({ tray: 'settled', notes: { step: 'keeping', from: 'started' }, menu: { step: 'lost', from: 'fenced' } }) }, ring: ['[data-move="notes"]'],
    text: 'Keep it here asks forge to stop the thread it made. Until forge answers, this one stays held, because forge may already be running the new one.' },
  // C: Ask Watcher first.
  { v: 'c', press: '[data-act="move-btn"]', state: S => { S.layer = 'mmenu' }, ring: ['[data-key="mm-forge"]'],
    text: 'C starts the same way: Move threads, then forge.' },
  { v: 'c', press: '[data-act="mm-forge"]', state: S => { S.draft = 'Move threads to forge' }, ring: ['.wcompose .prompt'],
    text: 'C writes the request into Watcher’s composer instead, ready to send. You could change it first, say to “move the Owl threads to forge”.' },
  { v: 'c', press: '[data-act="w-send"]', state: S => { S.conv = C_CONV(); S.plan = 'open' }, ring: ['.plan'],
    text: 'Watcher answers with a plan: what moves, what asks you first, and what stays, folded. Nothing moves until you confirm.' },
  { v: 'c', press: '[data-act="c-move"]', state: S => { S.conv = C_CONV(); S.plan = 'confirmed'; S.moves = moves({ tray: 'branch', notes: 'branch', menu: 'asks' }) }, ring: ['.watcher-glance', '.watcher-machines'],
    text: 'Confirmed. The reply doesn’t follow the moves; the room’s lines do. forge has 2 starting, and the thread that would start narrower waits in the needs-you line.' },
  { v: 'c', press: '[data-key="c-list"]', state: S => { S.conv = C_CONV(); S.plan = 'confirmed'; S.layer = 'list'; S.moves = moves({ tray: 'started', notes: 'started', menu: 'asks' }) }, ring: ['.wlist'],
    text: 'All threads shows each move on the thread’s own row: moving here, and the new thread already working on forge.' },
  { v: 'c', press: '[data-act="page-threads"]', state: S => { S.page = 'threads'; S.selected = 'menu'; S.moves = moves({ tray: 'settled', notes: 'settled', menu: 'asks' }) }, ring: ['.strip', '.nav__scroll ul:first-of-type'],
    text: 'The Threads page rows say the same; settled ones read “Continued on forge”. Linux tray menu spacing asks for its press in its own pane.' },
  { v: 'c', press: '[data-act="narrow-ok"]', state: S => { S.page = 'threads'; S.selected = 'menu'; S.forgeDown = true; S.moves = moves({ tray: 'settled', notes: 'settled', menu: { step: 'lost', from: 'branch' } }) }, ring: ['.strip'],
    text: 'Pressed, and then forge stopped answering mid-move. The thread stays held and says nothing was lost; Keep it here asks forge to give it back.' },
  { kind: 'end' },
]
const firstOf = k => STORY.findIndex(s => s.v === k)
const lastIdx = STORY.length - 1
const stepNo = i => { const s = STORY[i]; const all = STORY.filter(x => x.v === s.v); return [all.indexOf(s) + 1, all.length] }
const keyOf = i => { const s = STORY[i]; if (s.kind) return s.kind === 'title' ? 'start' : 'end'; return s.v + stepNo(i)[0] }

/* ---------- drawing a step ---------- */
let idx = 0, token = 0, timer = null, auto = true, scale = 1
const reduced = () => S.motion === 'reduce' || matchMedia('(prefers-reduced-motion: reduce)').matches
const wait = ms => new Promise(r => setTimeout(r, ms))
function build(v, fn) { fresh(); S.v = v; fn?.(S) }
function preOf(i) {
  const s = STORY[i]
  if (s.pre) return s.pre
  const p = STORY[i - 1]
  return p && p.v === s.v ? p.state : room
}
function box(el) {
  const f = frame.getBoundingClientRect(), r = el.getBoundingClientRect()
  return { x: (r.left - f.left) / scale, y: (r.top - f.top) / scale, w: r.width / scale, h: r.height / scale }
}
/** Scrolls whatever list holds the element so it is in view. */
function bringIntoView(el) {
  const sc = el.closest('.room__transcript, .tw__transcript, .mpanel__body, .sheet__body, .wlist__scroll, .nav__scroll')
  if (!sc) return
  const r = box(el), s = box(sc)
  const top = r.y - s.y, bottom = top + r.h
  if (top < 8 || bottom > s.h - 8) sc.scrollTop += r.h > s.h - 16 ? top - 8 : top - (s.h - r.h) / 2
  moreBelow(sc)
}
function drawRings(sels) {
  overlay.querySelectorAll('.ringhl').forEach(n => n.remove())
  for (const sel of sels ?? []) for (const el of app.querySelectorAll(sel)) {
    const b = box(el), d = document.createElement('div')
    d.className = 'ringhl'
    Object.assign(d.style, { left: `${b.x - 5}px`, top: `${b.y - 5}px`, width: `${b.w + 10}px`, height: `${b.h + 10}px` })
    overlay.append(d)
  }
}
let capH = 0
/** The tallest step caption at this width, so the window keeps one size through the story (the cards may differ). */
function measureCaps() {
  cap.style.height = 'auto'; capH = 0
  STORY.forEach((s, i) => { if (!s.kind) { captionFor(i, true); capH = Math.max(capH, cap.offsetHeight) } })
  captionFor(idx)
}
function captionFor(i, measuring) {
  const s = STORY[i]
  delete cap.dataset.card
  cap.style.height = measuring || s.kind || !capH ? 'auto' : `${capH}px`
  if (s.kind === 'title') {
    cap.dataset.card = ''
    document.getElementById('count').textContent = 'Prototype · #1178'
    document.getElementById('vtitle').textContent = 'Moving threads to another machine'
    document.getElementById('captext').innerHTML = `<p class="cap__text">Your laptop is busy; forge has room. Three ways it could work: A, B, C. Press Next (or the right arrow, or tap) to watch each one.</p>
      <p class="cap__small">Already decided: a moved thread starts working on forge right away with its handover, and Move threads only shows while another machine is connected.</p>`
    return
  }
  if (s.kind === 'end') {
    cap.dataset.card = ''
    document.getElementById('count').textContent = 'The end'
    document.getElementById('vtitle').textContent = 'Which felt right? Answer on the question card.'
    document.getElementById('captext').innerHTML = `<ul class="cap__recap">
      <li><b>A.</b> Choose from a checklist; each move shows on the thread’s own row. A thread’s More menu can move it too.</li>
      <li><b>B.</b> Confirm once in a sheet; each move shows only in Watcher’s reply.</li>
      <li><b>C.</b> Ask Watcher; confirm its plan; each move shows on the thread’s own row.</li></ul>
      <div class="cap__again"><button type="button" class="btn" data-jump="a">Watch A again</button><button type="button" class="btn" data-jump="b">Watch B again</button><button type="button" class="btn" data-jump="c">Watch C again</button></div>`
    return
  }
  const [n, of] = stepNo(i)
  document.getElementById('count').textContent = `${s.v.toUpperCase()} · ${n} of ${of}`
  document.getElementById('vtitle').textContent = VARIANTS.find(v => v.k === s.v).n
  document.getElementById('captext').innerHTML = `<p class="cap__text">${s.text}</p>`
}
function chrome(i) {
  const s = STORY[i]
  document.getElementById('back').disabled = i === 0
  const next = document.getElementById('next')
  next.textContent = i === 0 ? 'Start' : i === lastIdx ? 'From the start' : 'Next'
  next.setAttribute('aria-label', i === lastIdx ? 'Watch from the start' : 'Next step')
  document.getElementById('navcount').textContent = s.kind ? '' : (() => { const [n, of] = stepNo(i); return `${s.v.toUpperCase()} · ${n} of ${of}` })()
  const here = s.kind === 'title' ? 'start' : s.kind === 'end' ? 'end' : s.v
  document.querySelectorAll('#jumps [data-jump]').forEach(b => { if (b.dataset.jump === here) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current') })
  try { const u = new URL(location.href); u.searchParams.set('step', keyOf(i)); u.searchParams.set('theme', S.theme); u.searchParams.set('motion', S.motion); history.replaceState(null, '', u) } catch { /* sandboxed */ }
}
function show(s) {
  render()
  for (const sel of [s.show, ...(s.ring ?? [])].filter(Boolean)) { const el = app.querySelector(sel); if (el) { bringIntoView(el); break } }
  drawRings(s.ring)
}
async function go(i, animate) {
  const my = ++token
  clearTimeout(timer)
  idx = Math.max(0, Math.min(lastIdx, i))
  const s = STORY[idx]
  const wasCard = cap.hasAttribute('data-card')
  captionFor(idx); chrome(idx)
  if (wasCard !== Boolean(s.kind)) fitWindow()
  if (s.kind) { build('a', room); render(); drawRings([]); pointer.hidden = true; frame.dataset.dim = ''; return schedule() }
  delete frame.dataset.dim
  if (animate && s.press && !reduced()) {
    build(s.v, preOf(idx)); render(); drawRings([])
    const target = app.querySelector(s.press)
    if (target) {
      bringIntoView(target)
      const b = box(target), x = b.x + Math.min(b.w / 2, 40), y = b.y + b.h / 2
      if (pointer.hidden) { pointer.hidden = false; pointer.style.transition = 'none'; pointer.style.translate = `${Math.min(1180, x + 160)}px ${Math.min(740, y + 140)}px`; pointer.getBoundingClientRect(); pointer.style.transition = '' }
      await wait(250); if (my !== token) return
      pointer.style.translate = `${x}px ${y}px`
      await wait(700); if (my !== token) return
      const f = document.createElement('div'); f.className = 'flash'; Object.assign(f.style, { left: `${x}px`, top: `${y}px` }); overlay.append(f)
      await wait(320); f.remove(); if (my !== token) return
    }
  } else pointer.hidden = true
  build(s.v, s.state)
  if (animate && !reduced() && ['mmenu', 'check', 'sheet', 'list', 'pmenu'].includes(S.layer) && s.press) reveal = S.layer
  show(s)
  schedule()
}
function schedule() {
  clearTimeout(timer)
  if (!auto || idx >= lastIdx) return
  const s = STORY[idx]
  const ms = s.kind === 'title' ? 6500 : Math.max(4000, Math.min(6500, (s.text?.length ?? 0) * 34))
  timer = setTimeout(() => go(idx + 1, true), ms)
}
function setAuto(on) {
  auto = on
  const b = document.getElementById('auto')
  b.setAttribute('aria-pressed', String(on)); document.getElementById('autostate').textContent = on ? 'on' : 'off'
  if (on) schedule(); else clearTimeout(timer)
}
function next() { go(idx >= lastIdx ? 0 : idx + 1, true) }
function back() { go(idx - 1, false) }
function jump(k) { go(k === 'start' ? 0 : k === 'end' ? lastIdx : firstOf(k), false) }

/* ---------- fitting the 1280x800 window to the screen ---------- */
function fitWindow() {
  const phone = innerWidth <= 760
  const cs = getComputedStyle(stage)
  const w = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)
  const h = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)
  scale = phone ? w / 1282 : Math.min(1, w / 1282, h / 802)
  fit.style.width = `${1282 * scale}px`; fit.style.height = `${802 * scale}px`
  frame.style.transform = `scale(${scale})`
  const s = STORY[idx]; if (s && !s.kind) drawRings(s.ring)
}
addEventListener('resize', () => { measureCaps(); fitWindow() })

/* ---------- presses: any press pauses auto-play ---------- */
document.addEventListener('pointerdown', e => { if (!e.target.closest('#auto')) setAuto(false) }, true)
document.addEventListener('keydown', e => { if (!['Tab', 'Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) setAuto(false) }, true)
document.getElementById('next').addEventListener('click', next)
document.getElementById('back').addEventListener('click', back)
document.getElementById('auto').addEventListener('click', () => { setAuto(!auto); if (auto) schedule() })
stage.addEventListener('click', next)
document.addEventListener('click', e => { const b = e.target.closest('[data-jump]'); if (b) jump(b.dataset.jump) })
document.getElementById('theme').addEventListener('click', () => { S.theme = S.theme === 'light' ? 'dark' : 'light'; settings() })
document.getElementById('motion').addEventListener('click', () => { S.motion = S.motion === 'reduce' ? 'full' : 'reduce'; settings(); go(idx, false) })
document.addEventListener('keydown', e => {
  if (e.altKey || e.metaKey || e.ctrlKey) return
  const onButton = e.target.closest?.('button')
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && !onButton)) { e.preventDefault(); next() }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); back() }
  else if (e.key === 'Home') { e.preventDefault(); jump('start') }
  else if (e.key === 'End') { e.preventDefault(); jump('end') }
})
function settings() {
  root.dataset.theme = S.theme
  if (S.motion === 'reduce') root.dataset.reducedMotion = 'on'; else delete root.dataset.reducedMotion
  document.getElementById('theme').setAttribute('aria-pressed', String(S.theme === 'light'))
  document.getElementById('motion').setAttribute('aria-pressed', String(S.motion === 'reduce'))
  chrome(idx)
}
const startAt = (() => { const k = params.get('step'); if (!k) return 0; const i = STORY.findIndex((_, j) => keyOf(j) === k); return i < 0 ? 0 : i })()
idx = startAt
settings(); measureCaps(); fitWindow(); go(startAt, false)
document.fonts?.ready.then(() => { measureCaps(); fitWindow(); const s = STORY[idx]; if (!s.kind) drawRings(s.ring) })
</script>
