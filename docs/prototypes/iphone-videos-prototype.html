:root {
  --tt-canvas: #040507; --tt-surface: #090a0e; --tt-raised: #111316; --tt-overlay: #18191d;
  --tt-text: #f9fafd; --tt-muted: #a0a5ae; --tt-placeholder: #94979e; --tt-border: #2a2f39;
  --tt-accent: #47b8a9; --tt-on-accent: #070f0e; --tt-accent-text: #6bc3b6;
  --tt-bubble: #14171e; --tt-danger-text: #ff7673; --tt-warn-text: #f0b45a;
  --tt-sheet: #18191d; --tt-scrim: rgb(0 0 0 / 0.5); --tt-shadow: rgb(0 0 0 / 0.45);
  --tt-page: #0d0e11; --tt-page-raised: #17181c; --tt-page-line: #2c2e35; --tt-page-text: #eceef2; --tt-page-muted: #a7abb4; --tt-bezel: #000000;
}
[data-theme=light] {
  --tt-canvas: #f9f8f5; --tt-surface: #fdfcf9; --tt-raised: #f2f0ec; --tt-overlay: #efece8;
  --tt-text: #221d17; --tt-muted: #68625b; --tt-placeholder: #6f6961; --tt-border: #d5d0c8;
  --tt-accent: #007d74; --tt-on-accent: #fdfcf9; --tt-accent-text: #1e665e;
  --tt-bubble: #ebe7df; --tt-danger-text: #b5312e; --tt-warn-text: #8a5a00;
  --tt-sheet: #fdfcf9; --tt-scrim: rgb(24 18 10 / 0.3); --tt-shadow: rgb(60 48 30 / 0.2);
  --tt-page: #e6e3dd; --tt-page-raised: #f4f2ee; --tt-page-line: #cdc8bf; --tt-page-text: #1f1b16; --tt-page-muted: #57524b; --tt-bezel: #16171a;
}
:root { --tt-hairline: color-mix(in srgb, var(--tt-text) 10%, transparent); --tt-fill-soft: color-mix(in srgb, var(--tt-text) 7%, transparent); }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--tt-page); color: var(--tt-page-text); font: 15px/1.4 Figtree, system-ui, sans-serif; }
button { font: inherit; color: inherit; }
.layout { display: flex; gap: 28px; padding: 20px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
.panel { width: 380px; max-width: 100%; display: grid; gap: 14px; }
.panel h1 { font-size: 19px; margin: 0; }
.panel p { margin: 0; color: var(--tt-page-muted); }
.group { background: var(--tt-page-raised); border: 1px solid var(--tt-page-line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.group h2 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--tt-page-muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--tt-page-line); background: transparent; border-radius: 999px; padding: 5px 11px; cursor: pointer; font-size: 13.5px; }
.seg button[aria-pressed=true] { background: var(--tt-accent); color: var(--tt-on-accent); border-color: var(--tt-accent); font-weight: 600; }
.seg button:focus-visible, .phone button:focus-visible { outline: 2px solid var(--tt-accent); outline-offset: 2px; }
.adr { font-size: 13.5px; line-height: 1.45; }
.adr del { color: var(--tt-danger-text); }
.adr ins { color: var(--tt-accent-text); text-decoration: none; }
.note { font-size: 13px; color: var(--tt-page-muted); }
.back-to { display: none; position: fixed; right: 14px; bottom: 18px; z-index: 9; border: 0; border-radius: 999px; padding: 10px 16px; background: var(--tt-accent); color: var(--tt-on-accent); font-weight: 650; box-shadow: 0 6px 20px var(--tt-shadow); cursor: pointer; }
@media (max-width: 460px) { .back-to.show { display: block; } }

/* Phone */
.phone { width: 390px; height: 800px; border: 12px solid var(--tt-bezel); border-radius: 52px; background: var(--tt-canvas); color: var(--tt-text);
  position: relative; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 50px var(--tt-shadow); flex: none; }
@media (max-width: 460px) {
  .layout { padding: 0; gap: 16px; }
  .phone { width: 100vw; height: 100svh; border: 0; border-radius: 0; box-shadow: none; }
  .panel { padding: 0 14px 90px; }
}
.status { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 26px; font-weight: 600; font-size: 14px; flex: none; }
.top { display: flex; align-items: center; gap: 10px; padding: 4px 14px 10px; border-bottom: 1px solid var(--tt-hairline); flex: none; }
.top .back { color: var(--tt-accent-text); font-size: 22px; }
.top .title { font-weight: 650; }
.top .sub { color: var(--tt-muted); font-size: 12.5px; }
.thread { flex: 1; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.msg-user { align-self: flex-end; max-width: 84%; display: grid; gap: 6px; justify-items: end; }
.bubble { background: var(--tt-bubble); border-radius: 18px; padding: 9px 13px; }
.msg-agent { color: var(--tt-text); max-width: 92%; }
.msg-agent .who { color: var(--tt-muted); font-size: 12.5px; margin-bottom: 2px; }

/* Reply box */
.box { margin: 8px 10px 14px; border: 1px solid var(--tt-border); border-radius: 22px; background: var(--tt-raised); padding: 8px; display: grid; gap: 8px; flex: none; position: relative; }
.box .row { display: flex; align-items: flex-end; gap: 8px; }
.plus, .send { width: 34px; height: 34px; border-radius: 50%; border: 0; display: grid; place-items: center; flex: none; cursor: pointer; font-size: 20px; }
.plus { background: var(--tt-fill-soft); }
.send { background: var(--tt-accent); color: var(--tt-on-accent); }
.send[disabled] { opacity: .4; cursor: default; }
.field { flex: 1; min-height: 34px; padding: 7px 4px; color: var(--tt-text); }
.field.empty { color: var(--tt-placeholder); }
.notice { color: var(--tt-danger-text); font-size: 13.5px; padding: 0 4px; }
.notice.calm { color: var(--tt-muted); }
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px; }

/* Thumbnails */
.thumb { position: relative; border-radius: 12px; overflow: hidden; flex: none; background-size: cover; }
.scene-a { background: linear-gradient(160deg, #3a6f8f 0%, #8bb7c9 45%, #d9c48f 46%, #6d7f3e 100%); }
.scene-b { background: linear-gradient(200deg, #20242e 0%, #3b4560 40%, #e07a4f 41%, #2a1d17 100%); }
.scene-c { background: linear-gradient(135deg, #e9e6df 0 55%, #c9c3b8 55% 60%, #2f3542 60%); }
.scene-d { background: radial-gradient(circle at 40% 40%, #f4d36b, #c46b2d 50%, #3b2416 100%); }
.scene-e { background: linear-gradient(180deg, #7aa1c4, #cfe0ea 50%, #5d7a4a 51%, #2e4026); }
.scene-f { background: linear-gradient(90deg, #1f1f22 0 30%, #39424f 30% 70%, #1f1f22 70%); }
.badge { position: absolute; left: 5px; bottom: 5px; background: rgb(0 0 0 / .62); color: #fff; font-size: 11.5px; font-weight: 650; border-radius: 6px; padding: 1px 5px; display: flex; gap: 3px; align-items: center; }
.x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgb(0 0 0 / .62); color: #fff; font-size: 13px; cursor: pointer; display: grid; place-items: center; }
.ring { position: absolute; inset: 0; display: grid; place-items: center; background: rgb(0 0 0 / .38); color: #fff; font-weight: 700; font-size: 13px; }
.ring svg { position: absolute; }
.play { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 22px; text-shadow: 0 1px 4px rgb(0 0 0 / .6); }

/* Variant B pill */
.pill { display: flex; align-items: center; gap: 9px; border: 1px solid var(--tt-border); background: var(--tt-surface); border-radius: 12px; padding: 5px 6px 5px 5px; max-width: 100%; }
.pill .mini { width: 38px; height: 38px; border-radius: 8px; position: relative; overflow: hidden; flex: none; }
.pill .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill .meta { color: var(--tt-muted); font-size: 12.5px; }
.pill .meta.warn { color: var(--tt-warn-text); }
.pill .meta.bad { color: var(--tt-danger-text); }
.pill .rm { margin-left: auto; border: 0; background: var(--tt-fill-soft); width: 26px; height: 26px; border-radius: 50%; cursor: pointer; flex: none; }

/* Variant C row */
.vrow { border: 1px solid var(--tt-border); background: var(--tt-surface); border-radius: 14px; overflow: hidden; }
.vrow .in { display: flex; gap: 10px; padding: 7px; align-items: center; }
.vrow .poster { width: 96px; height: 54px; border-radius: 9px; position: relative; overflow: hidden; flex: none; }
.vrow .txt { min-width: 0; flex: 1; display: grid; gap: 2px; }
.vrow .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vrow .meta { color: var(--tt-muted); font-size: 12.5px; }
.vrow .meta.warn { color: var(--tt-warn-text); }
.vrow .meta.bad { color: var(--tt-danger-text); }
.vrow .rm { border: 0; background: var(--tt-fill-soft); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; flex: none; }
.bar { height: 4px; background: var(--tt-fill-soft); }
.bar i { display: block; height: 100%; background: var(--tt-accent); transition: width .3s; }
.bar.paused i { background: var(--tt-warn-text); }

/* Menu and picker */
.menu { position: absolute; left: 8px; bottom: 54px; background: var(--tt-sheet); border-radius: 14px; box-shadow: 0 10px 30px var(--tt-shadow); min-width: 230px; overflow: hidden; z-index: 3; }
.menu button { display: flex; gap: 10px; width: 100%; border: 0; background: transparent; padding: 11px 14px; text-align: left; cursor: pointer; border-bottom: 1px solid var(--tt-hairline); }
.menu button:last-child { border-bottom: 0; }
.menu .reason { display: block; color: var(--tt-muted); font-size: 12px; }
.sheet { position: absolute; inset: 60px 0 0; background: var(--tt-sheet); border-radius: 14px 14px 0 0; z-index: 4; display: flex; flex-direction: column; box-shadow: 0 -8px 30px var(--tt-shadow); }
.sheet .head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; font-weight: 650; }
.sheet .head button { border: 0; background: transparent; color: var(--tt-accent-text); cursor: pointer; font-size: 15px; }
.sheet .tabs { display: flex; gap: 6px; padding: 0 14px 10px; }
.sheet .tabs span { padding: 4px 10px; border-radius: 8px; background: var(--tt-fill-soft); font-size: 13px; }
.sheet .tabs span.on { background: var(--tt-text); color: var(--tt-canvas); }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; overflow: auto; }
.grid button { aspect-ratio: 1; border: 0; padding: 0; position: relative; cursor: pointer; border-radius: 0; }
.grid button .dur { position: absolute; right: 4px; bottom: 3px; color: #fff; font-size: 11.5px; font-weight: 650; text-shadow: 0 1px 3px rgb(0 0 0 / .7); }
.sysnote { padding: 10px 14px; color: var(--tt-muted); font-size: 12.5px; }
.toast { position: absolute; left: 12px; right: 12px; top: 96px; background: var(--tt-sheet); border-radius: 12px; padding: 10px 12px; box-shadow: 0 8px 24px var(--tt-shadow); font-size: 13.5px; z-index: 5; }
.player { position: absolute; inset: 0; background: #000; z-index: 6; display: grid; grid-template-rows: auto 1fr auto; color: #fff; }
.player .ph { padding: 54px 16px 10px; display: flex; justify-content: space-between; }
.player .ph button { border: 0; background: transparent; color: #fff; cursor: pointer; font-size: 15px; }
.player .frame { margin: auto 0; aspect-ratio: 9/16; max-height: 100%; width: auto; justify-self: center; height: 82%; border-radius: 6px; position: relative; }
.player .ctl { padding: 14px 18px 34px; display: grid; gap: 6px; font-size: 12.5px; color: #ddd; }
.player .ctl .line { height: 4px; border-radius: 2px; background: rgb(255 255 255 / .25); }
.player .ctl .line i { display: block; width: 18%; height: 100%; border-radius: 2px; background: #fff; }
</style>
</head>
<body>
<div class="layout">
  <div class="phone" id="phone" aria-label="iPhone prototype"></div>
  <div class="panel" id="panel"></div>
</div>
<button class="back-to" id="backTo" type="button">Back to the choices ↓</button>
<script>
const params = new URLSearchParams(location.search)
const S = {
  variant: params.get('variant') ?? 'A',
  scene: params.get('scene') ?? 'empty',
  picker: params.get('picker') ?? 'together',
  limit: Number(params.get('limit') ?? 500),
  total: params.get('total') ?? 'own',
  drop: params.get('drop') ?? 'resume',
  sentTap: params.get('tap') ?? 'none',
  theme: params.get('theme') ?? 'dark',
  progress: 0, pausedAt: 0, menu: false, toast: '', player: false,
}
const VARIANTS = { A: 'Tile in the photo strip', B: 'Pill with the files', C: 'A row of its own' }
const LIMITS = { 200: '200 MB', 500: '500 MB', 1024: '1 GB', 2048: '2 GB' }
const VIDEO = { name: 'IMG_0412.MOV', len: '0:48', mb: 84.2, scene: 'scene-b' }
const BIG = { name: 'IMG_0377.MOV', len: '9:40', mb: 2150, scene: 'scene-e' }
const SECOND = { name: 'IMG_0398.MOV', len: '3:12', mb: 455, scene: 'scene-d' }
const computer = 'forge'
const mb = n => n >= 1000 ? `${(n / 1024).toFixed(1)} GB` : `${n < 10 ? n.toFixed(1) : Math.round(n)} MB`
const limitWords = () => LIMITS[S.limit]

function words() {
  const lim = limitWords()
  return {
    large: `Each video must be ${lim} or smaller. Nothing was attached. Trim it in Photos, or choose a shorter one.`,
    total: S.total === 'own' ? `Videos in one reply must total ${lim} or less. Nothing was attached. Send this reply first, or remove a video.`
      : S.total === 'one' ? `Attachments must total ${lim} or less. Nothing was attached. Send this reply first, or remove one.`
      : 'A reply can carry one video. Send this reply first, or remove the video to choose another.',
    space: 'This iPhone doesn’t have room to keep a copy of this video while it uploads. Nothing was attached. Free up some space, then attach it again.',
    dropped: S.drop === 'resume' ? `Lost the connection to ${computer} at ${S.pausedAt}%. The upload carries on from there when it’s back.`
      : S.drop === 'reconnect' ? `Lost the connection to ${computer}. The upload starts again from the beginning when it’s back.`
      : `The video didn’t reach ${computer}. It uploads again from the beginning when you send.`,
    background: S.drop === 'resume' ? 'Paused while Sotto is closed. It carries on from here when you come back.' : 'Stopped while Sotto is closed. It starts again when you come back.',
  }
}

function setParam() {
  const p = new URLSearchParams()
  for (const k of ['variant', 'scene', 'picker', 'limit', 'total', 'drop']) p.set(k, S[k])
  p.set('tap', S.sentTap)
  if (S.theme !== 'dark') p.set('theme', S.theme)
  history.replaceState(null, '', `?${p}${location.hash}`)
}

let timer = null
let lastSection = ''
const narrow = () => matchMedia('(max-width: 460px)').matches
function go(scene) {
  S.scene = scene; S.menu = false; S.toast = ''; S.player = false
  clearInterval(timer)
  if (scene === 'uploading') {
    if (S.progress >= 100 || S.progress === 0) S.progress = S.drop === 'resume' && S.pausedAt ? S.pausedAt : 0
    timer = setInterval(() => { S.progress = Math.min(100, S.progress + 3); if (S.progress >= 100) { clearInterval(timer); S.scene = 'ready' } render() }, 260)
  }
  if (scene === 'getting') { S.progress = 0; let g = 0; timer = setInterval(() => { g += 12; S.getting = g; if (g >= 100) { clearInterval(timer); S.progress = 0; go('uploading'); return } render() }, 200); S.getting = 0 }
  if (scene === 'dropped' || scene === 'background') S.pausedAt = Math.max(S.progress, 37)
  if (scene === 'ready' || scene === 'sent') S.progress = 100
  if (scene === 'empty') { S.progress = 0; S.pausedAt = 0 }
  render()
}

function ring(pct, size) {
  const r = size / 2 - 3, c = 2 * Math.PI * r
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="rgb(255 255 255 / .3)" stroke-width="3"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="${c * pct / 100} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})" stroke-linecap="round"/></svg>`
}

// What the video's state line says, by scene.
function stateOf() {
  const v = VIDEO, done = (v.mb * S.progress / 100)
  switch (S.scene) {
    case 'getting': return { kind: 'warn', short: `${S.getting ?? 0}%`, line: `Getting it from iCloud · ${S.getting ?? 0}%`, pct: S.getting ?? 0, busy: true }
    case 'uploading': return { kind: '', short: `${S.progress}%`, line: `${mb(done)} of ${mb(v.mb)} · about ${Math.max(1, Math.round((100 - S.progress) * 0.4))} s left`, pct: S.progress, busy: true }
    case 'background':
    case 'dropped': return S.drop === 'send'
      ? { kind: 'bad', short: '!', line: `Not uploaded · ${v.len} · ${mb(v.mb)}`, pct: 0, busy: false, stuck: true }
      : { kind: 'warn', short: S.drop === 'resume' ? `${S.pausedAt}%` : '0%', line: S.drop === 'resume' ? `Paused at ${S.pausedAt}% · waiting for ${computer}` : `Waiting for ${computer} · starts again`, pct: S.drop === 'resume' ? S.pausedAt : 0, busy: true, paused: true }
    default: return { kind: '', short: '', line: `${v.len} · ${mb(v.mb)}`, pct: 100, busy: false }
  }
}

function videoInBox() {
  const v = VIDEO, st = stateOf()
  if (S.variant === 'A') {
    return `<div class="strip"><div class="thumb ${v.scene}" style="width:84px;height:84px" role="img" aria-label="Video ${v.name}, ${v.len}, ${mb(v.mb)}">
      ${st.busy || st.stuck ? `<div class="ring">${st.stuck ? '' : ring(st.pct, 46)}<span>${st.stuck ? '⚠︎' : st.short}</span></div>` : '<div class="play">▶︎</div>'}
      <span class="badge">▶︎ ${v.len}</span>
      <button class="x" aria-label="Remove ${v.name}" data-act="remove">✕</button></div>
      <div class="thumb scene-a" style="width:84px;height:84px" role="img" aria-label="Photo 1"><button class="x" aria-label="Remove Photo 1">✕</button></div></div>
      <div class="notice calm" style="font-size:12.5px">${st.paused || st.stuck ? `<span style="color:var(--tt-${st.stuck ? 'danger' : 'warn'}-text)">${st.line}</span>` : `${v.name} · ${st.busy ? st.line : `${v.len} · ${mb(v.mb)}`}`}</div>`
  }
  if (S.variant === 'B') {
    return `<div class="strip"><div class="thumb scene-a" style="width:64px;height:64px" role="img" aria-label="Photo 1"><button class="x" aria-label="Remove Photo 1">✕</button></div></div>
    <div class="pill"><div class="mini ${v.scene}">${st.busy ? `<div class="ring" style="font-size:0">${ring(st.pct, 30)}</div>` : '<div class="play" style="font-size:13px">▶︎</div>'}</div>
      <div style="min-width:0"><div class="name">IMG_04….MOV</div><div class="meta ${st.kind}">${st.busy && !st.paused ? `${st.short} · ${mb(v.mb * st.pct / 100)} of ${mb(v.mb)}` : st.line}</div></div>
      <button class="rm" aria-label="Remove ${v.name}" data-act="remove">✕</button></div>`
  }
  return `<div class="vrow"><div class="in"><div class="poster ${v.scene}"><span class="badge">▶︎ ${v.len}</span></div>
      <div class="txt"><div class="name">${v.name}</div><div class="meta ${st.kind}">${st.line}</div></div>
      <button class="rm" aria-label="Remove ${v.name}" data-act="remove">✕</button></div>
      ${st.busy || st.stuck ? `<div class="bar ${st.paused ? 'paused' : ''}"><i style="width:${st.pct}%"></i></div>` : ''}</div>
    <div class="strip"><div class="thumb scene-a" style="width:56px;height:56px" role="img" aria-label="Photo 1"><button class="x" aria-label="Remove Photo 1">✕</button></div></div>`
}

function sentVideo() {
  const v = VIDEO
  if (S.variant === 'A') return `<button class="thumb ${v.scene}" style="width:150px;height:150px;border:0;cursor:pointer" data-act="tapsent" aria-label="${S.sentTap === 'play' ? 'Play' : 'Video'} ${v.name}, ${v.len}"><div class="play">▶︎</div><span class="badge">▶︎ ${v.len}</span></button>`
  if (S.variant === 'B') return `<button class="pill" style="cursor:pointer" data-act="tapsent" aria-label="${S.sentTap === 'play' ? 'Play' : 'Video'} ${v.name}"><div class="mini ${v.scene}"><div class="play" style="font-size:13px">▶︎</div></div><div style="min-width:0;text-align:left"><div class="name">IMG_04….MOV</div><div class="meta">${v.len} · ${mb(v.mb)}</div></div></button>`
  return `<button class="vrow" style="cursor:pointer;width:250px;padding:0;text-align:left" data-act="tapsent" aria-label="${S.sentTap === 'play' ? 'Play' : 'Video'} ${v.name}"><div class="in"><div class="poster ${v.scene}"><div class="play" style="font-size:16px">▶︎</div></div><div class="txt"><div class="name">${v.name}</div><div class="meta">${v.len} · ${mb(v.mb)}</div></div></div></button>`
}

function picker() {
  const items = [['scene-a'], ['scene-b', VIDEO.len, 'pick'], ['scene-c'], ['scene-d', SECOND.len, 'pick2'], ['scene-f'], ['scene-e', BIG.len, 'big'], ['scene-c'], ['scene-a'], ['scene-d'], ['scene-f', '1:05', 'pick'], ['scene-b'], ['scene-e']]
  const own = S.picker === 'own'
  const shown = own ? items.filter(i => i[1]) : items
  return `<div class="sheet" role="dialog" aria-label="${own ? 'Videos' : 'Photos and videos'}"><div class="head"><button data-act="close">Cancel</button><span>${own ? 'Videos' : 'Photos'}</span><button data-act="close">Add</button></div>
    <div class="tabs">${own ? '<span class="on">Videos</span>' : '<span class="on">All</span><span>Photos</span><span>Videos</span>'}</div>
    <div class="grid">${shown.map(([sc, d, act]) => `<button class="${sc}" data-act="${act ?? 'photo'}" aria-label="${d ? `Video, ${d}` : 'Photo'}">${d ? `<span class="dur">${d}</span>` : ''}</button>`).join('')}</div>
    <div class="sysnote">This is the system’s own picker, drawn here only roughly. Sotto chooses only what it shows${own ? ': videos alone, from its own menu item' : ': photos and videos together'}. Press the 0:48 video, or the 9:40 one to see a video that is too large.</div></div>`
}

function renderPhone() {
  const ph = document.getElementById('phone')
  const inBox = ['getting', 'uploading', 'ready', 'dropped', 'background'].includes(S.scene)
  const notice = { large: words().large, total: words().total, space: words().space, dropped: words().dropped, background: words().background }[S.scene]
  const calm = S.scene === 'background' || (S.scene === 'dropped' && S.drop !== 'send')
  const typed = inBox || S.scene === 'total'
  ph.innerHTML = `<div class="status"><span>9:41</span><span>${S.scene === 'dropped' ? 'No signal' : S.scene === 'background' ? 'Back in Sotto' : '5G ▮▮▮'}</span></div>
    <div class="top"><span class="back">‹</span><div><div class="title">Checkout page bug</div><div class="sub">Claude Code · ${computer}</div></div></div>
    <div class="thread">
      <div class="msg-user"><div class="bubble">The Pay button jumps when the keyboard opens. Can you look?</div></div>
      <div class="msg-agent"><div class="who">Claude Code</div>I can’t reproduce it in the browser. Can you show me what you see on the phone?</div>
      ${S.scene === 'sent' ? `<div class="msg-user">${sentVideo()}<div class="bubble">Here’s what it does on my phone</div></div>
        <div class="msg-agent"><div class="who">Claude Code</div>Got the video. I’ll pull a few frames with ffmpeg and look at where the button moves.</div>` : ''}
    </div>
    <div class="box">
      ${inBox || S.scene === 'total' ? videoInBox() : ''}
      ${notice ? `<div class="notice ${calm ? 'calm' : ''}">${notice}</div>` : ''}
      <div class="row"><button class="plus" data-act="plus" aria-label="Add photos, videos or files" aria-expanded="${S.menu}">＋</button>
        <div class="field ${typed ? '' : 'empty'}">${typed ? 'Here’s what it does on my phone' : 'Reply to Claude Code'}</div>
        <button class="send" data-act="send" aria-label="Send" ${inBox && S.scene !== 'getting' ? '' : 'disabled'}>↑</button></div>
      ${S.menu ? `<div class="menu" role="menu">${S.picker === 'own'
        ? `<button data-act="picker">🖼  Photo library</button><button data-act="picker">🎬  Videos</button>`
        : `<button data-act="picker">🖼  Photos and videos</button>`}<button>📷  Camera</button><button>📄  Files</button></div>` : ''}
    </div>
    ${S.scene === 'picker' ? picker() : ''}
    ${S.toast ? `<div class="toast" role="status">${S.toast}</div>` : ''}
    ${S.player ? `<div class="player" role="dialog" aria-label="Video player"><div class="ph"><button data-act="closeplayer">Done</button><span>${VIDEO.name}</span><span></span></div><div class="frame ${VIDEO.scene}"></div><div class="ctl"><div class="line"><i></i></div><div style="display:flex;justify-content:space-between"><span>0:09</span><span>−0:39</span></div></div></div>` : ''}`
}

function seg(label, key, options, after, id) {
  return `<div class="group"${id ? ` id="${id}"` : ''}><h2>${label}</h2><div class="seg">${Object.entries(options).map(([v, t]) => `<button data-set="${key}" data-val="${v}" aria-pressed="${String(S[key]) === v}">${t}</button>`).join('')}</div>${after ? `<div class="note">${after}</div>` : ''}</div>`
}

function adrDiff() {
  const lim = limitWords()
  const totalLine = S.total === 'own' ? `<ins>A reply’s videos may hold ${lim} between them, apart from the 50 MiB for everything else.</ins>`
    : S.total === 'one' ? `A set holds at most 8 attachments and <del>50 MiB</del> <ins>${lim}</ins> in all.`
    : `<ins>A reply carries at most one video, outside the 50 MiB for everything else.</ins>`
  return `<div class="group adr"><h2>What ADR-0131 would say (decision 2)</h2>
    <div>A file is at most 25 MiB. <ins>A video (video/mp4, video/quicktime, video/webm and the other video/ types) is at most ${lim}, sent as the original file.</ins> ${totalLine}</div>
    <div class="note">Recorded in the ADR only once you pick. Decision 4 also changes: parts go to disk on the computer instead of memory${S.drop === 'resume' ? ', and an upload is kept for a while after the connection drops so the phone can carry on from its last part' : ''}. Decision 5 is unchanged: the video lands in the working folder under .sotto/attachments and is named in the note.</div></div>`
}

function renderPanel() {
  const scenes = { empty: 'Empty', menu: '+ menu', picker: 'Picker', getting: 'From iCloud', uploading: 'Uploading', ready: 'Ready', dropped: 'Connection lost', background: 'Sotto closed', large: 'Too large', total: 'Over the reply total', space: 'iPhone full', sent: 'Sent' }
  document.getElementById('panel').innerHTML = `<h1>Videos from the iPhone</h1>
    <p>Press ＋ on the phone and walk it through, or jump to a moment below. Each row of choices changes the phone and the ADR text at the bottom.</p>
    ${seg('How a video waits in the reply box', 'variant', Object.fromEntries(Object.entries(VARIANTS).map(([k, v]) => [k, `${k} · ${v}`])), '', 'look')}
    ${seg('Moment', 'scene', scenes, '', 'moment')}
    ${seg('Where videos are picked', 'picker', { together: 'With photos', own: 'Their own menu item' })}
    ${seg('Video limit, per file', 'limit', LIMITS, 'Rough iPhone sizes: 1080p at 30 fps is about 60 MB a minute, 4K at 30 fps about 170 MB, 4K at 60 fps about 400 MB.', 'limit')}
    ${seg('How videos count in a reply', 'total', { own: 'Their own total', one: 'One higher total', single: 'One video a reply' }, '', 'total')}
    ${seg('When the connection drops mid-upload', 'drop', { resume: 'Carry on from where it stopped', reconnect: 'Start again on reconnect', send: 'Start again at Send (today’s files)' }, 'Moment “Connection lost” and “Sotto closed” show each answer.', 'dropped')}
    ${seg('Pressing a sent video', 'sentTap', { play: 'Plays it', none: 'Shows only' })}
    ${seg('Theme', 'theme', { dark: 'Dark', light: 'Light' })}
    <div id="adr">${adrDiff()}</div>`
}

function render() { document.documentElement.dataset.theme = S.theme; renderPhone(); renderPanel(); setParam() }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-set]')
  if (!t) return
  if (t.dataset.set) {
    const k = t.dataset.set, v = t.dataset.val
    S[k] = k === 'limit' ? Number(v) : v
    lastSection = t.closest('.group')?.id || lastSection
    if (k === 'scene') go(v); else render()
    if (narrow()) document.getElementById('phone').scrollIntoView({ block: 'start', behavior: 'smooth' })
    return
  }
  switch (t.dataset.act) {
    case 'plus': if (S.scene === 'picker') return; S.menu = !S.menu; if (!['uploading', 'getting'].includes(S.scene)) S.scene = S.menu ? 'menu' : 'empty'; render(); break
    case 'picker': go('picker'); break
    case 'close': go('empty'); break
    case 'pick': go('getting'); break
    case 'pick2': S.limit >= 500 ? go('getting') : go('large'); break
    case 'big': go('large'); break
    case 'photo': S.toast = 'Photos go as they do today. Press a video (the ones with a length).'; render(); break
    case 'remove': go('empty'); break
    case 'send': go('sent'); break
    case 'tapsent': if (S.sentTap === 'play') { S.player = true } else { S.toast = 'Sent videos show their length and size. Open them on the computer, in the thread’s working folder under .sotto/attachments.' } render(); break
    case 'closeplayer': S.player = false; render(); break
  }
})
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.player) { S.player = false; render() } else if (S.scene === 'picker' || S.menu) go('empty') }
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !e.target.closest('input,textarea,[contenteditable]')) {
    const keys = Object.keys(VARIANTS), i = keys.indexOf(S.variant)
    S.variant = keys[(i + (e.key === 'ArrowRight' ? 1 : keys.length - 1)) % keys.length]; render()
  }
})
const HASH_SCENE = { look: 'uploading', limit: 'large', total: 'total', dropped: 'dropped' }
const anchor = location.hash.slice(1)
if (anchor && !params.get('scene') && HASH_SCENE[anchor]) S.scene = HASH_SCENE[anchor]
go(S.scene)
function setParamKeepHash() { if (anchor) history.replaceState(null, '', location.pathname + location.search + '#' + anchor) }
setParamKeepHash()
lastSection = anchor
if (anchor && narrow()) requestAnimationFrame(() => document.getElementById(anchor)?.scrollIntoView({ block: 'start' }))
const backTo = document.getElementById('backTo')
const panelTop = () => document.getElementById('panel').getBoundingClientRect().top
const syncBack = () => backTo.classList.toggle('show', panelTop() > innerHeight * 0.6)
addEventListener('scroll', syncBack, { passive: true }); syncBack()
backTo.addEventListener('click', () => document.getElementById(lastSection || 'look')?.scrollIntoView({ block: 'start', behavior: 'smooth' }))
</script>
</body>
</html>
