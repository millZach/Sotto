<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype: Sotto asks for a summary</title>
<style>
@font-face { font-family: Figtree; src: url(../../apps/ios/Sotto/Resources/Figtree.ttf); font-weight: 400 500; }
@font-face { font-family: Figtree; src: url(../../apps/ios/Sotto/Resources/Figtree-SemiBold.ttf); font-weight: 600 700; }
:root { color-scheme: dark; --canvas:#0b0c0d; --surface:#141617; --raised:#1c1f21; --ink:#ececec; --muted:#a2a7ac; --hair:rgba(255,255,255,.1); --warn:#e8a33d; --warn-text:#f0b65e; --code:#0d0f10; --code-ink:#e4e6e8; --fill:rgba(255,255,255,.08); --accent:#ececec; --on-accent:#111; --wash:rgba(232,163,61,.14); --wash2:rgba(64,160,150,.14); }
[data-theme=light] { color-scheme: light; --canvas:#f4f4f2; --surface:#fff; --raised:#fff; --ink:#1b1c1d; --muted:#5e6367; --hair:rgba(0,0,0,.12); --warn:#b56f0b; --warn-text:#8a5306; --code:#1d2023; --code-ink:#eceef0; --fill:rgba(0,0,0,.06); --accent:#1b1c1d; --on-accent:#fff; --wash:rgba(232,163,61,.16); --wash2:rgba(64,160,150,.12); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 400 15px/1.45 Figtree, system-ui, sans-serif; padding: 16px 14px 230px; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
header { max-width: 760px; margin: 0 auto 16px; }
header h1 { font-size: 19px; font-weight: 600; margin: 0 0 4px; letter-spacing: -.2px; }
header p { margin: 0; color: var(--muted); font-size: 14px; }
.stage { max-width: 760px; margin: 0 auto; display: grid; justify-items: center; }
.label { font-size: 12.5px; color: var(--muted); margin: 0 0 8px; justify-self: start; }

/* iPhone sheet */
.phone { width: 100%; max-width: 390px; border-radius: 26px; overflow: hidden; border: 1px solid var(--hair); background: var(--raised); position: relative; }
.phone.duo { max-width: 680px; }
.sheet { position: relative; padding: 22px 20px 20px; }
.sheet::before { content: ""; position: absolute; inset: 0 0 auto; height: 190px; background: radial-gradient(120% 100% at 85% 0, var(--wash), transparent 65%), radial-gradient(90% 90% at 8% 0, var(--wash2), transparent 65%); pointer-events: none; }
.sheet > * { position: relative; }
.grab { width: 36px; height: 4px; border-radius: 3px; background: var(--hair); margin: -12px auto 12px; }
.from { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); font-size: 14px; }
.light { flex: none; width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 8px var(--warn); }
.headline { font-size: 25px; line-height: 1.2; font-weight: 600; letter-spacing: -.4px; margin: 12px 0 0; }
.cmd { display: flex; gap: 10px; margin-top: 16px; padding: 14px; border-radius: 12px; background: var(--code); color: var(--code-ink); border: 1px solid rgba(232,163,61,.3); box-shadow: 0 8px 16px rgba(232,163,61,.1); font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; white-space: pre-wrap; }
.cmd .prompt { color: #8d9297; }
.runs { margin-top: 14px; font-size: 13.5px; color: var(--muted); }
.runs b { display: block; font-weight: 400; font-size: 13px; color: var(--ink); margin: 2px 0; overflow-wrap: anywhere; }
.raw { margin-top: 16px; font-size: 15.5px; line-height: 1.45; overflow-wrap: anywhere; }
.choices { display: grid; gap: 10px; margin-top: 20px; }
.pill { min-height: 50px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 25px; font: 600 16px Figtree, sans-serif; background: var(--fill); color: var(--ink); }
.pill.primary { background: var(--accent); color: var(--on-accent); }
.action { margin-top: 14px; font-size: 16px; line-height: 1.4; }
.action code { display: block; font-size: 13px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
.phone .dcmd.plain { margin-top: 12px; padding: 12px; font-size: 13px; border-radius: 12px; }
.dtarget { margin: -2px 0 0; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.also { margin-top: 12px; font-size: 14.5px; color: var(--ink); overflow-wrap: anywhere; }
.also code { font-size: 13px; }
.also-row { display: flex; gap: 8px; align-items: flex-start; }
.also-row .light { margin-top: 7px; }

/* the summary, three ways */
.sum { margin-top: 12px; font-size: 16px; line-height: 1.42; }
.sum .who { display: block; font-size: 13px; color: var(--muted); margin-bottom: 2px; }
.sum .after { display: block; font-size: 13px; color: var(--muted); margin-top: 3px; }
.sum.none { color: var(--muted); font-size: 15px; }
.sum.quote { border-left: 2px solid var(--warn); padding-left: 11px; }

/* desktop card */
.window { width: 100%; max-width: 760px; border-radius: 12px; border: 1px solid var(--hair); background: var(--surface); overflow: hidden; }
.strip { height: 32px; display: flex; align-items: center; padding: 0 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--hair); }
.pane { padding: 18px 16px; }
.bubble { max-width: 76%; margin-left: auto; padding: 9px 13px; border-radius: 14px; background: var(--fill); font-size: 14px; }
.card { display: grid; gap: 10px; margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--fill); }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.head strong { font-size: 15px; font-weight: 600; letter-spacing: -.1px; }
.tag { padding: 1px 7px; border-radius: 6px; background: var(--fill); color: var(--muted); font-size: 11.5px; line-height: 18px; font-weight: 500; }
.card .sum { margin: 0; font-size: 14.5px; }
.card .sum .who, .card .sum .after { font-size: 12.5px; }
.card .sum.none { font-size: 14px; }
.dcmd { margin: 0; padding: 8px 10px; max-height: 220px; overflow: auto; border-radius: 8px; border: 1px solid var(--hair); background: var(--code); color: var(--code-ink); font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.dcmd.raw-box { color: var(--muted); }
.cwd { margin: -4px 0 0; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { min-height: 34px; padding: 0 15px; border: 0; border-radius: 9px; font: 500 13.5px Figtree, sans-serif; background: var(--fill); color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.card .also { margin: -2px 0 0; font-size: 13.5px; }

/* control bar */
.bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--hair); display: grid; gap: 8px; z-index: 5; }
.row { max-width: 760px; width: 100%; margin: 0 auto; display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.row > span { flex: none; width: 58px; font-size: 12px; color: var(--muted); }
.row button { flex: none; min-height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--hair); background: transparent; color: var(--ink); font: 500 13px Figtree, sans-serif; white-space: nowrap; }
.row button[aria-pressed=true] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
button:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>Prototype: when the model sends no summary</h1>
  <p id="note"></p>
</header>
<main class="stage" id="stage"></main>
<nav class="bar" aria-label="Prototype controls">
  <div class="row" data-group="label"><span>Style</span></div>
  <div class="row" data-group="req"><span>Request</span></div>
  <div class="row" data-group="surface"><span>Surface</span></div>
  <div class="row" data-group="theme"><span>Theme</span></div>
</nav>
<script>
const groups = {
  label: [['A','A · Sotto asked'],['B','B · Same as the model'],['C','C · Its reading']],
  req: [['ready','Summary came'],['waiting','Still waiting'],['failed','Couldn’t get one'],['devin','Provider can’t'],['own','Model wrote its own']],
  surface: [['iphone','iPhone'],['duo','Duo unfolded'],['desktop','Desktop']],
  theme: [['dark','Dark'],['light','Light']],
};
const params = new URLSearchParams(location.search);
const state = { label: params.get('label')||'A', req: params.get('req')||'ready', surface: params.get('surface')||'iphone', theme: params.get('theme')||'dark' };
const CMD = 'npm test -- --run tests/unit/agents';
const SUMMARY = 'Runs the unit tests in the agents folder.';
const requests = {
  ready: { provider:'Codex', allow:'Allow', cwd:'/home/zach/Projects/Sotto', computer:'forge', kind:'asked' },
  waiting: { provider:'Codex', allow:'Allow', cwd:'/home/zach/Projects/Sotto', computer:'forge', kind:'waiting' },
  failed: { provider:'Codex', allow:'Allow', cwd:'/home/zach/Projects/Sotto', computer:'forge', kind:'failed' },
  devin: { provider:'Devin', allow:'Allow once', kind:'none' },
  own: { provider:'Claude Code', tag:'Bash', allow:'Allow once', kind:'own' },
};
const notes = {
  ready: 'Codex sent no reason, so Sotto asked it in a side call. That call sees only the command, not the thread, so it can say what the command does but not why the thread wants it.',
  waiting: 'A side call takes about 10 to 20 seconds. Allow and Deny work right away, and the summary fills in if it comes in time.',
  failed: 'The side call failed, or its client isn’t connected. The command is still there, and Sotto says what happened.',
  devin: 'Devin and DeepSeek Harness have no side call. DeepSeek usually sends its own summary; Devin may not.',
  own: 'When the model wrote its own, nothing changes and no side call runs.',
};
function who(r) { return {A:`Sotto asked ${r.provider} what this does`, B:`${r.provider} says`, C:`${r.provider}’s reading of this command`}[state.label]; }
function summary(r) {
  if (r.kind === 'asked') return `<p class="sum"><span class="who">${who(r)}</span>${SUMMARY}</p>`;
  if (r.kind === 'own') return `<p class="sum"><span class="who">${r.provider} says</span>Run the unit tests for the agents folder</p>`;
  if (r.kind === 'waiting') return `<p class="sum none" role="status">Asking ${r.provider} for a summary…</p>`;
  if (r.kind === 'failed') return `<p class="sum none">${r.provider} couldn’t give a summary of this command.</p>`;
  return `<p class="sum none">${r.provider} gave no summary of this command.</p>`;
}
const runs = r => r.cwd ? `<div class="runs">It runs in<b class="mono">${r.cwd}</b>on ${r.computer}.</div>` : '';
const phone = (r, duo) => `<div class="phone${duo?' duo':''}"><div class="sheet"><div class="grab"></div>
  <div class="from"><span class="light"></span><span>Permission for ${r.provider} in Compare benchmark runs</span></div>
  <h2 class="headline">${r.provider} wants to run a command</h2>${summary(r)}
  <div class="cmd mono"><span class="prompt">$</span><span>${CMD}</span></div>${runs(r)}
  <div class="choices"><div class="pill primary">${r.allow}</div><div class="pill">Deny</div></div></div></div>`;
const desktop = r => `<div class="window"><div class="strip">Sotto · Compare benchmark runs</div><div class="pane">
  <div class="bubble">Pull the last benchmark runs and show me how the key scenarios moved.</div>
  <section class="card"><div class="head"><strong>Run a command</strong>${r.tag?`<span class="tag">${r.tag}</span>`:''}</div>${summary(r)}
    <pre class="dcmd mono"><code>${CMD}</code></pre>${r.cwd?`<p class="cwd">in <code class="mono">${r.cwd}</code></p>`:''}
    <div class="acts"><button class="btn primary">${r.allow}</button><button class="btn">Deny</button></div></section></div></div>`;
function render() {
  document.documentElement.dataset.theme = state.theme;
  const r = requests[state.req];
  document.getElementById('note').textContent = notes[state.req];
  document.getElementById('stage').innerHTML = `<p class="label">${{iphone:'iPhone sheet',duo:'iPhone Duo, unfolded',desktop:'Desktop, in the thread'}[state.surface]}</p>` + (state.surface==='desktop' ? desktop(r) : phone(r, state.surface==='duo'));
  for (const row of document.querySelectorAll('.row')) for (const b of row.querySelectorAll('button')) b.setAttribute('aria-pressed', b.dataset.value === state[row.dataset.group]);
  history.replaceState(null, '', '?' + new URLSearchParams(state));
}
for (const row of document.querySelectorAll('.row')) for (const [value, words] of groups[row.dataset.group]) {
  const b = document.createElement('button'); b.type='button'; b.dataset.value=value; b.textContent=words;
  b.onclick = () => { state[row.dataset.group]=value; render(); }; row.append(b);
}
render();
</script>
</body>
</html>
