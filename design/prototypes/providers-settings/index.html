<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Providers settings: three layouts (prototype)</title>
<style>
/* Throwaway prototype for Settings > Providers. Three layouts over the same data and controls.
   Everything is in memory; nothing here touches the network. Colour lives only in the token block. */

@font-face { font-family: 'Figtree'; font-style: normal; font-weight: 300 900; font-display: swap; src: url('figtree-latin.woff2') format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'Figtree'; font-style: normal; font-weight: 300 900; font-display: swap; src: url('figtree-latin-ext.woff2') format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Spline Sans Mono'; font-style: normal; font-weight: 300 700; font-display: swap; src: url('spline-sans-mono-latin.woff2') format('woff2'); }

/* ---------- Token block: the only place colour literals appear ---------- */
:root {
  color-scheme: dark;
  /* Sotto theme, dark (src/renderer/src/styles/tokens.css :root) */
  --theme-canvas: oklch(0.115 0.008 265);
  --theme-surface: oklch(0.145 0.008 265);
  --theme-surface-raised: oklch(0.185 0.008 265);
  --theme-surface-overlay: oklch(0.215 0.008 265);
  --theme-text: oklch(0.985 0.005 280);
  --theme-muted-foreground: oklch(0.72 0.014 265);
  --theme-placeholder: oklch(0.675 0.012 270);
  --theme-border: oklch(0.305 0.02 265);
  --theme-input: oklch(0.375 0.024 265);
  --theme-focus: oklch(0.714403 0.104089 183.092);
  --theme-accent: oklch(0.714403 0.104089 183.092);
  --theme-accent-foreground: oklch(0.16 0.012 190);
  --theme-muted: oklch(0.155 0.008 265);
  --theme-error: oklch(0.655108 0.221148 23.473);
  --theme-error-foreground: oklch(0.702184 0.189226 22.228);
  --theme-error-surface: oklch(0.29 0.04 20);
  --theme-update-foreground: oklch(0.83 0.08 183);
  --theme-accent-surface: oklch(0.32 0.05 185);
  --theme-code-background: oklch(0.155 0.008 265);
  --theme-sidebar: oklch(0.235 0.003 265);
  --theme-sidebar-muted-foreground: oklch(0.72 0.014 265);
  --theme-sidebar-row-hover: oklch(0.28 0.003 265);
  --theme-sidebar-row-active: oklch(0.32 0.025 190);
  --theme-sidebar-control-surface: oklch(0.295 0.003 265);
  --theme-sidebar-border: oklch(0.355 0.012 265);
  --tt-success: oklch(0.79 0.13 165);
  --tt-provider-codex: #d7dbe1;
  --tt-provider-claude: #e3b58e;
  --tt-provider-grok: #c9baff;
  --tt-provider-devin: #a5d8f5;
  --tt-provider-muse: #e6e1d6; /* prototype only: Muse has no provider token yet */
  --tt-provider-ink: #080b0a;
  --tt-backdrop: rgb(0 0 0 / 38%);
  --tt-shadow-sm: 0 1px 2px rgb(0 0 0 / 40%);
  --tt-shadow-overlay: 0 24px 72px -20px rgb(0 0 0 / 90%);
  --tt-shadow-color: rgb(0 0 0 / 73%);
  /* The prototype switcher is deliberately foreign to the design. */
  --proto-bg: #0d0d0d;
  --proto-text: #ffffff;
  --proto-edge: #ff3d9a;
  --proto-hover: #2a2a2a;
  --proto-shadow: 0 10px 30px rgb(0 0 0 / 55%), 0 0 0 1px rgb(255 255 255 / 25%);
}
:root[data-theme='light'] {
  color-scheme: light;
  --theme-canvas: oklch(0.978 0.004 85);
  --theme-surface: oklch(0.99 0.003 85);
  --theme-surface-raised: oklch(0.955 0.006 85);
  --theme-surface-overlay: oklch(0.945 0.007 85);
  --theme-text: oklch(0.235 0.014 75);
  --theme-muted-foreground: oklch(0.5 0.014 75);
  --theme-placeholder: oklch(0.525 0.015 78);
  --theme-border: oklch(0.86 0.012 80);
  --theme-input: oklch(0.8 0.016 80);
  --theme-focus: oklch(0.53 0.095 186);
  --theme-accent: oklch(0.53 0.095 186);
  --theme-accent-foreground: oklch(0.99 0.003 85);
  --theme-muted: oklch(0.945 0.008 85);
  --theme-error: oklch(0.637823 0.237287 25.436);
  --theme-error-foreground: oklch(0.509494 0.208583 28.513);
  --theme-error-surface: oklch(0.94 0.02 25);
  --theme-update-foreground: oklch(0.43 0.08 186);
  --theme-accent-surface: oklch(0.92 0.03 186);
  --theme-code-background: oklch(0.96 0.005 85);
  --theme-sidebar: oklch(0.955 0.008 85);
  --theme-sidebar-muted-foreground: oklch(0.5 0.014 75);
  --theme-sidebar-row-hover: oklch(0.93 0.01 85);
  --theme-sidebar-row-active: oklch(0.915 0.02 190);
  --theme-sidebar-control-surface: oklch(0.995 0.002 85);
  --theme-sidebar-border: oklch(0.87 0.012 82);
  --tt-success: oklch(0.445 0.11 158);
  --tt-provider-codex: #c9ced6;
  --tt-provider-claude: #e2ad80;
  --tt-provider-grok: #bfaefc;
  --tt-provider-devin: #8fcaef;
  --tt-provider-muse: #d9d3c4;
  --tt-provider-ink: #0b0d0c;
  --tt-backdrop: rgb(20 24 22 / 22%);
  --tt-shadow-sm: 0 1px 2px rgb(20 24 22 / 10%);
  --tt-shadow-overlay: 0 24px 64px -24px rgb(0 0 0 / 45%);
  --tt-shadow-color: rgb(20 24 22 / 18%);
}
/* Derived tokens, a simplified copy of tokens.css at Contrast 100%. */
:root {
  --tt-canvas: var(--theme-canvas);
  --tt-surface: var(--theme-surface);
  --tt-surface-elevated: var(--theme-surface-raised);
  --tt-surface-overlay: var(--theme-surface-overlay);
  --tt-surface-sunken: var(--theme-muted);
  --tt-sidebar: var(--theme-sidebar);
  --tt-text: var(--theme-text);
  --tt-text-2: color-mix(in oklab, var(--theme-text) 55%, var(--theme-muted-foreground));
  --tt-text-muted: color-mix(in oklab, var(--theme-muted-foreground) 85%, var(--theme-text));
  --tt-text-faint: var(--theme-placeholder);
  --tt-hairline: var(--theme-border);
  --tt-border: color-mix(in oklab, var(--theme-input) 25%, var(--theme-muted-foreground));
  --tt-hover: color-mix(in srgb, var(--theme-accent-surface) 70%, transparent);
  --tt-pill: var(--tt-text);
  --tt-pill-ink: var(--theme-canvas);
  --tt-error: var(--theme-error-foreground);
  --tt-error-contrast: var(--theme-canvas);
  --tt-error-surface: var(--theme-error-surface);
  --tt-error-border: color-mix(in oklab, var(--theme-error) 38%, var(--theme-error-surface));
  --tt-accent: var(--theme-accent);
  --tt-accent-text: var(--theme-update-foreground);
  --tt-on-accent: var(--theme-accent-foreground);
  --tt-accent-wash: color-mix(in srgb, var(--theme-accent) 14%, transparent);
  --tt-accent-border: color-mix(in srgb, var(--theme-accent) 45%, var(--theme-input));
  --tt-focus-ring: var(--theme-focus);
  --tt-code-bg: var(--theme-code-background);
  --tt-sidebar-text-muted: var(--theme-sidebar-muted-foreground);
  --tt-sidebar-row-hover: var(--theme-sidebar-row-hover);
  --tt-sidebar-row-active: var(--theme-sidebar-row-active);
  --tt-sidebar-control: var(--theme-sidebar-control-surface);
  --tt-sidebar-border: var(--theme-sidebar-border);
  --tt-none: transparent;
  --tt-font-ui: 'Figtree', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --tt-font-mono: 'Spline Sans Mono', ui-monospace, Consolas, monospace;
  --sidebar-w: 264px;
}
/* ---------- end of token block ---------- */

@media (max-width: 980px) { :root { --sidebar-w: 244px; } }
@media (max-width: 900px) { :root { --sidebar-w: 200px; } }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--tt-canvas); color: var(--tt-text); font-family: var(--tt-font-ui); font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
:focus-visible { outline: 2px solid var(--tt-focus-ring); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); height: 100vh; overflow: hidden; }
.side { position: relative; display: flex; flex-direction: column; min-height: 0; background: var(--tt-sidebar); }
.side__top { display: flex; align-items: center; gap: 9px; height: 52px; padding: 0 20px; flex: none; }
.side__top .brand { font-size: 15px; font-weight: 600; }
.side__top .phone-title { display: none; }
.owl { width: 22px; height: 22px; flex: none; }
.owl .tile { fill: var(--tt-accent); }
.owl .glyph { fill: var(--tt-on-accent); }
.menu-btn { display: none; }
.side__body { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 14px 12px; scrollbar-width: thin; }
.side__body h1 { margin: 6px 0 18px; padding: 0 8px; font-size: 24px; font-weight: 600; letter-spacing: -0.7px; line-height: 1.2; }
.subnav { display: flex; flex-direction: column; gap: 4px; }
.subnav button { position: relative; display: flex; align-items: center; gap: 11px; width: 100%; min-height: 42px; padding: 10px 12px; border: 0; border-radius: 8px; background: var(--tt-none); color: var(--tt-sidebar-text-muted); text-align: left; font-size: 14px; cursor: pointer; transition: background 160ms ease, color 160ms ease; }
.subnav button > span { flex: 1; }
.subnav button:hover { background: var(--tt-sidebar-row-hover); color: var(--tt-text); }
.subnav button[aria-current='page'] { background: var(--tt-sidebar-row-active); color: var(--tt-text); }
.subnav button[aria-current='page'] > svg:first-child { color: var(--tt-accent); }
.subnav button.sep { margin-top: 32px; }
.subnav button.sep::before { content: ''; position: absolute; top: -18px; left: 12px; right: 12px; height: 1px; background: var(--tt-sidebar-border); }
.side__foot { flex: none; padding: 8px 6px 10px; border-top: 1px solid var(--tt-sidebar-border); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); padding: 2px; border-radius: 8px; background: var(--tt-sidebar-control); }
.seg button { height: 28px; border: 0; border-radius: 6px; background: var(--tt-none); color: var(--tt-sidebar-text-muted); font-size: 12.5px; cursor: pointer; }
.seg button:hover { color: var(--tt-text); }
.foot-icons { display: flex; align-items: center; gap: 2px; margin-top: 8px; }
.foot-icons button { display: grid; place-items: center; width: 30px; height: 30px; border: 0; border-radius: 7px; background: var(--tt-none); color: var(--tt-sidebar-text-muted); cursor: pointer; }
.foot-icons button:hover { background: var(--tt-sidebar-row-hover); color: var(--tt-text); }
.foot-icons button[aria-current='page'] { background: var(--tt-sidebar-row-active); color: var(--tt-accent); }
.foot-icons button:last-child { margin-left: auto; }

.detail { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.winctl { position: absolute; top: 0; right: 0; z-index: 5; display: flex; }
.winctl button { display: grid; place-items: center; width: 46px; height: 38px; border: 0; background: var(--tt-none); color: var(--tt-text-muted); cursor: pointer; }
.winctl button:hover { background: var(--tt-surface-elevated); color: var(--tt-text); }
.winctl svg.i { width: 15px; height: 15px; stroke-width: 1.6; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 42px 6vw 72px; scrollbar-width: thin; }
.form { width: 100%; max-width: 790px; margin: 0 auto; container-type: inline-size; container-name: form; }
.page-head { padding: 0 0 20px; margin-bottom: 22px; border-bottom: 1px solid var(--tt-hairline); }
.page-head h2 { margin-bottom: 10px; font-size: 28px; font-weight: 600; letter-spacing: -1px; line-height: 1.2; }
.page-head p { color: var(--tt-text-muted); font-size: 16px; line-height: 1.5; }
.saved { position: absolute; right: 22px; bottom: 12px; color: var(--tt-text-muted); font-size: 13px; pointer-events: none; }

@media (max-width: 900px) {
  .side__body { padding-inline: 10px; }
  .side__body h1 { font-size: 22px; margin-bottom: 16px; }
  .subnav button { min-height: 38px; padding: 8px 10px; gap: 9px; }
  .subnav button .chev { display: none; }
  .subnav button.sep { margin-top: 24px; }
  .subnav button.sep::before { top: -13px; }
  .scroll { padding: 34px 28px 72px; }
}
@media (max-height: 650px) {
  .side__body h1 { margin-bottom: 12px; }
  .subnav button { min-height: 34px; padding-block: 7px; }
  .subnav button.sep { margin-top: 20px; }
  .subnav button.sep::before { top: -11px; }
  .scroll { padding-top: 24px; }
  .page-head { padding-bottom: 14px; margin-bottom: 16px; }
  .page-head h2 { font-size: 24px; margin-bottom: 6px; }
  .page-head p { font-size: 15px; }
}

/* Phone: the Settings column folds into a top bar with a menu. */
@media (max-width: 640px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .side { z-index: 20; border-bottom: 1px solid var(--tt-sidebar-border); }
  .side__top { height: 54px; padding: 0 8px 0 16px; }
  .side__top .brand { display: none; }
  .side__top .phone-title { display: flex; align-items: baseline; gap: 8px; flex: 1; min-width: 0; font-size: 17px; font-weight: 600; }
  .side__top .phone-title span { color: var(--tt-text-muted); font-size: 14px; font-weight: 400; }
  .menu-btn { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 12px; border: 1px solid var(--tt-hairline); border-radius: 999px; background: var(--tt-none); color: var(--tt-text); cursor: pointer; font-size: 13.5px; }
  .app { grid-template-rows: 55px minmax(0, 1fr); }
  .side__body, .side__foot { display: none; }
  .app[data-menu='open'] .side { position: fixed; top: 0; left: 0; right: 0; max-height: 100vh; box-shadow: var(--tt-shadow-overlay); }
  .app[data-menu='open'] .side__body { display: block; flex: 0 1 auto; }
  .app[data-menu='open'] .side__body h1 { display: none; }
  .app[data-menu='open'] .side__foot { display: block; }
  .winctl { display: none; }
  .scroll { padding: 22px 16px 96px; }
  .page-head h2 { font-size: 24px; }
  .page-head p { font-size: 15px; }
  .saved { position: static; display: block; margin-top: 24px; text-align: right; }
}

/* ---------- Shared controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 34px; padding: 0 14px; border: 1px solid var(--tt-hairline); border-radius: 999px; background: var(--tt-none); color: var(--tt-text-2); font-size: 13.5px; font-weight: 500; line-height: 1.2; white-space: nowrap; cursor: pointer; transition: border-color 120ms ease, color 120ms ease, filter 120ms ease; }
.btn:hover:not([aria-disabled='true']) { border-color: var(--tt-text-faint); color: var(--tt-text); }
.btn--primary { border-color: var(--tt-pill); background: var(--tt-pill); color: var(--tt-pill-ink); font-weight: 600; }
.btn--primary:hover:not([aria-disabled='true']) { color: var(--tt-pill-ink); filter: brightness(1.12); }
.btn--ghost { border-color: var(--tt-none); color: var(--tt-text-faint); }
.btn--ghost:hover:not([aria-disabled='true']) { border-color: var(--tt-none); color: var(--tt-text); }
.btn--small { min-height: 30px; padding: 0 10px; font-size: 13px; }
.btn--icon { width: 34px; padding: 0; }
.btn[aria-disabled='true'] { opacity: .5; cursor: not-allowed; }
.btn--primary[aria-disabled='true'] { opacity: .6; }

.tg { display: inline-flex; align-items: center; gap: 10px; padding: 6px 0; border: 0; background: var(--tt-none); color: var(--tt-text-2); cursor: pointer; font-size: 13.5px; }
.tg__track { position: relative; width: 36px; height: 20px; flex: none; border: 1px solid var(--tt-border); border-radius: 999px; background: var(--tt-surface-sunken); transition: background-color 120ms ease, border-color 120ms ease; }
.tg__thumb { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--tt-text-muted); transition: transform 120ms ease, background-color 120ms ease; }
.tg[aria-checked='true'] .tg__track { border-color: var(--tt-accent); background: var(--tt-accent); }
.tg[aria-checked='true'] .tg__thumb { background: var(--tt-on-accent); transform: translateX(16px); }
.tg[aria-disabled='true'] { cursor: not-allowed; }
.tg[aria-disabled='true'] .tg__track { opacity: .5; }

/* Provider mark on its own tile, so it reads in both modes. */
.pm { display: inline-grid; place-items: center; width: var(--s, 28px); height: var(--s, 28px); flex: none; border-radius: calc(var(--s, 28px) * .28); background: var(--pc); color: var(--tt-provider-ink); }
.pm svg { width: 60%; height: 60%; fill: currentColor; }
.pm[data-p='codex'] { --pc: var(--tt-provider-codex); }
.pm[data-p='claude'] { --pc: var(--tt-provider-claude); }
.pm[data-p='grok'] { --pc: var(--tt-provider-grok); }
.pm[data-p='devin'] { --pc: var(--tt-provider-devin); }
.pm[data-p='muse'] { --pc: var(--tt-provider-muse); }

.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--tt-text-muted); white-space: nowrap; }
.st i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.st[data-s='connected'] { color: var(--tt-accent-text); }
.st[data-s='error'] { color: var(--tt-error); }
.st[data-s='busy'] { color: var(--tt-accent-text); }
.st[data-s='busy'] i { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.ver { color: var(--tt-text-muted); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }

.sec h4 { margin-bottom: 6px; color: var(--tt-text); font-size: 14px; font-weight: 600; }
.sec p { color: var(--tt-text-muted); font-size: 14px; line-height: 1.6; max-width: 36em; overflow-wrap: anywhere; }
.sec__row { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 12px 20px; }
.sec__text { flex: 1 1 240px; min-width: 0; }
.sec__actions { display: flex; flex-wrap: wrap; gap: 8px; flex: none; max-width: 100%; }
.login { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 6px; margin-top: 8px; }
.login code { margin-right: 4px; padding: 3px 8px; border: 1px solid var(--tt-hairline); border-radius: 6px; background: var(--tt-code-bg); color: var(--tt-text); font: 13px/1.6 var(--tt-font-mono); user-select: text; }
.err { margin-top: 14px; padding: 10px 14px; border-left: 2px solid var(--tt-error); background: var(--tt-error-contrast); color: var(--tt-error); font-size: 14px; line-height: 1.55; overflow-wrap: anywhere; }
.models { margin: 0; padding: 0; list-style: none; }
.models li { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 11px 0; }
.models li + li { border-top: 1px solid var(--tt-hairline); }
.models li > span { display: grid; gap: 3px; min-width: 0; }
.models strong { font-size: 14px; font-weight: 500; }
.models small { color: var(--tt-text-muted); font-size: 12.5px; overflow-wrap: anywhere; }
.models .tag { flex: none; color: var(--tt-text-muted); font-size: 12.5px; }
.models .tag[data-t='agent'] { color: var(--tt-accent-text); }
.note { color: var(--tt-text-muted); font-size: 13.5px; line-height: 1.6; }
.note + .note { margin-top: 6px; }
details.more { color: var(--tt-text-muted); font-size: 13.5px; line-height: 1.6; }
details.more summary { width: fit-content; color: var(--tt-text); cursor: pointer; }
details.more p { margin-top: 8px; }

.updates { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--tt-hairline); }
.updates h4 { margin-bottom: 4px; font-size: 14px; font-weight: 600; }
.updates p { max-width: 44em; color: var(--tt-text-muted); font-size: 13px; line-height: 1.6; }
.agents-note { margin-top: 14px; color: var(--tt-text-muted); font-size: 13.5px; }

/* ---------- A: List ---------- */
.pa { border: 1px solid var(--tt-hairline); border-radius: 14px; background: var(--tt-surface); overflow: hidden; }
.pa-row + .pa-row { border-top: 1px solid var(--tt-hairline); }
.pa-row[data-open='true'] { background: var(--tt-surface-elevated); }
.pa-head { display: grid; grid-template-columns: minmax(0, 1fr) 132px 50px; align-items: center; column-gap: 6px; padding-right: 14px; }
.pa-trigger { display: grid; grid-template-columns: 16px 28px minmax(0, 1fr) 132px 56px; align-items: center; column-gap: 12px; min-height: 62px; padding: 12px 10px 12px 12px; border: 0; background: var(--tt-none); color: var(--tt-text); text-align: left; cursor: pointer; }
.pa-trigger:focus-visible { outline-offset: -2px; border-radius: 12px; }
.pa-name { display: grid; gap: 3px; min-width: 0; }
.pa-name strong { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pa-name .pa-meta { display: none; align-items: center; gap: 8px; min-width: 0; }
.pa-chev { color: var(--tt-text-muted); transition: transform 160ms ease; }
.pa-row[data-open='true'] .pa-chev { transform: rotate(90deg); }
.pa-chip { justify-self: end; display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 11px; border: 1px solid var(--tt-accent-border); border-radius: 999px; background: var(--tt-accent-wash); color: var(--tt-accent-text); font-size: 12.5px; font-weight: 600; white-space: nowrap; cursor: pointer; }
.pa-chip:hover:not([aria-disabled='true']) { border-color: var(--tt-accent); }
.pa-chip[aria-disabled='true'] { cursor: progress; }
.pa-chip svg.i { width: 13px; height: 13px; }
.pa-head .tg { justify-self: end; }
.pa-err { margin: -4px 20px 14px 80px; color: var(--tt-error); font-size: 13px; line-height: 1.5; }
.pa-panel { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 22px 36px; padding: 6px 22px 22px 80px; animation: arrive 160ms ease both; }
.pa-panel > .col { display: grid; gap: 20px; align-content: start; min-width: 0; }
.pa-panel .models { border-top: 1px solid var(--tt-hairline); }
.pa-panel .sec__row { display: grid; gap: 10px; }
.pa-panel .sec__actions { justify-content: flex-start; }
@keyframes arrive { from { opacity: .4; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
@container form (max-width: 680px) {
  .pa-panel { grid-template-columns: minmax(0, 1fr); }
}
@container form (max-width: 600px) {
  .pa-head { grid-template-columns: minmax(0, 1fr) auto 50px; }
  .pa-trigger { grid-template-columns: 16px 28px minmax(0, 1fr); }
  .pa-trigger > .st, .pa-trigger > .ver { display: none; }
  .pa-name .pa-meta { display: flex; }
}
@container form (max-width: 430px) {
  .pa-head { grid-template-columns: minmax(0, 1fr) 50px; grid-template-areas: 'trigger toggle' 'chip chip'; padding-right: 10px; }
  .pa-trigger { grid-area: trigger; padding-left: 8px; column-gap: 10px; }
  .pa-head .tg { grid-area: toggle; }
  .pa-chip { grid-area: chip; justify-self: start; margin: -6px 0 12px 72px; }
  .pa-err { margin-left: 72px; margin-right: 14px; }
  .pa-panel { padding: 4px 14px 18px; }
}

/* ---------- B: Rail and detail ---------- */
.pb { display: grid; grid-template-columns: 208px minmax(0, 1fr); border: 1px solid var(--tt-hairline); border-radius: 14px; background: var(--tt-surface); overflow: hidden; }
.pb-rail { display: flex; flex-direction: column; gap: 2px; padding: 8px; border-right: 1px solid var(--tt-hairline); }
.pb-item { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; column-gap: 10px; padding: 10px; border: 0; border-radius: 9px; background: var(--tt-none); color: var(--tt-text); text-align: left; cursor: pointer; }
.pb-item:hover { background: var(--tt-hover); }
.pb-item[aria-current='true'] { background: var(--tt-accent-wash); }
.pb-item > span { display: grid; gap: 3px; min-width: 0; }
.pb-item strong { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pb-sub { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; min-width: 0; }
.pb-up { padding: 1px 7px; border: 1px solid var(--tt-accent-border); border-radius: 999px; color: var(--tt-accent-text); font-size: 11.5px; font-weight: 600; font-style: normal; }
.pb-detail { min-width: 0; padding: 22px 26px 24px; animation: arrive 160ms ease both; }
.pb-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; padding-bottom: 20px; }
.pb-head h3 { font-size: 20px; font-weight: 600; letter-spacing: -.3px; }
.pb-head .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; }
.pb-detail .sec { padding: 20px 0; border-top: 1px solid var(--tt-hairline); }
.pb-detail .sec:last-of-type { padding-bottom: 6px; }
.pb-notes { display: grid; gap: 10px; padding-top: 18px; border-top: 1px solid var(--tt-hairline); }
@container form (max-width: 640px) {
  .pb { grid-template-columns: 172px minmax(0, 1fr); }
  .pb-rail { padding: 6px; }
  .pb-item { grid-template-columns: 22px minmax(0, 1fr) auto; column-gap: 9px; padding: 9px 8px; }
  .pb-item .pm { --s: 22px !important; }
  .pb-detail { padding: 18px 20px 20px; }
}
@container form (max-width: 480px) {
  .pb { grid-template-columns: minmax(0, 1fr); }
  .pb-rail { flex-direction: row; gap: 4px; overflow-x: auto; padding: 8px; border-right: 0; border-bottom: 1px solid var(--tt-hairline); scrollbar-width: none; }
  .pb-item { grid-template-columns: 22px auto auto; column-gap: 8px; padding: 8px 12px 8px 8px; flex: none; }
  .pb-item .pm { --s: 22px !important; }
  .pb-item .st { display: none; }
  .pb-item .pb-sub:not(:has(.pb-up)) { display: none; }
  .pb-item .pb-statusdot { display: block; }
  .pb-detail { padding: 18px 18px 20px; }
}
.pb-statusdot { display: none; width: 6px; height: 6px; border-radius: 50%; background: var(--tt-text-muted); }
.pb-statusdot[data-s='connected'], .pb-statusdot[data-s='busy'] { background: var(--tt-accent-text); }
.pb-statusdot[data-s='error'] { background: var(--tt-error); }
@container form (max-width: 430px) {
  .pb-head { grid-template-columns: auto minmax(0, 1fr); }
  .pb-head .tg { grid-column: 1 / -1; justify-self: start; }
}

/* ---------- C: Overview first ---------- */
.pc-summary { margin: 2px 0 26px; color: var(--tt-text-2); font-size: 17px; line-height: 1.55; }
.pc-summary b { color: var(--tt-text); font-weight: 600; }
.pc-summary b.bad { color: var(--tt-error); }
.pc-summary b.up { color: var(--tt-accent-text); }
.pc-group + .pc-group { margin-top: 26px; }
.pc-group h3 { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; color: var(--tt-text-muted); font-size: 13px; font-weight: 600; }
.pc-group h3 span { font-weight: 400; }
.pc-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
.pc-card { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; padding: 14px 14px 14px 16px; border: 1px solid var(--tt-hairline); border-radius: 12px; background: var(--tt-surface); }
.pc-card[data-s='error'] { grid-column: 1 / -1; border-color: var(--tt-error-border); }
.pc-card .body { display: grid; gap: 4px; min-width: 0; }
.pc-card .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pc-card strong { font-size: 15px; font-weight: 600; }
.pc-card .line { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; }
.pc-card .why { margin-top: 4px; color: var(--tt-error); font-size: 13.5px; line-height: 1.5; }
.pc-card .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
.pc-card .acts .btn--ghost { padding-inline: 10px; }
.pc-card .acts > .btn--ghost:first-child { margin-left: -10px; }
@container form (max-width: 430px) { .pc-cards { grid-template-columns: minmax(0, 1fr); } .pc-summary { font-size: 16px; } }

.sheet-back { position: fixed; inset: 0; z-index: 40; background: var(--tt-backdrop); animation: fade 160ms ease both; }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; z-index: 41; display: flex; flex-direction: column; width: min(480px, 100vw); background: var(--tt-surface-overlay); border-left: 1px solid var(--tt-hairline); box-shadow: var(--tt-shadow-overlay); animation: slide 180ms ease both; }
.sheet__head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 18px 16px 16px 22px; border-bottom: 1px solid var(--tt-hairline); }
.sheet__head h3 { font-size: 18px; font-weight: 600; }
.sheet__head .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin-top: 3px; }
.sheet__body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 22px 28px; }
.sheet__body .sec { padding: 18px 0; }
.sheet__body .sec + .sec { border-top: 1px solid var(--tt-hairline); }
.sheet__body .notes:empty { display: none; }
.sheet__body .notes { border-top: 1px solid var(--tt-hairline); }
.sheet__body .notes { display: grid; gap: 10px; padding-top: 16px; }
.sheet-enable { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--tt-hairline); }
.sheet-enable span { color: var(--tt-text-2); font-size: 14px; }
@keyframes slide { from { transform: translateX(24px); opacity: .3; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } }

/* ---------- Prototype switcher (not part of the design) ---------- */
.proto { position: fixed; left: 50%; bottom: 16px; z-index: 100; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 5px; border: 2px solid var(--proto-edge); border-radius: 999px; background: var(--proto-bg); color: var(--proto-text); box-shadow: var(--proto-shadow); font: 600 13px/1 system-ui, sans-serif; white-space: nowrap; }
.proto button { min-width: 34px; height: 32px; padding: 0 10px; border: 0; border-radius: 999px; background: var(--tt-none); color: var(--proto-text); font: inherit; cursor: pointer; }
.proto button:hover { background: var(--proto-hover); }
.proto button:focus-visible { outline: 2px solid var(--proto-edge); outline-offset: 1px; }
.proto .lbl { min-width: 172px; padding: 0 6px; text-align: center; }
.proto .bar { width: 1px; height: 20px; background: var(--proto-edge); margin: 0 4px; }
@media (max-width: 640px) { .proto { bottom: 10px; font-size: 12px; } .proto .lbl { min-width: 0; } .proto button { min-width: 30px; padding: 0 8px; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<script>
'use strict'
const ICON = {

const NAV = [['mic', 'Dictation'], ['audio', 'Transcription'], ['sparkles', 'Cleanup'], ['command', 'Providers', 'sep'], ['server', 'Hosts'], ['phone', 'Phones'], ['cloud', 'Cloud iPhone'], ['workflow', 'Agents', 'sep'], ['arrow', 'Output'], ['palette', 'Appearance'], ['settings2', 'Application'], ['git', 'Git']]

  { id: 'codex', label: 'Codex', client: 'Codex', enabled: true, conn: 'connected', installed: '0.46.0', published: '0.46.0',
    models: [{ n: 'GPT-5.5 Codex', e: 'low · medium · high · xhigh', t: 'agent' }, { n: 'GPT-5.5' }, { n: 'GPT-5.4 mini' }] },

  { id: 'grok', label: 'Grok Build', client: 'Grok Build', enabled: true, conn: 'error', installed: '0.3.1', published: '0.3.1',

  { id: 'devin', label: 'Devin', client: 'Devin CLI', enabled: false, conn: 'disconnected', later: { installed: '2026.10.2', published: '2026.10.2' },
    models: [{ n: 'Devin' }] },
  { id: 'muse', label: 'Muse', client: 'Muse', enabled: true, conn: 'disconnected', later: { installed: '0.8.1', published: '0.8.1' },
    models: [{ n: 'Muse Spark', e: 'low · medium · high' }] },
]
const byId = id => P.find(p => p.id === id)

const VARIANTS = { A: 'List', B: 'Rail and detail', C: 'Overview first' }
const params = new URLSearchParams(location.search)
const S = {
  variant: VARIANTS[(params.get('variant') || '').toUpperCase()] ? params.get('variant').toUpperCase() : 'A',
  theme: params.get('theme') === 'light' ? 'light' : 'dark',
  checks: true, checking: false, pending: {}, updating: {}, copied: false,
  openA: params.get('open') ?? 'claude', selB: params.get('select') ?? 'claude', sheet: null, sheetOpener: null,
}

// ---------- Copy, from ProvidersSettings.tsx ----------
const working = p => S.pending[p.id]
const statusKind = p => working(p) ? 'busy' : p.conn === 'connected' ? 'connected' : p.conn === 'error' ? 'error' : 'off'
const statusLabel = p => S.pending[p.id] === 'disconnect' ? 'Disconnecting…' : S.pending[p.id] === 'refresh' ? 'Refreshing…' : S.pending[p.id] ? 'Connecting…'
  : p.conn === 'connected' ? 'Connected' : p.conn === 'error' ? 'Needs attention' : p.enabled ? 'Not connected' : 'Disabled'
const status = p => `<span class="st" data-s="${statusKind(p)}"><i aria-hidden="true"></i>${statusLabel(p)}</span>`
const hasUpdate = p => S.checks && p.installed && p.published && p.installed !== p.published && p.id !== 'devin'
function clientLine(p) {
  if (S.updating[p.id]) return `Updating to ${p.published}…`
  if (!S.checks) return 'Client update checks are off, so Sotto does not know what is published.'
  if (S.checking) return 'Checking the published version…'
  if (!p.installed) return p.conn === 'connected' ? "Sotto has not read this client's version yet. Check again to read it." : 'Connect this provider to read its installed version.'
  if (p.id === 'devin') return `${p.installed} is installed. Devin updates with the Devin app.`
  if (p.installed === p.published) return `${p.installed} is installed, and that is what is published.`
  return `${p.installed} is installed; ${p.published} is published. Your threads keep working while it installs.`
}
const connectionCopy = p => p.id === 'devin' ? 'Install Devin CLI and run devin auth login before connecting.'
  : p.id === 'muse' ? 'Uses your Muse sign-in on this computer. Run muse login in a terminal before connecting.'
  : `Uses your ${p.client} sign-in on this computer.`
const dis = on => on ? 'aria-disabled="true"' : ''

function connButton(p, small = false) {
  const w = working(p), busy = w || S.updating[p.id]
  const verb = p.conn === 'connected' ? 'Disconnect' : p.conn === 'error' ? 'Retry' : 'Connect'
  const text = w ? statusLabel(p) : p.conn === 'connected' ? 'Disconnect' : p.conn === 'error' ? 'Retry connection' : 'Connect'
  const aria = p.conn === 'error' ? `Retry the ${p.label} connection` : `${verb} ${p.label}`
  return `<button type="button" class="btn ${p.conn === 'connected' ? '' : 'btn--primary'} ${small ? 'btn--small' : ''}" data-act="conn" data-id="${p.id}" data-k="conn-${p.id}" aria-label="${aria}" ${dis(busy)}>${text}</button>`
}
function updateButton(p, small = false) {
  if (!hasUpdate(p) && !S.updating[p.id]) return ''
  const u = S.updating[p.id]
  return `<button type="button" class="btn btn--primary ${small ? 'btn--small' : ''}" data-act="update" data-id="${p.id}" data-k="upd-${p.id}" aria-label="${u ? `Updating ${p.label} to ${p.published}` : `Update ${p.label} to ${p.published}`}" ${dis(u || working(p) || S.checking)}>${u ? 'Updating…' : 'Update'}</button>`
}
const checkButton = p => `<button type="button" class="btn" data-act="check" data-k="check-${p.id}" aria-label="Check the published version again" ${dis(!S.checks || S.checking || Object.values(S.updating).some(Boolean))}>${S.checking ? 'Checking…' : 'Check again'}</button>`
const refreshButton = p => p.conn === 'connected' ? `<button type="button" class="btn btn--ghost btn--icon" data-act="refresh" data-id="${p.id}" data-k="ref-${p.id}" aria-label="Refresh ${p.label}" title="Refresh ${p.label}" ${dis(working(p) || S.updating[p.id])}>${svg('refresh')}</button>` : ''
const toggle = (p, withText = false) => `<button type="button" role="switch" class="tg" aria-checked="${p.enabled}" aria-label="Enable ${p.label}" data-act="enable" data-id="${p.id}" data-k="tg-${p.id}" ${dis(working(p) || S.updating[p.id])}>${withText ? `<span>${p.enabled ? 'Enabled' : 'Disabled'}</span>` : ''}<span class="tg__track" aria-hidden="true"><span class="tg__thumb"></span></span></button>`
const museLogin = p => p.id !== 'muse' ? '' : `<div class="login"><code>muse login</code><button type="button" class="btn btn--ghost btn--small" data-act="copy" data-k="copy" aria-label="Copy Muse login command">${S.copied ? 'Copied' : 'Copy'}</button><button type="button" class="btn btn--ghost btn--small" data-act="guide" data-k="guide" aria-label="Open the Muse sign-in steps">Sign-in steps</button><span class="vh" role="status">${S.copied ? 'Muse login command copied.' : ''}</span></div>`
const errorLine = p => p.error && !working(p) ? `<p class="err" role="alert">${p.error}</p>` : ''

function secConnection(p, { refresh = true } = {}) {
  return `<section class="sec" aria-label="Local connection"><div class="sec__row"><div class="sec__text"><h4>Local connection</h4><p>${connectionCopy(p)}</p>${museLogin(p)}</div>
    <div class="sec__actions">${connButton(p)}${refresh ? refreshButton(p) : ''}</div></div>${errorLine(p)}</section>`
}
function secClient(p) {
  return `<section class="sec" aria-label="Installed client" aria-busy="${S.checking || !!S.updating[p.id]}"><div class="sec__row"><div class="sec__text"><h4>Installed client</h4><p role="status">${clientLine(p)}</p></div>
    <div class="sec__actions">${updateButton(p)}${checkButton(p)}</div></div></section>`
}
function modelList(p) {
  if (p.conn !== 'connected') return `<p class="note">Connect ${p.label} to load its models.</p>`
  return `<ul class="models" aria-label="${p.label} available models">${p.models.map(m => `<li><span><strong>${m.n}</strong>${m.e ? `<small>${m.e}</small>` : ''}</span><span class="tag" data-t="${m.t ?? ''}">${m.t === 'agent' ? 'Agent setting' : 'Available'}</span></li>`).join('')}</ul>`
}
const secModels = p => `<section class="sec" aria-label="Models"><h4>Models</h4>${modelList(p)}</section>`
function notes(p, agents = true) {
  return [
    p.id === 'devin' ? `<p class="note">Uses your Devin account and credits. Devin keeps its own history and analytics, outside Sotto's control.</p>` : '',
    agents ? `<p class="note">Choose what new threads start with under Agents.</p>` : '',
    p.id === 'muse' ? `<details class="more"><summary data-k="musesupport">Threads with Muse</summary><p>Replies, images, steering, approvals, questions and reasoning effort. Change models and permissions in a thread.</p><p>Sotto's browser tools, Watcher and skills are unavailable. Muse does not write thread titles, branch names, commit messages or pull request drafts; Sotto keeps its default text.</p></details>` : '',
  ].join('')
}
const updatesRow = () => `<div class="updates"><div><h4>Check for client updates</h4><p>Checks each client's published version, at most once an hour. Muse uses its own release feed; the other clients use the npm registry. No thread text is sent. Off, Sotto does not check versions or offer updates.</p></div>
  <button type="button" role="switch" class="tg" aria-checked="${S.checks}" aria-label="Check for client updates" data-act="checks" data-k="checks"><span class="tg__track" aria-hidden="true"><span class="tg__thumb"></span></span></button></div>`

// ---------- A: List ----------
function renderA() {
  const rows = P.map(p => {
    const open = S.openA === p.id
    const chip = hasUpdate(p) || S.updating[p.id]
      ? `<button type="button" class="pa-chip" data-act="update" data-id="${p.id}" data-k="chip-${p.id}" aria-label="${S.updating[p.id] ? `Updating ${p.label} to ${p.published}` : `Update ${p.label} to ${p.published}`}" ${dis(S.updating[p.id] || working(p))}>${svg('up')}${S.updating[p.id] ? 'Updating…' : `Update to ${p.published}`}</button>` : '<span></span>'
    const ver = p.installed ? `<span class="ver">${p.installed}</span>` : '<span class="ver"></span>'
    return `<div class="pa-row" data-open="${open}">
      <div class="pa-head">
        <button type="button" class="pa-trigger" data-act="openA" data-id="${p.id}" data-k="trig-${p.id}" aria-expanded="${open}" aria-controls="pa-panel-${p.id}" aria-label="${p.label}, ${statusLabel(p)}${p.installed ? `, ${p.installed}` : ''}. ${open ? 'Hide' : 'Show'} details">
          ${svg('chev', 'i pa-chev')}${mark(p.id)}<span class="pa-name"><strong>${p.label}</strong><span class="pa-meta">${status(p)}${ver}</span></span>${status(p)}${ver}
        </button>
        ${chip}${toggle(p)}
      </div>
      ${p.error && !open && !working(p) ? `<p class="pa-err">${p.error}</p>` : ''}
      ${open ? `<div class="pa-panel" id="pa-panel-${p.id}" role="region" aria-label="${p.label} details">
        <div class="col">${secConnection(p)}${secClient(p)}${p.id === 'devin' || p.id === 'muse' ? `<div>${notes(p, false)}</div>` : ''}</div>
        <div class="col">${secModels(p)}</div>
      </div>` : ''}
    </div>`
  }).join('')
  return `<div class="pa" data-arrows="A">${rows}</div><p class="agents-note">Choose what new threads start with under Agents.</p>${updatesRow()}`
}

// ---------- B: Rail and detail ----------
function renderB() {
  const p = byId(S.selB)
  const rail = P.map(q => `<button type="button" class="pb-item" data-act="selB" data-id="${q.id}" data-k="rail-${q.id}" aria-current="${q.id === p.id}" aria-label="${q.label}, ${statusLabel(q)}${hasUpdate(q) ? ', update published' : ''}">
      ${mark(q.id, 26)}<span><strong>${q.label}</strong><span class="pb-sub">${status(q)}${hasUpdate(q) ? '<i class="pb-up" aria-hidden="true">Update</i>' : ''}</span></span><i class="pb-statusdot" data-s="${statusKind(q)}"></i></button>`).join('')
  const detail = `<section class="pb-detail" aria-labelledby="pb-title" key="${p.id}">
      <header class="pb-head">${mark(p.id, 40)}<div><h3 id="pb-title">${p.label}</h3><div class="meta">${status(p)}${p.installed ? `<span class="ver">${p.installed}</span>` : ''}</div></div>${toggle(p, true)}</header>
      ${secConnection(p)}${secClient(p)}${secModels(p)}
      <div class="pb-notes">${notes(p)}</div>
    </section>`
  return `<div class="pb"><nav class="pb-rail" aria-label="Thread providers" data-arrows="B">${rail}</nav>${detail}</div>${updatesRow()}`
}

// ---------- C: Overview first ----------
function list(names) { return names.length < 2 ? names.join('') : `${names.slice(0, -1).join(', ')} and ${names.at(-1)}` }
function summary() {
  const connected = P.filter(p => p.conn === 'connected' && !working(p)).length
  const ups = P.filter(hasUpdate).map(p => `<b class="up">${p.label}</b>`)
  const bad = P.filter(p => p.conn === 'error' && !working(p)).map(p => `<b class="bad">${p.label}</b>`)
  let s = `<b>${connected} of ${P.length}</b> providers connected.`
  if (ups.length) s += ` ${list(ups)} ${ups.length > 1 ? 'have updates' : 'has an update'}.`
  if (bad.length) s += ` ${list(bad)} ${bad.length > 1 ? 'need' : 'needs'} attention.`
  return s
}
function card(p) {
  const ver = p.installed ? hasUpdate(p) ? `<span class="ver">${p.installed} installed · ${p.published} published</span>` : `<span class="ver">${p.installed}</span>` : ''
  let primary = ''
  if (p.conn === 'error' || (p.conn !== 'connected' && !hasUpdate(p))) primary = connButton(p, true)
  else if (hasUpdate(p) || S.updating[p.id]) primary = updateButton(p, true)
  if (working(p)) primary = connButton(p, true)
  return `<article class="pc-card" data-s="${statusKind(p)}" aria-label="${p.label}">${mark(p.id, 32)}<div class="body">
      <div class="top"><strong>${p.label}</strong></div>
      <div class="line">${status(p)}${ver}</div>
      ${p.error && !working(p) ? `<p class="why">${p.error}</p>` : ''}
      <div class="acts">${primary}<button type="button" class="btn btn--ghost btn--small" data-act="sheet" data-id="${p.id}" data-k="det-${p.id}" aria-haspopup="dialog" aria-label="Show ${p.label} details">${svg('panel')}Details</button></div>
    </div></article>`
}
function renderC() {
  // A provider keeps its group while it connects or disconnects, so blocks do not jump under the pointer.
  const groups = [
    ['Needs attention', P.filter(p => p.conn === 'error')],
    ['Connected', P.filter(p => p.conn === 'connected')],
    ['Off', P.filter(p => p.conn === 'disconnected')],
  ]
  const body = groups.filter(g => g[1].length).map(([name, ps]) => `<section class="pc-group" aria-label="${name}"><h3>${name} <span>${ps.length}</span></h3><div class="pc-cards">${ps.map(card).join('')}</div></section>`).join('')
  return `<p class="pc-summary" role="status">${summary()}</p>${body}<p class="agents-note">Choose what new threads start with under Agents.</p>${updatesRow()}`
}
function renderSheet() {
  const root = document.getElementById('sheetRoot')
  if (S.variant !== 'C' || !S.sheet) { root.innerHTML = ''; return }
  const p = byId(S.sheet)
  root.innerHTML = `<div class="sheet-back" data-act="closeSheet"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" id="sheet">
      <header class="sheet__head">${mark(p.id, 34)}<div><h3 id="sheet-title">${p.label}</h3><div class="meta">${status(p)}${p.installed ? `<span class="ver">${p.installed}</span>` : ''}</div></div>
        <button type="button" class="btn btn--ghost btn--icon" data-act="closeSheet" data-k="sheet-close" aria-label="Close ${p.label} details">${svg('x')}</button></header>
      <div class="sheet__body">
        <div class="sheet-enable"><span>Use ${p.label} for threads</span>${toggle(p, false)}</div>
        ${secConnection(p)}${secClient(p)}${secModels(p)}
        <div class="notes">${notes(p, false)}</div>
      </div>
    </div>`
}

// ---------- Render, keeping focus and scroll ----------
const app = document.getElementById('app')
function render() {
  document.documentElement.dataset.theme = S.theme
  const active = document.activeElement?.dataset?.k
  const root = document.getElementById('root')
  root.innerHTML = S.variant === 'A' ? renderA() : S.variant === 'B' ? renderB() : renderC()
  renderSheet()
  document.getElementById('label').textContent = `${S.variant} — ${VARIANTS[S.variant]}`
  const tb = document.getElementById('themeBtn')
  tb.textContent = S.theme === 'dark' ? 'Light' : 'Dark'
  tb.setAttribute('aria-label', `Switch to the ${S.theme === 'dark' ? 'light' : 'dark'} theme`)
  if (active) document.querySelector(`[data-k="${active}"]`)?.focus({ preventScroll: true })
}
function syncUrl() {
  const q = new URLSearchParams(location.search)
  q.set('variant', S.variant); q.set('theme', S.theme)
  history.replaceState(null, '', `${location.pathname}?${q}`)
}
const later = (ms, fn) => setTimeout(() => { fn(); render() }, ms)

function act(kind, id, el) {
  const p = id && byId(id)
  if (el?.getAttribute('aria-disabled') === 'true') return
  switch (kind) {
    case 'openA': S.openA = S.openA === id ? null : id; break
    case 'selB': S.selB = id; break
    case 'enable':
      if (p.enabled || p.conn === 'connected') disconnect(p); else connect(p)
      break
    case 'conn': p.conn === 'connected' ? disconnect(p) : connect(p); break
    case 'refresh': S.pending[id] = 'refresh'; later(800, () => { delete S.pending[id] }); break
    case 'update':
      S.updating[id] = true
      later(1800, () => { p.installed = p.published; delete S.updating[id] })
      break
    case 'check': S.checking = true; later(900, () => { S.checking = false }); break
    case 'checks': S.checks = !S.checks; break
    case 'copy': S.copied = true; later(1500, () => { S.copied = false }); break
    case 'guide': break // Opens the Muse guide in the browser in the real app.
    case 'sheet': S.sheet = id; S.sheetOpener = el.dataset.k; render(); document.querySelector('[data-k="sheet-close"]')?.focus(); return
    case 'closeSheet': closeSheet(); return
  }
  render()
}
function connect(p) {
  S.pending[p.id] = 'connect'; p.enabled = true; delete p.error
  later(1000, () => { delete S.pending[p.id]; p.conn = 'connected'; if (!p.installed && p.later) Object.assign(p, p.later) })
}
function disconnect(p) {
  S.pending[p.id] = 'disconnect'
  later(700, () => { delete S.pending[p.id]; p.conn = 'disconnected'; p.enabled = false; delete p.error })
}
function closeSheet() {
  const k = S.sheetOpener
  S.sheet = null; render()
  if (k) document.querySelector(`[data-k="${k}"]`)?.focus()
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]')
  if (el) act(el.dataset.act, el.dataset.id, el)
})

// Phone menu.
const menuBtn = document.getElementById('menuBtn')
function setMenu(open) {
  app.dataset.menu = open ? 'open' : ''
  menuBtn.setAttribute('aria-expanded', String(open))
  menuBtn.setAttribute('aria-label', open ? 'Close the Settings sections menu' : 'Open the Settings sections menu')
  if (open) document.getElementById('sideBody').querySelector('[aria-current]')?.focus()
}
menuBtn.addEventListener('click', () => setMenu(app.dataset.menu !== 'open'))

const order = ['A', 'B', 'C']
function step(d) { S.variant = order[(order.indexOf(S.variant) + d + 3) % 3]; S.sheet = null; syncUrl(); render() }
document.getElementById('prev').addEventListener('click', () => step(-1))
document.getElementById('next').addEventListener('click', () => step(1))
document.getElementById('themeBtn').addEventListener('click', () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; syncUrl(); render() })

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.sheet) { e.preventDefault(); closeSheet(); return }
    if (app.dataset.menu === 'open') { setMenu(false); menuBtn.focus(); return }
  }
  // Focus stays inside the open sheet.
  if (e.key === 'Tab' && S.sheet) {
    const f = [...document.querySelectorAll('#sheet button, #sheet summary')]
    if (!f.length) return
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus() }
    else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus() }
    else if (!document.getElementById('sheet').contains(document.activeElement)) { e.preventDefault(); f[0].focus() }
    return
  }
  // Arrow keys move along the list in A and the rail in B.
  const group = e.target.closest?.('[data-arrows]')
  if (group && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
    const items = [...group.querySelectorAll(group.dataset.arrows === 'A' ? '.pa-trigger' : '.pb-item')]
    const i = items.indexOf(e.target)
    if (i < 0) return
    const horizontal = group.dataset.arrows === 'B' && getComputedStyle(group).flexDirection === 'row'
    const back = horizontal ? 'ArrowLeft' : 'ArrowUp', fwd = horizontal ? 'ArrowRight' : 'ArrowDown'
    let n = e.key === back ? i - 1 : e.key === fwd ? i + 1 : e.key === 'Home' ? 0 : e.key === 'End' ? items.length - 1 : null
    if (n === null) return
    e.preventDefault(); e.stopPropagation()
    n = (n + items.length) % items.length
    if (group.dataset.arrows === 'B') { S.selB = items[n].dataset.id; render() }
    document.querySelector(`[data-k="${items[n].dataset.k}"]`)?.focus()
    return
  }
  const typing = e.target.closest?.('input, textarea, select, [contenteditable="true"]')
  if (!typing && !S.sheet && !e.altKey && !e.ctrlKey && !e.metaKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); step(e.key === 'ArrowLeft' ? -1 : 1) }
})

syncUrl()
render()
</script>
</body>
</html>
