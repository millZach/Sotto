const CODEX_PATH = 'M239.184 106.203a64.716 64.716 0 0 0-5.576-53.103C219.452 28.459 191 15.784 163.213 21.74A65.586 65.586 0 0 0 52.096 45.22a64.716 64.716 0 0 0-43.23 31.36c-14.31 24.602-11.061 55.634 8.033 76.74a64.665 64.665 0 0 0 5.525 53.102c14.174 24.65 42.644 37.324 70.446 31.36a64.72 64.72 0 0 0 48.754 21.744c28.481.025 53.714-18.361 62.414-45.481a64.767 64.767 0 0 0 43.229-31.36c14.137-24.558 10.875-55.423-8.083-76.483Zm-97.56 136.338a48.397 48.397 0 0 1-31.105-11.255l1.535-.87 51.67-29.825a8.595 8.595 0 0 0 4.247-7.367v-72.85l21.845 12.636c.218.111.37.32.409.563v60.367c-.056 26.818-21.783 48.545-48.601 48.601Zm-104.466-44.61a48.345 48.345 0 0 1-5.781-32.589l1.534.921 51.722 29.826a8.339 8.339 0 0 0 8.441 0l63.181-36.425v25.221a.87.87 0 0 1-.358.665l-52.335 30.184c-23.257 13.398-52.97 5.431-66.404-17.803ZM23.549 85.38a48.499 48.499 0 0 1 25.58-21.333v61.39a8.288 8.288 0 0 0 4.195 7.316l62.874 36.272-21.845 12.636a.819.819 0 0 1-.767 0L41.353 151.53c-23.211-13.454-31.171-43.144-17.804-66.405v.256Zm179.466 41.695-63.08-36.63L161.73 77.86a.819.819 0 0 1 .768 0l52.233 30.184a48.6 48.6 0 0 1-7.316 87.635v-61.391a8.544 8.544 0 0 0-4.4-7.213Zm21.742-32.69-1.535-.922-51.619-30.081a8.39 8.39 0 0 0-8.492 0L99.98 99.808V74.587a.716.716 0 0 1 .307-.665l52.233-30.133a48.652 48.652 0 0 1 72.236 50.391v.205ZM88.061 139.097l-21.845-12.585a.87.87 0 0 1-.41-.614V65.685a48.652 48.652 0 0 1 79.757-37.346l-1.535.87-51.67 29.825a8.595 8.595 0 0 0-4.246 7.367l-.051 72.697Zm11.868-25.58 28.138-16.217 28.188 16.218v32.434l-28.086 16.218-28.188-16.218-.052-32.434Z';
// ---- icons (lucide paths, as the app draws them) ----
const ICON = {
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
  chevR: '<path d="m9 18 6-6-6-6"/>', chevD: '<path d="m6 9 6 6 6-6"/>', chevU: '<path d="m18 15-6-6-6 6"/>', check: '<path d="M20 6 9 17l-5-5"/>',
  filePen: '<path d="M12.5 22H18a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v9.5"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M13.378 15.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/>',
  terminal: '<polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/>',
  eye: '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>',
  clip: '<path d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551"/>',
  up: '<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>', more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>', edit: '<path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/>',
  mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>',
  gear: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
}
const svg = (name, size = 14, cls = '') => `<svg class="lucide ${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]}</svg>`
const codexMark = (size = 14) => `<svg class="provider-mark" data-provider="codex" width="${size}" height="${size}" viewBox="0 0 256 260" fill="currentColor" aria-hidden="true"><path d="${CODEX_PATH}"/></svg>`
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

// ---- the app's parts, with the real class names ----
function sidebar(current) {
  const rows = [
    { title: 'Visual gate flake', time: '12:41 pm', state: 'needs', words: 'Needs your approval' },
    { title: 'Streaming WAV stall', time: '10:02 am', state: '', words: 'Done' },
  ]
  const all = [current, ...rows]
  return `<aside class="mock-side" aria-label="Threads">
    <div class="mock-side__top"><span class="mock-side__logo"></span>${svg('folder', 16)}${svg('edit', 16)}</div>
    <div class="mock-side__search">${svg('search', 15)}Search threads</div>
    <div class="mock-side__group">${svg('chevD', 14)}${svg('folder', 15)}workshop<small>${all.length}</small></div>
    ${all.map((row, i) => `<div class="mock-row"${i === 0 ? ' aria-current="page"' : ''}><i data-s="${row.state}"></i><b>${esc(row.title)}</b><time>${row.time}</time>${codexMark(15)}<small data-s="${row.state}">${row.words}</small></div>`).join('')}
    <div class="mock-side__group" style="color:var(--tt-text-2)">${svg('chevR', 14)}Settled</div>
    <div class="mock-side__foot">${svg('mic', 16)}${svg('gear', 16)}</div>
  </aside>`
}
function head(title) {
  return `<header class="thread-workspace__head"><div class="thread-workspace__title">${codexMark(16)}<h2>${esc(title)}</h2>
    <span class="thread-workspace__crumb"><span>workshop</span></span></div>
    <div class="thread-workspace__actions"><button type="button" class="tt-button mock-head-btn">Watch</button><button type="button" class="pane-action" aria-label="More">${svg('more', 16)}</button></div></header>`
}
const you = (text, time) => `<article class="thread-message" data-role="user"><header><span class="thread-message__who">You</span><time>${time}</time></header><p class="thread-message__text">${text}</p></article>`
const codex = (text, time) => `<article class="thread-message" data-role="assistant"><header><span class="thread-message__who">Codex</span><time>${time}</time></header><p class="thread-message__text">${text}</p></article>`
const working = word => `<div class="thread-activity-live" data-connected><span class="thread-activity-live__line"><i class="thread-activity__pulse" data-connected aria-hidden="true"></i><span class="thread-activity-live__word">${word}</span></span></div>`

function chip({ mode = 'auto-accept-edits', label = 'Allow edits', menu = '', open = false } = {}) {
  return `<span class="thread-prompt__shield"><div class="thread-chip-menu"><button type="button" class="thread-chip tt-focusable" role="combobox" aria-label="Permissions" aria-haspopup="listbox" aria-expanded="${open}" data-permission="${mode}"><span class="thread-chip__icon" aria-hidden="true">${svg('shield', 14)}</span><span class="thread-chip__value">${label}</span>${svg('chevD', 12)}</button>${open ? menu : ''}</div></span>`
}
function composer({ placeholder = 'What would you like to do next?', face = 'send', shield = {}, effort = 'Low', effortPending = false, effortTag = '', line = '' } = {}) {
  const disc = face === 'stop'
    ? `<button type="button" class="tt-button thread-prompt__disc" data-face="stop" aria-label="Stop"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect width="10" height="10" rx="1.5" fill="currentColor"/></svg></button>`
    : `<button type="button" class="tt-button tt-button--primary thread-prompt__disc" aria-label="Send">${svg('up', 16)}</button>`
  return `<div class="thread-prompt" data-quiet>
    <div class="screenshot-input"><div><div class="prompt-editor" data-empty="true" data-placeholder="${esc(placeholder)}" role="textbox" aria-label="Message"></div></div>
      <div class="screenshot-input__tools"><button type="button" class="tt-button tt-button--ghost tt-button--icon" aria-label="Attach">${svg('clip', 16)}</button></div></div>
    <div class="thread-prompt__footer"><div class="thread-prompt__meta">${chip(shield)}
      <div class="thread-options-bar"><div class="thread-options thread-options--chips">
        <button type="button" class="thread-chip model-picker__trigger tt-focusable" aria-label="Model">${codexMark(13)}<span>GPT-6.1 Terra</span>${svg('chevD', 12)}</button>
        <span class="split-chip-effort"${effortPending ? ' data-pending' : ''}><button type="button" class="split-chip-effort__trigger tt-focusable" aria-label="Reasoning effort"><span class="split-chip-effort__word">${effort}</span></button>${effortTag}</span>
      </div></div></div>
      <div class="thread-prompt__actions">${disc}</div></div>
    ${line ? `<div class="thread-options-notices">${line}</div>` : ''}
  </div>`
}
function pane({ title, transcript, compose, questions = '' }) {
  return `<div class="thread-pane"${questions ? ' data-questions' : ''}>${head(title)}
    <div class="thread-transcript"><div class="thread-workspace__transcript"><div class="thread-transcript__content">${transcript}</div></div></div>
    <div class="thread-workspace__compose">${questions ? `<div class="thread-questions">${questions}</div>` : ''}${compose}</div></div>`
}
function win({ side, panes, size = 'desk', letter }) {
  return `<div class="mock-window" data-size="${size}">${sidebar(side)}<div class="mock-workspace">${panes.join('')}</div><span class="mock-letter" aria-label="Variant ${letter}">${letter}</span></div>`
}
const btn = (label, kind = 'secondary', extra = '') => `<button type="button" class="tt-button${kind === 'primary' ? ' tt-button--primary' : kind === 'ghost' ? ' tt-button--ghost' : ''}"${extra}>${label}</button>`

// ---- the six sections ----
const SECTIONS = [
  {
    id: '2149', title: 'Codex confirmation with no fields',
    ask: 'Computer Use and every MCP tool approval arrive as a form with no fields. Today the card says Question and offers only Write an answer, which then fails. Which card should answer it?',
    note: 'A and B are the permission card that sits in the transcript; C is the question card docked above the composer. Heading "Codex is asking" is the lead\'s draft: today a permission card\'s heading is the request\'s first line.',
    variants: { A: 'Permission card: Allow once, Deny', B: 'Permission card + quiet Cancel turn', C: 'Question card with Allow / Deny' },
    options: [{ key: 'github', on: 'GitHub tool approval', off: 'Computer Use' }],
    render(v, o) {
      const gh = o.github
      const tag = gh ? 'GitHub' : 'Computer Use'
      const message = gh ? 'Allow GitHub to run tool “create_pull_request”?' : 'Allow Computer Use to use “Sotto”?'
      const transcriptHead = gh
        ? you('Push the footer fix and open a pull request for it.', '2:14 pm') + codex('The branch is pushed. Opening the pull request through the GitHub app now.', '2:15 pm')
        : you('Open Sotto’s Settings and check that the new Reduce motion switch saves.', '2:14 pm') + codex('I’ll look at Sotto’s window with Computer Use, then flip the switch and reopen Settings.', '2:15 pm')
      const actions = v === 'A' ? btn('Allow once', 'primary') + btn('Deny')
        : v === 'B' ? btn('Allow once', 'primary') + btn('Deny') + btn('Cancel turn', 'ghost') : ''
      const card = v === 'C' ? '' : `<section class="agent-request" data-kind="permission" aria-label="Permission request for this thread">
        <div class="agent-request__body"><div class="agent-request__head"><strong>Codex is asking</strong><span class="agent-request__tag">${tag}</span></div>
        <p class="agent-request__text tt-paragraph">${message}</p>
        <div class="agent-request__actions">${actions}</div></div></section>`
      const question = v !== 'C' ? '' : `<section class="agent-request" data-kind="question" data-placement="composer" aria-label="Question from this thread">
        <div class="agent-request__toggle-row"><button type="button" class="agent-request__toggle tt-focusable" aria-label="Collapse question">${svg('chevD', 16)}</button></div>
        <div class="agent-request__body"><div class="agent-request__head"><strong>Question</strong></div>
        <p class="agent-request__text">${message}</p>
        <div class="agent-request__actions">${btn('Allow', 'primary')}${btn('Deny')}</div></div></section>`
      return win({ letter: v, side: { title: gh ? 'Footer pull request' : 'Settings switch check', time: '2:15 pm', state: 'needs', words: 'Needs your approval' },
        panes: [pane({ title: gh ? 'Footer pull request' : 'Settings switch check', transcript: transcriptHead + card, questions: question,
          compose: composer({ placeholder: v === 'C' ? 'Queued until you answer the question' : 'Queued until you answer the card', face: 'stop', shield: { mode: 'approval-required', label: 'Ask for approval' } }) })] })
    },
  },
  {
    id: '2153', title: 'A secret answer',
    ask: 'Codex can mark a form field secret (a key or a password). Should the field be masked, and may you show what you typed?',
    note: 'Left: the question, docked above the composer. Right, in a split: the Saved answer card for a secret answer whose question went away. It shows a placeholder and has no Copy answer, in both variants.',
    variants: { A: 'Masked, no show button', B: 'Masked, with a show/hide eye' },
    render(v) {
      const field = `<div class="mock-secret"><input class="agent-request__input" type="password" value="lin_api_FAKE0000000000000000" aria-label="Linear API key" autocomplete="off" spellcheck="false">${v === 'B' ? `<button type="button" class="tt-focusable" aria-label="Show answer" title="Show answer">${svg('eye', 16)}</button>` : ''}</div>
        <p class="agent-request__note tt-paragraph" style="margin:0">Codex will see this and keep it in its own session file. Sotto does not save it.</p>`
      const question = `<section class="agent-request" data-kind="question" data-placement="composer" aria-label="Question from this thread">
        <div class="agent-request__toggle-row"><button type="button" class="agent-request__toggle tt-focusable" aria-label="Collapse question">${svg('chevD', 16)}</button></div>
        <div class="agent-request__body"><form class="agent-request__form" onsubmit="return false">
        <div class="agent-request__head tt-visually-hidden"><strong>Question</strong></div>
        <fieldset class="agent-request__question"><legend><span class="agent-request__tag">Linear</span><span class="agent-request__prompt">Paste your Linear API key so the tool can read this week’s issues.</span></legend>${field}</fieldset>
        <div class="agent-request__footer"><span class="agent-request__count">Ready to send</span>${btn('Skip')}${btn('Send answer', 'primary', ' type="submit"')}</div>
        </form></div></section>`
      const left = pane({ title: 'Linear sync', transcript: you('Connect the Linear tool and pull this week’s issues.', '3:02 pm') + codex('The Linear server needs a key before it can read issues. It asked through a form.', '3:03 pm'),
        questions: question, compose: composer({ placeholder: 'Queued until you answer the question', face: 'stop' }) })
      const recovery = `<section class="agent-request request-recovery" aria-label="Saved answer">
        <div class="agent-request__head"><strong>Saved answer</strong></div>
        <p class="request-recovery__why tt-paragraph">Codex no longer shows this question. This answer was not sent.</p>
        <dl class="request-recovery__answers"><div data-empty><dt>Paste your Linear API key so the tool can read this week’s issues.</dt><dd>Hidden answer</dd></div></dl>
        <div class="request-recovery__actions"><div class="agent-request__actions">${btn('Discard', 'ghost')}</div></div></section>`
      const right = pane({ title: 'Linear sync, Monday', transcript: you('Pull Monday’s Linear issues into a list.', '9:40 am') + codex('The Linear server asked for a key, then the turn was stopped before you answered.', '9:41 am') + recovery,
        compose: composer({}) })
      return win({ letter: v, side: { title: 'Linear sync', time: '3:03 pm', state: 'needs', words: 'Needs your answer' }, panes: [left, right] })
    },
  },
  {
    id: '2154', title: 'Typed fields in a form',
    ask: 'A Codex form can ask for a yes-or-no, a number and a pick-several list. Today Sotto says it cannot show them. How should they look?',
    note: 'B pre-selects each field’s default and marks it. Sotto’s card has no pre-selected choice today, so B also means seeding the draft on the desktop and both phones. The audit recommends A, with the default named in words if Zach wants it.',
    variants: { A: 'Yes / No, range in words, check rows', B: 'True / False, defaults chosen and marked' },
    render(v) {
      const b = v === 'B'
      const radio = (name, label, checked, def) => `<label class="agent-request__option"${checked ? ' data-checked' : ''}><input type="radio" name="${name}"${checked ? ' checked' : ''}><span><span class="agent-request__label">${label}${def ? '<span class="mock-default">(default)</span>' : ''}</span></span></label>`
      const box = (label, checked, def) => `<label class="agent-request__option"${checked ? ' data-checked' : ''}><input type="checkbox"${checked ? ' checked' : ''}><span><span class="agent-request__label">${label}${def ? '<span class="mock-default">(default)</span>' : ''}</span></span></label>`
      const q1 = `<fieldset class="agent-request__question"><legend><span class="agent-request__prompt">Open it as a draft?</span></legend><div class="agent-request__options">
        ${b ? radio('d', 'True', true, true) + radio('d', 'False', false) : radio('d', 'Yes', false) + radio('d', 'No', false)}</div></fieldset>`
      const q2 = `<fieldset class="agent-request__question"><legend><span class="agent-request__prompt">How many reviewers should it ask?</span><span class="agent-request__optional">Optional</span></legend>
        <span class="agent-request__note">${b ? 'A whole number from 1 to 5. Default: 2.' : 'A whole number from 1 to 5.'}</span>
        <textarea class="agent-request__input" rows="1" aria-label="How many reviewers should it ask?" placeholder="Type your answer…">${b ? '2' : ''}</textarea></fieldset>`
      const q3 = `<fieldset class="agent-request__question"><legend><span class="agent-request__prompt">Which labels should it add?</span></legend><span class="agent-request__note">Choose any that apply.</span>
        <div class="agent-request__options">${box('release', b, b)}${box('docs', false)}${box('needs-review', false)}</div></fieldset>`
      const question = `<section class="agent-request" data-kind="question" data-placement="composer" aria-label="Questions from this thread">
        <div class="agent-request__toggle-row"><button type="button" class="agent-request__toggle tt-focusable" aria-label="Collapse question">${svg('chevD', 16)}</button></div>
        <div class="agent-request__body"><form class="agent-request__form" onsubmit="return false">
        <div class="agent-request__head"><strong>3 questions</strong><span class="agent-request__tag">GitHub</span></div>${q1}${q2}${q3}
        <div class="agent-request__footer"><span class="agent-request__count">${b ? 'Ready to send' : 'Choose an answer'}</span>${btn('Skip')}${btn('Send answers', 'primary', ' type="submit"')}</div>
        </form></div></section>`
      return win({ letter: v, side: { title: 'Release pull request', time: '4:20 pm', state: 'needs', words: 'Needs your answer' },
        panes: [pane({ title: 'Release pull request', transcript: you('Open the release pull request for 0.1.44.', '4:18 pm') + codex('The GitHub server sent a short form about the pull request before it opens it.', '4:20 pm'),
          questions: question, compose: composer({ placeholder: 'Queued until you answer the question', face: 'stop' }) })] })
    },
  },
  {
    id: '2159', title: 'A denied file change',
    ask: 'You pressed Deny on a file Codex wanted to create. The turn then said it changed that file. After the fix it is not counted; what should its row say?',
    note: 'The first turn’s steps are open. Its denied row is muted rather than red, since nothing failed: that colour is the mock-up’s guess. The lead’s brief asked for a “Changed 0 files” header, but Sotto draws no Changed line when the count is zero, so the denied turn has none. The later turn shows a change that went through.',
    variants: { A: '“Denied”', B: '“Not applied”', C: '“Declined”' },
    render(v) {
      const word = { A: 'Denied', B: 'Not applied', C: 'Declined' }[v]
      const row = (icon, lead, subject, meta, status = 'completed') => `<li class="thread-activity__row" data-kind="${icon === 'terminal' ? 'command' : 'file-change'}" data-status="${status}"><button type="button" class="thread-activity__toggle tt-focusable" aria-expanded="false">
        ${svg(icon, 15, 'thread-activity__icon')}<span class="thread-activity__label">${lead ? `<span class="thread-activity__lead">${lead} </span>` : ''}<span class="thread-activity__subject thread-activity__subject--mono">${subject}</span></span>
        <span class="thread-activity__meta" data-status="${status}">${meta}</span>${svg('chevR', 14, 'thread-activity__chevron')}</button></li>`
      const turn1 = `<section class="thread-work" data-expanded>
        <button type="button" class="thread-work__summary tt-focusable" aria-expanded="true"><span class="thread-work__headline">Worked for 38s · 2 steps</span>${svg('chevR', 14, 'thread-activity__chevron')}</button>
        <div class="thread-work__body"><section class="thread-activity" data-expanded>
          <button type="button" class="thread-activity__summary tt-focusable" aria-expanded="true">${svg('chevR', 14, 'thread-activity__chevron')}<span class="thread-activity__counts">Ran 1 command</span></button>
          <ul class="thread-activity__rows">${row('filePen', 'Created', 'tests/example.test.ts', word, 'declined')}${row('terminal', '', 'npm test -- example', '2.1s')}</ul></section></div></section>`
      const turn2 = `<section class="thread-work">
        <button type="button" class="thread-work__summary tt-focusable" aria-expanded="false"><span class="thread-work__headline">Worked for 21s · 2 steps</span>${svg('chevR', 14, 'thread-activity__chevron')}</button>
        <div class="thread-changes"><button type="button" class="thread-changes__summary tt-focusable" aria-expanded="false">${svg('filePen', 14, 'thread-activity__icon')}<span>Changed 1 file</span>${svg('chevR', 14, 'thread-activity__chevron')}</button></div></section>`
      return win({ letter: v, side: { title: 'Example test', time: '5:12 pm', state: '', words: 'Done' },
        panes: [pane({ title: 'Example test', transcript: you('Add a test for the example module.', '5:06 pm') + turn1
          + codex('You declined the new test file, so nothing was written. Should it go next to the module instead?', '5:07 pm')
          + you('Yes, put it next to the module.', '5:11 pm') + turn2 + codex('Added src/example/example.test.ts. The three tests pass.', '5:12 pm'),
          compose: composer({}) })] })
    },
  },
  {
    id: '2161', title: 'The Codex permission menu',
    ask: 'The four modes say nothing about what Codex does under each. One line or two under each name, and a line at the foot?',
    note: 'Shown at the 820 × 560 minimum window. The real list opens from the shield’s left edge, which near the composer’s right end would run past the pane; the mock-up opens it from the shield’s right edge so it can be read. Copy is the audit’s draft for Codex 0.166.0.',
    variants: { A: 'One line under each mode', B: 'Two short lines under each mode' },
    options: [{ key: 'foot', on: 'Foot line on', off: 'Foot line off' }],
    size: 'min',
    render(v, o) {
      const lines = v === 'A' ? {
        'approval-required': 'Codex asks before every command, even one that only reads, and before every edit.',
        'auto-accept-edits': 'Codex edits files and runs commands in the project without asking. It asks before going online or outside the project.',
        auto: 'As Allow edits, but Codex’s own reviewer, a model run by OpenAI, answers what would come to you.',
        'full-access': 'Codex runs any command and edits any file without asking, anywhere on this computer and online.',
      } : {
        'approval-required': 'Codex asks before every command and every edit.<br>Even a command that only reads waits for you.',
        'auto-accept-edits': 'Codex edits and runs commands in the project without asking.<br>Going online, outside the project or committing asks you.',
        auto: 'Codex works in the project without asking.<br>Anything beyond it goes to Codex’s own reviewer, a model run by OpenAI, not to you.',
        'full-access': 'Codex runs anything and edits anything without asking.<br>The whole computer and the internet, with no sandbox.',
      }
      const names = { 'approval-required': 'Ask for approval', 'auto-accept-edits': 'Allow edits', auto: 'Auto', 'full-access': 'Full access' }
      const selected = 'auto-accept-edits'
      const options = Object.keys(names).map(id => `<button type="button" role="option" aria-selected="${id === selected}"><span>${names[id]}<small class="tt-paragraph">${lines[id]}</small></span>${id === selected ? svg('check', 14) : ''}</button>`).join('')
      const foot = 'In every mode, Codex’s questions come to you, and each 3D model while Ask before each 3D model is on.'
      const menu = o.foot
        ? `<div class="thread-chip-menu__list thread-chip-menu__list--foot"><div role="listbox" aria-label="Permissions" class="thread-chip-menu__options">${options}</div><p class="thread-chip-menu__foot">${foot}</p></div>`
        : `<div role="listbox" aria-label="Permissions" class="thread-chip-menu__list">${options}</div>`
      return win({ letter: v, size: 'min', side: { title: 'Footer links', time: '12:39 pm', state: '', words: 'Done' },
        panes: [pane({ title: 'Footer links', transcript: you('Fix the footer links; they point at the old docs path.', '12:38 pm') + codex('Fixed the three footer links in site/footer.html. The help page now loads.', '12:39 pm'),
          compose: composer({ shield: { mode: selected, label: names[selected], open: true, menu } }) })] })
    },
  },
  {
    id: '2158', title: 'A choice for the next turn',
    ask: 'While a turn runs, the chips can’t be pressed today. If they can, and the change waits for the next turn, how does the composer say so?',
    note: 'You pressed Medium while the turn runs on Low. The line under the bar sits where the quiet composer puts what it says about its chips. In the quiet composer the effort chip marks a pending value only by fading to 70%; A shows that as it is. Keep current settings puts the choice away.',
    variants: { A: 'Chip shows the queued value, faded', B: 'Chip keeps Low, “next: Medium” tag' },
    render(v) {
      const line = `<p class="thread-options__notice tt-paragraph" style="color:var(--tt-text-muted)"><span>This turn runs on GPT-6.1 Terra, Low effort, Auto. The next turn starts on Medium effort.</span><button type="button" class="tt-focusable">Keep current settings</button></p>`
      return win({ letter: v, side: { title: 'Effort sweep', time: '1m 12s', state: 'work', words: 'Working' },
        panes: [pane({ title: 'Effort sweep', transcript: you('Go through the effort picker and list every place it reads the model’s default.', '6:30 pm') + working('Combing the desert'),
          compose: composer({ placeholder: 'Codex is working. Write a follow-up to queue it.', face: 'stop', shield: { mode: 'auto', label: 'Auto' },
            effort: v === 'A' ? 'Medium' : 'Low', effortPending: v === 'A', effortTag: v === 'B' ? '<span class="mock-next-tag">next: Medium</span>' : '', line }) })] })
    },
  },
]

// ---- state, hash and switching ----
const state = Object.fromEntries(SECTIONS.map(s => [s.id, { v: 'A', o: Object.fromEntries((s.options ?? []).map(opt => [opt.key, false])) }]))
let active = SECTIONS[0].id
const bare = new URLSearchParams(location.search).has('bare')
if (bare) document.documentElement.dataset.bare = ''

function hashFor(id) { const st = state[id]; return `#${id}-${st.v}${Object.entries(st.o).filter(([, on]) => on).map(([k]) => '-' + k).join('')}` }
function readHash() {
  const m = /^#(\d{4})-([ABC])((?:-[a-z]+)*)$/.exec(location.hash)
  if (!m || !state[m[1]]) return null
  const s = SECTIONS.find(x => x.id === m[1])
  if (!s.variants[m[2]]) return null
  state[m[1]].v = m[2]
  for (const k of Object.keys(state[m[1]].o)) state[m[1]].o[k] = m[3].split('-').includes(k)
  return m[1]
}
function renderSection(s) {
  const el = document.getElementById('s' + s.id)
  const st = state[s.id]
  el.querySelector('.proto-slot').innerHTML = s.render(st.v, st.o)
  el.querySelectorAll('[data-pick]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.pick === st.v)))
  el.querySelectorAll('[data-opt]').forEach(b => { const on = st.o[b.dataset.opt]; b.setAttribute('aria-pressed', String(on)); const opt = s.options.find(x => x.key === b.dataset.opt); b.textContent = on ? opt.on : opt.off })
  // Transcripts open at their foot, as a live thread does.
  el.querySelectorAll('.thread-workspace__transcript').forEach(t => { t.scrollTop = t.scrollHeight })
}
function build() {
  const main = document.getElementById('sections')
  main.innerHTML = SECTIONS.map(s => `<section class="proto-sec" id="s${s.id}" data-sec="${s.id}">
    <div class="proto-sec__head"><h2>#${s.id} <span>·</span> ${s.title}</h2><p class="proto-sec__ask">${s.ask}</p><p class="proto-sec__note">${s.note}</p>
      <div class="proto-pick">${Object.entries(s.variants).map(([k, name]) => `<button type="button" data-pick="${k}"><b>${k}</b> — ${name}</button>`).join('')}
      ${(s.options ?? []).map(opt => `<span class="proto-pick__sep"></span><button type="button" data-opt="${opt.key}"></button>`).join('')}</div></div>
    <div class="proto-slot"></div></section>`).join('')
  for (const s of SECTIONS) {
    const el = document.getElementById('s' + s.id)
    el.addEventListener('click', e => {
      const pick = e.target.closest('[data-pick]'), opt = e.target.closest('[data-opt]')
      if (pick) { state[s.id].v = pick.dataset.pick; select(s.id) }
      if (opt) { state[s.id].o[opt.dataset.opt] = !state[s.id].o[opt.dataset.opt]; select(s.id) }
    })
    renderSection(s)
  }
  const sel = document.getElementById('bar-sec')
  sel.innerHTML = SECTIONS.map(s => `<option value="${s.id}">#${s.id} ${s.title}</option>`).join('')
  sel.addEventListener('change', () => { active = sel.value; syncBar(); history.replaceState(null, '', location.search + hashFor(active)); document.getElementById('s' + active).scrollIntoView({ behavior: 'smooth' }) })
}
function select(id) {
  active = id
  const s = SECTIONS.find(x => x.id === id)
  renderSection(s)
  syncBar()
  history.replaceState(null, '', location.search + hashFor(id))
}
function cycle(step) {
  const s = SECTIONS.find(x => x.id === active), keys = Object.keys(s.variants)
  state[active].v = keys[(keys.indexOf(state[active].v) + step + keys.length) % keys.length]
  select(active)
}
function syncBar() {
  const s = SECTIONS.find(x => x.id === active), st = state[active]
  document.getElementById('bar-sec').value = active
  document.getElementById('bar-letters').innerHTML = Object.keys(s.variants).map(k => `<button type="button" data-bar="${k}" aria-pressed="${k === st.v}">${k}</button>`).join('')
  document.getElementById('bar-label').textContent = `${st.v} — ${s.variants[st.v]}`
  document.querySelectorAll('.proto-sec').forEach(el => el.toggleAttribute('data-active', el.dataset.sec === active))
}
document.getElementById('bar-letters').addEventListener('click', e => { const b = e.target.closest('[data-bar]'); if (b) { state[active].v = b.dataset.bar; select(active) } })
document.getElementById('bar-prev').addEventListener('click', () => cycle(-1))
document.getElementById('bar-next').addEventListener('click', () => cycle(1))
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select, [contenteditable]')) return
  if (e.key === 'ArrowLeft') { e.preventDefault(); cycle(-1) } else if (e.key === 'ArrowRight') { e.preventDefault(); cycle(1) }
})
function setTheme(light) {
  document.documentElement.dataset.theme = light ? 'light' : 'dark'
  for (const id of ['bar-theme', 'theme-top']) document.getElementById(id).textContent = light ? 'Dark' : 'Light'
}
for (const id of ['bar-theme', 'theme-top']) document.getElementById(id).addEventListener('click', () => setTheme(document.documentElement.dataset.theme !== 'light'))
if (new URLSearchParams(location.search).get('theme') === 'light') setTheme(true)

build()
const fromHash = readHash()
if (fromHash) { active = fromHash; renderSection(SECTIONS.find(x => x.id === fromHash)) }
syncBar()
if (fromHash && !bare) requestAnimationFrame(() => document.getElementById('s' + fromHash).scrollIntoView())
window.addEventListener('hashchange', () => { const id = readHash(); if (id) { select(id); if (!bare) document.getElementById('s' + id).scrollIntoView() } })
// The section in view is the one the bar switches.
if (!bare) {
  const seen = new Map()
  const io = new IntersectionObserver(entries => {
    for (const e of entries) seen.set(e.target.dataset.sec, e.intersectionRatio)
    const best = [...seen.entries()].sort((a, b) => b[1] - a[1])[0]
    if (best && best[1] > 0 && best[0] !== active) { active = best[0]; syncBar() }
  }, { threshold: [0, .25, .5, .75, 1] })
  document.querySelectorAll('.proto-sec').forEach(el => io.observe(el))
}
</script>
