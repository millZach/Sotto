  .thread-greeting h3 { font-size: var(--tt-type-figure); }
}

.thread-draft-notice { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-inset); font-size: var(--tt-type-small); color: var(--tt-text-muted); }
.thread-draft-notice p { margin: 0; }
.thread-draft-notice strong { color: var(--tt-text); font-weight: 500; }

.thread-history-status { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; color: var(--tt-text-muted); font-size: var(--tt-type-small); padding: 14px 0; }
.thread-history-skeleton { display: grid; gap: 28px; padding: 20px 0; }
.thread-history-skeleton i { display: block; height: 56px; width: 72%; border-radius: var(--tt-radius-inset); background: linear-gradient(110deg, var(--tt-skeleton-a, #111713), var(--tt-skeleton-b, #19201c), var(--tt-skeleton-a, #111713)); }
.thread-history-skeleton i:nth-child(2) { margin-left: auto; width: 55%; }

/* Narrow windows (the 760px minimum): a slimmer sidebar, the same 44px header, same type sizes. */
@media (max-width: 980px) {
  .thread-workspace__head { padding-left: 14px; }
  /* The project crumb is the first thing a narrow row gives up; the thread's name is what identifies the pane. */
  .thread-workspace__crumb { display: none; }
  /* The project name may give way; the working-copy control remains a keyboard-accessible action. */
  .thread-workspace__crumb[data-has-working-copy] { display: flex; flex: 0 1 auto; min-width: 32px; }
  .thread-workspace__crumb[data-has-working-copy]::before, .thread-workspace__crumb[data-has-working-copy] > :not(.working-copy) { display: none; }
  .thread-workspace__crumb .working-copy__trigger { max-width: 160px; }
  .thread-workspace__transcript { padding: 22px 18px; }
  .thread-workspace__compose { padding: 8px 16px 16px; }
  .thread-message[data-role='user'] { margin-left: 24px; }
}
/* Short windows and large display scaling: the transcript keeps the height, the type keeps its size. */
@media (max-height: 760px) {
  .thread-workspace__transcript { padding-block: 18px; }
  .thread-workspace__compose { padding-block: 6px 12px; }
  /* The header is already one row at its smallest; the transcript and composer share what is left. */
  .thread-pane > .thread-transcript { min-height: min(120px, 24%); }
  .thread-prompt { padding: 10px 14px 8px; }
  .thread-prompt .prompt-editor { min-height: 36px; max-height: 150px; }
  .thread-workspace__compose .thread-options-bar .thread-options { row-gap: 0; }
  .thread-workspace__compose .thread-options-bar > small { margin-top: 0; }
  /* Attached images are shorter, so the card keeps its prompt and actions above the footer; Point at something's picture
     (ADR-0154) puts its name and comment beside the picture rather than under it. */
  .threads-view .thread-workspace__compose .screenshot-previews { margin-top: 8px; }
  .threads-view .thread-workspace__compose .screenshot-previews img, .threads-view .thread-workspace__compose .screenshot-previews__placeholder { height: 48px; }
  .threads-view .thread-workspace__compose .screenshot-previews figure[data-pointed] { display: grid; grid-template-columns: 128px minmax(0, 1fr); align-items: center; gap: 8px; width: 280px; max-width: 100%; }
  .threads-view .thread-workspace__compose .screenshot-previews figure[data-pointed] figcaption { margin-top: 0; }
}

/* The copy control's reveal and check pop are motion; reduced motion keeps them instant. */
@media (prefers-reduced-motion: reduce) {
  .thread-message__copy { transition: none; }
  .thread-message__copy[data-copied] svg { animation: none; }
}
:root[data-reduced-motion='on'] .thread-message__copy { transition: none; }
:root[data-reduced-motion='on'] .thread-message__copy[data-copied] svg { animation: none; }
/* ==== agents/activity.css ==== */
/* Provider activity inside the transcript: a quiet ledger under the message it followed.
   Type: row labels 14px, commands and paths 13px mono, meta 13px tabular. Messages stay the 16px focus.
   Colour: accent only for running work, error ink for failures, muted words for stopped or unknown. */

.thread-activity { margin: 0 0 24px; }
/* A finished turn folds its work to one line above the final reply, with a rule between the two. */
.thread-work { margin: 0 0 20px; border-bottom: 1px solid var(--threads-field-border); }
.thread-message + .thread-work { margin-top: -8px; }
.thread-work__summary {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 32px; margin: 0 0 8px -6px; padding: 0 8px 0 6px;
  border: 0; border-radius: var(--tt-radius-row); background: transparent; color: var(--tt-text-muted); font: inherit; font-size: var(--tt-type-body); font-variant-numeric: tabular-nums; text-align: left;
  transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
}
.thread-work__summary:hover { background: var(--tt-hover); color: var(--tt-text-2); }
.thread-work__summary:active:not(:disabled) { background: var(--tt-hover-strong); color: var(--tt-text-2); }
.thread-work__body { padding: 8px 0 4px; }
.thread-work__body > .thread-activity:last-child { margin-bottom: 12px; }
/* A question a folded reply asked, quoted under the fold so it is read; its words say the reply wanted the user. */
.thread-lifted { display: grid; justify-items: start; gap: 6px; margin: -6px 0 24px; padding: 12px 16px; border-radius: var(--tt-radius-lg); background: var(--tt-surface-sunken); }
.thread-lifted__who { margin: 0; color: var(--tt-text-muted); font-size: var(--tt-type-caption); font-variant-numeric: tabular-nums; }
.thread-lifted__questions { display: grid; gap: 6px; margin: 0; color: var(--tt-text); font-size: var(--tt-type-reading); line-height: 1.5; overflow-wrap: anywhere; }
.thread-lifted__questions > p { margin: 0; }
.thread-lifted__questions code { padding: 1px 5px; border: 1px solid var(--tt-code-border, var(--tt-border-faint)); border-radius: var(--tt-radius-tag); background: var(--tt-code-bg, var(--tt-surface)); font-family: var(--tt-font-mono); font-size: var(--tt-type-small); }
.thread-lifted__more { margin: 0; color: var(--tt-text-muted); font-size: var(--tt-type-small); }
.thread-lifted__where {
  min-height: 24px; padding: 0; border: 0; border-radius: var(--tt-radius-mark); background: transparent; color: var(--tt-link); font: inherit; font-size: var(--tt-type-small); font-weight: 600;
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
}
/* The reply Show where it asked reached, marked for a moment; its focus ring sits outside the mark. */
.thread-message[data-sought] { border-radius: var(--tt-radius-mark); background: color-mix(in srgb, var(--tt-attention) 12%, transparent); box-shadow: 0 0 0 10px color-mix(in srgb, var(--tt-attention) 12%, transparent); }
.thread-message[tabindex='-1']:focus-visible { outline-offset: 12px; border-radius: var(--tt-radius-mark); }
.thread-message + .thread-activity, .thread-message + .thread-activity-live, .thread-activity + .thread-activity-live { margin-top: -14px; }

.thread-activity__summary {
  display: inline-flex; align-items: center; gap: 8px; max-width: 100%; min-height: 32px; margin: 0 0 0 -6px; padding: 0 10px 0 6px;
  border: 0; border-radius: var(--tt-radius-row); background: transparent; color: var(--tt-text-muted); font: inherit; font-size: var(--tt-type-body); text-align: left;
  transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
}
.thread-activity__summary:hover { background: var(--tt-hover); color: var(--tt-text-2); }
button.thread-activity__summary:active:not(:disabled) { background: var(--tt-hover-strong); color: var(--tt-text-2); }
.thread-activity__summary--static { cursor: default; }
.thread-activity__summary--static:hover { background: transparent; }
.thread-activity__summary--static[data-status='failed'] .thread-activity__chevron { color: var(--tt-error); }
.thread-activity__headline { flex: none; color: var(--tt-text-2); font-weight: 500; font-variant-numeric: tabular-nums; }
.thread-activity__counts { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thread-activity__chevron { flex: none; color: var(--tt-text-muted); transition: transform .16s ease; }
[aria-expanded='true'] > .thread-activity__chevron { transform: rotate(90deg); }

.thread-activity__rows { margin: 2px 0 0 1px; padding: 0 0 0 10px; border-left: 1px solid var(--tt-hairline); list-style: none; }
.thread-activity[data-live] .thread-activity__rows { margin-top: 0; }
.thread-activity__row { margin: 0; }
.thread-activity__toggle {
  display: grid; grid-template-columns: 16px minmax(0, 1fr) auto 14px; align-items: center; gap: 8px; width: 100%; min-height: 32px; padding: 3px 6px;
  border: 0; border-radius: var(--tt-radius-control); background: transparent; color: var(--tt-text-2); font: inherit; font-size: var(--tt-type-body); line-height: 1.4; text-align: left;
}
button.thread-activity__toggle { transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease; }
button.thread-activity__toggle:hover { background: var(--tt-hover); }
button.thread-activity__toggle:active:not(:disabled) { background: var(--tt-hover-strong); }
.thread-activity__icon { color: var(--tt-text-muted); }
.thread-activity__label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thread-activity__lead { color: var(--tt-text-muted); }
.thread-activity__subject { color: var(--tt-text-2); }
.thread-activity__subject--mono { color: var(--tt-text); font-family: var(--tt-font-mono); font-size: var(--tt-type-small); }
.thread-activity__preview { color: var(--tt-text-muted); }
.thread-activity__meta { display: inline-flex; align-items: center; gap: 6px; color: var(--tt-text-muted); font-size: var(--tt-type-small); font-variant-numeric: tabular-nums; white-space: nowrap; }
.thread-activity__meta[data-status='running'][data-connected] { color: var(--tt-activity); }
.thread-activity__meta[data-status='failed'] { color: var(--tt-error); }
.thread-activity__row[data-status='failed'] .thread-activity__icon { color: var(--tt-error); }
.thread-activity__clock { font-variant-numeric: tabular-nums; }

.thread-activity__pulse { display: inline-block; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--tt-activity); }
.thread-activity__pulse:not([data-connected]) { background: var(--tt-text-muted); }

.thread-activity__earlier { margin: 0; }
.thread-activity__more { min-height: 32px; padding: 0 6px; border: 0; border-radius: var(--tt-radius-control); background: transparent; color: var(--tt-text-muted); font: inherit; font-size: var(--tt-type-small); transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease; }
.thread-activity__more:hover { background: var(--tt-hover); color: var(--tt-text-2); }
.thread-activity__more:active:not(:disabled) { background: var(--tt-hover-strong); color: var(--tt-text-2); }

/* Details line up with the row label, past the icon. */
.thread-activity__details { display: grid; gap: 8px; margin: 2px 0 12px 30px; min-width: 0; }
.thread-activity__details .rich-message { font-size: var(--tt-type-body); line-height: 1.6; }
.thread-activity__details .rich-code { margin: 0; }
.thread-activity__details .rich-code__scroll { max-height: 320px; overflow: auto; font-size: var(--tt-type-small); }
.thread-activity__details .rich-message .rich-message__feedback { margin-top: 4px; }
.thread-activity__fact { margin: 0; color: var(--tt-text-muted); font-size: var(--tt-type-small); line-height: 1.5; overflow-wrap: anywhere; }
.thread-activity__fact code { color: var(--tt-text-2); font-family: var(--tt-font-mono); font-size: var(--tt-type-small); }
.thread-activity__text { margin: 0; color: var(--tt-text-2); font-size: var(--tt-type-body); line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.thread-activity__error { margin: 0; color: var(--tt-error); font-size: var(--tt-type-body); line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.thread-activity__error--turn { margin: 2px 0 4px; }
.thread-activity__rows--nested { margin: 0 0 10px 30px; }
.thread-activity__open > .thread-activity__details:last-child { margin-bottom: 12px; }
.thread-activity__open > .thread-activity__details:not(:last-child) { margin-bottom: 6px; }
.thread-activity__change { display: grid; gap: 6px; min-width: 0; }
/* A plan reads as a checklist: a mark per step, done steps quietened and struck through. */
.thread-activity__steps { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; font-size: var(--tt-type-body); }
.thread-activity__steps li { display: grid; grid-template-columns: 13px minmax(0, 1fr); align-items: baseline; gap: 8px; color: var(--tt-text-2); }
.thread-activity__step-mark { width: 11px; height: 11px; border: 1.5px solid var(--tt-text-muted); border-radius: 50%; }
.thread-activity__steps li[data-status='running'] .thread-activity__step-mark { border-color: var(--tt-activity); background: var(--tt-activity); }
.thread-activity__steps li[data-status='completed'] .thread-activity__step-mark { border-color: var(--tt-text-muted); background: var(--tt-text-muted); }
.thread-activity__steps li[data-status='completed'] .thread-activity__step-text { color: var(--tt-text-muted); text-decoration: line-through; }
.thread-activity__step-text { min-width: 0; line-height: 1.5; overflow-wrap: anywhere; }
.thread-activity__agents { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; font-size: var(--tt-type-body); }
.thread-activity__agents li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; min-width: 0; }
.thread-activity__agent { color: var(--tt-text-2); }
.thread-activity__agent-status { color: var(--tt-text-muted); font-size: var(--tt-type-small); }
.thread-activity__agents[data-connected] li:is([data-status='running'], [data-status='active']) .thread-activity__agent-status { color: var(--tt-activity); }
.thread-activity__agents li:is([data-status='errored'], [data-status='failed']) .thread-activity__agent-status { color: var(--tt-error); }
.thread-activity__agent-message { flex-basis: 100%; color: var(--tt-text-muted); font-size: var(--tt-type-small); white-space: pre-wrap; overflow-wrap: anywhere; }

/* The working line at the end of a running turn: the working words, with the turn's steps folded under them. */
.thread-activity-live { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; min-height: 32px; margin: 0 0 24px; color: var(--tt-text-2); font-size: var(--tt-type-body); }
.thread-activity-live__line {
  display: inline-flex; align-items: center; gap: 8px; max-width: 100%; min-height: 32px; margin-left: -6px; padding: 0 10px 0 6px;
  border: 0; border-radius: var(--tt-radius-row); background: transparent; color: inherit; font: inherit; text-align: left;
}
button.thread-activity-live__line { transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease; }
button.thread-activity-live__line:hover { background: var(--tt-hover); }
button.thread-activity-live__line:active:not(:disabled) { background: var(--tt-hover-strong); }
.thread-activity-live__state { flex: none; font-variant-numeric: tabular-nums; }
/* Words change in place, so the line's own width must not shift with them. */
.thread-activity-live__word { position: relative; display: inline-block; }
.thread-activity-live__steps { flex-basis: 100%; min-width: 0; }
.thread-activity-live__steps > .thread-activity { margin: 0; }

/* A tip under the working words (ADR-0159; Zach's pick, variant B of docs/prototypes/thread-tips-prototype.html with a
   lightbulb for the word "Tip"): hooked to the words, muted and a size down, with Try it and Hide after its words. */
.thread-tip { display: flex; flex-basis: 100%; align-items: flex-start; gap: 6px; min-width: 0; margin: -6px 0 0; color: var(--tt-text-muted); font-size: var(--tt-type-small); line-height: 1.5; }
.thread-tip__hook { flex: none; width: 10px; height: 13px; margin-top: 1px; border-bottom: 1px solid var(--tt-hairline); border-left: 1px solid var(--tt-hairline); border-bottom-left-radius: var(--tt-radius-tag); }
/* Centred on the first line's words: 1px of padding over the text, then half of what the 20.25px line leaves round 14px. */
.thread-tip__bulb { flex: none; margin-top: 4px; color: var(--tt-text-2); }
.thread-tip__text { min-width: 0; padding-top: 1px; overflow-wrap: anywhere; }
.thread-tip code { padding: 0 4px; border: 1px solid var(--tt-code-border, var(--tt-border-faint)); border-radius: var(--tt-radius-tag); background: var(--tt-code-bg, var(--tt-surface)); color: var(--tt-text-2); font-family: var(--tt-font-mono); font-size: var(--tt-type-caption); }
.thread-tip kbd { padding: 0 4px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-tag); color: var(--tt-text-2); font: inherit; font-size: var(--tt-type-caption); }
.thread-tip .tt-shortcut { display: inline-flex; gap: 2px; align-items: baseline; }
/* The shared shortcut chip is 24px tall; in a tip it keeps inside the line, so the words stay level with the lightbulb. */
.thread-tip .tt-shortcut kbd { padding: 0 4px; line-height: 1.35; }
.thread-tip__actions { display: inline-flex; align-items: center; gap: 2px; margin-left: 6px; vertical-align: middle; }
.thread-tip__try {
  min-height: 24px; padding: 0 4px; border: 0; border-radius: var(--tt-radius-tag); background: transparent; color: var(--tt-text-2); font: inherit; font-size: var(--tt-type-small); font-weight: 600;
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
}
.thread-tip__try:hover { color: var(--tt-text); }
/* `min-height: 0` lets go of every button's 30px floor, which made the first line taller than the words. */
.thread-tip__hide { display: inline-grid; place-items: center; width: 24px; height: 24px; min-height: 0; padding: 0; border: 0; border-radius: var(--tt-radius-control); background: transparent; color: var(--tt-text-muted); }
.thread-tip__hide:hover { background: var(--tt-hover); color: var(--tt-text); }
@media (prefers-reduced-motion: no-preference) {
  :root:not([data-reduced-motion='on']) .thread-tip { animation: thread-tip-in .3s ease-out; }
}
@keyframes thread-tip-in { from { opacity: 0; } }

@media (prefers-reduced-motion: no-preference) {
  :root:not([data-reduced-motion='on']) .thread-activity__pulse[data-connected] { animation: thread-activity-pulse 1.6s ease-in-out infinite; }
  :root:not([data-reduced-motion='on']) .thread-message[tabindex='-1'] { transition: background-color .5s ease, box-shadow .5s ease; }
}
@keyframes thread-activity-pulse { 50% { opacity: .35; } }
/* While the agent works, a slow band of light crosses the words, then rests, and the dot steps aside for it. The words
   keep their muted ink; a lit copy of them in the accent at its most vivid shows only inside the moving band, so the
   letters themselves light up at full strength on every theme rather than taking a tint, with no halo (Zach's pick,
   variant A of docs/prototypes/working-words-glow-strength-prototype.html). Under reduced motion the words hold still
   and the dot stays, still. */
@media (prefers-reduced-motion: no-preference) {
  :root:not([data-reduced-motion='on']) .thread-activity-live[data-connected] .thread-activity-live__word { color: var(--tt-text-muted); }
  :root:not([data-reduced-motion='on']) .thread-activity-live[data-connected] .thread-activity-live__word::after {
    content: attr(data-word); position: absolute; inset: 0; color: var(--tt-working-light); pointer-events: none; white-space: nowrap;
    -webkit-mask: linear-gradient(100deg, transparent 38%, black 45%, black 55%, transparent 62%) 100% 0 / 300% 100% no-repeat;
    mask: linear-gradient(100deg, transparent 38%, black 45%, black 55%, transparent 62%) 100% 0 / 300% 100% no-repeat;
    animation: thread-activity-glow 4.2s cubic-bezier(.45, 0, .55, 1) infinite;
  }
  :root:not([data-reduced-motion='on']) .thread-activity-live[data-connected] > .thread-activity-live__line:has(.thread-activity-live__word) > .thread-activity__pulse { display: none; }
}
@keyframes thread-activity-glow { 0% { -webkit-mask-position: 100% 0; mask-position: 100% 0; } 72%, 100% { -webkit-mask-position: 0% 0; mask-position: 0% 0; } }
@media (prefers-reduced-motion: reduce) { .thread-activity__chevron { transition: none; } }
:root[data-reduced-motion='on'] .thread-activity__chevron { transition: none; }

/* The browser line (ADR-0154; Owl only): a run of the agent's calls to Sotto's browser as one quiet line, and under it on
   a press the steps in plain words. The dot holds still; a step that did not work takes a muted warning ink. The lines sit
   in a block, not a shrink-to-fit box, which would size each line to its margin box and cut its words by its negative margin. */
.thread-browser-lines { min-width: 0; margin: 0 0 20px; }
.thread-message + .thread-browser-lines { margin-top: -12px; }
.thread-browser { min-width: 0; max-width: 100%; margin: 0; }
.thread-browser__line {
  display: inline-flex; align-items: center; gap: 8px; max-width: 100%; min-height: 32px; margin-left: -6px; padding: 0 8px 0 6px;
  border: 0; border-radius: var(--tt-radius-row); background: transparent; color: var(--tt-text-2); font: inherit; font-size: var(--tt-type-body); text-align: left;
  transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
}
.thread-browser__line:hover { background: var(--tt-hover); }
.thread-browser__line:active:not(:disabled) { background: var(--tt-hover-strong); }
.thread-browser__icon { flex: none; color: var(--tt-text-muted); }
.thread-browser__dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--tt-activity); }
.thread-browser__dot:not([data-connected]) { background: var(--tt-text-muted); }
.thread-browser__words { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thread-browser__detail { color: var(--tt-text-muted); }
.thread-browser__detail[data-failed] { color: color-mix(in oklab, var(--tt-warning-text) 70%, var(--tt-text-muted)); }
.thread-browser__steps { display: grid; gap: 0; margin: 2px 0 6px 1px; padding: 2px 0 2px 16px; border-left: 1px solid var(--tt-hairline); list-style: none; }
.thread-browser__steps li { display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 26px; color: var(--tt-text-2); font-size: var(--tt-type-small); line-height: 1.4; }
.thread-browser__step-icon { flex: none; color: var(--tt-text-muted); }
.thread-browser__step { min-width: 0; overflow-wrap: anywhere; }
.thread-browser__steps li[data-failed], .thread-browser__steps li[data-failed] .thread-browser__step-icon { color: color-mix(in oklab, var(--tt-warning-text) 70%, var(--tt-text-muted)); }
/* Among a group's rows, the line sits where a row would, its icon in the rows' icon column. */
.thread-activity__rows > .thread-browser > .thread-browser__line { display: flex; width: 100%; margin-left: 0; padding: 3px 6px; border-radius: var(--tt-radius-control); }
.thread-activity__rows > .thread-browser > .thread-browser__line > .thread-browser__icon { width: 16px; }
.thread-activity__rows > .thread-browser > .thread-browser__line > .thread-activity__chevron { margin-left: auto; }
.thread-activity__rows > .thread-browser > .thread-browser__steps { margin-left: 30px; }

/* What a finished turn changed, beside its folded work. */
.thread-changes { margin: -4px 0 8px; }
.thread-changes__summary {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 28px; margin-left: -6px; padding: 0 8px 0 6px;
  border: 0; border-radius: var(--tt-radius-row); background: transparent; color: var(--tt-text-muted); font: inherit; font-size: var(--tt-type-small); text-align: left;
  transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
}
.thread-changes__summary:hover { background: var(--tt-hover); color: var(--tt-text-2); }
.thread-changes__summary:active:not(:disabled) { background: var(--tt-hover-strong); color: var(--tt-text-2); }
.thread-changes__list { display: grid; gap: 10px; margin: 4px 0 10px; padding: 0 0 0 20px; list-style: none; min-width: 0; }
.thread-changes__list li { display: grid; gap: 6px; min-width: 0; }
.thread-changes__list .rich-code { margin: 0; }
.thread-changes__list .rich-code__scroll { max-height: 320px; overflow: auto; font-size: var(--tt-type-small); }

/* A compaction is a boundary in the conversation: a rule across the transcript, not a card of work. */
.thread-boundary {
  display: flex; align-items: center; gap: 12px; margin: 10px 0; padding: 0;
  color: var(--tt-text-muted); font-size: var(--tt-type-caption);
}
.thread-boundary__rule { flex: 1; height: 1px; background: var(--tt-hairline, var(--tt-border)); }
.thread-boundary__label { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }
.thread-boundary__icon { flex-shrink: 0; }
.thread-boundary__count { color: var(--tt-text-2); font-variant-numeric: tabular-nums; }

/* A turn waiting on one of the user's own model servers (ADR-0124): its words and Stop, and under them what the wait means. */
.thread-activity-live--own-server { flex-wrap: wrap; row-gap: 2px; }
.thread-activity-live--own-server .thread-activity-live__state { flex: 0 1 auto; min-width: 0; overflow-wrap: anywhere; }
.thread-activity-live--own-server .thread-activity__clock { color: var(--tt-text-muted); }
.thread-activity-live__stop {
  display: inline-flex; flex: none; align-items: center; gap: 6px; height: 28px; min-height: 28px; margin-left: -2px; padding: 0 8px; border: 0; border-radius: var(--tt-radius-control);
  background: transparent; color: var(--tt-text-2); font: inherit; font-size: var(--tt-type-small); font-weight: 500; white-space: nowrap;
  transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
}
.thread-activity-live__stop:hover:not(:disabled) { background: var(--tt-hover); color: var(--tt-text); }
.thread-activity-live__stop:active:not(:disabled) { background: var(--tt-hover-strong); color: var(--tt-text); }
.thread-activity-live__stop:disabled { color: var(--tt-text-muted); cursor: default; }
.thread-activity-live__note { flex-basis: 100%; margin: 0 0 0 14px; color: var(--tt-text-muted); font-size: var(--tt-type-small); line-height: 1.45; }
/* A turn the user's own server let down: what happened in the error colour, the rest in ordinary text, then what to press. */
.thread-own-failure { margin: 2px 0 4px; }
.thread-own-failure__reason { max-width: 64ch; margin: 0; color: var(--tt-text-2); font-size: var(--tt-type-body); line-height: 1.55; overflow-wrap: anywhere; }
.thread-own-failure__reason strong { color: var(--tt-error); font-weight: 500; }
.thread-own-failure__actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; }
/* Said once, after Try again put a message whose images could not go again back in the composer. Empty, it takes no room. */
.thread-own-failure__note { max-width: 64ch; margin: 8px 0 0; color: var(--tt-text-2); font-size: var(--tt-type-small); line-height: 1.5; }
.thread-own-failure__note:empty { margin: 0; }
/* ==== agents/requests/requests.css ==== */
/* Native request controls, shared by transcript approvals and questions above the composer. */
.agent-request { display: grid; gap: 10px; margin-top: 16px; padding: 14px 16px; border: 1px solid transparent; border-radius: var(--tt-radius-lg); background: var(--tt-card); cursor: default; }
.agent-request__head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; min-width: 0; }
.agent-request__head strong { font-size: var(--tt-type-reading); font-weight: 600; letter-spacing: -.1px; overflow-wrap: anywhere; }
.agent-request__tag { display: inline-block; padding: 1px 7px; border: 1px solid transparent; border-radius: var(--tt-radius-tag); background: var(--tt-card-inset); color: var(--tt-text-muted); font-size: var(--tt-type-caption); line-height: 18px; font-weight: 500; }
.agent-request__text { margin: 0; font-size: var(--tt-type-lead); line-height: 1.55; color: var(--tt-text-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.agent-request__command, .agent-request__details { margin: 0; max-height: 220px; overflow: auto; padding: 8px 10px; border: 1px solid var(--tt-code-border); border-radius: var(--tt-radius-md); background: var(--tt-code-bg); color: var(--tt-code-text); font-family: var(--tt-font-mono); font-size: var(--tt-type-small); line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.agent-request__details { color: var(--tt-text-2); }
.agent-request__summary { margin: 0; font-size: var(--tt-type-body); line-height: 1.45; overflow-wrap: anywhere; }
.agent-request__summary[data-none] { color: var(--tt-text-muted); font-size: var(--tt-type-small); }
.agent-request__summary-who { display: block; color: var(--tt-text-muted); font-size: var(--tt-type-small); }
.agent-request__target { margin: -4px 0 0; color: var(--tt-text-muted); font-family: var(--tt-font-mono); font-size: var(--tt-type-small); overflow-wrap: anywhere; }
.agent-request__also { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; font-size: var(--tt-type-small); line-height: 1.45; color: var(--tt-text-2); overflow-wrap: anywhere; }
.agent-request__also li { position: relative; padding-left: 14px; }
.agent-request__also li::before { content: ""; position: absolute; left: 1px; top: .55em; width: 6px; height: 6px; border-radius: 50%; background: var(--tt-warning-text); }
.agent-request__cwd { margin: -4px 0 0; color: var(--tt-text-muted); font-size: var(--tt-type-small); overflow-wrap: anywhere; }
.agent-request__cwd code { font-family: var(--tt-font-mono); font-size: var(--tt-type-caption); color: var(--tt-text-2); }
.agent-request__actions { display: flex; flex-wrap: wrap; gap: 8px; }
.agent-request__actions:empty { display: none; }
.agent-request__actions .tt-button, .agent-request__footer .tt-button, .agent-request__hold .tt-button { min-height: 34px; padding: 0 15px; font-size: var(--tt-type-body); }
.agent-request__actions .tt-button[aria-pressed='true'] { box-shadow: inset 0 0 0 1px var(--tt-selected-border); }
.agent-request__choices { display: grid; gap: 4px; margin: 0; font-size: var(--tt-type-small); color: var(--tt-text-muted); }
.agent-request__choices div { display: flex; flex-wrap: wrap; gap: 0 6px; }
.agent-request__choices dt { color: var(--tt-text-2); font-weight: 500; }
.agent-request__choices dt::after { content: ':'; }
.agent-request__choices dd { margin: 0; }

.agent-request__form { display: grid; gap: 14px; }
.agent-request__question { display: grid; gap: 8px; min-width: 0; margin: 0; padding: 0; border: 0; }
.agent-request__question + .agent-request__question { padding-top: 14px; border-top: 2px solid var(--tt-card-inset); }
.agent-request__question legend:not(.tt-visually-hidden) { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; float: left; width: 100%; padding: 0; }
.agent-request__question legend + * { clear: both; }
.agent-request__prompt { font-size: var(--tt-type-lead); line-height: 1.5; color: var(--tt-text); overflow-wrap: anywhere; white-space: pre-wrap; }
/* A web address in a question, its choices or its explanation: underlined in the link colour, as in a message. */
.agent-request__link { color: var(--tt-link); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; overflow-wrap: anywhere; border-radius: var(--tt-radius-mark); }
.agent-request__link:hover { color: var(--tt-primary-hover); }
/* The links from the agent's message before a question: a row each, as the iPhone's question sheet shows them. */
.agent-request__link-rows { display: grid; gap: 6px; }
.agent-request__link-row { display: flex; align-items: center; gap: 12px; min-width: 0; min-height: 44px; padding: 7px 12px; border: 1px solid transparent; border-radius: var(--tt-radius-control); background: var(--tt-card-inset); color: var(--tt-text); text-decoration: none; transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease; }
.agent-request__link-row:hover { background: var(--tt-hover); }
.agent-request__link-row:active { background: var(--tt-hover-strong); }
.agent-request__link-row > svg { flex: none; color: var(--tt-text-muted); }
.agent-request__link-row > svg:first-child { color: var(--tt-accent-text); }
.agent-request__link-row > span { display: grid; flex: 1; min-width: 0; }
.agent-request__link-row strong { font-size: var(--tt-type-body); font-weight: 600; }
.agent-request__link-row small { overflow: hidden; color: var(--tt-text-muted); font-size: var(--tt-type-caption); text-overflow: ellipsis; white-space: nowrap; }
.agent-request__link-failure { margin: 0; color: var(--tt-text-muted); font-size: var(--tt-type-small); }
/* A question about a prototype that names no page that opens (ADR-0108): a muted dashed row where its page's would be. */
.agent-request__no-link { display: flex; align-items: flex-start; gap: 12px; margin: 0; padding: 9px 12px; border: 1px dashed var(--tt-field-border); border-radius: var(--tt-radius-md); color: var(--tt-text-muted); font-size: var(--tt-type-small); line-height: 1.45; overflow-wrap: anywhere; }
.agent-request__no-link > svg { flex: none; margin-top: 2px; }
/* A prototype waiting for review (ADR-0108, variant A): a slim strip above the composer, its page rows beside the title. */
.prototype-ready { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 0 0 10px; padding: 8px 8px 8px 14px; border: 1px solid transparent; border-radius: var(--tt-radius-md); background: var(--tt-card); animation: question-arrive 180ms ease-out; }
.prototype-ready__title { display: flex; flex: none; align-items: center; gap: 8px; color: var(--tt-text); font-size: var(--tt-type-body); font-weight: 600; }
.prototype-ready__title > svg { flex: none; color: var(--tt-accent-text); }
.prototype-ready .agent-request__link-rows { flex: 1 1 260px; min-width: 0; }
.prototype-ready .agent-request__link-row { min-height: 40px; }
.agent-request__note { color: var(--tt-text-muted); font-size: var(--tt-type-small); }
.agent-request__options { display: grid; gap: 2px; }
.agent-request__option { display: grid; grid-template-columns: 18px minmax(0, 1fr); align-items: start; gap: 10px; padding: 7px 8px; margin: 0 -8px; border-radius: var(--tt-radius-md); cursor: default; transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease; }
.agent-request__option:hover { background: var(--tt-hover); }
.agent-request__option[data-checked] { background: var(--tt-selected); }
.agent-request__question:disabled .agent-request__option { cursor: default; opacity: .72; }
.agent-request__question:disabled .agent-request__option:hover:not([data-checked]) { background: none; }
.agent-request__option input { width: 16px; height: 16px; margin: 3px 0 0; accent-color: var(--tt-accent); cursor: inherit; }
.agent-request__option input:focus-visible { outline: 2px solid var(--tt-focus-ring); outline-offset: 2px; }
.agent-request__option > span { display: grid; gap: 2px; min-width: 0; }
.agent-request__label { font-size: var(--tt-type-reading); line-height: 1.45; color: var(--tt-text); cursor: inherit; overflow-wrap: anywhere; }
.agent-request__option small { font-size: var(--tt-type-small); line-height: 1.45; color: var(--tt-text-muted); overflow-wrap: anywhere; }
.agent-request__preview { margin: 6px 0 0; max-height: 200px; overflow: auto; padding: 8px 10px; border: 1px solid var(--tt-code-border); border-radius: var(--tt-radius-sm); background: var(--tt-code-bg); color: var(--tt-code-text); font-family: var(--tt-font-mono); font-size: var(--tt-type-caption); line-height: 1.5; white-space: pre-wrap; }
.agent-request__input { width: 100%; min-height: 36px; margin-top: 4px; padding: 7px 10px; resize: vertical; border: 1px solid transparent; border-radius: var(--tt-radius-control); background: var(--tt-card-inset); color: var(--tt-text); font: inherit; font-size: var(--tt-type-reading); line-height: 1.45; transition: border-color 120ms ease, box-shadow 120ms ease; }
.agent-request__input:focus-visible { outline: none; border-color: var(--tt-field-border-focus); box-shadow: 0 0 0 2px var(--tt-focus-ring); }
.agent-request__footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px 12px; }
.agent-request__count { margin-right: auto; color: var(--tt-text-muted); font-size: var(--tt-type-small); }

.agent-request__status { margin: 0; color: var(--tt-text-muted); font-size: var(--tt-type-small); }
.agent-request__error { margin: 0; color: var(--tt-error-text); font-size: var(--tt-type-body); overflow-wrap: anywhere; }
.agent-request__hold { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.agent-request__hold p { margin: 0; flex: 1 1 260px; font-size: var(--tt-type-body); color: var(--tt-text-2); }

/* Native form fidelity: optional fields say so, and a field Sotto cannot submit says why in place of its input. */
.agent-request__optional { color: var(--tt-text-muted); font-size: var(--tt-type-small); line-height: 1.5; }
.agent-request__unavailable { margin: 0; padding: 2px 0 2px 10px; border-left: 2px solid var(--tt-hairline); color: var(--tt-text-2); font-size: var(--tt-type-body); line-height: 1.5; overflow-wrap: anywhere; }
.agent-request__unavailable[data-required] { border-left-color: var(--tt-warning); }
.agent-request__clear { justify-self: start; min-height: 28px; margin: -2px 0 0 20px; padding: 0 8px; border: 0; border-radius: var(--tt-radius-sm); background: none; color: var(--tt-text-muted); font: inherit; font-size: var(--tt-type-small); transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, opacity 120ms ease; }
.agent-request__clear:hover:not(:disabled) { color: var(--tt-text); background: var(--tt-hover); }
.agent-request__clear:active:not(:disabled) { color: var(--tt-text); background: var(--tt-hover-strong); }
.agent-request__clear:disabled { cursor: default; opacity: .72; }
.agent-request__fallback { margin: 0; color: var(--tt-text-2); font-size: var(--tt-type-body); line-height: 1.5; }

/* A Cursor plan (ADR-0128): its name, overview and steps on the card's inset, read before Accept plan or Reject. The
   steps are Markdown, drawn as a reply's are, and scroll inside the card when a plan is long. */
.agent-request__plan { display: grid; gap: 6px; min-width: 0; max-height: 360px; overflow: auto; padding: 10px 14px; border-radius: var(--tt-radius-md); background: var(--tt-card-inset); scrollbar-width: thin; scrollbar-color: var(--tt-scrollbar) transparent; }
.agent-request__plan:focus-visible { outline: 2px solid var(--tt-focus-ring); outline-offset: 2px; }
.agent-request__plan-title { margin: 0; color: var(--tt-text); font-size: var(--tt-type-reading); font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; }
.agent-request__plan-overview { margin: 0; color: var(--tt-text-2); font-size: var(--tt-type-body); line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.agent-request__plan-steps { min-width: 0; color: var(--tt-text-2); font-size: var(--tt-type-body); line-height: 1.6; }
.agent-request__plan-steps :is(p, ul, ol) { margin: 4px 0; }
.agent-request__plan-steps :is(ul, ol) { padding-left: 20px; }

/* Approved answer-list panel. The durable form remains mounted while collapsed. */
.agent-request__body { display: grid; gap: 10px; min-width: 0; }
.agent-request__body[hidden] { display: none; }
.agent-request__status:empty { display: none; }
.agent-request__recommended { margin-left: 6px; color: var(--tt-accent-text); font-size: var(--tt-type-small); white-space: nowrap; }
.thread-workspace__compose > .thread-questions { flex: 0 1 auto; min-height: 48px; max-height: min(480px, 60vh); margin-bottom: 10px; overflow: auto; border: 1px solid transparent; border-radius: var(--tt-radius-card); background: var(--tt-card); scrollbar-width: thin; scroll-padding-block: 8px; }
.thread-questions .agent-request + .agent-request { border-top: 2px solid var(--tt-card-inset); }
.agent-request[data-placement='composer'] { position: relative; margin-top: 0; padding: 16px 18px; border: 0; border-radius: 0; background: var(--tt-card); animation: question-arrive 180ms ease-out; }
.agent-request[data-placement='composer'] .agent-request__form { gap: 12px; }
.agent-request[data-placement='composer'] .agent-request__question legend:not(.tt-visually-hidden) { padding-right: 28px; }
.agent-request[data-placement='composer'] .agent-request__prompt { font-size: var(--tt-type-lead); font-weight: 600; }
.agent-request[data-placement='composer'] .agent-request__option { padding-block: 10px; border: 1px solid transparent; }
.agent-request[data-placement='composer'] .agent-request__option[data-checked] { border-color: var(--tt-selected-border); }
.agent-request[data-placement='composer'] .agent-request__input { min-height: 64px; max-height: 160px; resize: vertical; }
.agent-request__toggle-row { position: absolute; top: 10px; right: 10px; z-index: 1; }
.agent-request__toggle { display: grid; place-items: center; flex: none; width: 32px; height: 32px; padding: 0; border: 0; border-radius: var(--tt-radius-row); background: transparent; color: var(--tt-text-muted); transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease; }
.agent-request__toggle:hover { background: var(--tt-hover); color: var(--tt-text); }
.agent-request__toggle:active { background: var(--tt-hover-strong); color: var(--tt-text); }
.agent-request[data-collapsed] { padding: 8px 12px; }
.agent-request[data-collapsed] .agent-request__toggle-row { position: static; display: flex; gap: 10px; align-items: center; justify-content: space-between; min-width: 0; }
.agent-request__collapsed-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--tt-type-body); color: var(--tt-text); }
@keyframes question-arrive { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { .agent-request[data-placement='composer'], .prototype-ready { animation: none; } }

/* The compact pane normally keeps its composer fixed. A question makes that area shrinkable instead. */
.threads-view .thread-pane .thread-workspace__compose:has(> .thread-questions) { flex: 0 1 auto; }
/* The footer spans the card's padding so options, which overhang the content box, scroll fully behind it. */
.agent-request[data-placement='composer'] .agent-request__footer { position: sticky; bottom: 0; z-index: 1; margin-inline: -18px; padding: 8px 18px; background: var(--tt-card); }

/* A short split gives history space to the question, but keeps pending approvals and saved-answer recovery reachable. */
@container thread-pane (max-height: 420px) {
  .threads-view .thread-pane[data-question-open]:not([data-request]) > .thread-transcript { display: none; }
  .thread-workspace__compose > .thread-questions { min-height: 120px; }
  .threads-view .thread-pane .thread-workspace__compose:has(> .thread-questions) .thread-prompt :is(textarea, .prompt-editor) { min-height: 32px; max-height: 32px; }
  .thread-workspace__compose > .thread-questions:not(:has(.agent-request:not([data-collapsed]))) { min-height: 48px; }
  /* When both areas need an answer, the pane scrolls between two bounded regions instead of hiding either. */
  .threads-view .thread-pane[data-questions][data-request] > .thread-transcript { flex: 0 0 160px; min-height: 160px; max-height: 160px; }
  .threads-view .thread-pane[data-request] .thread-workspace__compose:has(> .thread-questions) { flex: none; }
  .threads-view .thread-pane[data-request] .thread-workspace__compose > .thread-questions { max-height: 160px; }
}

:root[data-reduced-motion='on'] :is(.agent-request[data-placement='composer'], .prototype-ready) { animation: none; }
/* Images dropped on a form (ADR-0176): the drop edge outlines the questions, which take the drop. */
.agent-request .screenshot-input { position: relative; display: grid; gap: 14px; }
.agent-request[data-placement='composer'] .screenshot-input { gap: 12px; }
.agent-request .screenshot-input__tools { margin-top: 0; }
.agent-request .screenshot-previews { margin-top: 0; }
/* ==== agents/requests/requestDraftRecovery.css ==== */
/* A saved answer whose question is no longer on screen: the request card, read rather than filled in. */
.request-recovery__why { margin: -4px 0 0; color: var(--tt-text-2); font-size: var(--tt-type-body); line-height: 1.5; overflow-wrap: anywhere; }
.request-recovery__answers { display: grid; gap: 10px; margin: 0; user-select: text; }
.request-recovery__answers > div { display: grid; gap: 2px; min-width: 0; }
.request-recovery__answers > div + div { padding-top: 10px; border-top: 1px solid var(--tt-hairline); }
.request-recovery__answers dt { color: var(--tt-text-muted); font-size: var(--tt-type-body); line-height: 1.45; overflow-wrap: anywhere; white-space: pre-wrap; }
.request-recovery__answers dd { margin: 0; color: var(--tt-text); font-size: var(--tt-type-reading); line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
.request-recovery__answers [data-empty] dd { color: var(--tt-text-muted); font-style: italic; }
.request-recovery__actions, .request-recovery__confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.request-recovery__confirm p { margin: 0; flex: 1 1 260px; color: var(--tt-text-2); font-size: var(--tt-type-body); line-height: 1.5; }
.request-recovery__actions .tt-button, .request-recovery__confirm .tt-button { min-height: 34px; padding: 0 15px; font-size: var(--tt-type-body); }
/* ==== agents/threadChips.css ==== */
/* The option chips: the model with its provider's mark, the reasoning effort and the permissions. Each opens its own list
   above itself, so the typed text and the send button stay where they were. Outside a composer (Settings, the continue
   strip) each is one filled chip with 5px corners (ADR-0110). In a composer they are text buttons (ADR-0113, below). */
.thread-options--chips { gap: 6px; }
.thread-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 220px; height: 28px; min-height: 28px; padding: 0 9px; border: 1px solid transparent; border-radius: var(--tt-radius-tag); background: light-dark(var(--tt-surface-overlay), var(--tt-surface-sunken)); color: var(--tt-text-2); font: inherit; font-size: var(--tt-type-small); white-space: nowrap; transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, opacity 120ms ease; }
.thread-chip > span { overflow: hidden; text-overflow: ellipsis; }
.thread-chip > svg { flex: none; }
/* The hover tint lies over the chip's own fill, whichever surface that is. */
.thread-chip:hover:not(:disabled), .thread-chip[aria-expanded='true'] { border-color: var(--tt-border-faint); background-image: linear-gradient(var(--tt-hover), var(--tt-hover)); color: var(--tt-text); }
.thread-chip:disabled { opacity: .55; cursor: default; }
/* Watch on a new thread's chips: pressed, the thread is watched from its first send, in the theme's accent. */
.thread-chip.watch-on-send[aria-pressed='true'] { border-color: var(--tt-accent-border); color: var(--tt-accent-text); }
.thread-chip.watch-on-send[aria-pressed='true']:hover:not(:disabled) { border-color: var(--tt-accent-border); color: var(--tt-accent-text); }
/* At the model's highest level the effort chip's word wears the colourway; the composer reads the same mark for its outline (ADR-0019). */
.thread-chip[data-effort-top='true'] > span { color: var(--tt-effort-text-fill); background: var(--tt-effort-text-image); -webkit-background-clip: text; background-clip: text; font-weight: 500; }
/* Ultracode's workflow mark (ADR-0148) in the colourway's ink, which stays opaque where the word's fill is a clipped gradient. */
.thread-chip[data-effort-top='true'] > .thread-chip__ultracode { color: var(--tt-effort-text); }

/* In a composer the chips are text buttons (ADR-0113, Zach's pick A of docs/prototypes/quiet-composer-prototype.html): no
   edge and no fill at rest, the value and a small chevron, still 28px tall so the hit area stays, with the hover wash while
   pointed at or open and the focus ring from the keyboard. The model reads in the secondary text beside its provider's
   mark; reasoning, permissions and Watch are quieter, in the muted text. */
.thread-prompt .thread-chip { gap: 5px; padding: 0 7px; border-radius: var(--tt-radius-control); background: transparent; color: var(--tt-text-muted); }
.thread-prompt .thread-chip.model-picker__trigger { color: var(--tt-text-2); }
.thread-prompt .thread-chip > svg:last-child { opacity: .7; }
.thread-prompt .thread-chip:hover:not(:disabled), .thread-prompt .thread-chip[aria-expanded='true'] { border-color: transparent; background: var(--tt-hover); color: var(--tt-text); }
.thread-prompt .thread-chip:active:not(:disabled):not([aria-expanded='true']) { background: var(--tt-hover-strong); color: var(--tt-text); }
.thread-prompt .thread-chip.watch-on-send[aria-pressed='true'], .thread-prompt .thread-chip.watch-on-send[aria-pressed='true']:hover:not(:disabled) { border-color: var(--tt-accent-border); background: color-mix(in srgb, var(--tt-accent) 14%, transparent); color: var(--tt-accent-text); }

/* Speed (ADR-0143, pick A of the prototype/composer-fast-mode tag): a square text button after the model chip. Standard, a
   muted outline bolt; Fast, the bolt filled in the theme's accent; Ultra fast, that bolt with a small 2 at its foot. It
   keeps the chips' 28px and their hover wash. */
.thread-chip.thread-fast { position: relative; justify-content: center; width: 28px; min-width: 28px; padding: 0; }
.thread-chip.thread-fast > .thread-fast__two { position: absolute; right: 4px; bottom: 3px; font-size: var(--tt-type-micro); font-weight: 700; line-height: 1; }
.thread-prompt .thread-chip.thread-fast { padding: 0; }
.thread-chip.thread-fast[aria-pressed='false'] > svg { opacity: .75; }
.thread-chip.thread-fast[aria-pressed='true'], .thread-chip.thread-fast[aria-pressed='true']:hover:not(:disabled) { color: var(--tt-accent-text); }
.thread-prompt .thread-chip.thread-fast[aria-pressed='true'] > svg { opacity: 1; }

/* A glyph that stands for the value appears only where the composer is narrow; the words stay for assistive technology. */
.thread-chip > .thread-chip__icon { display: none; flex: none; }
@container thread-pane (max-width: 720px) {
  .thread-prompt .thread-chip > .thread-chip__icon { display: inline-flex; }
  .thread-prompt .thread-chip:has(> .thread-chip__icon) > .thread-chip__value { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
}

/* A permission change the provider has not confirmed yet (a pending setting): the chip already shows it, with a
   dashed edge in the activity colour and a small dot, and the caption beside the chips says what is still in force.
   The dot breathes; under reduced motion it holds still. */
.thread-chip[data-pending='true'] { border-style: dashed; border-color: var(--tt-activity); color: var(--tt-text); }
.thread-prompt .thread-chip[data-pending='true']:hover:not(:disabled), .thread-prompt .thread-chip[data-pending='true'][aria-expanded='true'] { border-color: var(--tt-activity); }
.thread-chip > .thread-chip__pending { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--tt-activity); }
@media (prefers-reduced-motion: no-preference) {
  :root:not([data-reduced-motion='on']) .thread-chip__pending { animation: thread-chip-pending 1.1s ease-in-out infinite; }
}
@keyframes thread-chip-pending { 50% { opacity: .35; } }
.thread-options__caption { min-width: 0; color: var(--tt-text-muted); font-size: var(--tt-type-caption); line-height: 1.4; }
/* Kept in the tree while empty so assistive technology hears it arrive, but out of the row's spacing. */
.thread-options__caption:empty { position: absolute; }
/* What a refused or unconfirmed change said, each on its own line in the warning colour the composer's other refusals
   use. The composer gives them a row of their own under its footer, so the chips, the attach button and the send
   button stay exactly where they are; the row is empty, and takes no room, until there is something to say. */
.thread-options-notices { display: grid; gap: 4px; min-width: 0; margin-top: 6px; }
.thread-options-notices:empty { display: none; }
.thread-prompt > .thread-options-notices, .thread-workspace__compose .agent-composer > .thread-options-notices { grid-column: 2; }
.thread-options__notice { display: flex; flex: 1 0 100%; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 0; color: var(--threads-warning-text, var(--tt-error-text)); font-size: var(--tt-type-caption); line-height: 1.4; }
.thread-options__notice > span { flex: 0 1 auto; min-width: 0; overflow-wrap: anywhere; }
.thread-options__notice > button { flex: none; height: 26px; min-height: 26px; padding: 0 10px; border: 1px solid var(--tt-field-border); border-radius: var(--tt-radius-control); background: transparent; color: var(--tt-text-2); font: inherit; font-size: var(--tt-type-caption); transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, opacity 120ms ease; }
.thread-options__notice > button:hover:not(:disabled) { border-color: var(--tt-border-faint); background: var(--tt-hover); color: var(--tt-text); }
.thread-options__notice > button:active:not(:disabled) { background: var(--tt-hover-strong); color: var(--tt-text); }
.thread-options__notice > button:disabled { opacity: .55; cursor: default; }

/* The effort and permission lists. */
.thread-chip-menu { position: relative; min-width: 0; }
.thread-chip-menu__list { position: absolute; bottom: calc(100% + 6px); left: 0; z-index: 30; min-width: 180px; padding: 6px; border: 1px solid var(--tt-field-border); border-radius: var(--tt-radius-inset); background: var(--tt-surface-elevated); box-shadow: 0 16px 48px var(--tt-shadow-color); }
/* A chip near the top of the area that scrolls it opens its list below itself instead (`flip`). */
.thread-chip-menu__list[data-below='true'] { top: calc(100% + 6px); bottom: auto; }
:is(.thread-chip-menu__list, .thread-chip-menu__options) > button { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 32px; padding: 6px 10px; border: 0; border-radius: var(--tt-radius-row); background: transparent; color: var(--tt-text-2); font: inherit; font-size: var(--tt-type-small); text-align: left; white-space: nowrap; }
:is(.thread-chip-menu__list, .thread-chip-menu__options) > button:hover:not(:disabled), :is(.thread-chip-menu__list, .thread-chip-menu__options) > button:focus-visible { background: var(--tt-hover); color: var(--tt-text); outline: 0; }
:is(.thread-chip-menu__list, .thread-chip-menu__options) > button:focus-visible { box-shadow: inset 0 0 0 2px var(--tt-focus-ring); }
:is(.thread-chip-menu__list, .thread-chip-menu__options) > button[aria-selected='true'] { color: var(--tt-activity); }
:is(.thread-chip-menu__list, .thread-chip-menu__options) > button:disabled { opacity: .45; cursor: default; }
/* A permission mode named for what the provider stops asking says, underneath, what Sotto still asks. */
:is(.thread-chip-menu__list, .thread-chip-menu__options) > button > span { display: grid; gap: 2px; min-width: 0; }
:is(.thread-chip-menu__list, .thread-chip-menu__options) > button > span > small { max-width: 34ch; color: var(--tt-text-muted); font-size: var(--tt-type-caption); line-height: 1.35; white-space: normal; }
.thread-chip-menu__list:has(small) { min-width: 240px; }
:is(.thread-chip-menu__list, .thread-chip-menu__options):has(small) > button { align-items: flex-start; }
/* A list with a line under it that holds whatever is chosen (Watcher's permissions): the list and the line share one
   panel, wide enough that each choice's one line of description reads without a ragged edge. */
.thread-chip-menu__list--foot { width: min(318px, calc(100vw - 24px)); }
.thread-chip-menu__list--foot .thread-chip-menu__options > button > span > small { max-width: none; }
.thread-chip-menu__foot { margin: 6px 4px 0; padding: 8px 6px 2px; border-top: 1px solid var(--tt-hairline); color: var(--tt-text-muted); font-size: var(--tt-type-caption); line-height: 1.4; white-space: normal; }

/* One motion: a list rises 6px as it opens, on the easing the follow-up ledger uses. The model menu shares it. */
@media (prefers-reduced-motion: no-preference) {
  :root:not([data-reduced-motion='on']) :is(.thread-chip-menu__list, .model-picker__dialog) { animation: thread-chip-rise 140ms cubic-bezier(.2, .8, .2, 1); }
}
@keyframes thread-chip-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
/* ==== agents/quietComposer.css ==== */
/* Zach's composer (ADR-0168, ADR-0172), after T3 Code: the prompt has the card's whole width; under it, attach on the
   left and, on the right, the permissions, the model and its effort as words with the speed's bolt, then one disc. It is
   the composer everywhere one is drawn: threads, Watcher, answers, continuations and Watcher's handover. No edge in any
   state; colour comes only from theme roles. */
.thread-prompt[data-quiet] { grid-template-columns: auto minmax(0, 1fr); align-items: start; column-gap: 0; padding: 14px 10px 8px 16px; border-radius: var(--tt-radius-overlay); }
.thread-prompt[data-quiet] .screenshot-input > :has(.prompt-editor) { grid-column: 1 / -1; grid-row: 2; min-width: 0; }
.thread-prompt[data-quiet] .prompt-editor { min-height: 45px; max-height: 220px; padding: 0 6px 0 0; resize: none; }
/* The footer: attach in the first column, everything else at the far end of the second. */
.thread-prompt[data-quiet] .screenshot-input__tools > .tt-button { grid-column: 1; grid-row: 4; align-self: center; margin: 6px 0 0 -8px; }
.thread-prompt[data-quiet] > .thread-prompt__footer { grid-column: 2; grid-row: 4; align-self: center; justify-content: flex-end; gap: 4px; min-width: 0; margin: 6px 0 0; }
/* What the user put in the prompt sits above it; what Sotto says about it, below. */
.thread-prompt[data-quiet] :is(.review-chips, .thread-prompt__notice) { grid-row: 1; }
.thread-prompt[data-quiet] :is(.screenshot-previews, .attached-files, .screenshot-input__tools > small, .review-chips__note) { grid-row: 3; }
.thread-prompt[data-quiet] > .thread-options-notices { grid-column: 1 / -1; grid-row: 5; }
.thread-prompt[data-quiet] :is(.thread-prompt__meta, .thread-options-bar, .thread-options--chips) { flex: 0 1 auto; flex-wrap: nowrap; gap: 0 2px; min-width: 0; }
.thread-prompt[data-quiet] > .thread-prompt__footer > .thread-prompt__meta { flex: 1 1 auto; justify-content: flex-end; min-width: 0; }
.thread-prompt[data-quiet] .thread-prompt__actions { gap: 2px; }
/* Let the existing model-name ellipsis take the squeeze; the shield, effort and disc keep their hit areas. */
.thread-prompt[data-quiet] .model-picker__trigger { max-width: min(220px, 100%); }

/* The model and its effort read as words, not a chip: no fill and no hairline between them. */
.thread-prompt[data-quiet] .thread-options--chips:has(> .split-chip-effort) { gap: 0; height: 28px; }
.thread-prompt[data-quiet] .thread-options--chips:has(> .split-chip-effort) .model-picker__trigger { height: 28px; min-height: 28px; border-radius: var(--tt-radius-row); padding-inline-end: 4px; color: var(--tt-text); }

/* The model keeps its mark and name and loses its chevron. Permissions come first at the footer's end, in a slot of
   their own before the model, as their shield and the mode's name in the mode's colour. A narrow pane keeps the shield
   alone; the name stays for assistive technology and in the tooltip. Other chips with an icon show only the icon. */
.thread-prompt[data-quiet] .thread-chip > svg.lucide-chevron-down { display: none; }
.thread-prompt[data-quiet] :is(.watcher-new__label, .watcher-new__separator) { display: none; }
.thread-prompt[data-quiet] .thread-chip > .thread-chip__icon { display: inline-flex; }
.thread-prompt[data-quiet] .thread-chip:has(> .thread-chip__icon) > .thread-chip__value { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.thread-prompt[data-quiet] .thread-prompt__shield { display: flex; flex: none; align-items: center; margin-inline-end: 2px; }
.thread-prompt[data-quiet] .thread-prompt__shield:empty { display: none; }
.thread-prompt[data-quiet] .thread-chip[data-permission]:has(> .thread-chip__icon) { gap: 6px; }
.thread-prompt[data-quiet] .thread-chip[data-permission]:has(> .thread-chip__icon) > .thread-chip__value { position: static; width: auto; height: auto; overflow: visible; clip-path: none; font-size: var(--tt-type-small); }
@container thread-pane (max-width: 560px) {
  .thread-prompt[data-quiet] .thread-chip[data-permission]:has(> .thread-chip__icon) > .thread-chip__value { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
}
/* The shield says the mode even before it opens. Full access takes the theme's gold, with a slow sheen. */
.thread-prompt[data-quiet] .thread-chip[data-permission] { color: var(--tt-text-muted); }
.thread-prompt[data-quiet] .thread-chip:is([data-permission='auto'], [data-permission='auto-accept-edits']) { color: var(--tt-accent-text); }
.thread-prompt[data-quiet] .thread-chip[data-permission='full-access'] { color: var(--tt-chart-6); }
.thread-prompt[data-quiet] .thread-chip[data-permission='full-access'] .thread-chip__icon { position: relative; filter: drop-shadow(0 0 3px color-mix(in oklab, var(--tt-chart-6) 40%, transparent)); }
.thread-prompt[data-quiet] .thread-chip[data-permission='full-access'] svg { fill: color-mix(in oklab, var(--tt-chart-6) 28%, transparent); }
.thread-prompt[data-quiet] .thread-chip[data-permission='full-access'] .thread-chip__icon::after { content: ''; position: absolute; inset: 1px; clip-path: polygon(50% 0, 94% 18%, 88% 64%, 50% 100%, 12% 64%, 6% 18%); background: linear-gradient(110deg, transparent 35%, color-mix(in oklab, var(--tt-text) 75%, var(--tt-chart-6)) 50%, transparent 65%) 180% 0 / 300% 100% no-repeat; pointer-events: none; }
@media (prefers-reduced-motion: no-preference) {
  :root:not([data-reduced-motion='on']) .thread-prompt[data-quiet] .thread-chip[data-permission='full-access'] .thread-chip__icon::after { animation: permission-gold-sheen 4.8s ease-in-out infinite; }
}
:root[data-window-hidden] .thread-prompt[data-quiet] .thread-chip[data-permission='full-access'] .thread-chip__icon::after { animation-play-state: paused; }
@keyframes permission-gold-sheen { 0%, 30% { background-position: 180% 0; } 75%, 100% { background-position: -80% 0; } }

/* One disc. Steer, while its modifier is held, is the accent with the ink made for it. While a turn runs with nothing
   typed the disc is Stop, in the disc's own ink. */
.thread-prompt[data-quiet] .thread-prompt__actions > .thread-prompt__disc { width: 32px; min-width: 32px; height: 32px; min-height: 32px; padding: 0; border-radius: var(--tt-radius-full); }
.thread-prompt[data-quiet] .thread-prompt__actions > .thread-prompt__disc[data-face='steer'],
.thread-prompt[data-quiet] .thread-prompt__actions > .thread-prompt__disc[data-face='steer']:hover { background: var(--tt-accent); color: var(--tt-on-accent); }
.thread-prompt[data-quiet] .thread-prompt__actions > .thread-prompt__disc[data-face='stop'] { background: var(--tt-pill); color: var(--tt-pill-ink); }
.thread-prompt[data-quiet] .thread-prompt__actions > .thread-prompt__stop { width: 22px; min-width: 22px; padding: 0; }

/* The effort chip: the level in words, then the speed's bolt. Its menu opens above it, like the shield's. */
.split-chip-effort { position: relative; display: inline-flex; align-items: center; height: 28px; flex: none; }
.split-chip-effort__trigger { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 8px 0 4px; border: 0; border-radius: var(--tt-radius-row); background: transparent; color: var(--tt-text-2); font: inherit; font-size: var(--tt-type-small); white-space: nowrap; }
.split-chip-effort__trigger:hover:not([aria-disabled='true']), .split-chip-effort__trigger[aria-expanded='true'] { background: var(--tt-hover); color: var(--tt-text); }
.split-chip-effort__trigger[aria-disabled='true'] { cursor: default; }
.split-chip-effort[data-pending] .split-chip-effort__trigger { opacity: .7; }
.split-chip-effort__bolts { display: inline-flex; align-items: center; color: var(--tt-text-2); }
.split-chip-effort__bolts > svg + svg { margin-inline-start: -3px; }
.split-chip-effort__bolts > svg[data-off] { opacity: .55; }
.split-chip-effort__menu { right: 0; left: auto; }
.split-chip-effort__speeds { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; margin: 6px 2px 0; padding: 2px; border-radius: var(--tt-radius-row); background: color-mix(in oklab, var(--tt-text) 6%, transparent); }
.split-chip-effort__speeds > button { height: 26px; padding: 0 8px; border: 0; border-radius: var(--tt-radius-control); background: transparent; color: var(--tt-text-muted); font: inherit; font-size: var(--tt-type-caption); white-space: nowrap; }
.split-chip-effort__speeds > button:hover { color: var(--tt-text); }
.split-chip-effort__speeds > button[aria-checked='true'] { background: var(--tt-surface-elevated); color: var(--tt-text); font-weight: 600; box-shadow: 0 0 0 1px var(--tt-hairline); }
/* A level the draft seems to want (ADR-0172, Drake's pick A of docs/prototypes/effort-suggestion-prototype.html): after
   the word, a muted arrow and the level in the accent on its wash, one press that sets it. It rises in once, and stands
   still while the draft still asks for it. */
.split-chip-effort__suggest { display: inline-flex; align-items: center; gap: 5px; height: 28px; margin-inline-start: -4px; padding: 0 4px 0 2px; border: 0; border-radius: var(--tt-radius-row); background: transparent; color: var(--tt-text-muted); font: inherit; font-size: var(--tt-type-small); white-space: nowrap; }
/* A thinner wash than --tt-accent-wash, so the accent's text holds 4.5:1 on it in every theme (paintedTextPairs.ts). */
.split-chip-effort__suggested { --effort-offer-wash: color-mix(in srgb, var(--tt-accent) 10%, transparent); display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: var(--tt-radius-control); background: var(--effort-offer-wash); color: var(--tt-accent-text); font-weight: 600; }
/* The arrow points from the word to the level in a right-to-left interface too. */
.split-chip-effort__arrow { display: inline-block; }
.split-chip-effort__arrow:dir(rtl) { transform: scaleX(-1); }
.split-chip-effort__suggest:hover > .split-chip-effort__suggested { box-shadow: inset 0 0 0 1px var(--tt-accent-border); }
@media (prefers-reduced-motion: no-preference) {
  :root:not([data-reduced-motion='on']) .split-chip-effort__suggest { animation: effort-suggest-in 180ms cubic-bezier(.2, .8, .2, 1) both; }
}
@keyframes effort-suggest-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

/* A thread whose settings cannot change shows its model's name; the line saying so stays for assistive technology. */
.thread-prompt[data-quiet] .thread-prompt__model small { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
/* ==== agents/modelPicker.css 1-9 ==== */
/* The model control: a chip (threadChips.css) carrying the provider's mark, and the menu it opens. */
.model-picker { min-width: 0; }
.model-picker__trigger { color: var(--tt-text-2); }
.model-picker__trigger .provider-mark[data-provider='codex'], .model-picker__rail .provider-mark[data-provider='codex'] { color: var(--tt-provider-codex); }
.model-picker__trigger .provider-mark[data-provider='claude'], .model-picker__rail .provider-mark[data-provider='claude'] { color: var(--tt-provider-claude); }
.model-picker__trigger .provider-mark[data-provider='grok'], .model-picker__rail .provider-mark[data-provider='grok'] { color: var(--tt-provider-grok); }
.model-picker__trigger .provider-mark[data-provider='devin'], .model-picker__rail .provider-mark[data-provider='devin'] { color: var(--tt-provider-devin); }
.model-picker__trigger .provider-mark[data-provider='opencode'], .model-picker__rail .provider-mark[data-provider='opencode'] { color: var(--tt-provider-opencode); }
.model-picker__trigger .provider-mark[data-provider='cursor'], .model-picker__rail .provider-mark[data-provider='cursor'] { color: var(--tt-provider-cursor); }
/* ==== Prototype: the mock-up's own frame, chrome and switcher. Not Sotto's. ==== */
html, body { margin: 0; }
body { padding: 20px 24px 120px; background: var(--tt-canvas); }
.proto-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; max-width: 1280px; margin: 0 auto 8px; color: var(--tt-text-muted); font-size: var(--tt-type-small); }
.proto-top h1 { margin: 0; color: var(--tt-text); font-size: var(--tt-type-lead); font-weight: 600; }
.proto-top p { margin: 0; flex: 1 1 360px; }
.proto-sec { max-width: 1280px; margin: 0 auto 64px; scroll-margin-top: 12px; }
.proto-sec__head { display: grid; gap: 4px; margin: 0 0 12px; padding-top: 24px; border-top: 1px dashed var(--tt-hairline); }
.proto-sec__head h2 { margin: 0; color: var(--tt-text); font-size: var(--tt-type-lead); font-weight: 600; }
.proto-sec__head h2 span { color: var(--tt-text-muted); font-weight: 500; }
.proto-sec__ask { margin: 0; color: var(--tt-text-2); font-size: var(--tt-type-body); line-height: 1.5; max-width: 90ch; }
.proto-sec__note { margin: 0; color: var(--tt-text-muted); font-size: var(--tt-type-small); line-height: 1.5; max-width: 90ch; }
.proto-sec__note b { color: var(--tt-text-2); font-weight: 600; }
.proto-pick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.proto-pick button { min-height: 30px; padding: 0 10px; border: 1px dashed var(--tt-field-border); border-radius: 6px; background: transparent; color: var(--tt-text-2); font: inherit; font-size: var(--tt-type-small); text-align: left; }
.proto-pick button[aria-pressed='true'] { border-style: solid; border-color: var(--tt-text); color: var(--tt-text); background: var(--tt-hover); }
.proto-pick button:hover { color: var(--tt-text); }
.proto-pick__sep { width: 1px; margin: 4px 6px; background: var(--tt-hairline); }

/* One app window: sidebar and workspace, at a fixed size so heights read true. */
.mock-window { --win-h: 720px; position: relative; display: grid; grid-template-columns: 260px minmax(0, 1fr); width: 100%; height: var(--win-h); overflow: hidden; border: 1px solid var(--tt-hairline); border-radius: 10px; background: var(--tt-canvas); container: mockwin / inline-size; }
.mock-window[data-size='min'] { width: min(100%, 820px); --win-h: 560px; }
.mock-letter { position: absolute; top: 7px; right: 10px; z-index: 50; display: grid; place-items: center; min-width: 30px; height: 30px; padding: 0 8px; border: 2px dashed var(--tt-text); border-radius: 8px; background: var(--tt-canvas); color: var(--tt-text); font-size: 15px; font-weight: 800; letter-spacing: .02em; pointer-events: none; }
.mock-workspace { display: grid; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; min-width: 0; min-height: 0; }
.mock-workspace > .thread-pane + .thread-pane { border-left: 1px solid var(--tt-hairline); }
.thread-pane { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; container: thread-pane / inline-size; }
.thread-pane > .thread-workspace__head { padding-right: 52px; }
.mock-workspace > .thread-pane:not(:last-child) > .thread-workspace__head { padding-right: 12px; }
.thread-pane > .thread-transcript { flex: 1 1 auto; min-height: 0; }
.thread-pane > .thread-transcript > .thread-workspace__transcript { height: 100%; }
.thread-pane > .thread-workspace__compose { flex: none; }
.thread-pane[data-questions] > .thread-workspace__compose { flex: 0 1 auto; min-height: 0; }
.mock-head-btn { min-height: 30px; padding: 0 10px; gap: 6px; }

/* The sidebar, drawn simply from the sidebar roles. */
.mock-side { display: flex; flex-direction: column; min-height: 0; padding: 8px 8px 10px; background: var(--tt-sidebar); color: var(--tt-text); border-right: 1px solid var(--tt-sidebar-border, transparent); }
.mock-side__top { display: flex; align-items: center; gap: 6px; height: 28px; margin: 0 0 8px 4px; color: var(--tt-text-muted); }
.mock-side__logo { width: 22px; height: 22px; margin-right: auto; border-radius: 6px; background: var(--tt-accent); }
.mock-side__search { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid var(--tt-field-border); border-radius: var(--tt-radius-control); color: var(--tt-text-muted); font-size: var(--tt-type-small); }
.mock-side__group { display: flex; align-items: center; gap: 8px; margin: 16px 6px 6px; color: var(--tt-text); font-size: var(--tt-type-body); font-weight: 500; }
.mock-side__group small { margin-left: auto; color: var(--tt-text-muted); font-size: var(--tt-type-caption); }
.mock-row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; column-gap: 8px; row-gap: 2px; padding: 8px 10px; border: 1px solid transparent; border-radius: var(--tt-radius-row); font-size: var(--tt-type-body); }
.mock-row[aria-current] { background: var(--tt-sidebar-row-selected, var(--tt-selected)); border-color: var(--tt-selected-border); }
.mock-row > i { align-self: center; width: 9px; height: 9px; border: 2px solid var(--tt-text-muted); border-radius: 50%; opacity: .6; }
.mock-row > i[data-s='needs'] { border-color: var(--threads-attention, var(--tt-attention)); opacity: 1; }
.mock-row > i[data-s='work'] { border-color: var(--tt-activity); border-right-color: transparent; opacity: 1; }
.mock-row > b { overflow: hidden; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.mock-row > time { color: var(--tt-text-muted); font-size: var(--tt-type-caption); }
.mock-row > .provider-mark { grid-column: 2; color: var(--tt-text-muted); }
.mock-row > small { grid-column: 3; color: var(--tt-text-muted); font-size: var(--tt-type-caption); }
.mock-row > small[data-s='needs'] { color: var(--threads-attention, var(--tt-attention)); }
.mock-row > small[data-s='work'] { color: var(--tt-activity); }
.mock-side__foot { display: flex; gap: 14px; margin-top: auto; padding: 0 8px; color: var(--tt-text-muted); }
@container mockwin (max-width: 900px) { .mock-window:not([data-size='min']) { grid-template-columns: minmax(0, 1fr); } .mock-window:not([data-size='min']) > .mock-side { display: none; } .mock-workspace { grid-auto-flow: row; } .mock-workspace > .thread-pane + .thread-pane { border-left: 0; border-top: 1px solid var(--tt-hairline); } }

/* A line about the next turn, drawn where the quiet composer puts what it says about its chips. */
.mock-next-tag { display: inline-flex; align-items: center; height: 20px; margin-inline: 2px 4px; padding: 0 6px; border-radius: var(--tt-radius-tag); background: var(--tt-card-inset); color: var(--tt-text-2); font-size: var(--tt-type-caption); white-space: nowrap; }
.mock-secret { position: relative; }
.mock-secret > .agent-request__input { min-height: 40px; padding-right: 44px; resize: none; font-family: var(--tt-font-mono); letter-spacing: .1em; }
.mock-secret > button { position: absolute; top: 50%; right: 4px; display: grid; place-items: center; width: 32px; height: 32px; margin-top: 2px; padding: 0; border: 0; border-radius: var(--tt-radius-row); background: transparent; color: var(--tt-text-muted); transform: translateY(-50%); }
.mock-secret > button:hover { background: var(--tt-hover); color: var(--tt-text); }
.mock-default { margin-left: 6px; color: var(--tt-text-muted); font-size: var(--tt-type-small); white-space: nowrap; }

/* The real list opens from the shield's left edge (threadChips.css). Near the quiet composer's right end that runs past the
   pane, so the mock-up opens it from the shield's right edge instead; see the section note. */
.thread-prompt__shield .thread-chip-menu__list { left: auto; right: 0; }

/* The floating switcher: plainly not part of the design. */
.proto-bar { position: fixed; left: 50%; bottom: 14px; z-index: 100; display: flex; width: max-content; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; max-width: calc(100vw - 16px); padding: 6px 8px; border: 2px solid var(--tt-text); border-radius: 12px; background: var(--tt-text); color: var(--tt-canvas); box-shadow: 0 10px 40px rgb(0 0 0 / 45%); transform: translateX(-50%); font-size: 13px; }
.proto-bar button { min-height: 32px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: inherit; font: inherit; font-weight: 600; }
.proto-bar button:hover { background: color-mix(in srgb, var(--tt-canvas) 14%, transparent); }
.proto-bar button[aria-pressed='true'] { background: var(--tt-canvas); color: var(--tt-text); }
.proto-bar__label { min-width: 0; max-width: 46ch; padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proto-bar__sep { width: 1px; height: 22px; background: color-mix(in srgb, var(--tt-canvas) 30%, transparent); }
.proto-bar select { min-height: 32px; border: 0; border-radius: 7px; background: color-mix(in srgb, var(--tt-canvas) 12%, transparent); color: inherit; font: inherit; font-weight: 600; }
.proto-bar select option { color: var(--tt-text); background: var(--tt-surface-elevated); }

@media (max-width: 700px) {
  body { padding: 12px 10px 150px; }
  .mock-window:not([data-size='min']) { height: auto; }
  .mock-window:not([data-size='min']) .thread-pane { height: 640px; }
  .proto-bar__label { display: none; }
}
/* Bare: one window filling the viewport, for screenshots at a window size. */
html[data-bare] body { padding: 0; }
html[data-bare] :is(.proto-top, .proto-sec__head, .proto-bar) { display: none; }
html[data-bare] .proto-sec { max-width: none; margin: 0; }
html[data-bare] .proto-sec:not([data-active]) { display: none; }
html[data-bare] .mock-window, html[data-bare] .mock-window[data-size='min'] { width: 100vw; height: 100vh; border: 0; border-radius: 0; }
</style>
</head>
<body>
<header class="proto-top">
  <h1>Codex audit: six choices for Zach</h1>
  <p>Throwaway mock-up, 4 November 2026. Each section is one issue; the bar at the bottom switches the section in view, and the address keeps your pick (for example <code>#2149-B</code>). Fake threads, the real Threads page styles.</p>
  <button type="button" class="tt-button" id="theme-top">Light</button>
</header>
<main id="sections"></main>
<nav class="proto-bar" aria-label="Prototype switcher">
  <select id="bar-sec" aria-label="Section"></select>
  <span class="proto-bar__sep"></span>
  <button type="button" id="bar-prev" aria-label="Previous variant">&larr;</button>
  <span id="bar-letters"></span>
  <button type="button" id="bar-next" aria-label="Next variant">&rarr;</button>
  <span class="proto-bar__label" id="bar-label"></span>
  <span class="proto-bar__sep"></span>
  <button type="button" id="bar-theme">Light</button>
</nav>
<script>
