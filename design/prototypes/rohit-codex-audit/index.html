/* Sotto management-window palette — themes.

   The window paints from one theme per appearance (Settings → Appearance →
   Themes, ADR-0011), with the 57 semantic roles T3 Code's themes carry.
   state/appearance.ts writes the active theme's roles onto the root as
   --theme-* custom properties, together with data-theme="light|dark" (the
   RESOLVED mode) and data-theme-id. The --theme-* values in the first two
   blocks are only first-paint defaults (Sotto, the default theme) for the
   moment before that script runs.

   Feature CSS never reads --theme-* or branches on the theme id: it reads the
   --tt-* tokens, and this file is the only place they are derived. Foreground
   and border tokens pass through the Contrast setting the way T3 Code's do: at
   or below 100% a foreground mixes toward its own background and a border
   toward transparent; above 100% foregrounds push toward white (dark) or
   black (light) and borders toward the text colour. The floating surfaces in
   glass.css are solid (ADR-0084).

   Only canonical oklch() text is ever written to --theme-*, so a theme cannot
   carry a url(), var() or another declaration into the page.

   tests/unit/renderer/themeTokens.test.ts parses this file and resolves the
   text tokens for every built-in theme in both modes against their surfaces.

   The floating widget does NOT read this file. It keeps its own frozen copy in
   `widget/widget-tokens.css` and follows the system scheme. */

/* Tokens every feature reads. Declared once for both modes: the theme roles
   already differ per mode, and the few constants that do not come from a theme
   (status green, provider marks, shadows, glass blur) are set per mode below.
   A custom property substitutes its var()s where it is declared, so an element
   that carries `data-theme-scope` with its own --theme-* roles (the preview on
   Settings → Appearance, showing the other half) re-derives every token from
   them here without repainting the window. */
:root, [data-theme-scope] {
  --theme-contrast-target: white;
  --tt-glass-blur: 16px;
  --tt-glass-saturation: 1.08;

  --tt-canvas: var(--theme-canvas);
  --tt-chrome: var(--theme-chrome);
  --tt-surface: var(--theme-surface);
  --tt-surface-elevated: var(--theme-surface-raised);
  --tt-surface-overlay: var(--theme-surface-overlay);
  --tt-surface-sunken: var(--theme-muted);
  --tt-panel: var(--theme-surface);
  --tt-sidebar: var(--theme-sidebar);
  --tt-field: var(--theme-surface);
  /* A card is a filled container with no outline, one step off the room: the raised surface by night, a step
     darker than the canvas by day (set in the light block below). Rows inside it divide with a line of the inset,
     and fields, samples and tracks inside it take the inset too. The selected card or item wears the accent
     surface mixed into the card. */
  --tt-card: var(--theme-surface-raised);
  /* The card's own solid colour, which Glass's translucent card leaves in place for what must stay solid. */
  --tt-card-solid: var(--theme-surface-raised);
  --tt-card-inset: var(--theme-canvas);
  --tt-card-selected: color-mix(in oklab, var(--theme-accent-surface) 65%, var(--tt-card));
  /* A segmented control is a sunken track with the chosen segment raised out of it: the overlay by night, the
     surface by day (set in the light block below). */
  --tt-segment-on: var(--theme-surface-overlay);

  --tt-text: color-mix(in oklab, color-mix(in oklab, var(--theme-text) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-text-2: color-mix(in oklab, color-mix(in oklab, color-mix(in oklab, var(--theme-text) 55%, var(--theme-muted-foreground)) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-text-muted: color-mix(in oklab, color-mix(in oklab, color-mix(in oklab, var(--theme-muted-foreground) 85%, var(--theme-text)) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-boost));
  /* The prompt's hint (its placeholder): the theme's own Placeholder role, the ink every other field's placeholder takes.
     It was the Muted text role, but a theme can draw its muted text close to its body text (Vellum Night's sits at
     7.7:1 on the composer card, against the body's 12:1), and a hint that bright reads as typed words (Drake, November
     2, 2026). High Contrast lifts it at half strength, so at the top step it stays dimmer than typed words, which go to
     pure white (or black) there. */
  --tt-text-hint: color-mix(in oklab, color-mix(in oklab, var(--theme-placeholder) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-hint-boost));
  --tt-text-faint: color-mix(in oklab, color-mix(in oklab, var(--theme-placeholder) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-boost));

  /* Boundaries: `border` draws rules, `input` outlines fields, and the
     control boundary leans toward the muted text so a control stays findable. */
  --tt-border-faint: color-mix(in srgb, color-mix(in srgb, var(--theme-border) var(--theme-contrast-base), transparent), var(--theme-text) var(--theme-contrast-border-boost));
  --tt-hairline: var(--tt-border-faint);
  --tt-panel-border: var(--tt-border-faint);
  --tt-field-border: color-mix(in srgb, color-mix(in srgb, var(--theme-input) var(--theme-contrast-base), transparent), var(--theme-text) var(--theme-contrast-border-boost));
  --tt-border: color-mix(in srgb, color-mix(in srgb, color-mix(in oklab, var(--theme-input) 25%, var(--theme-muted-foreground)) var(--theme-contrast-base), transparent), var(--theme-text) var(--theme-contrast-border-boost));

  --tt-hover: color-mix(in srgb, var(--theme-accent-surface) 70%, transparent);
  --tt-hover-strong: var(--theme-accent-surface);
  --tt-track: color-mix(in srgb, var(--theme-text) 4%, transparent);
  --tt-bubble: var(--theme-message-surface);
  --tt-bubble-text: color-mix(in oklab, color-mix(in oklab, var(--theme-message-foreground) var(--theme-contrast-base), var(--theme-message-surface)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-kbd: var(--theme-secondary);
  --tt-skeleton-a: var(--theme-surface);
  --tt-skeleton-b: var(--theme-surface-raised);
  --tt-scrollbar: var(--theme-terminal-scrollbar);
  --tt-scrollbar-hover: var(--theme-terminal-scrollbar-hover);
  /* The neutral pill carries a page's one action in the theme's own ink. */
  --tt-pill: var(--tt-text);
  --tt-pill-ink: var(--theme-canvas);

  --tt-warning: color-mix(in oklab, color-mix(in oklab, var(--theme-warning-foreground) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-warning-text: var(--tt-warning);
  --tt-warning-surface: var(--theme-warning-surface);
  --tt-attention: var(--tt-warning);
  --tt-error: color-mix(in oklab, color-mix(in oklab, var(--theme-error-foreground) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-error-text: var(--tt-error);
  --tt-danger: var(--tt-error);
  --tt-error-contrast: var(--theme-canvas);
  --tt-error-surface: var(--theme-error-surface);
  --tt-error-border: color-mix(in oklab, var(--theme-error) 38%, var(--theme-error-surface));
  /* Mark up's red and amber inks (ADR-0170, part 5): the theme's error and warning colours at full strength, which stand
     out on any picture, where the text roles above are tuned to read on the theme's own surfaces. */
  --tt-ink-red: var(--theme-error);
  --tt-ink-amber: var(--theme-warning);
  /* Status text on a tinted surface, the selection or the bubble, steps toward the body ink so it keeps 4.5:1. */
  --tt-warning-on-tint: color-mix(in oklab, var(--tt-warning-text) 90%, var(--tt-text));
  --tt-error-on-tint: color-mix(in oklab, var(--tt-error-text) 80%, var(--tt-text));
  --tt-update: var(--theme-update);
  --tt-update-text: color-mix(in oklab, color-mix(in oklab, var(--theme-update-foreground) var(--theme-contrast-base), var(--theme-update-surface)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-update-surface: var(--theme-update-surface);

  --tt-code-bg: var(--theme-code-background);
  --tt-code-border: var(--tt-border-faint);
  --tt-code-text: color-mix(in oklab, color-mix(in oklab, var(--theme-code-foreground) var(--theme-contrast-base), var(--theme-code-background)), var(--theme-contrast-target) var(--theme-contrast-boost));

  /* The accent: the live wave, focus, selection and accent-coloured text.
     Accent text uses the theme's readable accent tone, not the raw fill. */
  --tt-accent: var(--theme-accent);
  --tt-accent-hover: color-mix(in oklab, var(--theme-accent) 84%, var(--theme-contrast-target));
  --tt-accent-text: color-mix(in oklab, color-mix(in oklab, var(--theme-update-foreground) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-on-accent: var(--theme-accent-foreground);
  --tt-focus-ring: var(--theme-focus);

  /* Primary actions are the theme's message action, as in T3 Code. */
  --tt-primary: var(--theme-message-action);
  --tt-primary-hover: var(--theme-message-action-hover);
  --tt-primary-contrast: var(--theme-message-action-foreground);
  --tt-activity: var(--tt-accent-text);
  --tt-link: var(--tt-accent-text);
  --tt-accent-wash: color-mix(in srgb, var(--tt-accent) 14%, transparent);
  --tt-activity-wash: var(--tt-accent-wash);
  --tt-accent-border: color-mix(in srgb, var(--tt-accent) 45%, var(--tt-field-border));
  --tt-field-border-focus: color-mix(in srgb, var(--tt-accent) 55%, var(--tt-field-border));
  --tt-selected: var(--theme-sidebar-row-selected);
  --tt-selected-border: color-mix(in srgb, var(--tt-accent) 30%, var(--tt-field-border));
  /* Outline for colour swatches whose fill is not a theme colour. */
  --tt-swatch-edge: color-mix(in srgb, var(--theme-text) 22%, transparent);
  --tt-table-stripe: color-mix(in srgb, var(--tt-text) 3%, transparent);

  /* Surfaces that own their palette: the sidebar, toolbars, accent and
     secondary surfaces, and terminals. */
  --tt-sidebar-text: color-mix(in oklab, color-mix(in oklab, var(--theme-sidebar-foreground) var(--theme-contrast-base), var(--theme-sidebar)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-sidebar-text-muted: color-mix(in oklab, color-mix(in oklab, var(--theme-sidebar-muted-foreground) var(--theme-contrast-base), var(--theme-sidebar)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-sidebar-control: var(--theme-sidebar-control-surface);
  --tt-sidebar-row-hover: var(--theme-sidebar-row-hover);
  --tt-sidebar-row-active: var(--theme-sidebar-row-active);
  --tt-sidebar-row-selected: var(--theme-sidebar-row-selected);
  --tt-sidebar-border: color-mix(in srgb, color-mix(in srgb, var(--theme-sidebar-border) var(--theme-contrast-base), transparent), var(--theme-sidebar-foreground) var(--theme-contrast-border-boost));
  --tt-toolbar: var(--theme-toolbar);
  --tt-toolbar-text: color-mix(in oklab, color-mix(in oklab, var(--theme-toolbar-foreground) var(--theme-contrast-base), var(--theme-toolbar)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-toolbar-border: color-mix(in srgb, color-mix(in srgb, var(--theme-toolbar-border) var(--theme-contrast-base), transparent), var(--theme-toolbar-foreground) var(--theme-contrast-border-boost));
  --tt-toolbar-control: var(--theme-toolbar-control);
  --tt-toolbar-control-text: color-mix(in oklab, color-mix(in oklab, var(--theme-toolbar-control-foreground) var(--theme-contrast-base), var(--theme-toolbar-control)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-toolbar-control-hover: var(--theme-toolbar-control-hover);
  --tt-secondary: var(--theme-secondary);
  --tt-secondary-text: color-mix(in oklab, color-mix(in oklab, var(--theme-secondary-foreground) var(--theme-contrast-base), var(--theme-secondary)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-accent-surface: var(--theme-accent-surface);
  --tt-accent-surface-text: color-mix(in oklab, color-mix(in oklab, var(--theme-accent-surface-foreground) var(--theme-contrast-base), var(--theme-accent-surface)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-terminal-background: var(--theme-terminal-background);
  --tt-terminal-foreground: color-mix(in oklab, color-mix(in oklab, var(--theme-terminal-foreground) var(--theme-contrast-base), var(--theme-terminal-background)), var(--theme-contrast-target) var(--theme-contrast-boost));

  --tt-glass-filter: blur(var(--tt-glass-blur)) saturate(var(--tt-glass-saturation));

  /* Sotto Owl's night sky behind the sidebar header (agents/owlSky.css). The stars are the sidebar's own text at
     four low strengths, three of them in the accent, and the accent glows faintly behind the tile. The night is the
     sidebar a hair darker with its chroma lifted, on the sidebar's own hue; a sidebar with no hue (Citrine) borrows
     Sotto's night blue, 265. The search field is a deeper pool of that night, so its placeholder reads within a
     twentieth of how it reads on the theme's own field.
     --owl-night-hue is a channel expression, so it is only valid inside a relative oklch(). */
  --owl-night-hue: calc(h * clamp(0, (c - .001) * 100000, 1) + 265 * (1 - clamp(0, (c - .001) * 100000, 1)));
  --tt-owl-star: var(--tt-sidebar-text);
  --tt-owl-star-accent: var(--tt-accent);
  --tt-owl-star-o1: .62;
  --tt-owl-star-o2: .38;
  --tt-owl-star-o3: .22;
  --tt-owl-star-o4: .13;
  --tt-owl-faintest-stars: block;
  --tt-owl-star-scale: 1;
  --tt-owl-glow: color-mix(in srgb, var(--tt-accent) 11%, transparent);
  /* The light crossing a running turn's working words (agents/activity.css): the accent at its most vivid, lifted well
     above the words' muted ink so it reads on any theme, however dull its accent. */
  --tt-working-light: oklch(from var(--tt-accent) max(l, .9) min(calc(c * 1.6), .2) h);
  --tt-owl-night: oklch(from var(--tt-sidebar) calc(l - .011) min(calc(c + .025), .05) var(--owl-night-hue));
  --tt-owl-night-field: oklch(from var(--tt-sidebar) calc(l - .05) min(calc(c + .023), .045) var(--owl-night-hue));
  /* Watcher's room has no sidebar, so its night sits in the room's top-left corner (watcher/watcher.css), derived
     from the canvas as the sidebar's is from the sidebar: the canvas is the darkest surface, so a little lighter
     than it, chroma lifted, on the same hue. */
  --tt-owl-room-night: oklch(from var(--tt-canvas) calc(l + .04) min(calc(c + .028), .055) var(--owl-night-hue));
  /* The collapsed rail's trays (agents/threadSidebar.css) take these in turn: the accent, then the accent turned round
     the hue wheel at its own lightness and chroma, so a quiet accent gives quiet trays. A grey accent borrows the
     Sotto Owl night's blue and a little chroma, so its trays still differ. A turned hue that lands on red, orange or
     amber (under 75), the error and attention colours, turns a further 120 degrees. On Citrine they are its yellow,
     a blue, a green and a pink. Like --owl-night-hue, the --rail-* parts are channel expressions, valid only inside
     a relative oklch(). */
  --rail-chroma: calc(c + .1 * (1 - clamp(0, (c - .001) * 100000, 1)));
  --rail-turn-2: calc(var(--owl-night-hue) + 155);
  --rail-turn-3: calc(var(--owl-night-hue) + 60);
  --rail-turn-4: calc(var(--owl-night-hue) + 245);
  --rail-hue-2: calc(var(--rail-turn-2) - 360 * clamp(0, (var(--rail-turn-2) - 360) * 100000, 1));
  --rail-hue-3: calc(var(--rail-turn-3) - 360 * clamp(0, (var(--rail-turn-3) - 360) * 100000, 1));
  --rail-hue-4: calc(var(--rail-turn-4) - 360 * clamp(0, (var(--rail-turn-4) - 360) * 100000, 1));
  --tt-rail-group-1: oklch(from var(--tt-accent) l var(--rail-chroma) var(--owl-night-hue));
  --tt-rail-group-2: oklch(from var(--tt-accent) l var(--rail-chroma) calc(var(--rail-hue-2) + 120 * clamp(0, (75 - var(--rail-hue-2)) * 100000, 1)));
  --tt-rail-group-3: oklch(from var(--tt-accent) l var(--rail-chroma) calc(var(--rail-hue-3) + 120 * clamp(0, (75 - var(--rail-hue-3)) * 100000, 1)));
  --tt-rail-group-4: oklch(from var(--tt-accent) l var(--rail-chroma) calc(var(--rail-hue-4) + 120 * clamp(0, (75 - var(--rail-hue-4)) * 100000, 1)));

  --tt-success: oklch(0.79 0.13 165);
  --tt-provider-codex: #d7dbe1;
  --tt-provider-claude: #e3b58e;
  --tt-provider-grok: #c9baff;
  --tt-provider-devin: #a5d8f5;
  --tt-provider-opencode: #ece3d0;
  --tt-provider-cursor: #f2b9c9;
  /* Settings → Providers draws each mark in the ink on a badge of its provider's colour. Muse has no other colour
     here, and OpenCode's and Cursor's badges keep a pale shade in both modes: their light glyph colours are too dark
     under the ink. */
  --tt-provider-muse: #e6e1d6;
  --tt-provider-opencode-badge: #ece3d0;
  --tt-provider-cursor-badge: #f2b9c9;
  /* DeepSeek's whale has no colour elsewhere, so its badge is a pale shade of DeepSeek's own blue (#4d6bfe). */
  --tt-provider-deepseek-badge: #a3b3ff;
  --tt-provider-ink: #080b0a;
  /* Chart series (Usage's split chart). Constants per mode like the provider marks: a theme carries T3 Code's
     roles, which name no categorical hues. Six hues and an Other grey, each at least 3:1 on every built-in theme's
     canvas and surface, and every pair, Other included, apart for protanopia and deuteranopia (Machado 2009, OKLab
     distance at least 8 in both modes; themeTokens.test.ts holds both). Slot 1 to 6: blue, orange, cyan, magenta,
     violet, amber. */
  --tt-chart-1: #3792fd;
  --tt-chart-2: #b85207;
  --tt-chart-3: #1dcaf7;
  --tt-chart-4: #c33786;
  --tt-chart-5: #8056d6;
  --tt-chart-6: #c99414;
  --tt-chart-other: #9e9e9e;
  --tt-overlay: color-mix(in srgb, var(--theme-canvas) 64%, transparent);
  --tt-backdrop: rgb(0 0 0 / 38%);
  /* The effort control (ADR-0019): a pill track in the card, and the colourway chosen in Settings → Appearance
     for the fill, the wash and the tinted word at a model's highest level. The colourway's three hues
     (`--tt-effort-a/b/c`), its ink and its border hue are set per colourway after the mode blocks; the tokens
     here shape them for the mode. `--tt-effort-text-fill` is the colour the word is painted in and
     `--tt-effort-text-image` the gradient clipped to it, so a colourway that paints its word as a gradient
     needs no branch in feature CSS. */
  --tt-effort-track: color-mix(in srgb, var(--tt-text) 7%, var(--tt-surface-elevated));
  --tt-effort-dot: color-mix(in srgb, var(--tt-text-muted) 55%, var(--tt-effort-track));
  --tt-effort-fill-cool: var(--tt-text-muted);
  --tt-effort-fill-veil: transparent;
  --tt-effort-thumb: var(--tt-text);
  --tt-effort-thumb-edge: color-mix(in srgb, var(--tt-text) 10%, transparent);
  --tt-effort-text: var(--effort-ink);
  --tt-effort-text-fill: var(--tt-effort-text);
  --tt-effort-text-image: none;
  --tt-effort-fill-image: linear-gradient(90deg, var(--tt-effort-a), var(--tt-effort-b), var(--tt-effort-c));
  --tt-effort-wash-image: linear-gradient(to top, var(--tt-effort-a), var(--tt-effort-b), var(--tt-effort-c));

  --tt-shadow-sm: 0 1px 2px rgb(0 0 0 / 40%);
  --tt-shadow-lg: 0 24px 60px rgb(0 0 0 / 55%);
  --tt-shadow-overlay: 0 24px 72px -20px rgb(0 0 0 / 90%);
  --tt-shadow-color: rgb(0 0 0 / 73%);
  /* How strongly the effort trace's halo falls on the room (effortTrace.css); a light room takes a little more. */
  --tt-effort-trace-halo: .55;

  /* Type sizes (ADR-0169). Every font-size in a renderer stylesheet names one of these steps, and
     scaleTokens.test.ts holds it there. `--tt-text-*` already names text colours, so sizes are `--tt-type-*`. */
  --tt-type-micro: 11px; /* Keys, badges and tiny marks */
  --tt-type-caption: 12px; /* Times, counts, statuses, metadata */
  --tt-type-small: 13px; /* Descriptions, controls, most interface text */
  --tt-type-body: 14px; /* Sidebar rows, fields, menu items */
  --tt-type-reading: 15px; /* Transcript, composer, journal entries, settings labels */
  --tt-type-lead: 16px; /* Dialog titles, section intros, request prompts */
  --tt-type-heading: 18px; /* Sidebar brand, empty-room headings */
  --tt-type-figure: 22px; /* Figures in a narrow room, sub-titles */
  --tt-type-title: 28px; /* Room titles and large figures */

  /* Corners (ADR-0169), by what they round. Every border-radius names one of these steps. */
  --tt-radius-mark: 2px; /* Meters, legend squares, focus marks */
  --tt-radius-tag: 4px; /* Tags, keys, chips, small close buttons */
  --tt-radius-control: 6px; /* Buttons, fields, composer chips */
  --tt-radius-row: 8px; /* Sidebar and menu rows, icon buttons */
  --tt-radius-inset: 10px; /* Code blocks, menus, notes inside a card */
  --tt-radius-card: 14px; /* Cards, the full composer, the Dictate bar */
  --tt-radius-overlay: 20px; /* Dialogs, Zach's two-row composer and the widget */
  --tt-radius-full: 50%; /* Dots and rings: a circle on a square box, never a pill (ADR-0110) */
  /* The names before the scale, kept so whatever names them still rounds the same. */
  --tt-radius-sm: var(--tt-radius-control);
  --tt-radius-md: var(--tt-radius-inset);
  --tt-radius-lg: var(--tt-radius-card);
  --tt-font-ui:
    'Figtree', ui-sans-serif, system-ui, -apple-system,
    BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --tt-font-mono:
    'Spline Sans Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo,
    Consolas, 'Liberation Mono', monospace;
}

:root[data-theme='light'], [data-theme-scope='light'] {
  --theme-contrast-target: black;
  /* By day the raised surface is barely off the canvas, so a card is the canvas with a little of the text in it. */
  --tt-card: color-mix(in oklab, var(--theme-text) 4%, var(--theme-canvas));
  --tt-card-solid: color-mix(in oklab, var(--theme-text) 4%, var(--theme-canvas));
  --tt-segment-on: var(--theme-surface);
  --tt-glass-blur: 12px;
  --tt-glass-saturation: 1.14;
  --tt-success: oklch(0.445 0.11 158);
  --tt-provider-codex: #c9ced6;
  --tt-provider-claude: #e2ad80;
  --tt-provider-grok: #bfaefc;
  --tt-provider-devin: #8fcaef;
  /* OpenCode's mark is drawn straight from its token in both modes, so the light one is already dark enough to read. */
  --tt-provider-opencode: #625843;
  /* Cursor's, like OpenCode's, is drawn straight from its token in both modes: a pale rose by night, a deep one by day. */
  --tt-provider-cursor: #94405a;
  --tt-provider-muse: #d9d3c4;
  --tt-provider-opencode-badge: #e4dac4;
  --tt-provider-cursor-badge: #eaaabd;
  --tt-provider-deepseek-badge: #93a6ff;
  --tt-provider-ink: #0b0d0c;
  --tt-chart-1: #0554a3;
  --tt-chart-2: #883c04;
  --tt-chart-3: #038db6;
  --tt-chart-4: #980563;
  --tt-chart-5: #885ee0;
  --tt-chart-6: #a07506;
  --tt-chart-other: #747474;
  --tt-overlay: color-mix(in srgb, var(--theme-canvas) 60%, transparent);
  --tt-backdrop: rgb(20 24 22 / 22%);
  --tt-shadow-sm: 0 1px 2px rgb(20 24 22 / 10%);
  --tt-shadow-lg: 0 24px 60px rgb(20 24 22 / 18%);
  --tt-shadow-overlay: 0 24px 64px -24px rgb(0 0 0 / 45%);
  --tt-shadow-color: rgb(20 24 22 / 18%);
  /* Light: the effort fill tints toward white so it stays a light surface, the thumb is paper with an edge,
     and the tinted word mixes toward the ink so it reads at 4.5:1. */
  --tt-effort-fill-cool: color-mix(in srgb, var(--tt-text-muted) 40%, var(--tt-surface-elevated));
  --tt-effort-fill-veil: color-mix(in srgb, white 38%, transparent);
  --tt-effort-thumb: var(--tt-surface);
  --tt-effort-thumb-edge: var(--tt-border);
  --tt-effort-text: var(--effort-ink-light);
  /* Sotto Owl's sky by day: grey dots on a light surface read as dust, so the stars take the accent, a little
     larger, and the faintest drop out. There is no night by day. The band is a faint wash of the accent's hue: the
     accent is mixed in at full lightness, so the wash is never darker than the sidebar whatever the theme. The field
     and the switch keep their own colours. */
  --tt-owl-star: var(--tt-accent);
  --tt-owl-star-o1: .58;
  --tt-owl-star-o2: .44;
  --tt-owl-star-o3: .32;
  --tt-owl-star-o4: 0;
  --tt-owl-faintest-stars: none;
  --tt-owl-star-scale: 1.2;
  --tt-owl-glow: color-mix(in srgb, var(--tt-accent) 8%, transparent);
  /* By day the light is the accent deepened instead, below the muted ink. */
  --tt-working-light: oklch(from var(--tt-accent) min(l, .38) min(calc(c * 1.6), .2) h);
  --tt-owl-night: color-mix(in oklab, var(--tt-sidebar) 90%, oklch(from var(--tt-accent) 1 c h));
  --tt-owl-room-night: color-mix(in oklab, var(--tt-canvas) 90%, oklch(from var(--tt-accent) 1 c h));
  --tt-owl-night-field: var(--tt-field);
  --tt-effort-trace-halo: .7;
}

/* The effort colourways (ADR-0019). Ember and Theme accent come from theme roles; Cyberpunk, Rainbow, Aurora
   and Plasma are fixed palettes a theme does not carry. Keyed on the attribute alone, so a Settings swatch can
   wear a colourway the root does not; the bare `:root` line is the first paint before the setting arrives. */
:root, [data-effort-color='ember'] {
  --tt-effort-a: var(--theme-warning);
  --tt-effort-b: var(--theme-warning);
  --tt-effort-c: color-mix(in srgb, var(--theme-warning) 60%, var(--tt-text));
  --tt-effort-border: var(--theme-warning);
  --effort-ink: color-mix(in oklab, var(--tt-warning) 70%, var(--tt-text));
  --effort-ink-light: var(--effort-ink);
}
/* A custom property substitutes its var()s where it is declared, so an element wearing its own colourway
   re-derives the gradients from its own hues here rather than inheriting the root's. */
[data-effort-color] {
  --tt-effort-text-fill: var(--tt-effort-text);
  --tt-effort-text-image: none;
  --tt-effort-fill-image: linear-gradient(90deg, var(--tt-effort-a), var(--tt-effort-b), var(--tt-effort-c));
  --tt-effort-wash-image: linear-gradient(to top, var(--tt-effort-a), var(--tt-effort-b), var(--tt-effort-c));
}
[data-effort-color='accent'] {
  --tt-effort-a: var(--theme-accent);
  --tt-effort-b: var(--theme-accent);
  --tt-effort-c: color-mix(in srgb, var(--theme-accent) 55%, var(--tt-text));
  --tt-effort-border: var(--theme-accent);
  --effort-ink: var(--tt-accent-text);
  --effort-ink-light: var(--tt-accent-text);
}
/* The fixed palettes name a bright ink for dark rooms and a deep one of the same hue for light, where a
   bright neon mixed toward the text would still fall short of 4.5:1 on a light card. */
[data-effort-color='cyberpunk'] {
  --tt-effort-a: oklch(0.7 0.3 345);
  --tt-effort-b: oklch(0.62 0.27 305);
  --tt-effort-c: oklch(0.86 0.15 200);
  --tt-effort-border: oklch(0.7 0.3 345);
  --effort-ink: oklch(0.86 0.15 200);
  --effort-ink-light: oklch(0.44 0.22 335);
}
[data-effort-color='aurora'] {
  --tt-effort-a: oklch(0.86 0.18 160);
  --tt-effort-b: oklch(0.82 0.14 200);
  --tt-effort-c: oklch(0.68 0.22 300);
  --tt-effort-border: oklch(0.82 0.14 200);
  --effort-ink: oklch(0.87 0.16 165);
  --effort-ink-light: oklch(0.44 0.12 175);
}
[data-effort-color='plasma'] {
  --tt-effort-a: oklch(0.42 0.25 300);
  --tt-effort-b: oklch(0.68 0.29 350);
  --tt-effort-c: oklch(0.86 0.18 75);
  --tt-effort-border: oklch(0.68 0.29 350);
  --effort-ink: oklch(0.8 0.2 20);
  --effort-ink-light: oklch(0.45 0.22 350);
}
/* Rainbow paints its word as the spectrum itself; the ink is the fallback where text cannot clip a gradient. */
[data-effort-color='rainbow'] {
  --tt-effort-a: oklch(0.7 0.24 20);
  --tt-effort-b: oklch(0.8 0.2 130);
  --tt-effort-c: oklch(0.7 0.24 300);
  --tt-effort-border: oklch(0.7 0.22 300);
  --effort-ink: oklch(0.82 0.16 200);
  --effort-ink-light: oklch(0.44 0.2 290);
  --effort-spectrum: linear-gradient(90deg, oklch(0.7 0.24 20), oklch(0.82 0.18 70), oklch(0.85 0.2 130), oklch(0.85 0.14 200), oklch(0.65 0.24 280), oklch(0.7 0.28 340));
  --tt-effort-text-fill: transparent;
  --tt-effort-text-image: var(--effort-spectrum);
  --tt-effort-fill-image: var(--effort-spectrum);
  --tt-effort-wash-image: var(--effort-spectrum);
}
:root[data-theme='light'][data-effort-color='rainbow'], [data-theme-scope='light'][data-effort-color='rainbow'] {
  --tt-effort-text-image: linear-gradient(90deg, oklch(0.55 0.22 20), oklch(0.6 0.16 70), oklch(0.58 0.18 140), oklch(0.55 0.13 210), oklch(0.5 0.22 280), oklch(0.55 0.25 340));
}

/* Glass, the see-through theme (ADR-0150). appearance.ts marks the root data-glass only while Glass paints and writes
   its tints as --theme-glass-*: the room once over whatever is behind the window, and the sidebar, its rows, the cards
   and the user's messages translucent over the room. Menus, dialogs, fields, code and the terminal keep their solid
   roles. Where nothing is drawn behind the window the room sits on the backdrop, a quiet gradient in the theme's own
   hues (in-app glass). Last in the file, so it outranks the light block's card. */
:root[data-glass] {
  --tt-glass-room: var(--theme-glass-room);
  --tt-glass-backdrop: linear-gradient(135deg, var(--theme-glass-backdrop-1), var(--theme-glass-backdrop-2) 55%, var(--theme-glass-backdrop-3));
  --tt-sidebar: var(--theme-glass-sidebar);
  --tt-card: var(--theme-glass-raised);
  --tt-bubble: var(--theme-glass-message);
  --tt-sidebar-row-hover: var(--theme-glass-row-hover);
  --tt-sidebar-row-active: var(--theme-glass-row-active);
  --tt-sidebar-row-selected: var(--theme-glass-row-selected);
  --tt-selected: var(--theme-glass-row-selected);
  /* Glass's muted text stands close to its body text by night (oklch 0.86 against 0.985), so the prompt's hint mixes it
     with the room's solid colour too, 86% muted, which keeps it 2:1 from typed words and 4.5:1 on the glass card over
     pure white or black behind the window, at every Contrast (Zach's pick on October 31, 2026). */
  --tt-text-hint: color-mix(in oklab, color-mix(in oklab, color-mix(in oklab, var(--theme-text-muted) 86%, var(--theme-canvas)) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-hint-boost));
}
/* By day the room can go as dark as its tint over black, so the status green deepens to keep 4.5:1 there. */
:root[data-glass][data-theme='light'] {
  --tt-success: oklch(0.4 0.1 158);
}

/* A mode or theme switch repaints at once: no colour transition runs mid-switch. */
:root[data-theme-switching] *,
:root[data-theme-switching] *::before,
:root[data-theme-switching] *::after {
  transition: none !important;
}
/* ==== global.css 16-300 ==== */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body,
#root {
  min-height: 100%;
  margin: 0;
}

/* The room macOS paints its traffic lights into at the window's top left, which none of our elements may occupy:
   the 16px inset, the three lights (wider since macOS 26, about 60px across) and a gap that keeps the mark clear
   of them. Every surface that meets the window's corner on macOS keeps this room. */
:root { --mac-lights-room: 88px; }

body {
  min-width: 320px;
  background: var(--tt-canvas);
  color: var(--tt-text);
  font-family: var(--tt-font-ui);
  font-optical-sizing: auto;
  font-size: var(--tt-type-body);
  line-height: 1.5;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

button,
input,
select,
textarea {
  color: inherit;
  font: inherit;
}

/* A desktop control is pressed, not selected: double-clicking a button, tab or
   switch must not paint its label the way a paragraph is painted. Text a user
   copies keeps its selection in fields, transcripts and code. */
button,
summary,
[role='button'],
[role='tab'],
[role='switch'],
[role='menuitem'],
[role='option'] {
  user-select: none;
}

/* The pointer (#1832). A control shows the arrow, as a desktop app's buttons, rows, tabs and toggles do; the hand is
   only for a link that opens a page or a file, in a reply or out to the web, and for a text link drawn as a button
   that opens a page outside Sotto, which says so with `data-outside-link`; text keeps the I-beam. This is the one
   place either is set: zero specificity, so a disabled, dragged or resizing control's own cursor still wins, and a
   choice drawn as a label or a row says `cursor: default` itself, since a label would hand it to a field inside. */
:where(button, summary, select, [role='button'], [role='tab'], [role='switch'], [role='checkbox'], [role='radio'],
  [role='menuitem'], [role='menuitemradio'], [role='menuitemcheckbox'], [role='option'], [role='slider'], [role='treeitem'],
  input:is([type='checkbox'], [type='radio'], [type='range'], [type='button'], [type='submit'], [type='color'], [type='file'])) {
  cursor: default;
}

:where(a[href], [role='link'], [data-outside-link]) {
  cursor: pointer;
}

/* Native Windows popups can use a light background even for a dark select.
   Keep the option surface and text paired instead of inheriting only the ink. */
select option,
select optgroup {
  color: var(--tt-text);
  background-color: var(--tt-surface-elevated);
}

select option:disabled {
  color: var(--tt-text-muted);
}

button,
select,
input:not([type='checkbox']):not([type='radio']) {
  min-height: 30px;
}

/* A checkbox or radio takes the theme's accent, as every other control does; a page may still choose another role. */
input[type='checkbox'],
input[type='radio'] {
  accent-color: var(--tt-accent);
}

/* First-run setup and confirmation dialogs keep the full 44px target: they are
   the two places a newcomer or a nervous hand is aiming at one button. */
.onboarding-card button,
.onboarding-card select,
.onboarding-card input:not([type='checkbox']):not([type='radio']),
.tt-dialog__actions .tt-button {
  min-height: 44px;
}

:focus-visible,
.tt-focusable:focus-visible {
  outline: 3px solid var(--tt-focus-ring);
  outline-offset: 2px;
}

h1[tabindex='-1']:focus {
  outline: none;
}

::selection {
  background: color-mix(in srgb, var(--tt-primary) 30%, transparent);
}

/* The platform scrollbar is dressed down to a hairline thumb on an empty
   track. The widget is excluded: it never scrolls and its styling is frozen. */
:root { --tt-scrollbar-size: 10px; }
::-webkit-scrollbar {
  width: var(--tt-scrollbar-size);
  height: var(--tt-scrollbar-size);
}

::-webkit-scrollbar-track,
::-webkit-scrollbar-corner {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  border: 3px solid transparent;
  border-radius: var(--tt-radius-mark);
  background: color-mix(in srgb, var(--tt-border) 55%, transparent);
  background-clip: content-box;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--tt-border);
  background-clip: content-box;
}

::-webkit-scrollbar-button {
  display: none;
}

.tt-visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ---- type helpers ---- */

/* Small engraved labels: panel eyebrows, table headers, group titles. */
.tt-instrument {
  color: var(--tt-text-faint);
  font-size: var(--tt-type-caption);
  font-weight: 600;
  letter-spacing: 0.01em;
  line-height: 1.5;
}

.tt-tabular {
  font-variant-numeric: tabular-nums;
}

/* ---- controls ---- */

/* Buttons are soft squares with 6px corners, never pills (ADR-0110). The primary action
   is the text colour's plate on the room; every other button is the surface inside an
   edge in the field-border role that firms up on hover. */
.tt-button {
  display: inline-flex;
  min-height: 34px;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px solid var(--tt-field-border);
  border-radius: var(--tt-radius-control);
  padding: 0 14px;
  background: var(--tt-surface);
  color: var(--tt-text-2);
  font-size: var(--tt-type-small);
  font-weight: 500;
  line-height: 1.2;
  white-space: nowrap;
  transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, filter 120ms ease, opacity 120ms ease;
}

.tt-button:hover:not(:disabled) {
  border-color: var(--tt-text-faint);
  color: var(--tt-text);
}

.tt-button:active:not(:disabled) {
  background: var(--tt-hover);
}

.tt-button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

.tt-button--primary {
  border-color: var(--tt-pill);
  background: var(--tt-pill);
  color: var(--tt-pill-ink);
  font-weight: 600;
}

.tt-button--primary:hover:not(:disabled) {
  border-color: var(--tt-pill);
  color: var(--tt-pill-ink);
  filter: brightness(1.12);
}

.tt-button--primary:active:not(:disabled) {
  background: var(--tt-pill);
  filter: brightness(0.94);
}

.tt-button--ghost {
  border-color: transparent;
  background: transparent;
  color: var(--tt-text-faint);
}

.tt-button--ghost:hover:not(:disabled) {
  border-color: transparent;
  color: var(--tt-text);
}

/* Destructive controls stay tinted in the page. The point of no return,
   inside the confirmation dialog, does get the solid plate. */
.tt-button--danger {
  border-color: transparent;
  background: transparent;
  color: var(--tt-error);
}

.tt-button--danger:hover:not(:disabled) {
  border-color: var(--tt-error-border);
  color: var(--tt-error-text);
}

.tt-dialog__actions .tt-button--danger {
  border-color: var(--tt-error);
  background: var(--tt-error);
  color: var(--tt-error-contrast);
}

.tt-dialog__actions .tt-button--danger:hover:not(:disabled) {
  background: color-mix(in srgb, var(--tt-error) 86%, var(--tt-canvas));
  color: var(--tt-error-contrast);
}

.tt-button--icon {
  width: 34px;
  padding: 0;
}

/* ---- surfaces ---- */

.tt-card {
  position: relative;
  border: 1px solid var(--tt-hairline);
  border-radius: var(--tt-radius-lg);
  background: var(--tt-surface);
  box-shadow: var(--tt-shadow-sm);
  padding: 20px;
}

.tt-field {
  display: grid;
  gap: 5px;
}

.tt-field__label {
  font-size: var(--tt-type-small);
  font-weight: 600;
}

/* ==== agents/threads.css ==== */
/* Project folders beside a full conversation workspace.
   Type: message and composer text 16px, controls 14px, secondary text 12px. Narrow windows recompose, never shrink type.
   The sidebar colours are set on the sidebar as well as on the page, since the sidebar (and the columns that wear
   its frame) now stand beside every page, not only this one. */
.threads-view, .thread-nav {
  --threads-sidebar: var(--tt-sidebar, #050706);
  --threads-selected: var(--tt-selected, #101916);
  --threads-selected-border: var(--tt-selected-border, #253d36);
  --threads-bubble: var(--tt-bubble, #0d1210);
  --threads-field: var(--tt-field, #0a0d0b);
  --threads-field-border: var(--tt-field-border, #2a302d);
  --threads-field-focus: var(--tt-field-border-focus, #507366);
  --threads-scrollbar: var(--tt-scrollbar, #2a2e2c);
  --threads-hover: var(--tt-hover, rgb(255 255 255 / 6%));
  --threads-attention: var(--tt-attention, var(--tt-warning, #f0b45c));
  --threads-warning-text: var(--tt-warning-text, var(--tt-warning, #f0b45c));
}
.threads-view { flex: 1; min-height: 0; width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr); overflow: hidden; }

/* Workspace */
.thread-workspace { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
/* A notice above the panes (recovered work) scrolls within its own box before it squeezes the composer below it. */
.threads-view .thread-workspace > .thread-workspace__body[data-panes] { min-height: min(560px, calc(100% - 140px)); }
.threads-view .thread-workspace > .provider-recovery { min-height: min(140px, 30%); }
/* One 44px row: the provider mark, the name, its project, then pinned to the right in a fixed order the Git action, Watch,
   Tools, the Terminal drawer, the ··· menu and, in a split, close (ADR-0163, ADR-0182). The row is the window's drag handle, so everything that can be clicked
   or typed in opts out of dragging; the title opts out too, since in a split it is the handle that moves the pane. */
.thread-workspace__head { display: flex; align-items: center; gap: 4px; flex: none; height: 44px; padding: 0 6px 0 18px; -webkit-app-region: drag; }
.thread-workspace__head :is(.thread-workspace__title, .thread-workspace__actions, button, input, a) { -webkit-app-region: no-drag; }
.thread-workspace__title { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
.thread-workspace__title > svg, .thread-workspace__title > .provider-mark { flex: none; }
.thread-workspace__branches { min-width: 0; }
.thread-workspace__branches:empty { display: none; }
/* The name gives way first, so what stands beside it stays whole while there is room for it (ADR-0182). It stops at a
   floor, or at its own width if that is less, so a short name is never held open. */
.thread-workspace__head h2 { flex: 0 1000 auto; min-width: calc-size(max-content, min(size, 14em, 30cqi)); margin: 0; font-size: var(--tt-type-reading); font-weight: 500; letter-spacing: -.2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* In a narrow pane the name keeps the row, and the project crumb is what gives way. */
@container thread-pane (max-width: 720px) { .thread-workspace__head h2 { flex: 0 1 auto; min-width: 3em; } }
.thread-workspace__crumb { display: flex; flex: 0 100 auto; align-items: center; gap: 7px; min-width: 0; color: var(--tt-text-muted); font-size: var(--tt-type-caption); }
.thread-workspace__crumb::before { flex: none; color: var(--tt-text-muted); content: '/'; }
.thread-workspace__crumb > span:first-of-type { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* A crumb holding the working copy gives way no faster than the branch controls after it (ADR-0161): its project name
   shortens, and the working copy keeps its own width, so it is never drawn under them. */
.thread-workspace__crumb[data-has-working-copy] { flex-shrink: 1; }
.thread-workspace__crumb[data-has-working-copy] > span:first-of-type { flex: 0 1 auto; min-width: 0; }
.thread-workspace__crumb > .working-copy { flex: none; }
.thread-workspace__tag { flex: none; padding: 1px 7px; border: 1px solid transparent; border-radius: var(--tt-radius-tag); background: var(--tt-surface-sunken); color: var(--tt-text-muted); font-size: var(--tt-type-caption); }
.thread-workspace__tag[data-tone='warning'] { background: var(--tt-warning-surface); color: var(--threads-warning-text); }
/* Renaming turns the heading into a field, so the heading takes the room the field needs to be typed in. */
.thread-workspace__head h2:has(input) { flex: 1 1 220px; min-width: 3em; }
.thread-workspace__head h2 > input { width: 100%; }
/* The actions stand on the pane's own surface, so branch controls a narrow pane has squeezed pass under them unseen. */
.thread-workspace__actions { position: relative; display: flex; flex: none; align-items: center; gap: 2px; background: var(--tt-canvas); }
.thread-workspace__error { margin: 12px 24px 0; }

/* The header's icon buttons: Tools, the Terminal drawer, the ··· menu, close, and anything a pane adds beside them. */
.pane-action { display: grid; place-items: center; width: 30px; height: 30px; flex: none; padding: 0; border: 0; border-radius: var(--tt-radius-row); background: transparent; color: var(--tt-text-muted); transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, opacity 120ms ease; }
.pane-action:hover:not(:disabled, [aria-disabled='true']), .pane-action[aria-pressed='true'], .pane-action[aria-expanded='true'] { background: var(--tt-hover); color: var(--tt-text); }
.pane-action:active:not(:disabled, [aria-disabled='true']):not([aria-pressed='true']):not([aria-expanded='true']) { background: var(--tt-hover-strong); color: var(--tt-text); }
.pane-action:is(:disabled, [aria-disabled='true']) { opacity: .5; cursor: default; }

/* The More menu hangs under its button, inside the header, so the pane keeps the focus the menu hands out. */
.pane-menu { position: relative; display: flex; }
.pane-menu__list { position: absolute; top: calc(100% + 4px); right: 0; z-index: 30; display: grid; min-width: 212px; padding: 6px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-inset); background: var(--tt-surface-elevated); box-shadow: 0 16px 48px var(--tt-shadow-color); }
@media (prefers-reduced-motion: no-preference) { :root:not([data-reduced-motion='on']) .pane-menu__list { animation: tt-pop-down 120ms ease-out; } }
.pane-menu__list hr { margin: 6px 0; border: 0; border-top: 1px solid var(--tt-hairline); }
.pane-menu__item { display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 0 10px; border: 0; border-radius: var(--tt-radius-control); background: transparent; color: var(--tt-text); font: inherit; font-size: var(--tt-type-small); text-align: left; white-space: nowrap; }
.pane-menu__item > svg { flex: none; color: var(--tt-text-muted); }
.pane-menu__item:hover:not(:disabled), .pane-menu__item:focus-visible { background: var(--tt-hover); outline: none; }
.pane-menu__item[data-tone='danger'], .pane-menu__item[data-tone='danger'] > svg { color: var(--tt-error-text); }
.pane-menu__item:focus-visible { box-shadow: inset 0 0 0 3px var(--tt-focus-ring); }
.pane-menu__item:disabled { color: var(--tt-text-muted); cursor: default; }
.pane-menu__item:disabled > svg { opacity: .55; }
/* A row that shows something ticks while it shows, and a row with keys names them at its end, muted, in a title's words. */
.pane-menu__label { flex: 1 1 auto; min-width: 0; }
.pane-menu__end { display: inline-flex; flex: none; align-items: center; gap: 8px; margin-left: 18px; color: var(--tt-text-muted); }
.pane-menu__end > svg { color: var(--tt-text-2); }
.pane-menu__end kbd { font: inherit; font-size: var(--tt-type-caption); }
/* Tools in a pane's header. Pinned to another pane's thread, it is not this pane's panel. Its dot: agents working, or the
   attention colour while a delegated thread waits for you. */
.tools-toggle { position: relative; }
.tools-toggle[data-pinned-elsewhere] > svg { color: var(--tt-accent-text); }
.tools-dot { position: absolute; top: 3px; left: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--tt-activity); box-shadow: 0 0 0 2px var(--tt-canvas); pointer-events: none; }
.tools-dot[data-needs] { background: var(--tt-attention); }

.thread-transcript { --thread-jump-gap: 14px; position: relative; display: flex; flex: 1; min-height: 0; flex-direction: column; }
/* Positioned so absolute content (a diagram's hidden text) scrolls inside the transcript instead of stretching the pane. */
/* Scroll anchoring is on because the containment below gives an offscreen message an estimated height: without it,
   a message resolving to its true height as the reader scrolls back through the history moves the text under them
   (3167px of jumping over 24 scroll steps, against 7px with it). The transcript's own scrolling is unaffected: it
   sets scrollTop to an absolute value, which the browser's adjustment cannot compound. */
.thread-workspace__transcript { position: relative; flex: 1; min-height: 0; overflow-y: auto; overflow-anchor: auto; padding: 28px max(24px, calc((100% - 760px) / 2)); scrollbar-width: thin; scrollbar-color: var(--threads-scrollbar) transparent; }
.thread-workspace__transcript:focus-visible { outline: 2px solid var(--tt-focus-ring, var(--threads-field-focus)); outline-offset: -2px; }
.thread-transcript__earlier { display: flex; justify-content: center; margin: 0 0 20px; }
.thread-transcript__earlier .tt-button { font-size: var(--tt-type-small); }
.thread-transcript__jump { position: absolute; bottom: 14px; left: 50%; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border: 1px solid var(--threads-field-border); border-radius: var(--tt-radius-control); background: var(--threads-field); box-shadow: var(--tt-shadow-sm, 0 4px 14px rgb(0 0 0 / 35%)); color: var(--tt-text); font: inherit; font-size: var(--tt-type-body); transform: translateX(-50%); transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, filter 120ms ease; }
.thread-transcript__jump:hover { border-color: var(--threads-field-focus); }
.thread-transcript__jump:active { filter: brightness(.96); }
.thread-transcript__jump[data-unseen] { border-color: var(--threads-field-focus); }
/*
 * A long thread is mostly out of view. Its messages, folded work and activity skip layout and paint until the
 * reader scrolls near them, so opening a thread of hundreds of messages and scrolling it stays cheap. The
 * remembered size (`auto`) keeps a message the reader has already passed at its true height, so the scrollbar
 * does not move under them a second time.
 */
.thread-transcript__content > .thread-message,
.thread-transcript__content > .thread-work,
.thread-transcript__content > .thread-activity { content-visibility: auto; contain-intrinsic-size: auto 160px; }
/*
 * The end of the conversation is always laid out for real: following the stream, Jump to latest and the
 * request card that steps the Jump button aside all measure it, and an estimate there would land short.
 */
.thread-transcript__content > :nth-last-child(-n + 12) { content-visibility: visible; }
.thread-message { position: relative; margin: 0 0 28px; }
.thread-message header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; color: var(--tt-text-muted); font-size: var(--tt-type-caption); }
.thread-message__who { color: var(--tt-text-2); font-weight: 500; }
.thread-message time { font-size: var(--tt-type-caption); font-variant-numeric: tabular-nums; }
/* Watcher's reply to news carries its turn's work in its header instead of on a line above it. */
.thread-message__work {
  display: inline-flex; align-items: center; gap: 4px; min-height: 24px; margin: -2px 0 -2px -4px; padding: 0 6px; border: 0; border-radius: var(--tt-radius-sm);
  background: transparent; color: var(--tt-text-muted); font: inherit; font-size: var(--tt-type-caption); font-variant-numeric: tabular-nums;
  transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
}
.thread-message__work:hover { background: var(--tt-hover); color: var(--tt-text-2); }
.thread-message__work:active:not(:disabled) { background: var(--tt-hover-strong); color: var(--tt-text-2); }
.thread-message[data-turn-outcome='failed'] .thread-message__work { color: var(--tt-error-text); }
.thread-message__work-body { margin: 0 0 12px 1px; padding: 4px 0 4px 14px; border-left: 1px solid var(--tt-hairline); }
.thread-message__work-body > .thread-activity:last-child { margin-bottom: 0; }
/* The copy control sits in the message's bottom-left corner and appears while the message is hovered,
   holds focus, or is mid-confirmation. A message that has one keeps room for it under its last line:
   replies line its icon up with their text, user bubbles pin it inside their padding. */
.thread-message__copy { position: absolute; bottom: 0; left: -5px; display: inline-flex; align-items: center; gap: 5px; min-width: 28px; height: 28px; min-height: 28px; padding: 0 5px; border: 0; border-radius: var(--tt-radius-sm); background: transparent; color: var(--tt-text-muted); font: inherit; font-size: var(--tt-type-caption); opacity: 0; transition: opacity 120ms ease, background-color 120ms ease, color 120ms ease; }
.thread-message__copy:hover { background: var(--tt-hover); color: var(--tt-text); }
.thread-message__copy:active { background: var(--tt-hover-strong); color: var(--tt-text); }
.thread-message__copy[data-copied] { color: var(--tt-success); }
.thread-message__copy[data-copied] svg { animation: rich-confirm 220ms cubic-bezier(.2, .9, .3, 1.3); }
.thread-message:has(> .thread-message__copy) { padding-bottom: 30px; }
.thread-message[data-role='user'] .thread-message__copy { bottom: 8px; left: 12px; }
.thread-message[data-role='user']:has(> .thread-message__copy) { padding-bottom: 40px; }
.thread-message:hover .thread-message__copy, .thread-message:focus-within .thread-message__copy, .thread-message__copy[data-copied], .thread-message__copy[aria-expanded='true'] { opacity: 1; }
.thread-message__writing { margin: 0; color: var(--tt-text-muted); font-size: var(--tt-type-small); }
.thread-message__text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--tt-text-2); line-height: 1.6; font-size: var(--tt-type-reading); }
.thread-message[data-role='user'] { margin-left: max(24px, 12%); padding: 14px 18px; background: var(--threads-bubble); border: 1px solid transparent; border-radius: var(--tt-radius-card) var(--tt-radius-card) var(--tt-radius-tag) var(--tt-radius-card); }
.thread-message[data-role='user'] .thread-message__text { color: var(--tt-text); }
/* A wake-up babysitting sent (ADR-0061): on the user's side, labelled Sotto and Wake-up, edged in the accent. */
.thread-message[data-from='sotto'] { border-color: var(--tt-accent-border); }
.thread-message[data-from='sotto'] .thread-message__who { display: inline-flex; align-items: center; gap: 6px; color: var(--tt-text); }
.thread-message__mark { flex: none; width: 16px; height: 16px; }
.thread-message__tag { padding: 0 7px; border: 1px solid transparent; border-radius: var(--tt-radius-tag); background: var(--tt-surface-sunken); color: var(--tt-text-2); font-size: var(--tt-type-caption); line-height: 18px; }
.thread-message--pending[data-status='failed'], .thread-message--pending[data-status='uncertain'] { border-color: color-mix(in srgb, var(--threads-warning-text) 40%, var(--tt-hairline)); }
.thread-message__status { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; font-size: var(--tt-type-caption); }
.thread-message__status i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.thread-message__status[data-status='queued'], .thread-message__status[data-status='submitting'] { color: var(--tt-text-muted); }
.thread-message__status[data-status='accepted'] { color: var(--tt-activity); }
.thread-message__status[data-status='failed'], .thread-message__status[data-status='uncertain'] { color: var(--threads-warning-text); }
.thread-message__delivery { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--tt-hairline); color: var(--tt-text-muted); font-size: var(--tt-type-small); line-height: 1.45; }
.thread-message__delivery-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.thread-message__delivery .tt-button { min-height: 30px; font-size: var(--tt-type-small); }
/* Faint ink would fall below 4.5:1 on the bubble, so Dismiss reads in the muted tier there. */
.thread-message__delivery .tt-button--ghost { color: var(--tt-text-muted); }
/* The bubble is a tint, so a failed send's status and a link that would not open take the on-tint tones. */
.thread-message[data-role='user'] .thread-message__status:is([data-status='failed'], [data-status='uncertain']) { color: var(--tt-warning-on-tint); }
.thread-message[data-role='user'] .rich-message__feedback > span { color: var(--tt-error-on-tint); }
/* A delivery state with no prompt text to repeat: one line in the user's column, under their message. */
.thread-delivery { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin: 0 0 28px max(24px, 12%); padding: 0 18px; }
.thread-message[data-role='user'] + .thread-delivery { margin-top: -18px; }
.thread-delivery .thread-message__status { margin-left: 0; }
.thread-delivery .thread-message__delivery { flex: 1 1 auto; margin: 0; padding: 0; border: 0; }

/* Composer */
/* Height, in order: the composer card keeps its full size, the transcript keeps a readable minimum, and the queue
   above the card gives up the rest (its rows scroll under its head). Only when even that cannot fit, as with large
   display scaling below the window minimum, does the pane itself scroll; nothing is clipped out of reach. */
.threads-view .thread-panes .thread-pane { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--threads-scrollbar) transparent; }
.thread-pane > .thread-transcript { min-height: min(160px, 30%); }
.thread-workspace__compose { display: flex; flex: 0 1 auto; flex-direction: column; min-height: 0; padding: 10px max(24px, calc((100% - 760px) / 2)) 20px; }
.thread-workspace__compose > * { flex: none; }
/* The composer floats over the transcript's foot, and the words scroll on under it while the reader reads back (#1391).
   The scroll box keeps steady; its bottom padding brings the last line clear of the composer, and its scroll padding
   brings a focused line clear of the composer and Jump to latest (#1885). The strip around the card lets presses through
   to the transcript beneath. */
.thread-pane:not([data-greeting], [data-questions]) { --thread-compose-height: var(--thread-compose-measured, 0px); }
.thread-pane > .thread-transcript + .thread-greeting-slot:empty + .thread-workspace__compose { position: relative; z-index: 2; margin-top: calc(-1 * var(--thread-compose-height, 0px)); pointer-events: none; }
.thread-workspace__compose > * { pointer-events: auto; }
/* How much of the transcript's foot the composer covers, and the band Jump to latest stands in above it. */
.thread-transcript__viewport { --thread-compose-cover: var(--thread-compose-height, 0px); --thread-jump-band: 0px; display: flex; flex: 1; min-height: 0; }
.thread-pane .thread-workspace__transcript { padding-bottom: calc(28px + var(--thread-compose-height, 0px)); scroll-padding-bottom: calc(var(--thread-compose-cover) + var(--thread-jump-band)); }
.thread-transcript:has(> .thread-transcript__jump) > .thread-transcript__viewport { --thread-jump-band: calc(var(--thread-jump-height, 0px) + 2 * var(--thread-jump-gap)); }
/* A waiting question keeps 26px of conversation under its rounded corners (#1815), without clipping those words.
   Jump still sits above the stacked composer, so its clear band also includes that overlap. */
.thread-pane[data-questions] > .thread-transcript > .thread-transcript__viewport { --thread-compose-height: 26px; --thread-compose-cover: 0px; margin-bottom: -26px; }
.thread-pane[data-questions] > .thread-transcript:has(> .thread-transcript__jump) > .thread-transcript__viewport { --thread-jump-band: calc(var(--thread-jump-height, 0px) + 2 * var(--thread-jump-gap) + var(--thread-compose-height)); }
.thread-pane .thread-transcript__jump { bottom: calc(var(--thread-jump-gap) + var(--thread-compose-height, 0px)); }
/* The slim composer (ADR-0125; Owl only, the user's pick B of docs/prototypes/composer-shrink-prototype.html): while the
   user reads back, a floating composer with nothing in it is one line with its disc beside it. The options row steps
   away, and the branch toolbar and the row under the card hide but keep their place, so the card's foot never moves
   and only its top comes down (the user's ask on October 24, 2026). The composer keeps the full card's room, so the
   transcript keeps its size and its last line still comes clear at the end, and the Jump button sits just above what
   shows. The pane sets data-slim on the composer, and tells it to the pane as a mark (marks.tsx), only
   while the composer floats. While the card moves between slim and full (data-slim-moving, slimComposer.ts) the
   composer keeps that room and the card stands at its foot both ways, so its moving height reaches nothing else.
   The rules carry the pane's classes so they outweigh a short pane's and a split's own sizes for the composer. */
.threads-view .thread-pane > .thread-workspace__compose:is([data-slim], [data-slim-moving]) { min-height: var(--thread-compose-height, 0px); justify-content: flex-end; }
/* A widening card already holds its full content, cut at its moving foot. While it moves the pane clips at its own edges
   rather than scrolling, so it never has that content to scroll to and never shows a scroll bar of its own; a picker
   opening above the card is not cut. */
.threads-view .thread-pane.thread-pane:has(> .thread-workspace__compose[data-slim-moving]) { overflow: clip; }
.threads-view .thread-pane > .thread-workspace__compose[data-slim] > :is(.thread-pane__meta, .branch-toolbar) { visibility: hidden; }
.threads-view .thread-pane > .thread-workspace__compose[data-slim] > .thread-prompt { padding-block: 9px; padding-inline: 16px 10px; cursor: text; }
.threads-view .thread-pane > .thread-workspace__compose[data-slim] .thread-prompt :is(textarea, .prompt-editor) { min-height: 22px; max-height: 22px; padding-right: 100px; overflow: hidden; resize: none; }
.threads-view .thread-pane > .thread-workspace__compose[data-slim] .thread-prompt :is(.thread-prompt__meta, .thread-prompt__steer, .screenshot-input__tools > *) { display: none; }
.threads-view .thread-pane > .thread-workspace__compose[data-slim] .thread-prompt__actions > * > .thread-prompt__word:has(+ .thread-prompt__key) { display: none; }
.threads-view .thread-pane > .thread-workspace__compose[data-slim] .thread-prompt__actions > :has(> .thread-prompt__key) { padding: 0 4px; }
.threads-view .thread-pane > .thread-workspace__compose[data-slim] .thread-prompt > .thread-prompt__footer { position: absolute; top: 50%; right: 10px; margin: 0; transform: translateY(-50%); }
.thread-pane[data-slim] .thread-transcript__jump { bottom: calc(var(--thread-jump-gap) + var(--thread-compose-shown, var(--thread-compose-height, 0px))); }
.thread-pane[data-slim]:not(:has(> .thread-workspace__compose[data-slim-moving])) .thread-transcript__viewport { --thread-compose-cover: var(--thread-compose-shown, var(--thread-compose-height, 0px)); }
/* The readable edge, composer, its card and the card's field take their size at once, slim or full: the pane lays the transcript out by
   the composer's measured height, and the 1ms transition reduced motion gives every property (global.css), which a window
   in the background never finishes, would leave that room a step behind the composer and the pane with room to scroll. */
.thread-transcript__viewport, .thread-workspace__compose, .thread-workspace__compose > .thread-prompt, .thread-workspace__compose > .thread-prompt :is(textarea, .prompt-editor) { transition: none; }
/* Text under the card that has no surface of its own keeps the pane's, so it never reads over the transcript beneath. */
.thread-workspace__compose > .thread-pane__meta { background: var(--tt-canvas); }
.thread-workspace__compose > .thread-followups { background: var(--followups-surface); }
/* The queue tucks under the composer card, so the card paints over its open bottom edge. */
.thread-workspace__compose > .thread-followups + .thread-prompt { z-index: 1; }
.thread-workspace__compose > .thread-followups { flex: 0 1 auto; }
/* Why the last turn failed, above the composer, when the transcript's failed turn line has no reason to give (ADR-0092). */
.thread-failed-notice { display: flex; align-items: flex-start; gap: 10px; margin: 0 0 10px; padding: 10px 14px 10px 12px; border: 1px solid var(--tt-hairline); border-radius: var(--tt-radius-md); background: var(--tt-warning-surface); color: var(--tt-text-2); }
.thread-failed-notice__icon { flex: none; margin-top: 3px; color: var(--tt-attention); }
.thread-failed-notice > p { flex: 1 1 auto; min-width: 0; margin: 0; font-size: var(--tt-type-body); line-height: 1.45; overflow-wrap: anywhere; }
.thread-failed-notice strong { color: var(--tt-text); font-weight: 500; }
/* The attach button sits in the options row instead of a row of its own, so the transcript keeps the height. */
/* The composer is a card (ADR-0110): filled, with no edge in any state, at rest, pointed at, with focus, slim, running or
   at a model's highest effort (the user's asks on October 23 and 24, 2026). The caret says where typing goes, and the
   card is the pane's only text field; the border stays transparent so the card keeps its size. */
.thread-prompt { display: grid; grid-template-columns: auto minmax(0, 1fr); padding: 14px 16px 10px; border: 1px solid transparent; border-radius: var(--tt-radius-card); background: var(--tt-card); }
.thread-prompt > *, .thread-prompt .screenshot-input > * { grid-column: 1 / -1; }
/* The drop overlay leaves the grid so it covers the whole card, not just its content columns. */
.thread-prompt .screenshot-input > .screenshot-input__drop { grid-column: auto; }
.thread-prompt .screenshot-input, .thread-prompt .screenshot-input__tools { display: contents; }
.thread-prompt .screenshot-input__tools > .tt-button { grid-column: 1; align-self: center; margin: 6px 4px 0 -6px; }
.thread-prompt .screenshot-input__tools > small { order: 1; grid-column: 1 / -1; margin-top: 6px; }
.thread-prompt > .thread-prompt__footer { grid-column: 2; }
.thread-prompt .prompt-editor { display: block; width: 100%; min-height: 36px; max-height: 220px; overflow-y: auto; resize: vertical; padding: 0; border: 0; outline: 0; box-shadow: none; background: transparent; color: var(--tt-text); font: inherit; font-size: var(--tt-type-reading); line-height: 1.5; scrollbar-width: thin; scrollbar-color: var(--threads-scrollbar) transparent; }
/* The placeholder takes placeholder ink, as every other field's does, and reads at 4.5:1 on the composer card in every theme
   (paintedTextPairs.ts). While a turn runs it is the only thing that says what typing will do ("Queued until you answer
   the card"), so it is text, not decoration (#1819). The next prompt's ghost keeps its translucent ink (nextPrompt.css).
   It is the hint tier (tokens.css), drawn from the theme's own Placeholder role, so it never takes the body text's
   colour. */
.prompt-editor { --placeholder-ink: var(--tt-text-hint); white-space: pre-wrap; overflow-wrap: anywhere; }
.prompt-editor p { margin: 0; }
.prompt-editor[data-empty="true"]::before { content: attr(data-placeholder); color: var(--placeholder-ink); float: left; height: 0; pointer-events: none; }
.prompt-editor[aria-disabled="true"] { cursor: not-allowed; }
.followup-editor .prompt-editor { display: block; width: 100%; min-height: 104px; max-height: min(320px, calc(100vh - 200px)); overflow-y: auto; padding: 10px 12px; border: 1px solid var(--tt-field-border, var(--tt-hairline)); border-radius: var(--tt-radius-inset); outline: 0; background: var(--tt-field); color: var(--tt-text); font: inherit; font-size: var(--tt-type-lead); line-height: 1.55; resize: vertical; scrollbar-width: thin; }
.followup-editor .prompt-editor:focus { border-color: var(--tt-field-border-focus, var(--tt-focus-ring)); }
.thread-prompt__notice { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin: -2px 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--tt-hairline); color: var(--threads-warning-text); font-size: var(--tt-type-small); }
@media (prefers-reduced-motion: no-preference) { :root:not([data-reduced-motion='on']) .thread-prompt__notice { animation: tt-band-arrive 160ms cubic-bezier(.2, .8, .2, 1); } }
.thread-prompt__notice .tt-button { min-height: 30px; font-size: var(--tt-type-small); }
/* One row under the prompt: what the thread is set to, then the key that sends it. A caption long enough to
   need words of its own wraps below the pill rather than squeezing either end of the row. */
.thread-prompt__footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
.thread-prompt__meta { display: flex; flex: 1; flex-wrap: wrap; align-items: center; gap: 2px 8px; min-width: 0; }
.thread-prompt__model { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 4px; color: var(--tt-text-muted); font-size: var(--tt-type-small); }
.thread-prompt__model small { color: var(--tt-text-muted); font-size: var(--tt-type-caption); }
.thread-prompt__status { min-width: 0; color: var(--tt-text-muted); font-size: var(--tt-type-caption); line-height: 1.4; }
.thread-prompt__status[data-tone='warning'] { color: var(--threads-warning-text); }
.thread-prompt__link { padding: 0; border: 0; background: transparent; color: inherit; font: inherit; text-decoration: underline; }
.thread-prompt__actions { display: flex; flex: none; align-items: center; gap: 6px; }
/* The composer's keys (ADR-0153): each button is its glyph and the key that does the same (Drake's pick 2.2 of
   docs/prototypes/prompt-send-refine-2.html). The one filled button is always what Enter does, the theme's own ink on its
   text colour (the pill pair every theme keeps apart); Stop beside typed text and Steer now are flat keys. The full
   names live in the label and the title, so Queue prompt is never called Send. */
.thread-prompt__actions > :is(.thread-prompt__send, .thread-prompt__stop, .thread-prompt__steer) { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: none; height: 28px; min-height: 28px; padding: 0 4px 0 7px; border: 1px solid transparent; border-radius: var(--tt-radius-control); font-size: var(--tt-type-caption); font-weight: 600; white-space: nowrap; }
.thread-prompt__actions > :is(.thread-prompt__send, .thread-prompt__stop):not([data-wide]):not(:has(> .thread-prompt__key)) { width: 28px; padding: 0; }
.thread-prompt__glyph { flex: none; }
.thread-prompt__actions > :is(.thread-prompt__send, .thread-prompt__stop) { background: var(--tt-pill); color: var(--tt-pill-ink); }
/* Pointed at and pressed, the plate mixes toward the card: brightness() cannot lighten a plate that is already white. */
.thread-prompt__actions > :is(.thread-prompt__send, .thread-prompt__stop):hover:not(:disabled) { border-color: transparent; background: color-mix(in oklab, var(--tt-pill) 84%, var(--tt-card)); color: var(--tt-pill-ink); filter: none; }
.thread-prompt__actions > :is(.thread-prompt__send, .thread-prompt__stop):active:not(:disabled) { background: color-mix(in oklab, var(--tt-pill) 70%, var(--tt-card)); filter: none; transform: scale(.94); }
.thread-prompt__actions > :is(.thread-prompt__stop, .thread-prompt__steer):disabled { opacity: .45; }
/* With nothing to send the plate dims rather than lets the card through, so its glyph stays a glyph. */
.thread-prompt__actions > .thread-prompt__send:disabled { opacity: 1; background: color-mix(in oklab, var(--tt-pill) 16%, var(--tt-card)); color: var(--tt-text-muted); }
/* The plate fills as text arrives and springs back from a press (ADR-0153); the rest of the row's motion is in composerPlate.tsx. */
@media (prefers-reduced-motion: no-preference) {
  :root:not([data-reduced-motion='on']) .thread-prompt__actions > :is(.thread-prompt__send, .thread-prompt__stop) {
    transition: background-color 160ms cubic-bezier(.2, .8, .2, 1), color 160ms cubic-bezier(.2, .8, .2, 1), transform 220ms cubic-bezier(.2, .9, .3, 1.3), border-color 120ms ease, filter 120ms ease, opacity 120ms ease; }
  :root:not([data-reduced-motion='on']) .thread-prompt__actions > :is(.thread-prompt__send, .thread-prompt__stop):active:not(:disabled) { transition-duration: 160ms, 160ms, 80ms, 120ms, 120ms, 120ms; transition-timing-function: ease-out; }
}
:root[data-reduced-motion='on'] .thread-prompt__actions > :is(.thread-prompt__send, .thread-prompt__stop):active { transform: none; }
@media (prefers-reduced-motion: reduce) { .thread-prompt__actions > :is(.thread-prompt__send, .thread-prompt__stop):active { transform: none; } }
.thread-prompt__key { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: var(--tt-radius-tag); background: color-mix(in oklab, currentcolor 14%, transparent); font: inherit; font-size: var(--tt-type-caption); letter-spacing: .02em; }
/* Beside typed text, Stop steps back to a flat key so the filled button is the one Enter presses. */
.thread-prompt__actions > .thread-prompt__stop[data-beside], .thread-prompt__actions > .thread-prompt__stop[data-beside]:is(:hover, :active):not(:disabled) { background: transparent; color: var(--tt-text-muted); filter: none; }
.thread-prompt__actions > .thread-prompt__stop[data-beside]:hover:not(:disabled) { background: var(--tt-hover); color: var(--tt-text); }
.thread-prompt__actions > .thread-prompt__stop[data-beside]:active:not(:disabled) { background: var(--tt-hover-strong); color: var(--tt-text); }
/* While a turn runs, a light runs round Stop (docs/prototypes/prompt-send-stop-prototype.html, 9b): the control that
   ends the turn is the sign that it is running, and it stays on Stop when the button steps back. Only `transform`
   animates, so the compositor turns it without a repaint; a static mask keeps it to a 1.5px band round the button. */
.thread-prompt__trace { position: absolute; inset: -3px; overflow: hidden; padding: 1.5px; border-radius: var(--tt-radius-row); pointer-events: none;
  -webkit-mask: linear-gradient(black 0 0) content-box, linear-gradient(black 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(black 0 0) content-box exclude, linear-gradient(black 0 0); }
.thread-prompt__stop[data-beside] > .thread-prompt__trace { inset: -1px; border-radius: var(--tt-radius-control); }
.thread-prompt__trace > i { position: absolute; top: 50%; left: 50%; width: 220%; aspect-ratio: 1; translate: -50% -50%; will-change: transform;
  background: conic-gradient(var(--tt-activity) 0turn .26turn, color-mix(in srgb, var(--tt-activity) 18%, transparent) .26turn 1turn); }
@media (prefers-reduced-motion: no-preference) {
  :root:not([data-reduced-motion='on']) .thread-prompt__trace > i { animation: thread-prompt-trace 1.6s linear infinite; }
}
:root[data-window-hidden] .thread-prompt__trace > i { animation-play-state: paused; }
@keyframes thread-prompt-trace { to { transform: rotate(1turn); } }
/* A narrow pane, as the 820px window with its sidebar open leaves, and the slim composer show the keys alone. */
@container thread-pane (max-width: 600px) {
  .thread-prompt__actions > * > .thread-prompt__word:has(+ .thread-prompt__key) { display: none; }
  .thread-prompt__actions > :is(.thread-prompt__send, .thread-prompt__stop, .thread-prompt__steer):has(> .thread-prompt__word + .thread-prompt__key) { padding: 0 4px; }
}
.thread-prompt--saved { width: min(520px, 100%); margin: 12px 0; text-align: left; }
/* The saved draft is read, not edited: its words lie on the card with no field around them. */
.thread-prompt--saved textarea { display: block; width: 100%; min-height: 0; padding: 0; border: 0; background: transparent; color: var(--tt-text); font-size: var(--tt-type-reading); line-height: 1.5; resize: none; }
.thread-prompt--saved .thread-prompt__images { margin: 6px 0 0; color: var(--tt-text-muted); font-size: var(--tt-type-caption); overflow-wrap: anywhere; }

/* At a model's highest level the composer takes the colourway's tide when the level is reached (ADR-0019, amended); it
   wears no outline. The composer reads the effort chip's own mark, so no prop has to travel; the card's arrival state
   drives the tide. */
.thread-prompt { position: relative; }
/* The arrival mark sits on the chip's wrapper, which outlives the card: closing the card mid-tide does not cut it. */
.thread-prompt::before { content: ''; position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; z-index: 1;
  background: var(--tt-effort-wash-image); background-size: 100% 220%; background-position: 0 -320%; background-repeat: no-repeat; opacity: 0;
  -webkit-mask-image: linear-gradient(to top, transparent 0%, black 36%, black 58%, transparent 100%); mask-image: linear-gradient(to top, transparent 0%, black 36%, black 58%, transparent 100%); }
@media (prefers-reduced-motion: no-preference) {
  :root:not([data-reduced-motion='on']) .thread-prompt:has(.effort-picker-anchor[data-effort-arriving='true'])::before { animation: effort-tide 1700ms 120ms cubic-bezier(.3, .6, .2, 1) both; }
}
@keyframes effort-tide { from { opacity: .5; background-position: 0 100%; } to { opacity: .5; background-position: 0 -320%; } }

/* The thread's model, reasoning and permissions are three chips in the composer footer, each opening its own list. */
.threads-view .thread-options-bar { position: relative; display: flex; flex: 0 1 auto; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }
.threads-view .thread-options-bar > small { margin-top: 0; font-size: var(--tt-type-caption); }
.threads-view .screenshot-previews figcaption, .threads-view .screenshot-previews__note, .threads-view .screenshot-input__tools small { font-size: var(--tt-type-caption); }
.threads-view .screenshot-input__tools .tt-button { width: 30px; min-height: 30px; border-radius: var(--tt-radius-row); }


.thread-workspace__empty { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; min-height: 200px; height: 100%; padding: 32px; text-align: center; color: var(--tt-text-muted); }
.thread-workspace__empty h2, .thread-workspace__empty h3 { margin: 2px 0; color: var(--tt-text); font-size: var(--tt-type-heading); font-weight: 500; letter-spacing: -.3px; }
.thread-workspace__empty p { margin: 0; font-size: var(--tt-type-small); }
/* The Threads page with no pane open carries a saved draft as well, so at the minimum window it scrolls from its top. */
.thread-workspace__empty--page { justify-content: safe center; overflow: auto; }
.thread-workspace__empty-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.thread-workspace__transcript .thread-workspace__empty { min-height: 0; padding: 40px 0; gap: 8px; }
.thread-workspace__transcript .thread-workspace__empty h3 { font-size: var(--tt-type-lead); }

/* A new thread greets above its composer, and the two stand together in the middle of the pane, the composer a little
   narrower, until the first send (Zach, October 14: docs/prototypes/new-thread-greeting-prototype.html, variant a). The
   empty transcript above and the balance below share the room equally. */
.thread-pane__balance { display: none; }
.thread-pane[data-greeting] > .thread-transcript { flex: 1 1 0; min-height: 0; }
.thread-pane[data-greeting] > .thread-pane__balance { display: block; flex: 1 1 0; }
.thread-pane[data-greeting] > .thread-workspace__compose { flex: none; padding-inline: max(16px, calc((100% - 720px) / 2)); }
.thread-greeting { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 24px 18px; text-align: center; }
.thread-greeting h3 { margin: 0; color: var(--tt-text); font-size: var(--tt-type-title); font-weight: 500; letter-spacing: -.5px; line-height: 1.2; text-wrap: balance; }
.thread-greeting__where { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; max-width: 100%; margin: 0; color: var(--tt-text-muted); font-size: var(--tt-type-small); }
.thread-greeting__where > span { display: inline-flex; align-items: center; gap: 5px; min-width: 0; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.thread-greeting__where svg { flex: none; }
.thread-greeting__project { min-width: 0; max-width: 100%; }
.pane-menu__trigger { display: inline-flex; align-items: center; gap: 5px; min-width: 0; margin: -2px -6px; padding: 2px 6px; border: 0; border-radius: var(--tt-radius-control); background: transparent; color: inherit; font: inherit; transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease; }
.pane-menu__trigger:hover, .pane-menu__trigger[aria-expanded='true'] { background: var(--tt-hover); color: var(--tt-text); }
.pane-menu__trigger:active:not(:disabled):not([aria-expanded='true']) { background: var(--tt-hover-strong); color: var(--tt-text); }
.thread-greeting__project-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.thread-greeting__project .pane-menu__list { right: auto; left: 50%; transform: translateX(-50%); max-height: 260px; overflow-y: auto; text-align: left; }
@container thread-pane (max-width: 720px) { .thread-greeting h3 { font-size: var(--tt-type-figure); } }
@container thread-pane (max-height: 600px) {
  .thread-greeting { gap: 4px; padding-bottom: 10px; }
