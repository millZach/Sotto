<!doctype html>
<!--
  THROWAWAY PROTOTYPE. Not product code, not wired to anything, not committed.

  Questions, for Zach's brainstorm on Dynamic threads (November 4, 2026):
    1. Where do you turn Dynamic on, and how does a Dynamic thread read at rest?  (Switch A, B, C)
    2. What does a turn show of which model ran each piece and why?               (Steps 1, 2, 3)
    3. What can you limit, and where?                                             (Settings)

  Already decided by Zach, and the same in every variant: the model you pick oversees and does no work itself; it
  ignores the worker role cards; it is told not to edit, and is marked if it does; limits move workers, and if the
  overseer's own provider stops, the thread stops as today.

  URL: switch=A|B|C, steps=1|2|3, scenario=working|finished|moved|stopped|edited, on=0|1, settings=1, theme=light, size=820
-->

table { width: 100%; border-collapse: collapse; font-size: 13px; }

.bar { flex: none; margin: 0 12px 8px; z-index: 60; display: grid; gap: 4px; padding: 6px 10px; border-radius: 10px; background: var(--tt-surface-elevated); box-shadow: 0 0 0 1px var(--tt-hairline); }

.grp { flex-wrap: wrap; }
.grp button { min-width: 26px; height: 24px; padding: 0 7px; border-radius: 6px; font-size: 12.5px; color: var(--tt-text-2); white-space: nowrap; }
.grp button:hover { background: var(--tt-hover); }
.grp button[aria-pressed='true'] { background: var(--tt-accent-wash); color: var(--tt-accent-text); font-weight: 600; }
.state { font-size: 12.5px; color: var(--tt-text-muted); }

@media (max-width: 760px) {

  .frame { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .phead .where { display: none; }

}

const mark = (p, cls='') => { const m = MARKS[p]; return m ? `<svg class="mark m-${p} ${cls}" viewBox="${m.viewBox}" aria-hidden="true"><path d="${m.path}"/></svg>` : '' };
const q = new URLSearchParams(location.search);
const S = { sw: q.get('switch') || 'A', steps: q.get('steps') || '1', scenario: q.get('scenario') || 'working', on: q.get('on') !== '0', settings: q.get('settings') === '1',

const SWITCH = { A: 'in the model menu, and the chip says it', B: 'a word of its own in the composer', C: 'a switch at the top of the pane' };
const STEPS = { 1: 'rows in the Worked for fold, as delegated work is today', 2: 'a plan up front, then its rows fill in', 3: 'one line under the reply; press a name for more' };
const SCEN = { working: 'Working', finished: 'Finished', moved: 'A limit moved work', stopped: 'Overseer stopped', edited: 'Overseer edited' };
const MODELS = [['claude','Opus 5.5'],['claude','Sonnet 5.5'],['codex','GPT-6.1 Sol'],['codex','GPT-6 Astra'],['muse','Muse Wonder Full'],['grok','Grok Build']];

function workers() {
  const s = S.scenario;
  const base = [
    { id:'r', kind:'Research', title:'Read how the sidebar redraws', p:'claude', model:'Haiku 5.5', effort:'Low', why:'Only a summary is needed back.', state:'Returned', meta:'1m 02s · 18k tokens' },
    { id:'b', kind:'Building', title:'Stop the sidebar redrawing on a status change', p:'claude', model:'Sonnet 5.5', effort:'Medium', why:'Small and clear once the cause is known.', state:'Returned', meta:'2m 40s · 46k tokens' },
    { id:'c', kind:'Review', title:'Second read of the fix', p:'codex', model:'GPT-6.1 Sol', effort:'High', why:'Another maker’s read. Codex has room: 19% of its week used.', state:'Returned', meta:'1m 31s · 31k tokens · no findings' },
  ];
  if (s === 'working') { base[1].state = 'Working'; base[1].meta = '1m 12s'; base[2].state = 'Starting'; base[2].meta = 'After Building returns'; }
  if (s === 'moved') {
    base[2].state = 'Stopped'; base[2].bad = true; base[2].meta = 'Codex reached its 5-hour limit';
    base.push({ id:'m', kind:'Review', title:'Second read of the fix', p:'muse', model:'Muse Wonder Full', effort:'Extra high', why:'Codex stopped at its limit, resets 3:40 PM. Muse has room.', state:'Working', meta:'0m 48s' });
  }
  if (s === 'stopped') {
    base[1].state = 'Stopped'; base[1].bad = true; base[1].meta = 'Claude Code reached your plan’s usage limit';
    base[2].state = 'Working'; base[2].meta = 'Runs on Codex, so it carries on. Its reply waits for the overseer.';
  }
  for (const w of base) {
    if (S.moved[w.id]) { const [p, model] = S.moved[w.id]; Object.assign(w, { p, model, effort:'High', why:'You chose this.', state:'Starting', meta:'', bad:false, yours:true }) }
    if (S.stopped[w.id]) { Object.assign(w, { state:'Stopped', meta:'You stopped it', bad:false, why:w.why }) }
  }
  return base;
}
const stateClass = w => w.bad ? 'bad' : w.state === 'Working' || w.state === 'Starting' ? 'on' : '';
const stateWord = w => `<span class="w-state ${stateClass(w)}">${w.state === 'Working' ? '<span class="spin"></span>' : ''}${w.state}${w.meta ? ' · ' + w.meta : ''}</span>`;
const rowMore = w => `<button class="more" data-act="rowmenu:${w.id}" data-fid="more-${w.id}" aria-haspopup="menu" aria-label="More for ${w.kind}: ${w.title}">···</button>`;
const rowHtml = w => `<div class="w"><div class="w-top"><span class="w-kind">${w.kind}</span><a href="#" class="w-title" data-act="noop">${w.title}</a><span class="w-gap"></span><span class="w-model">${mark(w.p)}${w.model}, ${w.effort}</span>${rowMore(w)}</div>

function transcript() {
  const ws = workers(), s = S.scenario, running = s === 'working' || s === 'moved';
  let html = `<div class="umsg">The sidebar flickers when a thread finishes. Find out why and fix it, then have it checked.</div>`;
  if (!S.on) {
    html += `<button class="line open" data-act="noop"><span class="chev">›</span>Worked for 4m 12s</button>
      <div class="reply"><p>The sidebar redrew its whole list on every status change. I narrowed it to the row that changed, and the flicker is gone.</p></div>
      <div class="line"><span class="chev">›</span>Changed 2 files</div>
      <p class="muted small">Dynamic is off: Opus 5.5 did this itself, and any sub-agents and delegations followed the role cards.</p>`;
    return html;
  }
  const overseerNote = `<div class="reply"><p>I’ll have the cause found first, then the fix made, then a second read from another maker.</p></div>`;
  const counts = `${ws.length} workers on ${new Set(ws.map(w => w.p)).size} providers`;
  const endReply = s === 'finished' || s === 'edited'
    ? `<div class="reply"><p>The sidebar redrew its whole list on every status change. Sonnet narrowed it to the row that changed, and Sol’s second read found nothing wrong with the fix. The flicker is gone; the change is uncommitted on this branch.</p></div><div class="line"><span class="chev">›</span>Changed 2 files</div>` : '';
  const edited = s === 'edited' ? `<div class="mark-line"><b>Opus 5.5 changed 2 files itself.</b><span class="muted">sidebar.tsx, sidebar.css. It gave no reason.</span></div>` : '';
  const stopped = s === 'stopped' ? `<div class="alert">Claude Code has reached your plan’s usage limit, so this turn stopped. Nothing in the thread was lost.
      <div class="chips">Or continue now on <button class="chipb" data-act="noop">${mark('codex')}Codex</button><button class="chipb" data-act="noop">${mark('muse')}Muse</button><button class="chipb" data-act="noop">${mark('grok')}Grok Build</button></div></div>` : '';
  if (S.steps === '1') {
    html += overseerNote + `<button class="line ${S.foldOpen ? 'open' : ''}" data-act="fold" data-fid="fold" aria-expanded="${S.foldOpen}"><span class="chev">›</span>${running ? 'Working for 2m 51s' : 'Worked for 4m 12s'} · ${counts}</button>`;
    if (S.foldOpen) html += `<div class="fold">${ws.map(rowHtml).join('')}</div>`;
    html += stopped + endReply + edited;
  } else if (S.steps === '2') {
    const done = ws.filter(w => w.state === 'Returned').length;
    html += `<div class="plan"><div class="plan-head"><b>Plan</b><span class="muted small">${done} of ${ws.length} returned · it started without waiting; change any row</span><span style="flex:1"></span>
      <button class="chan" data-act="plan" data-fid="plan" aria-expanded="${S.planOpen}">${S.planOpen ? 'Hide' : 'Show'}</button></div>`;
    if (S.planOpen) html += `<ol>${ws.map((w, i) => `<li><span class="n">${i + 1}</span><div><div class="w-top"><span class="w-kind">${w.kind}</span><a href="#" class="w-title" data-act="noop">${w.title}</a><span class="w-gap"></span><span class="w-model">${mark(w.p)}${w.model}, ${w.effort}</span><button class="chan" data-act="rowmenu:${w.id}" data-fid="more-${w.id}" aria-label="Change ${w.kind}: ${w.title}">Change</button></div><p class="w-why"><b>${w.yours ? 'You' : 'Why'}:</b> ${w.why} ${stateWord(w)}</p></div></li>`).join('')}</ol>`;
    html += `</div>` + stopped + endReply + edited;
  } else {
    html += stopped + (endReply || overseerNote);
    const verb = { Research:'read', Building:'built', Review:'reviewed' };
    html += `<div class="oneline">${ws.map((w, i) => `${i ? '<span>·</span>' : ''}<button data-act="detail:${w.id}" data-fid="d-${w.id}" aria-expanded="${S.detail === w.id}">${mark(w.p)}${w.model} ${verb[w.kind]}${w.state === 'Working' ? ' <span class="spin" style="margin:0 0 0 2px"></span>' : w.state === 'Stopped' ? ' (stopped)' : ''}</button>`).join('')}</div>`;
    const d = ws.find(w => w.id === S.detail);
    if (d) html += `<div class="detail">${rowHtml(d)}</div>`;
    html += edited;
  }
  return html;
}

function composer() {
  const chipWord = S.on && S.sw === 'A' ? `<span class="oversees">oversees</span>` : '';
  const dynWord = S.sw === 'B' ? `<button class="fb dyn" role="switch" aria-checked="${S.on}" data-act="dynmenu" data-fid="dyn" aria-haspopup="dialog" aria-label="Dynamic ${S.on ? 'on' : 'off'}: choose whether this model oversees">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="3.5" cy="8" r="1.7"/><circle cx="12.5" cy="3.5" r="1.7"/><circle cx="12.5" cy="12.5" r="1.7"/><path d="M5.2 7.4 10.8 4.2M5.2 8.6l5.6 3.2"/></svg>Dynamic</button>` : '';
  const strip = S.scenario === 'stopped' && S.on ? `<div class="strip"><span>Restarts at 3:00 PM, when Claude Code’s limit resets</span><span class="gap"></span><button class="chan" data-act="noop">Don’t restart</button></div>` : '';
  return `${strip}<div class="composer">
    <textarea rows="1" aria-label="Message" placeholder="${S.on ? 'Ask for something. Name an allowed model in your words and it uses that one.' : 'Ask for something.'}"></textarea>
    <div class="foot">
      <button class="fb" aria-label="Attach" data-act="noop" style="margin-left:-8px;color:var(--tt-text-muted)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
      <span class="gap"></span>
      <button class="fb shield" data-act="noop" aria-label="Permissions: Allow edits${S.on ? ', the most its workers may do' : ''}"><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1 2.5 3v4.4c0 3.6 2.3 6.2 5.5 7.6 3.2-1.4 5.5-4 5.5-7.6V3L8 1Z"/></svg><span class="hide-narrow">Allow edits</span></button>
      ${dynWord}
      <button class="fb" data-act="modelmenu" data-fid="model" aria-haspopup="menu" aria-label="Choose model. Now Opus 5.5${S.on ? ', overseeing' : ''}">${mark('claude')}Opus 5.5 ${chipWord}</button>
      <button class="fb effort" data-act="noop" aria-label="Choose effort. Now High">High</button>
      <button class="disc" aria-label="Send" data-act="noop"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg></button>
    </div></div>`;
}

function modelMenu() {
  return `<div class="pop menu-model" role="menu" aria-label="Choose model">
    <div class="mm-body"><div class="mm-rail"><span class="sel">${mark('claude')}</span><span>${mark('codex')}</span><span>${mark('muse')}</span><span>${mark('grok')}</span></div>
    <div class="mm-list"><button class="mm-item sel" role="menuitem" data-act="closemenu" data-fid="mi1"><span>Opus 5.5</span><span class="muted">✓</span></button><button class="mm-item" role="menuitem" data-act="closemenu"><span>Sonnet 5.5</span></button><button class="mm-item" role="menuitem" data-act="closemenu"><span>Haiku 5.5</span></button></div></div>
    ${S.sw === 'A' ? `<button class="mm-foot" role="switch" aria-checked="${S.on}" data-act="toggle" data-fid="toggle-a"><span class="t"><b>Dynamic</b><span class="muted small">Opus 5.5 oversees and chooses a model for each piece. It does no work itself.</span></span><span class="track" style="margin-top:3px"></span></button>` : ''}
  </div>`;
}
function dynMenu() {
  return `<div class="pop menu-dyn" role="dialog" aria-label="Dynamic">
    <button class="mm-foot" style="padding:0;border:0;background:none" role="switch" aria-checked="${S.on}" data-act="toggle" data-fid="toggle-b"><span class="t"><b>Dynamic</b><span class="muted small">Opus 5.5 oversees and chooses a model for each piece. It does no work itself.</span></span><span class="track" style="margin-top:3px"></span></button>
    <p class="small muted" style="margin:8px 0 0">It uses Claude Code, Codex, Muse and Grok Build. <a href="#" data-act="settings">Change what it may use</a></p></div>`;
}
function firstUse() {
  return `<div class="pop first" role="dialog" aria-modal="true" aria-label="Turn on Dynamic"><h3>Turn on Dynamic for this thread?</h3><p>Opus 5.5 will choose a model for each piece, and your code can go to any company on your list: <b>Anthropic, OpenAI, Meta and xAI</b>.</p><p class="small muted">You only see this once. The list stays in Settings → Threads.</p><div class="acts"><button class="alt" data-act="firstchoose" data-fid="f2">Choose providers</button><button class="go" data-act="firston" data-fid="f1">Turn on</button></div></div>`;
}
function rowMenu() {
  const w = workers().find(x => x.id === S.rowMenu); if (!w) return '';
  return `<div class="pop menu-row" id="rowmenu" role="menu" aria-label="${w.kind}: ${w.title}">${S.picking
    ? `<div class="sub">Give it to</div>${MODELS.filter(m => m[1] !== w.model).map(([p, m]) => `<button role="menuitem" data-act="give:${w.id}:${p}:${m}" style="display:flex;gap:7px;align-items:center">${mark(p)}${m}</button>`).join('')}`
    : `<button role="menuitem" data-act="closemenu" data-fid="ri1">Open this thread</button><button role="menuitem" data-act="pick" data-fid="ri2">Give it to another model…</button><button role="menuitem" data-act="stop:${w.id}" data-fid="ri3">Stop this worker</button>`}</div>`;
}

function settingsPage() {
  const prov = [
    ['claude','Claude Code','Anthropic','38','38% of the week used, resets Friday',true],
    ['codex','Codex','OpenAI','19','19% of the week used, resets Monday',true],
    ['muse','Muse','Meta',null,'Read while a Muse thread runs. Last read 22% an hour ago',true],
    ['grok','Grok Build','xAI',null,'Read while a Grok Build thread runs. Not read yet',true],
    ['devin','Devin','Cognition',null,'Not checked yet',false],
    ['cursor','Cursor','Cursor',null,'Reports no limits, so it would be chosen blind',false],
  ];
  return `<div class="settings" role="region" aria-label="Settings, Threads, Dynamic threads"><div class="set-col">
    <button class="hbtn back" data-act="settings" data-fid="closeset">‹ Back to the thread</button>
    <p class="crumb" style="margin-top:6px">Settings › Threads</p>
    <h2>Dynamic threads</h2>
    <p class="lede">A Dynamic thread’s model oversees and chooses a model for each piece of work. These are the limits it works inside, on every Dynamic thread on this computer.</p>
    <div class="card"><h3>What it may use</h3><p>Your code goes to the company behind each provider ticked here. A provider off this list is never used, even if your message names it.</p>
      ${prov.map(([p,n,mk,pct,lim,on]) => `<label class="prov"><input type="checkbox" ${on ? 'checked' : ''}>${mark(p)}<span class="nm">${n} <span class="muted small">${mk}</span></span><span class="lim">${pct ? `<span class="bar-m"><i style="width:${pct}%"></i></span>` : ''}${lim}</span></label>`).join('')}
    </div>
    <div class="card"><h3>How far it may go</h3>
      <div class="field" style="border:0"><span>Highest effort<small>For any worker. Ultracode is only ever yours to choose, on your own thread.</small></span><select aria-label="Highest effort"><option>Extra high</option><option>High</option><option>Max</option></select></div>
      <div class="field"><span>Workers at once<small>The overseer starts the next as one returns. Your ceiling for this computer still applies.</small></span><input class="num" type="number" value="4" min="1" aria-label="Workers at once"></div>
    </div>
    <div class="card"><h3>Your note <span class="muted small">after the first version</span></h3><p>Advice in your own words, sent with each Dynamic turn. It can be ignored, so a provider you must not use belongs in the list above.</p>
      <textarea class="note" aria-label="Your note to the overseer" placeholder="Sol for reviews. Save Opus for the hard debugging."></textarea></div>
    <div class="card"><h3>Its record on this computer <span class="muted small">after the first version</span></h3><p>Counts only, no words. The overseer reads this when it chooses. Moved means the piece was then given to another model.</p>
      <table><thead><tr><th>Model</th><th>Pieces</th><th>Finished</th><th>Moved</th><th>Tokens</th></tr></thead><tbody>
      <tr><td>Sonnet 5.5</td><td>41</td><td>38</td><td>2</td><td>1.9M</td></tr><tr><td>GPT-6.1 Sol</td><td>27</td><td>25</td><td>1</td><td>2.4M</td></tr><tr><td>Haiku 5.5</td><td>22</td><td>22</td><td>0</td><td>0.3M</td></tr><tr><td>Muse Wonder Full</td><td>6</td><td>3</td><td>3</td><td>0.7M</td></tr></tbody></table>
      <p class="small muted" style="margin:8px 0 0">Sample numbers.</p>
      <button class="hbtn" style="margin:4px 0 0 -8px" data-act="noop">Clear its record</button></div>
  </div></div>`;
}

function render() {
  const fid = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fid : null;
  const scrolls = document.querySelector('.scroll')?.scrollTop;
  const frame = document.getElementById('frame');
  frame.className = 'frame' + (S.size ? ' sized' : '');
  const headSwitch = S.sw === 'C' ? `<button class="hbtn switch" role="switch" aria-checked="${S.on}" data-act="toggle" data-fid="toggle-c" aria-label="Dynamic: Opus 5.5 oversees and chooses a model for each piece"><span>Dynamic</span><span class="track"></span></button>` : '';
  frame.innerHTML = `<aside class="side" aria-label="Threads">
      <h3>sotto</h3>
      <div class="trow sel">${mark('claude')}<span class="name">Sidebar flickers when a thread finishes</span></div>
      <div class="trow">${mark('codex')}<span class="name">Reply box settings</span></div>
      <div class="trow">${mark('muse')}<span class="name">Review the release notes</span></div>
    </aside>
    <section class="pane" aria-label="Thread">
      <header class="phead"><span class="title">Sidebar flickers when a thread finishes</span><span class="where">sotto · sotto/4af2</span><span class="gap"></span>${headSwitch}
        <button class="hbtn hide-narrow" data-act="noop">Commit</button><button class="hbtn" data-act="noop">Watch</button><button class="hbtn" data-act="noop">Tools</button><button class="hbtn" aria-label="More actions" data-act="noop">···</button></header>
      <div class="scroll"><div class="col">${transcript()}</div></div>
      <div class="cwrap">${composer()}</div>
      ${S.menu === 'model' ? modelMenu() : ''}${S.menu === 'dyn' ? dynMenu() : ''}
      ${S.rowMenu ? rowMenu() : ''}
      ${S.settings ? settingsPage() : ''}${S.first ? firstUse() : ''}
    </section>`;
  const b = document.getElementById('bar');
  const grp = (label, key, opts) => `<span class="grp" role="group" aria-label="${label}"><span>${label}</span>${Object.entries(opts).map(([k, v]) => `<button aria-pressed="${String(S[key]) === k}" data-act="set:${key}:${k}" data-fid="set-${key}-${k}">${v}</button>`).join('')}</span>`;
  b.innerHTML = `<div class="bar-row">${grp('Turn it on', 'sw', {A:'A',B:'B',C:'C'})}${grp('A turn shows', 'steps', {1:'1',2:'2',3:'3'})}${grp('Scenario', 'scenario', SCEN)}
    <span class="grp"><button aria-pressed="${S.on}" data-act="toggle" data-fid="bar-on">Dynamic ${S.on ? 'on' : 'off'}</button><button aria-pressed="${S.settings}" data-act="settings" data-fid="bar-set">Settings</button>
    <button aria-pressed="${document.documentElement.dataset.theme === 'light'}" data-act="theme" data-fid="bar-theme">Light</button><button aria-pressed="${S.size}" data-act="size" data-fid="bar-size">820 × 560</button><button aria-pressed="${!!S.first}" data-act="firstshow" data-fid="bar-first">First use</button></span></div>
    <div class="state"><b>${S.sw}:</b> ${SWITCH[S.sw]}. <b>${S.steps}:</b> ${STEPS[S.steps]}. Try the ··· on a row, the model name in the composer, and Settings.</div>`;
  const u = new URL(location.href);
  for (const [k, v] of [['switch', S.sw], ['steps', S.steps], ['scenario', S.scenario], ['on', S.on ? '1' : '0']]) u.searchParams.set(k, v);
  history.replaceState(null, '', u);
  if (S.rowMenu) {
    const anchor = document.querySelector(`[data-fid="more-${S.rowMenu}"]`), pane = document.querySelector('.pane'), menu = document.getElementById('rowmenu');
    if (anchor && menu) { const a = anchor.getBoundingClientRect(), p = pane.getBoundingClientRect(); menu.style.top = Math.min(a.bottom - p.top + 4, p.height - menu.offsetHeight - 8) + 'px'; menu.style.right = Math.max(8, p.right - a.right) + 'px'; menu.querySelector('button')?.focus(); }
  }
  const sc = document.querySelector('.scroll'); if (sc && scrolls) sc.scrollTop = scrolls;
  if (fid && !S.rowMenu) document.querySelector(`[data-fid="${fid}"]`)?.focus();
  if (S.first) document.querySelector('[data-fid="f1"]')?.focus();
  if (S.menu === 'model' && !fid?.startsWith('toggle')) document.querySelector('.menu-model button')?.focus();
  if (S.menu === 'dyn' && !fid?.startsWith('toggle')) document.querySelector('.menu-dyn button')?.focus();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) { if (S.menu || S.rowMenu) { S.menu = null; S.rowMenu = null; S.picking = false; render(); } return; }
  e.preventDefault();
  const [a, x, y, z] = t.dataset.act.split(':');
  const wasRow = S.rowMenu;
  if (a === 'noop') return;
  if (a === 'set') { S[x] = x === 'steps' ? String(y) : y; S.moved = {}; S.stopped = {}; S.detail = null; S.menu = null; S.rowMenu = null; }
  else if (a === 'toggle') { if (!S.on && !S.seenFirst) { S.first = true; S.menu = null; } else S.on = !S.on; }
  else if (a === 'firston') { S.first = false; S.seenFirst = true; S.on = true; }
  else if (a === 'firstchoose') { S.first = false; S.seenFirst = true; S.on = true; S.settings = true; }
  else if (a === 'firstshow') { S.on = false; S.seenFirst = false; S.first = true; S.menu = null; S.settings = false; }
  else if (a === 'settings') { S.settings = !S.settings; S.menu = null; }
  else if (a === 'theme') { const r = document.documentElement; if (r.dataset.theme === 'light') delete r.dataset.theme; else r.dataset.theme = 'light'; }
  else if (a === 'size') S.size = !S.size;
  else if (a === 'fold') S.foldOpen = !S.foldOpen;
  else if (a === 'plan') S.planOpen = !S.planOpen;
  else if (a === 'detail') S.detail = S.detail === x ? null : x;
  else if (a === 'modelmenu') { S.menu = S.menu === 'model' ? null : 'model'; S.rowMenu = null; }
  else if (a === 'dynmenu') { S.menu = S.menu === 'dyn' ? null : 'dyn'; S.rowMenu = null; }
  else if (a === 'closemenu') { S.menu = null; S.rowMenu = null; S.picking = false; }
  else if (a === 'rowmenu') { S.rowMenu = S.rowMenu === x ? null : x; S.picking = false; S.menu = null; }
  else if (a === 'pick') S.picking = true;
  else if (a === 'give') { S.moved[x] = [y, z]; S.rowMenu = null; S.picking = false; }
  else if (a === 'stop') { S.stopped[x] = true; S.rowMenu = null; }
  render();
  if (wasRow && !S.rowMenu) document.querySelector(`[data-fid="more-${wasRow}"]`)?.focus();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (S.first) { S.first = false; render(); document.querySelector('[data-fid="model"]')?.focus(); return; }
  if (S.rowMenu) { const id = S.rowMenu; S.rowMenu = null; S.picking = false; render(); document.querySelector(`[data-fid="more-${id}"]`)?.focus(); return; }
  if (S.menu) { const was = S.menu; S.menu = null; render(); document.querySelector(`[data-fid="${was === 'model' ? 'model' : 'dyn'}"]`)?.focus(); return; }
  if (S.settings) { S.settings = false; render(); document.querySelector('[data-fid="bar-set"]')?.focus(); }
});
render();
</script>
</body>
</html>
