body { margin: 0; padding: 28px 0 150px; background: #101014; color: var(--tt-text); font-family: 'Figtree', ui-sans-serif, system-ui, sans-serif; display: grid; justify-items: center; gap: 18px; }
:root[data-theme='light'] body { background: #d8d5cd; }

/* ---- the stage: the app at its real size, with the real corner ---- */
.stage { position: relative; width: 1080px; height: 720px; border-radius: 10px; overflow: hidden; box-shadow: 0 30px 80px rgb(0 0 0 / 55%); }
.stage img { display: block; width: 1080px; height: 720px; }
.corner { position: absolute; right: 20px; bottom: 20px; display: grid; justify-items: end; gap: 8px; max-width: 380px; }

/* ---- pieces every variant shares ---- */
.mark { width: 16px; height: 16px; border-radius: 5px; display: grid; place-items: center; font-size: 9px; font-weight: 700; color: var(--tt-provider-ink); flex: none; }
.mark[data-provider='claude'] { background: var(--tt-provider-claude); }
.mark[data-provider='codex'] { background: var(--tt-provider-codex); }
.mark[data-provider='grok'] { background: var(--tt-provider-grok); }
.mark[data-provider='devin'] { background: var(--tt-text-muted); }
.btn { border: 1px solid var(--tt-field-border); border-radius: var(--tt-radius-sm); background: transparent; color: var(--tt-text); font: inherit; font-size: 12px; padding: 5px 10px; cursor: pointer; }
.btn:hover { background: var(--tt-surface); }
.btn--primary { border-color: transparent; background: var(--tt-primary); color: var(--tt-primary-contrast); font-weight: 600; }
.btn--primary:hover { background: var(--tt-primary-hover); }
.btn:focus-visible { outline: 2px solid var(--tt-focus-ring); outline-offset: 2px; }
.versions { font-variant-numeric: tabular-nums; color: var(--tt-text-muted); }
.spinner { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--tt-border); border-top-color: var(--tt-update); animation: spin 900ms linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; border-top-color: var(--tt-border); } }

/* ---- A: one toast per provider, in the toast region that already exists ---- */
.toast { border: 1px solid var(--tt-hairline); border-left: 2px solid var(--tt-update); border-radius: var(--tt-radius-sm); background: var(--tt-surface-elevated); box-shadow: var(--tt-shadow-lg); padding: 11px 14px; font-size: 12.5px; line-height: 1.5; display: grid; gap: 9px; width: 340px; }
.toast[data-phase='failed'] { border-left-color: var(--tt-error); }
.toast[data-phase='done'] { border-left-color: var(--tt-success); }
.toast__line { display: flex; gap: 8px; align-items: baseline; }
.toast__line .mark { position: relative; top: 2px; }
.toast__actions { display: flex; gap: 8px; justify-content: flex-end; }

/* ---- B: one card for every provider at once ---- */
.card { width: 360px; border: 1px solid var(--tt-hairline); border-radius: 12px; background: var(--tt-surface-elevated); box-shadow: var(--tt-shadow-lg); overflow: hidden; font-size: 12.5px; }
.card__head { padding: 12px 14px 10px; border-bottom: 1px solid var(--tt-hairline); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.card__head strong { font-size: 13px; font-weight: 600; }
.card__head span { color: var(--tt-text-muted); font-size: 11.5px; }
.card__row { display: flex; align-items: center; gap: 10px; padding: 9px 14px; }
.card__row + .card__row { border-top: 1px solid var(--tt-hairline); }
.card__row > div { flex: 1; min-width: 0; display: grid; gap: 1px; }
.card__row small { color: var(--tt-text-muted); font-size: 11.5px; }
.card__foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--tt-hairline); background: var(--tt-surface); }
.card__foot span { color: var(--tt-text-muted); font-size: 11.5px; }
.card__foot div { display: flex; gap: 8px; }

/* ---- C: a pill that waits, and opens a panel when asked ---- */
.pill { display: flex; align-items: center; gap: 8px; border: 1px solid var(--tt-hairline); border-radius: 999px; background: var(--tt-surface-elevated); box-shadow: var(--tt-shadow-sm); color: var(--tt-text); font: inherit; font-size: 12px; padding: 6px 12px 6px 8px; cursor: pointer; }
.pill:hover { border-color: var(--tt-border); }
.pill:focus-visible { outline: 2px solid var(--tt-focus-ring); outline-offset: 2px; }
.pill__marks { display: flex; }
.pill__marks .mark { width: 14px; height: 14px; box-shadow: 0 0 0 2px var(--tt-surface-elevated); }
.pill__marks .mark + .mark { margin-left: -5px; }
.panel { width: 330px; border: 1px solid var(--tt-hairline); border-radius: 10px; background: var(--tt-surface-elevated); box-shadow: var(--tt-shadow-lg); padding: 6px; font-size: 12.5px; display: grid; gap: 2px; }
.panel__row { display: flex; align-items: center; gap: 10px; padding: 8px 8px; border-radius: 7px; }
.panel__row:hover { background: var(--tt-surface); }
.panel__row > div { flex: 1; min-width: 0; display: grid; gap: 1px; }
.panel__row small { color: var(--tt-text-muted); font-size: 11.5px; }
.panel__foot { padding: 7px 8px 5px; border-top: 1px solid var(--tt-hairline); margin-top: 4px; color: var(--tt-text-muted); font-size: 11.5px; display: flex; justify-content: space-between; align-items: center; }

/* ---- prototype chrome, deliberately not part of the design ---- */
.bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; background: #17171d; border: 1px solid #34343f; color: #f2f2f5; font-size: 12px; box-shadow: 0 14px 40px rgb(0 0 0 / 55%); }
.bar button { border: 1px solid #3d3d49; border-radius: 999px; background: #22222a; color: #f2f2f5; font: inherit; font-size: 11.5px; padding: 4px 9px; cursor: pointer; }
.bar button[aria-pressed='true'] { background: #f2f2f5; color: #17171d; border-color: #f2f2f5; }
.bar .sep { width: 1px; height: 18px; background: #3d3d49; margin: 0 3px; }
.bar .name { min-width: 210px; text-align: center; font-weight: 600; }
.notes { width: 1080px; color: #9a9aa6; font-size: 12.5px; line-height: 1.6; }
.notes b { color: #d7d7de; font-weight: 600; }
:root[data-theme='light'] .notes { color: #44423c; }
:root[data-theme='light'] .notes b { color: #1d1b17; }
</style>
</head>
<body>

<div class="stage">
  <img id="shot" src="../../artifacts/design/app-review/baseline/threads-open-running.png" alt="The Threads page with a running Codex thread">
  <div class="corner" id="corner"></div>
</div>

<div class="notes" id="notes"></div>

<div class="bar">
  <button id="prev" aria-label="Previous variant">←</button>
  <span class="name" id="name"></span>
  <button id="next" aria-label="Next variant">→</button>
  <span class="sep"></span>
  <button data-set="phase" data-value="available">Available</button>
  <button data-set="phase" data-value="running">Updating</button>
  <button data-set="phase" data-value="done">Updated</button>
  <button data-set="phase" data-value="failed">Failed</button>
  <button data-set="phase" data-value="busy">Thread busy</button>
  <span class="sep"></span>
  <button data-set="count" data-value="1">1 behind</button>
  <button data-set="count" data-value="3">3 behind</button>
  <span class="sep"></span>
  <button id="mode">Light</button>
</div>

<script>
const PROVIDERS = [
  { id: 'claude', letter: 'C', name: 'Claude Code', from: '2.1.270', to: '2.1.274', via: 'npm' },
  { id: 'codex', letter: 'O', name: 'Codex', from: '0.58.0', to: '0.59.1', via: 'npm' },
  { id: 'grok', letter: 'G', name: 'Grok Build', from: '1.0.5', to: '1.0.6', via: 'npm' },
  { id: 'devin', letter: 'D', name: 'Devin', from: '1.4.2', to: '1.4.2', via: 'npm' },
]
const state = { variant: 'A', phase: 'available', count: 3, mode: 'dark' }
const behind = () => PROVIDERS.slice(0, state.count)
const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild }
const mark = (p) => `<span class="mark" data-provider="${p.id}" aria-hidden="true">${p.letter}</span>`

/* One provider's sentence, in every phase. The copy is the design: a press says what it does,
   an error says what happened and whether anything was lost. */
const SENTENCE = {
  available: (p) => `<strong>${p.name} ${p.to}</strong> is available. You have ${p.from}.`,
  busy: (p) => `<strong>${p.name} ${p.to}</strong> is available. Two threads are working now; updating stops them.`,
  running: (p) => `Updating ${p.name} to ${p.to}…`,
  done: (p) => `${p.name} is now ${p.to}. Reconnect to use it.`,
  failed: (p) => `${p.name} did not update. npm exited with code 1; your ${p.from} install is unchanged.`,
}
const ACTIONS = {
  available: (p) => [['primary', `Update ${p.name}`], ['', 'Not now']],
  busy: () => [['primary', 'Update anyway'], ['', 'Not now']],
  running: () => [],
  done: () => [['primary', 'Reconnect'], ['', 'Dismiss']],
  failed: () => [['', 'Copy the command'], ['', 'Dismiss']],
}
const buttons = (p) => ACTIONS[state.phase](p).map(([kind, label]) =>
  `<button class="btn${kind ? ' btn--' + kind : ''}">${label}</button>`).join('')

/* A — every provider gets its own toast, in the region Sotto already has (global.css .tt-toast). */
function variantA() {
  return behind().map(p => el(`
    <div class="toast" data-phase="${state.phase}" role="status">
      <div class="toast__line">${state.phase === 'running' ? '<span class="spinner"></span>' : mark(p)}<span>${SENTENCE[state.phase](p)}</span></div>
      ${state.phase === 'running' ? '' : `<div class="toast__actions">${buttons(p)}</div>`}
    </div>`))
}

/* B — one card, every provider inside it, one press updates them all. */
function variantB() {
  const list = behind()
  const row = (p) => `
    <div class="card__row">
      ${state.phase === 'running' ? '<span class="spinner"></span>' : mark(p)}
      <div><span>${p.name}</span><small class="versions">${state.phase === 'done' ? p.to : p.from + ' → ' + p.to}${state.phase === 'failed' ? ' · did not update' : ''}</small></div>
      ${state.phase === 'available' || state.phase === 'busy' ? '<button class="btn">Update</button>' : ''}
      ${state.phase === 'failed' ? '<button class="btn">Try again</button>' : ''}
    </div>`
  const head = { available: 'Provider updates', busy: 'Provider updates', running: 'Updating providers', done: 'Providers updated', failed: 'Providers did not update' }[state.phase]
  const under = {
    available: `${list.length} of 4 clients have a newer version`,
    busy: 'Two threads are working now; updating stops them',
    running: 'Leave this open until it finishes',
    done: 'Reconnect to use the new versions',
    failed: 'Your installed versions are unchanged',
  }[state.phase]
  const foot = {
    available: `<div><button class="btn btn--primary">Update all ${list.length}</button><button class="btn">Not now</button></div>`,
    busy: `<div><button class="btn btn--primary">Update anyway</button><button class="btn">Not now</button></div>`,
    running: '<div></div>',
    done: `<div><button class="btn btn--primary">Reconnect</button><button class="btn">Dismiss</button></div>`,
    failed: `<div><button class="btn">Copy the commands</button><button class="btn">Dismiss</button></div>`,
  }[state.phase]
  return [el(`
    <div class="card" role="status">
      <div class="card__head"><strong>${head}</strong><span>${under}</span></div>
      ${list.map(row).join('')}
      <div class="card__foot"><span>Checked 2 minutes ago</span>${foot}</div>
    </div>`)]
}

/* C — a pill that waits in the corner and opens a panel when pressed. Nothing announces itself. */
let openPanel = false
function variantC() {
  const list = behind()
  const out = []
  if (openPanel) {
    const row = (p) => `
      <div class="panel__row">
        ${state.phase === 'running' ? '<span class="spinner"></span>' : mark(p)}
        <div><span>${p.name}</span><small class="versions">${state.phase === 'done' ? 'Now ' + p.to : p.from + ' → ' + p.to}</small></div>
        ${state.phase === 'available' || state.phase === 'busy' ? '<button class="btn">Update</button>' : ''}
        ${state.phase === 'failed' ? '<button class="btn">Try again</button>' : ''}
      </div>`
    out.push(el(`
      <div class="panel" role="dialog" aria-label="Provider updates">
        ${list.map(row).join('')}
        <div class="panel__foot"><span>${state.phase === 'busy' ? 'Two threads are working now' : 'Checked 2 minutes ago'}</span><button class="btn">Update all</button></div>
      </div>`))
  }
  const label = { available: `${list.length} update${list.length > 1 ? 's' : ''}`, busy: `${list.length} update${list.length > 1 ? 's' : ''}`, running: 'Updating…', done: 'Updated', failed: 'Update failed' }[state.phase]
  const pill = el(`<button class="pill" aria-expanded="${openPanel}">${state.phase === 'running' ? '<span class="spinner"></span>' : `<span class="pill__marks">${list.map(mark).join('')}</span>`}<span>${label}</span></button>`)
  pill.addEventListener('click', () => { openPanel = !openPanel; render() })
  out.push(pill)
  return out
}

const VARIANTS = {
  A: { name: 'A — A toast for each', build: variantA, note: 'Uses the toast region that already exists (<b>global.css .tt-toast</b>, bottom-right, 360px). Nothing new to design, and four updates make four toasts stacked over the composer. Every provider is its own sentence and its own press.' },
  B: { name: 'B — One card for all', build: variantB, note: 'One interruption however many providers are behind, and one press updates them all. Bigger, and it sits over the composer while it is open. Closest to how T3 groups providers.' },
  C: { name: 'C — A pill that waits', build: variantC, note: 'Announces nothing: a small pill rests in the corner, and pressing it opens the list. Quietest, and easiest to never notice. Press the pill in the stage to open the panel; Escape closes it.' },
}
const keys = Object.keys(VARIANTS)

function render() {
  const corner = document.getElementById('corner')
  corner.replaceChildren(...VARIANTS[state.variant].build())
  document.getElementById('name').textContent = VARIANTS[state.variant].name
  document.getElementById('notes').innerHTML = `<b>${VARIANTS[state.variant].name}.</b> ${VARIANTS[state.variant].note}
    <br>State: variant ${state.variant} · phase ${state.phase} · ${state.count} provider(s) behind · ${state.mode} · ${openPanel ? 'panel open' : 'panel closed'}`
  for (const button of document.querySelectorAll('[data-set]')) {
    button.setAttribute('aria-pressed', String(state[button.dataset.set] === (button.dataset.set === 'count' ? Number(button.dataset.value) : button.dataset.value)))
  }
}
function cycle(step) { state.variant = keys[(keys.indexOf(state.variant) + step + keys.length) % keys.length]; openPanel = false; history.replaceState(null, '', `?variant=${state.variant}`); render() }
document.getElementById('prev').addEventListener('click', () => cycle(-1))
document.getElementById('next').addEventListener('click', () => cycle(1))
for (const button of document.querySelectorAll('[data-set]')) {
  button.addEventListener('click', () => { state[button.dataset.set] = button.dataset.set === 'count' ? Number(button.dataset.value) : button.dataset.value; render() })
}
document.getElementById('mode').addEventListener('click', (event) => {
  state.mode = state.mode === 'dark' ? 'light' : 'dark'
  document.documentElement.dataset.theme = state.mode
  document.getElementById('shot').src = `../../artifacts/design/app-review/baseline/threads-open-running${state.mode === 'light' ? '-light' : ''}.png`
  event.currentTarget.textContent = state.mode === 'dark' ? 'Light' : 'Dark'
  render()
})
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && openPanel) { openPanel = false; render(); return }
  if (event.key === 'ArrowLeft') cycle(-1)
  if (event.key === 'ArrowRight') cycle(1)
})
state.variant = keys.includes(new URLSearchParams(location.search).get('variant') ?? '') ? new URLSearchParams(location.search).get('variant') : 'A'
render()
</script>
</body>
</html>
