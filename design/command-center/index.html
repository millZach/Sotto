<!-- THROWAWAY MOCK-UP. Not shipped.
     The question: what should Sotto's command center look like, and where does it live? The command center is
     one typed thread per computer, on the user's own Claude Code, Codex or Grok Build, given Sotto tools to list,
     read, start, send to, stop and settle every other thread, here and on connected hosts. It never answers a
     thread's question or permission; it links to the request card instead.
     Four variants, switchable with the bottom bar, the left and right arrow keys, or ?variant=A2|A|B|C:
       A2 · Overview in the sidebar   Zach's pick from round one (A) with one change: the overview moves into the
                             real sidebar on the left, the page takes the Threads page's shell (no strip, window
                             controls at the top right) and the sidebar foot gains a third room, Command center.
                             The default. ?page=threads|dictate shows the same foot on those pages.
       A · Its own room      a third state of the switch, conversation in the centre, overview as a rail beside it.
       B · Its own window    a smaller desktop window beside the main window, conversation first, counts on top.
       C · Board first       its own room whose page is a board of every thread grouped by what you need to do,
                             with the conversation docked at the bottom.
     Other parameters: theme=light|dark, size=1280|820, open=1 (B: overview open, C: conversation open).
     Colour comes only from the real --tt-* tokens; the stage and the prototype bar use literals, as the
     provider-updates mock-up does. Same sample data in all three. -->

/* ---------- stage (not the app) ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; background: #0e0f12; color: var(--tt-text); font-family: var(--tt-font-ui); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
:root[data-theme='light'] body { background: #cdc9c0; }
button, input, textarea { font: inherit; color: inherit; }
.wrap { position: relative; margin: 20px auto 0; }
.desk { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
.notes { width: min(1080px, calc(100vw - 48px)); margin: 22px auto 120px; color: #a3a3ae; font-size: 13px; line-height: 1.6; }
.notes b { color: #ececf1; font-weight: 600; }
.notes p { margin: 0 0 8px; }
:root[data-theme='light'] .notes { color: #3d3b35; }
:root[data-theme='light'] .notes b { color: #1b1915; }
.bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; background: #17171d; border: 1px solid #34343f; color: #f2f2f5; font-size: 12px; box-shadow: 0 14px 40px rgb(0 0 0 / 55%); white-space: nowrap; }
.bar button { border: 1px solid #3d3d49; border-radius: 999px; background: #22222a; color: #f2f2f5; font: inherit; font-size: 11.5px; padding: 4px 10px; cursor: pointer; }
.bar button:hover { border-color: #6a6a78; }
.bar button[aria-pressed='true'] { background: #f2f2f5; color: #17171d; border-color: #f2f2f5; }
.bar button:focus-visible { outline: 2px solid #7fd8cc; outline-offset: 2px; }
.bar .sep { width: 1px; height: 18px; background: #3d3d49; margin: 0 3px; }
.bar .name { min-width: 196px; text-align: center; font-weight: 600; font-size: 12.5px; }
.bar [hidden] { display: none; }
.toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); z-index: 60; padding: 8px 14px; border-radius: 10px; background: #17171d; border: 1px solid #34343f; color: #f2f2f5; font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity 160ms; }
.toast[data-on] { opacity: 1; }

/* ---------- shared app pieces ---------- */
.win { position: absolute; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--tt-border-faint); border-radius: 8px; background: var(--tt-canvas); color: var(--tt-text); box-shadow: var(--tt-shadow-lg); }
.win :focus-visible { outline: 2px solid var(--tt-focus-ring); outline-offset: 2px; }
.ic { flex: none; display: block; }
.sotto-mark { flex: none; display: block; }
.sotto-mark__tile { fill: var(--tt-accent); }
.sotto-mark__glyph { fill: var(--tt-provider-ink); }
.sotto-mark__wave { fill: none; stroke: var(--tt-provider-ink); stroke-width: 7.5; stroke-linecap: round; }
.pm { flex: none; display: block; fill: currentColor; }
.pm[data-provider='codex'] { color: var(--tt-provider-codex); }
.pm[data-provider='claude'] { color: var(--tt-provider-claude); }
.pm[data-provider='grok'] { color: var(--tt-provider-grok); }
.pm[data-provider='devin'] { color: var(--tt-provider-devin); }
:root[data-theme='light'] .pm[data-provider='codex'] { color: color-mix(in srgb, var(--tt-provider-codex) 50%, var(--tt-text)); }
:root[data-theme='light'] .pm[data-provider='claude'] { color: color-mix(in srgb, var(--tt-provider-claude) 50%, var(--tt-text)); }
:root[data-theme='light'] .pm[data-provider='grok'] { color: color-mix(in srgb, var(--tt-provider-grok) 50%, var(--tt-text)); }
:root[data-theme='light'] .pm[data-provider='devin'] { color: color-mix(in srgb, var(--tt-provider-devin) 50%, var(--tt-text)); }
code, .code { padding: 0 5px; border: 1px solid var(--tt-code-border); border-radius: 5px; background: var(--tt-code-bg); color: var(--tt-code-text); font-family: var(--tt-font-mono); font-size: .88em; white-space: nowrap; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* The strip: mark, switch, window controls (the pages that still wear one). */
.strip { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 54px; padding-left: 18px; user-select: none; }
.brand { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 600; letter-spacing: -.1px; }
.switch { display: inline-flex; padding: 4px; border: 1px solid var(--tt-hairline); border-radius: 999px; background: var(--tt-track); }
.switch button { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 15px 0 12px; border: 0; border-radius: 999px; background: transparent; color: var(--tt-text-2); font-size: 13.5px; font-weight: 500; white-space: nowrap; cursor: pointer; }
.switch button:hover:not([aria-selected='true']) { color: var(--tt-text); }
.switch button[aria-selected='true'] { background: var(--tt-pill); color: var(--tt-pill-ink); }
.switch button:focus-visible { outline-offset: -3px; }
.wave { display: inline-flex; align-items: center; gap: 2px; height: 14px; }
.wave i { display: block; width: 2px; border-radius: 2px; background: currentColor; }
.wave i:nth-child(1), .wave i:nth-child(5) { height: 4px; } .wave i:nth-child(2), .wave i:nth-child(4) { height: 8px; } .wave i:nth-child(3) { height: 12px; }
.controls { justify-self: end; align-self: stretch; display: flex; }
.controls button { display: grid; place-items: center; width: 46px; border: 0; background: transparent; color: var(--tt-text-muted); cursor: pointer; }
.controls button:hover { color: var(--tt-text); background: var(--tt-hover); }
.controls button:focus-visible { outline-offset: -3px; }

/* The footer under a strip: page links, footer status, the update control. */
.footer { flex: none; display: flex; align-items: center; gap: 22px; height: 40px; padding: 0 12px 0 22px; border-top: 1px solid var(--tt-hairline); color: var(--tt-text-muted); font-size: 13px; }
.footer nav { display: flex; gap: 22px; }
.footer a { color: var(--tt-text-2); text-decoration: none; }
.footer a:hover { color: var(--tt-text); }
.footer__status { margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.footer__update { display: grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent; color: var(--tt-text-muted); cursor: pointer; }

/* Buttons, after global.css. */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 30px; padding: 0 12px; border: 1px solid var(--tt-hairline); border-radius: 999px; background: transparent; color: var(--tt-text-2); font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer; }
.btn:hover { border-color: var(--tt-text-faint); color: var(--tt-text); }
.btn--sm { min-height: 26px; padding: 0 10px; font-size: 12.5px; }
.btn--answer { border-color: color-mix(in srgb, var(--tt-attention) 55%, transparent); color: var(--tt-attention); }
.btn--answer:hover { border-color: var(--tt-attention); color: var(--tt-attention); background: var(--tt-warning-surface); }
.btn--stop { border-color: var(--tt-error-border); color: var(--tt-error); }
.btn--stop:hover { border-color: var(--tt-error); color: var(--tt-error); background: var(--tt-error-surface); }
.iconbtn { display: grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--tt-text-muted); cursor: pointer; }
.iconbtn:hover, .iconbtn[aria-pressed='true'] { background: var(--tt-hover); color: var(--tt-text); }

/* The in-flight limit the app enforces: four cells, one per thread the command center may run at once. */
.meter { display: inline-flex; align-items: center; gap: 8px; color: var(--tt-text-2); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.meter__cells { display: inline-flex; gap: 3px; }
.meter__cells i { width: 6px; height: 14px; border: 1px solid var(--tt-border); border-radius: 2px; }
.meter__cells i[data-on] { border-color: transparent; background: var(--tt-accent); }

/* Status rings, after the sidebar's. */
.ring { display: block; flex: none; width: 10px; height: 10px; border: 1.5px solid var(--tt-border); border-radius: 50%; }
.ring[data-tone='working'] { border: 0; background: conic-gradient(var(--tt-activity) 0 32%, color-mix(in srgb, var(--tt-activity) 22%, transparent) 32% 100%); mask: radial-gradient(circle, transparent 38%, currentcolor 42%); }
.ring[data-tone='needs'] { border: 2px solid var(--tt-attention); }
.ring[data-tone='failed'] { border: 2px solid var(--tt-error); }
.ring[data-tone='ready'], .ring[data-tone='landing'] { border: 0; background: var(--tt-success); }
.ring[data-tone='quiet'] { border: 1.5px dashed var(--tt-text-muted); }
.tone { white-space: nowrap; }
.tone[data-tone='needs'] { color: var(--tt-attention); }
.tone[data-tone='failed'] { color: var(--tt-error); }
.tone[data-tone='working'] { color: var(--tt-activity); }
.tone[data-tone='ready'], .tone[data-tone='landing'] { color: var(--tt-success); }
.tone[data-tone='quiet'], .tone[data-tone='idle'] { color: var(--tt-text-muted); }
.add { color: var(--tt-success); } .del { color: var(--tt-error); }

/* A thread card: the thread the command center started or sent to, under that message. Pressing it opens the thread. */
.tcard { position: relative; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; column-gap: 10px; row-gap: 2px; padding: 10px 12px 10px 12px; border: 1px solid var(--tt-hairline); border-radius: 12px; background: var(--tt-surface); }
.tcard:hover { border-color: var(--tt-border-faint); background: color-mix(in srgb, var(--tt-surface-elevated) 70%, var(--tt-surface)); }
.tcard[data-tone='needs'], .tcard[data-tone='failed'] { box-shadow: inset 3px 0 0 var(--tt-attention); }
.tcard[data-tone='failed'] { box-shadow: inset 3px 0 0 var(--tt-error); }
.tcard__title { display: flex; align-items: center; gap: 6px; min-width: 0; margin: 0; font-size: 14px; font-weight: 500; line-height: 1.35; }
.tcard__open { min-width: 0; overflow: hidden; padding: 0; border: 0; background: transparent; color: var(--tt-text); font-weight: 500; text-align: left; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.tcard__open::after { content: ''; position: absolute; inset: 0; border-radius: 12px; }
.tcard__open:focus-visible { outline: 0; }
.tcard__open:focus-visible::after { outline: 2px solid var(--tt-focus-ring); outline-offset: 1px; }
.tcard__go { color: var(--tt-text-muted); opacity: 0; transition: opacity 120ms; }
.tcard:hover .tcard__go, .tcard:focus-within .tcard__go { opacity: 1; }
.tcard__state { font-size: 12.5px; font-weight: 500; }
.tcard__meta { grid-column: 2 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 7px; min-width: 0; color: var(--tt-text-muted); font-size: 12.5px; }
.tcard__meta > span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.tcard__meta > span + span::before { content: '·'; margin-right: 2px; color: var(--tt-text-muted); }
.tcard__line { grid-column: 2 / -1; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; margin-top: 7px; padding-top: 8px; border-top: 1px solid var(--tt-hairline); color: var(--tt-text-2); font-size: 13px; }
.tcard__line > span { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; min-width: 0; }
.tcard__line .btn, .tcard .btn { position: relative; z-index: 1; }
.tcard__note { grid-column: 2 / -1; display: flex; align-items: flex-start; gap: 7px; margin-top: 6px; color: var(--tt-text-2); font-size: 12.5px; line-height: 1.45; }
.tcard__note .ic { margin-top: 2px; color: var(--tt-text-muted); }
.cctag { display: inline-flex; align-items: center; gap: 4px; color: var(--tt-text-muted); }
/* What Sotto saw, kept apart from what the thread said. */
.ev { grid-column: 2 / -1; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 8px 0 0; padding-top: 8px; border-top: 1px solid var(--tt-hairline); font-size: 12.5px; line-height: 1.45; }
.ev dt { color: var(--tt-text-muted); }
.ev dd { display: flex; flex-wrap: wrap; gap: 2px 12px; margin: 0; color: var(--tt-text-2); }
.ev dd > span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.ev dd > span .ic { color: var(--tt-text-muted); }
.ev dd > span .ic[data-ok] { color: var(--tt-success); }
.ev dd > span .ic[data-bad] { color: var(--tt-error); }
.ev dd.said { color: var(--tt-text-muted); font-style: italic; }
.cards { display: grid; gap: 8px; margin: 12px 0 0; }

/* Transcript: the thread page's own messages. */
.transcript { flex: 1; min-height: 0; overflow-y: auto; padding: 24px max(24px, calc((100% - 720px) / 2)) 8px; scrollbar-width: thin; scrollbar-color: var(--tt-scrollbar) transparent; }
.msg { margin: 0 0 26px; }
.msg > header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; color: var(--tt-text-muted); font-size: 12.5px; }
.msg .who { display: inline-flex; align-items: center; gap: 7px; color: var(--tt-text-2); font-weight: 500; }
.msg time { font-size: 12px; font-variant-numeric: tabular-nums; }
.msg p { margin: 0 0 8px; color: var(--tt-text-2); font-size: 15px; line-height: 1.6; }
.msg p:last-child { margin-bottom: 0; }
.msg[data-role='user'] { margin-left: max(24px, 12%); padding: 13px 17px; border: 1px solid var(--tt-hairline); border-radius: 14px 14px 4px 14px; background: var(--tt-bubble); }
.msg[data-role='user'] p { color: var(--tt-bubble-text); }
.msg[data-role='sotto'] { padding: 2px 0 2px 14px; border-left: 2px solid var(--tt-border-faint); }
.msg[data-role='sotto'] p { font-size: 14px; }
.tag { padding: 0 7px; border: 1px solid var(--tt-hairline); border-radius: 999px; color: var(--tt-text-muted); font-size: 11.5px; line-height: 18px; }
.tlink { padding: 0; border: 0; background: transparent; color: var(--tt-link); font-weight: 500; text-align: left; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--tt-link) 40%, transparent); text-underline-offset: 3px; cursor: pointer; }
.tlink:hover { text-decoration-color: currentColor; }
.delivered { display: flex; align-items: center; gap: 7px; margin-top: 8px; color: var(--tt-text-muted); font-size: 12.5px; }
.delivered .ic { color: var(--tt-success); }
/* The roll-up: counts first, then exceptions, each line linked to its thread. */
.rollup { display: grid; gap: 10px; margin-top: 10px; }
.rollup section { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 4px 14px; padding-top: 10px; border-top: 1px solid var(--tt-hairline); }
.rollup h5 { display: flex; align-self: start; align-items: center; gap: 8px; margin: 0; color: var(--tt-text-muted); font-size: 12.5px; font-weight: 500; line-height: 1.6; }
.rollup ul { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; color: var(--tt-text-2); font-size: 14px; line-height: 1.55; }
.rollup .ev { margin: 4px 0 0; padding-top: 0; border: 0; }
.rollup .btn { margin-left: 4px; vertical-align: 1px; }

/* The composer, after the thread composer: field, option chips, send disc. */
.compose { flex: none; padding: 8px max(24px, calc((100% - 720px) / 2)) 18px; }
.prompt { position: relative; display: grid; padding: 12px 14px 10px; border: 1px solid var(--tt-field-border); border-radius: 16px; background: var(--tt-field); }
.prompt:focus-within { border-color: var(--tt-field-border-focus); }
.prompt textarea { display: block; width: 100%; min-height: 50px; padding: 0; border: 0; outline: 0; resize: none; background: transparent; color: var(--tt-text); font-size: 15px; line-height: 1.5; }
.prompt textarea::placeholder { color: var(--tt-text-muted); }
.prompt__foot { display: flex; align-items: center; gap: 6px; margin-top: 4px; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; max-width: 220px; padding: 0 9px; border: 1px solid var(--tt-field-border); border-radius: 999px; background: transparent; color: var(--tt-text-muted); font-size: 13px; white-space: nowrap; cursor: pointer; }
.chip:hover { border-color: var(--tt-border-faint); background: var(--tt-hover); color: var(--tt-text); }
.chip > span { overflow: hidden; text-overflow: ellipsis; }
.attach { display: grid; place-items: center; width: 28px; height: 28px; margin-left: -6px; border: 0; border-radius: 8px; background: transparent; color: var(--tt-text-muted); cursor: pointer; }
.attach:hover { color: var(--tt-text); background: var(--tt-hover); }
.send { display: grid; place-items: center; flex: none; width: 28px; height: 28px; margin-left: auto; padding: 0; border: 0; border-radius: 50%; background: var(--tt-activity); color: var(--tt-on-accent); cursor: pointer; }
.compose__note { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 4px 0; color: var(--tt-text-muted); font-size: 12px; }

/* Overview rows (A's rail, B's drop-down). */
.ogroups { display: grid; gap: 0; padding: 0 0 10px; }
.ogroup__head { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 26px; margin: 6px 0 0; padding: 0 14px 0 16px; border: 0; background: transparent; color: var(--side-muted); font-size: 12px; font-weight: 600; letter-spacing: .02em; text-align: left; cursor: pointer; }
.ogroup__head:hover { color: var(--side-text); }
.ogroup__head .count { margin-left: auto; font-weight: 500; font-variant-numeric: tabular-nums; }
.ogroup__head[data-tone='needs'] { color: var(--tt-attention); }
.ogroup ul { margin: 0; padding: 0 6px; list-style: none; }
.orow { position: relative; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; column-gap: 10px; row-gap: 1px; padding: 5px 10px; border-radius: 8px; }
.orow:hover { background: var(--side-hover); }
.orow__open { min-width: 0; overflow: hidden; padding: 0; border: 0; background: transparent; color: var(--side-text); font-size: 13px; font-weight: 500; text-align: left; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.orow__open::after { content: ''; position: absolute; inset: 0; border-radius: 8px; }
.orow__open:focus-visible { outline: 0; }
.orow__open:focus-visible::after { outline: 2px solid var(--tt-focus-ring); outline-offset: -2px; }
.orow__time { color: var(--side-muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.orow__line { grid-column: 2 / -1; display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--side-muted); font-size: 12px; }
.orow__line > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.orow__line .tone { overflow: visible; }
.orow__line code { font-size: 11.5px; }
.orow__act { grid-column: 2 / -1; justify-self: start; margin-top: 4px; }

/* ---------- A · its own room ---------- */
.a-room { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) var(--rail, 320px); border-top: 1px solid var(--tt-hairline); }
.conv { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.conv__head { flex: none; display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 14px 0 20px; }
.conv__title { display: flex; align-items: center; gap: 9px; min-width: 0; margin: 0 auto 0 0; font-size: 15px; font-weight: 500; letter-spacing: -.2px; white-space: nowrap; }
.conv__title .ic { color: var(--tt-text-muted); }
.conv__crumb { display: flex; align-items: center; gap: 7px; min-width: 0; overflow: hidden; color: var(--tt-text-muted); font-size: 12.5px; font-weight: 400; letter-spacing: 0; text-overflow: ellipsis; }
.conv__crumb::before { content: '/'; }
.rail { --side-text: var(--tt-sidebar-text); --side-muted: var(--tt-sidebar-text-muted); --side-hover: var(--tt-sidebar-row-hover); display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--tt-sidebar-border); background: var(--tt-sidebar); color: var(--side-text); }
.rail__head { flex: none; display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 8px 0 16px; }
.rail__head h2 { margin: 0; font-size: 14px; font-weight: 600; }
.rail__short { display: none; }
.win[data-size='s'] .rail__count { display: none; }
.win[data-size='s'] .rail__short { display: inline; }
.rail__fresh { margin-left: auto; color: var(--side-muted); font-size: 12px; white-space: nowrap; }
.rail__head .iconbtn { color: var(--side-muted); }
.rail__head .iconbtn:hover { background: var(--tt-sidebar-row-hover); color: var(--side-text); }
.rail__scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--tt-scrollbar) transparent; }
.rail__sum { margin: 0 16px 4px; color: var(--side-muted); font-size: 12.5px; }
.rail .btn { border-color: var(--tt-sidebar-border); color: var(--side-text); }
.rail .btn--answer { border-color: color-mix(in srgb, var(--tt-attention) 55%, transparent); color: var(--tt-attention); }

/* ---------- B · its own window ---------- */
.dim { opacity: .42; filter: saturate(.7); }
.cc-top { flex: none; display: flex; align-items: center; gap: 8px; height: 44px; padding-left: 14px; user-select: none; }
.cc-top__title { display: flex; align-items: center; gap: 8px; margin: 0 auto 0 0; font-size: 14px; font-weight: 600; white-space: nowrap; }
.cc-top .controls button { width: 40px; }
.cc-top .controls { height: 44px; }
.counts { flex: none; position: relative; padding: 0 10px 8px; border-bottom: 1px solid var(--tt-hairline); }
.counts__toggle { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; width: 100%; min-height: 34px; padding: 4px 8px 4px 10px; border: 1px solid var(--tt-hairline); border-radius: 10px; background: var(--tt-surface); color: var(--tt-text-2); font-size: 12.5px; text-align: left; cursor: pointer; }
.counts__toggle:hover { border-color: var(--tt-border-faint); }
.counts__toggle b { color: var(--tt-text); font-weight: 600; font-variant-numeric: tabular-nums; }
.cnt { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.cnt[data-tone='needs'], .cnt[data-tone='needs'] b { color: var(--tt-attention); }
.counts__chev { margin-left: auto; color: var(--tt-text-muted); transition: transform 140ms; }
.counts__toggle[aria-expanded='true'] .counts__chev { transform: rotate(180deg); }
.ccbody { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.ccbody[data-open]::before { content: ''; position: absolute; inset: 0; z-index: 4; background: var(--tt-overlay); }
.counts__drop { --side-text: var(--tt-text); --side-muted: var(--tt-text-muted); --side-hover: var(--tt-hover); position: absolute; top: 6px; left: 10px; right: 10px; bottom: 4px; z-index: 5; overflow-y: auto; border: 1px solid var(--tt-border-faint); border-radius: 12px; background: var(--tt-surface-elevated); box-shadow: var(--tt-shadow-overlay); scrollbar-width: thin; }
.counts__drop .rail__fresh { display: block; margin: 10px 16px 0; }
.ccwin .transcript { padding: 18px 16px 6px; }
.ccwin .msg p { font-size: 14.5px; }
.ccwin .msg[data-role='user'] { margin-left: 36px; }
.ccwin .compose { padding: 6px 12px 12px; }
.ccwin .rollup section { grid-template-columns: minmax(0, 1fr); gap: 2px; }
.ccwin .rollup ul { font-size: 13.5px; }
.ccwin .tcard__meta { font-size: 12px; }
.hint { position: absolute; display: flex; align-items: center; gap: 8px; color: #a8a8b3; font-size: 12.5px; white-space: nowrap; }
:root[data-theme='light'] .hint { color: #3d3b35; }
.hint kbd { padding: 1px 6px; border: 1px solid currentColor; border-radius: 5px; font: inherit; font-size: 11.5px; }

/* The Threads page drawn behind B (dimmed, not interactive). */
.tp { display: grid; grid-template-columns: var(--side-w, 264px) minmax(0, 1fr); flex: 1; min-height: 0; }
.tp-side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--tt-sidebar-border); background: var(--tt-sidebar); color: var(--tt-sidebar-text); }
.tp-top { display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px 0 14px; font-size: 14px; font-weight: 600; }
.tp-top .sp { margin-right: auto; display: flex; align-items: center; gap: 8px; }
.tp-top .ic { color: var(--tt-sidebar-text-muted); margin: 0 4px; }
.tp-search { display: flex; align-items: center; gap: 8px; height: 32px; margin: 0 8px 8px; padding: 0 10px; border: 1px solid var(--tt-sidebar-border); border-radius: 8px; color: var(--tt-sidebar-text-muted); font-size: 13px; }
.tp-list { flex: 1; min-height: 0; overflow: hidden; padding: 0 4px; }
.tp-folder { display: flex; align-items: center; gap: 7px; padding: 8px 8px 4px; color: var(--tt-sidebar-text); font-size: 13px; font-weight: 500; }
.tp-folder .n { margin-left: auto; color: var(--tt-sidebar-text-muted); font-size: 12px; }
.tp-row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; column-gap: 9px; padding: 5px 10px 5px 10px; border: 1px solid transparent; border-radius: 7px; font-size: 13px; }
.tp-row[data-current] { border-color: var(--tt-selected-border); background: var(--tt-sidebar-row-selected); }
.tp-row b { overflow: hidden; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.tp-row small { color: var(--tt-sidebar-text-muted); font-size: 12px; white-space: nowrap; }
.tp-foot { display: grid; gap: 8px; padding: 8px; }
.tp-seg { display: flex; padding: 2px; border-radius: 8px; background: var(--tt-surface-sunken); font-size: 12.5px; }
.tp-seg span { flex: 1; padding: 4px; border-radius: 6px; color: var(--tt-sidebar-text-muted); text-align: center; }
.tp-seg span[data-on] { background: var(--tt-surface-elevated); color: var(--tt-text); }
.tp-icons { display: flex; gap: 14px; padding: 2px 6px; color: var(--tt-sidebar-text-muted); }
.tp-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.tp-head { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 0 0 18px; font-size: 15px; font-weight: 500; white-space: nowrap; }
.tp-head .crumb { color: var(--tt-text-muted); font-size: 12.5px; font-weight: 400; }
.tp-head .controls { margin-left: auto; height: 44px; }
.tp-body { flex: 1; min-height: 0; overflow: hidden; padding: 20px max(24px, calc((100% - 680px) / 2)) 0; }
.request { margin: 0 0 18px; padding: 14px 16px; border: 1px solid var(--tt-hairline); border-left: 3px solid var(--tt-attention); border-radius: 12px; }
.request h4 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
.request pre { margin: 0 0 12px; padding: 8px 12px; border: 1px solid var(--tt-code-border); border-radius: 8px; background: var(--tt-code-bg); font-family: var(--tt-font-mono); font-size: 13px; }
.request .btns { display: flex; gap: 8px; }
.request .btns span { padding: 5px 14px; border: 1px solid var(--tt-hairline); border-radius: 999px; font-size: 13px; font-weight: 500; }
.request .btns span + span { border-color: var(--tt-pill); background: var(--tt-pill); color: var(--tt-pill-ink); }
.tp-follow { margin: 0 12px -1px; padding: 9px 14px; border: 1px solid var(--tt-field-border); border-bottom: 0; border-radius: 14px 14px 0 0; background: var(--tt-surface); color: var(--tt-text-muted); font-size: 13px; }
.tp-follow b { color: var(--tt-text); font-weight: 500; }

/* ---------- C · board first ---------- */
.c-room { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--tt-hairline); }
.board__head { flex: none; display: flex; align-items: center; gap: 12px; padding: 14px 20px 10px 24px; }
.board__head h1 { display: flex; align-items: center; gap: 9px; margin: 0; font-size: 17px; font-weight: 500; letter-spacing: -.25px; white-space: nowrap; }
.board__head h1 .ic { color: var(--tt-text-muted); }
.board__head .meter { margin-left: auto; }
.board__sub { overflow: hidden; color: var(--tt-text-muted); font-size: 12.5px; text-overflow: ellipsis; white-space: nowrap; }
.board { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); align-items: start; gap: 18px; padding: 4px 24px 24px; scrollbar-width: thin; scrollbar-color: var(--tt-scrollbar) transparent; }
.bcol { display: grid; gap: 18px; min-width: 0; }
.bgroup { display: grid; gap: 8px; min-width: 0; }
.bgroup__head { display: flex; align-items: baseline; min-width: 0; gap: 8px; margin: 0; color: var(--tt-text-2); font-size: 13px; font-weight: 600; }
.bgroup__head .ring { align-self: center; }
.bgroup__head .count { color: var(--tt-text-muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.bgroup__head[data-tone='needs'] { color: var(--tt-attention); }
.bgroup__hint { min-width: 0; margin-left: 4px; overflow: hidden; color: var(--tt-text-muted); font-size: 12px; font-weight: 400; text-overflow: ellipsis; white-space: nowrap; }
.dock { flex: none; position: relative; z-index: 4; padding: 0 24px 16px; }
.dock__last { display: flex; align-items: center; gap: 10px; margin: 0 auto 8px; max-width: 860px; padding: 8px 8px 8px 14px; border: 1px solid var(--tt-hairline); border-radius: 12px; background: var(--tt-surface); color: var(--tt-text-2); font-size: 13px; }
.dock__last > span { display: -webkit-box; min-width: 0; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-height: 1.45; }
.dock__last .who { color: var(--tt-text); font-weight: 500; }
.dock__last .btn { margin-left: auto; }
.dock__bar { display: flex; align-items: center; gap: 6px; max-width: 860px; margin: 0 auto; padding: 7px 8px 7px 14px; border: 1px solid var(--tt-field-border); border-radius: 999px; background: var(--tt-field); box-shadow: var(--tt-shadow-sm); }
.dock__bar:focus-within { border-color: var(--tt-field-border-focus); }
.dock__bar input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--tt-text); font-size: 15px; }
.dock__bar input::placeholder { color: var(--tt-text-muted); }
.dock__bar > .ic { color: var(--tt-text-muted); }
.panel { position: absolute; left: 12px; right: 12px; bottom: 0; z-index: 6; display: flex; flex-direction: column; height: min(78%, 600px); border: 1px solid var(--tt-border-faint); border-bottom: 0; border-radius: 16px 16px 0 0; background: var(--tt-canvas); box-shadow: var(--tt-shadow-overlay); }
.panel__head { flex: none; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 10px 0 18px; border-bottom: 1px solid var(--tt-hairline); }
.panel__head h2 { display: flex; align-items: center; gap: 8px; margin: 0 auto 0 0; font-size: 14px; font-weight: 600; white-space: nowrap; }
.panel__head h2 small { color: var(--tt-text-muted); font-size: 12.5px; font-weight: 400; }
.panel .transcript { padding-top: 18px; }

/* ---------- A2 · overview in the sidebar: the Threads page's own shell, after threadSidebar.css and threadsChrome.css ---------- */
.shell { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: var(--side, 320px) minmax(0, 1fr); }
.nav { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--tt-hairline); background: var(--tt-sidebar); color: var(--tt-text); }
.nav__top { display: flex; flex: none; align-items: center; gap: 2px; height: 44px; padding: 0 6px 0 14px; user-select: none; }
.nav__brand { display: inline-flex; flex: 0 1 auto; align-items: center; gap: 8px; min-width: 18px; margin-right: auto; color: var(--tt-text); font-size: 14px; font-weight: 600; letter-spacing: -.1px; }
.nav__action { display: grid; place-items: center; flex: none; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 7px; background: transparent; color: var(--tt-text-muted); cursor: pointer; }
.nav__action:hover { background: var(--tt-hover); color: var(--tt-text); }
.nav__seg { display: inline-flex; flex: none; padding: 2px; border-radius: 8px; background: var(--tt-surface-sunken); }
.nav__seg button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--tt-text-muted); font-size: 12.5px; white-space: nowrap; cursor: pointer; }
.nav__seg button:hover { color: var(--tt-text); }
.nav__seg button[aria-selected='true'], .nav__seg button[aria-checked='true'] { background: var(--tt-surface-elevated); color: var(--tt-text); box-shadow: 0 1px 2px var(--tt-shadow-color); }
.nav__seg button:focus-visible { outline-offset: -2px; }
.nav__seg--icons button { padding: 0 7px; }
.nav__search input { flex: 1; min-width: 0; padding: 0; border: 0; outline: 0; background: transparent; color: var(--tt-text); font-size: 13px; }
.nav__search input::placeholder { color: var(--tt-text-muted); }
.nav__search:focus-within { border-color: var(--tt-field-border-focus); }
.nav__search { display: flex; flex: none; align-items: center; gap: 8px; height: 32px; margin: 0 8px 8px; padding: 0 10px; border: 1px solid var(--tt-hairline); border-radius: 8px; background: var(--tt-field); color: var(--tt-text-muted); font-size: 13px; }
.nav__scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 4px 12px; scrollbar-width: thin; scrollbar-color: var(--tt-scrollbar) transparent; }
.nav__label { display: flex; align-items: center; gap: 6px; margin: 0; padding: 4px 4px 4px 10px; color: var(--tt-text-muted); font-size: 12px; font-weight: 500; letter-spacing: .02em; }
.nav__label .fresh { margin-left: auto; font-weight: 400; letter-spacing: 0; white-space: nowrap; }
.nav__label .nav__action { width: 24px; height: 24px; }
/* Groups are drawn as the sidebar's folder heads; the Needs you head keeps the attention colour. */
.grp__head { display: flex; align-items: center; gap: 6px; width: 100%; min-height: 30px; margin-top: 4px; padding: 0 10px 0 6px; border: 0; border-radius: 7px; background: transparent; color: var(--tt-text-2); font-size: 14px; font-weight: 500; text-align: left; cursor: pointer; }
.grp__head:hover { background: var(--tt-hover); }
.grp__head .ic { color: var(--tt-text-muted); transition: transform 120ms; }
.grp__head[aria-expanded='false'] .chev { transform: rotate(-90deg); }
.grp__head[data-tone='needs'] { color: var(--tt-attention); }
.grp__count { margin-left: auto; color: var(--tt-text-muted); font-size: 12px; font-weight: 400; font-variant-numeric: tabular-nums; }
.grp ul { margin: 0; padding: 0; list-style: none; }
.row { position: relative; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; column-gap: 9px; row-gap: 5px; margin: 1px 0; padding: 9px 10px; border: 1px solid transparent; border-radius: 7px; }
.row:hover { background: var(--tt-hover); }
.row[data-current] { border-color: var(--tt-selected-border); background: var(--tt-selected); }
.row__open { min-width: 0; overflow: hidden; padding: 0; min-height: 0; border: 0; background: transparent; color: var(--tt-text-2); font-size: 14px; font-weight: 500; line-height: 1.4; text-align: left; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.row[data-current] .row__open { color: var(--tt-text); }
.row__open::after { content: ''; position: absolute; inset: 0; border-radius: 7px; }
.row__open:focus-visible { outline: 0; }
.row__open:focus-visible::after { outline: 2px solid var(--tt-focus-ring); outline-offset: -2px; }
.row__time { color: var(--tt-text-muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row__meta { grid-column: 2 / -1; display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--tt-text-muted); font-size: 12px; }
.row__proj { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row__meta .tone { margin-left: auto; flex: none; }
/* On the selected row the tinted surface is lighter (light mode) than the sidebar, so a status colour leans toward the text to keep 4.5:1. */
:root[data-theme='light'] .row[data-current] .btn--answer,
:root[data-theme='light'] .row[data-current] .tone:not([data-tone='idle']):not([data-tone='quiet']) { color: color-mix(in oklab, currentColor 72%, var(--tt-text)); }
.row__ask { grid-column: 2 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; color: var(--tt-text-2); font-size: 12.5px; }
.row__ask code { font-size: 11.5px; }
.row__ask .btn { position: relative; z-index: 1; }
.nav__foot { display: flex; flex: none; flex-wrap: wrap; align-items: center; gap: 6px 2px; margin-top: auto; padding: 8px 6px 10px; border-top: 1px solid var(--tt-hairline); }
.nav__foot .nav__seg { display: flex; flex: 1 0 100%; }
/* The one change to the real foot: three rooms. Each segment keeps an equal share but never drops below its own
   label, so Command center stays one line at the switch's 12.5px; Dictate and Threads give up the difference. */
.nav__foot .nav__seg button { flex: 1 1 0; min-width: max-content; padding: 0 9px; }
.nav__pages { display: flex; align-items: center; }
.nav__page { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 7px; color: var(--tt-text-muted); text-decoration: none; }
.nav__page:hover { background: var(--tt-hover); color: var(--tt-text); }
.nav__update { display: grid; place-items: center; width: 30px; height: 30px; margin-left: auto; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--tt-text-muted); cursor: pointer; }
.nav__update:hover { background: var(--tt-hover); color: var(--tt-text); }
/* The window's own controls, once, at the page's top-right corner; the pane header pads itself clear of them. */
.winctl { position: absolute; top: 0; right: 0; z-index: 6; display: flex; align-items: center; gap: 0; height: 44px; padding-right: 6px; }
.winctl button { display: grid; place-items: center; width: 34px; height: 30px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--tt-text-muted); cursor: pointer; }
.winctl button:hover { background: var(--tt-hover); color: var(--tt-text); }
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.pane__head { flex: none; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 122px 0 18px; }
.pane__title { display: flex; align-items: center; gap: 10px; min-width: 0; margin: 0 auto 0 0; font-size: 15px; font-weight: 500; letter-spacing: -.2px; white-space: nowrap; }
.pane__title .ic { color: var(--tt-text-muted); }
.pane__crumb { display: flex; align-items: center; gap: 7px; min-width: 0; overflow: hidden; color: var(--tt-text-muted); font-size: 12.5px; font-weight: 400; letter-spacing: 0; text-overflow: ellipsis; }
.pane__crumb::before { content: '/'; }
.pane .transcript { padding: 28px max(24px, calc((100% - 760px) / 2)) 8px; }
.pane .compose { padding: 10px max(24px, calc((100% - 760px) / 2)) 20px; }
.pane .prompt__foot { flex-wrap: wrap; row-gap: 6px; }
.pane__empty { display: grid; justify-items: center; gap: 6px; margin: 80px auto 0; color: var(--tt-text-muted); font-size: 13px; text-align: center; }
.pane__empty b { color: var(--tt-text); font-size: 15px; font-weight: 500; }
.request .btns .btn--deny { border-color: var(--tt-hairline); }
.request .btns .btn--allow { border-color: var(--tt-pill); background: var(--tt-pill); color: var(--tt-pill-ink); font-weight: 600; }
.followups { margin: 0 12px -1px; padding: 9px 14px; border: 1px solid var(--tt-field-border); border-bottom: 0; border-radius: 14px 14px 0 0; background: var(--tt-surface); color: var(--tt-text-muted); font-size: 13px; }
.followups b { color: var(--tt-text); font-weight: 500; }
.dictate { flex: 1; display: grid; align-content: center; justify-items: center; gap: 22px; min-height: 0; padding: 44px 24px 24px; }
.dictate__wave { display: flex; align-items: center; gap: 8px; height: 46px; }
.dictate__wave i { display: block; width: 12px; border-radius: 999px; background: var(--tt-accent); }
.dictate h2 { margin: 0; font-size: 40px; font-weight: 500; letter-spacing: -1px; }
.dictate__go { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; color: var(--tt-text-muted); font-size: 13.5px; }
.dictate__go .btn--primary { min-height: 44px; padding: 0 24px; border-color: var(--tt-pill); background: var(--tt-pill); color: var(--tt-pill-ink); font-size: 15px; font-weight: 600; }
.dictate kbd { padding: 3px 7px; border: 1px solid var(--tt-hairline); border-radius: 6px; color: var(--tt-text-2); font: inherit; font-size: 12px; }
.win[data-size='s'] .row { grid-template-columns: 10px minmax(0, 1fr); }
.win[data-size='s'] .row__time { display: none; }
.win[data-size='s'] .pane__crumb { display: none; }
.win[data-size='s'] .pane__head { padding-left: 14px; }
.win[data-size='s'] .dictate h2 { font-size: 30px; }

/* A2 with a thread beside the conversation: the Threads page's split (each pane at least 400px, a 9px divider, the
   focused pane's top edge in the accent), or its one-pane-at-a-time tabs where two will not fit. */
.split { display: grid; grid-template-columns: minmax(0, 1fr) 9px minmax(0, 1fr); min-width: 0; min-height: 0; }
.split__divider { position: relative; cursor: col-resize; }
.split__divider::before { content: ''; position: absolute; inset: 0 4px; background: var(--tt-hairline); }
.split__divider:hover::before { inset: 0 3px; background: var(--tt-activity); }
.split > .pane[data-focused] { box-shadow: inset 0 2px 0 var(--tt-activity); }
.split > .pane:not([data-focused]) .pane__title { color: var(--tt-text-2); }
.split .pane__crumb, .tabbed .pane__crumb { display: none; }
.split .pane--cc .pane__head { padding-right: 10px; }
.split .transcript { padding: 20px 20px 8px; }
.split .compose { padding: 8px 16px 14px; }
.split .msg p, .tabbed .msg p { font-size: 14.5px; }
.split .msg[data-role='user'], .tabbed .msg[data-role='user'] { margin-left: 32px; }
.split .rollup section, .tabbed .rollup section { grid-template-columns: minmax(0, 1fr); gap: 2px; }
.pane__name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.pane__title .pane__crumb { flex: 0 100 auto; }
.pane__title:focus { outline: 0; }
.pane__title:focus-visible { outline: 2px solid var(--tt-focus-ring); outline-offset: 3px; border-radius: 4px; }
.tabbed { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.tabbed > .pane { flex: 1; min-height: 0; }
.tabbed .pane__head { padding-right: 10px; }
.tabs { display: flex; flex: none; gap: 2px; padding: 2px 128px 0 10px; overflow-x: auto; border-bottom: 1px solid var(--tt-hairline); scrollbar-width: none; }
.tab { display: inline-flex; flex: 0 1 auto; align-items: center; gap: 7px; min-width: 0; max-width: 260px; min-height: 34px; padding: 0 12px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--tt-text-muted); font-size: 13px; font-weight: 500; cursor: pointer; }
.tab > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab:hover { color: var(--tt-text-2); }
.tab[aria-selected='true'] { border-bottom-color: var(--tt-activity); color: var(--tt-text); }
.tab:focus-visible { outline-offset: -3px; }
.answered { display: flex; align-items: center; gap: 8px; margin: 0 0 24px; padding: 10px 14px; border: 1px solid var(--tt-hairline); border-radius: 12px; color: var(--tt-text-2); font-size: 13.5px; }
.answered .ic { color: var(--tt-success); }
.answered time { margin-left: auto; color: var(--tt-text-muted); font-size: 12px; }
.activity { display: flex; align-items: center; gap: 9px; margin: 0 0 24px; color: var(--tt-text-2); font-size: 14px; }

/* ---------- the minimum size, 820x560 ---------- */
.win[data-size='s'] .strip { height: 48px; }
.win[data-size='s'] .switch button { height: 28px; padding: 0 12px 0 10px; font-size: 13px; }
.win[data-size='s'] .footer { height: 34px; gap: 16px; font-size: 12.5px; }
.win[data-size='s'] .footer nav { gap: 16px; }
.win[data-size='s'] .conv__head { height: 44px; }
.win[data-size='s'] .conv__crumb { display: none; }
.win[data-size='s'] .transcript { padding: 16px 20px 6px; }
.win[data-size='s'] .msg[data-role='user'] { margin-left: 24px; }
.win[data-size='s'] .msg p { font-size: 14.5px; }
.win[data-size='s'] .compose { padding: 6px 20px 12px; }
.win[data-size='s'] .prompt { padding: 10px 12px 8px; }
.win[data-size='s'] .prompt textarea { min-height: 26px; }
.win[data-size='s'] .rollup section { grid-template-columns: minmax(0, 1fr); gap: 2px; }
.win[data-size='s'] .rail__head { height: 44px; }
.win[data-size='s'] .rail__fresh { font-size: 11.5px; }
.win[data-size='s'] .orow__open { white-space: normal; }
.win[data-size='s'] .rail :is(.orow__proj, .orow__sep) { display: none; }
.win[data-size='s'] .orow__line { align-items: flex-start; }
.win[data-size='s'] .orow__line > .pm { margin-top: 2px; }
.win[data-size='s'] .orow__line > span { white-space: normal; }
.win[data-size='s'] .orow__time { align-self: start; }
.win[data-size='s'] .orow > .ring { align-self: start; margin-top: 5px; }
.win[data-size='s'] .meter__more { display: none; }
.win[data-size='s'] .board__head { padding: 10px 16px 8px; }
.win[data-size='s'] .board__sub { display: none; }
.win[data-size='s'] .board { gap: 14px; padding: 2px 16px 16px; }
.win[data-size='s'] .bcol { gap: 14px; }
.win[data-size='s'] .bgroup__hint { display: none; }
.win[data-size='s'] .dock { padding: 0 16px 10px; }
.win[data-size='s'] .dock__last { display: none; }
.win[data-size='s'] .panel { height: calc(100% - 8px); left: 0; right: 0; border-radius: 12px 12px 0 0; }
.win[data-size='s'] .counts__toggle { gap: 2px 10px; }
.ccwin[data-size='s'] .pin { display: none; }
.ccwin[data-size='s'] .meter__cells { display: none; }
.ccwin[data-size='s'] .cc-top { gap: 6px; padding-left: 12px; }
.ccwin[data-size='s'] .cc-top .controls button { width: 34px; }
.ccwin[data-size='s'] .btn--stop { padding: 0 10px; }
.ccwin[data-size='s'] .transcript { padding: 14px 12px 6px; }
.ccwin[data-size='s'] .msg[data-role='user'] { margin-left: 20px; }
.ccwin[data-size='s'] .compose { padding: 6px 10px 10px; }
.ccwin[data-size='s'] .chip--perm { display: none; }
.win[data-size='s'] .tp-body { padding: 14px 20px 0; }
.win[data-size='s'] .tp-head .crumb { display: none; }
</style>
</head>
<body>

<div class="wrap" id="wrap"><div class="desk" id="desk"></div></div>
<div class="notes" id="notes"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="bar" role="toolbar" aria-label="Prototype controls">
  <button id="prev" type="button" aria-label="Previous variant">←</button>
  <span class="name" id="name" aria-live="polite"></span>
  <button id="next" type="button" aria-label="Next variant">→</button>
  <span class="sep"></span>
  <button id="mode" type="button">Light</button>
  <span class="sep"></span>
  <button type="button" data-size="l" aria-label="Show the window at 1280 by 800">1280 × 800</button>
  <button type="button" data-size="s" aria-label="Show the window at the 820 by 560 minimum">820 × 560</button>
  <span class="sep" id="open-sep"></span>
  <button type="button" id="open" aria-pressed="false"></button>
  <button type="button" id="beside" aria-pressed="false" hidden>Thread beside</button>
</div>

<script>
/* ---------- icons (Lucide shapes) and marks ---------- */
const ICON = {
  chevDown: '<path d="m6 9 6 6 6-6"/>',
  chevRight: '<path d="m9 18 6-6-6-6"/>',
  arrowUp: '<path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>',
  go: '<path d="M7 7h10v10"/><path d="M7 17 17 7"/>',

function evidence(id) {
  if (id === 'babysit') return `<dl class="ev"><dt>Sotto saw</dt><dd><span>${ic('pr', 13)}PR #845 open</span><span>${ic('checkCircle', 13, 'data-ok')}7 of 7 checks passing</span><span>${ic('diff', 13)}<span class="add">+212</span> <span class="del">−40</span> in 6 files</span></dd><dt>It said</dt><dd class="said">“Release notes are written and every changelog link resolves.”</dd></dl>`
  if (id === 'hostlock') return `<dl class="ev"><dt>Sotto saw</dt><dd><span>${ic('term', 13)}<code>npm test</code> exited 1</span><span>${ic('x', 13, 'data-bad')}3 failing in hostLock.test.ts</span></dd><dt>It said</dt><dd class="said">“The lock is released before the second host connects.”</dd></dl>`
  if (id === 'devin') return `<dl class="ev"><dt>Sotto saw</dt><dd><span>${ic('merge', 13)}PR #813 approved</span><span>${ic('checkCircle', 13, 'data-ok')}Auto-merge on, 1 check running</span></dd></dl>`
  return ''
}

/* A card: title, project, host if not this computer, provider mark and model, state, what it waits on. */
function card(id, o = {}) {
  const t = T[id]
  const meta = [`<span>${t.project}</span>`, hostLabel(t), `<span>${pm(t.provider, 13)}${t.model}</span>`, o.copy && t.copy ? `<span>${t.copy}</span>` : '', o.by && t.by ? `<span class="cctag" title="Started by the command center">${ic('center', 12)}<span class="vh">Started by the </span>Command center</span>` : ''].filter(Boolean).join('')
  let line = ''
  if (t.tone === 'needs') line = `<div class="tcard__line"><span>Asks to run <code>npm run migrate</code></span>${answerBtn(id)}</div>`
  const ev = o.evidence === false ? '' : evidence(id)
  const notes = (o.notes || []).map(n => `<div class="tcard__note">${n}</div>`).join('')
  const takeover = t.takeover ? `<div class="tcard__note">${ic('user', 13)}<span>You took it over at 9:14 am. The command center stopped sending to it.</span></div>` : ''
  const right = t.tone === 'working' ? `${t.state} · ${t.time}` : t.tone === 'quiet' ? 'No activity for 24 min' : t.tone === 'idle' ? 'Finished 2 h ago' : t.state
  return `<article class="tcard" data-tone="${t.tone}">
    <span class="ring" data-tone="${t.tone}" aria-hidden="true"></span>
    <h4 class="tcard__title"><button type="button" class="tcard__open" data-open="${id}" aria-label="${openName(t)}">${t.title}</button>${ic('go', 13, '', 'tcard__go')}</h4>
    <span class="tcard__state tone" data-tone="${t.tone}">${right}</span>
    <div class="tcard__meta">${meta}</div>
    ${line}${ev}${takeover}${notes}
  </article>`
}

function orow(id, o = {}) {

    if (el.closest('.vh, [hidden]') || !el.getClientRects().length) continue
    const fg = rgbaOf(getComputedStyle(el).color), bg = surfaceOf(el)
    const mixed = [0, 1, 2].map(i => fg[i] * fg[3] + bg[i] * (1 - fg[3]))
    const a = lum(mixed), b = lum(bg), ratio = (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05)
    const text = [...el.childNodes].filter(n => n.nodeType === 3).map(n => n.textContent.trim()).join(' ').slice(0, 40)
    rows.push({ ratio, text, cls: typeof el.className === 'string' ? el.className : el.tagName })
  }
  rows.sort((p, q) => p.ratio - q.ratio)
  const low = rows.filter(r => r.ratio < 4.5)
  const out = document.createElement('pre'); out.id = 'contrast'
  out.style.cssText = 'position:fixed;top:0;left:0;z-index:99;max-height:100vh;overflow:auto;margin:0;padding:10px;background:#000;color:#fff;font:12px/1.4 monospace'
  out.textContent = 'checked ' + rows.length + ' text runs, ' + low.length + ' under 4.5:1\n' + rows.slice(0, 16).map(r => r.ratio.toFixed(2) + '  ' + r.cls + '  "' + r.text + '"').join('\n')
  const press = (key, target = document.body) => target.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }))
  if (state.variant === 'A2') {
    const lit = () => document.querySelector('.nav__foot [aria-selected="true"]')
    const pages = [state.page + ' (' + lit()?.textContent + ')']
    press('ArrowLeft', lit()); pages.push(state.page + ' (' + lit()?.textContent + ', focused: ' + (document.activeElement === lit()) + ')')
    press('ArrowLeft', lit()); pages.push(state.page + ' (' + lit()?.textContent + ')')
    document.querySelector('.nav__foot [data-page="cc"]').click(); pages.push(state.page + ' (' + lit()?.textContent + ')')
    out.textContent += '\nfoot switch: ' + pages.join(' > ')
    const answer = document.querySelector('.nav [data-answer]')
    if (answer && !state.resolved) {
    answer.focus(); answer.click()
    const opened = 'beside ' + state.beside + ', focus on ' + (document.activeElement?.id || document.activeElement?.className)
    press('Escape', document.activeElement)
    const closed = 'closed ' + (state.beside === null) + ', focus back on ' + document.activeElement?.className + ' ' + document.activeElement?.dataset.open
    document.querySelector('.nav [data-answer]').click(); document.querySelector('[data-act="allow"]').click()
    const answered = 'after Allow: needs you ' + GROUPS[0].ids.length + ', checkout ' + T.checkout.state + ', card says ' + document.querySelector('.pane--cc .tcard[data-tone] .tcard__state:not(:empty)')?.textContent
    out.textContent += '\nbeside: ' + [opened, closed, answered].join(' | ')
    }
  }
  const seen = [state.variant]; press('ArrowRight'); seen.push(state.variant); press('ArrowRight'); seen.push(state.variant); press('ArrowLeft'); seen.push(state.variant)
  const field = document.querySelector('.desk textarea, .desk input'); const before = state.variant; press('ArrowRight', field); seen.push(state.variant === before ? '(ignored in a field)' : 'MOVED IN A FIELD')
  press('ArrowLeft')
  out.textContent += '\narrow keys: ' + seen.join(' > ')
  document.body.append(out)
}
if (params.get('check') === '1') setTimeout(check, 300)
</script>
</body>
