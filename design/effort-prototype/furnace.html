:root{color-scheme:dark;--tt-room:light-dark(#f7f7fa,#151619);--tt-surface:light-dark(#fff,#202126);--tt-ink:light-dark(#22232a,#eeeef3);--tt-muted:light-dark(#62646f,#a8aab5);--tt-border:light-dark(#d7d9e1,#3c3e49);--tt-track:light-dark(#dfe1e8,#434650);--tt-fill:light-dark(#697087,#bfc4db);--tt-gold:#dba63c;--tt-gold-hi:#ffe59c;--tt-gold-shadow:#966220;--tt-fire:#ed652d;--tt-fire-hi:#ffb844;--tt-fire-core:#ffebaa;--tt-shadow:light-dark(#1c20331a,#0005);font-family:Figtree,system-ui,sans-serif;background:var(--tt-room);color:var(--tt-ink)}
*{box-sizing:border-box}
body{margin:0;padding:28px;min-width:320px}
button,input,select{font:inherit}
button,select{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--tt-fill);outline-offset:4px}
button{color:var(--tt-ink)}
.top{max-width:860px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.title{font-size:16px;font-weight:500;margin:0}
.appearance{background:transparent;color:var(--tt-muted);border:1px solid var(--tt-border);border-radius:8px;padding:6px 10px;font-size:14px}
.stage{max-width:740px;margin:0 auto;padding:300px 0 0;position:relative}
.composer{background:var(--tt-surface);border:1px solid var(--tt-border);border-radius:18px;padding:20px;position:relative}
.prompt{font-size:16px;color:var(--tt-muted);margin:0 0 32px}
.footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--tt-border);border-radius:24px;background:transparent;color:var(--tt-muted);min-height:32px;padding:4px 11px;font-size:14px}
.chip[aria-expanded='true']{color:var(--tt-ink);background:var(--tt-room)}
.send{display:grid;place-items:center;width:32px;height:32px;margin-left:auto;border-radius:50%;background:var(--tt-ink);color:var(--tt-surface);font-size:20px}
.permission{font-size:12px;color:var(--tt-muted);margin-top:16px}
.furnace{position:absolute;bottom:calc(100% + 12px);left:0;width:440px;max-width:100%;padding:20px;background:var(--tt-surface);border:1px solid var(--tt-border);border-radius:16px;box-shadow:0 12px 32px var(--tt-shadow);z-index:1}
.furnace[hidden]{display:none}
.heading{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:14px}
.heading label{color:var(--tt-muted)}
.value{font-size:16px;font-weight:500}
.drawing{position:relative;height:128px;margin-top:4px}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.range{position:absolute;bottom:0;left:0;width:100%;height:36px;margin:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:ew-resize;touch-action:pan-y;z-index:2}
.range::-webkit-slider-runnable-track{background:transparent;height:8px}
.range::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:16px;height:28px;margin-top:-10px;background:transparent;border:0}
.range::-moz-range-track{background:transparent;height:8px}
.range::-moz-range-thumb{width:16px;height:28px;background:transparent;border:0}
.thumb{position:absolute;bottom:18px;left:8px;transform:translate(-50%,50%);width:16px;height:20px;background:var(--tt-ink);border:2px solid var(--tt-surface);border-radius:5px;box-shadow:0 0 0 1px var(--tt-border);pointer-events:none;z-index:1;transition:background-color 200ms}
[data-gold='true'] .thumb{background:var(--tt-gold-hi);border-color:var(--tt-gold-shadow)}
.stops{display:flex;align-items:flex-start;justify-content:space-between;gap:0;margin:0 -8px;font-size:12px;color:var(--tt-muted)}
.stops button{border:0;background:transparent;color:inherit;padding:7px 4px;min-height:32px;max-width:70px;font-size:12px;line-height:1.15;white-space:nowrap}
.stops button[aria-pressed='true']{color:var(--tt-ink)}
.detail{margin:10px 0 0;font-size:12px;color:var(--tt-muted);min-height:17px}
.claude-options{display:grid;gap:12px;border-top:1px solid var(--tt-border);padding-top:14px;margin-top:14px}
.claude-options[hidden]{display:none}
.mode{display:grid;grid-template-columns:1fr auto;column-gap:12px;align-items:center;font-size:14px;cursor:pointer}
.mode small{font-size:12px;color:var(--tt-muted);grid-column:1;margin-top:2px}
.mode input{grid-column:2;grid-row:1/3;accent-color:var(--tt-fill);width:17px;height:17px;margin:0}
.controls{max-width:740px;margin:20px auto 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.controls span{font-size:12px;color:var(--tt-muted)}
.controls button{font-size:14px;padding:8px 12px;border-radius:9px;border:1px solid var(--tt-border);background:transparent;min-height:36px}
body[data-provider='claude'] .stage{padding-top:432px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:520px){body{padding:20px 16px}.composer{padding:16px}.furnace{padding:16px}.top{gap:10px}.stops{margin:0 -6px}.stops button{font-size:12px;padding:7px 2px}.value{font-size:16px}.stage{padding-top:288px}.title{font-size:16px}body[data-provider='claude'] .stage{padding-top:432px}}
@media(pointer:coarse){button,.chip,.mode{min-height:44px}}
/* The word stays readable; only its entry and nearby pixels move. */
:root{--tt-label-warm:light-dark(#9b3e15,#ffba8b);--tt-label-hot:light-dark(#983414,#ff9a63);--tt-label-gold:light-dark(#80500b,#f5cf78)}
.label-wrap{position:relative;display:inline-flex;align-items:center;justify-content:flex-end;min-height:24px;isolation:isolate}
.value{display:inline-flex;position:relative;z-index:1;line-height:24px;white-space:pre;--glyph-ink:var(--tt-ink);--forge:0%}
.stops button[aria-pressed='true'] .value[data-tier='high']{--glyph-ink:var(--tt-label-warm)}
.stops button[aria-pressed='true'] .value[data-tier='extra'],.stops button[aria-pressed='true'] .value[data-tier='max']{--glyph-ink:var(--tt-label-hot)}
.value .glyph{display:inline-block;transform-origin:50% 85%;color:color-mix(in srgb,var(--tt-label-gold) var(--forge),var(--glyph-ink));will-change:auto}
.label-pixels{position:absolute;inset:-13px -9px;pointer-events:none;z-index:0}
.label-pixels i{position:absolute;width:3px;height:3px;background:var(--tt-label-warm);image-rendering:pixelated;pointer-events:none}
.label-pixels i:nth-child(3n){width:2px;height:2px;background:var(--tt-label-gold)}
.label-pixels i:nth-child(4n){background:var(--tt-ink)}
@media(prefers-reduced-motion:reduce){.label-pixels{display:none}.value .glyph{transform:none!important;filter:none!important}}

.stops .value{font-size:inherit;font-weight:400;--glyph-ink:var(--tt-muted)}
.stops button[aria-pressed='true'] .value{font-weight:600;--glyph-ink:var(--tt-ink)}

.stops .label-wrap{justify-content:center}
.stops .label-pixels{inset:-6px -3px}
.stops button{position:relative}


</style>
</head>
<body data-provider="codex" data-gold="false">
<header class="top"><h1 class="title">Sotto · Effort furnace</h1><button type="button" class="appearance" aria-label="Switch to light appearance">Light</button></header>
<main>
  <div class="stage">
    <div class="composer">
      <div class="furnace" id="furnace" aria-label="Effort options">
        <label class="sr" for="effort">Effort</label>
        <div class="drawing"><canvas aria-hidden="true"></canvas><span class="thumb" aria-hidden="true"></span><input class="range" id="effort" type="range" min="0" max="5" step="0.001" value="1" aria-valuetext="Medium" aria-describedby="effort-detail"></div>
        <div class="stops" role="group" aria-label="Choose effort level"></div>
        <p class="detail" id="effort-detail">Balanced reasoning.</p>
        <div class="claude-options" hidden>
          <label class="mode">Ultracode<small>Extra high effort + dynamic workflows</small><input type="checkbox" id="ultracode"></label>
          <label class="mode">Ultrathink<small>Think deeper on the next prompt</small><input type="checkbox" id="ultrathink"></label>
        </div>
      </div>
      <p class="prompt">Plan the next change…</p>
      <div class="footer">
        <select class="chip" aria-label="Preview provider"><option value="codex">Codex</option><option value="claude">Claude Code</option></select>
        <button type="button" class="chip trigger" aria-expanded="true" aria-controls="furnace">Effort · Medium</button>
        <span class="send" aria-hidden="true">↑</span>
      </div>
      <div class="permission">Ask before acting</div>
    </div>
  </div>
  <div class="controls"><span>Prototype · B selected</span><button type="button" class="replay">Play melt</button></div>
</main>
<span class="sr" role="status" aria-live="polite"></span>
<script>
(() => {
const root=document.body,canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const range=document.getElementById('effort'),thumb=document.querySelector('.thumb'),panel=document.getElementById('furnace');
const trigger=document.querySelector('.trigger'),provider=document.querySelector('select'),stops=document.querySelector('.stops');
const ultracode=document.getElementById('ultracode'),ultrathink=document.getElementById('ultrathink');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const catalogs={codex:['Low','Medium','High','Extra high','Max','Ultra'],claude:['Low','Medium','High','Extra high','Max']};
let names=catalogs.codex,selected=1,position=1,target=1,heat=.2,dragging=false,raf=0,previous=0;
let meltStart=null,awakeUntil=0,width=398,height=128,colors={},savedEffort=1;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),mix=(a,b,t)=>a+(b-a)*t;
const ease=t=>1-Math.pow(1-clamp(t),3);
const last=()=>names.length-1;
const topActive=()=>selected===last()&&!ultracode.checked;

let labelSignature='',labelTier=1,labelHasRendered=false;
function animateLabel(label,{force=false}={}){
  const signature=provider.value+':'+label;
  if(signature===labelSignature&&!force)return;
  const lower=selected<labelTier&&!ultracode.checked;
  labelTier=selected;labelSignature=signature;
  settleLabelMotion();
  const button=stops.children[selected],labelWrap=button.querySelector('.label-wrap'),labelValue=button.querySelector('.value'),labelPixels=button.querySelector('.label-pixels');
  labelValue.replaceChildren();
  const tier=ultracode.checked?'code':selected===last()?'forge':['low','medium','high','extra','max'][selected];
  labelValue.dataset.tier=tier;labelValue.style.setProperty('--forge','0%');
  const letters=Array.from(names[selected],(character,index)=>{const span=document.createElement('span');span.className='glyph';span.style.setProperty('--letter-index',index);span.textContent=character;span.setAttribute('aria-hidden','true');labelValue.append(span);return span;});
  const shouldAnimate=labelHasRendered&&!reduced.matches;
  labelHasRendered=true;
  if(!shouldAnimate)return;
  const duration=lower?240:tier==='low'?260:tier==='medium'?420:tier==='high'?540:tier==='extra'?680:tier==='code'?620:820;
  letters.forEach((span,i)=>{
    let frames;
    if(lower||tier==='low')frames=[{transform:'translateY(-3px)',opacity:.45},{transform:'translateY(0)',opacity:1}];
    else if(tier==='medium')frames=[{transform:'translateY(4px)',opacity:.45},{transform:'translateY(-1px)',opacity:1,offset:.7},{transform:'translateY(0)',opacity:1}];
    else if(tier==='high')frames=[{transform:'translateY(3px) scale(.96)',opacity:.6},{transform:'translateY(-3px) scale(1.07)',opacity:1,offset:.4},{transform:'translateY(0) scale(1)',opacity:1}];
    else if(tier==='extra')frames=[{transform:'translateY(4px) skewX(-5deg)',opacity:.5},{transform:'translateY(-4px) skewX(4deg)',opacity:1,offset:.35},{transform:'translateY(1px) skewX(-2deg)',offset:.65},{transform:'translateY(0) skewX(0deg)',opacity:1}];
    else if(tier==='code')frames=[{transform:'translateX(-4px)',clipPath:'inset(45% 0 40% 0)',opacity:.4},{transform:'translateX(2px)',clipPath:'inset(0 0 0 0)',opacity:1,offset:.35},{transform:'translateX(0)',clipPath:'inset(0 0 0 0)',opacity:1}];
    else frames=[{transform:'translateY(-7px) scale(.9)',opacity:.35},{transform:'translateY(3px) scale(1.08,.91)',opacity:1,offset:.36},{transform:'translateY(-2px) scale(.99,1.03)',offset:.63},{transform:'translateY(0) scale(1)',opacity:1}];
    span.animate(frames,{duration,delay:i*(lower?8:32),easing:tier==='code'?'steps(5,end)':'cubic-bezier(.2,.8,.2,1)'});
  });
  if(lower||selected<2&&!ultracode.checked)return;
  const count=tier==='forge'?18:tier==='max'?14:tier==='extra'?11:tier==='code'?14:7;
  for(let i=0;i<count;i++){
    const particle=document.createElement('i');
    const x=(i*.61803398875%1)*100;
    particle.style.left=x+'%';particle.style.top='70%';labelPixels.append(particle);
    const dx=(i%2?1:-1)*(3+i%5*2),dy=-(9+(i*7)%17);
    const motion=particle.animate([{transform:'translate(0,0)',opacity:0},{opacity:.9,offset:.18},{transform:'translate('+dx+'px,'+dy+'px)',opacity:0}],{duration:550+i%4*100,delay:130+(i*43)%430,easing:'cubic-bezier(.15,.6,.3,1)',fill:'forwards'});
    motion.finished.then(()=>particle.remove()).catch(()=>{});
  }
}
function settleLabelMotion(){stops.getAnimations({subtree:true}).forEach(animation=>animation.cancel());stops.querySelectorAll('.label-pixels').forEach(pixels=>pixels.replaceChildren());stops.querySelectorAll('.value').forEach(word=>word.style.setProperty('--forge','0%'));}

function palette(){for(const name of ['track','fill','gold','gold-hi','gold-shadow','fire','fire-hi','fire-core']){const probe=document.createElement('span');probe.style.color='var(--tt-'+name+')';root.append(probe);colors[name]=getComputedStyle(probe).color;probe.remove();}}
function pixel(x,y,w,h,color){ctx.fillStyle=colors[color];ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function smoothRect(x,y,w,h,color){ctx.fillStyle=colors[color];ctx.fillRect(x,y,w,h);}
function coin(x,y,melt){const sy=Math.max(.12,1-melt*.88);ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.scale(1,sy);pixel(-8,-4,16,7,'gold-shadow');pixel(-10,-2,20,3,'gold-shadow');pixel(-8,-5,16,5,'gold');pixel(-5,-6,10,2,'gold-hi');pixel(-6,-4,3,2,'gold-hi');pixel(3,-3,4,2,'gold-shadow');ctx.restore();}
function pile(x,y,melt){for(const [dx,dy] of [[-15,0],[7,0],[-23,-6],[0,-6],[19,-5],[-10,-12],[12,-12],[1,-18]])coin(x+dx*(1+melt*.18),y+dy*(1-melt),melt);}
function flame(x,base,size,frame,opacity){if(opacity<=0||size<3)return;ctx.globalAlpha=opacity;const px=3,rows=Math.floor(size/px);for(let y=0;y<rows;y++)for(let col=0;col<17;col++){const f=y/rows,center=8+Math.sin(f*9+frame*.48)*(1.2+f*2),half=7*(1-f)+.25,ripple=Math.sin(col*1.9+frame*.65+y*.5)*.8;if(Math.abs(col-center)<half+ripple){const inner=Math.abs(col-center)/(half+1);pixel(x+(col-8)*px,base-y*px,px,px,f<.35&&inner<.45?'fire-core':inner<.63?'fire-hi':'fire');}}ctx.globalAlpha=1;}
function announce(){const label=ultracode.checked?'Ultracode':names[selected];range.setAttribute('aria-valuetext',ultracode.checked?'Extra high, Ultracode enabled':names[selected]);animateLabel(label);trigger.textContent='Effort · '+label;document.querySelector('[role="status"]').textContent=label+' effort'+(ultrathink.checked?', Ultrathink on next prompt':'');stops.querySelectorAll('button').forEach((button,i)=>button.setAttribute('aria-pressed',String(i===selected)));const detail=ultracode.checked?'Extra high reasoning with workflow orchestration.':provider.value==='codex'&&selected===last()?'Maximum reasoning with subagents.':selected===last()?'Highest model reasoning effort.':['Quick, focused reasoning.','Balanced reasoning.','More time for difficult problems.','Deeper reasoning for demanding work.','Maximum reasoning.'][selected];document.querySelector('.detail').textContent=detail;root.dataset.effort=names[selected];}
function wake(){awakeUntil=performance.now()+4200;if(!raf){previous=performance.now();raf=requestAnimationFrame(draw);}}
function choose(index,{replay=false}={}){const next=clamp(index,0,last()),changed=next!==selected;selected=next;target=next;range.value=next;if(ultracode.checked&&next!==3)ultracode.checked=false;if(topActive()){if(changed||replay||meltStart===null)meltStart=performance.now();}else meltStart=null;announce();if(replay)animateLabel(ultracode.checked?'Ultracode':names[selected],{force:true});wake();}
function draw(now){
raf=0;const quiet=reduced.matches,dt=Math.min(64,now-previous);previous=now;
position=quiet||dragging?target:mix(position,target,1-Math.exp(-dt/55));if(Math.abs(position-target)<.0005)position=target;
const wantedHeat=target/last();heat=quiet?wantedHeat:mix(heat,wantedHeat,1-Math.exp(-dt/120));
const active=now<awakeUntil&&!quiet,t=meltStart===null?0:quiet?4:(now-meltStart)/1000;
const melting=meltStart!==null&&topActive()&&!dragging;
const melt=melting?ease((t-.85)/1.05):0,spread=melting?ease((t-1.7)/1.15):0;
const gold=melting&&spread>=1;root.dataset.gold=String(gold);const textForge=melting?ease((t-1.9)/.95):0;stops.children[selected]?.querySelector('.value').style.setProperty('--forge',(textForge*100).toFixed(2)+'%');
const left=8,right=width-8,trackW=right-left,b=height-18,fx=width/2,base=b-26,ratio=position/last();
ctx.clearRect(0,0,width,height);smoothRect(left,b-3,trackW,6,'track');smoothRect(left,b-3,Math.max(3,trackW*ratio),6,'fill');
for(let i=0;i<names.length;i++)pixel(left+trackW*i/last()-1,b+8,2,3,'track');
const flameSize=melting?78*(.4+.6*ease(t/.5)):Math.max(0,heat*65);
const fade=melting?1-clamp((t-1.75)/.7):1,frame=active?Math.floor(now/80):0;
flame(fx,base-7,flameSize,frame,fade);
if(melt<1)pile(fx,base,melt);
if(melt>0&&spread<1){pixel(fx-29,base,58,4,'gold');smoothRect(fx-9,base+3,5,(b-base)*clamp(melt*1.4),'gold');smoothRect(fx+9,base+3,3,(b-base)*melt,'gold-hi');}
if(spread>0){const gx=mix(fx,left,spread),end=mix(fx,right,spread);smoothRect(gx,b-4,end-gx,8,'gold');smoothRect(gx,b-4,end-gx,2,'gold-hi');smoothRect(gx,b+2,end-gx,2,'gold-shadow');if(t>2.9&&t<3.5&&!quiet){const shine=left+trackW*clamp((t-2.9)/.6);smoothRect(shine,b-4,5,8,'gold-hi');}}
if(active&&heat>.15&&!gold){for(let i=0;i<Math.ceil(heat*10);i++){const p=(now/1700+i*.173)%1,x=fx+Math.sin(i*9.3+p*3)*(12+heat*18),y=base-8-p*(height-35);if(y>5&&p>.15&&p<.8){ctx.globalAlpha=(1-p)*.75;pixel(x,y,2,2,i%2?'gold-hi':'fire');}}ctx.globalAlpha=1;}
thumb.style.left=(left+trackW*ratio)+'px';
if(!quiet&&(active||position!==target||Math.abs(heat-wantedHeat)>.002||(melting&&t<3.6)))raf=requestAnimationFrame(draw);
}
function resize(){const box=canvas.getBoundingClientRect();if(!box.width)return;width=box.width;height=box.height;const dpr=devicePixelRatio||1;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);palette();wake();}
function openPanel(open){panel.hidden=!open;trigger.setAttribute('aria-expanded',String(open));if(open)resize();}
range.addEventListener('pointerdown',()=>{dragging=true;meltStart=null;wake();});
range.addEventListener('input',()=>{target=Number(range.value);selected=Math.round(target);if(ultracode.checked&&selected!==3)ultracode.checked=false;meltStart=null;announce();wake();});
function release(){if(!dragging)return;dragging=false;choose(Math.round(target));}
window.addEventListener('pointerup',release);window.addEventListener('pointercancel',release);
range.addEventListener('change',()=>{if(!dragging)choose(Math.round(Number(range.value)));});
range.addEventListener('keydown',event=>{const keys=['ArrowRight','ArrowUp','ArrowLeft','ArrowDown','Home','End','PageUp','PageDown'];if(!keys.includes(event.key))return;event.preventDefault();dragging=false;const up=['ArrowRight','ArrowUp','PageUp'].includes(event.key);choose(event.key==='Home'?0:event.key==='End'?last():selected+(up?1:-1));});
provider.addEventListener('change',()=>{names=catalogs[provider.value];root.dataset.provider=provider.value;document.querySelector('.claude-options').hidden=provider.value!=='claude';ultracode.checked=false;ultrathink.checked=false;meltStart=null;selected=1;target=position=1;range.max=last();range.value=1;buildStops();openPanel(true);announce();resize();});
function buildStops(){stops.replaceChildren();names.forEach((name,i)=>{const button=document.createElement('button');button.type='button';button.dataset.level=name;const wrap=document.createElement('span');wrap.className='label-wrap';const word=document.createElement('span');word.className='value';word.setAttribute('aria-hidden','true');for(const character of name){const glyph=document.createElement('span');glyph.className='glyph';glyph.textContent=character;word.append(glyph);}const pixels=document.createElement('span');pixels.className='label-pixels';pixels.setAttribute('aria-hidden','true');wrap.append(word,pixels);button.append(wrap);button.setAttribute('aria-label',name+' effort');button.setAttribute('aria-pressed',String(i===selected));button.addEventListener('click',()=>choose(i));stops.append(button);});}
ultracode.addEventListener('change',()=>{if(ultracode.checked){savedEffort=selected;choose(3);}else choose(savedEffort);});
ultrathink.addEventListener('change',()=>{announce();wake();});
document.querySelector('.replay').addEventListener('click',()=>{ultracode.checked=false;openPanel(true);choose(last(),{replay:true});});
trigger.addEventListener('click',()=>{openPanel(panel.hidden);if(!panel.hidden)range.focus();});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!panel.hidden){openPanel(false);trigger.focus();}});
document.addEventListener('pointerdown',event=>{if(!panel.hidden&&!panel.contains(event.target)&&!trigger.contains(event.target)&&!event.target.closest('.controls,.appearance,select'))openPanel(false);});
document.querySelector('.appearance').addEventListener('click',event=>{const light=document.documentElement.style.colorScheme!=='light';document.documentElement.style.colorScheme=light?'light':'dark';event.currentTarget.textContent=light?'Dark':'Light';event.currentTarget.setAttribute('aria-label','Switch to '+(light?'dark':'light')+' appearance');palette();wake();});
new ResizeObserver(resize).observe(document.querySelector('.drawing'));
reduced.addEventListener('change',()=>{settleLabelMotion();wake();});buildStops();announce();resize();
})();
</script>
</body>
</html>
