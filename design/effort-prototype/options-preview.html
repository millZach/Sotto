  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

#effort-lab{--tt-room:light-dark(#f8f8fa,#151619);--tt-surface:light-dark(#fff,#1d1e22);--tt-text:light-dark(#202127,#eeeef1);--tt-muted:light-dark(#62646d,#a4a5af);--tt-border:light-dark(#dcdde2,#393a42);--tt-track:light-dark(#dcdee5,#41434e);--tt-fill:light-dark(#676c84,#b7b9ce);--tt-gold:#dba63c;--tt-gold-hi:#ffe59c;--tt-gold-shadow:#966220;--tt-fire:#ed652d;--tt-fire-hi:#ffb844;--tt-fire-core:#ffebaa;font-family:EffortFigtree,Figtree,system-ui,sans-serif;color:var(--tt-text);width:100%;line-height:1.4}
#effort-lab *{box-sizing:border-box}
#effort-lab button,#effort-lab input{font:inherit}
#effort-lab .el-stage{position:relative;background:var(--tt-room);border:1px solid var(--tt-border);border-radius:16px;padding:24px;min-height:340px;display:flex;flex-direction:column;justify-content:flex-end}
#effort-lab .el-context{font-size:14px;color:var(--tt-muted);position:absolute;top:22px;left:24px}
#effort-lab .el-composer{position:relative;background:var(--tt-surface);border:1px solid var(--tt-border);border-radius:18px;padding:18px}
#effort-lab .el-prompt{font-size:16px;margin:0 0 18px;color:var(--tt-muted)}
#effort-lab .el-footer{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
#effort-lab .el-chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:14px;color:var(--tt-muted);border:1px solid var(--tt-border);padding:4px 10px;border-radius:24px;background:transparent;min-height:30px}
#effort-lab .el-model{align-self:flex-end;margin-bottom:3px}
#effort-lab .el-permission{font-size:12px;color:var(--tt-muted);margin-top:14px}
#effort-lab .el-send{margin-left:auto;background:var(--tt-text);color:var(--tt-surface);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:20px;align-self:flex-end;margin-bottom:2px}
#effort-lab .el-control{width:264px;max-width:100%;position:relative}
#effort-lab .el-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;position:relative;z-index:1}
#effort-lab .el-heading label{color:var(--tt-muted)}
#effort-lab .el-value{font-weight:500}
#effort-lab .el-drawing{position:relative;height:78px}
#effort-lab canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#effort-lab .el-range{position:absolute;bottom:0;left:0;width:100%;height:32px;margin:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:ew-resize;accent-color:var(--tt-fill)}
#effort-lab .el-range::-webkit-slider-runnable-track{height:8px;background:transparent}
#effort-lab .el-range::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:14px;height:18px;border-radius:4px;background:var(--tt-text);border:2px solid var(--tt-surface);margin-top:-5px;box-shadow:0 0 0 1px var(--tt-border)}
#effort-lab .el-range::-moz-range-track{height:8px;background:transparent}
#effort-lab .el-range::-moz-range-thumb{width:12px;height:16px;border-radius:4px;background:var(--tt-text);border:2px solid var(--tt-surface)}
#effort-lab[data-gold=&#x27;true&#x27;] .el-range::-webkit-slider-thumb{background:var(--tt-gold-hi);border-color:var(--tt-gold-shadow)}
#effort-lab .el-ticks{display:flex;justify-content:space-between;color:var(--tt-muted);font-size:12px;margin-top:2px}
#effort-lab .el-trigger{display:none}
#effort-lab .el-switcher{display:flex;gap:8px;align-items:center;justify-content:center;margin:16px auto 0;flex-wrap:wrap}
