/* Settings → Providers: one card with a row per provider, each opening in place (variant A of the tag
   prototype/providers-settings). The card and its 2px inset dividers follow ADR-0110; the list measures its own width. */
.providers-settings { min-width: 0; container: providers / inline-size; }
.providers-list { margin: 6px 0 0; padding: 0; list-style: none; border-radius: var(--tt-radius-lg); background: var(--tt-card); overflow: hidden; }
.provider-row + .provider-row { border-top: 2px solid var(--tt-card-inset); }

/* The header: the disclosure button, the update, the switch. The button lays its name, status and version out on
   one line; below 600 pixels the status and version go under the name. */
.provider-row__head { display: grid; grid-template-columns: minmax(0, 1fr) 150px auto; align-items: center; column-gap: 10px; padding-right: 16px; transition: background 160ms ease; }
.provider-row__head:has(.provider-row__trigger:hover) { background: color-mix(in srgb, var(--tt-accent-surface) 30%, var(--tt-card)); }
.provider-row__trigger { display: grid; grid-template-columns: 16px 28px minmax(0, 1fr) 132px 64px; align-items: center; column-gap: 12px; min-width: 0; min-height: 62px; padding: 12px 8px 12px 14px; border: 0; border-radius: 0; background: transparent; color: var(--tt-text); font: inherit; text-align: left; }
.provider-row__trigger:focus-visible { outline: 2px solid var(--tt-focus-ring); outline-offset: -2px; border-radius: var(--tt-radius-lg); }
.provider-row__chevron { color: var(--tt-text-muted); transition: transform 160ms ease; }
.provider-row[data-open='true'] .provider-row__chevron { transform: rotate(90deg); }
.provider-row__name, .provider-row__meta { display: contents; }
.provider-row__name strong { min-width: 0; overflow: hidden; font-size: var(--tt-type-reading); font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
.provider-row__status { display: inline-flex; align-items: center; gap: 6px; min-width: 0; color: var(--tt-text-muted); font-size: var(--tt-type-caption); white-space: nowrap; }
.provider-row__status i { width: 6px; height: 6px; flex: none; border-radius: 50%; background: currentColor; }
.provider-row__status:is([data-status='connected'], [data-status='busy']) { color: var(--tt-accent-text); }
.provider-row__status[data-status='error'] { color: var(--tt-error-text); }
.provider-row__status[data-status='busy'] i { animation: provider-busy 1s ease-in-out infinite; }
.provider-row__version { min-width: 0; overflow: hidden; color: var(--tt-text-muted); font-size: var(--tt-type-caption); font-variant-numeric: tabular-nums; text-overflow: ellipsis; white-space: nowrap; }

/* A provider's mark on a badge in its own colour, the glyph in the shared ink, so every mark reads in both modes. */
.provider-badge { display: grid; place-items: center; width: 28px; height: 28px; flex: none; border-radius: var(--tt-radius-row); background: var(--provider-badge, var(--tt-card-inset)); color: var(--tt-provider-ink); }
.provider-badge .provider-mark { width: 17px; height: 17px; fill: currentColor; }
.provider-badge[data-provider='codex'] { --provider-badge: var(--tt-provider-codex); }
.provider-badge[data-provider='claude'] { --provider-badge: var(--tt-provider-claude); }
.provider-badge[data-provider='grok'] { --provider-badge: var(--tt-provider-grok); }
.provider-badge[data-provider='devin'] { --provider-badge: var(--tt-provider-devin); }
.provider-badge[data-provider='muse'] { --provider-badge: var(--tt-provider-muse); }
.provider-badge[data-provider='opencode'] { --provider-badge: var(--tt-provider-opencode-badge); }
.provider-badge[data-provider='cursor'] { --provider-badge: var(--tt-provider-cursor-badge); }
.provider-badge[data-provider='deepseek'] { --provider-badge: var(--tt-provider-deepseek-badge); }

/* Update to <version>: a filled chip in the selected card's colour, beside the switch while an update is offered. */
.provider-row__update { justify-self: end; display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 28px; padding: 0 10px; border: 0; border-radius: var(--tt-radius-tag); background: var(--tt-card-selected); color: var(--tt-accent-text); font: inherit; font-size: var(--tt-type-caption); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: box-shadow 120ms ease, opacity 120ms ease; }
.provider-row__update > svg { flex: none; }
.provider-row__update:hover:not(:disabled) { box-shadow: inset 0 0 0 1px var(--tt-accent-border); }
.provider-row__update:disabled { cursor: default; opacity: .7; }
.provider-row__update:focus-visible { outline: 2px solid var(--tt-focus-ring); outline-offset: 2px; }
.provider-row__head .tt-toggle { justify-self: end; width: auto; grid-template-columns: 36px; gap: 0; padding: 7px 0; }
.provider-row__head .tt-toggle__copy { display: none; }

/* A provider's error stays under its header whether the row is open or closed. */
.provider-row__error { margin: -4px 20px 14px 84px; color: var(--tt-error-text); font-size: var(--tt-type-small); line-height: 1.5; overflow-wrap: anywhere; }

/* The open row: its connection, models and client, set in from the name. */
.provider-row__panel { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px 36px; padding: 4px 22px 22px 84px; animation: provider-arrive 160ms ease both; }
.provider-row__column { display: grid; align-content: start; gap: 20px; min-width: 0; }
.provider-row__column h4 { margin: 0 0 6px; color: var(--tt-text); font-size: var(--tt-type-body); font-weight: 600; }
.provider-row__column p:not(.provider-detail__error) { margin: 0; max-width: 36em; color: var(--tt-text-muted); font-size: var(--tt-type-body); line-height: 1.6; overflow-wrap: anywhere; }
.provider-connection, .provider-client { display: grid; gap: 12px; min-width: 0; }
.provider-client__actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; max-width: 100%; }
/* What a saved change still owes the running client, such as Muse's shell sandbox before a reconnect. */
.provider-row__column .provider-client__owed { margin-top: 8px; color: var(--tt-text); }
.provider-client__actions .tt-toggle { width: auto; grid-template-columns: 36px; gap: 0; padding: 7px 0; }
.provider-client__actions .tt-toggle__copy { display: none; }
/* Ultracode's effort (ADR-0148): a list as wide as its longest level, not the column. */
.provider-client__actions .provider-client__select { width: auto; min-width: 200px; max-width: 100%; }
/* Cursor's connection (ADR-0128, variant A of its prototype): what to do next in the text colour and, while a sign-in
   waits on cursor.com, a live line whose dot pulses as a busy status's does. Its refusals sit under its words. */
.provider-row__column p.provider-connection__lead, .provider-row__column p.provider-connection__notice { color: var(--tt-text); }
.provider-row__column p.provider-connection__waiting { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.provider-row__column p.provider-connection__notice { margin-top: 10px; }
.provider-connection__waiting i { width: 6px; height: 6px; flex: none; border-radius: 50%; background: var(--tt-accent-text); animation: provider-busy 1s ease-in-out infinite; }
.provider-connection .provider-detail__error { margin-top: 14px; }
.provider-login { display: flex; align-items: center; flex-wrap: wrap; gap: 3px 8px; margin-top: 9px; }
.provider-login code { color: var(--tt-text); font: var(--tt-type-small)/1.6 var(--tt-font-mono); user-select: text; }
.provider-login .tt-button { min-height: 32px; padding: 5px 8px; font-size: var(--tt-type-small); }
.provider-support, .provider-client__steps { color: var(--tt-text-muted); font-size: var(--tt-type-body); line-height: 1.6; }
.provider-support summary, .provider-client__steps summary { width: fit-content; max-width: 100%; color: var(--tt-text); }
.provider-support summary:focus-visible, .provider-client__steps summary:focus-visible { outline: 2px solid var(--tt-focus-ring); outline-offset: 3px; }
.provider-row__column :is(.provider-support, .provider-client__steps) p { margin: 10px 0 0; }
.provider-client__steps code { display: block; padding: 8px 10px; margin-top: 8px; border: 1px solid var(--tt-code-border); border-radius: var(--tt-radius-sm); background: var(--tt-code-bg); color: var(--tt-code-text); font: var(--tt-type-caption)/1.6 var(--tt-font-mono); white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
.provider-client__steps .tt-button { margin-top: 10px; }
.provider-row__column .oc-sources { margin-top: 0; padding: 16px 0; border-color: var(--tt-card-inset); border-width: 2px 0; }
/* A provider's models: a small field naming how many, which opens a searchable list over it (ProviderModelList). */
.provider-model-list { flex: none; }
.provider-model-list__trigger { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 6px 10px 6px 12px; border: 1px solid var(--tt-field-border); border-radius: var(--tt-radius-control); background: var(--tt-field); color: var(--tt-text); font: inherit; font-size: var(--tt-type-small); white-space: nowrap; transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease; }
.provider-model-list__trigger:hover { background: var(--tt-hover); }
.provider-model-list__trigger:active:not(:disabled) { background: var(--tt-hover-strong); }
.provider-model-list__trigger[aria-expanded='true'] { border-color: var(--tt-accent); }
.provider-model-list__trigger:focus-visible { outline: 2px solid var(--tt-focus-ring); outline-offset: 2px; }
.provider-model-list__trigger svg { color: var(--tt-text-muted); }
.provider-model-list__models, .provider-model-list__models > section { background: inherit; }
.provider-model-list__models:focus-visible { outline: 2px solid var(--tt-focus-ring); outline-offset: -2px; }
.provider-model-list__models ul { margin: 0; padding: 0; list-style: none; }
.provider-model-list__models li { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 32px; padding: 6px 10px; border-radius: var(--tt-radius-row); color: var(--tt-text); font-size: var(--tt-type-small); }
.provider-model-list__models li:hover, .provider-model-list__models li:focus-visible { background: var(--tt-hover); outline: 0; }
.provider-model-list__models li > span:first-child { display: grid; gap: 2px; min-width: 0; }
.provider-model-list__models li b { font-weight: 500; overflow-wrap: anywhere; }
.provider-model-list__models li small { color: var(--tt-text-muted); font-size: var(--tt-type-caption); }
.provider-model-list__tag { flex: none; padding: 1px 7px; border: 1px solid var(--tt-accent-border); border-radius: var(--tt-radius-tag); background: var(--tt-surface-sunken); color: var(--tt-accent-text); font-size: var(--tt-type-micro); white-space: nowrap; }
.provider-models__empty { color: var(--tt-text-muted); font-size: var(--tt-type-body); line-height: 1.6; }
/* A refusal inside OpenCode's model sources and its sign-in dialog. */
.provider-detail__error { margin: 22px 0 0; padding: 12px 14px; border-radius: var(--tt-radius-sm); background: var(--tt-error-contrast); color: var(--tt-error); font-size: var(--tt-type-body); line-height: 1.6; overflow-wrap: anywhere; }

.providers-note { margin: 14px 2px 0; color: var(--tt-text-muted); font-size: var(--tt-type-small); line-height: 1.5; }
.providers-updates { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--tt-hairline); }
.providers-updates h4 { margin: 0 0 4px; color: var(--tt-text); font-size: var(--tt-type-body); font-weight: 600; }
.providers-updates p { margin: 0; max-width: 44em; color: var(--tt-text-muted); font-size: var(--tt-type-small); line-height: 1.6; }
.providers-updates .tt-toggle { flex: none; width: auto; grid-template-columns: 36px; gap: 0; }
.providers-updates .tt-toggle__copy { display: none; }

@container providers (width < 600px) {
  .provider-row__head { grid-template-columns: minmax(0, 1fr) auto auto; }
  .provider-row__trigger { grid-template-columns: 16px 28px minmax(0, 1fr); }
  .provider-row__name { display: grid; gap: 3px; min-width: 0; }
  .provider-row__meta { display: flex; align-items: center; gap: 10px; min-width: 0; }
}
@container providers (width < 430px) {
  .provider-row__head { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: 'trigger toggle' 'update update'; padding-right: 12px; }
  .provider-row__trigger { grid-area: trigger; padding-left: 10px; column-gap: 10px; }
  .provider-row__head .tt-toggle { grid-area: toggle; }
  .provider-row__update-slot { display: none; }
  /* With an update offered, the switch drops beside the chip so the eye and Tab both go name, update, switch. */
  .provider-row__head:has(.provider-row__update) { grid-template-areas: 'trigger trigger' 'update toggle'; }
  .provider-row__head:has(.provider-row__update) .tt-toggle { margin: -6px 0 12px; }
  .provider-row__update { grid-area: update; justify-self: start; margin: -6px 0 12px 76px; }
  .provider-row__error { margin-left: 76px; margin-right: 14px; }
  .provider-row__panel { padding: 4px 14px 18px; }
}
@keyframes provider-arrive { from { opacity: .4; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
@keyframes provider-busy { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) {
  .provider-row__panel, .provider-row__status[data-status='busy'] i, .provider-connection__waiting i { animation: none; }
  .provider-row__head, .provider-row__chevron { transition: none; }
}
[data-reduced-motion='on'] :is(.provider-row__panel, .provider-row__status[data-status='busy'] i, .provider-connection__waiting i) { animation: none; }
[data-reduced-motion='on'] :is(.provider-row__head, .provider-row__chevron) { transition: none; }

/* Copied from src/renderer/src/agents/modelPicker.css */
/* The model control: a chip (threadChips.css) carrying the provider's mark, and the menu it opens. */
.model-picker { min-width: 0; }
.model-picker__trigger { color: var(--tt-text-2); }
.model-picker__trigger .provider-mark[data-provider='codex'], .model-picker__rail .provider-mark[data-provider='codex'] { color: var(--tt-provider-codex); }
.model-picker__trigger .provider-mark[data-provider='claude'], .model-picker__rail .provider-mark[data-provider='claude'] { color: var(--tt-provider-claude); }
.model-picker__trigger .provider-mark[data-provider='grok'], .model-picker__rail .provider-mark[data-provider='grok'] { color: var(--tt-provider-grok); }
.model-picker__trigger .provider-mark[data-provider='devin'], .model-picker__rail .provider-mark[data-provider='devin'] { color: var(--tt-provider-devin); }
.model-picker__trigger .provider-mark[data-provider='opencode'], .model-picker__rail .provider-mark[data-provider='opencode'] { color: var(--tt-provider-opencode); }
.model-picker__trigger .provider-mark[data-provider='cursor'], .model-picker__rail .provider-mark[data-provider='cursor'] { color: var(--tt-provider-cursor); }

/* Where the model control is a named field rather than a chip: the New thread dialog. */
.thread-options__model { display: grid; gap: 5px; min-width: 0; }
.thread-options__model > span { color: var(--tt-text-muted); font-size: var(--tt-type-micro); }
.new-thread-dialog .thread-options__model { grid-column: 1 / -1; }
.new-thread-dialog .model-picker__trigger { justify-content: space-between; width: 100%; max-width: none; height: auto; min-height: 39px; padding: 8px 11px; border-radius: var(--tt-radius-control); background: var(--tt-field); font-size: var(--tt-type-small); }
.new-thread-dialog .model-picker__trigger > span:not(.provider-mark) { flex: 1; text-align: left; }

/* The model menu: a provider rail, then a search line over the list with one note under it. Anchored over
   the chip. Two columns whenever more than one provider can be chosen; one when the thread is settled. Its one row
   takes no more than the menu's height, so a long list scrolls inside it and the note under it stays in view. With the
   rail it keeps that full height, so choosing another provider does not resize the menu under the pointer. */
.model-picker__dialog { position: fixed; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); width: min(300px, calc(100vw - 32px)); max-height: min(380px, calc(100vh - 32px)); margin: 0; padding: 0; overflow: hidden; border: 1px solid var(--tt-field-border); border-radius: var(--tt-radius-card); background: var(--tt-surface-elevated); color: var(--tt-text); box-shadow: 0 16px 48px var(--tt-shadow-color); }
.model-picker__dialog[data-rail] { grid-template-columns: 52px minmax(0, 1fr); width: min(336px, calc(100vw - 32px)); height: min(380px, calc(100vh - 32px)); }
/* The menu goes straight to the place it is given. Reduced motion gives every property a 1ms transition (global.css),
   which a window in the background never finishes, and that left the menu over the chip after a step changed its height. */
.model-picker__dialog { transition: none; }
.model-picker__dialog::backdrop { background: transparent; }
/* Dynamic's switch at the menu's foot (ADR-0191), on a row of its own under the rail and the list. */
.model-picker__dialog:has(> .model-picker__foot) { grid-template-rows: minmax(0, 1fr) auto; }
.model-picker__foot { grid-column: 1 / -1; padding: 6px 12px 6px 16px; border-top: 1px solid var(--tt-hairline); }
/* Align with the model names, beyond the provider rail. The provider note remains part of the list,
   but gives up its own divider when this foot follows it. */
.model-picker__dialog[data-rail] > .model-picker__foot { padding-left: 68px; }
.model-picker__dialog:has(> .model-picker__foot) .model-picker__note { border-top: 0; padding-bottom: 8px; }
/* The shared toggle's copy lays out as two grid items only while the turn fixes the switch. */
.model-picker__foot .tt-toggle { grid-template-columns: minmax(0, 1fr) 36px; align-items: center; gap: 2px 8px; min-height: 26px; padding: 0; color: var(--tt-text); }
.model-picker__foot .tt-toggle__copy { display: contents; }
.model-picker__foot .tt-toggle__copy > strong { grid-column: 1; grid-row: 1; line-height: 26px; font-size: var(--tt-type-small); font-weight: 400; }
.model-picker__foot .tt-toggle__copy > .tt-field__description { grid-column: 1 / -1; grid-row: 2; margin: 0; color: var(--tt-text-muted); font-size: var(--tt-type-caption); line-height: 1.4; }
.model-picker__foot .tt-toggle__track { grid-column: 2; grid-row: 1; justify-self: center; width: 30px; height: 18px; margin: 0; border-radius: var(--tt-radius-control); }
.model-picker__foot .tt-toggle__thumb { width: 12px; height: 12px; border-radius: var(--tt-radius-tag); }
.model-picker__foot .tt-toggle[aria-checked='true'] .tt-toggle__track { background: var(--tt-accent-wash); border-color: var(--tt-accent-border); }
.model-picker__foot .tt-toggle[aria-checked='true'] .tt-toggle__thumb { background: var(--tt-accent); transform: translateX(12px); }
.model-picker__foot .tt-toggle:active:not(:disabled) .tt-toggle__thumb { width: 12px; }
.model-picker__suffix { color: var(--tt-accent-text); white-space: nowrap; }
.model-picker__panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
/* Marks only: a provider costs the same here whatever it is called, which is what the tabs could not do.
   The chosen tile is filled and keeps an accent edge, so the choice does not rest on hue alone. */
.model-picker__rail { display: flex; flex-direction: column; gap: 4px; padding: 8px 6px; border-right: 1px solid var(--tt-hairline); background: var(--tt-surface); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.model-picker__rail > button { position: relative; display: grid; place-items: center; flex: none; width: 40px; height: 40px; border: 0; border-radius: var(--tt-radius-inset); background: transparent; color: var(--tt-text-muted); transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease; }
.model-picker__rail > button .provider-mark { opacity: .75; }
.model-picker__rail > button:hover { background: var(--tt-hover); }
.model-picker__rail > button:active:not(:disabled):not([aria-selected='true']) { background: var(--tt-hover-strong); }
.model-picker__rail > button:hover .provider-mark, .model-picker__rail > button[aria-selected='true'] .provider-mark { opacity: 1; }
.model-picker__rail > button[aria-selected='true'] { background: var(--tt-selected); }
.model-picker__rail > button[aria-selected='true']::before { content: ''; position: absolute; left: -6px; top: 10px; bottom: 10px; width: 2px; border-radius: 0 var(--tt-radius-mark) var(--tt-radius-mark) 0; background: var(--tt-activity); }
.model-picker__search { display: flex; flex: none; align-items: center; gap: 8px; height: 40px; padding: 0 8px 0 12px; border-bottom: 1px solid var(--tt-hairline); color: var(--tt-text-muted); }
.model-picker__dialog .model-picker__search input { flex: 1; min-width: 0; width: auto; min-height: 0; padding: 4px 0; border: 0; border-radius: 0; outline: 0; background: transparent; color: var(--tt-text); font: inherit; font-size: var(--tt-type-small); }
.model-picker__dialog .model-picker__search input:focus-visible { outline: 2px solid var(--tt-focus-ring); outline-offset: 2px; border-radius: var(--tt-radius-mark); }
.model-picker__search input::placeholder { color: var(--tt-text-faint); }
.model-picker__search > button { display: grid; place-items: center; width: 28px; height: 28px; min-height: 28px; padding: 0; border: 0; border-radius: var(--tt-radius-control); background: transparent; color: var(--tt-text-muted); transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease; }
.model-picker__search > button:hover { background: var(--tt-hover); color: var(--tt-text); }
.model-picker__search > button:active:not(:disabled) { background: var(--tt-hover-strong); color: var(--tt-text); }
.model-picker__models { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 6px; scrollbar-width: thin; scrollbar-color: var(--tt-scrollbar) transparent; }
.model-picker__models [role='option'] { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 32px; padding: 6px 10px; border: 0; border-radius: var(--tt-radius-row); background: transparent; color: var(--tt-text-2); font: inherit; font-size: var(--tt-type-small); text-align: left; }
.model-picker__models [role='option']:hover:not(:disabled), .model-picker__models [role='option']:focus-visible { background: var(--tt-hover); color: var(--tt-text); outline: 0; }
.model-picker__models [role='option']:focus-visible { box-shadow: inset 0 0 0 2px var(--tt-focus-ring); }
.model-picker__models [role='option'][aria-selected='true'] { color: var(--tt-activity); }
.model-picker__models [role='option']:disabled { opacity: .45; cursor: default; }
.model-picker__models [role='option'] > span { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.model-picker__models [role='option'] > span > small { color: var(--tt-text-muted); font-size: var(--tt-type-caption); }
.model-picker__empty { margin: 0; padding: 12px 10px; color: var(--tt-text-muted); font-size: var(--tt-type-small); }
/* Over another provider's models where picking one starts a new thread there (ADR-0089). */
.model-picker__heading { flex: none; margin: 0; padding: 9px 16px 0; color: var(--tt-text-2); font-size: var(--tt-type-caption); font-weight: 600; }
.model-picker__note { flex: none; margin: 0; padding: 8px 12px 10px; border-top: 1px solid var(--tt-hairline); color: var(--tt-text-muted); font-size: var(--tt-type-caption); line-height: 1.4; }

/* A provider with several model sources (OpenCode, ADR-0087). The chip names the source before the model, the way it
   was reached; it asks for more room than other chips, and the source gives way first, down to a floor, so a narrow
   composer keeps the model's name whole. */
.model-picker__trigger[data-source] { max-width: 320px; }
.model-picker__path { display: flex; align-items: baseline; gap: 4px; min-width: 0; }
/* The source gives way first: a long one (ModelPicker's LONG_SOURCE) down to a 4.5em floor, a short one not at all. The
   model's name shrinks only after that, since a flex item that reaches its minimum leaves the rest of the shortfall to
   the others; its tiny shrink factor keeps it from losing a fraction of a pixel, and an ellipsis, while the source still can. */
.model-picker__source, .model-picker__name { overflow: hidden; text-overflow: ellipsis; }
.model-picker__source { flex: none; color: var(--tt-text-muted); }
.model-picker__source[data-long] { flex: 0 1 auto; min-width: 4.5em; }
.model-picker__separator { flex: none; color: var(--tt-text-muted); }
.model-picker__name { flex: 0 .000001 auto; min-width: 0; }
.model-picker__trigger:hover:not(:disabled) .model-picker__source, .model-picker__trigger[aria-expanded='true'] .model-picker__source { color: var(--tt-text-2); }
/* The first step: one row per model source, its name over its model count. The one holding the chosen model wears the accent. */
.model-picker__sources > button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 7px 8px 7px 10px; border: 0; border-radius: var(--tt-radius-row); background: transparent; color: var(--tt-text-2); font: inherit; text-align: left; }
.model-picker__sources > button:hover, .model-picker__sources > button:focus-visible { background: var(--tt-hover); color: var(--tt-text); outline: 0; }
.model-picker__sources > button:focus-visible { box-shadow: inset 0 0 0 2px var(--tt-focus-ring); }
.model-picker__sources > button > span { display: grid; flex: 1; gap: 1px; min-width: 0; }
.model-picker__sources > button b { overflow: hidden; font-size: var(--tt-type-small); font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.model-picker__sources > button small { overflow: hidden; color: var(--tt-text-muted); font-size: var(--tt-type-caption); text-overflow: ellipsis; white-space: nowrap; }
.model-picker__sources > button:hover small, .model-picker__sources > button:focus-visible small { color: var(--tt-text-2); }
.model-picker__sources > button[aria-current='true'] b { color: var(--tt-activity); }
.model-picker__sources > button > svg { flex: none; color: var(--tt-text-muted); }
/* Inside one source: a back control, the source's name and its count. */
.model-picker__step { display: flex; flex: none; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 4px; border-bottom: 1px solid var(--tt-hairline); }
.model-picker__step > button { display: inline-flex; flex: none; align-items: center; gap: 2px; height: 28px; min-height: 28px; padding: 0 8px 0 4px; border: 0; border-radius: var(--tt-radius-control); background: transparent; color: var(--tt-text-muted); font: inherit; font-size: var(--tt-type-caption); transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease; }
.model-picker__step > button:hover { background: var(--tt-hover); color: var(--tt-text); }
.model-picker__step > button:active:not(:disabled) { background: var(--tt-hover-strong); color: var(--tt-text); }
.model-picker__step > b { min-width: 0; overflow: hidden; font-size: var(--tt-type-small); font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
.model-picker__step > span { flex: none; margin-left: auto; color: var(--tt-text-muted); font-size: var(--tt-type-caption); }
/* Searching every source at once: the matches under small source headings that stay put while their group scrolls. */
.model-picker__count { flex: none; color: var(--tt-text-muted); font-size: var(--tt-type-caption); }
.model-picker__models--grouped { padding-top: 0; }
/* A heading carries the menu's own surface down to it (glass.css decides what that is), so rows pass under it unseen. */
.model-picker__dialog:has(.model-picker__group) .model-picker__panel, .model-picker__models--grouped, .model-picker__models--grouped > [role='group'] { background: inherit; }
.model-picker__group { position: sticky; top: 0; z-index: 1; display: flex; align-items: baseline; gap: 8px; margin: 0 -6px; padding: 10px 16px 4px; background: inherit; color: var(--tt-text-muted); font-size: var(--tt-type-caption); font-weight: 600; }
.model-picker__group > span { margin-left: auto; font-size: var(--tt-type-caption); font-weight: 500; }
/* Legacy (ADR-0171): a closed row under a Claude Code or Codex list that opens the older models of each line beneath it. */
.model-picker__legacy { display: flex; align-items: center; gap: 6px; width: 100%; min-height: 32px; margin-top: 4px; padding: 6px 10px; border: 0; border-top: 1px solid var(--tt-hairline); border-radius: 0; background: transparent; color: var(--tt-text-muted); font: inherit; font-size: var(--tt-type-small); text-align: left; }
.model-picker__legacy:hover, .model-picker__legacy:focus-visible { background: var(--tt-hover); color: var(--tt-text); outline: 0; }
.model-picker__legacy:focus-visible { box-shadow: inset 0 0 0 2px var(--tt-focus-ring); }
.model-picker__legacy > span { margin-left: auto; color: var(--tt-text-muted); font-size: var(--tt-type-caption); }

/* Favorites (ADR-0147): a star tile heads the rail, and a star ends each model row. The star shows on a row the pointer or
   focus is on, and always where it is filled; a favorite carries its provider's mark before its name. */
.model-picker__rail > .model-picker__favorites-tile { color: var(--tt-text-2); }
.model-picker__rail > .model-picker__favorites-tile[aria-selected='true'] { color: var(--tt-activity); }
.model-picker__models [role='option'] > span:first-child { flex: 1; }
.model-picker__models [role='option'][data-favorite] > span:first-child { align-items: center; }
.model-picker__models [role='option'][aria-disabled='true'] { opacity: .45; cursor: default; }
.model-picker__models [role='option'][aria-disabled='true']:hover { background: transparent; color: var(--tt-text-2); }
.model-picker__models [role='option'] > .model-picker__star { display: grid; flex: none; place-items: center; width: 22px; height: 22px; margin: -3px -6px -3px 0; border-radius: var(--tt-radius-control); color: var(--tt-text-muted); visibility: hidden; transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease; }
.model-picker__models [role='option']:hover > .model-picker__star, .model-picker__models [role='option']:focus-visible > .model-picker__star, .model-picker__star[data-starred] { visibility: visible; }
.model-picker__models [role='option'] > .model-picker__star:hover { background: var(--tt-hover); color: var(--tt-text); }
.model-picker__models [role='option'] > .model-picker__star:active:not(:disabled) { background: var(--tt-hover-strong); color: var(--tt-text); }
.model-picker__star[data-starred] { color: var(--tt-activity); }

/* A card that describes the chip (a thread on one of the user's own servers: its speed, ADR-0124), above the chip once
   the pointer rests on it or the keyboard focus is on it, and never over its open menu. Pointer events pass through it,
   so it never stops the chip opening the menu. */
.model-picker:has(> .model-picker__card) { position: relative; }
.model-picker__card {
  position: absolute; bottom: calc(100% + 8px); left: 0; z-index: 6; min-width: 200px; max-width: min(300px, calc(100vw - 32px));
  padding: 10px 12px; border: 1px solid var(--tt-panel-border); border-radius: var(--tt-radius-card); background: var(--tt-surface-elevated);
  box-shadow: 0 8px 24px var(--tt-shadow-color); color: var(--tt-text-muted); font-size: var(--tt-type-caption); line-height: 1.4;
  visibility: hidden; opacity: 0; pointer-events: none;
}
.model-picker__card[data-shown] { visibility: visible; opacity: 1; }
.model-picker__card-name { margin: 0; color: var(--tt-text-2); overflow-wrap: anywhere; }
@media (prefers-reduced-motion: no-preference) {
  :root:not([data-reduced-motion='on']) .model-picker__card { transform: translateY(3px); transition: opacity 120ms ease, transform 120ms ease, visibility 0s linear 120ms; }
  :root:not([data-reduced-motion='on']) .model-picker__card[data-shown] { transform: none; transition-delay: 0s; }
}

/* Copied from src/renderer/src/agents/effortPicker.css */
/* The effort card (ADR-0019): the level word and its line, a pill track with the stops as dots and a round
   thumb, and the colourway's wash when the thread reaches the model's highest level. Every colour is a --tt-*
   token; the colourway's hues arrive through the --tt-effort-* tokens the root carries, so the card never
   branches on which colourway is chosen. */
.effort-card {
  --effort-x: 0;
  --effort-heat: 0;
  position: fixed;
  inset: auto;
  margin: 0;
  box-sizing: border-box;
  width: min(292px, calc(100vw - 24px));
  max-height: calc(100vh - 24px);
  overflow: auto;
  padding: 12px 14px;
  border: 1px solid var(--tt-field-border);
  border-radius: var(--tt-radius-card);
  background: var(--tt-surface-elevated);
  color: var(--tt-text);
  box-shadow: 0 16px 48px var(--tt-shadow-color);
  z-index: 60;
  font: inherit;
  transition: border-color 2400ms cubic-bezier(.2, .8, .2, 1);
}
.effort-card:popover-open { display: block; }
.effort-card[data-arriving='true'] { border-color: color-mix(in srgb, var(--tt-effort-border) 55%, var(--tt-field-border)); transition-duration: 200ms; }

/* Header: the word, and Default when the model reports one. */
.effort-card__head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; min-height: 20px; }
.effort-card__word { margin: 0; font-size: var(--tt-type-reading); font-weight: 600; line-height: 1.3; color: var(--tt-text); }
.effort-card__word > span { display: inline-block; }
.effort-card__word[data-top='true'] { color: var(--tt-effort-text-fill); background: var(--tt-effort-text-image); -webkit-background-clip: text; background-clip: text; }
.effort-card__word[data-unknown='true'] { color: var(--tt-text-muted); font-weight: 500; }
/* Ultracode's mark (ADR-0148): a workflow glyph before the word, in the word's own colour. */
.effort-card__mark { margin-right: 6px; vertical-align: -2px; }
/* At the highest level the word may be painted through a clipped gradient with a transparent fill (Rainbow), which would
   leave a currentColor stroke invisible, so the mark takes the colourway's ink itself. */
.effort-card__word[data-top='true'] .effort-card__mark { color: var(--tt-effort-text); }
.effort-card__default { flex: none; min-height: 24px; padding: 0 4px; border: 0; border-radius: var(--tt-radius-tag); background: transparent; color: var(--tt-text-muted); font: inherit; font-size: var(--tt-type-caption); transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, opacity 120ms ease; }
.effort-card__default:hover:not(:disabled) { color: var(--tt-text); background: var(--tt-hover); }
.effort-card__default:active:not(:disabled) { color: var(--tt-text); background: var(--tt-hover-strong); }
.effort-card__default:disabled { opacity: .5; cursor: default; }
.effort-card__line { margin: 1px 0 0; min-height: 18px; color: var(--tt-text-muted); font-size: var(--tt-type-caption); line-height: 1.45; }

/* The track: a 22px pill. The fill warms from the cool end toward the colourway as the level climbs, and the
   colourway's own gradient shows through near the top. Dots mark the stops; the thumb is a 26px disc. */
.effort-card__track { position: relative; height: 26px; margin: 12px 0 0; }
.effort-card__pill { position: absolute; left: 0; right: 0; top: 2px; height: 22px; border-radius: var(--tt-radius-mark); background: var(--tt-effort-track); overflow: hidden; }
.effort-card__fill { position: absolute; left: 0; top: 0; bottom: 0; width: calc(13px + var(--effort-x) * (100% - 26px)); border-radius: var(--tt-radius-mark); overflow: hidden;
  background: linear-gradient(90deg, color-mix(in srgb, var(--tt-effort-a) calc(30% + 50% * var(--effort-heat)), var(--tt-effort-fill-cool)), color-mix(in srgb, var(--tt-effort-b) calc(45% + 50% * var(--effort-heat)), var(--tt-effort-fill-cool))); }
.effort-card__fill::before { content: ''; position: absolute; inset: 0; background: var(--tt-effort-fill-image); opacity: calc(var(--effort-heat) * var(--effort-heat) * var(--effort-heat)); }
.effort-card__fill::after { content: ''; position: absolute; inset: 0; background: var(--tt-effort-fill-veil); }
.effort-card[data-unknown='true'] .effort-card__fill { opacity: .35; }
.effort-card__dot { position: absolute; top: 50%; left: calc(13px + var(--effort-stop) * (100% - 26px)); width: 4px; height: 4px; border-radius: 50%; background: var(--tt-effort-dot); transform: translate(-50%, -50%); }
.effort-card__dot[data-under='true'] { background: color-mix(in srgb, var(--tt-surface-elevated) 55%, var(--tt-effort-b)); }
.effort-card__thumb { position: absolute; top: 0; left: calc(13px + var(--effort-x) * (100% - 26px)); display: grid; place-items: center; width: 26px; height: 26px; border-radius: var(--tt-radius-mark); background: var(--tt-effort-thumb); color: light-dark(var(--tt-text), var(--tt-surface)); box-shadow: var(--tt-shadow-sm), 0 0 0 1px var(--tt-effort-thumb-edge); transform: translateX(-50%); pointer-events: none; }
.effort-card[data-unknown='true'] .effort-card__thumb { opacity: .45; }
.effort-card__track input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  appearance: none;
  background: transparent;
  border: 0;
  border-radius: var(--tt-radius-mark);
  outline: 0;
  cursor: ew-resize;
  touch-action: none;
}
.effort-card__track input::-webkit-slider-thumb { appearance: none; width: 26px; height: 26px; background: transparent; border: 0; }
.effort-card__track input[aria-disabled='true'] { cursor: default; }
.effort-card__track:has(input:focus-visible) .effort-card__thumb { box-shadow: var(--tt-shadow-sm), 0 0 0 2px var(--tt-surface-elevated), 0 0 0 4px var(--tt-focus-ring); }
/* The thumb's Ultracode mark takes the ink opposite the thumb: the thumb is the text colour in dark and the surface in light. */
/* What Ultracode costs, over its stop while the pointer rests there; the line says the same once it is chosen. */
.effort-card__hint { position: absolute; right: -4px; bottom: calc(100% + 6px); max-width: 220px; padding: 6px 9px; border: 1px solid var(--tt-field-border); border-radius: var(--tt-radius-control); background: var(--tt-surface-overlay); color: var(--tt-text); font-size: var(--tt-type-caption); line-height: 1.35; box-shadow: var(--tt-shadow-sm); pointer-events: none; opacity: 0; transform: translateY(3px); transition: opacity 120ms ease, transform 120ms ease; z-index: 1; }
.effort-card__hint[data-shown='true'] { opacity: 1; transform: none; }
.effort-card__ends { display: flex; justify-content: space-between; margin: 6px 2px 0; color: var(--tt-text-faint); font-size: var(--tt-type-caption); line-height: 1.2; }

/* Ultrathink: one row that reads as a check, on Claude threads with an editable draft. */
.effort-card__ultrathink { display: flex; align-items: center; gap: 9px; width: calc(100% + 8px); min-height: 30px; margin: 8px -4px 0; padding: 0 4px; border: 0; border-radius: var(--tt-radius-control); background: transparent; color: var(--tt-text-2); font: inherit; font-size: var(--tt-type-small); text-align: left; transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease; }
.effort-card__ultrathink:hover:not(:disabled) { color: var(--tt-text); background: var(--tt-hover); }
.effort-card__ultrathink:active:not(:disabled) { color: var(--tt-text); background: var(--tt-hover-strong); }
.effort-card__ultrathink:disabled { cursor: default; }
.effort-card__ultrathink i { display: inline-grid; flex: none; place-items: center; width: 15px; height: 15px; border: 1.5px solid var(--tt-border); border-radius: var(--tt-radius-tag); color: var(--tt-on-accent); }
.effort-card__ultrathink i svg { display: none; }
.effort-card__ultrathink[data-on='true'] i { border-color: var(--tt-accent); background: var(--tt-accent); }
.effort-card__ultrathink[data-on='true'] i svg { display: block; }

/* The arrival. The letters take the colourway in turn, the word lifts and settles as one, and a tide of the
   colourway rises through the card from the track; threads.css carries the same tide through the composer and
   its border tint. */
.effort-card__wash { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
.effort-card__wash::before { content: ''; position: absolute; left: 0; right: 0; top: 100%; height: 220%; background: var(--tt-effort-wash-image); opacity: .5;
  -webkit-mask-image: linear-gradient(to top, transparent 0%, black 36%, black 58%, transparent 100%); mask-image: linear-gradient(to top, transparent 0%, black 36%, black 58%, transparent 100%); }
@media (prefers-reduced-motion: no-preference) {
  .effort-card[data-still='false'][data-arriving='true'] .effort-card__word[data-top='true'] { animation: effort-word 520ms cubic-bezier(.2, .8, .2, 1) both; }
  .effort-card[data-still='false'][data-arriving='true'] .effort-card__word[data-top='true'] > span { animation: effort-letter 520ms cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(140ms + var(--effort-letter) * 55ms); }
  .effort-card[data-still='false'][data-arriving='true'] .effort-card__wash::before { animation: effort-wash 1500ms cubic-bezier(.3, .6, .2, 1) both; }
}
/* The effort-letter, effort-word and effort-wash keyframes live in global.css, shared with the composer and the Appearance sample. */

/* Reduced motion is a true still state, inherited control transitions and the global focus rings' pseudo-elements included. */
.effort-card[data-still='true'], .effort-card[data-still='true'] *, .effort-card[data-still='true'] *::before, .effort-card[data-still='true'] *::after {
  animation: none !important;
  transition: none !important;
}

/* Copied from src/renderer/src/agents/threadChips.css */
/* The option chips: the model with its provider's mark, the reasoning effort and the permissions. Each opens its own list
   above itself, so the typed text and the send button stay where they were. Outside a composer (Settings, the continue
   strip) each is one filled chip with 5px corners (ADR-0110). In a composer they are text buttons (ADR-0113, below). */
.thread-options--chips { gap: 6px; }
.thread-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 220px; height: 28px; min-height: 28px; padding: 0 9px; border: 1px solid transparent; border-radius: var(--tt-radius-tag); background: light-dark(var(--tt-surface-overlay), var(--tt-surface-sunken)); color: var(--tt-text-2); font: inherit; font-size: var(--tt-type-small); white-space: nowrap; transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, opacity 120ms ease; }
.thread-chip > span { overflow: hidden; text-overflow: ellipsis; }
.thread-chip > svg { flex: none; }
/* The hover tint lies over the chip's own fill, whichever surface that is. */
.thread-chip:hover:not(:disabled), .thread-chip[aria-expanded='true'] { border-color: var(--tt-border-faint); background-image: linear-gradient(var(--tt-hover), var(--tt-hover)); color: var(--tt-text); }
.thread-chip:disabled { opacity: .55; cursor: default; }
/* Watch on a new thread's chips: pressed, the thread is watched from its first send, in the theme's accent. */
.thread-chip.watch-on-send[aria-pressed='true'] { border-color: var(--tt-accent-border); color: var(--tt-accent-text); }
.thread-chip.watch-on-send[aria-pressed='true']:hover:not(:disabled) { border-color: var(--tt-accent-border); color: var(--tt-accent-text); }
/* At the model's highest level the effort chip's word wears the colourway; the composer reads the same mark for its outline (ADR-0019). */
.thread-chip[data-effort-top='true'] > span { color: var(--tt-effort-text-fill); background: var(--tt-effort-text-image); -webkit-background-clip: text; background-clip: text; font-weight: 500; }
/* Ultracode's workflow mark (ADR-0148) in the colourway's ink, which stays opaque where the word's fill is a clipped gradient. */
.thread-chip[data-effort-top='true'] > .thread-chip__ultracode { color: var(--tt-effort-text); }

/* In a composer the chips are text buttons (ADR-0113, Zach's pick A of docs/prototypes/quiet-composer-prototype.html): no
   edge and no fill at rest, the value and a small chevron, still 28px tall so the hit area stays, with the hover wash while
   pointed at or open and the focus ring from the keyboard. The model reads in the secondary text beside its provider's
   mark; reasoning, permissions and Watch are quieter, in the muted text. */
.thread-prompt .thread-chip { gap: 5px; padding: 0 7px; border-radius: var(--tt-radius-control); background: transparent; color: var(--tt-text-muted); }
.thread-prompt .thread-chip.model-picker__trigger { color: var(--tt-text-2); }
.thread-prompt .thread-chip > svg:last-child { opacity: .7; }
.thread-prompt .thread-chip:hover:not(:disabled), .thread-prompt .thread-chip[aria-expanded='true'] { border-color: transparent; background: var(--tt-hover); color: var(--tt-text); }
.thread-prompt .thread-chip:active:not(:disabled):not([aria-expanded='true']) { background: var(--tt-hover-strong); color: var(--tt-text); }
.thread-prompt .thread-chip.watch-on-send[aria-pressed='true'], .thread-prompt .thread-chip.watch-on-send[aria-pressed='true']:hover:not(:disabled) { border-color: var(--tt-accent-border); background: color-mix(in srgb, var(--tt-accent) 14%, transparent); color: var(--tt-accent-text); }

/* Speed (ADR-0143, pick A of the prototype/composer-fast-mode tag): a square text button after the model chip. Standard, a
   muted outline bolt; Fast, the bolt filled in the theme's accent; Ultra fast, that bolt with a small 2 at its foot. It
   keeps the chips' 28px and their hover wash. */
.thread-chip.thread-fast { position: relative; justify-content: center; width: 28px; min-width: 28px; padding: 0; }
.thread-chip.thread-fast > .thread-fast__two { position: absolute; right: 4px; bottom: 3px; font-size: var(--tt-type-micro); font-weight: 700; line-height: 1; }
.thread-prompt .thread-chip.thread-fast { padding: 0; }
.thread-chip.thread-fast[aria-pressed='false'] > svg { opacity: .75; }
.thread-chip.thread-fast[aria-pressed='true'], .thread-chip.thread-fast[aria-pressed='true']:hover:not(:disabled) { color: var(--tt-accent-text); }
.thread-prompt .thread-chip.thread-fast[aria-pressed='true'] > svg { opacity: 1; }

/* A glyph that stands for the value appears only where the composer is narrow; the words stay for assistive technology. */
.thread-chip > .thread-chip__icon { display: none; flex: none; }
@container thread-pane (max-width: 720px) {
  .thread-prompt .thread-chip > .thread-chip__icon { display: inline-flex; }
  .thread-prompt .thread-chip:has(> .thread-chip__icon) > .thread-chip__value { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
}

/* A permission change the provider has not confirmed yet (a pending setting): the chip already shows it, with a
   dashed edge in the activity colour and a small dot, and the caption beside the chips says what is still in force.
   The dot breathes; under reduced motion it holds still. */
.thread-chip[data-pending='true'] { border-style: dashed; border-color: var(--tt-activity); color: var(--tt-text); }
.thread-prompt .thread-chip[data-pending='true']:hover:not(:disabled), .thread-prompt .thread-chip[data-pending='true'][aria-expanded='true'] { border-color: var(--tt-activity); }
.thread-chip > .thread-chip__pending { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--tt-activity); }
@media (prefers-reduced-motion: no-preference) {
  :root:not([data-reduced-motion='on']) .thread-chip__pending { animation: thread-chip-pending 1.1s ease-in-out infinite; }
}
@keyframes thread-chip-pending { 50% { opacity: .35; } }
.thread-options__caption { min-width: 0; color: var(--tt-text-muted); font-size: var(--tt-type-caption); line-height: 1.4; }
/* Kept in the tree while empty so assistive technology hears it arrive, but out of the row's spacing. */
.thread-options__caption:empty { position: absolute; }
/* What a refused or unconfirmed change said, each on its own line in the warning colour the composer's other refusals
   use. The composer gives them a row of their own under its footer, so the chips, the attach button and the send
   button stay exactly where they are; the row is empty, and takes no room, until there is something to say. */
.thread-options-notices { display: grid; gap: 4px; min-width: 0; margin-top: 6px; }
.thread-options-notices:empty { display: none; }
.thread-prompt > .thread-options-notices, .thread-workspace__compose .agent-composer > .thread-options-notices { grid-column: 2; }
.thread-options__notice { display: flex; flex: 1 0 100%; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 0; color: var(--threads-warning-text, var(--tt-error-text)); font-size: var(--tt-type-caption); line-height: 1.4; }
.thread-options__notice > span { flex: 0 1 auto; min-width: 0; overflow-wrap: anywhere; }
/* The line that says what the next turn starts on (ADR-0192) is news the user asked for, not a warning, so it reads quietly. */
.thread-options__notice--next { color: var(--tt-text-2); }
.thread-options__notice > button { flex: none; height: 26px; min-height: 26px; padding: 0 10px; border: 1px solid var(--tt-field-border); border-radius: var(--tt-radius-control); background: transparent; color: var(--tt-text-2); font: inherit; font-size: var(--tt-type-caption); transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, opacity 120ms ease; }
.thread-options__notice > button:hover:not(:disabled) { border-color: var(--tt-border-faint); background: var(--tt-hover); color: var(--tt-text); }
.thread-options__notice > button:active:not(:disabled) { background: var(--tt-hover-strong); color: var(--tt-text); }
.thread-options__notice > button:disabled { opacity: .55; cursor: default; }

/* The effort and permission lists. */
.thread-chip-menu { position: relative; min-width: 0; }
.thread-chip-menu__list { position: absolute; bottom: calc(100% + 6px); left: 0; z-index: 30; min-width: 180px; padding: 6px; border: 1px solid var(--tt-field-border); border-radius: var(--tt-radius-inset); background: var(--tt-surface-elevated); box-shadow: 0 16px 48px var(--tt-shadow-color); }
/* A chip near the top of the area that scrolls it opens its list below itself instead (`flip`). */
.thread-chip-menu__list[data-below='true'] { top: calc(100% + 6px); bottom: auto; }
:is(.thread-chip-menu__list, .thread-chip-menu__options) > button { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 32px; padding: 6px 10px; border: 0; border-radius: var(--tt-radius-row); background: transparent; color: var(--tt-text-2); font: inherit; font-size: var(--tt-type-small); text-align: left; white-space: nowrap; }
:is(.thread-chip-menu__list, .thread-chip-menu__options) > button:hover:not(:disabled), :is(.thread-chip-menu__list, .thread-chip-menu__options) > button:focus-visible { background: var(--tt-hover); color: var(--tt-text); outline: 0; }
:is(.thread-chip-menu__list, .thread-chip-menu__options) > button:focus-visible { box-shadow: inset 0 0 0 2px var(--tt-focus-ring); }
:is(.thread-chip-menu__list, .thread-chip-menu__options) > button[aria-selected='true'] { color: var(--tt-activity); }
:is(.thread-chip-menu__list, .thread-chip-menu__options) > button:disabled { opacity: .45; cursor: default; }
/* A permission mode named for what the provider stops asking says, underneath, what Sotto still asks. */
:is(.thread-chip-menu__list, .thread-chip-menu__options) > button > span { display: grid; gap: 2px; min-width: 0; }
:is(.thread-chip-menu__list, .thread-chip-menu__options) > button > span > small { max-width: 34ch; color: var(--tt-text-muted); font-size: var(--tt-type-caption); line-height: 1.35; white-space: normal; }
.thread-chip-menu__list:has(small) { min-width: 240px; }
:is(.thread-chip-menu__list, .thread-chip-menu__options):has(small) > button { align-items: flex-start; }
/* A list with a line under it that holds whatever is chosen (Watcher's permissions): the list and the line share one
   panel, wide enough that each choice's one line of description reads without a ragged edge. */
.thread-chip-menu__list--foot { width: min(318px, calc(100vw - 24px)); }
.thread-chip-menu__list--foot .thread-chip-menu__options > button > span > small { max-width: none; }
.thread-chip-menu__foot { margin: 6px 4px 0; padding: 8px 6px 2px; border-top: 1px solid var(--tt-hairline); color: var(--tt-text-muted); font-size: var(--tt-type-caption); line-height: 1.4; white-space: normal; }

/* One motion: a list rises 6px as it opens, on the easing the follow-up ledger uses. The model menu shares it. */
@media (prefers-reduced-motion: no-preference) {
  :root:not([data-reduced-motion='on']) :is(.thread-chip-menu__list, .model-picker__dialog) { animation: thread-chip-rise 140ms cubic-bezier(.2, .8, .2, 1); }
}
@keyframes thread-chip-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Copied from src/renderer/src/styles/glass.css */
/* Glass (ADR-0011, ADR-0084): the surfaces that float over the room, as T3
   Code's menus, dialogs and composer do. They are solid: --tt-glass is the
   theme's overlay colour and --tt-glass-field its field colour. The backdrop
   filter stays, because it makes each surface the containing block for its
   fixed-position descendants.

   The selectors name other features' floating surfaces without editing their
   stylesheets. The :root prefix outranks each surface's own background, which
   loads later in the bundle. Colours come from tokens.css only. */

:root .tt-dialog,
:root .tt-toast,
:root .model-picker__dialog,
:root .new-thread-dialog,
:root .followup-editor,
:root .side-sheet,
:root .working-copy__panel {
  background: var(--tt-glass);
  -webkit-backdrop-filter: var(--tt-glass-filter);
  backdrop-filter: var(--tt-glass-filter);
}

/* The composer and the skill list that opens from it keep the field colour, so
   the prompt still reads as the place to type. */
:root .thread-workspace__compose .agent-composer,
:root .thread-prompt > .composer-picker {
  background: var(--tt-glass-field);
  -webkit-backdrop-filter: var(--tt-glass-filter);
  backdrop-filter: var(--tt-glass-filter);
}

@media (prefers-reduced-transparency: reduce) {
  :root .tt-dialog,
  :root .tt-toast,
  :root .model-picker__dialog,
  :root .new-thread-dialog,
  :root .followup-editor,
  :root .side-sheet,
  :root .working-copy__panel {
    background: var(--tt-surface-overlay);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }

  :root .thread-workspace__compose .agent-composer,
  :root .thread-prompt > .composer-picker {
    background: var(--tt-field);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
}

.own-found:focus{outline:none}.dialog-body{scroll-padding-bottom:10px}.api-model .missing-input input{grid-row:auto}.missing-input input{font-weight:400}.settings-scroll::-webkit-scrollbar,.dialog-body::-webkit-scrollbar,.oc-pick::-webkit-scrollbar{width:8px}.settings-scroll::-webkit-scrollbar-thumb,.dialog-body::-webkit-scrollbar-thumb,.oc-pick::-webkit-scrollbar-thumb{background:var(--tt-scrollbar);border:2px solid transparent;background-clip:padding-box;border-radius:var(--tt-radius-control)}

.bare-owl{width:17px;height:17px;fill:currentColor;color:inherit}

.api-picker{display:flex;flex-direction:column;flex:1;min-height:0}.api-picker .oc-pick{flex:1}.server-route{flex:none}.server-route .server-choice{margin-top:0}.server-route .server-copy{display:grid}.server-route .server-choice small{white-space:normal}.server-route .server-choice{min-height:65px}
/* Round 3: one top edge; short steps fit their contents. */
#app{container-type:size}
.tt-dialog-backdrop{align-items:flex-start;padding-top:max(20px,calc((100cqh - 704px)/2))}
:root .tt-dialog:not(.notes-dialog):not(.confirm-dialog){width:min(640px,100%);height:auto;min-height:260px;max-height:100%}
:root .tt-dialog.oc-dialog--pick:not(.oc-dialog--filtered){height:min(704px,100%)}
:root .tt-dialog.oc-dialog--filtered{min-height:360px}
:root .tt-dialog.model-review{min-height:0}
:root .tt-dialog.confirm-dialog{height:auto;width:min(540px,100%)}
:root .tt-dialog .dialog-body{flex:0 1 auto;min-height:0}
:root .tt-dialog .tt-dialog__actions{flex:none}
.own-server{grid-template-columns:minmax(0,1fr) auto}
.own-server__name{grid-column:1;grid-row:1;min-width:0}
.own-server__actions{grid-column:2;grid-row:1;flex-wrap:nowrap;align-self:center;max-width:none;margin-top:0;justify-content:flex-end;gap:6px}
.own-server__meta,.own-server__check{grid-column:1/-1}
.own-server__meta{display:block}
.own-server__actions .tt-button{flex:none}
.own-server__keeper{display:inline;margin:0}
.api-count{white-space:nowrap;font-size:var(--tt-type-caption);color:var(--tt-text-muted)}
.oc-opt__how{display:none}
.server-route .server-choice{min-height:75px;align-items:center}
.server-route .server-copy small{white-space:normal;line-height:1.45}
.catalogue-line{font-size:var(--tt-type-caption);line-height:1.5;flex:none}
.model-copy{min-width:0;container: model-facts / inline-size}
.api-model{grid-template-columns:17px minmax(0,1fr);align-items:start}
.api-model input[type=checkbox]{grid-row:auto}
.api-model strong{overflow-wrap:anywhere;line-height:1.45;display:inline}
.api-model .model-copy>label{display:block;cursor:pointer}
.model-facts{display:grid;gap:1px;margin-top:3px;line-height:1.5}
.facts-summary{white-space:nowrap}
.facts-summary:empty{display:none}
.facts-effort{white-space:normal;max-width:100%}
@container model-facts (width < 560px){.facts-effort.seven-levels{flex-basis:100%}}
@container model-facts (width < 365px){.facts-effort{white-space:normal}}
.new-model{display:inline-block;margin-left:8px;padding:1px 5px;border-radius:var(--tt-radius-tag);background:var(--tt-accent-wash);color:var(--tt-accent-text);font-size:var(--tt-type-micro);vertical-align:middle}
.missing-input{margin-top:10px}
.missing-input label{font-size:var(--tt-type-caption);color:var(--tt-text-muted)}
.model-picker__own small{white-space:nowrap!important}

#checking-status:focus{outline:0}
.own-refusal:focus-visible{outline:2px solid var(--tt-focus-ring)}
.notes-dialog ol{margin:0 0 14px;padding-left:20px;font-size:var(--tt-type-small);line-height:1.6}
.notes-dialog li+li{margin-top:8px}

.own-server>.own-server__address{grid-column:1/-1;white-space:normal;overflow-wrap:anywhere;overflow:visible;text-overflow:clip}
.model-persistence{flex-basis:100%;margin:0 0 4px;color:var(--tt-text-muted);font-size:var(--tt-type-caption);line-height:1.5}
.model-list-help:empty{display:none}


@container model-facts (width < 560px){.facts-effort.seven-levels::before{content:none}}
@container model-facts (width < 365px){.facts-effort{flex-basis:100%}.facts-effort::before{content:none}}

/* API list: keep the renderer's 40px rows, shorten the fixed tail. */
.oc-dialog--pick{padding:20px 24px 18px}
.oc-dialog--pick .tt-dialog__description{margin:6px 0 12px}
.oc-dialog--pick .oc-group-head{padding-top:6px;padding-bottom:4px;line-height:18px}
.oc-dialog--pick .oc-opt:not(.server-choice){min-height:40px;height:40px;padding-block:7px}
.oc-dialog--pick .server-choice{min-height:54px;padding-block:8px}
.oc-dialog--pick .catalogue-line{padding-top:6px;line-height:1.4}
.oc-dialog--pick .tt-dialog__actions{padding-top:10px}
.oc-dialog--pick .tt-dialog__actions .tt-button{min-height:38px}
.oc-dialog--filtered .api-picker{flex:0 1 auto}
.oc-dialog--filtered .oc-pick{flex:0 1 auto;max-height:400px}
.oc-dialog--filtered .server-choice{margin-top:6px}
/* This is a fixed footer, never content underneath a scrolling edge. */
.model-review .tt-dialog__actions{border-top:1px solid var(--tt-hairline);margin-top:12px;padding-top:12px}
.model-review .model-persistence{margin-bottom:2px}
.app-room__foot{display:flex;align-items:center;justify-content:flex-end;min-width:0;height:32px;flex:none;padding:0 16px 6px;background:var(--tt-canvas);user-select:none}
.app-footer__status{min-width:0;overflow:hidden;color:var(--tt-text-muted);font-size:var(--tt-type-caption);line-height:1.45;text-overflow:ellipsis;white-space:nowrap}
.notes-dialog code{font-family:var(--tt-font-mono);font-size:var(--tt-type-caption)}
/* End the initial API view on a whole row, without a cut-off group heading. */
:root .tt-dialog.oc-dialog--pick:not(.oc-dialog--filtered){height:auto}
.oc-dialog--pick:not(.oc-dialog--filtered) .oc-pick{height:416px;flex:0 1 auto;padding-bottom:0}
@container (height < 680px){.oc-dialog--pick:not(.oc-dialog--filtered) .oc-pick{height:228px}}
@container (height > 900px){.oc-dialog--pick:not(.oc-dialog--filtered) .oc-pick{height:536px}}

.address-dialog .tt-dialog__actions{border-top:1px solid var(--tt-hairline);margin-top:12px;padding-top:12px}
.address-dialog .tt-dialog__actions>.own-privacy{flex-basis:100%;margin:0 0 2px;font-size:var(--tt-type-small);line-height:1.5}
/* Round 4: model identity stays in the row; optional facts stay in a disclosure. */
.api-model{grid-template-columns:17px minmax(0,1fr) auto;gap:3px 10px;padding:10px 12px;cursor:default}
.api-model .model-copy{grid-column:2;grid-row:1;container-type:normal}
.api-model .model-id{display:block;margin-top:1px;color:var(--tt-text-muted);font:var(--tt-type-caption)/1.4 var(--tt-font-mono);overflow-wrap:anywhere}
.api-model .model-facts{gap:0;margin-top:3px;font-size:var(--tt-type-caption);line-height:1.45}
.api-model .facts-summary{white-space:normal}
.api-model .facts-effort{white-space:normal}
.no-tools{color:var(--tt-text-2)}
.model-details{display:contents}
.model-details>summary{grid-column:3;grid-row:1;display:flex;align-items:center;gap:3px;list-style:none;color:var(--tt-text-muted);font-size:var(--tt-type-caption);line-height:20px;cursor:pointer;border-radius:var(--tt-radius-tag);padding:0 2px}
.model-details>summary::-webkit-details-marker{display:none}
.model-details[open]>summary>svg{transform:rotate(180deg)}
.model-details>summary:hover{color:var(--tt-text)}
.model-details-body{grid-column:2/-1;border-top:1px solid var(--tt-hairline);margin-top:7px;padding-top:9px;min-width:0}
.model-details:not([open])>.model-details-body{display:none}
.model-details-facts{display:grid;gap:7px;margin:0;font-size:var(--tt-type-caption);line-height:1.5}
.model-details-facts>div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px}
.model-details-facts dt{color:var(--tt-text-muted)}
.model-details-facts dd{margin:0;color:var(--tt-text)}
.model-prices dd{display:flex;flex-wrap:wrap;gap:2px 14px;font-variant-numeric:tabular-nums}
.model-list-controls{flex:none;margin-bottom:10px}
.model-list-controls .choose-models-bar{margin-bottom:7px}
.models-search{height:34px}
.models-search .tt-button{width:23px;padding:0;min-height:24px;border:0;background:none}
.model-filter-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px;color:var(--tt-text-muted);font-size:var(--tt-type-caption);min-height:27px}
.model-filter-bar>div{display:flex;align-items:center;gap:4px}
.model-filter-bar button{display:flex;align-items:center;gap:5px;border:0;border-radius:var(--tt-radius-control);padding:4px 8px;background:transparent;color:var(--tt-text-muted);font-size:var(--tt-type-caption);min-height:27px}
.model-filter-bar button[aria-pressed=true]{background:var(--tt-accent-wash);color:var(--tt-accent-text)}
.model-filter-bar button span{font-variant-numeric:tabular-nums}
:root .tt-dialog.model-review .dialog-body{flex:1 1 auto;padding-top:3px}
.model-review .tt-dialog__actions .footer-note{max-width:270px}
.model-review .model-persistence{font-size:var(--tt-type-caption)}
.model-empty{display:grid;justify-items:start;gap:10px;padding:18px 0;color:var(--tt-text-muted);font-size:var(--tt-type-small)}
.own-field-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:5px 12px;justify-content:space-between}
.key-help{color:var(--tt-text-2);font-size:var(--tt-type-caption);font-weight:400;text-decoration:underline;text-underline-offset:3px}
.key-help span{color:var(--tt-text-muted);text-decoration:none;display:inline-block;margin-left:6px}
.own-server__actions>.hosts-menu>.tt-button{width:30px;min-height:30px;padding:0;display:grid;place-items:center}
.own-servers__rows{overflow:visible}
.hosts-menu__list{z-index:30}
.effort-card__note{font-size:var(--tt-type-caption);line-height:1.45;color:var(--tt-text-muted);margin-top:7px}
.effort-card--default .effort-card__line{margin-top:4px;max-width:30em}
.effort-card--default .effort-card__foot{margin-top:12px}
.effort-adjustment{margin-top:10px;color:var(--tt-text-muted);font-size:var(--tt-type-caption);line-height:1.4}
/* Review controls are outside the mock window and stay compact as states grow. */
.statebar{flex-wrap:nowrap;align-items:center;gap:7px}
.statebar>.tt-button{display:grid;place-items:center;width:28px;min-height:28px;padding:0;border:1px solid var(--tt-border)}
.review-state-label{display:flex;align-items:center;gap:8px;color:var(--tt-text-muted);font-size:var(--tt-type-caption)}
.review-state-label select{font:inherit;font-size:var(--tt-type-caption);padding:4px 9px;min-height:29px;min-width:220px;background:var(--tt-surface);color:var(--tt-text);border:1px solid var(--tt-field-border);border-radius:var(--tt-radius-control)}
.review-state-count{font-size:var(--tt-type-caption);color:var(--tt-text-muted)}
.notes-dialog a{color:var(--tt-link)}
@media(max-width:900px){.api-model{padding:10px 12px}.model-details-facts>div{grid-template-columns:110px minmax(0,1fr)}.key-help span{margin-left:3px}}
/* Details keep the full row width; only the disclosure control sits at the top right. */
.api-model{position:relative;grid-template-columns:17px minmax(0,1fr)}
.api-model .model-copy>label{padding-right:65px}
.model-details{display:block;grid-column:2/-1;grid-row:auto;min-width:0}
.model-details>summary{position:absolute;right:12px;top:10px}
.model-details-body{margin-top:4px;padding-top:9px}
.address-dialog .address-refusal{flex:none;margin:0 0 12px}
.notes-wrap{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:var(--tt-overlay)}[hidden]{display:none!important}</style></head>

function notes(){const el=$('#notes');el.hidden=false;el.innerHTML=`<div class="notes-wrap"><section class="tt-dialog notes-dialog" role="dialog" aria-modal="true" aria-labelledby="notes-title"><h2 id="notes-title">Design notes · Polish round 4</h2><div class="dialog-body own-dialog__body"><h3>Owner decisions</h3><p><b>One dialog:</b> Layout A stays in Providers for APIs and servers you run. There is no separate settings page.</p><p><b>Two sources:</b> Sotto reads the provider’s own API and models.dev. It downloads the catalogue when Add opens, sending no key or other information of the user’s. The provider’s answer wins wherever both describe a fact.</p><p><b>Catalogue only:</b> The API list stays with the 197 entries this flow can use: the 196 with an address and an OpenAI-compatible package, plus OpenRouter. Sotto does not carry its own addresses for OpenAI, Anthropic, Google or xAI. These are no longer open questions.</p><p><b>Unticked models:</b> A thread already on a model keeps working when it is unticked. The model only leaves the menu for new picks.</p><h3>Changed after research, needs the owner’s yes</h3><p><b>Do not invent thinking levels.</b> The earlier choice was Off, Low, Medium and High for a model absent from the catalogue. Abliterated Large Flash shows why that fails: its documented levels are Off, Low, High and Max; Medium would be invalid. When the API and catalogue do not supply levels, a model known to think now says “Thinking: the model’s default”. The chip reads Default and its card has no stops. Documented elsewhere is not the same as supplied by these two sources. A model known not to think has no thinking line and no effort chip.</p><h3>Added after research, the owner may cut it</h3><p><b>Replace key:</b> The saved row’s More menu opens a new-key check without removing the API or its chosen models. A refused new key keeps the old key and all choices. The two main buttons stay Choose models and Check again. The More button and menu use the existing Hosts settings row pattern.</p><h3>Lists, identity and details</h3><p>More than ten discovered models starts with nothing selected and asks the user to pick. Ten or fewer starts with all selected. Search matches name and exact ID. All, Selected and New carry whole-inventory counts; New appears only after a check finds additions. Select shown and Clear shown change only the search/filter result. The footer always counts the full inventory. Choose models uses the same list, preserving saved choices. New models appear first and unticked.</p><p>Exact IDs stay under the names. Each closed Details disclosure holds the longest answer, tool support and supplied prices per 1M tokens, including cached input. Missing prices say Price not given. A model known not to use tools says No tools on its row. Unknown tool support is not treated as No tools.</p><p>The OpenRouter scale sample is 340 real entries from the local models.dev snapshot of 10 November 2026, not a live inventory or price quote. The three new entries and check times are illustrative. The four Abliteration models retain the provider-supplied context and image facts from the brief. Its three catalogue entries supply their known effort options, output limits and prices. Flash’s output, tools and prices are not filled in without data.</p><h3>Key help and failures</h3><p>Get a key opens the catalogue’s provider help page in a browser; its host is shown beside the link. The page itself never fetches or sends a key. The address failures copy ownServerRefusalWords for unreachable, not-openai and no-models. Each preserves the typed address, name and key. Key replacement has different refusal words because a saved key remains.</p><p>OpenAI search points to Codex, Anthropic to Claude Code, and xAI to Grok Build. Google has no matching direct provider in this mock-up, so it offers the address route without inventing one.</p><h3>Connected providers and keys</h3><p>The default has Hermes connected and OpenCode not connected. Hermes keeps the key and runs the models. With both connected, OpenCode keeps the key and gives Hermes a copy; both run the models. Sotto’s record holds no key. Spark Cluster uses http://10.0.0.115:8888/v1 and has no key. Checked times describe a past check, not a promise of current availability.</p><h3>Effort in a thread</h3><p>The real EffortPicker card, its labels and its per-level sentences stay. A model with no Off stop quietly says it always thinks. When switching models, a level the next model does not take moves to that model’s nearest offered level; a tie uses the lower level. The chip and a short sentence show the new choice. Default is not a numeric level. A model with unknown levels uses Default; a non-thinking model has no effort control.</p><h3>Keyboard order</h3><ol><li><b>Open Add:</b> focus the loading status, then Search APIs. Tab reaches the API list, Another address and Cancel. Arrows, Home and End move through the list; Enter chooses.</li><li><b>Key:</b> choosing an API focuses Key. Tab follows Get a key, Key, Show, Cancel, Check key in visual order; All APIs is available before them. Checking focuses the status. A refusal returns to Key. Replacement starts at New key and returns to the saved row’s More button when closed.</li><li><b>Model list:</b> a large result focuses Search models; a small result focuses the first checkbox. Tab reaches filters, then each checkbox and its Details disclosure, then Cancel and Add or Save choices. Search keeps focus as results change. Bulk actions stay scoped to shown rows. Escape first closes an open Details disclosure, then closes the dialog. Add returns to its opener; Save returns to Choose models.</li><li><b>More:</b> focus the first action on opening. Arrows, Home and End move through actions. Escape closes and returns to More; Tab closes without trapping focus.</li><li><b>Address:</b> Address, Name, optional Key, Show, Check again, model choices when found, Cancel and Add server. Failures focus Address with the refusal attached; missing context focuses its field.</li><li><b>Thread:</b> the model menu opens on Search. Effort opens on its slider, or Done when only Default is available. Arrows select offered levels; Escape or Done returns to the chip. Non-thinking models skip the chip.</li></ol><h3>What the build must change</h3><p>Replace the Add dialog and check with this picker and address route. Merge discovered facts and catalogue facts without guessing. Keep model IDs and the user’s kept IDs in the record; preserve them through key replacement and rechecks. Send Hermes effort through its reasoning_effort session option, using none only when Off is supported and omitting an override for Default.</p><p>Fetch the catalogue in main through a preload bridge. models.dev is a new host Sotto contacts, so the build needs an ADR and the README’s Privacy and cost entry before that network change. Add key replacement behind the same key owners. The renderer has no network. This page is a static, offline mock-up.</p><p>Research: <a href="/Users/drakemorey/Developer/Reports/add_an_api_research/report.md" target="_blank">Add an API comparative UI research</a>. Interactions and information order were borrowed; Sotto’s tokens, marks and controls remain.</p></div><div class="tt-dialog__actions">${btn('Close notes','close-notes')}</div></section></div>`;$('#app').inert=true;requestAnimationFrame(()=>$('#notes [data-action=close-notes]').focus())}

document.addEventListener('change',e=>{const t=e.target;if(t.id==='state-select'){preview(t.value);return}if(t.dataset.model){const set=state.fromServer?state.serverSelected:state.selected;t.checked?set.add(t.dataset.model):set.delete(t.dataset.model);syncSelected();if(!state.fromServer&&state.modelFilter==='selected'&&!t.checked){refreshModelList();($('#model-list-body [data-model]')||$('[data-model-filter=all]'))?.focus()}}});

document.addEventListener('keydown',e=>{

 if(menu){const buttons=$$('[role=menuitem]',menu),at=buttons.indexOf(document.activeElement);if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();buttons[e.key==='Home'?0:e.key==='End'?buttons.length-1:(at+(e.key==='ArrowDown'?1:buttons.length-1))%buttons.length]?.focus();return}if(e.key==='Escape'||e.key==='Tab'){const id=state.actionMenu;state.actionMenu='';menu.remove();$(`#more-${id}`)?.setAttribute('aria-expanded','false');if(e.key==='Escape'){e.preventDefault();$(`#more-${id}`)?.focus()}return}}

 if(e.key==='Enter'&&e.target.id==='key')$('[data-action=check]')?.click();

 if((e.target.closest('.api-picker')||e.target.id==='api-search')&&['ArrowUp','ArrowDown','Home','End'].includes(e.key)){const opts=$$('.api-picker .oc-opt'),at=opts.indexOf(e.target),next=e.key==='Home'?0:e.key==='End'?opts.length-1:e.key==='ArrowDown'?Math.min(at+1,opts.length-1):at-1;e.preventDefault();if(next<0)$('#api-search').focus();else{opts.forEach(o=>{if(o.dataset.api)o.tabIndex=-1});opts[next].tabIndex=0;opts[next].focus()}}
 const dialog=!$('#notes').hidden?$('#notes .tt-dialog'):$('#overlay .tt-dialog');if(e.key==='Tab'&&dialog){const els=$$('button:not(:disabled),input:not(:disabled),a[href],summary,select,[tabindex="0"]',dialog).filter(x=>x.tabIndex>=0&&x.getClientRects().length),first=els[0],last=els.at(-1);if(e.shiftKey&&(document.activeElement===first||!dialog.contains(document.activeElement))){last?.focus();e.preventDefault()}else if(!e.shiftKey&&(document.activeElement===last||!dialog.contains(document.activeElement))){first?.focus();e.preventDefault()}}
