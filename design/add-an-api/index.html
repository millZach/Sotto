   A custom property substitutes its var()s where it is declared, so an element
   that carries `data-theme-scope` with its own --theme-* roles (the preview on
   Settings → Appearance, showing the other half) re-derives every token from
   them here without repainting the window. */

  --theme-contrast-target: white;
  --tt-glass-blur: 16px;
  --tt-glass-saturation: 1.08;

  --tt-canvas: var(--theme-canvas);
  --tt-chrome: var(--theme-chrome);
  --tt-surface: var(--theme-surface);
  --tt-surface-elevated: var(--theme-surface-raised);
  --tt-surface-overlay: var(--theme-surface-overlay);
  --tt-surface-sunken: var(--theme-muted);
  --tt-panel: var(--theme-surface);
  --tt-sidebar: var(--theme-sidebar);
  --tt-field: var(--theme-surface);
  /* A card is a filled container with no outline, one step off the room: the raised surface by night, a step
     darker than the canvas by day (set in the light block below). Rows inside it divide with a line of the inset,
     and fields, samples and tracks inside it take the inset too. The selected card or item wears the accent
     surface mixed into the card. */
  --tt-card: var(--theme-surface-raised);
  /* The card's own solid colour, which Glass's translucent card leaves in place for what must stay solid. */
  --tt-card-solid: var(--theme-surface-raised);
  --tt-card-inset: var(--theme-canvas);
  --tt-card-selected: color-mix(in oklab, var(--theme-accent-surface) 65%, var(--tt-card));
  /* The composer's card and its faint ink: the card's and the faint ink's, unless a theme's block parts them (the Sotto
     theme by day does, so the composer keeps the card it was drawn on). */

  --tt-composer-text-faint: var(--tt-text-faint);
  /* A segmented control is a sunken track with the chosen segment raised out of it: the overlay by night, the
     surface by day (set in the light block below). */
  --tt-segment-on: var(--theme-surface-overlay);

  --tt-text: color-mix(in oklab, color-mix(in oklab, var(--theme-text) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-text-2: color-mix(in oklab, color-mix(in oklab, color-mix(in oklab, var(--theme-text) 55%, var(--theme-muted-foreground)) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-boost));
  /* Secondary text, the times, statuses, labels and metadata read at the caption sizes: the theme's muted role, a quarter
     of the way to its text, so a 12px time reads clearly and still sits a step under the words it describes. It lifts in
     proportion, so a theme whose muted text is already near its body text (Glass) moves little. The composer keeps the
     quieter tier it was drawn in, `--tt-text-quiet`, the muted role 15% of the way, and so does the effort control. */

  --tt-text-muted: color-mix(in oklab, color-mix(in oklab, color-mix(in oklab, var(--theme-muted-foreground) 76%, var(--theme-text)) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-boost));
  /* The prompt's hint (its placeholder): the theme's own Placeholder role, the ink every other field's placeholder takes.
     It was the Muted text role, but a theme can draw its muted text close to its body text (Vellum Night's sits at
     7.7:1 on the composer card, against the body's 12:1), and a hint that bright reads as typed words (Drake, November
     2, 2026). High Contrast lifts it at half strength, so at the top step it stays dimmer than typed words, which go to
     pure white (or black) there. */

  --tt-text-faint: color-mix(in oklab, color-mix(in oklab, var(--theme-placeholder) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-boost));
  /* What the transcript writes in the muted tier, names, times and folded work, a step nearer the body, because it is read
     for a long time at small sizes. threads.css sets it as the transcript's muted tier; the composer stays on its quiet tier. */
  --tt-transcript-muted: color-mix(in oklab, var(--tt-text-quiet) 80%, var(--tt-text));
  /* The weight of the small secondary words, the times, counts, statuses and Worked for lines read at the caption and small

     lighter than their ink (Zach's pick B, ADR-0024 November 7 amendment). */

  --tt-kbd: var(--theme-secondary);
  --tt-skeleton-a: var(--theme-surface);
  --tt-skeleton-b: var(--theme-surface-raised);
  --tt-scrollbar: var(--theme-terminal-scrollbar);
  --tt-scrollbar-hover: var(--theme-terminal-scrollbar-hover);

  --tt-warning: color-mix(in oklab, color-mix(in oklab, var(--theme-warning-foreground) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-warning-text: var(--tt-warning);
  --tt-warning-surface: var(--theme-warning-surface);
  --tt-attention: var(--tt-warning);
  --tt-error: color-mix(in oklab, color-mix(in oklab, var(--theme-error-foreground) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-error-text: var(--tt-error);

  --tt-error-surface: var(--theme-error-surface);
  --tt-error-border: color-mix(in oklab, var(--theme-error) 38%, var(--theme-error-surface));

  --tt-error-on-tint: color-mix(in oklab, var(--tt-error-text) 80%, var(--tt-text));
  --tt-update: var(--theme-update);
  --tt-update-text: color-mix(in oklab, color-mix(in oklab, var(--theme-update-foreground) var(--theme-contrast-base), var(--theme-update-surface)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-update-surface: var(--theme-update-surface);

  --tt-code-bg: var(--theme-code-background);
  --tt-code-border: var(--tt-border-faint);
  --tt-code-text: color-mix(in oklab, color-mix(in oklab, var(--theme-code-foreground) var(--theme-contrast-base), var(--theme-code-background)), var(--theme-contrast-target) var(--theme-contrast-boost));

  /* Sotto Owl's night sky behind the sidebar header (agents/owlSky.css). The stars are the sidebar's own text at
     four low strengths, three of them in the accent, and the accent glows faintly behind the tile. The night is the
     sidebar a hair darker with its chroma lifted, on the sidebar's own hue; a sidebar with no hue (Citrine) borrows
     Sotto's night blue, 265. The search field is a deeper pool of that night, so its placeholder reads within a
     twentieth of how it reads on the theme's own field.
     --owl-night-hue is a channel expression, so it is only valid inside a relative oklch(). */
  --owl-night-hue: calc(h * clamp(0, (c - .001) * 100000, 1) + 265 * (1 - clamp(0, (c - .001) * 100000, 1)));
  --tt-owl-star: var(--tt-sidebar-text);
  --tt-owl-star-accent: var(--tt-accent);
  --tt-owl-star-o1: .62;
  --tt-owl-star-o2: .38;
  --tt-owl-star-o3: .22;
  --tt-owl-star-o4: .13;
  --tt-owl-faintest-stars: block;
  --tt-owl-star-scale: 1;
  --tt-owl-glow: color-mix(in srgb, var(--tt-accent) 11%, transparent);
  /* The light crossing a running turn's working words (agents/activity.css): the accent at its most vivid, lifted well
     above the words' muted ink so it reads on any theme, however dull its accent. */
  --tt-working-light: oklch(from var(--tt-accent) max(l, .9) min(calc(c * 1.6), .2) h);
  --tt-owl-night: oklch(from var(--tt-sidebar) calc(l - .011) min(calc(c + .025), .05) var(--owl-night-hue));
  --tt-owl-night-field: oklch(from var(--tt-sidebar) calc(l - .05) min(calc(c + .023), .045) var(--owl-night-hue));
  /* Watcher's room has no sidebar, so its night sits in the room's top-left corner (watcher/watcher.css), derived
     from the canvas as the sidebar's is from the sidebar: the canvas is the darkest surface, so a little lighter
     than it, chroma lifted, on the same hue. */
  --tt-owl-room-night: oklch(from var(--tt-canvas) calc(l + .04) min(calc(c + .028), .055) var(--owl-night-hue));
  /* The collapsed rail's trays (agents/threadSidebar.css) take these in turn: the accent, then the accent turned round
     the hue wheel at its own lightness and chroma, so a quiet accent gives quiet trays. A grey accent borrows the
     Sotto Owl night's blue and a little chroma, so its trays still differ. A turned hue that lands on red, orange or
     amber (under 75), the error and attention colours, turns a further 120 degrees. On Citrine they are its yellow,
     a blue, a green and a pink. Like --owl-night-hue, the --rail-* parts are channel expressions, valid only inside
     a relative oklch(). */
  --rail-chroma: calc(c + .1 * (1 - clamp(0, (c - .001) * 100000, 1)));
  --rail-turn-2: calc(var(--owl-night-hue) + 155);
  --rail-turn-3: calc(var(--owl-night-hue) + 60);
  --rail-turn-4: calc(var(--owl-night-hue) + 245);
  --rail-hue-2: calc(var(--rail-turn-2) - 360 * clamp(0, (var(--rail-turn-2) - 360) * 100000, 1));
  --rail-hue-3: calc(var(--rail-turn-3) - 360 * clamp(0, (var(--rail-turn-3) - 360) * 100000, 1));
  --rail-hue-4: calc(var(--rail-turn-4) - 360 * clamp(0, (var(--rail-turn-4) - 360) * 100000, 1));
  --tt-rail-group-1: oklch(from var(--tt-accent) l var(--rail-chroma) var(--owl-night-hue));
  --tt-rail-group-2: oklch(from var(--tt-accent) l var(--rail-chroma) calc(var(--rail-hue-2) + 120 * clamp(0, (75 - var(--rail-hue-2)) * 100000, 1)));
  --tt-rail-group-3: oklch(from var(--tt-accent) l var(--rail-chroma) calc(var(--rail-hue-3) + 120 * clamp(0, (75 - var(--rail-hue-3)) * 100000, 1)));
  --tt-rail-group-4: oklch(from var(--tt-accent) l var(--rail-chroma) calc(var(--rail-hue-4) + 120 * clamp(0, (75 - var(--rail-hue-4)) * 100000, 1)));

  --tt-success: oklch(0.79 0.13 165);
  /* A ready Merge (ADR-0110, November 5): the status green washed over the surface, inside an edge of it. */
  --tt-success-wash: color-mix(in oklab, var(--tt-success) 18%, var(--tt-surface));
  --tt-success-wash-hover: color-mix(in oklab, var(--tt-success) 25%, var(--tt-surface));
  --tt-success-wash-press: color-mix(in oklab, var(--tt-success) 31%, var(--tt-surface));
  --tt-success-edge: color-mix(in oklab, var(--tt-success) 55%, var(--tt-field-border));
  --tt-provider-codex: #d7dbe1;
  --tt-provider-claude: #e3b58e;
  --tt-provider-grok: #c9baff;
  --tt-provider-devin: #a5d8f5;
  --tt-provider-opencode: #ece3d0;
  --tt-provider-cursor: #f2b9c9;
  /* A provider's mark drawn as a glyph rather than on its badge. By night the badge colours read at 10:1 or more as
     glyphs; by day they are too pale (Codex's grey sits under 2:1 on the room), so the light block mixes them halfway
     toward the text colour, keeping the provider's hue at about 4:1 on the room, the sidebar and a card. */
  --tt-provider-codex-mark: var(--tt-provider-codex);
  --tt-provider-claude-mark: var(--tt-provider-claude);
  --tt-provider-grok-mark: var(--tt-provider-grok);
  --tt-provider-devin-mark: var(--tt-provider-devin);
  /* Settings → Providers draws each mark in the ink on a badge of its provider's colour. Muse has no other colour
     here, and OpenCode's and Cursor's badges keep a pale shade in both modes: their light glyph colours are too dark
     under the ink. */
  --tt-provider-muse: #e6e1d6;
  --tt-provider-opencode-badge: #ece3d0;
  --tt-provider-cursor-badge: #f2b9c9;
  /* DeepSeek's whale has no colour elsewhere, so its badge is a pale shade of DeepSeek's own blue (#4d6bfe). */
  --tt-provider-deepseek-badge: #a3b3ff;
  --tt-provider-ink: #080b0a;
  /* Chart series (Usage's split chart). Constants per mode like the provider marks: a theme carries T3 Code's
     roles, which name no categorical hues. Six hues and an Other grey, each at least 3:1 on every built-in theme's
     canvas and surface, and every pair, Other included, apart for protanopia and deuteranopia (Machado 2009, OKLab
     distance at least 8 in both modes; themeTokens.test.ts holds both). Slot 1 to 6: blue, orange, cyan, magenta,
     violet, amber. */
  --tt-chart-1: #3792fd;
  --tt-chart-2: #b85207;
  --tt-chart-3: #1dcaf7;
  --tt-chart-4: #c33786;
  --tt-chart-5: #8056d6;
  --tt-chart-6: #c99414;
  --tt-chart-other: #9e9e9e;
  --tt-overlay: color-mix(in srgb, var(--theme-canvas) 64%, transparent);
  --tt-backdrop: rgb(0 0 0 / 38%);
  /* The effort control (ADR-0019): a pill track in the card, and the colourway chosen in Settings → Appearance
     for the fill, the wash and the tinted word at a model's highest level. The colourway's three hues
     (`--tt-effort-a/b/c`), its ink and its border hue are set per colourway after the mode blocks; the tokens
     here shape them for the mode. `--tt-effort-text-fill` is the colour the word is painted in and
     `--tt-effort-text-image` the gradient clipped to it, so a colourway that paints its word as a gradient
     needs no branch in feature CSS. */
  --tt-effort-track: color-mix(in srgb, var(--tt-text) 7%, var(--tt-surface-elevated));
  --tt-effort-dot: color-mix(in srgb, var(--tt-text-quiet) 55%, var(--tt-effort-track));
  --tt-effort-fill-cool: var(--tt-text-quiet);
  --tt-effort-fill-veil: transparent;
  --tt-effort-thumb: var(--tt-text);
  --tt-effort-thumb-edge: color-mix(in srgb, var(--tt-text) 10%, transparent);
  --tt-effort-text: var(--effort-ink);
  --tt-effort-text-fill: var(--tt-effort-text);
  --tt-effort-text-image: none;
  --tt-effort-fill-image: linear-gradient(90deg, var(--tt-effort-a), var(--tt-effort-b), var(--tt-effort-c));
  --tt-effort-wash-image: linear-gradient(to top, var(--tt-effort-a), var(--tt-effort-b), var(--tt-effort-c));

  --tt-shadow-sm: 0 1px 2px rgb(0 0 0 / 40%);
  --tt-shadow-lg: 0 24px 60px rgb(0 0 0 / 55%);
  --tt-shadow-overlay: 0 24px 72px -20px rgb(0 0 0 / 90%);
  --tt-shadow-color: rgb(0 0 0 / 73%);
  /* How strongly the effort trace's halo falls on the room (effortTrace.css); a light room takes a little more. */
  --tt-effort-trace-halo: .55;

  /* Type sizes (ADR-0169). Every font-size in a renderer stylesheet names one of these steps, and
     scaleTokens.test.ts holds it there. `--tt-text-*` already names text colours, so sizes are `--tt-type-*`. */
  --tt-type-micro: 11px; /* Keys, badges and tiny marks */
  --tt-type-caption: 12px; /* Times, counts, statuses, metadata, code in Changes (a sidebar row's take small) */
  --tt-type-small: 13px; /* Descriptions, controls, most interface text, a sidebar row's status and time */
  --tt-type-body: 14px; /* Sidebar rows, fields, menu items */
  --tt-type-reading: 15px; /* Composer, Watcher's conversation, journal entries, settings labels */
  --tt-type-lead: 16px; /* A thread's messages, dialog titles, section intros, request prompts */
  --tt-type-heading: 18px; /* Sidebar brand, empty-room headings */
  --tt-type-figure: 22px; /* Figures in a narrow room, sub-titles */
  --tt-type-title: 28px; /* Room titles and large figures */

  /* Corners (ADR-0169), by what they round. Every border-radius names one of these steps. */
  --tt-radius-mark: 2px; /* Meters, legend squares, focus marks */
  --tt-radius-tag: 4px; /* Tags, keys, chips, small close buttons */
  --tt-radius-control: 6px; /* Buttons, fields, composer chips */
  --tt-radius-row: 8px; /* Sidebar and menu rows, icon buttons */
  --tt-radius-inset: 10px; /* Code blocks, menus, notes inside a card */
  --tt-radius-card: 14px; /* Cards, the full composer, the Dictate bar */
  --tt-radius-overlay: 20px; /* Dialogs, Zach's two-row composer and the widget */
  --tt-radius-full: 50%; /* Dots and rings: a circle on a square box, never a pill (ADR-0110) */
  /* The names before the scale, kept so whatever names them still rounds the same. */
  --tt-radius-sm: var(--tt-radius-control);
  --tt-radius-md: var(--tt-radius-inset);
  --tt-radius-lg: var(--tt-radius-card);
  --tt-font-ui:
    'Figtree', ui-sans-serif, system-ui, -apple-system,
    BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --tt-font-mono:
    'Spline Sans Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo,
    Consolas, 'Liberation Mono', monospace;
}

:root[data-theme='light'], [data-theme-scope='light'] {
  --theme-contrast-target: black;
  /* By day the raised surface is barely off the canvas, so a card is the canvas with a little of the text in it. */
  --tt-card: color-mix(in oklab, var(--theme-text) 4%, var(--theme-canvas));
  --tt-card-solid: color-mix(in oklab, var(--theme-text) 4%, var(--theme-canvas));
  /* Small secondary words a step heavier by day (see the token above). */
  --tt-weight-quiet: 500;
  --tt-segment-on: var(--theme-surface);
  --tt-glass-blur: 12px;
  --tt-glass-saturation: 1.14;
  --tt-success: oklch(0.445 0.11 158);
  /* By day the green is dark, and a little of it over a near-white surface reads grey, as a control at rest. So the
     wash is the same green raised to a light, clear tint, and its edge is the green itself. */
  --tt-success-wash: oklch(from var(--tt-success) .9 calc(c * .62) h);
  --tt-success-wash-hover: oklch(from var(--tt-success) .86 calc(c * .7) h);
  --tt-success-wash-press: oklch(from var(--tt-success) .82 calc(c * .78) h);
  --tt-success-edge: var(--tt-success);
  --tt-provider-codex: #c9ced6;
  --tt-provider-claude: #e2ad80;
  --tt-provider-grok: #bfaefc;
  --tt-provider-devin: #8fcaef;
  --tt-provider-codex-mark: color-mix(in srgb, var(--tt-provider-codex) 50%, var(--tt-text));
  --tt-provider-claude-mark: color-mix(in srgb, var(--tt-provider-claude) 50%, var(--tt-text));
  --tt-provider-grok-mark: color-mix(in srgb, var(--tt-provider-grok) 50%, var(--tt-text));
  --tt-provider-devin-mark: color-mix(in srgb, var(--tt-provider-devin) 50%, var(--tt-text));
  /* OpenCode's mark is drawn straight from its token in both modes, so the light one is already dark enough to read. */
  --tt-provider-opencode: #625843;
  /* Cursor's, like OpenCode's, is drawn straight from its token in both modes: a pale rose by night, a deep one by day. */
  --tt-provider-cursor: #94405a;
  --tt-provider-muse: #d9d3c4;
  --tt-provider-opencode-badge: #e4dac4;
  --tt-provider-cursor-badge: #eaaabd;
  --tt-provider-deepseek-badge: #93a6ff;
  --tt-provider-ink: #0b0d0c;
  --tt-chart-1: #0554a3;
  --tt-chart-2: #883c04;
  --tt-chart-3: #038db6;
  --tt-chart-4: #980563;
  --tt-chart-5: #885ee0;
  --tt-chart-6: #a07506;
  --tt-chart-other: #747474;
  --tt-overlay: color-mix(in srgb, var(--theme-canvas) 60%, transparent);
  --tt-backdrop: rgb(20 24 22 / 22%);
  --tt-shadow-sm: 0 1px 2px rgb(20 24 22 / 10%);
  --tt-shadow-lg: 0 24px 60px rgb(20 24 22 / 18%);
  --tt-shadow-overlay: 0 24px 64px -24px rgb(0 0 0 / 45%);
  --tt-shadow-color: rgb(20 24 22 / 18%);
  /* Light: the effort fill tints toward white so it stays a light surface, the thumb is paper with an edge,
     and the tinted word mixes toward the ink so it reads at 4.5:1. */
  --tt-effort-fill-cool: color-mix(in srgb, var(--tt-text-quiet) 40%, var(--tt-surface-elevated));
  --tt-effort-fill-veil: color-mix(in srgb, white 38%, transparent);
  --tt-effort-thumb: var(--tt-surface);
  --tt-effort-thumb-edge: var(--tt-border);
  --tt-effort-text: var(--effort-ink-light);
  /* Sotto Owl's sky by day: grey dots on a light surface read as dust, so the stars take the accent, a little
     larger, and the faintest drop out. There is no night by day. The band is a faint wash of the accent's hue: the
     accent is mixed in at full lightness, so the wash is never darker than the sidebar whatever the theme. The field
     and the switch keep their own colours. */
  --tt-owl-star: var(--tt-accent);
  --tt-owl-star-o1: .58;
  --tt-owl-star-o2: .44;
  --tt-owl-star-o3: .32;
  --tt-owl-star-o4: 0;
  --tt-owl-faintest-stars: none;
  --tt-owl-star-scale: 1.2;
  --tt-owl-glow: color-mix(in srgb, var(--tt-accent) 8%, transparent);
  /* By day the light is the accent deepened instead, below the muted ink. */
  --tt-working-light: oklch(from var(--tt-accent) min(l, .38) min(calc(c * 1.6), .2) h);
  --tt-owl-night: color-mix(in oklab, var(--tt-sidebar) 90%, oklch(from var(--tt-accent) 1 c h));
  --tt-owl-room-night: color-mix(in oklab, var(--tt-canvas) 90%, oklch(from var(--tt-accent) 1 c h));
  --tt-owl-night-field: var(--tt-field);
  --tt-effort-trace-halo: .7;
}

/* The desktop's Sotto halves read softer than the palette says (ADR-0024, November 4, 2026 amendment). This lives here rather
   than in palettes.ts because the iPhone's palette is generated from that file and keeps its own values. The room rises only
   as far as leaves the composer's card its step above it. --tt-canvas stays the palette's at the root and across Watcher's
   room: its night scene, its Stars and its words' glow read the root and the shell, and they keep their colours exactly.
   The inks are read only by the reading surface below; the composer and the chrome keep theirs.
   By night the room is a soft warm ink with the sidebar and Tools a step below it, as Zach picked (C, November 5, 2026).
   The palette writes its roles inline on the root, so the surfaces it moves are set here as the tokens they paint through.
   The composer's card, the raised surface, keeps its value, and so does every token the composer reads. */
:root[data-theme='dark'][data-theme-id='t3-code'] {
  /* Your messages and code sit a step above the warm room, never below it. */
  --tt-bubble: oklch(0.215 0.006 75);
  --tt-bubble-text: color-mix(in oklab, color-mix(in oklab, var(--theme-message-foreground) var(--theme-contrast-base), var(--tt-bubble)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-code-bg: oklch(0.18 0.004 75);
  --tt-code-text: color-mix(in oklab, color-mix(in oklab, var(--theme-code-foreground) var(--theme-contrast-base), var(--tt-code-bg)), var(--theme-contrast-target) var(--theme-contrast-boost));
  /* The sidebar and Tools sit below the room, so the thread is the lightest wide surface in the window. */
  --tt-sidebar: oklch(0.14 0.004 75);
  --tt-sidebar-text: color-mix(in oklab, color-mix(in oklab, oklch(0.9 0.005 85) var(--theme-contrast-base), var(--tt-sidebar)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-sidebar-text-muted: color-mix(in oklab, color-mix(in oklab, color-mix(in oklab, oklch(0.68 0.008 85) 76%, oklch(0.9 0.005 85)) var(--theme-contrast-base), var(--tt-sidebar)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-sidebar-control: oklch(0.185 0.004 75);
  --tt-sidebar-row-hover: oklch(0.18 0.004 75);
  --tt-sidebar-row-active: oklch(0.235 0.025 190);
  --tt-sidebar-row-selected: oklch(0.265 0.035 188);
  --tt-selected: var(--tt-sidebar-row-selected);
  --tt-sidebar-border: color-mix(in srgb, color-mix(in srgb, oklch(0.245 0.006 75) var(--theme-contrast-base), transparent), oklch(0.9 0.005 85) var(--theme-contrast-border-boost));
  /* Sotto Owl's night stays Sotto's night blue on the darker sidebar, rather than taking its warm hue. */
  --tt-owl-night: oklch(from var(--tt-sidebar) calc(l - .011) min(calc(c + .025), .05) 265);
  --tt-owl-night-field: oklch(from var(--tt-sidebar) calc(l - .05) min(calc(c + .023), .045) 265);
  --tt-reading-text: color-mix(in oklab, var(--tt-text) 88%, var(--theme-canvas));
  --tt-reading-text-2: color-mix(in oklab, var(--tt-text-2) 91%, var(--theme-canvas));
  --tt-reading-bubble-text: color-mix(in oklab, var(--tt-bubble-text) 85%, var(--tt-bubble));
  --tt-reading-code-text: color-mix(in oklab, var(--tt-code-text) 82%, var(--tt-code-bg));
  --tt-reading-muted: color-mix(in oklab, var(--tt-text-muted) 93%, var(--theme-canvas));
  --tt-transcript-muted: color-mix(in oklab, var(--tt-text-muted) 91%, var(--theme-canvas));
}
:root[data-theme='dark'][data-theme-id='t3-code'] .app-shell:not(:has(.watcher-room)) { --tt-canvas: oklch(0.16 0.004 75); }
/* Watcher's room keeps the palette's colours exactly: its messages, code and times read as they did before the pick. */
:root[data-theme='dark'][data-theme-id='t3-code'] .app-shell:has(.watcher-room) {
  --tt-bubble: var(--theme-message-surface);
  --tt-bubble-text: color-mix(in oklab, color-mix(in oklab, var(--theme-message-foreground) var(--theme-contrast-base), var(--theme-message-surface)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-code-bg: var(--theme-code-background);
  --tt-code-text: color-mix(in oklab, color-mix(in oklab, var(--theme-code-foreground) var(--theme-contrast-base), var(--theme-code-background)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-selected: var(--theme-sidebar-row-selected);
  --tt-transcript-muted: color-mix(in oklab, var(--tt-text-quiet) 80%, var(--tt-text));
}
/* The pane header and Tools read the same softer inks as the transcript. The composer keeps the root's. */
:root[data-theme='dark'][data-theme-id='t3-code'] :is(.thread-workspace__head, .tools-panel, .tools-rail) {
  --tt-text: var(--tt-reading-text);
  --tt-text-2: var(--tt-reading-text-2);
  --tt-text-muted: var(--tt-reading-muted);
  --tt-code-text: var(--tt-reading-code-text);
  color: var(--tt-text);
}
/* By day the rules a reader's eye follows go a step darker. A card is the canvas with 7% of the text, not 4%, so its edge
   and the room-coloured lines between its rows show without an outline (Zach's pick B, ADR-0110 November 7 amendment).
   The faint ink takes a little of the text so it still reads 4.5:1 on that card. The composer keeps the card and the
   faint ink it was drawn in (below). */
:root[data-theme='light'][data-theme-id='t3-code'] {
  --tt-reading-hairline: color-mix(in srgb, var(--tt-border-faint) 88%, var(--theme-text));
  --tt-reading-field-border: color-mix(in srgb, var(--tt-field-border) 88%, var(--theme-text));
  --tt-card: color-mix(in oklab, var(--theme-text) 7%, var(--theme-canvas));
  --tt-card-solid: color-mix(in oklab, var(--theme-text) 7%, var(--theme-canvas));
  --tt-composer-card: color-mix(in oklab, var(--theme-text) 4%, var(--theme-canvas));
  --tt-composer-text-faint: color-mix(in oklab, color-mix(in oklab, var(--theme-placeholder) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-boost));
  --tt-text-faint: color-mix(in oklab, var(--tt-composer-text-faint) 92%, var(--theme-text));
}
/* By day Changes divides its files, heads and hunks with the reading hairline, so the rules show on the light sidebar
   (Zach's pick B, ADR-0110 November 7 amendment). */
:root[data-theme='light'] .changes-surface { --tt-hairline: var(--tt-reading-hairline); }
/* The composer keeps exactly the inks it had: its secondary text stays on the quiet tier, and so do the menus it opens. */
.thread-prompt, .thread-followups, .followup-editor, .composer-picker, .screenshot-input, .thread-options-notices { --tt-text-muted: var(--tt-text-quiet); }
/* And the card and faint ink it was drawn in, where a theme parts them from the room's (the Sotto theme by day). Watcher's
   scene reads the card from its ink probe to set how see-through its composer is, so the probe keeps that card too. */
:root[data-theme='light'][data-theme-id='t3-code'] :is(.thread-prompt, .thread-followups, .followup-editor, .composer-picker, .screenshot-input, .thread-options-notices, .watcher-scene__ink) {
  --tt-card: var(--tt-composer-card);
  --tt-card-solid: var(--tt-composer-card);
  --tt-text-faint: var(--tt-composer-text-faint);
}
/* The reading surface: a thread's transcript, and not Watcher's conversation. */
.thread-pane:not(.watcher-pane) .thread-transcript {
  --tt-text: var(--tt-reading-text);
  --tt-text-2: var(--tt-reading-text-2);
  --tt-bubble-text: var(--tt-reading-bubble-text);
  --tt-code-text: var(--tt-reading-code-text);
  --tt-hairline: var(--tt-reading-hairline);
  --tt-code-border: var(--tt-reading-hairline);
  --threads-field-border: var(--tt-reading-field-border);
}

/* The effort colourways (ADR-0019). Ember and Theme accent come from theme roles; Cyberpunk, Rainbow, Aurora
   and Plasma are fixed palettes a theme does not carry. Keyed on the attribute alone, so a Settings swatch can
   wear a colourway the root does not; the bare `:root` line is the first paint before the setting arrives. */
:root, [data-effort-color='ember'] {
  --tt-effort-a: var(--theme-warning);
  --tt-effort-b: var(--theme-warning);
  --tt-effort-c: color-mix(in srgb, var(--theme-warning) 60%, var(--tt-text));
  --tt-effort-border: var(--theme-warning);
  --effort-ink: color-mix(in oklab, var(--tt-warning) 70%, var(--tt-text));
  --effort-ink-light: var(--effort-ink);
}
/* A custom property substitutes its var()s where it is declared, so an element wearing its own colourway
   re-derives the gradients from its own hues here rather than inheriting the root's. */
[data-effort-color] {
  --tt-effort-text-fill: var(--tt-effort-text);
  --tt-effort-text-image: none;
  --tt-effort-fill-image: linear-gradient(90deg, var(--tt-effort-a), var(--tt-effort-b), var(--tt-effort-c));
  --tt-effort-wash-image: linear-gradient(to top, var(--tt-effort-a), var(--tt-effort-b), var(--tt-effort-c));
}
[data-effort-color='accent'] {
  --tt-effort-a: var(--theme-accent);
  --tt-effort-b: var(--theme-accent);
  --tt-effort-c: color-mix(in srgb, var(--theme-accent) 55%, var(--tt-text));
  --tt-effort-border: var(--theme-accent);
  --effort-ink: var(--tt-accent-text);
  --effort-ink-light: var(--tt-accent-text);
}
/* The fixed palettes name a bright ink for dark rooms and a deep one of the same hue for light, where a
   bright neon mixed toward the text would still fall short of 4.5:1 on a light card. */
[data-effort-color='cyberpunk'] {
  --tt-effort-a: oklch(0.7 0.3 345);
  --tt-effort-b: oklch(0.62 0.27 305);
  --tt-effort-c: oklch(0.86 0.15 200);
  --tt-effort-border: oklch(0.7 0.3 345);
  --effort-ink: oklch(0.86 0.15 200);
  --effort-ink-light: oklch(0.44 0.22 335);
}
[data-effort-color='aurora'] {
  --tt-effort-a: oklch(0.86 0.18 160);
  --tt-effort-b: oklch(0.82 0.14 200);
  --tt-effort-c: oklch(0.68 0.22 300);
  --tt-effort-border: oklch(0.82 0.14 200);
  --effort-ink: oklch(0.87 0.16 165);
  --effort-ink-light: oklch(0.44 0.12 175);
}
[data-effort-color='plasma'] {
  --tt-effort-a: oklch(0.42 0.25 300);
  --tt-effort-b: oklch(0.68 0.29 350);
  --tt-effort-c: oklch(0.86 0.18 75);
  --tt-effort-border: oklch(0.68 0.29 350);
  --effort-ink: oklch(0.8 0.2 20);
  --effort-ink-light: oklch(0.45 0.22 350);
}
/* Rainbow paints its word as the spectrum itself; the ink is the fallback where text cannot clip a gradient. */
[data-effort-color='rainbow'] {
  --tt-effort-a: oklch(0.7 0.24 20);
  --tt-effort-b: oklch(0.8 0.2 130);
  --tt-effort-c: oklch(0.7 0.24 300);
  --tt-effort-border: oklch(0.7 0.22 300);
  --effort-ink: oklch(0.82 0.16 200);
  --effort-ink-light: oklch(0.44 0.2 290);
  --effort-spectrum: linear-gradient(90deg, oklch(0.7 0.24 20), oklch(0.82 0.18 70), oklch(0.85 0.2 130), oklch(0.85 0.14 200), oklch(0.65 0.24 280), oklch(0.7 0.28 340));
  --tt-effort-text-fill: transparent;
  --tt-effort-text-image: var(--effort-spectrum);
  --tt-effort-fill-image: var(--effort-spectrum);
  --tt-effort-wash-image: var(--effort-spectrum);
}
:root[data-theme='light'][data-effort-color='rainbow'], [data-theme-scope='light'][data-effort-color='rainbow'] {
  --tt-effort-text-image: linear-gradient(90deg, oklch(0.55 0.22 20), oklch(0.6 0.16 70), oklch(0.58 0.18 140), oklch(0.55 0.13 210), oklch(0.5 0.22 280), oklch(0.55 0.25 340));
}

/* Glass, the see-through theme (ADR-0150). appearance.ts marks the root data-glass only while Glass paints and writes
   its tints as --theme-glass-*: the room once over whatever is behind the window, and the sidebar, its rows, the cards
   and the user's messages translucent over the room. Menus, dialogs, fields, code and the terminal keep their solid
   roles. Where nothing is drawn behind the window the room sits on the backdrop, a quiet gradient in the theme's own
   hues (in-app glass). Last in the file, so it outranks the light block's card. */
:root[data-glass] {
  --tt-glass-room: var(--theme-glass-room);
  --tt-glass-backdrop: linear-gradient(135deg, var(--theme-glass-backdrop-1), var(--theme-glass-backdrop-2) 55%, var(--theme-glass-backdrop-3));
  --tt-sidebar: var(--theme-glass-sidebar);
  --tt-card: var(--theme-glass-raised);
  --tt-bubble: var(--theme-glass-message);
  --tt-sidebar-row-hover: var(--theme-glass-row-hover);
  --tt-sidebar-row-active: var(--theme-glass-row-active);
  --tt-sidebar-row-selected: var(--theme-glass-row-selected);
  --tt-selected: var(--theme-glass-row-selected);
  /* Glass's muted text stands close to its body text by night (oklch 0.86 against 0.985), so the prompt's hint mixes it
     with the room's solid colour too, 86% muted, which keeps it 2:1 from typed words and 4.5:1 on the glass card over
     pure white or black behind the window, at every Contrast (Zach's pick on October 31, 2026). */
  --tt-text-hint: color-mix(in oklab, color-mix(in oklab, color-mix(in oklab, var(--theme-text-muted) 86%, var(--theme-canvas)) var(--theme-contrast-base), var(--theme-canvas)), var(--theme-contrast-target) var(--theme-contrast-hint-boost));
}
/* By day the room can go as dark as its tint over black, so the status green deepens to keep 4.5:1 there. */
:root[data-glass][data-theme='light'] {
  --tt-success: oklch(0.4 0.1 158);
}

/* A mode or theme switch repaints at once: no colour transition runs mid-switch. */
:root[data-theme-switching] *,
:root[data-theme-switching] *::before,
:root[data-theme-switching] *::after {
  transition: none !important;
}

/* The model menu and the model chips in Settings draw each provider's mark from its colour (modelPicker.css). There
   the colour is the mark's, so by day the rail's and the chips' marks read as the sidebar's do. The composer's own
   chip keeps its look. */
:is(.model-picker__dialog, .settings-view .model-picker__trigger) {
  --tt-provider-codex: var(--tt-provider-codex-mark);
  --tt-provider-claude: var(--tt-provider-claude-mark);
  --tt-provider-grok: var(--tt-provider-grok-mark);
  --tt-provider-devin: var(--tt-provider-devin-mark);
}

.tt-dialog__actions .tt-button {
  min-height: 44px;
}

.tt-button {
  display: inline-flex;
  min-height: 34px;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px solid var(--tt-field-border);
  border-radius: var(--tt-radius-control);
  padding: 0 14px;
  background: var(--tt-surface);
  color: var(--tt-text-2);
  font-size: var(--tt-type-small);
  font-weight: 500;
  line-height: 1.2;
  white-space: nowrap;
  transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, filter 120ms ease, opacity 120ms ease;
}

.tt-button:hover:not(:disabled) {
  border-color: var(--tt-text-faint);
  color: var(--tt-text);
}

.tt-button:active:not(:disabled) {
  background: var(--tt-hover);
}

.tt-button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

.tt-button--primary {
  border-color: var(--tt-pill);
  background: var(--tt-pill);
  color: var(--tt-pill-ink);
  font-weight: 600;
}

.tt-button--primary:hover:not(:disabled) {
  border-color: var(--tt-pill);
  color: var(--tt-pill-ink);
  filter: brightness(1.12);
}

.tt-button--primary:active:not(:disabled) {
  background: var(--tt-pill);
  filter: brightness(0.94);
}

.tt-button--ghost {
  border-color: transparent;
  background: transparent;
  color: var(--tt-text-faint);
}

.tt-button--ghost:hover:not(:disabled) {
  border-color: transparent;
  color: var(--tt-text);
}

.tt-button--danger {
  border-color: transparent;
  background: transparent;
  color: var(--tt-error);
}

.tt-button--danger:hover:not(:disabled) {
  border-color: var(--tt-error-border);
  color: var(--tt-error-text);
}

.tt-dialog__actions .tt-button--danger {
  border-color: var(--tt-error);
  background: var(--tt-error);
  color: var(--tt-error-contrast);
}

.tt-dialog__actions .tt-button--danger:hover:not(:disabled) {
  background: color-mix(in srgb, var(--tt-error) 86%, var(--tt-canvas));
  color: var(--tt-error-contrast);
}

.tt-button--icon {
  width: 34px;
  padding: 0;
}

.tt-input,
.tt-select {
  width: 100%;
  min-height: 30px;
  border: 1px solid var(--tt-border-faint);
  border-radius: var(--tt-radius-control);
  background: var(--tt-surface-sunken);
  padding: 4px 12px;
  color: var(--tt-text);
  font-size: var(--tt-type-small);
  font-weight: 500;
  transition: border-color 120ms ease, background-color 120ms ease, opacity 120ms ease;
}

.tt-select {
  appearance: none;
  padding-right: 26px;
  background-image:
    linear-gradient(45deg, transparent 50%, var(--tt-text-muted) 50%),
    linear-gradient(135deg, var(--tt-text-muted) 50%, transparent 50%);
  background-position: calc(100% - 14px) 12px, calc(100% - 9px) 12px;
  background-repeat: no-repeat;
  background-size: 5px 5px;
}

.tt-input:hover:not(:disabled),
.tt-select:hover:not(:disabled) {
  border-color: var(--tt-border);
}

.tt-input:disabled,
.tt-select:disabled {
  cursor: not-allowed;
  opacity: 0.62;
}

.tt-input::placeholder {
  color: var(--tt-text-faint);
}

.tt-input[inputmode='numeric'],
.tt-input[inputmode='url'],
.tt-input[type='password'] {
  font-family: var(--tt-font-mono);
  font-size: var(--tt-type-caption);
  font-weight: 400;
}

.tt-input[type='password']::placeholder {
  font-family: var(--tt-font-ui);
  font-size: var(--tt-type-small);
}

.tt-input[inputmode='numeric'] {
  text-align: right;
}

.tt-dialog-backdrop {
  position: fixed;
  z-index: 50;
  display: grid;
  inset: 0;
  place-items: center;
  background: var(--tt-overlay);
  padding: 20px;
}

.tt-dialog {
  width: min(480px, 100%);
  max-height: calc(100dvh - 40px);
  overflow-y: auto;
  border: 1px solid var(--tt-hairline);
  border-radius: var(--tt-radius-md);
  background: var(--tt-surface-elevated);
  box-shadow: var(--tt-shadow-lg);
  padding: 24px;
}

.tt-dialog h2 {
  margin: 0;
  font-size: var(--tt-type-lead);
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.01em;
}

.tt-dialog__description {
  margin: 10px 0 20px;
  color: var(--tt-text-muted);
  font-size: var(--tt-type-small);
  line-height: 1.5;
}

.tt-dialog__status {
  margin: -8px 0 16px;
  border-left: 2px solid var(--tt-primary);
  border-radius: var(--tt-radius-sm);
  background: color-mix(in srgb, var(--tt-primary) 9%, transparent);
  padding: 10px 12px;
  color: var(--tt-text);
  font-size: var(--tt-type-small);
  line-height: 1.45;
}

.tt-dialog__status--error {
  border-left-color: var(--tt-error);
  background: color-mix(in srgb, var(--tt-error) 9%, transparent);
}

.tt-dialog__actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}

.tt-dialog__actions .tt-button {
  padding-inline: 16px;
  font-size: var(--tt-type-small);
}

/* Copied from src/renderer/src/styles/crossing-settings.css */
.settings-view { width: 100%; min-height: 0; padding: 0; }
.settings-layout { display: grid; grid-template-columns: 190px minmax(0, 720px); justify-content: center; gap: 50px; height: 100%; min-height: 0; padding: 0 40px; }
.settings-subnav { align-self: start; position: sticky; top: 0; padding-top: 35px; display: flex; flex-direction: column; gap: 4px; border: 0; }
.settings-subnav a { min-height: 32px; padding: 6px 0; border: 0; background: none; color: var(--tt-text-muted); font-size: var(--tt-type-body); font-weight: 400; }
.settings-subnav a[aria-current='true'], .settings-subnav a:hover { background: none; color: var(--tt-text); }
.settings-scroll { min-height: 0; overflow-y: auto; padding: 30px 0 60px; scrollbar-width: thin; scrollbar-color: var(--tt-scrollbar) transparent; }
.settings-section { margin: 0; padding: 0; border: 0; border-radius: 0; background: none; box-shadow: none; scroll-margin-top: 30px; }
.settings-section + .settings-section { margin-top: 68px; padding-top: 0; border: 0; }
.settings-section__heading { display: block; margin: 0 0 20px; padding: 0; border: 0; }
.settings-section__heading h2 { margin: 0 0 14px; font-size: var(--tt-type-title); font-weight: 500; letter-spacing: -1px; line-height: 1.2; font-variation-settings: 'opsz' 96; }
.settings-section__heading p { margin: 0; color: var(--tt-text-2); font-size: var(--tt-type-lead); line-height: 1.6; }
.settings-section__heading b { font-weight: 600; }
.settings-rows { display: block; border: 0; margin: 0; background: none; border-radius: 0; box-shadow: none; }
.settings-rows > *, .settings-rows > * + * { border: 0; border-top: 1px solid var(--tt-hairline); padding: 18px 0; }
.settings-rows .tt-field { display: grid; grid-template-columns: minmax(0, 1fr) minmax(120px, 230px); column-gap: 20px; align-items: center; }
.settings-rows .tt-field__label { font-size: var(--tt-type-reading); font-weight: 500; }
.settings-rows .tt-field__description { color: var(--tt-text-muted); font-size: var(--tt-type-small); line-height: 1.5; }
.settings-rows .tt-field > .tt-input, .settings-rows .tt-field > .tt-select { grid-column: 2; grid-row: 1 / span 2; width: 100%; max-width: 100%; min-width: 0; background: transparent; border-color: var(--tt-hairline); border-radius: var(--tt-radius-control); }
.settings-rows textarea.tt-input { border-radius: var(--tt-radius-control); }
.settings-rows .tt-toggle { display: flex; flex-direction: row; justify-content: space-between; align-items: center; gap: 24px; padding: 18px 0; }
.settings-rows .tt-toggle__copy { flex: 1; }
.settings-rows .tt-toggle__copy > strong { font-size: var(--tt-type-reading); font-weight: 500; }
.settings-rows .tt-toggle__track { flex: none; }
.settings-input-action { display: block; }
.settings-input-action:has(> .tt-button) { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.settings-input-action .tt-field { flex: 1; min-width: 0; }
.settings-model-statement h3 { font-size: var(--tt-type-reading); font-weight: 500; }
.settings-model-statement p { margin-top: 3px; color: var(--tt-text-muted); font-size: var(--tt-type-small); line-height: 1.5; }
.settings-rows > .settings-disclosure { max-width: 68ch; font-size: var(--tt-type-small); line-height: 1.65; }

@media (max-width: 880px) { .settings-layout { grid-template-columns: 140px minmax(0, 1fr); gap: 28px; padding: 0 24px; } .settings-rows .tt-field { grid-template-columns: minmax(0, 1fr) minmax(100px, 230px); } }

  .settings-layout { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 0 20px; }

/* A sunken track with the chosen segment raised out of it (ADR-0110). On a card the track sinks to the card's inset. */
.segmented-control { grid-area: control; display: inline-flex; align-items: center; justify-self: end; padding: 3px; border: 0; border-radius: var(--tt-radius-control); gap: 2px; background: var(--tt-surface-sunken); }

@media (max-width: 620px) { .settings-rows .tt-field { grid-template-areas: 'label' 'description' 'control' 'error'; } .segmented-control { justify-self: start; } }

/* Index: a stable category rail and one focused, independently scrolling form. The rail wears the frame of the
   Threads sidebar (its top row and its foot) at the width of that sidebar, which SettingsView hands it as

.settings-subnav button > span { flex: 1; }

.settings-find__results button:hover { background: var(--tt-sidebar-row-hover); }

/* A row of its own inside a group's card: the card's dividers already separate it. */
.settings-view .settings-rows > .settings-danger-row { border-top: 0; }
.settings-detail { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }

.settings-view .settings-section, .settings-view .settings-section + .settings-section { margin: 0; padding: 0; border: 0; border-radius: 0; background: none; box-shadow: none; }

  background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-repeat: no-repeat; background-size: 5px 5px; }

.settings-view .settings-input-action:has(> .tt-button) { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }

/* A row whose control is a button rather than an input: Linux's compositor bindings, which open their setup steps.
   Its label is a paragraph, not a label element, so it sheds the paragraph's margins to sit tight on its description. */

.settings-view .settings-rows p.tt-field__label { margin: 0; }
/* The microphone test is a row like the others on its card (ADR-0110, #1831): the label over its description, what the
   test found under both, and the level and the button at the row's end. */
.settings-view .settings-rows .settings-microphone-test > .settings-microphone-test__status { grid-area: error; margin: 6px 0 0; color: var(--tt-text-muted); font-size: var(--tt-type-small); line-height: 1.45; }
.settings-view .settings-rows .settings-microphone-test > .settings-microphone-test__status:empty { margin: 0; }
.settings-view .settings-rows .settings-microphone-test > .settings-microphone-test__controls { grid-area: control; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px 14px; min-width: 0; }
.settings-microphone-test__controls .voice-wave { flex: none; }
.settings-feedback { flex: none; padding: 16px 6vw 0; }
.settings-view .settings-notice { width: 100%; max-width: 790px; margin: 0 auto; padding: 10px 14px; border-radius: var(--tt-radius-row); font-size: var(--tt-type-body); line-height: 1.45; overflow-wrap: anywhere; }
.settings-view .settings-detail:has(.settings-feedback) .settings-scroll { padding-top: 20px; }
.settings-view .settings-updates { margin-top: 30px; }

.settings-view .settings-updates .settings-section__heading p { font-size: var(--tt-type-body); }
/* A group of rows under a small heading with its icon (SettingsGroup), as Git and Cloud iPhone group theirs. */

.settings-view .settings-group:first-child { margin-top: 22px; }
.settings-view .settings-group > h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; padding: 0 2px; color: var(--tt-text-2); font-size: var(--tt-type-body); font-weight: 600; line-height: 1.35; }

.settings-view .settings-danger-row { gap: 24px; }
.settings-view .settings-danger-row h3 { font-size: var(--tt-type-reading); }
.settings-view .settings-danger-row p { font-size: var(--tt-type-small); line-height: 1.5; }
/* Nested production account controls share the focused form. Settings → Providers styles its own list (providers.css). */

.settings-view .account-rows input:not([type='checkbox'], [type='range']), .settings-view .account-rows select { min-height: 38px; padding: 7px 12px; border-radius: var(--tt-radius-control); font-size: var(--tt-type-body); }
