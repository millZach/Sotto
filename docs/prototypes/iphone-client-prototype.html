<!doctype html>
<!--
  PROTOTYPE — throwaway. Three directions for the iPhone client, switchable via ?variant=A|B|C.
  Verdict (September 26, 2026): B, "Needs you". Permissions answer on their card; threads read as chat
  bubbles; the host is found by its name on the tailnet. docs/plans/ios-client.md records the pick.
  Each variant shows the first-client screens (pair, threads, thread, question, permission,
  unconfirmed reply, reconnect) and three "next" sketches (new thread, voice, notification).
  No host calls, no persistence. Colours are Sotto's default palette (src/shared/themes/palettes.ts).
  Run: node docs/prototypes/composer-selectors-serve.mjs, then open
  http://127.0.0.1:4173/docs/prototypes/iphone-client-prototype.html
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sotto for iPhone — prototype</title>
<style>
@font-face{font-family:Figtree;src:url('/src/renderer/src/assets/fonts/figtree-latin.woff2') format('woff2');font-weight:300 900}
@font-face{font-family:'Spline Sans Mono';src:url('/src/renderer/src/assets/fonts/spline-sans-mono-latin.woff2') format('woff2');font-weight:300 700}

/* Sotto default palette, dark and light halves */
:root,[data-theme=dark]{
  --canvas:oklch(0.115 0.008 265);--surface:oklch(0.145 0.008 265);--raised:oklch(0.185 0.008 265);--overlay:oklch(0.215 0.008 265);
  --text:oklch(0.985 0.005 280);--muted:oklch(0.72 0.014 265);--placeholder:oklch(0.675 0.012 270);
  --border:oklch(0.305 0.02 265);--hair:oklch(0.22 0.012 265);--input:oklch(0.375 0.024 265);
  --accent:oklch(0.714 0.104 183.1);--accent-fg:oklch(0.16 0.012 190);--accent-surface:oklch(0.32 0.05 185);--accent-surface-fg:oklch(0.985 0.005 280);
  --message:oklch(0.205 0.014 265);--code-bg:oklch(0.155 0.008 265);
  --warning:oklch(0.772 0.173 65.4);--warning-fg:oklch(0.829 0.171 81);--warning-surface:oklch(0.315 0.032 80);
  --error-fg:oklch(0.702 0.189 22.2);--error-surface:oklch(0.29 0.04 20);
  --scrim:oklch(0 0 0 / .55);--key:oklch(0.3 0.008 265);--kbd:oklch(0.17 0.008 265);
  --page:#161618;--page-text:#e8e8ea;--page-muted:#a0a0a8;--bezel:#050506;
}
[data-theme=light]{
  --canvas:oklch(0.978 0.004 85);--surface:oklch(0.99 0.003 85);--raised:oklch(0.955 0.006 85);--overlay:oklch(0.945 0.007 85);
  --text:oklch(0.235 0.014 75);--muted:oklch(0.5 0.014 75);--placeholder:oklch(0.535 0.015 78);
  --border:oklch(0.86 0.012 80);--hair:oklch(0.915 0.008 80);--input:oklch(0.83 0.012 80);
  --accent:oklch(0.53 0.095 186);--accent-fg:oklch(0.99 0.003 85);--accent-surface:oklch(0.92 0.03 186);--accent-surface-fg:oklch(0.235 0.014 75);
  --message:oklch(0.93 0.012 85);--code-bg:oklch(0.945 0.007 85);
  --warning:oklch(0.772 0.173 65.4);--warning-fg:oklch(0.547 0.156 45.4);--warning-surface:oklch(0.955 0.018 80);
  --error-fg:oklch(0.509 0.209 28.5);--error-surface:oklch(0.94 0.02 25);
  --scrim:oklch(0.2 0 0 / .35);--key:oklch(1 0 0);--kbd:oklch(0.88 0.006 85);
  --page:#e7e7ea;--page-text:#1c1c1f;--page-muted:#5a5a62;--bezel:#111113;
}

*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--page-text);font:15px/1.5 Figtree,system-ui,sans-serif;padding:40px 40px 120px}
.page-head{max-width:1100px;margin:0 0 36px}
.page-head .kicker{font-size:13px;color:var(--page-muted);letter-spacing:.02em;margin:0 0 6px}
.page-head h1{font-size:30px;margin:0 0 10px;letter-spacing:-.02em;font-weight:650}
.page-head p{margin:0 0 6px;max-width:820px;color:var(--page-muted)}
.page-head p b{color:var(--page-text);font-weight:600}
h2.band{font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--page-muted);margin:36px 0 18px;border-top:1px solid color-mix(in oklab,var(--page-muted) 30%,transparent);padding-top:18px}
.row{display:flex;flex-wrap:wrap;gap:36px 28px;align-items:flex-start}
.cell{width:calc(414px * var(--z,.8))}
.frame{zoom:var(--z,.8);width:414px;height:868px;border-radius:62px;background:var(--bezel);padding:12px;box-shadow:0 30px 60px -30px #0008}
.cap{margin-top:12px;font-size:14px}
.cap b{display:block;font-weight:600}
.cap span{color:var(--page-muted);font-size:13px;display:block;line-height:1.45}

/* ---------- inside the phone ---------- */
.phone{position:relative;width:390px;height:844px;border-radius:50px;overflow:hidden;background:var(--canvas);color:var(--text);font:17px/1.45 Figtree,system-ui,sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.phone :where(button){font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.sb{flex:none;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 44px;font-size:17px;font-weight:600;position:relative;z-index:5}
.sb .island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000}
.sb .icons{display:flex;gap:6px;align-items:center}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:var(--text);opacity:.85;z-index:30}
.ic{flex:none;display:block}
.fill{flex:1;min-height:0;overflow:hidden;position:relative}
.mono{font-family:'Spline Sans Mono',ui-monospace,monospace;font-size:14px}
.muted{color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.s-waiting,.s-question{background:var(--warning)}
.s-running{background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.s-idle{background:var(--muted);opacity:.55}
.s-error{background:var(--error-fg)}
.t-waiting,.t-question{color:var(--warning-fg)}
.t-running{color:var(--accent)}
.t-error{color:var(--error-fg)}
@keyframes pulse{50%{opacity:.35}}
.caret{display:inline-block;width:2px;height:1.05em;vertical-align:-3px;background:var(--accent);margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wave{display:flex;align-items:center;gap:3px;height:36px}
.wave i{display:block;width:3px;border-radius:2px;background:var(--accent);animation:wv 1.1s ease-in-out infinite}
@keyframes wv{50%{transform:scaleY(.35)}}
.rm *,.rm *::before,.rm *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;font-weight:600!important;font-size:17px;padding:0 18px}
.btn.accent{background:var(--accent);color:var(--accent-fg)}
.btn.plain{background:var(--raised);color:var(--text)}
.btn.ghost{color:var(--accent)}
.btn.sm{min-height:44px;font-size:15px;border-radius:12px;padding:0 14px}
.field{border:1px solid var(--border);background:var(--surface);border-radius:12px;min-height:50px;display:flex;align-items:center;padding:0 14px;font-size:17px}
.lbl{font-size:14px;color:var(--muted);margin:0 0 8px}
.codebox{background:var(--code-bg);border:1px solid var(--hair);border-radius:10px;padding:10px 12px}
.kbd{flex:none;background:var(--kbd);padding:8px 3px 40px;display:grid;gap:11px}
.kbd .kr{display:flex;justify-content:center;gap:6px}
.kbd .k{height:42px;min-width:32px;flex:0 0 32px;border-radius:6px;background:var(--key);display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 1px 0 #0004}
.kbd .k.w{flex:0 0 44px;font-size:15px}
.kbd .k.sp{flex:0 0 184px;font-size:15px}
.kbd .k.rt{flex:0 0 88px;font-size:15px;background:var(--accent);color:var(--accent-fg)}

/* ---------- A: Room ---------- */
.a-nav{flex:none;height:52px;display:flex;align-items:center;gap:4px;padding:0 8px;border-bottom:1px solid var(--hair)}
.a-nav .t{flex:1;min-width:0;text-align:center}
.a-nav .t b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-nav .t small{display:block;font-size:12px;color:var(--muted);line-height:1.2}
.a-nav .nb{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--accent);border-radius:10px}
.a-host{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:18px;background:var(--raised);font-size:15px;font-weight:600}
.a-big{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:4px 20px 12px}
.a-search{margin:0 20px 8px;height:38px;border-radius:10px;background:var(--raised);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--placeholder);font-size:17px}
.a-sec{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:18px 20px 4px}
.a-row{display:flex;gap:12px;padding:12px 20px 12px 20px;align-items:flex-start}
.a-row + .a-row .a-rm{border-top:1px solid var(--hair)}
.a-row .dot{margin-top:9px}
.a-rm{flex:1;min-width:0;margin-top:-12px;padding-top:12px}
.a-rt{display:flex;gap:10px;align-items:baseline}
.a-rt b{flex:1;font-weight:600;font-size:17px;line-height:1.3}
.a-rt time{font-size:14px;color:var(--muted);flex:none}
.a-rs{font-size:15px;color:var(--muted);margin-top:2px}
.a-room{padding:18px 20px 12px;display:flex;flex-direction:column;gap:20px}
.a-user{background:var(--message);border-radius:16px;padding:12px 16px;align-self:flex-end;max-width:88%}
.a-steps{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.a-steps div{display:flex;gap:8px;align-items:center}
.a-steps em{font-style:normal;margin-left:auto}
.a-agent p{margin:0 0 12px}.a-agent p:last-child{margin:0}
.a-dock{flex:none;padding:8px 12px 30px;border-top:1px solid var(--hair);background:var(--canvas)}
.a-comp{display:flex;align-items:flex-end;gap:8px}
.a-comp .f{flex:1;min-height:44px;border:1px solid var(--border);border-radius:22px;padding:10px 16px;color:var(--placeholder);font-size:17px;line-height:1.35;background:var(--surface)}
.a-comp .send{width:44px;height:44px;border-radius:22px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center}
.a-comp .send.off{background:var(--raised);color:var(--muted)}
.a-comp .stop{height:44px;padding:0 16px;border-radius:22px;background:var(--raised);display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600}
.a-req{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px 14px 12px;margin:0 0 10px}
.a-req h4{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--warning-fg);letter-spacing:.03em;text-transform:uppercase}
.a-req p{margin:0 0 10px;font-weight:600}
.a-opt{display:flex;gap:12px;padding:10px 4px;border-top:1px solid var(--hair);align-items:flex-start}
.a-opt .r{width:22px;height:22px;border-radius:50%;border:2px solid var(--input);flex:none;margin-top:1px}
.a-opt.on .r{border:7px solid var(--accent)}
.a-opt b{display:block;font-weight:600;font-size:16px}
.a-opt small{display:block;font-size:14px;color:var(--muted);line-height:1.35}
.a-two{display:flex;gap:8px;margin-top:12px}.a-two .btn{flex:1}
.a-note{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--warning-fg);align-self:flex-end;max-width:88%;margin-top:-12px}
.a-banner{flex:none;display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--warning-surface);font-size:15px}
.a-banner div{flex:1}
.a-banner b{display:block;font-weight:600}
.dim{opacity:.55}
.a-sheet{position:absolute;inset:auto 0 0 0;top:60px;background:var(--surface);border-radius:14px 14px 0 0;z-index:10;display:flex;flex-direction:column}
.a-sheethd{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--hair)}
.a-sheethd b{font-size:17px}
.a-group{margin:18px 16px 0;background:var(--raised);border-radius:14px}
.a-group > div{display:flex;align-items:center;min-height:48px;padding:0 14px;gap:10px;font-size:17px}
.a-group > div + div{border-top:1px solid var(--hair)}
.a-group span{flex:1}
.a-group em{font-style:normal;color:var(--muted)}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:9}

/* ---------- B: Needs you ---------- */
.b-top{flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 20px 0;height:44px}
.b-top .hostchip{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.b-title{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0 20px 4px;display:flex;align-items:baseline;gap:10px}
.b-title small{font-size:17px;font-weight:600;color:var(--warning-fg)}
.b-sub{margin:0 20px 14px;font-size:15px;color:var(--muted)}
.b-card{margin:0 16px 12px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:14px 16px 14px}
.b-card .who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-bottom:6px}
.b-card .who b{color:var(--text);font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.b-card p{margin:0 0 10px;font-size:17px}
.b-card .acts{display:flex;gap:8px}.b-card .acts .btn{flex:1}
.b-mini{display:flex;flex-direction:column;gap:6px}
.b-mini button{display:flex;align-items:center;gap:10px;background:var(--raised);min-height:44px;border-radius:12px;padding:8px 12px;text-align:left;font-size:15px}
.b-mini button > span{display:block}
.b-mini b{display:block;font-weight:600;font-size:15px}
.b-mini small{display:block;font-size:13px;color:var(--muted);line-height:1.35}
.b-empty{margin:6px 16px 12px;padding:26px 20px;border:1px dashed var(--border);border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--muted);font-size:15px}
.b-empty b{color:var(--text);font-size:17px;font-weight:600}
.b-empty svg{color:var(--accent)}
.b-acts{padding:4px 16px}
.b-acts > div{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--hair);color:var(--muted)}
.b-acts .m{flex:1;min-width:0}
.b-acts .m b{display:block;color:var(--text);font-weight:600;font-size:15px}
.b-acts .m span{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-acts em{font-style:normal;font-size:13px;flex:none}
.b-acts .live{color:var(--accent);border-bottom:0}
.b-unconf{align-self:flex-end;max-width:80%;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--warning-fg);margin-top:-8px}
.b-unconf .btn{min-height:32px;padding:0 4px;font-size:14px}
.b-live{margin:4px 16px 0;border-top:1px solid var(--hair)}
.b-live > div{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--hair)}
.b-live b{display:block;font-weight:600;font-size:16px}
.b-live small{display:block;font-size:14px;color:var(--muted)}
.b-tabs{flex:none;display:flex;border-top:1px solid var(--hair);padding:6px 0 30px;background:var(--surface)}
.b-tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px!important;font-weight:600!important;color:var(--muted)!important;position:relative;min-height:44px}
.b-tabs button.on{color:var(--accent)!important}
.b-tabs .badge{position:absolute;top:-2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--warning);color:#1a1300;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.b-seg{display:flex;margin:4px 16px 10px;background:var(--raised);border-radius:10px;padding:2px}
.b-seg span{flex:1;text-align:center;font-size:14px;font-weight:600;padding:6px 0;border-radius:8px;color:var(--muted)}
.b-seg span.on{background:var(--overlay);color:var(--text);box-shadow:0 1px 3px #0003}
.b-list > div{display:flex;gap:12px;padding:10px 20px;align-items:center}
.b-mono{width:36px;height:36px;border-radius:10px;background:var(--raised);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;color:var(--muted);position:relative}
.b-mono .dot{position:absolute;right:-2px;top:-2px;border:2px solid var(--canvas);width:12px;height:12px}
.b-list .m{flex:1;min-width:0;border-bottom:1px solid var(--hair);padding-bottom:10px;margin-bottom:-10px}
.b-list b{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-list small{display:block;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-nav{flex:none;display:flex;align-items:center;height:48px;padding:0 6px;gap:2px}
.b-nav .nb{height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:17px}
.b-nav .t{flex:1;text-align:center;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-flag{flex:none;margin:0 12px 6px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--warning-surface);font-size:15px}
.b-flag div{flex:1}
.b-flag b{font-weight:600}
.b-chat{padding:8px 16px;display:flex;flex-direction:column;gap:14px}
.b-u{align-self:flex-end;max-width:80%;background:var(--accent-surface);color:var(--accent-surface-fg);padding:10px 14px;border-radius:20px 20px 6px 20px}
.b-a{align-self:flex-start;max-width:88%;background:var(--surface);border:1px solid var(--hair);padding:10px 14px;border-radius:20px 20px 20px 6px}
.b-a p{margin:0 0 8px}.b-a p:last-child{margin:0}
.b-who{font-size:12px;color:var(--muted);margin:0 0 -8px 6px}
.b-comp{flex:none;display:flex;gap:8px;align-items:center;padding:8px 12px 30px}
.b-comp .f{flex:1;height:40px;border-radius:20px;background:var(--raised);padding:0 16px;display:flex;align-items:center;color:var(--placeholder)}
.b-comp .c{width:40px;height:40px;border-radius:20px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center}
.b-comp .c.off{background:var(--raised);color:var(--muted)}
.b-sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:28px 28px 0 0;z-index:10;padding:8px 20px 40px;box-shadow:0 -10px 40px #0005}
.b-sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--input);margin:0 auto 14px}
.b-sheet h3{margin:0 0 4px;font-size:22px;letter-spacing:-.01em}
.b-sheet .from{font-size:14px;color:var(--muted);margin:0 0 16px}
.b-choice{display:block;width:100%;text-align:left;background:var(--raised);border-radius:14px;padding:12px 14px;margin:0 0 8px;border:2px solid transparent}
.b-choice.on{border-color:var(--accent)}
.b-choice b{display:block;font-weight:600;font-size:16px}
.b-choice small{display:block;font-size:14px;color:var(--muted);line-height:1.35}
.b-toast{position:absolute;top:104px;left:16px;right:16px;z-index:8;display:flex;gap:10px;align-items:center;background:var(--overlay);border:1px solid var(--border);border-radius:16px;padding:10px 12px 10px 14px;font-size:15px;box-shadow:0 10px 30px #0004}
.b-toast div{flex:1}
.b-hostcard{margin:6px 16px 0;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px}
.b-hostcard .st{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;margin:4px 0 4px}
.b-kv{margin:14px 16px 0;background:var(--surface);border-radius:16px}
.b-kv > div{display:flex;justify-content:space-between;min-height:46px;align-items:center;padding:0 16px;font-size:16px}
.b-kv > div + div{border-top:1px solid var(--hair)}
.b-kv em{font-style:normal;color:var(--muted)}
.b-slots{display:flex;gap:8px;justify-content:center;margin:26px 0 8px}
.b-slots span{width:46px;height:58px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:600;font-family:'Spline Sans Mono',monospace}
.b-slots span.cur{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 30%,transparent)}
.b-slots .sep{width:10px;border:0;background:none;color:var(--muted)}
.b-chips{display:flex;gap:8px;flex-wrap:wrap;padding:6px 16px}
.b-chips span{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;background:var(--raised);font-size:15px;font-weight:600}

/* ---------- C: Dock ---------- */
.c-strip{flex:none;display:flex;gap:8px;padding:6px 12px 10px;overflow:hidden;align-items:center}
.c-pill{flex:none;display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:18px;background:var(--raised);font-size:14px;font-weight:600;max-width:170px;white-space:nowrap}
.c-pill span{overflow:hidden;text-overflow:ellipsis}
.c-pill.on{background:var(--text);color:var(--canvas)}
.c-pill.all{background:none;border:1px solid var(--border);padding:0 10px}
.c-head{padding:6px 22px 0}
.c-head h2{margin:0;font-size:24px;line-height:1.2;letter-spacing:-.015em;font-weight:700}
.c-head small{display:block;margin-top:6px;font-size:14px;color:var(--muted)}
.c-room{padding:18px 22px 20px;display:flex;flex-direction:column;gap:18px}
.c-you{border-left:3px solid var(--accent);padding:2px 0 2px 14px;color:var(--muted)}
.c-you b{display:block;color:var(--text);font-weight:500}
.c-stepline{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center}
.c-agent p{margin:0 0 12px}.c-agent p:last-child{margin:0}
.c-fade{position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(transparent,var(--canvas));pointer-events:none}
.c-dock{flex:none;margin:0 10px 30px;background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:8px;box-shadow:0 8px 30px #0003}
.c-to{font-size:13px;color:var(--muted);padding:2px 10px 6px;display:flex;align-items:center;gap:6px}
.c-to b{color:var(--text);font-weight:600}
.c-inp{display:flex;align-items:center;gap:6px}
.c-inp .f{flex:1;padding:10px 10px;color:var(--placeholder);font-size:17px;min-height:44px}
.c-go{width:44px;height:44px;border-radius:22px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;flex:none}
.c-go.alt{background:var(--raised);color:var(--text)}
.c-go.off{background:var(--raised);color:var(--muted)}
.c-q{padding:6px 8px 4px}
.c-q .h{font-size:13px;font-weight:600;color:var(--warning-fg);margin:0 0 4px;display:flex;align-items:center;gap:6px}
.c-q p{margin:0 0 10px;font-weight:600;font-size:17px;line-height:1.35}
.c-opt{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;border-radius:16px;background:var(--raised);padding:8px 14px;margin:0 0 6px;text-align:left;font-size:16px;font-weight:600}
.c-opt small{display:block;font-weight:400;font-size:13px;color:var(--muted);line-height:1.3}
.c-opt.on{background:var(--accent-surface);color:var(--accent-surface-fg)}
.c-opt.on small{color:inherit;opacity:.8}
.c-two{display:flex;gap:6px}.c-two .btn{flex:1;border-radius:18px}
.c-over{padding:4px 12px 0;display:flex;flex-direction:column;gap:10px}
.c-tile{background:var(--surface);border:1px solid var(--hair);border-radius:22px;padding:14px 16px;position:relative;overflow:hidden}
.c-tile .top{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:4px}
.c-tile .top em{margin-left:auto;font-style:normal}
.c-tile b{display:block;font-size:17px;font-weight:600;line-height:1.3;margin-bottom:4px}
.c-tile p{margin:0;font-size:15px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-tile.need{border-color:color-mix(in oklab,var(--warning) 55%,transparent)}
.c-bar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:2px 16px 4px;height:44px}
.c-bar .host{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px}
.c-status{display:flex;align-items:center;gap:10px;padding:8px 10px 4px;font-size:15px}
.c-status div{flex:1}
.c-pairlog{padding:30px 24px 0;display:flex;flex-direction:column;gap:16px}
.c-pairlog .sys{color:var(--muted);font-size:16px}
.c-pairlog .sys b{color:var(--text);font-weight:600}
.c-pairlog .me{align-self:flex-end;background:var(--message);border-radius:16px;padding:10px 14px;font-family:'Spline Sans Mono',monospace;font-size:15px}

/* ---------- lock screen / island ---------- */
.lock{position:absolute;inset:0;background:linear-gradient(170deg,color-mix(in oklab,var(--accent) 35%,var(--canvas)) 0%,var(--canvas) 55%);display:flex;flex-direction:column;align-items:center}
.lock .date{margin-top:64px;font-size:20px;font-weight:600;opacity:.85}
.lock .clock{font-size:92px;font-weight:700;line-height:1;letter-spacing:-.03em;margin-top:2px}
.note{width:calc(100% - 24px);margin-top:auto;background:color-mix(in oklab,var(--surface) 82%,transparent);backdrop-filter:blur(20px);border-radius:22px;padding:12px 14px;font-size:15px;line-height:1.35}
.note .hd{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:4px}
.note .app{width:22px;height:22px;border-radius:6px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.note .hd em{margin-left:auto;font-style:normal}
.note b{font-weight:600}
.note-acts{width:calc(100% - 24px);margin-top:8px;background:color-mix(in oklab,var(--surface) 88%,transparent);border-radius:16px;overflow:hidden}
.note-acts div{min-height:48px;display:flex;align-items:center;padding:0 16px;font-size:17px;justify-content:space-between}
.note-acts div + div{border-top:1px solid var(--hair)}
.live{width:calc(100% - 24px);margin-top:10px;background:#000;color:#fff;border-radius:24px;padding:14px 16px}
.live .r{display:flex;align-items:center;gap:10px;font-size:15px}
.live .bar{height:5px;border-radius:3px;background:#333;margin-top:10px;overflow:hidden}
.live .bar i{display:block;height:100%;width:62%;background:oklch(0.714 0.104 183.1);border-radius:3px}
.isl{position:absolute;top:10px;left:10px;right:10px;background:#000;color:#fff;border-radius:40px;padding:16px 18px 16px;z-index:20;font-size:15px}
.isl .r{display:flex;align-items:center;gap:10px}
.isl .cmd{margin:10px 0 12px;font-family:'Spline Sans Mono',monospace;font-size:13px;background:#1c1c1e;border-radius:10px;padding:8px 10px;color:#ddd}
.isl .two{display:flex;gap:8px}
.isl .two span{flex:1;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-weight:600;background:#2c2c2e}
.isl .two span.go{background:oklch(0.714 0.104 183.1);color:oklch(0.16 0.012 190)}
.otherapp{position:absolute;inset:0;background:var(--raised);display:flex;flex-direction:column;padding:120px 20px 0;gap:14px}
.otherapp i{display:block;height:14px;border-radius:7px;background:var(--overlay)}

/* ---------- prototype switcher (not part of the design) ---------- */
.proto-bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:#000;color:#fff;border-radius:999px;padding:6px;box-shadow:0 10px 30px #0006;z-index:1000;font:600 14px/1 system-ui,sans-serif;outline:2px solid #ffffff22}
.proto-bar button{background:none;border:0;color:#fff;min-width:40px;height:40px;border-radius:20px;cursor:pointer;font:inherit;padding:0 12px}
.proto-bar button:hover{background:#ffffff1a}
.proto-bar button:focus-visible{outline:2px solid #6ee7d8}
.proto-bar .lab{min-width:220px;text-align:center}
.proto-bar .sep{width:1px;height:22px;background:#ffffff33;margin:0 4px}
</style>
</head>
<body>
<header class="page-head" id="head"></header>
<main id="stage"></main>
<nav class="proto-bar" aria-label="Prototype controls">
  <button id="prev" aria-label="Previous variant">&larr;</button>
  <span class="lab" id="lab"></span>
  <button id="next" aria-label="Next variant">&rarr;</button>
  <span class="sep"></span>
  <button id="theme"></button>
  <button id="motion"></button>
  <button id="zoom"></button>
</nav>
<script>
/* ---------- icons ---------- */
const P = {
  back:'<path d="M15 18l-6-6 6-6"/>', chev:'<path d="M9 6l6 6-6 6"/>', down:'<path d="M6 9l6 6 6-6"/>',
  up:'<path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>', plus:'<path d="M12 5v14M5 12h14"/>',
  mic:'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  more:'<circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>', term:'<path d="M4 17l5-5-5-5M12 18h8"/>',
  file:'<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/>', alert:'<path d="M12 3.5l9.5 17h-19z"/><path d="M12 10v4.5M12 17.6v.2"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>', check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
  host:'<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>',
  inbox:'<path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/>', list:'<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
  refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>', stop:'<rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/>',
  spin:'<path d="M12 3a9 9 0 1 0 9 9" />', grid:'<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>', branch:'<circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 8v8M18 10c0 4-6 3-10 6"/>',
  bot:'<rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 4v4M9 13h.01M15 13h.01"/>', keyboard:'<rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>',
}
const ic = (n, s = 20, cls = '') => `<svg class="ic ${cls}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`

const sbIcons = `<span class="icons"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 11.5l2.2-2.4a3.2 3.2 0 0 0-4.4 0zM3.6 6.9a6.3 6.3 0 0 1 8.8 0l1.4-1.5a8.4 8.4 0 0 0-11.6 0zM.8 3.9a10.4 10.4 0 0 1 14.4 0L16 3A11.6 11.6 0 0 0 0 3z"/></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity=".4"/></svg></span>`
const sb = (time = '9:41') => `<div class="sb"><span>${time}</span><span class="island"></span>${sbIcons}</div>`
const phone = inner => `<div class="frame"><div class="phone">${inner}<span class="home"></span></div></div>`
const kbd = (ret = 'return') => {
  const r = s => `<div class="kr">${[...s].map(c => `<span class="k">${c}</span>`).join('')}</div>`
  return `<div class="kbd">${r('qwertyuiop')}${r('asdfghjkl')}<div class="kr"><span class="k w">⇧</span>${[...'zxcvbnm'].map(c => `<span class="k">${c}</span>`).join('')}<span class="k w">⌫</span></div><div class="kr"><span class="k w">123</span><span class="k sp">space</span><span class="k rt">${ret}</span></div></div>`
}
const wave = n => `<span class="wave">${Array.from({ length: n }, (_, i) => `<i style="height:${10 + ((i * 37) % 26)}px;animation-delay:${(i % 7) * -0.13}s"></i>`).join('')}</span>`

/* ---------- shared fixture (plain words, glossary nouns) ---------- */
const HOST = 'forge'
const STATUS = { waiting: 'Needs your answer', question: 'Asked you a question', running: 'Working', idle: 'Done', error: 'Stopped' }
const T = [
  { id: 'host', title: 'Keep the host running after the desktop quits', project: 'Sotto', provider: 'Claude Code', mono: 'C', state: 'waiting', when: 'now', last: 'Wants to run npm test -- tests/integration/host' },
  { id: 'ssh', title: 'Test the SSH path against a real sshd', project: 'Sotto', provider: 'Claude Code', mono: 'C', state: 'question', when: '4m', last: 'Which sshd should the CI test run against?' },
  { id: 'turn', title: 'Word a failed turn in plain sentences', project: 'Sotto', provider: 'Codex', mono: 'X', state: 'running', when: '1m', last: 'Running npm test -- tests/unit/agents' },
  { id: 'notes', title: 'Check the release notes for 0.1.19', project: 'Sotto releases', provider: 'Grok Build', mono: 'G', state: 'idle', when: '1h', last: 'The notes match the merged pull requests.' },
  { id: 'ctx', title: 'Name a 1M-context model by its base', project: 'Sotto', provider: 'Codex', mono: 'X', state: 'error', when: 'Yesterday', last: 'The turn stopped before it finished. Nothing was lost.' },
]
const byId = id => T.find(t => t.id === id)
const HOSTT = {
  user: 'Keep the host running when I close the desktop app. It should stop only on Stop host or Forget.',
  steps: [['file', 'Read 4 files', ''], ['file', 'Edited src/main/hosts/launcher.ts', '+42 −9'], ['file', 'Edited src/host/index.ts', '+18 −3'], ['term', 'Ran npm run typecheck', 'passed']],
  agent: ['The host now owns its running work. Closing the desktop leaves it running on forge, and the desktop picks up the same threads when it opens again.', 'Before I call it done I want to run the host’s integration tests.'],
  cmd: 'npm test -- tests/integration/host', cwd: '~/code/sotto',
}
const SSHT = {
  user: 'Test the SSH host path against a real sshd, in CI and by hand.',
  agent: 'CI can reach an sshd two ways, and they trade speed for realism.',
  q: 'Which sshd should the CI test run against?',
  opts: [['An OpenSSH container', 'The same version on every run. Adds about 20 seconds.'], ['The runner’s own sshd', 'Closer to a real machine. Differs between Windows and macOS.'], ['Both', 'The container on every push, the runner’s sshd nightly.']],
}
const TURNT = {
  user: 'When a Claude turn fails, say what happened in plain sentences, and only on the thread that failed.',
  steps: [['file', 'Read src/main/agents/claude.ts', ''], ['file', 'Edited src/renderer/src/agents/ThreadPane.tsx', '+27 −11']],
  live: 'Running npm test -- tests/unit/agents',
  agent: 'The notice now says what failed and whether anything was lost, then what to do next. I’m checking it only appears on the thread whose turn failed',
}
const NOTEST = {
  user: 'Check the release notes for 0.1.19 against the merged pull requests.',
  agent: 'The notes match. Every pull request merged since 0.1.18 has a line, and none is listed twice.',
  pending: 'Add a line for the long-context model fix too.',
}

/* ================================================================
   VARIANT A — Room: list, then one quiet full-width thread.
   Requests dock above the composer, inside the thread.
   ================================================================ */
const A = {}
A.nav = (title, sub, right = '') => `<div class="a-nav"><button class="nb" aria-label="Back to threads">${ic('back', 24)}</button><div class="t"><b>${title}</b><small>${sub}</small></div>${right || `<button class="nb" aria-label="Thread options">${ic('more', 22)}</button>`}</div>`
A.row = (t, dim = '') => `<div class="a-row ${dim}"><span class="dot s-${t.state}"></span><div class="a-rm"><div class="a-rt"><b>${t.title}</b><time>${t.when}</time></div><div class="a-rs"><span class="t-${t.state}">${STATUS[t.state]}</span> · ${t.provider}</div></div></div>`
A.list = ({ banner = '', dim = '' } = {}) => `${sb()}
  <div class="a-nav" style="border:0;justify-content:space-between;padding:0 16px">
    <button class="a-host" aria-label="Host details">${banner ? '<span class="dot" style="background:var(--muted)"></span>' : '<span class="dot" style="background:var(--accent)"></span>'}${HOST}${ic('down', 16)}</button>
    <span></span>
  </div>
  ${banner}
  <div class="fill ${dim}">
    <div class="a-big">Threads</div>
    <div class="a-search">${ic('search', 18)}Search</div>
    <div class="a-sec">Sotto</div>
    ${T.filter(t => t.project === 'Sotto').map(t => A.row(t)).join('')}
    <div class="a-sec">Sotto releases</div>
    ${A.row(byId('notes'))}
  </div>`
A.steps = steps => `<div class="a-steps">${steps.map(([i, s, e]) => `<div>${ic(i, 16)}<span>${s}</span>${e ? `<em>${e}</em>` : ''}</div>`).join('')}</div>`
A.comp = (mode = 'send', ph = 'Reply to this thread') => `<div class="a-comp"><div class="f">${ph}</div>${mode === 'stop' ? `<button class="stop" aria-label="Stop this turn">${ic('stop', 14)}Stop</button>` : `<button class="send ${mode === 'off' ? 'off' : ''}" aria-label="Send reply">${ic('up', 22)}</button>`}</div>`
A.hostThread = () => `<div class="a-room"><div class="a-user">${HOSTT.user}</div>${A.steps(HOSTT.steps)}<div class="a-agent">${HOSTT.agent.map(p => `<p>${p}</p>`).join('')}</div></div>`
A.screens = {
  pair: () => phone(`${sb()}
    <div class="fill" style="padding:36px 24px 0;display:flex;flex-direction:column">
      <div style="font-weight:700;font-size:20px;letter-spacing:-.01em;color:var(--accent)">Sotto</div>
      <h1 style="font-size:32px;line-height:1.15;letter-spacing:-.02em;margin:44px 0 10px">Pair with your host</h1>
      <p class="muted" style="margin:0 0 30px;font-size:17px">Read the pairing code on the host and enter it here.</p>
      <div class="lbl">Host address</div>
      <div class="field" style="margin-bottom:20px">https://forge.tail5c2e.ts.net</div>
      <div class="lbl">Pairing code</div>
      <div class="field mono" style="font-size:22px;letter-spacing:.2em">K7Q4MX</div>
      <p class="muted" style="font-size:14px;margin:18px 0 0">Pairing lets this iPhone read threads and reply. Whether it can answer permissions is decided on the host.</p>
      <div style="margin-top:auto;padding-bottom:44px"><button class="btn accent" style="width:100%">Pair</button></div>
    </div>`),
  list: () => phone(A.list()),
  thread: () => phone(`${sb()}${A.nav(byId('turn').title, 'Codex · Sotto')}
    <div class="fill"><div class="a-room"><div class="a-user">${TURNT.user}</div>
      <div class="a-steps">${TURNT.steps.map(([i, s, e]) => `<div>${ic(i, 16)}<span>${s}</span>${e ? `<em>${e}</em>` : ''}</div>`).join('')}<div style="color:var(--accent)">${ic('spin', 16, 'spin')}<span>${TURNT.live}</span></div></div>
      <div class="a-agent"><p>${TURNT.agent}<span class="caret"></span></p></div></div></div>
    <div class="a-dock">${A.comp('stop')}</div>`),
  question: () => phone(`${sb()}${A.nav(byId('ssh').title, 'Claude Code · Sotto')}
    <div class="fill"><div class="a-room"><div class="a-user">${SSHT.user}</div><div class="a-agent"><p>${SSHT.agent}</p></div></div></div>
    <div class="a-dock"><div class="a-req"><h4>Question</h4><p>${SSHT.q}</p>
      ${SSHT.opts.map(([b, s], i) => `<div class="a-opt ${i === 0 ? 'on' : ''}"><span class="r"></span><div><b>${b}</b><small>${s}</small></div></div>`).join('')}
      <button class="btn accent sm" style="width:100%;margin-top:8px">Send answer</button></div>${A.comp('off', 'Or answer in your own words')}</div>`),
  permission: () => phone(`${sb()}${A.nav(byId('host').title, 'Claude Code · Sotto')}
    <div class="fill">${A.hostThread()}</div>
    <div class="a-dock"><div class="a-req"><h4>Permission</h4><p>Run a command</p>
      <div class="codebox mono">${HOSTT.cmd}</div><div class="muted" style="font-size:14px;margin-top:6px">in ${HOSTT.cwd}</div>

    <div class="fill"><div class="c-over">${T.slice(0, 4).map(t => `<div class="c-tile"><div class="top"><span class="dot s-${t.state}"></span>${t.provider}<em>${t.when}</em></div><b>${t.title}</b></div>`).join('')}</div><div class="c-fade"></div></div>
    ${C.dock(`<div class="b-chips" style="padding:2px 2px 8px"><span>${ic('folder', 16)}Sotto</span><span>${ic('bot', 16)}Claude Code</span><span>${ic('branch', 16)}Project folder</span></div><div class="c-inp"><div class="f" style="color:var(--text)">Add a Forget button to the Hosts page<span class="caret"></span></div><button class="c-go" aria-label="Start thread">${ic('up', 22)}</button></div>`)}${kbd()}`),
  voice: () => phone(`${sb()}${C.strip('host')}${C.head(byId('host'))}
    <div class="fill">${C.hostRoom()}<div class="c-fade"></div></div>
    ${C.dock(`${C.to(byId('host'))}<div style="padding:8px 10px 10px;font-size:20px;line-height:1.35">Allow it, and once the tests pass open a pull request<span class="caret"></span></div><div class="c-inp"><button class="c-go off" aria-label="Cancel">${ic('x', 20)}</button><div style="flex:1;display:flex;justify-content:center">${wave(26)}</div><button class="c-go" aria-label="Stop listening" style="width:64px;height:64px;border-radius:32px">${ic('mic', 28)}</button></div>`)}`),
  notify: () => phone(`<div class="otherapp"><i style="width:60%"></i><i></i><i style="width:80%"></i><i style="width:70%"></i><i></i></div>${sb()}
    <div class="isl"><div class="r"><span class="dot s-waiting"></span><b style="flex:1">Claude Code wants to run a command</b></div><div style="font-size:13px;color:#aaa;margin-top:2px">${byId('host').title}</div><div class="cmd">${HOSTT.cmd}</div><div class="two"><span>Deny</span><span class="go">Allow once</span></div></div>`),
}

/* ---------- variant metadata ---------- */
const FIRST = [
  ['pair', 'Pair', 'Code read on the host. No authority granted.'],
  ['list', 'Threads', 'Home screen.'],
  ['thread', 'Thread, working', 'Streaming reply, a live step, Stop.'],
  ['question', 'Question', 'Explicit choice, explicit send.'],
  ['permission', 'Permission', 'Only when the host lets this iPhone answer.'],
  ['uncertain', 'Unconfirmed reply', 'Never resent on its own.'],
  ['offline', 'Reconnect', 'Host keeps working; draft kept.'],
]
const NEXT = [
  ['newthread', 'New thread', 'Out of first-client scope.'],
  ['voice', 'Voice reply', 'Needs an ADR: where the audio goes and who pays for transcription.'],
  ['notify', 'Notification', 'Needs push, which is a new host to contact: an ADR and a README change.'],
]
const VARIANTS = {
  A: { name: 'Room', set: A.screens,
    thesis: 'The desktop Threads page, folded onto a phone. <b>A list, then one quiet full-width thread.</b> A pending request docks above the composer inside its thread, so you answer where you read.',
    good: 'Good at: closest to the desktop, least to learn, and the transcript gets the whole screen.', cost: 'Costs: a waiting request is one tap deeper; you find it by its amber row.' },
  B: { name: 'Needs you', set: B.screens, first: [
    ['pair1', 'Pair, host address', 'Step 1. Private https address on the tailnet only.'],
    ['pair', 'Pair, code', 'Step 2. Code read on the host. No authority granted.'],
    ['list', 'Needs you', 'Home. A tap on a card answers; nothing is answered for you.'],
    ['empty', 'Needs you, empty', 'Working threads still show below.'],
    ['blocked', 'Needs you, can’t answer', 'The host hasn’t let this iPhone answer (#208 decides where you allow it).'],
    ['threads', 'Threads', 'Every thread on the host, by project.'],
    ['thread', 'Thread, working', 'Streaming reply, a live step, Stop.'],
    ['activity', 'Thread, activity', 'Files, commands and results, newest last.'],
    ['question', 'Question', 'Opened from the thread. Explicit choice, explicit send.'],
    ['permission', 'Permission', 'Opened from the thread. One signal: the sheet.'],
    ['uncertain', 'Unconfirmed reply', 'Never resent on its own.'],
    ['offline', 'Host, can’t reach it', 'Host keeps working; drafts kept.'],
  ],
    thesis: '<b>Home is what’s waiting on you.</b> A tab bar splits Needs you, Threads and Host. Permissions and questions can be answered from home or in a sheet, and threads read as chat bubbles.',
    good: 'Good at: fastest from a notification to an answer; the host’s health has a real place.', cost: 'Costs: more chrome, more iOS-stock than Sotto-quiet, and it reopens the attention-first direction the plan set aside.' },
  C: { name: 'Dock', set: C.screens,
    thesis: '<b>Threads are pages you swipe between, and one floating dock is the only input.</b> A request takes the dock’s place, so replying, answering and (later) talking all happen in the same spot under your thumb.',
    good: 'Good at: one-handed, and voice slots in without a new surface.', cost: 'Costs: less standard iOS navigation; a long question can crowd the dock.' },
}

/* ---------- render + switcher ---------- */
const params = new URLSearchParams(location.search)
let key = VARIANTS[params.get('variant')] ? params.get('variant') : 'A'
const root = document.documentElement
root.dataset.theme = params.get('theme') === 'light' ? 'light' : 'dark'
let reduced = params.get('motion') === 'reduced'
let zoom = Number(params.get('zoom')) || 0.8
const cell = (set, [id, label, note]) => `<div class="cell"><div aria-label="${label}">${set[id]()}</div><div class="cap"><b>${label}</b><span>${note}</span></div></div>`
function render() {
  const v = VARIANTS[key]
  document.getElementById('head').innerHTML = `<p class="kicker">PROTOTYPE · Sotto for iPhone · ${Object.keys(VARIANTS).indexOf(key) + 1} of 3</p><h1>${key} — ${v.name}</h1><p>${v.thesis}</p><p>${v.good}</p><p>${v.cost}</p>`
  document.getElementById('stage').innerHTML = `<h2 class="band">First client</h2><div class="row">${(v.first || FIRST).map(s => cell(v.set, s)).join('')}</div><h2 class="band">What could come next</h2><div class="row">${NEXT.map(s => cell(v.set, s)).join('')}</div>`
  document.getElementById('lab').textContent = `${key} — ${v.name}`
  document.getElementById('theme').textContent = root.dataset.theme === 'dark' ? 'Light' : 'Dark'
  document.getElementById('motion').textContent = reduced ? 'Motion on' : 'Reduce motion'
  document.getElementById('zoom').textContent = `${Math.round(zoom * 100)}%`
  root.classList.toggle('rm', reduced)
  root.style.setProperty('--z', zoom)
  const q = new URLSearchParams({ variant: key })
  if (root.dataset.theme === 'light') q.set('theme', 'light')
  if (reduced) q.set('motion', 'reduced')
  if (zoom !== 0.8) q.set('zoom', zoom)
  history.replaceState(null, '', '?' + q)
}
const keys = Object.keys(VARIANTS)
const step = d => { key = keys[(keys.indexOf(key) + d + keys.length) % keys.length]; render(); scrollTo(0, 0) }
document.getElementById('prev').onclick = () => step(-1)
document.getElementById('next').onclick = () => step(1)
document.getElementById('theme').onclick = () => { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; render() }
document.getElementById('motion').onclick = () => { reduced = !reduced; render() }
document.getElementById('zoom').onclick = () => { zoom = zoom === 0.8 ? 1 : zoom === 1 ? 0.6 : 0.8; render() }
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]')) return
  if (e.key === 'ArrowLeft') step(-1)
  if (e.key === 'ArrowRight') step(1)
})
render()
</script>
</body>
</html>
