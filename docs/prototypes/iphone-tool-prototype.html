<!doctype html>
<!--
  VERDICT (October 3, 2026): Zach picked C, "Floating phone, control tab". The phone floats over the thread as
  Virtual iPhone's framed widget did, and Tools > iPhone is its control page. Built as the test iPhone (ADR-0045):
  the phone player and Tools > iPhone. Changes from the drawing: no status bar or island is drawn over the page,
  since a native page sits above the DOM and an honest test shows exactly what the page renders; the cloud card
  waits for phase 2 (ADR-0047); the size is a button that cycles Small, Medium and Large. A and B are kept as the
  record of what was weighed.

  PROTOTYPE — throwaway. Question: how should the iPhone look in Sotto: a Tools > iPhone tab plus a floating
  player that opens by itself while an agent works in the phone, so the user can watch?
  Owner's answers so far (October 3, 2026): web and Expo-web builds first, then native apps on a cloud device
  service; a new Tools tab with a player that opens while an agent works in it; the same default grant as the
  browser (ADR-0029).
  Variants via ?variant=A|B|C. States via ?state=idle|working|native|asking|done. Theme ?theme=light, ?motion=reduced.
  The window copies the Browser tab and Browser player (artifacts/browser-grant/*.png, BrowserSurface.tsx,
  browserPlayer.css) and the Sotto theme's resolved --tt-* values. The phone frame copies millZach/virtual-iphone.
  No host calls, no persistence. Open the file directly, or serve the repo root and open
  /docs/prototypes/iphone-tool-prototype.html
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sotto iPhone tool — prototype</title>
<style>
@font-face{font-family:Figtree;src:url('../../src/renderer/src/assets/fonts/figtree-latin.woff2') format('woff2');font-weight:300 900}
@font-face{font-family:'Spline Sans Mono';src:url('../../src/renderer/src/assets/fonts/spline-sans-mono-latin.woff2') format('woff2');font-weight:300 700}

:root,[data-theme=dark]{
  --tt-canvas:oklch(0.115 0.008 265);--tt-surface:oklch(0.145 0.008 265);--tt-surface-elevated:oklch(0.185 0.008 265);--tt-surface-overlay:oklch(0.215 0.008 265);
  --tt-surface-sunken:oklch(0.155 0.008 265);--tt-sidebar:oklch(0.235 0.003 265);--tt-field:oklch(0.145 0.008 265);
  --tt-text:oklch(0.985 0.005 280);
  --tt-text-2:color-mix(in oklab,oklch(0.985 0.005 280) 55%,oklch(0.72 0.014 265));
  --tt-text-muted:color-mix(in oklab,oklch(0.72 0.014 265) 85%,oklch(0.985 0.005 280));
  --tt-text-faint:oklch(0.675 0.012 270);
  --tt-hairline:oklch(0.305 0.02 265);
  --tt-border:color-mix(in oklab,oklch(0.375 0.024 265) 25%,oklch(0.72 0.014 265));
  --tt-sidebar-row-hover:oklch(0.28 0.003 265);--tt-sidebar-row-active:oklch(0.32 0.025 190);
  --tt-accent:oklch(0.714403 0.104089 183.092);--tt-on-accent:oklch(0.16 0.012 190);--tt-accent-text:oklch(0.83 0.08 183);
  --tt-accent-surface:oklch(0.32 0.05 185);--tt-hover:color-mix(in srgb,oklch(0.32 0.05 185) 70%,transparent);
  --tt-error:oklch(0.702184 0.189226 22.228);--tt-warning:oklch(0.829017 0.171221 81.038);--tt-success:oklch(0.79 0.13 165);
  --tt-shadow-overlay:0 24px 72px -20px rgb(0 0 0 / 90%);
  --tt-focus-ring:oklch(0.714403 0.104089 183.092);
  --win-edge:#2a2a30;--page:#161618;--page-text:#e8e8ea;--page-muted:#a0a0a8;--bezel:#1b1c20;--bezel-edge:#3a3b42;
}
[data-theme=light]{
  --tt-canvas:oklch(0.978 0.004 85);--tt-surface:oklch(0.99 0.003 85);--tt-surface-elevated:oklch(0.955 0.006 85);--tt-surface-overlay:oklch(0.945 0.007 85);
  --tt-surface-sunken:oklch(0.945 0.008 85);--tt-sidebar:oklch(0.955 0.008 85);--tt-field:oklch(0.99 0.003 85);
  --tt-text:oklch(0.235 0.014 75);
  --tt-text-2:color-mix(in oklab,oklch(0.235 0.014 75) 55%,oklch(0.5 0.014 75));
  --tt-text-muted:color-mix(in oklab,oklch(0.5 0.014 75) 85%,oklch(0.235 0.014 75));
  --tt-text-faint:oklch(0.535 0.015 78);
  --tt-hairline:oklch(0.86 0.012 80);
  --tt-border:color-mix(in oklab,oklch(0.8 0.016 80) 25%,oklch(0.5 0.014 75));
  --tt-sidebar-row-hover:oklch(0.93 0.01 85);--tt-sidebar-row-active:oklch(0.915 0.02 190);
  --tt-accent:oklch(0.53 0.095 186);--tt-on-accent:oklch(0.99 0.003 85);--tt-accent-text:oklch(0.43 0.08 186);
  --tt-accent-surface:oklch(0.92 0.03 186);--tt-hover:color-mix(in srgb,oklch(0.92 0.03 186) 70%,transparent);
  --tt-error:oklch(0.509494 0.208583 28.513);--tt-warning:oklch(0.546927 0.155556 45.359);--tt-success:oklch(0.5 0.11 158);

  --win-edge:#c9c9cf;--page:#e7e7ea;--page-text:#1c1c1f;--page-muted:#5a5a62;--bezel:#1b1c20;--bezel-edge:#4a4b52;
}

*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--page-text);font:15px/1.5 Figtree,system-ui,sans-serif;padding:28px 32px 120px}
.page-head{max-width:1280px;margin:0 0 18px}
.page-head .kicker{font-size:13px;color:var(--page-muted);margin:0 0 4px}
.page-head h1{font-size:26px;margin:0 0 6px;letter-spacing:-.02em;font-weight:650}
.page-head p{margin:0;max-width:1000px;color:var(--page-muted)}
.page-head p b{color:var(--page-text);font-weight:600}
.notes{max-width:1280px;margin:16px 0 0;color:var(--page-muted);font-size:14px}
.notes b{color:var(--page-text)}
.notes ul{margin:6px 0 0;padding-left:20px}

/* ---------- the Sotto window ---------- */
.stage{transform-origin:top left}
.win{position:relative;width:1280px;height:800px;overflow:hidden;border-radius:10px;border:1px solid var(--win-edge);background:var(--tt-canvas);color:var(--tt-text);font:14px/1.45 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:grid;grid-template-columns:270px 1fr auto;box-shadow:0 30px 60px -30px #0009}
.win button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:8px}
.win button:focus-visible,.win input:focus-visible,.win select:focus-visible{outline:2px solid var(--tt-focus-ring);outline-offset:1px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:'Spline Sans Mono',ui-monospace,monospace;font-size:12.5px}

.side{background:var(--tt-sidebar);display:flex;flex-direction:column;border-right:1px solid var(--tt-hairline)}
.side .brand{height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;font-weight:650}
.side .brand i{width:20px;height:20px;border-radius:5px;background:var(--tt-accent)}
.side .search{margin:4px 10px 10px;height:32px;border:1px solid var(--tt-hairline);border-radius:9px;background:var(--tt-field);color:var(--tt-text-faint);display:flex;align-items:center;gap:8px;padding:0 10px;font-size:13px}
.side .proj{padding:6px 14px;font-weight:600;display:flex;justify-content:space-between}
.side .row{margin:2px 6px;padding:8px 10px 8px 26px;border-radius:9px}
.side .row.on{background:var(--tt-sidebar-row-active);border:1px solid color-mix(in oklab,var(--tt-accent) 35%,transparent)}
.side .row small{display:flex;justify-content:space-between;color:var(--tt-text-muted);font-size:12.5px}
.side .row .work{color:var(--tt-accent-text)}

.thread{position:relative;display:flex;flex-direction:column;min-width:0;background:var(--tt-canvas)}
.thread .bar{height:44px;display:flex;align-items:center;gap:10px;padding:0 16px;font-weight:600;border-bottom:1px solid transparent}
.thread .bar span{color:var(--tt-text-muted);font-weight:400}
.msgs{flex:1;overflow:hidden;padding:12px 28px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:560px;color:var(--tt-text-2);font-size:14px}
.msg.user{align-self:flex-end;background:var(--tt-surface-elevated);color:var(--tt-text);padding:8px 12px;border-radius:12px}
.toolcall{display:flex;align-items:center;gap:8px;color:var(--tt-text-muted);font-size:13px}
.toolcall b{color:var(--tt-text-2);font-weight:500}
.composer{margin:0 22px 16px;border:1px solid var(--tt-hairline);border-radius:14px;background:var(--tt-surface);padding:12px 14px;color:var(--tt-text-faint);height:96px;display:flex;flex-direction:column;justify-content:space-between}
.composer .chips{display:flex;gap:6px}
.composer .chips span{border:1px solid var(--tt-hairline);border-radius:999px;padding:2px 10px;font-size:12.5px;color:var(--tt-text-2)}

.req{align-self:stretch;border:1px solid var(--tt-border);background:var(--tt-surface-elevated);border-radius:12px;padding:12px 14px;max-width:620px}
.req p{margin:0 0 10px;color:var(--tt-text)}
.req p span{color:var(--tt-text-muted)}
.req .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:30px;padding:0 12px;border:1px solid var(--tt-hairline)!important;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--tt-accent);color:var(--tt-on-accent)!important;border-color:transparent!important;font-weight:600}
.btn:hover{background:var(--tt-hover)}
.btn.primary:hover{background:var(--tt-accent)}

/* ---------- Tools pane and rail ---------- */
.tools{display:flex;border-left:1px solid var(--tt-hairline);background:var(--tt-canvas)}
.tools .pane{display:flex;flex-direction:column;min-width:0}
.rail{width:64px;border-left:1px solid var(--tt-hairline);display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:4px}
.rail button{width:56px;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px!important;color:var(--tt-text-muted)!important}
.rail button svg{width:18px;height:18px}
.rail button.on{background:var(--tt-accent-surface);color:var(--tt-text)!important}
.rail button .dot{position:absolute;margin:-2px 0 0 18px;width:7px;height:7px;border-radius:50%;background:var(--tt-accent)}
.rail button:not(.on):hover{background:var(--tt-hover)}

.tabs{height:44px;display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid var(--tt-hairline)}
.tab{height:30px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:8px;background:var(--tt-accent-surface);font-size:13px;max-width:280px;white-space:nowrap;overflow:hidden}
.tab .sub{color:var(--tt-text-muted)}
.tabs .sp{flex:1}
.ib{width:30px;height:30px;display:inline-grid;place-items:center;color:var(--tt-text-muted)!important}
.ib:hover{background:var(--tt-hover);color:var(--tt-text)!important}
.toolbar{height:44px;display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid var(--tt-hairline)}
.addr{flex:1;min-width:0;height:30px;border:1px solid var(--tt-hairline);border-radius:8px;background:var(--tt-field);display:flex;align-items:center;padding:0 10px;color:var(--tt-text);gap:8px;overflow:hidden;white-space:nowrap}
.addr .k{color:var(--tt-text-muted);font-family:Figtree;font-size:12.5px}
.sel{height:30px;border:1px solid var(--tt-hairline);border-radius:8px;background:var(--tt-field);color:var(--tt-text);padding:0 8px;font:inherit;font-size:13px}
.grant{padding:8px 12px;border-bottom:1px solid var(--tt-hairline);color:var(--tt-text-2);font-size:13px;display:flex;gap:6px;align-items:center}
.grant .link{color:var(--tt-accent-text);font-weight:600;padding:0 4px}
.task{padding:8px 12px;border-bottom:1px solid var(--tt-hairline);font-size:13px}
.task .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.task .top b{font-weight:500}
.task details summary{color:var(--tt-text-muted);cursor:pointer;margin-top:4px}
.task ol{margin:6px 0 2px;padding-left:22px;color:var(--tt-text-2)}
.state{display:inline-flex;align-items:center;gap:6px;color:var(--tt-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--tt-accent);animation:pulse 1.4s ease-in-out infinite}
.pulse.off{background:var(--tt-text-faint);animation:none}
@keyframes pulse{50%{opacity:.35}}
.foot{height:34px;border-top:1px solid var(--tt-hairline);display:flex;align-items:center;gap:6px;padding:0 12px;color:var(--tt-text-muted);font-size:12.5px}
.empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--tt-text-muted);padding:24px}
.empty h3{margin:10px 0 4px;color:var(--tt-text);font-size:15px;font-weight:600}
.empty p{margin:0 0 14px;max-width:320px}
.empty form{display:flex;gap:6px;justify-content:center}
.empty input{height:30px;width:220px;border:1px solid var(--tt-hairline);border-radius:8px;background:var(--tt-field);color:var(--tt-text);padding:0 10px;font:inherit;font-size:13px}

/* ---------- the phone (copied from virtual-iphone, drawn in CSS) ---------- */
.phone{--w:250px;position:relative;width:var(--w);aspect-ratio:71.6/147.6;border-radius:calc(var(--w)*.17);background:var(--bezel);padding:calc(var(--w)*.035);box-shadow:inset 0 0 0 1.5px var(--bezel-edge),0 18px 40px -18px #000a;flex:none}
.phone.bare{background:none;box-shadow:none;padding:0}
.screen{position:relative;width:100%;height:100%;border-radius:calc(var(--w)*.135);overflow:hidden;background:#f4f3f8;color:#1d1b29;font-size:calc(var(--w)*.044);container-type:inline-size}
.phone.bare .screen{border-radius:18px;box-shadow:0 0 0 1px var(--tt-hairline)}
.island{position:absolute;top:2.6%;left:50%;transform:translateX(-50%);width:31%;height:3.9%;border-radius:999px;background:#000;z-index:3}
.phone.bare .island{display:none}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:4.2cqw 9cqw 0;height:13cqw;font-weight:600;font-size:4.6cqw}
.sbar i{font-style:normal;letter-spacing:1px;font-size:3.8cqw}
.app{padding:3cqw 7cqw}
.app h4{margin:2cqw 0 0;font-size:8.6cqw;letter-spacing:-.02em;font-weight:750}
.app .date{font-size:3cqw;letter-spacing:.12em;color:#7b7891;text-transform:uppercase;margin-bottom:5cqw}
.app .hero{background:#e3dcf3;border-radius:6cqw;padding:5cqw;margin-bottom:6cqw}
.app .hero small{font-size:2.8cqw;letter-spacing:.1em;color:#7b5cc2;font-weight:700}
.app .hero b{display:block;font-size:6.6cqw;line-height:1.15;margin:2cqw 0}
.app .hero span{font-size:3cqw;color:#666}
.app h5{font-size:5cqw;margin:0 0 3cqw}
.card{position:relative;display:flex;gap:4cqw;align-items:center;background:#fff;border-radius:4.5cqw;padding:3.6cqw;margin-bottom:3cqw}
.card i{width:10cqw;height:10cqw;border-radius:3cqw;background:#d3f0dc;display:grid;place-items:center;color:#2b8a4b;font-style:normal;font-size:6cqw}
.card b{display:block;font-size:4.1cqw}
.card span{font-size:3.2cqw;color:#777}
.field{background:#fff;border-radius:4cqw;padding:3.4cqw 4cqw;margin-bottom:3cqw;font-size:4.2cqw;border:.6cqw solid #7b5cc2}
.field .caret{display:inline-block;width:.5cqw;height:4.6cqw;background:#7b5cc2;vertical-align:-0.8cqw;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sheet-title{display:flex;justify-content:space-between;font-size:4.2cqw;margin:2cqw 0 5cqw;color:#7b5cc2}
.sheet-title b{color:#1d1b29}
.home{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);width:36%;height:1.3%;border-radius:999px;background:#1d1b29}
.tap{position:absolute;width:12cqw;height:12cqw;margin:-6cqw 0 0 -6cqw;border-radius:50%;border:.8cqw solid var(--tt-accent);background:color-mix(in srgb,var(--tt-accent) 25%,transparent);z-index:4;animation:tap 1.6s ease-out infinite}
@keyframes tap{0%{transform:scale(.4);opacity:1}70%{transform:scale(1.15);opacity:.15}100%{opacity:0}}
/* native screen: Sotto's own iPhone client */
.screen.native{background:#0f1015;color:#f2f2f5}
.screen.native .sbar{color:#f2f2f5}
.nat{padding:2cqw 6cqw}
.nat h4{font-size:8.4cqw;margin:2cqw 0 4cqw;font-weight:700}
.nat .seg{display:flex;gap:2cqw;margin-bottom:5cqw}
.nat .seg span{font-size:3.4cqw;padding:1.4cqw 3.4cqw;border-radius:99px;background:#24262e;color:#b8bac4}
.nat .seg span.on{background:#2c5450;color:#fff}
.nat .it{background:#1a1c23;border-radius:4cqw;padding:3.6cqw 4cqw;margin-bottom:2.6cqw;position:relative}
.nat .it b{display:block;font-size:4.1cqw}
.nat .it span{font-size:3.3cqw;color:#a3a6b2}
.nat .it em{position:absolute;right:4cqw;top:3.8cqw;font-style:normal;font-size:3cqw;color:#6fd3c4}
.screen.native .home{background:#f2f2f5}
.boot{position:absolute;inset:0;display:grid;place-items:center;background:#000;color:#bbb;font-size:3.6cqw;z-index:5}

[data-motion=reduced] .pulse,[data-motion=reduced] .tap,[data-motion=reduced] .field .caret{animation:none}
[data-motion=reduced] .tap{opacity:.8}

/* ---------- floating player (Browser player look) ---------- */
.player{position:absolute;z-index:20;border:1px solid var(--tt-border);background:var(--tt-surface-elevated);border-radius:12px;box-shadow:var(--tt-shadow-overlay);overflow:hidden;display:flex;flex-direction:column}
.player .ph{height:36px;display:flex;align-items:center;gap:6px;padding:0 4px 0 10px;border-bottom:1px solid var(--tt-hairline);font-size:13px;white-space:nowrap}
.player .ph b{font-weight:600}
.player .ph .sub{color:var(--tt-text-muted);overflow:hidden;text-overflow:ellipsis}
.player .ph .sp{flex:1}
.player .pf{height:36px;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;border-top:1px solid var(--tt-hairline);font-size:13px}
.player .pf .sp{flex:1}
.player .body{flex:1;display:grid;place-items:center;background:var(--tt-surface-sunken);padding:12px}

/* variant C widget, the virtual-iphone look */
.widget{position:absolute;z-index:20;display:flex;flex-direction:column;align-items:center;gap:10px}
.pill{display:flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 12px;border-radius:999px;background:var(--tt-surface-overlay);border:1px solid var(--tt-border);box-shadow:var(--tt-shadow-overlay);font-size:13px;white-space:nowrap}
.pill .grip{color:var(--tt-text-faint);letter-spacing:-1px;cursor:grab}

/* variant B activity log */
.split{flex:1;display:grid;grid-template-columns:auto 1fr;min-height:0}
.split .left{display:grid;place-items:center;padding:16px;background:var(--tt-surface-sunken);border-right:1px solid var(--tt-hairline)}
.log{overflow:auto;padding:12px 14px;font-size:13px}
.log h4{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tt-text-muted);font-weight:600}
.step{display:grid;grid-template-columns:18px 1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--tt-hairline);color:var(--tt-text-2)}
.step time{color:var(--tt-text-faint);font-size:12px}
.step.now{color:var(--tt-text)}
.step.now svg{color:var(--tt-accent-text)}
.seg2{display:inline-flex;border:1px solid var(--tt-hairline);border-radius:8px;overflow:hidden}
.seg2 button{border-radius:0!important;padding:0 10px;height:28px;font-size:13px!important;color:var(--tt-text-muted)!important}
.seg2 button.on{background:var(--tt-accent-surface);color:var(--tt-text)!important}

/* variant C control page */
.ctl{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px;font-size:13px}
.ctl section{border:1px solid var(--tt-hairline);border-radius:12px;background:var(--tt-surface);padding:12px 14px}
.ctl h4{margin:0 0 8px;font-size:13.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.ctl .kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;color:var(--tt-text-2)}
.ctl .kv span{color:var(--tt-text-muted)}
.ctl .on-src{border-color:color-mix(in oklab,var(--tt-accent) 55%,transparent)}
.badge{font-size:11.5px;font-weight:600;color:var(--tt-accent-text);background:var(--tt-accent-surface);padding:1px 8px;border-radius:99px}
.muted{color:var(--tt-text-muted)}

/* ---------- prototype switcher (not part of the design) ---------- */
.proto-bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:999px;background:#111;color:#fff;font:13px/1 system-ui,sans-serif;box-shadow:0 10px 30px #0008;border:2px solid #ff3d7f}
.proto-bar button{white-space:nowrap;background:#2a2a2a;color:#fff;border:0;border-radius:999px;padding:7px 11px;cursor:pointer;font:inherit}
.proto-bar button.on{background:#ff3d7f}
.proto-bar .lbl{white-space:nowrap;min-width:220px;text-align:center;font-weight:600}
.proto-bar .grp{display:flex;gap:4px;padding-left:10px;border-left:1px solid #444}
</style>
</head>
<body>
<div class="page-head">
  <p class="kicker">Prototype · not the app · iPhone tool for agent threads</p>
  <h1 id="title">Sotto iPhone tool</h1>
  <p id="lede"></p>
</div>
<div class="stage" id="stage"><div class="win" id="win"></div></div>
<div class="notes" id="notes"></div>

<div class="proto-bar" role="toolbar" aria-label="Prototype switcher">
  <button id="prev" aria-label="Previous variant">←</button>
  <span class="lbl" id="vlabel"></span>
  <button id="next" aria-label="Next variant">→</button>
  <span class="grp" id="states"></span>
  <span class="grp"><button id="theme">Light</button><button id="motion">Reduce motion</button></span>
</div>

<script>
const I = {
  phone:'<rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  term:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/>',
  files:'<path d="M4 4h6v6H4zM14 7h6M14 17h6M4 14h6v6H4z"/>',
  changes:'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5V14a4 4 0 0 0 4 4h5.5M18 15.5V10a4 4 0 0 0-4-4H8.5"/>',
  pr:'<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7M18 15.5V9a3 3 0 0 0-3-3h-4"/>',
  agents:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  pause:'<path d="M9 5v14M15 5v14"/>',
  dock:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>',
  min:'<path d="M14 10h6M14 10V4M10 14H4M10 14v6"/>',
  reload:'<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>',
  rotate:'<rect x="4" y="8" width="16" height="10" rx="2"/><path d="M8 4h4a4 4 0 0 1 4 4"/>',
  home:'<circle cx="12" cy="12" r="7"/>',
  shot:'<path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3"/><circle cx="12" cy="12" r="3"/>',
  tap:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/>',
  type:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"/>',
  swipe:'<path d="M12 20V5M7 10l5-5 5 5"/>',
  open:'<path d="M14 4h6v6M20 4l-9 9M18 14v5H5V6h5"/>',
  install:'<path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>',
  check:'<path d="m5 12 4.5 4.5L19 7"/>',
  pin:'<path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v7"/>',
  sliders:'<path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/>',
  cloud:'<path d="M7 18a4.5 4.5 0 0 1-.5-9A6 6 0 0 1 18 9.5a4 4 0 0 1-.5 8.5z"/>',
  hand:'<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11M11 10.5V4a1.5 1.5 0 0 1 3 0v6.5M14 10.5V6a1.5 1.5 0 0 1 3 0v7a7 7 0 0 1-7 7h-.5A5.5 5.5 0 0 1 5 16.5L4 13.5a1.5 1.5 0 0 1 2.6-1.4L8 14"/>',
};
const ic = (n, cls='i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;

const VARIANTS = {
  A: 'Phone in the pane',
  B: 'Screen and steps',
  C: 'Floating phone, control tab',
};
const STATES = {
  idle: 'Nothing open',
  working: 'Web build',
  native: 'Native, cloud',
  asking: 'Asks first',
  done: 'Finished',
};
const q = new URLSearchParams(location.search);
let variant = VARIANTS[q.get('variant')] ? q.get('variant') : 'A';
let state = STATES[q.get('state')] ? q.get('state') : 'working';
let theme = q.get('theme') === 'light' ? 'light' : 'dark';
let motion = q.get('motion') === 'reduced' ? 'reduced' : 'full';

/* ---------- content that every variant shares ---------- */
const S = () => ({
  native: state === 'native',
  live: state === 'working' || state === 'native',
  title: state === 'native' ? 'Sotto' : 'Daybook',
  where: state === 'native' ? 'iPhone 15 Pro · iOS 26 · cloud device' : 'localhost:8081',
  doing: state === 'native' ? 'Opening Needs you' : 'Typing in New habit',
  task: state === 'native' ? 'Checking the Needs you list on a real iOS build' : 'Checking the new habit form',
  steps: state === 'asking' ? [] : state === 'native'
    ? [['install','Installed Sotto 0.1.21 (12)','0:41'],['open','Opened Sotto','0:44'],['tap','Tapped Threads','0:47'],['swipe','Scrolled down','0:49'],['tap','Tapped Needs you','0:52']]
    : [['open','Opened localhost:8081','0:02'],['tap','Tapped Morning routine','0:05'],['tap','Tapped Add a habit','0:07'],['type','Typed "Read 20 pages"','0:09'],['shot','Took a screenshot','0:11']],
});

function screen(opts = {}) {
  const s = S();
  if (state === 'idle') return `<div class="screen" style="background:#000"><div class="island"></div></div>`;
  if (s.native) return `<div class="screen native"><div class="island"></div>
    <div class="sbar"><span>9:41</span><i>▂▄▆ ▮</i></div>
    <div class="nat"><h4>Threads</h4>
      <div class="seg"><span>All</span><span class="on">Needs you</span><span>Studio PC</span></div>
      <div class="it"><b>Workshop</b><span>Wants to run npm test</span><em>Answer</em></div>
      <div class="it"><b>Docs</b><span>Asks which heading to keep</span><em>Answer</em></div>
      <div class="it"><b>Launch video</b><span>Waiting for your reply</span></div>
      ${state === 'native' && opts.tap !== false ? '<span class="tap" style="left:58%;top:29%"></span>' : ''}
    </div><div class="home"></div></div>`;
  const typing = state === 'working';
  return `<div class="screen"><div class="island"></div>
    <div class="sbar"><span>12:22</span><i>▂▄▆ ▮</i></div>
    <div class="app">
      <div class="sheet-title"><span>Cancel</span><b>New habit</b><span>Save</span></div>
      <div class="field">${typing ? 'Read 20 pa<span class="caret"></span>' : 'Read 20 pages'}</div>
      <div class="card"><i>☀</i><div><b>Morning routine</b><span>A calm start to your day</span></div></div>
      <div class="card"><i>+</i><div><b>Move your body</b><span>Make a little time for you</span></div></div>
      <div class="card"><i>☾</i><div><b>Evening reset</b><span>Wind down, clear your mind</span></div></div>
      ${typing && opts.tap !== false ? '<span class="tap" style="left:50%;top:26%"></span>' : ''}
    </div><div class="home"></div></div>`;
}
const phone = (w, bare = false, opts) => `<div class="phone${bare ? ' bare' : ''}" style="--w:${w}px">${screen(opts)}</div>`;

function sidebar() {
  const s = S();
  return `<aside class="side"><div class="brand"><i></i>Sotto</div>
    <div class="search">Search threads</div>
    <div class="proj"><span>Daybook</span><span class="muted">2</span></div>
    <div class="row on">Workshop<small><span>Claude</span><span class="${s.live ? 'work' : ''}">${s.live ? 'Working' : state === 'asking' ? 'Needs you' : 'Done'}</span></small></div>
    <div class="row">Docs<small><span>Codex</span><span>Done</span></small></div></aside>`;
}

function threadMsgs() {
  const s = S();
  const ask = state === 'asking' ? `<div class="req" role="group" aria-label="iPhone request">
      <p>Workshop wants to use the iPhone. <span>Open localhost:8081 in the web build.</span></p>
      <div class="acts"><button class="btn primary">Allow once</button><button class="btn">Allow this thread to use the iPhone</button><button class="btn">Deny</button></div></div>` : '';
  const calls = state === 'idle' ? '' : s.steps.slice(0, state === 'asking' ? 0 : 5).map(([n, t]) => `<div class="toolcall">${ic(n)}<b>iPhone</b> ${t}</div>`).join('');
  const user = s.native ? 'Install the latest TestFlight build on a cloud iPhone and check that Needs you lists the waiting threads.' : 'Add a "new habit" form and test it on the iPhone.';
  const done = state === 'done' ? '<div class="msg">The form saves and the new habit shows under Your routines. I left a screenshot in the iPhone tab.</div>' : '';
  return `<div class="msg user">${user}</div>${state === 'idle' ? '' : '<div class="msg">I will open the app on the iPhone and walk through it.</div>'}${calls}${ask}${done}`;
}

function rail(active = 'iphone') {
  const items = [['iphone','phone','iPhone'],['browser','globe','Browser'],['terminal','term','Terminal'],['files','files','Files'],['changes','changes','Changes'],['pr','pr','PR'],['agents','agents','Agents']];
  const live = S().live;
  return `<nav class="rail" aria-label="Tools">${items.map(([k, n, l]) => `<button class="${k === active ? 'on' : ''}" aria-pressed="${k === active}">${ic(n)}${k === 'iphone' && live && active !== 'iphone' ? '<span class="dot"></span>' : ''}${l}</button>`).join('')}</nav>`;
}

const grantLine = () => state === 'asking'
  ? `<div class="grant">This thread asks before each use of the iPhone · <button class="link">Allow this thread</button></div>`
  : state === 'idle' ? '' : `<div class="grant">This thread uses the iPhone without asking · <button class="link">Stop</button></div>`;

const liveState = () => {
  const s = S();
  if (state === 'done') return `<span class="state"><span class="pulse off"></span>Done · ${s.steps.length} recorded steps</span>`;
  if (state === 'asking') return `<span class="state"><span class="pulse off"></span>Waiting for you</span>`;
  return `<span class="state"><span class="pulse"></span>${s.doing}</span>`;
};

const emptyTab = () => `<div class="empty"><div>${ic('phone')}
  <h3>No app on the iPhone</h3>
  <p>An agent opens your app here when it tests it. You can also load a web build yourself.</p>
  <form onsubmit="return false"><input aria-label="Web address" placeholder="http://localhost:8081"><button class="btn primary">Load app</button></form>
  <p style="margin-top:14px;font-size:12.5px">Native apps run on a cloud iPhone. ${'<button class="link" style="color:var(--tt-accent-text);font-weight:600">Set up cloud devices</button>'}</p></div></div>`;

/* ---------- Variant A: Phone in the pane ---------- */
function variantA() {
  const s = S();
  const tab = state === 'idle' ? emptyTab() : `
    <div class="tabs"><div class="tab">${ic(s.native ? 'cloud' : 'phone')}<span>${s.title}</span><span class="sub">${s.native ? 'cloud' : s.where}</span></div><span class="sp"></span>
      <button class="ib" aria-label="Take a screenshot">${ic('shot')}</button><button class="ib" aria-label="Float the iPhone">${ic('min')}</button></div>
    <div class="toolbar"><button class="ib" aria-label="Home">${ic('home')}</button><button class="ib" aria-label="Rotate">${ic('rotate')}</button><button class="ib" aria-label="Reload">${ic('reload')}</button>
      <div class="addr mono">${s.native ? '<span class="k">Build</span> Sotto 0.1.21 (12)' : 'http://localhost:8081/habits/new'}</div>
      <select class="sel" aria-label="Device"><option>iPhone 15 Pro</option><option>iPhone SE</option><option>iPhone 16 Pro Max</option></select></div>
    ${grantLine()}
    <div class="task"><div class="top"><b>${s.task}</b>${s.live ? `<button class="btn">${ic('pause')}Pause</button>` : ''}</div>
      <details><summary>${s.steps.length} recorded steps</summary><ol>${s.steps.map(x => `<li>${x[1]}</li>`).join('')}</ol></details></div>
    <div class="empty" style="background:var(--tt-surface-sunken)">${phone(268)}</div>
    <div class="foot">${liveState()}<span style="flex:1"></span>${s.native ? 'Cloud session 2 min' : 'Web build · not native iOS'}</div>`;
  const player = !s.live ? '' : `<div class="player" style="right:16px;bottom:126px;width:236px;height:452px" role="dialog" aria-label="iPhone player">
      <div class="ph">${ic('phone')}<b>${s.title}</b><span class="sub">${s.native ? 'cloud' : s.where}</span><span class="sp"></span>
        <button class="ib" aria-label="Show in Tools">${ic('dock')}</button><button class="ib" aria-label="Close player">${ic('x')}</button></div>
      <div class="body">${phone(164, false, { tap: true })}</div>
      <div class="pf">${liveState()}<span class="sp"></span><button class="btn">${ic('pause')}Pause</button></div></div>`;
  return { tools: `<div class="tools"><div class="pane" style="width:440px">${tab}</div>${rail()}</div>`, player,
    note: `<b>A, Phone in the pane.</b> The iPhone tab is the Browser tab with a phone in it: one tab per app, a toolbar (Home, Rotate, Reload, the address or build, the device), the same grant line and task row, then the framed phone filling the pane. The player is the Browser player turned upright, and it shows the phone in its frame. <i>Note:</i> in this mock-up the player and the Tools tab are both visible so you can compare them. In the app the player only shows while the iPhone tab is closed, the way the Browser player does.` };
}

/* ---------- Variant B: Screen and steps ---------- */
function variantB() {
  const s = S();
  const icons = { open:'open', tap:'tap', type:'type', shot:'shot', install:'install', swipe:'swipe' };
  const tab = state === 'idle' ? emptyTab() : `
    <div class="toolbar" style="gap:8px"><div class="seg2" role="group" aria-label="Run on"><button class="${s.native ? '' : 'on'}">Web build</button><button class="${s.native ? 'on' : ''}">Cloud iPhone</button></div>
      <div class="addr mono">${s.native ? 'Sotto 0.1.21 (12)' : 'localhost:8081'}</div>
      <select class="sel" aria-label="Device"><option>iPhone 15 Pro</option></select></div>
    ${grantLine()}
    <div class="split"><div class="left">${phone(232, true)}</div>
      <div class="log"><h4>${s.task}</h4>
        ${s.steps.map(([n, t, tm], i) => `<div class="step">${ic(icons[n] || 'tap')}<span>${t}</span><time>${tm}</time></div>`).join('')}
        ${s.live ? `<div class="step now">${ic('type')}<span>${s.doing}…</span><time></time></div>` : ''}
        ${state === 'done' ? `<div class="step">${ic('check')}<span>Finished. The habit saved.</span><time>0:14</time></div>` : ''}
      </div></div>
    <div class="foot">${liveState()}<span style="flex:1"></span>${s.live ? `<button class="btn">${ic('hand')}Take over</button><button class="btn">${ic('pause')}Pause</button>` : ''}</div>`;
  const player = !s.live ? '' : `<div class="player" style="right:16px;bottom:126px;width:360px;flex-direction:row;height:220px" role="dialog" aria-label="iPhone player">
      <div style="background:var(--tt-surface-sunken);display:grid;place-items:center;padding:10px;border-right:1px solid var(--tt-hairline)">${phone(92, true)}</div>
      <div style="flex:1;display:flex;flex-direction:column;min-width:0">
        <div class="ph"><b>Workshop</b><span class="sub">· ${s.title}</span><span class="sp"></span><button class="ib" aria-label="Show in Tools">${ic('dock')}</button><button class="ib" aria-label="Close player">${ic('x')}</button></div>
        <div style="flex:1;padding:8px 12px;font-size:12.5px;color:var(--tt-text-2);overflow:hidden">${s.steps.slice(-3).map(x => `<div style="padding:3px 0">${x[1]}</div>`).join('')}<div style="padding:3px 0;color:var(--tt-text)">${s.doing}…</div></div>
        <div class="pf">${liveState()}<span class="sp"></span><button class="btn">${ic('pause')}Pause</button></div></div></div>`;
  return { tools: `<div class="tools"><div class="pane" style="width:520px">${tab}</div>${rail()}</div>`, player,
    note: `<b>B, Screen and steps.</b> The tab is in two halves: the screen on the left with no frame, and what the agent did on the right, step by step, with times. A switch at the top picks Web build or Cloud iPhone. <b>Take over</b> pauses the agent and gives you the mouse. The player is a small landscape card: a little screen and the last three steps, so it hides less of the thread.` };
}

/* ---------- Variant C: Floating phone, control tab ---------- */
function variantC() {
  const s = S();
  const tab = `<div class="tabs"><div class="tab" style="background:none;padding-left:4px;font-weight:600">${ic('phone')}iPhone</div><span class="sp"></span>
      <button class="btn">${ic('phone')}${s.live ? 'Hide phone' : 'Show phone'}</button></div>
    ${grantLine()}
    <div class="ctl">
      <section class="${s.native ? '' : 'on-src'}"><h4>Web build ${s.native || state === 'idle' ? '' : '<span class="badge">On the phone</span>'}</h4>
        <div class="kv"><span>Address</span><span class="mono">localhost:8081</span><span>Runs as</span><span>A phone-sized browser page, not iOS</span></div></section>
      <section class="${s.native ? 'on-src' : ''}"><h4>Cloud iPhone ${s.native ? '<span class="badge">On the phone</span>' : ''}</h4>
        <div class="kv"><span>Device</span><span>iPhone 15 Pro · iOS 26</span><span>Build</span><span>Sotto 0.1.21 (12), from TestFlight</span><span>This month</span><span>38 of 100 device minutes</span></div></section>
      ${state === 'idle' ? '' : `<section><h4>${s.task} ${s.live ? `<button class="btn">${ic('pause')}Pause</button>` : ''}</h4>
        <ol style="margin:0;padding-left:20px;color:var(--tt-text-2)">${s.steps.map(x => `<li>${x[1]}</li>`).join('')}</ol></section>`}
    </div>`;
  const player = !s.live && state !== 'asking' ? '' : `<div class="widget" style="right:24px;top:52px" role="dialog" aria-label="iPhone">
      <div class="pill"><span class="grip" aria-hidden="true">⋮⋮</span><b style="font-weight:600">${s.native ? 'iPhone 15 Pro · cloud' : 'iPhone 15 Pro'}</b>
        <button class="ib" aria-label="Keep on top">${ic('pin')}</button><button class="ib" aria-label="Size">${ic('sliders')}</button><button class="ib" aria-label="Close">${ic('x')}</button></div>
      ${phone(250)}
      <div class="pill" style="padding-right:4px">${state === 'asking' ? '<span class="state"><span class="pulse off"></span>Waiting for you</span>' : `${liveState().replace('state', 'state" style="color:var(--tt-text)')}<button class="btn" style="border-radius:999px">${ic('pause')}Pause</button>`}</div></div>`;
  return { tools: `<div class="tools"><div class="pane" style="width:400px">${tab}</div>${rail()}</div>`, player,
    note: `<b>C, Floating phone, control tab.</b> The phone itself never sits in the pane. It is the virtual-iphone widget brought into Sotto: a full-size framed phone with its label pill above (drag, Keep on top, Size, Close) and a status pill below. It floats over the thread while an agent works and stays until you close it. The iPhone tab becomes the control page: which source is on the phone, the cloud device and build, the minutes used this month, and the steps. This is closest to the tool you already have, and the phone is the biggest of the three.` };
}

function render() {
  document.documentElement.dataset.theme = theme;
  document.documentElement.dataset.motion = motion;
  const v = { A: variantA, B: variantB, C: variantC }[variant]();
  document.getElementById('win').innerHTML = `${sidebar()}
    <main class="thread"><div class="bar">Workshop <span>/ Daybook</span></div>
      <div class="msgs">${threadMsgs()}</div>
      <div class="composer">What would you like to do next?<div class="chips"><span>Claude</span><span>Low</span><span>Permissions</span></div></div>
      ${v.player}</main>
    ${v.tools}`;
  document.getElementById('lede').innerHTML = `Variant <b>${variant}, ${VARIANTS[variant]}</b> · state <b>${STATES[state]}</b>. Web and Expo-web builds come first; native apps run on a cloud iPhone later. Use ← → or the bar below.`;
  document.getElementById('notes').innerHTML = v.note + `<ul>
    <li><b>Same across variants:</b> the player opens by itself when a thread starts working in the iPhone and closes when its task ends. It shows only the focused thread, and it follows the setting <i>Show the browser when an agent opens a page</i>, which would become <i>Show the browser or iPhone when an agent uses it</i>.</li>
    <li><b>Grant:</b> as ADR-0029 does for the browser, a thread uses the iPhone without asking. Stop ends it for that thread, and a Settings switch ends it everywhere (try the "Grant off" state).</li>
    <li><b>Cloud iPhone</b> needs a provider and its key, and an ADR plus a README line under Privacy and cost, because your app build and its screens go to that host.</li></ul>`;
  document.getElementById('vlabel').textContent = `${variant} — ${VARIANTS[variant]}`;
  document.getElementById('states').innerHTML = Object.entries(STATES).map(([k, l]) => `<button data-s="${k}" class="${k === state ? 'on' : ''}">${l}</button>`).join('');
  document.getElementById('theme').textContent = theme === 'dark' ? 'Light' : 'Dark';
  document.getElementById('motion').textContent = motion === 'reduced' ? 'Full motion' : 'Reduce motion';
  const u = new URL(location); u.searchParams.set('variant', variant); u.searchParams.set('state', state);
  theme === 'light' ? u.searchParams.set('theme', 'light') : u.searchParams.delete('theme');
  motion === 'reduced' ? u.searchParams.set('motion', 'reduced') : u.searchParams.delete('motion');
  history.replaceState(null, '', u);
  fit();
}
function fit() { const z = Math.min(1, (innerWidth - 64) / 1282); document.getElementById('stage').style.zoom = z; }
const keys = Object.keys(VARIANTS);
const step = d => { variant = keys[(keys.indexOf(variant) + d + keys.length) % keys.length]; render(); };
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('states').onclick = e => { const b = e.target.closest('[data-s]'); if (b) { state = b.dataset.s; render(); } };
document.getElementById('theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; render(); };
document.getElementById('motion').onclick = () => { motion = motion === 'reduced' ? 'full' : 'reduced'; render(); };
addEventListener('keydown', e => { if (e.target.closest('input,textarea,[contenteditable]')) return; if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); });
addEventListener('resize', fit);
render();
</script>
</body>
</html>
