<!doctype html>
<!--
  PROTOTYPE — throwaway. Not shipped, not tested, not wired to anything.

  Question: Settings → Agents once "New threads start with" is one set of defaults for every host. How does the
  page say that, and how does "Default projects directory", which is still each computer's own, say which
  computer it belongs to?

  Settled before this prototype (11 October 2026):
    1. Bug: with a forge thread selected, Settings → Agents wrote forge's defaults, and forge refused them
       ("This action is not allowed from this device…"). The defaults now live on this PC and apply to a new
       thread on any host, the way the iPhone's own defaults already do (ADR-0051).
    2. A host that doesn't offer the chosen model starts the thread on its own choice; a permission default that
       lets a thread act without asking applies on a host only while that host lets this PC answer.
    3. This PC may set forge's projects directory (forge's allow-list gains it).

  Variants differ in where each computer's projects directory lives:
    a  Named row.        One field, for the host of the selected thread; its label names the host when it is remote.
    b  Row per computer. One field per connected computer, each saving to its own computer.
    c  In Hosts.         Agents keeps only what applies everywhere; each computer's folder moves to its tile in Hosts.

  The bar: hosts connected, the selected thread's host (variant a), whether forge lets this PC answer, theme, width.
  The permissions chip cycles when pressed, so the held-back note can be seen. ← → cycle variants.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sotto — new-thread defaults on every host, prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face { font-family: 'Figtree'; font-weight: 300 900; font-display: swap; src: url('../../src/shared/fonts/figtree-latin.woff2') format('woff2'); }
:root {
  color-scheme: dark;
  --tt-canvas: oklch(0.115 0.008 265);
  --tt-surface: oklch(0.145 0.008 265);
  --tt-surface-elevated: oklch(0.185 0.008 265);
  --tt-field: oklch(0.13 0.008 265);
  --tt-text: oklch(0.985 0.005 280);
  --tt-text-2: color-mix(in oklab, oklch(0.985 0.005 280) 55%, oklch(0.72 0.014 265));
  --tt-text-muted: color-mix(in oklab, oklch(0.72 0.014 265) 85%, oklch(0.985 0.005 280));
  --tt-hairline: oklch(0.305 0.02 265);
  --tt-border: oklch(0.375 0.024 265);
  --tt-accent: oklch(0.714 0.104 183);
  --tt-on-accent: oklch(0.16 0.012 190);
  --tt-error: oklch(0.68 0.17 25);
  --tt-hover: color-mix(in srgb, oklch(0.32 0.05 185) 70%, transparent);
  --tt-pill: oklch(0.32 0.05 185);
  --tt-pill-ink: oklch(0.96 0.02 185);
  --tt-font: 'Figtree', ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
}
:root[data-theme='light'] {
  color-scheme: light;
  --tt-canvas: oklch(0.978 0.004 85);
  --tt-surface: oklch(0.99 0.003 85);
  --tt-surface-elevated: oklch(0.955 0.006 85);
  --tt-field: oklch(0.995 0.002 85);
  --tt-text: oklch(0.235 0.014 75);
  --tt-text-2: oklch(0.36 0.014 75);
  --tt-text-muted: oklch(0.5 0.014 75);
  --tt-hairline: oklch(0.86 0.012 80);
  --tt-border: oklch(0.82 0.016 80);
  --tt-accent: oklch(0.52 0.13 235);
  --tt-on-accent: oklch(0.99 0.003 85);
  --tt-error: oklch(0.52 0.18 25);
  --tt-hover: oklch(0.93 0.01 85);
  --tt-pill: oklch(0.9 0.03 235);
  --tt-pill-ink: oklch(0.3 0.08 235);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #222; font-family: var(--tt-font); }
.stage { display: flex; justify-content: center; align-items: flex-start; padding: 24px 0 140px; min-height: 100%; }
.window { flex: none; }
.window { zoom: var(--fit, 1); width: var(--w, 1280px); height: var(--h, 800px); background: var(--tt-canvas); color: var(--tt-text); display: grid; grid-template-columns: 250px minmax(0, 1fr); overflow: hidden; border: 1px solid #000; }
.rail { background: var(--tt-surface); border-right: 1px solid var(--tt-hairline); padding: 22px 12px; display: flex; flex-direction: column; gap: 2px; }
.rail .mark { width: 26px; height: 22px; border-radius: 7px; background: var(--tt-accent); margin: 0 10px 22px; opacity: .85; }
.rail h1 { font-size: 22px; font-weight: 600; margin: 0 10px 22px; letter-spacing: -.5px; }
.rail a { display: block; padding: 10px 12px; border-radius: 8px; color: var(--tt-text-2); font-size: 14px; text-decoration: none; }
.rail a.on { background: var(--tt-hover); color: var(--tt-text); }
.rail hr { border: 0; border-top: 1px solid var(--tt-hairline); margin: 12px 10px; }
.main { overflow: auto; padding: 36px 48px 48px; }
.page { max-width: 800px; margin: 0 auto; }
.heading { padding-bottom: 20px; border-bottom: 1px solid var(--tt-hairline); margin-bottom: 10px; }
.heading h2 { margin: 0 0 10px; font-size: 28px; font-weight: 600; letter-spacing: -1px; }
.heading p { margin: 0; color: var(--tt-text-muted); font-size: 16px; }
.rows-heading { margin: 26px 0 2px; font-size: 15px; font-weight: 600; }
.rows-heading.first { margin-top: 8px; }
.subheading { margin: 0 0 4px; color: var(--tt-text-muted); font-size: 13px; line-height: 1.5; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(140px, 260px); align-items: center; gap: 10px 22px; padding: 18px 0; border-top: 1px solid var(--tt-hairline); font-size: 15px; }
.row.chips { grid-template-columns: minmax(160px, 1fr) minmax(0, auto); }
.row strong { display: block; font-weight: 600; }
.row .sub { display: block; margin-top: 2px; color: var(--tt-text-muted); font-size: 13px; line-height: 1.45; }
.row .note { grid-column: 1 / -1; margin: -4px 0 0; color: var(--tt-text-muted); font-size: 12px; line-height: 1.45; }
.controls { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid var(--tt-hairline); border-radius: 999px; background: none; color: var(--tt-text); font: inherit; font-size: 13px; cursor: pointer; }
.chip:hover { background: var(--tt-hover); }
.chip:focus-visible, input:focus-visible, .link:focus-visible { outline: 2px solid var(--tt-accent); outline-offset: 2px; }
.chip .glyph { color: var(--tt-accent); }
.chip::after { content: '⌄'; color: var(--tt-text-muted); margin-left: 2px; transform: translateY(-2px); }
input { width: 100%; min-width: 0; height: 38px; padding: 7px 12px; border: 1px solid var(--tt-hairline); border-radius: 8px; background: var(--tt-field); color: var(--tt-text); font: inherit; font-size: 14px; }
.host-name { display: inline-flex; align-items: center; gap: 6px; }
.host-name .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tt-accent); }
.host-name .dot.off { background: var(--tt-text-muted); }
.pointer { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 0; border-top: 1px solid var(--tt-hairline); color: var(--tt-text-muted); font-size: 14px; line-height: 1.5; }
.link { color: var(--tt-accent); background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
.hosts { display: grid; gap: 10px; }
.tile { border: 1px solid var(--tt-hairline); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
.tile header { display: flex; justify-content: space-between; align-items: baseline; }
.tile header span { color: var(--tt-text-muted); font-size: 13px; }
.tile .row { border-top: 1px solid var(--tt-hairline); padding: 12px 0 0; }
.footer { margin-top: 28px; text-align: right; color: var(--tt-text-muted); font-size: 12px; }
.callout { margin: 18px 0 0; padding: 10px 12px; border-left: 2px solid var(--tt-accent); background: var(--tt-surface); color: var(--tt-text-2); font-size: 13px; line-height: 1.5; }
@media (max-width: 9999px) { .narrow .row, .narrow .row.chips { grid-template-columns: 1fr; } .narrow .controls { justify-content: flex-start; } .narrow .main { padding: 24px 22px; } .narrow .window { grid-template-columns: 170px minmax(0,1fr); } }

/* The prototype's own bar: deliberately not Sotto's look. */
.proto-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #fff; color: #111; border-radius: 999px; box-shadow: 0 8px 30px rgb(0 0 0 / 50%); font: 13px/1.2 ui-sans-serif, system-ui, sans-serif; z-index: 10; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 24px); }
.proto-bar button, .proto-bar select { font: inherit; color: #111; color-scheme: light; border: 1px solid #bbb; background: #f4f4f4; border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.proto-bar .label { font-weight: 700; min-width: 190px; text-align: center; }
.proto-bar label { display: inline-flex; align-items: center; gap: 4px; }
@media (max-width: 700px) {
  .proto-state { display: none; }
  .phone .window { grid-template-columns: 1fr; min-height: 70vh; }
  .phone .rail { display: none; }
  .phone .main { padding: 20px 16px 28px; }
  .phone .heading h2 { font-size: 24px; }
  .stage { padding: 8px 0 200px; }
  .proto-bar { border-radius: 14px; width: calc(100vw - 16px); gap: 6px 8px; padding: 8px; font-size: 12px; bottom: 8px; }
  .proto-bar .label { min-width: 0; flex: 1; }
}
.proto-state { position: fixed; right: 12px; top: 12px; background: #fff; color: #111; border-radius: 8px; padding: 8px 10px; font: 12px/1.45 ui-monospace, monospace; white-space: pre; box-shadow: 0 4px 16px rgb(0 0 0 / 40%); }
</style>
</head>
<body>
<div class="stage"><div class="window" id="window">
  <nav class="rail" aria-label="Settings sections">
    <div class="mark" aria-hidden="true"></div>
    <h1>Settings</h1>
    <a href="#">Dictation</a><a href="#">Transcription</a><a href="#">Cleanup</a><hr>
    <a href="#">Providers</a><a href="#" data-nav="hosts">Hosts</a><a href="#">Phones</a><a href="#">Cloud iPhone</a><hr>
    <a href="#" data-nav="agents" class="on">Agents</a><a href="#">Output</a><a href="#">Appearance</a><a href="#">Application</a><a href="#">Git</a>
  </nav>
  <main class="main"><div class="page" id="page"></div></main>
</div></div>

<div class="proto-state" id="state" aria-hidden="true"></div>
<div class="proto-bar" role="toolbar" aria-label="Prototype controls">
  <button id="prev" aria-label="Previous variant">←</button>
  <span class="label" id="label"></span>
  <button id="next" aria-label="Next variant">→</button>
  <label>Hosts <select id="hosts"><option value="both">This PC + forge</option><option value="local">This PC only</option></select></label>
  <label>Selected thread on <select id="selected"><option value="forge">forge</option><option value="local">This PC</option></select></label>
  <label><input type="checkbox" id="mayAnswer" checked style="width:auto;height:auto"> forge lets this PC answer</label>
  <button id="theme">Light</button>
  <select id="size"><option value="1280x800">1280×800</option><option value="1600x1000">1600×1000</option><option value="820x560">820×560</option></select>
</div>

<script>
const VARIANTS = { a: 'Named row', b: 'Row per computer', c: 'In Hosts' }
const keys = Object.keys(VARIANTS)
const PERMISSIONS = ['Provider default', 'Ask for approval', 'Allow edits', 'Auto', 'Full access']
const GRANTS = new Set(['Allow edits', 'Auto', 'Full access'])
const state = {
  variant: new URLSearchParams(location.search).get('variant') ?? 'a',
  hosts: 'both', selected: 'forge', mayAnswer: true, page: 'agents',
  permission: 'Auto', folders: { local: 'D:\\Projects', forge: '/home/zach/projects' },
}
if (!keys.includes(state.variant)) state.variant = 'a'
const el = id => document.getElementById(id)
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const forgeOn = () => state.hosts === 'both'

function defaultsRow() {
  const held = forgeOn() && !state.mayAnswer && GRANTS.has(state.permission)
  const note = held ? `<p class="note">forge doesn't let this PC answer permission requests yet, so a new thread there starts on "Ask for approval".</p>` : ''
  return `
    <h3 class="rows-heading first">New threads</h3>
    <p class="subheading">A new thread opens straight away with these, on ${forgeOn() ? 'this PC and on forge' : 'this PC and on any host you connect'}. Change them for one thread under its composer.</p>
    <div class="row chips">
      <span><strong>New threads start with</strong><span class="sub">Model, reasoning effort and permissions, as the composer shows them.</span></span>
      <fieldset class="controls" style="border:0;margin:0;padding:0">
        <legend style="position:absolute;clip:rect(0 0 0 0)">New threads start with</legend>
        <button class="chip"><span class="glyph">✳</span> Opus 5.5</button>
        <button class="chip">High</button>
        <button class="chip" id="perm" aria-label="Default permissions for new threads: ${state.permission}">${state.permission}</button>
      </fieldset>
      ${note}
    </div>`
}
function folderInput(host) {
  return `<input aria-label="Default projects directory on ${host === 'local' ? 'this PC' : 'forge'}" data-folder="${host}" value="${esc(state.folders[host])}">`
}
function variantA() {
  const host = forgeOn() ? state.selected : 'local'
  const remote = host === 'forge'
  return `${defaultsRow()}
    <h3 class="rows-heading">Projects</h3>
    <label class="row">
      <span><strong>Default projects directory${remote ? ' on forge' : ''}</strong>
      <span class="sub">${remote ? 'Where a new project goes on forge. Each computer has its own; select a thread on this PC to set this PC\'s.' : 'Where a new project goes on this PC.'}</span></span>
      ${folderInput(host)}
    </label>`
}
function variantB() {
  const rows = [['local', 'This PC'], ...(forgeOn() ? [['forge', 'forge']] : [])]
  return `${defaultsRow()}
    <h3 class="rows-heading">Projects</h3>
    <p class="subheading">Where a new project goes. Each computer has its own folder.</p>
    ${rows.map(([host, name]) => `
    <label class="row">
      <span><strong class="host-name"><span class="dot" aria-hidden="true"></span>${name}</strong>
      <span class="sub">Default projects directory${host === 'local' ? '' : ', saved on forge'}</span></span>
      ${folderInput(host)}
    </label>`).join('')}`
}
function variantC() {
  return `${defaultsRow()}
    <h3 class="rows-heading">Projects</h3>
    <div class="pointer"><span>Each computer keeps its own projects folder. Set it on the computer's tile in Hosts.</span><button class="link" id="toHosts">Open Hosts</button></div>`
}
function hostsPage() {
  const tiles = [['local', 'This PC', 'Local host · running'], ...(forgeOn() ? [['forge', 'forge', 'Over SSH · connected']] : [])]
  return `<div class="heading"><h2>Hosts</h2><p>Local & remote hosts</p></div>
    <p class="callout">Variant c only: this page already holds each host's tile. Only the projects folder row is new here; the rest of the tile is abbreviated.</p>
    <div class="hosts" style="margin-top:18px">${tiles.map(([host, name, status]) => `
      <section class="tile" aria-label="${name}">
        <header><strong>${name}</strong><span>${status}</span></header>
        <label class="row"><span><strong>Default projects directory</strong><span class="sub">Where a new project goes on ${host === 'local' ? 'this PC' : 'forge'}.</span></span>${folderInput(host)}</label>
      </section>`).join('')}</div>
    <p style="margin-top:18px"><button class="link" id="toAgents">Back to Agents</button></p>`
}
function render() {
  const [w, h] = el('size').value.split('x').map(Number)
  const win = el('window')
  // A phone shows the Agents page alone at its own width: the desktop window scaled down would be unreadable.
  const phone = Math.min(innerWidth, screen.width) < 700
  win.style.setProperty('--w', phone ? 'calc(100vw - 16px)' : w + 'px'); win.style.setProperty('--h', phone ? 'auto' : h + 'px')
  win.style.setProperty('--fit', phone ? '1' : String(Math.min(1, (innerWidth - 16) / w)))
  document.body.classList.toggle('phone', phone)
  document.body.classList.toggle('narrow', phone || w <= 820)
  el('size').disabled = phone
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === state.page))
  const body = state.page === 'hosts' ? hostsPage()
    : `<div class="heading"><h2>Agents</h2><p>New threads & projects</p></div>${{ a: variantA, b: variantB, c: variantC }[state.variant]()}<p class="footer">Changes save as you make them.</p>`
  el('page').innerHTML = body
  el('label').textContent = `${state.variant} — ${VARIANTS[state.variant]}`
  el('selected').disabled = state.variant !== 'a' || !forgeOn()
  el('perm')?.addEventListener('click', () => { state.permission = PERMISSIONS[(PERMISSIONS.indexOf(state.permission) + 1) % PERMISSIONS.length]; render(); el('perm').focus() })
  el('toHosts')?.addEventListener('click', () => { state.page = 'hosts'; render() })
  el('toAgents')?.addEventListener('click', () => { state.page = 'agents'; render() })
  document.querySelectorAll('[data-folder]').forEach(input => input.addEventListener('change', () => { state.folders[input.dataset.folder] = input.value; render() }))
  el('state').textContent = JSON.stringify({ variant: state.variant, page: state.page, hosts: state.hosts, selected: state.selected, forgeMayAnswer: state.mayAnswer, permission: state.permission, folders: state.folders }, null, 1)
}
function go(step) {
  state.variant = keys[(keys.indexOf(state.variant) + step + keys.length) % keys.length]; state.page = 'agents'
  const url = new URL(location.href); url.searchParams.set('variant', state.variant); history.replaceState(null, '', url)
  render()
}
el('prev').onclick = () => go(-1); el('next').onclick = () => go(1)
el('hosts').onchange = e => { state.hosts = e.target.value; render() }
el('selected').onchange = e => { state.selected = e.target.value; render() }
el('mayAnswer').onchange = e => { state.mayAnswer = e.target.checked; render() }
el('size').onchange = render
addEventListener('resize', render)
el('theme').onclick = () => { const light = document.documentElement.dataset.theme !== 'light'; document.documentElement.dataset.theme = light ? 'light' : ''; el('theme').textContent = light ? 'Dark' : 'Light' }
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select, [contenteditable]')) return
  if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1)
})
document.querySelectorAll('.rail a').forEach(a => a.addEventListener('click', e => { e.preventDefault(); if (a.dataset.nav) { state.page = a.dataset.nav; render() } }))
render()
</script>
</body>
</html>
