<!--
  PROTOTYPE, throwaway. Question: how does an Omarchy user get from "sotto-bin is installed" to "F9 works, the owl is
  in the bar and Sotto follows my theme" in one step? Today that takes three manual steps (apps/omarchy/README.md),
  and the package ships only the first of the three pieces.

  Three variants, each on a mock Omarchy desktop (Tokyo Night, or Catppuccin Latte in light) with Sotto's window
  tiled under the bar:
    A  One press: a first-run step and a Settings › Dictation block, one button sets up all three; Remove per piece.
    B  Three switches: the same two places, one switch per piece, each applied the moment it is flipped.
    C  In a terminal: `sotto setup` does the work in a floating terminal (install.sh runs the same command);
       Sotto's window only shows status and opens the terminal.

  Every view is a link: #v=a|b|c &surface=firstrun|settings|install (install: C only) &state=offer|working|done|
  partial|failed|conflict|undo|update|byhand &size=1280|820 &look=dark|light &motion=full|reduced. A missing or
  unknown key takes its default (a, firstrun, offer, 1280, dark, full). Left and Right arrows change the variant.
  Hold F9 once the keys are set up to see the shell pill.

  Sotto's colours are the Sotto theme's roles (src/shared/themes/palettes.ts). The Omarchy theme is painted from
  apps/omarchy/sotto.json.tpl's mixes of the desk's colours.toml. Figtree (OFL-1.1) is inlined, so the page makes
  no requests. Nothing here is product code; nothing persists.
-->

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#0b0b0d;color:#e8e8ea;font:14px/1.5 Figtree,system-ui,sans-serif;overflow:hidden}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit}
#viewport{position:absolute;inset:0 0 var(--panel-h,128px) 0;display:grid;place-items:center;overflow:hidden}
#fit{position:relative}
#desk-scale{position:absolute;left:0;top:0;transform-origin:0 0}

/* ================= the Omarchy desk: colours.toml of the current desktop theme ================= */
.desk{position:relative;overflow:hidden;background:var(--o-wall);font-family:'JetBrainsMono Nerd Font','JetBrains Mono',ui-monospace,monospace}
.desk[data-look=dark]{
  --o-bg:#1a1b26;--o-bg-dark:#13141c;--o-bg-lighter:#24283b;--o-fg:#a9b1d6;--o-fg-bright:#c0caf5;--o-fg-dim:#565f89;
  --o-accent:#7aa2f7;--o-red:#f7768e;--o-green:#9ece6a;--o-yellow:#e0af68;--o-magenta:#bb9af7;--o-cyan:#7dcfff;
  --o-inactive:rgb(89 89 89 / 67%);
  --o-wall:radial-gradient(70% 90% at 82% 18%,#4a2a63 0%,transparent 60%),radial-gradient(60% 80% at 12% 88%,#6b2550 0%,transparent 62%),linear-gradient(135deg,#191a2b,#262a44);
  --o-name:'Tokyo Night';
}
.desk[data-look=light]{
  --o-bg:#eff1f5;--o-bg-dark:#e3e4e8;--o-bg-lighter:#dce0e8;--o-fg:#4c4f69;--o-fg-bright:#4c4f69;--o-fg-dim:#6c6f85;
  --o-accent:#1e66f5;--o-red:#d20f39;--o-green:#40a02b;--o-yellow:#df8e1d;--o-magenta:#8839ef;--o-cyan:#04a5e5;
  --o-inactive:rgb(89 89 89 / 67%);
  --o-wall:radial-gradient(70% 90% at 82% 18%,#f5c2e7 0%,transparent 60%),radial-gradient(60% 80% at 12% 88%,#bcd2fb 0%,transparent 62%),linear-gradient(135deg,#eff1f5,#dce0e8);
}
/* the bar: omarchy.bar, 26 px, the clock at the centre and Omarchy's indicators beside it */
.o-bar{position:absolute;left:0;right:0;top:0;height:26px;background:var(--o-bg);color:var(--o-fg);font-size:12px;line-height:26px;white-space:nowrap;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.o-left{display:flex;align-items:center;gap:2px;padding-left:9px}
.o-logo{width:13px;height:13px;margin-right:8px;border:2px solid currentColor;border-radius:2px}
.o-ws{width:20px;text-align:center;opacity:.5}
.o-ws.on{opacity:1;color:var(--o-fg-bright)}
.o-center{display:flex;align-items:center;justify-content:center;gap:2px}
.o-inds{display:flex;align-items:center}
.o-ind{width:20px;height:26px;display:grid;place-items:center}
.o-ind i{width:9px;height:9px;border:1.5px solid currentColor;border-radius:50%;opacity:.75}
.o-ind:nth-child(2) i{border-radius:2px}
.o-clock{padding:0 10px}
.o-right{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding-right:12px;opacity:.85}
.o-right i{width:11px;height:11px;border:1.5px solid currentColor;border-radius:3px}
.o-owl{display:inline-grid;place-items:center;width:0;height:26px;overflow:hidden;color:var(--o-fg);transition:width .3s ease}
.o-owl svg{width:14px;height:14px;transform:translateY(-22px);opacity:0;transition:transform .45s cubic-bezier(.2,.9,.25,1.25),opacity .2s}
.o-owl[data-on=true]{width:26px}
.o-owl[data-on=true] svg{transform:none;opacity:1}
.o-owl[data-live=true]{color:var(--o-red)}

/* tiled window: gaps_out 10, border 2, square corners, no title bar */
.o-win{position:absolute;left:10px;top:36px;border:2px solid var(--o-accent);overflow:hidden;background:var(--o-bg)}
.o-win.dim{border-color:var(--o-inactive)}

/* a floating terminal, as Omarchy opens installers: centred, accent border, the theme's colours */
.o-float{position:absolute;border:2px solid var(--o-accent);background:var(--o-bg);color:var(--o-fg);box-shadow:0 20px 50px rgb(0 0 0 / 45%);display:flex;flex-direction:column}
.o-float.tiled{box-shadow:none}
.term{flex:1;min-height:0;overflow:auto;padding:12px 16px;font-size:12.5px;line-height:18px;white-space:pre-wrap;word-break:break-word;scrollbar-width:thin}
.term:focus{outline:none}
.term .cmd{color:var(--o-fg-bright)}
.term .cmd::before{content:'❯ ';color:var(--o-green)}
.term .dim{color:var(--o-fg-dim)}
.term .acc{color:var(--o-accent)}
.term .ok{color:var(--o-green)}
.term .err{color:var(--o-red)}
.term .warn{color:var(--o-yellow)}
.term .q{color:var(--o-magenta)}
.term .bri{color:var(--o-fg-bright)}
.term .gum{display:flex;gap:10px;margin:6px 0 4px 2px}
.term .gum button{border:0;background:var(--o-bg-lighter);color:var(--o-fg);font:inherit;padding:2px 14px;cursor:pointer}
.term .gum button.yes{background:var(--o-accent);color:var(--o-bg)}
.term .gum button:focus-visible{outline:2px solid var(--o-fg-bright);outline-offset:2px}
.term .caret{display:inline-block;width:7.5px;height:14px;vertical-align:-2px;background:var(--o-fg);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* the shell pill under the bar while F9 is held, in the shell's own style (#850, widget B) */
.o-pill{position:absolute;top:34px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:7px 8px 7px 12px;background:var(--o-bg);color:var(--o-fg);border:2px solid var(--o-accent);font-size:12px;box-shadow:0 10px 30px rgb(0 0 0 / 35%);z-index:5}
.o-pill svg{width:14px;height:14px;color:var(--o-red)}
.o-pill .bars{display:flex;gap:2px;align-items:center;height:14px}
.o-pill .bars i{width:3px;background:var(--o-red);animation:lvl .5s ease-in-out infinite alternate}
.o-pill .bars i:nth-child(2){animation-delay:.15s}.o-pill .bars i:nth-child(3){animation-delay:.3s}.o-pill .bars i:nth-child(4){animation-delay:.1s}
@keyframes lvl{from{height:3px}to{height:14px}}
.o-pill b{font-weight:400;color:var(--o-fg-bright)}
.o-pill .pbtn{padding:1px 8px;background:var(--o-bg-lighter)}
.o-pill[data-stage=done] svg{color:var(--o-green)}

/* an Omarchy notification, top right, as Voxtype's installer sends one */
.o-note{position:absolute;right:12px;top:38px;width:300px;padding:10px 14px;background:var(--o-bg);color:var(--o-fg);border:2px solid var(--o-accent);font-size:12px;line-height:17px;z-index:6;animation:note-in .3s ease}
.o-note b{display:block;color:var(--o-fg-bright);font-weight:600}
@keyframes note-in{from{opacity:0;transform:translateY(-6px)}}

/* ================= Sotto's window: theme roles ================= */
.win{
  --tt-hairline:color-mix(in oklab,var(--tt-border) 70%,var(--tt-surface));
  --tt-primary:var(--tt-text);--tt-on-primary:var(--tt-canvas);
  --tt-accent-text:color-mix(in oklab,var(--tt-accent) 78%,var(--tt-text));
  position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;
  background:var(--tt-canvas);color:var(--tt-text);font:14px/1.5 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  transition:background-color .6s ease,color .6s ease
}
.win *{transition:background-color .6s ease,border-color .6s ease,color .6s ease}
.win[data-look=dark][data-pal=sotto]{
  --tt-canvas:oklch(0.115 0.008 265);--tt-surface:oklch(0.145 0.008 265);--tt-raised:oklch(0.185 0.008 265);
  --tt-text:oklch(0.985 0.005 280);--tt-muted:oklch(0.72 0.014 265);--tt-border:oklch(0.305 0.02 265);--tt-input:oklch(0.375 0.024 265);
  --tt-accent:oklch(0.714403 0.104089 183.092);--tt-on-accent:oklch(0.16 0.012 190);
  --tt-sidebar:oklch(0.235 0.003 265);--tt-row-active:oklch(0.32 0.025 190);--tt-row-hover:oklch(0.28 0.003 265);
}
.win[data-look=light][data-pal=sotto]{
  --tt-canvas:oklch(0.978 0.004 85);--tt-surface:oklch(0.99 0.003 85);--tt-raised:oklch(0.955 0.006 85);
  --tt-text:oklch(0.235 0.014 75);--tt-muted:oklch(0.5 0.014 75);--tt-border:oklch(0.86 0.012 80);--tt-input:oklch(0.8 0.016 80);
  --tt-accent:oklch(0.53 0.095 186);--tt-on-accent:oklch(0.99 0.003 85);
  --tt-sidebar:oklch(0.955 0.008 85);--tt-row-active:oklch(0.915 0.02 190);--tt-row-hover:oklch(0.93 0.01 85);
}
/* the Omarchy theme: sotto.json.tpl's mixes of background and foreground; muted text lifted as the readability check would */
.win[data-pal=omarchy]{
  --tt-canvas:var(--o-bg);--tt-surface:color-mix(in srgb,var(--o-bg) 97%,var(--o-fg));--tt-raised:color-mix(in srgb,var(--o-bg) 93%,var(--o-fg));
  --tt-text:var(--o-fg);--tt-border:color-mix(in srgb,var(--o-bg) 85%,var(--o-fg));--tt-input:color-mix(in srgb,var(--o-bg) 76%,var(--o-fg));
  --tt-accent:var(--o-accent);--tt-on-accent:var(--o-bg);
  --tt-sidebar:color-mix(in srgb,var(--o-bg) 91%,var(--o-fg));--tt-row-active:color-mix(in srgb,var(--o-bg) 82%,var(--o-accent));--tt-row-hover:color-mix(in srgb,var(--o-bg) 86%,var(--o-fg));
}
.win[data-look=dark][data-pal=omarchy]{--tt-muted:color-mix(in srgb,var(--o-fg) 72%,var(--o-bg))}
.win[data-look=light][data-pal=omarchy]{--tt-muted:color-mix(in srgb,var(--o-fg) 84%,var(--o-bg))}
.win[data-look=dark]{--tt-success:oklch(0.79 0.13 165);--tt-warning:oklch(0.829 0.171 81);--tt-error:oklch(0.75 0.16 22);--tt-shadow:0 24px 60px rgb(0 0 0 / 50%)}
.win[data-look=light]{--tt-success:oklch(0.5 0.11 158);--tt-warning:oklch(0.547 0.156 45.4);--tt-error:oklch(0.509 0.209 28.5);--tt-shadow:0 24px 60px rgb(20 24 22 / 14%)}
.win :focus-visible{outline:3px solid var(--tt-accent);outline-offset:2px}
.win h1:focus,.win h2:focus{outline:none}
.win code{font:500 12.5px ui-monospace,'JetBrains Mono',monospace;color:var(--tt-text)}

/* shared controls: the app's Button, Toggle and status words */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:1px solid transparent;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;background:none;color:var(--tt-text)}
.btn.primary{background:var(--tt-primary);color:var(--tt-on-primary)}
.btn.secondary{border-color:var(--tt-border)}
.btn.secondary:hover{background:var(--tt-raised)}
.btn.ghost{color:var(--tt-muted)}
.btn.ghost:hover{background:var(--tt-raised);color:var(--tt-text)}
.btn.sm{height:34px;padding:0 14px;font-size:13.5px}
.btn[aria-disabled=true]{opacity:.55;cursor:default}
.btn svg{flex:none}
.ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--tt-raised);color:var(--tt-muted);font-size:13px;font-weight:600;white-space:nowrap}
.status[data-k=done]{background:color-mix(in srgb,var(--tt-success) 13%,transparent);color:var(--tt-text)}
.status[data-k=done] svg{color:var(--tt-success)}
.status[data-k=failed]{background:color-mix(in srgb,var(--tt-error) 13%,transparent);color:var(--tt-text)}
.status[data-k=failed] svg{color:var(--tt-error)}
.status[data-k=working],.status[data-k=stale]{background:color-mix(in srgb,var(--tt-accent) 14%,transparent);color:var(--tt-text)}
.status[data-k=working] svg,.status[data-k=stale] svg{color:var(--tt-accent)}
.status svg{width:14px;height:14px}

/* the strip of first-run setup: the mark on the left, no window controls on Linux */
.strip{height:52px;display:flex;align-items:center;gap:9px;padding:0 18px;font-weight:600;font-size:15px}
.mark{width:22px;height:22px;flex:none}
.room{position:relative;min-height:0;overflow:hidden;background:radial-gradient(circle at 50% 118%,color-mix(in srgb,var(--tt-accent) 11%,transparent),transparent 46%),var(--tt-canvas)}

/* first-run setup: progress above a trimmed card (the shipped layout A) */
.fr{height:100%;display:flex;flex-direction:column;align-items:center;padding:14px 24px 22px}
.prog{width:min(680px,100%);flex:none;margin-bottom:12px}
.ptext{display:block;margin-bottom:8px;color:var(--tt-muted);font-size:12px;font-weight:600;letter-spacing:.04em;text-align:center;text-transform:uppercase}
.groups{display:flex;gap:10px;margin:0;padding:0;list-style:none}
.groups li{display:grid;gap:5px;min-width:0}
.bars{display:flex;gap:3px}
.bars i{flex:1;height:2px;border-radius:9px;background:color-mix(in srgb,var(--tt-border) 60%,transparent)}
.bars i[data-done=true]{background:color-mix(in srgb,var(--tt-accent) 55%,transparent)}
.bars i[data-cur=true]{background:var(--tt-accent)}
.gname{font-size:12px;color:var(--tt-muted);text-align:center;white-space:nowrap}
.groups li[data-cur=true] .gname{color:var(--tt-text);font-weight:600}
.card{width:min(680px,100%);flex:0 1 auto;max-height:100%;background:var(--tt-surface);border:1px solid var(--tt-hairline);border-radius:16px;box-shadow:var(--tt-shadow);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.cbody{flex:1 1 auto;min-height:0;overflow-y:auto;padding:26px 36px 20px;display:grid;gap:16px;align-content:start;scrollbar-width:thin}
.cbody h1{margin:0;font-size:28px;font-weight:500;letter-spacing:-.6px;line-height:1.14}
.lead{margin:-6px 0 0;color:var(--tt-muted)}
.cfoot{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 36px 14px;border-top:1px solid var(--tt-hairline)}
.win[data-size=min] .fr{padding:10px 16px 14px}
.win[data-size=min] .prog{margin-bottom:8px}
.win[data-size=min] .cbody{padding:18px 24px 14px;gap:12px}
.win[data-size=min] .cbody h1{font-size:23px}
.win[data-size=min] .cfoot{padding:10px 24px 12px}
.win[data-size=min] .piece,.win[data-size=min] .tgl{padding:10px 14px}
.win[data-size=min] .pnote .acts{margin-top:6px}

/* the three pieces, as rows */
.pieces{list-style:none;margin:0;padding:0;border:1px solid var(--tt-hairline);border-radius:12px;background:color-mix(in oklab,var(--tt-canvas) 50%,var(--tt-surface))}
.piece{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:3px 14px;align-items:center;padding:12px 16px;border-top:1px solid var(--tt-hairline)}
.piece:first-child{border-top:0}
.pico{grid-row:1/span 2;align-self:start;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--tt-raised);color:var(--tt-accent-text)}
.pico svg{width:17px;height:17px}
.pico .owl{width:18px;height:18px;fill:currentColor;stroke:none}
.pname{font-weight:600;font-size:14.5px;line-height:1.3;min-width:0}
.pwhat{grid-column:2;color:var(--tt-muted);font-size:13px;line-height:1.4}
.pside{grid-row:1/span 2;grid-column:3;display:flex;align-items:center;gap:8px;justify-content:flex-end}
.pfiles{grid-column:2/-1;margin:4px 0 0;padding:0;list-style:none;display:grid;gap:1px}
.pfiles li{font:12px/1.5 ui-monospace,'JetBrains Mono',monospace;color:var(--tt-muted);overflow-wrap:anywhere}
.pnote{grid-column:2/-1;margin:4px 0 0;font-size:13px;line-height:1.45;color:var(--tt-muted)}
.pnote[data-k=failed]{color:var(--tt-text)}
.pnote[data-k=failed]::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tt-error);margin-right:8px;vertical-align:1px}
.pnote .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.pask{grid-column:2/-1;margin:6px 0 0;padding:10px 12px;border-radius:10px;border:1px solid color-mix(in srgb,var(--tt-warning) 45%,var(--tt-hairline));background:color-mix(in srgb,var(--tt-warning) 7%,transparent);font-size:13px}
.pask p{margin:0 0 8px}
.pask p::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tt-warning);margin-right:8px;vertical-align:1px}
.radios{display:flex;gap:6px;flex-wrap:wrap}
.radio{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--tt-border);background:transparent;cursor:pointer;font-size:13.5px;font-weight:600}
.radio i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--tt-muted)}
.radio[aria-checked=true]{border-color:var(--tt-accent);background:color-mix(in srgb,var(--tt-accent) 10%,transparent)}
.radio[aria-checked=true] i{border:4px solid var(--tt-accent)}
.info{grid-column:2/-1;margin:2px 0 0;font-size:13px;color:var(--tt-muted)}
.row-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.linkish{border:0;background:none;padding:0;color:var(--tt-accent-text);font-weight:600;font-size:13.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.done-band{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--tt-success) 45%,var(--tt-hairline));background:color-mix(in srgb,var(--tt-success) 8%,transparent)}
.done-band p{margin:0;flex:1;font-size:14px}
.done-band p span{display:block;color:var(--tt-muted);font-size:13px}
.key{display:inline-grid;place-items:center;min-width:52px;height:40px;padding:0 12px;border-radius:9px;border:1px solid var(--tt-border);border-bottom-width:3px;background:var(--tt-raised);font-weight:700;font-size:14px;cursor:pointer;user-select:none;touch-action:none}
.key[data-down=true]{border-bottom-width:1px;transform:translateY(2px);border-color:var(--tt-accent)}
.cmdline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--tt-muted);font-size:13px}
.cmdline code{padding:3px 8px;border-radius:7px;background:var(--tt-raised)}

/* switches (variant B), the app's Toggle */
.tgl{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:3px 14px;align-items:center;padding:12px 16px;border-top:1px solid var(--tt-hairline)}
.tgl:first-child{border-top:0}
.switch{position:relative;width:42px;height:24px;border-radius:999px;border:1px solid var(--tt-input);background:var(--tt-raised);cursor:pointer;padding:0;grid-row:1/span 2;grid-column:3}
.switch i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--tt-muted);transition:transform .18s ease,background-color .18s}
.switch[aria-checked=true]{background:var(--tt-accent);border-color:var(--tt-accent)}
.switch[aria-checked=true] i{transform:translateX(18px);background:var(--tt-on-accent)}
.switch[aria-busy=true] i{background:transparent;border:2px solid var(--tt-accent);border-right-color:transparent;animation:spin .8s linear infinite;transform:translateX(9px)}
.switch[aria-busy=true]{background:var(--tt-raised);border-color:var(--tt-input)}

/* Settings: the rail and the Dictation section */
.set{grid-row:1/-1;display:grid;grid-template-columns:var(--rail,248px) minmax(0,1fr);height:100%;min-height:0}
.win[data-size=min] .set{--rail:204px}
.rail{background:var(--tt-sidebar);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--tt-hairline)}
.rail .strip{height:52px;padding:0 16px}
.rail h1{margin:4px 0 12px;padding:0 20px;font-size:24px;font-weight:600;letter-spacing:-.7px;line-height:1.2}
.subnav{display:flex;flex-direction:column;gap:2px;padding:0 10px;overflow:auto;min-height:0;scrollbar-width:none}
.subnav button{display:flex;align-items:center;gap:11px;width:100%;min-height:38px;padding:8px 12px;border:0;border-radius:8px;background:none;color:var(--tt-muted);text-align:left;cursor:pointer;font-size:14px}
.subnav button[aria-selected=true]{background:var(--tt-row-active);color:var(--tt-text)}
.subnav button[aria-selected=true] svg{color:var(--tt-accent)}
.subnav button:nth-of-type(4),.subnav button:nth-of-type(8){margin-top:18px}
.detail{min-height:0;overflow:auto;padding:36px 6% 40px;scrollbar-width:thin}
.win[data-size=min] .detail{padding:24px 26px 30px}
.form{max-width:720px;margin:0 auto}
.shead{margin:0 0 4px;padding:0 0 18px;border-bottom:1px solid var(--tt-hairline)}
.shead h2{margin:0 0 8px;font-size:28px;font-weight:600;letter-spacing:-1px;line-height:1.2}
.shead p{margin:0;color:var(--tt-muted);font-size:16px}
.win[data-size=min] .shead h2{font-size:24px}
.win[data-size=min] .shead p{font-size:14.5px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) minmax(140px,240px);gap:5px 22px;align-items:center;padding:17px 0;border-bottom:1px solid var(--tt-hairline)}
.srow strong,.slabel{font-size:15px;font-weight:500;line-height:1.35}
.srow p,.sdesc{margin:0;color:var(--tt-muted);font-size:13px;line-height:1.45}
.select{height:38px;border:1px solid var(--tt-hairline);border-radius:8px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;color:var(--tt-text);font-size:14px;grid-row:1/span 2;grid-column:2}
.om{padding:17px 0 18px;border-bottom:1px solid var(--tt-hairline);display:grid;gap:12px}
.omhead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.omhead > div{min-width:0;flex:1 1 260px}
.omhead .sdesc{max-width:400px}
.notice{margin:0;padding:10px 14px;border-radius:10px;font-size:13.5px;line-height:1.45;border:1px solid var(--tt-hairline);background:var(--tt-raised)}
.notice ul{margin:4px 0 0;padding-left:18px}

/* the prototype's own control panel: deliberately not Sotto's look */
#panel{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(1180px,calc(100vw - 20px));background:#f4f4f2;color:#111;border-radius:14px;box-shadow:0 10px 40px #0008;font:13px/1.35 system-ui,sans-serif;padding:8px 10px;display:grid;gap:6px;z-index:50}
#panel .r{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#panel .tag{font-weight:800;letter-spacing:.06em;font-size:11px;background:#111;color:#f4f4f2;border-radius:6px;padding:3px 7px}
#panel .vname{font-weight:700;min-width:178px;text-align:center}
#panel button{border:1px solid #c9c9c4;background:#fff;color:#111;border-radius:8px;padding:4px 9px;cursor:pointer;font:inherit}
#panel button[aria-pressed=true]{background:#111;color:#fff;border-color:#111}
#panel button:focus-visible{outline:3px solid #2f6fed;outline-offset:1px}
#panel .sep{width:1px;height:20px;background:#ccc;margin:0 4px}
#panel .lbl{color:#555;font-size:12px;margin-left:2px}
#panel .readout{font:12px ui-monospace,monospace;color:#333;margin-left:auto}
#panel .hint{color:#555;font-size:12px}
#panel details{position:relative}
#panel summary{cursor:pointer;list-style:none;border:1px solid #c9c9c4;background:#fff;border-radius:8px;padding:4px 9px}
#panel summary::-webkit-details-marker{display:none}
#panel .env{position:absolute;bottom:34px;left:0;background:#fff;border:1px solid #c9c9c4;border-radius:10px;padding:10px 12px;display:grid;gap:6px;width:320px;box-shadow:0 8px 30px #0003}
#panel .env label{display:flex;gap:8px;align-items:flex-start}
#panel select{font:inherit;border:1px solid #c9c9c4;border-radius:8px;padding:4px 6px;background:#fff;color:#111}
#panel .narrow{display:none}
@media (max-width:700px){#panel .readout,#panel .hint,#panel .wide{display:none}#panel .narrow{display:flex}#panel .vname{min-width:0;flex:1}}

[data-motion=reduced] *, [data-motion=reduced] *::before{animation:none!important;transition:none!important}
</style>
</head>
<body>
<div id="viewport"><div id="fit"><div id="desk-scale"></div></div></div>
<div id="panel" role="region" aria-label="Prototype controls"></div>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>
<script>

const CANCELLED = Symbol('cancelled')
const wait = (id, ms) => new Promise((resolve, reject) => {
  if (S.fast) return id === S.runId ? resolve() : reject(CANCELLED)
  setTimeout(() => id === S.runId ? resolve() : reject(CANCELLED), S.motion === 'reduced' ? Math.min(ms, 200) : ms)
})
const say = text => { const live = document.getElementById('live'); live.textContent = ''; setTimeout(() => { live.textContent = text }, 30) }
const owlOn = () => ['done', 'stale'].includes(S.p.owl) && !S.owlFlicker
const keysOn = () => ['done', 'stale', 'manual'].includes(S.p.keys)
const themeOn = () => ['done', 'stale'].includes(S.p.theme)

function outcome(k) {
  if (k === 'keys') {
    if (S.env.f9Other && S.keyChoice === 'keep') return ['skipped', { text: 'Left alone. F9 still runs Toggle screen recording.' }]
    if (S.env.luaError) return ['failed', { kind: 'lua' }]
    return ['done', { text: 'Hyprland reloaded with no errors.' + (S.env.voxtype ? ' Voxtype keeps running without these keys.' : '') }]
  }
  if (k === 'owl') {
    if (S.env.shellDown) return ['failed', { kind: 'shell' }]
    return ['done', { text: 'On the bar. Sotto’s floating widget steps aside.' }]
  }
  return ['done', { text: `Sotto follows ${omarchyName()}.` }]
}
const removedText = {
  keys: () => S.env.voxtype ? 'Removed. F9 and Super+Ctrl+X are Voxtype’s again.' : 'Removed. F9 and Super+Ctrl+X do nothing now.',
  owl: () => 'Removed. The owl is off the bar and the floating widget is back.',
  theme: () => 'Removed. Sotto wears the theme it had before.',
}
const failText = {
  lua: 'Hyprland reported an error in bindings.lua once Sotto’s line was in, so Sotto took the line out. Your file is as it was. Hyprland said: “line 58: unexpected symbol near ‘end’”. Fix that line, then try again.',
  shell: 'The Omarchy shell isn’t running, so the owl can’t go on the bar. Nothing was copied. Start the shell with omarchy restart shell, then try again.',
}

/* the in-app engine (A and B): set up or remove pieces one at a time, each reporting as it lands */
async function setUp(list) {
  const id = ++S.runId
  S.notice = null; S.confirm = null
  list.forEach(k => { S.p[k] = 'queued'; S.note[k] = null })
  render()
  try {
    for (const k of list) {
      S.p[k] = 'working'; render(); await wait(id, 950)
      const [status, note] = outcome(k)
      S.p[k] = status; S.note[k] = note
      render(); say(`${PIECE[k].title}: ${status === 'done' ? 'done' : status === 'failed' ? 'could not be set up' : 'left alone'}.`)
      await wait(id, 260)
    }
  } catch (e) { if (e !== CANCELLED) throw e; return }
  const all = KEYS.every(k => ['done', 'manual'].includes(S.p[k]))
  if (all && !S.fast) say('Sotto is set up in Omarchy. Hold F9 anywhere to talk.')
  render()
}
async function removePieces(list) {
  const id = ++S.runId
  S.notice = null
  try {
    for (const k of list) {
      S.removing[k] = true; S.p[k] = 'working'; render(); await wait(id, 650)
      S.removing[k] = false; S.p[k] = 'missing'; S.note[k] = { text: removedText[k](), removed: true }
      render(); say(removedText[k]())
    }
  } catch (e) { if (e !== CANCELLED) throw e }
}
async function refresh(list, restartsBar) {
  const id = ++S.runId
  try {
    for (const k of list) {
      S.p[k] = 'working'; S.note[k] = null
      if (k === 'owl' && restartsBar) S.owlFlicker = true
      render(); await wait(id, 900)
      S.owlFlicker = false; S.p[k] = 'done'
      S.note[k] = { text: k === 'owl' ? 'Updated. The bar restarted with the newer owl.' : 'Updated for Sotto 0.1.36.' }
      render(); say(`${PIECE[k].title}: updated.`)
    }
    if (KEYS.every(k => S.p[k] !== 'stale')) S.env.newer = false
  } catch (e) { if (e !== CANCELLED) throw e }
}
function retry(k) {
  if (k === 'keys') S.env.luaError = false
  if (k === 'owl') S.env.shellDown = false
  setUp([k])
}

/* ---------------- variant C: the terminal transcript ---------------- */
function termOpen(kind, tiled = false) { S.term = { kind, tiled, lines: [], ask: null, finished: false }; render() }
const line = (cls, text) => { S.term.lines.push({ cls, text }); render(); scrollTerm() }
function scrollTerm() { const t = document.querySelector('.term'); if (t) t.scrollTop = t.scrollHeight }
function ask(id, question, yes = 'Yes', no = 'No') {
  return new Promise((resolve, reject) => {
    if (S.fast) { line('q', question); line('dim', `  ${yes}`); return resolve(true) }
    S.term.ask = { question, yes, no, resolve: answer => { S.term.ask = null; line('q', question); line('dim', `  ${answer ? yes : no}`); id === S.runId ? resolve(answer) : reject(CANCELLED) } }
    render(); scrollTerm()
    requestAnimationFrame(() => document.querySelector('.gum .yes')?.focus())
  })
}
const pad = s => (s + '        ').slice(0, 8)
async function termSetup(id, fromInstall = false) {
  if (!fromInstall) line('cmd', 'sotto setup')
  const stale = KEYS.filter(k => S.p[k] === 'stale')
  if (stale.length) {
    line('', `Sotto 0.1.36 changed ${stale.map(k => PIECE[k].short).join(' and ')}.`)
    if (!(await ask(id, `? Update ${stale.length > 1 ? 'them' : 'it'}?`))) { line('dim', 'Nothing changed.'); return finish(id) }
    for (const k of stale) {
      S.p[k] = 'working'; if (k === 'owl') S.owlFlicker = true; render(); await wait(id, 800)
      S.owlFlicker = false; S.p[k] = 'done'
      line('ok', `✓ ${pad(PIECE[k].term)}${k === 'owl' ? 'Updated. Restarted the bar to load it.' : 'Updated.'}`)
    }
    S.env.newer = false
    line('', ''); line('bri', 'Up to date.')
    return finish(id)
  }
  const todo = KEYS.filter(k => !['done', 'manual'].includes(S.p[k]))
  if (!todo.length) { line('', 'Sotto is already set up in Omarchy. Nothing to do.'); return finish(id) }
  line('', 'Sotto changes three things in your Omarchy settings:'); line('', '')
  for (const k of KEYS) {
    const done = ['done', 'manual'].includes(S.p[k])
    line(done ? 'dim' : 'bri', `  ${pad(PIECE[k].term)}${PIECE[k].what}${done ? '  (already set up)' : ''}`)
    line('dim', `          ${PIECE[k].files[0]}`)
  }
  line('', '')
  if (S.env.byHand) line('', 'Your bindings.lua already gives F9 and Super+Ctrl+X to Sotto. Leaving those lines alone.')
  else if (S.env.voxtype) line('warn', 'Voxtype has F9 and Super+Ctrl+X now. Sotto takes them over; Voxtype stays installed.')
  let giveF9 = true
  if (S.env.f9Other && todo.includes('keys')) {
    line('warn', 'F9 runs “Toggle screen recording” from your bindings.lua.')
    giveF9 = await ask(id, '? Give F9 to Sotto?', 'Give it to Sotto', 'Leave my keys alone')
  }
  const names = todo.filter(k => k !== 'keys' || giveF9)
  if (!names.length) { line('dim', 'Nothing changed.'); return finish(id) }
  const go = await ask(id, names.length === 3 ? '? Set up all three?' : `? Set up ${names.map(k => PIECE[k].short).join(' and ')}?`)
  if (!go) { line('dim', 'Nothing changed. Run sotto setup when you want it.'); return finish(id) }
  for (const k of names) {
    S.p[k] = 'working'; render(); await wait(id, 850)
    const [status] = outcome(k === 'keys' && !giveF9 ? 'keys' : k)
    S.p[k] = status
    if (k === 'keys' && status === 'done') line('ok', `✓ ${pad('Keys')}Hyprland reloaded with no errors. Copy of bindings.lua: bindings.lua.bak.1791830112`)
    if (k === 'keys' && status === 'failed') { line('err', `✗ ${pad('Keys')}Hyprland reported an error in bindings.lua once Sotto’s line was in:`); line('err', '          line 58: unexpected symbol near ‘end’'); line('', '          Sotto took its line out; your file is as it was. Fix that line, then run sotto setup again.') }
    if (k === 'owl' && status === 'done') line('ok', `✓ ${pad('Owl')}On the bar, after the indicators. Sotto’s floating widget steps aside.`)
    if (k === 'owl' && status === 'failed') { line('err', `✗ ${pad('Owl')}The Omarchy shell isn’t running. Nothing was copied.`); line('', '          Run sotto setup again in your desktop session.') }
    if (k === 'theme') line('ok', `✓ ${pad('Theme')}Rendered for ${omarchyName()}. Sotto follows it.`)
    await wait(id, 200)
  }
  if (S.env.f9Other && !giveF9) { S.p.keys = 'skipped'; line('dim', `– ${pad('Keys')}Left alone. F9 still runs Toggle screen recording.`) }
  line('', '')
  const ok = KEYS.every(k => ['done', 'manual'].includes(S.p[k]))
  if (ok) {
    line('bri', 'Sotto is set up. Hold F9 to dictate.'); line('dim', 'Undo any of it with sotto setup --remove.')
    if (!S.fast) { S.notify = { title: 'Sotto is set up', body: 'Hold F9 to dictate.' }; setTimeout(() => { S.notify = null; render() }, 6000) }
  } else line('bri', `${KEYS.filter(k => S.p[k] === 'done' || S.p[k] === 'manual').length} of 3 are set up. Run sotto setup again to finish.`)
  return finish(id)
}
async function termRemove(id) {
  line('cmd', 'sotto setup --remove')
  const have = KEYS.filter(k => ['done', 'stale'].includes(S.p[k]))
  if (S.p.keys === 'manual') line('', 'Your bindings.lua gives the keys to Sotto by hand. Remove those lines yourself; Sotto leaves them alone.')
  if (!have.length) { line('', 'Nothing of Sotto’s is set up in Omarchy.'); return finish(id) }
  if (!(await ask(id, have.length === 3 ? '? Remove all three?' : `? Remove ${have.map(k => PIECE[k].short).join(' and ')}?`))) { line('dim', 'Nothing changed.'); return finish(id) }
  for (const k of have) {
    S.p[k] = 'working'; render(); await wait(id, 650)
    S.p[k] = 'missing'; line('ok', `✓ ${pad(PIECE[k].term)}${removedText[k]()}`)
  }
  line('', ''); line('dim', 'Your copy of bindings.lua from setup is still there: bindings.lua.bak.1791830112')
  return finish(id)
}
async function termInstall(id) {
  line('cmd', './install.sh sotto-bin-0.1.35-1-x86_64.pkg.tar.zst')
  line('', 'Installing Sotto...'); await wait(id, 300)
  line('dim', '[sudo] password for zach: '); await wait(id, 500)
  line('', 'loading packages...'); line('', 'resolving dependencies...'); line('', 'looking for conflicting packages...'); await wait(id, 400)
  line('', ''); line('', 'Packages (1) sotto-bin-0.1.35-1'); line('', ''); line('', 'Total Installed Size:  412.36 MiB')
  line('', ':: Proceed with installation? [Y/n] y'); await wait(id, 500)
  line('', '(1/1) installing sotto-bin                       [######################] 100%'); await wait(id, 300)
  line('', ''); line('bri', 'Sotto has been installed.'); line('', '')
  await termSetup(id, true)
}
function finish(id) {
  if (id !== S.runId) return
  if (S.term) { S.term.finished = true; line('dim', S.term.kind === 'install' ? 'Open Sotto from the application menu. It starts in your Omarchy theme.' : 'Press Enter to close.') }
  render()
  if (!S.fast && S.term?.kind !== 'install') requestAnimationFrame(() => document.querySelector('.term')?.focus())
}
async function runTerm(kind, tiled = false) {
  const id = ++S.runId
  termOpen(kind, tiled)
  try {
    if (kind === 'setup') await termSetup(id)
    if (kind === 'remove') await termRemove(id)
    if (kind === 'install') await termInstall(id)
  } catch (e) { if (e !== CANCELLED) throw e }
}
function closeTerm() { if (!S.term || S.term.kind === 'install') return; S.runId++; S.term = null; focusLost = true; document.activeElement?.blur(); render() }

/* ---------------- presets: each one builds its state by running the real engine at once ---------------- */
async function preset(name) {
  S.state = name; S.runId++
  S.env = { voxtype: true, f9Other: false, byHand: false, shellDown: false, luaError: false, newer: false }
  S.p = { keys: 'missing', owl: 'missing', theme: 'missing' }
  S.note = { keys: null, owl: null, theme: null }
  S.keyChoice = 'give'; S.confirm = null; S.notice = null; S.term = null; S.pill = null; S.notify = null; S.owlFlicker = false
  if (['undo', 'update'].includes(name) && S.surface !== 'settings') S.surface = 'settings'
  if (S.surface === 'install' && S.v !== 'c') S.surface = 'firstrun'
  if (name === 'partial') S.env.shellDown = true
  if (name === 'failed') S.env.luaError = true
  if (name === 'conflict') S.env.f9Other = true
  if (name === 'byhand') { S.env.byHand = true; S.p.keys = 'manual'; S.note.keys = { text: 'Your bindings.lua already gives these keys to Sotto. Sotto leaves your lines alone.' } }
  const installing = S.v === 'c' && S.surface === 'install'
  if (['done', 'partial', 'failed', 'undo', 'update'].includes(name)) {
    S.fast = true
    if (installing) await runTerm('install', true)
    else if (S.v === 'c' && ['partial', 'failed', 'done'].includes(name)) await runTerm('setup')
    else await setUp([...KEYS])
    S.fast = false
    if (S.v === 'c' && name === 'done' && !installing) S.term = null
  }
  if (name === 'undo') {
    if (S.v === 'c') { S.fast = true; await runTerm('remove'); S.fast = false }
    else { S.fast = true; await removePieces([...KEYS]); S.fast = false }
  }
  if (name === 'update') {
    S.env.newer = true
    if (S.v === 'a') { S.p.owl = 'stale'; S.note.keys = { text: 'Updated for Sotto 0.1.36 when Sotto started.' }; S.note.theme = { text: 'Updated for Sotto 0.1.36 when Sotto started.' }; S.note.owl = null }
    if (S.v === 'b') KEYS.forEach(k => { S.p[k] = 'stale'; S.note[k] = null })
    if (S.v === 'c') { S.p.keys = 'stale'; S.p.owl = 'stale'; S.note.keys = S.note.owl = null }
  }
  if (name === 'working') {
    if (installing) runTerm('install', true)
    else if (S.v === 'c') runTerm('setup')
    else setUp([...KEYS])
  }
  if (name === 'conflict') {
    if (installing) runTerm('install', true)
    else if (S.v === 'c' && S.surface === 'firstrun') runTerm('setup')
    else if (S.v === 'b') S.confirm = 'keys'
  }
  if (name === 'offer' && installing) runTerm('install', true)
  writeHash(); render()
}

/* ---------------- rendering ---------------- */
function statusChip(k) {
  const st = S.p[k]
  if (st === 'done') return `<span class="status" data-k="done">${ic('check')}Done</span>`
  if (st === 'manual') return `<span class="status" data-k="done">${ic('check')}Set up by hand</span>`
  if (st === 'working') return `<span class="status" data-k="working">${ic('loader', 'spin')}${S.removing[k] ? 'Removing' : S.v === 'c' || S.env.newer ? 'Working' : 'Setting up'}</span>`
  if (st === 'queued') return `<span class="status">Waiting</span>`
  if (st === 'failed') return `<span class="status" data-k="failed">${ic('alert')}Not set up</span>`
  if (st === 'stale') return `<span class="status" data-k="stale">${ic('refresh')}Update ready</span>`
  if (st === 'skipped') return `<span class="status">Left alone</span>`
  return `<span class="status">Not set up</span>`
}
function filesList(k) { return S.showFiles ? `<ul class="pfiles">${PIECE[k].files.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : '' }
function noteFor(k) {
  const n = S.note[k], st = S.p[k]
  if (st === 'failed' && n) return `<div class="pnote" data-k="failed" role="alert">${esc(failText[n.kind])}${S.v === 'c' ? '' : `<div class="acts"><button class="btn secondary sm" data-act="retry" data-k="${k}" data-fk="retry-${k}">Try again</button>${n.kind === 'lua' ? `<button class="btn ghost sm" data-act="noop" data-fk="open-${k}">${ic('file')}Open bindings.lua</button>` : ''}</div>`}</div>`
  if (n && ['done', 'manual', 'skipped', 'missing'].includes(st)) return `<p class="pnote">${esc(n.text)}</p>`
  if (st === 'stale') {
    if (S.v === 'a' && k === 'owl') return `<p class="pnote">Sotto 0.1.36 has a newer owl. Updating restarts the bar for a moment.</p>`
    if (S.v === 'b') return `<p class="pnote">Sotto 0.1.36 changed this. <button class="linkish" data-act="refresh" data-k="${k}" data-fk="refresh-${k}">Update ${esc(PIECE[k].short)}</button></p>`
    if (S.v === 'c') return `<p class="pnote">Sotto 0.1.36 changed this.</p>`
  }
  return ''
}
/* what the keys row says before anything is pressed: Voxtype, a binding of the user's own, or one already made by hand */
function keysOffer() {
  if (!['missing', 'skipped'].includes(S.p.keys) || S.note.keys?.removed) return ''
  let out = ''
  if (S.env.f9Other && S.v === 'a') {
    out += `<div class="pask" role="group" aria-labelledby="ask-f9"><p id="ask-f9">F9 runs “Toggle screen recording” from your bindings.lua.</p>
      <div class="radios" role="radiogroup" aria-labelledby="ask-f9">
        <button class="radio" role="radio" aria-checked="${S.keyChoice === 'give'}" tabindex="${S.keyChoice === 'give' ? 0 : -1}" data-act="choice" data-val="give" data-fk="choice-give"><i></i>Give F9 to Sotto</button>
        <button class="radio" role="radio" aria-checked="${S.keyChoice === 'keep'}" tabindex="${S.keyChoice === 'keep' ? 0 : -1}" data-act="choice" data-val="keep" data-fk="choice-keep"><i></i>Leave my keys alone</button>
      </div></div>`
  }
  if (S.env.voxtype && !S.env.byHand && S.p.keys === 'missing') out += `<p class="info">Voxtype has these keys now. Sotto takes them over; Voxtype stays installed.</p>`
  return out
}
function pieceRow(k, side) {
  return `<li class="piece" data-piece="${k}">
    <span class="pico">${PIECE[k].icon}</span>
    <span class="pname" id="pn-${k}">${esc(PIECE[k].title)}</span>
    <span class="pwhat">${esc(PIECE[k].what)}</span>
    <span class="pside">${side}</span>
    ${k === 'keys' ? keysOffer() : ''}${noteFor(k)}${filesList(k)}
  </li>`
}
function switchRow(k) {
  const st = S.p[k]
  const on = ['done', 'stale', 'manual'].includes(st) || (st === 'working' && !S.removing[k])
  const busy = st === 'working' || st === 'queued'
  const label = on ? `${PIECE[k].title}: on. Turn off to remove ${PIECE[k].short}` : `${PIECE[k].title}: off. Turn on to set up ${PIECE[k].short}`
  const confirm = S.confirm === k ? `<div class="pask" role="group" aria-labelledby="ask-b"><p id="ask-b">F9 runs “Toggle screen recording” from your bindings.lua.</p>
      <div class="row-actions"><button class="btn primary sm" data-act="confirm-give" data-fk="confirm-give">Give F9 to Sotto</button><button class="btn ghost sm" data-act="confirm-cancel" data-fk="confirm-cancel">Cancel</button></div></div>` : ''
  return `<li class="tgl" data-piece="${k}">
    <span class="pico">${PIECE[k].icon}</span>
    <span class="pname" id="pn-${k}">${esc(PIECE[k].title)}</span>
    <span class="pwhat">${esc(PIECE[k].what)}</span>
    <button class="switch" role="switch" aria-checked="${on}" aria-busy="${busy}" aria-label="${esc(label)}" data-act="toggle" data-k="${k}" data-fk="sw-${k}" ${st === 'manual' ? 'aria-disabled="true"' : ''}><i></i></button>
    ${confirm}${k === 'keys' && !S.confirm ? keysOffer() : ''}${noteFor(k)}${filesList(k)}
  </li>`
}
function setupLabel(list) {
  if (list.length === 3) return 'Set up all three'
  return 'Set up ' + list.map(k => PIECE[k].short).join(' and ')
}
// A failed piece keeps its own Try again in A and B, so the main button covers only what has not been tried; C's terminal retries everything left.
const todoList = () => KEYS.filter(k => S.p[k] === 'missing' || (S.v === 'c' && S.p[k] === 'failed') || (k === 'keys' && S.p.keys === 'skipped' && S.keyChoice === 'give'))
const busy = () => KEYS.some(k => ['working', 'queued'].includes(S.p[k])) || (S.term && !S.term.finished)
const allSet = () => KEYS.every(k => ['done', 'manual'].includes(S.p[k]))
function filesToggle() { return `<button class="linkish" data-act="files" aria-expanded="${S.showFiles}" data-fk="files">${S.showFiles ? 'Hide the files it changes' : 'Show the files it changes'}</button>` }
function doneBand(where) {
  if (!allSet() || busy()) return ''
  if (where === 'firstrun') return `<div class="done-band" role="status"><p><strong>Sotto is set up in Omarchy.</strong><span>You’ll try F9 in the Shortcut step, once the speech model is downloaded.</span></p></div>`
  return `<div class="done-band" role="status"><p><strong>Sotto is set up in Omarchy.</strong><span>Hold F9 anywhere to talk. Try it here:</span></p>
    <span class="key" role="button" tabindex="0" aria-label="Hold to try F9" data-act="f9" data-fk="f9" data-down="${S.pill?.stage === 'listening'}">F9</span></div>`
}

function inAppBody(where) {
  const list = todoList()
  if (S.v === 'a') {
    const go = list.length && !busy() ? `<div class="row-actions"><button class="btn primary" data-act="setup" data-fk="setup">${esc(setupLabel(list))}</button>${filesToggle()}</div>` : busy() ? `<div class="row-actions"><button class="btn primary" aria-disabled="true" data-fk="setup">${ic('loader', 'spin')}Setting up</button></div>` : ''
    const side = k => {
      if (where !== 'settings') return statusChip(k)
      const st = S.p[k]
      const action = st === 'done' || (st === 'working' && S.removing[k]) ? `<button class="btn ghost sm" data-act="remove" data-k="${k}" data-fk="rm-${k}" aria-label="Remove ${esc(PIECE[k].short)}" ${st === 'working' ? 'aria-disabled="true"' : ''}>Remove</button>`
        : (st === 'stale' || (st === 'working' && S.env.newer)) && k === 'owl' ? `<button class="btn secondary sm" data-act="refresh" data-k="owl" data-fk="refresh-owl" ${st === 'working' ? 'aria-disabled="true"' : ''}>${ic('refresh')}Update the owl</button>` : ''
      return statusChip(k) + action
    }
    return { rows: `<ul class="pieces">${KEYS.map(k => pieceRow(k, side(k))).join('')}</ul>`, go }
  }
  if (S.v === 'b') return { rows: `<ul class="pieces">${KEYS.map(switchRow).join('')}</ul>`, go: `<div class="row-actions">${filesToggle()}</div>` }
  // C: status only; the work happens in the terminal
  const stale = KEYS.some(k => S.p[k] === 'stale')
  const have = KEYS.some(k => ['done', 'stale'].includes(S.p[k]))
  const primary = stale ? 'Update in a terminal' : list.length ? 'Set up in a terminal' : null
  const go = `<div class="row-actions">${primary ? `<button class="btn primary" data-act="term-setup" data-fk="open-term">${ic('terminal')}${primary}</button>` : ''}
    ${where === 'settings' && have && !primary ? `<button class="btn secondary" data-act="term-remove" data-fk="open-term">${ic('terminal')}Remove in a terminal</button>` : ''}
    <span class="cmdline">${primary ? 'or run' : 'Runs'} <code>${stale || list.length ? 'sotto setup' : 'sotto setup --remove'}</code><button class="btn ghost sm" data-act="copy" data-fk="copy" aria-label="Copy the command">${ic('copy')}Copy</button></span></div>`
  return { rows: `<ul class="pieces">${KEYS.map(k => pieceRow(k, statusChip(k))).join('')}</ul>`, go }
}

function firstRun() {
  const groups = [['Start', 3, 1], ['Dictation', 3, -1], ['Agents', 2, -1], ['Elsewhere', 2, -1]]
  let at = 0
  const prog = groups.map(([name, n, cur]) => { const bars = Array.from({ length: n }, (_, i) => `<i data-done="${at + i < 1}" data-cur="${at + i === 1}"></i>`).join(''); at += n; return `<li data-cur="${cur > 0}" style="flex-grow:${n}"><span class="bars">${bars}</span><span class="gname">${name}</span></li>` }).join('')
  const { rows, go } = inAppBody('firstrun')
  const lead = S.v === 'c' ? 'A terminal runs sotto setup and shows each change as it makes it.' : S.v === 'b' ? 'Turn on what you want. Each change happens as you flip it, and turns off the same way.' : 'Three changes to your Omarchy settings. Remove any of them later in Settings › Dictation.'
  const forward = allSet() || KEYS.some(k => S.p[k] !== 'missing') ? 'Continue' : 'Skip for now'
  return `<div class="strip">${mark()}<span>Sotto</span></div>
  <div class="room"><div class="fr">
    <nav class="prog" aria-label="Setup progress: step 2 of 10"><span class="ptext">Step 2 of 10 · Omarchy</span><ol class="groups" aria-hidden="true">${prog}</ol></nav>
    <section class="card" aria-labelledby="fr-h">
      <div class="cbody">
        <h1 id="fr-h" tabindex="-1">Set up Sotto in Omarchy</h1>
        <p class="lead">${esc(lead)}</p>
        ${rows}${doneBand('firstrun')}${go}
      </div>
      <footer class="cfoot"><button class="btn ghost" data-act="noop" data-fk="back">Back</button><button class="btn ${forward === 'Continue' ? 'primary' : 'secondary'}" data-act="noop" data-fk="fwd">${forward}</button></footer>
    </section>
  </div></div>`
}

function settings() {
  const nav = [['mic', 'Dictation'], ['lines', 'Transcription'], ['wand', 'Cleanup'], ['plug', 'Providers'], ['server', 'Hosts'], ['phone', 'Phones'], ['cloud', 'Cloud iPhone'], ['bot', 'Agents'], ['clip', 'Output'], ['palette', 'Appearance'], ['app', 'Application']]
  const { rows, go } = inAppBody('settings')
  const list = todoList()
  let headAction = ''
  if (S.v === 'a') headAction = list.length ? go : KEYS.some(k => S.p[k] === 'done') && !busy() ? `<button class="btn ghost sm" data-act="remove-all" data-fk="rm-all">Remove all</button>` : ''
  const removed = KEYS.filter(k => S.note[k]?.removed)
  const notice = S.v !== 'c' && removed.length === 3 ? `<p class="notice" role="status">Sotto kept the copy of bindings.lua it made at setup, in ~/.config/hypr.</p>` : ''
  return `<div class="set">
    <aside class="rail"><div class="strip">${mark()}<span>Sotto</span></div><h1>Settings</h1>
      <nav class="subnav" role="tablist" aria-label="Settings sections">${nav.map(([i, l], n) => `<button role="tab" aria-selected="${n === 0}" tabindex="${n === 0 ? 0 : -1}" data-fk="tab-${n}">${ic(i)}<span>${l}</span></button>`).join('')}</nav></aside>
    <div class="detail"><div class="form">
      <div class="shead"><h2>Dictation</h2><p>Microphone & recording</p></div>
      <div class="srow"><div><strong>Microphone</strong></div><span class="select" role="button" tabindex="0" data-fk="micsel">System default ${ic('chevron')}</span></div>
      <div class="om">
        <div class="omhead"><div><p class="slabel" style="margin:0">Omarchy</p><p class="sdesc">${S.v === 'c' ? 'What sotto setup has put into your Omarchy settings.' : 'Sotto’s keys, its owl in the bar and the Omarchy theme.'}</p></div>${S.v === 'a' ? headAction : ''}</div>
        ${notice}${rows}${doneBand('settings')}${S.v === 'a' ? (list.length ? '' : `<div class="row-actions">${filesToggle()}</div>`) : go}
      </div>
      <div class="srow"><div><strong>Recording limit</strong></div><span class="select" style="grid-row:auto">2 min ${ic('chevron')}</span></div>
    </div></div>
  </div>`
}

function terminalHtml() {
  const t = S.term
  const lines = t.lines.map(l => l.cls === 'cmd' ? `<div class="cmd">${esc(l.text)}</div>` : `<div class="${l.cls}">${esc(l.text) || ' '}</div>`).join('')
  const askHtml = t.ask ? `<div class="q">${esc(t.ask.question)}</div><div class="gum" role="group" aria-label="${esc(t.ask.question.replace('? ', ''))}"><button class="yes" data-act="answer" data-val="yes" data-fk="ans-yes">${esc(t.ask.yes)}</button><button data-act="answer" data-val="no" data-fk="ans-no">${esc(t.ask.no)}</button></div>` : ''
  const caret = t.finished || (!t.ask && !t.finished) ? '<span class="caret"></span>' : ''
  return `<div class="term" tabindex="-1" data-fk="term" role="log" aria-label="Terminal running ${t.kind === 'install' ? 'install.sh' : 'sotto setup'}">${lines}${askHtml}${caret}</div>`
}

function deskHtml() {
  const w = S.size === 1280 ? 1280 : 820, h = S.size === 1280 ? 800 : 560
  const W = w + 24, H = 26 + 10 + h + 4 + 10
  const pal = themeOn() ? 'omarchy' : 'sotto'
  const installing = S.v === 'c' && S.surface === 'install'
  const win = installing ? '' : `<div class="o-win${S.term ? ' dim' : ''}" style="width:${w + 4}px;height:${h + 4}px"><div class="win" data-look="${S.look}" data-pal="${pal}" data-size="${S.size === 1280 ? 'large' : 'min'}" style="width:${w}px;height:${h}px" ${S.term ? 'inert' : ''}>${S.surface === 'settings' ? settings() : firstRun()}</div></div>`
  let term = ''
  if (S.term) {
    const tw = installing ? w : Math.min(780, w - 80), th = installing ? h : Math.min(470, h - 70)
    const left = installing ? 12 : 12 + (w - tw) / 2, top = installing ? 38 : 38 + (h - th) / 2
    term = `<div class="o-float${installing ? ' tiled' : ''}" role="dialog" aria-label="Terminal" style="left:${left}px;top:${top}px;width:${tw}px;height:${th}px">${terminalHtml()}</div>`
  }
  const pill = S.pill ? `<div class="o-pill" data-stage="${S.pill.stage}" role="status">${S.pill.stage === 'done' ? `<svg viewBox="0 0 24 24" class="ico">${P.check}</svg><b>Pasted</b>` : S.pill.stage === 'busy' ? `${owlGlyph('owl')}<b>Transcribing</b>` : `${owlGlyph('owl')}<span class="bars"><i></i><i></i><i></i><i></i></span><b>Listening</b><span class="pbtn">Stop</span><span class="pbtn">Cancel</span>`}</div>` : ''
  const note = S.notify ? `<div class="o-note" role="status"><b>${esc(S.notify.title)}</b>${esc(S.notify.body)}</div>` : ''
  return { W, H, html: `<div class="desk" data-look="${S.look}" style="width:${W}px;height:${H}px">
    <div class="o-bar" aria-label="Omarchy bar"><div class="o-left"><span class="o-logo"></span><span class="o-ws on">1</span><span class="o-ws">2</span><span class="o-ws">3</span><span class="o-ws">4</span></div>
      <div class="o-center"><span class="o-inds"><span class="o-ind"><i></i></span><span class="o-ind"><i></i></span></span><span class="o-owl" data-on="${owlOn()}" data-live="${S.pill?.stage === 'listening'}" aria-label="${owlOn() ? 'Sotto, in the bar' : ''}">${owlGlyph('owlbar')}</span><span class="o-clock">Monday 14:32</span></div>
      <div class="o-right"><i></i><i></i><i></i></div></div>
    ${win}${term}${pill}${note}</div>` }
}

function panelHtml() {
  const surfaces = [['firstrun', 'First-run'], ['settings', 'Settings']].concat(S.v === 'c' ? [['install', 'install.sh']] : [])
  const b = (act, val, label, pressed) => `<button data-pact="${act}" data-val="${val}" aria-pressed="${pressed}">${label}</button>`
  const env = S.env
  const chk = (key, label) => `<label><input type="checkbox" data-env="${key}" ${env[key] ? 'checked' : ''}> <span>${label}</span></label>`
  const readout = `keys:${S.p.keys} owl:${S.p.owl} theme:${S.p.theme}`
  const sel = (act, options, current, label) => `<select data-psel="${act}" aria-label="${label}">${options.map(([v, l]) => `<option value="${v}" ${String(current) === String(v) ? 'selected' : ''}>${l}</option>`).join('')}</select>`
  return `<div class="r"><span class="tag">PROTOTYPE</span>
      <button data-pact="prev" aria-label="Previous variant">←</button><span class="vname" aria-live="polite">${VARIANTS[S.v]}</span><button data-pact="next" aria-label="Next variant">→</button>
      <span class="wide r"><span class="sep"></span>${surfaces.map(([v, l]) => b('surface', v, l, S.surface === v)).join('')}
      <span class="sep"></span>${b('size', 1280, '1280×800', S.size === 1280)}${b('size', 820, '820×560', S.size === 820)}
      <span class="sep"></span>${b('look', 'dark', 'Dark', S.look === 'dark')}${b('look', 'light', 'Light', S.look === 'light')}
      <span class="sep"></span>${b('motion', 'full', 'Motion', S.motion === 'full')}${b('motion', 'reduced', 'Reduced', S.motion === 'reduced')}</span></div>
    <div class="r narrow">${sel('surface', surfaces, S.surface, 'Surface')}${sel('state', STATES, S.state, 'State')}${sel('size', [[1280, '1280×800'], [820, '820×560']], S.size, 'Window size')}${sel('look', [['dark', 'Dark'], ['light', 'Light']], S.look, 'Look')}</div>
    <div class="r wide"><span class="lbl">State</span>${STATES.map(([v, l]) => b('state', v, l, S.state === v)).join('')}
      <details><summary>Desktop…</summary><div class="env">${chk('voxtype', 'Voxtype installed')}${chk('f9Other', 'F9 bound to something else')}${chk('shellDown', 'Omarchy shell not running')}${chk('luaError', 'Hyprland reports an error after the edit')}<span class="hint">These change what the next press does. Try again clears the failure.</span></div></details>
      <span class="readout">${readout}</span></div>`
}

/* When the focused control goes away (Set up finished, a piece removed, the terminal closed), focus moves to the
   control that carries on: a failed piece's Try again, what is left to set up, then the way forward. */
const FOCUS_NEXT = ['retry-keys', 'retry-owl', 'setup', 'refresh-owl', 'rm-all', 'open-term', 'fwd', 'sw-keys']
let focusLost = false
function render() {
  const host = document.getElementById('desk-scale')
  const active = document.activeElement
  const inDesk = !!active && host.contains(active)
  const fk = inDesk ? active.dataset?.fk : null
  const { W, H, html } = deskHtml()
  host.innerHTML = html
  host.dataset.motion = S.motion
  document.body.dataset.motion = S.motion
  const panel = document.getElementById('panel')
  const panelFocus = active && panel.contains(active) ? (active.dataset.pact ? `[data-pact="${active.dataset.pact}"][data-val="${active.dataset.val ?? ''}"]` : active.dataset.env ? `[data-env="${active.dataset.env}"]` : active.dataset.psel ? `[data-psel="${active.dataset.psel}"]` : null) : null
  const open = panel.querySelector('details')?.open
  panel.innerHTML = panelHtml()
  if (open) panel.querySelector('details').open = true
  if (panelFocus) panel.querySelector(panelFocus)?.focus()
  if (active?.dataset?.pact === 'prev' || active?.dataset?.pact === 'next') panel.querySelector(`[data-pact="${active.dataset.pact}"]`)?.focus()
  const same = fk ? host.querySelector(`[data-fk="${fk}"]`) : null
  if (same) same.focus()
  else if (inDesk || (focusLost && (document.activeElement === document.body || !document.activeElement))) {
    const next = FOCUS_NEXT.map(id => host.querySelector(`[data-fk="${id}"]:not([inert] *)`)).find(Boolean)
    if (next) { next.focus(); focusLost = false } else focusLost = true
  }
  fit(W, H)
}
function fit(W, H) {
  const panel = document.getElementById('panel')
  document.documentElement.style.setProperty('--panel-h', panel.offsetHeight + 20 + 'px')
  const vp = document.getElementById('viewport')
  const scale = Math.min(1, (vp.clientWidth - 16) / W, (vp.clientHeight - 16) / H)
  const host = document.getElementById('desk-scale'), fitEl = document.getElementById('fit')
  host.style.transform = `scale(${scale})`
  fitEl.style.width = W * scale + 'px'; fitEl.style.height = H * scale + 'px'
}

/* ---------------- the F9 try: hold to talk, release to paste ---------------- */
let pillTimer = null
function f9Down() { if (!keysOn() || S.pill?.stage === 'listening') return; clearTimeout(pillTimer); S.pill = { stage: 'listening' }; render(); say('Listening.') }
function f9Up() {
  if (S.pill?.stage !== 'listening') return
  S.pill = { stage: 'busy' }; render()
  pillTimer = setTimeout(() => { S.pill = { stage: 'done' }; render(); say('Pasted.'); pillTimer = setTimeout(() => { S.pill = null; render() }, 1100) }, S.motion === 'reduced' ? 300 : 700)
}

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-pact]')
  if (!t) return
  if (t.dataset.pact) return panelAct(t.dataset.pact, t.dataset.val)
  if (t.getAttribute('aria-disabled') === 'true') return
  const k = t.dataset.k
  switch (t.dataset.act) {
    case 'setup': if (todoList().length && !busy()) { setUp(todoList()) } break
    case 'retry': retry(k); break
    case 'remove': removePieces([k]); break
    case 'remove-all': removePieces(KEYS.filter(x => S.p[x] === 'done')); break
    case 'refresh': refresh([k], true); break
    case 'files': S.showFiles = !S.showFiles; render(); break
    case 'choice': S.keyChoice = t.dataset.val; if (S.p.keys === 'skipped') S.p.keys = 'missing'; render(); break
    case 'toggle': {
      if (busy()) return
      const st = S.p[k]
      if (['done', 'stale'].includes(st)) removePieces([k])
      else if (['missing', 'failed', 'skipped'].includes(st)) {
        if (st === 'failed') { if (k === 'keys') S.env.luaError = false; if (k === 'owl') S.env.shellDown = false }
        if (k === 'keys' && S.env.f9Other && S.confirm !== 'keys') { S.confirm = 'keys'; render(); document.querySelector('[data-fk=confirm-give]')?.focus(); return }
        setUp([k])
      }
      break
    }
    case 'confirm-give': S.keyChoice = 'give'; S.confirm = null; setUp(['keys']); document.querySelector('[data-fk=sw-keys]')?.focus(); break
    case 'confirm-cancel': S.confirm = null; render(); document.querySelector('[data-fk=sw-keys]')?.focus(); break
    case 'term-setup': runTerm('setup'); break
    case 'term-remove': runTerm('remove'); break
    case 'answer': S.term?.ask?.resolve(t.dataset.val === 'yes'); break
    case 'copy': navigator.clipboard?.writeText(t.closest('.cmdline').querySelector('code').textContent).catch(() => {}); say('Copied the command.'); break
  }
})
function panelAct(act, val) {
  if (act === 'prev' || act === 'next') { const v = Object.keys(VARIANTS); S.v = v[(v.indexOf(S.v) + (act === 'next' ? 1 : v.length - 1)) % v.length]; return preset(S.state) }
  if (act === 'surface') { S.surface = val; return preset(['undo', 'update'].includes(S.state) && val !== 'settings' ? 'offer' : S.state) }
  if (act === 'size') { S.size = Number(val); writeHash(); return render() }
  if (act === 'look') { S.look = val; writeHash(); return render() }
  if (act === 'motion') { S.motion = val; writeHash(); return render() }
  if (act === 'state') return preset(val)
}
document.addEventListener('change', e => { if (e.target.dataset.psel) return panelAct(e.target.dataset.psel, e.target.value); const k = e.target.dataset.env; if (k) { S.env[k] = e.target.checked; if (k === 'f9Other' && !e.target.checked) S.confirm = null; render() } })
document.addEventListener('keydown', e => {
  const el = e.target
  if (e.key === 'F9') { e.preventDefault(); if (!e.repeat) f9Down(); return }
  if (el.dataset?.act === 'f9' && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); if (!e.repeat) f9Down(); return }
  if (el.getAttribute?.('role') === 'radio' && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
    e.preventDefault(); S.keyChoice = S.keyChoice === 'give' ? 'keep' : 'give'; render(); document.querySelector(`[data-fk=choice-${S.keyChoice}]`)?.focus(); return
  }
  if (S.term) {
    if (S.term.ask && (e.key === 'y' || e.key === 'n')) { S.term.ask.resolve(e.key === 'y'); return }
    if (S.term.ask && ['ArrowLeft', 'ArrowRight'].includes(e.key) && el.closest?.('.gum')) { e.preventDefault(); const bs = [...document.querySelectorAll('.gum button')]; bs[(bs.indexOf(el) + 1) % 2].focus(); return }
    if (S.term.finished && (e.key === 'Enter' || e.key === 'Escape') && el.closest?.('.o-float')) { e.preventDefault(); closeTerm(); return }
    if (e.key === 'Escape' && S.term.ask) { S.term.ask.resolve(false); return }
  }
  if (e.key === 'Escape' && S.confirm) { S.confirm = null; render(); document.querySelector('[data-fk=sw-keys]')?.focus(); return }
  if (e.key === 'Escape') { const d = document.querySelector('#panel details[open]'); if (d) { d.open = false; d.querySelector('summary').focus(); return } }
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !el.closest?.('input,textarea,[contenteditable],[role=radiogroup],[role=tablist],.gum')) { e.preventDefault(); panelAct(e.key === 'ArrowRight' ? 'next' : 'prev') }
})
document.addEventListener('keyup', e => {
  if (e.key === 'F9') { e.preventDefault(); f9Up() }
  if (e.target.dataset?.act === 'f9' && (e.key === ' ' || e.key === 'Enter')) f9Up()
})
document.addEventListener('pointerdown', e => { if (e.target.closest('[data-act=f9]')) { e.preventDefault(); f9Down(); e.target.closest('[data-act=f9]').focus() } })
document.addEventListener('pointerup', () => f9Up())
document.addEventListener('pointercancel', () => f9Up())
window.addEventListener('resize', () => render())

/* ---------------- the address: every view is a link ---------------- */
function readHash() {
  const q = new URLSearchParams(location.hash.slice(1).toLowerCase())
  const pick = (key, allowed, fallback) => allowed.includes(q.get(key)) ? q.get(key) : fallback
  S.v = pick('v', ['a', 'b', 'c'], 'a')
  S.surface = pick('surface', ['firstrun', 'settings', 'install'], 'firstrun')
  S.size = Number(pick('size', ['1280', '820'], '1280'))
  S.look = pick('look', ['dark', 'light'], 'dark')
  S.motion = pick('motion', ['full', 'reduced'], matchMedia('(prefers-reduced-motion: reduce)').matches ? 'reduced' : 'full')
  return pick('state', STATES.map(s => s[0]), 'offer')
}
function writeHash() { history.replaceState(null, '', `#v=${S.v}&surface=${S.surface}&state=${S.state}&size=${S.size}&look=${S.look}&motion=${S.motion}`) }
window.addEventListener('hashchange', () => preset(readHash()))
preset(readHash())
</script>
</body>
</html>
