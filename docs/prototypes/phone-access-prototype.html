<!doctype html>
<!--
  VERDICT (September 26, 2026): the owner picked C, "Guided setup", for both halves. The desktop gets its own
  Phones page in Settings (checklist: Tailscale running, Serve on 8443, the address; then Pair a phone with the
  code; paired phones with a Can answer switch each). The iPhone shows every computer's threads merged, with a
  filter strip (All, then each computer) and Add computer at the top of Computers. Each computer shares only its
  own threads, and its name comes from the desktop. A and B are kept here as the record of what was weighed.
  Built as Settings > Phones (ADR-0033). One change from the drawing: when a step fails, the switch keeps showing
  the setting (on) and the failed row carries Try again, so a Tailscale that starts after Sotto recovers by itself.

  PROTOTYPE — throwaway. Question: how should phone access look on the desktop (Settings > Hosts) and how does
  the iPhone show many computers? Variants via ?variant=A|B|C.
  Desktop states via ?state=off|ready|code|paired|tailscale|port; theme via ?theme=light; motion via ?motion=reduced.
  The desktop half copies Settings > Hosts (HostsSettings.tsx, hosts.css, crossing-settings.css) and the Sotto
  theme's resolved --tt-* values (src/shared/themes/palettes.ts, src/renderer/src/styles/tokens.css) at 100% contrast.
  The iPhone half copies variant B "Needs you" from iphone-client-prototype.html. No host calls, no persistence.
  Run: node docs/prototypes/composer-selectors-serve.mjs, then open
  http://127.0.0.1:4173/docs/prototypes/phone-access-prototype.html
-->

*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--page-text);font:15px/1.5 Figtree,system-ui,sans-serif;padding:32px 32px 120px}
.page-head{max-width:1240px;margin:0 0 24px}
.page-head .kicker{font-size:13px;color:var(--page-muted);letter-spacing:.02em;margin:0 0 6px}
.page-head h1{font-size:30px;margin:0 0 10px;letter-spacing:-.02em;font-weight:650}
.page-head p{margin:0 0 6px;max-width:980px;color:var(--page-muted)}
.page-head p b{color:var(--page-text);font-weight:600}
h2.band{font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--page-muted);margin:34px 0 18px;border-top:1px solid color-mix(in oklab,var(--page-muted) 30%,transparent);padding-top:18px}
.top-row{display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap}
.row{display:flex;flex-wrap:wrap;gap:28px 24px;align-items:flex-start}
figure{margin:0}
.cap{margin-top:12px;font-size:14px;max-width:560px}
.cap b{display:block;font-weight:600}
.cap span{color:var(--page-muted);font-size:13px;display:block;line-height:1.45}
.cell{width:calc(414px * var(--z,.72))}
.frame{zoom:var(--z,.72);width:414px;height:868px;border-radius:62px;background:var(--bezel);padding:12px;box-shadow:0 30px 60px -30px #0008}
.dz{zoom:var(--dz,.72)}

/* =====================================================================
   DESKTOP: the Settings page chrome and Settings > Hosts, copied from the app
   ===================================================================== */
.win{position:relative;width:1280px;height:800px;overflow:hidden;border-radius:10px;border:1px solid var(--win-edge);background:var(--tt-canvas);color:var(--tt-text);font:14px/1.5 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased;box-shadow:0 30px 60px -30px #0009}
.win button{font:inherit;color:inherit;min-height:30px}
.win :focus-visible{outline:3px solid var(--tt-focus-ring);outline-offset:2px}
.win .layout{display:grid;grid-template-columns:264px minmax(0,1fr);height:100%}
.side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--tt-hairline);padding:16px 10px 0;background:var(--tt-sidebar)}
.side-top{display:flex;align-items:center;height:44px;padding:0 6px 0 14px}
.brand{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;letter-spacing:-.1px}
.mark{width:18px;height:18px;border-radius:4px;background:#47b8a9;color:#0b0d0c;display:grid;place-items:center}
.side-body{flex:1;min-height:0;padding:10px 0 12px}
.side h1{margin:6px 0 18px;padding:0 8px;font-size:24px;font-weight:600;line-height:1.2;letter-spacing:-.7px}
.subnav{display:flex;flex-direction:column;gap:4px}
.subnav button{position:relative;display:flex;align-items:center;gap:11px;width:100%;min-height:42px;padding:10px 12px;border:0;border-radius:8px;color:var(--tt-text-muted);background:transparent;text-align:left;font-size:14px;line-height:1.35;cursor:pointer}
.subnav button>span{flex:1}
.subnav button:hover{background:var(--tt-sidebar-row-hover);color:var(--tt-text)}
.subnav button[aria-selected=true]{color:var(--tt-text);background:var(--tt-sidebar-row-active)}
.subnav button[aria-selected=true]>svg:first-child{color:var(--tt-accent)}
.subnav button.gap{margin-top:32px}
.subnav button.gap::before{content:'';position:absolute;top:-18px;left:12px;right:12px;height:1px;background:var(--tt-hairline)}
.subnav .new-tag{flex:none;font-size:11px;font-weight:600;color:var(--tt-accent-text)}
.side-foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 2px;margin-top:auto;padding:8px 6px 10px;border-top:1px solid var(--tt-hairline)}
.side-foot .seg{display:flex;flex:1 0 100%;padding:3px;border-radius:9px;background:var(--tt-canvas)}
.side-foot .seg span{flex:1;text-align:center;font-size:13px;color:var(--tt-text-muted);padding:5px 0}
.side-foot .ib{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--tt-text-muted)}
.side-foot .ib.on{background:var(--tt-sidebar-row-active);color:var(--tt-accent)}
.side-foot .ib.end{margin-left:auto}
.detail{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.scroll{flex:1;min-width:0;min-height:0;overflow:auto;padding:42px 77px 48px;scrollbar-width:thin;scrollbar-color:var(--tt-hairline) transparent}
.form{width:100%;max-width:790px;margin:0 auto}
.sec-h{margin:0 0 10px;padding:0 0 20px;border-bottom:1px solid var(--tt-hairline)}
.sec-h h2{margin:0 0 10px;font-size:28px;font-weight:600;line-height:1.2;letter-spacing:-1px}
.sec-h p{margin:0;color:var(--tt-text-muted);font-size:16px;line-height:1.5}
.winctl{position:absolute;top:8px;right:8px;display:flex;gap:4px;color:var(--tt-text-muted)}
.winctl span{width:34px;height:28px;display:grid;place-items:center}
.page-status{position:absolute;right:22px;bottom:8px;margin:0;font-size:12px;color:var(--tt-text-muted)}
.mono{font-family:'Spline Sans Mono',ui-monospace,monospace}
.win b.mono{font-weight:500}

/* controls (global.css) */
.tt-button{display:inline-flex;min-height:34px;align-items:center;justify-content:center;gap:7px;border:1px solid var(--tt-hairline);border-radius:999px;padding:0 14px;background:transparent;color:var(--tt-text-2);cursor:pointer;font-size:13.5px!important;font-weight:500;line-height:1.2;white-space:nowrap}
.tt-button:hover:not(:disabled){border-color:var(--tt-text-faint);color:var(--tt-text)}
.tt-button:disabled{cursor:not-allowed;opacity:.45}
.tt-button--primary{border-color:var(--tt-pill);background:var(--tt-pill);color:var(--tt-pill-ink)!important;font-weight:600}
.tt-button--ghost{border-color:transparent;color:var(--tt-text-muted)}
.tt-button--ghost:hover:not(:disabled){border-color:transparent;color:var(--tt-text)}
.tt-button--danger{border-color:transparent;color:var(--tt-error)!important}
.tt-button--icon{width:34px;padding:0}
.tt-toggle{display:grid;width:100%;min-height:30px;grid-template-columns:36px minmax(0,1fr);align-items:start;gap:12px;border:0;background:transparent;padding:2px 0;cursor:pointer;text-align:left}
.tt-toggle__copy{display:grid;min-width:0;gap:2px}
.tt-toggle__copy>strong{display:block;font-size:15px;font-weight:500;line-height:1.35}
.tt-field__description{display:block;margin:0;color:var(--tt-text-muted);font-size:13px;line-height:1.45}
.tt-toggle__track{position:relative;width:36px;height:20px;margin-top:1px;border:1px solid var(--tt-border);border-radius:999px;background:var(--tt-surface-sunken);transition:background-color 120ms ease,border-color 120ms ease}
.tt-toggle__thumb{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--tt-text-muted);transition:transform 120ms ease,background-color 120ms ease}
.tt-toggle[aria-checked=true] .tt-toggle__track{border-color:var(--tt-accent);background:var(--tt-accent)}
.tt-toggle[aria-checked=true] .tt-toggle__thumb{background:var(--tt-on-accent);transform:translateX(16px)}
.tt-toggle:disabled{cursor:not-allowed}.tt-toggle:disabled .tt-toggle__track{opacity:.5}

/* hosts.css */
.hosts-settings{display:grid;gap:20px}
.hosts-settings h3,.hosts-settings h4{margin:0;font-weight:600}
.hosts-settings h3{font-size:18px}
.hosts-settings h4{font-size:15px}
.hosts-settings p{margin:6px 0 0;color:var(--tt-text-muted);font-size:14px}
.hosts-heading{display:flex;align-items:center;justify-content:space-between;gap:20px}
.hosts-local{display:flex;align-items:flex-start;gap:14px;padding-bottom:20px;border-bottom:1px solid var(--tt-hairline)}
.hosts-local__copy{flex:1;min-width:0;max-width:470px}
.hosts-local .tt-toggle{width:auto;flex:0 0 auto;align-self:center;grid-template-columns:36px auto}
.hosts-list{display:grid}
.hosts-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;min-width:0;border-bottom:1px solid var(--tt-hairline);padding:14px 0;position:relative}
.hosts-list>.hosts-row:first-child{border-top:1px solid var(--tt-hairline)}
.hosts-row__icon{display:grid;flex:0 0 auto;place-items:center;width:34px;height:34px;border-radius:6px;background:var(--tt-surface-sunken);color:var(--tt-accent-text)}
.hosts-row__icon--local{color:var(--tt-text-muted)}
.hosts-row__info{flex:1 1 220px;min-width:0}
.hosts-settings .hosts-row__meta{margin-top:2px;font-size:13px}
.hosts-row__meta [data-phase=connected]{color:var(--tt-text)}
.hosts-row__actions{display:flex;flex:0 0 auto;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px;margin-left:auto}
.hosts-empty{padding:16px 0;border-block:1px solid var(--tt-hairline)}
.hosts-switch{display:inline-flex;align-items:center;gap:8px;color:var(--tt-text-muted);font-size:13px}
.hosts-switch__state{min-width:22px;text-align:right}
.hosts-switch .hosts-switch__control{width:auto;min-height:30px;grid-template-columns:36px;align-items:center;padding:4px 2px}
.hosts-menu{position:relative;display:inline-flex}
.hosts-menu__list{position:absolute;z-index:20;top:calc(100% + 4px);right:0;display:grid;min-width:184px;border:1px solid var(--tt-hairline);border-radius:10px;background:var(--tt-surface-overlay);box-shadow:var(--tt-shadow-overlay);padding:4px}
.hosts-menu__list [role=menuitem]{min-height:32px;border:0;border-radius:6px;background:transparent;padding:6px 10px;color:var(--tt-text);font-size:13px;text-align:left;cursor:pointer}
.hosts-menu__list [role=menuitem]:hover{background:var(--tt-hover)}
.hosts-menu__list [data-danger]{color:var(--tt-error)}
.hosts-notice{display:flex;align-items:flex-start;gap:10px;border-left:2px solid var(--tt-accent);border-radius:6px;background:var(--tt-surface-sunken);padding:10px 12px;font-size:13px}
.hosts-settings .hosts-notice p,.tt-dialog .hosts-notice p{margin:0;color:var(--tt-text);font-size:13px;line-height:1.5}
.hosts-notice--error{border-left-color:var(--tt-error-line)}
.hosts-notice>svg{flex:0 0 auto;margin-top:2px;color:var(--tt-accent-text)}
.hosts-notice--error>svg{color:var(--tt-error)}
.hosts-notice .grow{flex:1;min-width:0}
.hosts-notice .tt-button{align-self:center}
.tt-dialog-backdrop{position:absolute;z-index:50;display:grid;inset:0;place-items:center;background:var(--tt-overlay);padding:20px}
.tt-dialog{width:min(480px,100%);border:1px solid var(--tt-hairline);border-radius:10px;background:var(--tt-surface-elevated);box-shadow:var(--tt-shadow-lg);padding:24px;animation:arrive .18s ease}
.tt-dialog h2{margin:0 0 4px;font-size:16px;font-weight:600;letter-spacing:-.01em}
.tt-dialog .intro{margin:0 0 4px;font-size:13px;color:var(--tt-text-muted)}
.tt-dialog__actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.tt-dialog__actions .tt-button{min-height:44px;padding:0 18px}
@keyframes arrive{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---- new: shared phone-access pieces ---- */

.pa-facts dd{margin:0}
.pa-facts .name{font-size:16px}

.label-sw{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--tt-text-muted)}

/* ---- B: this computer as a host row ---- */

  threads: function () {
    const grp = (p, c) => `<div class="a-sec">${p}<span class="where">· ${where(c)}</span></div><div class="b-list">${T.filter(t => t.project === p && t.c === c).map(this.row).join('')}</div>`
    return `<div class="b-seg"><span class="on">All</span><span>Working</span><span>Done</span></div>${grp('Sotto', 'laptop')}${grp('Sotto releases', 'laptop')}${grp('Sotto', 'forge')}${grp('Sotto releases', 'forge')}`
  },
  computers: () => `<div class="b-list" style="margin-top:4px">
      <div><span class="b-mono">${ic('laptop', 20)}<span class="dot s-online"></span></span><div class="m"><b>Laptop</b><small>${TAIL} · Online · Can answer</small></div>${ic('chev', 18, 'chev')}</div>
      <div><span class="b-mono">${ic('host', 20)}<span class="dot s-offline"></span></span><div class="m"><b>forge</b><small>Can’t reach it · Last update 9:12</small></div>${ic('chev', 18, 'chev')}</div>
      <div style="color:var(--accent)"><span class="b-mono" style="color:var(--accent)">${ic('plus', 20)}</span><div class="m" style="border:0"><b>Add computer</b></div></div></div>
    <p class="muted" style="font-size:14px;margin:18px 20px 0">Whether this iPhone can answer questions and permissions is set in Sotto on each computer.</p>`,
  add: () => phone(`${sb()}<div class="b-nav"><button class="nb">Cancel</button><div class="t">Add computer</div><button class="nb" style="font-weight:700;opacity:.5">Pair</button></div>
    <div class="fill" style="padding:18px 20px 0">
      <div class="lbl">Computer name on your tailnet</div><div class="field"><span>${TAIL}</span></div>
      <div class="pm-found">${ic('check', 16)}Found Sotto at ${TAIL}.tail5728ca.ts.net</div>
      <div class="lbl">Pairing code</div><div class="field on mono" style="font-size:22px;letter-spacing:.18em">K7MX 3QP<span class="caret"></span></div>
      <p class="muted" style="font-size:14px;margin:12px 2px 0">In Sotto on that computer: Settings › Hosts › Pair a phone.</p>
    </div>${kbd('Pair', true)}`),
}
/* B: a computer chip on each card; threads grouped by computer, then project */
PV.B = {
  top: () => `<div class="b-top"></div>`,
  card: (t, body) => `<div class="b-card"><div class="who"><span class="pm-chip">${ic(COMP[t.c].icon, 14)}${COMP[t.c].name}</span><span style="flex:1">${t.project}</span>${t.when}</div><div class="who" style="margin-bottom:8px"><span class="dot s-${t.state}"></span><b>${t.title}</b></div>${body}</div>`,
  row: t => `<div><span class="b-mono">${t.mono}<span class="dot s-${t.state}"></span></span><div class="m"><b>${t.title}</b><small><span class="t-${t.state}">${t.state === 'offline' ? 'Last update 9:12' : STATUS[t.state]}</span> · ${t.provider}${t.state === 'offline' ? '' : ' · ' + t.when}</small></div></div>`,
  threads: function () {
    const proj = (p, c) => `<div class="pm-sub">${p}</div><div class="b-list">${T.filter(t => t.project === p && t.c === c).map(this.row).join('')}</div>`
    return `<div class="b-seg"><span class="on">All</span><span>Working</span><span>Done</span></div>
      <div class="pm-comp">${ic('laptop', 20)}<b>Laptop</b><small><span class="dot s-online"></span>Online</small></div>${proj('Sotto', 'laptop')}${proj('Sotto releases', 'laptop')}
      <div class="dim"><div class="pm-comp">${ic('host', 20)}<b>forge</b><small><span class="dot s-offline"></span>Can’t reach it</small></div>${proj('Sotto', 'forge')}${proj('Sotto releases', 'forge')}</div>`
  },
  computers: () => `<div class="pm-card"><div class="hd">${ic('laptop', 22)}<b>Laptop</b><small><span class="dot s-online"></span>Online</small></div><div class="addr mono">${TAIL}</div>
      <div class="pm-counts"><span class="need">2 need you</span><span><span class="dot s-running"></span>1 working</span><span>1 done</span></div><div class="foot">This iPhone can answer here.</div></div>
    <div class="pm-card"><div class="hd">${ic('host', 22)}<b>forge</b><small><span class="dot s-offline"></span>Can’t reach it</small></div><div class="addr mono">forge</div>
      <div class="pm-counts"><span>2 threads</span><span>Last update 9:12</span></div><button class="btn plain sm" style="width:100%">${ic('refresh', 18)}Try again</button></div>
    <div style="margin:4px 16px 0"><button class="btn ghost" style="width:100%">${ic('plus', 20)}Add computer</button></div>`,
  add: () => phone(`${sb()}<div class="b-nav"><button class="nb">${ic('back', 24)}</button><div class="t"></div><span class="nb"></span></div>
    <div class="fill" style="padding:6px 24px 0;text-align:center">
      <div class="muted" style="font-size:14px">Step 2 of 2</div>
      <h1 style="font-size:28px;margin:8px 0 6px;letter-spacing:-.02em">Enter the pairing code</h1>
      <p class="muted" style="margin:0;font-size:16px">In Sotto on that computer: Settings › Hosts › Pair a phone.</p>
      <div class="b-slots"><span>K</span><span>7</span><span>M</span><span>X</span><span class="sep">–</span><span>3</span><span>Q</span><span>P</span><span class="cur"></span></div>
      <div class="muted" style="font-size:14px;display:flex;justify-content:center;gap:6px;align-items:center">${ic('laptop', 16)}${TAIL} · <span style="color:var(--accent);font-weight:600">Change</span></div>
    </div>${kbd('Pair', true)}`),
}
/* C: one merged list, a filter strip, and the computer in each row's second line */
const strip = (sel = 'All') => `<div class="pm-strip">${[['All', '', ''], ['Laptop', 's-online', ''], ['forge', 's-offline', '']].map(([n, d, e]) => `<span class="pm-pill ${n === sel ? 'on' : ''}">${d ? `<span class="dot ${d}"></span>` : ''}${n}${e}</span>`).join('')}</div>`
PV.C = {
  top: () => `<div class="b-top" style="height:10px"></div>`,
  afterTitle: () => strip(),
  card: (t, body) => `<div class="b-card"><div class="who"><span class="dot s-${t.state}"></span><b>${t.title}</b>${t.when}</div><div class="where">${t.provider} · ${t.project} · ${COMP[t.c].name}</div>${body}</div>`,
  row: t => `<div class="${t.state === 'offline' ? 'dim' : ''}"><span class="b-mono">${t.mono}<span class="dot s-${t.state}"></span></span><div class="m"><b>${t.title}</b><small><span class="t-${t.state}">${t.state === 'offline' ? 'Can’t reach it' : STATUS[t.state]}</span> · ${COMP[t.c].name} · ${t.project}</small></div></div>`,
  threads: function () { return `${strip()}<div class="b-seg" style="margin-top:4px"><span class="on">All</span><span>Working</span><span>Done</span></div><div class="b-list" style="margin-top:6px">${T.map(this.row).join('')}</div>` },
  computers: () => `<div style="margin:0 16px 8px"><button class="btn accent" style="width:100%">${ic('plus', 20)}Add computer</button></div>
    <div class="b-kv"><div><span style="display:flex;align-items:center;gap:10px"><span class="dot s-online"></span>Laptop</span><em>Online</em></div><div><span style="display:flex;align-items:center;gap:10px"><span class="dot s-offline"></span>forge</span><em>Can’t reach it</em></div></div>
    <div class="a-sec" style="margin-top:22px">Laptop</div>
    <div class="b-kv"><div><span>Name on tailnet</span><em class="mono">${TAIL}</em></div><div><span>Answers from this iPhone</span><em>Allowed</em></div><div><span style="color:var(--error-fg)">Remove this computer</span></div></div>`,
  add: () => phone(`${sb()}<div class="b-top" style="height:10px"></div><div class="fill fade"><div class="b-title">Computers</div>${PV.C.computers()}</div>${tabs(2)}
    <div class="scrim"></div><div class="b-sheet"><div class="grab"></div><h3>Add computer</h3><p class="muted" style="font-size:15px;margin:0 0 16px">Read both in Sotto on that computer: Settings › Phones.</p>
      <div class="lbl">Computer name on your tailnet</div><div class="field" style="margin-bottom:6px">${TAIL}</div><div class="pm-found" style="margin:0 2px 14px">${ic('check', 16)}Found Sotto there</div>
      <div class="lbl">Pairing code</div><div class="field on mono" style="font-size:22px;letter-spacing:.18em;margin-bottom:16px">K7MX 3QP<span class="caret"></span></div>
      <button class="btn accent" style="width:100%;opacity:.55">Pair</button></div>`),
}
const home = (b) => {
  const v = PV[VAR]
  return phone(`${sb()}${v.top()}<div class="fill"><div class="b-title">Needs you<small>2</small></div>${v.afterTitle ? v.afterTitle() : ''}${VAR === 'A' ? '' : forgeNote}
    ${v.card(byId('host'), permBody(b))}${v.card(byId('ssh'), questBody(b))}
    ${workingRow(VAR === 'C' ? 'Codex · Laptop · Running npm test' : VAR === 'B' ? 'Laptop · Codex · Running npm test' : 'Laptop · Codex · Running npm test')}</div>${tabs(0)}`)
}
const threadsScreen = () => phone(`${sb()}${PV[VAR].top()}<div class="fill"><div class="b-title">Threads</div>${PV[VAR].threads()}</div>${tabs(1)}`)
const computersScreen = () => phone(`${sb()}${PV[VAR].top()}<div class="fill"><div class="b-title">Computers</div>${PV[VAR].computers()}</div>${tabs(2)}`)

/* ---------- variant metadata ---------- */
const VARIANTS = {
  A: { name: 'Section in Hosts',
    thesis: '<b>Phones are a new section under the hosts list.</b> One switch turns phone access on and shows the address; Pair a phone opens a small dialog with the code and its countdown. Paired phones are rows like hosts, each with its own Can answer switch.',
    good: 'Good at: least new structure, reads like the rest of the page. On the phone, a small computer label sits beside every project.', cost: 'Costs: the page gets long, so the Phones section starts below the fold at 1280x800.' },
  B: { name: 'This computer row',
    thesis: '<b>This computer becomes the first host row</b>, and phone access lives in its expanded panel: status, address, the code inline with a countdown (no dialog), and phones as a compact table.',
    good: 'Good at: says exactly whose door this is. On the phone, threads group by computer first, and each computer gets a card with counts.', cost: 'Costs: reshapes the existing Hosts page (the separate "This computer" block and "Remote hosts" heading go), and the panel nests three levels deep.' },
  C: { name: 'Guided setup',
    thesis: '<b>A Phones page of its own</b> in the settings nav: one switch, a checklist that shows which step worked or failed, then a big Pair step with the code. Paired phones below, with Remove in plain sight.',
    good: 'Good at: errors land on the step that failed; the setup reads top to bottom. On the phone, one merged list with a filter strip.', cost: 'Costs: an 11th settings page; the hosts list and phone access sit on different pages.' },
}
const STATES = [
  ['off', 'Off', 'Off. Nothing listens beyond this computer, and no Tailscale Serve setting exists.'],
  ['ready', 'On', 'On, no phones yet. Sotto runs Tailscale Serve on 8443; its own listener stays on loopback.'],
  ['code', 'Code', 'Pair a phone: eight characters, works once, expires in five minutes.'],
  ['paired', 'Paired', 'One phone paired. It reads and replies; Can answer starts off (ADR-0004).'],
  ['tailscale', 'No Tailscale', 'Tailscale missing or signed out. The switch stays off, nothing was changed.'],
  ['port', 'Port used', 'Port 8443 already used by another Serve setting. Sotto leaves it alone.'],
]

/* ---------- render ---------- */
const params = new URLSearchParams(location.search)
const root = document.documentElement
VAR = VARIANTS[params.get('variant')] ? params.get('variant') : 'A'
ST = STATES.some(s => s[0] === params.get('state')) ? params.get('state') : 'paired'
root.dataset.theme = params.get('theme') === 'light' ? 'light' : 'dark'
let reduced = params.get('motion') === 'reduced'
if (params.get('chrome') === '0') document.getElementById('protobar').hidden = true
if (Number(params.get('zoom')) > 0) { root.style.setProperty('--dz', params.get('zoom')); root.style.setProperty('--z', params.get('zoom')) }
const cell = (html, label, note) => `<div class="cell"><div aria-label="${label}">${html}</div><div class="cap"><b>${label}</b><span>${note}</span></div></div>`
function renderDesktop() {
  const d = desktop()
  const win = document.getElementById('win')
  win.innerHTML = d.html
  win.setAttribute('aria-label', `Sotto desktop, Settings, ${VARIANTS[VAR].name}`)
  const sc = document.getElementById('scroll')
  sc.scrollTop = d.scrollEnd ? sc.scrollHeight : 0
  const st = STATES.find(s => s[0] === ST)
  document.getElementById('deskcap').innerHTML = `<b>Desktop · ${st[1]}</b><span>${st[2]}</span>`
  tick()
}
function render() {
  const v = VARIANTS[VAR]
  document.getElementById('head').innerHTML = `<p class="kicker">PROTOTYPE · Phone access · ${Object.keys(VARIANTS).indexOf(VAR) + 1} of 3</p><h1>${VAR} — ${v.name}</h1><p>${v.thesis}</p><p>${v.good}</p><p>${v.cost}</p>`
  renderDesktop()
  document.getElementById('phone-home').innerHTML = cell(home(false), 'iPhone · Needs you', 'Two computers paired: Laptop online with a permission and a question waiting, forge offline.')
  document.getElementById('phones').innerHTML = [
    cell(threadsScreen(), 'Threads', { A: 'By project, the computer on each project header.', B: 'By computer first, then project.', C: 'One merged list; filter by computer.' }[VAR]),
    cell(computersScreen(), 'Computers', { A: 'Rows with a status dot; Add computer last.', B: 'A card per computer with counts.', C: 'Add computer first, then each computer’s details.' }[VAR]),
    cell(PV[VAR].add(), 'Add computer', { A: 'Name and code on one screen.', B: 'The existing two steps; step 2, eight slots.', C: 'A sheet over Computers.' }[VAR]),
    cell(home(true), 'Needs you, can’t answer', 'Laptop hasn’t turned on Can answer for this iPhone yet.'),
  ].join('')
  document.getElementById('lab').textContent = `${VAR} — ${v.name}`
  document.getElementById('states').innerHTML = STATES.map(([id, label], i) => `<button type="button" data-state="${id}" aria-pressed="${id === ST}" title="Key ${i + 1}">${label}</button>`).join('')
  document.getElementById('theme').textContent = root.dataset.theme === 'dark' ? 'Light' : 'Dark'
  document.getElementById('motion').textContent = reduced ? 'Motion on' : 'Reduce motion'
  root.classList.toggle('rm', reduced)
  const q = new URLSearchParams({ variant: VAR, state: ST })
  if (root.dataset.theme === 'light') q.set('theme', 'light')
  if (reduced) q.set('motion', 'reduced')
  if (params.get('chrome') === '0') q.set('chrome', '0')
  history.replaceState(null, '', '?' + q)
}
function setState(s) { ST = s; menuOpen = false; copied = false; canAnswer = false; if (s === 'code') deadline = Date.now() + 292000; render() }
function tick() {
  if (ST !== 'code') return
  const left = Math.max(0, deadline - Date.now())
  const m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60
  document.querySelectorAll('.js-count').forEach(e => { e.textContent = left ? `${m}:${String(s).padStart(2, '0')}` : 'now. Make a new code' })
  document.querySelectorAll('.js-bar').forEach(e => { e.style.width = `${(left / 300000) * 100}%` })
}
setInterval(tick, 1000)
if (ST === 'code') deadline = Date.now() + 292000

document.getElementById('win').addEventListener('click', e => {
  const a = e.target.closest('[data-act]')?.dataset.act
  if (!a) return
  if (a === 'phones') { ST = on() ? 'off' : 'ready'; canAnswer = false }
  else if (a === 'pair' || a === 'newcode') { ST = 'code'; deadline = Date.now() + 300000 }
  else if (a === 'close') ST = 'ready'
  else if (a === 'retry') ST = 'ready'
  else if (a === 'answer') canAnswer = !canAnswer
  else if (a === 'menu') menuOpen = !menuOpen
  else if (a === 'remove') { ST = 'ready'; menuOpen = false }
  else if (a === 'local') localOn = !localOn
  else if (a === 'expand') expanded = !expanded
  else if (a === 'copy') { copied = true; setTimeout(() => { copied = false; renderDesktop() }, 1500) }
  const focusAct = a
  render()
  document.querySelector(`#win [data-act="${focusAct}"]`)?.focus()
})
const keys = Object.keys(VARIANTS)
const step = d => { VAR = keys[(keys.indexOf(VAR) + d + keys.length) % keys.length]; menuOpen = false; render() }
document.getElementById('prev').onclick = () => step(-1)
document.getElementById('next').onclick = () => step(1)
document.getElementById('states').addEventListener('click', e => { const s = e.target.closest('[data-state]'); if (s) setState(s.dataset.state) })
document.getElementById('theme').onclick = () => { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; render() }
document.getElementById('motion').onclick = () => { reduced = !reduced; render() }
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select,[contenteditable]')) return
  if (e.key === 'Escape') { if (menuOpen) { menuOpen = false; render() } else if (ST === 'code') { ST = 'ready'; render() } }
  if (e.key === 'ArrowLeft' && !e.target.closest('[role=tablist]')) step(-1)
  if (e.key === 'ArrowRight' && !e.target.closest('[role=tablist]')) step(1)
  if (/^[1-6]$/.test(e.key)) setState(STATES[Number(e.key) - 1][0])
})
render()
</script>
</body>
</html>
