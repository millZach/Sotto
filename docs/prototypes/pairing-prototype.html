<!doctype html>

<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sotto · Pairing prototype</title>
<link rel="stylesheet" href="/src/renderer/src/styles/tokens.css">
<style>
@font-face{font-family:Figtree;src:url('/src/renderer/src/assets/fonts/figtree-latin.woff2') format('woff2');font-weight:300 900;font-display:swap}
*{box-sizing:border-box}body{margin:0;background:var(--tt-canvas);color:var(--tt-text);font:16px/1.5 Figtree,system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer;min-height:44px;padding:8px 18px;border-radius:8px;border:1px solid var(--tt-border);background:var(--tt-surface)}button:hover{background:var(--tt-surface-elevated)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--tt-focus-ring);outline-offset:3px}button.primary{color:var(--tt-accent-surface-text);background:var(--tt-accent-surface);border-color:var(--tt-accent-border);font-weight:600}button.quiet{border-color:transparent;background:transparent;color:var(--tt-text-muted)}button:disabled{cursor:default;color:var(--tt-text-muted)}.app{min-height:100dvh;display:grid;grid-template-columns:224px 1fr}.sidebar{background:var(--tt-sidebar);border-right:1px solid var(--tt-hairline);padding:18px 16px;display:flex;flex-direction:column;gap:28px}.brand{font-size:21px;font-weight:650;letter-spacing:-.7px;padding:0 12px}.sidebar nav{display:grid;gap:4px}.sidebar nav button{text-align:left;background:none;border:0;font-size:14px;color:var(--tt-text-muted)}.sidebar nav button[aria-current]{color:var(--tt-text);background:var(--tt-surface-elevated)}.sidebar small{margin-top:auto;padding:12px;color:var(--tt-text-muted);font-size:12px}.room{min-width:0;padding:68px clamp(28px,6vw,100px) 180px}.content{max-width:850px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:46px}h1{font-size:28px;line-height:1.2;letter-spacing:-.8px;margin:0;font-weight:600}h2{font-size:20px;font-weight:600;letter-spacing:-.3px;margin:0}p{margin:12px 0 24px;color:var(--tt-text-muted)}.host-row{display:flex;align-items:center;gap:16px;padding:26px 0;border-block:1px solid var(--tt-hairline)}.host-icon{height:44px;width:44px;display:grid;place-items:center;border-radius:10px;background:var(--tt-surface-elevated);color:var(--tt-accent-text);flex-shrink:0}.host-icon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5}.host-title{flex:1;min-width:0}.host-title strong{display:block;font-weight:600}.status{color:var(--tt-text-muted);font-size:14px}.pairing{padding:32px 0;max-width:580px;animation:arrive .22s ease-out}.code{font-size:32px;font-weight:600;letter-spacing:5px;font-variant-numeric:tabular-nums;padding:18px 0;color:var(--tt-text)}.code-label{font-size:14px;color:var(--tt-text-muted)}.authority{font-size:14px;margin:18px 0 26px;max-width:460px}.actions{display:flex;gap:10px;flex-wrap:wrap}.clients{padding-top:34px}.client{display:flex;gap:18px;align-items:center;border-bottom:1px solid var(--tt-hairline);padding:20px 0}.client .name{flex:1}.client small{display:block;color:var(--tt-text-muted);font-size:14px}.phone-top{display:none}.phone .sidebar{display:none}.phone .app{display:block}.phone .room{padding-top:56px}.phone .content{max-width:480px}.phone .top{margin-bottom:32px}.phone-top{font-size:18px;font-weight:600;letter-spacing:-.5px;margin-bottom:50px}.phone .phone-top{display:block}.phone .host-row{border:0;padding:0 0 24px}.phone .host-icon{height:52px;width:52px}.phone .pairing{padding:16px 0}.field{display:grid;gap:8px;margin:20px 0}.field label{font-size:14px}.field input{min-width:0;width:100%;height:52px;border:1px solid var(--tt-border);border-radius:8px;background:var(--tt-field);padding:8px 14px;text-transform:uppercase;font-size:22px;letter-spacing:3px}.feedback{color:var(--tt-text);padding:14px 16px;background:var(--tt-surface-elevated);border-left:2px solid var(--tt-accent);margin:20px 0}.prototype-bar{position:fixed;z-index:4;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);border:1px solid var(--tt-border);background:var(--tt-surface-overlay);border-radius:14px;padding:6px 8px;display:flex;gap:6px;align-items:center;box-shadow:0 8px 28px var(--tt-canvas)}.prototype-bar button{border:0;background:none;padding:6px 12px;white-space:nowrap;font-size:14px}.prototype-bar span{min-width:180px;text-align:center;font-size:14px}.prototype-tools{display:flex;justify-content:center;align-items:center;gap:12px;position:fixed;z-index:3;bottom:84px;left:50%;transform:translateX(-50%);background:var(--tt-canvas);padding:6px 10px;border-radius:9px;max-width:calc(100% - 24px)}.prototype-tools select{max-width:170px;background:var(--tt-surface);border:1px solid var(--tt-border);border-radius:6px;padding:7px;font-size:14px;min-height:44px}.prototype-tools button{font-size:14px;white-space:nowrap}.prototype-note{font-size:12px;color:var(--tt-text-muted)}dialog{border:1px solid var(--tt-border);border-radius:14px;background:var(--tt-surface);color:var(--tt-text);width:min(500px,calc(100% - 32px));padding:30px;max-height:calc(100dvh - 36px);overflow:auto}dialog::backdrop{background:color-mix(in srgb,var(--tt-canvas) 80%,transparent);backdrop-filter:blur(5px)}dialog h2{padding-right:32px}dialog .close{position:absolute;right:12px;top:12px;min-width:44px;padding:6px}.state{font-size:12px;color:var(--tt-text-muted);margin-top:36px}.phone .state{margin-top:22px}@keyframes arrive{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:850px){.sidebar{width:190px}.app{grid-template-columns:190px 1fr}.room{padding:40px 28px 180px}.top{margin-bottom:24px}}@media(max-width:620px){.sidebar{display:none}.app{display:block}.room,.phone .room{padding:30px 22px 185px}.phone-top{margin-bottom:35px}.host-row{align-items:flex-start}.host-row>button{padding-inline:12px}.prototype-bar span{min-width:165px;font-size:13px}.prototype-bar button{padding-inline:8px}.prototype-tools{gap:8px}.prototype-tools select{max-width:155px}.top{margin-bottom:30px}h1{font-size:26px}.actions button{flex:1}.clients{padding-top:20px}dialog{padding:24px}.code{font-size:28px}.phone .host-row>button{display:none}}
body{overflow:hidden}.app{height:calc(100dvh - 150px);min-height:0;overflow:hidden}.room{overflow:auto;padding-bottom:40px}.phone .room{height:100%}.field input::placeholder{color:var(--tt-text-faint)}@media(max-width:620px){.room{height:100%;padding-bottom:40px}}@media(max-height:650px){.sidebar{gap:12px;padding-top:12px}.sidebar nav{gap:0}.sidebar nav button{min-height:36px}.sidebar small{display:none}}</style></head><body>
<div class="app"><aside class="sidebar"><div class="brand">Sotto</div><nav aria-label="Settings"><button disabled>Dictation</button><button disabled>Transcription</button><button disabled>Cleanup</button><button disabled>Providers</button><button aria-current="page">Hosts</button><button disabled>Appearance</button><button disabled>Application</button></nav><small>Settings prototype</small></aside><main class="room"><div class="content"><div class="phone-top">Sotto</div><header class="top"><h1 id="heading">Hosts</h1></header><section class="host-row"><div class="host-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M6 6.5h2m-2 11h2m8-11h2m-2 11h2"/></svg></div><div class="host-title"><strong>Forge</strong><div class="status" id="status"></div></div><button id="connect" class="primary">Pair this laptop</button></section><div id="flow"></div><div class="state" id="state" aria-live="polite"></div></div></main></div>
<div class="prototype-tools" aria-label="Prototype controls"><select id="scenario" aria-label="Preview state"><option value="start">First connection</option><option value="paired">Paired clients</option><option value="expired">Expired code</option><option value="refused">Expired session</option></select><button id="theme">Light</button></div><div class="prototype-bar" aria-label="Prototype variants"><button id="previous" aria-label="Previous variant">←</button><span id="variant-label"></span><button id="next" aria-label="Next variant">→</button></div>
<dialog id="dialog" aria-labelledby="dialog-title"><button class="close quiet" aria-label="Close dialog">×</button><div id="dialog-content"></div></dialog>
<script>
const variants=['A','B','C']; const names={A:'A · Confirm after SSH',B:'B · Code from Forge',C:'C · iOS app'};
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!variants.includes(variant))variant='A';
let scenario='start',paired=false,codeExpired=false;const $=id=>document.getElementById(id),dialog=$('dialog');
const authority='<p class="authority">Pairing identifies this client. Permission requests still need your answer, and policy records decide whether this client may grant them.</p>';
function codeForm(){return (variant==='C'?'':'<h2 id="dialog-title">Pair with Forge</h2>')+'<p>Read the pairing code on Forge and enter it here.</p><div class="field"><label for="pair-code">Pairing code</label><input id="pair-code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="ABCD EFGH"></div>'+ (codeExpired?'<div class="feedback" role="alert">This code has expired. Make a new pairing code on Forge and enter it here.</div>':'')+authority+'<div class="actions"><button class="primary" id="redeem">Pair '+(variant==='C'?'this iPhone':'this laptop')+'</button></div><p class="prototype-note">Prototype code: 7K4M 9R2X</p>';}
function pair(){paired=true;scenario='paired';$('scenario').value=scenario;dialog.close();render();$('forget')?.focus();}
function wireForm(){const input=$('pair-code');$('redeem')?.addEventListener('click',()=>{if(input.value.replace(/\s/g,'').toUpperCase()!=='7K4M9R2X'||codeExpired){let alert=document.querySelector('.feedback');if(!alert){alert=document.createElement('div');alert.className='feedback';alert.setAttribute('role','alert');input.closest('.field').after(alert);}alert.textContent='This code is not valid any more. Make a new pairing code on Forge and enter it here.';input.focus();return;}pair();});input?.addEventListener('keydown',e=>{if(e.key==='Enter')$('redeem').click();});}
function openPair(){if(variant==='A'){pair();return;} $('dialog-content').innerHTML=codeForm();dialog.showModal();wireForm();$('pair-code').focus();}
function render(){document.body.classList.toggle('phone',variant==='C');$('variant-label').textContent=names[variant];$('heading').textContent=variant==='C'?'Connect to Forge':'Hosts';$('status').textContent=paired?'Connected':variant==='C'?'Host on your private network':'SSH connected · zach@forge';$('connect').hidden=paired||variant==='A'||variant==='C';$('connect').textContent='Enter pairing code';let content='';if(paired){content='<section class="clients"><h2>Paired clients</h2><div class="client"><div class="name">'+(variant==='C'?'Zach’s iPhone':'Zach’s laptop')+'<small>This client · paired just now</small></div><button id="forget">Forget</button></div><p>Threads stay on Forge when a client disconnects.</p></section>';}else if(scenario==='refused'){content='<section class="pairing"><h2>Connect again</h2><div class="feedback" role="alert">This client’s session has expired. Your threads are still on Forge. Reconnect to continue.</div><button class="primary" id="reconnect">Reconnect</button></section>';}else if(variant==='A'){content='<section class="pairing"><h2>Pair this laptop</h2><p>SSH has connected to Forge. Confirm this laptop as a client.</p><div class="code-label">Pairing code from this connection</div><div class="code">7K4M 9R2X</div>'+(codeExpired?'<div class="feedback" role="alert">This code has expired. Request a new one to pair this laptop.</div>':'')+authority+'<div class="actions"><button class="primary" id="confirm">'+(codeExpired?'Request new code':'Pair this laptop')+'</button><button class="quiet" id="cancel">Cancel</button></div></section>';}else if(variant==='C'){content='<section class="pairing">'+codeForm()+'</section>';}else{content='<section class="pairing"><p>Use a code from Forge to identify this laptop.</p>'+ (codeExpired?'<div class="feedback">The last pairing code expired. Make a new code on Forge.</div>':'')+'</section>';}
$('flow').innerHTML=content;$('state').textContent='Prototype · '+(paired?'Paired':'Unpaired')+' · '+(variant==='C'?'iOS app connection':'SSH connection')+' · No policy grant';
$('confirm')?.addEventListener('click',()=>{if(codeExpired){codeExpired=false;scenario='start';$('scenario').value='start';render();$('confirm').focus();}else pair();});$('cancel')?.addEventListener('click',()=>{$('flow').innerHTML='<p>Pairing cancelled. No client was added.</p>';$('status').textContent='Disconnected';$('state').textContent='Prototype · Disconnected · Unpaired · No policy grant';});$('reconnect')?.addEventListener('click',()=>{scenario='start';$('scenario').value=scenario;codeExpired=false;render();});$('forget')?.addEventListener('click',()=>{$('dialog-content').innerHTML='<h2 id="dialog-title">Forget this client?</h2><p>It will lose access to Forge. Threads and their history stay on the host.</p><div class="actions"><button id="confirm-forget" class="primary">Forget client</button><button id="keep-client">Keep client</button></div>';dialog.showModal();$('keep-client').focus();$('keep-client').onclick=()=>dialog.close();$('confirm-forget').onclick=()=>{paired=false;scenario='start';$('scenario').value=scenario;dialog.close();render();};});if(variant==='C'&&!paired&&scenario!=='refused')wireForm();}
function switchVariant(direction){variant=variants[(variants.indexOf(variant)+direction+variants.length)%variants.length];const url=new URL(location);url.searchParams.set('variant',variant);history.replaceState(null,'',url);dialog.close();render();}
$('previous').onclick=()=>switchVariant(-1);$('next').onclick=()=>switchVariant(1);document.addEventListener('keydown',e=>{if(dialog.open||e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();switchVariant(e.key==='ArrowRight'?1:-1);}});$('theme').onclick=()=>{const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';$('theme').textContent=light?'Dark':'Light';};$('scenario').onchange=e=>{scenario=e.target.value;paired=scenario==='paired';codeExpired=scenario==='expired';dialog.close();render();};$('connect').onclick=openPair;dialog.querySelector('.close').onclick=()=>dialog.close();render();
</script></body></html>
