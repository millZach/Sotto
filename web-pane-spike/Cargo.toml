[package]
name = "web-pane-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Throwaway spike for issue #2690: Chromium (CEF) as a component for Sotto's web panes"

[[bin]]
name = "webpane"
path = "src/main.rs"

[dependencies]
cef = { version = "=156.7.0", default-features = false, features = ["accelerated_osr", "sandbox"] }
wgpu = "30"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
debug = false
