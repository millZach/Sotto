[package]
name = "web-pane-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Throwaway spike for issue #2690: Chromium (CEF) as a component for Sotto's web panes"

[[bin]]
name = "webpane"
path = "src/main.rs"

[dependencies]
cef = { version = "=156.7.0", default-features = false, features = ["accelerated_osr", "sandbox"] }
wgpu = "30"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_System_IO", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder", "NSView", "NSWindow"] }
mach2 = "0.4"

[profile.release]
debug = false
