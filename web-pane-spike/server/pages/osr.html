<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Off-screen probes</title>
<style>
 body { font: 16px sans-serif; margin: 0; }
 #sel { position: absolute; left: 20px; top: 20px; width: 200px; font-size: 16px; }
 #link { position: absolute; left: 260px; top: 20px; }
 #text { position: absolute; left: 20px; top: 80px; width: 300px; height: 40px; font-size: 16px; }
 #drag { position: absolute; left: 20px; top: 160px; width: 120px; height: 60px; background: #8ac; }
 #drop { position: absolute; left: 300px; top: 160px; width: 160px; height: 100px; background: #ca8; }
 #file { position: absolute; left: 20px; top: 300px; }
 #press { position: absolute; left: 20px; top: 360px; width: 200px; height: 50px; }
</style></head>
<body>
<h1 style="position:absolute;left:20px;top:420px;font-size:20px">Off-screen probes</h1>
<select id="sel" aria-label="Fruit"><option>Apple</option><option>Banana</option><option>Cherry</option></select>
<a id="link" href="#nowhere">A link</a>
<textarea id="text" aria-label="Composition field"></textarea>
<div id="drag" draggable="true">Drag me</div>
<div id="drop" aria-label="Drop zone">Drop here</div>
<input id="file" type="file" aria-label="Pick a file">
<button id="press">Press me</button>
<script>
window.log = [];
const rec = (type, extra) => window.log.push(Object.assign({ type }, extra || {}));
const sel = document.getElementById('sel'), text = document.getElementById('text');
sel.addEventListener('change', () => rec('select change', { value: sel.value }));
for (const t of ['compositionstart', 'compositionupdate', 'compositionend']) text.addEventListener(t, e => rec(t, { data: e.data }));
text.addEventListener('input', e => rec('input', { value: text.value, composing: e.isComposing }));
document.getElementById('drag').addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', 'from the page'); rec('dragstart'); });
const drop = document.getElementById('drop');
drop.addEventListener('dragover', e => e.preventDefault());
drop.addEventListener('drop', e => { e.preventDefault(); rec('drop', { text: e.dataTransfer.getData('text/plain'), files: e.dataTransfer.files.length }); });
document.getElementById('file').addEventListener('change', e => rec('file change', { names: [...e.target.files].map(f => f.name) }));
document.addEventListener('contextmenu', () => rec('contextmenu'));
</script>
</body></html>
