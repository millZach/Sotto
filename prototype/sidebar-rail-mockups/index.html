:root {
  color-scheme: dark;
  --tt-canvas: oklch(0.1818 0.002 106.6);
  --tt-sidebar: oklch(0.2268 0 0);
  --tt-raised: oklch(0.2568 0 0);
  --tt-text: oklch(0.95 0.035 96.3);
  --tt-text-muted: oklch(0.6165 0.021 96.6);
  --tt-hairline: oklch(0.3518 0 0);
  --tt-hover: oklch(0.2618 0 0);
  --tt-selected: oklch(0.3218 0.02 96.5);
  --tt-focus: oklch(0.8612 0.1705 96.5);
  --tt-accent: oklch(0.8612 0.1705 96.5);
  --tt-activity: var(--tt-accent);
  --tt-attention: oklch(0.7724 0.1728 65.4);
  --tt-success: oklch(0.79 0.13 165);
}
* { box-sizing: border-box; }
body { margin: 0; padding: 28px 32px 32px; background: oklch(0.14 0.002 106.6); color: var(--tt-text); font: 13px/1.35 Figtree, system-ui, sans-serif; }
h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
.legend { display: flex; gap: 18px; align-items: center; margin: 0 0 22px; color: var(--tt-text-muted); font-size: 12px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.cols { display: flex; gap: 22px; align-items: flex-start; }
.col { flex: none; width: 196px; }
.col.wide { width: 380px; }
.col header { height: 128px; }
.col h2 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
.col h2 b { display: inline-grid; place-items: center; width: 20px; height: 20px; margin-right: 6px; border-radius: 6px; background: var(--tt-accent); color: oklch(0.222 0.035 329); font-size: 12px; }
.col.today h2 b { background: var(--tt-hairline); color: var(--tt-text); }
.col p { margin: 0; color: var(--tt-text-muted); font-size: 11.5px; line-height: 1.4; }
.stage { display: flex; height: 900px; border: 1px solid var(--tt-hairline); border-radius: 10px; overflow: hidden; background: var(--tt-canvas); }
.pane { flex: 1; position: relative; background: var(--tt-canvas); }
.pane::before { content: ''; position: absolute; inset: 52px 14px auto; height: 8px; border-radius: 4px; background: var(--tt-hover); box-shadow: 0 18px 0 var(--tt-hover), 0 36px 0 var(--tt-hover); width: 60%; }

/* The rail, as SidebarFrame draws it on macOS: 44px for the window buttons, Expand, the list, the foot. */
.rail { flex: none; position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 44px; background: var(--tt-sidebar); border-right: 1px solid var(--tt-hairline); }
.lights { position: absolute; top: 15px; left: 10px; display: flex; gap: 5px; }
.lights i { width: 9px; height: 9px; border-radius: 50%; background: oklch(0.4 0 0); }
.act { display: grid; place-items: center; width: 32px; height: 30px; border-radius: 7px; color: var(--tt-text-muted); }
.act svg { width: 16px; height: 16px; }
.list { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 4px 0; overflow: hidden; }
.foot { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0 0 8px; }
.foot .rule { width: 100%; height: 1px; margin: 0 0 6px; background: var(--tt-hairline); }
.rule { width: 70%; height: 1px; background: var(--tt-hairline); flex: none; }
svg.i { fill: none; stroke: currentcolor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.mark { width: 14px; height: 14px; fill: none; stroke: currentcolor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
svg.owl { fill: currentcolor; }
svg.owl .pupil { fill: currentcolor; }

/* The status ring a row and its tile share (thread-nav__ring), plus Delegating. */
.ring { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--tt-hairline); flex: none; position: relative; }
.ring[data-s='working'] { border: 0; background: conic-gradient(var(--tt-activity) 0 32%, color-mix(in srgb, var(--tt-activity) 22%, transparent) 32% 100%); mask: radial-gradient(circle, transparent 38%, #000 42%); animation: spin 1.5s linear infinite; }
.ring[data-s='needs'] { border: 2px solid var(--tt-attention); }
.ring[data-s='fresh'] { border-color: var(--tt-success); background: radial-gradient(circle, var(--tt-success) 0 28%, transparent 30%); }
.ring[data-s='deleg'] { border-color: var(--tt-activity); }
.ring[data-s='deleg']::after { content: ''; position: absolute; right: -4px; top: -4px; width: 5px; height: 5px; border-radius: 50%; background: var(--tt-activity); box-shadow: 0 0 0 1.5px var(--tt-sidebar); }
@keyframes spin { to { transform: rotate(1turn); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

/* Shared tile */
.tile { position: relative; flex: none; display: grid; place-items: center; width: 32px; height: 34px; border: 1px solid var(--tt-hairline); border-radius: 7px; font-size: 14px; color: var(--tt-text); }
.tile[data-sel] { background: var(--tt-selected); border-color: var(--tt-focus); }
.tile > .ring { position: absolute; right: -1px; bottom: -1px; background-color: var(--tt-sidebar); }
.tile > .ring[data-s='working'] { background-color: transparent; }

/* 1 Monograms */
.v1 .tile { font-size: 12.5px; font-weight: 600; letter-spacing: -0.01em; border-left: 3px solid var(--p); padding-left: 1px; }
.v1 .owl-tile { color: var(--tt-text); background: var(--tt-raised); border-left-width: 1px; }

/* 2 Project stacks */
.v2 .proj { flex: none; display: grid; place-items: center; width: 44px; height: 20px; margin-top: 4px; border-radius: 6px; font-size: 11px; font-weight: 700; color: var(--p); background: color-mix(in srgb, var(--p) 18%, transparent); }
.v2 .tile { width: 30px; height: 30px; color: var(--p); background: color-mix(in srgb, var(--p) 9%, transparent); border-color: color-mix(in srgb, var(--p) 35%, transparent); }
.v2 .tile[data-sel] { background: var(--tt-selected); border-color: var(--tt-focus); color: var(--tt-text); }
.v2 .anchor { position: relative; display: grid; place-items: center; width: 44px; height: 40px; margin-bottom: 4px; border-radius: 10px; background: var(--tt-raised); border: 1px solid var(--tt-hairline); }
.v2 .anchor .ring, .v8 .anchor .ring { position: absolute; right: -2px; bottom: -2px; }

/* 3 Needs-you tray */
.v3 .tray { flex: none; display: flex; flex-direction: column; align-items: center; gap: 7px; width: 46px; padding: 7px 0 8px; border-radius: 12px; background: color-mix(in srgb, var(--tt-attention) 13%, transparent); border: 1px solid color-mix(in srgb, var(--tt-attention) 38%, transparent); }
.v3 .tray .head { display: flex; align-items: center; gap: 3px; color: var(--tt-attention); font-size: 11px; font-weight: 700; }
.v3 .tile { font-size: 12.5px; font-weight: 600; }
.v3 .tray .tile { border-color: color-mix(in srgb, var(--tt-attention) 55%, transparent); }
.v3 .small { width: 26px; height: 26px; font-size: 11px; font-weight: 500; opacity: .62; border-radius: 6px; }

/* 4 Short titles */
.v4 .row { position: relative; flex: none; display: flex; align-items: center; gap: 5px; width: 86px; min-height: 38px; padding: 4px 6px 4px 7px; border-radius: 7px; border-left: 3px solid var(--p); background: color-mix(in srgb, var(--tt-hover) 60%, transparent); }
.v4 .row[data-sel] { background: var(--tt-selected); box-shadow: inset 0 0 0 1px var(--tt-focus); }
.v4 .row .t { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 11px; line-height: 1.25; }
.v4 .row[data-s='done'] .t { color: var(--tt-text-muted); }
.v4 .row .ring { align-self: flex-start; margin-top: 2px; }
.v4 .watch { gap: 3px; border-left-color: var(--tt-text-muted); font-weight: 600; }
.v4 .gap { height: 2px; flex: none; }

/* 5 By state */
.v5 .band { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.v5 .bh { display: grid; place-items: center; width: 18px; height: 14px; color: var(--tt-text-muted); }
.v5 .bh .ring { width: 8px; height: 8px; }
.v5 .tile { font-size: 13px; font-weight: 600; }
.v5 .band.done .tile { width: 26px; height: 24px; font-size: 11px; font-weight: 500; color: var(--tt-text-muted); border-color: transparent; background: var(--tt-hover); }
.v5 .seg { display: flex; flex-direction: column; gap: 2px; padding: 3px; border-radius: 9px; background: var(--tt-canvas); margin-bottom: 4px; }
.v5 .seg div { display: grid; place-items: center; width: 30px; height: 28px; border-radius: 7px; color: var(--tt-text-muted); }
.v5 .seg div[data-on] { background: var(--tt-selected); color: var(--tt-text); }
.v5 .seg svg { width: 16px; height: 16px; }

/* 6 Vertical tabs */
.v6 { gap: 0; }
.v6 .list { gap: 4px; align-items: stretch; padding-left: 8px; }
.v6 .vtab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 9px 0 10px; border: 1px solid var(--tt-hairline); border-right: 0; border-radius: 8px 0 0 8px; color: var(--tt-text-muted); }
.v6 .vtab[data-sel] { background: var(--tt-canvas); color: var(--tt-text); border-color: var(--tt-focus); margin-right: -1px; }
.v6 .vtab .t { writing-mode: vertical-rl; transform: rotate(180deg); max-height: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; }
.v6 .vtab[data-s='needs'] { box-shadow: inset 3px 0 0 var(--tt-attention); color: var(--tt-text); }
.v6 .vtab .ring { margin-top: 1px; }
.v6 .more { display: grid; place-items: center; height: 26px; margin-top: 2px; border-radius: 8px 0 0 8px; background: var(--tt-hover); color: var(--tt-text-muted); font-size: 11px; font-weight: 600; }

/* 7 Provider faces, watched spine */
.v7 .list { gap: 9px; position: relative; overflow: visible; }
.v7 .face { position: relative; flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; color: var(--p); background: color-mix(in srgb, var(--p) 20%, var(--tt-sidebar)); }
.v7 .face svg.mark { width: 15px; height: 15px; }
.v7 .face::before { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid transparent; }
.v7 .face[data-s='needs']::before { border-color: var(--tt-attention); }
.v7 .face[data-s='working']::before { border-color: var(--tt-activity) transparent transparent transparent; animation: spin 1.2s linear infinite; }
.v7 .face[data-s='deleg']::before { border-color: var(--tt-activity); border-style: dotted; }
.v7 .face[data-s='fresh']::before { border-color: var(--tt-success); }
.v7 .face[data-sel] { box-shadow: 0 0 0 1.5px var(--tt-sidebar), 0 0 0 7px var(--tt-selected); }
.v7 .face .sub { position: absolute; right: -6px; bottom: -6px; display: grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; background: var(--tt-raised); border: 1.5px solid var(--tt-sidebar); color: var(--tt-activity); }
.v7 .face .sub svg { width: 10px; height: 10px; }
.v7 .face[data-s='done'] { opacity: .7; }
.v7 .face[data-w]::after { content: ''; position: absolute; left: -12px; top: 50%; width: 7px; height: 2px; background: var(--tt-text-muted); }
.v7 .spine { position: absolute; left: 6px; width: 2px; border-radius: 1px; background: var(--tt-text-muted); opacity: .55; }
.v7 .owlface { position: relative; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--tt-raised); color: var(--tt-text); }

/* 8 Thread colours */
.v8 .tile { font-size: 13px; font-weight: 700; color: oklch(0.86 0.1 var(--h)); background: oklch(0.34 0.07 var(--h)); border-color: transparent; }
.v8 .tile[data-sel] { box-shadow: 0 0 0 2px var(--tt-sidebar), 0 0 0 3.5px var(--tt-focus); }
.v8 .tile[data-s='done'] { background: oklch(0.28 0.04 var(--h)); color: oklch(0.72 0.06 var(--h)); }
.v8 .flag { position: absolute; top: -1px; right: -1px; width: 12px; height: 12px; background: var(--tt-attention); clip-path: polygon(0 0, 100% 0, 100% 100%); border-top-right-radius: 7px; }
.v8 .bar { position: absolute; left: 4px; right: 4px; bottom: -5px; height: 2px; border-radius: 1px; background: linear-gradient(90deg, transparent, var(--tt-activity), transparent); background-size: 200% 100%; animation: slide 1.1s linear infinite; }
@keyframes slide { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.v8 .dot { position: absolute; right: -2px; bottom: -2px; width: 8px; height: 8px; border-radius: 50%; background: var(--tt-success); box-shadow: 0 0 0 2px var(--tt-sidebar); }
.v8 .out { position: absolute; right: -5px; top: -5px; display: grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; background: var(--tt-activity); color: oklch(0.222 0.035 329); box-shadow: 0 0 0 2px var(--tt-sidebar); }
.v8 .out svg { width: 9px; height: 9px; stroke-width: 3; }
.v8 .anchor { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; width: 44px; padding: 8px 0 7px; margin-bottom: 4px; border-radius: 10px; background: var(--tt-raised); }
.v8 .anchor .dots { display: flex; gap: 2px; }
.v8 .anchor .dots i { width: 5px; height: 5px; border-radius: 50%; background: oklch(0.7 0.12 var(--h)); }

/* 9 Numbered by recency, hover peek */
.v9 .tile { font-size: 13px; font-weight: 600; opacity: var(--o); }
.v9 .tile sup { position: absolute; left: 3px; top: 1px; font-size: 8.5px; font-weight: 600; color: var(--tt-text-muted); line-height: 1; }
.v9 .tile[data-hover] { background: var(--tt-hover); }
.peek { position: absolute; z-index: 2; width: 232px; padding: 11px 12px 12px; border-radius: 10px; background: var(--tt-raised); border: 1px solid var(--tt-hairline); box-shadow: 0 10px 30px oklch(0 0 0 / .45); }
.peek .tt { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
.peek .meta { display: flex; gap: 6px; align-items: center; color: var(--tt-text-muted); font-size: 11.5px; margin-bottom: 9px; }
.peek .meta i { width: 7px; height: 7px; border-radius: 2px; background: var(--p); }
.peek .st { display: flex; gap: 6px; align-items: center; color: var(--tt-attention); font-size: 12px; margin-bottom: 6px; }
.peek .last { color: var(--tt-text-muted); font-size: 11.5px; line-height: 1.4; }
.peek kbd { margin-left: auto; font: inherit; font-size: 10.5px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--tt-hairline); }

/* 10 Pixel identicons */
.v10 .tile { width: 34px; height: 34px; border-radius: 4px; background: oklch(0.2 0 0); border-color: oklch(0.3 0 0); }
.v10 .tile[data-sel] { background: var(--tt-selected); border-color: var(--tt-focus); }
.v10 svg.px { width: 20px; height: 20px; shape-rendering: crispEdges; }
.v10 .tile[data-s='done'] svg.px { opacity: .55; }
.v10 .corner { position: absolute; right: -3px; bottom: -3px; width: 8px; height: 8px; box-shadow: 0 0 0 2px var(--tt-sidebar); }
.v10 .corner[data-s='needs'] { background: var(--tt-attention); animation: blink 1s steps(2) infinite; }
.v10 .corner[data-s='fresh'] { background: var(--tt-success); }
.v10 .tile[data-s='working'] { border: 2px dashed var(--tt-activity); }
.v10 .corner[data-s='deleg'] { width: 10px; height: 10px; background: var(--tt-activity); clip-path: polygon(0 40%, 50% 40%, 50% 0, 100% 50%, 50% 100%, 50% 60%, 0 60%); box-shadow: none; }
@keyframes blink { 50% { opacity: .25; } }
.v10 .owlpx { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 4px; background: var(--tt-raised); }
.v10 .owlpx svg { width: 24px; height: 24px; shape-rendering: crispEdges; }
</style>
</head>

<h1>Collapsed Threads rail: ten directions</h1>
<div class="legend" id="legend"></div>
<div class="cols" id="cols"></div>
<script>
const P = {
  so: { name: 'Sotto', code: 'So', c: 'oklch(0.76 0.11 190)' },
  si: { name: 'Site', code: 'Si', c: 'oklch(0.74 0.12 255)' },
  le: { name: 'Ledger', code: 'Le', c: 'oklch(0.74 0.14 320)' },
}
// Twelve threads, in today's rail order (open folders' rows): U d B F N | I R F P | T A S.
const T = [
  { t: 'Update banner timing', m: 'Ub', p: 'so', v: 'codex', s: 'done', ago: 95, h: 30 },
  { t: 'dictation hotkey drift', m: 'Dh', p: 'so', v: 'claude', s: 'needs', ago: 3, h: 60, why: 'Asks to run npm run typecheck', last: 'The drift comes from the second keydown after resume.' },
  { t: 'Branch picker search', m: 'Bp', p: 'so', v: 'claude', s: 'working', ago: 0, h: 95, sel: true },
  { t: 'Fast mode toggle', m: 'Fm', p: 'so', v: 'claude', s: 'deleg', ago: 6, h: 130, to: 'muse' },
  { t: 'Needs-you queue order', m: 'Nq', p: 'so', v: 'codex', s: 'fresh', ago: 12, h: 165 },
  { t: 'Image compression', m: 'Ic', p: 'si', v: 'codex', s: 'working', ago: 1, h: 200 },
  { t: 'RSS feed dates', m: 'Rf', p: 'si', v: 'grok', s: 'done', ago: 180, h: 235 },
  { t: 'Font loading flash', m: 'Fl', p: 'si', v: 'claude', s: 'done', ago: 300, h: 270 },
  { t: 'Pricing page copy', m: 'Pp', p: 'si', v: 'devin', s: 'done', ago: 600, h: 305 },
  { t: 'Tab bar icons', m: 'Tb', p: 'le', v: 'claude', s: 'done', ago: 240, h: 340 },
  { t: 'Auth token refresh', m: 'At', p: 'le', v: 'codex', s: 'needs', ago: 8, h: 10, why: 'Asks which refresh window to use' },
  { t: 'Sync conflict on resume', m: 'Sc', p: 'le', v: 'grok', s: 'done', ago: 1440, h: 285 },
]
const watched = ['Branch picker search', 'Fast mode toggle', 'Image compression', 'Auth token refresh']
const LABEL = { working: 'Working', needs: 'Needs you', deleg: 'Delegating', fresh: 'Just finished', done: 'Done' }

const I = {
  open: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M14 9l3 3-3 3"/>',
  usage: '<path d="M3 3v16a2 2 0 0 0 2 2h16M18 17V9M13 17V5M8 17v-3"/>',
  settings: '<path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',
  refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M8 16H3v5"/>',
  help: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/>',
  mic: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3ZM19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/>',
  msgs: '<path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2zM18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/>',
  out: '<path d="M7 17 17 7M8 7h9v9"/>',
}
const icon = (n, size = 16) => `<svg class="i" viewBox="0 0 24 24" width="${size}" height="${size}">${I[n]}</svg>`
// Stand-in provider marks (the app has the real logos).
const M = {
  claude: '<path d="M8 1.5v13M1.5 8h13M3.4 3.4l9.2 9.2M12.6 3.4l-9.2 9.2"/>',
  codex: '<path d="M8 1.5l5.6 3.25v6.5L8 14.5l-5.6-3.25v-6.5z"/>',
  grok: '<circle cx="8" cy="8" r="6"/><path d="M3.5 12.5l9-9"/>',
  devin: '<path d="M8 1.5L14.5 8 8 14.5 1.5 8z"/>',
  muse: '<path d="M8 1.5c.6 3.6 2.9 5.9 6.5 6.5-3.6.6-5.9 2.9-6.5 6.5-.6-3.6-2.9-5.9-6.5-6.5 3.6-.6 5.9-2.9 6.5-6.5z" fill="currentColor" stroke="none"/>',
}
const mark = v => `<svg class="mark" viewBox="0 0 16 16">${M[v]}</svg>`
const OWL_BODY = 'M1.27 4.8C0.84 3.93 0.73 2.31 1.49 1.22C1.63 0.95 1.93 0.68 2.06 1.22C2.12 2.03 2.71 2.9 3.93 2.9C5.830 2.2 10.17 1.76 12.94 3.34C13.69 3.28 14.4 2.71 14.45 1.82C14.51 1.57 14.73 1.57 14.83 1.98C15.32 2.58 15.54 4.26 14.94 5.56C15.38 6.1 15.7 7.46 15.7 9.63C15.76 12.12 15.29 13.37 13.97 14.24C12.75 15.19 10.17 15.24 8 15.24C5.8 15.24 3.23 15.19 2.01 14.24C0.68 13.37 0.22 12.12 0.27 9.63C0.24 7.19 0.52 5.83 1.27 4.8Z'
const OWL_EYES = 'M1.84 8.95C1.82 7.05 2.25 6.07 3.66 6.07C5.34 6.02 6.75 6.21 6.73 8.54C6.73 10.44 6.1 11.31 4.34 11.31C2.58 11.34 1.82 10.58 1.84 8.95ZM9.33 9.22C9.33 8.14 9.63 7.67 10.44 7.46L13.1 6.92C13.8 6.78 14.13 7.46 14.13 8.81C14.16 10.71 13.69 11.34 11.66 11.34C10.17 11.34 9.33 10.71 9.33 9.22Z'
const owl = (s = 16) => `<svg class="owl" viewBox="0 0 16 16" width="${s}" height="${s}"><path fill-rule="evenodd" d="${OWL_BODY}${OWL_EYES}"/><circle class="pupil" cx="5.29" cy="8.22" r="1.19"/><circle class="pupil" cx="10.79" cy="8.87" r="1.19"/></svg>`
const ring = s => `<span class="ring" data-s="${s}"></span>`
const pv = th => `--p:${P[th.p].c}`
const sel = th => th.sel ? ' data-sel' : ''
const tip = th => `title="${th.t} · ${LABEL[th.s]}"`
const railTop = () => `<div class="lights"><i></i><i></i><i></i></div><div class="act">${icon('open')}</div>`
const foot = (extra = '') => `<div class="foot">${extra}<div class="rule"></div>${['usage', 'settings', 'refresh', 'help'].map(n => `<div class="act">${icon(n)}</div>`).join('')}</div>`
const rail = (cls, w, list, footExtra = '', afterTop = '') => `<aside class="rail ${cls}" style="width:${w}px">${railTop()}${afterTop}<div class="list">${list}</div>${foot(footExtra)}</aside>`
const byState = s => T.filter(th => th.s === s)

const V = [
  { n: 'Today', w: 52, why: 'One letter per thread and a tiny ring. U d B F N I R F P T A S: no Watcher, no way to tell threads apart.',
    html: () => rail('v0', 52, T.map(th => `<div class="tile"${sel(th)} ${tip(th)}>${th.t[0]}${ring(th.s)}</div>`).join('')) },
  { n: 'Monograms', w: 56, why: 'Owl pinned under Expand opens Watcher. Two-letter marks and a project stripe tell Bp from Fm. Today\'s rings stay; a satellite dot marks Delegating.',
    html: () => rail('v1', 56, T.map(th => `<div class="tile" style="${pv(th)}"${sel(th)} ${tip(th)}>${th.m}${ring(th.s)}</div>`).join(''), '',
      `<div class="tile owl-tile" title="Watcher · Working">${owl(18)}${ring('working')}</div><div class="rule"></div>`) },
  { n: 'Project stacks', w: 64, why: 'Two tiers: a project chip, then its threads as provider marks in the project\'s colour. Watcher anchors the bottom, above the foot. Rings as today.',
    html: () => rail('v2', 64, Object.keys(P).map(k => `<div class="proj" style="--p:${P[k].c}">${P[k].code}</div>` + T.filter(th => th.p === k).map(th => `<div class="tile" style="${pv(th)}"${sel(th)} ${tip(th)}>${mark(th.v)}${ring(th.s)}</div>`).join('')).join(''),
      `<div class="anchor" title="Watcher · Working">${owl(20)}${ring('working')}</div>`) },
  { n: 'Needs-you tray', w: 60, why: 'Watcher\'s owl heads a tray of what waits on you; press it for Watcher. Then what\'s running, then everything done, small and dim. Position says state before the ring does.',
    html: () => rail('v3', 60,
      `<div class="tray"><div class="head" title="Watcher · 2 waiting on you">${owl(15)}2</div>${byState('needs').map(th => `<div class="tile" ${tip(th)}>${th.m}${ring('needs')}</div>`).join('')}</div>`
      + T.filter(th => ['working', 'deleg', 'fresh'].includes(th.s)).map(th => `<div class="tile"${sel(th)} ${tip(th)}>${th.m}${ring(th.s)}</div>`).join('')
      + '<div class="rule"></div>' + byState('done').map(th => `<div class="tile small" ${tip(th)}>${th.m}</div>`).join('')) },
  { n: 'Short titles', w: 96, why: 'Mid-width: two lines of the title beat any mark. Project stripe on the left, ring on the right. Watcher is the first row. Done titles dim.',
    html: () => rail('v4', 96, `<div class="row watch">${owl(15)}<span class="t">Watcher</span>${ring('working')}</div><div class="gap"></div>`
      + Object.keys(P).map(k => T.filter(th => th.p === k).map(th => `<div class="row" data-s="${th.s}" style="${pv(th)}"${sel(th)}><span class="t">${th.t}</span>${th.s === 'done' ? '' : ring(th.s)}</div>`).join('')).join('<div class="gap"></div>')) },
  { n: 'By state', w: 56, why: 'Bands: needs you, running, done (small, grey). The band is the state; the tile only names. Watcher returns by restoring the room switch, upright, in the foot.',
    html: () => rail('v5', 56,
      `<div class="band"><div class="bh">${ring('needs')}</div>${byState('needs').map(th => `<div class="tile" ${tip(th)}>${th.m}</div>`).join('')}</div><div class="rule"></div>`
      + `<div class="band"><div class="bh">${ring('working')}</div>${T.filter(th => ['working', 'deleg'].includes(th.s)).map(th => `<div class="tile"${sel(th)} ${tip(th)}>${th.m}${th.s === 'deleg' ? ring('deleg') : ''}</div>`).join('')}</div><div class="rule"></div>`
      + `<div class="band done">${T.filter(th => ['fresh', 'done'].includes(th.s)).map(th => `<div class="tile" ${tip(th)}>${th.m}${th.s === 'fresh' ? ring('fresh') : ''}</div>`).join('')}</div>`,
      `<div class="seg"><div>${icon('mic')}</div><div data-on>${icon('msgs')}</div><div>${owl(16)}</div></div>`) },
  { n: 'Vertical tabs', w: 56, why: 'A tab strip: Watcher is the first tab, open threads read sideways, the current one joins the page. Done threads fold into +7. An amber edge marks needs you.',
    html: () => rail('v6', 56, `<div class="vtab" title="Watcher">${owl(15)}<span class="t">Watcher</span></div>`
      + T.filter(th => th.s !== 'done').map(th => `<div class="vtab" data-s="${th.s}"${sel(th)}>${ring(th.s)}<span class="t">${th.t}</span></div>`).join('')
      + `<div class="more" title="7 done threads">+${byState('done').length}</div>`) },
  { n: 'Faces and a spine', w: 56, why: 'Round faces: provider mark on the project\'s colour. Watcher\'s owl tops a spine that ties the threads it watches. The ring goes around the face; a delegate rides on its parent.',
    html: () => {
      const faces = T.map(th => `<div class="face" data-s="${th.s}" style="${pv(th)}"${sel(th)}${watched.includes(th.t) ? ' data-w' : ''} ${tip(th)}>${mark(th.v)}${th.to ? `<span class="sub">${mark(th.to)}</span>` : ''}</div>`).join('')
      return rail('v7', 56, faces, '', `<div class="owlface" title="Watcher · watching 4">${owl(20)}</div>`).replace('<div class="list">', '<div class="list"><span class="spine" style="top:-27px;height:457px"></span>')
    } },
  { n: 'A colour per thread', w: 60, why: 'Each thread keeps one hue everywhere (rail, pane, notices): "the violet one". Corner flag = needs you, sweeping bar = running. Watcher anchors the bottom with dots for what it watches.',
    html: () => rail('v8', 60, T.map(th => `<div class="tile" data-s="${th.s}" style="--h:${th.h}"${sel(th)} ${tip(th)}>${th.t[0].toUpperCase()}${th.s === 'needs' ? '<span class="flag"></span>' : ''}${th.s === 'working' ? '<span class="bar"></span>' : ''}${th.s === 'fresh' ? '<span class="dot"></span>' : ''}${th.s === 'deleg' ? `<span class="out">${icon('out', 9)}</span>` : ''}</div>`).join(''),
      `<div class="anchor" title="Watcher · watching 4">${owl(20)}<div class="dots">${T.filter(th => watched.includes(th.t)).map(th => `<i style="--h:${th.h}"></i>`).join('')}</div></div>`) },
  { n: 'Recency and a peek', w: 56, wide: true, why: 'Newest first, older fade; ⌘1–9 jump, Watcher is ⌘0 at the top. Resting on a tile peeks: title, project, provider, what it waits for. Rings as today.',
    html: () => {
      const sorted = [...T].sort((a, b) => a.ago - b.ago)
      const tiles = sorted.map((th, i) => `<div class="tile" style="--o:${Math.max(0.42, 1 - i * 0.06)}"${sel(th)}${th.t === 'dictation hotkey drift' ? ' data-hover' : ''} ${tip(th)}>${i < 9 ? `<sup>${i + 1}</sup>` : ''}${th.m}${ring(th.s)}</div>`).join('')
      const d = T[1]
      return rail('v9', 56, tiles, '', `<div class="tile" style="--o:1" title="Watcher ⌘0"><sup>0</sup>${owl(17)}</div><div class="rule"></div>`)
        + `<div class="peek" style="left:66px;top:222px;${pv(d)}"><div class="tt">${d.t}</div><div class="meta"><i></i>${P[d.p].name} · Claude · 3 min<kbd>⌘3</kbd></div><div class="st">${ring('needs')}${d.why}</div><div class="last">${d.last}</div></div>`
    } },
  { n: 'Pixel identicons', w: 60, why: 'A crisp 5×5 identicon per thread in its project\'s colour; the pixel owl pinned on top is Watcher. Marching border = running, blinking block = needs you, arrow = delegating.',
    html: () => rail('v10', 60, T.map(th => `<div class="tile" data-s="${th.s}"${sel(th)} ${tip(th)}>${identicon(th)}${th.s !== 'done' && th.s !== 'working' ? `<span class="corner" data-s="${th.s}"></span>` : ''}</div>`).join(''), '',
      `<div class="owlpx" title="Watcher">${pixelOwl()}</div><div class="rule"></div>`) },
]

function hash(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0 }
function identicon(th) {
  const h = hash(th.t); let r = ''
  for (let y = 0; y < 5; y++) for (let x = 0; x < 3; x++) if ((h >> (y * 3 + x)) & 1) { r += `<rect x="${x}" y="${y}" width="1" height="1"/>`; if (x < 2) r += `<rect x="${4 - x}" y="${y}" width="1" height="1"/>` }
  return `<svg class="px" viewBox="0 0 5 5" fill="${P[th.p].c}">${r}</svg>`
}
function pixelOwl() {
  const g = ['X........X', 'XX......XX', 'XXXXXXXXXX', 'XX..XX..XX', 'XX.oXX.oXX', 'XXXXXXXXXX', 'XXXXbbXXXX', '.XXXXXXXX.', '.XXXXXXXX.', '..X....X..']
  let r = ''
  g.forEach((row, y) => [...row].forEach((c, x) => {
    if (c === 'X') r += `<rect x="${x}" y="${y}" width="1" height="1" fill="var(--tt-text)"/>`
    if (c === 'o') r += `<rect x="${x}" y="${y}" width="1" height="1" fill="var(--tt-accent)"/>`
    if (c === 'b') r += `<rect x="${x}" y="${y}" width="1" height="1" fill="var(--tt-attention)"/>`
  }))
  return `<svg viewBox="0 0 10 10">${r}</svg>`
}

document.getElementById('legend').innerHTML = ['working', 'needs', 'deleg', 'fresh', 'done'].map(s => `<span>${ring(s)}${LABEL[s]}${s === 'deleg' ? ' (new)' : ''}</span>`).join('')
  + `<span style="margin-left:auto">12 threads in Sotto, Site and Ledger · Citrine dark · macOS inset</span>`
const range = location.hash.slice(1).split('-').map(Number)
const show = i => !location.hash || (i >= range[0] && i <= (range[1] ?? range[0]))
document.getElementById('cols').innerHTML = V.map((v, i) => show(i) ? `<section class="col${i === 0 ? ' today' : ''}${v.wide ? ' wide' : ''}"><header><h2><b>${i === 0 ? '·' : i}</b>${v.n}</h2><p>${v.why}</p></header><div class="stage" style="position:relative">${v.html()}<div class="pane"></div></div></section>` : '').join('')
</script>
